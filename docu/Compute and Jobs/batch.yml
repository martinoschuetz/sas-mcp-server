              schema:
                $ref: "#/components/schemas/jobStdioOutput"
              examples:
                job:
                  $ref: "#/components/examples/jobStdioOutput"
            application/json:
              schema:
                $ref: "#/components/schemas/jobStdioOutput"
              examples:
                job:
                  $ref: "#/components/examples/jobStdioOutput"
        "400":
          $ref: "#/components/responses/jobNotOutputtingResponse"
        "404":
          $ref: "#/components/responses/jobNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
        "409":
          $ref: "#/components/responses/jobNotRunningResponse"
  /jobs/{jobId}/state:
    head:
      summary: Verify that a job state exists
      description: Determines whether a specific job state exists.
      operationId: headersForJobState
      tags:
      - Jobs
      parameters:
      - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: The request succeeded.
        "404":
          description: The requested resource does not exist.
        "406":
          description: The content media types are unacceptable.
    get:
      summary: Get the state of a job
      description: "Gets the plain text version of the specified job's state. The\
        \ returned text is one of the following values: 'pending', 'running', 'completed',\
        \ 'failed', 'unknown'."
      operationId: getJobState
      tags:
      - Jobs
      parameters:
      - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: The request succeeded.
          content:
            text/plain:
              schema:
                type: string
                enum: [pending, running, completed, failed, unknown]
              example: completed
        "404":
          $ref: "#/components/responses/jobNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    put:
      summary: Change the state of a job
      description: Changes the state of a specified job. The only state currently
        allowed is 'canceled'.
      operationId: updateJobState
      tags:
      - Jobs
      parameters:
      - $ref: "#/components/parameters/jobId"
      - $ref: "#/components/parameters/jobState"
      responses:
        "200":
          description: The request succeeded.
        "400":
          $ref: "#/components/responses/jobStateValueMissingInvalidResponse"
        "404":
          $ref: "#/components/responses/jobNotFoundResponse"
  /servers:
