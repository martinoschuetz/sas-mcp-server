components:
  headers:
    ETag:
      description: A tag that identifies this revision of the resource.
      schema:
        type: string
      example: W/"1655120228210222000"
    Last-Modified:
      description: The last `modifiedTimeStamp` of the resource.
      schema:
        type: string
      example: Tue, 14 Jun 2022 15:00:46 GMT
    Location:
      description: Actual location of resource.
      schema:
        type: string
  parameters:
    collectionFilter:
      name: filter
      in: query
      description: Specifies the filter criteria for returned items.
      schema:
        type: string
        format: filter-criteria
    collectionLimit:
      name: limit
      in: query
      description: Limits the maximum number of resource items to return. The default
        value is "10".
      schema:
        type: integer
    collectionSortBy:
      name: sortBy
      in: query
      description: Sorts returned items by the specified criteria.
      schema:
        type: string
        format: sort-criteria
    collectionStart:
      name: start
      in: query
      description: Returns the offset of the first resource item to return. The default
        value is "0".
      schema:
        type: integer
    contextId:
      name: contextId
      in: path
      description: The ID of the context.
      required: true
      schema:
        type: string
    contextName:
      name: name
      in: query
      description: The name of the context.
      required: true
      schema:
        type: string
    fileName:
      name: fileName
      in: path
      description: The name of the file.
      required: true
      schema:
        type: string
    fileSet:
      name: fileSet
      in: path
      description: The ID of the file set.
      required: true
      schema:
        type: string
    fileSetId:
      name: fileSetId
      in: path
      description: The ID of the file set.
      required: true
      schema:
        type: string
    jobId:
      name: jobId
      in: path
      description: The ID of the job.
      required: true
      schema:
        type: string
    jobState:
      name: value
      in: query
      description: The name of the state to set the job.
      required: true
      schema:
        type: string
        enum: [canceled]
    serverId:
      name: serverId
      in: path
      description: The ID of the reusable Batch server.
      required: true
      schema:
        type: string
  schemas:
    context:
      title: Batch Context
      description: Provides information about the Launcher context and other processing
        information that is used by the Batch service.
      type: object
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          description:
            type: string
            description: Specifies the description of the Batch context.
            maxLength: 1000
            example: Context for High Priority Jobs
          id:
            type: string
            description: Specifies the ID of the context assigned by the Batch service.
            example: e086b29a-2d19-4b97-a912-ee15951e1549
          isMultiServer:
            type: boolean
            description: Flag indicating that this context is for a reusable Batch
              server. Allowed in version 3 and later of the context.
            example: true
          launcherContextId:
            type: string
            description: Specifies the ID of the launcher context to use. Required
              if launcherContextName is not provided.
            example: 9087b3f5-aced-4aa0-a491-b9d33ce197c2
          links:
            type: array
            readOnly: true
            description: Specifies links that apply to the context.
            items:
              $ref: "#/components/schemas/link"
          maxServers:
            type: integer
            format: uint64
            description: If this is a reusable Batch server, this is the maximum number
              of servers allowed to run. Allowed in version 3 and later of the context.
            example: 5
            minimum: 0
          minServers:
            type: integer
            format: uint64
            description: If this is a reusable Batch server, this is the minimum number
              of servers always running. Allowed in version 3 and later of the context.
            example: 2
            minimum: 0
          name:
            type: string
            description: Specifies the name of the Batch context.
            maxLength: 100
            example: HighPriority
          providerOptions:
            type: string
            description: Specifies options to pass to SAS Workload Orchestrator. Currently
              there are no options that can be set.
            maxLength: 1000
            example: option1=17
          queueName:
            type: string
            description: Specifies the name of the SAS Workload Orchestrator queue
              to use if SAS Workload Management is part of the deployment.
            maxLength: 250
            example: High Priority
          runServerAs:
            type: string
            description: Specifies the service-account user name to use when working
              with file sets and processing jobs. Allowed in version 2 and higher
              of the context.
            maxLength: 250
            example: serviceAcctUser
          requiredResources:
            type: string
            description: Specifies SAS Workload Orchestrator tags that identify on
              which hosts this job can run if SAS Workload Management is part of the
              deployment.
            maxLength: 500
            example: gpuRequired
          sasOptions:
            type: string
            description: Specifies the SAS options to use on the SAS command line.
            maxLength: 1000
            example: "-memsize 0"
          serverTimeout:
            type: integer
            format: uint64
            description: If this is a reusable Batch server, this value is the number
              of seconds that the server waits for a job before terminating. The default
              is 300 seconds. Allowed in version 3 and later of the context.
            example: 900
          version:
            type: integer
            format: int32
            readOnly: true
            description: Specifies the version number of this representation schema.
              This is version 1.
            minimum: 1
            maximum: 3
    contextCollection:
      title: Batch Context Collection
      description: Provides an array of context-information objects that satisfies
        the context-collection request.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array of Context objects.
            items:
              $ref: "#/components/schemas/context"
    contextRequest:
      title: Batch Context Request
      description: Provides information to create a Batch context.
      type: object
      anyOf:
      - required: ["launcherContextId", "launcherContextName"]
      required:
      - name
      properties:
        description:
          type: string
          description: Specifies the description of the Batch context.
          maxLength: 1000
          example: Context for High Priority Jobs
        launcherContextId:
          type: string
          description: Specifies the ID of the launcher context to use. Required if
            launcherContextName is not provided.
          example: 9087b3f5-aced-4aa0-a491-b9d33ce197c2
        launcherContextName:
          type: string
          description: Specifies the name of the launcher context to use.
          example: Batch Launcher Context for High Priority Jobs
        name:
          type: string
          description: Specifies the name of the Batch context.
          maxLength: 100
          example: HighPriority
        queueName:
          type: string
          description: Specifies the name of the SAS Workload Orchestrator queue to
            use if SAS Workload Management is part of the deployment.
          maxLength: 250
          example: High Priority
        requiredResources:
          type: string
          description: Specifies SAS Workload Orchestrator tags that identify on which
            hosts this job can run if SAS Workload Management is part of the deployment.
          maxLength: 500
          example: gpuRequired
        sasOptions:
          type: string
          description: Specifies the SAS options to use on the SAS command line.
          maxLength: 1000
          example: "-memsize 0"
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 1.
          minimum: 1
          maximum: 3
    contextMultipartFormData:
      title: Batch Context Import Create Request
      description: Provides information to create a Batch context through the transfer
        service.
      type: object
      properties:
        TransferDescriptor.json:
          type: object
          properties:
            version:
              description: Transfer Descriptor version
              type: integer
            name:
              description: Name of transfer descriptor
              type: string
            type:
              description: Type of object as registered in types service
              type: string
            properties:
              description: Array of properties mapped to their value
              type: object
              properties:
                name:
                  description: Test Batch Create Context
                  type: string
                description:
                  description: Description of Batch context
                  type: string
                launcherContextName:
                  description: Name of launcher service context to use
                  type: string
                launcherContextID:
                  description: ID of launcher service context to use
                  type: string
                queueName:
                  description: Name of the SAS Workload Orchestrator queue to use
                  type: string
                providerOptions:
                  description: Options to pass to the grid provider
                  type: string
                requiredResources:
                  description: Specifies SAS Workload Orchestrator tags that identify
                    on which hosts this job can run if SAS Workload Management is
                    part of the deployment.
                  type: string
                sasOptions:
                  description: SAS options to use
                  type: string
            links:
              description: Specifies links that apply to the context.
              type: array
              items:
                $ref: "#/components/schemas/link"
    fileSet:
      title: File Set
      description: Provides information about a file set that contains files sent
        to and from the cluster.
      type: object
      required:
      - contextId
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          contextId:
            type: string
            description: Specifies the context ID that is associated with the file
              set.
            example: 16c332b2-4ac6-483b-85f6-7bb9d2d5a576
          id:
            type: string
            readOnly: true
            description: Specifies the ID of the file set assigned by the Batch service.
            example: JOB_20220606_182805_634_1
          links:
            type: array
            readOnly: true
            description: Specifies links that apply to the file set.
            items:
