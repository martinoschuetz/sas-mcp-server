    job:
      title: Batch Job
      description: Provides information about a Batch job.
      type: object
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - properties:
          contextId:
            type: string
            readOnly: true
            description: Specifies the context ID that is associated with the job.
            example: 16c332b2-4ac6-483b-85f6-7bb9d2d5a576
          endedTimeStamp:
            type: string
            format: date-time
            readOnly: true
            description: If present, it specifies the timestamp when the job ended.
            example: 2022-06-01T13:55:32Z
          executionHost:
            type: string
            description: If the job is running, this is the name of the host on which
              the job is being processed.
            example: myhost01.mycompany.com
          fileSetId:
            type: string
            description: Specifies the ID of the file set to use for transporting
              files to and from the job.
            example: JOB_20220606_182805_634_1
          id:
            type: string
            description: Specifies the ID of the job assigned by the Batch service.
            example: 16a46fa5-f866-488d-9cec-92e226bfcf5
          links:
            type: array
            description: Specifies links that apply to the job.
            items:
              $ref: "#/components/schemas/link"
          name:
            type: string
            description: The name of the job
            example: Monthly Status Report for New York
          port:
            type: integer
            description: If the job is running, this is the port on which the job
              can be contacted by the Batch service to get the STDOUT information.
            example: 23645
          processId:
            type: string
            description: The operating system process ID of the job process.
            example: "5"
          workloadJobId:
            type: string
            description: If SAS Workload Management is in the deployment, this is
              the SAS Workload Orchestrator job ID.
            example: "1375"
          returnCode:
            type: integer
            description: If the job has finished, this is the return code from the
              process.
            example: 2
          state:
            type: string
            description: The processing state of the Batch job.
            example: failed
            enum:
            - pending
            - running
            - completed
            - failed
            - unknown
          startedTimeStamp:
            type: string
            format: date-time
            readOnly: true
            description: If present, it specifies the timestamp when the job was started.
            example: 2022-06-01T13:45:32Z
          submittedTimeStamp:
            type: string
            format: date-time
            readOnly: true
            description: Specifies the timestamp when the job was submitted.
            example: 2022-06-01T13:44:32Z
          version:
            type: integer
            format: int32
            readOnly: true
            description: Specifies the version number of this representation schema.
              This is version 1.
            minimum: 1
            maximum: 1
    jobCollection:
      title: Batch Job Collection
      description: Provides an array of job-information objects that satisfies the
        job-collection request.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array of Job objects.
            items:
              $ref: "#/components/schemas/job"
    jobState:
      title: Batch Job State
      description: Provides information about a job's processing state.
      type: object
      properties:
        executionHost:
          type: string
          description: If the job is running, this is the name of the host on which
            the job is being processed.
          example: myhost01.mycompany.com
        port:
          type: integer
          description: If the job is running, this is the port on which the job can
            be contacted by the Batch service to get the STDOUT information.
          example: 27359
        state:
          type: string
          description: The processing state of the Batch job.
          example: running
          enum:
          - pending
          - running
          - completed
          - failed
          - unknown
        version:
          type: integer
          format: int32
          description: Specifies the version number of this representation schema.
            This is version 1.
          minimum: 1
          maximum: 1
    jobLauncherOptions:
      title: Job Launch Options
      description: Options that are passed on every job request that describe how
        to process the job.
      type: object
      required:
      - batchContextId
      properties:
        batchContextId:
          type: string
          description: The ID of the Batch context to use
          example: 123e4567-e89b-12d3-a456-426614174000
        jobName:
          type: string
          description: The name of the job
          maxLength: 100
          example: Monthly Status Report for New York
        requiredResources:
          type: string
          description: Tags that specify on which hosts this job can run.
          maxLength: 500
          example: gpuRequired
        workloadQueueName:
          type: string
          description: The name of the SAS Workload Orchestrator queue to use if SAS
            Workload Management is part of the deployment.
          maxLength: 250
          example: "Priority Queue"
    jobRequestBatchCommand:
      title: Batch Command Job Request
      description: Job request to run a command as a background task.
      type: object
      required:
      - command
      - fileSetId
      - launcherOptions
      - version
      properties:
        command:
          type: string
          description: Specifies the command and arguments to run in the Batch server.
          example: "/bin/bash -c 'python3 mtPythonPgm.py'"
        fileSetId:
          type: string
          description: Specifies the ID of the file set to use for transporting files
            to and from the job.
          example: JOB_20220606_182805_634_1
        launcherOptions:
          $ref: "#/components/schemas/jobLauncherOptions"
        logFile:
          type: string
          description: >
            Specifies the file name and, optionally, the path to use for the output
            log file.
            If the specified name is a full path, the user must be able to access
            the existing directory or be able to create the directory path in the
            Batch server pod.
            If the specified path is only a file name and the outputDir option is
            specified, the log file is placed in the specified output directory.
            If the specified path is only a file name and the outputDir option is
            not specified, the log file is placed in the file set.
            The file name can use the following replaceable parameters in the file
            name or path:
            <UL>
            <LI>@STARTTIME@ - the start time of the Batch job in YYYY-MM-DD-hh-mm-ss
            format.
            <LI>@FILESETID@ - the file set ID.
            <LI>@SASPGMNAME@ - the base name of the SAS program.
            </UL>
            Available in version 2 and higher.
          maxLength: 1000
          example: "/my/path/in/my/batch/server/pod/@FILESETID@/myLog-@STARTTIME@.log"
        outputDir:
          type: string
          description: >
            Specifies a directory in the server that is used to store job output.
            The default is to upload the files to the file set.
            The user must be able to either access the existing directory or create
            the directory path in the Batch server pod.
            The directory name can use the following replaceable parameters in the
            name or path:
            <UL>
            <LI>@STARTTIME@ - the start time of the Batch job in YYYY-MM-DD-hh-mm-ss
            format.
            <LI>@FILESETID@ - the file set ID.
            <LI>@SASPGMNAME@ - the base name of the SAS program.
            </UL>
            Available in version 2 and higher.
          maxLength: 1000
          example: "/my/path/in/my/batch/server/pod/@FILESETID@"
        watchOutput:
          type: boolean
          description: Specifies whether the STDOUT of the Batch job is available
            for retrieval through the REST API.
          example: false
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 1.
          minimum: 1
          maximum: 2
    jobRequestBatchSas:
      title: Batch SAS Job Request
      description: Job request to run a SAS program as a background task.
      type: object
      required:
      - fileSetId
      - launcherOptions
      - sasProgramName
      - version
      properties:
        fileSetId:
          type: string
          description: Specifies the ID of the file set to use for transporting files
            to and from the job.
          example: JOB_20220606_182805_634_1
        launcherOptions:
          $ref: "#/components/schemas/jobLauncherOptions"
        restartType:
          type: string
          description: Specifies whether the job can be restarted and the type of
            restart. 'job' indicates that the job is restarted and no checkpoint restart
            is done. 'label' indicates the job is restarted using SAS Label Checkpoint
            restart. 'none' indicates the job cannot be restarted. 'step' indicates
            the job is restarted using SAS Data Step Checkpoint restart.
          example: job
          enum:
          - job
          - label
          - none
          - step
        listFile:
          type: string
          description: >
            Specifies the file name and, optionally, the path to use for the output
            SAS list file.
            If the specified name is a full path, the user must be able to access
            the existing directory or be able to create the directory path in the
            Batch server pod.
            If the specified path is only a file name and the outputDir option is
            specified, the SAS list file is placed in the specified output directory.
            If the specified path is only a file name and the outputDir option is
            not specified, the SAS list file is placed in the file set.
            The file name can use the following replaceable parameters in the file
            name or path:
            <UL>
            <LI>@STARTTIME@ - the start time of the Batch job in YYYY-MM-DD-hh-mm-ss
            format.
            <LI>@FILESETID@ - the file set ID.
            <LI>@SASPGMNAME@ - the base name of the SAS program.
            </UL>
            Available in version 2 and higher.
          maxLength: 1000
          example: "/my/path/in/my/batch/server/pod/@FILESETID@/mySASPgm-@STARTTIME@.lst"
        logFile:
          type: string
          description: >
            Specifies the file name and, optionally, the path to use for the output
            SAS log file.
            If the specified name is a full path, the user must be able to access
            the existing directory or be able to create the directory path in the
            Batch server pod.
            If the specified path is only a file name and the outputDir option is
            specified, the SAS log file is placed in the specified output directory.
            If the specified path is only a file name and the outputDir option is
            not specified, the SAS log file is placed in the file set.
            The file name can use the following replaceable parameters in the file
            name or path:
            <UL>
            <LI>@STARTTIME@ - the start time of the Batch job in YYYY-MM-DD-hh-mm-ss
            format.
            <LI>@FILESETID@ - the file set ID.
            <LI>@SASPGMNAME@ - the base name of the SAS program.
            </UL>
            Available in version 2 and higher.
          maxLength: 1000
          example: "/my/path/in/my/batch/server/pod/@FILESETID@/mySASPgm-@STARTTIME@.log"
        outputDir:
          type: string
          description: >
            Specifies a directory in the server that is used to store job output.
            The default is to upload the files to the file set.
            The user must be able to either access the existing directory or create
            the directory path in the Batch server pod.
            The directory name can use the following replaceable parameters in the
            name or path:
            <UL>
            <LI>@STARTTIME@ - the start time of the Batch job in YYYY-MM-DD-hh-mm-ss
            format.
            <LI>@FILESETID@ - the file set ID.
            <LI>@SASPGMNAME@ - the base name of the SAS program.
            </UL>
            Available in version 2 and higher.
          maxLength: 1000
          example: "/my/path/in/my/batch/server/pod/@FILESETID@"
        sasProgramName:
          type: string
          description: Specifies the file name of the program to process.
          example: "myTestProgram.sas"
        sasOptions:
          type: string
          description: Specifies the SAS options to use on the SAS command line.
          maxLength: 1000
          example: "-memsize 2048"
        watchOutput:
          type: boolean
          description: Specifies whether the STDOUT of the Batch job is available
            for retrieval through the REST API.
          example: true
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 2.
          minimum: 1
          maximum: 2
    jobRequestInteractiveCommand:
      title: Interactive Command Job Request
      description: Job request to run a command with user interaction.
      type: object
      required:
      - command
      - launcherOptions
      - version
      properties:
        command:
          type: string
          description: Specifies the command and arguments to run in the Batch server.
          example: "/bin/bash -c 'ls -al /opt/sas/viya'"
        launcherOptions:
