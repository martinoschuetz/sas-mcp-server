              schema:
                $ref: "#/components/schemas/jobState"
              examples:
                job:
                  $ref: "#/components/examples/jobState"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                job:
                  $ref: "#/components/examples/job"
