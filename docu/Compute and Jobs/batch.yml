---
#
# Low-level edit performed on 1-31-2023 by Karen Mobley.
# If editing for external publication, these items need to be done:
# - Capitalize “batch” consistently.
# - Hyphenate multi-noun phrases which modify another noun.
#
openapi: 3.0.3
info:
  title: Batch
  version: "4"
  description: >
    The Batch API provides a full suite of capabilities for Batch job execution, control,
    and management,
    including robust file handling and job monitoring.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/batch
  description: kubernetes mock server
tags:
- name: Root
  description: Contains the operations for the root resource of the Batch API.
- name: Contexts
  description: Contains the operations to create SAS Batch Server definitions.
- name: File Sets
  description: Contains the operations to access information for file sets and files.
- name: Jobs
  description: Contains the operations for SAS Batch Server instances.
- name: Servers
  description: Contains the operations for SAS Reusable Batch Server instances.
paths:
  /:
    get:
      summary: Get API resource links
      description: Returns a list of links to the top-level resources in this API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/apiInfoResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/apiInfoResponse"
    head:
      summary: Check service availability
      description: Checks the availability of the service.
      operationId: headersForRoot
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
  /contexts:
    get:
      summary: Get a collection of contexts
      description: Returns a collection of context information based on the specified
        query parameters.
      operationId: getContexts
      tags:
      - Contexts
      parameters:
      - $ref: "#/components/parameters/collectionStart"
      - $ref: "#/components/parameters/collectionLimit"
      - $ref: "#/components/parameters/collectionFilter"
      - $ref: "#/components/parameters/collectionSortBy"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/contextCollection"
              examples:
                contexts:
                  $ref: "#/components/examples/contextCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/contextCollection"
              examples:
                contexts:
                  $ref: "#/components/examples/contextCollection"
        "400":
          $ref: "#/components/responses/contextsQueryBadResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    head:
      summary: Check endpoint availability
      description: Determines whether an endpoint is currently available.
      operationId: headersForContexts
      tags:
      - Contexts
      parameters:
      - $ref: "#/components/parameters/collectionStart"
      - $ref: "#/components/parameters/collectionLimit"
      - $ref: "#/components/parameters/collectionFilter"
      - $ref: "#/components/parameters/collectionSortBy"
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: There are errors in the request.
        "406":
          description: The content media types are unacceptable.
    post:
      summary: Create a context
      description: Creates a context using the context request in the request body.
      operationId: createContext
      tags:
      - Contexts
      requestBody:
        required: true
        content:
          application/vnd.sas.batch.context.request+json;version=1:
            schema:
              $ref: "#/components/schemas/contextRequest"
            examples:
              contextRequest:
                $ref: "#/components/examples/contextRequest"
          application/vnd.sas.batch.context.request+json:
            schema:
              $ref: "#/components/schemas/contextRequest"
            examples:
              contextRequest:
                $ref: "#/components/examples/contextRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/contextMultipartFormData"
            examples:
              contextRequest:
                $ref: "#/components/examples/contextMultipartFormData"
          application/json:
            schema:
              $ref: "#/components/schemas/contextRequest"
            examples:
              contextRequest:
                $ref: "#/components/examples/contextRequest"
      responses:
        "201":
          description: The context was created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Location:
              description: Actual location of resource.
              schema:
                type: string
              example: /batch/contexts/6794ba8a-6aff-4989-ae77-93f67286aea2
          content:
            application/vnd.sas.batch.context+json;version=1:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
            application/vnd.sas.batch.context+json:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
            application/json:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
        "400":
          $ref: "#/components/responses/contextUpdateBadResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
        "409":
          $ref: "#/components/responses/contextNameExistsResponse"
  /contexts/{contextId}:
    get:
      summary: Get a context
      description: Returns the specified context's information.
      operationId: getContext
      tags:
      - Contexts
      parameters:
      - $ref: "#/components/parameters/contextId"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Location:
              description: Actual location of resource.
              schema:
                type: string
              example: /batch/contexts/6794ba8a-6aff-4989-ae77-93f67286aea2
          content:
            application/vnd.sas.batch.context+json;version=1:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
            application/vnd.sas.batch.context+json;version=2:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
            application/vnd.sas.batch.context+json;version=3:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
            application/vnd.sas.batch.context+json:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
            application/vnd.sas.transfer.object+json;version=1:
              schema:
                $ref: "#/components/schemas/transferObject"
              examples:
                context:
                  $ref: "#/components/examples/contextTransferObject"
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/transferObject"
              examples:
                context:
                  $ref: "#/components/examples/contextTransferObject"
            application/json:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
        "404":
          $ref: "#/components/responses/contextNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    head:
      summary: Verify that a context exists
      description: Determines whether a specific context exists. Returns headers for
        the specified context.
      operationId: headersForContext
      tags:
      - Contexts
      parameters:
      - $ref: "#/components/parameters/contextId"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Location:
              description: Actual location of resource.
              schema:
                type: string
              example: /batch/contexts/6794ba8a-6aff-4989-ae77-93f67286aea2
        "404":
          description: The requested resource does not exist.
        "406":
          description: The content media types are unacceptable.
    put:
      summary: Update a context
      description: Updates the specified context with the contents of the request
        body.
      operationId: updateContext
      tags:
      - Contexts
      parameters:
      - $ref: "#/components/parameters/contextId"
      - name: If-Match
        in: header
        description: The value of the 'ETag' header that was returned from a GET or
          previous PUT of this context. The request must include either the If-Unmodified-Since
          header or the If-Match header.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the 'Last-Modified' header that was returned from
          a GET or previous PUT of this context. The request must include either the
          If-Unmodified-Since header or the If-Match header.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/vnd.sas.batch.context+json;version=1:
            schema:
              $ref: "#/components/schemas/context"
            examples:
              context:
                $ref: "#/components/examples/context"
          application/vnd.sas.batch.context+json;version=2:
            schema:
              $ref: "#/components/schemas/context"
            examples:
              context:
                $ref: "#/components/examples/context"
          application/vnd.sas.batch.context+json;version=3:
            schema:
              $ref: "#/components/schemas/context"
            examples:
              context:
                $ref: "#/components/examples/context"
          application/vnd.sas.batch.context+json:
            schema:
              $ref: "#/components/schemas/context"
            examples:
              context:
                $ref: "#/components/examples/context"
          application/vnd.sas.transfer.object+json;version=1:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              context:
                $ref: "#/components/examples/contextTransferObject"
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              context:
                $ref: "#/components/examples/contextTransferObject"
          application/json:
            schema:
              $ref: "#/components/schemas/context"
            examples:
              context:
                $ref: "#/components/examples/context"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Location:
              description: Actual location of resource.
              schema:
                type: string
              example: /batch/contexts/6794ba8a-6aff-4989-ae77-93f67286aea2
          content:
            application/vnd.sas.batch.context+json;version=1:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
            application/vnd.sas.batch.context+json:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
            application/json:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
        "400":
          $ref: "#/components/responses/contextUpdateBadResponse"
        "404":
          $ref: "#/components/responses/contextNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
        "409":
          $ref: "#/components/responses/contextNameExistsResponse"
        "412":
          $ref: "#/components/responses/preconditionFailedResponse"
        "428":
          $ref: "#/components/responses/missingPreconditionResponse"
    delete:
      summary: Delete a context
      description: Deletes the specified context.
      operationId: deleteContext
      tags:
      - Contexts
      parameters:
      - $ref: "#/components/parameters/contextId"
      responses:
        "204":
          description: The request succeeded and no content was returned. This is
            returned whether the context actually existed or not.
  /contexts/@item:
    get:
      summary: Get a context by name
      description: Returns the specifically named context's information.
      operationId: getContextByName
      tags:
      - Contexts
      parameters:
      - $ref: "#/components/parameters/contextName"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Location:
              description: Actual location of resource.
              schema:
                type: string
              example: /batch/contexts/6794ba8a-6aff-4989-ae77-93f67286aea2
          content:
            application/vnd.sas.batch.context+json;version=1:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
            application/vnd.sas.batch.context+json:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
            application/json:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
        "400":
          $ref: "#/components/responses/contextQueryByNameBadResponse"
        "404":
          $ref: "#/components/responses/contextNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    head:
      summary: Verify that a context exists by name
      description: Determines whether a specificly named context exists and return
        headers for the context.
      operationId: headersForContextByName
      tags:
      - Contexts
      parameters:
      - $ref: "#/components/parameters/contextName"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          description: There are errors in the request.
        "404":
          description: The requested resource does not exist.
        "406":
          description: The content media types are unacceptable.
  /fileSets:
    head:
      summary: Check endpoint availability
      description: Determines whether an endpoint is currently available.
      operationId: headersForFileSets
      tags:
      - File Sets
      parameters:
      - $ref: "#/components/parameters/collectionStart"
      - $ref: "#/components/parameters/collectionLimit"
      - $ref: "#/components/parameters/collectionFilter"
      - $ref: "#/components/parameters/collectionSortBy"
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: There are errors in the request.
        "406":
          description: The content media types are unacceptable.
    get:
      summary: Get a collection of file sets
      description: Returns a collection of file-set objects that meet the specified
        query parameters.
      operationId: getFileSets
      tags:
      - File Sets
      parameters:
      - $ref: "#/components/parameters/collectionStart"
      - $ref: "#/components/parameters/collectionLimit"
      - $ref: "#/components/parameters/collectionFilter"
      - $ref: "#/components/parameters/collectionSortBy"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/fileSetCollection"
              examples:
                fileSets:
                  $ref: "#/components/examples/fileSetCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/fileSetCollection"
              examples:
                fileSets:
                  $ref: "#/components/examples/fileSetCollection"
        "400":
          $ref: "#/components/responses/fileSetsQueryBadResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    post:
      summary: Create a file set
      description: Creates a file set to hold files to transport to and from the cluster.
        The file set object that is passed in, requires only the context ID set.
      operationId: createFileSet
      tags:
      - File Sets
      requestBody:
        required: true
        content:
          application/vnd.sas.batch.file.set+json;version=1:
            schema:
              $ref: "#/components/schemas/fileSet"
            examples:
              fileSet:
                $ref: "#/components/examples/fileSet"
          application/vnd.sas.batch.file.set+json:
            schema:
              $ref: "#/components/schemas/fileSet"
            examples:
              fileSet:
                $ref: "#/components/examples/fileSet"
          application/json:
            schema:
              $ref: "#/components/schemas/fileSet"
            examples:
              fileSet:
                $ref: "#/components/examples/fileSet"
      responses:
        "201":
          description: The file set was created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Location:
              description: Actual location of resource.
              schema:
                type: string
              example: /batch/fileSets/JOB_20220614_150046_039_1
          content:
            application/vnd.sas.batch.file.set+json;version=1:
              schema:
                $ref: "#/components/schemas/fileSet"
              examples:
                fileSet:
                  $ref: "#/components/examples/fileSet"
            application/vnd.sas.batch.file.set+json:
              schema:
                $ref: "#/components/schemas/fileSet"
              examples:
                fileSet:
                  $ref: "#/components/examples/fileSet"
            application/json:
              schema:
                $ref: "#/components/schemas/fileSet"
              examples:
                fileSet:
                  $ref: "#/components/examples/fileSet"
        "400":
          $ref: "#/components/responses/fileSetCreateRequestBadResponse"
        "404":
          $ref: "#/components/responses/contextNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /fileSets/{fileSetId}:
    get:
      summary: Get a file set object
      description: Returns the information about the specified file set.
      operationId: getFileSet
      tags:
      - File Sets
      parameters:
      - $ref: "#/components/parameters/fileSetId"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Location:
              description: Actual location of resource.
              schema:
                type: string
              example: /batch/fileSets/JOB_20220614_150046_039_1
          content:
            application/vnd.sas.batch.file.set+json;version=1:
              schema:
                $ref: "#/components/schemas/fileSet"
              examples:
                fileSet:
                  $ref: "#/components/examples/fileSet"
            application/vnd.sas.batch.file.set+json:
              schema:
                $ref: "#/components/schemas/fileSet"
              examples:
                fileSet:
                  $ref: "#/components/examples/fileSet"
            application/json:
              schema:
                $ref: "#/components/schemas/fileSet"
              examples:
                fileSet:
                  $ref: "#/components/examples/fileSet"
        "404":
          $ref: "#/components/responses/fileSetNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    head:
      summary: Verify that a file set exists
      description: Determines whether a specified file set exists. Returns headers
        for the specified file set.
      operationId: headersForFileSet
      tags:
      - File Sets
      parameters:
      - $ref: "#/components/parameters/fileSetId"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Location:
              description: Actual location of resource.
              schema:
                type: string
              example: /batch/fileSets/JOB_20220614_150046_039_1
        "404":
          description: The requested resource does not exist.
        "406":
          description: The content media types are unacceptable.
    delete:
      summary: Delete a file set
      description: Deletes the specified file set and its contents.
      operationId: deleteFileSet
      tags:
      - File Sets
      parameters:
      - $ref: "#/components/parameters/fileSetId"
      responses:
        "204":
          description: The request succeeded and no content was returned. This is
            returned whether the file set actually existed or not.
        "409":
          $ref: "#/components/responses/fileSetNotDeletableResponse"
  /fileSets/{fileSetId}/files:
    head:
      summary: Check endpoint availability
      description: Determines whether an endpoint is currently available.
      operationId: headersForFileSetFiles
      tags:
      - File Sets
      parameters:
      - $ref: "#/components/parameters/fileSetId"
      responses:
        "200":
          description: The request succeeded.
        "404":
          description: The requested resource does not exist.
        "406":
          description: The content media types are unacceptable.
    get:
      summary: Get the contents of a file set
      description: Returns a collection of file-information objects representing all
        the files contained in the specified file set.
      operationId: getFileSetFiles
      tags:
      - File Sets
      parameters:
      - $ref: "#/components/parameters/fileSetId"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/fileSetFileCollection"
              examples:
                fileSetFiles:
                  $ref: "#/components/examples/fileSetFileCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/fileSetFileCollection"
              examples:
                fileSetFiles:
                  $ref: "#/components/examples/fileSetFileCollection"
        "404":
          $ref: "#/components/responses/fileSetNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /fileSets/{fileSetId}/files/{fileName}:
    head:
      summary: Verify that a file in a file set exists
      description: Determines whether a specified file in a specified file set exists.
        Returns headers for the specified file in the file set.
      operationId: headersForFileSetFile
      tags:
      - File Sets
      parameters:
      - $ref: "#/components/parameters/fileSetId"
      - $ref: "#/components/parameters/fileName"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
              example: W/"1655120228210222000"
            Last-Modified:
              description: The date when the resource was last modified.
              schema:
                type: string
              example: Tue, 14 Jun 2022 15:00:46 GMT
        "404":
          description: The requested resource does not exist.
        "406":
          description: The content media types are unacceptable.
    get:
      summary: Get the information about a file in a file set
      description: Gets the metadata attached to a file in a file set. application/octet-stream
        headers returns the information and content of the specified file from the
        specified file set. application/vnd.sas.batch.file.set.file+json and application/json
        returns information about the specified file from the specified file set
      operationId: getFileSetFile
      tags:
      - File Sets
      parameters:
      - $ref: "#/components/parameters/fileSetId"
      - $ref: "#/components/parameters/fileName"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
              example: W/"1655120228210222000"
            Last-Modified:
              description: The date when the resource was last modified.
              schema:
                type: string
              example: Tue, 14 Jun 2022 15:00:46 GMT
          content:
            application/vnd.sas.batch.file.set.file+json;version=1:
              schema:
                $ref: "#/components/schemas/fileSetFile"
              examples:
                fileSetFile:
                  $ref: "#/components/examples/fileSetFile"
            application/vnd.sas.batch.file.set.file+json:
              schema:
                $ref: "#/components/schemas/fileSetFile"
              examples:
                fileSetFile:
                  $ref: "#/components/examples/fileSetFile"
            application/octet-stream:
              schema:
                type: string
                format: binary
              example: |
                data _null_;
                  x = sleep(400, 1);
                run;
            application/json:
              schema:
                $ref: "#/components/schemas/fileSetFile"
              examples:
                fileSetFile:
                  $ref: "#/components/examples/fileSetFile"
        "304":
          $ref: "#/components/responses/Redirect304"
        "404":
          $ref: "#/components/responses/fileSetFileNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    put:
      summary: Set the contents of a file in a file set
      description: Creates or updates the contents of a specified file in the specified
        file set.
      operationId: updateFileSetFile
      tags:
      - File Sets
      parameters:
      - $ref: "#/components/parameters/fileSetId"
      - $ref: "#/components/parameters/fileName"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            example: |
              data _null_;
                x = sleep(400, 1);
              run;
      responses:
        "200":
          description: The request succeeded.
        "404":
          $ref: "#/components/responses/fileSetNotFoundResponse"
  /jobs:
    head:
      summary: Check endpoint availability
