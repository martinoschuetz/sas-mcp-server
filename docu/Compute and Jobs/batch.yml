    jobRequestInteractiveSas:
      title: Interactive SAS Job Request
      description: Job request to run SAS interactively in line mode.
      type: object
      required:
      - launcherOptions
      - version
      properties:
        launcherOptions:
          $ref: "#/components/schemas/jobLauncherOptions"
        sasOptions:
          type: string
          description: Specifies the SAS options to use on the SAS command line.
          maxLength: 1000
          example: "-memsize 2048"
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 1.
          minimum: 1
          maximum: 1
    jobStdioInput:
      title: Job STDIO Input
      description: Job STDIO input sent to a running job.
      type: object
      required:
      - input
      - version
      properties:
        input:
          description: Specifies the STDIN text lines to send to the running job.
          type: array
          items:
            type: string
          example: ["proc options option=SSLCALISTLOC; run;\n"]
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.  This
            is version 1.
          minimum: 1
          maximum: 1
    jobStdioOutput:
      title: Job STDIO Output
      description: Job STDIO output and error test.
      type: object
      required:
      - errors
      - output
      - version
      properties:
        errors:
          description: Specifies the STDERR text lines from the running job.
          type: array
          items:
            type: string
          example: ["This is an error message\n"]
        output:
          description: Specifies the STDOUT text lines from the running job.
          type: array
          items:
            type: string
          example: ["This is one line of output\n", "This is the next line of output\n"]
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 1.
          minimum: 1
          maximum: 1
    server:
      title: Reusable Batch Server
      description: Provides information about a reusable Batch server.
      type: object
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - properties:
          contextId:
            type: string
            readOnly: true
            description: Specifies the context ID that is associated with the reusable
              Batch server.
            example: 16c332b2-4ac6-483b-85f6-7bb9d2d5a576
          hostName:
            type: string
            readOnly: true
            description: The name of the host on which the reusable Batch server is
              running.
            example: myhost01.mycompany.com
          id:
            type: string
            readOnly: true
            description: Specifies the ID of the reusable Batch server assigned by
              the Batch service.
            example: 16a46fa5-f866-488d-9cec-92e226bfcf5
          isPermanent:
            type: boolean
            readOnly: true
            description: Flag indicating whether the reusable Batch server is a permanent
              server (no idle timeout) or a temporary server (with an idle timeout).
            example: true
          links:
            type: array
            description: Specifies links that apply to the reusable Batch server.
            items:
              $ref: "#/components/schemas/link"
          processId:
            type: string
            readOnly: true
            description: The launcher process ID of the reusable Batch server process.
            example: "5"
          queueName:
            type: string
            readOnly: true
            description: The name of the SAS Workload Orchestrator queue that was
              used when launching the reusable Batch server.
            maxLength: 250
            example: High Priority
          ruleId:
            type: string
            readOnly: true
            description: Specifies the authorization rule ID that is associated with
              the reusable Batch server.
            example: 16c332b2-4ac6-483b-85f6-7bb9d2d5a576
          runServerAs:
            type: string
            readOnly: true
            description: Specifies the user name under which the reusable Batch server
              is running.
            maxLength: 250
            example: myUserName
          state:
            type: string
            readOnly: true
            description: The processing state of the reusable Batch server.
            example: available
            enum:
            - startingForContext
            - startingForJob
            - available
            - availableButCounted
            - processing
            - awaitingDeletion
            - terminated
          version:
            type: integer
            format: int32
            readOnly: true
            description: Specifies the version number of this representation schema.
              This is version 1.
            minimum: 1
            maximum: 1
    serverCollection:
      title: Reusable Batch Server Collection
      description: Provides an array of reusable Batch server-information objects
        that satisfies the server-collection request.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array of Reusable Batch Server objects.
            items:
              $ref: "#/components/schemas/server"
    transferObject:
      title: Transfer Object
      description: Content providers implementing the Transfer Object Provider contract
        use this media type to store information about the content to be transfered.
      type: object
      properties:
        id:
          description: unique identifier of the object
          type: string
          format: object-id
        version:
          description: This media type's schema version number. This representation
            is version 1.
          type: integer
        summary:
          $ref: "#/components/schemas/summary"
        content:
          description: optional. Choose this or fileServiceContent. This is the content
            object that must be serialized in a format that is valid for internet
            transmission. This includes valid encoding formats like Base64 or data
            structures like JSON. This is provided by the content provider and the
            transfer service expects no visibility into or understanding of this value.
          type: string
        fileServiceContent:
          description: optional. Choose this or content. This holds the URI of a file
            service object that contains the transferrable object.
          type: string
        connectors:
          description: A list of associations or references to other external objects
            to recreate on import.
          type: array
          items:
            $ref: "#/components/schemas/transferObjectConnector"
        substitutions:
          description: Map with keys of parameter and value. Used to replace the value
            of parameter with the value of value.
          type: object
        links:
          description: Paging links that apply to this object.
          type: array
          items:
            $ref: "#/components/schemas/link"
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    trackedResource:
      title: Tracked Resource
      type: object
      description: This class is used to provide common attributes and behaviors around
        tracking who and when objects were created and modified to representation
        objects.
      properties:
        createdBy:
          type: string
          description: The username of whoever created the resource.
        modifiedBy:
          type: string
          description: The username of whoever last modified the resource.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the resource was created.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the resource was last modified.
    transferObjectConnector:
      title: Transfer Object Connector
      description: Content providers implementing the Transfer Object Provider contract
        use this media type to provide connection information for the content to be
        transfered.
      x-sas-media-type:
        name: application/vnd.sas.transfer.object.connector
        version: 1
      properties:
        id:
          type: string
          format: object-id
          description: unique identifier of the object
        name:
          type: string
          description: name of the related object
        version:
          type: integer
          description: transfer object connector version
        uri:
          type: string
          description: the URI of the related object
        contentType:
          type: string
          description: media type of the related object
        type:
          type: string
          description: type of connection. This can be any value the creator of the
            connection wants but should be used to determine what to do to reconstitute
            the relationship.
        hints:
          type: array
          description: hints that can be used to help find the object to connect to
            in the target system
          items:
            type: string
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    summary:
      title: Resource Summary
      type: object
      description: The summarized representation of a resource. Often used in collection
        responses when more specific details aren't needed.
      x-sas-media-type:
        name: application/vnd.sas.summary
        version: 1
      required:
      - id
      - links
      - version
      properties:
        id:
          type: string
          description: The unique identifier for the resource.
        name:
          type: string
          description: The name of the resource.
        type:
          type: string
          description: The type of the resource.
        description:
          type: string
          description: The description of the resource.
        createdBy:
          type: string
          description: The user who created the resource.
        creationTimeStamp:
          type: string
