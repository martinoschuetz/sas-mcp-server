      - $ref: "#/components/parameters/collectionStart"
      - $ref: "#/components/parameters/collectionLimit"
      - $ref: "#/components/parameters/collectionFilter"
      - $ref: "#/components/parameters/collectionSortBy"
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: There are errors in the request.
        "406":
          description: The content media types are unacceptable.
    get:
      summary: Get a collection of Jobs
      description: Returns a collection of job objects in the form of an application/vnd.sas.collection.
        It is based on the specified query parameters.
      operationId: getJobs
      tags:
      - Jobs
      parameters:
      - $ref: "#/components/parameters/collectionStart"
      - $ref: "#/components/parameters/collectionLimit"
      - $ref: "#/components/parameters/collectionFilter"
      - $ref: "#/components/parameters/collectionSortBy"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/jobCollection"
              examples:
                jobs:
                  $ref: "#/components/examples/jobCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/jobCollection"
              examples:
                jobs:
                  $ref: "#/components/examples/jobCollection"
        "400":
          $ref: "#/components/responses/jobsQueryBadResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    post:
      summary: Create a SAS job
      description: Creates a new job to run a SAS program. The type of job is created
        depending on the Accept header. application/vnd.sas.batch.job.request.sas.batch+json
        headers creates a Batch job to run a SAS program. application/vnd.sas.batch.job.request.sas.line.mode+json
        headers creates a new interactive job to run SAS in line mode. application/vnd.sas.batch.job.request.command.batch+json
        headers creates a Batch job to run an arbitrary command. application/vnd.sas.batch.job.request.command.interactive+json
        headers creates an interactive job to run an arbitrary command.
      operationId: createJob
      tags:
      - Jobs
      requestBody:
        required: true
        content:
          application/vnd.sas.batch.job.request.sas.batch+json;version=1:
            schema:
              $ref: "#/components/schemas/jobRequestBatchSas"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequestBatchSas"
          application/vnd.sas.batch.job.request.sas.batch+json;version=2:
            schema:
              $ref: "#/components/schemas/jobRequestBatchSas"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequestBatchSas"
          application/vnd.sas.batch.job.request.sas.batch+json:
            schema:
              $ref: "#/components/schemas/jobRequestBatchSas"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequestBatchSas"
          application/json:
            schema:
              $ref: "#/components/schemas/jobRequestBatchSas"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequestBatchSas"
          application/vnd.sas.batch.job.request.sas.line.mode+json;version=1:
            schema:
              $ref: "#/components/schemas/jobRequestInteractiveSas"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequestInteractiveSas"
          application/vnd.sas.batch.job.request.sas.line.mode+json:
            schema:
              $ref: "#/components/schemas/jobRequestInteractiveSas"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequestInteractiveSas"
          application/vnd.sas.batch.job.request.command.batch+json;version=1:
            schema:
              $ref: "#/components/schemas/jobRequestBatchCommand"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequestBatchCommand"
          application/vnd.sas.batch.job.request.command.batch+json;version=2:
            schema:
              $ref: "#/components/schemas/jobRequestBatchCommand"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequestBatchCommand"
          application/vnd.sas.batch.job.request.command.batch+json:
            schema:
              $ref: "#/components/schemas/jobRequestBatchCommand"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequestBatchCommand"
          application/vnd.sas.batch.job.request.command.interactive+json;version=1:
            schema:
              $ref: "#/components/schemas/jobRequestInteractiveCommand"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequestInteractiveCommand"
          application/vnd.sas.batch.job.request.command.interactive+json:
            schema:
              $ref: "#/components/schemas/jobRequestInteractiveCommand"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequestInteractiveCommand"
      responses:
        "201":
          description: The job was created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/vnd.sas.batch.job+json;version=1:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                job:
                  $ref: "#/components/examples/job"
            application/vnd.sas.batch.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                job:
                  $ref: "#/components/examples/job"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                job:
                  $ref: "#/components/examples/job"
        "400":
          $ref: "#/components/responses/jobCreateRequestBadResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /jobs/{jobId}:
