  "/tasks":
    post:
      summary: Execute a task
      description: |-
        This endpoint is used to execute a task, a program that executes within
        a few seconds and is safe to interrupt or re-submit. The request
        contains the program and arguments - variables used by the program or
        by the service to alter how the program is run. Submitting the request
        triggers the service to establish a session, submit the program to the
        session, wait for the program to complete, and return any requested
        output. The response contains the status of the task and any output
        requested.
      operationId: createAndExecuteTask
      tags:
      - Tasks
      requestBody:
        description: >
          The request body contains the program to execute and any arguments
          that are needed by the program or by the service to alter how the
          program is executed. If using multipart/form-data the request can
          also include input files.
        required: true
        content:
          application/vnd.sas.compute.task.request+json:
            schema:
              $ref: "#/components/schemas/taskRequest"
            example:
              $ref: "#/components/schemas/taskRequest/example"
          application/json:
            schema:
              $ref: "#/components/schemas/taskRequest"
            example:
              $ref: "#/components/schemas/taskRequest/example"
          multipart/form-data:
            schema:
              type: object
              properties:
                taskRequest:
                  $ref: '#/components/schemas/taskRequest'
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: |-
                    An input file(s) for the task. You can have multiple 'file' parts each
                    with their own input file, but the taskRequest part must be first.

                    If the content type of the file is known, the `Content-Type` header
                    for the part can be set to the file's content type.
            encoding:
              taskRequest:
                contentType: application/vnd.sas.compute.task.request+json, application/json
            example:
              taskRequest:
                $ref: "#/components/schemas/taskRequest/example"
      responses:
        "200":
          description: >
            The task was executed successfully. The response contains the final
            status of the job as well as its condition code and any errors that
            were encountered during the execution.
          content:
            application/vnd.sas.compute.task+json:
              schema:
                $ref: "#/components/schemas/task"
              example:
                $ref: "#/components/schemas/task/example"
            application/json:
              schema:
                $ref: "#/components/schemas/task"
              example:
                $ref: "#/components/schemas/task/example"
            multipart/form-data:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/task'
                  textLog:
                    type: string
                    format: binary
                    description: The log of the job created by the service in text
                      format.
                  jsonLog:
                    type: string
                    format: binary
                    description: The log of the job created by the service in JSON
                      format.
              encoding:
                task:
                  contentType: application/vnd.sas.compute.task+json, application/json
              example:
                task:
                  $ref: "#/components/schemas/task/example"
        "400":
          description: >
            The request was invalid. This can occur because the request body
            does not satisfy the schema for
            application/vnd.sas.compute.task.request. Ensure all the required
            properties are present and that the values are valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequestErrorResponse"
        "404":
          description: >
            A resource identified in the request does not exist. For example,
            the Compute Context or Session identified in the task request does
            not exist. Refer to the error message for more information.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
        "415":
          description: >
            The server does not support the media type specified in the
            Content-Type header. If sending a json body, ensure that the
            Content-Type header is set to
            application/vnd.sas.compute.task.request+json. If sending multipart/form-data,
            ensure that the taskRequest part is first and that its
            Content-Type header is set to
            application/vnd.sas.compute.task.request+json.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/unsupportedMediaTypeErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/unsupportedMediaTypeErrorResponse"
        "504":
          description: >
            The request timed out. This can occur if the task takes longer than
            the timeout value configured in the context or deployment configuration.
            If you experience this error, consider if the program should be
            executed using the Job Execution Service instead of this endpoint.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/timeoutResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/timeoutResponse"
