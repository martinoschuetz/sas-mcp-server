    taskRequest:
      title: Task Request
      description: Provides an object that you use to execute a task.
      required:
      - code
      - arguments
      properties:
        name:
          type: string
          description: Specifies an optional name that is associated with this task.
        description:
          type: string
          description: Specifies an optional description for this task.
        code:
          type: string
          description: >
            Specifies the program to be executed. Each line should be separated
            by a new line character (\n, \r, or \r\n). For example,
            "data \_null\_;\ncall sleep(1, 60);\nrun;".
        arguments:
          type: object
          additionalProperties:
            type: string
          description: |-
            Specifies a map of string keys and string values used as variables
            for the program or as instructions on how to execute the program.

            **Variables Usage**:
            If your program expects a variable, you can provide it here. For
            example, if your program expects the variable `myVar`, you can
            provide it here as `"myVar": "myValue"`.

            **Altering Program Execution**:
            Arguments can also be used to alter how the service executes the
            task. For instance, what context to create the session on or what
            output to return. Make sure that an argument indicating what session
            or context the service should use is included. For example, if you
            have already created a session and want the task to execute on your
            session, you should provide the `_sessionId` argument where the
            value is the ID of your session. Alternatively, if you want to defer
            the process of creating the session to the service, you can indicate
            which context you would like the session to be created on by
            providing the `_contextId` argument where the value is the ID of the
            context or the `_contextName` argument where the value is the name
            of the context. When specifying a context, the context must be
            reusable.

            For a full list of arguments available to alter the program's
            execution, refer to the table below.

            | Argument Name         | Description                                                                                                                                                                                                                                                        |
            |-----------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
            | _contextName          | The name of the context to create the session on (must be reusable).                                                                                                                                                                                               |
            | _contextId            | The id of the context to create the session on (must be reusable).                                                                                                                                                                                                 |
            | _sessionId            | The id of an existing session to run the task within.                                                                                                                                                                                                              |
            | _addJesBeginEndMacros | If true, the service will add the `%JESBEGIN` and `%JESEND` macros to the beginning and end of the code.                                                                                                                                                           |
            | _omitJsonListing      | If true, the service will not return the JSON listing. Defaults to false.                                                                                                                                                                                          |
            | _omitTextListing      | If true, the service will not return the text listing. Defaults to false.                                                                                                                                                                                          |
            | _omitJsonLog          | If true, the service will not return the JSON log. Defaults to false.                                                                                                                                                                                              |
            | _omitTextLog          | If true, the service will not return the text log. Defaults to false.                                                                                                                                                                                              |
            | _omitSessionResults   | If true, the service will not return the session results. Defaults to true. The default can be configured in the deployment configuration.                                                                                                                         |
            | _resultFilter         | A filter that specifies which results to return. For example if you only want to return the result name '_webout', you can specify the filter as "eq(name,'_webout')".                                                                                             |
            | _variableFilter       | A filter that specifies which variables you want returned. For example, if you only want the variable named 'MYNAME', you can specify the filter as "eq(name,'MYNAME')". The value _ALL_ returns all variables. Not specifying the argument returns no variables.  |
      example:
        name: Hello World
        description: >-
          This task creates html output which says Hello to the name stored in
          the MYNAME argument.
        code: >-
          *  Declare input parameter;

          %global MYNAME;

          *  Create the _webout fileref;

          filename _webout temp;


          *  Write the custom HTML to _webout;

          data _null_;
          file _webout;
          put '<!DOCTYPE html>';
          put '<html lang="en">';
          put '<head><title>Hello World!</title></head>';
          put '<body role="main">';
          put "<h1>Hello %sysfunc(htmlencode(&MYNAME))!</h1>";
          put '</body>';
          put '</html>';
          run;
        arguments:
          _contextName: MySampleContext
          _omitSessionResults: "false"
          _variableFilter: eq(name,'MYNAME')
          MYNAME: John
    task:
      title: Task
      description: Provides general information about a task, its status, and any
        errors encountered during execution.
      required:
      - id
      - state
      - jobConditionCode
      - creationTimeStamp
      - elapsedTime
      - contextId
      - contextName
      - sessionId
      - jobId
      properties:
        id:
          type: string
          description: The identifier for this task.
        name:
          type: string
          description: The name of the task.
        description:
          type: string
          description: The description of the task.
        state:
          type: string
          description: >
            The final state of the job that the service created to execute the
            task. The possible values are: pending, running, canceled, warning,
            error, or completed.
          enum:
          - pending
          - running
          - canceled
          - warning
          - error
          - completed
        jobConditionCode:
          type: integer
          description: >
            The jobConditionCode of the job that the service created to execute
            the task.
        creationTimeStamp:
          type: string
          format: date-time
          description: >
            The time when the task was created. This is the time the service
            received the request to execute the task.
        elapsedTime:
          type: integer
          format: milliseconds
          description: >
            The total time spent executing the task in milliseconds. This is the
            time between when the service received the request to when it began
            writing the response back to the client.
        contextId:
          type: string
          description: The ID of the context in which the task was executed.
        contextName:
          type: string
          description: The name of the context in which the task was executed.
        sessionId:
          type: string
          description: The ID of the session in which the task was executed.
        jobId:
          type: string
          description: The ID of the job that the service created to execute the task.
        variables:
          type: object
          additionalProperties:
            type: string
          description: >
            They name and final value of variables requested using the
            `_variableFilter` argument.
        error:
          $ref: "#/components/schemas/error2"
      example:
        id: 4c6775e3-50f3-4c72-80a3-a7e1069876dc
        name: Hello World
        description: >-
          This task creates html output which says Hello to the name stored in
          the MYNAME argument.
        state: completed
        jobConditionCode: 0
        creationTimeStamp: 2016-05-20T16:16:10Z
        elapsedTime: 225
        contextId: ea0d3ee1-894f-4936-bc2b-f611a878a0dd
        contextName: MySampleContext
        sessionId: c1a108bb-6019-4876-807f-eeac467b9c0
        jobId: 71fc2eae-272c-45b4-aaf7-76f6cf259400
        variables:
          GLOBAL_MYNAME: John
