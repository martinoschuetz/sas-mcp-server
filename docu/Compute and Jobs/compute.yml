      description: >
        Uploads job log output to the Files service and returns the
        representation of the file resource containing the output. The file is
        created in one of two formats, based on the value of the property
        "format" specified in the post body. If "collection" is specified as the
        value of "format", the output file is rendered as
        application/vnd.sas.collection+json. If the format is specified as
