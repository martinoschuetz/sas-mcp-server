      - name: jobId
        in: path
        description: Specifies the ID of the job.
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: Specifies the offset of the first item in a collection. The first
          line is at start=0.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Specifies the number of items in a page.
        schema:
          type: integer
          format: int32
          default: 100
      - name: type
        in: query
        description: Restricts log collection to those entries with a specified type.
          Specify multiple types in a query by separating them with a '|'.  For example,
          you might specify ?type=error or ?type=error|warning.
        schema:
          type: string
      - name: timeout
        in: query
        description: Specifies the request time-out in seconds. If no log lines are
          available over this time period, an empty collection is returned.
