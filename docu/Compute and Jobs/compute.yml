      - name: start
        in: query
        description: Specifies the offset of the first item in the collection. The
          first line is at start=0.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Specifies the number of items in this page.
        schema:
          type: integer
          format: int32
          default: 100
      - name: type
        in: query
        description: Restricts the log collection to those entries whose type matches
