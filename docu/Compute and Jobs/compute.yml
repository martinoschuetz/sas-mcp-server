            the content for this request.
        fileProtection:
          $ref: "#/components/schemas/fileProtection"
        fileProtectionEncoding:
          type: string
          description: Specifies the encoding for the password values in the fileProtection
            structure. If the value is "base64", then the password values in the fileProtection
            structure should be encoded by converting the text to UTF-8 and base64-encoding
            the result. If no value is provided, then the password values of the fileProtection
            structure are expected to be clear text.
        columnDetail:
          type: string
          description: Specifies the level of column information to return.
          enum:
          - names
          - detail
          - summary
          default: names
        includeColumns:
          type: array
          items:
            type: string
          description: Specifies an array of strings that indicate the columns to
            include in the returned content. If you do not specify a value, then all
            columns are returned. The order of the column names in the list indicates
            the order for the cells of the prompt content.
        columnNaturalOrder:
          type: boolean
          description: When includeColumns is specified, a value of true for columnNaturalOrder
            specifies that the cells of the prompt content are returned in the order
            in which they occur in the data set instead of in the order that is specified
            by includeColumns.
        sortBy:
          type: array
          description: Specifies an array of objects that describe the sort definitions
            to use in the prompt content.
          items:
            $ref: "#/components/schemas/sortByRequest"
        columnFormatting:
          type: array
          items:
            $ref: "#/components/schemas/columnFormatting"
