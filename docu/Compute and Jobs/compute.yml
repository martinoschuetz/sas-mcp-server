            application/vnd.sas.compute.output.stream.file.request. It can also
            occur if the client is building its request URI and there is no
            session log output.  This problem can be avoided by using the links
            for the session resource; a link will not exist unless output is
            available.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
