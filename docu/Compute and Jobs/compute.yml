        the session log. Therefore, the first line of a job log begins at a
        location (offset) within the session log. This operation returns a
        collection in which each entry is of the type
        application/vnd.sas.compute.log.line.
      operationId: getJobLog
      tags:
      - Logs
      parameters:
      - name: sessionId
        in: path
        description: Specifies the ID of the session.
        required: true
        schema:
