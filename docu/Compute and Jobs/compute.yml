    sessionOption:
      title: SAS Option
      description: Specifies information about a SAS option that is used in the current
        session.
      properties:
        version:
          type: integer
          format: int32
          description: Specifies the version number of this representation schema.
            This is version 1.
        name:
          type: string
          readOnly: true
          description: Specifies the name of the option.
        description:
          type: string
          readOnly: true
          description: Specifies the description of the option as defined in the system.
        value:
          type: string
          description: Specifies the current value of the option, if it is available.
      example:
        version: 1
        name: MEMSIZE
        description: Specifies the limit on the amount of virtual memory that can
          be used during a SAS session.
        value: "2147483648"
    fileProtection:
      title: Table Protection Information
      type: object
      description: Specifies information that you use to access data sets or tables
        that are protected. Provide password values in the format password-type=password.
        Possible values for password-type are "ALTER", "PW", "READ", or "WRITE". A
        password value must be a valid eight-character SAS name.
      properties:
        read:
          type: string
          description: Specifies the password that grants Read access to the file
            that represents the data set.
        alter:
          type: string
          description: Specifies the password that grants Alter access to the file
            that represents the data set.
        write:
          type: string
          description: Specifies the password that grants Write access to the file
            that represents the data set.
    sortByRequest:
      title: Table Sorting Request
      description: Provides sorting options to use with a table or data set.
      properties:
        key:
          type: string
          description: Specifies the key to use in this sortBy request.
        direction:
          type: string
          enum:
          - ascending
          - descending
          default: ascending
          description: Specifies the sort order for this sortBy request.
    rowSetRequest:
      title: Row Set Request
      description: Provides a request that you can use to generate a row set.
      properties:
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 3.
        where:
          type: string
          description: Specifies that a standard SAS WHERE clause was used to build
            the row set for this request.
        fileProtection:
          $ref: "#/components/schemas/fileProtection"
        fileProtectionEncoding:
          type: string
          description: Specifies the encoding for the password values in the fileProtection
            structure. If the value is "base64", then the password values in the fileProtection
            structure should be encoded by converting the text to UTF-8 and base64-encoding
            the result. If no value is provided, then the password values of the fileProtection
            structure are expected to be clear text.
        columnDetail:
          type: string
          description: Specifies the level of column information to return.
          enum:
          - names
          - detail
          - summary
          default: names
        includeColumns:
          type: array
          items:
            type: string
          description: Specifies an array of strings that indicate the columns to
            include in a row set. If you do not specify a value, then all columns
            are returned. The order of the column names in the list indicates the
            order for the cells of the row set.
        columnNaturalOrder:
          type: boolean
          description: When includeColumns is specified, a value of true for columnNaturalOrder
            specifies that the cells of the row set are returned in the order in which
            they occur in the data set instead of in the order that is specified by
            includeColumns.
        columnFormatting:
          type: array
          items:
            $ref: "#/components/schemas/columnFormatting"
      example:
        where: name='Fred'
        fileProtection:
          read: cmVhZFBX
          alter: YWx0ZXJQVw
          write: d3JpdGVQVw
        fileProtectionEncoding: base64
        columnDetail: names
        includeColumns:
        - name
        - sex
        columnNaturalOrder: false
        columnFormatting:
        - - name: sex
          - format: $GENDER6.
    rowsRequest:
      title: Rows Request
      description: Provides a request that you can use to obtain rows from a table
        or data set.
      properties:
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 3.
        where:
          type: string
          description: Specifies that a standard SAS WHERE clause is used to return
            the rows for this request. When a WHERE clause is specified, the "count"
            attribute is omitted from the response because the exact number of rows
            is not known until the data is fully processed. This might take multiple
            requests due to response size limits and pagination.
        fileProtection:
          $ref: "#/components/schemas/fileProtection"
        fileProtectionEncoding:
          type: string
          description: Specifies the encoding for the password values in the fileProtection
            structure. If the value is "base64", then the password values in the fileProtection
