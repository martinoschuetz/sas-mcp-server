---
openapi: 3.0.3
info:
  title: Compute
  version: "22"
  description: >
    The Compute API enables users to submit and execute SAS code using REST calls.
    Users can manage Compute contexts, create sessions, submit jobs, and access information
    about the session.
  termsOfService: 'https://www.sas.com/en_us/legal/copyright.html'
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: https://example.com/compute
  description: kubernetes mock server
tags:
- name: Root
  description: Contains the operations for the root resource of the Compute API.
- name: Contexts
  description: Contains the operations to create SAS Compute Server definitions.
- name: Servers
  description: Contains the operations for SAS Compute Server instances.
- name: Sessions
  description: Contains the operations for sessions that run on a server and handle
    SAS requests.
- name: Jobs
  description: Contains the operations for submitting session jobs.
- name: Tasks
  description: Contains the operations for executing a task.
- name: Listings
  description: Contains the operations for retrieving SAS output information from
    a job.
- name: Logs
  description: Contains the operations for retrieving log information from a job.
- name: Results
  description: Contains the operations for retrieving results from a job.
- name: Data Access
  description: Contains the operations to access information for librefs and SAS data
    sets.
- name: Files
  description: Contains the operations to access information for files and filerefs.
- name: Variables
  description: Contains the operations to access information for variables in a given
    session.
- name: Engines
  description: Contains the operations to access information about data access engines
    from a session.
- name: File System
  description: Contains the operations to access information for the file system.
- name: Options
  description: Contains the operations to access information for options in a session.
- name: Formats
  description: Contains the operations to access format information that is available
    in a session.
- name: Informats
  description: Contains the operations to access informat information that is available
    in a session.
paths:
  /:
    head:
      summary: Check service availability
      description: Checks the availability of the service.
      operationId: headersForRoot
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
    get:
      summary: Get API resource links
      description: Returns a list of links to the top level resources in this API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              example:
                $ref: "#/components/examples/apiResponse/value"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              example:
                $ref: "#/components/examples/apiResponse/value"
  /contexts:
    head:
      summary: Check endpoint availability
      description: Determines whether an endpoint is currently available.
      operationId: headersForContexts
      tags:
      - Contexts
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: "Specifies the desired context representation.<br> The Accept-Item\
          \ options are: <ul> <li>application/vnd.sas.compute.context+json <li>application/vnd.sas.compute.context.summary+json\
          \ <li>blank </ul> If the application/vnd.sas.compute.context.summary+json\
          \ type is specified or no Accept-Item header is specified, then the contexts\
          \ are returned as summary representation context objects."
        schema:
          type: string
          enum:
          - application/vnd.sas.compute.context+json
          - application/vnd.sas.compute.context.summary+json
      - name: start
        in: query
        description: Returns the offset of first context definition to return. The
          default value is "0".
        schema:
          type: integer
      - name: limit
        in: query
        description: Returns the maximum number of context definitions to return.
          The default value is "10".
        schema:
          type: integer
      - name: filter
        in: query
        description: Specifies the filter criteria for returned context definitions.
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sorts returned context definitions.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: No context endpoint exists at the requested path.
    get:
      summary: Get context definitions
      description: Returns a list of Compute context definitions. Standard paging,
        filtering, and sorting options are provided. By default, this endpoint returns
        a summary of the available information about the contexts. Specify an Accept-Item
        header with the value application/vnd.sas.compute.context+json to get all
        available information for each context.
      operationId: getContexts
      tags:
      - Contexts
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: "Specifies the desired context representation.<br> The Accept-Item\
          \ options are: <ul> <li>application/vnd.sas.compute.context+json <li>application/vnd.sas.compute.context.summary+json\
          \ <li>blank </ul> If the application/vnd.sas.compute.context.summary+json\
          \ type is specified or no Accept-Item header is specified, then the contexts\
          \ are returned as summary representation context objects."
        schema:
          type: string
          enum:
          - application/vnd.sas.compute.context+json
          - application/vnd.sas.compute.context.summary+json
      - name: start
        in: query
        description: Specifies the offset of the first context definition to return.
          The default value is "0".
        schema:
          type: integer
      - name: limit
        in: query
        description: Specifies the maximum number of context definitions to return.
          The default value is "10".
        schema:
          type: integer
      - name: filter
        in: query
        description: Specifies the filter criteria for returned context definitions.
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sorts returned context definitions.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/contextSummaryCollection"
              example:
                $ref: "#/components/schemas/contextSummaryCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/contextSummaryCollection"
              example:
                $ref: "#/components/schemas/contextSummaryCollection/example"
    post:
      summary: Create a context definition
      description: >
        Creates a context definition. The new context is assigned a unique ID.
        The contextName namespace is managed by you, and the contextName must be
        unique. You can update contexts by performing a PUT on the corresponding
        URL.
      operationId: createContext
      tags:
      - Contexts
      requestBody:
        content:
          application/vnd.sas.compute.context.request+json:
            schema:
              $ref: "#/components/schemas/contextRequest"
            example:
              $ref: "#/components/schemas/contextRequest/example"
          application/json:
            schema:
              $ref: "#/components/schemas/contextRequest"
            example:
              $ref: "#/components/schemas/contextRequest/example"
        description: Specifies a context request.
        required: true
      responses:
        "201":
          description: A context definition was created.
          headers:
            ETag:
              description: Specifies a tag that identifies this revision of this object.
              schema:
                type: string
            Location:
              description: Specifies the URI of the created context.
              schema:
                type: string
          content:
            application/vnd.sas.compute.context+json:
              schema:
                $ref: "#/components/schemas/context"
              example:
                $ref: "#/components/schemas/context/example"
            application/json:
              schema:
                $ref: "#/components/schemas/context"
              example:
                $ref: "#/components/schemas/context/example"
            application/vnd.sas.compute.context.summary+json:
              schema:
                $ref: "#/components/schemas/contextSummary"
              example:
                $ref: "#/components/schemas/contextSummary/example"
        "400":
          description: The request was invalid. The contextName is already in use,
            or the request body is invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequestErrorResponse"
  "/contexts/{contextId}":
    delete:
      summary: Delete a context definition
      description: Deletes the context definition that has the specified contextId.
      operationId: deleteContext
      tags:
      - Contexts
      parameters:
      - name: contextId
        in: path
        description: Deletes the context definition with the specified ID.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The context was deleted.
        "400":
          description: The context at the requested path could not be deleted because
            it is in use by one or more Compute servers.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequestErrorResponse"
        "404":
          description: No context definition exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
    get:
      summary: Get a context definition
      description: Returns the context definition that has the specified contextId.
      operationId: getContext
      tags:
      - Contexts
      parameters:
      - name: contextId
        in: path
        description: Returns the context definition with the specified ID.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: Specifies the tag that identifies the revision of this
                object.
              schema:
                type: string
          content:
            application/vnd.sas.compute.context+json:
              schema:
                $ref: "#/components/schemas/context"
              example:
                $ref: "#/components/schemas/context/example"
            application/json:
              schema:
                $ref: "#/components/schemas/context"
              example:
                $ref: "#/components/schemas/context/example"
            application/vnd.sas.compute.context.summary+json:
              schema:
                $ref: "#/components/schemas/contextSummary"
              example:
                $ref: "#/components/schemas/contextSummary/example"
        "404":
          description: No context definition exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
    head:
      summary: Verify that a context exists
      description: Determines whether the specified context exists.
      operationId: headersForContext
      tags:
      - Contexts
      parameters:
      - name: contextId
        in: path
        description: Specifies the context to check.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: Specifies a tag that identifies the revision of this object.
              schema:
                type: string
        "404":
          description: No context definition exists at the requested path.
    put:
      summary: Update a context definition
      description: >
        Updates a context definition. Changing a context does not affect any
        sessions that are currently running on the server that is instantiated
        by that context. Servers that are created after updating the context use
        the current definition. If the contextId matches the ID of an existing
        context, that context is updated. Otherwise, an error is returned. The
        request must include the current ETag of the context as the value of the
        If-Match request header to prevent concurrent updates. The current ETag
        of the context is provided in the value of the ETag response header of
        any endpoint that produces application/vnd.sas.compute.context.
      operationId: updateContext
      tags:
      - Contexts
      parameters:
      - name: contextId
        in: path
        description: Specifies the ID of the context definition.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: Specifies the current ETag of the context that you are updating.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.compute.context+json:
            schema:
              $ref: "#/components/schemas/context"
            example:
              $ref: "#/components/schemas/context/example"
          application/vnd.sas.compute.context.request+json:
            schema:
              $ref: "#/components/schemas/contextRequest"
            example:
              $ref: "#/components/schemas/contextRequest/example"
          application/json:
            schema:
              $ref: "#/components/schemas/context"
            example:
              $ref: "#/components/schemas/context/example"
        description: context definition
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: Specifies a tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.compute.context+json:
              schema:
                $ref: "#/components/schemas/context"
              example:
                $ref: "#/components/schemas/context/example"
            application/json:
              schema:
                $ref: "#/components/schemas/context"
              example:
                $ref: "#/components/schemas/context/example"
            application/vnd.sas.compute.context.summary+json:
              schema:
                $ref: "#/components/schemas/contextSummary"
              example:
                $ref: "#/components/schemas/contextSummary/example"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequestErrorResponse"
        "404":
          description: No context definition exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
        "409":
          description: The updated context included in the request was not based on
            the most recently saved context. A concurrent request updated the context
            while this request was in process.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/conflictErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/conflictErrorResponse"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resources last modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/preconditionFailedErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/preconditionFailedErrorResponse"
        "428":
          description: The request headers did not include an `If-Match` or `If-Unmodified-Since`
            precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/preconditionRequiredErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/preconditionRequiredErrorResponse"
  "/contexts/{contextId}/sessions":
    post:
      summary: Request new session
      description: >
        Creates a new session that is based on the Compute context definition
        that corresponds to the contextId path variable. If a reusable SAS
        Compute Server is available to handle this session, a new session is
        created on that SAS Compute Server. Otherwise, a new SAS Compute Server
        is created and the new session is created on that SAS Compute Server.
        The new session is associated with the identity of the requester. URLs
        that define how to access the session are returned. The contextId
        matches the ID member of a known context entry. The Location header
        contains the URI of the created session resource.
      operationId: createSession
      tags:
      - Contexts
      parameters:
      - name: contextId
        in: path
        description: Specifies the context definition ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.compute.session.request+json:
            schema:
              $ref: "#/components/schemas/sessionRequest"
            example:
              $ref: "#/components/schemas/sessionRequest/example"
          application/json:
            schema:
              $ref: "#/components/schemas/sessionRequest"
            example:
              $ref: "#/components/schemas/sessionRequest/example"
      responses:
        "201":
          description: A session and data were created.
          headers:
            Location:
              description: Specifies the URI of the created job resource.
              schema:
                type: string
          content:
            application/vnd.sas.compute.session+json:
              schema:
                $ref: "#/components/schemas/session"
              example:
                $ref: "#/components/schemas/session/example"
            application/json:
              schema:
                $ref: "#/components/schemas/session"
              example:
                $ref: "#/components/schemas/session/example"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequestErrorResponse"
        "404":
          description: No context definition exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
  /sessions:
    get:
      operationId: getSessions
      tags:
      - Sessions
      summary: Get active compute sessions
      description: Gets a paginated list of sessions. Standard paging, filtering,
        and sorting options are provided. By default, this endpoint returns a summary
        of the available information about the sessions. Specify an Accept-Item header
        with the value application/vnd.sas.compute.session+json to get all available
        information for each session.
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: "Specifies the desired session representation.<br> The Accept-Item\
          \ options are: <ul> <li>application/vnd.sas.compute.session+json <li>application/vnd.sas.compute.session.summary+json\
          \ <li>blank </ul> If the application/vnd.sas.compute.session.summary+json\
          \ type is specified or no Accept-Item header is specified, then the sessions\
          \ are returned as summary representation session objects."
        schema:
          type: string
          enum:
          - application/vnd.sas.compute.session+json
          - application/vnd.sas.compute.session.summary+json
      - name: start
        in: query
        description: Specifies the offset of first session to return. The default
          value is "0".
        schema:
          type: integer
      - name: limit
        in: query
        description: Specifies the maximum number of sessions to return. The default
          value is "10".
        schema:
          type: integer
      - name: filter
        in: query
        description: Specifies the filter criteria for returned sessions.
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sorts returned sessions.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/sessionSummaryCollection"
              example:
                $ref: "#/components/schemas/sessionSummaryCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/sessionSummaryCollection"
              example:
                $ref: "#/components/schemas/sessionSummaryCollection/example"
    head:
      operationId: headersForSessions
      tags:
      - Sessions
      summary: Check endpoint availability
      description: Determines whether a session endpoint is available.
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: "Specifies the desired session representation.<br> The Accept-Item\
          \ options are: <ul> <li>application/vnd.sas.compute.session+json <li>application/vnd.sas.compute.session.summary+json\
          \ <li>blank </ul> If the application/vnd.sas.compute.session.summary+json\
          \ type is specified or no Accept-Item header is specified, then the sessions\
          \ are returned as summary representation session objects."
        schema:
          type: string
          enum:
          - application/vnd.sas.compute.session+json
          - application/vnd.sas.compute.session.summary+json
      - name: start
        in: query
        description: Specifies the offset of the first session to return. The default
          value is "0".
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of sessions to return.  The default value is "10".
        schema:
          type: integer
      - name: filter
        in: query
        description: Specifies the filter criteria for returned sessions.
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sorts returned sessions.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
  /servers:
    get:
      summary: Get active servers
      description: Returns a list of active servers. Standard paging, filtering, and
        sorting options are provided. This method is restricted to users with ADMIN
        permission on this URL for monitoring purposes. By default, this endpoint
        returns a summary of the available information about the active servers. Specify
        an Accept-Item header with the value application/vnd.sas.compute.server+json
        to get all available information for each server.
      operationId: getServers
      tags:
      - Servers
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: "Specifies the desired server representation.<br> The Accept-Item\
          \ options are: <ul> <li>application/vnd.sas.compute.server+json <li>application/vnd.sas.compute.server.summary+json\
          \ <li>blank </ul> If the application/vnd.sas.compute.server.summary+json\
          \ type is specified or no Accept-Item header is specified, then the servers\
          \ are returned as summary representation server objects."
        schema:
          type: string
          enum:
          - application/vnd.sas.compute.server+json
          - application/vnd.sas.compute.server.summary+json
      - name: serverId
        in: query
        description: Returns only the active server that matches the serverId. The
          serverId is a unique identifier for an active SAS Compute Server instance.
        schema:
          type: string
      - name: contextName
        in: query
        description: Returns only active servers for the specified context definition.
        schema:
          type: string
      - name: start
        in: query
        description: Specifies the offset of first active server listing to return.
          The default value is "0".
        schema:
          type: integer
      - name: limit
        in: query
        description: Specifies the maximum number of active server listings to return.
          The default value is "10".
        schema:
          type: integer
      - name: filter
        in: query
        description: Specifies the filter criteria for returned active server listings.
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sorts returned active server listings.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/serverSummaryCollection"
              example:
                $ref: "#/components/schemas/serverSummaryCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/serverSummaryCollection"
              example:
                $ref: "#/components/schemas/serverSummaryCollection/example"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFoundErrorResponse"
    head:
      summary: Check endpoint availability
      description: Determine whether the servers endpoint is currently available.
      operationId: headersForServers
      tags:
      - Servers
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: "Specifies the desired server representation.<br> The Accept-Item\
