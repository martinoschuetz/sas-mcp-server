    fileref:
      title: Fileref
      description: Provides a description of a SAS fileref object.
      properties:
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 2.
        accessMethod:
          type: string
          description: Specifies the access method that is used for this fileref.
            Common values are "DISK" and "TEMP", but other values  be supported.
          readOnly: true
        isDirectory:
          type: boolean
          readOnly: true
          description: Specifies whether the fileref references a directory on the
            system.
        links:
          type: array
          description: Specifies links that apply to this fileref.
          items:
            $ref: "#/components/schemas/link"
        name:
          type: string
          readOnly: true
          description: Specifies the name of fileref resource.
        modifiedTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: Specifies the modification timestamp for this fileref.
        fileName:
          type: string
          readOnly: true
          description: Specifies the name of the file.
        fileSize:
          type: integer
          format: int32
          description: Specifies the size of the file.
        id:
          type: string
          format: object-id
          readOnly: true
          description: Specifies the identifier for this fileref.
        filePath:
          type: string
          readOnly: true
          description: Specifies the resolved path of the file. Support for this value
            was added in version 2.
          x-sas-since: "2"
      example:
        accessMethod: DISK
        modifiedTimeStamp: 2016-04-27T09:22:16Z
        fileName: myfile.txt
        filePath: /tmp/myfile.txt
        fileSize: 44
        id: myref
        isDirectory: false
        links:
        - href: /compute/sessions/RKEY-ses0000/filerefs/myref
          method: GET
          rel: self
          type: application/vnd.sas.compute.fileref
          uri: /compute/sessions/RKEY-ses0000/filerefs/myref
        - href: /compute/sessions/RKEY-ses0000/filerefs/myref
          method: GET
          rel: alternate
          type: application/vnd.sas.compute.fileref.summary
          uri: /compute/sessions/RKEY-ses0000/filerefs/myref
        - href: /compute/sessions/RKEY-ses0000/filerefs/myref
          method: DELETE
          rel: deassign
          uri: /compute/sessions/RKEY-ses0000/filerefs/myref
        - href: /compute/sessions/RKEY-ses0000/filerefs/myref/content
          method: GET
          rel: content
          type: text/plain
          uri: /compute/sessions/RKEY-ses0000/filerefs/myref/content
        - href: /compute/sessions/RKEY-ses0000/filerefs/myref/content
          method: PUT
          rel: upload
          type: text/plain
          uri: /compute/sessions/RKEY-ses0000/filerefs/myref/content
        - href: /compute/sessions/RKEY-ses0000/filerefs/myref/content
          method: DELETE
          rel: delete
          uri: /compute/sessions/RKEY-ses0000/filerefs/myref/content
        name: myref
        version: 2
    filerefRequest:
      title: Fileref Creation Request
      description: Enables you to create a new SAS fileref object.
      required:
      - name
      - path
      properties:
        version:
          type: integer
          format: int32
          description: Specifies the version number of this representation schema.
            This is version 1.
        name:
          type: string
          description: Specifies the name of this fileref.
        path:
          type: string
          description: Specifies the path to the file or directory that is referenced
            by this fileref.
        accessMethod:
          type: string
          description: Specifies the access method that is used for this fileref.
            Common values are "DISK" and "TEMP", but other values can be supported.
        options:
          type: string
          description: Specifies an options string for the creation of the fileref.
      example:
        version: 1
        name: myfref
        path: myfile.txt
        accessMethod: DISK
        options: encoding='utf8'  recfm=D termstr=LF
    directoryCollection:
