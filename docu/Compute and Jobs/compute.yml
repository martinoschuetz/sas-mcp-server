components:
  requestBodies:
    outputStreamFileRequest:
      content:
        application/vnd.sas.compute.output.stream.file.request+json:
          schema:
            $ref: "#/components/schemas/outputStreamFileRequest"
          example:
            $ref: "#/components/schemas/outputStreamFileRequest/example"
        application/json:
          schema:
            $ref: "#/components/schemas/outputStreamFileRequest"
          example:
            $ref: "#/components/schemas/outputStreamFileRequest/example"
      description: Specifies the request to stream output to the Files service.
      required: true
  schemas:
    resource:
      title: External Resource
      description: Provides information about a resource from a different service
        that can be referenced by the Compute service.
      required:
      - name
      - uri
      - type
      properties:
        name:
          type: string
          description: Specifies the name for the resource. This name can be used
            to reference this resource on the server. The value of the name is limited
            to 40 characters. The value must be unique within a context.
        uri:
          type: string
          description: Specifies the URI path to the resource. The URI path contains
            information about how to access the resource under the services base URL.
            The value of the URI is limited to 500 characters.
        type:
          type: string
          description: Specifies the type of resource that is referenced in this item.
            The value of the type is limited to 100 characters.
        output:
          type: boolean
          description: Specifies whether the resource can be referenced in the output
            or results of a session or job.
          default: false
        scope:
          type: string
          enum:
          - SESSION
          - JOB
          description: Specifies the scope of the resource. If a resource is specified
            for a job and the resource has JOB scope, then the resource is deleted
            or deassigned at the end of the job.
          default: SESSION
        options:
          type: object
          description: Specifies the options to add to the resource for the creation
            or assignment of an internal SAS component that is created based on type.
        required:
          type: boolean
          description: Specifies whether a resource is required. If a required resource
            cannot be instantiated by the session or job, then that session or job
            is considered to have failed.
          default: false
        attributes:
          type: object
          description: Specifies the attributes for the resource. Support for resource
            attributes was added in version 3 for contexts, context requests, and
            job requests, and in version 2 for session requests.
    contextLaunchContext:
      title: Launch Context
      type: object
      description: Provides information about the Launch context that is used by the
        Compute service.
      properties:
        command:
          type: string
          description: Specifies the command that launches the server for this context.
            If this value is not set, the service uses the default command that is
            determined at runtime.
        contextName:
          type: string
          description: Specifies the context name from the launcher context. If the
            launchType is service, then contextId or contextName is required.
        contextId:
          type: string
          description: Specifies the context ID from the launcher context. If the
            launchType is service, then contextId or contextName is required.
    environment:
      title: SAS Environment
      type: object
      description: Provides the SAS options and initialization code that is used by
        the Compute service and its sessions.
      properties:
        options:
          type: array
          items:
            type: string
          description: Specifies the SAS options to apply to a context.
        autoExecLines:
          type: array
          items:
            type: string
          description: Specifies the SAS code to execute during session initialization.
    contextRequest:
      title: Context Creation Request
      description: Enables the creation of a new Compute context.
      required:
      - name
      - launchContext
      - launchType
      properties:
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 3.
        name:
          type: string
          description: Specifies the context name. The value of the name is limited
            to 100 characters. The value must be unique.
        description:
          type: string
          description: Specifies a localized description. The value of description
            is limited to 1000 characters.
        launchContext:
          $ref: "#/components/schemas/contextLaunchContext"
        launchType:
          type: string
          description: Specifies the type of launcher to use when launching SAS Compute
            Servers. The only value currently supported is <b>service</b>, which refers
            to the Launcher service.
        attributes:
          type: object
          description: Specifies the attributes that control the behavior of sessions,
            based on this context. See the example for details.
        environment:
          $ref: "#/components/schemas/environment"
        authorizedUsers:
          type: array
          items:
            type: string
          description: Specifies the list of users who are allowed to request sessions
            using the specified context.
        authorizedGroups:
          type: array
          items:
            type: string
          description: Specifies the list of groups whose memes are allowed to request
            sessions using the specified context.
        authorizeAllAuthenticatedUsers:
          type: boolean
          description: Specifies whether all authenticated users are allowed to request
            sessions using the specified context. If <b>true</b>, then <b>authorizedUsers</b>
            and <b>authorizedGroups</b> are ignored.
        facilitateGuest:
          type: boolean
          description: Specifies whether the guest user is allowed to request sessions
            using the specified context.
          x-sas-since: "2"
        mediaTypeMap:
          type: object
          description: Specifies optional information that overrides mappings of file
            extensions to media types in sessions that are launched for this context.
            The session attempts to use file extensions to determine the media type
            of files that are returned. Standard IANA type mappings are used. To override
            the default behavior of the server, specify a mapping from a file extension
            to a media type name. That media type is then used for that file extension.
          additionalProperties:
            type: string
        resources:
          type: array
          description: Specifies the resources that have been requested to be added
            to this context.
          items:
            $ref: "#/components/schemas/resource"
          x-sas-since: "2"
        queueName:
          type: string
          description: Specifies the name of the workload queue where Compute servers
            configured from this context should run. If workload queues are not supported,
            this specification will be ignored. The value of the queue name is limited
            to 250 characters.
          x-sas-since: "4"
      example:
        name: MyApp
        version: 4
        description: My Application Context
        attributes:
          sessionInactiveTimeout: 60
        launchContext:
          contextName: compsrv
        launchType: service
        authorizedUsers:
        - myUser
        mediaTypeMap:
          csv: application/vnd.ms-excel
        resources:
        - name: file1
          uri: /files/files/ea0d3ee1-894f-4936-bc2b-f611a878a0dd
          type: application/vnd.sas.file
          scope: SESSION
          options:
            LRECL: 1024
        queueName: MyAppQueue
    context:
      title: Context
      description: Provides information about the context that is stored for a service.
      required:
      - id
      - name
      - launchContext
      - launchType
      properties:
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 4.
        id:
          type: string
          format: object-id
          readOnly: true
          description: Specifies the Compute context definition ID.
        name:
          type: string
          description: Specifies the localized context name.
        description:
          type: string
          description: Specifies the localized description.
        launchContext:
          $ref: "#/components/schemas/contextLaunchContext"
        launchType:
          type: string
          description: Specifies the type of launcher to use when launching SAS Compute
            Servers. The only value currently supported is <b>service</b>, which refers
            to the Launcher service.
        attributes:
          type: object
          description: Specifies the service-defined attributes that were set when
            this context was created.
        environment:
          $ref: "#/components/schemas/environment"
        mediaTypeMap:
          type: object
          description: Specifies optional information that overrides mappings of file
            extensions to media types in the sessions that was launched for this context.
            The session attempts to use file extensions to determine the media type
            of the files that are returned. Standard IANA type mappings are used.
            To override the default behavior of the server, specify a mapping from
            a file extension to a media type name. That media type is then used for
            that file extension.
          additionalProperties:
            type: string
        createdBy:
          type: string
          readOnly: true
          description: Specifies the user-ID that created the context definition.
        modifiedBy:
          type: string
          readOnly: true
          description: Specifies the user ID that last updated the context definition.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: Specifies the timestamp when the context was created.
        modifiedTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: Specifies the timestamp when the context was last updated.
        links:
          type: array
          description: Specifies links that apply to the context.
          items:
            $ref: "#/components/schemas/link"
        resources:
          type: array
          description: Specifies the resources that have been configured for this
            context.
          items:
            $ref: "#/components/schemas/resource"
          x-sas-since: "2"
        queueName:
          type: string
          description: Specifies the name of the workload queue where Compute servers
            configured from this context should run. If workload queues are not supported,
            this specification will be ignored. The value of the queue name is limited
            to 250 characters.
          x-sas-since: "4"
      example:
        description: My Application Context
        links:
        - method: GET
          rel: self
          href: /compute/contexts/309b3f0b-cda8-4c2b-9089-82a07a4fff12
          uri: /compute/contexts/309b3f0b-cda8-4c2b-9089-82a07a4fff12
          type: application/vnd.sas.compute.context
