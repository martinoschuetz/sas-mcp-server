---
openapi: 3.0.3
info:
  version: "1"
  title: IoT Analysis
  description: Analytics For IoT API for the analysis instances.
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
servers:
- url: http://example.com/iotAnalysis
  description: This is an example base URL.
tags:
- name: Root
  description: Contains the root of the Anlaysis API.
- name: Analysis
  description: Contains the operations for the Analysis resource.
- name: AnalysisStep
  description: Contains the operations for the AnalysisStep resource.
- name: AlertAssignment
  description: Contains the operations for the AlertAssignment resource.
- name: Subscription
  description: Contains the operations for the Subscription resource.
- name: FolderMembers
  description: Contains the operations for the FolderMembers resource.
- name: Project
  description: Contains the operations for the Project resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      responses:
        "200":
          description: OK
          content:
            "application/vnd.sas.api+json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                sample:
                  value: {"links": [{"method": "GET", "rel": "getAnalyses", "href": "/iotAnalysis/analyses",
                        "uri": "/iotAnalysis/analyses", "type": "application/vnd.sas.collection",
                        "itemType": "application/vnd.sas.iot.analysis"}, {"method": "POST",
                        "rel": "createAnalysis", "href": "/iotAnalysis/analyses",
                        "uri": "/iotAnalysis/analyses", "type": "application/vnd.sas.iot.analysis"},
                      {"method": "GET", "rel": "getAllProjects", "href": "/iotAnalysis/projects",
                        "uri": "/iotAnalysis/projects", "type": "application/vnd.sas.iot.project"},
                      {"method": "POST", "rel": "createProject", "href": "/iotAnalysis/projects",
                        "uri": "/iotAnalysis/projects", "type": "application/vnd.sas.iot.project"}],
                    "version": 1}
            "application/json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                sample:
                  value: {"links": [{"method": "GET", "rel": "getAnalyses", "href": "/iotAnalysis/analyses",
                        "uri": "/iotAnalysis/analyses", "type": "application/vnd.sas.collection",
                        "itemType": "application/vnd.sas.iot.analysis"}, {"method": "POST",
                        "rel": "createAnalysis", "href": "/iotAnalysis/analyses",
                        "uri": "/iotAnalysis/analyses", "type": "application/vnd.sas.iot.analysis"},
                      {"method": "GET", "rel": "getAllProjects", "href": "/iotAnalysis/projects",
                        "uri": "/iotAnalysis/projects", "type": "application/vnd.sas.iot.project"},
                      {"method": "POST", "rel": "createProject", "href": "/iotAnalysis/projects",
                        "uri": "/iotAnalysis/projects", "type": "application/vnd.sas.iot.project"}],
                    "version": 1}
          headers:
            Content-Type:
              required: true
              description: the content type
              schema:
                type: string
        "404":
          description: Requested path does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                sample:
                  value: {"version": 2, "httpStatusCode": 404, "message": 'There is
                      no handler defined for the path "/iotAnalysis/a".', "details": [
                      "path: /iotAnalysis/a", "correlator: 9d3fe6d8-cfe1-45a3-8dc8-eda733fdf91f"]}
            "application/json":
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                sample:
                  value: {"version": 2, "httpStatusCode": 404, "message": 'There is
                      no handler defined for the path "/iotAnalysis/a".', "details": [
                      "path: /iotAnalysis/a", "correlator: 9d3fe6d8-cfe1-45a3-8dc8-eda733fdf91f"]}
  /analysisActions/deletions:
    post:
      tags:
      - Analysis
      summary: Delete the multiple analysis instances
      description: Delete the specified list of analyses.
      operationId: deleteAnalyses
      requestBody:
        required: true
        description: Selected analysis list
        content:
          application/vnd.sas.selection+json:
            schema:
              $ref: "#/components/schemas/resourceSelectionTwo"
            examples:
              sample:
                value: {"version": 1, "resources": ["caa8399b-8987-44ef-8133-96396251f9be",
                    "b240ec99-c4a7-45c6-b54d-39ef71e92eba", "6b5b2658-ab39-46bf-bda2-1a55a1b1e1e4"]}
          application/json:
            schema:
              $ref: "#/components/schemas/resourceSelectionTwo"
            examples:
              sample:
                value: {"version": 1, "resources": ["caa8399b-8987-44ef-8133-96396251f9be",
                    "b240ec99-c4a7-45c6-b54d-39ef71e92eba", "6b5b2658-ab39-46bf-bda2-1a55a1b1e1e4"]}
      responses:
        "200":
          description: analyses are deleted successfully.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
              examples:
                sample:
                  value: {"6b5b2658-ab39-46bf-bda2-1a55a1b1e1e4": "", "b240ec99-c4a7-45c6-b54d-39ef71e92eba": "",
                    "caa8399b-8987-44ef-8133-96396251f9be": ""}
        "400":
          description: Bad Request
          content:
            "application/vnd.sas.error+json":
              schema:
                type: object
              examples:
                sample:
                  value: {"6b5b2658-ab39-46bf-bda2-1a55a1b1e1e4": {"version": 2, "httpStatusCode": 400,
                      "errorCode": 76250, "message": 'The ID "6b5b2658-ab39-46bf-bda2-1a55a1b1e1e4"
                        for the analysis is invalid. Specify a valid ID.'}, "b240ec99-c4a7-45c6-b54d-39ef71e92eba": {
                      "version": 2, "httpStatusCode": 400, "errorCode": 76250, "message": 'The
                        ID "b240ec99-c4a7-45c6-b54d-39ef71e92eba" for the analysis
                        is invalid. Specify a valid ID.'}, "caa8399b-8987-44ef-8133-96396251f9be": {
                      "version": 2, "httpStatusCode": 400, "errorCode": 76250, "message": 'The
                        ID "caa8399b-8987-44ef-8133-96396251f9be" for the analysis
                        is invalid. Specify a valid ID.'}}
  /analysisActions/generateName:
    post:
      tags:
      - Analysis
      summary: Generate an analysis name
      operationId: generateName
      description: Generate an analysis name.
      parameters:
      - name: baseName
        in: query
        description: Localized analysis type required to generate analysis name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              examples:
                sample:
                  value: Analysis 1
