  /analyses:
    get:
      tags:
      - Analysis
      summary: Get the list of the analysis instances
      operationId: getAnalyses
      description: Returns a list of the analysis instances. If the 'Accept' header
        is omitted or has a value of 'application/vnd.sas.iot.analysis+json', the
        analyses are returned in standard analysis format. If the 'Accept' header
        has a value of 'application/vnd.sas.summary+json' or 'application/vnd.sas.search.indexable.data',
        the analyses are returned in the respective format.
      parameters:
      - name: Accept
        description: Optional header. If omitted or has a value of 'application/vnd.sas.iot.analysis+json',
          the analyses are returned in standard analysis format. If it has a value
          of 'application/vnd.sas.summary+json' or 'application/vnd.sas.search.indexable.data',
          the analyses are returned in the respective format.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.iot.analysis+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.search.indexable.data
          default: application/vnd.sas.iot.analysis+json
      - name: start
        in: query
        description: 0-based offset of the first report to return.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Maximum number of reports to return.
        required: false
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering. Report attributes that can be used
          are id, name, description, createdBy, creationTimeStamp, modifiedBy, and
          modifiedTimeStamp. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/iotAnalysis-v1/docs/getting-started/usage-notes#filtering).
        required: false
