          modifiedTimeStamp. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/iotAnalysis-v1/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
