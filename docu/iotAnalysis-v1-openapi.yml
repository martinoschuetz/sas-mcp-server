    head:
      tags:
      - Subscription
      summary: Get the list of subscriptions
      operationId: headersForSubscriptions
      description: Returns a list of subscriptions.
      parameters:
      - name: analysisId
        in: path
        description: Analysis id to get subscriptions.
        required: true
        schema:
          type: string
          format: object-id
      - name: start
        in: query
        description: 0-based offset of the first report to return.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Maximum number of reports to return.
        required: false
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering. Report attributes that can be used
          are id, name, description, createdBy, creationTimeStamp, modifiedBy, and
          modifiedTimeStamp. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/iotAnalysis-v1/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting. Report attributes that can be used
          are id, name, description, createdBy, creationTimeStamp, modifiedBy, and
          modifiedTimeStamp. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/iotAnalysis-v1/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
        "404":
          description: Requested path does not exist.
    post:
      tags:
      - Subscription
      summary: Create a new subscription
      description: Create a new subscription with the content passed in the request
        body.
      operationId: createSubscription
      parameters:
      - name: analysisId
        in: path
        description: Analysis id to create subscription.
        required: true
        schema:
          type: string
          format: object-id
