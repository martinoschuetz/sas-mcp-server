  /analyses/{analysisId}:
    get:
      tags:
      - Analysis
      summary: Get the details of a analysis instance
      operationId: getAnalysis
      description: Returns the analysis instance for specified id. If the 'Accept'
        header is omitted or has a value of 'application/vnd.sas.iot.analysis+json',
        the analysis is returned in standard analysis format. If the 'Accept' header
        has a value of 'application/vnd.sas.summary+json' or 'application/vnd.sas.search.indexable.data',
        the analysis is returned in the respective format.
      parameters:
      - name: Accept
        description: Optional header. If omitted or has a value of 'application/vnd.sas.iot.analysis+json',
          the analysis is returned in standard analysis format. If it has a value
          of 'application/vnd.sas.summary+json' or 'application/vnd.sas.search.indexable.data',
          the analysis is returned in the respective format.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.iot.analysis+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.search.indexable.data
          default: application/vnd.sas.iot.analysis+json
      - name: analysisId
        in: path
        description: Analysis id to get.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK
          headers:
