  /projects:
    get:
      tags:
      - Project
      summary: Get the list of the project instances
      operationId: getProjects
      description: Returns a list of the project instances. If the 'Accept' header
        is omitted or has a value of 'application/vnd.sas.collection+json', the projects
        are returned in standard project format.
      parameters:
      - name: start
        in: query
        description: 0-based offset of the first report to return.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Maximum number of reports to return.
        required: false
        schema:
          type: integer
          default: 5000
      - name: filter
        in: query
        description: The criteria for filtering. Report attributes that can be used
          are id, name, description, createdBy and modifiedBy. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/iotAnalysis-v1/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting. Report attributes that can be used
          are id, name, description, createdBy, creationTimeStamp, modifiedBy, and
          modifiedTimeStamp. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/iotAnalysis-v1/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
