  /lastAccess:
    head:
      summary: Get the headers associated with the lastAccess collection
      description: The records in the lastAccess collection represent the most recent
        server connection attempt for all unique **userId / application / mobile device**
        configurations utilizing the mobile application. Several records for a **deviceId
        / userId** combination, denoting different application and/or device operating
        system versions, may help mobile administrators track the updates to the device
        configurations over time. Records are not deleted from the lastAccess collection.
      operationId: headersForLastAccess
      tags:
      - LastAccess
      parameters:
      - name: Accept-Item
        description: This is an optional header. If not present then items of type
          application/vnd.sas.device.history.record+json;version=1 are returned.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.device.history.record+json;version=1
          - application/vnd.sas.device.history.record+json
          - application/json
          default: application/vnd.sas.device.history.record+json;version=1
      - name: excludeDeviceHistory
        in: query
        required: false
        description: When device history is to be excluded, the list will only include
          the most recent server connection attempt for each **deviceId / userId**
          combination utilizing the mobile application.
        schema:
          type: boolean
          default: false
      - name: start
        in: query
        description: 0-based offset of the first item to return.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Maximum number of items to return.
        required: false
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the items. The history record attributes
          that can be used for filtering are **application, deviceId, deviceModel,
          deviceType, timeStamp, state, osVersion,** and **userId**. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/deviceManagement-v3/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the items. The history record attributes
          that can be used for sorting are **application, deviceId, deviceModel, deviceType,
          timeStamp, state, osVersion,** and **userId**. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/deviceManagement-v3/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK. The collection returned can be empty.
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.device.history.record+json;version=1
              schema:
                type: string
        "400":
          description: Bad Request<br> Unsupported filter function.<br> Invalid filter
            argument or syntax.<br> excludeDeviceHistory is invalid.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
        "403":
          description: Forbidden. Only accessible to those users who are allowed to
            **Manage Mobile Devices**.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
    get:
      summary: Get a collection of device history records
      description: Returns a collection of device history records with standard paging,
        filtering, and sorting options. The records represent the most recent server
        connection attempt for all unique **userId / application / mobile device**
        configurations utilizing the mobile application. Several records for a **deviceId
        / userId** combination, denoting different application and/or device operating
        system versions, may help mobile administrators track the updates to the device
        configurations over time. Records are not deleted from the lastAccess collection.
      operationId: getLastAccess
      tags:
      - LastAccess
      parameters:
      - name: Accept-Item
        description: This is an optional header. If not present then items of type
          application/vnd.sas.device.history.record+json;version=1 are returned.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.device.history.record+json;version=1
          - application/vnd.sas.device.history.record+json
          - application/json
          default: application/vnd.sas.device.history.record+json;version=1
      - name: excludeDeviceHistory
        in: query
        required: false
        description: When device history is to be excluded, the list will only include
          the most recent server connection attempt for each **deviceId / userId**
          combination utilizing the mobile application.
        schema:
          type: boolean
          default: false
      - name: start
        in: query
        description: 0-based offset of the first item to return.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Maximum number of items to return.
        required: false
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the items. The history record attributes
          that can be used for filtering are **application, deviceId, deviceModel,
          deviceType, timeStamp, state, osVersion,** and **userId**. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/deviceManagement-v3/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the items. The history record attributes
          that can be used for sorting are **application, deviceId, deviceModel, deviceType,
          timeStamp, state, osVersion,** and **userId**. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/deviceManagement-v3/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK. The collection returned can be empty.
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.device.history.record+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/lastAccess"
              examples:
                json:
                  $ref: "#/components/examples/responseGetLastAccess"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/lastAccess"
              examples:
                json:
                  $ref: "#/components/examples/responseGetLastAccess"
            application/json:
              schema:
                $ref: "#/components/schemas/lastAccess"
              examples:
                json:
                  $ref: "#/components/examples/responseGetLastAccess"
        "400":
          description: Bad Request<br> Unsupported filter function.<br> Invalid filter
            argument or syntax.<br> excludeDeviceHistory is invalid.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetLastAccessBadRequest"
        "403":
          description: Forbidden. Only accessible to those users who are allowed to
            **Manage Mobile Devices**.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetLastAccessForbidden"
    post:
      summary: Add a single device history record to last access history
      description: Add a single device history record (application/vnd.sas.device.history.record)
        to last access history. If a record is found with the same **userId / deviceId
        / application / osVersion** combination, the **timeStamp** and **state** fields
        are updated to reflect the new access attempt to the server. Note Since the
        mobile client app needs to **POST** unsuccessful logon attempts, user authentication
        is not required to perform this action.
      operationId: createInLastAccess
      tags:
      - LastAccess
      requestBody:
        content:
          application/vnd.sas.device.history.record+json;version=1:
            schema:
              $ref: "#/components/schemas/historyRecord"
            examples:
              json:
                $ref: "#/components/examples/requestCreateInLastAccess"
          application/vnd.sas.device.history.record+json:
            schema:
              $ref: "#/components/schemas/historyRecord"
            examples:
              json:
                $ref: "#/components/examples/requestCreateInLastAccess"
          application/json:
            schema:
              $ref: "#/components/schemas/historyRecord"
            examples:
              json:
                $ref: "#/components/examples/requestCreateInLastAccess"
      responses:
        "200":
          description: OK. The existing device history record was updated.
          headers:
            Content-Type:
              description: application/vnd.sas.device.history.record+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.device.history.record+json;version=1:
              schema:
                $ref: "#/components/schemas/historyRecord"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInLastAccess"
            application/vnd.sas.device.history.record+json:
              schema:
                $ref: "#/components/schemas/historyRecord"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInLastAccess"
            application/json:
              schema:
                $ref: "#/components/schemas/historyRecord"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInLastAccess"
        "201":
          description: Created. A copy of the newly created device history record
            that has been added to the last access history is returned. Since the
            method does not create a retrievable object (a single record cannot be
            retrieved from the collection), a Location header is not included in the
            response.
          headers:
            Content-Type:
              description: application/vnd.sas.device.history.record+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.device.history.record+json;version=1:
              schema:
                $ref: "#/components/schemas/historyRecord"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInLastAccess"
            application/vnd.sas.device.history.record+json:
              schema:
                $ref: "#/components/schemas/historyRecord"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInLastAccess"
            application/json:
              schema:
                $ref: "#/components/schemas/historyRecord"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInLastAccess"
        "304":
          description: Not Modified. A device history record for the provided deviceId/userId/application/osVersion
            combination was found in the database, but its timeStamp is newer than
            the timeStamp of the supplied device history record. The existing device
            history record was not modified. (**Deprecated**)
        "400":
          description: Bad Request<br> The request body was missing or invalid.<br>
            {member} is required (deviceId, userId, application, osVersion, state).<br>
            {member} is too long (userId, application, osVersion, deviceModel, deviceType,
            timeStamp).<br> {member} is invalid (deviceId, userId, application, osVersion,
            deviceModel, deviceType, timeStamp).<br> Device id is too long.<br> Device
            id contains an invalid character - /, \\, \#, and ? are not allowed.<br>
            Invalid state (!logonSucceeded, !logonFailed, !denylisted, !notAllowlisted).
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInLastAccessBadRequest"
  "/authorizedDevices/{deviceId}":
    head:
      tags:
      - AuthorizedDevices
      summary: Get the headers associated with an authorized device on the server
      operationId: headersForAuthorizedDevice
      description: "If the device is not found, then it is not authorized on the server.\
        \ If denylist support is enabled on the server, a device is authorized if\
        \ it is not in the denylist. Else if allowlist support is enabled on the server,\
        \ a device is authorized if it is included in the allowlist. {deviceId} must\
        \ be a valid device ID, previously supplied by the mobile client. Note: Since\
        \ the mobile client app needs to determine whether a device can communicate\
        \ with the server prior to logon, user authentication is not required to perform\
        \ this action. This link should be URL encoded to allow any special chars\
        \ that may have been included in {deviceId}."
      parameters:
      - name: deviceId
        in: path
        description: The Id of the device
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK. The device is authorized on the server.
          headers:
            Content-Type:
              description: application/vnd.sas.device+json;version=1
              schema:
                type: string
        "404":
          description: Not Found. The device is not authorized on the server.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
    get:
      tags:
      - AuthorizedDevices
      summary: Is the device authorized on the server?
      operationId: getAuthorizedDevice
      description: "Get this device from the list of authorized devices. If the device\
        \ is not found, then it is not authorized on the server. If denylist support\
        \ is enabled on the server, a device is authorized if it is not in the denylist.\
        \ Else if allowlist support is enabled on the server, a device is authorized\
        \ if it is included in the allowlist. {deviceId} must be a valid device ID,\
        \ previously supplied by the mobile client. Note: Since the mobile client\
        \ app needs to determine whether a device can communicate with the server\
        \ prior to logon, user authentication is not required to perform this action.\
        \ This link should be URL encoded to allow any special chars that may have\
        \ been included in {deviceId}."
      parameters:
      - name: deviceId
        in: path
        description: The Id of the device
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK. The device is authorized on the server.
          headers:
            Content-Type:
              description: application/vnd.sas.device+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.device+json;version=1:
              schema:
                $ref: "#/components/schemas/device"
              examples:
                json:
                  $ref: "#/components/examples/responseGetAuthorizedDevice"
            application/vnd.sas.device+json:
              schema:
                $ref: "#/components/schemas/device"
              examples:
                json:
                  $ref: "#/components/examples/responseGetAuthorizedDevice"
            application/json:
              schema:
                $ref: "#/components/schemas/device"
              examples:
                json:
                  $ref: "#/components/examples/responseGetAuthorizedDevice"
        "404":
          description: Not Found. The device is not authorized on the server.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetAuthorizedDeviceNotFound"
  /commons/settings:
