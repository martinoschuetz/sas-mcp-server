                  $ref: "#/components/examples/responseGetCommonsSettings"
            application/vnd.sas.attributes+json:
              schema:
                $ref: "#/components/schemas/attributes"
              examples:
                json:
                  $ref: "#/components/examples/responseGetCommonsSettingsAdmin"
                json1:
                  $ref: "#/components/examples/responseGetCommonsSettings"
            application/json:
              schema:
