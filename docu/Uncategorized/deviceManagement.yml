                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetAllowlistedDeviceForbidden"
        "404":
          description: Not Found. The device is not present in the allowlist.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetAllowlistedDeviceNotFound"
    delete:
