components:
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error:
      $ref: "#/components/schemas/error2"
    attributes:
      title: Attributes
      description: Contains a set of attributes in the form of a map from string names
        to arbitrary values. The values may be strings, numbers, booleans, arrays,
        objects or null.
      x-sas-media-type:
        name: application/vnd.sas.attributes
        version: 1
      required:
      - version
      - attributes
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        description:
          type: string
          description: A description of the set of attributes.
        label:
          type: string
          description: A brief description or label for the set of attributes.
        attributes:
          type: object
          description: 'The map of attribute names to values.  The set of names is
            open, though individual services may define a closed set needed for a
            given resource in that service. The value of each attribute may be of
            types: number, string, boolean, array, or object.  Although property this
            is required, the mapping object can be empty, unless stated otherwise
            by specific documentation for resources where the application/vnd.sas.attributes
            type is used.'
          additionalProperties: true
        links:
          description: Links to associated resources and operations. APIs may provide
            links for the link relations `self', `update` (to replace the attributes),
            `patch` (to update some attributes) or others.
          type: array
          items:
            $ref: "#/components/schemas/link"
    baseCollection:
      $ref: "#/components/schemas/baseCollection2"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    denylist:
      title: The denylist collection
      description: A collection of denylisted devices
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: The array of device representations.
            items:
              $ref: "#/components/schemas/device"
    allowlist:
      title: The allowlist collection
      description: A collection of allowlisted devices
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: The array of device representations.
            items:
              $ref: "#/components/schemas/device"
    lastAccess:
      title: The collection of the device history records
      description: A collection of the device history records that represent the most
        recent server connection attempt for all unique userIid / application / mobile
        device configurations utilizing the mobile application.
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: The array of device history record representations.
            items:
              $ref: "#/components/schemas/historyRecord"
    device:
      title: Describes a managed mobile device on the server.
      description: This is used both for device retrieval and as input when adding
        to the denylist and allowlist collections.
      required:
      - id
      properties:
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: string
          description: The client provided unique ID for the mobile device. It is
            the responsibility of the client to enforce a unique id for each device
            that is to be managed by the API. If a device id is not unique, manipulating
            the denylist and/or allowlist collections may result in unexpected failures.
            In addition, the records (application/vnd.sas.device.history.record) in
            the lastAccess collection may be improperly overwritten. Typically, a
            client obtains a unique device id by utilizing the device operating system
            SDK.
          maxLength: 36
        links:
          type: array
          description: Zero or more links to related resources or operations.
          items:
            $ref: "#/components/schemas/link"
    historyRecord:
      title: Describes the information associated with a mobile device's attempt to
        access the server.
      description: This is used for both retrieving and adding to the device history.
      required:
      - application
      - deviceId
      - state
      - osVersion
      - userId
      properties:
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 1.
        application:
          type: string
          description: The application running on the mobile device. The expected
            format is "application-name version-number [(tag)]", where (tag) is optional.
          maxLength: 100
        deviceId:
          type: string
          description: The unique identifier of the mobile device. It is the responsibility
            of the client to enforce a unique id for each device that is to be managed
            by the API. If a device id is not unique, manipulating the denylist and/or
            allowlist collections may result in unexpected failures. In addition,
            the records (application/vnd.sas.device.history.record) in the lastAccess
            collection may be improperly overwritten. Typically, a client obtains
            a unique device id by utilizing the device operating system SDK.
          maxLength: 36
        deviceModel:
          type: string
          description: The model of the mobile device.
          maxLength: 100
        deviceType:
          type: string
          description: The type of the mobile device.
          maxLength: 100
        timeStamp:
          type: string
          format: date-time
          description: The date and time that the mobile device attempted to access
            the server in GMT, ISO 8601 format (yyyy-MM-dd'T'HH:mm:ss.SSS'Z'). This
            member is ignored during input since it is written new at persistence.
          maxLength: 24
        state:
          type: string
          description: A client provided state indicating the outcome of the mobile
            device's attempt to access the server.
          enum:
          - logonSucceeded
          - logonFailed
          - denylisted
          - notAllowlisted
        osVersion:
          type: string
          description: The operating system version of the mobile device.
          maxLength: 100
        userId:
          type: string
          description: The userId associated with the mobile device that is attempting
            access to the server.
          maxLength: 36
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
