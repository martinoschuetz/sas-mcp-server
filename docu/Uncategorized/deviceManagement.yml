---
openapi: 3.0.3
info:
  title: Device Management
  version: "3"
  description: >
    Maintains the denylist or allowlist for mobile devices, controls which
    security model (denylist or allowlist) is in effect, and persists
    information about each device's last access.
    This API is deprecated as of 2026.02 and will be removed in a future release.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: http://example.com/deviceManagement
  description: example server
tags:
- name: Root
  description: The API root.
- name: Denylist
  description: The operations for the denylist resource.
- name: Allowlist
  description: The operations for the allowlist resource.
- name: LastAccess
  description: The operations for the device history records.
- name: AuthorizedDevices
  description: The operations for the authorized devices resource.
- name: Settings
  description: The operations for the settings.
paths:
  /:
    head:
      tags:
      - Root
      summary: Get the headers associated with the top-level resources and operations
        in the service
      description: >
        For more details on the returned top-level resources, see <a
        href="#RootLinkRelations">Root Link Relations table</a>.
      operationId: headersForRoot
      responses:
        "200":
          description: OK. The service's links are returned.
          headers:
            Content-Type:
              description: application/vnd.sas.api+json;version=1
              schema:
                $ref: "#/components/schemas/api"
    get:
      tags:
      - Root
      summary: Get the set of links to the top-level resources and operations in the
        service
      description: >
        For more details on the returned top-level resources, see <a
        href="#RootLinkRelations">Root Link Relations table</a>.
      operationId: root
      responses:
        "200":
          description: OK. The service's links are returned.
          headers:
            Content-Type:
              description: application/vnd.sas.api+json;version=1
              schema:
                $ref: "#/components/schemas/api"
          content:
            application/vnd.sas.api+json;version=1:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/responseGetRootAdmin"
                json1:
                  $ref: "#/components/examples/responseGetRoot"
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/responseGetRootAdmin"
                json1:
                  $ref: "#/components/examples/responseGetRoot"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/responseGetRootAdmin"
                json1:
                  $ref: "#/components/examples/responseGetRoot"
  /denylist:
    head:
      summary: Get the headers associated with the denylist collection
      description: Get the headers associated with the denylist collection.
      operationId: headersForDenylist
      tags:
      - Denylist
      parameters:
      - name: Accept-Item
        description: This is an optional header. If not present then items of type
          application/vnd.sas.device+json;version=1 are returned.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.device+json;version=1
          - application/vnd.sas.device+json
          - application/json
          default: application/vnd.sas.device+json;version=1
      - name: start
        in: query
        description: 0-based offset of the first item to return.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Maximum number of items to return.
        required: false
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the items. The device attribute that
          can be used for filtering is **id**. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/deviceManagement-v3/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the items. The device attribute that
          can be used for sorting is **id**. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/deviceManagement-v3/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK. The collection returned can be empty.
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.device+json;version=1
              schema:
                type: string
        "403":
          description: Forbidden. Only accessible to those users who are allowed to
            **Manage Mobile Devices**.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
    get:
      summary: Get a collection of the devices in the denylist
      description: Returns a collection of devices with standard paging, filtering,
        and sorting options.
      operationId: getDenylist
      tags:
      - Denylist
      parameters:
      - name: Accept-Item
        description: This is an optional header. If not present then items of type
          application/vnd.sas.device+json;version=1 are returned.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.device+json;version=1
          - application/vnd.sas.device+json
          - application/json
          default: application/vnd.sas.device+json;version=1
      - name: start
        in: query
        description: 0-based offset of the first item to return.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Maximum number of items to return.
        required: false
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the items. The device attribute that
          can be used for filtering is **id**. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/deviceManagement-v3/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the items. The device attribute that
          can be used for sorting is **id**. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/deviceManagement-v3/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK. The collection returned can be empty.
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.device+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/denylist"
              examples:
                json:
                  $ref: "#/components/examples/responseGetDenylist"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/denylist"
              examples:
                json:
                  $ref: "#/components/examples/responseGetDenylist"
            application/json:
              schema:
                $ref: "#/components/schemas/denylist"
              examples:
                json:
                  $ref: "#/components/examples/responseGetDenylist"
        "400":
          description: Bad Request. Unsupported filter function or Invalid filter
            argument or syntax.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetDenylistBadRequest"
        "403":
          description: Forbidden. Only accessible to those users who are allowed to
            **Manage Mobile Devices**.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetDenylistForbidden"
    post:
      summary: Add a single device (application/vnd.sas.device) to the denylist
      description: Add a device to the denylist.
      operationId: createInDenylist
      tags:
      - Denylist
      requestBody:
        content:
          application/vnd.sas.device+json;version=1:
            schema:
              $ref: "#/components/schemas/device"
            examples:
              json:
                $ref: "#/components/examples/requestCreateInList"
          application/vnd.sas.device+json:
            schema:
              $ref: "#/components/schemas/device"
            examples:
              json:
                $ref: "#/components/examples/requestCreateInList"
          application/json:
            schema:
              $ref: "#/components/schemas/device"
            examples:
              json:
                $ref: "#/components/examples/requestCreateInList"
      responses:
        "201":
          description: Created. The device was added to the denylist.
          headers:
            Content-Type:
              description: application/vnd.sas.device+json;version=1
              schema:
                type: string
            Location:
              description: The location header will include the URI that can be used
                to retrieve the device in the denylist. This URI is equivalent to
                the self link returned in the response body.
              schema:
                type: string
          content:
            application/vnd.sas.device+json;version=1:
              schema:
                $ref: "#/components/schemas/device"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInDenylist"
            application/vnd.sas.device+json:
              schema:
                $ref: "#/components/schemas/device"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInDenylist"
            application/json:
              schema:
                $ref: "#/components/schemas/device"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInDenylist"
        "400":
          description: Bad Request<br> The request body was missing or invalid.<br>
            Device id is empty.<br> Device id is too long.<br> Device id contains
            an invalid character - /, \\, \#, and ? are not allowed.<br> Device id
            is invalid.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInDenylistBadRequest"
        "403":
          description: Forbidden. Only accessible to those users who are allowed to
            **Manage Mobile Devices**.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInDenylistForbidden"
        "409":
          description: Conflict. The device is already in the denylist.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateInDenylistConflict"
  "/denylist/{deviceId}":
    head:
      tags:
      - Denylist
      summary: Get the headers associated with a device in the denylist
      description: Note {deviceId} must be a valid device ID, previously supplied
        by the mobile client. This link should be URL encoded to allow any special
        chars that may have been included in {deviceId}.
      operationId: headersForDenylistedDevice
      parameters:
      - name: deviceId
        in: path
        description: The Id of the device
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK. The device was found.
          headers:
            Content-Type:
              description: application/vnd.sas.device+json;version=1
              schema:
                type: string
        "403":
          description: Forbidden. Only accessible to those users who are allowed to
            **Manage Mobile Devices**.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
        "404":
          description: Not Found. The device is not present in the denylist.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
    get:
      tags:
      - Denylist
      summary: Get a device in the denylist
      description: Get this device from the denylist. Note {deviceId} must be a valid
        device ID, previously supplied by the mobile client. This link should be URL
        encoded to allow any special chars that may have been included in {deviceId}.
      operationId: getDenylistedDevice
      parameters:
      - name: deviceId
        in: path
        description: The Id of the device
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK. The device was found.
          headers:
            Content-Type:
              description: application/vnd.sas.device+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.device+json;version=1:
              schema:
                $ref: "#/components/schemas/device"
              examples:
                json:
                  $ref: "#/components/examples/responseGetDenylistedDevice"
            application/vnd.sas.device+json:
              schema:
                $ref: "#/components/schemas/device"
              examples:
                json:
                  $ref: "#/components/examples/responseGetDenylistedDevice"
            application/json:
              schema:
                $ref: "#/components/schemas/device"
              examples:
                json:
                  $ref: "#/components/examples/responseGetDenylistedDevice"
        "403":
          description: Forbidden. Only accessible to those users who are allowed to
            **Manage Mobile Devices**.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetDenylistedDeviceForbidden"
        "404":
          description: Not Found. The device is not present in the denylist.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetDenylistedDeviceNotFound"
    delete:
      summary: Remove this device from the denylist
      description: Deletes the given device from the denylist. Note {deviceId} must
        be a valid device ID, previously supplied by the mobile client. This link
        should be URL encoded to allow any special chars that may have been included
        in {deviceId}.
      operationId: deleteFromDenylist
      tags:
      - Denylist
      parameters:
      - name: deviceId
        in: path
        description: The Id of the device
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "204":
          description: No Content. the device was successfully deleted.
        "403":
          description: Forbidden. Only accessible to those users who are allowed to
            **Manage Mobile Devices**.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteFromDenylistForbidden"
        "404":
          description: Not Found. The device is not present in the denylist.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteFromDenylistNotFound"
