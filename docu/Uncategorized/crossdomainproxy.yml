---
openapi: 3.0.3
info:
  version: "1"
  title: Crossdomainproxy
  description: >
    The crossdomainproxy exposes a single endpoint that fetches content from a specified
    destination URL.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/crossdomainproxy
  description: local mock server
paths:
  /:
    get:
      operationId: root
      summary: Relay content from specified destination URL
      description: Relay content from a specified destination URL.
      parameters:
      - $ref: "#/components/parameters/destUrl"
      responses:
        default:
          $ref: "#/components/responses/defaultResponse"
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
    head:
      operationId: headersForRoot
      summary: Relay content from specified destination URL
      description: Relay content from a specified destination URL.
      parameters:
      - $ref: "#/components/parameters/destUrl"
      responses:
        default:
          $ref: "#/components/responses/defaultResponse"
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
    post:
      operationId: postRoot
      summary: Relay content from specified destination URL
      description: Relay content from a specified destination URL.
      parameters:
      - $ref: "#/components/parameters/destUrl"
      responses:
        default:
          $ref: "#/components/responses/defaultResponse"
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
    put:
      operationId: updateRoot
      summary: Relay content from specified destination URL
      description: Relay content from a specified destination URL.
      parameters:
      - $ref: "#/components/parameters/destUrl"
      responses:
        default:
          $ref: "#/components/responses/defaultResponse"
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
    patch:
      operationId: patchRoot
      summary: Relay content from specified destination URL
      description: Relay content from a specified destination URL.
      parameters:
      - $ref: "#/components/parameters/destUrl"
      responses:
        default:
          $ref: "#/components/responses/defaultResponse"
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
    delete:
      operationId: deleteRoot
      summary: Relay content from specified destination URL
      description: Relay content from a specified destination URL.
      parameters:
      - $ref: "#/components/parameters/destUrl"
      responses:
        default:
          $ref: "#/components/responses/defaultResponse"
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
components:
  parameters:
    destUrl:
      name: sas-commons-destUrl
      in: query
      description: Destination URL to call
      required: true
      schema:
        type: string
  schemas:
    error:
      $ref: "#/components/schemas/error2"
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
  responses:
    defaultResponse:
      description: The response code, headers, and content returned by the specified
        destination URL.
    "400":
      description: One or more arguments is invalid.
      headers:
        Content-Type:
          description: application/vnd.sas.error+json
          schema:
            type: string
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          examples:
            missingParameter:
              value: {"version": 2, "httpStatusCode": 400, "message": "Bad Request",
                "details": ['You must specify the request parameter "sas-commons-destUrl".',
                  "path: /crossdomainproxy/", "correlator: a711bf91-32c1-4539-b6e7-cf33e13412a2"]}
            wrongProtocol:
              value: {"version": 2, "httpStatusCode": 400, "message": "Bad Request",
                "details": ["Destination url must use http(s) scheme.", "path: /crossdomainproxy/",
                  "correlator: e4e3701e-6392-45ef-b3a2-baf3ba063a42"]}
    "403":
      description: The requested destination URL is forbidden.
      headers:
        Content-Type:
          description: application/vnd.sas.error+json
          schema:
            type: string
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example: {"version": 2, "httpStatusCode": 403, "message": "Forbidden", "details": [
              "The following URL cannot be accessed because it is not authorized:\
                \ https://www.wikipedia.org. To gain access to the site, please ask\
                \ your SAS Administrator to add the URL to the allowlist.", "path:\
                \ /crossdomainproxy/", "correlator: 6abc86c0-51da-4b40-97ac-c8700be0eee0"]}
