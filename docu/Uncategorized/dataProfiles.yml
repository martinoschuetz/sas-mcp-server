---
openapi: 3.0.3
info:
  description: "<b>This API is deprecated as of 2022.09 (stable and LTS) and will\
    \ be removed from future release. </b><br> This API manages definitions of profile\
    \ jobs and retrieval of profiles described by definitions.  <br>There are two\
    \ general areas for this API  <ul><li>Definitions: Data sources, table names and\
    \ column names used to generate a profile. </li><li>Profiles: Profile  results\
    \ containing profiling information for definitions, tables and columns.</li></ul>\
    \  In general terms, a user describes what should be profiled by using the endpoints\
    \ appearing in the definition portion of this interface.  The definition is then\
    \ provided to the Job Execution Service, which runs the profile operation. The\
    \ result is a Profile with associated ProfiledTables and ProfiledColumns (each\
    \ of which have associated metrics); these results can be retrieved with endpoints\
    \ appearing in the profile portion  of the interface."
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  version: "2"
  title: Data Profiles
  license:
    name: SAS Institute
tags:
- name: Root
  description: The root of the dataProfiles API.
- name: Definitions
  description: Define a Data Profile definition.
- name: Definition Tables
  description: Manage tables for a definition.
- name: Definition Columns
  description: Manage columns for a definition.
- name: Profiles
  description: Set and retrieve Data Profiles generated by a processing a definition.
- name: Profiled Tables
  description: Set and retrieve profiled tables generated by a processing a definition.
- name: Profiled Columns
  description: Set and retrieve profiled columns generated by a processing a definition.
- name: Profiled Column Metrics
  description: Set and retrieve profiled column metrics generated by a processing
    a definition.
- name: Jobs
  description: Support callbacks from the Job Execution Service.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level collections surfaced through
        this API. These top level links include relations definitions, createDefinition,
        profiles, profiledTables and profiledColumns.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/api"
    head:
      tags:
      - Root
      summary: Check if the Data Profile service is available
      description: Returns whether or not the data profile service is running.
      operationId: headersForRoot
      responses:
        "200":
          description: OK.  Service is running and available
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
  /definitions:
    get:
      tags:
      - Definitions
      summary: Get a collection of definitions
      description: Returns a collection of definitions as summary objects (the default)
        or full objects. Standard paging, filtering, and sorting options are provided.
      operationId: getDefinitions
      parameters:
      - name: Accept-Item
        in: header
        description: Requested representation of the definition items in the collection.  Media
          type application/vnd.sas.data.profile.definition.summary+json is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.profile.definition.summary+json
          - application/vnd.sas.data.profile.definition+json
          - application/json
      - name: start
        in: query
        description: 0-based Offset of first definition to return.  Defaults to 0.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of definitions to return.  Defaults to 100.
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: "The criteria for sorting the definitions. See [Sorting in REST\
          \ APIs](https://developer.sas.com/apis/rest/Topics/#sorting).  <br>The default\
          \ sort order is name:ascending.  <br>Sorting can use the following fields:\
          \  <ul><li>createdBy</li><li>creationTimeStamp</li><li>dataSource</li><li>description</li><li>id</li><li>modifiedBy</li><li>modifiedTimeStamp</li><li>name</li><li>tableCount</li></ul> "
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: "The criteria for filtering the definitions. See [Filtering in\
          \ REST APIs](https://developer.sas.com/apis/rest/Topics/#filters). <br>Filters\
          \ can use the following fields:.  <ul><li>createdBy</li><li>creationTimeStamp</li><li>dataSource</li><li>description</li><li>id</li><li>modifiedBy</li><li>modifiedTimeStamp</li><li>name</li><li>tableCount</li></ul>"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Returns the list of definitions. Either definitionCollection
            or definitionSummaryCollection will be returned depending on the value
            of Accept-Item header.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                definitionCollection:
                  $ref: "#/components/examples/definitionCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                definitionCollection:
                  $ref: "#/components/examples/definitionCollection"
        "400":
          description: An Invalid filter or combination of request parameters was
            provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
    post:
      tags:
      - Definitions
      summary: Create a definition
      description: Create a definition by specifying a name, data source and optional
        description. See the definition media type for a discussion of the parameters
        field.
      operationId: createDefinition
      requestBody:
        content:
          application/vnd.sas.data.profile.definition+json:
            schema:
              $ref: "#/components/schemas/editDefinition"
            examples:
              editDefinition:
                $ref: "#/components/examples/editDefinition"
          application/json:
            schema:
              $ref: "#/components/schemas/editDefinition"
            examples:
              editDefinition:
                $ref: "#/components/examples/editDefinition"
        description: Supply the name, data source and a description of the definition.
          Note that the datasource must be accessible for this operation to succeed;
          if it is not accessible, a 400 response is returned.
        required: true
      responses:
        "201":
          description: New definition created
          headers:
            Location:
              description: The URI of the definition
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.profile.definition+json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                definition:
                  $ref: "#/components/examples/definition"
            application/json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                definition:
                  $ref: "#/components/examples/definition"
        "400":
          description: Invalid input
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
  "/definitions/{definitionId}":
    get:
      tags:
      - Definitions
      summary: Get a definition
      description: Returns a full representation of the definition.
      operationId: getDefinition
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the definition item.  Media type
          application/vnd.sas.data.profile.definition+json is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.profile.definition.summary+json
          - application/vnd.sas.data.profile.definition+json
          - application/json
      - name: definitionId
        in: path
        description: Definition id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Returns the definition
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/vnd.sas.data.profile.definition+json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                definition:
                  $ref: "#/components/examples/definition"
            application/vnd.sas.data.profile.definition.summary+json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                definition:
                  $ref: "#/components/examples/definition"
            application/json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                definition:
                  $ref: "#/components/examples/definition"
        "404":
          description: Definition does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
    head:
      tags:
      - Definitions
      summary: Check the existence of a definition
      description: Returns a status and headers indicating whether the definition
        exists or not.
      operationId: headersForDefinition
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the definition item.  Media type
          application/vnd.sas.data.profile.definition+json is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.profile.definition.summary+json
          - application/vnd.sas.data.profile.definition+json
          - application/json
      - name: definitionId
        in: path
        description: Definition id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Definition exists
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
        "404":
          description: Definition does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
    put:
      tags:
      - Definitions
      summary: Update a definition
      description: Update the name and data source of a definition. The id field is
        ignored. See the definition media type for a discussion of the parameters
        field.
      operationId: updateDefinition
      parameters:
      - name: definitionId
        in: path
        description: Definition id
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header.  Must match the current entity tag for the Definition.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.data.profile.definition+json:
            schema:
              $ref: "#/components/schemas/editDefinition"
            examples:
              editDefinition:
                $ref: "#/components/examples/editDefinition"
          application/json:
            schema:
              $ref: "#/components/schemas/editDefinition"
            examples:
              editDefinition:
                $ref: "#/components/examples/editDefinition"
        description: Definition to update
        required: true
      responses:
        "200":
          description: Definition updated
          headers:
            ETag:
              description: The entity tag for the Definition.
              schema:
                type: string
          content:
            application/vnd.sas.data.profile.definition+json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                definition:
                  $ref: "#/components/examples/definition"
            application/json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                definition:
                  $ref: "#/components/examples/definition"
        "400":
          description: Malformed JSON body, or invalid request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
        "404":
          description: Definition does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
        "412":
          description: The ETag provided does not match the current version of the
            object, or the last modified date doesn't match.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
        "428":
          description: The ETag was not provided when updating an existing type.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
    delete:
      tags:
      - Definitions
      summary: Delete a definition
      description: Deletes a definition and any related source table, source column,
        profile, profiled table, and profiled column information associated with this
        definition.
      operationId: deleteDefinition
      parameters:
      - name: definitionId
        in: path
        description: Definition id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Definition deleted
        "404":
          description: Definition does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
  "/definitions/{definitionId}/effectiveTables":
    get:
      tags:
      - Definition Tables
      summary: Get a collection of tables to be profiled
      description: Returns a collection of tables that will be profiled. The list
        of source tables associated with the definition will be examined; If there
        are no source tables in the definition, the definition's dataSource will  be
        scanned for tables. Standard sorting, filtering, and paging options are provided.
        Only tables that are accessible to the current principal are returned.
      operationId: getEffectiveTables
      parameters:
      - name: definitionId
        in: path
        description: Definition id
        required: true
        schema:
          type: string
      - name: Accept-Item
        in: header
        description: Requested representation of the definition items in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.profile.source.table+json;version=2
          - application/vnd.sas.data.profile.source.table+json;version=1
          - application/vnd.sas.data.profile.source.table+json
          - application/json
          default: application/vnd.sas.data.profile.source.table+json;version=2
      - name: start
        in: query
        description: 0-based Offset of first source table to return.  Defaults to
          0.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of source tables to return.  Defaults to 100.
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: "The criteria for sorting the tables. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).\
          \   <br>The default sort order is tableUri:ascending.  <br>Sorting can use\
          \ the following fields:  <ul><li>applyFormat</li><li>columnCount</li><li>definitionId</li><li>id</li><li>tableUri</li></ul> "
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: "The criteria for filtering the tables. See [Filtering in REST\
          \ APIs](https://developer.sas.com/apis/rest/Topics/#filters).  <br>Filters\
          \ can use the following fields: <ul><li>applyFormat</li><li>columnCount</li><li>definitionId</li><li>id</li><li>tableUri</li></ul>."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Returns the list of tables that will be profiled.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/effectiveTableCollection"
              examples:
                effectiveTableCollection:
                  $ref: "#/components/examples/effectiveTableCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/effectiveTableCollection"
              examples:
                effectiveTableCollection:
                  $ref: "#/components/examples/effectiveTableCollection"
        "400":
          description: An Invalid filter or combination of request parameters was
            provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
        "404":
          description: Definition does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
  "/definitions/{definitionId}/tables":
    get:
      tags:
      - Definition Tables
      summary: Get a collection of table references
      description: Returns a collection of source table objects. Standard paging,
        filtering, and sorting options are provided.
      operationId: getSourceTables
      parameters:
      - name: Accept-Item
        in: header
        description: Requested representation of the source tables in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.profile.source.table+json;version=2
          - application/vnd.sas.data.profile.source.table+json;version=1
          - application/vnd.sas.data.profile.source.table+json
          - application/json
          default: application/vnd.sas.data.profile.source.table+json;version=2
      - name: definitionId
        in: path
        description: Definition id
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: 0-based Offset of first source table to return.  Defaults to
          0.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of source tables to return.  Defaults to 100.
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: "The criteria for sorting the source tables. See [Sorting in\
          \ REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).  <br>The\
          \ default sort order is tableUri:ascending. <br>Sorting can use the following\
          \ fields:  <ul><li>applyFormat</li><li>columnCount</li><li>definitionId</li><li>id</li><li>tableUri</li></ul>"
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: "The criteria for filtering the source tables. See [Filtering\
          \ in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters). <br>Filters\
          \ can use the following fields: <ul><li>applyFormat</li><li>columnCount</li><li>definitionId</li><li>id</li><li>tableUri</li></ul>."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Returns the profile tables
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/sourceTableCollection"
              examples:
                sourceTableCollection:
                  $ref: "#/components/examples/sourceTableCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/sourceTableCollection"
              examples:
                sourceTableCollection:
                  $ref: "#/components/examples/sourceTableCollection"
        "400":
          description: An Invalid filter or combination of request parameters was
            provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
        "404":
          description: Definition does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
    put:
      tags:
      - Definition Tables
      summary: Manage table references to a definition
      description: Replace a list of source tables with a new list.  An empty collection
        clears the list. Any PUT operation to /definitions/{definitionId}/tables will
        result in an update to the modifiedBy, modifiedTimeStamp, and the effective
        ETag of the parent definition.
      operationId: updateSourceTable
      parameters:
      - name: Accept-Item
        in: header
        description: Requested representation of the source tables in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.profile.source.table+json;version=2
          - application/vnd.sas.data.profile.source.table+json;version=1
          - application/vnd.sas.data.profile.source.table+json
          - application/json
          default: application/vnd.sas.data.profile.source.table+json;version=2
      - name: Content-Item-Type
        in: header
        description: Requested representation of the source tables in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.profile.source.table+json;version=2
          - application/vnd.sas.data.profile.source.table+json;version=1
          - application/vnd.sas.data.profile.source.table+json
          - application/json
          default: application/vnd.sas.data.profile.source.table+json;version=2
      - name: definitionId
        in: path
        description: Definition id
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header.  Must match the current entity tag for the parent Definition.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/createSourceTableCollection"
            examples:
              createSourceTableCollection:
                $ref: "#/components/examples/createSourceTableCollection"
          application/json:
            schema:
              $ref: "#/components/schemas/createSourceTableCollection"
            examples:
              createSourceTableCollection:
                $ref: "#/components/examples/createSourceTableCollection"
        description: Table references to be created and stored
        required: true
      responses:
        "200":
          description: Operation succeeded
          headers:
            ETag:
              description: A tag that identifies this revision of the parent definition.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/sourceTableCollection"
              examples:
                sourceTableCollection:
                  $ref: "#/components/examples/sourceTableCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/sourceTableCollection"
              examples:
                sourceTableCollection:
                  $ref: "#/components/examples/sourceTableCollection"
        "201":
          description: New profile tables created
          headers:
            ETag:
              description: A tag that identifies this revision of the parent definition.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/sourceTableCollection"
              examples:
                sourceTableCollection:
                  $ref: "#/components/examples/sourceTableCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/sourceTableCollection"
              examples:
                sourceTableCollection:
                  $ref: "#/components/examples/sourceTableCollection"
        "400":
          description: Invalid input
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
        "404":
          description: Definition does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
        "412":
          description: Precondition failed
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
        "428":
          description: Precondition required
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
  "/definitions/{definitionId}/tables/{tableId}":
    get:
      tags:
      - Definition Tables
      summary: Get a source table from a definition
      description: Returns a full representation of the source table.
      operationId: getSourceTable
      parameters:
      - name: Accept-Item
        in: header
        description: Requested representation of the source tables in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.profile.source.table+json;version=2
          - application/vnd.sas.data.profile.source.table+json;version=1
          - application/vnd.sas.data.profile.source.table+json
          - application/json
          default: application/vnd.sas.data.profile.source.table+json;version=2
      - name: definitionId
        in: path
        description: Definition id
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        description: Table id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Returns the source table
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
