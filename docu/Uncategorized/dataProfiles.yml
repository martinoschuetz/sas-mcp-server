servers:
- url: http://example.com/dataProfiles
  description: This is an example base URL.
components:
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      required:
      - version
      - links
      properties:
        links:
          $ref: "#/components/schemas/links"
        version:
          format: int32
          type: integer
          description: The version of the media-type that represents this API.
    editDefinition:
      title: Definition (used for create and update operations)
      type: object
      required:
      - dataSource
      - name
      - version
      properties:
        version:
          type: integer
          format: int32
          description: The version number of the Definition representation. 1 is the
            only supported version.
        dataSource:
          type: string
          description: "Data source.  If the definition contains no table sources\
            \ the data source will be  scanned for tables. The datasource must refer\
            \ to an accessible caslib.  Max length: 1000"
        description:
          type: string
          description: "General definition description. Max length: 1000"
        name:
          type: string
          description: "Name of the definition. Max length: 250"
        parameters:
          type: object
          description: Key/Value parameters for the definition. If parameter 'profileType'
            is set to 'basic', then a small set of metrics are computed; if the parameter
            is set to 'advanced', the complete set of metrics are computed. The value
            'advancedOrBasic' attempts an advanced profile, and then falls back to
            basic if the advanced capabilities are not licensed. See the overview
            for further discussion of keys that can be specified as part of the parameter
            member. Keys and values are maintained when PUT updates the definition
            regardless of the media type version specified.
          additionalProperties:
            type: string
      description: Create a definition with values for user-writable items.
    definition:
      title: Definition
      type: object
      required:
      - dataSource
      - id
      - links
      - name
      - version
      properties:
        version:
          type: integer
          format: int32
          description: The version number of the Definition representation. 1 is the
            only supported version.
        id:
          type: string
          description: "Unique identifier. Max length: 36"
        dataSource:
          type: string
          description: "Data source.  If the definition contains no table sources\
            \ the data source will be  scanned for tables. The datasource must refer\
            \ to an accessible caslib.   Max length: 1000"
        description:
          type: string
          description: "General definition description. Max length: 1000"
        name:
          type: string
          description: "Name of the definition. Max length: 250"
        parameters:
          type: object
          description: Key/Value parameters for the definition. If parameter 'profileType'
            is set to 'basic', then a small set of metrics are computed; if the parameter
            is set to 'advanced', the complete set of metrics are computed. The value
            'advancedOrBasic' attempts an advanced profile, and then falls back to
            basic if the advanced capabilities are not licensed. See the overview
            for further discussion of keys that can be specified as part of the parameters
            member.
          additionalProperties:
            type: string
        createdBy:
          type: string
          description: The user who created this definition.
        creationTimeStamp:
          type: string
          format: date-time
          description: Timestamp of definition creation.
        modifiedBy:
          type: string
          description: The last user to modify this definition.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Timestamp of last modification.
        tableCount:
          type: integer
          format: int32
          description: On return, this will include the total number of tables added
            to this definition.
        links:
          $ref: "#/components/schemas/links"
      description: The top level entity for defining the parameters of a data profile
        execution.
    definitionCollection:
      title: A collection of Definitions
      description: A collection of Definition representations.
      type: object
      properties:
        accept:
          type: string
          description: Accepted media type.
        count:
          type: integer
          format: int64
          description: Number of items in the collection.
        items:
          type: array
          description: The list of definitions
          items:
            $ref: "#/components/schemas/definition"
        limit:
          type: integer
          format: int32
          description: The maximum number of results requested.
        links:
          $ref: "#/components/schemas/links"
        name:
          type: string
          description: A name for the collection.
        start:
          type: integer
          format: int64
          description: The 0-based index of the result candidates to start returning.
        version:
          type: integer
          format: int32
          description: The version number of the collection representation. This representation
            is version 2.
    createSourceTable:
      title: Source Table (used for creating new source tables)
      type: object
      required:
      - tableUri
      properties:
        version:
          type: integer
          format: int32
          description: The version number of the Source Table representation. 2 is
            the default version; version 1 is still supported.
        tableUri:
          type: string
          description: "Uri of the table. The table must be in be accessible from\
            \ the datasource specified in the definition. Max length: 2048"
        applyFormat:
          type: boolean
          description: Flag indicating that formats should be used during profile;
            defaults to false, which uses the raw data.
        threadCount:
          type: integer
          format: int64
          description: Introduced in representation version 2. Thread count.
        promotionParameters:
          type: object
          description: Object that governs promotion of the CAS Action profile results.
            Promotion parameters were introduced with version 2 of this media type.
          properties:
            caslib:
              type: string
              description: Caslib used to store promoted table
            table:
              type: string
              description: Promoted table name
            replace:
              type: boolean
              description: Replace table if necessary. A global table by the same
                name will be dropped; defaults to false (no replacement).
      description: Create a Source Table instance containing these user-writable values.
    createSourceTableCollection:
      title: A collection of create table sources
      description: a collection of Source Table representations.
      type: object
      properties:
        accept:
          type: string
          description: Accepted media type.
        count:
          type: integer
          format: int64
          description: Number of items in the collection.
        items:
          type: array
          description: The list of Tables
          items:
            $ref: "#/components/schemas/createSourceTable"
        limit:
          type: integer
          format: int32
          description: The maximum number of results requested.
        links:
          $ref: "#/components/schemas/links"
        name:
          type: string
          description: A name for the collection.
