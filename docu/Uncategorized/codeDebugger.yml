---
openapi: 3.0.3
info:
  version: "1"
  title: CodeDebugger
  description: |
    The CodeDebugger API provides client access to the SAS engine, <b>CAS</b> and <b>Compute Server</b>, for the purposes of debugging program execution.  Once a session is established, clients are then able to send debugging commands and retrieve their responses.  Most commands return responses immediately.  However, this API allows for asynchronous retrieval of responses when long-running commands are invoked.
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: "devex@sas.com"
servers:
- url: http://example.com/codeDebugger
  description: Sample server URL.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Sessions
  description: Contains the operations for session-related  API.
- name: Commands
  description: Contains the operations for command-related  API.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level resources surfaced through
        this API.
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/rootOutput"
              examples:
                api:
                  $ref: "#/components/examples/rootOutput"
            application/json:
              schema:
                $ref: "#/components/schemas/rootOutput"
              examples:
                api:
                  $ref: "#/components/examples/rootOutput"
        "404":
          description: Service is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
  /sessions:
    get:
      tags:
      - Sessions
      summary: Retrieve a collection of sessions
      operationId: getSessions
      description: |
        Retrieve a collection of sessions that this service is currently managing.  <br> Returned items will be of media type application/vnd.sas.debug.session.  Note, this operation is unreliable in a load-balanced implementation since support for persistence has not been added.  This API is not supported outside of development since it is uncertain if persistence will be added given the desire to be as light-weight as possible.
      parameters:
      - name: start
        in: query
        description: 0-based Offset of first type to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of types to return.  Defaults to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned types. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters)."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "Sort returned types. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)."
        schema:
          type: string
          format: sort-criteria
      - name: If-None-Match
        in: header
        description: Specifies the ETag that is associated with a value of the session
          state.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Success.  A session collection is returned.
          headers:
            Etag:
              description: Entity tag of context.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/sessionCollection"
              examples:
                sessions:
                  $ref: "#/components/examples/sessionCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/sessionCollection"
              examples:
                sessions:
                  $ref: "#/components/examples/sessionCollection"
    post:
      tags:
      - Sessions
      summary: Start a new session
      operationId: createSession
      description: |
        Start a new session.
      requestBody:
        content:
          application/vnd.sas.debug.session+json:
            schema:
              $ref: "#/components/schemas/session"
            examples:
              sessionRequest:
                $ref: "#/components/examples/session"
          application/json:
            schema:
              $ref: "#/components/schemas/session"
            examples:
              sessionRequest:
                $ref: "#/components/examples/session"
      responses:
        "201":
          description: Success.  The session is returned.
          headers:
            Location:
              description: The URI of the newly created type.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.debug.session+json:
              schema:
                $ref: "#/components/schemas/session"
              examples:
                sessionRequest:
                  $ref: "#/components/examples/session"
            application/json:
              schema:
                $ref: "#/components/schemas/session"
              examples:
                sessionRequest:
                  $ref: "#/components/examples/session"
        "400":
          description: "Bad Request.  The request is not properly formed.  This can\
            \ happen if the ResponseType is incorrect."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                sesssion:
                  $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                session:
                  $ref: "#/components/examples/badRequestErrorResponse"
  "/sessions/{sessionId}":
    get:
      tags:
      - Sessions
      summary: Get a session
      operationId: getSession
      description: |
        Retrieve an existing session.
      parameters:
      - name: sessionId
        in: path
        description: The id of the session to retrieve.
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Specifies the ETag that is associated with a value of the session
          state.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Success.  The session is returned.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.debug.session+json:
              schema:
                $ref: "#/components/schemas/session"
              examples:
                session:
                  $ref: "#/components/examples/session"
            application/json:
              schema:
                $ref: "#/components/schemas/session"
              examples:
                session:
                  $ref: "#/components/examples/session"
        "404":
          description: Not Found.  No session with the given id was found.
          content:
            application/vnd.sas.debug.session+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                session:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                session:
                  $ref: "#/components/examples/notFoundErrorResponse"
    head:
      summary: See if a specific session exists
      description: Check to see if a specific codeDebugger session exists
      operationId: headersForSession
      tags:
      - Sessions
      parameters:
      - $ref: "#/components/parameters/SessionIdPathParm"
      - name: If-None-Match
        in: header
        description: Specifies the ETag that is associated with a value of the session
          state.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK - session exists
          headers:
            ETag:
              description: Entity tag of session
              schema:
                type: string
        "404":
          description: Specific session does not exist
  "/sessions/{sessionId}/commands/{command}":
    head:
      tags:
      - Commands
      summary: Check availability of an Command
      operationId: headersForCommand
      description: Retrieves the headers and check the availability of a command.
      parameters:
      - name: sessionId
        in: path
        description: The id of the session to retrieve.
        required: true
        schema:
          type: string
      - name: command
        in: path
        description: The command that was executed.
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Specifies the ETag that is associated with a value of the session
          state.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: success.  The command session is returned.
          headers:
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of this object.
              schema:
                type: string
                format: date-time
        "404":
          description: Not Found.  No command with the given name was found.
          headers:
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of this object.
              schema:
                type: string
                format: date-time
    get:
      tags:
      - Commands
      summary: Get a command response
      operationId: getAsyncResponse
      description: |
        Retrieve the response of an asynchronous command.
      parameters:
      - name: sessionId
        in: path
        description: The id of the session to retrieve.
        required: true
        schema:
          type: string
      - name: command
        in: path
        description: The command that was executed.
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Specifies the ETag that is associated with a value of the session
          state.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Success.  The command response is returned.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.debug.command.response+json:
              schema:
                $ref: "#/components/schemas/commandResponse"
              examples:
                command:
                  $ref: "#/components/examples/commands"
            application/json:
              schema:
                $ref: "#/components/schemas/commandResponse"
              examples:
                command:
                  $ref: "#/components/examples/commands"
        "404":
          description: Not Found.  No session with the given id was found.
          content:
            application/vnd.sas.debug.command.response+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                command:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                command:
                  $ref: "#/components/examples/notFoundErrorResponse"
        "409":
          description: Conflict. A conflict can occur when no asynchronous response
            is found for the requested command.
          content:
            application/vnd.sas.debug.command.response+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                command:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                command:
                  $ref: "#/components/examples/notFoundErrorResponse"
    post:
      tags:
      - Commands
      summary: Send a command
      operationId: createSendCommand
      description: |
        Send a command to the engine.
      parameters:
      - name: sessionId
        in: path
        description: The id of the session to retrieve.
        required: true
        schema:
          type: string
      - name: command
        in: path
        description: The command to execute.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.debug.command.parameters+json:
            schema:
              $ref: "#/components/schemas/commandParameters"
            examples:
              commandRequest:
                $ref: "#/components/examples/commands"
          application/json:
            schema:
              $ref: "#/components/schemas/commandParameters"
            examples:
              commandRequest:
                $ref: "#/components/examples/commands"
      responses:
        "200":
          description: Success.  A complete command response is returned if the command
            is synchronous.  For asynchronous commands a partial response is returned
            with a command status indicating that the command is in-progress.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.debug.command.response+json:
              schema:
                $ref: "#/components/schemas/commandResponse"
              examples:
                command:
                  $ref: "#/components/examples/commands"
            application/json:
              schema:
                $ref: "#/components/schemas/commandResponse"
              examples:
                command:
                  $ref: "#/components/examples/commands"
        "201":
          description: Success.  The command response is returned.
          headers:
            Location:
              description: The URI of the newly created type.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.debug.command.response+json:
              schema:
                $ref: "#/components/schemas/commandResponse"
              examples:
                command:
                  $ref: "#/components/examples/commands"
            application/json:
              schema:
                $ref: "#/components/schemas/commandResponse"
              examples:
                command:
                  $ref: "#/components/examples/commands"
        "400":
          description: Bad Request.  Possible reasons are invalid command, missing
            or invalid parameters.
          content:
            application/vnd.sas.debug.command.response+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                command:
                  $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                command:
                  $ref: "#/components/examples/badRequestErrorResponse"
        "404":
          description: Not Found.  No session with the given id was found.
          content:
            application/vnd.sas.debug.command.response+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                command:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                command:
                  $ref: "#/components/examples/notFoundErrorResponse"
        "409":
          description: Conflict. A conflict can occur when a command is already in-progress
            or the session is not in an active state.
          content:
            application/vnd.sas.debug.command.response+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                command:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                command:
                  $ref: "#/components/examples/notFoundErrorResponse"
components:
  examples:
    rootOutput:
      summary: CodeDebugger API Example Info
      description: Example of all the top-level links provided by the codeDebugger
        API.
      value:
        version: 2
        links:
        - method: GET
          rel: apiMeta
          href: /codeDebugger/
          uri: /codeDebugger/
          type: application/vnd.sas.api
        - method: GET
          rel: sessions
          href: codeDebugger/sessions/
          uri: /codeDebugger/sessions/
          type: application/vnd.sas.collection
        - method: GET
          rel: commands
          href: /codeDebugger/commands/
          uri: /codeDebugger/commands/
          type: application/vnd.sas.debug.command.response
    sessionCollection:
      summary: Example Session collection
      description: Example of a Code Debugger collection object full of session(s).
      value:
        version: 2
        accept: application/vnd.sas.debug.session+json
        count: 1
        start: 1
        limit: 20
        name: sessions
        items:
        - version: 2
          sessionId: coj9ksb48hgaaukfs87g
          connectionString: options DEBUGOPT="debughost=6138332d353639646131633364653834@10.254.165.184
            debugport=45469";
          casConnectionString: sessopts=(DEBUGOPT="debughost=6138332d353639646131633364653834@10.254.165.184
            debugport=45469");
          sessionState:
            state: ActiveWaitingClient
            stateName: Active and awaiting client
            active: true
            scopes:
            - global
            - local
            defaultScope: global
          links:
          - method: GET
            rel: self
            href: /codeDebugger/sessions/coj9ksb48hgaaukfs87g
            uri: /codeDebugger/sessions/coj9ksb48hgaaukfs87g
            type: application/vnd.sas.debug.session
          - method: POST
            rel: sendCommand
            href: /codeDebugger/sessions/coj9ksb48hgaaukfs87g/commands/{command}
            uri: /codeDebugger/sessions/coj9ksb48hgaaukfs87g/commands/{command}
            type: application/vnd.sas.debug.command.response
        links:
        - method: GET
          rel: collection
          href: /codeDebugger/sessions
          uri: /codeDebugger/sessions
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.debug.session
        - method: GET
          rel: self
          href: /codeDebugger/sessions?start=0&limit=20
          uri: /codeDebugger/sessions?start=0&limit=20
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.debug.session+json
    session:
      summary: Example codeDebugger session
      description: Example of a request body to create a codeDebugger session
      value:
        version: 2
        sessionId: coj71it4sagqs09hrpsg
        connectionString: options DEBUGOPT="debughost=6138332d353639646131633364653834@10.254.165.184
          debugport=45469";
        casConnectionString: sessopts=(DEBUGOPT="debughost=6138332d353639646131633364653834@10.254.165.184
          debugport=45469");
        sessionState:
          state: ActiveInitialClient
          stateName: Awaiting initial connection
          active: false
        links:
        - method: GET
          rel: self
          href: /codeDebugger/sessions/coj9ksb48hgaaukfs87g
          uri: /codeDebugger/sessions/coj9ksb48hgaaukfs87g
          type: application/vnd.sas.debug.session
        - method: POST
          rel: shutdown
          href: /codeDebugger/sessions/coj9ksb48hgaaukfs87g/commands/quit
          uri: /codeDebugger/sessions/coj9ksb48hgaaukfs87g/commands/quit
          type: application/vnd.sas.debug.command.response
    commands:
      summary: Example codeDebugger command
      description: Example of sending command to active codeDebugger session
      value:
        version: 2
        sessionId: coj71it4sagqs09hrpsg
        sessionState:
          state: ActiveAwaitingClient
          stateName: Active and awaiting client
          active: true
        details:
          command: set
          currentLine: 1
          currentFunction: CMPMAIN
          status:
            code: 0
            message: The command is OK
            packageName: main
          links:
          - method: POST
            rel: self
            href: /codeDebugger/sessions/coj9ksb48hgaaukfs87g/commands/set
            uri: /codeDebugger/sessions/coj9ksb48hgaaukfs87g/commands/set
            type: application/vnd.sas.debug.command.response
    badRequestErrorResponse:
      description: This is an example of an error response for a bad request.
      summary: Bad request error response
      value:
        details:
        - The request was invalid.
        httpStatusCode: 400
        message: Bad Request
        version: 2
    notFoundErrorResponse:
      summary: Not found error response
      description: This is an example of an error response for a resource that is
        not found.
      value:
        version: 2
        httpStatusCode: 404
        message: Not Found
        details:
        - No resource exists at the requested path.
  schemas:
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    objectLinks:
      description: An array of resource links
      type: object
      properties:
        links:
          type: array
          description: Links related to this object and actions on this object
          items:
            $ref: "#/components/schemas/link"
    rootOutput:
      description: An application/vnd.sas.api object returning links to all resources
        and their actions in the SAS Code Debugger service.
      allOf:
      - $ref: "#/components/schemas/objectLinks"
      - type: object
        properties:
          version:
            type: integer
            description: Object schema version
            default: 1
    sessionState:
      description: Session state properties.
      properties:
        state:
          type: string
          description: The state of the session.
        stateName:
          type: string
          description: A localized label for the state of the session.
        active:
          type: boolean
          description: A flag that indicates whether or not the session is active.
        language:
          type: string
          description: The execution language.
        scopes:
          type: array
          description: An array of strings that indicate variable scopes.
          items:
            type: string
        defaultScope:
          type: string
          description: The default variable scope.
    breakpointConfig:
      description: Breakpoint configuration.
      properties:
        packageName:
          type: string
          description: The name of the package of the breakpoint.
        functionName:
          type: string
          description: The name of the function of the breakpoint.
        lineNumber:
          type: integer
          description: The line number of the breakpoint.
    commandStatus:
      description: The status of the command.
      properties:
        code:
          type: integer
          description: The status code.
        message:
          type: string
          description: The status message.
    sourceLine:
      description: A line of source code.
      properties:
        source:
          type: string
          description: The source code.
        lineNum:
          type: integer
          description: The line number of the source code.
    environment:
      description: The current stack environment.
      properties:
        level:
          type: integer
          description: The level of the environment.
        packageName:
          type: string
          description: The name of the package.
        function:
          type: string
          description: The name of the function.
        lineNumber:
          type: integer
          description: The current program line number.
    breakpoint:
      description: A breakpoint context.
      properties:
        id:
          type: integer
          description: The breakpoint identifier.
        enabledFlag:
          type: boolean
          description: A flag indicating whether or not the breakpoint is enabled.
        packageName:
          type: string
          description: The name of the package.
        functionName:
          type: string
          description: The name of the function.
        lineNumber:
          type: integer
          description: The line number of the breakpoint.
        expression:
          type: string
          description: A breakpoint expression.
        hits:
          type: integer
          description: The number of times the breakpoint has been hit.
    variable:
      description: A variable context.
      properties:
        name:
          type: string
          description: The name of the variable.
        type:
          type: string
          description: "The type of the variable: n=numeric, c=character, m=missing."
        typeName:
          type: string
          description: The name of the variable type.
        kind:
          type: string
          description: "The kind of variable: v=variable, a=SAS array, m=array"
        kindName:
          type: string
          description: The name of the variable kind.
        length:
          type: integer
          description: The length of character and array variables.
        readOnly:
          type: boolean
          description: A flag that indicates whether or not the variable is immutable.
        numberDimensions:
          type: integer
          description: The number of dimensions for SAS arrays.
        dimensions:
          type: array
          description: The dimensions for SAS arrays.
          items:
            type: integer
        startIndex:
          type: integer
          description: The first valid array index.
        stopIndex:
          type: integer
          description: The last valid array index.
        value:
          oneOf:
          - type: string
          - type: number
          description: The value of the variable.
        scope:
          type: string
          description: The scope of the variable.
    codeRoutine:
      description: The source code for a method or function.
      properties:
        name:
          type: string
          description: The name of the method or function.
        packageName:
          type: string
          description: The name of the package.
        sourceCode:
          type: array
          description: The array of source code.
          items:
            $ref: "#/components/schemas/sourceLine"
    sessionTimeout:
      description: Session timeout configuration.
      properties:
        enabled:
          type: boolean
          description: A flag indicating whether or not monitoring is enabled.
        period:
          type: integer
          description: The idle timeout (minutes).
        checkInterval:
          type: integer
          description: The interval to check for timeouts (minutes).
    responseDetails:
      description: A command response details.
      properties:
        command:
          type: string
          description: The command that was executed.
        transactionId:
          type: integer
          description: The transaction ID from the engine.
        currentLine:
          type: integer
          description: The current line number.
        status:
          $ref: "#/components/schemas/commandStatus"
        cpuTime:
          type: number
          format: float
          description: The CPU time (duration).
        sourceCode:
          type: array
          description: The array of source code.
          items:
            $ref: "#/components/schemas/sourceLine"
        featureName:
          type: string
          description: The name of the feature.
        featureValue:
          type: string
          description: The value of the feature.
        supportedFlag:
          type: boolean
          description: A flag indicating if the feature is supported.
        errorCode:
          type: string
          description: The error code if the feature command is unsuccessful.
        errorMessage:
          type: string
          description: The error message if the feature command is unsuccessful.
        message:
          type: string
          description: The status message from the engine.
        packageName:
          type: string
          description: The name of the package.
        environments:
          type: array
          description: The array of environments.
          items:
            $ref: "#/components/schemas/environment"
        breakpoint:
          $ref: "#/components/schemas/breakpoint"
        breakpointIds:
          type: array
          description: The array of breakpoint identifiers.
          items:
            type: integer
        breakpoints:
          type: array
          description: The array of breakpoints.
          items:
            $ref: "#/components/schemas/breakpoint"
        watchBreakpoints:
          type: array
          description: The array of watch breakpoints.
          items:
            $ref: "#/components/schemas/breakpoint"
        variables:
          type: array
          description: The array of variables.
          items:
            $ref: "#/components/schemas/variable"
        variableScope:
          type: string
          description: The variable scope (local or global).
        variableScopeName:
          type: string
          description: The name of the variable scope.
        methods:
          type: array
          description: The array of methods.
          items:
            $ref: "#/components/schemas/codeRoutine"
        method:
          $ref: "#/components/schemas/codeRoutine"
        functions:
          type: array
          description: The array of functions.
          items:
            $ref: "#/components/schemas/codeRoutine"
        function:
          $ref: "#/components/schemas/codeRoutine"
        timeout:
          $ref: "#/components/schemas/sessionTimeout"
    session:
      description: A session identifies a connection with a client and its underlying
        debugging state in the engine.
      properties:
        version:
          type: integer
          description: This media type's schema version number.  This representation
            is version 2.
        sessionId:
          type: string
          description: A system-assigned unique ID for this session.
        connectionString:
          type: string
          description: The connection options string that should be included in the
            code that is executed in the engine.
        casConnectionString:
          type: string
          description: The connection caslib session string that should be included
            in the code that is executed in the engine.
        sessionState:
          $ref: "#/components/schemas/sessionState"
        links:
          type: array
          description: "Links that apply to this object.  Links for sessions include\
            \ 'self' and 'sendCommand' if the session is active."
          items:
            $ref: "#/components/schemas/link"
    sessionCollection:
      description: A collection of sessions currently being managed by the service.
      properties:
        name:
          type: string
          description: The name of the collection in the context of the request.
        start:
          type: integer
          description: The 1-based index of the result candidates to start returning.
        limit:
          type: integer
          description: The maximum number of results requested.
        count:
          type: integer
          description: The actual number of results returned in the collection.
        accept:
          type: string
          description: "The link type of members of the collection, which will be\
            \ 'application/vnd.sas.debug.session'."
        links:
          type: array
          description: Paging links that apply to this object
          items:
            $ref: "#/components/schemas/link"
        items:
          type: array
          description: The actual results of a query
          items:
            $ref: "#/components/schemas/session"
        version:
          type: integer
          description: collection schema version
    commandParameters:
      description: The parameters associated with a command being sent to the engine.
      properties:
        version:
          type: integer
          description: This media type's schema version number.  This representation
            is version 2.
        transactionId:
          type: integer
          description: The transaction ID from the engine.
        commandLine:
          type: string
          description: The command string entered for the 'LINE' command.
        featureName:
          type: string
          description: The name of the debugger feature for the 'GET' and 'SET' commands.
        featureValue:
          type: string
          description: The value of the debugger feature for the 'SET' command.
        goToLineNumber:
          type: integer
          description: The line number for the 'GO' command.
        goContinueToEnd:
          type: boolean
          description: A flag for the 'GO' command to indicate to continue to the
            end of a function or program.
        stepOverNumberLines:
          type: integer
          description: The number of instructions to setp over for the 'GO' command.
        continueTillTrueExpression:
          type: string
          description: An expression for the 'GO' command to indicate continue until
            expression is true.
        stepOverFlag:
          type: boolean
          description: A flag for the 'STEP' command to indicate whether to step over
            or into.
        methodsFlag:
          type: boolean
          description: A flag for the 'GETROUTINES' and 'BREAKROUTINES' commands to
            indicate methods only.
        functionsFlag:
          type: boolean
          description: A flag for the 'GETROUTINES' and 'BREAKROUTINES' commands to
            indicate functions only.
        numberOfLastEnvironments:
          type: integer
          description: The number of environments to get for the 'WHERE' command.
        currentEnvironmentDepth:
          type: integer
          description: The current depth for the 'ENV' command.
        packageName:
          type: string
          description: The name of package for associated commands.
        functionName:
          type: string
          description: The name of the function for which to get source code for the
            'GETFUNCSRC' command.
        watchBreakSymbol:
          type: string
          description: The name of variable to watch for 'BREAK' command.
        breakpointConfigurations:
          type: array
          description: The array of breakpoint configurations for the 'BREAK' command.
          items:
            $ref: "#/components/schemas/breakpointConfig"
        methodName:
          type: string
          description: The method name for which to get source code for the 'GETMETHSRC'
            command.
        breakListRange:
          type: string
          description: The range of breakpoint IDs to retrieve for the 'BREAKLIST'
            command.
        breakIds:
          type: array
          description: An arrary of breakpoint identifiers.
          items:
            type: integer
        allFlag:
          type: boolean
          description: "The 'All' breakpoints flag for 'BREAKENABLE', 'WATCHENABLE',\
            \ 'BREAKDISABLE', 'WATCHDISABLE', 'BREAKCLEAR', and 'WATCHCLEAR' commands."
        variableName:
          type: string
          description: The variable name for the 'DISPLAY', 'WHATIS', and 'SETV' commands.
        variableValue:
          type: string
          description: The variable value for the 'SETV' command.
        startIndex:
          type: integer
          description: The start index for array variables for the 'DISPLAY' command.
        endIndex:
          type: integer
          description: The end index for array variables for the 'DISPLAY' command.
        environmentLevel:
          type: integer
          description: The environment level for 'SOURCE' and 'SETV' commands.
        variableScopeGlobal:
          type: boolean
          description: A flag indicating global or local scope for the 'VARS' command.
        variableChangedOnly:
          type: boolean
          description: A flag indicating whether or not the command affects all variables
            or just variables that have changed.
        variableScope:
          type: string
          description: The variable scope returned from the engine.
        shutdown:
          type: boolean
          description: A flag indicating whether or not the session should be terminated
            when issuing the 'QUIT' command.  The 'QUIT' commands releases the resources
            associated with the engine.  The additional use of this flag deletes the
            session in the mid-tier which would normally be accomplished with the
            http delete command against the session resource.
    commandResponse:
      description: A response from sending a command to the engine.
      properties:
        version:
          type: integer
          description: This media type's schema version number.  This representation
            is version 2.
        sessionId:
          type: string
          description: A system-assigned unique ID for this session.
        sessionState:
          $ref: "#/components/schemas/sessionState"
        details:
          $ref: "#/components/schemas/responseDetails"
        links:
          type: array
          description: "Links that apply to this object.  Links for responses include\
            \ 'self' and conditionally 'commandResponse' for asynchronous commands\
            \ to show how to fetch responses asynchronously."
          items:
            $ref: "#/components/schemas/link"
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
  parameters:
    SessionIdPathParm:
      name: sessionId
      in: path
      description: ID of codeDebugger session to use
      required: true
      schema:
        type: string
  securitySchemes: {}
