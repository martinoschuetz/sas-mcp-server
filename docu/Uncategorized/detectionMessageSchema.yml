  /templates:
    post:
      summary: Create a new template
      operationId: createTemplate
      tags:
      - Templates
      description: |
        Creates a new template, which can be later applied to an instance. Setting `autoapply=true` can be used
        to apply the template directly after creation. However, only Superusers can create a template with `autoapply=true`.
      parameters:
      - name: autoapply
        in: query
        description: |
          If true, the endpoint creates the template and also applies it to the template specified instance.
          This option is available only to Superusers.
        schema:
          type: boolean
        required: false
      - name: Content-Encoding
        in: header
        description: The Encoding Type of the request body content. This must be set
          to base64.
        required: true
        allowEmptyValue: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.detection.message.schema.template+yaml:
            schema:
              $ref: "#/components/schemas/createTemplate"
            examples:
              CreateTemplateExample:
                $ref: "#/components/examples/template_input"
              CopyMessageTemplateExample:
                $ref: "#/components/examples/template_input_copy_message"
              ReviseMessageTemplateExample:
                $ref: "#/components/examples/template_revise"
              NestedRelationExample:
                $ref: "#/components/examples/template_input_nested_relation"
              RefreshMessageTemplateExample:
                $ref: "#/components/examples/template_refresh"
              FullRefreshMessageTemplateExample:
                $ref: "#/components/examples/template_full_refresh"
          application/yaml:
            schema:
              $ref: "#/components/schemas/createTemplate"
            examples:
              CreateTemplateExample:
                $ref: "#/components/examples/template_input"
              CopyMessageTemplateExample:
                $ref: "#/components/examples/template_input_copy_message"
              ReviseMessageTemplateExample:
                $ref: "#/components/examples/template_revise"
              NestedRelationExample:
                $ref: "#/components/examples/template_input_nested_relation"
              RefreshMessageTemplateExample:
                $ref: "#/components/examples/template_refresh"
              FullRefreshMessageTemplateExample:
                $ref: "#/components/examples/template_full_refresh"
          application/json:
            schema:
              $ref: "#/components/schemas/createTemplate"
            example: ""
      responses:
        "201":
          description: Created
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.message.schema.template.summary+json:
              schema:
                $ref: "#/components/schemas/templateSummary"
              examples:
                default:
                  $ref: "#/components/examples/template_summary"
            application/json:
              schema:
                $ref: "#/components/schemas/templateSummary"
              examples:
                default:
                  $ref: "#/components/examples/template_summary"
        "400":
          description: The request was invalid. Reasons might be *invalid data or
            structure in the request body*.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_template_400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_template_400"
        "409":
          description: |
