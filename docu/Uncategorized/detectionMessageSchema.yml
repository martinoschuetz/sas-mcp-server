              examples:
                default:
                  $ref: "#/components/examples/variable_set"
            application/vnd.sas.detection.variables+json:
              schema:
                $ref: "#/components/schemas/variableSet"
              examples:
                default:
                  $ref: "#/components/examples/variable_set"
            application/json:
              schema:
                $ref: "#/components/schemas/variableSetSummary"
              examples:
                default:
                  $ref: "#/components/examples/variable_set"
    patch:
      summary: Update a variable set
      operationId: patchVariableSet
      tags:
      - Instances
      description: |
        Partially updates the properties of a variable set.
        Allows updates to `description`, `required`, and `deprecated` if and only if message is in `Deployment-Ready` state
        or the variable set was previously `Deployed`.
        Additional properties can be modified only if the variable sets are not yet deployed.
      parameters:
      - $ref: "#/components/parameters/messageIdParam"
      - $ref: "#/components/parameters/variableSetIdParam"
      responses:
        "200":
          description: Successfully updated the variable set.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.variables+json:
              schema:
                $ref: "#/components/schemas/variableSet"
              examples:
                default:
                  $ref: "#/components/examples/variable_set"
            application/json:
              schema:
                $ref: "#/components/schemas/variableSet"
              examples:
                default:
                  $ref: "#/components/examples/variable_set"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variableset_400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variableset_400"
        "409":
          description: |
            There is a conflict associated with this resource. Possible reasons:

            - A `private` variable set cannot be updated.
            - A `Deployed` message schema cannot be updated.
            - The requested change breaks the backward compatibility rule.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variableset_409"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variableset_409"
        "412":
          description: "The supplied pre-condition was not satisfactory, typically\
            \ indicating stale data."
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variableset_412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variableset_412"
        "422":
          description: |
            The request cannot be processed even though it is a valid request. Possible reasons:

            - The requested message state could not be persisted.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_422"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_422"
        "428":
          description: A required pre-condition (If-Match/If-Unmodified-Since) was
            not provided.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_428"
      requestBody:
        content:
          application/vnd.sas.detection.variables+json:
            schema:
              $ref: "#/components/schemas/updateVariableSet"
            example:
              description: Account Segment
              required: false
              deprecated: true
              revision: 1
          application/json:
            example:
              description: Account Segment
              required: false
              deprecated: true
              revision: 1
            schema:
              $ref: "#/components/schemas/updateVariableSet"
