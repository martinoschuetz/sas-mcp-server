---
openapi: 3.0.3
info:
  title: Detection Message Schema
  description: |
    This API provides life cycle operations to design the layout of a user message including additional metadata to facilitate solution use cases.
    Also, this API provides life cycle operations to promote reusable message schema and variable set templates (or definitions).
    Detection Message Schema API enables solutions to parse and validate the message schema against the actual message, detect data quality issues, and
    enforce coherent structures of messages within an organization. It also supports flexible and hierarchical layouts.
  version: "1"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
servers:
- url: "http://mock-detectionMessageSchema.apifirst.unx.sas.com/detectionMessageSchema"
  description: Kubernetes mock server
- url: "https://example.com/detectionMessageSchema"
  description: local mock server
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Instances
  description: Contains the operations for message schema instances.
- name: Associations
  description: Contains the operations for message schema relationships.
- name: Templates
  description: Creates, applies, retrieves, and deletes templates. Templates represent
    change sets that can be applied to messages, variable sets, variables, and message
    relations. The 'operation' field within a template determines whether the change
    applied is a create, put, patch, or delete. Templates are immutable, so a new
    template must be created if a template requires a change. Only users of __SAS
    Detection Message Schema Editor__ role can create, retrieve, and delete templates.
    To apply a template, the user must be a Superuser.
- name: Permissions
  description: Get current user's permissions in the Message Schema service.
- name: User Groups
  description: The operations for the Message Schema service managed user groups and
    group members.
  x-sas-internal: true
- name: Registries
  description: Contains the operations for message schema registries.
- name: MCP
  description: Model Context Protocol (MCP) endpoint for AI-agent access to detection
    message schema tools.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a list of top-level links.
      operationId: root
      responses:
        "200":
          description: OK
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/api"
        "404":
          description: Service is not available.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/service_not_available_error_404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/service_not_available_error_404"
  /messages:
    post:
      summary: Create or import a new message
      operationId: createMessage
      tags:
      - Instances
      description: |
        Creates a new message. By default, the message schema is created as a "Developing" version.
        Also, a `root` variable set named after the message is created automatically during this operation for
        additional variable sets to be created.
        It is only to be used for a new message schema that has no prior version.
        The name of the message schema MUST be unique across all message schemas otherwise it results in a 409 status error.

        To import an entire message schema from a JSON representation, perform these tasks:
        - Set the Content-type header to application/vnd.sas.detection.message.schema+json.
        - Provide the entire message schema JSON representation in the request body.
      requestBody:
        content:
          application/vnd.sas.detection.message.schema+json:
            schema:
              $ref: "#/components/schemas/message"
            examples:
              default:
                $ref: "#/components/examples/import_message"
          application/vnd.sas.detection.message+json:
            schema:
              $ref: "#/components/schemas/createMessage"
            example:
              name: CreditCardAuthorizations
              description: Processes credit-card transactions only
              type: ccca
          application/json:
            schema:
              $ref: "#/components/schemas/createMessage"
            examples:
              default:
                $ref: "#/components/examples/create_new_message"
      responses:
        "201":
          description: Created
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.message+json:
              schema:
                $ref: "#/components/schemas/message"
              examples:
                default:
                  $ref: "#/components/examples/message"
            application/json:
              schema:
                $ref: "#/components/schemas/message"
              examples:
                default:
                  $ref: "#/components/examples/message"
        "400":
          description: The request was invalid. Reasons might be *invalid data or
            structure in the request body*`.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_400"
        "409":
          description: |
            There is a conflict with an existing resource. Possible reasons:

            - A `Developing` revision already exists.
            - A message schema with the same `name` already exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_409"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_409"
    get:
      summary: Get a list of messages
      operationId: getMessages
      tags:
      - Instances
      description: Returns a list of messages. The items returned are a summary representation
        of a message.
      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: List of messages.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/messageSummaryCollection"
              examples:
                default:
                  $ref: "#/components/examples/list_messages"
            application/json:
              schema:
                $ref: "#/components/schemas/messageSummaryCollection"
              examples:
                default:
                  $ref: "#/components/examples/list_messages"
  "/messages/@latest":
    get:
      summary: Get the latest version of messages
      operationId: getLatestMessages
      tags:
      - Instances
      description: |
        Returns the latest version of messages in a list. The latest version is based on creation timestamp.
        The items returned are a summary representation of a message.
        The use of `filter` expression containing the `id` parameter returns an error.
        It returns a message schema if the latest version does not satisfy the filter criteria.
      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: List of messages.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/messageSummaryCollection"
              examples:
                default:
                  $ref: "#/components/examples/list_messages"
            application/json:
              schema:
                $ref: "#/components/schemas/messageSummaryCollection"
              examples:
                default:
                  $ref: "#/components/examples/list_messages"
  "/messages/types":
    get:
      summary: Get a unique list of message types
      operationId: getMessageTypes
      tags:
      - Instances
      description: |
        Returns a unique list of message types used. The creation timestamp represents the first time
        message type was created. The modified timestamp is always the same as the creation timestamp.
      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: List of message types.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/messageTypeCollection"
              examples:
                default:
                  $ref: "#/components/examples/get_distinct_message_types"
            application/json:
              schema:
                $ref: "#/components/schemas/messageTypeCollection"
              examples:
                default:
                  $ref: "#/components/examples/get_distinct_message_types"
  "/messages/{messageId}":
    patch:
      summary: Update a message
      operationId: patchMessage
      tags:
      - Instances
      description: |
        Partially updates the properties of a message. Only "Developing" or "Deployment-Ready" messages can be updated.
        Message property `name` cannot be modified.
      parameters:
      - $ref: "#/components/parameters/messageIdParam"
      responses:
        "200":
          description: Successfully updated the message.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.message+json:
              schema:
                $ref: "#/components/schemas/message"
              examples:
                default:
                  $ref: "#/components/examples/message"
            application/json:
              schema:
                $ref: "#/components/schemas/message"
              examples:
                default:
                  $ref: "#/components/examples/message"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_message_400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_message_400"
        "409":
          description: |
            There is a conflict associated with existing resource. Possible reasons:

            - The message schema is immutable because it is in a `Deployed` state.
            - The requested state is invalid due to the current state of the resource.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_message_409"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_message_409"
        "412":
          description: "The supplied pre-condition was not satisfactory, typically\
            \ indicating stale data."
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_message_412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_message_412"
        "422":
          description: |
            The request cannot be processed even though it is a valid request. Possible reasons:

            - The requested message state could not be persisted
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_422"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_422"
        "428":
          description: A required pre-condition (If-Match/If-Unmodified-Since) was
            not provided.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_428"
      requestBody:
        content:
          application/vnd.sas.detection.message+json:
            schema:
              $ref: "#/components/schemas/updateMessage"
            example:
              name: CreditCardAuthorizations
              description: Process credit-card transactions only
              type: ccca
              state: Deployment-Ready
              revision: 1
          application/json:
            schema:
              $ref: "#/components/schemas/updateMessage"
            example:
              name: CreditCardAuthorizations
              description: Process credit-card transactions only
              type: ccca
              revision: 1
    get:
      summary: Get a message
      operationId: getMessage
      tags:
      - Instances
      description: |
        Returns a message.
        A URI link to the root `variableSet` link is returned.
      parameters:
      - $ref: "#/components/parameters/messageIdParam"
      - $ref: "#/components/parameters/ownerMessageIdParam"
      responses:
        "200":
          description: Return a message.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.message+json:
              schema:
                allOf:
                - $ref: "#/components/schemas/message"
                - type: object
                  properties:
                    variableSet:
                      type: object
                      description: "root variable set only"
              examples:
                default:
                  $ref: "#/components/examples/message"
            application/json:
              schema:
                $ref: "#/components/schemas/message"
              examples:
                default:
                  $ref: "#/components/examples/message"
            application/vnd.sas.detection.message.schema+json:
              examples:
                default:
                  $ref: "#/components/examples/message"
              schema:
                allOf:
                - $ref: "#/components/schemas/message"
                - type: object
                  properties:
                    variableSet:
                      type: object
                      description: "root variable set including nested variable sets"
    delete:
      summary: Delete a message
      operationId: deleteMessage
      tags:
      - Instances
      description: Deletes a "Developing" version. The message can be deleted only
        if there is no existing message or variable relationship.
      parameters:
      - $ref: "#/components/parameters/messageIdParam"
      - $ref: "#/components/parameters/clientValidationUriParam"
      responses:
        "204":
          description: The message was deleted.
        "400":
          description: The request is malformed.
        "409":
          description: |
            There is a conflict with an existing resource. Possible reasons:

            - Only a message schema that is in a "Developing" state can be deleted.
            - There are existing message relationships associated with this message schema.
  "/messages/{messageId}/revisions":
    post:
      summary: Create a new revision of a message
      operationId: createMessageRevision
      tags:
      - Instances
      description: |
        Creates a new revision of the message from the latest revision.
         It returns an error if the latest revision is already in `Developing` state.
      parameters:
      - $ref: "#/components/parameters/messageIdParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: {}
          application/vnd.sas.detection.message+json:
            schema:
              type: object
            example: {}
      responses:
        "201":
          description: Created
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.message+json:
              schema:
                $ref: "#/components/schemas/message"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message"
            application/json:
              schema:
                $ref: "#/components/schemas/message"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_400"
        "409":
          description: |
            There is a conflict with an existing resource. Possible reasons:

            - A `Developing` revision already exists.
            - The existing resource is not in a `Deployed` state.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_409"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_409"
  "/messages/{messageId}/snapshots":
    post:
      summary: Create a new snapshot of a message
      operationId: createMessageSnapshot
      tags:
      - Instances
      description: |
        Creates a new snapshot of a message.
      parameters:
      - $ref: "#/components/parameters/messageIdParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: {}
          application/vnd.sas.detection.message+json:
            schema:
              type: object
            example: {}
      responses:
        "201":
          description: Created
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.message+json:
              schema:
                $ref: "#/components/schemas/message"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message"
            application/json:
              schema:
                $ref: "#/components/schemas/message"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_400"
  "/messages/{messageId}/copied":
    post:
      summary: Create a new copy of a message
      operationId: createMessageCopy
      tags:
      - Instances
      description: |
        Creates a copy of a message with a new name.
        Copy of all the sub-objects such as variables sets and variables is done.
        If the message has message relationships to component schemas, then you must
        specify how each component schema is handled during the copy.
        Each component schema can be copied, retained or ignored. If a component message is omitted entirely from
        the `ops` array, then it is treated as if `op=ignore` is supplied. The new message copy is created in the `Developing` state.
      parameters:
      - $ref: "#/components/parameters/messageIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/messageOps"
            examples:
              default:
                $ref: "#/components/examples/create_message_ops"
          application/vnd.sas.detection.messageops+json:
            schema:
              $ref: "#/components/schemas/messageOps"
            examples:
              default:
                $ref: "#/components/examples/create_message_ops"
      responses:
        "201":
          description: Created
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.message+json:
              schema:
                $ref: "#/components/schemas/message"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message"
            application/json:
              schema:
                $ref: "#/components/schemas/message"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_400"
        "409":
          description: |
            There is a conflict with an existing resource. Possible reasons:

            - A new named schema already exists.
            - The copied schema name cannot be the same.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_409"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_message_409"
  "/messages/{messageId}/variableSets":
    post:
      summary: Create a new variable set
      operationId: createVariableSet
      tags:
      - Instances
      description: |
        Creates a new variable set using variable set representation.
        The representation can include nested variable sets.
        The query parameter `parentId` should be used for creating nested variable set relative to the parentId.
        By default it create a child of the `root` variable set.
        The name of the variable set MUST be unique among siblings.
      parameters:
      - $ref: "#/components/parameters/messageIdParam"
      - $ref: "#/components/parameters/variableSetParentIdParam"
      requestBody:
        content:
          application/vnd.sas.detection.variables+json:
            schema:
              $ref: "#/components/schemas/createVariableSet"
            example:
              name: AQO
              type: object
              description: Account Segment
              revision: 0
              tags:
              - name: primary
                value: "true"
          application/json:
            example:
              name: AQO
              type: object
              description: Account Segment
              revision: 0
              tags:
              - name: primary
                value: "true"
            schema:
              $ref: "#/components/schemas/createVariableSet"
      responses:
        "201":
          description: Created
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.variables+json:
              schema:
                $ref: "#/components/schemas/variableSet"
              examples:
                default:
                  $ref: "#/components/examples/create_new_variableset"
            application/json:
              schema:
                $ref: "#/components/schemas/variableSet"
              examples:
                default:
                  $ref: "#/components/examples/create_new_variableset"
        "400":
          description: |
            The request was invalid. Reasons could be *invalid data or structure in the request body*.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_variableset_400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_variableset_400"
        "409":
          description: |
            There is a conflict with an existing resource. Possible reasons:

            - The variable set already exists.
            - The message schema is in immutable (`Deployed`) state.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_variableset_409"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_new_variableset_409"
    get:
      summary: Get a list of variable sets
      operationId: getVariableSets
      tags:
      - Instances
      description: Returns a list of variable sets.
      parameters:
      - $ref: "#/components/parameters/messageIdParam"
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
