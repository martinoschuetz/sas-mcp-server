      description: Deletes a variable for a "Developing" message schema only. Private
        variables are not allowed to be deleted.
      parameters:
      - $ref: "#/components/parameters/variableSetIdParam"
      - $ref: "#/components/parameters/variableIdParam"
      - $ref: "#/components/parameters/forceParam"
      responses:
        "204":
          description: The variable was deleted.
        "400":
          description: The request is malformed.
        "409":
          description: |
            Cannot delete a variable. Possible reasons:

            - The message is in an immutable (`Deployed`) state.
            - A `private` variable cannot be deleted.
    get:
      summary: Get a variable
      operationId: getVariable
      tags:
      - Instances
      description: Returns the details of a variable.
      parameters:
      - $ref: "#/components/parameters/variableSetIdParam"
      - $ref: "#/components/parameters/variableIdParam"
      - $ref: "#/components/parameters/includeReferencesParam"
      - $ref: "#/components/parameters/ownerMessageIdParam"
      - $ref: "#/components/parameters/accessByUserGroupParam"
      responses:
        "200":
          description: Returns a variable.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.variable.summary+json:
              schema:
                $ref: "#/components/schemas/variableSummary"
              examples:
                default:
                  $ref: "#/components/examples/variable"
            application/vnd.sas.detection.variable+json:
              schema:
                $ref: "#/components/schemas/variable"
              examples:
                default:
                  $ref: "#/components/examples/variable"
                byUserGroup:
                  $ref: "#/components/examples/get_variable_by_user_group"
            application/json:
              schema:
                $ref: "#/components/schemas/variable"
              examples:
                default:
                  $ref: "#/components/examples/variable"
                byUserGroup:
                  $ref: "#/components/examples/get_variable_by_user_group"
    patch:
      summary: Update a variable
      operationId: patchVariable
      tags:
      - Instances
      description: |
        Partially updates the properties of a variable.
        Only backward compatible changes can be made if the message has been previously deployed:

          * The `description`, `required`, `displayName`, and `deprecated` properties can be updated.
          * The `maxItems` property of an array variable can be increased. It cannot be decreased.
          * The `maxLength` property of a string variable can be increased. It cannot be decreased.
          * The `access` property can be changed only to add access, not to remove access. Changes from ro to rw, na to ro, or na to rw are allowed.
          * The `shared` property can be changed only to `true`. Unsharing a shared variable is not allowed.

        Additional variable properties can be modified only if the message has not been deployed.
      parameters:
      - $ref: "#/components/parameters/variableSetIdParam"
      - $ref: "#/components/parameters/variableIdParam"
      responses:
        "200":
          description: Successfully updated the variable.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.variable+json:
              schema:
                $ref: "#/components/schemas/variable"
              examples:
                default:
                  $ref: "#/components/examples/variable"
            application/json:
              schema:
                $ref: "#/components/schemas/variable"
              examples:
                default:
                  $ref: "#/components/examples/variable"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variable_400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variable_400"
        "409":
          description: |
            There is a conflict associated with this resource. Possible reasons:

            - A `private` variable cannot be updated.
            - The message is in an immutable (`Deployed`) state.
            - The requested change breaks the backward compatibility rule.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variable_409"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variable_409"
        "412":
          description: "The supplied pre-condition was not satisfactory, typically\
            \ indicating stale data."
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variable_412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/patch_variable_412"
        "422":
          description: |
            The request cannot be processed even though it is a valid request. Possible reasons:

            - The requested message state could not be persisted.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_422"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_422"
        "428":
          description: A required pre-condition (If-Match/If-Unmodified-Since) was
            not provided.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_428"
      requestBody:
        content:
          application/vnd.sas.detection.variable+json:
            schema:
              $ref: "#/components/schemas/updateVariable"
            example:
              name: aqo_acct_num
              type: string
              description: AccountNumber
              required: false
              deprecated: true
              revision: 1
          application/json:
            example:
              name: aqo_acct_num
              type: string
              description: AccountNumber
              required: false
              deprecated: true
              revision: 1
            schema:
              $ref: "#/components/schemas/updateVariable"
