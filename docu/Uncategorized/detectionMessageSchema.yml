              $ref: "#/components/schemas/templateSummary"
    groupMemberCollection:
      title: groupMemberCollection
      description: This is a collection of group members.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query
            items:
              $ref: "#/components/schemas/member"
    registryCollection:
      title: RegistryCollection
      description: This is a collection of message schema registries.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query
            items:
              $ref: "#/components/schemas/registry"
    updateMessage:
      title: UpdateMessage
      description: |
        An update request representation for a message.
      allOf:
      - $ref: "#/components/schemas/createMessage"
      - type: object
        properties:
          state:
            type: string
            description: |
              The state reflects the capabilities that are allowed on the message schema. The supplied value is case-insensitive.
              `Deployed` is a state that represents the message schema has been published successfully and is immutable.
              `Developing` is a state that represents the message schema is undergoing modifications. There can only be one "developing" version active.
              `Deployment-Ready` is a state that represents the message schema allows limited changes and intended to be deployed.
            enum:
            - Developing
            - Deployed
            - Deployment-Ready
          revision:
            type: integer
            description: |
              The last revision update to the message.
              This a number that is used for database optimistic locking during concurrent requests.
              Each time an update occurs the value is incremented.
              It must be provided for performing PATCH updates only.
              This number is independent of the multiple revisions of a schema.
            minimum: 0
        required: [revision]
    createMessage:
      title: CreateMessage
      description: |
        A create request representation for a message.
      type: object
      properties:
        name:
          type: string
          description: |
            Name of the message schema. The name of the message cannot be modified once assigned.
            Allowed characters are letters, numbers, underscores, and whitespaces.
          maxLength: 127
          pattern: "^[A-Za-z0-9_\\s]+$"
        displayName:
          type: string
          description: This is a general purpose name for the message that can be
            modified. Defaults to the `name` if not provided.
          maxLength: 255
        description:
          type: string
          maxLength: 999
          description: The purpose of the message schema
        type:
          type: string
          maxLength: 32
          description: |
            The kind of message schema defined that can be used for categorization. Potential values could be:
            `banking`, `insurance`, `payments`, or `healthcare`
            The subtype allows only lowercase alphanumeric characters. It will be automatically converted to lowercase.
          example: financial
          pattern: "^[A-Za-z0-9+_-]+$"
        accessGroup:
          type: string
          maxLength: 100
          description: |
            The access user group that is assigned to the message schema. Only users in the access group can access and
            view the message schema. If the property is not set, then all authenticated users can access and
            view the message schema.
        editorGroup:
          type: string
          maxLength: 100
          description: The editor user group that is assigned to the message schema.
        metadata:
          $ref: "#/components/schemas/metadata"
        tags:
          type: array
          description: An array of variable tags.
          items:
            $ref: "#/components/schemas/tag"
      required: [name, type]
    metadata:
      description: |
        Structured information that specifies the configuration, usage constraints,
        and extended attributes for the message, variable sets, and variables.
      type: object
      title: Message Metadata
      properties:
        message:
          type: object
          description: Metadata for the message in key-value format. At this time,
            the Message Schema Service provides no system-defined keys.
        variableSet:
          type: object
          description: |
            Metadata for the variable sets in key-value format.
            The following key-value pairs for variable sets are supported:

            - `maxCount`: The maximum number of variable sets in the message.
            - `maxDepth`: The maximum number of levels of variable sets in the message, defaulting to 20. This must be between 1 and 128, and is only settable for non-profile message schemas.
            - `maxKeyLength`: The maximum length of variables used as the key of a variable set.
            - `lockOnReadAllowed`: If true, the `lockOnRead` property of variable set can be set to true.
        variable:
          type: object
          description: Metadata for the variables in key-value format. At this time,
            the Message Schema Service provides no system-defined keys.
    createVariable:
      title: CreateVariable
      description: |
        A create request representation for a variable.
      type: object
      properties:
        name:
          type: string
          description: The name of the variable. Letters, numbers and underscores
            are allowed only.
          maxLength: 127
          pattern: "^[A-Za-z0-9\\_]+$"
        displayName:
          type: string
          description: This is a general purpose name for the variable. Defaults to
            the `name` if not provided.
          maxLength: 255
        type:
          type: string
          maxLength: 15
          description: The primitive data type of the variable. Please refer to Data
            Types section for limits.
          enum:
          - array
          - string
          - number
          - integer
          - bigint
          - currency
          - boolean
          - timestamp
          - date
          - time
        description:
          type: string
          maxLength: 999
          description: The purpose of the variable
        baseId:
          type: integer
          description: |
            The ID for a variable within a profile variable set.
            Each profile variable set has its own set of IDs, starting from 1.
        tags:
          type: array
          description: An array of variable tags.
          items:
            $ref: "#/components/schemas/tag"
        version:
          type: integer
          description: The minimum and maximum version supported. Enables future version
            support such as version 1 and 2
          minimum: 1
          maximum: 1
        minLength:
          type: integer
          description: The minimum length of a `string`
          default: 0
        maxLength:
          type: integer
          description: |
            The maximum length of a `string`. Defaults to 0 unless type is `string`. In this case
            it defaults to 10 or minLength, whichever is higher
          default: 0
        enumValues:
          type: array
          items:
            type: string
          description: A pre-defined set of valid values. Use it for enumerations
            no more than 20.
        enumURI:
          type: string
          description: An external reference URI of a large set of enumerated values.
        minimum:
          type: number
          description: A minimum value for a number.
          default: 0
        maximum:
          type: number
          description: A maximum value for a number.
          default: 0
        inclusiveMinimum:
          type: boolean
          description: A value of `true` represents the minimum value is inclusive.
        exclusiveMaximum:
          type: boolean
          description: A value of `true` represents the maximum value is exclusive.
        arrayItem:
          type: string
          description: The type for an array.
          default: "none"
          enum: ["none", "string", "integer", "number", "boolean", "byte", "timestamp",
            "date", "time", "currency", "bigint"]
        minItems:
          type: integer
          description: The minimum number of items in the array
          default: 0
        maxItems:
          type: integer
          description: |
            The maximum number of items in the array.
            It defaults to 10 or minItems, whichever is higher.
          default: 10
        required:
          type: boolean
          description: This variable is required if set to `true`
          default: false
        deprecated:
          type: boolean
          description: This variable is should not be used as it may be removed in
            the future when `true`.
          default: false
        private:
          type: boolean
          description: |
            This variable neither can be modified nor deleted when `true`.
            They can only be modified by prescribed templates.
          default: false
        access:
          type: string
          description: |
            The read-write access allowed on the variable's value.
            `na` - Not-Applicable. This variable is a blackbox whose value cannot be read nor modified by SAS.
            `rw` - Read-Write. This variable's value can be read and modified.
            `ro` - Read-Only. This variable's value cannot be modified.
          default: "rw"
          enum: ["na", "rw", "ro"]
        isMissing:
          type: boolean
          description: This signifies missing value. Only applies to numeric types.
          default: false
        defaultValue:
          type: string
          description: This is the default or initial value of the variable. Only
            applies to string and numeric types.
          default: ""
        locked:
          type: boolean
          description: |
            That flag provides external clients with more control to disallow any modification until unlocked. This is
            managed primarily by an external client.
        userGroup:
          type: string
          default: "DMSDefault"
          description: |
            The users in the user group can only access this variable. The custom group `DMSDefault` implicitly
            applies to all users.
        featureExpr:
          $ref: "#/components/schemas/featureExpr"
        masking:
          type: string
          description: This is used to conceal data in a predefined format.
        shared:
          type: boolean
          description: |
            That flag indicates the variable is shared to all other user groups in the (profile) schema.
            The share is read-only for both the variable definition and the runtime access of the variable.
            For instance, variable "var-1" has the user group "group-1" and its shared flag is set to `true`.
            Another variable "var-2" has the user group "group-2" and its shared flag is set to `false`.
            A user in "group-2" will have read access of the definition and runtime value of "var-1".
      required: [name, type]
    featureExpr:
      description: This object represents the calculation used to determine the value
        of the variable.
      type: object
      properties:
        window:
          type: object
          description: A time-based or an array-based windowing calculation
          properties:
            type:
              type: string
              description: A type of windowing to be used
              enum: ["array", "time"]
            arrayLength:
              type: integer
              description: The length of the array window
            timeISOPeriod:
              type: string
              description: |
                The time span and unit of the `time-based` window specified in
                <p><a href="https://en.wikipedia.org/wiki/ISO_8601#Durations">ISO 8601 duration format.</a></p>
              pattern: "^P(?:(\\d+)Y)?(?:(\\d+)M)?(?:(\\d+)D)?(T(?:(\\d+)H)?(?:(\\\
                d+)M)?(?:(\\d+(?:.\\d+)?)S)?)*$"
            timeVarFQName:
              type: string
              description: |
                A fully qualified variable name that is of `Timestamp` type.
            timeVarSchemaName:
              type: string
              description: |
                The name of the schema that the variable defined in `timeVarFQName`
        aggregator:
          type: object
          description: This object defines the aggregation used for calculating the
            variable.
          properties:
            funcName:
              type: string
              description: An aggregation function name used for this calculated variable.
              enum: ["none", "sum", "min", "max", "count"]
            varFQName:
              type: string
              description: |
                A fully qualified variable name that is used by the aggregation function.
            varSchemaName:
              type: string
              description: |
                The name of the schema that the variable defined in `varFQName`
        filter:
          type: object
          description: An arbitrary JSON value (object, array, string, number, boolean
            or null) representing the expression used for pre-filtering.
          anyOf:
          - type: object
            additionalProperties: true
          - type: array
            items: {}
          - type: string
          - type: number
          - type: boolean
          nullable: true
    updateVariable:
      title: UpdateVariable
      description: |
        An update request representation for a variable.
      type: object
      allOf:
      - $ref: "#/components/schemas/createVariable"
      - type: object
        properties:
          revision:
            type: integer
            description: |
              The last revision update to the variable.
              This a number that is used for database optimistic locking during concurrent requests.
              Each time an update occurs the value is incremented. It must be provided for performing PATCH updates only.
              This number is independent of the multiple revisions of a schema.
            minimum: 0
      required: [revision]
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    createVariableSet:
      description: |
        A Variable Set represents a container of other Variable Sets or Variables within a message schema.
      type: object
      title: CreateVariableSet
      allOf:
      - $ref: "#/components/schemas/variableSetProperties"
      - type: object
        properties:
          variableSets:
            type: array
            description: An array of nested variable sets.
            minItems: 0
            items:
              $ref: "#/components/schemas/variableSetProperties"
      required: [name, type]
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    selection:
      title: Selection
      description: Identifies a set of resources.
      x-sas-media-type:
        name: application/vnd.sas.selection
        version: 1
      required:
      - version
      - resources
      properties:
        version:
          description: The schema version number of this media type. This representation
            is version 1.
          type: integer
        template:
          description: 'A URI template in which the {id} parameter can be replaced
            with a value from the "resources" array in order to yield the URI of the
            identified resource. '
          type: string
        type:
          description: "Specifies whether the resources array contains IDs, URIs,\
            \ or both. \n<dl>\n<dt>\"id\"</dt><dd>the array contains resource identifiers\
            \ only. This is the default if \"type\" is omitted.</dd>\n<dt>\"uri\"\
            </dt><dd>the array contains resource URIs</dd>\n<dt>\"mixed\"</dt><dd>the\
            \ array contains a mixture of identifiers and URIs.</dd>\n</dl>"
          type: string
          enum:
          - id
          - uri
          - mixed
        resources:
          description: An array of resource IDs or URIs
          type: array
          items:
            type: string
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
    updateVariableSet:
      title: UpdateVariableSet
      description: |
        An update request representation for a variable set.
      type: object
      allOf:
      - $ref: "#/components/schemas/variableSetProperties"
      - type: object
        properties:
          revision:
            type: integer
            description: |
              The last revision update to the variable set.
              This a number that is used for database optimistic locking during concurrent requests.
              Each time an update occurs the value is incremented. It must be provided for performing PATCH updates only.
              This number is independent of the multiple revisions of a schema.
            minimum: 0
          parentId:
            type: string
            description: |
              This is an identifier (in uuid) for the parent variable set. This parameter is ignored on a POST since it
              is a parameter on the URL.
      required: [revision]
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    messageRelationProperties:
      description: Composition relationship between a owner message schema and component
        message schema
      type: object
      title: Message Relation
      properties:
        version:
          type: integer
          description: The representation version of a message relation
          minimum: 1
          maximum: 1
        messageName:
          type: string
          description: The component message schema name
          maxLength: 127
          pattern: "^[A-Za-z0-9_\\s]+$"
      required: [messageName]
    registryEventType:
      description: A breaking change event type associated to a registry.
      type: object
      title: Event Type
      properties:
        eventType:
          type: string
          maxLength: 128
          description: The name of breaking change event type.
          enum: ["unsharing", "major update", "relation change", "relation removal",
            "deletion"]
        eventObjectType:
          type: string
          maxLength: 128
          description: |
            The name of event source object type. A source object can only have certain types of breaking change events.
            The valid event types for each object type are:
            - variable
              - unsharing
              - major update
              - deletion
            - variableset
              - major update
              - relation change
              - deletion
            - message
              - relation removal
              - deletion
          enum: ["variable", "variableset", "message"]
      required: [eventType, eventObjectType]
    messageOpsProperties:
      description: A set of operators for copying a message
      type: object
      title: MessageOps
      properties:
        newname:
          type: string
          description: |
            The new name for the copied message.  The new name must be unique across all message schemas.
            If it is not unique, the copy will fail. The new component message copy is created in the `Developing` state.
          maxLength: 127
          pattern: "^[A-Za-z0-9_\\s]+$"
    templateProperties:
      description: A set of template properties.
      properties:
        name:
          type: string
          description: "The name of the template. Letters, numbers, and whitespaces\
            \ are allowed only."
          maxLength: 127
          pattern: '^[A-Za-z0-9\s]+$'
        type:
          type: string
          description: |
            This is an optional field, describing whether the template is SAS Prescribed or Customer Prescribed.
          enum:
          - Prescribed_by_SAS
          - Custom
          default: Custom
        description:
          type: string
          maxLength: 999
          description: Intended use for the template
        tenant:
          type: string
          description: Tenant to which this template applies
          default: default
        product:
          type: string
          description: Product to which this template applies
          default: default
        operation:
          type: string
          maxLength: 12
          description: |
            This indicates which operation a template will perform when applied.
            create will create the specified instance. If the instance already exists, this fails with a conflict error.
            put will create the specified instance if it does not exist. If it does exist, it will update the instance.
            patch will update the instance if it exists, and fail if it does not exist.
            revise will create a new revision of a Deployed message, and apply the specified changes. It will not work if there is no Deployed message.
            delete will delete the instance if it exists. If it does not exist, nothing happens, and no error is returned.
            copy can be used to create a copy of a message schema. Message relations can be dropped, linked, or copied when copying a schema.
            refresh will take the given message and update all message relations that include that message to use the latest version of it.
            For deployed messages, all relations that the relation owner message contains will be refreshed.
            full_refresh does the same thing as refresh, but refreshes all of the latest message schemas.
          enum:
          - create
          - put
          - patch
          - revise
          - delete
          - copy
          - refresh
          - full_refresh
    messageOp:
      description: |
        The operator to handle the component schema. Valid values are copy, retain or ignore. A copy operator will
        create a copy of the component schema for the composite schema. A retain operator will only associate the
        component schema for the composite schema. An ignore operator will not include the component schema for the
        composite schema. Note either `name` and `state` or `id` is required.
      allOf:
      - $ref: "#/components/schemas/messageOpProperties"
      properties:
        id:
          type: string
          description: The identifier for the component schema to operate. If `id`
            is not provided then `name` and `state` is used
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    messageChange:
      type: object
      title: MessageChange
      description: Message Template
      allOf:
      - $ref: "#/components/schemas/createMessage"
      properties:
        operation:
          type: string
          maxLength: 12
          description: This indicates which operation a template will perform when
            applied
          enum:
          - create
          - put
          - patch
          - revise
          - delete
          - copy
          - refresh
        variables:
          type: array
          items:
            allOf:
            - $ref: "#/components/schemas/variableChange"
        variableSets:
          type: array
          items:
            allOf:
            - $ref: "#/components/schemas/variableSetChange"
        messageRelations:
          type: array
          items:
            allOf:
            - $ref: "#/components/schemas/messageRelationChange"
        copyOp:
          type: object
          description: This contains information indicating the message copy's name,
            as well as how to handle the copying of message relationships.
          allOf:
          - $ref: "#/components/schemas/messageOpsProperties"
          properties:
            ops:
              type: array
              items:
                allOf:
                - $ref: "#/components/schemas/messageOpProperties"
            state:
              type: string
              enum:
              - Developing
              - Deployed
              - Deployment-Ready
              description: The state of the copy target message. It used for locating
                the schema along with the name.
          required:
          - state
      required:
      - operation
    variableSetChange:
      title: VariableSetChange
      description: Variable Set Template
      allOf:
      - $ref: "#/components/schemas/createVariableSet"
      properties:
        operation:
          type: string
          maxLength: 12
          description: This indicates which operation a template will perform when
            applied
          enum:
          - create
          - put
          - patch
          - delete
        messageRelations:
          type: array
          items:
            allOf:
            - $ref: "#/components/schemas/messageRelationChange"
        variables:
          type: array
          items:
            allOf:
            - $ref: "#/components/schemas/variableChange"
      required:
      - operation
    variableChange:
      title: variableChange
      description: Variable Template
      allOf:
      - $ref: "#/components/schemas/createVariable"
      properties:
        operation:
          type: string
          maxLength: 12
          description: This indicates which operation a template will perform when
            applied
          enum:
          - create
          - put
          - patch
          - delete
      required:
      - operation
    messageRelationChange:
      title: MessageRelationChange
      description: Message Relation Template
      allOf:
      - $ref: "#/components/schemas/messageRelationProperties"
      properties:
        operation:
          type: string
          maxLength: 12
          description: This indicates which operation a template will perform when
            applied
          enum:
          - create
          - put
          - delete
      required:
      - operation
    messageOpProperties:
      title: messageOp
      description: |
        The operator to handle the component schema. Valid values are copy, retain or ignore. A copy operator will
        create a copy of the component schema for the composite schema. A retain operator will only associate the
        component schema for the composite schema. An ignore operator will not include the component schema for the
        composite schema. Note either `name` and `state` or `id` is required.
      properties:
        op:
          type: string
          description: The operator to handle the component schema. When value is
            copy then `newname` is required.
          enum:
          - copy
          - retain
          - ignore
        id:
          type: string
          description: The identifier for the component schema to operate. If `id`
            is not provided then `name` and `state` is used.
        name:
          type: string
          description: The name of the component schema to operate.
          maxLength: 127
          pattern: "^[A-Za-z0-9_\\s]+$"
        state:
          type: string
          description: The current state of the component schema. It is used for locating
            the schema along with the `name`
          enum:
          - Developing
          - Deployed
          - Deployment-Ready
        newname:
          type: string
          description: |
            The new name to use for copying the component schema when operator is `copy` only.
            The new name must be unique across all message schemas. If it is not unique, the copy will fail.
            The new component message copy is created in the `Developing` state.
