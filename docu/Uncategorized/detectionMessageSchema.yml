  "/messages/{messageId}/variableSets/{variableSetId}":
    delete:
      summary: Delete a variable set and all its children
      operationId: deleteVariableSet
      tags:
      - Instances
      description: Deletes a variable set for only a "Developing" message schema.
        Private root variable sets are not allowed to be deleted.
      parameters:
      - $ref: "#/components/parameters/messageIdParam"
      - $ref: "#/components/parameters/variableSetIdParam"
      - $ref: "#/components/parameters/forceParam"
      responses:
        "204":
          description: The variable set and its children were deleted.
        "400":
          description: The request is malformed.
        "409":
          description: |
            Cannot delete a variable set. Possible reasons:

            - The message is in an immutable (`Deployed`) state.
            - A `private` variable set cannot be deleted.
            - A `root` variable set cannot be deleted.
    get:
      summary: Get a variable set
      operationId: getVariableSet
      tags:
      - Instances
      description: |
        Returns a variable set.
        The parameter `depth` is optional. Any value greater than 0, returns nested variable sets.
        Number of levels depends on the value of the parameter. Nothing is returned if there are no variable sets.
      parameters:
      - $ref: "#/components/parameters/messageIdParam"
      - $ref: "#/components/parameters/variableSetIdParam"
      - $ref: "#/components/parameters/depthParam"
