          version:
            type: integer
            description: |
              Taxonomy response schema version. This is version 1.
            minimum: 1
            maximum: 1
          id:
            type: string
            description: |
              A unique, system-generated ID for the taxonomy.
          creationTimeStamp:
            type: string
            description: |
              The date when the taxonomy was created.
            format: date-time
          modifiedTimeStamp:
            type: string
            description: |
              The date when the taxonomy was last updated.
            format: date-time
          createdBy:
            type: string
            description: |
              The ID of the user that created the taxonomy.
          modifiedBy:
            type: string
            description: |
              The ID of the user that last updated the taxonomy.
          allowConceptAutomaticRules:
            type: boolean
            description: >
              This option indicates whether or not automatic concept rules can
              be generated for the given taxonomy (default is FALSE). If set
              to TRUE, the user may automatically generate concept rules.
          state:
            type: string
            description: |
              The state that the given taxonomy is in.
            enum:
            - locked
            - unlocked
          links:
            type: array
            description: An array of links to related resources and actions.
            items:
              $ref: "#/components/schemas/link"
    taxonomyCollection:
      title: Taxonomies collection
      description: A collection of concept taxonomies.
      x-sas-media-type: application/vnd.sas.collection+json;version=1
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/taxonomy"
            description: >
              The array of `application/vnd.sas.text.concept.taxonomy`
              representations.
    moveConcept:
      description: Move a concept.
      type: object
      title: Move a concept to another existing parent concept or taxonomy
      x-sas-media-type: application/vnd.sas.text.concept.move+json;version=1
      properties:
        version:
          type: integer
          description: |
            Concept response schema version. This is version 1.
          minimum: 1
          maximum: 1
        newTaxonomyId:
          type: string
          description: If moving directly under a taxonomy, this is the ID of that
            taxonomy.  Note that this value should not be set if moving to a new parent
            concept, as the taxonomy of the parent will be inherited.
        newParentId:
          type: string
          description: The new parent concept ID.  Note - if this value is set, the
            newTaxonomyId should not be set, as the taxonomy will be inferred from
            the new parent.
    duplicateConcept:
      description: Duplicate a concept.
      type: object
      title: duplicate a concept to another existing parent concept or taxonomy
      x-sas-media-type: application/vnd.sas.text.concept+json;version=1
      properties:
        version:
          type: integer
          description: |
            Concept response schema version. This is version 1.
          minimum: 1
          maximum: 1
        name:
          type: string
          description: The user defined name of the duplicated concept. If the name
            of the duplicated concept is not unique in the new parent or new taxonomy,
            where it is being copied to, the system will generate the new name for
            the concept.
    taxonomyConfiguration:
      description: Configuration details for a taxonomy.
      type: object
      title: taxonomy configuration
      x-sas-media-type: application/vnd.sas.text.concept.taxonomy.configuration+json;version=1
      required:
      - configuration
      - taxonomyId
      properties:
        configuration:
          type: string
          description: >
            The taxonomy configuration which is the collection of the rules for
            all the concepts in a specific format that can be used to create a
            binary model to match the text/documents to the defined concepts
            within the taxonomy.
        taxonomyId:
          type: string
          description: The ID of the taxonomy.
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
    conceptConfiguration:
      description: Configuration details for a concept.
      type: object
      title: concept configuration
      x-sas-media-type: application/vnd.sas.text.concept.configuration+json;version=1
      required:
      - configuration
      - conceptId
      properties:
        configuration:
          type: string
          description: >
            The concept configuration contains the name, rule value, enabled,
            priority, case-insensitive property  of a concept in a specific
            format that can be used to create a binary model to match the
            text/documents to the defined concept.
        conceptId:
          type: string
          description: The ID of the concept.
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
