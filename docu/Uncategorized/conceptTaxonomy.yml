  "/taxonomies/{taxonomyId}/concepts#duplicateConcept":
    post:
      summary: Duplicate a concept
      operationId: createDuplicateConcept
      description: >
        Enables a user to duplicate a concept and its children. The target
        destination can be

        inside or outside of the original taxonomy.
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: The ID of the taxonomy that contains the concept which needs
          to be duplicated.
        schema:
          type: string
      - name: from
        in: query
        required: true
        description: The ID of the concept to copy.
        schema:
          type: string
      - name: newTaxonomyId
        in: query
        description: If duplicating directly under a taxonomy, this is the ID of that
          taxonomy.  Note that this value should not be set if duplicating to a new
          parent concept, as the taxonomy of the parent will be inherited.
        schema:
          type: string
      - name: newParentId
        in: query
        description: The new parent concept ID.  Note - if this value is set, the
          newTaxonomyId should not be set, as the taxonomy will be inferred from the
          new parent.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.text.concept+json:
            schema:
              $ref: "#/components/schemas/duplicateConcept"
            examples:
              api:
                $ref: "#/components/examples/duplicateConceptRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/duplicateConcept"
            examples:
              api:
                $ref: "#/components/examples/duplicateConceptRequest"
        description: Request body containing the name of the duplicated concept. If
          we don't specify the body, a unique name will be generated for the duplicated
          concept which will be unique to the parent of the duplicated concept.
      tags:
      - Concepts
      responses:
        "201":
          description: The concept was successfully duplicated, returns the concept.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the concept was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the duplicated concept.
              schema:
                type: string
            Location:
              description: The URL of the duplicated concept.
              schema:
                type: string
          content:
            application/vnd.sas.text.concept+json:
