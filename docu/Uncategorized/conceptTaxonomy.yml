        in: query
        description: >
          The maximum number of concept children to return.  The actual number
          of returned children could be less if the collection has been
          exhausted. The default is 20.
        schema:
          type: integer
          format: int32
          default: 20
      - name: start
        in: query
        description: |
          The index of the first concept child to return.
        schema:
          type: integer
          format: int64
          default: 0
      - name: sortBy
        in: query
        description: >
          Sort returned child concepts for specified parent concept in a
          taxonomy. The sort criteria support the following fields in either
          ascending or descending order (id, name, priority, caseInsensitive,
          enabled, predefined, validationNeeded, hasInvalidChild, isHelper,
          parentId, taxonomyId, value, createdBy, creationTimeStamp,
          includePredefined, modifiedBy and modifiedTimeStamp). The default is
          "creationTimeStamp". See [sorting
          collections](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
          default: creationTimeStamp
      - name: includeValue
        in: query
        description: >
          If set to FALSE, all concepts returned will have an empty value
          field. If set to TRUE, all concepts returned will have their correct
          value field.
        schema:
          type: boolean
          default: false
      - name: filter
        in: query
        description: >
          Returns taxonomies filtered by the given parameters. Objects can be
          filtered by any fields present on the object itself.
        schema:
          type: string
      responses:
        "200":
          description: |
            OK. The child concepts were returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/conceptsSummaryCollection"
              examples:
                api:
                  $ref: "#/components/examples/getConceptChildrenResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/conceptsSummaryCollection"
              examples:
                api:
                  $ref: "#/components/examples/getConceptChildrenResponse"
        "404":
          description: |
            A concept with the given ID does not exist.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
  "/taxonomies/{taxonomyId}/concepts/{conceptId}/configuration":
    get:
      tags:
      - Concepts
      summary: Get the concept configuration in specific format
      operationId: getConceptConfiguration
      description: >
        Gets a configuration for the concept of the specified taxonomy. The
        concept-validate service uses this configuration to validate the rule
        syntax of the concept.

        The concept-compile service uses this configuration to generate the binary
        model for scoring the documents.


        For example, if we have a concept called as `sports` with rule as `CLASSIFIER:sports`,
        then the configuration returned for this concept will be as follows: <br>


        ```plain/text
          Concept ID:2c909af65ad543f9015ad54607bf0001
          ENABLE:sports
          FULLPATH:sports:sports
          PRIORITY:sports:10
          CASE_INSENSITIVE_MATCH:sports
          CLASSIFIER:sports:sports
        ```


        The first line represents the ID of the concept for which the configuration
        belongs to. <br>

        The second line is populated based on the `enabled` property of the concept.
        If the value of `enabled` property of the concept is false,

        the configuration won't contain this line. <br>

        The third line represents the full path of the concept.<br>

        The fourth line is populated based on the `priority` property value of the
        concept.<br>

        The fifth line is populated based on the `caseInsensitive` property of the
        concept. If the value is false,

        this line will be `CASE_SENSITIVE_MATCH:sports` <br>

        The last line represents the rule value for the concept along with the concept
        name. <br>
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: |
          The unique identifier of the taxonomy.
        schema:
          type: string
      - name: conceptId
        in: path
        required: true
        description: |
          The unique identifier of the concept.
        schema:
          type: string
      responses:
        "200":
          description: |
            OK. The configuration for the concept was returned.
          content:
            application/vnd.sas.text.concept.configuration+json:
              schema:
                $ref: "#/components/schemas/conceptConfiguration"
              examples:
                api:
                  $ref: "#/components/examples/getConceptConfiguration"
            application/vnd.sas.text.concept.configuration:
              schema:
                $ref: "#/components/schemas/conceptConfiguration"
              examples:
                api:
                  $ref: "#/components/examples/getConceptConfiguration"
            application/json:
              schema:
                $ref: "#/components/schemas/conceptConfiguration"
              examples:
                api:
                  $ref: "#/components/examples/getConceptConfiguration"
        "404":
          description: >
            A concept with the specified ID could not be found in the taxonomy
            with specified taxonomyId.
          content:
            application/vnd.sas.text.concept.configuration+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
            application/vnd.sas.text.concept.configuration:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
  "/taxonomies/{taxonomyId}/state":
    put:
      tags:
      - Taxonomies
      summary: Change the taxonomy state
      operationId: updateTaxonomyState
      description: >
        Changes the state for the given taxonomy. The available states are
        locked and unlocked.
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: |
          The ID of the taxonomy.
        schema:
          type: string
      - name: state
        in: query
        required: true
        description: |
          The state that the taxonomy should be changed to.
        schema:
          type: string
      responses:
        "200":
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the taxonomy was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the taxonomy.
              schema:
                type: string
          description: |
            OK. The state for the taxonomy was changed.
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyResponse"
        "400":
          description: The given state is not an allowed state for a taxonomy.
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error2"
