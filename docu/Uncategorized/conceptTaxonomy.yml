---
openapi: 3.0.3
info:
  version: "5"
  title: Concept Taxonomy
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  description: >
    The Concept Taxonomy REST API enables a user to create a taxonomy
    and also concepts within a specified taxonomy. <br> <br> A concept taxonomy
    is the hierarchical representation of concepts. A concept is a property such
    as a book title, last name, or city. It is defined by rules written in LITI
    syntax. Concepts can be predefined (by SAS) or user-defined (custom)
    concepts. This API allows a user to create such taxonomy and
    concepts.  <br> <br> For example, if we have documents related to news
    articles, we might want to extract documents that talk about sports. We
    might have a concept named "sports" with a rule (value) of:
    `CLASSIFIER:sports`. This concept will match all the documents mentioning
    "sports". Furthermore, one might be interested in only the sport "tennis".
    We can write the concept rule to match such documents. An example rule for
    this "tennis" concept might be: `CONCEPT_RULE:(SENT,"sports","_c{tennis}")`.
    This rule states that if "sports" is mentioned in a sentence along with
    "tennis" in a document, then match that document to the concept named
    "tennis". We support a wide range of operators to develop such rules. More
    details on the rule syntax can be found in the Visual Text Analytics user
    guide.   <br> <br> Once the user has created the concepts in a concept
    taxonomy, he/she can retrieve the configuration of such a taxonomy or a
    concept belonging to a taxonomy. Concept validation uses the taxonomy
    configuration to validate all the concepts defined in a taxonomy and concept
    configuration to validate the rule value of the specified concept.
    Concept compilation uses the configuration value to generate the binary
    model which can be used to score the documents using the concepts scoring
    API. Once the user has scored the documents or piece of text for a
    concept taxonomy, he/she can also view the documents for matching concept
    using the documents API. <br><br>Once the user has scored the documents
    or piece of text for a concept taxonomy, he/she can also view the documents
    for matching concept using the documents API.

    **Note that HEAD is supported for every GET request documented in the API. Simply
    change the HTTP verb from GET to HEAD, leaving other parameters the same.**
tags:
- name: Root
  description: The operations for the root resource.
- name: Jobs
  description: The operations for the jobs.
- name: Taxonomies
  description: The operations for the taxonomies resource.
- name: Concepts
  description: The operations for the concepts resource within a taxonomy.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      operationId: root
      description: |
        Returns the links to the top-level resources for the API.
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "404":
          description: Service is not available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
    head:
      tags:
      - Root
      operationId: headersForRoot
      summary: Get the headers for the API
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      responses:
        "200":
          description: OK.
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "404":
          description: Service is not available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
  /jobs:
    post:
      tags:
      - Jobs
      x-sas-attributes:
        since: "2"
      summary: Submits a new job
      description: Perform all tasks necessary for various job types.
      operationId: createJob
      requestBody:
        content:
          application/vnd.sas.job.execution.job+json:
            schema:
              $ref: "#/components/schemas/job"
            examples:
              api:
                $ref: "#/components/examples/postJobRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/job"
            examples:
              api:
                $ref: "#/components/examples/postJobRequest"
        description: >
          The job execution job submitted to run various tasks such as importing
          concepts and/or getting the configuration for the specified
          taxonomy.<br/>


          The job can be one of four types: import-concepts, concept-validate, concept-compile,
          or concept-configuration-job.


          A job submitted to run one of four types of tasks, as specified by the type
          property of the job definition.


          Import concepts. Job type is import-concepts. Job arguments are passed via
          a file containing the concepts to be imported in json format.

          Once the job status is completed and successful, we return the job results
          again in different file location.

          This file contains the actual message for each of the imported concepts
          along with the http status code.  <br/>


          Validate concepts. Job type is concept-validate. Job arguments are passed
          via a file containing the concepts to be validated in json format.

          Once the job status is completed successfully, we return the job results
          again in a different file location.

          This file contains the actual state of validation and any errors associated
          with validation for the concepts. <br/>


          Compile concepts. Job type is concept-compile. Job arguments are passed
          via a file containing the concepts to be validated in json format.

          Once the job status is completed successfully, we send an http status code
          200 and don't return anything. <br/>


          Get configuration for taxonomy. Job type is concept-configuration-job. Job
          arguments are passed via a file containing the ID of the concept taxonomy
          in json format.

          Once the job status is completed successfully, we return the job results
          again in different file location.

          This file contains the actual configuration of all the concepts existing
          in the specified taxonomy.
        required: true
      responses:
        "201":
          description: The job was accepted.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the job was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the job.
              schema:
                type: string
            Location:
              description: The URL of the job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                api:
                  $ref: "#/components/examples/postJobResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                api:
                  $ref: "#/components/examples/postJobResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/error2"
  /taxonomies:
    get:
      summary: Get a collection of taxonomies
      description: Returns a collection of taxonomies based on the specified pagination
        option. The items in the collection use the `application/vnd.sas.text.concept.taxonomy`
        media type.
      operationId: getTaxonomies
      tags:
      - Taxonomies
      parameters:
      - name: start
        in: query
        description: |
          The index of the first taxonomy to return. The default is 0.
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: >
          The maximum number of taxonomies to return. The actual number of
          returned taxonomies could be less if the collection has been
          exhausted. The default is 20.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortBy
        in: query
        description: >
          Sort returned taxonomies. The sort criteria support the following
          fields in either ascending or descending order (id, name,
          description, language, createdBy, includePredefined, modifiedBy,
          modifiedTimeStamp and creationTimeStamp). The default is
          "creationTimeStamp". See [sorting
          collections](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
          default: creationTimeStamp
      - name: filter
        in: query
        description: >
          Returns taxonomies filtered by the given parameters. Objects can be
          filtered by any fields present on the object itself.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/taxonomyCollection"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomiesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomyCollection"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomiesResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error2"
    post:
      tags:
      - Taxonomies
      summary: Create a new taxonomy
      operationId: createTaxonomy
      description: >
        Creates a new taxonomy based on the representation in the request body.
        The name of the new taxonomy must be set by the user within the request
        body. The name currently does not need to be unique.
      requestBody:
        content:
          application/vnd.sas.text.concept.taxonomy+json:
            schema:
              $ref: "#/components/schemas/createTaxonomy"
            examples:
              api:
                $ref: "#/components/examples/createTaxonomyRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/createTaxonomy"
            examples:
              api:
                $ref: "#/components/examples/createTaxonomyRequest"
        description: The representation of a taxonomy.
        required: true
      responses:
        "201":
          description: A taxonomy was created.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the taxonomy was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the taxonomy.
              schema:
                type: string
            Location:
              description: The URL of the taxonomy.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error2"
  /taxonomies#duplicateTaxonomy:
    post:
      summary: Creates a copy of a taxonomy, including all of the concepts
      operationId: createDuplicateTaxonomy
      description: Creates and returns a new taxonomy.  This endpoint also creates
        copies of all of the concepts.
      tags:
      - Taxonomies
      parameters:
      - name: from
        in: query
        required: true
        description: The ID of the concept taxonomy to copy.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.text.concept.taxonomy+json:
            schema:
              $ref: "#/components/schemas/duplicateTaxonomy"
            examples:
              api:
                $ref: "#/components/examples/duplicateTaxonomyRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/duplicateTaxonomy"
            examples:
              api:
                $ref: "#/components/examples/duplicateTaxonomyRequest"
        description: The representation of a taxonomy.
      responses:
        "201":
          description: The taxonomy was created.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the taxonomy was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the duplicated taxonomy.
              schema:
                type: string
            Location:
              description: The URL of the duplicated taxonomy.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error2"
        "404":
          description: A taxonomy with the given ID could not be found.
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
  "/taxonomies/{taxonomyId}":
    get:
      summary: Get a taxonomy
      operationId: getTaxonomy
      description: Returns the representation of the specified taxonomy.
      tags:
      - Taxonomies
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: The unique identifier for the concept taxonomy.
        schema:
          type: string
      responses:
        "200":
          description: OK. Taxonomy was returned.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the taxonomy was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the taxonomy.
              schema:
                type: string
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyResponse"
        "404":
          description: No taxonomy exists at the requested path.
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
    patch:
      tags:
      - Taxonomies
      summary: Patch a taxonomy
      operationId: patchTaxonomy
      description: Patches the specified taxonomy based on the partial representation
        in the request body. The requested body is a JSON or taxonomy media type.
        The language field of taxonomy cannot be updated once it is created (a 422
        error is thrown).
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: |
          The unique identifier for the taxonomy.
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the taxonomy.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: >
          The time stamp obtained from the most recent `Last-Modified`
          response header. Ignored when `If-Match` is specified.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.text.concept.taxonomy+json:
            schema:
              $ref: "#/components/schemas/updateTaxonomy"
            examples:
              api:
                $ref: "#/components/examples/createTaxonomyRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/updateTaxonomy"
            examples:
              api:
                $ref: "#/components/examples/createTaxonomyRequest"
        description: |
          The partial representation of a taxonomy.
        required: true
      responses:
        "200":
          description: |
            The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the taxonomy was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the taxonomy.
              schema:
                type: string
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyResponse"
        "400":
          description: |
            The taxonomy in the body is invalid or does not have a name defined.
        "404":
          description: |
            A taxonomy with the given ID could not be found.
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
        "412":
          description: >
            The `If-Match` request header did not match the resource's entity
            tag, or the `If-Unmodified-Since` request header did not match the
            resource's last modified timestamp.
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error4"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error4"
        "422":
          description: >
            The language property of a taxonomy cannot be changed once it is
            created.
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/unProcessError"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/unProcessError"
        "428":
          description: >
            The request headers did not include a `If-Match` or
            `If-Unmodified-Since` precondition.
          content:
            application/vnd.sas.text.concept.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error3"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/error3"
    delete:
      tags:
      - Taxonomies
      summary: Delete a taxonomy
      operationId: deleteTaxonomy
      description: >
        Deletes the specified taxonomy and removes it from the system. All the
        concepts contained in the taxonomy are also deleted.
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: |
          The unique identifier for the taxonomy.
        schema:
          type: string
      responses:
        "204":
          description: |
            The taxonomy was deleted.
        "404":
          description: |
            A taxonomy with the given taxonomyId could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
  "/taxonomies/{taxonomyId}/configuration":
    get:
      tags:
      - Taxonomies
      summary: Get the taxonomy configuration in specific format
      operationId: getTaxonomyConfiguration
      description: >
        Gets a configuration for all concepts within a specific taxonomy.

        The taxonomy configuration is the collection of the configuration for all
        the

        concepts separated by new line which can be used to create a binary model

        to match the text/documents to the defined concepts.

        For individual concept configuration structure, please refer to the end point

        for getting the configuration for the specified concept.

        If all the concepts in a taxonomy have enabled field as false and

        all the concepts are helper/supporting concepts,

        the returned configuration for the taxonomy will be empty.
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: |
          The unique identifier for the taxonomy.
        schema:
          type: string
      responses:
        "200":
          description: |
            OK. The configuration for a taxonomy was returned.
          content:
            application/vnd.sas.text.concept.taxonomy.configuration+json:
              schema:
                $ref: "#/components/schemas/taxonomyConfiguration"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyConfigurationResponse"
            application/vnd.sas.text.concept.taxonomy.configuration:
              schema:
                $ref: "#/components/schemas/taxonomyConfiguration"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyConfigurationResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomyConfiguration"
              examples:
                api:
                  $ref: "#/components/examples/getTaxonomyConfigurationResponse"
        "404":
          description: |
            A taxonomy with the given ID could not be found.
          content:
            application/vnd.sas.text.concept.taxonomy.configuration+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
            application/vnd.sas.text.concept.taxonomy.configuration:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundError"
  "/taxonomies/{taxonomyId}/concepts":
    get:
      tags:
      - Concepts
      summary: Get a collection of concepts belonging to a taxonomy
      operationId: getConcepts
      description: >
        Returns a collection of concepts within the specified taxonomy based on
        the specified pagination. The items in the collection use the
        `application/vnd.sas.text.concept` media type.
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: >
          The unique identifier for the taxonomy for which the contained
          concepts will be listed.
        schema:
          type: string
      - name: start
        in: query
        description: >
          The index of the first concept to return belonging to the specified
          taxonomy.
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: >
          The maximum number of concepts to return. The actual number of
          returned concepts could be less if the collection has been
          exhausted. The default is 20.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortBy
        in: query
        description: >
          Sort returned concepts in specified taxonomy. The sort criteria
          support the following fields in either ascending or descending order
          (id, name, priority, caseInsensitive, enabled, predefined,
          validationNeeded, hasInvalidChild, isHelper, parentId, createdBy,
          value, taxonomyId, modifiedBy, modifiedTimeStamp and
          creationTimeStamp). The default is "creationTimeStamp". See [sorting
          collections](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
          default: creationTimeStamp
      - name: topLevelOnly
        in: query
        description: >
          If set to TRUE, this option returns only top-level concepts
          (default). If set to FALSE, all concepts in the hierarchy are
          returned.
        schema:
          type: boolean
          default: true
      - name: predefinedOnly
        in: query
        description: >
          If set to FALSE, returns all concepts (default). If set to TRUE,
          only predefined concepts in the hierarchy are returned.
        schema:
          type: boolean
          default: false
      - name: includeValue
        in: query
        description: >
          If set to FALSE, all concepts returned will have an empty value
          field. If set to TRUE, all concepts returned will have their correct
          value field.
        schema:
          type: boolean
          default: false
