---
openapi: 3.0.3
info:
  title: Formats
  version: "3"
  description: The Formats Service API provides a list of formatted values for input
    list of numeric values.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: "http://example.com/formats"
  description: kubernetes mock server
tags:
- name: Root
  description: The API root.
- name: User
  description: The operations for non-adminstrator user consumption.
paths:
  /: # root path
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: root
      description: Returns the links to the top-level resources of the API
      responses:
        "200":
          description: Version information about the API, as well as top level API
            entry points.
          headers:
            Content-Type:
              description: application/vnd.sas.api+json
              schema:
                type: object
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              example:
                $ref: "#/components/examples/api/value"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              example:
                $ref: "#/components/examples/api/value"
  /format:
    post:
      tags:
      - User
      summary: Format sets of values
      operationId: getFormat
      description: Get via Post. Format the given sets of values.
      requestBody:
        required: true
        content:
          application/vnd.sas.formats.format.values+json:
            schema:
              $ref: "#/components/schemas/formatRequestSchema"
            examples:
              withoutValueSet:
                $ref: "#/components/examples/formatRequestWithoutValueSet"
              withValueSet:
                $ref: "#/components/examples/formatRequestWithValueSet"
          application/json:
            schema:
              $ref: "#/components/schemas/formatRequestSchema"
            examples:
              withoutValueSet:
                $ref: "#/components/examples/formatRequestWithoutValueSet"
              withValueSet:
                $ref: "#/components/examples/formatRequestWithValueSet"
      responses:
        "200":
          description: OK. Returns list of formatted values
          content:
            application/vnd.sas.formats.format.values+json:
              schema:
                $ref: "#/components/schemas/formatResponseSchema"
              example:
                $ref: "#/components/examples/formatResponseExample"
            application/json:
              schema:
                $ref: "#/components/schemas/formatResponseSchema"
              example:
                $ref: "#/components/examples/formatResponseExample"
        "404":
          $ref: "#/components/responses/resourceNotFoundResponse"
        "400":
          $ref: "#/components/responses/badRequestResponse"
  /parse: # parse path
    post:
      tags:
      - User
      summary: Parse sets of formatted values
      operationId: getParsedValuesList
      description: Get via Post. Parse the given sets of formatted values.
      requestBody:
        required: true
        content:
          application/vnd.sas.formats.parse.values+json:
            schema:
              $ref: "#/components/schemas/parseRequestSchema"
            examples:
              withoutValueSet:
                $ref: "#/components/examples/parseRequestWithoutValueSet"
              withValueSet:
                $ref: "#/components/examples/parseRequestWithValueSet"
              withValuesAndValueSets:
                $ref: "#/components/examples/parseRequestWithValuesAndValueSets"
          application/json:
            schema:
              $ref: "#/components/schemas/parseRequestSchema"
            examples:
              withoutValueSet:
                $ref: "#/components/examples/parseRequestWithoutValueSet"
              withValueSet:
                $ref: "#/components/examples/parseRequestWithValueSet"
              withValuesAndValueSets:
                $ref: "#/components/examples/parseRequestWithValuesAndValueSets"
      responses:
        "200":
          description: OK. Returns list of values
          content:
            application/vnd.sas.formats.parse.values+json:
              schema:
                $ref: "#/components/schemas/parseResponseSchema"
              example:
                $ref: "#/components/examples/parseExample"
            application/json:
              schema:
                $ref: "#/components/schemas/parseResponseSchema"
              example:
                $ref: "#/components/examples/parseExample"
        "404":
          $ref: "#/components/responses/resourceNotFoundResponse"
        "400":
          $ref: "#/components/responses/badRequestResponse"
  /capabilities: # capabilities path
    get:
      tags:
      - User
      summary: Get a combined list of format names and locale with cldr version
      operationId: getcapabilities
      description: Get a list of supported format names and locales with cldr version
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: application/vnd.sas.formats.capabilities+json
              schema:
                type: object
          content:
            application/vnd.sas.formats.capabilities+json:
              schema:
                $ref: "#/components/schemas/capabilitiesResponseSchema"
              example:
                $ref: "#/components/examples/capabilitiesExample"
            application/json:
              schema:
                $ref: "#/components/schemas/capabilitiesResponseSchema"
              example:
                $ref: "#/components/examples/capabilitiesExample"
        "404":
          $ref: "#/components/responses/resourceNotFoundResponse"
        "400":
          $ref: "#/components/responses/badRequestResponse"
components: # Reusable components
  responses:
    resourceNotFoundResponse: # Resource not found 404 status code response
      description: Resource not found
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            $ref: "#/components/examples/resourceNotFound/value"
        application/json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            $ref: "#/components/examples/resourceNotFound/value"
    badRequestResponse: # Invalid or missing request body 400 status code response
      description: Bad Request. Invalid or missing request body
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            $ref: "#/components/examples/badRequestError/value"
        application/json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            $ref: "#/components/examples/badRequestError/value"
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error:
      $ref: "#/components/schemas/error2"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    formatRequestSchema: # Format Request Schema
      description: Representation of format request object
      type: object
      properties:
        groups:
          type: array
          description: Collection of all the format group objects
          uniqueItems: true
          items:
            description: The items in the groups array are the format group objects
            required:
            - name
            - format
            - language
            - values
            properties:
              name:
                type: string
                minLength: 1
                description: Group name
              format:
                type: string
                minLength: 1
                description: Supported Format name which can be discoverable at `GET
                  /formats/capabilities`
              language:
                type: string
                minLength: 1
                description: Supported Language which can be discoverable at `GET
                  /formats/capabilities`
              values:
                oneOf:
                - type: array
                  minItems: 1
                  items:
                    type: number
                    description: Values to be formatted are passed as array of numbers
                - type: string
                  description: Name of the valueSet given in the valueSets array
        valueSets:
          type: array
          description: "Array of key-value pairs in the form of valueSetName : Array\
            \ of numbers"
          uniqueItems: true
          minItems: 0
          items:
            type: object
            properties:
              valueSetName:
                type: array
                items:
                  type: number
    parseRequestSchema: # Parse Request Schema
      description: Representation of parse request object
      type: object
      properties:
        groups:
          type: array
          description: Collection of all the format group objects
          uniqueItems: true
          items:
            description: The items in the groups array are the format group objects
            required:
            - name
            - format
            - language
            - formattedValues
            properties:
              name:
                type: string
                minLength: 1
                description: Group name
              format:
                type: string
                minLength: 1
                description: Supported Format name which can be discoverable at `GET
                  /formats/capabilities`
              language:
                type: string
                minLength: 1
                description: Supported Language which can be discoverable at `GET
                  /formats/capabilities`
              formattedValues:
                oneOf:
                - type: array
                  minItems: 1
                  items:
                    type: string
                    description: Formatted values to parse are passed as array of
                      strings
                - type: string
                  description: Name of the valueSet given in the valueSets array
        valueSets:
          type: array
          description: "Array of key-value pairs in the form of valueSetName : Array\
            \ of strings"
          minItems: 0
          items:
            type: object
            properties:
              valueSetName:
                type: array
                items:
                  type: string
    formatResponseSchema: # Format Response Schema
      description: Representation of format response object
      type: object
      properties:
        groups:
          type: array
          description: Collection of all the format group objects
          uniqueItems: true
          items:
            description: The items in the groups array are the format group objects
            required:
            - name
            - format
            - language
            - values
            properties:
              name:
                type: string
                minLength: 1
                description: Group name
              format:
                type: string
                minLength: 1
                description: Supported Format name which can be discoverable at `GET
                  /formats/capabilities`
              language:
                type: string
                minLength: 1
                description: Supported Language which can be discoverable at `GET
                  /formats/capabilities`
              formattedValues:
                type: array
    parseResponseSchema: # Parse Response Schema
      description: Representation of parse response object
      type: object
      properties:
        groups:
          type: array
          description: Collection of all the format group objects
          uniqueItems: true
          items:
            description: The items in the groups array are the format group objects
            required:
            - name
            - format
            - language
            - values
            properties:
              name:
                type: string
                minLength: 1
                description: Group name
              format:
                type: string
                minLength: 1
                description: Supported Format name which can be discoverable at `GET
                  /formats/capabilities`
              language:
                type: string
                minLength: 1
                description: Supported Language which can be discoverable at `GET
                  /formats/capabilities`
              values:
                type: array
    capabilitiesResponseSchema: # Capabilities Response Schema
      description: Representation of capabilities, including supported format names
        and locales with cldr version
      type: object
      properties:
        formats:
          type: array
          description: Collection of all the format types supported
          items:
            description: format name
            properties:
              name:
                type: string
                minLength: 1
                description: format name
        locales:
          type: array
          description: List of all locales supported
          items:
            type: string
        cldrVersion:
          type: string
          minLength: 1
          description: cldr version
        version:
          type: integer
          description: The version number of the capabilities representation. This
            representation is version 1.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
  examples:
    api: # Root API example
      value:
        version: 1
        links: [{"method": "POST", "rel": "format", "href": "/formats/format", "uri": "/formats/format",
            "type": "application/vnd.sas.formats.format.values+json"}, {"method": "POST",
            "rel": "parse", "href": "/formats/parse", "uri": "/formats/parse", "type": "application/vnd.sas.formats.parse.values+json"},
          {"method": "GET", "rel": "capabilities", "href": "/formats/capabilities",
            "uri": "/formats/capabilities", "type": "application/vnd.sas.formats.capabilities+json"}]
      description: sample api for documentation
    resourceNotFound: # Resource not found error example
      value:
        message: "Resource Not Found"
        httpStatusCode: 404
        version: 2
      description: example of an error that might be returned on a 404 response
    badRequestError: # Bad request error example
      value:
        message: "Bad Request"
        httpStatusCode: 400
        version: 2
      description: "this is an example of an error that could be returned for bad\
        \ requests"
    formatResponseExample: # format example
      value:
        groups:
        - name: g1
          format: percent6.2
          language: en_US
          formattedValues:
          - 1,234.00%
          - 1,375.00%
          - 1,456.00%
        - name: g2
          format: euro7.2
          language: fr_FR
          formattedValues:
          - 100,00 €
          - 3 138,00 €
          - 1 278,00 €
        - name: g3
          format: qtr6.
          language: en_US
          formattedValues:
          - 1st quarter
          - 2nd quarter
          - 4th quarter
      description: Sample format group response values
    parseExample: # parse example
      value:
        groups:
        - name: g1
          format: DATETIME
          language: en_US
          values:
          - 1000.0
          - -1000.0
          - 0.0
        - name: g2
          format: euro7.2
          language: fr_FR
          values:
          - 100.0
          - 3178.0
          - 1278.0
        - name: g3
          format: qtr6.
          language: en_US
          values:
          - 0.0
          - 91.0
          - 182.0
      description: sample group formatted values
    capabilitiesExample: # capabilities example
      value:
        formats:
        - name: COMMA
        - name: BEST
        - name: PERCENT
        locales:
        - en_US
        - fr_FR
        - zh_CN
        cldrVersion: "40"
        version: 1
      description: sample response for capabilities
    formatRequestWithoutValueSet: # format without valueSets example
      value:
        groups:
        - name: g1
          format: percent6.2
          language: en_US
          values:
          - 12.34
          - 13.75
          - 14.56
        - name: g2
          format: euro7.2
          language: fr_FR
          values:
          - 100
          - 3138
          - 1278
        - name: g3
          format: qtr6.
          language: en_US
          values:
          - 1
          - 121
          - 365
      description: sample request for format with array of numbers as values
    formatRequestWithValueSet: # format with valueSets example
      value:
        groups:
        - name: g1
          format: percent6.2
          language: en_US
          values: v1
        - name: g2
          format: euro7.2
          language: fr_FR
          values: v2
        - name: g3
          format: qtr6.
          language: en_US
          values: v3
        valueSets:
        - v1: [12.34, 13.75, 14.56]
        - v2: [100, 3138, 1278]
        - v3: [1, 121, 365]
      description: Sample request for format with valueSets
    parseRequestWithoutValueSet: # Parse without valueSets example
      value:
        groups:
        - name: g1
          format: DATETIME
          language: en_US
          formattedValues:
          - "January 1, 1960 12:16:40 AM"
          - "December 31, 1959 11:43:20 PM"
          - "January 1, 1960 12:00:00 AM"
        - name: g2
          format: euro7.2
          language: fr_FR
          formattedValues:
          - "100,00 €"
          - "3178,00 €"
          - "1278,00 €"
        - name: g3
          format: qtr6.
          language: en_US
          formattedValues:
          - "1st quarter"
          - "2nd quarter"
          - "3rd quarter"
      description: sample for parse
    parseRequestWithValueSet: # Parse with valueSets example
      value:
        groups:
        - name: g1
          format: DATETIME
          language: en_US
          formattedValues: "v1"
        - name: g2
          format: euro7.2
          language: fr_FR
          formattedValues: "v2"
        - name: g3
          format: qtr6.
          language: en_US
          formattedValues: "v3"
        valueSets:
        - v1: ["January 1, 1960 12:16:40 AM", "December 31, 1959 11:43:20 PM", "January\
              \ 1, 1960 12:00:00 AM"]
        - v2: ["100,00 €", "3178,00 €", "1278,00 €"]
        - v3: ["1st quarter", "2nd quarter", "3rd quarter"]
      description: sample for parse with group formatted values with valueSets
    parseRequestWithValuesAndValueSets: # Parse with values and valueSets example
      value:
        groups:
        - name: g1
          format: DATETIME
          language: en_US
          formattedValues:
          - "January 1, 1960 12:16:40 AM"
          - "December 31, 1959 11:43:20 PM"
          - "January 1, 1960 12:00:00 AM"
        - name: g2
          format: euro7.2
          language: fr_FR
          formattedValues:
          - "100,00 €"
          - "3178,00 €"
          - "1278,00 €"
        - name: g3
          format: qtr6.
          language: en_US
          formattedValues: "v1"
        valueSets:
        - v1: ["1st quarter", "2nd quarter", "3rd quarter"]
      description: Sample for parse with group formatted values with both values and
        valueSets
