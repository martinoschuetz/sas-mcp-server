---
openapi: 3.0.3
info:
  title: Credentials
  description: >
    The Credentials API provides secrets management for external databases and other
    resources. Credentials are organized
    under domains and may be accessible to users, group, or client applications.<br><br>

    #### Terms and Concepts <br>

    An **identity** is either a **user** or a **group**. A group is a collection of
    users and/or groups. Users and groups are surfaced and
    managed by **SAS Identities**.<br><br>
    A **client** is an OAuth client application registered with **SAS Logon Manager**.  Client
    groups are not supported.<br><br>
    An external system typically consists of a server controlling resources and secured
    by an authentication provider. It is represented by
    a **domain** in the Credentials API. A **credential** describes the information
    needed for authenticating against such an
    authentication provider so that those external resources can be accessed. A credential
    belongs to an identity or client and is associated
    with a domain.<br><br>
    If one or more clients, users or groups have credentials to access an external
    system, the domain will have multiple credentials
    associated with it.<br><br>
    If a user belongs to a group and the group has a credential for a domain, the
    group credential can optionally be used be for access
    if that user does not have a user credential. <br><br>

    If the server controlling the resources can be accessed using more than one type
    of authentication (e.g., password authentication
    and ssh authentication) the server should be modeled using one domain for each
    authentication type.<br><br>

    This api provides endpoints to perform various CRUD operations on domains and
    credentials.  Those operations are described in the
    sections on *Domain management* and *Credential management* respectively in the
    *Operations* section.<br><br>
    There are two parts to a credential: a public part and a
    secret part, corresponding to the *properties* and *secrets* attributes of the
    Credential representation object.  None of the
    endpoints in the Credential management section return the secret part.<br><br>

    This API does not impose any particular schema for credentials other than what
    is imposed by the credential representation object.
    Of particular interest to consumers are three members of the schema: *type*, *properties*
    and *secrets*.  The administrative
    application used to define domains and credentials is at liberty to choose  an
    appropriate value for *type* with the one exception
    for passwords discussed in the credential schema.  The application can also determine
    which attributes of a credential should
    be persisted in *properties* and which attributes in *secrets*.  All values persisted
    in the *secrets* section are encrypted.<br><br>

    **Secrets are only obtained by the single endpoint in the *Secrets lookup* section.**<br><br>

    #### Consumers<br>

    Domain management and Credential management end-points are used to create and
    maintain sets of credentials for various domains
    and are typically used in an administrative type application which provides the
    ability to perform such functions.
    <br><br>
    The single secrets lookup end-point surfaces a credential's secret and is invoked
    by an application
    that needs the credential to access the resource secured by the credential.  Such
    an application would invoke the end-point with
    the access token of the user or client whose credential secret is needed.<br><br>

    #### Security

    **Authentication:**<br><br>

    The API is secured and only accessible by authenticated users.<br><br>

    **Authorization:** <br><br>

    End-points do not all have the same access requirements. The Authorization section
    for each end-point describes the
    access requirements for that end-point.<br><br>

    **Encoding of secrets values**<br><br>

    One of the members in the credential schema is `secrets`, which is a map.  When
    persisted the key is
    a string and the value is binary.  However for transmission purposes the secrets
    values are encoded in a Base64 string.
    Even though transmission is expected to occur over an encrypted connection, Base64
    encoding is used to protect from "shoulder surfing".
    <br><br>
    **Secret Encoding** <br><br>

    The discussion in the description column of the credential schema describes restrictions
    on the values of the various attributes. For the secrets attribute, the value
    is a string-string map and each map property has a value which has to be Base64
    encoded using "The Base64 Alphabet" as specified in Table 1 of RFC 4648 and RFC
    2045. If the encoding is done using Java 8, java.util.Base64's "Basic" encoding
    provides conforming encoding. The encoding algorithm is of importance if you're
    using a language other than Java as both sides must use the same encoding mechanism.
    If Java is the language being used to communicate with the Credentials API, you
    have the option of using the Credential representation object to perform the encoding.
    This object has four different types of setters and getters, depending on whether
    the secret is binary or text and Base64 encoded or not.<br><br>

    Some examples using the Credential representation object may help. Let's say a
    credential with a password value of "Password123" needs to be created. A string-string
    secrets map would be created with a key of "password" and a value of "Password123"
    and the setDecodedSecrets() method would be called. This would result in the Base64
    string version of this secret being stored in the representation object and this
    Base64 version gets sent across the wire. If one has a binary secret (e.g. a fingerprint),
    a string-byte_array map would get created and the setBinarySecrets() would get
    called, which once again would result in a Base64 string version being stored
    for transmission. On the API side, the Base64 string which comes across the wire
    is decoded into a byte array which is stored in the database.<br><br>

    Getting the secret from the API works similarly. In the string secret case, the
    JSON over the wire would contain the Base64 encoded value of "Password123" and
    getDecodedSecrets() would decode that so the map value is "Password123".
  version: "2"
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: "devex@sas.com"
servers:
- url: http://example.com/credentials
  description: This is an example base URL.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Domain Management
  description: Contains operations for managing domains resource.
- name: Credential Management
  description: Contains operations for managing credentials resource.
- name: Secrets Lookup
  description: Contains operations for looking up secrets resource.
paths:
  /:
    get:
      tags:
      - Root
      operationId: root
      summary: Get a collection of top-level links
      description: >
        Returns a list containing a link to only top-level collections surfaced
        by this API, which is the list of domains. <p> <b>Authorization:</b> Any
        authenticated user or client. </p>
      responses:
        "200":
          description: OK - returns the collection of top level links
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/links"
              examples:
                json:
                  $ref: "#/components/examples/rootLinks"
            application/json:
              schema:
                $ref: "#/components/schemas/links"
              examples:
                json:
                  $ref: "#/components/examples/rootLinks"
    head:
      tags:
      - Root
      operationId: headersForRoot
      summary: Check if the credentials API is available
      description: >
        Returns whether or not the credentials API is running. <p>
        <b>Authorization:</b> Any authenticated user or client. </p>
      responses:
        "200":
          description: OK - the service is running and available
          headers:
            Content-Type:
              schema:
                type: string
  /domains:
    get:
      summary: Return collection of domains
      operationId: getDomains
      description: >
        Returns the collection of domains defined. <p> <b>Authorization:</b> Any
        authenticated user or client. </p>
      tags:
      - Domain Management
      responses:
        "200":
          description: The collection of domains
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/domainCollection"
              examples:
                json:
                  $ref: "#/components/examples/getDomainsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/domainCollection"
              examples:
                json:
                  $ref: "#/components/examples/getDomainsResponse"
        "400":
          description: Bad request - if an invalid query parameter was specified
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/domainListErrorResponse"
      parameters:
      - name: start
        in: query
        description: Offset of the first domain to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of domains to return.  Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: Filter criteria for returned domains. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/credentials-v2/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
      - name: sortBy
        in: query
        description: Sort the returned collection.  Sorting is supported by id, type,
          description and label.
        schema:
          type: string
  "/domains/{domainId}":
    head:
      summary: Does domain exist
      operationId: headersForDomain
      description: >
        Returns whether the domain specified in the request exists. <p>
        <b>Authorization:</b> Any authenticated user or client. </p>
      tags:
      - Domain Management
      responses:
        "200":
          description: OK - the requested domain exists.
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: Not Found - the requested domain does not exist.
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
    get:
      summary: Return domain
      operationId: getDomain
      description: >
        Returns the domain specified in the request. <p> <b>Authorization:</b>
        Any authenticated user or client. </p>
      tags:
      - Domain Management
      responses:
        "200":
          description: The requested domain object.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.credential.domain+json:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                json:
                  $ref: "#/components/examples/getDomainResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                json:
                  $ref: "#/components/examples/getDomainResponse"
        "404":
          description: Not Found - the requested domain does not exist.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/domainNotFoundErrorResponse"
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
    put:
      summary: Create or update domain
      operationId: updateDomain
      description: >
        Creates a new domain or updates the existing domain specified in the
        request.  This method performs a full  replacement of the domain
        resource.  The id may not be changed and the type may only be changed if
        there are no credentials associated with the domain. <p>
        <b>Authorization:</b> An authenticated user who is a member of the
        SASAdministrators group or client who is a member of the sasapp group.
        </p>
      tags:
      - Domain Management
      responses:
        "200":
          description: OK - returns the updated domain object.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.credential.domain+json:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                json:
                  $ref: "#/components/examples/crtDomainResp"
            application/json:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                json:
                  $ref: "#/components/examples/crtDomainResp"
        "201":
          description: Created - returns the updated domain object.
          content:
            application/vnd.sas.credential.domain+json:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                json:
                  $ref: "#/components/examples/crtDomainResp"
            application/json:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                json:
                  $ref: "#/components/examples/crtDomainResp"
        "400":
          description: Bad Request.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/badRequestErrorResponse"
        "412":
          description: >
            Precondition failed - the type may not be changed as credentials
            with that domain name are present.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/typeChangeErrorResponse"
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.credential.domain+json:
            schema:
              $ref: "#/components/schemas/domainIn"
            examples:
              json:
                $ref: "#/components/examples/domaininBody"
          application/json:
            schema:
              $ref: "#/components/schemas/domainIn"
            examples:
              json:
                $ref: "#/components/examples/domaininBody"
        description: the domain to be created
        required: true
    delete:
      summary: Delete domain
      operationId: deleteDomain
      description: >
        Deletes the domain specified in the request. <p> If there are
        credentials associated with the domain the domain can only be deleted by
        specifying  includeCredentials=true which results in the deletion of the
        credentials associated with the domain in addition to the deletion of
        the domain. </p> <p> <b>Authorization:</b> An authenticated user who is
        a member of the SASAdministrators group. </p>
      tags:
      - Domain Management
      responses:
        "204":
          description: No Content - the object was deleted successfully.
        "404":
          description: Not Found - the requested domain could not be deleted.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/domainNotFoundErrorResponse"
        "409":
          description: >
            Conflict - credentials with that domain name are
            present.  See the includeCredentials query parameter.
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: includeCredentials
        in: query
        description: >
          Setting to true will force the deletion of a domain and associated
          credentials.  False, if not specified.  
        schema:
          type: boolean
  "/domains/{domainId}/credentials":
    get:
      summary: Return collection of credentials for domain
      operationId: getDomainCredentials
      description: >
        Returns the collection of credentials for the domain specified in the
        request. Query parameters can be used to get only user credentials or
        only group credentials, if so desired. <p> Secrets are not returned by
        this request. </p> <p> <b>Authorization:</b> An authenticated user who
        is a member of the SASAdministrators group. </p>
      tags:
      - Domain Management
      responses:
        "200":
          description: The collection of credentials.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                items:
                  $ref: "#/components/schemas/credentialCollection"
              examples:
                json:
                  $ref: "#/components/examples/domainCredentialsResponse"
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/credentialCollection"
              examples:
                json:
                  $ref: "#/components/examples/domainCredentialsResponse"
        "404":
          description: Not Found - the requested domain does not exist.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/domainNotFoundErrorResponse"
        "400":
          description: Bad request - if an invalid query parameter was specified
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/badRequestErrorResponse"
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: Offset of the first credential to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of credentials to return.  Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: Filter criteria for returned domains. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/credentials-v2/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
      - name: sortBy
        in: query
        description: Sort the returned collection.  Sorting is supported by identityType
          and identityId.
        schema:
          type: string
  "/domains/{domainId}/clients/{clientId}":
    head:
      summary: Does client credential exist
      operationId: headersForClientCredential
      description: >
        Determines whether the credential specified by the domain and the client
        in the request exists. <p> <b>Authorization:</b> An authenticated client
        which is the owner of the credential or a member of the
        SASAdministrators group. </p>
      tags:
      - Credential Management
      responses:
        "200":
          description: OK - the requested credential exists.
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: Not Found - the requested credential does not exist.
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        description: The id of the request client.
        required: true
        schema:
          type: string
    get:
      summary: Return client credential
      operationId: getClientCredential
      description: >
        Returns the credential specified by the domain and the client in the
        request. <p> Secrets are not returned by this request. </p> <p>
        <b>Authorization:</b> An authenticated client which is the owner of the
        credential or a member of the SASAdministrators group. </p>
      tags:
      - Credential Management
      responses:
        "200":
          description: The requested credential object.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.credential+json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/clientCredentialsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/clientCredentialsResponse"
        "404":
          description: Not Found - the requested credential does not exist.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/clientCredentialNotFoundErrorResponse"
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        description: The id of the request client.
        required: true
        schema:
          type: string
    put:
      summary: Create or update client credential
      operationId: updateClientCredential
      description: >
        Creates a new credential or updates the existing credential specified by
        the domain and the client in the request.  This method performs a full
        replacement of the credential resource. <p> Secrets are not returned by
        this request. </p> <p> <b>Authorization:</b> An authenticated client
        which is the owner of the credential or a member of the
        SASAdministrators group. </p>
      tags:
      - Credential Management
      responses:
        "200":
          description: OK - returns the updated credential object.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.credential+json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credClientResp"
            application/json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credClientResp"
        "201":
          description: Created - returns the created credential object.
          content:
            application/vnd.sas.credential+json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credClientResp"
            application/json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credClientResp"
        "400":
          description: Bad Request.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/badRequestErrorResponse"
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        description: The id of the request client.
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/credentialInClient"
    delete:
      summary: Delete client credential
      operationId: deleteClientCredential
      description: >
        Deletes the credential specified by the domain and the client in the
        request. <p> <b>Authorization:</b> An authenticated client which is the
        owner of the credential or a member of the SASAdministrators group. </p>
      tags:
      - Credential Management
      responses:
        "204":
          description: No Content - the object was deleted successfully.
        "404":
          description: Not Found - the requested domain could not be deleted.
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        description: The id of the request client.
        required: true
        schema:
          type: string
  "/domains/{domainId}/groups/{groupId}":
    head:
      summary: Does group credential exist
      operationId: headersForGroupCredential
      description: >
        Determines whether the credential specified by the domain and the group
        in the request exists. <p> <b>Authorization:</b> An authenticated user
        who is a member of the SASAdministrators group. </p>
      tags:
      - Credential Management
      responses:
        "200":
          description: OK - the requested credential exists.
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: Not Found - the requested credential does not exist.
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: groupId
        in: path
        description: The id of the request group.
        required: true
        schema:
          type: string
    get:
      summary: Return group credential
      operationId: getGroupCredential
      description: >
        Returns the credential specified by the domain and the group in the
        request. <p> Secrets are not returned by this request. </p> <p>
        <b>Authorization:</b> An authenticated user who is a member of the
        SASAdministrators group. </p>
      tags:
      - Credential Management
      responses:
        "200":
          description: The requested credential object.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.credential+json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/groupCredentialsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/groupCredentialsResponse"
        "404":
          description: Not Found - the requested credential does not exist.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/clientCredentialNotFoundErrorResponse"
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: groupId
        in: path
        description: The id of the request group.
        required: true
        schema:
          type: string
    put:
      summary: Create or update group credential
      operationId: updateGroupCredential
      description: >
        Creates a new credential or updates the existing credential specified by
        the domain and the  group in the request.  This method performs a full
        replacement of the credential resource.   <p> Secrets are not returned
        by this request. </p> <p> <b>Authorization:</b> An authenticated user
        who is a member of the SASAdministrators group. </p>
      tags:
      - Credential Management
      responses:
        "200":
          description: OK - returns the updated credential object.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.credential+json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credGroupResp"
            application/json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credGroupResp"
        "201":
          description: Created - returns the created credential object.
          content:
            application/vnd.sas.credential+json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credGroupResp"
            application/json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credGroupResp"
        "400":
          description: Bad Request.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/badRequestErrorResponse"
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: groupId
        in: path
        description: The id of the request group.
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/credentialInGroup"
    delete:
      summary: Delete group credential
      operationId: deleteGroupCredential
      description: >
        Deletes the credential specified by the domain and the group in the
        request. <p> <b>Authorization:</b> An authenticated user who is a member
        of the SASAdministrators group. </p>
      tags:
      - Credential Management
      responses:
        "204":
          description: No Content - the object was deleted successfully.
        "404":
          description: Not Found - the requested domain could not be deleted.
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: groupId
        in: path
        description: The id of the request group.
        required: true
        schema:
          type: string
  "/domains/{domainId}/users/{userId}":
    head:
      summary: Does user credential exist
      operationId: headersForUserCredential
      description: >
        Determines whether the credential specified by the domain and the user
        in the request exists. <p> <b>Authorization:</b> An authenticated user
        who is the owner of the credential or a member of the SASAdministrators
        group. </p>
      tags:
      - Credential Management
      responses:
        "200":
          description: OK - the requested credential exists.
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: Not Found - the requested credential does not exist.
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: The id of the request user.  The @currentUser delegate may be
          used to indicate the id of the currently authenticated user.
        required: true
        schema:
          type: string
    get:
      summary: Return user credential
      operationId: getUserCredential
      description: >
        Returns the credential specified by the domain and the user in the
        request. <p> Secrets are not returned by this request. </p> <p>
        <b>Authorization:</b> An authenticated user who is the owner of the
        credential or a member of the SASAdministrators group. </p>
      tags:
      - Credential Management
      responses:
        "200":
          description: The requested credential object.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.credential+json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/userCredentialsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/userCredentialsResponse"
        "404":
          description: Not Found - the requested credential does not exist.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/clientCredentialNotFoundErrorResponse"
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: The id of the request user.  The @currentUser delegate may be
          used to indicate the id of the currently authenticated user.
        required: true
        schema:
          type: string
    put:
      summary: Create or update user credential
      operationId: updateUserCredential
      description: >
        Creates a new credential or updates the existing credential specified by
        the domain and the user in the request.  This method performs a full
        replacement of the credential resource. <p> Secrets are not returned by
        this request. </p> <p> <b>Authorization:</b> An authenticated user who
        is the owner of the credential or a member of the SASAdministrators
        group. </p>
      tags:
      - Credential Management
      responses:
        "200":
          description: OK - returns the updated credential object.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.credential+json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credUserResp"
            application/json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credUserResp"
        "201":
          description: Created - returns the created credential object.
          content:
            application/vnd.sas.credential+json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credUserResp"
            application/json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/credUserResp"
        "400":
          description: Bad Request.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/badRequestErrorResponse"
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: The id of the request user.  The @currentUser delegate may be
          used to indicate the id of the currently authenticated user.
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/credentialInUser"
    delete:
      summary: Delete user credential
      operationId: deleteUserCredential
      description: >
        Deletes the credential specified by the domain and the user in the
        request. <p> <b>Authorization:</b> An authenticated user who is the
        owner of the credential or a member of the SASAdministrators group. </p>
      tags:
      - Credential Management
      responses:
        "204":
          description: No Content - the object was deleted successfully.
        "404":
          description: Not Found - the requested domain could not be deleted.
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: The id of the request user.  The @currentUser delegate may be
          used to indicate the id of the currently authenticated user.
        required: true
        schema:
          type: string
  "/domains/{domainId}/secrets":
    head:
      summary: Do credential secrets exist
      operationId: headersForSecrets
      description: >
        Returns whether a credential <b>including the secrets</b> in the specified
        domain exists.<p>
        <b>Authorization:</b><br/> Any authenticated user<br/> </p>
      tags:
      - Secrets Lookup
      responses:
        "200":
          description: OK - the requested credential exists.
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: Not Found - the requested credential does not exist.
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: lookupInGroup
        in: query
        description: >
          By default if a credential is not available, groups of which this
          identity is a member of are not searched.  By setting this query
          parameter to true enclosing groups will be searched for a
          credential.
        schema:
          type: boolean
      - name: scope
        in: query
        description: >
          For use with "oauth2.0" domains types, return an access token with
          the specified scope, or the default scopes if the value is an empty
          string. A "refresh_token" credential must be available to obtain the
          token from the issuing provider.
        schema:
          type: string
    get:
      summary: Return credential secret
      operationId: getSecretsForDomain
      description: >
        Returns a credential <b>including the secrets</b> in the specified
        domain. <p>
        <b>Authorization:</b><br/> Any authenticated user<br/> </p>
      tags:
      - Secrets Lookup
      responses:
        "200":
          description: The requested credential object.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.credential+json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/secretsResp"
            application/json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                json:
                  $ref: "#/components/examples/secretsResp"
        "404":
          description: Not Found - the requested credential does not exist.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/secretsNotFoundErrorResponse"
      parameters:
      - name: domainId
        in: path
        description: The id of the request domain.
        required: true
        schema:
          type: string
      - name: lookupInGroup
        in: query
        description: >
          By default if a credential is not available, groups of which this
          identity is a member of are not searched.  By setting this query
          parameter to true enclosing groups will be searched for a
          credential.
        schema:
          type: boolean
      - name: scope
        in: query
        description: >
          For use with "oauth2.0" domains types, return an access token with
          the specified scope, or the default scopes if the value is an empty
          string. A "refresh_token" credential must be available to obtain the
          token from the issuing provider.
        schema:
          type: string
components:
  requestBodies:
    credentialInUser:
      content:
        application/vnd.sas.credential+json:
          schema:
            $ref: "#/components/schemas/credentialIn"
          examples:
            json:
              $ref: "#/components/examples/userCredBody"
        application/json:
          schema:
            $ref: "#/components/schemas/credentialIn"
          examples:
            json:
              $ref: "#/components/examples/userCredBody"
      description: The credential to be created.
      required: true
    credentialInClient:
      content:
        application/vnd.sas.credential+json:
          schema:
            $ref: "#/components/schemas/credentialIn"
          examples:
            json:
              $ref: "#/components/examples/clientReqBody"
        application/json:
          schema:
            $ref: "#/components/schemas/credentialIn"
          examples:
            json:
              $ref: "#/components/examples/clientReqBody"
      description: The credential to be created.
      required: true
    credentialInGroup:
      content:
        application/vnd.sas.credential+json:
          schema:
            $ref: "#/components/schemas/credentialIn"
          examples:
            json:
              $ref: "#/components/examples/groupCredBody"
        application/json:
          schema:
            $ref: "#/components/schemas/credentialIn"
          examples:
            json:
              $ref: "#/components/examples/groupCredBody"
      description: The credential to be created.
      required: true
  schemas:
    domainIn:
      title: Domain
      description: An input Domain.
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: >
            The id of the domain which is unique. This member may not be changed
            in update requests. The following characters are disallowed in an
            id: ISO control characters, leading and trailing Unicode space
            characters, forward and back slashes, the semicolon and the tilde.
            Max Length: 100
        description:
          type: string
          description: >
            A short description of the domain as defined by the creator of the
            resource. Max Length: 1000
        label:
          type: string
          description: |
            A label for the domain. Max Length: 36
        type:
          type: string
          description: >
            The authentication type used by the domain. The member may not be
            changed in update requests if there are credentials associated with
            this domain. The only reserved value is "password". If "password" is
            used, certain constraints are introduced in the modeling of any
            associated Credentials - see the credential definition for details.
            Max Length: 20
    domain:
      title: Domain
      description: A credential domamin
      allOf:
      - $ref: "#/components/schemas/domainIn"
      - type: object
        properties:
          version:
            type: integer
            description: >
              This media type's schema version number. This representation is
              version 1. This member is ignored in update and create requests.
          creationTimeStamp:
            type: string
            format: date-time
            description: Timestamp of domain creation.
          modifiedTimeStamp:
            type: string
            format: date-time
            description: Timestamp of last domain modification.
          createdBy:
            type: string
            description: The name of the user who created this domain.
          modifiedBy:
            type: string
            description: The name of the user who last modified this domain.
          links:
            type: array
            description: Links that apply to this object.  Includes "self", "put",
              and "delete"
            items:
              $ref: "#/components/schemas/link"
    domainCollection:
      type: object
      title: Domain Collection
      description: Collection of Domains visible to the current user.
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
        name:
          type: string
        accept:
          type: string
          description: The response media type
        start:
          type: integer
        count:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/domain"
    credentialIn:
      title: Credential
      description: The request input body for creating a credential.
      type: object
      required:
      - domainType
      - domainId
      - identityId
      - identityType
      properties:
        domainId:
          type: string
          description: |
            The domain the credential applies to. Max Length: 100
        domainType:
          type: string
          description: >
            The authentication type used by the domain.  Identical to the
            attribute in the domain type. This member may not be changed in
            update requests. Max Length: 20
        identityId:
          type: string
          description: >
            The id of the user, group or client.  Users and groups correspond to
            a userId or groupId from the Identity service.  For a user, the
            @currentUser delegate may be used to indicate the id of the
            currently authenticated user.  A client is an OAuth client application
            registered with SAS Logon Manager. This member may not be changed
            in update requests. Max Length: 100
        identityType:
          type: string
          description: >
            The type of identity. One of "user", "group" or "client".  "user"
            and "group" correspond to the types of identities supported by the
            Identity service and "client" is used for OAuth clients. This member
            may not be changed in update requests. Max Length: 10
        properties:
          type: object
          description: >
            Properties specific to this credential type which are not secret.
            Items in this list are returned in credential management operations.
            Key max length: 250.  Value max length: 2048. If the domainType is
            "password" a non-empty "userId" property should be defined.
          additionalProperties:
            type: string
        secrets:
          type: object
          description: >
            Secret properties specific to this credential type.  Items in this
            list are not returned in credential management operations.  They are
            only returned by the secret lookup endpoint. Key max length:
            250.  Value max length: the equivalent of 32768 encoded bytes All
            values should use "The Base64 Alphabet" as specified in Table 1 of
            RFC 4648 and RFC 2045. If encoding is done using Java 8,
            java.util.Base64's "Basic" encoding provides conforming encoding.
            For a password credential there is one item with key "password".
            For "oauth2.0" type domains not associated to an external provider,
            a "refresh_token" credential is automatically obtained and stored as
            the secret if no secrets are specified.
          additionalProperties:
            type: string
    credential:
      title: Credential
      description: A credential.
      allOf:
      - $ref: "#/components/schemas/credentialIn"
      - type: object
        properties:
          version:
            type: integer
            description: >
              This media type's schema version number. This representation is
              version 1. This member is ignored in update and create requests.
          creationTimeStamp:
            type: string
            format: date-time
            description: Timestamp of credential creation.
          modifiedTimeStamp:
            type: string
            format: date-time
            description: Timestamp of last credential modification.
          createdBy:
            type: string
            description: The name of the user who created this credential.
          modifiedBy:
            type: string
            description: The name of the user who last modified this credential.
          links:
            type: array
            description: Links that apply to this object.  Includes "self", "put",
              and "delete"
            items:
              $ref: "#/components/schemas/link"
    link:
      title: Link
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method to invoke this endpoint.
        rel:
          type: string
          description: The relationship of this URL to the object.
        uri:
          type: string
          description: The relative URI of the REST endpoint.
        href:
          type: string
          description: The full URL of the REST endpoint.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type consumed/produced.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    links:
      title: Links
      description: A list of links related to an operation or resource
      properties:
        version:
          type: integer
          description: The version of the links model.
          default: 1
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
    baseCollection:
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    credentialCollection:
      title: Collection of Credentials
      description: This is a collection of credentials.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query
            items:
              $ref: "#/components/schemas/credential"
    errorResponse:
      title: Error
      description: The representation of an error.
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The error message.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred
          items:
            $ref: "#/components/schemas/errorResponse"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
