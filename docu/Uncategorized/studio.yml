    collectionRequest:
      description: >-
        A collection request represents the standard paging/filtering/sorting
        fields supported by SAS REST APIs

        Sonder currently has rest.QueryParams but it only supports fields in the request
        body of

        type string, which doesn't work for all our cases. Until that is fixed we
        are just going to

        house and use a struct that we can embed for Get via Post request bodies.
      properties:
        filter:
          description: Filter provides a SAS Rest API filter to apply to the request.
          example: in(name, 'joe')
          type: string
          x-go-name: Filter
        limit:
          description: Limit provides the maximum number of items to return for the
            request.
          example: 100
          format: int64
          type: integer
          x-go-name: Limit
        sortBy:
          description: SortBy provides how the returned data should be sorted.
          example: age:descending
          type: string
          x-go-name: SortBy
        start:
          description: Start provides the index of the first value to read.
          example: 0
          format: int64
          type: integer
          x-go-name: Start
      title: CollectionRequest
      type: object
      x-go-name: CollectionRequest
      x-go-package: sassoftware.io/viya/studio/v2/representations
    columnsRequest:
      allOf:
      - $ref: "#/components/schemas/collectionRequest"
      - properties:
          includeColumns:
            description: IncludeColumns specifies which columns to include in the
              response.
            example:
            - age
            - sex
            items:
              type: string
            type: array
            x-go-name: IncludeColumns
        type: object
      description: The data table columns request model represents a request for information
        about columns.
      title: DataTableColumnsRequest
      x-go-name: DataTableColumnsRequest
      x-go-package: sassoftware.io/viya/studio/v2/representations
    columnSort:
      description: The column sort representation defines the way in which to sort
        a specific column.
      properties:
        columnName:
          description: ColumnName specifies the name of the column you want to sort
            by.
          example: Make
          type: string
          x-go-name: ColumnName
        sortOrder:
          description: SortOrder specifies whether you want to sort ascending or descending.
          example: descending
          type: string
          x-go-name: SortOrder
        sortPriority:
          description: >-
            SortPriority specifies the priority to apply to the column when
            sorting.

            Zero being the highest priority.
          example: 0
          format: int64
          type: integer
          x-go-name: SortPriority
      title: ColumnSort
      type: object
      x-go-name: ColumnSort
      x-go-package: sassoftware.io/viya/studio/v2/representations
    viewRequest:
