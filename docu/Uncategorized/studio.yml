---
openapi: 3.0.3
info:
  version: "1"
  title: SAS Data and AI Studio
  description: This set of private APIs supports the Go-based backend for SAS Data
    and AI Studio.
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: https://developer.sas.com
  license:
    name: SAS Institute Inc.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Configuration
  description: Contains configuration related operations.
- name: Encoding
  description: Contains encoding information.
- name: License
  description: Contains license information.
- name: Session
  description: Contains Session-related operations.
- name: Preferences
  description: Contains preference related operations.
- name: Files
  description: Contains file related operations.
- name: Foreground Submission
  description: Contains foreground submission related operations.
- name: Background Submission
  description: Contains background submission related operations.
- name: Scheduled Submission
  description: Contains scheduled submission related operations.
- name: Job Definitions
  description: Contains job definition related operations.
- name: Data
  description: Contains data related operations.
- name: Mail
  description: Contains operations related to emailing files and submission results.
- name: Git
  description: Contains git related operations.
- name: Code
  description: Contains code related operations.
- name: ImportFile
  description: Contains file import related operations.
servers:
- url: http://example.com/studio
  description: mock server
paths:
  /:
    get:
      operationId: root
      summary: Get a collection of top-level links
      description: >
        Returns a collection of links to the top-level collections surfaced
        through this API.
      tags:
      - Root
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/json
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/Root200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/Root200Response"
    head:
      operationId: headersForRoot
      summary: Returns the headers that the corresponding GET returns
      description: Returns the headers that the corresponding GET returns. Clients
        may use this to determine if the service is running.
      tags:
      - Root
      responses:
        "200":
          description: OK.  Service is running and available
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/json

  /configuration:
    get:
      tags:
      - Configuration
      summary: Gets the SAS Data and AI Studio Configuration
      description: Gets the SAS Data and AI Studio Configuration. Returns a value
        of type Configuration.
      operationId: getConfiguration
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/studioConfiguration"
              examples:
                default:
                  $ref: "#/components/examples/Configuration200Response"
            application/vnd.sas.studio.configuration+json:
              schema:
                $ref: "#/components/schemas/studioConfiguration"
              examples:
                default:
                  $ref: "#/components/examples/Configuration200Response"
  /encodings:
    get:
      tags:
      - Encoding
      summary: Returns the list of supported encodings in SAS
      description: Returns the list of supported encodings in SAS along with a translated
        name of the encoding
      operationId: getEncodings
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/encodingCollection"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/encodingCollection"
        "400":
          $ref: "#/components/responses/badRequest"
  /setinits:
    get:
      tags:
      - License
      summary: Gets licensing information for the deployment
      description: Gets the site and product license information (setinits). Returns
        a value of type Licenses.
      operationId: getLicenses
      parameters:
      - name: Accept-Item
        in: header
        description: Specifies the desired license representation.
        schema:
          type: string
          enum: [application/vnd.sas.studio.sas.product.license+json]
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/productLicenseCollection"
              examples:
                default:
                  $ref: "#/components/examples/Setinits200Response"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/productLicenseCollection"
              examples:
                default:
                  $ref: "#/components/examples/Setinits200Response"
        "400":
          $ref: "#/components/responses/badRequest"
  /preferences:
    get:
      tags:
      - Preferences
      summary: Gets the preferences for the authenticated user
      description: Get the preferences for the authenticated user.
      operationId: getUserPreferences
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mapObject"
              examples:
                default:
                  $ref: "#/components/examples/PreferencesMapExample"
            application/vnd.sas.studio.preferences.summary+json:
              schema:
                $ref: "#/components/schemas/mapObject"
              examples:
                default:
                  $ref: "#/components/examples/PreferencesMapExample"
            application/vnd.sas.studio.preferences+json:
              schema:
                $ref: "#/components/schemas/preferences"
              examples:
                default:
                  $ref: "#/components/examples/PreferencesExample"
        "400":
          $ref: "#/components/responses/badRequest"
    post:
      summary: Creates or updates multiple preferences for the authenticated user
      description: Creates or updates multiple preferences for the authenticated user.
        This is used as a bulk update mechanism to save multiple REST calls.
      operationId: setPreferences
      tags:
      - Preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/mapObject"
            examples:
              default:
                $ref: "#/components/examples/PreferencesMapExample"
          application/vnd.sas.studio.preference.map+json:
            schema:
              $ref: "#/components/schemas/mapObject"
            examples:
              default:
                $ref: "#/components/examples/PreferencesMapExample"
        description: Key value pair of preferences to either create or update.
        required: true
      responses:
        "201":
          description: The preferences were created or updated for the authenticated
            user.
        "400":
          $ref: "#/components/responses/badRequest"
  /defaultpreferences:
    get:
      tags:
      - Preferences
      summary: Gets the default preferences for the authenticated user
      description: Get the default preference values for the authenticated user for
        the SAS Viya preference with key "studioPreferences.properties.key". Returns
        a dictionary where the key is the preference name, and the value is the preference
        value. The keys used in the dictionary are not SAS Viya preference keys. They
        are keys specific to the the values stored in the "studioPreferences.properties.key"
        preference.
      operationId: getDefault
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mapObject"
              examples:
                default:
                  $ref: "#/components/examples/DefaultPreferences200Response"
            application/vnd.sas.studio.preferences.summary+json:
              schema:
                $ref: "#/components/schemas/mapObject"
              examples:
                default:
                  $ref: "#/components/examples/DefaultPreferences200Response"
        "400":
          $ref: "#/components/responses/badRequest"
  /preferences/{preferenceId}:
    put:
      tags:
      - Preferences
      summary: Set a preference value
      description: Set a preference value for the authenticated user.
      operationId: updatePreference
      parameters:
      - name: preferenceId
        in: path
        description: The preference id. This is the id used by the SAS Viya preferences
          service.
        schema:
          type: string
        required: true
      requestBody:
        $ref: "#/components/requestBodies/setPreferenceRequest"
      responses:
        "204":
          description: The preference was set.
        "400":
          $ref: "#/components/responses/badRequest"
    delete:
      tags:
      - Preferences
      summary: Delete a preference
      description: Delete the specified preference for the authenticated user.
      operationId: deletePreference
      parameters:
      - name: preferenceId
        in: path
        description: The preference id. This is the id used by the SAS Viya preferences
          service.
        schema:
          type: string
        required: true
      responses:
        "204":
          description: The preference was deleted.
        "400":
          $ref: "#/components/responses/badRequest"
  /sessions:
    post:
      tags:
      - Session
      summary: Creates a new session
      description: Creates a new session.
      operationId: createSession
      requestBody:
        $ref: "#/components/requestBodies/studioSessionRequest"
      responses:
        "201":
          $ref: "#/components/responses/studioSession"
        "400":
          $ref: "#/components/responses/badRequest"
  /sessions/{sessionId}:
    get:
      tags:
      - Session
      summary: Gets an existing session
      description: Gets an existing session. Returns a value of type StudioSession.
      operationId: getSession
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      responses:
        "200":
          $ref: "#/components/responses/studioSession"
        "400":
          $ref: "#/components/responses/badRequest"
        "404":
          $ref: "#/components/responses/sessionNotFound"
    delete:
      tags:
      - Session
      summary: Deletes an existing session
      description: Deletes an existing session.
      operationId: deleteSession
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      responses:
        "204":
          description: The existing session has been deleted.
        "404":
          $ref: "#/components/responses/sessionNotFound"
  /sessions/{sessionId}/sassession:
    post:
      tags:
      - Session
      summary: Creates a SAS session
      description: Creates a SAS session.
      operationId: createSasSession
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      requestBody:
        $ref: "#/components/requestBodies/sasSessionRequest"
      responses:
        "201":
          description: The SAS session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasSession"
              examples:
                default:
                  $ref: "#/components/examples/SASSession200Response"
            application/vnd.sas.studio.sas.session:
              schema:
                $ref: "#/components/schemas/sasSession"
              examples:
                default:
                  $ref: "#/components/examples/SASSession200Response"
        "400":
          $ref: "#/components/responses/badRequest"
        "404":
          $ref: "#/components/responses/sessionNotFound"
  /sessions/{sessionId}/keepalive:
    get:
      tags:
      - Session
      summary: Keeps alive an existing session
      description: Keeps alive an existing session. Returns a pointer to a sessionHandlerState
        object.
      operationId: getKeepAlive
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      responses:
        "200":
          description: The request succeeded.
        "404":
          $ref: "#/components/responses/sessionNotFound"
  /sessions/{sessionId}/options/{optionName}:
    get:
      tags:
      - Session
      summary: Gets the value of an option from a session
      description: Gets an option from an existing session. Returns a string.
      operationId: getSessionOption
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: optionName
        in: path
        description: The option name.
        schema:
          type: string
        required: true
      responses:
        "200":
          description: The option value.
          content:
            text/plain:
              schema:
                type: string
              example: "2147483648"
        "400":
          $ref: "#/components/responses/badRequest"
    put:
      tags:
      - Session
      summary: Set the value of an option in a session
      description: Sets the value of a session option.
      operationId: updateSessionOption
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: optionName
        in: path
        description: The preference id. This is the id used by the SAS Viya preferences
          service.
        schema:
          type: string
        required: true
      requestBody:
        $ref: "#/components/requestBodies/setOptionRequest"
      responses:
        "204":
          description: The option was set.
        "400":
          $ref: "#/components/responses/badRequest"
        "404":
          $ref: "#/components/responses/sessionNotFound"
  /sessions/{sessionId}/git/settings:
    get:
      tags:
      - Git
      summary: Gets information from the git settings file
      description: Gets the information stored in the git settings file.
      operationId: getSettings
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gitSettings"
              examples:
                default:
                  $ref: "#/components/examples/GitSettings200Response"
            application/vnd.sas.studio.git.settings+json:
              schema:
                $ref: "#/components/schemas/gitSettings"
              examples:
                default:
                  $ref: "#/components/examples/GitSettings200Response"
          headers:
            ETag:
              schema:
                type: string
              description: Specifies a tag that identifies the revision of this object.
        "400":
          $ref: "#/components/responses/badRequest"
    put:
      tags:
      - Git
      summary: Writes information to the git settings file
      description: Writes information to the git settings file.
      operationId: updateGitSettings
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: If-Match
        in: header
        required: true
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the given member.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/gitSettings"
          application/vnd.sas.studio.git.settings+json:
            schema:
              $ref: "#/components/schemas/gitSettings"
      responses:
        "204":
          description: The git settings were successfully saved.
        "400":
          $ref: "#/components/responses/badRequest"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resources last modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/GitSettingsUpdate412Response"
        "428":
          description: The request headers did not include an `If-Match` or `If-Unmodified-Since`
            precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/GitSettingsUpdate428Response"
  /sessions/{sessionId}/data/libraries/{libraryName}/tables/{tableName}:
    head:
      tags:
      - Data
      summary: Determine if the table exists in a given library
      description: Determine if the table exists in a given library. Returns 200 if
        the table exists and 404 if it doesn't.
      operationId: headersForDoesTableExist
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: libraryName
        in: path
        description: The name of the library.
        schema:
          type: string
        required: true
      - name: tableName
        in: path
        description: The name of the table.
        schema:
          type: string
        required: true
      responses:
        "200":
          description: The table exists in the given library.
          headers:
            ETag:
              schema:
                type: string
              description: Specifies a tag that identifies the revision of this object.
        "404":
          description: The table was not found in the given library.
    get:
      tags:
      - Data
      summary: Get information about a given table
      description: Get information about a given table. Returns table information.
      operationId: getTable
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: libraryName
        in: path
        description: The name of the library.
        schema:
          type: string
        required: true
      - name: tableName
        in: path
        description: The name of the table.
        schema:
          type: string
        required: true
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dataTable"
              examples:
                default:
                  $ref: "#/components/examples/Table200Response"
            application/vnd.sas.studio.sas.table+json:
              schema:
                $ref: "#/components/schemas/dataTable"
              examples:
                default:
                  $ref: "#/components/examples/Table200Response"
          headers:
            ETag:
              schema:
                type: string
              description: Specifies a tag that identifies the revision of this object.
        "404":
          description: The table was not found in the given library.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/TableNotFound404Response"
    put:
      tags:
      - Data
      summary: Update information about a given table
      description: Update information about a given table.
      operationId: updateTable
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: libraryName
        in: path
        description: The name of the library.
        schema:
          type: string
        required: true
      - name: tableName
        in: path
        description: The name of the table.
        schema:
          type: string
        required: true
      - name: If-Match
        in: header
        required: true
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the given table.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/tableUpdateRequest"
          application/vnd.sas.studio.table.update.request:
            schema:
              $ref: "#/components/schemas/tableUpdateRequest"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dataTable"
              examples:
                default:
                  $ref: "#/components/examples/TableUpdate200Response"
            application/vnd.sas.studio.sas.table+json:
              schema:
                $ref: "#/components/schemas/dataTable"
              examples:
                default:
                  $ref: "#/components/examples/TableUpdate200Response"
          headers:
            ETag:
              schema:
                type: string
              description: Specifies a tag that identifies the revision of this object.
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequestErrorResponseExample"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequestErrorResponseExample"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resources last modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/TableUpdate412Response"
        "428":
          description: The request headers did not include an `If-Match` or `If-Unmodified-Since`
            precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/TableUpdate428Response"
    delete:
      tags:
      - Data
      summary: Delete a table
      description: Delete a table.
      operationId: deleteTable
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: libraryName
        in: path
        description: The name of the library.
        schema:
          type: string
        required: true
      - name: tableName
        in: path
        description: The name of the table.
        schema:
          type: string
        required: true
      responses:
        "204":
          description: The table was deleted. Will also return if table was not found
            during deletion.
  /sessions/{sessionId}/data/libraries:
    get:
      tags:
      - Data
      summary: Get libraries
      description: Get a collection of libraries. Returns a collection of Library
        objects.
      operationId: getLibraries
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: Accept-Item
        in: header
        description: Specifies the desired library representation. Defaults to a summary
          representation.
        schema:
          type: string
          enum: [application/vnd.sas.studio.sas.library.summary+json, application/vnd.sas.studio.sas.library+json]
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/libraryCollection"
              examples:
                default:
                  $ref: "#/components/examples/DataLibraries200Response"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/libraryCollection"
              examples:
                default:
                  $ref: "#/components/examples/DataLibraries200Response"
    post:
      tags:
      - Data
      summary: Assign a library
      description: Assign a SAS library using the specified engine, path and options.
      operationId: assignLib
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/libraryAssignRequest"
          application/vnd.sas.studio.sas.library.assign.request:
            schema:
              $ref: "#/components/schemas/libraryAssignRequest"
        description: The library request
        required: true
      responses:
        "201":
          description: The library was assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/library"
              examples:
                default:
                  $ref: "#/components/examples/DataLibraryAssign201Repsonse"
            application/vnd.sas.studio.sas.library:
              schema:
                $ref: "#/components/schemas/library"
              examples:
                default:
                  $ref: "#/components/examples/DataLibraryAssign201Repsonse"
  /sessions/{sessionId}/data/libraries/{libraryName}:
    get:
      tags:
      - Data
      summary: Get a library
      description: Get a library. Returns a value of type Library.
      operationId: getLibrary
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: libraryName
        in: path
        description: The name of the library.
        schema:
          type: string
        required: true
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.studio.sas.library:
              schema:
                $ref: "#/components/schemas/library"
              examples:
                default:
                  $ref: "#/components/examples/DataLibrary200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/library"
              examples:
                default:
                  $ref: "#/components/examples/DataLibrary200Response"
        "404":
          description: The library was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/LibraryNotFound404Response"
    delete:
      summary: Deassign library
      description: Removes the library from the session.
      operationId: deleteLibrary
      tags:
      - Data
      parameters:
      - name: sessionId
        in: path
        description: The ID of the studio session.
        required: true
        schema:
          type: string
      - name: libraryName
        in: path
        description: The name of the library.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The library was deassigned.
        "404":
          description: No resource exists at the requested path.
  /sessions/{sessionId}/data/libraries/{libraryName}/tables:
    get:
      tags:
      - Data
      summary: Get the tables in the given library
      description: Get a list of tables in the specified library. Returns a collection
        of table summary objects.
      operationId: getTables
      parameters:
      - name: sessionId
        in: path
        description: The session id.
