  # Scheduled Submission
  /sessions/{sessionId}/scheduled/submissions:
    get:
      tags:
      - Scheduled Submission
      summary: Retrieves list of scheduled submissions for the current user
      description: Retrieves a list of scheduled submissions for the current user.
      operationId: getScheduledSubmissions
      parameters:
      - name: Accept-Item
        in: header
        description: Specifies the desired scheduled submission representation.
        schema:
          type: string
          enum: [application/vnd.sas.studio.scheduled.submission+json;version=2]
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: start
        in: query
        description: The zero-based index of the first job to return. This defaults
          to 0.
        schema:
          type: integer
        required: false
      - name: limit
        in: query
        description: The maximum number of jobs to be returned in this page of results.
          The actual number of returned jobs might be less if the collection has been
          exhausted. This defaults to 10.
        schema:
          type: integer
        required: false
      - name: deployedResource
        in: query
        description: DEPRECATED, this is UI5 only. In react this should be part of
          the traditional filter query param. Limit the response to only include jobs
          that were created using this deployed resource identifier. The identifier
          itself is anything useful for correlating schedule job submissions, job
          requests, and job definitions. If omitted, all jobs for the user will be
          returned.
        schema:
          type: string
        required: false
      - name: includeNextRunTime
        in: query
        description: Controls whether the nextRunTime property is included in the
          response for each scheduled job. The nextRunTime property is not guaranteed
          to be present as some jobs may not be actively scheduled and have a next
          run time.
        schema:
          type: string
        required: false
      - name: dataLimits
        in: query
        description: DEPRECATED, this is UI5 only. Limits the data returned to improve
          performance of the request. Can be one of "LimitHistory | OmitNextRunTime
          | OmitHistory | OmitHistoryAndNextRunTime". LimitHistory causes only the
          most recent history item to be returned. OmitHistory causes no history to
          be returned. OmitNextRunTime prevents the nextRunTime from being populated,
          and OmitHistoryAndNextRunTime omits both items.
        schema:
          type: string
        required: false
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.studio.scheduled.submission.collection+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/scheduledSubmissionsLegacy"
              examples:
                default:
                  $ref: "#/components/examples/ScheduledSubmissions200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/scheduledSubmissionsLegacy"
              examples:
                default:
                  $ref: "#/components/examples/ScheduledSubmissions200Response"
    post:
      tags:
      - Scheduled Submission
      summary: Schedules a new job submission for the current user
      description: Enables you to create a new scheduled submission.
      operationId: createScheduledScheduleJob
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/flowScheduledSubmissionRequest"
          application/vnd.sas.studio.flow.scheduled.submission.request+json:
            schema:
              $ref: "#/components/schemas/flowScheduledSubmissionRequest"
            examples:
              default:
                $ref: "#/components/examples/SubmissionsRequest"
          application/vnd.sas.studio.step.scheduled.submission.request+json:
            schema:
              $ref: "#/components/schemas/stepScheduledSubmissionRequest"
            examples:
              default:
                $ref: "#/components/examples/SubmissionsRequest"
          application/vnd.sas.studio.python.scheduled.submission.request+json:
