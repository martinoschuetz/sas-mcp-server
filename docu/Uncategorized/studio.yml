        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    tableSummary:
      title: Table Summary
      description: Summarizes a SAS table or data set.
      properties:
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 1.
        id:
          type: string
          format: object-id
          readOnly: true
          description: Specifies the identifier for this table object.
        name:
          type: string
          readOnly: true
          description: Specifies the name of the table.
        links:
          type: array
          description: Specifies links that apply to this table summary.
          items:
            $ref: "#/components/schemas/link"
      example:
        id: AFGHANISTAN
        links:
        - href: /compute/sessions/RKEY-ses0000/data/MAPSGFK/AFGHANISTAN
          method: GET
          rel: self
          type: application/vnd.sas.compute.data.table
          uri: /compute/sessions/RKEY-ses0000/data/MAPSGFK/AFGHANISTAN
        name: AFGHANISTAN
        version: 1
    dataFlowJob:
      title: DataFlowJob
      description: information about a completed or currently running data flow job.
        Either dataFlow or codeSnippet will be populated
      allOf:
      - $ref: "#/components/schemas/dataFlowJobSummary"
      - type: object
        properties:
          dataFlow:
            $ref: "#/components/schemas/dataFlow"
          codeSnippet:
            $ref: "#/components/schemas/dataFlowSnippet"
          executionBindings:
            $ref: "#/components/schemas/executionBindings"
          actions:
            type: array
            description: Zero or more actions containing details about the data flow
              job
            items:
              $ref: "#/components/schemas/actionStatus"
    dataFlowJobSummary:
      title: DataFlowJobSummary
      description: summary representation of a data flow job
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          id:
            type: string
            description: system generated id of the job
          state:
            type: string
            description: current state of the job (pending, running, canceled, timedOut,
              completed, failed)
          error:
            $ref: "#/components/schemas/error2"
          links:
            type: array
            description: Zero or more links to related resources or operations
            items:
              $ref: "#/components/schemas/link"
    dataFlow:
      title: DataFlow
      description: describes the complete details of a data flow.
      type: object
      allOf:
      - $ref: "#/components/schemas/dataFlowSummary"
      - type: object
        properties:
          sourceVersion:
            description: An optional version that can be specified to indicate which
              version of the product created the flow.
            type: integer
          nodes:
            description: Map of nodes within the data flow, the key is the id of the
              node
            type: object
            additionalProperties:
              $ref: "#/components/schemas/node"
          stickyNotes:
            description: Array of sticky notes on a dataflow
            type: array
            additionalProperties:
              $ref: "#/components/schemas/note"
            items: {}
          parameters:
            description: Map of parameters within the data flow, the key is the id
              of the parameter
            type: object
            additionalProperties:
              $ref: "#/components/schemas/parameter"
          connections:
            description: List of connections between nodes
            type: array
            items:
              $ref: "#/components/schemas/connection"
          extendedProperties:
            type: object
            description: Map of extended user provided properties. These extended
              properties have no limit on the length of the value.
    dataFlowSnippet:
      title: DataFlowSnippet
      description: Representation of arguments needed to generate a dataflow code
        snippet.  A dataflow code snippet represents a portion of a step that a step
        chooses to expose for partial code generation.  An example of this is the
        FilterNode will expose a "filter" snippet to generate a filter without having
        to construct a data flow. Step member is optional and is reserved for future
        usage. Please use stepUri to specify the step.
      type: object
      properties:
        stepUri:
          type: string
          description: URI of the step to generate the snippet from.
        step:
          $ref: "#/components/schemas/step"
        snippetName:
          type: string
          maxLength: 250
          description: Name of the code snippet to be generated. filter     - use
            this to generate a filter code snippet from steps that have filtering
            functionality, such as Filter Rows and Branch Rows steps. expression -
            use this to generate an expression code snippet from steps that handle
            expressions, such as Calculate Column step.
          enum:
          - filter
          - expression
        arguments:
          type: object
          description: Map of user arguments to be used to generate the snippet code.  References
            to columns should use a ColumnModelReference instead of the ColumnReference,
            to pass in a column definition. filterSnippet - use this type object to
            generate code snippets when using "filter" as snippetName. all the variants
            of calculateColumn - use one of the variants of calculateColumn object
            type to generate code snippets when using "expression" as snippetName;
            calculateColumn's "outColumn" property is not needed for expression snippet.
          anyOf:
          - $ref: "#/components/schemas/filterSnippet"
          - $ref: "#/components/schemas/simpleCalculateColumn"
          - $ref: "#/components/schemas/dqSchemeApplyCalculateColumn"
          - $ref: "#/components/schemas/putInputCalculateColumn"
          - $ref: "#/components/schemas/kcompressCalculateColumn"
          - $ref: "#/components/schemas/ksubstrCalculateColumn"
          - $ref: "#/components/schemas/kscanCalculateColumn"
          - $ref: "#/components/schemas/dqCaseCalculateColumn"
          - $ref: "#/components/schemas/dqGenderCalculateColumn"
          - $ref: "#/components/schemas/dqMatchCalculateColumn"
          - $ref: "#/components/schemas/dqIdentifyCalculateColumn"
          - $ref: "#/components/schemas/dqStandardizeCalculateColumn"
          - $ref: "#/components/schemas/dqParseCalculateColumn"
          - $ref: "#/components/schemas/dqParseTokenGetCalculateColumn"
          - $ref: "#/components/schemas/dqExtractCalculateColumn"
          - $ref: "#/components/schemas/dqExtTokenGetCalculateColumn"
          - $ref: "#/components/schemas/hashingCalculateColumn"
          - $ref: "#/components/schemas/hashing_hmacCalculateColumn"
          - $ref: "#/components/schemas/expressionCalculateColumn"
          - $ref: "#/components/schemas/portReference"
          - $ref: "#/components/schemas/quickFilter"
    actionStatus:
      title: ActionStatus
      description: One or more nodes in the submitted flow may be combined into an
        action during code generation. For example, a filter node and a sort node
        could be combined into a single query action.
      type: object
      properties:
        nodes:
          type: string
          description: A pipe (|) delimeted list of node id's. This is the string
            used during code generation to indicate the beginning and end of an action.
        expectedOutput:
          type: array
          items:
            $ref: "#/components/schemas/outputPortAndTable"
          description: The expected output data that an action is expected to generate.
        subStatus:
          type: array
          items:
            $ref: "#/components/schemas/actionStatus"
          description: If this action is a subflow, subStatus will contain an array
            consisting of the nodes in the subflow
    dataFlowSummary:
      title: Data Flow Summary
      type: object
      description: summary representation of a data flow.
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          id:
            type: string
            example: 17023033-9295-486a-bd03-55ca308a7673
            description: The unique identifier of this data flow.
          version:
            type: integer
            example: 1
            description: This media type's schema version number. This representation
              is version 1.
          name:
            type: string
            example: Flow.flw
            description: The name of this data flow.
          description:
            type: string
            example: Description of the flow
            description: The description of this data flow.
          properties:
            type: object
            description: Map of user provided properties.
            items:
              type: object
          links:
            type: array
            description: Zero or more links to related resources or operations
            items:
              $ref: "#/components/schemas/link"
    node:
      title: Node
      type: object
      description: base type for all nodes in a data flow
      properties:
        nodeType:
          type: string
          description: Specifes the type of node
          example: step
          enum:
          - step
          - table
          - file
          - outputFile
          - outputTable
          - dataFlow
        id:
          type: string
          example: id-1651087424164-557
          description: The unique identifier of this node.  The id is provided by
            the user, and must be unique among the nodes within the data flow.
        version:
          type: integer
          example: 1
          description: This media type's schema version number. This representation
            is version 1.
        name:
          type: string
          example: SAS Program.sas
          description: The name of this node.
        description:
          type: string
          example: Description of SAS Program
          description: The description of this node.
        note:
          $ref: "#/components/schemas/note"
        priority:
          type: integer
          example: 0
          description: Hint used to suggest order of execution. For two nodes at a
            given level in the flow, a lower value for the priority number on one
            node will indicate that it should execute before the other node. Depending
            on the node dependencies in the flow, this may or may not be honored.
        properties:
          type: object
          description: Map of properties to store more information about the node,
            for example to store migration error messages. These properties have 100
            characters limit for the length of the key and 10240 characters limit
            on the length of the value.
      required:
      - nodeType
    note:
      title: Note
      type: object
      description: Base note type for node notes and sticky notes
      properties:
        properties:
          type: object
          description: Map of properties to store more information about the note,
            for example if the editor is expanded. These properties have 100 characters
            limit for the length of the key and 10240 characters limit on the length
            of the value.
        id:
          type: string
          maxLength: 36
          description: The unique identifier of this note.  The id is provided by
            the user, and must be unique among the notes within the data flow.
        name:
          type: string
          maxLength: 250
          description: The name of this note
        description:
          type: string
          description: The description of the notes i.e. the notes themselves
    parameter:
      title: Parameter
      description: base type for all parameters to the data flow
      properties:
        id:
          type: string
          description: user provided id of the parameter, must be unique within the
            data flow
        name:
          type: string
          description: name of the parameter
        parameterType:
          type: string
          description: |
            Type of parameter
          enum:
          - table
          - tableStructure
          - file
        parameterUsage:
          type: string
          description: determines what the parameter is used for
          enum:
          - INPUT
          - OUTPUT
        defaultValue:
          type: object
          description: default value of this parameter if it isn't provided at runtime
      required:
      - name
      - parameterType
    filterSnippet:
      title: FilterSnippet
      description: Generates a code snippet from an array of quick filters.
      type: object
      properties:
        excludeFilter:
          type: boolean
          description: boolean indicating whether this filter is intended to use as
            an exclusion filter, meaning the rows that match the filter are removed
            from the output table as opposed to included in the output table.  Default
            is false.
        quickFilters:
          type: array
          items:
            $ref: "#/components/schemas/quickFilter"
      required:
      - quickFilters
    simpleCalculateColumn:
      title: SimpleCalculateColumn
      description: Used for calculate columns where a function requires single column
        input and produces single column output. "outColumn" is not needed when used
        as an argument to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Name of the operation to perform. upcase   - converts all lowercase
            single-width English alphabet letters in selected column to uppercase
            letters, and outputs to selected output column. lowcase  - converts all
            uppercase single-width English alphabet letters in selected column to
            lowercase letters, and outputs to selected output column. propcase - converts
            all uppercase letters to lowercase letters. It then converts to uppercase
            the first character of a word that is preceded by a blank, forward slash,
            hyphen, open parenthesis, period, or tab. Result is output to selected
            output column. left     - moves leading blanks in selected column values
            to the the end. Result is output to selected output column. right    -
            moves trailing blanks in selected column values to the the beginning.
            Result is output to selected output column. day      - produces an integer
            from 1 to 31 based on the date value in selected column that represents
            the day of the month. Result is output to selected output column. month    -
            produces an integer from 1 to 12 based on the date value in selected column
            that represents the month of the year. Result is output to selected output
            column. qtr      - produces a value of 1,2,3, or 4 based on the date value
            in selected column that represents the quarter of the year. Result is
            output to selected output column. year     - produces a four-digit value
            based on the date in selected column that represents the year. Result
            is output to selected output column. timepart - extracts a time value
            from a SAS datetime value. Result is output to selected output column.
            datepart - extracts the date from a SAS datetime value. Result is output
            to selected output column.
          enum:
          - upcase
          - lowcase
          - propcase
          - left
          - right
          - day
          - month
          - qtr
          - year
          - timepart
          - datepart
      required:
      - inColumn
      - outColumn
      - operation
    dqSchemeApplyCalculateColumn:
      title: dqSchemeApplyCalculateColumn
      description: Applies a scheme and returns a transformed character value. "outColumn"
        is not needed when used as an argument to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Applies a scheme and returns a transformed character value.
          enum:
          - dqschemeapply
        scheme:
          type: string
          description: identifies the scheme that is applied to the input value.
        scheme-format:
          type: string
          description: identifies the format of the scheme.
        mode:
          type: string
          description: specifies how the scheme is to be applied to the source string.
        scheme-lookup-method:
          type: string
          description: specifies one of three mutually exclusive methods of applying
            the scheme.
        match-definition:
          type: string
          description: the name of the match definition that is referenced to create
            the matchcode for the source string. The match definition must be supported
            in the specified locale.
        sensitivity:
          type: string
          description: specifies the amount of information in the matchcodes that
            are created during the application of the scheme.
        locale:
          type: string
          description: specifies a constant, a character variable, or an expression
            that evaluates to the ISO code of the locale.
      required:
      - inColumn
      - outColumn
      - operation
      - scheme
      - scheme-format
    putInputCalculateColumn:
      title: PutInputCalculateColumn
      description: put and input function. "outColumn" is not needed when used as
        an argument to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Name of the operation to perform. put - Returns a value using
            a specified format. input - Returns the value that is produced when SAS
            converts value in input column by using the specified informat.
          enum:
          - put
          - input
        format:
          type: string
          description: format value to be applied by the operation on the column conversion
      required:
      - inColumn
      - outColumn
      - operation
      - format
    kcompressCalculateColumn:
      title: kcompressCalculateColumn
      description: kcompress function. "outColumn" is not needed when used as an argument
        to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Removes specified characters from a character expression.
          enum:
          - kcompress
        characters-to-remove:
          type: string
          description: specifies the character or characters that KCOMPRESS removes
            from the character. If characters-to-remove is omitted or empty, KCOMPRESS
            removes all blanks.
        modifier:
          type: string
          description: specifies a character constant in which each non-blank character
            modifies the action of the KCOMPRESS function.
      required:
      - inColumn
      - outColumn
      - operation
    ksubstrCalculateColumn:
      title: ksubstrCalculateColumn
      description: ksubstr function. "outColumn" is not needed when used as an argument
        to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Extracts a substring from input column.
          enum:
          - ksubstr
        start:
          type: integer
          description: specifies beginning character position within column consisting
            of string to start substring extraction from
        length:
          type: integer
          description: specifies the length of the substring to extract. If this parameter
            is omited, rest of the string is extracted
      required:
      - inColumn
      - outColumn
      - operation
      - start
    kscanCalculateColumn:
      title: kscanCalculateColumn
      description: kscan function. "outColumn" is not needed when used as an argument
