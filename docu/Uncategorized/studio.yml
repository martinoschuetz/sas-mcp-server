        operation:
          type: string
          description: Returns a parse token value from a delimited string of parse
            token values.
          enum:
          - dqparsetokenget
        token:
          type: string
          description: specifies the name of a token, which is supported by the parse-definition.
        parse-definition:
          type: string
          description: specifies the name of the parse definition, which is supported
            in the specified locale.
        locale:
          type: string
          description: specifies the ISO code of the locale. Default locale is used
            if no locale is specified.
      required:
      - inColumn
      - outColumn
      - operation
      - token
      - parse-definition
    dqExtractCalculateColumn:
      title: dqExtractCalculateColumn
      description: dqExtract function
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Returns an extracted character value.
          enum:
          - dqextract
        extraction-definition:
          type: string
          description: specifies the name of the extraction definition, which is supported
            in the specified locale.
        locale:
          type: string
          description: specifies the ISO code of the locale. Default locale is used
            if no locale is specified.
      required:
      - inColumn
      - outColumn
      - operation
      - extraction-definition
    dqExtTokenGetCalculateColumn:
      title: dqExtTokenGetCalculateColumn
      description: dqExtTokenGet function
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Returns a token from an extraction character value.
          enum:
          - dqexttokenget
        token:
          type: string
          description: specifies the name of a token, which is supported by the extraction-definition.
        extraction-definition:
          type: string
          description: specifies the name of the extraction definition, which is supported
            in the specified locale.
        locale:
          type: string
          description: specifies the ISO code of the locale. Default locale is used
            if no locale is specified.
      required:
      - inColumn
      - outColumn
      - operation
      - token
      - extraction-definition
    hashingCalculateColumn:
      title: hashingCalculateColumn
      description: Transforms a message into a digest in hexadecimal representation.
        "outColumn" is not needed when used as an argument to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Transforms a message into a digest in hexadecimal representation.
          enum:
          - hashing
        method:
          type: string
          description: specifies the hashing method.
          enum:
          - MD5
          - SHA1
          - SHA256
          - SHA384
          - SHA512
          - CRC32
        flag:
          type: integer
          description: specifies if the message is in hexadecimal. Value of 0 has
            no effect while 1 specifies that the selected column content is in hexadecimal
            representation.
          enum:
          - 0
          - 1
      required:
      - inColumn
      - outColumn
      - operation
      - method
    hashing_hmacCalculateColumn:
      title: hashing_hmacCalculateColumn
      description: Transforms a message into a digest in hexadecimal representation
        using the HMAC algorithm, which uses the specified algorithm and a key value.
        "outColumn" is not needed when used as an argument to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Transforms a message into a digest in hexadecimal representation
            using the HMAC algorithm, which uses the specified algorithm and a key
            value.
          enum:
          - hashing_hmac
        method:
          type: string
          description: specifies the hashing method.
          enum:
          - MD5
          - SHA1
          - SHA256
          - SHA384
          - SHA512
          - CRC32
        key:
          type: string
          description: specifies a secret key padded to the right with extra zeros
            to the input block size of the hash function.
        flag:
          type: integer
          description: specifies if the message is in hexadecimal. Value of 0 has
            no effect while 1 specifies that the selected column content is in hexadecimal
            representation. 0 - has no effect. 1 - specifies that the expression in
            the argument message is in hexadecimal. 2 - specifies that key is in hexadecimal.
            3 - specifies that column values and key are in hexadecimal.
          enum:
          - 0
          - 1
          - 2
          - 3
      required:
      - inColumn
      - outColumn
      - operation
      - method
      - key
    expressionCalculateColumn:
      title: expressionCalculateColumn
      description: assign the output column to the expression
      properties:
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Computes expression and assigns to outColumn
          enum:
          - expression
        expressionText:
          type: string
      required:
      - outColumn
      - operation
      - expressionText
    portReference:
      title: PortReference
      description: >
        describes an reference to an input port or an output port, which is
        generally a table.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        referenceType:
          type: string
          enum:
          - inputPort
          - outputPort
          description: Type of reference.
        portName:
          type: string
          maxLength: 250
          description: The name of the port.
        portIndex:
          type: integer
          minimum: 0
          description: The index of the port.
    quickFilter:
      title: quickFilter
      description: filter
      type: object
      properties:
        matchCase:
          type: boolean
          description: match case when filtering
        quoteStrings:
          type: boolean
          description: quote strings when filtering
        inColumn:
          type: object
          description: column definition to apply the filter on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        value:
          type: array
          description: array of values to compare the column value to in the filter.
          items:
            type: string
        operator:
          type: string
          description: operator to use when filtering
          enum:
          - equal
          - notequal
          - lessthan
          - lessthanequal
          - greaterthan
          - greaterthanequal
          - contains
          - notcontains
          - matches
          - notmatches
          - soundslike
          - notsoundslike
          - inlist
          - notinlist
          - between
          - notbetween
          - missing
          - notmissing
        logicalOperator:
          type: string
          enum:
          - AND
          - OR
          description: logical operator to combine with the next filter
        useRaw:
          type: boolean
          description: if true don't use formatted values for comparison (use the
            raw values), if false, use formatted values for comparison which results
            in matched-case text comparison, thus matchCase setting is ignored and
            defaulted to true, the formatted values for comparison needs to be used
            with caution, since text comparison may not be appropriate for date or
            numeric data
    outputPortAndTable:
      title: OutputPortAndTable
      description: output table and source associated with a port
      type: object
      properties:
        port:
          $ref: "#/components/schemas/port"
        table:
          $ref: "#/components/schemas/tableAndSource"
    columnReference:
      title: ColumnReference
      description: describes a reference to a column within a step node.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        referenceType:
          type: string
          description: this is always equal to "column"
        inputPort:
          type: integer
          description: The port on which this column is coming into this step.
        columnName:
          type: string
          description: The name of the column being referenced.
    columnModelReference:
      title: ColumnModelReference
      description: >
        describes a reference to a column definition. This is generally used to
        describe a column when generating code for a Data Flow Snippet where
        there are no ports to reference.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        referenceType:
          type: string
          description: this is always equal to "columnModel"
        alias:
          type: string
          description: if the column is being renamed, this is its new name
        impactedColumns:
          type: array
          description: array of columns which this column depends on (eg for calculated
            column)
          items:
            $ref: "#/components/schemas/columnDefinition"
        columnDefinition:
          $ref: "#/components/schemas/columnDefinition"
    columnDefinitionReference:
      title: ColumnDefinitionReference
      description: >
        describes a reference to a column schema within a step node.  This is
        generally used to describe an output column.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        referenceType:
          type: string
          description: this is always equal to "columnDefinition"
        outputPort:
          type: integer
          description: The port on which this column is going out on in the step.
        columnDefinition:
          $ref: "#/components/schemas/columnDefinition"
    port:
      title: Port
      type: object
      description: describes an input or output of a node in a data flow.  A port
        can have one or more indexes within it depending on the step definition.  If
        a port can have only one, the index for that port will always be 0.
      properties:
        node:
          type: string
          maxLength: 36
          description: id of the node that this port represents
        portName:
          type: string
          maxLength: 250
          description: name of the port, for a table node the input port is always
            "inTable" and the output port is always "outTable".  For a step node,
            the ports are defined by the step in the data flow service.
        index:
          type: integer
          minimum: 0
          description: index of the port with the given name.
    tableAndSource:
      title: TableAndSource
      description: Combines a table and source together.
      type: object
      properties:
        table:
          type: object
          description: The table of type "application/vnd.sas.data.table".
        source:
          type: object
          description: The data source of type "application/vnd.sas.data.source".
    columnDefinition:
      title: ColumnDefinition
      description: describes a column in the data flow.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        name:
          type: string
          description: The name of this column.
        type:
          type: string
          description: The type of this column.
        length:
          type: integer
          description: The length of this column.
    dataFlowAndBindings:
      title: DataFlowAndBindings
      description: combination of data flow and executing bindings, used to run a
        data flow. The dataFlow and dataFlowReference members are mutually exclusive.
        Only one or the other should be provided.
      type: object
      properties:
        dataFlow:
          $ref: "#/components/schemas/dataFlow"
        executionBindings:
          $ref: "#/components/schemas/executionBindings"
        dataFlowReference:
          $ref: "#/components/schemas/externalReference"
    externalReference:
      title: ExternalReference
      description: specifies a reference to an entity which exists elsewhere.
      type: object
      properties:
        type:
          type: string
          example: uri
          maxLength: 100
          description: specifies the type of reference. 'content' - reference to a
            folder path in sas content. 'uri' - reference to a dataflow uri. 'filesystem'
            - path to a file.
        path:
          type: string
          example: /dataFlows/dataFlows/73515871-f990-4b05-a034-322751ca9428
    formatSummaryCollection:
      title: Format Summary Collection
      description: Provides a collection of format summaries.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/formatSummary"
            description: Specifies an array that contains a list of format summary
              resources.
      example:
        accept: application/vnd.sas.format.summary
        items:
        - id: $
          links:
          - href: /compute/sessions/{sessionId}/formats/%24
            method: GET
            rel: self
            type: application/vnd.sas.format
            uri: /compute/sessions/{sessionId}/formats/%24
          name: $
          version: 1
        limit: 1
        links:
        - href: /compute/sessions/{sessionId}/formats?limit=1&start=0
          itemType: application/vnd.sas.format.summary
          method: GET
          rel: self
          type: application/vnd.sas.collection
          uri: /compute/sessions/{sessionId}/formats?limit=1&start=0
        - href: /compute/sessions/{sessionId}/formats
          itemType: application/vnd.sas.format.summary
          method: GET
          rel: collection
          type: application/vnd.sas.collection
          uri: /compute/sessions/{sessionId}/formats
        - href: /compute/sessions/{sessionId}/formats?limit=1&start=1
          itemType: application/vnd.sas.format.summary
          method: GET
          rel: next
          type: application/vnd.sas.collection
          uri: /compute/sessions/{sessionId}/formats?limit=1&start=1
        name: Formats
        start: 0
        version: 2
    formatSummary:
      title: SAS Format Summary
      description: Provides a summary of a SAS format or informat.
      properties:
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 1.
        id:
          type: string
          readOnly: true
          description: Specifies the identifier of this format.
        name:
          type: string
          readOnly: true
          description: Specifies the name of this format.
        links:
          type: array
          description: Specifies the links that apply to this format.
          items:
            $ref: "#/components/schemas/link"
      example:
        id: $VARYING
        links:
        - href: /compute/sessions/0001-ses0000/formats/%24VARYING
          method: GET
          rel: self
          type: application/vnd.sas.format
          uri: /compute/sessions/0001-ses0000/formats/%24VARYING
        name: $VARYING
        version: 1
    columnSimpleFormat:
      title: Simple Column Formatting
      type: object
      description: Specifies the format to use for values in a column.
      properties:
        decimals:
          type: integer
          description: Specifies the number of digits to the right of the decimal
            point.
        length:
          type: integer
          description: Specifies the length of a formatted value.
        name:
          type: string
          description: "Specifies the qualified name of the format or informat in\
            \ the form of: <$>name<w>.<d>"
      example:
        decimals: 2
        length: 10
        name: DOLLAR10.2
    jobLogCollection:
