              $ref: "#/components/schemas/rScheduledSubmissionRequest"
            examples:
              default:
                $ref: "#/components/examples/SubmissionsRequest"
          application/vnd.sas.studio.sas.code.scheduled.submission.request+json:
            schema:
              $ref: "#/components/schemas/sasCodeScheduledSubmissionRequest"
            examples:
              default:
                $ref: "#/components/examples/SubmissionsRequest"
      responses:
        "201":
          description: The job was scheduled.
          content:
