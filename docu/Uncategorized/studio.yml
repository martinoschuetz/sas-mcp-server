      description: Job definition parameter.
      properties:
        name:
          type: string
          description: The name of the parameter.
          maxLength: 100
        type:
          type: string
          description: The type of the parameter (TABLE, NUMERIC, DATE, CHARACTER).
          maxLength: 20
        label:
          type: string
          description: The display value for the name of this parameter.
          maxLength: 250
        required:
          type: boolean
          description: Specifies if the parameter is required for execution.
        defaultValue:
          type: string
          description: The default value for this parameter, if one is not specified
            at execution time.
        version:
          type: integer
          description: The version number of the representation. The current version
            is 1.
    logLine:
      title: Line
      description: Provides an individual line from a log or listing resource.
      required:
      - type
      - line
      properties:
        version:
          type: integer
          format: int32
          readOnly: true
          description: Specifies the version number of this representation schema.
            This is version 1.
        type:
          type: string
          enum:
          - normal
          - hilighted
          - source
          - title
          - byline
          - footnote
          - error
          - warning
          - note
