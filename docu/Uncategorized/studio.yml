    dataRowCollection:
      title: Data Row Collection
      description: Provides a paginated collection of table row resources.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items: {}
            description: >-
              Items provides the data values for each row in the table. It is an
              array

              of arrays, each sub array representing a row of data, and each index
              in
              that array

              mapping back to the index of the corresponding column in the Columns
              array.
      properties:
        columnCount:
          description: ColumnCount provides the number of columns that exist in the
            table.
          example: 5
          format: int64
          type: integer
        columnStart:
          description: ColumnStart provides the start index of the columns being requested.
          example: 0
          format: int64
          type: integer
        columnLimit:
          description: ColumnLimit provides the maximum number of columns being returned.
          example: 100
          format: int64
          type: integer
        columnDetail:
          description: ColumnDetail specifies the level of detail being returned for
            the columns.
          example: Name
          type: string
        columns:
          description: >-
            Columns provides an array of columns being returned. The index of

            the column index must also be used to infer the value of the column

            at each row in the items collection. For example if the Age column

            is at index 0, then Items[0][0] will be the value of Age for the first

            row of data returned.
