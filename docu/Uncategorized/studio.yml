      operationId: createMember
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: path
        in: path
        description: The directory path in which to create the new member, or one
          of the supported delegates ('@contentmyfolder', '@autoSave', etc)
        schema:
          type: string
        required: true
      - name: name
        in: path
        description: The name to use when creating the member.
        schema:
          type: string
        required: true
      - name: contentType
        in: query
        description: The type of resource to create (file or folder).
        schema:
          type: string
      - name: typeDefName
        in: query
        description: The typeDefName of the resource being created. This is the name
          of the type of the file (for example, a SAS program file would have a "typeDefName"
          of "programFile").  If not provided, the default of "file" will be used.
        required: false
        schema:
          type: string
      - name: Content-Type
        in: header
        schema:
          type: string
        description: |
          When the contentType parameter is 'file', the appropriate 'Content-Type'
          value should be specified to indicate the type of the contents (i.e. text/csv,
          application/vnd.sas.studio.programfile, etc)

          Furthermore, the value should include the charset parameter to specify
          the encoding for text based files.
          Some example 'Content-Type' values are -

          'text/csv;charset=utf-8',

          'application/vnd.sas.studio.programfile;charset=utf-8',

          When the contentType parameter is 'folder', the 'Content-Type'
          value should be 'application/vnd.sas.studio.folder'

          Note - Don't confuse the input parameter to this endpoint named
          'contentType' and the header named 'Content-Type.  The 'contentType'
          parameters is to indicate whether the resource is a file or folder.

          Additional information -
          The Content-Type header value specified here, will be used when creating
          a file in Content and it will allow for the file to be properly
          handled by all services in Viya (i.e. SAS Drive, etc).
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: The file contents to be saved.
        required: false
      responses:
        "201":
          description: The file, or folder was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                default:
