          maxLength: 100
          description: identity of the environment
        sessionId:
          type: string
          maxLength: 100
          description: environment specific id of the session to run the data flow
            in
        contextId:
          type: string
          maxLength: 100
          description: environment specific id of the context to run the data flow
            in
        arguments:
          type: object
          description: map of parameter id to value (TableStructureArgument, TableArgument,
            FileArgument, TableStructureUriArgument, TableUriArgument, StringArgument)
        tempTablePrefix:
          type: string
          maxLength: 100
          description: prefix to use when creating temporary tables for this run,
            if it is longer than three characters, it will be ignored
    step:
