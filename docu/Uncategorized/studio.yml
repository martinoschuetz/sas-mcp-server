      type: object
      properties:
        step:
          $ref: "#/components/schemas/dataFlowStepAndArguments"
        executionBindings:
          $ref: "#/components/schemas/executionBindings"
    dataFlowStepAndArguments:
      title: DataFlowStepAndArguments
