  /sessions/{sessionId}/foreground/submissions/{submissionId}/longpoll:
    get:
      tags:
      - Foreground Submission
      summary: Polls a foreground submission for active events
      description: |
        Polls a foreground submission for submission related events. The response is an
        array of messages. The payload depends on the message type.

        | Message Type         | Payload              |
        |----------------------|----------------------|
        | LogChunk             | HTML Log Chunk       |
        | LogEnd               | HTML Log Chunk       |
        | JSONLogChunk         | JSON Log Chunk       |
        | SuppressedLogChunk   | Suppressed Log Chunk |
        | JobCompleted         | Submission           |
        | Error                | Compute log line     |
        | Warning              | Compute log line     |
        | FlowNodeRunning      | Flow Node            |
        | FlowNodeCompleted    | Flow Node            |
        | FlowNodeTableCreated | Flow Table           |
        | StatusNotification   | SAS Status           |
      operationId: getForegroundEvents
      parameters:
      - name: sessionId
        in: path
        description: The session id.
        schema:
          type: string
        required: true
      - name: submissionId
        in: path
        description: The submission id.
        schema:
          type: string
        required: true
      - name: start
        in: query
        description: The zero-based index of the first log line request. This defaults
          to 0.
        schema:
          type: integer
        required: false
      - name: logType
        in: query
        description: The type of log desired. The values are "html" for an HTML formatted
          log chunk, "json" for a JSON array of log line types, or "none" if no additional
          log is wanted. The default is "html". If "none" is specified, but sasStatus
          or flowStatus is true, then a suppressed log chunk message will be sent.
          This allows us to continue parsing the log for status notifications without
          sending the log lines back to the client.
        schema:
          type: string
          enum:
          - html
          - json
          - none
        required: false
      - name: sasStatus
        in: query
        description: Whether or not to look for SAS language specific notifications
          (SAS procedure, step or statement notifications). This is used in conjunction
          with the statusNotification property when a submission is created. The default
          value is false.
        schema:
          type: boolean
        required: false
      - name: flowStatus
        in: query
        description: Whether or not to look for flow specific notifications. This
          is used in conjunction with a flow submission. Flow node status events will
          be sent back regardless if we want the log lines. The default value is false.
        schema:
          type: boolean
        required: false
      responses:
        "200":
          description: The events associated with the submission.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/message"
            application/vnd.sas.studio.message.list+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/message"
