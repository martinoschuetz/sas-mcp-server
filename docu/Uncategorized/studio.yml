            application/vnd.sas.studio.file:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                default:
                  $ref: "#/components/examples/FilesMemberExample"
          headers:
            ETag:
              description: The entity tag for this resource.
              schema:
                type: string
        "400":
          description: The operation failed due to a bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequestErrorResponseExample"
        "409":
          description: The resource was not created due to a conflict.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/conflictErrorResponseExample"
