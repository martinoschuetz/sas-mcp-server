    job:
      title: Execution Job Schema
      description: The execution job.
      properties:
        id:
          type: string
          description: The unique identifier that is generated by the API.
        state:
          type: string
          description: The current state of the job.
          enum:
          - pending
          - running
          - canceled
          - completed
          - failed
          - timedOut
        stateDetails:
          type: string
          description: Details that supplement the "state" by providing a hint that
            additional information is available. It is a hint and not the actual information.
            The purpose of this field is for providers to provide a hint, where applicable,
            about the state set and for that hint to be used by components which convey
            state information to clients. It should be set in conjunction with "state".
        results:
          type: object
          description: The output of the job execution as a map of string keys and
            values.
          additionalProperties:
            type: string
        error:
          $ref: "#/components/schemas/error2"
        jobRequest:
          $ref: "#/components/schemas/jobRequest"
        heartbeatInterval:
          type: integer
          format: int32
          description: The interval in seconds that the heartbeatTimeStamp is updated
            by the provider before the job times out. This is 0 if there is no heartbeat.
        heartbeatTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the last heartbeat was received, in
            the format of YYYY-MM-DDThh:mm:ss.sssZ.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the job was created, in the format of
            YYYY-MM-DDThh:mm:ss.sssZ.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job was last modified, in the format
            of YYYY-MM-DDThh:mm:ss.sssZ.
        endTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job state changed to completed or failed,
            in the format of YYYY-MM-DDThh:mm:ss.sssZ.
        elapsedTime:
          type: number
          description: If the job has ended, the value is the difference between the
            endTimeStamp and the creationTimeStamp. If the job has not ended, the
            value is the difference between the time that this representation was
            created and the creationTimeStamp. The units are in milliseconds. A value
            of -1 is returned, if a value is not set for the creationTimeStamp.
        logLocation:
          type: string
          description: The URI for the log, if one exists. The provider may provide
            additional information.
        expirationTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job expires and will be deleted by the
            Job Execution service, in the format of YYYY-MM-DDThh:mm:ss.sssZ. This
            is set by the service after the job has completed based on the value of
            the expiresAfter member of the job request.
        createdBy:
          type: string
          description: The name of the user who created or submitted the job.
        modifiedBy:
          type: string
          description: The name of the last user who modified this object.
        submittedByApplication:
          type: string
          description: Value of the query parameter "submitter" on the POST endpoints
            to submit a job. If the query parameter is not present, the createdByApplication
            value from the embedded JobRequest is used. The createdByApplication value
            in the embedded JobRequest that is used is the same as what was in the
            submitted job request if one was present; if not the value "jobExecution"
            is used. The submittedByApplication value is used as the "submitter" in
            the routing routing key of Job State Change events. Only characters in
            the set [a-zA-Z0-9] and dash are valid for submitter.
          maxLength: 64
        links:
          type: array
          description: Links that apply to this object. Includes "self", "state",
            "update", "delete", "updateState", "updateHeartbeatTimeStamp", "jobRequest"
            and "log".
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the representation. The current version
            is 4.
    jobRequest:
      title: Job Request Schema
      description: The job request.
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the job request. This is only required
            for a persisted job request.
        name:
          type: string
          description: The name of the job request.
        description:
          type: string
          description: The description of the job rquest.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job request was created, in the format
            of YYYY-MM-DDThh:mm:ss.sssZ. This is set only on a persisted job request.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job request was last modified, in the
            format of YYYY-MM-DDThh:mm:ss.sssZ. This is set only on a persisted job
            request.
        createdBy:
          type: string
          description: The name of the user who created the job request. This is set
            only on a persisted job request.
        modifiedBy:
          type: string
          description: The name of the last user who modified this object. This is
            set only on a persisted job request
        jobDefinitionUri:
          type: string
          description: The URI of the job definition that is to be executed. Either
            the jobDefinitionUri or the jobDefinition property must be set in a job
            request submitted to Job Execution service for execution.
        jobDefinition:
          $ref: "#/components/schemas/jobDefinition"
        expiresAfter:
          type: string
          description: The duration of time (in W3C XML duration format) after the
            completion of the job when the job should be deleted by the Job Execution
            service. If a value is specified for this property, it overrides any value
            specified by the provider's /commons/settings endpoint for the job request.  For
            a job request that is embedded in the application/vnd.sas.job.execution.job
            media type, if a value is not already set for the expiresAfter property,
            the value is set by the Job Execution service to the provider's value,
            if one exists.
        arguments:
          type: object
          description: The values of the arguments are name value pairs specified
            as a map of string keys and values. Values can be supplied for parameters
            not defined in the job definition. The maximum name length is 100. <p>
            Hibernate does not persist a map entry with a null value. Therefore, a
            persisted Job Request will not contain any such entries. <p> For a job
            request that is embedded in the 'application/vnd.sas.job.execution.job'
            media type, this value is set by the Job Execution service and contains
            the complete set of arguments that are to be used in the execution by
            the provider. Arguments that already exist in the original job request
            are left unchanged. If there are arguments in the job definition that
            do not exist in the original job request arguments map, those arguments
            and any default values, including null values, are added to the arguments
            map. However, since the Job object is persisted before being sent to the
            provider, no entries for such null-value arguments in the Job are sent
            to the provider (because of the Hibernate behavior of not persisting map/collection
            entries with null values). The Job Execution service also guarantees that
            any required argument has an associated non-null value.
          additionalProperties:
            type: string
        properties:
          type: array
          description: The value of properties are name value pairs specified as a
            map of string keys and values. The maximum name length is 100.
          items:
            $ref: "#/components/schemas/resourceProperty"
        createdByApplication:
          type: string
          description: The application that created the job request. The value is
            typically from the spring.application.name property. The value is used
            as the "creator" in the routing key of the Job State Change events, and
            if it is not present in the job request the value "jobExecution" is used.
            Valid characters are [a-zA-Z0-9] and the hyphen.
          maxLength: 64
        links:
          type: array
          description: Links that apply to this object. Includes "self", "alternate",
            "export", "delete", "update", "import", "up", "jobs" and "submitJob".
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the representation. The current version
            is 3.
    connectionJobRequest:
      title: Connection Job Request
      description: A job to test, connect, or delete a library from a connection.
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
          description: The non-unique name of the data connection.
          maxLength: 255
        type:
          type: string
          description: The type of connection job this is. Valid values are test,
            connect, delete.
          maxLength: 32
        parameters:
          type: object
          description: The parameters for this connection. Valid parameters keys are;
            envResourceURIs, connection, and connectionURI.
          additionalProperties:
            $ref: "#/components/schemas/connectionJobParameters"
    connectionJobParameters:
      title: Connection job parameters
      description: Parameters for metadata to take actions.
      properties:
        envResourceURIs:
          type: array
          description: Is a string [] with dataSourcesURI for each datasource.
          items:
            type: string
            description: A dataSourcesURI for each datasource such as compute context
              or CAS server with the query parameter for the session identity.
        connection:
          type: object
          description: Is a connection object inline/embedded.  Note for "connect"
            or "delete" connection job types the connection.id must be present and
            valid, for the "test" connection job type the connection.id can be omitted.
          additionalProperties:
            $ref: "#/components/schemas/connection"
        connectionURI:
          type: string
          description: Is a string value with the URI to the connection object, such
            as /dataConnections/connections/07747fe7-6be3-4785-b664-181a90b79fc2.  The
            connectionURI is not used if "connection" parameter is specified.
    connection:
      title: Connection
      description: A connection is the information necessary to make a connection
        to a data store.
      type: object
      required:
      - id
      - name
      - connectorTargetId
      - connectorTypeId
      properties:
        id:
          type: string
          description: The unique data source identifier.
          maxLength: 36
        name:
          type: string
          description: The non-unique name of the data connection.
          maxLength: 8
        connectorTargetId:
          type: string
          description: The unique data connector identifier for the target.
          maxLength: 36
        connectorTypeId:
          type: string
          description: The unique data connector identifier for the type.
          maxLength: 36
        description:
          type: string
          description: A brief description of the connection.
          maxLength: 1000
        label:
          type: string
          description: A display name of the connection.
          maxLength: 255
        references:
          type: array
          description: An array that contains references for connection.
          items:
            $ref: "#/components/schemas/connectionReference"
        createdBy:
          type: string
          description: The user who created this connection.
        modifiedBy:
          type: string
          description: The last user to modify this connection.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for the connection creation.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for the last connection modification.
        options:
          type: object
          description: The user-set for this connection.
          additionalProperties: {}
        properties:
          type: object
          description: The configuration properties for this connection.
          additionalProperties: {}
        methodContextResources:
          type: object
          description: The resources to manage with this connection. This is a mapping
            of method name resources, where resources map context/server to library
            name/libref.
          additionalProperties: {}
        customOptions:
          type: array
          description: The custom options for this connection.
          items:
            $ref: "#/components/schemas/customOption"
        version:
          type: integer
          description: The source schema version.
        links:
          type: array
          description: The paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
    connectionReference:
      title: Connection Reference
      description: A reference is a relationship between a connection and any object
        that is created from or derived from the connection metadata.
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The unique data source identifier.
          maxLength: 36
        method:
          type: string
          description: The name of the connection method.
          maxLength: 255
        uri:
          type: string
          description: The uri to the object managed/referenced from this connection.
          maxLength: 1000
        location:
          type: string
          description: The compute context name or cas server name related to this
            reference.
          maxLength: 500
    customOption:
      title: customOption
      description: An option applied manually by the user.
      type: object
      required:
      - name
      - value
      properties:
        methods:
          type: array
          description: >
            the connection methods this option applies to, default=ALL. Example values
            include:
              * ALL
              * engine
              * connector
              * engineORC
              * enginePARQUET
          items:
            type: string
            description: a connection method name this option applies to.
        name:
          type: string
          description: the name of the option.
          maxLength: 255
        value:
          type: string
          description: the option value as string
        type:
          type: string
          description: >
            the type of the option, default=string. Possible values include:
              * string, User provided string value that is quoted.
              * enum, SAS System defined value that usually has NO spaces or special
            characters.
              * boolean, SAS System boolean as true/false value
              * integer, Integer value is a whole number, not a fractional number,
            that can be positive, negative, or zero
              * double, Double or float value such as 3.14159.  Examples are numbers
            with decimal points. It can represent fractional as well as whole values
            and can contain up to 15 digits in total, including those before and after
            the decimal point.
              * null, Key only field, using a boolean value for enablement.
