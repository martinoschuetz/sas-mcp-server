          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Selects a specified word from input column.
          enum:
          - kscan
        start:
          type: integer
          description: specifies the number of the word in the column for KSCAN to
