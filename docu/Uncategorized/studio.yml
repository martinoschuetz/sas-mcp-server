          type: string
          x-go-name: CreatedBy
        creationTimeStamp:
          description: CreationTimeStamp is the time when the job began executing.
          format: date-time
          type: string
          x-go-name: CreationTimeStamp
        elapsedTime:
          description: ElapsedTime is the total amount of time the job was running
