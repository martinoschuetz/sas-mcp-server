      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          id:
            type: string
            maxLength: 36
            example: id-1698265944252-525
            description: The unique identifier of this step.
          name:
            type: string
            maxLength: 250
            example: File
            description: The name of this step.
          displayName:
            type: string
            maxLength: 250
            example: File
            description: The displayable name or localization ID for this step.
          localDisplayName:
            type: string
            maxLength: 250
            example: File
            description: If this step is a SAS provided step, this will contain the
              localized display name for this step, otherwise it will contain the
              displayName.
          description:
            type: string
            maxLength: 1000
            example: The File step description.
            description: The description of this step.
          localDescription:
            type: string
            maxLength: 1000
            example: The File step description.
            description: If this step is a SAS provided step, this will contain the
              localized description for this step, otherwise it will contain the description.
          properties:
            type: object
            description: Map of this steps's properties.
          links:
            type: array
            description: Zero or more links to related resources or operations
            items:
              $ref: "#/components/schemas/link"
          version:
            type: integer
            example: 1
            description: This media type's version number. This representation is
