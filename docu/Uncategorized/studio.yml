          format: int64
          type: integer
          x-go-name: ElapsedTime
        endTimeStamp:
          description: EndTimeStamp is the time when the job finished executing.
          format: date-time
          type: string
          x-go-name: EndTimeStamp
        expirationTimeStamp:
          description: ExpirationTimeStamp is the time when the job results will expire
            and be deleted.
          format: date-time
          type: string
          x-go-name: ExpirationTimeStamp
        id:
          description: ID is the unique ID of the job.
          type: string
          x-go-name: ID
