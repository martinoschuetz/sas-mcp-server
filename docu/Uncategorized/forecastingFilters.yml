---
openapi: 3.0.3
info:
  description: Forecasting Filters API
  version: "2"
  title: Forecasting Filters
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: "https://support.sas.com/techsup/license/index.html"
tags:
- name: Root
  description: The operations for the root resource.
- name: ForecastingFilter
  description: The operations for a filter resource.
- name: ForecastingFilterResults
  description: The operations for filter results.
- name: ForecastingFilterConsumers
  description: The operations for filter consumers.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/rootResp"
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/rootResp"
          headers: {}
  /filters:
    get:
      tags:
      - ForecastingFilter
      summary: Get a collection of filters
      description: Returns a collection of forecasting filters based on the specified
        pagination and sorting options. The items in the collection use the `application/vnd.sas.forecasting.filters.spec`
        media type.
      operationId: getFilters
      parameters:
      - name: consumerId
        in: query
        description: Retrieve the filter specifications associated with the consumer
          Id
        required: false
        schema:
          type: string
      - name: start
        in: query
        description: Offset of first filter specification to retrieve
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: Maximum number of filter specifications to retrieve
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      - name: filter
        in: query
        description: "Filter criteria for returned types. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/forecastingFilters-v2/docs/getting-started/usage-notes#filtering)."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "The criteria for sorting the score definitions. See [Sorting\
          \ in REST APIs](https://developer.sas.com/rest-apis/forecastingFilters-v2/docs/getting-started/usage-notes#sorting)."
        required: false
        schema:
          type: string
          default: "modifiedTimeStamp:descending"
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/vnd.sas.collection+json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/filterCollection"
              examples:
                default:
                  $ref: "#/components/examples/filterGetAll"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/filterCollection"
              examples:
                default:
                  $ref: "#/components/examples/filterGetAll"
    post:
      tags:
      - ForecastingFilter
      summary: Create a new filter or return an existing one if it matches the request
      description: It creates a forecasting filter using the filter specification
        or returns an existing one if one already exists.  A successful response body
        will contain the fully-populated resource.
      operationId: createFilter
      requestBody:
        content:
          application/vnd.sas.forecasting.filters.spec+json:
            schema:
              $ref: "#/components/schemas/filterSpecification"
            examples:
              json:
                $ref: "#/components/examples/createFilterRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/filterSpecification"
            examples:
              json:
                $ref: "#/components/examples/createFilterRequest"
        description: Filter specification
      responses:
        "200":
          description: The response body contains an already existing filter.
          headers:
            Location:
              description: The URL of the filter that got created.
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for the filter.
              schema:
                type: string
          content:
            application/vnd.sas.forecasting.filters.spec+json:
              schema:
                $ref: "#/components/schemas/filterSpecification"
              examples:
                default:
                  $ref: "#/components/examples/filterSpec"
            application/json:
              schema:
                $ref: "#/components/schemas/filterSpecification"
              examples:
                default:
                  $ref: "#/components/examples/filterSpec"
        "201":
          description: Created
          headers:
            Location:
              description: The URL of the filter that got created.
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for the filter.
              schema:
                type: string
          content:
            application/vnd.sas.forecasting.filters.spec+json:
              schema:
                $ref: "#/components/schemas/filterSpecification"
              examples:
                json:
                  $ref: "#/components/examples/filterPost"
            application/json:
              schema:
                $ref: "#/components/schemas/filterSpecification"
              examples:
                json:
                  $ref: "#/components/examples/filterPost"
        "400":
          description: The information sent in the request body contains an error
            or is incomplete.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/badRequest"
  /filters/results/timeseries:
    post:
      tags:
      - ForecastingFilterResults
      summary: Get filter results for a specified Forecasting Filter Result specification
      description: 'Get aggregated time series for a forecasting filter that corresponds
        to the specified result specification. Note: No "Location" header is returned
        since the result is a transient resource that is not persisted.'
      operationId: createFilterResults
      requestBody:
        $ref: "#/components/requestBodies/filterResultSpecification"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/filterForecasts"
              examples:
                default:
                  $ref: "#/components/examples/filterResults"
            application/vnd.sas.forecasting.filters.results.timeseries+json:
              schema:
                $ref: "#/components/schemas/filterForecasts"
              examples:
                default:
                  $ref: "#/components/examples/filterResults"
        "400":
          description: The information sent in the request body contains an error
            or is incomplete.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: The specified filter does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
  "/filters/{filterId}":
    get:
      tags:
      - ForecastingFilter
      summary: Get a Forecasting Filter
      description: Get a forecasting filter that corresponds to the specified filter
        id.
      operationId: getFilter
      parameters:
      - name: filterId
        in: path
        description: Unique id associated with the filter being requested.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: E-Tag for the filter.
              schema:
                type: string
          content:
            application/vnd.sas.forecasting.filters.spec+json:
              schema:
                $ref: "#/components/schemas/filterSpecification"
              examples:
                default:
                  $ref: "#/components/examples/filterSpec"
            application/json:
              schema:
                $ref: "#/components/schemas/filterSpecification"
              examples:
                default:
                  $ref: "#/components/examples/filterSpec"
        "404":
          description: The specified filter does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
    head:
      tags:
      - ForecastingFilter
      summary: Check the availability of a filter resource
      description: |
        Retrieve the headers and check the availability of a filter.
      operationId: headersForFilter
      parameters:
      - name: filterId
        in: path
        description: Unique id associated with the filter being requested.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: E-Tag for the filter.
              schema:
                type: string
        "404":
          description: The specified filter does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
    put:
      tags:
      - ForecastingFilter
      summary: Update a Forecasting Filter
      description: Update a forecasting filter. A successful response body will contain
        the fully-populated resource.
      operationId: updateFilter
      parameters:
      - name: filterId
        in: path
        description: Unique id associated with the filter being requested.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: Update the filter only if the current ETag header matches this
          value
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.forecasting.filters.spec+json:
            schema:
              $ref: "#/components/schemas/filterSpecification"
            examples:
              json:
                $ref: "#/components/examples/updateFilterRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/filterSpecification"
            examples:
              json:
                $ref: "#/components/examples/updateFilterRequest"
        description: Filter properties like name and description that are allowed
          to be changed
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: E-Tag for the filter.
              schema:
                type: string
          content:
            application/vnd.sas.forecasting.filters.spec+json:
              schema:
                $ref: "#/components/schemas/filterSpecification"
              examples:
                default:
                  $ref: "#/components/examples/filterSpec"
            application/json:
              schema:
                $ref: "#/components/schemas/filterSpecification"
              examples:
                default:
                  $ref: "#/components/examples/filterSpec"
        "400":
          description: The information sent in the request body contains an error
            or is incomplete.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: The specified filter does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/preConditionFailed"
        "428":
          description: The request headers did not include a 'If-Match' precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/preConditionRequired"
    delete:
      tags:
      - ForecastingFilter
      summary: Delete a Forecasting Filter
      description: Delete an existing forecasting filter resource that corresponds
        to the specified filter id.
      operationId: deleteFilter
      parameters:
      - name: filterId
        in: path
        description: Unique id associated with the filter being requested.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "404":
          description: The specified forecasting filter does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
  "/filters/{filterId}/consumers":
    post:
      tags:
      - ForecastingFilterConsumers
      summary: Associate a consumer with Forecasting Filter
      description: Update a forecasting filter to include the consumer association.
        A successful response body will contain the consumer information.
      operationId: createFilterConsumer
      parameters:
      - name: filterId
        in: path
        description: Unique id associated with the filter for which the consumer is
          added.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/filterConsumer"
            examples:
              json:
                $ref: "#/components/examples/createConsumerRequest"
          application/vnd.sas.forecasting.filters.consumer+json:
            schema:
              $ref: "#/components/schemas/filterConsumer"
            examples:
              json:
                $ref: "#/components/examples/createConsumerRequest"
        description: Filter consumer such as a forecasting project
      responses:
        "201":
          description: OK
          headers:
            Location:
              description: The URL of the consumer that got associated with the filter.
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for the filter.
              schema:
                type: string
          content:
            application/vnd.sas.forecasting.filters.consumer+json:
              schema:
                $ref: "#/components/schemas/filterConsumer"
              examples:
                default:
                  $ref: "#/components/examples/consumerResp"
            application/json:
              schema:
                $ref: "#/components/schemas/filterConsumer"
              examples:
                default:
                  $ref: "#/components/examples/consumerResp"
        "400":
          description: The information sent in the request body contains an error
            or is incomplete.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: The specified filter does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
  "/filters/{filterId}/consumers/{consumerId}":
    get:
      tags:
      - ForecastingFilterConsumers
      summary: Get the consumer associated with a filter
      description: Get the consumer associated with the filter.
      operationId: getConsumer
      parameters:
      - name: filterId
        in: path
        description: Filter id with which the consumer is associated.
        required: true
        schema:
          type: string
      - name: consumerId
        in: path
        description: Consumer id that is associated with the filter.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/vnd.sas.forecasting.filters.consumer+json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/filterConsumer"
              examples:
                default:
                  $ref: "#/components/examples/consumerResp"
            application/vnd.sas.forecasting.filters.consumer+json:
              schema:
                $ref: "#/components/schemas/filterConsumer"
              examples:
                default:
                  $ref: "#/components/examples/consumerResp"
        "404":
          description: The specified resource does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
    head:
      tags:
      - ForecastingFilter
      summary: Check the availability of a filter consumer
      description: |
        Retrieve the headers and check the availability of a consumer.
      operationId: headersForConsumer
      parameters:
      - name: filterId
        in: path
        description: Filter id with which the consumer is associated.
        required: true
        schema:
          type: string
      - name: consumerId
        in: path
        description: Consumer id that is associated with the filter.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/vnd.sas.forecasting.filters.consumer+json
        "404":
          description: The specified resource does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
    delete:
      tags:
      - ForecastingFilter
      summary: Delete a consumer association from a Forecasting Filter
      description: Delete an existing consumer association for the give consumer id
        from a forecasting filter resource that corresponds to the specified filter
        id.
      operationId: deleteConsumer
      parameters:
      - name: filterId
        in: path
        description: Filter id that the consumer is associated with.
        required: true
        schema:
          type: string
      - name: consumerId
        in: path
        description: Consumer id that is associated with the filter.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "404":
          description: The specified forecasting filter does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
  "/filters/{filterId}/results/timeseries":
    post:
      tags:
      - ForecastingFilterResults
      summary: Get Filter results with Filter ID
      description: 'Get matching time series for a forecasting filter that corresponds
        to the specified result specification and filter id.  Note: No \"Location\"
        header is returned since the result is a transient resource that is not persisted.'
      operationId: createFilterIdResults
      parameters:
      - name: filterId
        in: path
        description: filterId
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/filterResultSpecification"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/filterForecasts"
              examples:
                default:
                  $ref: "#/components/examples/filterResults"
            application/vnd.sas.forecasting.filters.results.timeseries+json:
              schema:
                $ref: "#/components/schemas/filterForecasts"
              examples:
                default:
                  $ref: "#/components/examples/filterResults"
        "400":
          description: The information sent in the request body contains an error
            or is incomplete.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: The specified filter does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
  "/dataSources/{dataSourceId}/filterValidations":
    post:
      tags:
      - ForecastingFilter
      summary: Validate filter specifications
      description: Validates filter specifications against the specified data source.
      operationId: createFilterValidation
      parameters:
      - name: dataSourceId
        in: path
        description: The identifier of the data source to validate filters against.
        required: true
        schema:
          type: string
      requestBody:
        description: Validation request specifying the scope of filter validation.
        required: true
        content:
          application/vnd.sas.forecasting.filters.validation.request+json:
            schema:
              type: object
              properties:
                dataSourceId:
                  type: string
                  format: uuid
                  description: The identifier of the data specification.
                tableDefinitionId:
                  type: string
                  format: uuid
                  description: The identifier of the table definition.
                group:
                  type: string
                  description: The group to scope the validation.
            examples:
              default:
                value:
                  dataSourceId: "d4f5a6b7-c8d9-4e0f-a1b2-c3d4e5f6a7b8"
                  tableDefinitionId: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
                  group: "Region_A"
          application/json:
            schema:
              type: object
              properties:
                dataSourceId:
                  type: string
                  format: uuid
                  description: The identifier of the data specification.
                tableDefinitionId:
                  type: string
                  format: uuid
                  description: The identifier of the table definition.
                group:
                  type: string
                  description: The group to scope the validation.
            examples:
              default:
                value:
                  dataSourceId: "d4f5a6b7-c8d9-4e0f-a1b2-c3d4e5f6a7b8"
                  tableDefinitionId: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
      responses:
        "204":
          description: No Content
        "400":
          description: Request body is invalid or incomplete.
servers:
- url: http://example.com/forecastingFilters
  description: Kubernetes mock server
components:
  requestBodies:
    filterResultSpecification:
      content:
        application/vnd.sas.forecasting.filters.result.spec+json:
          schema:
            $ref: "#/components/schemas/filterResultSpecification"
          examples:
            json:
              $ref: "#/components/examples/applyFilterRequest"
        application/json:
          schema:
            $ref: "#/components/schemas/filterResultSpecification"
          examples:
            json:
              $ref: "#/components/examples/applyFilterRequest"
      description: Filter result specification
      required: true
  schemas:
    columnMetadata:
      type: object
      required:
      - name
      properties:
        format:
          type: string
          description: Data format assoicated with the column
        label:
          type: string
          description: Label assoicated with the column
        name:
          type: string
          description: Name of the column
        type:
          type: string
          description: Data type of the column
      description: Metadata that describes a table column.  This is not a top-level
        model.
    filterResultSpecification:
      type: object
      required:
      - timeSeriesTable
      properties:
        aggregateResults:
          type: boolean
          description: Aggregate the filtered results if set to true
        filterSpecification:
          $ref: "#/components/schemas/filterSpecification"
        timeSeriesTable:
          type: string
          description: Time series table to apply filter on
          enum:
          - TIMESERIES
          - FORECASTS_STAT
          - FORECASTS_OVERRIDES
          - FORECASTS_FINAL_ONLY
      description: "Specification of filter results, includes aggregation options\
        \ and the target table. Media type is application/vnd.sas.forecasting.filters.result.spec+json"
    filterConsumer:
      type: object
      required:
      - consumerId
      properties:
        consumerId:
          type: string
          description: Consumer id to be associated with a filter
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          format: int32
          description: Version of the resource
      description: Representation of a filter consumer.  Media type is application/vnd.sas.forecasting.filters.consumer+json
    filterSpecification:
      type: object
      required:
      - dataSourceId
      properties:
        attributesCaslib:
          type: string
          description: Name of the library that contains the time series attributes
            table.
        attributesTable:
          type: string
          description: Name of the tables contains the time series attributes.
        createdBy:
          type: string
          description: userid of the user who created the resource
        creationTimeStamp:
          type: string
          format: date-time
          description: creation time of the resource
        dataSourceId:
          type: string
          description: Data specification identifier.
        description:
          type: string
          description: Description of the filter
        favorite:
          type: boolean
          default: true
          description: Mark this filter as a favorite for quick access.
        fieldCombiningOperator:
          type: string
          description: 'Operator to combine different categories in the query, valid
            values are "AND" and "OR".  The default is "AND"'
          enum:
          - AND
          - OR
        id:
          type: string
          description: Id of the filter
        inUse:
          type: boolean
          default: false
          description: The filter has been associated with one more consumers.
        keyNames:
          type: array
          description: List of variables used to identify time series.
          items:
            type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
        modifiedBy:
          type: string
          description: The userid of the user who last updated the resource
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The time of the last update of the resource
        name:
          type: string
          description: Name of the filter
        query:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/filterValues"
          description: "Filter query is a map of variable name to a list of filter\
            \ values, all the elements of the map are combined using the combining\
            \ operator."
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 2.
      description: Specification of a filter based on time series attributes table.
        Media type is application/vnd.sas.forecasting.filters.spec+json
    filterForecasts:
      type: object
      required:
      - columnMetadata
      properties:
        columnMetadata:
          type: object
          description: "Map of column name to it's metadata such as label, type, format"
          additionalProperties:
            $ref: "#/components/schemas/columnMetadata"
        createdBy:
          type: string
          description: userid of the user who created the resource
        creationTimeStamp:
          type: string
          format: date-time
          description: creation time of the resource
        data:
          type: array
          description: Data rows that represent the values
          items:
