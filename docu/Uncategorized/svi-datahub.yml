      summary: "Get summary of action history for a link"
      operationId: "getActionHistorySummaryLink"
      description: "Retrieves a summary of action history for a link. Action history\
        \ summaries contain a link to fetch the full representation.\nThe 'Accept-Item'\
        \ request header can be used to fetch the 'available action types' for this\
        \ link. If the 'Accept-Item' header is set to \"application/vnd.sas.investigate.action.type\"\
