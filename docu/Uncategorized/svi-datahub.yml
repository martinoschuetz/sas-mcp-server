  /documents/bulk:
    post:
      summary: "Bulk create and update documents"
      operationId: "bulkUploadInternalDocuments"
      description: "Creates and updates internal documents in bulk. The input is a\
        \ list of document objects. Each document represents\neither a Create or Update\
        \ operation, depending on its form. The output is a list of operation summary\
        \ results.\n\nThe input for the request is a SAS collection, which looks like\
        \ the following:\n  ```json\n  {\n    \"items\":[...]\n  }\n  ```\nEach element\
        \ in \"items\" represents a series of records to be inserted or updated. If\
        \ a given record includes a primary\nkey, then it is treated as an update.\
        \ Otherwise, it is a Create operation. All locks, unlocks, creates,\nand updates\
        \ are processed internally by the server.\n\nThe response from the request\
        \ is another SAS collection with summary results for each item that was sent.\n\
        Result items are in the same order as the input collection. This is especially\
        \ important if you need\nto capture the newly generated primary keys of values\
        \ that were inserted. If there is a problem, there will\nbe an \"error\" property\
        \ in the results for the item that had issues. If some items return errors,\
        \ it does\nnot prevent other valid records from being successfully processed.\n"
      tags:
      - "Documents"
      parameters:
      - name: "Content-Item-Type"
        in: "header"
        description: "For document fields that use data masking, it is important to\
          \ avoid accidentally overwriting values in the database with masked values\
          \ that have been loaded by the client. In general, masking dots should not\
          \ be stored in the database. The \"Content-Item-Type\" HTTP header can be\
          \ used to control how masked fields are handled with bulk updates. If this\
          \  HTTP header is not provided, then masked field values that are set to\
          \ null will be ignored. If the \"Content-Item-Type\" header is set to \"\
          application/vnd.sas.investigation.data.masked.document+json\" then masked\
          \ fields that are set to  the mask template (nine dots) will be ignored.\
          \ The \"Content-Item-Type\" header value should match the data masking \
          \ approach that was used to fetch data before an update is performed.\n"
        required: false
        schema:
          type: "string"
          enum:
          - "application/vnd.sas.investigation.data.masked.document+json"
      requestBody:
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/sasCollection"
            example:
              $ref: "#/components/examples/bulkOperationExample/value"
      responses:
        "201":
          description: "Internal documents were created or updated. See items in the\
            \ collection to determine whether the operation for an individual document\
            \ succeeded or failed.\n"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/bulkOperationResultCollection"
              example:
                $ref: "#/components/examples/documentBulkOperationResultCollectionExample/value"
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/bulkOperationResultCollection"
              example:
                $ref: "#/components/examples/documentBulkOperationResultCollectionExample/value"
        "400":
          description: "The request was invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "415":
          description: "The endpoint does not support collection items of the type\
            \ specified in the `Content-Item-Type` request header.\n"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
  /documents/{rootEntityTypeName}/{rootDocumentId}/bulk:
    patch:
      summary: "Bulk patch multiple documents"
      operationId: "patchBulkDocuments"
      description: "Partially updates multiple documents in a single request. This\
        \ endpoint reduces the number of\nround trips required to update multiple\
        \ documents by allowing the client to send only the changed\nfields rather\
        \ than the full document content.\n\nThe root document, specified in the path,\
        \ serves as an organizational anchor for the patches.\nConceptually, it represents\
        \ the page the user is currently viewing. The root document is not\nrequired\
        \ to be related to the documents specified in the request body — any document\
        \ the user\nhas permission to modify can be patched.\n\nPatches are represented\
        \ as JSON Patch objects. For more information, see\n[jsonpatch.com](https://jsonpatch.com).\n\
        \nOnly update operations are supported. The following JSON Patch operations\
        \ are allowed:\n- `add`\n- `remove`\n- `replace`\n\nA document can only be\
        \ referenced once in the collection of bulk patch operations.\n\nTo manually\
        \ control document lock acquisition and release, use the `manuallyManageLocks`\n\
        query parameter.\n\nTo include the full updated document in the response,\
        \ use the `Accept-Item` header.\n"
      tags:
      - "Documents"
      parameters:
      - name: "rootEntityTypeName"
        in: "path"
        required: true
        description: "The entity type of the root document."
        schema:
          type: "string"
      - name: "rootDocumentId"
        in: "path"
        required: true
        description: "The ID of the root document."
        schema:
          type: "string"
      - name: "manuallyManageLocks"
        in: "query"
        required: false
        description: "Controls whether the client is responsible for acquiring and\
          \ releasing document locks.\n\nBy default (`false`), each document patch\
          \ automatically acquires a lock before updating the\ndocument and releases\
          \ the lock afterward.\n\nWhen set to `true`, the client is responsible for\
          \ acquiring and releasing document locks.\nIn this mode:\n- The update will\
          \ fail if the client has not acquired the lock before sending the PATCH\
          \ request.\n- The client is responsible for releasing the lock regardless\
          \ of whether the update succeeds or fails.\n- A document lock is always\
          \ required for a successful update. This requirement cannot be bypassed.\n\
          \nSetting `manuallyManageLocks` to `true` is useful when the client wants\
          \ to hold the lock across\na validation failure, preventing another user\
          \ from acquiring the lock while the current user\ncorrects errors.\n"
        schema:
          type: "boolean"
          default: false
      - name: "Content-Item-Type"
        in: "header"
        required: false
        description: "The media type of each item in the request body collection.\n"
        schema:
          type: "string"
          enum:
          - "application/vnd.sas.investigation.data.document.bulk.operation.patch"
          - "application/vnd.sas.investigation.data.document.bulk.operation.patch+json"
      - name: "Accept-Item"
        in: "header"
        required: false
        description: "Specifies the media type for items in the response collection.\n\
