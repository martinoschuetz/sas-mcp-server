  /links/bulk:
    post:
      summary: "Bulk Create and Update links"
      operationId: "bulkUpsertLinks"
      description: "Creates and Updates internal links in bulk. The input is a list\
        \ of link objects. Each link represents either a Create or Update operation,\
        \ depending on its form. The output is a list of operation summary results.\n\
        The input for the request is a SAS collection, which looks like the following:\n\
        \  ```json\n  {\n    \"items\":[...]\n  }\n  ```\nEach element in \"items\"\
        \ represents a series of records to be inserted or updated. If a specified\
        \ record includes a link id, then it is treated as an Update operation. Otherwise,\
        \ it is a Create operation. All Create and Update operations are processed\
        \ internally by the server.\nThe response from the request is another SAS\
        \ collection with summary results for each item that was sent. Result items\
        \ are in the same order as the input collection. If there is a problem, there\
        \ will be an \"error\" property in the results for the item that had issues.\
        \ If some items return errors, it does not prevent other valid records from\
        \ being successfully processed.\n"
      tags:
      - "Relationship Links"
      requestBody:
        content:
          application/vnd.sas.collection:
            schema:
              $ref: "#/components/schemas/sasCollection"
            example:
              $ref: "#/components/examples/linkBulkOperationExample/value"
      responses:
        "200":
          description: "Links were created or updated. See items in the collection\
            \ to determine whether the operation for an  individual link succeeded\
            \ or failed.\n"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/linkBulkOperationResultCollection"
              example:
                $ref: "#/components/examples/linkBulkOperationResultCollectionExample/value"
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/linkBulkOperationResultCollection"
              example:
                $ref: "#/components/examples/linkBulkOperationResultCollectionExample/value"
        "400":
          description: "The request was invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
  /links/count:
    get:
      summary: "Get a count of the number of links between an entity and its related\
        \ entities"
      operationId: "getCountLinks"
      description: "For a given entityTypeName and entityId, searches for all related\
        \ entities and returns a summary of the total  number of links found for each\
