        \ used in the Data Hub attachments request\nin the \"id\" and \"location\"\
        \ properties. The \"location\" property is the relative URI path to download\
        \ the document from the Files service. Obtain additional property values,\
        \ such as \"type\" and \"size\", from the response of the POST request to\
