  /documents/{objectTypeName}/{documentId}/actions:
    head:
      summary: "Get headers for summary of action history for a document"
      operationId: "headersForActionHistorySummaryDocument"
      description: "Retrieves headers for a summary of action history for a document.\
        \ Action history summaries contain a link to fetch the full representation.\n\
        The 'Accept-Item' request header can be used to fetch the available action\
        \ types for this document. If the 'Accept-Item' header is set to \"application/vnd.sas.investigate.action.type\"\
        , this endpoint returns a collection of action types. This collection represents\
        \ all of the action types that exist historically for the specified document,\
        \ providing an exhaustive list of all possible filter options.\n"
      tags:
      - "Documents"
      - "Action History"
      responses:
        "200":
          description: "The request succeeded.\n"
          headers: {}
        "400":
          description: "Action history was not available for the specified document.\n"
        "404":
          description: "The specified document was not found.\n"
      parameters:
      - name: "objectTypeName"
        in: "path"
        schema:
          type: "string"
        description: "The object type of the document.\n"
        required: true
      - name: "documentId"
        in: "path"
        schema:
          type: "string"
        description: "The ID of the document."
        required: true
      - name: "start"
        in: "query"
        schema:
          type: "integer"
          default: 0
        required: false
        description: "The start index. This is used for paging.\n"
      - name: "limit"
        in: "query"
        schema:
          type: "integer"
          default: 10
        required: false
        description: "The maximum number of items to return in a page of results.\n"
      - name: "sortBy"
        in: "query"
        schema:
          type: "string"
          default: "createdAt:descending"
        required: false
        description: "The sort criteria for the request. The only supported sort criteria\
          \ are 'createdAt' ascending and 'createdAt' descending.\n"
      - name: "actionType"
        in: "query"
        schema:
          type: "string"
        required: false
        description: "The filter criteria for the request. Basic selection filter\
          \ syntax for the 'actionType' field is supported. For example: '?actionType=DOCUMENT_EDIT|COMMENT_CREATE'\
          \ returns only DOCUMENT_EDIT or COMMENT_CREATE actions.\n"
      - in: "header"
        name: "Accept-Item"
        schema:
          type: "string"
        required: false
        description: "If set to 'application/vnd.sas.investigate.action.type', the\
          \ available action types are returned.\n"
