          description: "The request succeeded. A summary of all related links is returned."
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/countLinksResultCollection"
              example:
                $ref: "#/components/examples/countLinksResultCollectionExample/value"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/countLinksResultCollection"
              example:
                $ref: "#/components/examples/countLinksResultCollectionExample/value"
        "400":
          description: "The request was invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
