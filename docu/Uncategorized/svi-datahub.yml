      - "Action History"
      responses:
        "200":
          description: "The request succeeded.\n"
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/actionSummaryCollection"
                - $ref: "#/components/schemas/actionTypeCollection"
              example:
                $ref: "#/components/examples/relationshipLinkActionSummaryResourceCollectionExample/value"
            application/vnd.sas.collection:
              schema:
                allOf:
                - $ref: "#/components/schemas/actionSummaryCollection"
                - $ref: "#/components/schemas/actionTypeCollection"
              example:
                $ref: "#/components/examples/relationshipLinkActionSummaryResourceCollectionExample/value"
        "400":
          description: "Action history was not available for the specified link.\n"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "404":
