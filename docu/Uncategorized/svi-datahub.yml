  /admin/transactions/{transactionTypeId}/reconstruct:
    post:
      summary: "Trigger transaction type metadata reconstruction"
      description: "Synchronizes the transaction type's field metadata with the schema\
        \ for the database table that contains the transaction type's records. This\
        \ can be used to repair the transaction type's metadata if the table that\
        \ backs the transaction type changes. Care should be taken when using this\
        \ operation as it does not automatically update other services in SAS Visual\
        \ Investigator to reflect the metadata changes. Users who do not understand\
        \ how their metadata is used in SAS Visual Investigator or are not prepared\
        \ to repair inconsistencies downstream from Data Hub are not advised to use\
        \ this endpoint. The request body should be empty.\n"
      operationId: "reconstructTransaction"
      tags:
      - "Transaction Types"
      parameters:
      - name: "transactionTypeId"
        in: "path"
        required: true
        schema:
          type: "string"
        description: "The numerical ID of the transaction type object."
      requestBody:
        description: "The request body should be empty."
        content:
          application/json:
            schema: {}
            example: {}
      responses:
        "200":
          description: "The request succeeded."
          headers: {}
