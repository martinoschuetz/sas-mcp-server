            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
    post:
      summary: "Filter a collection of documents"
      operationId: "getFilteredDocumentCollection"
      description: "Filters a collection of documents by document ID or by using a\
        \ custom filter.\nThe type of filtering determines the media types to specify\
        \ in the Content-Type header.\nThis endpoint is a GET via POST. The need to\
        \ use POST for this endpoint is explained for each type of request.\n\nThe\
        \ client can specify the type of document returned in the Accept-Item header\
        \ for both types of requests.\nThe options are:\n<ul>\n  <li>application/vnd.sas.investigation.data.document+json</li>\n\
        \  <li>application/vnd.sas.investigation.data.enriched.document+json</li>\n\
        </ul>\n\nEnriched documents are the document plus sheets (i.e, workspaces)\
        \ and comments. A regular document does not\ninclude the enrichment data.\
        \ Getting enriched documents is potentially less efficient than getting a\
        \ document.\nYou should use \"application/vnd.sas.investigation.data.document\"\
        \ unless the enrichment data is required.\n\nSpecifying \"application/json\"\
        \ in a header indicates that the client would like to use the default media\
        \ type\nfor that header. The default media types for this endpoint are:\n\n\
        | HTTP Header  | Value in header  | Value interpreted by server          \
        \                               |\n|--------------|------------------|---------------------------------------------------------------------|\n\
        | Content-Type | application/json | application/vnd.sas.investigation.data.document.filter.request+json\
        \ |\n| Accept       | application/json | application/vnd.sas.collection+json\
        \                                 |\n| Accept-Item  | application/json | application/vnd.sas.investigation.data.enriched.document+json\
        \       |\n\nUsing the default value for the Content-Type header means that\
        \ the user is making a Document Filter request. \nDocument Filter requests\
        \ are requests for collections of documents that use a custom filter.\n\n\
        The default item type returned is an enriched document for legacy reasons.\n\
        \n\n**Custom filter (Document Filter Request)**\n\n\nFilter a collection of\
        \ documents given the type and a filter string. This is a GET via POST request.\
        \ The\nendpoint uses this design to keep the values used for filtering (the\
        \ value of the \"filter\" property) from\nbeing logged.\n\nThis request must\
        \ have the following header and value:\n\n| HTTP Header  | HTTP Header value\
        \                                                   |\n|--------------|---------------------------------------------------------------------|\n\
        | Content-Type | application/vnd.sas.investigation.data.document.filter.request+json\
        \ |\n\nThe body of the request will be a Document Filter Request. See the\
        \ Document Filter Request model for\nmore details.\n\nMicrosoft SQL Server\
        \ and Azure SQL Server have limitations on the number of parameters that can\
        \ be used\nwhen querying databases. When using this endpoint to filter documents\
        \ that are stored in an SQL Server data store,\nlarge and complex filter strings\
        \ that contain over 2000 parameters might fail. To circumvent this limitation,\n\
        split your filter expression into smaller expressions and make multiple requests\
        \ to this endpoint. Then, combine the\nresults as appropriate.\n\n**Filter\
        \ By ID (Document ID Request)**\n\n\nRequest specific documents by providing\
        \ an entity type name and an array of document ID values.  Use this request\n\
        when many documents by ID need to be requested.  There is a similar document\
        \ endpoint that accepts multiple\n\"id\" query parameters, but it is limited\
        \ by the maximum URI size allowed.  This request overcomes that limitation\n\
        by placing the list of IDs in the body of a POST request.\n\nDocument ID Requests\
        \ must have the following header and value:\n\n| HTTP Header  | HTTP Header\
        \ value                                                   |\n|--------------|---------------------------------------------------------------------|\n\
        | Content-Type | application/vnd.sas.investigation.data.document.id.request+json\
        \     |\n\nThe body of the request will be a Document ID Request. See the\
        \ Document ID Request model for\nmore details.\n\nFiltering child documents\
        \ is not supported.\n"
      tags:
      - "Documents"
      requestBody:
        description: "The parameters that are used for filtering, sorting, display\
          \ labels, and the inclusion of child documents. There are two types of requests\
          \ that can be made: request by ID or by using a custom filter. The default\
          \ is using a custom filter. See the description for this endpoint for more\
          \ details.\n"
        content:
          application/vnd.sas.investigation.data.document.filter.request:
            schema:
              $ref: "#/components/schemas/documentFilterRequest"
            example:
              $ref: "#/components/examples/documentFilterRequestExample/value"
          application/vnd.sas.investigation.data.document.id.request:
            schema:
              $ref: "#/components/schemas/documentIdRequest"
            example:
              $ref: "#/components/examples/documentIdRequestExample/value"
      parameters:
      - name: "entityTypeName"
        in: "path"
        schema:
          type: "string"
        description: "The name of the entity type to which the document collection\
          \ belongs. <em>Child entity types are not supported.</em>"
        required: true
      - in: "header"
        name: "Accept-Item"
        schema:
          type: "string"
          enum:
          - "application/json"
          - "application/vnd.sas.investigation.data.enriched.document"
          - "application/vnd.sas.investigation.data.enriched.document+json"
          - "application/vnd.sas.investigation.data.masked.enriched.document"
          - "application/vnd.sas.investigation.data.masked.enriched.document+json"
          - "application/vnd.sas.investigation.data.document"
          - "application/vnd.sas.investigation.data.document+json"
          - "application/vnd.sas.investigation.data.masked.document"
          - "application/vnd.sas.investigation.data.masked.document+json"
        required: false
        description: "When making a request to filter documents, specifies the media\
          \ type of the items returned."
      responses:
        "200":
          description: "The request succeeded.\n"
          headers: {}
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/enrichedDocumentCollection"
                - $ref: "#/components/schemas/plainDocumentCollection"
                - $ref: "#/components/schemas/maskedEnrichedDocumentCollection"
                - $ref: "#/components/schemas/maskedDocumentCollection"
              examples:
                enrichedDocumentResourceCollection:
                  $ref: "#/components/examples/enrichedDocumentResourceCollectionExample"
                documentResourceCollection:
                  $ref: "#/components/examples/plainDocumentResourceCollectionExample"
                maskedEnrichedDocumentCollection:
                  $ref: "#/components/examples/maskedEnrichedDocumentResourceCollectionExample"
                maskedDocumentCollection:
                  $ref: "#/components/examples/maskedDocumentResourceCollectionExample"
            application/vnd.sas.collection:
              schema:
                anyOf:
                - $ref: "#/components/schemas/enrichedDocumentCollection"
                - $ref: "#/components/schemas/plainDocumentCollection"
                - $ref: "#/components/schemas/maskedEnrichedDocumentCollection"
                - $ref: "#/components/schemas/maskedDocumentCollection"
              examples:
                enrichedDocumentResourceCollection:
                  $ref: "#/components/examples/enrichedDocumentResourceCollectionExample"
                documentResourceCollection:
                  $ref: "#/components/examples/plainDocumentResourceCollectionExample"
                maskedEnrichedDocumentCollection:
