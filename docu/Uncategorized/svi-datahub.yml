  /documents/{entityTypeName}/{documentId}/{relationshipTypeName}:
    head:
      summary: "Get headers for other documents related to an individual document"
      operationId: "headersForRelatedDocuments"
      description: "For a given document and relationship type name, finds all the\
        \ documents that are related to the given document according to the\ngiven\
        \ relationship type.\n\nSince the child documents of a top-level document\
        \ are related to it by a special relationship type, this endpoint can be used\n\
        to fetch children of a document. In this case, the name of the relationship\
        \ type is identical to the child entity type, so use\nthe child entity type\
        \ name as the `relationshipTypeName` path parameter.\n\nThe related documents\
        \ can be filtered by a date range using the date and time fields on the entity\
        \ type of the related document.\n\nIt is important to clarify that there are\
        \ two entity types to consider:\nthe entity type that is specified in the\
        \ path and the related entity type that is returned. Distinguishing between\
        \ the\ntwo is important when filtering by a date range.\n\nFor example, assume\
        \ there is a relationship type defined between an entity type named \"entityTypeA\"\
        \ and another\nentity type named \"entityTypeB\" that is called \"fromAToB\"\
        . For the request GET\n/documents/entityTypeA/{documentId}/fromAtoB, \"entityTypeB\"\
        \ is the related entity type and a collection of\n\"entityTypeB\" documents\
        \ are returned.\n\nThe number of related documents can be filtered by fields\
        \ on the related entity type using a combination of the\n\"earliestValidFrom\"\
        , \"latestValidFrom\", \"earliestValidTo\", \"latestValidTo\", \"dateFieldName\"\
        , \"earliestDate\", and\n\"latestDate\" parameters. Each of these parameters\
        \ refer to a Date, Timestamp, or Timestamp With Time Zone field\non the related\
        \ entity type.\n\nWhen using the \"earliestValidFrom\" and \"latestValidFrom\"\
        \ parameters, the results are filtered by the field\nname that is specified\
        \ in the \"validFromFieldName\" property in the related entity type.\n\nWhen\
        \ using the \"earliestValidTo\" and \"latestValidTo\" parameters, the results\
        \ are filtered by the field name that is \nspecified in the \"validToFieldName\"\
        \ property in the related entity type.\n\nThe \"dateFieldName\" parameter\
        \ is used to specify an arbitrary Date, Timestamp, or Timestamp With Time\
        \ Zone field\nname on the related entity type. When specified, include \"\
        earliestDate\", \"latestDate\", or both\nparameters.\n"
      tags:
      - "Documents"
      parameters:
      - name: "Accept-Item"
        in: "header"
        schema:
          type: "string"
          enum:
          - "application/json"
          - "application/vnd.sas.investigation.data.document"
          - "application/vnd.sas.investigation.data.document+json"
          - "application/vnd.sas.investigation.data.masked.document"
          - "application/vnd.sas.investigation.data.masked.document+json"
          - "application/vnd.sas.investigation.data.minimally.masked.document"
          - "application/vnd.sas.investigation.data.minimally.masked.document+json"
        description: "The media type that the client accepts for items within the\
          \ response collection."
        required: false
      - name: "entityTypeName"
        in: "path"
        schema:
          type: "string"
        description: "The name of the entity type to which the document belongs."
        required: true
      - name: "documentId"
        in: "path"
        schema:
          type: "string"
        description: "The ID for the document."
        required: true
      - name: "relationshipTypeName"
        in: "path"
        schema:
          type: "string"
        description: "The name of a relationship type that is associated with the\
          \ entity type name defined in the parameter \"entityTypeName\".\n"
        required: true
      - name: "start"
        in: "query"
        schema:
          type: "integer"
          default: 0
        description: "The starting index of the first document in a page."
      - name: "limit"
        in: "query"
        schema:
          type: "integer"
          default: 40
        description: "The maximum number of documents to return in this page of results.\
          \ The actual number of returned documents is fewer if the collection is\
          \ exhausted.\n"
      - name: "earliestValidFrom"
        in: "query"
        schema:
          type: "string"
          format: "date-time"
        description: "The earliest value that is allowed for the related entity's\
          \ \"Valid From\" date or timestamp field. If the \"Valid From\" field is\
          \ a Date field, a date value with no timestamp is allowed. Otherwise, use\
          \ an ISO-8601 timestamp value. By default, the field configured as the \"\
          validFromField\" in the document's entity type is used for filtering. If\
          \ the query parameter \"dateFieldName\" is provided, the field that is specified\
          \ there overrides the entity type's configuration, and that field is used\
          \ instead.\n"
      - name: "earliestValidTo"
        in: "query"
        schema:
          type: "string"
          format: "date-time"
        description: "The earliest value that is allowed for the related document's\
          \ \"Valid To\" date or timestamp field. If the \"Valid To\" field is a Date\
          \ field, a date value with no timestamp is allowed. Otherwise, use an ISO-8601\
          \ timestamp value. By default, the field configured as the \"validToField\"\
          \ in the document's entity type is used for filtering. If the query parameter\
          \ \"dateFieldName\" is provided, the field that is specified there overrides\
          \ the entity type's configuration, and that field is used instead.\n"
      - name: "latestValidFrom"
        in: "query"
        schema:
          type: "string"
          format: "date-time"
        description: "The latest value that is allowed for the related document's\
          \ \"Valid From\" date or timestamp field. If the \"Valid From\" field is\
          \ a Date field, a date value with no timestamp is allowed. Otherwise, use\
          \ an ISO-8601 timestamp value. By default, the field configured as the \"\
          validFromField\" in the document's entity type is used for filtering. If\
          \ the query parameter \"dateFieldName\" is provided, the field that is specified\
          \ there overrides the entity type's configuration, and that field is used\
          \ instead.\n"
      - name: "latestValidTo"
        in: "query"
        schema:
          type: "string"
          format: "date-time"
        description: "The latest value that is allowed for the related document's\
          \ \"Valid To\" date or timestamp field. If the \"Valid To\" field is a Date\
          \ field, a date value with no timestamp is allowed. Otherwise, use an ISO-8601\
          \ timestamp value. By default, the field configured as the \"validToField\"\
          \ in the document's entity type is used for filtering. If the query parameter\
          \ \"dateFieldName\" is provided, the field that is specified there overrides\
