            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
    get:
      summary: "Get a list of links or an individual link based on specific query\
        \ parameters"
      operationId: "getRelationshipLinkOrLinks"
      description: "Retrieves either a list of links that are associated with a document\
        \ or an individual link.  The type of request is determined by the included\
        \ query parameters.  Do not mix the query parameters for both types of requests.\n\
        <ul> <li>To fetch a list of all links that originate from a specific document,\
        \ use these query parameters:\n  <ul>\n    <li>_relationshipName</li>\n  \
        \  <li>_fromEntityTypeName</li>\n    <li>_entityId</li>\n    <li>_entityTypeName</li>\n\
        \    <li>_includeEntityLabels</li>\n  </ul> </br>\n\n<li>To fetch an individual\
        \ link between two documents, use these query parameters:\n  <ul>\n    <li>relationshipName</li>\n\
        \    <li>fromEntityTypeName</li>\n    <li>fromEntityId</li>\n    <li>toEntityTypeName</li>\n\
        \    <li>toEntityId</li>\n    <li>includeEntityLabels</li>\n  </ul>\n</ul>\n"
      tags:
      - "Relationship Links"
      parameters:
      - in: "query"
        name: "_relationshipName"
        description: "The name of the relationship type upon which the link is based."
        schema:
          type: "string"
      - in: "query"
        name: "_fromEntityTypeName"
        description: "The entity type of the starting point of the link."
        schema:
          type: "string"
      - in: "query"
        name: "_entityId"
        description: "The unique identifier for the entity that is the starting point\
          \ of the link."
        schema:
          type: "string"
      - in: "query"
        name: "_entityTypeName"
        description: "The same value as _fromEntityTypeName. (This is required for\
          \ legacy reasons.)"
        schema:
          type: "string"
      - in: "query"
        name: "_includeEntityLabels"
        description: "Compute and include display labels for both to and from documents."
        schema:
          type: "boolean"
          default: false
      - in: "query"
        name: "relationshipName"
        description: "The name of the relationship type upon which the link is based."
        schema:
          type: "string"
      - in: "query"
        name: "fromEntityTypeName"
        description: "The entity type of the starting point of the link."
        schema:
          type: "string"
      - in: "query"
        name: "fromEntityId"
        description: "The unique identifier for the entity that is the starting point\
          \ of the link."
        schema:
          type: "string"
      - in: "query"
        name: "toEntityTypeName"
        description: "The entity type of the destination point of the link."
        schema:
          type: "string"
      - in: "query"
        name: "toEntityId"
        description: "The unique identifier for the entity that is the destination\
          \ point of the link."
        schema:
          type: "string"
      - in: "query"
        name: "includeEntityLabels"
        description: "Compute and include display labels for both the \"to\" document\
          \ and the \"from\" document."
        schema:
          type: "boolean"
          default: false
      - in: "header"
        name: "Accept-Item"
        schema:
          type: "string"
          enum:
          - "application/json"
          - "application/vnd.sas.investigation.data.masked.relationshiplink"
          - "application/vnd.sas.investigation.data.masked.relationshiplink+json"
          - "application/vnd.sas.investigation.data.minimally.masked.relationshiplink"
          - "application/vnd.sas.investigation.data.minimally.masked.relationshiplink+json"
        required: false
        description: "The media type that the client accepts for items within the\
          \ response collection. This value is ignored when this operation is fetching\
          \ a single relationship link.\n"
      responses:
        "200":
          description: "The request succeeded. The response is either an individual\
            \ link or a Resource Collection of links.\n"
          headers:
            ETag:
              description: "The ETag for the current version of the resource."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/relationshipLink"
                - $ref: "#/components/schemas/relationshipLinkCollection"
                - $ref: "#/components/schemas/maskedRelationshipLinkCollection"
                - $ref: "#/components/schemas/minimallyMaskedRelationshipLinkCollection"
              examples:
                relationshipLinkExample:
                  $ref: "#/components/examples/relationshipLinkExample"
                relationshipLinkCollectionExample:
                  $ref: "#/components/examples/relationshipLinkResourceCollectionExample"
                maskedRelationshipLinkCollectionExample:
                  $ref: "#/components/examples/maskedRelationshipLinkResourceCollectionExample"
            application/vnd.sas.collection:
              schema:
                anyOf:
                - $ref: "#/components/schemas/relationshipLinkCollection"
                - $ref: "#/components/schemas/maskedRelationshipLinkCollection"
                - $ref: "#/components/schemas/minimallyMaskedRelationshipLinkCollection"
              examples:
                relationshipLinkCollectionExample:
                  $ref: "#/components/examples/relationshipLinkResourceCollectionExample"
                maskedRelationshipLinkCollectionExample:
                  $ref: "#/components/examples/maskedRelationshipLinkResourceCollectionExample"
        "404":
          description: "Unable to find a link or links based on the values that are\
            \ provided in the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "415":
          description: "The endpoint cannot produce collection items of the type specified\
