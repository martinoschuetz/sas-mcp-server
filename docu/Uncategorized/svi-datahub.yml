          \ returns the operation\n  result without the updated document, producing\
          \ a smaller response payload.\n- `application/vnd.sas.investigation.data.document.enriched.bulk.operation.result`\
          \ returns the\n  operation result with the fully enriched document, including\
          \ child documents. Masked fields are\n  represented as nine dots. This is\
          \ useful for avoiding additional GET requests after updates are\n  complete.\n"
