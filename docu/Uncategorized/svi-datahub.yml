  /admin/storedObjects:
    get:
      summary: "Get an entity type object by name"
      description: "Retrieves an entity type by name. An entity type is the metadata\
        \ that is associated with documents.\n\nThe client can request a representation\
        \ that contains additional metadata from this endpoint by\nspecifying one\
        \ of the following media types in the Accept header.\n\n| Value in Accept\
        \ header                                                  | Additional data\
        \ in representation                                                      \
        \                                                                        |\n\
        |-------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
        | application/json                                                       \
        \ | No additional data beyond the default Entity Type representation.    \
        \                                                                        \
        \                  |\n| application/vnd.sas.investigation.meta.entity.type.admin+json;version=2\
        \ | The default Entity Type representation, plus additional File Category\
        \ metadata<sup>1</sup>.                                                  \
        \              |\n| application/vnd.sas.investigation.meta.entity.type.admin.audit+json\
        \     | The default Entity Type representation, plus additional File Category\
        \ metadata<sup>1</sup>, plus metadata for audit object virtual fields<sup>2</sup>.\
        \ |\n\n<sup>1</sup> Additional File Category metadata includes, for each File\
        \ Category in the Entity Type metadata,\nwhether files exist under that File\
        \ Category, and a collection of Templates that reference that File\nCategory.\n\
        \n<sup>2</sup> Audit object virtual fields expose the values in \"Created\
        \ By User\" fields and \"Last Updated By User\"\nfields as serialized JSON\
        \ objects that can be consumed by User/Group Selection controls. An Entity\
        \ Type without\na \"Created By User\" field (that is, a field that has a name\
        \ similar to \"created_by_user\") will not have an\naudit object virtual field\
        \ for \"Created By User.\" Likewise, an Entity Type without a \"Last Updated\
        \ By User\" field\n(as defined by the field's role) will not have a \"Last\
        \ Updated By User\" audit object virtual field.\n"
      operationId: "getStoredObjectByName"
      tags:
      - "Entity Types"
      parameters:
      - name: "name"
        in: "query"
        schema:
          type: "string"
        description: "The name of an entity type object."
      - name: "excludeUnauthorized"
        in: "query"
        schema:
          type: "boolean"
          default: false
        description: "Specifies whether to exclude the results that the user is not\
          \ authorized to view.  Only admin users can set this to true.\n"
      responses:
        "200":
          description: "The request succeeded."
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/entityType"
              example:
                $ref: "#/components/examples/entityTypeExample/value"
        "404":
          description: "The request did not find an entity type with a matching name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
    delete:
      summary: "Delete an entity type object by name"
      description: "Deletes an entity type by name. An entity type is the metadata\
        \ that is associated with documents.\n"
      operationId: "deleteStoredObjectByName"
      tags:
      - "Entity Types"
      parameters:
      - name: "name"
        in: "query"
        schema:
          type: "string"
        description: "The name of an entity type object."
        required: true
      responses:
        "204":
          description: "The request succeeded."
          headers: {}
        "404":
          description: "The request did not find an entity type with a matching name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
