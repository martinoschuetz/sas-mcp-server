              schema:
                $ref: "#/components/schemas/entityLevelRules"
              examples:
                entityRules:
                  $ref: "#/components/examples/entityLevelRules"
        "400":
          description: "Bad Request."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/sasError"
              examples:
                Malformed Request:
                  $ref: "#/components/examples/Request-Invalid-Body"
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              examples:
                Malformed Request:
                  $ref: "#/components/examples/Request-Invalid-Body"
        "403":
