  parameters:
    relationshipLinkDelimitedId:
      in: "query"
      name: "_id"
      schema:
        type: "string"
      required: true
      description: "The ID for an individual link. A link ID uses the following format:\n\
        `${relationshipName}|_|${fromEntityTypeName}|_|${toEntityTypeName}|_|${fromEntityId}|_|${toEntityId}`\n\
        where `|_|` is the delimiter between link ID components.\n\nLink ID component\
        \ details:\n* `relationshipName` - The relationship type name that defines\
        \ the link.\n* `fromEntityTypeName` - The entity type name of the starting\
        \ point for the link.\n* `fromEntityId` - The unique identifier of the entity\
        \ that is the starting point for the link.\n* `toEntityTypeName` - The entity\
        \ type name of the destination point for the link.\n* `toEntityId` - The unique\
        \ identifier of the entity that is the destination point for the link.\n\n\
        When submitting the request, the pipe character (`|`) must be percent-encoded\
        \ as `%7C`. See below for\nan example of the pipe character properly encoded:\
        \ \n`${relationshipName}%7C_%7C${fromEntityTypeName}%7C_%7C${toEntityTypeName}%7C_%7C${fromEntityId}%7C_%7C${toEntityId}`\
        \ \n"
paths:
  /admin/relationships:
    get:
      summary: "Get a single relationship type or an array of relationship types"
      operationId: "getRelationshipTypes"
      description: "Depending on the query parameter used, returns either a single\
        \ relationship by qualified name or all relationships of a given type.  Using\
        \ both query parameters in a single request is not supported.\nUse the \"\
        qualifiedName\" parameter when the looking up an individual relationship by\
        \ its qualified name.  The qualified name can be determined from the \"qualifiedName\"\
        \ property in the relationship type or by constructing one.\nUse the \"type\"\
        \ parameter when looking up all relationships of a given type.\n"
      tags:
      - "Relationship Types"
      parameters:
      - name: "type"
        in: "query"
        schema:
          type: "string"
          enum:
          - "DIRECT_CHILD"
          - "LINK"
        description: "Specifies the type of the relationships for which to search.\
          \ LINK relationships are all relationships that link one Entity Type to\
          \ one or many other Entity Types. DIRECT_CHILD relationships are a relationship\
          \ between a parent Entity Type and a child Entity Type.\n"
        required: false
      - name: "qualifiedName"
        in: "query"
        schema:
          type: "string"
        description: "The qualified name that uniquely identifies the relationship\
          \ type. The components of a qualified name are:\n{\"from\" Entity Type name}\
          \ + \"__\" + {Relationship Type name}\n"
        required: false
      responses:
        "200":
          description: "The request succeeded. Either a single relationship type or\
            \ an array of relationship types are returned.\n"
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/relationshipType"
              example:
                $ref: "#/components/examples/relationshipTypeExample/value"
        "404":
          description: "The relationship type specified in qualifiedName was not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
  /admin/relationships/{relationshipTypeId}/reconstruct:
    post:
      summary: "Trigger relationship type metadata reconstruction"
      description: "Synchronizes the relationship type's field metadata with the schema\
        \ for the database table that contains the relationship type's records. This\
        \ can be used to repair the relationship type's metadata if the table that\
        \ backs the relationship type changes. Care should be taken when using this\
        \ operation as it does not automatically update other services in SAS Visual\
        \ Investigator to reflect the metadata changes. Users who do not understand\
        \ how their metadata is used in SAS Visual Investigator or are not prepared\
        \ to repair inconsistencies downstream from Data Hub are not advised to use\
        \ this endpoint. The request body should be empty.\n"
      operationId: "reconstructRelationship"
      tags:
      - "Relationship Types"
      parameters:
      - name: "relationshipTypeId"
        in: "path"
        required: true
        schema:
          type: "string"
        description: "The numerical ID of the relationship type object."
      requestBody:
        description: "Request body should be empty."
        content:
          application/json:
            schema: {}
            example: {}
      responses:
        "200":
          description: "The request succeeded."
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/relationshipType"
              example:
                $ref: "#/components/examples/relationshipTypeExample/value"
        "400":
          description: "The request was invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "404":
          description: "The request did not find a relationship type with a matching\
            \ ID or the relationship type was found but the table backing it was not\
            \ found.\n"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
  /locks/documents:
    post:
      summary: "Lock a document for editing and deletion"
      operationId: "createDocumentLock"
      description: "Places a lock on a document prior to modifying or deleting the\
        \ document. If another user has a lock on the object, the request fails. Be\
        \ sure to delete the lock after editing the document.  A document lock times\
        \ out after two hours or when the session ends; whichever occurs first.\n"
      tags:
      - "Documents"
      parameters:
      - in: "query"
        name: "type"
        required: true
        description: "The entity type name of the document."
        schema:
          type: "string"
      - in: "query"
        name: "id"
        required: true
        description: "The ID of the document."
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema: {}
            example: {}
      responses:
        "201":
          description: "A lock was placed on the document.  There is no body in the\
            \ response.\n"
          headers: {}
          content:
            application/json:
              schema: {}
              example: {}
        "400":
          description: "The request was invalid.\n"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "404":
          description: "The document was not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "409":
          description: "Unable to place a lock on the document because another user\
            \ has already locked it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
    delete:
      summary: "Release a document lock"
      operationId: "deleteDocumentLock"
      description: "Releases a document lock. A document lock times out after two\
        \ hours or when the session ends; whichever occurs first.\n"
      tags:
      - "Documents"
      parameters:
      - in: "query"
        name: "type"
        required: true
        description: "The entity type name of the document."
        schema:
          type: "string"
      - in: "query"
        name: "id"
        required: true
        description: "The ID of the document."
        schema:
          type: "string"
      responses:
        "204":
          description: "The lock was released. If there was no lock, a 204 is still\
            \ returned."
    get:
      summary: "Query document lock for user"
      operationId: "getIsDocumentLocked"
      description: "Determines whether the user has a lock on a document."
      tags:
      - "Documents"
      parameters:
      - in: "query"
        name: "type"
        required: true
        description: "The entity type name of the document."
        schema:
          type: "string"
      - in: "query"
        name: "id"
        required: true
        description: "The ID of the document."
        schema:
          type: "string"
      responses:
        "200":
          description: "The request succeeded. The response is a Boolean value that\
            \ indicates whether the user has a lock on the document.\n"
          headers: {}
          content:
            application/json:
              schema:
                type: "boolean"
              example: true
        "404":
          description: "The document was not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
  /links:
    post:
      summary: "Create a new relationship link between two documents"
      operationId: "createNewInternalRelationshipLink"
      description: "Creates a new relationship link between two documents. A link\
        \ is an instance of a relationship type. A relationship type that describes\
        \ the link must already exist. The relationship type must have an internal\
        \ bridge table to create links.\n"
      tags:
      - "Relationship Links"
      parameters:
      - in: "query"
        name: "includeEntityLabels"
        description: "Compute and include display labels for both to and from documents\
          \ in the response."
        schema:
          type: "boolean"
          default: false
        required: true
      requestBody:
        description: "An object that represents the link."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/relationshipLink"
            example:
              $ref: "#/components/examples/relationshipLinkExample/value"
      responses:
        "201":
          description: "A new relationship link between two documents was created.\n"
          headers:
            ETag:
              description: "The ETag for the current version of the resource."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/relationshipLink"
              example:
                $ref: "#/components/examples/relationshipLinkExample/value"
