        \ about the data store is not included in the response.\nThis endpoint requires\
        \ the \"svi.administration.datastore_credentials\" capability. Be careful\
        \ about who is given this capability.  This endpoint is designed to be used\
        \ by other SAS services that need the data store credentials.\n"
      tags:
