          - "application/vnd.sas.investigation.data.enriched.document+json"
          - "application/vnd.sas.investigation.data.masked.enriched.document"
          - "application/vnd.sas.investigation.data.masked.enriched.document+json"
          - "application/vnd.sas.investigation.data.minimally.masked.enriched.document"
          - "application/vnd.sas.investigation.data.minimally.masked.enriched.document+json"
        description: "The media type that the client accepts for items within the\
          \ response collection."
        required: false
      - name: "entityTypeName"
        in: "path"
        schema:
          type: "string"
        description: "The name of the entity type to which the document belongs. <em>Child\
          \ entity types are not supported.</em>"
        required: true
      - name: "start"
        in: "query"
        schema:
          type: "integer"
          default: 0
        description: "The starting index of the first document in a page."
      - name: "limit"
        in: "query"
        schema:
          type: "integer"
          default: 40
        description: "The maximum number of documents to return in this page of results.\
          \ The actual number of returned documents is fewer if the collection is\
          \ exhausted.\n"
      - in: "query"
        name: "depth"
        description: "The depth of child documents to return.  The value can be either:\
          \ <ul>\n  <li>'0' - No child documents are included in each document</li>\n\
          \  <li>'1' - Child documents are included in each document if they exist\
          \ for that document</li>\n</ul>\n"
