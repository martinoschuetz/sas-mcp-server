  /documents/{objectTypeName}/{documentId}/fields:
    head:
      summary: "Get headers for field values for document"
      operationId: "headersForFieldValues"
      description: "Retrieves headers for a representation of multiple fields values\
        \ for a top-level document. Since the GET operation for this endpoint does\
        \ not produce an error if the user is not authorized to reveal the value of\
        \ a masked field, this HEAD operation does not either.\n"
      tags:
      - "Documents"
      parameters:
      - name: "objectTypeName"
        in: "path"
        schema:
          type: "string"
        description: "The object type of the document."
        required: true
      - name: "documentId"
        in: "path"
        schema:
          type: "string"
        description: "The ID of the document."
        required: true
      - name: "fieldName"
        in: "query"
        explode: true
        schema:
          type: "array"
          items:
            type: "string"
        description: "The names of the fields."
        required: true
      responses:
        "200":
          description: "The request succeeded."
          headers: {}
        "404":
          description: "The document or field was not found."
    get:
      summary: "Get field values for document"
      operationId: "getDocumentFieldValues"
      description: "Retrieves a representation of multiple fields values for a top-level\
        \ document. If any of the fields is configured for masking, and if the requesting\
        \ user is authorized to reveal the value of the masked field, the raw unmasked\
        \ value of the field is returned. If any of the fields are configured for\
        \ masking and the requesting user is not authorized to reveal the value of\
        \ the masked field, the value will be omitted from the response.\n"
      tags:
      - "Documents"
      parameters:
      - name: "objectTypeName"
        in: "path"
        schema:
          type: "string"
        description: "The object type of the document."
        required: true
      - name: "documentId"
        in: "path"
        schema:
          type: "string"
        description: "The ID of the document."
        required: true
      - name: "fieldName"
        in: "query"
        explode: true
        schema:
          type: "array"
          items:
            type: "string"
        description: "The names of the fields."
        required: true
      responses:
        "200":
          description: "The request succeeded."
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fieldValueCollection"
              example:
                $ref: "#/components/examples/fieldValueCollectionExample/value"
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/fieldValueCollection"
              example:
                $ref: "#/components/examples/fieldValueCollectionExample/value"
        "404":
          description: "The document or field was not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
