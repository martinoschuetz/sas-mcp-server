            application/json:
              schema:
                $ref: "#/components/schemas/dataStore"
              example:
                $ref: "#/components/examples/dataStoreExample/value"
        "400":
          description: "The request was invalid. The error message should clarify\
            \ the issue. Possible reasons include: - The data store credentials are\
            \ null in the request body's data store definition. - The data store handle\
