      operationId: "getFileAssociatedWithChildObject"
      description: "Downloads the file with the specified ID from the child object\
        \ that is specified in the path.\n"
      tags:
      - "Files"
      parameters:
      - name: "objectTypeName"
        in: "path"
        schema:
          type: "string"
        description: "The name of the parent object type to which the parent object\
          \ belongs."
        required: true
      - name: "objectId"
        in: "path"
        schema:
          type: "string"
        description: "The ID of the parent object."
        required: true
      - name: "childDocType"
        in: "path"
