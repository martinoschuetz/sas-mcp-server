      operationId: "createNewInternalDocument"
      description: "Creates a new internal document. If child documents are included\
        \ in the request body, new child documents are also created.\n"
      tags:
      - "Documents"
      parameters:
      - name: "_operation"
        in: "query"
        schema:
          type: "string"
          enum:
          - "CREATE_AND_LINK"
        description: "When this query parameter is set to `CREATE_AND_LINK`, the request\
          \ body contains both an enriched document and a link. Both the enriched\
          \ document and the link are created in one operation. In this case, the\
          \ client can set the `Accept` header of this request to `application/vnd.sas.investigation.data.masked.enriched.document.and.link+json`.\
          \ If it does, any masked data in the response will be replaced with dots.\
          \ Otherwise, masked data in the response is omitted.\n"
      requestBody:
        description: "The document to be created."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/enrichedDocument"
            example:
              $ref: "#/components/examples/enrichedDocumentExample/value"
          application/vnd.sas.investigation.data.enriched.document:
            schema:
              $ref: "#/components/schemas/enrichedDocument"
            example:
              $ref: "#/components/examples/enrichedDocumentExample/value"
      responses:
        "201":
          description: "The internal document was created.\n"
          headers:
            Location:
              description: "The URI of the newly created document."
              schema:
                type: "string"
          content:
