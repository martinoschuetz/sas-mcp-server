  /links/@item/fields:
    head:
      summary: "Get headers for field values for a relationship link"
      operationId: "headersForRelationshipLinkFieldValues"
      description: "Retrieves headers for a representation of multiple field values\
        \ for a relationship link. Since the GET operation for this endpoint does\
        \ not produce an error if the user is not authorized to reveal the value of\
        \ a masked field, this HEAD operation does not either.\n"
      tags:
      - "Relationship Links"
      parameters:
      - $ref: "#/components/parameters/relationshipLinkDelimitedId"
      - name: "fieldName"
        in: "query"
        explode: true
        schema:
          type: "array"
          items:
            type: "string"
        description: "The names of the fields."
        required: true
      responses:
        "200":
          description: "The request succeeded."
          headers: {}
        "404":
          description: "The relationship link or field was not found."
    get:
      summary: "Get field values for a relationship link"
      operationId: "getRelationshipLinkFieldValues"
      description: "Retrieves a representation of multiple field values for a relationship\
        \ link. If any of the fields is configured for masking, and if the requesting\
        \ user is authorized to reveal the value of the masked field, the raw unmasked\
        \ value of the field is returned. If any of the fields are configured for\
        \ masking and the requesting user is not authorized to reveal the value of\
        \ the masked field, the value will be omitted from the response.\n"
      tags:
      - "Relationship Links"
      parameters:
      - $ref: "#/components/parameters/relationshipLinkDelimitedId"
      - name: "fieldName"
        in: "query"
        explode: true
        schema:
          type: "array"
          items:
            type: "string"
        description: "The names of the fields."
        required: true
      responses:
        "200":
          description: "The request succeeded."
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fieldValueCollection"
              example:
                $ref: "#/components/examples/fieldValueCollectionExample/value"
            application/vnd.sas.collection:
