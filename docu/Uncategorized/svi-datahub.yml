---
openapi: "3.0.3"
info:
  version: "11"
  title: "Data Hub"
  description: "The Data Hub API provides access to information that is managed by\
    \ SAS Visual Investigator. This API facilitates describing data that resides in\
    \ either internal writable databases or external customer-controlled read-only\
    \ databases. Once the data definitions are provided as entity types, the data\
    \ becomes accessible within SAS Visual Investigator. This API also provides mechanisms\
    \ for fetching individual entity records that were defined by the entity type\
    \ definitions. <br/> <br/>\n"
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
  license:
    name: "SAS Institute Inc."
tags:
- name: "Async Jobs"
  description: "End point to create asynchronous jobs."
- name: "Data Stores"
  description: "Contains the operations related to data store configurations."
- name: "Documents"
  description: "Contains the operations related to documents."
- name: "Relationship Links"
  description: "Contains the operations related to relationship links."
- name: "Entity Types"
  description: "Contains the operations related to managing entity type metadata."
- name: "Reference Lists"
  description: "Contains the operations related to managing reference list metadata."
- name: "Relationship Types"
  description: "Contains the operations related to managing relationship type metadata."
- name: "Solutions"
  description: "Contains the operations related to managing solution metadata."
- name: "Transaction Types"
  description: "Contains the operations related to managing transaction type metadata."
- name: "Attachments"
  description: "Contains the operations related to attachments."
- name: "Action History"
  description: "Contains the operations related to action history."
- name: "Version History"
  description: "Contains the operations related to version history."
- name: "Administration"
  description: "Contains the operations related to administering the service."
- name: "Comments"
  description: "Contains the operations related to comments."
- name: "Files"
  description: "Contains the operations related to files."
- name: "Sheets"
  description: "Contains the operations related to sheets."
- name: "Icons"
  description: "Contains the operations related to icons."
- name: "Conditions"
  description: "Contains the operations related to conditions."
- name: "EntityLevelSecurity"
  x-sas-internal: true
  description: "Contains the operations related to entity-level security."
servers:
- url: "https://example.com/svi-datahub"
  description: "The Data Hub service serves all requests at this URL.\n"
components:
  schemas:
    sortableNameReference:
      title: "Sortable Name Reference"
      description: "A name (typically a field name) with an ordinal that indicates\
        \ its position in a sequence."
      properties:
        name:
          type: "string"
          description: "The name of the reference."
        displayIndex:
          type: "integer"
          description: "The ordinal for the name. This is typically a field name."
    referenceList:
      title: "Reference List"
      description: "Represents a list of choices that the user can select as the value\
        \ for a field. Common examples might include \"Size\" (small, medium, large)\
        \ or \"Color\" (red, green, blue). In the first example, \"Size\" is the list\
        \ and (small, medium, large) are items of that list.\n"
      allOf:
      - $ref: "#/components/schemas/localizableObject"
      - type: "object"
        properties:
          name:
            type: "string"
            description: "The name of the reference list. The name is limited to 50\
              \ characters."
          archived:
            type: "boolean"
            description: "Indicates whether the reference list is archived."
          maxCodeLength:
            type: "integer"
            description: "The maximum length of the string that is used as the code\
              \ for list items."
          alphabeticalSort:
            type: "boolean"
            description: "Indicates whether the reference list is sorted alphabetically."
          items:
            description: "The collection of reference list items."
            type: "array"
            items:
              $ref: "#/components/schemas/referenceListItem"
        required:
        - "name"
        - "archived"
        - "maxCodeLength"
        - "alphabeticalSort"
    referenceListSummary:
      title: "Reference List Summary"
      description: "A condensed summary of a Reference List object.\n"
      type: "object"
      properties:
        version:
          type: "integer"
          description: "The internal Data Hub version of the Reference List object."
        id:
          type: "integer"
          description: "The numeric identifier of the Reference List object."
        name:
          type: "string"
          description: "The locale-independent name of the Reference List object."
        label:
          type: "string"
          description: "A localized label for the Reference List object."
        maxCodeLength:
          type: "integer"
          description: "The maximum length of the string that is used as the code\
            \ for list items."
        archived:
          type: "boolean"
          description: "Indicates whether the reference list is archived."
        links:
          type: "array"
          items:
            $ref: "#/components/schemas/sasLink"
          description: "A list of links that are available for this Reference List.\
            \ This contains the link to fetch the full Reference List representation.\n"
    referenceListSummaryCollection:
      title: "Reference List Summary Collection"
      description: "A Resource Collection that contains Reference List Summary objects.\n"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/referenceListSummary"
            description: "An array of Reference List Summaries."
    referenceListItem:
      title: "Reference List Item"
      description: "An option in a reference list."
      allOf:
      - $ref: "#/components/schemas/localizableObject"
      - type: "object"
        properties:
          code:
            type: "string"
            description: "The unique identifier for this reference list item."
          archived:
            type: "boolean"
            description: "Indicates whether the reference list is archived."
          displayIndex:
            type: "integer"
            description: "Indicates the position in which this item appears in the\
              \ reference list."
        required:
        - "code"
        - "archived"
        - "displayIndex"
    entityStyle:
      title: "Entity Style"
      description: "The properties for styling an icon, nodes, and map pins for an\
        \ entity type. The style is tied to a condition. When the condition is true,\
        \ the style is applied.\n"
      allOf:
      - $ref: "#/components/schemas/styleCommonProperties"
      - type: "object"
        properties:
          iconName:
            type: "string"
            description: "The name of the icon properties."
          markerCode:
            type: "string"
            description: "A hexadecimal color value for the background color to use\
              \ for map pins."
          nodeColor:
            type: "string"
            description: "A hexadecimal color value to use when an object is represented\
              \ as a node."
          borderColor:
            type: "string"
            description: "A hexadecimal color value to use for the node border."
          borderWidth:
            type: "number"
            format: "double"
            description: "The width of the node border."
    relationshipStyle:
      title: "Relationship Style"
      type: "object"
      description: "The properties for styling of links for a relationship type."
      allOf:
      - $ref: "#/components/schemas/styleCommonProperties"
      - type: "object"
        properties:
          color:
            type: "string"
            description: "The color of links that are displayed in network view for\
              \ this relationship type."
          width:
            type: "number"
            format: "double"
            description: "The width of links that are displayed in network view for\
              \ this relationship type. Specify a whole number."
          dashType:
            type: "string"
            description: "The type of line that is displayed when viewing a relationship\
              \ link."
            enum:
            - "solid"
            - "dotted"
            - "dashed"
            - "shortDash"
            - "dashDot"
            - "longDash"
            - "longDashDot"
            - "longDashDotDot"
    styleCommonProperties:
      title: "Common Style Properties"
      description: "The shared style icon properties for a condition. When the condition\
        \ is true, the style is applied.\n"
      properties:
        id:
          type: "string"
          description: "A unique ID value for the style properties."
        conditionId:
          type: "string"
          description: "The ID of the condition with which the style is associated."
        evaluationOrder:
          type: "integer"
          description: "The order in which the condition should be evaluated."
    bulkOperationResult:
      title: "Bulk Operation Result"
      type: "object"
      description: "When performing a bulk Insert or Update operation on documents,\
        \ this type represents the result from that operation for an individual document.\
        \ The result is either success or failure. If the error property is present,\
        \ the operation failed. If there is no value in the error property, the operation\
        \ was successful.\n"
      properties:
        id:
          type: "string"
          description: "The ID for the document."
        entityType:
          type: "string"
          description: "The entity type of the document."
        operation:
          type: "string"
          description: "The type of operation being performed for the document."
          enum:
          - "CREATE"
          - "UPDATE"
        error:
          type: "object"
          description: "Details about why the operation failed for this document.\
            \ If this property has a value, the operation failed.\n"
          allOf:
          - $ref: "#/components/schemas/sasCollection"
    bulkOperationResultCollection:
      title: "Bulk Operation Result Collection"
      type: "object"
      description: "A list of bulk operation result items. Each item represents whether\
        \ an operation succeeded or failed for an individual document.\n"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/bulkOperationResult"
            description: "The array that contains the bulk operation results."
    linkBulkOperationResult:
      title: "Link Bulk Operation Result"
      type: "object"
      description: "When performing a bulk Insert or Update operation on links, this\
        \ type represents the result from that operation for an individual link. The\
        \ result is either success or failure. If the error property is present, the\
        \ operation failed. If there is no value in the error property, the operation\
        \ was successful.\n"
      properties:
        id:
          type: "string"
          description: "The ID for the link object that connects the \"from\" and\
            \ \"to\" documents."
        fromEntityType:
          type: "string"
          description: "The entity type of the \"from\" document."
        fromId:
          type: "string"
          description: "The ID for the \"from\" document."
        toEntityType:
          type: "string"
          description: "The entity type of the \"to\" document."
        toId:
          type: "string"
          description: "The ID for the \"to\" document."
        relationshipTypeName:
          type: "string"
          description: "The relationship type name of the link."
        operation:
          type: "string"
          description: "The type of operation being performed for the link."
          enum:
          - "CREATE"
          - "UPDATE"
        error:
          type: "object"
          description: "Details about why the operation failed for this link. If this\
            \ property has a value, the operation failed.\n"
          allOf:
          - $ref: "#/components/schemas/sasCollection"
      example:
        $ref: "#/components/examples/linkBulkOperationResultExample/value"
    linkBulkOperationResultCollection:
      title: "Link Bulk Operation Result Collection"
      type: "object"
      description: "A list of link bulk operation result items. Each item represents\
        \ whether an operation succeeded or failed for an individual link.\n"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/linkBulkOperationResult"
            description: "The array that contains the link bulk operation results."
      example:
        $ref: "#/components/examples/linkBulkOperationResultCollectionExample/value"
    solutionPublishResult:
      title: "Solution Publish Result"
      description: "The results of a publish operation. This includes counts of how\
        \ many items were published and a summary of any that failed.\n"
      properties:
        solutionName:
          type: "string"
          description: "The name of the solution."
          example: "sample_solution"
        solutionLabel:
          type: "string"
          description: "The localized name of the solution."
          example: "Sample Solution"
        successful:
          type: "integer"
          description: "The number of items that were successfully published."
          example: 42
        failed:
          type: "integer"
          description: "The number of items that could not be published."
          example: 1
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/solutionPublishResultItem"
    solutionPublishResultItem:
      title: "Solution Publish Result Item"
      description: "The results of a publish operation for a specific item type. This\
        \ includes counts of how many items were published and a summary of any that\
        \ failed.\n"
      properties:
        type:
          type: "string"
          description: "The internal name for the item type that was published."
          enum:
          - "ENTITY_TYPE"
          - "CONTEXT_MAPPING"
          - "PAGE_TEMPLATE"
          - "WORKFLOW_TEMPLATE"
          - "FLOW"
          example: "ENTITY_TYPE"
        label:
          type: "string"
          description: "The localized name of the item."
          example: "Entity Type"
        successful:
          type: "integer"
          description: "The number of items that were successfully published."
          example: 42
        failed:
          type: "integer"
          description: "The number of items that could not be published."
          example: 1
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/solutionPublishResultError"
    solutionPublishResultError:
      title: "Solution Publish Result Error"
      description: "Detailed information about an item that was not successfully published.\n"
      properties:
        name:
          type: "string"
          description: "The name of the item."
          example: "sample_item"
        label:
          type: "string"
          description: "The localized name of the item."
          example: "Sample Item"
        message:
          type: "string"
          description: "The error message for the failure."
          example: "Record is locked by another user."
    countLinksResult:
      title: "Count Links Result"
      type: "object"
      description: "This type represents an individual result from counting the relationship\
        \ links for a document. The \"linkCount\" property contains the total number\
        \ of links that were found for each type. There will be one entry for each\
        \ \"to\" entity type. Note that if the relationship type is  heterogeneous,\
        \ then the \"from\" entity type will have a value, but the \"to\" entity type\
        \ will be null.\n"
      properties:
        relationshipId:
          type: "integer"
          description: "The id of the relationship type"
        relationshipName:
          type: "string"
          description: "The name of the relationship type"
        relationshipLabel:
          type: "string"
          description: "The localized name of the relationship type"
        relationshipQualifiedName:
          type: "string"
          description: "The full name of the relationship type, which is based on\
            \ the \"from\" entity type and the relationship name"
        relationshipReverseName:
          type: "string"
          description: "The name of the relationship from the opposite perspective"
        relationshipReverseLabel:
          type: "string"
          description: "The label for the relationship from the opposite perspective"
        fromEntityTypeName:
          type: "string"
          description: "The type of the \"from\" entity type"
        fromEntityTypeLabel:
          type: "string"
          description: "The localized label for the \"to\" entity type"
        toEntityTypeName:
          type: "string"
          description: "The type of the \"to\" entity type"
        toEntityTypeLabel:
          type: "string"
          description: "The localized label for the \"to\" entity type"
        linkCount:
          type: "integer"
          description: "The number of matching links that were found"
    countLinksResultCollection:
      title: "Count Links Result Collection"
      type: "object"
      description: "A list of count links result items. Each item provides a count\
        \ of the number of links between the \"from\" entity and other entities of\
        \ a specific type.\n"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/countLinksResult"
            description: "The array that contains the link count results."
    relationshipType:
      title: "Relationship Type"
      description: "The definition of a connection that can be established between\
        \ two entities."
      allOf:
      - $ref: "#/components/schemas/dataObject"
      - type: "object"
        properties:
          reverseName:
            type: "string"
            description: "The name of the relationship from the opposite perspective."
          reverseLabel:
            type: "string"
            description: "The label for the relationship from the opposite perspective."
          fromObjectName:
            type: "string"
            description: "The name of the side of the relationship that is pointed\
              \ away from another entity."
          fromObjectLabel:
            type: "string"
            description: "The label for the side of the relationship that is pointed\
              \ away from another entity."
          toObjectName:
            type: "string"
            description: "The name of the side of the relationship that is pointed\
              \ toward another entity."
          toObjectLabel:
            type: "string"
            description: "The label for the side of the relationship that is pointed\
              \ toward another entity."
          required:
            type: "boolean"
            description: "Indicates whether the relationship is required."
          cardinality:
            type: "string"
            description: "The cardinality for the relationship. The possible values\
              \ are: \"ONE_TO_ONE\", \"ONE_TO_MANY\", \"MANY_TO_ONE\", \"MANY_TO_MANY\"\
              \n"
            enum:
            - "ONE_TO_ONE"
            - "ONE_TO_MANY"
            - "MANY_TO_ONE"
            - "MANY_TO_MANY"
          sortCriteria:
            $ref: "#/components/schemas/sortCriteria"
          type:
            type: "string"
            description: "The type of relationship. DIRECT_CHILD relationships are\
              \ parent-child relationships. LINK relationships are general relationships\
              \ between one type and another.\n"
            enum:
            - "DIRECT_CHILD"
            - "LINK"
          symmetric:
            type: "boolean"
            description: "Indicates whether the relationship is symmetric."
          managed:
            type: "boolean"
            description: "Indicates whether the relationship is managed."
          toObjectTypeFieldName:
            type: "string"
            description: "Used only for heterogeneous relationships with no bridge\
              \ table. The value indicates a field in the \"from\" entity type. If\
              \ a document of the \"from\" entity type has a value for this field,\
              \ it will contain the entity type name of a document of the \"to\" entity\
              \ type to which it is linked under this relationship type. This field\
              \ in the \"from\" entity type must not be masked.\n"
          toObjectTypeNames:
            type: "array"
            description: "The names of the entity types on the \"to\" side of the\
              \ relationship."
            items:
              type: "string"
          joinKeyFieldName:
            type: "string"
            description: "Used only for heterogeneous relationships with no bridge\
              \ table. The value indicates a field in \"from\" entity type. If a document\
              \ of the \"from\" entity type has a value for this field, it will contain\
              \ the entity ID of a document of the \"to\" entity type to which it\
              \ is linked under this relationship type. This field in the \"from\"\
              \ entity type must not be masked.\n"
          joinConditions:
            type: "array"
            description: "The list of expressions that are used to perform the join.\
              \ Join conditions must not reference masked fields."
            items:
              $ref: "#/components/schemas/entityTypeExpressionBoolean"
          fields:
            type: "array"
            description: "The list of fields that are part of the relationship."
            items:
              $ref: "#/components/schemas/relationshipTypeField"
          localizedReverseLabels:
            type: "array"
            items:
              $ref: "#/components/schemas/labelLocalized"
          deleteTableName:
            type: "string"
            description: "The name of the table that is used for tracking deleted\
              \ records."
          useCustomIndex:
            type: "boolean"
            description: "Indicates whether the relationship should use a custom index."
          color:
            type: "string"
            description: "The color of links displayed in network view for this relationship\
              \ type."
          width:
            type: "number"
            format: "double"
            description: "The width of links displayed in network view for this relationship\
              \ type."
          dashType:
            type: "string"
            description: "The type of line displayed when viewing a relationship link."
            enum:
            - "solid"
            - "dotted"
            - "dashed"
            - "shortDash"
            - "dashDot"
            - "longDash"
            - "longDashDot"
            - "longDashDotDot"
          styles:
            type: "array"
            description: "Additional styling that is conditional."
            items:
              $ref: "#/components/schemas/relationshipStyle"
          reindexRequired:
            type: "boolean"
            description: "Indicates whether reindexing is required. After a relationship\
              \ type is updated, this value is true if the relationship needs to be\
              \ reindexed.\n"
    relationshipTypeField:
      title: "Relationship Type Field"
      description: "A field within a relationship type."
      allOf:
      - $ref: "#/components/schemas/dataField"
      - type: "object"
        properties:
          ownerName:
            type: "string"
            description: "The owner of the relationship type"
          writeOnlyAtCreate:
            type: "boolean"
            description: "Flag to indicate that a read-only field can be modified\
              \ when a link is created"
          hidden:
            type: "boolean"
            description: "Flag to indicate if the field should be visible to end-users"
    document:
      title: "Document"
      type: "object"
      description: "The actual data that is associated with a particular Entity Type.\
        \ Entity Types are the metadata and Documents are the data. If a field is\
        \ masked, its value will not appear in the `fieldValues` object.\n"
      properties:
        objectTypeName:
          type: "string"
          description: "The name of the entity type with which the document is associated."
        objectTypeId:
          type: "integer"
          format: "int64"
          description: "The ID of the entity type with which the document is associated."
        objectTypeVersion:
          type: "integer"
          description: "The internal Data Hub version for the entity type that is\
            \ associated with the document."
        id:
          type: "string"
          description: "The qualified ID that uniquely identifies the document."
        displayLabel:
          type: "string"
          description: "The value to use for displaying the ID of the document."
        fieldValues:
          type: "object"
          description: "The values for the fields and child objects that are defined\
            \ for the related entity type. The actual data of the document exists\
            \ here.\n"
          additionalProperties: true
        validFrom:
          type: "string"
          format: "date-time"
          description: "The timestamp value that indicates the starting datetime for\
            \ when the document is valid."
        validTo:
          type: "string"
          format: "date-time"
          description: "The timestamp value that indicates the ending datetime for\
            \ when the document is valid."
        createdAt:
          type: "string"
          format: "date-time"
          description: "The timestamp that indicates when the document was created."
        lastUpdatedAt:
          type: "string"
          format: "date-time"
          description: "The timestamp that indicates when the document was last modified."
      example:
        $ref: "#/components/examples/documentExample"
    minimallyMaskedDocument:
      title: "Minimally-Masked Document"
      description: "A representation of a Document that has the minimal amount of\
        \ field masking applied. That is, for each masked field, if the requesting\
        \ user is authorized to reveal its value, the value is unmasked in this representation.\
        \ Otherwise, the value will remain masked.\n"
      allOf:
      - $ref: "#/components/schemas/document"
      example:
        $ref: "#/components/examples/documentExample"
    maskedDocument:
      title: "Masked Document"
      description: "A representation of a Document that has masked field values replaced\
        \ with dot characters. Fields not configured to be masked are represented\
        \ normally.\n"
      allOf:
      - $ref: "#/components/schemas/document"
      example:
        $ref: "#/components/examples/documentExample"
    enrichedDocument:
      title: "Enriched Document"
      type: "object"
      description: "The actual data that is associated with a particular Entity Type.\
        \ Entity Types are the metadata and Documents are the data. The document is\
        \ \"enriched\" with additional data such as comments, insights, and workspaces.\n"
      allOf:
      - $ref: "#/components/schemas/document"
      - type: "object"
        properties:
          comments:
            type: "array"
            description: "The comments that are associated with the document."
            items:
              $ref: "#/components/schemas/comment"
          sheets:
            type: "array"
            items:
              $ref: "#/components/schemas/sheet"
            description: "The insights and workspaces that are associated with the\
              \ document."
          attachmentsCount:
            type: "integer"
            format: "int64"
            description: "The number of attachments that are associated with the document."
          fieldRestrictions:
            type: "object"
            description: "A bundle of field restrictions that apply to fields in the\
              \ document as well as any embedded child documents."
            allOf:
            - $ref: "#/components/schemas/fieldRestrictions"
          clientFieldProperties:
            type: "object"
            description: "A bundle of client field properties that have been set on\
              \ fields in the document as well as any embedded child documents."
            allOf:
            - $ref: "#/components/schemas/clientFieldPropertiesObjectMap"
      example:
        $ref: "#/components/examples/enrichedDocumentExample"
    minimallyMaskedEnrichedDocument:
      title: "Minimally-Masked Enriched Document"
      description: "A representation of an Enriched Document that has the minimal\
        \ amount of field masking applied. That is, for each masked field, if the\
        \ requesting user is authorized to reveal its value, the value is unmasked\
        \ in this representation. Otherwise, the value will remain masked.\n"
      allOf:
      - $ref: "#/components/schemas/enrichedDocument"
      example:
        $ref: "#/components/examples/enrichedDocumentExample"
    maskedEnrichedDocument:
      title: "Masked Enriched Document"
      description: "A representation of an Enriched Document that has masked field\
        \ values replaced with dot characters. Fields not configured to be masked\
        \ are represented normally.\n"
      allOf:
      - $ref: "#/components/schemas/enrichedDocument"
      example:
        $ref: "#/components/examples/enrichedDocumentExample"
    enrichedDocumentCollection:
      title: "Enriched Document Collection"
      type: "object"
      description: "A collection of enriched documents."
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/enrichedDocument"
            description: "The array that contains the enriched documents."
    maskedEnrichedDocumentCollection:
      title: "Masked Enriched Document Collection"
      type: "object"
      description: "A collection of masked enriched documents."
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/maskedEnrichedDocument"
            description: "The array that contains the masked enriched documents."
    plainDocumentCollection:
      title: "Document Collection"
      type: "object"
      description: "A collection of documents."
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/document"
            description: "The array that contains the documents."
    minimallyMaskedDocumentCollection:
      title: "Minimally-Masked Document Collection"
      description: "A collection of minimally-masked documents."
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/minimallyMaskedDocument"
            description: "The array that contains the minimally-masked documents."
    maskedDocumentCollection:
      title: "Masked Document Collection"
      description: "A collection of masked documents."
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/maskedDocument"
            description: "The array that contains the masked documents."
    documentAndLink:
      title: "Document and Link Bundle"
      description: "A representation that bundles together an Enriched Document and\
        \ a Relationship Link."
      type: "object"
      required:
      - "document"
      - "documentLink"
      properties:
        document:
          $ref: "#/components/schemas/enrichedDocument"
        documentLink:
          $ref: "#/components/schemas/relationshipLink"
    maskedDocumentAndLink:
      title: "Masked Document and Link Bundle"
      description: "A representation that bundles together a Masked Enriched Document\
        \ and a Masked Relationship Link."
      type: "object"
      required:
      - "document"
      - "documentLink"
      properties:
        document:
          $ref: "#/components/schemas/maskedEnrichedDocument"
        documentLink:
          $ref: "#/components/schemas/maskedRelationshipLink"
    documentFilterRequest:
      title: "Document Filter Request"
      type: "object"
      description: "A request to filter a collection of documents."
      properties:
        filter:
          type: "string"
          description: "A limited version of the filter syntax defined in the \n[SAS\
            \ REST reference guide](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#filtering)\
            \ is supported.\n\n<em>The only functions supported are \"and\", \"or\"\
            , and \"eq\" to reduce the possibility of full table scans.</em>\n\nGiven\
            \ the limited support for functions, only a select number of entity field\
            \ types are supported:\n<ul>\n  <li>STRING</li>\n  <li>INTEGER</li>\n\
            \  <li>SMALLINT</li>\n  <li>LONG</li>\n  <li>NUMERIC</li>\n  <li>BOOLEAN</li>\n\
            \  <li>REFERENCE_DATA (when providing a value to the filter, use the value\
            \ of the Reference Data item’s “code” property)</li>\n</ul>\n\nOther considerations\
            \ when crafting document filter queries:\n<ul>\n  <li>The \"object attributes\"\
            \ of the filter string correspond to the entity type's field names, not\
            \ the column names.</li>\n  <li>Filtering by values in child documents\
            \ is not supported.</li>\n</ul>\n\nFilter examples:\n<ul>\n  <li>eq(first_name,\
            \ 'John')</li>\n  <li>and(eq(first_name, 'John'), eq(last_name, 'Smith'))</li>\n\
            \  <li>or(eq(first_name, 'John'), eq(last_name, 'Smith'))</li>\n  <li>and(eq(record_id,\
            \ 1234), or(eq(first_name, 'John'), eq(last_name, 'Smith')))</li>\n</ul>\n"
        start:
          description: "The starting index of the first document in a page."
          type: "integer"
          format: "int64"
          default: 0
        limit:
          type: "integer"
          default: 20
          description: "The maximum number of documents to return in this page of\
            \ results. The actual number of returned documents is fewer if the collection\
            \ is exhausted.\n"
        depth:
          type: "string"
          description: "Supported values: <ul>\n  <li>'0' - No child documents are\
            \ included in each document</li>\n  <li>'1' - Child documents are included\
            \ in each document if they exist for that document</li>\n</ul>\n"
          default: 0
        includeDisplayLabel:
          type: "boolean"
          description: "Generate and include the display label in the document."
          default: false
        sortBy:
          type: "string"
          example: "first_name:ascending;last_name:descending"
          description: "Sort a collection by field name. The sorting syntax is defined\
            \ in the [SAS REST reference\nguide](https://developer.sas.com/rest-apis/svi-datahub-v{{latest_version}}/docs/getting-started/usage-notes#sorting).\
            \ Only \"ascending\" and \"descending\" are supported. Sorting\nbehavior\
            \ is dependent on the type of underlying database in which the document\
            \ data is stored. Because of this,\nthere is a chance that the sorting\
            \ behavior might differ between entity types. Sorting is not applied by\n\
            default.\n"
    documentIdRequest:
      title: "Document ID Request"
      type: "object"
      description: "A request for a collection of documents by ID."
      properties:
        documentIds:
          type: "array"
          items:
            type: "string"
          description: "An array of document ID values for the entity type that is\
            \ associated with the request.\n"
        start:
          description: "The starting index of the first document in a page."
          type: "integer"
          format: "int64"
          default: 0
        limit:
          type: "integer"
          default: 20
          description: "The maximum number of documents to return in this page of\
            \ results. The actual number of returned documents is fewer if the collection\
            \ is exhausted.\n"
        depth:
          type: "string"
          description: "Supported values: <ul>\n  <li>'0' - No child documents are\
            \ included in each document</li>\n  <li>'1' - Child documents are included\
            \ in each document if they exist for that document</li>\n</ul>\n"
          default: 0
        includeDisplayLabel:
          type: "boolean"
          description: "Generate and include the display label in the document."
          default: false
        sortBy:
          type: "string"
          example: "first_name:ascending;last_name:descending"
          description: "Sort a collection by field name. The sorting syntax is defined\
            \ in the [SAS REST reference\nguide](https://developer.sas.com/rest-apis/svi-datahub-v{{latest_version}}/docs/getting-started/usage-notes#sorting).\
            \ Only \"ascending\" and \"descending\" are supported. Sorting\nbehavior\
            \ is dependent on the type of underlying database in which the document\
            \ data is stored. Because of this,\nthere is a chance that the sorting\
            \ behavior might differ between entity types. Sorting is not applied by\n\
            default.\n"
    sheet:
      title: "Sheet"
      type: "object"
      description: "An instance of an insight or workspace."
      properties:
        id:
          type: "integer"
          format: "int64"
          description: "A value that uniquely identifies the insight or workspace."
        name:
          type: "string"
          description: "The name of the insight or workspace."
        tabOrder:
          type: "integer"
          description: "The tab order for the insight or workspace."
        type:
          type: "string"
          enum:
          - "WORKSHEET"
          - "NOTESHEET"
          description: "Indicates the type of \"sheet\", either a workspace or an\
            \ insight: <ul>\n  <li>`WORKSHEET` - a workspace</li>\n  <li>`NOTESHEET`\
            \ - an insight</li>\n</ul>\n"
        cells:
          type: "array"
          description: "The individual cells on the sheet."
          items:
            $ref: "#/components/schemas/sheetCell"
        lastModified:
          type: "string"
          format: "date-time"
          description: "The timestamp that indicates when this cell was last modified."
    sheetCell:
      title: "Cell"
      type: "object"
      description: "An individual cell on a workspace or an insight."
      properties:
        id:
          type: "integer"
          format: "int64"
          description: "A value that uniquely identifies the cell."
        row:
          type: "integer"
          description: "The row of the worksight or insight in which the cell exists."
        position:
          type: "integer"
          description: "The position of the cell in the row."
        type:
          type: "string"
          enum:
          - "LIVE"
          - "STATIC"
          - "IMAGE"
          - "TEXT"
          description: "The type of the cell: <ul>\n  <li>`LIVE` - live visualization</li>\n\
            \  <li>`STATIC` - static visualization or network</li>\n  <li>`IMAGE`\
            \ - Base64 encoded image and annotations</li>\n  <li>`TEXT` - simple text\
            \ cell for HTML</li>\n</ul>\n"
        height:
          type: "integer"
          description: "The height of the cell."
        width:
          type: "integer"
          description: "The width of the cell."
        lastModified:
          type: "string"
          format: "date-time"
          description: "The timestamp that indicates when this cell was last modified."
    sheetCopySelection:
      title: "Sheet Copy Selection"
      type: "object"
      description: "A selection of sheets to copy."
      properties:
        sheetIds:
          type: "array"
          description: "The values that uniquely identify the sheets to copy."
          items:
            type: "integer"
            format: "int64"
        objectTypeName:
          type: "string"
          description: "The object type name of the object to which the sheets are\
            \ attached."
        objectId:
          type: "string"
          description: "The ID of the object to which the sheets are attached."
    historyinfo:
      title: "Additional History Information"
      type: "object"
      description: "Represents additional information about a historical version of\
        \ a document. For example, showing that a change occurred to an insight.\n"
      properties:
        historyInfoId:
          type: "integer"
          description: "The ID for this additional history information record.\n"
        itemRefId:
          type: "string"
          description: "The ID of the object that this additional history information\
            \ references. For example, this could be the ID of a file association.\n"
        itemType:
          type: "string"
          description: "The type of object that this additional history information\
            \ references.\n"
        itemLabel:
          type: "string"
          description: "A label for the object that this additional history information\
            \ references.\n"
        operation:
          type: "string"
          description: "Represents the generic type of operation that this additional\
            \ history information references.\n"
        ownerType:
          type: "string"
          description: "The object type of the document to which this additional history\
            \ information belongs.\n"
        ownerId:
          type: "string"
          description: "The ID of the document to which this additional history information\
            \ belongs.\n"
        ownerVersion:
          type: "string"
          description: "The version of the document to which this additional history\
            \ information belongs.\n"
    historyinfoCollection:
      title: "Additional History Information Collection"
      description: "A collection of additional history information.\n"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/historyinfo"
            description: "An array of additional history information."
    versionSummary:
      title: "Version Summary"
      type: "object"
      description: "A representation of a single historical version of document or\
        \ link. The summary version of this representation omits the comparison of\
        \ field values between the requested and previous version of the document\
        \ or link.\n"
      properties:
        typeName:
          type: "string"
          description: "The entity type or relationship type of the underlying document\
            \ or link.\n"
        id:
          type: "string"
          description: "The ID of the underlying document or link.\n"
        version:
          type: "string"
          description: "The version of the underlying document or link.\n"
        displayLabel:
          type: "string"
          description: "The display label for the underlying document or link.\n"
        operation:
          type: "string"
          description: "A string that describes what action caused this version to\
            \ be created.\nOperations: <ul>\n  <li>create</li>\n  <li>delete</li>\n\
            \  <li>update</li>\n  <li>unknown</li>\n  <li>unchanged</li>\n</ul>\n"
        createdBy:
          type: "string"
          description: "The ID of the user that created this version.\n"
        createdAt:
          type: "string"
          format: "date-time"
          description: "The timestamp that indicates when this version was created.\n"
        links:
          type: "array"
          items:
            $ref: "#/components/schemas/sasLink"
          description: "A list of links that are available for this version. This\
            \ contains a link to the full version representation.\n"
    versionSummaryCollection:
      title: "Version Summary Collection"
      description: "A collection of version summaries.\n"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/versionSummary"
            description: "An array of version summaries."
    version:
      title: "Version"
      description: "A representation of a single historical version of document or\
        \ link. This representation contains an array of values that compares field\
        \ values between the previous and requested version of the document or link.\n"
      allOf:
      - $ref: "#/components/schemas/versionSummary"
      - type: "object"
        properties:
          values:
            type: "array"
            items:
              $ref: "#/components/schemas/versionValue"
            description: "A list of version values.\n"
    childVersionSummary:
      title: "Child Version Summary"
      description: "A representation of a single version of a child document. The\
        \ summary version of this representation omits the comparison of field values\
        \ between the requested and previous version of the child document.\n"
      allOf:
      - $ref: "#/components/schemas/versionSummary"
      - type: "object"
        properties:
          parentTypeName:
            type: "string"
            description: "The object type of the parent document.\n"
          parentId:
            type: "string"
            description: "The ID of the parent document.\n"
          parentVersion:
            type: "string"
            description: "The version of the parent document.\n"
    childVersionSummaryCollection:
      title: "Child Version Summary Collection"
      description: "A collection of child version summaries.\n"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/childVersionSummary"
            description: "An array of child version summaries."
    childVersion:
      title: "Child Version"
      description: "A representation of a single version of child document. This representation\
        \ contains an array of values that compares field values between the previous\
        \ and requested version of the child document.\n"
      allOf:
      - $ref: "#/components/schemas/childVersionSummary"
      - type: "object"
        properties:
          values:
            type: "array"
            items:
              $ref: "#/components/schemas/versionValue"
            description: "A list of version values.\n"
    versionValue:
      title: "Version Value"
      type: "object"
      description: "A comparison of a field value between the requested and previous\
        \ version of a document or link.\n"
      properties:
        name:
          type: "string"
          description: "The field name of the underlying field.\n"
        label:
          type: "string"
          description: "The localized label for the underlying field.\n"
        previousVersionValue:
          description: "The value of the field in the previous version of the document\
            \ or link. If the field is currently configured for masking, this value\
            \ is masked with dots.\n"
        previousValueFieldRestriction:
          description: "A field restriction object containing any relevant masking\
            \ metadata for the previous version value. This can be used by clients\
            \ to determine whether the previous version value can be revealed by the\
            \ current user and what URL can be used to fetch the revealed previous\
            \ version value.\n"
          type: "object"
          allOf:
          - $ref: "#/components/schemas/fieldRestriction"
        value:
          description: "The value of the field in the requested version of the document\
            \ or link. If the field is currently configured for masking, this value\
            \ is masked with dots.\n"
        fieldRestriction:
          description: "A field restriction object containing any relevant masking\
            \ metadata for the field value. This can be used by clients to determine\
            \ whether the value can be revealed by the current user and what URL can\
            \ be used to fetch the revealed value.\n"
          type: "object"
          allOf:
          - $ref: "#/components/schemas/fieldRestriction"
        type:
          type: "string"
          description: "The data type of the field. This can be used by clients for\
            \ formatting and display purposes.\n"
        valueChanged:
          type: "boolean"
          description: "Indicates whether the value has changed between the previous\
            \ and requested version of the document or link.\n"
    fieldValue:
      title: "Field Value"
      description: "A representation of a single field value. The value is represented\
        \ under the \"raw\" property of this object.\n"
      type: "object"
      required:
      - "raw"
      - "fieldName"
      properties:
        fieldName:
          type: "string"
          description: "The name of the field whose value is represented by this object."
    fieldValueCollection:
      title: "Field Value Collection"
      description: "A collection of field values."
      type: "object"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/fieldValue"
            description: "The array that contains the field values."
    jsonPatch:
      title: "JSON Patch"
      description: "A specification of changes to make to an object. It consists of\
        \ an array of patch operations.\n"
      type: "array"
      items:
        oneOf:
        - $ref: "#/components/schemas/jsonPatchAddOperation"
        - $ref: "#/components/schemas/jsonPatchReplaceOperation"
        - $ref: "#/components/schemas/jsonPatchTestOperation"
        - $ref: "#/components/schemas/jsonPatchRemoveOperation"
        - $ref: "#/components/schemas/jsonPatchMoveOperation"
        - $ref: "#/components/schemas/jsonPatchCopyOperation"
    jsonPatchAddOperation:
      title: "JSON Patch Add Operation"
      description: "Specifies a patch operation that adds a value.\n"
      additionalProperties: false
      properties:
        path:
          description: "A JSON Pointer path where the Add operation is applied."
          type: "string"
        op:
          description: "The operation to perform. For Add operations, this is always\
            \ \"add\"."
          type: "string"
          pattern: "^add$"
        value:
          description: "The value to add at the location specified by the path."
    jsonPatchReplaceOperation:
      title: "JSON Patch Replace Operation"
      description: "Specifies a patch operation that replaces a value.\n"
      additionalProperties: false
      properties:
        path:
          description: "A JSON Pointer path where the Replace operation is applied."
          type: "string"
        op:
          description: "The operation to perform. For Replace operations, this is\
            \ always \"replace\"."
          type: "string"
          pattern: "^replace$"
        value:
          description: "The value to replace at the location specified by the path."
    jsonPatchTestOperation:
      title: "JSON Patch Test Operation"
      description: "Specifies a patch operation that tests a value.\n"
      additionalProperties: false
      properties:
        path:
          description: "A JSON Pointer path where the Test operation is applied."
          type: "string"
        op:
          description: "The operation to perform. For Test operations, this is always\
            \ \"test\"."
          type: "string"
          pattern: "^test$"
        value:
          description: "The value to test at the location specified by the path."
    jsonPatchRemoveOperation:
      title: "JSON Patch Remove Operation"
      description: "Specifies a patch operation that removes a value.\n"
      additionalProperties: false
      properties:
        path:
          description: "A JSON Pointer path where the Remove operation is applied."
          type: "string"
        op:
          description: "The operation to perform. For Remove operations, this is always\
            \ \"remove\"."
          type: "string"
          pattern: "^remove$"
    jsonPatchMoveOperation:
      title: "JSON Patch Move Operation"
      description: "Specifies a patch operation that moves a value from one location\
        \ to another.\n"
      additionalProperties: false
      properties:
        from:
          description: "A JSON Pointer path from which the value is moved."
          type: "string"
        path:
          description: "A JSON Pointer path to which the value is moved."
          type: "string"
        op:
          description: "The operation to perform. For Move operations, this is always\
            \ \"move\"."
          type: "string"
          pattern: "^move$"
    jsonPatchCopyOperation:
      title: "JSON Patch Copy Operation"
      description: "Specifies a patch operation that copies a value from one location\
        \ to another.\n"
      additionalProperties: false
      properties:
        from:
          description: "A JSON Pointer path from which the value is copied."
          type: "string"
        path:
          description: "A JSON Pointer path to which the value is copied."
          type: "string"
        op:
          description: "The operation to perform. For Copy operations, this is always\
            \ \"copy\"."
          type: "string"
          pattern: "^copy$"
    entityLevelRules:
      title: "Entity-Level Security Rules"
      description: "Entity-Level Security Rules govern what rights a user has on documents\
        \ of a particular entity type. A user can search and read, create, update\
        \ or delete a document if they meet the entity-level security rules defined\
        \ for the given action for that entity."
      x-sas-media-type:
        name: "application/vnd.sas.investigation.entity.rules"
        version: 1
      x-sas-internal: true
      properties:
        version:
          type: "integer"
          description: "The version of this set of entity-level rules."
        name:
          type: "string"
          description: "The name of the entity type that these rules are applied to."
        rules:
          description: "The set of entity-level rules that are applied to this entity\
            \ type."
          type: "array"
          items:
            type: "object"
            properties:
              group:
                type: "string"
                description: "The group that the rule is assigned to."
              conditionName:
                type: "string"
                description: "A description of the rule."
              permissions:
                type: "object"
                description: "A map of permission action type (read, write, update,\
                  \ delete, search) to Boolean. Describes whether the group has the\
                  \ permission to do the given action type on the entity."
              conditions:
                type: "array"
                description: "The conditions that form the rule."
                items:
                  properties:
                    type:
                      type: "string"
                      description: "The type of the condition.  Describes an operator\
                        \ that should be applied to the field and value."
                    field:
                      type: "string"
                      description: "The field the condition operates on."
                    value:
                      type: "string"
                      description: "The value of the field that is evaluated against\
                        \ the condition."
    comment:
      title: "Comment"
      type: "object"
      description: "Additional text on an internal document.\nDuring an Update operation,\
        \ all properties of a comment are read-only except the category. This is for\
        \ security and audit purposes to keep historical data accurate.\n"
      properties:
        id:
          type: "integer"
          format: "int64"
          description: "The unique identifier for the comment."
        category:
          type: "string"
          description: "The category of the comment."
        author:
          $ref: "#/components/schemas/commentUser"
        createDate:
          type: "string"
          format: "date-time"
          description: "The date on which the comment was created."
        lastUpdatedAt:
          type: "string"
          format: "date-time"
          description: "The date on which the comment was updated."
        lastUpdatedBy:
          type: "string"
          description: "The user who last updated the comment."
        detail:
          type: "string"
          description: "Text of the comment."
      example:
        $ref: "#/components/examples/commentExample"
    commentUser:
      title: "Comment Author"
      type: "object"
      description: "Information about an author of a comment."
      properties:
        id:
          type: "string"
          description: "The unique identifier of the comment author."
        name:
          type: "string"
          description: "The name of the user who is the comment author."
    commentCategorySummary:
      title: "Comment Category Summary"
      type: "object"
      description: "Contains the comment category name and the count of that category\
        \ on the object."
      properties:
        category:
          type: "string"
          description: "The name of the category."
        count:
          type: "integer"
          description: "The number of comments that have the category on the object."
      example:
        $ref: "#/components/examples/commentCategoryExample"
    commentCollection:
      title: "Comment Collection"
      type: "object"
      description: "A collection of comment objects."
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/comment"
            description: "The array that contains the comments."
    transactionType:
      title: "Transaction Type"
      description: "The metadata that defines a class of transactions. This definition\
        \ includes a \"from\" entity type, a \"to\" entity type, a date-time field,\
        \ as well as on optional list of additional fields. A transaction, which is\
        \ an instance of a transaction type, defines an action that is performed between\
        \ two entities at a specific point in time.\n"
      allOf:
      - $ref: "#/components/schemas/dataObject"
      - type: "object"
        properties:
          fromObjectName:
            type: "string"
            description: "The entity type on the \"from\" side of the transaction."
          toObjectName:
            type: "string"
            description: "The entity type on the \"to\" side of the transaction."
          fromObjJoinCondition:
            description: "The join condition that identifies the \"from\" entity type.\
              \ Join conditions cannot reference masked fields."
            type: "object"
            allOf:
            - $ref: "#/components/schemas/entityTypeExpressionBoolean"
          toObjJoinCondition:
            description: "The join condition that identifies the \"to\" entity type.\
              \ Join conditions cannot reference masked fields."
            type: "object"
            allOf:
            - $ref: "#/components/schemas/entityTypeExpressionBoolean"
          fromObjectRefFieldName:
            type: "string"
            description: "The name of the field that contains the reference key to\
              \ the \"from\" entity. This field cannot be masked."
          toObjectRefFieldName:
            type: "string"
            description: "The name of the field that contains the reference key to\
              \ the \"to\" entity. This field cannot be masked."
          fromObjectTypeFieldName:
            type: "string"
            description: "If the transactions can have different \"from\" entity types,\
              \ the name of the field that contains the \"from\" entity type. This\
              \ field cannot be masked."
          toObjectTypeFieldName:
            type: "string"
            description: "If the transactions can have different \"to\" entity types,\
              \ name of the field that contains the \"to\" entity type. This field\
              \ cannot be masked."
          lineWidthFieldName:
            type: "string"
            description: "The field that is used to calculate the line width used\
              \ when displaying the transaction on a network diagram."
          lineWidthFunctionType:
            type: "string"
            description: "The aggregate function that is used (on the field identified\
              \ in lineWidthFieldName property) to calculate the line width when displaying\
              \ the transaction on a network diagram."
            enum:
            - "SUM"
            - "COUNT"
            - "AVERAGE"
            - "MIN"
            - "MAX"
          lineColorFieldName:
            type: "string"
            description: "The field that is used to determine line color when displaying\
              \ the transaction on a network diagram."
          lineColorFunctionType:
            type: "string"
            description: "The aggregate function that is used (on field identified\
              \ in lineColorFieldName property) to determine the line color when displaying\
              \ the transaction on a network diagram."
            enum:
            - "SUM"
            - "COUNT"
            - "AVERAGE"
            - "MIN"
            - "MAX"
          validFromFieldName:
            type: "string"
            description: "The field that is used to determine the earliest time this\
              \ transaction is valid. This field cannot be masked."
          fields:
            description: "The array that contains the fields that are associated with\
              \ this transaction type."
            type: "array"
            items:
              $ref: "#/components/schemas/transactionTypeField"
    transactionTypeField:
      title: "Transaction Type Field"
      type: "object"
      description: "A single field that is associated with a transaction type object."
      allOf:
      - $ref: "#/components/schemas/dataField"
      - type: "object"
        properties:
          ownerName:
            type: "string"
            description: "The name of the owner."
    nodeDecoration:
      title: "Node Decoration"
      type: "object"
      description: "The information that describes a node decoration."
      allOf:
      - type: "object"
        properties:
          label:
            type: "string"
            description: "The label for the icon decoration."
          icons:
            type: "array"
            description: "The collection of icon decorations associated with this\
              \ node."
    bulkDocumentPatchItem:
      title: "Bulk Document Patch Item"
      type: "object"
      description: "Represents a single document to be patched in a bulk patch operation.\
        \ Each item identifies a document by its entity type and ID, and includes\
        \ a list of JSON Patch operations to apply to it.\n"
      required:
      - "objectTypeName"
      - "id"
      properties:
        objectTypeName:
          type: "string"
          maxLength: 255
          description: "The entity type name of the document to patch."
        id:
          type: "string"
          description: "The ID of the document to patch."
        ifMatch:
          type: "integer"
          format: "int64"
          nullable: true
          description: "The expected version of the document for optimistic locking.\
            \ If provided and the document has been modified since this version, the\
            \ patch operation fails with a conflict error.\n"
        patches:
          type: "array"
          nullable: true
          description: "The list of JSON Patch operations to apply to the document.\
            \ Only `add`, `remove`, and `replace`  operations are supported for bulk\
            \ document patches. JSON Patch operations are defined by RFC 6902.\n"
          items:
            oneOf:
            - $ref: "#/components/schemas/jsonPatchAddOperation"
            - $ref: "#/components/schemas/jsonPatchReplaceOperation"
            - $ref: "#/components/schemas/jsonPatchRemoveOperation"
    bulkDocumentPatchItemCollection:
      title: "Bulk Document Patch Item Collection"
      type: "object"
      description: "A collection of bulk document patch items. Each item identifies\
        \ a document and the JSON Patch operations to apply to it.\n"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/bulkDocumentPatchItem"
            description: "The array that contains the bulk document patch items."
    enrichedBulkOperationResult:
      title: "Enriched Bulk Operation Result"
      type: "object"
      description: "The result of a bulk patch operation on a single document, optionally\
        \ enriched with the full document representation. On success, `id`, `entityType`,\
        \ `operation`, and optionally `document` are populated. On failure, `error`\
        \ is populated with details about the failure.\n"
      properties:
        id:
          type: "string"
          description: "The ID of the document that was affected by the operation."
        entityType:
          type: "string"
          description: "The entity type name of the document."
        operation:
          type: "string"
          description: "The operation that was performed."
          enum:
          - "CREATE"
          - "UPDATE"
          - "DELETE"
        error:
          type: "object"
          description: "Details about why the operation failed for this document.\
            \ If this property has a value, the operation failed.\n"
          allOf:
          - $ref: "#/components/schemas/sasError"
        document:
          type: "object"
          description: "The full enriched document representation after the operation.\
            \ Present only when the operation succeeds and the client requests the\
            \ enriched response via the `Accept-Item` header. Masked fields are represented\
            \ as nine dots.\n"
          allOf:
          - $ref: "#/components/schemas/enrichedDocument"
    enrichedBulkOperationResultCollection:
      title: "Enriched Bulk Operation Result Collection"
      type: "object"
      description: "A collection of enriched bulk operation results. Each item represents\
        \ whether a bulk patch operation succeeded or failed for an individual document.\
        \ Result items are in the same order as the input collection.\n"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/enrichedBulkOperationResult"
            description: "The array that contains the enriched bulk operation results."
    sasCollection:
      title: "SAS Collection"
      description: "This is a base schema that is used to define paginated collections\
        \ of resources. It is based on http://{SAS API Portal}/reference/schema/baseCollection/v2/baseCollection2.json.\
        \ Other APIs can extend this base schema by adding an \"items\" array property.\n"
      type: "object"
      properties:
        name:
          type: "string"
          description: "The name of the collection."
        start:
          type: "integer"
          description: "The zero-based index of the first item in the collection."
          format: "int64"
        limit:
          type: "integer"
          description: "The number of items that were requested for the collection."
        count:
          type: "integer"
          description: "If populated, indicates the number of items in the collection."
          format: "int64"
        accept:
          type: "string"
          description: "A space-delimited list of media types from which an `Accept`\
            \ header can be constructed."
        links:
          type: "array"
          description: "The links that apply to the collection."
          items:
            $ref: "#/components/schemas/sasLink"
        version:
          type: "integer"
          description: "The version number of the collection representation. This\
            \ representation is version 2."
    sasError:
      title: "SAS Error"
      description: "The representation of an error. This schema is based on http://{SAS\
        \ API Portal}/reference/schema/application/vnd.sas.error/v2/error2.json.\n"
      type: "object"
      properties:
        message:
          type: "string"
          description: "The message for the error."
        id:
          type: "string"
          description: "The string ID for the error."
        errorCode:
          type: "integer"
          description: "The numeric ID for the error."
        httpStatusCode:
          type: "integer"
          description: "The HTTP status code for the error."
        details:
          type: "array"
          description: "Messages that provide additional details about the cause of\
            \ the error."
          items:
            type: "string"
        remediation:
          type: "string"
          description: "A message that describes how to resolve the error."
        errors:
          type: "array"
          description: "Any additional errors that occurred."
          items:
            type: "object"
        links:
          type: "array"
          description: "The links that apply to the error."
          items:
            $ref: "#/components/schemas/sasLink"
        version:
          type: "integer"
          description: "The version number of the error representation. This representation\
            \ is version 2."
      example:
        $ref: "#/components/examples/sasErrorExample"
    sasLink:
      title: "SAS Link"
      description: "A link to a related operation or resource. This schema is based\
        \ on http://{SAS API Portal}/reference/schema/link/v1/link.json.\n"
      type: "object"
      properties:
        method:
          type: "string"
          description: "The HTTP method for the link."
        rel:
          type: "string"
          description: "The relationship of the link to the resource."
        uri:
          type: "string"
          description: "The relative URI for the link."
        href:
          type: "string"
          description: "The URL for the link."
        title:
          type: "string"
          description: "The title for the link."
        type:
          type: "string"
          description: "The media type or link type for the link."
        itemType:
          type: "string"
          description: "If this is a link to a container, `itemType` is the media\
            \ type or link type for the items in the container."
        responseType:
          type: "string"
          description: "The media type or link type of the response body for a `PUT`,\
            \ `POST`, or `PATCH` operation."
        responseItemType:
          type: "string"
          description: "The media type or link type of the items in the response body\
            \ for a `PUT`, `POST`, or `PATCH` operation."
    sasProperties:
      title: "SAS Properties"
      description: "Contains a set of properties, each of which is a pair that consists\
        \ of a string name and a string value. This schema is based on http://{SAS\
        \ API Portal}/reference/schema/application/vnd.sas.properties/v1/properties.json.\n"
      type: "object"
      properties:
        version:
          type: "integer"
          description: "The version number of the API representation. This is version\
            \ 1."
          minimum: 1
        properties:
          type: "array"
          items:
            $ref: "#/components/schemas/sasProperty"
          description: "A list of name/value pairs."
        links:
          description: "Links to associated resources and operations. APIs might provide\
            \ links for the link relations `self', `update` (to replace the attributes),\
            \ `patch` (to update some attributes), or others."
          type: "array"
          items:
            type: "object"
    sasProperty:
      title: "SAS Property"
      description: "A pair that consists of a string name and a string value.  This\
        \ is based on http://{SAS API Portal}/reference/schema/property/v1/property.json.\n"
      type: "object"
      properties:
        name:
          type: "string"
          description: "The property name."
        value:
          type: "string"
          description: "The property value."
    actionSummary:
      title: "Action Summary"
      type: "object"
      description: "A representation of an action against a document or link.\nFor\
        \ example, an action could be: <ul>\n  <li>Created the document</li>\n  <li>Added\
        \ a comment</li>\n  <li>Deleted an attachment</li>\n</ul>\nThe summary version\
        \ of this representation omits detailed information about the action.\n"
      properties:
        actionId:
          type: "string"
          description: "An ID that represents this action.\n"
        action:
          type: "string"
          description: "A localized message that describes the action. For example,\
            \ \"Attached a file\".\n"
        actionType:
          type: "string"
          description: "A string that represents this action. This can be used to\
            \ filter actions.\n"
          enum:
          - "DOCUMENT_CREATE"
          - "DOCUMENT_EDIT"
          - "DOCUMENT_DELETE"
          - "DOCUMENT_UNKNOWN"
          - "RELATIONSHIP_CREATE"
          - "RELATIONSHIP_EDIT"
          - "RELATIONSHIP_DELETE"
          - "RELATIONSHIP_UNKNOWN"
          - "OBJECT_LINKED"
          - "OBJECT_LINK_EDIT"
          - "OBJECT_UNLINKED"
          - "OBJECT_LINK_UNKNOWN"
          - "COMMENT_CREATE"
          - "COMMENT_EDIT"
          - "FILE_UPLOAD"
          - "FILE_DELETE"
        objectType:
          type: "string"
          description: "The type of the underlying document or link to which the action\
            \ was applied.\n"
        objectId:
          type: "string"
          description: "The ID of the underlying document or link to which the action\
            \ was applied.\n"
        objectVersion:
          type: "string"
          description: "The version of the underlying document or link to which the\
            \ action was applied.\n"
        createdBy:
          type: "string"
          description: "The ID of the user who created this action.\n"
        createdAt:
          type: "string"
          format: "date-time"
          description: "The timestamp that indicates when this action was created.\n"
        links:
          type: "array"
          items:
            $ref: "#/components/schemas/sasLink"
          description: "A list of links that are available for this action. This contains\
            \ the link to fetch the full action representation.\n"
        version:
          type: "integer"
          description: "The version number of the Action Summary MediaType.\n"
    actionSummaryCollection:
      title: "Action Summary Collection"
      description: "A collection of action summaries.\n"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/actionSummary"
            description: "An array of action summaries."
    subActionItem:
      title: "Sub-Action Item"
      type: "object"
      description: "An action item representation of a sub-action that occurred inside\
        \ the scope of an action. For example, the \"Deleted child objects\" action\
        \ inside an \"Edited the document\" action.\n"
      properties:
        type:
          type: "string"
          enum:
          - "subItem"
          description: "A constant value for this action item that allows clients\
            \ to display the sub-action item correctly.\n"
        action:
          type: "string"
          description: "A localized message that represents this sub-action item.\n"
          example: "Edited child objects."
        items:
          type: "array"
          items:
            anyOf:
            - $ref: "#/components/schemas/subActionItem"
            - $ref: "#/components/schemas/labelActionItem"
            - $ref: "#/components/schemas/tableActionItem"
          description: "A list of action items under this sub-action item. This array\
            \ can contain: <ul>\n  <li>Sub-Action Items</li>\n  <li>Label Action Items</li>\n\
            \  <li>Table Action Items</li>\n</ul>\n"
    labelActionItem:
      title: "Label Action Item"
      type: "object"
      description: "An action item representation that can be used to display a message\
        \ to the user.\n"
      properties:
        type:
          type: "string"
          enum:
          - "labelItem"
          description: "A constant value for this action item that allows clients\
            \ to display the label action item correctly.\n"
        label:
          type: "string"
          description: "The message that is displayed to the user.\n"
        labelType:
          type: "string"
          enum:
          - "STRING"
          - "HTML"
          description: "Indicates the type of the label to the client for formatting\
            \ and display purposes.\n"
        items:
          type: "array"
          items:
            anyOf:
            - $ref: "#/components/schemas/subActionItem"
            - $ref: "#/components/schemas/labelActionItem"
            - $ref: "#/components/schemas/tableActionItem"
          description: "A list of action items under this label action item. This\
            \ array can contain: <ul>\n  <li>Sub-Action Items</li>\n  <li>Label Action\
            \ Items</li>\n  <li>Table Action Items</li>\n</ul>\n"
    tableActionItem:
      title: "Table Action Item"
      type: "object"
      description: "An action item representation that can be used to present a table\
        \ to the user.\n"
      properties:
        type:
          type: "string"
          enum:
          - "tableItem"
          description: "A constant value for this action item that allows clients\
            \ to display the table action item correctly.\n"
        action:
          type: "string"
          description: "A localized message that represents this table action item.\n"
          example: "Changed fields."
        headings:
          type: "array"
          description: "The localized headers for the table.\n"
          items:
            type: "string"
        rows:
          type: "array"
          description: "A list of table rows. Each row contains a list of action table\
            \ values.\n"
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/actionTableValue"
    action:
      title: "Action"
      type: "object"
      description: "A representation of an action against a document or link.\nFor\
        \ example, an action could be: <ul>\n  <li>Created the document</li>\n  <li>Added\
        \ a comment</li>\n  <li>Deleted an attachment</li>\n</ul>\nThis representation\
        \ contains detailed information about the action. For example, field value\
        \ changes that occur when a document is edited.\n"
      allOf:
      - $ref: "#/components/schemas/actionSummary"
      - type: "object"
        properties:
          items:
            type: "array"
            items:
              type: "object"
            description: "A list of action items. This represents detailed information\
              \ about the action. This array can contain: <ul>\n  <li>Sub-Action Items</li>\n\
              \  <li>Label Action Items</li>\n  <li>Table Action Items</li>\n</ul>\n"
    actionTableValue:
      title: "Action Table Value"
      type: "object"
      description: "Represents a table cell within a table action item. If the field\
        \ value is masked, the representation includes a field restriction object\
        \ containing some additional masking metadata for the field value.\n"
      properties:
        value:
          type: "object"
          description: "The value of the cell. If the field is configured for masking,\
            \ this value is replaced with dots.\n"
        fieldRestriction:
          $ref: "#/components/schemas/fieldRestriction"
        clientFieldProperties:
          $ref: "#/components/schemas/clientFieldProperties"
        type:
          type: "string"
          enum:
          - "BOOLEAN"
          - "STRING"
          - "INTEGER"
          - "DECIMAL"
          - "DATE"
          - "TIMESTAMP"
          - "TIMESTAMP_WITH_TIME_ZONE"
          - "JSON"
          - "HTML"
          - "REFERENCE_DATA"
          - "USER_GROUP"
          description: "Indicates the type of value to the client. This is for display\
            \ and format purposes.\n"
    actionType:
      title: "Action Type"
      type: "object"
      description: "Represents a type of action that the client can filter on.\n"
      properties:
        actionType:
          type: "string"
          description: "A unique string that represents an action.\nFor example: <ul>\n\
            \  <li>DOCUMENT_EDIT</li>\n  <li>COMMENT_CREATE</li>\n  <li>FILE_UPLOAD</li>\n\
            </ul>\nWhen requesting filtered action history, the client passes this\
            \ string in the filter parameter.\n"
        localizedMessage:
          type: "string"
          description: "A localized message that represents this filter option. This\
            \ could be displayed in a drop-down filter selection menu.\n"
    actionTypeCollection:
      title: "Action Type Collection"
      type: "object"
      description: "A collection of action types.\n"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/actionType"
            description: "An array of action types."
    task:
      title: "Task"
      description: "A Task is one unit of work that makes up a Job. It might succeed\
        \ or fail independent of other Tasks in the same Job."
      x-sas-type: "Task"
      x-sas-media-type:
        name: "application/vnd.sas.job.monitor.task"
        version: 1
      required:
      - "version"
      - "name"
      - "parameters"
      properties:
        version:
          type: "integer"
          description: "This media type's schema version number. This representation\
            \ is version 1."
        id:
          type: "string"
          description: "A system-assigned unique identifier (UUID) for this task"
        name:
          type: "string"
          description: "A human readable name that could help in identifying this\
            \ task"
        description:
          type: "string"
          description: "A brief description of this task"
        status:
          type: "string"
          enum:
          - "pending"
          - "running"
          - "cancelled"
          - "completed"
          - "failed"
          - "reverted"
          - "invalid"
          description: "Execution status of this task"
        message:
          type: "string"
          description: "Messages - generally about any failures or cancellations"
        parent:
          type: "string"
          description: "UUID of the parent job or task"
        startedAt:
          type: "string"
          format: "date-time"
          description: "Execution start timestamp"
        endedAt:
          type: "string"
          format: "date-time"
          description: "Execution end timestamp"
        parameters:
          type: "object"
          description: "Parameters required for the task"
          additionalProperties:
            type: "string"
        subTasks:
          type: "array"
          description: "Subtasks, if any"
          items:
            $ref: "#/components/schemas/task"
    job:
      title: "Job"
      description: "A Job describes a bundle of work to be performed asynchronously.\
        \ It consists of one or more Tasks."
      x-sas-type: "Job"
      x-sas-media-type:
        name: "application/vnd.sas.job.monitor.job"
        version: 1
      required:
      - "version"
      - "parameters"
      properties:
        version:
          type: "integer"
          description: "This media type's schema version number. This representation\
            \ is version 1."
        id:
          type: "string"
          description: "A system-assigned unique identifier (UUID) for this job"
        name:
          type: "string"
          description: "A human readable name that could help in identifying this\
            \ job"
        description:
          type: "string"
          description: "A brief description of this job"
        tags:
          type: "array"
          description: "A list of tags that could be used to search this job"
          items:
            type: "string"
        status:
          type: "string"
          enum:
          - "pending"
          - "running"
          - "cancelled"
          - "completed"
          - "failed"
          - "reverted"
          - "invalid"
          description: "Execution status of this job"
        message:
          type: "string"
          description: "Messages - generally about any failures or cancellations"
        startedBy:
          type: "string"
          description: "User who submitted this job for execution"
        startedAt:
          type: "string"
          format: "date-time"
          description: "Execution start timestamp"
        endedAt:
          type: "string"
          format: "date-time"
          description: "Execution end timestamp"
        parameters:
          type: "object"
          description: "Parameters required for the job"
          additionalProperties:
            type: "string"
        tasks:
          type: "array"
          description: "Tasks that are part of this job"
          items:
            $ref: "#/components/schemas/task"
    dataStore:
      title: "Data Store"
      type: "object"
      description: "Information that is used for connecting to a database such as\
        \ Oracle or SQL Server."
      allOf:
      - $ref: "#/components/schemas/auditableObject"
      - type: "object"
        properties:
          name:
            type: "string"
            description: "The name of the data store."
          type:
            type: "string"
            description: "The type of the data store."
            enum:
            - "RELATIONAL"
          defaultSchemaName:
            type: "string"
            description: "The default schema name to be used for the data store."
          version:
            type: "integer"
            description: "The internal version number for this data store."
          connectionType:
            type: "string"
            description: "The type of database the system."
            enum:
            - "internal_postgres"
            - "postgres"
            - "db2"
            - "MySQL"
            - "oracle"
            - "SQL Server"
            - "teradata"
          host:
            type: "string"
            description: "The host name for the database server."
          port:
            type: "string"
            description: "The TCP/IP port number for connecting to the database server."
          username:
            type: "string"
            description: "The user name for connecting to the database server."
          password:
            type: "string"
            description: "The password for connecting to the database server."
          databaseNameOrServiceName:
            type: "string"
            description: "The name of the database to which to connect."
          schema:
            type: "string"
            description: "The name of the target schema within the database."
          reindexRequired:
            type: "boolean"
            readOnly: true
            description: "Specifies whether all entity, relationship, and transaction\
              \ types need to be reindexed after making an update to the data store.\n"
          isCasDistributedDataLoadSupported:
            type: "boolean"
            readOnly: true
            description: "Specifies whether the data store supports the CAS \"Distributed\
              \ Data Load\" feature."
          initialSize:
            type: "integer"
            description: "The initial starting size for the database connection pool."
          maxIdle:
            type: "integer"
            description: "The maximum number of idle connections that are allowed\
              \ in the connection pool."
          minIdle:
            type: "integer"
            description: "The minimum number of idle connections that are allowed\
              \ in the connection pool."
          maxActive:
            type: "integer"
            description: "The maximum number of active connections that are allowed\
              \ in the connection pool."
          handle:
            type: "string"
            description: "A string that is used to group key-value pairs that belong\
              \ to a single data store (analogous to a folder). When creating a data\
              \ store, this value must be unique. No other data store can have the\
              \ same \"handle\" value. It is the responsibility of the client to determine\
              \ a unique value.\n"
          urlAppendedParameters:
            type: "string"
            description: "Additional JDBC connection parameters that are appended\
              \ to the end of the connection string."
          advancedProperties:
            type: "object"
            description: "Additional properties that are needed by other modules while\
              \ interacting with this data store (for example, when loading data into\
              \ CAS)."
            allOf:
            - $ref: "#/components/schemas/sasProperties"
          assignedTimeZone:
            type: "string"
            description: "The default timezone for timestamp values that are stored\
              \ in the database."
      example:
        $ref: "#/components/examples/dataStoreExample"
    dataStoreCredentials:
      title: "Data Store Credentials"
      type: "object"
      description: "The user name and password for a data store."
      properties:
        username:
          type: "string"
          description: "The user name of the data store credentials."
        password:
          type: "string"
          description: "The password of the data store credentials. This value is\
            \ encoded with Base64."
      example:
        $ref: "#/components/examples/dataStoreCredentialExample"
    dataStoreSupportedType:
      title: "Data Store Supported Type"
      type: "object"
      description: "A supported database for a data store."
      properties:
        type:
          type: "string"
          description: "The type of database."
        requiredFields:
          type: "array"
          items:
            type: "string"
          description: "The required fields for the data store with the database type."
        defaultAdditionalFields:
          description: "A map of additional default fields for the data store with\
            \ the database type."
          type: "object"
          additionalProperties:
            properties:
              fieldKey:
                type: "string"
              fieldValue:
                type: "string"
    tableMetadata:
      title: "Table Metadata"
      type: "object"
      description: "The metadata for a data store table."
      properties:
        type:
          type: "string"
          description: "The type of database."
        name:
          type: "string"
          description: "The name of the table."
        schema:
          type: "string"
          description: "The database schema."
        dataStoreName:
          type: "string"
          description: "The name of the data store."
        databaseProductName:
          type: "string"
          description: "The name of the database."
        selectable:
          type: "boolean"
          description: "Specifies whether the table is selectable. Set to True if\
            \ the table is selectable and False if it is not selectable."
        columns:
          type: "array"
          items:
            $ref: "#/components/schemas/columnMetadata"
          description: "A list of all column metadata for the table."
    columnMetadata:
      title: "Table Metadata"
      type: "object"
      description: "The metadata for a data store table."
      properties:
        dataType:
          $ref: "#/components/schemas/columnDataType"
        name:
          type: "string"
          description: "The column name."
        length:
          type: "integer"
          description: "The column length."
        precision:
          type: "integer"
          description: "The precision of the column."
        scale:
          type: "integer"
          description: "The scale of the column."
        required:
          type: "boolean"
          description: "Specifies whether the value in the column is a required value.\
            \ Set to True if the value is required."
        primaryKeyColumn:
          type: "boolean"
          description: "Specifies whether the column is a primary key. Set to True\
            \ if the column is a primary key."
        ordinalPosition:
          type: "integer"
          description: "The ordinal position of the column."
        primaryKeySeqNo:
          type: "integer"
          description: "The primary key sequence number."
    columnDataType:
      type: "string"
      description: "The enum for all the column data types."
      enum:
      - "BOOLEAN"
      - "STRING"
      - "SMALLINT"
      - "INTEGER"
      - "LONG"
      - "FLOAT"
      - "DOUBLE"
      - "NUMERIC"
      - "DATE"
      - "TIMESTAMP"
      - "TIMESTAMP_WITH_TIME_ZONE"
      - "JSON"
      - "OTHER"
    fieldMaskingConfiguration:
      title: "Field Masking Configuration"
      description: "A representation of the masking configuration for a single field.\n"
      type: "object"
      properties:
        currentUserIsAuthorizedToReveal:
          type: "boolean"
          description: "Indicates whether the current user is authorized to reveal\
            \ the masked value."
        revealUrl:
          type: "string"
          description: "A URL that can be used to request the raw (unmasked) value\
            \ of the field."
    fieldRestriction:
      title: "Field Restriction"
      description: "A representation of the set of field restrictions that are applied\
        \ to a single field. Not every type of restriction applies to every field.\
        \ For example, the \"maxLength\" restriction does not apply to numerical fields,\
        \ but \"precision\" and \"scale\" might. Note that many endpoints documented\
        \ in this REST API populate only a subset of these field restrictions (often\
        \ only \"masked\").\n"
      type: "object"
      properties:
        masked:
          $ref: "#/components/schemas/fieldMaskingConfiguration"
        required:
          type: "boolean"
          description: "Indicates whether the field is required."
        readOnly:
          type: "boolean"
          description: "Indicates whether the field can be modified."
        maxLength:
          type: "integer"
          description: "The maximum length of value allowed for the field."
        systemReserved:
          type: "boolean"
          description: "Indicates whether the field is reserved for system use. System-reserved\
            \ fields are not normally writable. Also, they cannot be masked.\n"
        fieldDataType:
          type: "string"
          enum:
          - "REFERENCE_DATA"
          - "USER_GROUP"
          - "BOOLEAN"
          - "STRING"
          - "SMALLINT"
          - "INTEGER"
          - "LONG"
          - "FLOAT"
          - "DOUBLE"
          - "NUMERIC"
          - "DATE"
          - "TIMESTAMP"
          - "TIMESTAMP_WITH_TIME_ZONE"
          - "JSON"
          description: "The data type of the field."
        precision:
          type: "integer"
          description: "The numerical precision of the field."
        scale:
          type: "integer"
          description: "The numerical scale of the field."
        constrainingListName:
          type: "string"
          description: "The reference list that constrains the possible values of\
            \ this field."
        cascadingReferenceDataFilterByCode:
          type: "string"
          description: "The code used to filter the cascading reference data constraining\
            \ the value of this field."
        cascadingReferenceDataFilterByField:
          type: "string"
          description: "The name of the field used to filter the cascading reference\
            \ data constraining the value of this field."
        allowMultipleSelections:
          type: "boolean"
          description: "Indicates whether this field allows multiple selections of\
            \ users and/or groups."
        userSelectionStrategy:
          type: "string"
          enum:
          - "USERS"
          - "GROUPS"
          - "USERS_AND_GROUPS"
          description: "Used with user/group selection fields. The possible values\
            \ are: - \"USERS\": This field can only indicate a set of users. - \"\
            GROUPS\": This field can only indicate a set of groups. - \"USERS_AND_GROUPS\"\
            : This field can indicate a set containing both users and groups.\n"
    restrictedFields:
      title: "Restricted Fields Map"
      description: "Represents all of the field restrictions of a data type as a map\
        \ of field name to field restriction object. The keys of this map are strings\
        \ representing field names. The value mapped by each key is the Field Restriction\
        \ object containing all the field restrictions for the field with that name.\n"
      type: "object"
      additionalProperties:
        $ref: "#/components/schemas/fieldRestriction"
    fieldRestrictions:
      title: "Field Restrictions Bundle"
      description: "Represents a bundle of field restrictions for related data object\
        \ types, as a map of object type name to Restricted Fields Map object. The\
        \ keys of this map are strings representing object type names. The value mapped\
        \ by each key is the Restricted Fields Map object for that data object type.\
        \ The purpose of this representation is to allow the field restrictions for\
        \ a top-level entity type to be bundled with the field restrictions for all\
        \ of its child entity types, in one map. In this case, the top-level entity\
        \ name and the child entity names will all be sibling keys in the Field Restrictions\
        \ Bundle map.\n"
      type: "object"
      additionalProperties:
        $ref: "#/components/schemas/restrictedFields"
    entityTypeExpression:
      title: "Abstract Expression"
      type: "object"
      discriminator:
        propertyName: "type"
      description: "The abstract parent class for expression types. Subclasses include\
        \ the following expression types: <ul>\n  <li>Arithmetic</li>\n  <li>Boolean</li>\n\
        \  <li>Conditional</li>\n  <li>Field Reference</li>\n  <li>Function Call</li>\n\
        \  <li>Literal</li>\n  <li>Logical</li>\n  <li>Named Parameter</li>\n  <li>String</li>\n\
        </ul>\n"
      properties:
        type:
          description: "The type of expression. Valid values include: <ul>\n  <li>FieldRef</li>\n\
            \  <li>Literal</li>\n  <li>StrExpr</li>\n  <li>BoolExpr</li>\n  <li>Function</li>\n\
            \  <li>ArithExpr</li>\n<ul>\n"
          type: "string"
          enum:
          - "Conditional"
          - "FieldRef"
          - "Literal"
          - "StrExpr"
          - "BoolExpr"
          - "Function"
          - "ArithExpr"
    entityTypeExpressionArithmetic:
      title: "Arithmetic Expression"
      type: "object"
      description: "Arithmetic expression of the form: leftOperand operator rightOperand.\
        \ The expression evaluates to a Boolean result.\n"
      allOf:
      - $ref: "#/components/schemas/entityTypeExpression"
      - type: "object"
        properties:
          leftOperand:
            type: "object"
            description: "The left operand that the operator applies to the right\
              \ operands."
            allOf:
            - $ref: "#/components/schemas/entityTypeExpression"
          operator:
            type: "string"
            enum:
            - "ADD"
            - "MINUS"
            - "PROD"
            - "DIV"
            description: "The arithmetic operator for the expression: <ul>\n  <li>`ADD`\
              \ - add</li>\n  <li>`MINUS` - subtract</li>\n  <li>`PROD` - multiply</li>\n\
              \  <li>`DIV` - division</li>\n</ul>\n"
          rightOperand:
            type: "object"
            description: "The operand on the right side to which the left operand\
              \ and the operator are applied."
            allOf:
            - $ref: "#/components/schemas/entityTypeExpression"
    entityTypeExpressionBoolean:
      title: "Boolean Expression"
      type: "object"
      description: "The abstract type that represents a conditional or a logical expression."
      allOf:
      - $ref: "#/components/schemas/entityTypeExpression"
    entityTypeExpressionConditional:
      title: "Conditional Expression"
      type: "object"
      description: "A conditional expression of the form: leftOperand operator rightOperands.\n"
      allOf:
      - $ref: "#/components/schemas/entityTypeExpressionBoolean"
      - type: "object"
        properties:
          leftOperand:
            type: "object"
            description: "The left operand that the operator applies to the right\
              \ operands."
            allOf:
            - $ref: "#/components/schemas/entityTypeExpression"
          operator:
            type: "string"
            description: "The operator for the expression. The supported values are:\
              \ \"eq\" (equal), \"ne\" (not equal), \"gt\" (greater than), \"lt\"\
              \ (less than), \"ge\" (greater than or equal), \"le\" (less than or\
              \ equal), \"in\", \"notIn\", \"between\", \"isNull\", \"isNotNull\"\
              , \"startsWith\", \"endsWith\", and \"contains\".\n"
            enum:
            - "EQ"
            - "NE"
            - "GT"
            - "LT"
            - "GE"
            - "LE"
            - "IN"
            - "NOT_IN"
            - "BETWEEN"
            - "IS_NULL"
            - "IS_NOT_NULL"
            - "STARTS_WITH"
            - "ENDS_WITH"
            - "CONTAINS"
          rightOperands:
            type: "array"
            items:
              $ref: "#/components/schemas/entityTypeExpression"
            description: "An array of expressions on the right side to which the left\
              \ operand and the operator are applied."
    entityTypeExpressionFieldReference:
      title: "Field Reference Expression"
      type: "object"
      description: "A data object field that is used as an Expression in queries and\
        \ SortCriteria."
      allOf:
      - $ref: "#/components/schemas/entityTypeExpression"
      - type: "object"
        properties:
          objectName:
            type: "string"
            description: "The name of the object that is being referenced."
          fieldName:
            type: "string"
            description: "The name of the field within the object that is being referenced."
    entityTypeExpressionFunctionCall:
      title: "Function Call Expression"
      type: "object"
      description: "An expression that makes a function call.\n"
      allOf:
      - $ref: "#/components/schemas/entityTypeExpression"
      - type: "object"
        properties:
          functionName:
            type: "string"
            description: "The name of the function to call. Valid values are: <br/>\
              \ <br/> \"toString\": Convert other data type values into String.\n\
              \              <ul><li>Minimum arguments: 1</li><li>Maximum arguments:\
              \ 2</li></ul>\n              <p>Depending on the underlying data store,\
              \ a second argument can be passed while converting datetime\n      \
              \        values into String. This indicates the format of the returned\
              \ value.\n              The exact behavior is dependent on the underlying\
              \ data store. Refer to the data store documentation for details.</p>\n\
              \"toDate\": Convert other data types to a datetime value.\n        \
              \      <ul><li>Minimum arguments: 1</li><li>Maximum arguments: 2</li></ul>\n\
              \              <p>Depending on the underlying data store, a second argument\
              \ that indicates the format of the source data\n              can be\
              \ passed. The content of the format string is also dependent on the\
              \ underlying data store.\n              Refer to the data store documentation\
              \ for supported formats.</p>\n              <p>Only String input values\
              \ in a format that is supported by the underlying data store are supported.</p>\n\
              \"toNumber\": Convert a String input value into a number. The exact\
              \ behavior is dependent on the underlying data store.<br/> <br/> \"\
              upperCase\": Convert all characters in the input String to uppercase.<br/>\
              \ <br/> \"lowerCase\": Convert all characters in the input String to\
              \ lowercase.<br/> <br/> \"mod\": Calculate modulus of two integer values.<br/>\
              \ <br/> \"pow\": Perform exponentiation of the first argument (number)\
              \ raised to the power of the second argument.<br/>\n"
            enum:
            - "TO_STRING"
            - "TO_DATE"
            - "TO_NUMBER"
            - "UPPERCASE"
            - "LOWERCASE"
            - "MOD"
            - "POW"
          arguments:
            type: "array"
            items:
              $ref: "#/components/schemas/entityTypeExpression"
            description: "An array of parameters to pass to the function."
    entityTypeExpressionLiteral:
      title: "Literal Expression"
      type: "object"
      description: "A literal value to be used in an expression."
      allOf:
      - $ref: "#/components/schemas/entityTypeExpression"
      - type: "object"
        properties:
          value:
            type: "object"
            description: "A literal value that is referenced in an expression."
    entityTypeExpressionLogical:
      title: "Logical Expression"
      type: "object"
      description: "A logical expression of the form: leftOperand operator rightOperand.\
        \ The expression evaluates to a Boolean result.\n"
      allOf:
      - $ref: "#/components/schemas/entityTypeExpressionBoolean"
      - type: "object"
        properties:
          leftOperand:
            type: "object"
            description: "The left operand that the operator applies to the right\
              \ operands."
            allOf:
            - $ref: "#/components/schemas/entityTypeExpression"
          operator:
            type: "string"
            description: "The operator for the expression."
            enum:
            - "AND"
            - "OR"
            - "NOT"
          rightOperand:
            type: "object"
            description: "The operand on the right side to which the left operand\
              \ and the operator are applied."
            allOf:
            - $ref: "#/components/schemas/entityTypeExpression"
    entityTypeExpressionNamedParameter:
      title: "Named Parameter Expression"
      type: "object"
      description: "A named parameter to use when creating parameterized queries for\
        \ repeated calls."
      allOf:
      - $ref: "#/components/schemas/entityTypeExpression"
      - type: "object"
        properties:
          parameterName:
            type: "string"
            description: "The name of the parameter to use in the expression."
    entityTypeExpressionString:
      title: "String Expression"
      type: "object"
      description: "An expression for performing operations on String operands.\n"
      allOf:
      - $ref: "#/components/schemas/entityTypeExpression"
      - type: "object"
        properties:
          leftOperand:
            type: "object"
            description: "The left operand that the operator applies to the right\
              \ operands."
            allOf:
            - $ref: "#/components/schemas/entityTypeExpression"
          operator:
            type: "string"
            description: "The operator for the expression. The supported value is\
              \ \"concat\".\n"
            enum:
            - "CONCAT"
          rightOperand:
            type: "object"
            description: "The operand on the right side to which the left operand\
              \ and the operator are applied."
            allOf:
            - $ref: "#/components/schemas/entityTypeExpression"
    relationshipLink:
      title: "Relationship Link"
      description: "A link between two documents as defined by a relationship type.\
        \ If a field is masked, its value will not appear in the `fieldValues` object."
      properties:
        relationshipTypeName:
          type: "string"
          description: "The name of the relationship type that defines this link."
        relationshipTypeVersion:
          type: "integer"
          description: "The internal Data Hub version of the relationship type."
        relationshipTypeLabel:
          type: "string"
          description: "The display label for the relationship type."
        id:
          type: "string"
          description: "The ID of the link."
        qualifiedTypeName:
          type: "string"
          description: "The qualified name of the relationship type. Qualified names\
            \ are in the format: fromObjectTypeName + \"__\" + relationshipTypeName.\n"
        fromObjectTypeName:
          type: "string"
          description: "The entity type name for the \"From\" side of the relationship\
            \ type."
        fromObjectTypeVersion:
          type: "integer"
          format: "int64"
          description: "The internal Data Hub version for the entity type for the\
            \ \"From\" side of the relationship type.\n"
        fromObjectId:
          type: "string"
          description: "The document ID for the \"From\" side of the relationship\
            \ type."
        fromObjectDisplayLabel:
          type: "string"
          description: "The display label for the document on the \"From\" side of\
            \ the relationship type."
        toObjectTypeName:
          type: "string"
          description: "The entity type name for the \"To\" side of the relationship\
            \ type."
        toObjectTypeVersion:
          type: "integer"
          format: "int64"
          description: "The internal Data Hub version for the entity type for the\
            \ \"To\" side of the relationship type.\n"
        toObjectId:
          type: "string"
          description: "The document ID for the \"To\" side of the relationship type."
        toObjectDisplayLabel:
          type: "string"
          description: "The display label for the document on the \"To\" side of the\
            \ relationship type."
        validFrom:
          type: "string"
          format: "date-time"
          description: "The timestamp value that indicates the starting datetime for\
            \ when the link is valid."
        validTo:
          type: "string"
          format: "date-time"
          description: "The timestamp value that indicates the ending datetime for\
            \ when the link is valid."
        fieldValues:
          type: "object"
          description: "The values for the fields that are defined as the attributes\
            \ of the link.\n"
        restrictedFields:
          type: "object"
          description: "The restrictions that apply to the fields of the link. Currently,\
            \ only masking field restrictions are represented here.\n"
          allOf:
          - $ref: "#/components/schemas/restrictedFields"
        createdAt:
          type: "string"
          format: "date-time"
          description: "The timestamp value that indicates when this link was created."
        lastUpdatedAt:
          type: "string"
          format: "date-time"
          description: "The timestamp value that indicates when this link was last\
            \ modified."
        '@type':
          type: "string"
          description: "Data type that describes the link object. The value is always\
            \ \"DocumentLink\"."
    maskedRelationshipLink:
      title: "Masked Relationship Link"
      description: "A representation of a relationship link that has masked field\
        \ values replaced with dot characters. Fields not configured to be masked\
        \ are represented normally.\n"
      allOf:
      - $ref: "#/components/schemas/relationshipLink"
    relationshipLinkCollection:
      title: "Relationship Link Collection"
      description: "A collection of relationship links."
      type: "object"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/relationshipLink"
            description: "The array that contains the relationship links."
    maskedRelationshipLinkCollection:
      title: "Masked Relationship Link Collection"
      description: "A collection of masked relationship links."
      type: "object"
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/maskedRelationshipLink"
            description: "The array that contains the masked relationship links."
    minimallyMaskedRelationshipLink:
      title: "Minimally-Masked Relationship Link"
      description: "A representation of a Relationship Link that has the minimal amount\
        \ of field masking applied. That is, for each masked field, if the requesting\
        \ user is authorized to reveal its value, the value is unmasked in this representation.\
        \ Otherwise, the value will remain masked.\n"
      allOf:
      - $ref: "#/components/schemas/relationshipLink"
      example:
        $ref: "#/components/examples/relationshipLinkExample"
    minimallyMaskedRelationshipLinkCollection:
      title: "Minimally-Masked Relationship Link Collection"
      description: "A collection of minimally-masked Relationship Links."
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/minimallyMaskedRelationshipLink"
            description: "The array that contains the minimally-masked relationship\
              \ links."
    icon:
      title: "Icon"
      type: "object"
      description: "The information that describes an icon."
      allOf:
      - $ref: "#/components/schemas/auditableObject"
      - type: "object"
        properties:
          name:
            type: "string"
            description: "The name of the icon."
          imageType:
            type: "string"
            description: "The type of the icon's image."
            enum:
            - "GIF"
            - "JPEG"
            - "PNG"
            - "SVG"
            - "SVG+XML"
          imageLocation:
            type: "string"
            description: "The location where the image is stored."
          bytes:
            type: "string"
            format: "binary"
            description: "The raw binary data for the icon."
          version:
            type: "integer"
            description: "The internal Data Hub version for this icon."
    dataField:
      title: "Data Field"
      type: "object"
      description: "Reserved for internal use. An abstract object representing the\
        \ metadata that all data object fields have in common."
      allOf:
      - $ref: "#/components/schemas/localizableObject"
      - type: "object"
        properties:
          name:
            type: "string"
            description: "The name of the field."
          columnName:
            type: "string"
            description: "The name of the database column that is associated with\
              \ this field."
          dataType:
            type: "string"
            description: "The type of the database column that is associated with\
              \ this field. Note: The \"json\" data type is only partially supported\
              \ for internal use with Postgres.\n"
            enum:
            - "BOOLEAN"
            - "STRING"
            - "SMALLINT"
            - "INTEGER"
            - "LONG"
            - "FLOAT"
            - "DOUBLE"
            - "NUMERIC"
            - "DATE"
            - "TIMESTAMP"
            - "TIMESTAMP_WITH_TIME_ZONE"
            - "REFERENCE_DATA"
            - "JSON"
          length:
            type: "integer"
            description: "The size of the data type. This value is used primarily\
              \ for managing the length of string fields.\n"
          precision:
            type: "integer"
            description: "The number of significant digits for a numeric type. The\
              \ maximum value for precision is database dependent. For example, it\
              \ is 38 for Oracle.\n"
          scale:
            type: "integer"
            description: "The number of decimal digits for a numeric type. Integers\
              \ have a scale of zero. A negative scale value can be used to control\
              \ the maximum number of digits to the left of the decimal point.\n"
          required:
            type: "boolean"
            description: "Indicates whether the field value must be provided."
          primaryKeyField:
            type: "boolean"
            description: "Indicates whether the field value is used as part of primary\
              \ key. Primary key fields cannot be masked."
          unique:
            type: "boolean"
            description: "Indicates whether duplicate values are allowed for the field."
          autoGenerated:
            type: "boolean"
            description: "Indicates whether the values for this field are automatically\
              \ generated."
          systemReserved:
            type: "boolean"
            description: "Indicates whether modifications are allowed for this field\
              \ type. Some fields are created for internal use only. System reserved\
              \ fields cannot be masked.\n"
          displayIndex:
            type: "integer"
            description: "The order in which fields occur within the database. This\
              \ index is one-based."
          version:
            type: "integer"
            description: "The internal Data Hub version for this field."
          constrainingListName:
            type: "string"
            description: "The name of a Reference List that determines the list of\
              \ valid values for this field."
          userSelectionStrategy:
            type: "string"
            description: "Indicates the types of values that are allowed in this field."
            enum:
            - "USERS"
            - "GROUPS"
            - "USERS_AND_GROUPS"
          allowMultipleSelections:
            type: "boolean"
            description: "Indicates whether multiple selections are allowed."
          primaryKeySeqNo:
            type: "integer"
            description: "The position this field occupies in a primary key. This\
              \ index is one-based."
          readOnly:
            type: "boolean"
            description: "Indicates whether modifications are allowed for this field\
              \ type."
          indexedForSearch:
            type: "boolean"
            description: "Indicates whether this field should be added to the search\
              \ index."
          logicalDataType:
            type: "string"
            enum:
            - "USER_GROUP"
            - "REFERENCE_DATA"
            description: "Optional data subtype value for handling user groups and\
              \ reference data."
          masked:
            type: "boolean"
            description: "Indicates whether this field should be masked from users\
              \ and groups that are not authorized to reveal the masking. Fields cannot\
              \ be masked if they are system reserved, if they participate in a primary\
              \ key, or if they are referenced in a Relationship Type or Transaction\
              \ Type's join configuration.\n"
          authorizedToRevealMasked:
            type: "array"
            items:
              $ref: "#/components/schemas/userGroupChooserSelection"
            description: "A list of users or groups that identifies who is authorized\
              \ to reveal the field if it is masked."
          primaryKeyUserSelected:
            type: "boolean"
            description: "Indicates whether the primary key was specified by the user\
              \ or by the database schema.  This value is true if the database table\
              \ does not define a primary key field or if a specified key is different\
              \ from the underlying schema. Note: In most cases, this value is false\
              \ because the primary key definition exactly matches the underlying\
              \ database schema.\n"
          clientFieldProperties:
            $ref: "#/components/schemas/clientFieldProperties"
    linkableObject:
      title: "Linkable Object"
      type: "object"
      description: "Reserved for internal use. Abstract object that contains links\
        \ to other resources."
      properties:
        links:
          type: "array"
          items:
            $ref: "#/components/schemas/sasLink"
          description: "A list of vnd.sas.link objects as per Link representation."
    auditableObject:
      title: "Auditable Object"
      type: "object"
      description: "Reserved for internal use. An abstract object for handling audit\
        \ information."
      properties:
        id:
          type: "integer"
          description: "The primary key that uniquely identifies this metadata object."
        createdBy:
          type: "string"
          description: "The user ID that created this metadata object."
        createdAt:
          type: "string"
          format: "date-time"
          description: "The timestamp that indicates when this metadata object was\
            \ created."
        lastUpdatedBy:
          type: "string"
          description: "The user ID that most recently modified this metadata object."
        lastUpdatedAt:
          type: "string"
          format: "date-time"
          description: "The timestamp that indicates when this metadata object was\
            \ last modified."
    localizableObject:
      title: "Localizable Object"
      type: "object"
      description: "Reserved for internal use. An abstract object for handling the\
        \ localizable label and description."
      allOf:
      - $ref: "#/components/schemas/auditableObject"
      - type: "object"
        properties:
          label:
            type: "string"
            description: "The locale neutral label for this metadata object."
          description:
            type: "string"
            description: "The locale neutral description for this metadata object."
          localizedLabels:
            type: "array"
            description: "The localized labels that are associated with this metadata\
              \ object."
            items:
              $ref: "#/components/schemas/labelLocalized"
          localizedDescriptions:
            type: "array"
            description: "The localized descriptions that are associated with this\
              \ metadata object."
            items:
              $ref: "#/components/schemas/descriptionLocalized"
    dataObject:
      title: "Data Object"
      type: "object"
      description: "Reserved for internal use. An abstract object for representing\
        \ an object that is associated with a data table."
      allOf:
      - $ref: "#/components/schemas/localizableObject"
      - type: "object"
        properties:
          name:
            type: "string"
            description: "The name of this metadata object."
          dataStoreName:
            type: "string"
            description: "The name of the data store where this type of metadata is\
              \ stored."
          tableName:
            type: "string"
            description: "The name of the database table where this type of metadata\
              \ is stored."
          systemReserved:
            type: "boolean"
            description: "Specifies whether this metadata object is reserved for internal\
              \ use only."
          historyEnabled:
            type: "boolean"
            description: "Specifies whether changes to instances of this entity will\
              \ be audited."
          version:
            type: "integer"
            description: "The internal Data Hub version for this metadata object."
          validFromFieldName:
            type: "string"
            description: "The name of the field that contain the validFrom date/time\
              \ value."
          validToFieldName:
            type: "string"
            description: "The name of the field that contains the validTo date/time\
              \ value."
          lastUpdatedAtTimeFieldName:
            type: "string"
            description: "The name of the field that contains the last updated date/time\
              \ value."
          createdAtTimeFieldName:
            type: "string"
            description: "The name of the field that contains the creation date/time\
              \ value."
          displayTextFields:
            type: "array"
            description: "Specifies the fields to be concatenated to form the display\
              \ label. The values of any masked fields will appear in their raw, unmasked\
              \ form in the display label.\n"
            items:
              $ref: "#/components/schemas/sortableNameReference"
          dataStoreAssignedTimeZone:
            type: "string"
            description: "The value of the \"assignedTimeZone\" property in the data\
              \ store that is associated with this metadata object. This property\
              \ is read-only.\n"
    descriptionLocalized:
      title: "Localized Description"
      description: "The description text that is associated with a specific locale."
      allOf:
      - $ref: "#/components/schemas/auditableObject"
      - type: "object"
        properties:
          version:
            type: "integer"
            description: "The internal Data Hub version for the localized text entry."
          locale:
            type: "string"
            description: "A standardized two letter language and two letter country\
              \ code. Here are some examples: \"en-GB\", \"en-US\", and \"zh-CN\"\
              .\n"
            example: "en-US"
          description:
            type: "string"
            description: "The text value that is expressed in a specific language."
    labelLocalized:
      title: "Localized Label"
      description: "The description text that is associated with a specific locale."
      allOf:
      - $ref: "#/components/schemas/auditableObject"
      - type: "object"
        properties:
          version:
            type: "integer"
            description: "The internal Data Hub version for the localized text entry."
          locale:
            type: "string"
            description: "A standardized two letter language and two letter country\
              \ code. Here are some examples: \"en-GB\", \"en-US\", and \"zh-CN\"\
              .\n"
            example: "en-US"
          label:
            type: "string"
            description: "The text value that is expressed in a specific language."
    sortCriteria:
      title: "Sort Criteria"
      description: "The criteria that specify how to sort a collection."
      properties:
        fieldName:
          type: "string"
          description: "The name of the field."
        sortOrder:
          type: "string"
          description: "The order in which to sort the field."
          enum:
          - "asc"
          - "desc"
    userGroupChooserSelection:
      title: "User Group Chooser Selection"
      description: "A user or group account."
      properties:
        id:
          type: "string"
          description: "The name of the user or group."
        type:
          type: "string"
          description: "Denotes whether the account is a user or group."
          enum:
          - "user"
          - "group"
    numberFieldProperties:
      title: "Number Field Properties"
      description: "A representation of the set of client field properties that have\
        \ been set for the given number field.\n"
      type: "object"
      properties:
        disableThousandsSeparator:
          type: "boolean"
          description: "When enabled, the value of the field appears without the thousands\
            \ separator grouping.\n"
    clientFieldProperties:
      title: "Client Field Properties"
      description: "A representation of the set of client field properties that have\
        \ been set for the given field.\n"
      oneOf:
      - $ref: "#/components/schemas/numberFieldProperties"
    clientFieldPropertiesFieldNameMap:
      title: "Client Field Properties Field-Name Map"
      description: "Represents all of the client field properties of a data type as\
        \ a map of the field name to its corresponding extended field properties object.\
        \ The keys of this map are strings representing field names. The value mapped\
        \ by each key is an Extended Field Properties object containing all the client\
        \ field properties for the field with that name corresponding to the field's\
        \ data type (if applicable).\n"
      type: "object"
      additionalProperties:
        $ref: "#/components/schemas/clientFieldProperties"
    clientFieldPropertiesObjectMap:
      title: "Client Field Properties Object Map"
      description: "Represents a bundle of client field properties for related data\
        \ object types, as a map of object type name to a Field Properties Map object.\
        \ The keys of this map are strings representing object type names. The value\
        \ mapped by each key is the Field Properties Field-Name Map object  for that\
        \ data object type.\n"
      type: "object"
      additionalProperties:
        $ref: "#/components/schemas/clientFieldPropertiesFieldNameMap"
    file:
      title: "File Association Object"
      type: "object"
      example:
        $ref: "#/components/examples/fileExample"
      description: "The metadata for a file associated that is with a document. The\
        \ actual file content is stored by the Files service.\n"
      allOf:
      - $ref: "#/components/schemas/linkableObject"
      - type: "object"
        properties:
          id:
            type: "string"
            format: "uuid"
            description: "A UUID that uniquely identifies this file."
          name:
            type: "string"
            description: "The name of the file."
          originalName:
            type: "string"
            description: "The original name of the file when it was uploaded."
          category:
            type: "string"
            description: "The category to which the file belongs."
          location:
            type: "string"
            description: "A URI for the content of the file."
          type:
            type: "string"
            description: "The MIME type of the file."
          size:
            type: "integer"
            format: "base64"
            description: "The size (in KB) of the file."
          description:
            type: "string"
            description: "A description of the file."
          properties:
            type: "object"
            description: "The properties to associate with the file."
            additionalProperties:
              type: "string"
          uploadedAt:
            type: "string"
            format: "date-time"
            description: "The timestamp that indicates when the file was uploaded."
          uploadedBy:
            type: "string"
            description: "The user who uploaded the file."
          extractedContent:
            type: "string"
            description: "Any content that has been extracted for indexing. If the\
              \ file association is an external link, this field can be used to provide\
              \ extracted content that will be indexed.\n"
          isLink:
            type: "boolean"
            description: "Identifies the location of the content. True is assigned\
              \ if the file association is a link to an external file. False is assigned\
              \ if the file has been uploaded to the system as an attachment. This\
              \ field is read-only. Incoming values are ignored.\n"
    fileCollection:
      title: "File Association Collection"
      type: "object"
      description: "A list of files."
      allOf:
      - $ref: "#/components/schemas/sasCollection"
      - type: "object"
        required:
        - "items"
        properties:
          items:
            type: "array"
            items:
              $ref: "#/components/schemas/file"
            description: "The array that contains the files."
    conditionEvaluationRequest:
      title: "Condition Evaluation Request"
      type: "object"
      description: "A request to evaluate a condition against a specific object.\n"
      required:
      - "conditionId"
      - "objectTypeName"
      - "objectId"
      properties:
        conditionId:
          type: "string"
          description: "The ID of the condition to evaluate. This condition must be\
            \ applicable to the entity type  of the object that this request specifies.\n"
        objectTypeName:
          type: "string"
          description: "The entity type of the object that this request specifies.\n"
        objectId:
          type: "string"
          description: "The ID of the object that this request specifies.\n"
    conditionEvaluationResponse:
      title: "Condition Evaluation Response"
      type: "object"
      description: "The response that is generated when a condition is evaluated against\
        \ an object.\n"
      required:
      - "requested"
      properties:
        requested:
          description: "The request specification to which this object responds."
          type: "object"
          allOf:
          - $ref: "#/components/schemas/conditionEvaluationRequest"
        result:
          description: "The result of a successfully completed evaluation. This property\
            \ is omitted if the evaluation fails.\n"
          type: "boolean"
        errorCode:
          description: "An error code that explains why the evaluation failed. This\
            \ property is omitted if the evaluation succeeds.\n"
          type: "string"
        errorMessage:
          description: "An error message that explains why the evaluation failed.\
            \ This property is omitted if the evaluation succeeds.\n"
          type: "string"
    bulkConditionEvaluationRequest:
      title: "Bulk Condition Evaluation Request"
      type: "object"
      description: "A request to process multiple condition evaluation requests at\
        \ the same time.\n"
      required:
      - "requests"
      properties:
        requests:
          description: "A set of condition evaluation requests to be processed."
          type: "array"
          items:
            $ref: "#/components/schemas/conditionEvaluationRequest"
    bulkConditionEvaluationResponse:
      title: "Bulk Condition Evaluation Response"
      type: "object"
      description: "The results from processing a bulk condition evaluation request.\
        \ Individual requests succeed and fail independently, and successes are reported\
        \ alongside failures in the responses.\n"
      required:
      - "responses"
      properties:
        responses:
          description: "The results of processing the condition evaluation requests."
          type: "array"
          items:
            $ref: "#/components/schemas/conditionEvaluationResponse"
    entityType:
      title: "Entity Type"
      description: "The metadata that defines a class of entities. This definition\
        \ includes a list of fields, language-specific labels, icons, and other relevant\
        \ information.\n"
      allOf:
      - $ref: "#/components/schemas/dataObject"
      - type: "object"
        properties:
          type:
            type: "string"
            enum:
            - "MANAGED"
            - "SOURCE"
            description: "Indicates whether the entity type is managed internally\
              \ or exists in an external read-only database: <ul>\n  <li>`MANAGED`\
              \ - an internal entity type</li>\n  <li>`SOURCE` - an external entity\
              \ type</li>\n</ul>\n"
          markerColor:
            type: "string"
            description: "The color that is used to display the marker for this entity\
              \ type on a network diagram."
            example: "#9d2b12"
          nodeShape:
            type: "string"
            description: "The shape that is used to display the marker for this entity\
              \ type on a network diagram.\n"
            enum:
            - "circle"
            - "square"
            - "diamond"
            - "ellipse"
            - "hexagon"
            - "pentagon"
            - "triangle"
          nodeColor:
            type: "string"
            description: "The color that is used to display the marker for this entity\
              \ type on a network diagram.\n"
            example: "#F0F1F2"
          borderColor:
            type: "string"
            description: "The color that is used to display the border for this entity\
              \ type on a network diagram.\n"
            example: "#F0F1F2"
          borderWidth:
            type: "number"
            format: "double"
            description: "The width of the border when displaying this entity type\
              \ as a selected node on a network diagram.\n"
          scale:
            type: "number"
            format: "double"
            description: "A value that adjusts the relative size when selecting a\
              \ node of this entity type on a network diagram.  The value is applied\
              \ as a ratio to 1. For example, a value of 2 doubles the size and a\
              \ value of 1 does not change the size.\n"
          styles:
            type: "array"
            items:
              $ref: "#/components/schemas/entityStyle"
            description: "Additional styling that is conditional."
          elementGroupRoot:
            type: "boolean"
            description: "Indicates whether this entity type is the root for an element\
              \ group."
          indexedForSearch:
            type: "boolean"
            description: "Indicates whether this entity type should be indexed for\
              \ full text searching."
          fields:
            description: "An array that contains the fields that are associated with\
              \ this entity type."
            type: "array"
            items:
              $ref: "#/components/schemas/entityTypeField"
          relationshipsFrom:
            description: "A collection of relationships that point from this entity\
              \ type."
            type: "array"
            items:
              $ref: "#/components/schemas/relationshipType"
          relationshipsTo:
            description: "A collection of relationships that point toward this entity\
              \ type."
            type: "array"
            items:
              $ref: "#/components/schemas/relationshipType"
          defaultRegularIcon:
            description: "The icon that is displayed in the Network-Link Diagram."
            type: "object"
            allOf:
            - $ref: "#/components/schemas/icon"
          defaultMapIcon:
            description: "Deprecated. Should not be used."
            type: "object"
            allOf:
            - $ref: "#/components/schemas/icon"
          parentName:
            type: "string"
            description: "The name of the parent entity type for this entity type.\n"
          allowElementGroupRootAssignment:
            type: "boolean"
            description: "Indicates whether this entity can be used as an element\
              \ group root."
          deleteTableName:
            type: "string"
            description: "The name of SQL table where deleted records are tracked."
          urnFormat:
            type: "string"
            description: "The URN format string that is used to automatically generate\
              \ primary keys."
          urnLength:
            type: "integer"
            description: "The maximum length of the generated URN."
          urnStartValue:
            type: "integer"
            format: "int64"
            description: "If sequential numbers are used as part of the URN, the start\
              \ value to use for that sequence."
          urnType:
            type: "string"
            description: "The type of URN generation that this entity uses."
            enum:
            - "UUID"
            - "RANDOM_DIGITS"
            - "SEQUENTIAL"
          requireSearchBeforeCreate:
            type: "boolean"
            description: "Indicates whether a search operation must be performed before\
              \ inserting a new instance of this entity. Set to true to require this.\n"
          enableCasDistributedDataLoad:
            type: "boolean"
            description: "Indicates whether all nodes on the grid are used for table\
              \ loading. This option affects only data for use with Scenario Administration.\n\
              When set to true, this option uses the value distribution of the first\
              \ numeric column in the table to structure the shared load. Therefore,\
              \ you should confirm that the first numeric column contains well-dispersed\
              \ values.\nFor example, if the first numeric column contains binary\
              \ flag data with a 90/10 value distribution, 90% of the table is loaded\
              \ to one node and the remaining 10% is loaded to a second node.\n"
          attachmentsIndexedForSearch:
            type: "boolean"
            description: "Indicates whether entity type attachment content is added\
              \ to the search index.\nWhen instances of this entity type have files\
              \ attached to them, if this flag is set to \"true\", the contents of\
              \ those attachments are extracted and added to the search index. This\
              \ allows users to find instances of this entity type by searching for\
              \ terms that might be in files attached to them.\nWhen this flag is\
              \ updated from \"false\" to \"true\", if there are attachments to any\
              \ instances of this entity type, the entity type must be reindexed before\
              \ searching can match on attachment contents as described above.\n"
          reindexRequired:
            type: "boolean"
            description: "Read only. Setting this property on input has no effect.\n\
              Certain Update operations on entity types require the entity type to\
              \ be reindexed before changes can be fully active. When such an update\
              \ has been made, this flag is set to \"true\" in the representation\
              \ of the entity type that is provided in the response to the update.\
              \ This is not a persistent state of the entity type. It is provided\
              \ as advice to the client once per such an update. Subsequent responses\
              \ representing the entity type might not have this flag set, even if\
              \ the advised reindex has not been performed.\nFor example, a client\
              \ sends a `PUT` request to update an entity type's `attachmentsIndexedForSearch`\
              \ flag from \"false\" to \"true\". There are instances of the entity\
              \ type that have attachments; therefore reindexing becomes necessary\
              \ before searching can match based on attachment contents. This is indicated\
              \ by a \"true\" value in this property in the response to the `PUT`\
              \ request. Subsequent `GET` or `PUT` requests that return a representation\
              \ of the entity type might have `reindexRequired` set to \"false\" even\
              \ if the entity type has not been reindexed. This is because in that\
              \ subsequent request, no update was made that would require reindexing\
              \ before taking effect.\n"
          mobileOfflineEnabled:
            type: "boolean"
            description: "Indicates whether offline support is enabled for SAS Mobile\
              \ Investigator."
          publishCode:
            type: "string"
            enum:
            - "OPEN"
            - "PUBLISHED"
            - "MODIFIED"
            description: "Indicates the publication status that is assigned to an\
              \ item: <ul>\n  <li>OPEN - Content that is free to customize</li>\n\
              \  <li>PUBLISHED - Content that might be upgraded in the future and\
              \ should be customized with care </li>\n  <li>MODIFIED - Published content\
              \ that has been customized </li>\n</ul>\n"
    entityTypeField:
      title: "Entity Type Field"
      type: "object"
      description: "A single field that is associated with an entity type object."
      allOf:
      - $ref: "#/components/schemas/dataField"
      - type: "object"
        properties:
          ownerName:
            type: "string"
            description: "The name of the owner."
          relatedElementName:
            type: "string"
            description: "The name of the related element."
    entityTypeSummary:
      title: "Entity Type Summary"
      type: "object"
      description: "A short summary of an entity type."
      properties:
        id:
          type: "integer"
          format: "int64"
          description: "The primary key that uniquely identifies this entity type."
        label:
          type: "string"
          description: "The locale neutral label for this entity type."
        name:
          type: "string"
          description: "The name of this entity type."
        dataStoreName:
          type: "string"
          description: "The name of the data store where this type of entity is stored."
        tableName:
          type: "string"
          description: "The name of the database table where this type of entity is\
            \ stored."
        systemReserved:
          type: "boolean"
          description: "Indicates whether this entity is reserved for internal use\
            \ only."
        validFromFieldName:
          type: "string"
          description: "The name of the field that contains the validFrom date/time\
            \ value."
        type:
          type: "string"
          enum:
          - "MANAGED"
          - "SOURCE"
          description: "Indicates whether this entity is managed internally or if\
            \ it resides in an external read-only database."
        markerColor:
          type: "string"
          description: "The color that is used to display the marker for this entity\
            \ on a map."
          example: "#9d2b12"
        indexedForSearch:
          type: "boolean"
          description: "Indicates whether this entity should be indexed for search."
        fields:
          description: "An array that contains the fields that are associated with\
            \ this entity type."
          type: "array"
          items:
            $ref: "#/components/schemas/entityTypeField"
        parentName:
          type: "string"
          description: "The name of parent entity type for this entity type."
        allowElementGroupRootAssignment:
          type: "boolean"
          description: "Indicates whether this entity can be used as an element group\
            \ root."
