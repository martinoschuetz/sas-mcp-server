          , \"earliestValidTo\", \"latestValidFrom\", and \"latestValidTo\" parameters.\n"
      responses:
        "200":
          description: "The request succeeded."
          headers: {}
        "404":
          description: "No documents were found that are associated with the given\
            \ documents and relationship type\n"
        "415":
          description: "The endpoint cannot produce collection items of the type specified\
            \ in the `Accept-Item` header.\n"
    get:
      summary: "Get other documents related to an individual document"
      operationId: "getRelatedDocuments"
      description: "For a given document and relationship type name, finds all the\
        \ documents that are related to the given document according to the\ngiven\
