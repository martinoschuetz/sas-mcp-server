            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
    put:
      summary: "Update a relationship link"
      operationId: "updateRelationshipLinkById"
      description: "Updates an existing relationship link where the relationship type\
        \ has an internal bridge table.\n"
      tags:
      - "Relationship Links"
      parameters:
      - $ref: "#/components/parameters/relationshipLinkDelimitedId"
      - in: "query"
        name: "_includeEntityLabels"
        description: "Specifies whether to compute and include display labels for\
          \ both the \"to\" document and the \"from\" document in the response.\n"
        schema:
          type: "boolean"
          default: false
      - name: "Accept"
        in: "header"
        description: "For relationship link fields that use data masking, it is important\
          \ to avoid accidentally overwriting values in the database with masked values\
          \ that have been loaded by the client. In general, masking dots should not\
          \ be stored in the database. The \"Accept\" HTTP header can be used to control\
          \ how masked fields are handled during updates. If this HTTP  header is\
          \ not provided or is set to \"application/json\", then masked field values\
          \ that are set to null will be ignored. If the \"Accept\" header is set\
          \ to \"application/vnd.sas.investigation.data.masked.relationshiplink+json\"\
          \ then masked fields that are set to the mask template (nine dots) will\
          \ be ignored. The \"Accept\" header value should  match the data masking\
          \ approach that was used to fetch data before an update is performed.\n"
        required: false
        schema:
          type: "string"
          enum:
          - "application/json"
          - "application/vnd.sas.investigation.data.masked.relationshiplink+json"
      - name: "If-Match"
        in: "header"
        schema:
          type: "string"
        description: "The ETag of the representation in the request. If this header\
          \ value is provided, it must match the ETag of the current version of the\
          \ resource on the server. Otherwise, the server responds with a 412 error.\n"
        required: false
      requestBody:
        description: "An object that represents the link."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/relationshipLink"
            example:
              $ref: "#/components/examples/relationshipLinkExample/value"
      responses:
        "200":
          description: "The request succeeded.\n"
          headers:
            ETag:
              description: "The ETag for the current version of the resource."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/relationshipLink"
              example:
                $ref: "#/components/examples/relationshipLinkExample/value"
        "400":
          description: "The request was invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "404":
          description: "Unable to find the link."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "412":
          description: "The link in the request body was out of date."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "428":
          description: "The link in the request body did not contain a version."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
    patch:
      summary: "Patch a relationship link"
      operationId: "patchRelationshipLink"
      description: "Applies a patch to a relationship link. This enables a client\
        \ to make changes to a link without needing to load the entire link. The request\
        \ body contains a description of changes to be made to the link, which is\
        \ represented by a json-patch object. For more information about json-patch,\
        \ refer to [jsonpatch.com](https://jsonpatch.com).\n"
      tags:
      - "Relationship Links"
      parameters:
      - $ref: "#/components/parameters/relationshipLinkDelimitedId"
      - in: "query"
        name: "_includeEntityLabels"
        description: "Specifies whether to compute and include display labels for\
          \ both the \"to\" document and the \"from\" document in the response.\n"
        schema:
          type: "boolean"
          default: false
      - name: "If-Match"
        in: "header"
        schema:
          type: "integer"
        required: true
        description: "The version of the relationship link to update. This value must\
          \ match the most recent version of the relationship link. If the value does\
          \ not match the most recent version of the relationship link, the patch\
          \ operation fails. This helps prevent conflicting edits from being applied\
          \ to a relationship link.\nThe ETag of the relationship link to update can\
          \ also be provided in this header value, as a string. If an ETag is provided,\
          \ it must match the ETag of the current version of the relationship link\
          \ on the server. Otherwise, the server responds with a 412 error.\n"
      requestBody:
        description: "A json-patch specification of changes to make to the relationship\
          \ link. Copy and move operations cannot use a masked field value as their\
          \ source. Test operations cannot reference masked field values.\n"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/jsonPatch"
            example:
              $ref: "#/components/examples/jsonPatchExample/value"
          application/json-patch:
            schema:
              $ref: "#/components/schemas/jsonPatch"
            example:
              $ref: "#/components/examples/jsonPatchExample/value"
      responses:
        "200":
          description: "The request succeeded. The response body contains the relationship\
            \ link after the application of the patch.\n"
          headers:
            ETag:
              description: "The ETag for the current version of the resource."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/relationshipLink"
              example:
                $ref: "#/components/examples/relationshipLinkExample/value"
            application/vnd.sas.investigation.data.masked.relationshiplink:
              schema:
                $ref: "#/components/schemas/maskedRelationshipLink"
              example:
                $ref: "#/components/examples/maskedRelationshipLinkExample/value"
        "400":
          description: "The request was invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "404":
          description: "The relationship link was not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "412":
          description: "The relationship link in the request body was out of date."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
        "428":
          description: "The relationship link in the request body did not contain\
            \ a version."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/sasError"
              example:
                $ref: "#/components/examples/sasErrorExample/value"
