  /conditionEvaluations:
    post:
      summary: "Bulk evaluate conditions"
      operationId: "createConditionEvaluations"
      description: "Evaluates a bulk condition evaluation request. The response is\
        \ a bulk condition evaluation response indicating the results of evaluating\
        \ the conditions. Each individual evaluation request in the bulk request can\
        \ succeed or fail independently. Each successful evaluation yields a condition\
        \ evaluation response object that contains a `result` property. Each failed\
        \ evaluation yields a condition evaluation response object that contains error\
        \ details. Duplicate condition evaluation request objects in the REST request\
        \ are ignored, and together result in only one condition evaluation response\
        \ object in the REST response. The order of the condition evaluation response\
        \ objects in the REST response is not guaranteed. In order to determine which\
        \ condition evaluation response corresponds to which condition evaluation\
        \ request, do not use the ordering. Instead, check the `requested` property\
        \ of the condition  evaluation response object to determine which request\
        \ it corresponds to.\n"
      tags:
      - "Conditions"
      requestBody:
        description: "The bulk condition evaluation request."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/bulkConditionEvaluationRequest"
            example:
              $ref: "#/components/examples/bulkConditionEvaluationRequestExample/value"
          application/vnd.sas.investigation.data.condition.evaluation.bulk.request:
            schema:
              $ref: "#/components/schemas/bulkConditionEvaluationRequest"
            example:
              $ref: "#/components/examples/bulkConditionEvaluationRequestExample/value"
      responses:
        "201":
          description: "The condition evaluation requests were processed.\n"
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/bulkConditionEvaluationResponse"
              example:
                $ref: "#/components/examples/bulkConditionEvaluationResponseExample/value"
            application/vnd.sas.investigation.data.condition.evaluation.bulk.response:
