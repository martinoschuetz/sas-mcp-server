  /admin/storedObjects/{entityTypeId}/reconstruct:
    post:
      summary: "Trigger entity type metadata reconstruction"
      description: "Synchronizes an entity type's field metadata with the schema for\
        \ the database table that contains the entity type's records. This can be\
        \ used to repair the entity type's metadata if the table that backs the entity\
        \ type changes. Care should be taken when using this operation as it does\
        \ not automatically update other services in SAS Visual Investigator to reflect\
        \ the metadata changes. Users who do not understand how their metadata is\
        \ used in SAS Visual Investigator or are not prepared to repair inconsistencies\
        \ downstream from Data Hub are not advised to use this endpoint. The request\
        \ body should be empty.\n"
      operationId: "reconstructStoredObject"
      tags:
      - "Entity Types"
      parameters:
      - name: "entityTypeId"
        in: "path"
        required: true
        schema:
          type: "string"
        description: "The id of the entity type object."
      requestBody:
        description: "The request body should be empty."
        content:
          application/json:
            schema: {}
            example: {}
      responses:
        "200":
          description: "The request succeeded."
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/entityType"
              example:
                $ref: "#/components/examples/entityTypeExample/value"
            application/vnd.sas.svi.entity.type:
              schema:
                $ref: "#/components/schemas/entityType"
              example:
                $ref: "#/components/examples/entityTypeExample/value"
        "400":
