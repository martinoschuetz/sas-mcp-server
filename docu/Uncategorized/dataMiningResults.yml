---
openapi: 3.0.3
info:
  description: An API to manage data mining results.  The Data Mining Results REST
    API provides a way to retrieve data mining results.  The results are generated
    by data mining operations and a link to the results are provided in the operation
    representation.
  version: "4"
  title: Data Mining Results
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: https://support.sas.com/techsup/license/index.html
tags:
- name: Results
  description: The operations on data mining results.
- name: Root
  description: Data mining results API.
- name: CopilotResults
  description: The operations on Copilot results.
paths:
  /:
    get:
      tags:
      - Root
      description: The API object contains the set of links for the supported endpoints.
      summary: Get the API object
      operationId: root
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsRootResponse"
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsRootResponse"
  "/results/{resourceId}/assessments":
    head:
      tags:
      - Results
      description: Get headers for project jobs request
      summary: Data mining assessment results corresponding to a specified ID
      operationId: headersForAssessment
      parameters:
      - name: resourceId
        in: path
        description: resourceId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The data mining results were found.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
        "404":
          description: The data mining results were not found.
    get:
      tags:
      - Results
      description: Get the data mining assessment results.  These results are limited
        to the ReportName.FITSTAT, ReportName.LIFTSTAT, and ReportName.ROC results.  These
        are typically used for model comparison operations and can greatly improve
        results performance if other reports in the collection are large.
      summary: Data mining assessment results corresponding to a specified ID
      operationId: getAssessment
      parameters:
      - name: resourceId
        in: path
        description: resourceId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The data mining results were found.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/reportCollection"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsAssessmentResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/reportCollection"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsAssessmentResponse"
        "404":
          description: The data mining results were not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsAssessment404Response"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsAssessment404Response"
  "/results/{resourceId}/pipelines":
    head:
      tags:
      - Results
      description: Get headers for project pipeline request
      summary: Get headers for project pipeline request
      operationId: headersForPipeline
      parameters:
      - name: resourceId
        in: path
        description: resourceId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The data mining results were found.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
        "404":
          description: The data mining results were not found.
    get:
      tags:
      - Results
      description: Get the pipeline compare results for a data mining operation.  These
        results exclude treeplot reports and score code reports for the Autotuned
        Decision Tree.  These are typically extremely large and the UI is unable to
        display these in a useful manner.
      summary: Data mining pipeline results corresponding to a specified ID
      operationId: getPipeline
      parameters:
      - name: resourceId
        in: path
        description: resourceId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The data mining results were found.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/reportCollection"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsPipelineResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/reportCollection"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsPipelineResponse"
        "404":
          description: The data mining results were not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsPipeline404Response"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsPipeline404Response"
  "/results/{resourceId}":
    head:
      tags:
      - Results
      description: Get headers for raw Report representation
      summary: Get headers for raw Report representation
      operationId: headersForRawReport
      parameters:
      - name: resourceId
        in: path
        description: resourceId
        required: true
        schema:
          type: string
      - name: fileName
        in: query
        description: The results file name containing the raw report.  The file name
          must be serializable as a Report representation.
        required: true
        schema:
          type: string
          default: false
      responses:
        "200":
          description: The data mining report was found.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
        "404":
          description: The data mining report was not found.
    get:
      tags:
      - Results
      description: Get a raw Report representation.
      summary: Get a raw Report representation.  These are typically used by the mid-tier
        services and don't include any variable metadata
      operationId: getRawReport
      parameters:
      - name: resourceId
        in: path
        description: resourceId
        required: true
        schema:
          type: string
      - name: fileName
        in: query
        description: The results file name containing the raw report.  The file name
          must be serializable as a Report representation.
        required: true
        schema:
          type: string
          default: false
      responses:
        "200":
          description: The data mining report was found.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsResourceResponse"
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsResourceResponse"
        "404":
          description: The data mining report was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsResource404Response"
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsResource404Response"
  "/results/{resourceId}/images/{fileName}":
    head:
      tags:
      - Results
      description: Get headers for binary data from a report
      summary: Get headers for binary data from a report
      operationId: headersForImage
      parameters:
      - name: resourceId
        in: path
        description: resourceId
        required: true
        schema:
          type: string
      - name: fileName
        in: path
        description: The results file name containing the binary data.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The data mining report was found.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
        "404":
          description: The data mining report was not found.
    get:
      tags:
      - Results
      description: Get binary data from a report.
      summary: Get binary data from a report.  These are typically images generated
        by open source components
      operationId: getImage
      parameters:
      - name: resourceId
        in: path
        description: resourceId
        required: true
        schema:
          type: string
      - name: fileName
        in: path
        description: The results file name containing the binary data.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The data mining report was found.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/report"
            image/jpeg:
              schema:
                $ref: "#/components/schemas/report"
            image/png:
              schema:
                $ref: "#/components/schemas/report"
            image/gif:
              schema:
                $ref: "#/components/schemas/report"
        "404":
          description: The data mining report was not found.
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsResourceImage404Response"
            image/jpeg:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsResourceImage404Response"
            image/png:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsResourceImage404Response"
            image/gif:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningResultsResourceImage404Response"
  "/copilotResults/{componentId}":
    head:
      tags:
      - CopilotResults
      description: Get headers for Copilot results
      summary: Get headers for Copilot results
      operationId: headersForCopilotResults
      parameters:
      - name: componentId
        in: path
        description: The ID of the component for which results will be retrieved.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
        "404":
          description: The Copilot results could not be found.
        "400":
          description: The Copilot flag is not set in the database, so Copilot results
            could not be retrieved.
    get:
      tags:
      - CopilotResults
      description: Get the Copilot results
      summary: |
        Get the filtered component results for use when prompting LLMs via Copilot
      operationId: getCopilotResults
      parameters:
      - name: componentId
        in: path
        description: The ID of the component for which results will be retrieved.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/copilotReportCollection"
              examples:
                default:
                  $ref: "#/components/examples/copilotResultsResponse"
            application/vnd.sas.data.mining.copilot.reports+json:
              schema:
                $ref: "#/components/schemas/copilotReportCollection"
              examples:
                default:
                  $ref: "#/components/examples/copilotResultsResponse"
        "404":
          description: The Copilot results records were not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/copilotResultsNotFoundResponse"
            application/vnd.sas.data.mining.copilot.reports+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/copilotResultsNotFoundResponse"
        "400":
          description: |
            The Copilot results could not be retrieved because the Copilot flag is not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/copilotResultsBadRequestResponse"
            application/vnd.sas.data.mining.copilot.reports+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/copilotResultsBadRequestResponse"
servers:
- url: http://example.com/dataMiningResults
  description: kubernetes mock server
components:
  requestBodies:
    selection:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/selection"
        application/vnd.sas.selection+json:
          schema:
            $ref: "#/components/schemas/selection"
      description: resourceIds
      required: true
    reportCollection:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/reportCollection"
        application/vnd.sas.collection+json:
          schema:
            $ref: "#/components/schemas/reportCollection"
      description: inputReportCollection
      required: true
  schemas:
    reportCollection:
      type: array
      description: The array of application/vnd.sas.analytics.report+json representations.
      items:
        $ref: "#/components/schemas/report"
    dataRow:
      title: Data Row
      description: A row of data.
      required:
      - dataMap
      - rowNumber
      properties:
        dataMap:
          type: object
          description: 'Map of parameter name to associated value.'
        header:
          type: string
          description: 'Optional title. May be localized.'
        rowNumber:
          type: integer
          format: int32
          description: 'The index of this row in the collection.'
    parameter:
      title: Parameter
      description: Metadata describing a particular variable.
      required:
      - parameter
      - type
      - values
      properties:
        label:
          type: string
          description: 'The display name. May be localized.'
        length:
          type: integer
          format: int32
          description: 'The maximum width among this parameter''s values.'
        order:
          type: integer
          format: int32
          description: 'The index of this parameter in the collection.'
        parameter:
          type: string
          description: 'The parameter name. Should not be localized.'
        preformatted:
          type: boolean
          description: 'Indicates whether this parameter''s values have already been
            formatted.'
        type:
          type: string
          description: 'The data type of this parameter''s values.'
          enum:
          - undefined
          - num
          - char
          - report
        values:
          type: array
          description: 'Keys used to associate this parameter with values in the rows
            of data.'
          items:
            type: string
    copilotReportSummary:
      x-sas-internal: true
      type: object
      description: Summary of the component results report to be sent to Copilot
      properties:
        name:
          type: string
          description: The name of the report
        parameterMap:
          type: object
          description: The parameters for the report data
          additionalProperties:
            $ref: "#/components/schemas/parameter"
        data:
          type: array
          description: The report data
          items:
            $ref: "#/components/schemas/dataRow"
        nlgText:
          type: string
          description: The resolved NLG text for the report
    copilotReportCollection:
      x-sas-internal: true
      type: object
      description: The collection of filtered Copilot results for the component
      properties:
        resultsData:
          type: array
          items:
            $ref: "#/components/schemas/copilotReportSummary"
          description: The results data for the report collection
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    selection:
      title: Selection
      description: Identifies a set of resources.
      x-sas-media-type:
        name: application/vnd.sas.selection
        version: 1
      required:
      - version
      - resources
      properties:
        version:
          description: The schema version number of this media type. This representation
            is version 1.
          type: integer
        template:
          description: 'A URI template in which the {id} parameter can be replaced
            with a value from the "resources" array in order to yield the URI of the
            identified resource. '
          type: string
        type:
          description: "Specifies whether the resources array contains IDs, URIs,\
            \ or both. \n<dl>\n<dt>\"id\"</dt><dd>the array contains resource identifiers\
            \ only. This is the default if \"type\" is omitted.</dd>\n<dt>\"uri\"\
            </dt><dd>the array contains resource URIs</dd>\n<dt>\"mixed\"</dt><dd>the\
            \ array contains a mixture of identifiers and URIs.</dd>\n</dl>"
          type: string
          enum:
          - id
          - uri
          - mixed
        resources:
          description: An array of resource IDs or URIs
          type: array
          items:
            type: string
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
    report:
      title: Analytics Report
      description: An analytics report consisting of rows of data and associated metadata
        (parameters).
      x-sas-media-type:
        name: application/vnd.sas.analytics.report
      required:
      - data
      - parameterMap
      - type
      properties:
        id:
          type: string
          description: The unique identifier of this analytics report.
        data:
          type: array
          description: The rows of data.
          items:
            $ref: "#/components/schemas/dataRow"
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
        parameterMap:
          type: object
          description: 'The collection of parameters, categorized by parameter name.'
          additionalProperties:
            $ref: "#/components/schemas/parameter"
        order:
          type: integer
          format: int32
          description: The index in a collection of analytics reports. Useful when
            analytics reports are stored in an unordered collection but order is desired.
        type:
          type: string
          description: The type of analytics report. Informs clients how this analytics
            report should be rendered.
          enum:
          - undefined
          - table
          - barChart
          - refreshableBarChart
          - seriesPlot
          - pieChart
          - histogram
          - decisionTree
          - networkDiagram
          - html
          - textViewer
          - matrix
          - bandPlot
          - codeEditor
          - iciclePlot
          - scatterPlot
          - comboBox
        xInteger:
          type: boolean
          description: Whether or not to suppress intermediate tick marks on the X-axis.
        yInteger:
          type: boolean
          description: Whether or not to suppress intermediate tick marks on the Y-axis.
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 1.
        description:
          type: string
          description: A description of this analytics report.
        revision:
          type: integer
          description: A revision number that is incremented on every update to the
            analytics report.
          format: int64
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
  examples:
    getDataMiningResultsAssessment404Response:
      summary: Data Mining Results Resource Response
      description: Get 404 response for Data Mining Results Assessment
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 16129, "message": "The\
          \ results could not be found for the resource.", "details": ["path: /dataMiningResults/results/9b10b586-d3d9-4cfb-8f45-8f52d2a3e14/assessments",
          "correlator: 95a3f79b-1888-489b-b5ec-a6368bdb0690"], "remediation": "Contact\
          \ technical support for additional help.", "errors": [{"httpStatusCode": 500,
            "errorCode": 16129, "message": "The resource ID \"9b10b586-d3d9-4cfb-8f45-8f52d2a3e14\"\
              \ results could not be retrieved."}]}
    getDataMiningResultsResourceResponse:
      summary: Data Mining Results Resource Response
      description: Get response for Data Mining Results Resource Response. Note that
        results responses are long, this example is shortened for brevity.
      value: {"creationTimeStamp": "0001-01-01T00:00:00Z", "modifiedTimeStamp": "0001-01-01T00:00:00Z",
        "revision": 0, "name": "partinfo", "description": "report.partition.description",
        "version": 0, "groupName": "SAS", "order": 0, "type": "table", "parameterMap": {
          "createdDate": {"label": "Creation date", "length": 32, "parameter": "createdDate",
            "preformatted": false, "type": "undefined", "values": ["createdDate"]},
          "lastModifiedDate": {"label": "Last modified date", "length": 32, "parameter": "lastModifiedDate",
            "preformatted": false, "type": "undefined", "values": ["lastModifiedDate"]}},
        "data": [{"dataMap": {"createdDate": "2023-02-27 19:23:34.391819 +0000 UTC",
              "lastModifiedDate": "2023-02-27 19:23:34.391812 +0000 UTC", "propertyName": "event",
              "propertyValue": ""}, "rowNumber": 1}, {"dataMap": {"createdDate": "2023-02-27\
                \ 19:23:34.391829 +0000 UTC", "lastModifiedDate": "2023-02-27 19:23:34.391828\
                \ +0000 UTC", "propertyName": "inputCaslib", "propertyValue": "Public"},
            "rowNumber": 1}], "xInteger": false, "yInteger": false}
    getDataMiningResultsResourceImage404Response:
      summary: Data Mining Results Resource Image Response
      description: Get 404 response for Data Mining Results resource image response
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 16168, "message": "The\
          \ results could not be found for the resource.", "details": ["path: /dataMiningResults/results/77c4cff6-c5d8-434f-8116-5dce39eddea/images/rpt_forestMsePlot.png",
          "correlator: c873cd39-abc0-4107-a3a9-605597487579"], "remediation": "Contact\
          \ technical support for additional help.", "errors": [{"version": 2, "httpStatusCode": 404,
            "errorCode": 16168, "message": "The results could not be found for the\
              \ resource.", "remediation": "Contact technical support for additional\
              \ help.", "errors": [{"httpStatusCode": 500, "errorCode": 16168, "message": "No\
                  \ data could be found using the filter \"and(eq($primary,id,\"77c4cff6-c5d8-434f-8116-5dce39eddea\"\
                  ),eq($primary,name,\"rpt_forestMsePlot.png\"))\"."}]}]}
    copilotResultsResponse:
      summary: Successful response for retrieving Copilot results
      description: This examples shows a response from retrieving filtered component
        results for Copilot.
      value: {"resultsData": [{"name": "dmcas_roc", "nlgText": " <p>The ROC curve\
              \ is a plot of sensitivity (the true positive rate) against 1-specificity\
              \ (the false positive rate), which are both measures of classification\
              \ based on the confusion matrix. These measures are calculated at various\
              \ cutoff values. To help identify the best cutoff to use when scoring\
              \ your data, the KS Cutoff reference line is drawn at the value of 1-specificity\
              \ where the greatest difference between sensitivity and 1-specificity\
              \ is observed for the VALIDATE partition. The KS Cutoff line is drawn\
              \ at the cutoff value 0.17, where the 1-specificity value is 0.119 and\
              \ the sensitivity value is 0.821. </p><p>Cutoff values range from 0\
              \ to 1, inclusive, in increments of 0.01. At each cutoff value, the\
              \ predicted target classification is determined by whether P_BAD1, which\
              \ is the predicted probability of the event \"1\" for the target BAD,\
              \ is greater than or equal to the cutoff value. When P_BAD1 is greater\
              \ than or equal to the cutoff value, then the predicted classification\
              \ is the event, otherwise it is a non-event.</p><p>The confusion matrix\
              \ for each cutoff value contains four cells that display the true positives\
              \ for events that are correctly classified (TP), false positives for\
              \ non-events that are classified as events (FP), false negatives for\
              \ events that are classified as non-events (FN), and true negatives\
              \ for non-events that are classified as non-events (TN). True negatives\
              \ include non-event classifications that specify a different non-event.\
              \ Sensitivity is calculated as TP / (TP + FN). Specificity, the true\
              \ negative rate, is calculated as TN / (TN + FP), so 1-specificity is\
              \ FP / (TN + FP). The values of sensitivity and 1-specificity are plotted\
              \ at each cutoff value.</p><p>A ROC curve that rapidly approaches the\
              \ upper-left corner of the graph, where the difference between sensitivity\
              \ and 1-specificity is the greatest, indicates a more accurate model.\
              \ A diagonal line where sensitivity = 1-specificity indicates a random\
              \ model.</p>"}, {"name": "dmcas_roc", "nlgText": " <p>For this model,\
              \ the accuracy in the TEST partition at the cutoff of 0.5 is 0.866.</p><p>For\
              \ this model, the accuracy in the TRAIN partition at the cutoff of 0.5\
              \ is 0.896.</p><p>For this model, the accuracy in the VALIDATE partition\
              \ at the cutoff of 0.5 is 0.883.</p><p>Accuracy is the proportion of\
              \ observations that are correctly classified as either an event or non-event,\
              \ calculated at various cutoff values. Cutoff values range from 0 to\
              \ 1, inclusive, in increments of 0.01. At each cutoff value, the predicted\
              \ target classification is determined by whether P_BAD1, which is the\
              \ predicted probability of the event \"1\" for the target BAD, is greater\
              \ than or equal to the cutoff value. When P_BAD1 is greater than or\
              \ equal to the cutoff value, then the predicted classification is the\
              \ event, otherwise it is a non-event. When the predicted classification\
              \ and the actual classification are both events (true positives) or\
              \ both non-events (true negatives), the observation is correctly classified.\
              \ If the predicted classification and actual classification disagree,\
              \ then the observation is incorrectly classified. Accuracy is calculated\
              \ as (true positives + true negatives) / (total observations).</p>"},
          {"name": "dmcas_roc", "nlgText": " <p> For this model, the F1 score in the\
              \ TEST partition at the cutoff of 0.5 is 0.68.</p><p> For this model,\
              \ the F1 score in the TRAIN partition at the cutoff of 0.5 is 0.747.</p><p>\
              \ For this model, the F1 score in the VALIDATE partition at the cutoff\
              \ of 0.5 is 0.722.</p><p>The F1 score combines the measures of precision\
              \ and recall (or sensitivity), which are measures of classification\
              \ based on the confusion matrix that are calculated at various cutoff\
              \ values. Cutoff values range from 0 to 1, inclusive, in increments\
              \ of 0.01. At each cutoff value, the predicted target classification\
              \ is determined by whether P_BAD1, which is the predicted probability\
              \ of the event \"1\" for the target BAD, is greater than or equal to\
              \ the cutoff value. When P_BAD1 is greater than or equal to the cutoff\
              \ value, then the predicted classification is the event, otherwise it\
              \ is a non-event.</p><p>The confusion matrix for each cutoff value contains\
              \ four cells that display the true positives for events that are correctly\
              \ classified (TP), false positives for non-events that are classified\
              \ as events (FP), false negatives for events that are classified as\
              \ non-events (FN), and true negatives for non-events that are classified\
              \ as non-events (TN). True negatives include non-event classifications\
              \ that specify a different non-event.</p><p>Precision is calculated\
              \ as TP / (TP + FP), and recall (or sensitivity) is calculated as TP\
              \ / (TP + FN). The F1 score is calculated as 2*Precision*Recall / (Precision\
              \ + Recall), which is the harmonic mean of Precision and Recall. Larger\
              \ F1 scores indicate a more accurate model.</p>"}, {"name": "dmcas_fitstat",
