        description: The ID of a cas session that should be used when exporting the
          resources; typically used when locationType is libname and location is a
          session-based caslib.
      - name: serverName
        in: query
        schema:
          type: string
        description: The name of the server to be used for exporting the resources;
          only used when there are multiple cas servers in the environment and using
          a specific server is necessary
      - name: scope
        in: query
        schema:
          type: string
        description: one of global|session. Determines if the exported table exists
          at global or session scope.  Default is session if locationType is directory
          or if a sessionId is passed; if locationType is libname and no sessionId
          is passed, default is global.
      - name: replace
        in: query
        schema:
