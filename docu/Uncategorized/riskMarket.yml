  "/variables/@item":
    get:
      tags:
      - Variables
      summary: Look up a variable by unique query filter
      description: Returns the representation of the variable described by the query.  A
        filter must be specified that uniquely describes only one item in the collection.
      operationId: getVariableByFilter
      parameters:
      - $ref: "#/components/parameters/filter"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A hashed value generated when the variable was last modified.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format\
                \ when the variable was last modified."
              schema:
                type: string
            Content-Location:
              description: The location of the variable
              schema:
                type: string
          content:
            application/vnd.sas.risk.variable+json:
              schema:
                $ref: "#/components/schemas/variable"
              examples:
                json:
                  $ref: "#/components/examples/variable"
            application/json:
              schema:
                $ref: "#/components/schemas/variable"
        "400":
          description: No valid filter describing a unique resource was included in
            the request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No qualifying variable exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  "/variables/{variableId}":
    get:
      tags:
      - Variables
      summary: Get a variable
      description: Returns the representation of the specified variable.
      operationId: getVariable
      parameters:
      - name: variableId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the variable.
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A hashed value generated when the variable was last modified.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the variable was last modified.
              schema:
                type: string
            Content-Location:
              description: The location of the variable
              schema:
                type: string
          content:
            application/vnd.sas.risk.variable+json:
              schema:
                $ref: "#/components/schemas/variable"
              examples:
                json:
                  $ref: "#/components/examples/variable"
            application/json:
              schema:
                $ref: "#/components/schemas/variable"
        "404":
          description: No variable exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    post:
      tags:
      - Variables
      summary: Create scoped variables and add as members to an existing curve
      description: Creates the specified scoped variables based on the representations
        in the request body and adds them as members of the curve.
      operationId: createScopedMembers
      parameters:
      - name: variableId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the curve variable.
      requestBody:
        description: Scoped variables to be created.
        required: true
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/variableImport"
            examples:
              json:
                $ref: "#/components/examples/variableImport"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/variableSummaryCollection"
              examples:
                json:
                  $ref: "#/components/examples/variableSummaryCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    put:
      tags:
      - Variables
      summary: Update a variable
      description: Updates the specified variable based on the representation in the
        request body.
      operationId: updateVariable
      parameters:
      - name: variableId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the variable.
      - name: If-Unmodified-Since
        in: header
        schema:
          type: string
        description: The timestamp obtained from the most recent `Last-Modified` response
          header. Must match the timestamp when the variable was last modified.
      - name: If-Match
        in: header
        schema:
          type: string
        description: The value obtained from the most recent `Etag` response header.
          Must match the value when the variable was last modified.
      requestBody:
        description: A variable to be updated.
        required: true
        content:
          application/vnd.sas.risk.variable:
            schema:
              $ref: "#/components/schemas/variable"
            examples:
              json:
                $ref: "#/components/examples/variable"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.risk.variable+json:
              schema:
                $ref: "#/components/schemas/variable"
              examples:
                json:
                  $ref: "#/components/examples/variable"
            application/json:
              schema:
                $ref: "#/components/schemas/variable"
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the variable was last modified.
              schema:
                type: string
            ETag:
              description: A hashed value generated when the variable was last modified.
              schema:
                type: string
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No variable exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "412":
          description: The If-Unmodified-Since or If-Match request header did not
            match the resource's last modified timestamp or hashed value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: The request headers did not include an If-Unmodified-Since
            or If-Match precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      tags:
      - Variables
      summary: Delete a variable
      description: The provided variable will be validated to make sure that its deletion
        will not leave any invalid variables behind. Those variables that would cause
        an invalid variable to be left would be reported as an error and removed from
        the list being deleted. When including the deleteMembers parameter set to
        true, the requested variables along with all underlying variables will be
        deleted. For example, in their respective member lists curveA references factor1
        and factor2 while curveB references factor1. Issuing a delete on curveA with
        deleteMembers=true would result in a partial delete and report that factor1
        could not be deleted and curveA along with factor2 would be removed.
      operationId: deleteVariable
      parameters:
      - name: variableId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the variable.
      - $ref: "#/components/parameters/deleteMembers"
      responses:
        "204":
          description: The request succeeded; nothing to return
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
