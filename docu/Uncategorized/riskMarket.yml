      description: "Returns the collection of variables that are not members of a\
        \ compound variable or a subset based on the specified filtering or paging\
        \ options.  The items in the collection use the `application/vnd.sas.risk.variable`\
        \ media typeby default; an Accept-Item header may be used to return smaller\
        \ representations that are more efficient to generate.\nThis query always\
        \ sorts first by type, providing the order of groups, arrays, curves, surfaces\
        \ and finally risk factors; if a sortBy argument is supplied, it is applied\
