      requestBody:
        description: The holiday day to be updated
        required: true
        content:
          application/vnd.sas.risk.holiday.day+json:
            schema:
              $ref: "#/components/schemas/holiday"
            examples:
              json:
                $ref: "#/components/examples/holiday"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.risk.holiday.day+json:
              schema:
                $ref: "#/components/schemas/holiday"
              examples:
                json:
                  $ref: "#/components/examples/holiday"
            application/json:
              schema:
                $ref: "#/components/schemas/holidaySchedule"
              examples:
                json:
                  $ref: "#/components/examples/holidaySchedule"
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the object was last modified.
              schema:
                type: string
            ETag:
              description: A hashed value generated when the object was last modified.
              schema:
                type: string
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No holiday exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
