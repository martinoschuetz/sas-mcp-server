    variableNode:
      title: VariableNode
      description: The subset of a variable representation that is more efficient
        to generate
      properties:
        id:
          title: Variable ID
          description: The unique ID assigned to a variable.
          type: string
        name:
          type: string
          description: The name of the variable.  This field is generally used in
            code and server side procedures, and was at one time restricted to unquoted
            SAS names.
        label:
          type: string
          description: An alternate name of the variable, typically friendlier for
            use in the user interface than the name.  Defaults to the name field when
            not present.
        description:
          type: string
          description: The description of the variable.
        type:
          description: A code describing the type of variable. 'factor' indicates
            the variable is a simple scalar value, almost always numeric. 'array',
            'curve' or 'surface' indicates the variable is a list of simple variables.
            'group' indicates the variable is an arbitrary collection of simple, array,
            curve and surface variables. 'instrument' indicates the variable is a
            property of an asset, which can be of any type. 'reference' indicates
            the variable is a reference variable, and can be used to map arbitrary
            keys to existing variables of type 'factor', 'array', 'curve', or 'surface'.
          type: string
          enum:
          - factor
          - array
          - curve
          - surface
          - group
          - instrument
          - reference
        purpose:
          type: string
          default: general
          description: A comma separated list of tags describing the purpose(s) for
            which the variable is used.
        source:
          type: string
          description: The name of a source that defines this variable, or from which
            this variable was derived.
        role:
          type: string
          description: Code that specifies the purpose of the risk factor, array,
            curve or surface. For more information, see [SAS Help Center](https://go.documentation.sas.com/doc/en/rfmcdc/v_021/rfmug/p0wgsv70zv51dgn1qhd9irie3h3g.htm).
          enum:
          - factor
          - fx
          - fx_spot
          - ir
          - volatility
        roleCategory:
          type: string
          description: Code that specifies the purpose of the risk factor, array,
            curve or surface. For more information, see [SAS Help Center](https://go.documentation.sas.com/doc/en/rfmcdc/v_021/rfmug/p0wgsv70zv51dgn1qhd9irie3h3g.htm).
          enum:
          - credit_spread
          - equity_index
          - factor
          - fx
          - fx_spot
          - implied_volatility
          - index
          - ir
          - macro_factor
          - volatility
          - fx_implied_volatility
          - ir_implied_volatility
          - transition_matrix_set
        scope:
          type: string
          description: When type = 'factor', specifies the scope of the variable.
            For example, a 'scenario' scoped variable indicates that the variable
            is used only in a scenario and there is no underlying market data associated
            with the variable.
          enum:
          - scenario
        group:
          type: string
          description: When type = 'factor'|'array'|'curve'|'surface', optional group
            to which this variable has been assigned.
        valueType:
          type: string
          description: When type = 'curve' and roleCategory = 'ir'|'credit_spread',
            optional code identifying the value type.
          enum:
          - Discount Bond Yield
          - Discount Bond Price
          - Same Series Par Bond
          - Same Series Non-Par Bond
          - Different Series Bond
          - Periodic Zero Rate
        couponRate:
          type: number
          description: When type = 'factor' and roleCategory = 'ir'|'credit_spread',
            optional coupon rate for the risk factor.
        spreadType:
          type: string
          description: When type = 'curve', optional spread type for the curve.
          enum:
          - Base Yield Curve (No Spread)
          - Spread-by Security (Constant)
          - Spread-by Security and Term Structure
          - Spread-by Term Structure
          - Spread-by Default and Recovery
          - Spread-by Hazard Function
          - Spread-by Term Structure (No Base)
          - User-adjusted Yield Curve
          - Synthetic Yield Curve (No Spread)
        baseClass:
          type: string
          description: When type = 'curve' and the spreadType has been set, required
            name of a class.
        currency:
          type: string
          description: When type = 'factor'|'array'|'curve'|'surface', optional currency
            code for a variable that is expressed in currency units
        fromCurrency:
          type: string
          description: When type = 'factor'|'array'|'curve'|'surface', optional source
            currency code for a variable that describes currency conversions
        stochasticProcess:
          type: string
          description: When type = 'factor', optional code for volatility computation
          enum:
          - gbm
          - interval
          - ratio
        baseVariable:
          type: string
          description: When type = 'factor' and role='volatility', this variable tracks
            the volatility for the named risk factor
        hasMaturity:
          type: boolean
          description: When type = 'array'|'curve'|'surface', true when one or more
            members have maturity values.
        maturityType:
          description: When type = 'curve', tracks the type of maturity in the underlying
            members. A maturityType of 'unit' requires that all underlying members
            specify a maturity using a 'unit' and 'value'. A maturityType of 'years'
            requires that all underlying members specify a maturity using 'value'
            in fractional years.
          type: string
          enum:
          - unit
          - years
        dayCount:
          description: When type = 'factor'|'array'|'curve'|'surface', this affects
            the calculation of year fractions for use when discounting cash flows.
            Its value defaults to ACT/365 when processing objects other than type
            = 'factor'.
          type: string
          enum:
          - ACT/365.25
          - ACT/360
          - ACT/364
          - ACT/365
          - ACT/366
          - 30/360
          - 30/365
          - ACT/ACT/ICMA
          - RDDAYCOUNT
          - 30E/360
          - ACT/365L
          - 30E+/360
          - ACT/ACT/ISDA
          - 30E/360/ISDA
          - ACT/365A
          - NL/360
          - NL/365
        paymentFreq:
          type: object
          description: When type = 'factor'|'array'|'curve'|'surface' and dayCount
            = 'ACT/ACT/ICMA', specification of payment frequency to apply when calculating
            cash flow year fractions for the discount rate or spread. This is optional
            for risk factors and required otherwise. For example, a variable describing
            an annuity that pays monthly would be defined with paymentFreq.value ==
            1 and paymentFreq.unit == 'month'.
          properties:
            value:
              type: number
              format: float
              description: count of periods between payments
            unit:
              type: string
              description: type of period that elapses between payments
        compoundingFreq:
          type: object
          description: When type = 'factor'|'array'|'curve'|'surface', optional specification
            of compoundingFreq frequency for the interest rate. For example, an interest
            rate compounded quarterly would be defined with compoundingFreq.value
            == 3 and compoundingFreq.unit == 'month'. Its value defaults to compoundingFreq.value
            == 1 and compoundingFreq.unit == 'year' when processing objects other
            than type = 'factor'.
          properties:
            value:
              type: number
              format: float
              description: count of periods between compoundingFreq
            unit:
              type: string
              description: type of period that elapses between compoundingFreq
        hasFilteredMembers:
          type: boolean
          description: Included only on the members query when an underlying member
            has type = 'group', the flag indicates whether there are any remaining
            members for the group after applying a filter.
        expression:
          type: string
          items:
            type: string
          description: When type = 'group', the expression can be used in place of
            members to define a rule that identifies the dynamic members of a group.
        isClass:
          type: boolean
          description: When type = 'group', true indicates that the group is designated
            as a class.
        bondClass:
          type: string
          description: Only applicable when type = 'factor' or 'surface'. Max length
            100.
        securityId:
          type: string
          description: Only applicable when type = 'factor' or 'surface'. Max length
            32.
        issuer:
          type: string
          description: Only applicable when type = 'factor'. Max length 100.
        derivativeType:
          type: string
          description: Only applicable when type = 'factor' or 'surface'.
          enum:
          - MMFut
          - MMFutOpt
          - BondFut
          - BondFutOpt
          - EquityIdxFut
          - EquityIdxOpt
          - EquityIdxFwd
          - CapsFloors
          - Swaption
          - FXOpt
          - FXFut
          - FXFutOpt
          - BondOpt
          - EquityOpt
        exchangeId:
          type: string
          description: The id of the exchange where the security is traded. Max length
            8.
        optionType:
          type: string
          description: option type.
          enum:
          - call
          - put
          - cap
          - floor
          - righttoreceive
          - righttopay
        symbol:
          type: string
          description: Overloaded field based on derivative type in KRM. Max length
            16.
        volatilityType:
          type: string
          description: Dependent on derivative type. Only applicable to surfaces with
            roleCategory=implied_volatility
          enum:
          - lognormal
          - normal
          - strike
          - forwarddelta
          - spotprice
        capVolatility:
          type: string
          description: Used with CapsFloors derivative type. Only applicable to surfaces
            with roleCategory=implied_volatility
          enum:
          - cap
          - caplet
        strikeType:
          type: string
          description: Used with CapsFloors and Swaptions derivative types. Only applicable
            to surfaces with roleCategory=implied_volatility
          enum:
          - strikerate
          - forwardrate
          - aftershift
        referenceRate:
          type: number
          format: float
          description: Reference rate for Lognormal surface. Only applicable to surfaces
            with roleCategory=implied_volatility
        rules:
          type: array
          items:
            type: string
          description: A set of enumerated values that control how unusual special
            cases are handled for specific endpoints.  When type = 'factor', 0 or
            1 of the following may be specified to control what happens in a history
            query where the marketState flag is true and there is no value  for a
            factor for the supplied endDate (or for the last available date if no
            endDate is supplied); REQUIRED_FOR_MARKET_STATE causes the history query
            to fail, MISSING_FOR_MARKET_STATE causes the history to to include a missing
            value for the factor, and FLAT_LINE_FOR_MARKET_STATE (the default for
            this rule) causes the history to include the most recent available value
            for the factor.
        interpolation:
          description: When type = 'curve'|'surface', a code describing how to interpolate
            the value for a point inside the boundaries of the underlying coordinates.
            Its value defaults to 'linear' for objects of type = 'curve' and 'bilinear'
            for objects of type 'surface'.
          type: string
          enum:
          - fwdrate
          - linear
          - loglinear
          - spline
          - step
          - nelsonsiegel
          - nelsonsiegelsvensson
          - maximumsmoothnessforwardrate
          - cubicsplineofprices
          - cubicsplineofyields
          - linearsplineofprices
          - linearsplineofyields
          - vasicek
        splineType:
          description: When type = 'curve' and interpolation = 'spline', a code describing
            the type of spline to use when interpolating. Its value defaults to 'notaknot'.
          type: string
          enum:
          - natural
          - notaknot
        extrapolation:
          description: When type = 'curve'|'surface', a code describing how to interpolate
            the value for a point outside the boundaries of the underlying coordinates.
            Its value defaults to 'constant'.
          type: string
          enum:
          - constant
          - missing
          - linear
        coordinates:
          type: array
          items:
            $ref: "#/components/schemas/coordinate"
          description: When type = 'factor', an optional list of 1 or 2 dimension
            values.
        underlyingMaturityUnit:
          type: string
          description: When type = 'surface' and roleCategory = 'implied_volatility',
            optional unit of maturity for the underlying security. For example, 'day',
            'week', 'month', 'year'.
        underlyingMaturityValue:
          type: number
          description: When type = 'surface' and roleCategory = 'implied_volatility',
            use underlyingMaturityUnit as unit.
        createdBy:
          type: string
          description: the userid of the creator of a variable.
        creationTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the variable was created.
        modifiedBy:
          type: string
          description: the userid of the last user to update a variable.
        modifiedTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the variable was last updated.
        version:
          type: integer
          format: int32
          description: The version number of the variable representation. This representation
            is version 2.
        links:
          type: array
          description: The links that apply to the variable.
          items:
            $ref: "#/components/schemas/link"
