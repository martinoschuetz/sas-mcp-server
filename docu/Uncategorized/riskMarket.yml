  "/regulations/{regulationId}":
    get:
      tags:
      - Regulations
      summary: Get a regulation
      description: Returns the representation of the specified regulation.
      operationId: getRegulation
      parameters:
      - name: regulationId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the regulation.
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A hashed value generated when the regulation was last modified.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the regulation was last modified.
              schema:
                type: string
            Content-Location:
              description: The location of the regulation
              schema:
                type: string
          content:
            application/vnd.sas.risk.regulation+json:
              schema:
                $ref: "#/components/schemas/regulation"
              examples:
                json:
                  $ref: "#/components/examples/regulation"
            application/json:
              schema:
                $ref: "#/components/schemas/regulation"
        "404":
          description: No regulation exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    put:
      tags:
      - Regulations
      summary: Update a regulation
      description: Updates the specified regulation based on the representation in
        the request body.
      operationId: updateRegulation
      parameters:
      - name: regulationId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the regulation.
      - name: If-Unmodified-Since
        in: header
        schema:
          type: string
        description: The timestamp obtained from the most recent `Last-Modified` response
          header. Must match the timestamp when the regulation was last modified.
      - name: If-Match
        in: header
        schema:
          type: string
        description: The value obtained from the most recent `Etag` response header.
          Must match the value when the regulation was last modified.
      requestBody:
        description: A regulation to be updated.
        required: true
        content:
          application/vnd.sas.risk.regulation:
            schema:
              $ref: "#/components/schemas/updateRegulation"
            examples:
              json:
                $ref: "#/components/examples/updateRegulation"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.risk.regulation+json:
              schema:
                $ref: "#/components/schemas/regulation"
              examples:
                json:
                  $ref: "#/components/examples/regulation"
            application/json:
              schema:
                $ref: "#/components/schemas/regulation"
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the regulation was last modified.
              schema:
                type: string
            ETag:
              description: A hashed value generated when the regulation was last modified.
              schema:
                type: string
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No regulation exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "412":
          description: The If-Unmodified-Since or If-Match request header did not
            match the resource's last modified timestamp or hashed value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: The request headers did not include an If-Unmodified-Since
            or If-Match precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      tags:
      - Regulations
      summary: Delete a regulation
      description: The provided regulation will be deleted.
      operationId: deleteRegulation
      parameters:
      - name: regulationId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the regulation.
      - $ref: "#/components/parameters/deleteMembers"
      responses:
        "204":
          description: The request succeeded; nothing to return
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
