  /holidays/holiday/import:
    post:
      tags:
      - Holidays
      summary: Parse, validate and import holiday days as a collection
      description: Parse, validate and import all holiday days as a collection in
        jsonand return the in the same format.
      operationId: importHolidayDays
      requestBody:
        description: A collection of holiday days in json format
        required: true
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/holidayCollection"
            examples:
              json:
                $ref: "#/components/examples/holidayCollection"
          application/json:
            schema:
              $ref: "#/components/schemas/holidayCollection"
            examples:
