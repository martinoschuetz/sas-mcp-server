        \ by default; an Accept-Item header may be used to return smaller representations\
        \ that are more efficient to generate.\nThis query always sorts first by type,\
        \ so that nested groups appear first, then arrays, curves and surfaces appear\
        \ before risk factors; if a sortBy argument is supplied, it is applied after\
        \ sorting by type."
