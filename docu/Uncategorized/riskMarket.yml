        in: query
        schema:
          type: string
        required: true
        description: Specifies the type of data being processed in the export of transformations.
      requestBody:
        description: A file uploaded to be parsed
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadTransformations"
            example:
              $ref: "#/components/examples/uploadTransformations/value"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/reportTransformation"
              examples:
                json:
                  $ref: "#/components/examples/reportTransformation"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  "/transformations/{transformationId}":
    get:
      tags:
      - Transformations
      summary: Get a transformation
      description: Returns the representation of the specified transformation.
      operationId: getTransformation
      parameters:
      - name: transformationId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the transformation.
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A hashed value generated when the transformation was last
                modified.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the transformation was last modified.
              schema:
                type: string
            Content-Location:
              description: The location of the transformation
              schema:
                type: string
          content:
            application/vnd.sas.risk.transformation+json:
              schema:
                $ref: "#/components/schemas/transformation"
              examples:
                json:
                  $ref: "#/components/examples/transformation"
            application/json:
              schema:
                $ref: "#/components/schemas/transformation"
        "404":
          description: No transformation exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    put:
      tags:
      - Transformations
      summary: Update a transformation
      description: Updates the specified transformation based on the representation
        in the request body.
      operationId: updateTransformation
      parameters:
      - name: transformationId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the transformation.
      - name: If-Unmodified-Since
        in: header
        schema:
          type: string
        description: The timestamp obtained from the most recent `Last-Modified` response
          header. Must match the timestamp when the transformation was last modified.
      - name: If-Match
        in: header
        schema:
          type: string
        description: The value obtained from the most recent `Etag` response header.
          Must match the value when the transformation was last modified.
      requestBody:
        description: A transformation to be updated.
        required: true
        content:
          application/vnd.sas.risk.transformation:
            schema:
              $ref: "#/components/schemas/updateTransformation"
            examples:
              json:
                $ref: "#/components/examples/updateTransformation"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.risk.transformation+json:
              schema:
                $ref: "#/components/schemas/transformation"
              examples:
                json:
                  $ref: "#/components/examples/transformation"
            application/json:
              schema:
                $ref: "#/components/schemas/transformation"
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the transformation was last modified.
              schema:
                type: string
            ETag:
              description: A hashed value generated when the transformation was last
                modified.
              schema:
                type: string
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No transformation exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "412":
          description: The If-Unmodified-Since or If-Match request header did not
            match the resource's last modified timestamp or hashed value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: The request headers did not include an If-Unmodified-Since
            or If-Match precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      tags:
      - Transformations
      summary: Delete a transformation
      description: The provided transformation will be deleted.
      operationId: deleteTransformation
      parameters:
      - name: transformationId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the transformation.
      - $ref: "#/components/parameters/deleteMembers"
      responses:
        "204":
          description: The request succeeded; nothing to return
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /currencies:
    get:
      tags:
      - Currencies
      summary: Get the collection of currency codes in use
      description: Returns the collection of currency codes currently in use, sorted
        by currency code.  The collection is of media type "application/vnd.sas.risk.pipeline.currency".  This
        collection does not support filtering, sorting, or paging.
      operationId: getCurrencies
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/currencyCollection"
              examples:
                json:
                  $ref: "#/components/examples/currencyCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/currencyCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /dashboards:
    get:
      tags:
      - Dashboards
      summary: Retrieve all risk dashboards file info
      description: Returns a collection of personal dashboard file info.  The collection
        is of media type "application/vnd.sas.file".  This collection supports filtering.
      operationId: getDashboards
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/dashboardCollection"
              examples:
                json:
                  $ref: "#/components/examples/dashboardCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/dashboardCollection"
              examples:
                json:
                  $ref: "#/components/examples/dashboardCollection"
    post:
      tags:
      - Dashboard
      summary: Create a new dashboard from the request body
      description: The request body should be a json represenation of a dashboard.  The
        fileName must be unique.
      operationId: createDashboard
      parameters:
      - name: parentFolderUri
        in: query
        required: false
        schema:
          type: string
        description: optional parent folder location.  The default is "My Folder/Risk
          Dashboards"
      requestBody:
        description: A dashboard to be created.
        required: true
        content:
          application/vnd.sas.risk.dashboard+json:
            schema:
              $ref: "#/components/schemas/dashboard"
            examples:
              json:
                $ref: "#/components/examples/dashboard"
      responses:
        "201":
          description: The dashboard was created.
          headers:
            Location:
              description: The URI of the newly created dashboard.
              schema:
                type: string
          content:
            application/vnd.sas.risk.dashboard+json:
              schema:
                $ref: "#/components/schemas/dashboard"
              examples:
                json:
                  $ref: "#/components/examples/dashboard"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/dashboardInvalidError"
  /dashboards/{dashboardId}:
    get:
      tags:
      - Dashboard
      summary: Get a dashboard
      description: Returns the json representation of the specified dashboard.
      operationId: getDashboard
      parameters:
      - name: dashboardId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the dashboard.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Location:
              description: The location of the dashboard
              schema:
                type: string
          content:
            application/vnd.sas.risk.dashboard+json:
              schema:
                $ref: "#/components/schemas/dashboard"
              examples:
                json:
                  $ref: "#/components/examples/dashboard"
            application/json:
              schema:
                $ref: "#/components/schemas/dashboard"
              examples:
                json:
                  $ref: "#/components/examples/dashboard"
        "404":
          description: No dashboard exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/dashboardNotFoundError"
    put:
      tags:
      - Dashboard
      summary: Update a dashboard
      description: Updates the specified dashboard based on the representation in
        the request body.
      operationId: updateDashboard
      parameters:
      - name: dashboardId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the dashboard.
      requestBody:
        description: A dashboard to be updated.
        required: true
        content:
          application/vnd.sas.risk.dashboard:
            schema:
              $ref: "#/components/schemas/dashboard"
            examples:
              json:
                $ref: "#/components/examples/dashboard"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.risk.dashboard+json:
              schema:
                $ref: "#/components/schemas/dashboard"
              examples:
                json:
                  $ref: "#/components/examples/dashboard"
            application/json:
              schema:
                $ref: "#/components/schemas/dashboard"
              examples:
                json:
                  $ref: "#/components/examples/dashboard"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/dashboardInvalidIdError"
        "404":
          description: No dashboard exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/dashboardNotFoundError"
    delete:
      tags:
      - Dashboard
      summary: Delete a dashboard
      description: Deletes a dashboard.
      operationId: deleteDashboard
      parameters:
      - name: dashboardId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the dashboard.
      responses:
        "204":
          description: The request succeeded; nothing to return
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/dashboardInvalidIdError"
components:
  parameters:
    startDate:
      name: startDate
      in: query
      schema:
        type: string
        format: ISO-8601
      description: beginning of a date range for history queries
    endDate:
      name: endDate
      in: query
      schema:
        type: string
        format: ISO-8601
      description: ending of a date range for history queries
    asOfDate:
      name: asOfDate
      in: query
      schema:
        type: string
        format: ISO-8601
      description: date for which the base value of a variable should be reported
    marketState:
      name: marketState
      in: query
      schema:
        type: boolean
      description: when true, return only the most recent historical value of any
        variable. This cannot be used with sampleSize.
    sampleSize:
      name: sampleSize
      in: query
      schema:
        type: integer
      description: Indicates the sample size to be used when calculating the sample
        frequency. If the Risk Factor has more historical entries than the sample
        size, then the sample frequency will be CEIL(entries/sampleSize). Otherwise,
        the sample frequency will be set to 1. This cannot be used with marketState;
        paging is ignored when using sampleSize.
    deleteMembers:
      name: deleteMembers
      in: query
      schema:
        type: boolean
      description: when true, the requested variables along with any underly members
        will be deleted. For example, including the flag when deleting a curve would
        result in the curve and all of its unbderlying factors being deleted.
    filter:
      name: filter
      in: query
      schema:
        type: string
      description: The criteria for filtering the items in a collection. See [SAS
        REST APIs&colon; Filtering](https://developer.sas.com/rest-apis/riskMarket-v3/docs/getting-started/usage-notes#filtering).
    pagingStart:
      name: start
      in: query
      schema:
        type: integer
        format: int32
        default: 0
      description: pagination parameter, what is the starting index.
    pagingLimit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        default: 100
      description: pagination parameter, how many items to return.
    sortBy:
      name: sortBy
      in: query
      schema:
        type: string
      description: The criteria for sorting the items in a collection. See [SAS REST
        APIs&colon; Sorting](https://developer.sas.com/rest-apis/riskMarket-v3/docs/getting-started/usage-notes#sorting).
    locationType:
      name: locationType
      in: query
      schema:
        type: string
      required: true
      description: The type of server location to which variables will be written.
        One of 'directory'|'libname'.
    location:
      name: location
      in: query
      schema:
        type: string
      required: true
      description: the server location to which variables will be written. Varies
        based on locationType.  When libname, the name of the cas library containing
        the table to be written. When directory, the filesystem path on the server
        the document to be written.
    fileName:
      name: fileName
      in: query
      schema:
        type: string
      required: true
      description: name of the File or Table to which variables will be written
  schemas:
    associatedTransformation:
      title: Associated transformation
      description: The representation used to associate transformation to a variable.
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the transformation.
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/associatedTransformationParameter"
          description: List of associated output parameters used in the transformation
            code.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/associatedTransformationParameter"
          description: List of associated input parameters used in the transformation
            code.
    associatedTransformationParameter:
      title: Associated transformation parameter
      description: An associated transformation parameter providing input or output
        mapping of variables to the actual transformation parameters.
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: The name of the associated parameter.
        value:
          type: string
          description: The value being associated to the actual transformation parameter.
            The type of the value being associated must match the type specified by
            the actual transformation parameters.
    dataLocation:
      title: Data location attributes
      description: Parameters needed to access a data table (such as CAS)
      required:
      - locationType
      - location
      - fileName
      properties:
        locationType:
          type: string
          enum:
          - directory
          - libname
          - folder
        location:
          description: the folder or path of the file location
          type: string
        fileName:
          description: the file name at this location
          type: string
    coordinate:
      title: Coordinate
      description: A dimension name / value structure
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: The name of the coordinate's dimension.
        value:
          type: number
          format: float
          description: A specific value for the dimension
        unit:
          type: string
          description: For calendar-based dimensions, a period type; one of day, weekday,
            week, month, quarter, semiannual, year. When representing a date, the
            unit is the date format, such as YYYYMM.
        stringValue:
          type: string
          description: Only used when representing a date. It must conform the date
            format in the unit property.
    createRegulation:
      title: Create regulation
      description: The representation used to create a new regulation.
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the regulation.
        label:
          type: string
          description: An alternate name of the regulation, typically friendlier for
            use in the user interface than the name.  Defaults to the name field when
            not present.
        description:
          type: string
          description: The description of the regulation.
        type:
          description: A code describing the type of regulation. 'irrbb' indicates
            the regulation is an IRRBB Regulation.
          type: string
          enum:
          - irrbb
        source:
          type: string
          description: The name of a source that defines this regulation, or from
            which this regulation was derived.
        parameters:
          type: array
          items:
            type: object
            description: When type = 'irrbb', required list of one or more IRRBB Parameters.
            properties:
              baseClass:
                type: string
                description: optional name of a Base Class variable.
              currency:
                type: string
                description: optional name of a currency.
              constantX:
                type: number
                format: float
                description: required Constant X value.
              steepShort:
                type: number
                format: float
                description: required Steep Short value.
              steepLong:
                type: number
                format: float
                description: required Steep Long value.
              flatShort:
                type: number
                format: float
                description: required Flat Short value.
              flatLong:
                type: number
                format: float
                description: required Flat Long value.
        shocks:
          type: array
          items:
            type: object
            description: When type = 'irrbb', required list of one or more IRRBB Shocks.
            properties:
              baseClass:
                type: string
                description: optional name of a Base Class variable.
              currency:
                type: string
                description: optional name of a currency.
              parallelShock:
                type: number
                format: float
                description: required Parallel Shock value.
              shortShock:
                type: number
                format: float
                description: required Short Shock value.
              longShock:
                type: number
                format: float
                description: required Long Shock value.
    createTransformation:
      title: Create transformation
      description: The representation used to create a new transformation.
      required:
      - name
      - type
      - code
      properties:
        name:
          type: string
          description: The name of the transformation.
        label:
          type: string
          description: An alternate name of the transformation, typically friendlier
            for use in the user interface than the name.  Defaults to the name field
            when not present.
        description:
          type: string
          description: The description of the transformation.
        type:
          description: A code describing the type of transformation. 'formula' indicates
            the transformation is is formula based.
          type: string
          enum:
          - formula
        code:
          type: string
          description: The user provide code for the transformation.
        source:
          type: string
          description: The name of a source that defines this transformation, or from
            which this transformation was derived.
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/transformationParameter"
          description: List of output parameters used in the transformation code.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/transformationParameter"
          description: List of input parameters used in the transformation code.
    currency:
      title: Currency Code
      description: The representation of a currency.
      properties:
        id:
          title: ID
          description: The ISO-4217 standard code for a currency (or compatible code
            for user-defined currency)
          type: string
        label:
          type: string
          description: The name of the currency, generally including the country of
            origin.
        version:
          type: integer
          format: int32
          description: The version number of the variable representation. This representation
            is version 1.
    currencyCollection:
      title: Currency Collection
      description: A collection of currencies.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/currency"
            description: The array of application/vnd.sas.risk.pipeline.currency representations.
    curveHistory:
      title: Curve History
      description: Historical information for a risk factor array
      properties:
        count:
          type: integer
          description: The total number of rows matching the query conditions.
        columnCount:
          type: integer
          description: The number of columns (4 in this format) in the collection.
        columns:
          type: array
          description: The rows' corresponding column names as JSON strings.  In this
            format, the columns are 'Date', 'Variable', 'Maturity', and 'Value'.
          items:
            type: string
        rows:
          type: array
          description: The historical information as an array of objects containing
            arrays of heterogeneous data.
          items:
            type: object
            properties:
              version:
                type: integer
                format: int32
                description: The version number of the row representation. This representation
                  is version 2.
              cells:
                description: The historical data, consisting of a date, a curve name,
                  a maturity (unit & interval), and a value.
                type: array
                items: {}
        version:
          type: integer
          format: int32
          description: The version number of the row set representation. This representation
            is version 2.
    holidaySchedule:
      title: Holiday schedule
      description: A collection of dates as holidays, also include which days of week
        are weekend days.
      properties:
        id:
          description: The unique ID assigned to a holiday schedule. This field is
            required in holiday schedule update and some queries. It is not applicable
            when creating a holiday schedule.
          type: string
        calendarName:
          type: string
          description: the name of the calendar or holiday schedule
        calendarType:
          type: string
          description: the type of the calendar or holiday schedule
        mondayFlag:
          type: boolean
          description: if true, all mondays are considered holidays
        tuesdayFlag:
          type: boolean
          description: if true, all tuesdays are considered holidays
        wednesdayFlag:
          type: boolean
          description: if true, all wednesdays are considered holidays
        thursdayFlag:
          type: boolean
          description: if true, all thursdays are considered holidays
        fridayFlag:
          type: boolean
          description: if true, all fridays are considered holidays
        saturdayFlag:
          type: boolean
          description: if true, all saturdays are considered holidays
        sundayFlag:
          type: boolean
          description: if true, all sundays are considered holidays
        firstYear:
          type: integer
          description: the first effective year of the calendar or holiday schedule
        finalYear:
          type: integer
          description: the final effective year of the calendar or holiday schedule
        businessDaysInYear:
          type: integer
          description: the number of business days in a year for this calendar or
            holiday schedule
        createdBy:
          type: string
          description: the userid of the creator of a variable.
        creationTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the variable was created.
        modifiedBy:
          type: string
          description: the userid of the last user to update a variable.
        modifiedTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the variable was last updated.
    holidayScheduleCollection:
      title: Holiday Schedule Collection
      description: A collection of holiday schedule representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/holidaySchedule"
            description: The array of application/vnd.sas.risk.holiday.schedule representations.
    holiday:
      title: Holiday day
      description: One entry in the holiday table used to indicate a holiday date
      properties:
        id:
          description: The unique ID assigned to a holiday day. This field is required
            in holiday day update and some queries. It is not applicable when creating
            a holiday day.
          type: string
        calendarName:
          type: string
          description: the name of the calendar or holiday schedule
        date:
          type: string
          format: ISO-8601
          description: the holiday date, only year/month/day date is used
        createdBy:
          type: string
          description: the userid of the creator of a variable.
        creationTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the variable was created.
        modifiedBy:
          type: string
          description: the userid of the last user to update a variable.
        modifiedTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the variable was last updated.
    holidayCollection:
      title: Holiday Collection
      description: A collection of holiday representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/holiday"
            description: The array of application/vnd.sas.risk.holiday.day representations.
    holidayReport:
      title: Holiday report for file to be imported
      description: A report of the results of a holiday upload operation, including
        any errors encountered.
      properties:
        toCreateHolidays:
          $ref: "#/components/schemas/holidayCollection"
        toUpdateHolidays:
          $ref: "#/components/schemas/holidayCollection"
        toCreateSchedules:
          $ref: "#/components/schemas/holidayScheduleCollection"
        toUpdateSchedules:
          $ref: "#/components/schemas/holidayScheduleCollection"
    holidayImport:
      title: Holiday import result from a file
      description: The import results of a holiday upload operation.
      properties:
        holidays:
          $ref: "#/components/schemas/holidayCollection"
        schedules:
          $ref: "#/components/schemas/holidayScheduleCollection"
    holidayUploadFile:
      title: Holiday upload file
      description: The multipart/form-data carrying a supported import document
      properties:
        file:
          title: uploaded file
          type: object
          description: the uploaded file containing one or more risk holidays.
    historyV1:
      title: Variable History v1
      description: Historical information for a set of variables.  This format is
        deprecated, being maintained only as an output format for backwards compatability.
      properties:
        count:
          type: integer
          description: The actual number of rows returned in the collection.
        columnCount:
          type: integer
          description: The number of columns in the collection.
        columns:
          type: array
          description: The rows' corresponding column names as JSON strings.
          items:
            type: string
        rows:
          type: array
          description: The results of this query as an array containing arrays of
            heterogeneous data.
          items:
            description: The historical data, consisting of a date and a set of historical
              values of arbitrary type (although typically numeric).
            type: array
            items: {}
        version:
          type: integer
          format: int32
          description: The version number of the row set representation. This representation
            is version 1.
    historyV2:
      title: Variable History v2
      description: Historical information for a set of variables
      properties:
        count:
          type: integer
          description: The actual number of rows returned in the collection.
        columnCount:
          type: integer
          description: The number of columns in the collection.
        columns:
          type: array
          description: The rows' corresponding column names as JSON strings.
          items:
            type: string
        rows:
          type: array
          description: The historical information as an array of objects containing
            arrays of heterogeneous data.
          items:
            type: object
            properties:
              version:
                type: integer
                format: int32
                description: The version number of the row representation. This representation
                  is version 2.
              cells:
                description: The historical data, consisting of a date and a set of
                  historical values of arbitrary type (although typically numeric).
                type: array
                items: {}
        version:
          type: integer
          format: int32
          description: The version number of the row set representation. This representation
            is version 2.
    historyValidationReport:
      description: report that is generated on history import
      type: object
      properties:
        SheetSummary:
          description: the report that is generated on history import for every sheet
          type: object
          additionalProperties:
            type: object
            properties:
              EndDate:
                description: last date in the report
                type: string
                format: date
              StartDate:
                description: first date in the report
                type: string
                format: date
              Errors:
                description: list of all non critical errors that occurred during
                  processing
                type: array
                items: {}
              MarketDataTypes:
                description: report on all market data types
                type: object
                additionalProperties:
                  type: object
                  properties:
                    NumberOfRows:
                      description: total number of rows in the rowset
                      type: integer
                    NumberOfVariables:
                      description: total number of columns/variables in the rowset,
                        excluding the date column
                      type: integer
                    NumberOfDataPoints:
                      description: total number of non null or empty cells
                      type: integer
    historyDataCollection:
      title: History data collection
      description: A collection of row sets of history data
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/historyV2"
            description: The array of row sets with history data.
    multiValueHistory:
      title: Variable History query response for variables
      description: Historic data as a map row set with keys being the market data
        types
      type: object
      additionalProperties:
        $ref: "#/components/schemas/historyV2"
    historyDataStreamingStatus:
      title: streaming history data process status
      description: a row set of data about processing status
      properties:
        columns:
          type: array
          description: The names of status properties as JSON strings.
          items:
            type: string
        rows:
          type: array
          description: The values for the progress status properties. There is only
            one row data.
          items:
            type: object
            properties:
              cells:
                description: values of the progress status properties.
                type: array
                items: {}
        version:
          type: integer
          format: int32
          description: The version number of the row set representation. This representation
            is version 2.
    uploadHistoryData:
      title: Upload history data
      description: The multipart/form-data carrying a supported import document
      properties:
        file:
          title: uploaded file
          type: object
          description: the uploaded file containing history data for one or more risk
            variables.
    uploadHistoryLocation:
      title: Upload history data from CAS
      description: The location information needed to access the file/table.
      properties:
        locationType:
          description: The type of location.
          type: string
          enum:
          - directory
          - libname
          - folder
        location:
          description: The location of the file/table.
          type: string
        fileName:
          description: The name of the file/table.
          type: string
        contentType:
          description: Media type identifying the content of the file/table.
          type: string
          enum:
          - application/vnd.sas.risk.variable.history
    idList:
      title: Variable Name/ID List
      description: An array of variable names or ids
      properties:
        items:
          description: an array of variable names or ids
          type: array
          items:
            type: string
    transformationParameter:
      title: Parameter
      description: A transformation parameter providing input or output information.
      required:
      - name
      - type
      properties:
        name:
          type: string
          description: The name of the parameter.
        type:
          description: The type of value for the named parameter.
          type: string
          enum:
          - factor
    historyExportStats:
      title: Variable History Export Statistics
      description: Statistics of exporting historical information for a set of variables
      properties:
        variableCount:
          type: integer
          description: The actual number of variables included in the export.
        rowCount:
          type: integer
          description: The number of data rows included in the export.
        dataCount:
          type: integer
          description: The number of data cells included in the export.
    marketDateV1:
      title: Market Date v1
      description: Date of the most recent historical information for a set of variables.  This
        format is deprecated, being maintained only as an output format for backwards
        compatability.
      properties:
        count:
          type: integer
          description: The actual number of rows (1 in this case) in the collection.
        columnCount:
          type: integer
          description: The number of columns (1 in this case) in the collection.
        columns:
          type: array
          description: The rows' corresponding column names as JSON strings.  In this
            case, the column name is 'Date'.
          items:
            type: string
        rows:
          type: array
          description: The results of this query as an array containing an array of
            one date.
          items:
            description: The date of the most recent historical data.
            type: array
            items: {}
        version:
          type: integer
          format: int32
          description: The version number of the row set representation. This representation
            is version 1.
    marketDateV2:
      title: Market Date v2
      description: The date of the most recent historical information for a set of
        variables
      properties:
        count:
          type: integer
          description: The actual number of rows (1 in this case) in the collection.
        columnCount:
          type: integer
          description: The number of columns (1 in this case) in the collection.
        columns:
          type: array
          description: The rows' corresponding column names as JSON strings.  In this
            case, the column name is 'Date'.
          items:
            type: string
        rows:
          type: array
          description: The date of the most recent historical information as an array
            of 1 object containing and array of 1 date.
          items:
            type: object
            properties:
              version:
                type: integer
                format: int32
                description: The version number of the row representation. This representation
                  is version 2.
              cells:
                description: The date of the most recent historical information.
                type: array
                items: {}
        version:
          type: integer
          format: int32
          description: The version number of the row set representation. This representation
            is version 2.
    marketDataType:
      title: Market Data Type
      description: describes a market data type
      properties:
        name:
          type: string
          description: The name of the market data type.
          enum:
          - value
          - stdev_spread
          - fut_option_price
          - coupon_rate
          - price
        label:
          type: string
          description: The label for the market data type, possibly for display purposes.
    marketDataTypeCollection:
      title: Market Data Type Collection
      description: A collection of market data types.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/marketDataType"
            description: The array of application/vnd.sas.risk.variable.market.data.type.
    updateRegulation:
      title: Update regulation
      description: The representation used to update a regulation.
      required:
      - id
      - name
      properties:
        name:
          type: string
          description: The name of the regulation.
        label:
          type: string
          description: An alternate name of the regulation, typically friendlier for
            use in the user interface than the name.  Defaults to the name field when
            not present.
        description:
          type: string
          description: The description of the regulation.
        type:
          description: A code describing the type of regulation. 'irrbb' indicates
            the regulation is an IRRBB Regulation.
          type: string
          enum:
          - irrbb
        source:
          type: string
          description: The name of a source that defines this regulation, or from
            which this regulation was derived.
        parameters:
          type: array
          items:
            type: object
            description: When type = 'irrbb', required list of one or more IRRBB Parameters.
            properties:
              baseClass:
                type: string
                description: optional name of a Base Class variable.
              currency:
                type: string
                description: optional name of a currency.
              constantX:
                type: number
                format: float
                description: required Constant X value.
              steepShort:
                type: number
                format: float
                description: required Steep Short value.
              steepLong:
                type: number
                format: float
                description: required Steep Long value.
              flatShort:
                type: number
                format: float
                description: required Flat Short value.
              flatLong:
                type: number
                format: float
                description: required Flat Long value.
        shocks:
          type: array
          items:
            type: object
            description: When type = 'irrbb', required list of one or more IRRBB Shocks.
            properties:
              baseClass:
                type: string
                description: optional name of a Base Class variable.
              currency:
                type: string
                description: optional name of a currency.
              parallelShock:
                type: number
                format: float
                description: required Parallel Shock value.
              shortShock:
                type: number
                format: float
                description: required Short Shock value.
              longShock:
                type: number
                format: float
                description: required Long Shock value.
    updateTransformation:
      title: Update transformation
      description: The representation used to update a transformation.
      required:
      - id
      - name
      - type
      - code
      properties:
        name:
          type: string
          description: The name of the transformation.
        label:
          type: string
          description: An alternate name of the transformation, typically friendlier
            for use in the user interface than the name.  Defaults to the name field
            when not present.
        description:
          type: string
          description: The description of the transformation.
        type:
          description: A code describing the type of transformation. 'formula' indicates
            the transformation is is formula based.
          type: string
          enum:
          - formula
        code:
          type: string
          description: The user provide code for the transformation.
        source:
          type: string
          description: The name of a source that defines this transformation, or from
            which this transformation was derived.
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/transformationParameter"
          description: List of output parameters used in the transformation code.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/transformationParameter"
          description: List of input parameters used in the transformation code.
    variable:
      title: Variable
      description: The representation of a variable.
      required:
      - name
      properties:
        id:
          title: Variable ID
          description: The unique ID assigned to a variable. This field is required
            in variable update and some queries. It is not applicable when creating
            a variable.
          type: string
        name:
          type: string
          description: The name of the variable. This field is required and generally
            used in code and server side procedures, and was at one time restricted
            to unquoted SAS names.
        label:
          type: string
          description: An alternate name of the variable, typically friendlier for
            use in the user interface than the name.  Defaults to the name field when
            not present.
        description:
          type: string
          description: The description of the variable.
        type:
          description: A code describing the type of variable. 'factor' indicates
            the variable is a simple scalar value, almost always numeric. 'array',
            'curve' or 'surface' indicates the variable is a list of simple variables.
            'group' indicates the variable is an arbitrary collection of simple, array,
            curve and surface variables. 'instrument' indicates the variable is a
            property of an asset, which can be of any type. 'reference' indicates
            the variable is a reference variable, and can be used to map arbitrary
            keys to existing variables of type 'factor', 'array', 'curve', or 'surface'.
          type: string
          enum:
          - factor
          - array
          - curve
          - surface
          - group
          - instrument
          - reference
        purpose:
          type: string
          default: general
          description: A comma separated list of tags describing the purpose(s) for
            which the variable is used.
        source:
          type: string
          description: The name of a source that defines this variable, or from which
            this variable was derived.
        role:
          type: string
          description: Code that specifies the purpose of the risk factor, array,
            curve or surface. For more information, see [Risk Types, Roles, and Role
            Categories](https://go.documentation.sas.com/doc/en/rfmcdc/v_023/rfmug/p0wgsv70zv51dgn1qhd9irie3h3g.htm).
          enum:
          - factor
          - fx
          - fx_spot
          - ir
          - volatility
        roleCategory:
          type: string
          description: Code that specifies the purpose of the risk factor, array,
            curve, surface or group. For more information, see [Risk Types, Roles,
            and Role Categories](https://go.documentation.sas.com/doc/en/rfmcdc/v_023/rfmug/p0wgsv70zv51dgn1qhd9irie3h3g.htm).
            For a static group, the role category can have the value of either yield_class
            or volatility_set. For a dynamic group for table data, the role category
            is the table type. It can also have the value of implied_]volatility for
            a surface group.
          enum:
          - credit_spread
          - equity_index
          - factor
          - fx
          - fx_spot
          - implied_volatility
          - index
          - ir
          - macro_factor
          - volatility
          - fx_implied_volatility
          - ir_implied_volatility
          - transition_matrix_set
        scope:
          type: string
          description: When type = 'factor', specifies the scope of the variable.
            For example, a 'scenario' scoped variable indicates that the variable
            is used only in a scenario and there is no underlying market data associated
            with the variable.
          enum:
          - scenario
        group:
          type: string
          description: When type = 'factor'|'array'|'curve'|'surface', optional group
            to which this variable has been assigned.
        valueType:
          type: string
          description: When type = 'curve' and roleCategory = 'ir'|'credit_spread',
            optional code identifying the value type.
          enum:
          - Discount Bond Yield
          - Discount Bond Price
          - Same Series Par Bond
          - Same Series Non-Par Bond
          - Different Series Bond
          - Periodic Zero Rate
        couponRate:
          type: number
          description: When type = 'factor' and roleCategory = 'ir'|'credit_spread',
            optional coupon rate for the risk factor.
        spreadType:
          type: string
          description: When type = 'curve', optional spread type for the curve.
          enum:
          - Base Yield Curve (No Spread)
          - Spread-by Security (Constant)
          - Spread-by Security and Term Structure
          - Spread-by Term Structure
          - Spread-by Default and Recovery
          - Spread-by Hazard Function
          - Spread-by Term Structure (No Base)
          - User-adjusted Yield Curve
          - Synthetic Yield Curve (No Spread)
        baseClass:
          type: string
          description: When type = 'curve' and the spreadType has been set, required
            name of a class.
        currency:
          type: string
          description: When type = 'factor'|'array'|'curve'|'surface', optional currency
            code for a variable that is expressed in currency units
        fromCurrency:
          type: string
          description: When type = 'factor'|'array'|'curve'|'surface', optional source
            currency code for a variable that describes currency conversions
        baseValue:
          type: number
          format: double
          description: Only applicable in a query result. When type = 'factor', starting
            value for variable, provided by a risk environment or taken from stored
            variable history
        stochasticProcess:
          type: string
          description: When type = 'factor', optional code for volatility computation
          enum:
          - gbm
          - interval
          - ratio
        baseVariable:
          type: string
          description: When type = 'factor' and role='volatility', this variable tracks
            the volatility for the named risk factor
        hasMaturity:
          type: boolean
          description: When type = 'array'|'curve'|'surface', true when one or more
            members have maturity values.
        maturityType:
          description: When type = 'curve', tracks the type of maturity in the underlying
            members. A maturityType of 'unit' requires that all underlying members
            specify a maturity using a 'unit' and 'value'. A maturityType of 'years'
            requires that all underlying members specify a maturity using 'value'
            in fractional years.
          type: string
          enum:
          - unit
          - years
        dayCount:
          description: When type = 'factor'|'array'|'curve'|'surface', this affects
            the calculation of year fractions for use when discounting cash flows.
            Its value defaults to ACT/365 when processing objects other than type
            = 'factor'.
          type: string
          enum:
          - ACT/365.25
          - ACT/360
          - ACT/364
          - ACT/365
          - ACT/366
          - 30/360
          - 30/365
          - ACT/ACT/ICMA
          - RDDAYCOUNT
          - 30E/360
          - ACT/365L
          - 30E+/360
          - ACT/ACT/ISDA
          - 30E/360/ISDA
          - ACT/365A
          - NL/360
          - NL/365
        paymentFreq:
          type: object
          description: When type = 'factor'|'array'|'curve'|'surface' and dayCount
            = 'ACT/ACT/ICMA', specification of payment frequency to apply when calculating
            cash flow year fractions for the discount rate or spread. This is optional
            for risk factors and required otherwise. For example, a variable describing
            an annuity that pays monthly would be defined with paymentFreq.value ==
            1 and paymentFreq.unit == 'month'.
          properties:
            value:
              type: integer
              description: count of periods between payments
            unit:
              type: string
              description: type of period that elapses between payments
        compoundingFreq:
          type: object
          description: When type = 'factor'|'array'|'curve'|'surface', optional specification
            of compounding frequency for the interest rate. For example, an interest
            rate compounded quarterly would be defined with compoundingFreq.value
            == 3 and compoundingFreq.unit == 'month'. Its value defaults to compoundingFreq.value
            == 1 and compoundingFreq.unit == 'year' when processing objects other
            than type = 'factor'.
          properties:
            value:
              type: integer
              description: count of periods between compoundingFreq
            unit:
              type: string
              description: type of period that elapses between compoundingFreq
        members:
          type: array
          items:
            type: string
          description: When type = 'array'|'curve'|'surface'|'group', the names of
            all variable members of the array, curve, surface or group.
        hasFilteredMembers:
          type: boolean
          description: Only applicable in a query result. Included only on the members
            query when an underlying member has type = 'group', the flag indicates
            whether there are any remaining members for the group after applying a
            filter.
        transformations:
          type: array
          items:
            $ref: "#/components/schemas/associatedTransformation"
          description: When type = 'factor'|'array'|'curve'|'surface', an optional
            list associated transformations used to derive the value of the variable.
        expression:
          type: string
          items:
            type: string
          description: When type = 'group', the expression can be used in place of
            members to define a rule that identifies the dynamic members of a group.
        isClass:
          type: boolean
          description: When type = 'group', true indicates that the group is designated
            as a class.
        bondClass:
          type: string
          description: Only applicable when type = 'factor'. Max length 100.
        securityId:
          type: string
          description: Only applicable when type = 'factor'. Max length 32.
        issuer:
          type: string
          description: Only applicable when type = 'factor'. Max length 100.
        derivativeType:
          type: string
          description: Only applicable when type = 'factor'.
          enum:
          - MMFut
          - MMFutOpt
          - BondFut
          - BondFutOpt
          - EquityIdxFut
          - EquityIdxOpt
          - EquityIdxFwd
          - CapsFloors
          - Swaption
          - FXOpt
          - FXFut
          - FXFutOpt
          - BondOpt
          - EquityOpt
        exchangeId:
          type: string
          description: The id of the exchange where the security is traded. Max length
            8.
        optionType:
          type: string
          description: option type.
          enum:
          - call
          - put
          - cap
          - floor
          - righttoreceive
          - righttopay
        symbol:
          type: string
          description: Overloaded field based on derivative type in KRM. Max length
            16.
        volatilityType:
          type: string
          description: Dependent on derivative type. Only applicable to surfaces with
            roleCategory=implied_volatility
          enum:
          - lognormal
          - normal
          - strike
          - forwarddelta
          - spotprice
        capVolatility:
          type: string
          description: Used with CapsFloors derivative type. Only applicable to surfaces
            with roleCategory=implied_volatility
          enum:
          - cap
          - caplet
        strikeType:
          type: string
          description: Used with CapsFloors and Swaptions derivative types. Only applicable
            to surfaces with roleCategory=implied_volatility
          enum:
          - strikerate
          - forwardrate
          - aftershift
        referenceRate:
          type: number
          format: float
          description: Reference rate for Lognormal surface. Max length 11.
        transitionMatrixSetID:
          type: string
          description: Required for roleCategory TransitionMatrixSet. Max length 15.
        holidayID:
          type: string
          description: The ID of the holiday schedule.
        holidayConvention:
          type: string
          description: Business day convention when payment dates fall on a weekend
            or holiday.
          enum:
          - ignore
          - modifiedfollowing
          - following
          - preceding
          - advancingcoupon
          - modifiedpreceding
        rules:
          type: array
          items:
            type: string
          description: A set of enumerated values that control how unusual special
            cases are handled for specific endpoints.  When type = 'factor', 0 or
            1 of the following may be specified to control what happens in a history
            query where the marketState flag is true and there is no value  for a
            factor for the supplied endDate (or for the last available date if no
            endDate is supplied); REQUIRED_FOR_MARKET_STATE causes the history query
            to fail, MISSING_FOR_MARKET_STATE causes the history to to include a missing
            value for the factor, and FLAT_LINE_FOR_MARKET_STATE (the default for
            this rule) causes the history to include the most recent available value
            for the factor.
        interpolation:
          description: When type = 'curve'|'surface', a code describing how to interpolate
            the value for a point inside the boundaries of the underlying coordinates.
            Its value defaults to 'linear' for objects of type = 'curve' and 'bilinear'
            for objects of type 'surface'.
          type: string
          enum:
          - fwdrate
          - linear
          - loglinear
          - spline
          - step
          - nelsonsiegel
          - nelsonsiegelsvensson
          - maximumsmoothnessforwardrate
          - cubicsplineofprices
          - cubicsplineofyields
          - linearsplineofprices
          - linearsplineofyields
          - vasicek
        splineType:
          description: When type = 'curve' and interpolation = 'spline', a code describing
            the type of spline to use when interpolating. Its value defaults to 'notaknot'.
          type: string
          enum:
          - natural
          - notaknot
        extrapolation:
          description: When type = 'curve'|'surface', a code describing how to interpolate
            the value for a point outside the boundaries of the underlying coordinates.
            Its value defaults to 'constant'.
          type: string
          enum:
          - constant
          - missing
          - linear
        coordinates:
          type: array
          items:
            $ref: "#/components/schemas/coordinate"
          description: When type = 'factor', an optional list of 1 or 2 dimension
            values.
        customAttributes:
          description: User defined name/value pairs as custom attributes
          type: string
          additionalProperties:
            type: string
        references:
          description: reference variable/key pairs that identify this variable
          type: object
          properties:
            variable:
              type: string
              description: name of a reference variable
            key:
              type: string
              description: key for the reference variable used as a unique identifier
        sourceGroup:
          description: A static group of surfaces that this dynamic group references.
            The dynamic group only picks up factors within those surfaces based on
            the dynamic group expression.
          type: string
        createdBy:
          type: string
          description: the userid of the creator of a variable.
        creationTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the variable was created.
        modifiedBy:
          type: string
          description: the userid of the last user to update a variable.
        modifiedTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the variable was last updated.
        version:
          type: integer
          format: int32
          description: Only applicable in responses. The version number of the variable
            representation. This representation is version 2.
        links:
          type: array
          description: The links that apply to the variable. Only applicable in responses.
          items:
            $ref: "#/components/schemas/link"
    parentVariables:
      title: Parent variables of the given variables in request body
      description: Retrieve parent variables (curve, surface, group, etc.) of the
        given variable names.
      type: object
      additionalProperties:
        type: array
        items:
          $ref: "#/components/schemas/variable"
    regulation:
      title: Regulation
      description: The representation of a regulation.
      properties:
        id:
          title: Variable ID
          description: The unique ID assigned to a regulation.
          type: string
        name:
          type: string
          description: The name of the regulation.
        label:
          type: string
          description: An alternate name of the regulation, typically friendlier for
            use in the user interface than the name. Defaults to the name field when
            not present.
        description:
          type: string
          description: The description of the regulation.
        type:
          description: A code describing the type of regulation. 'irrbb' indicates
            the regulation is an IRRBB Regulation.
          type: string
          enum:
          - irrbb
        source:
          type: string
          description: The name of a source that defines this regulation, or from
            which this regulation was derived.
        parameters:
          type: array
          items:
            type: object
            description: When type = 'irrbb', required list of one or more IRRBB Parameters.
            properties:
              baseClass:
                type: string
                description: optional name of a Base Class variable.
              currency:
                type: string
                description: optional name of a currency.
              constantX:
                type: number
                format: float
                description: required Constant X value.
              steepShort:
                type: number
                format: float
                description: required Steep Short value.
              steepLong:
                type: number
                format: float
                description: required Steep Long value.
              flatShort:
                type: number
                format: float
                description: required Flat Short value.
              flatLong:
                type: number
                format: float
                description: required Flat Long value.
        shocks:
          type: array
          items:
            type: object
            description: When type = 'irrbb', required list of one or more IRRBB Shocks.
            properties:
              baseClass:
                type: string
                description: optional name of a Base Class variable.
              currency:
                type: string
                description: optional name of a currency.
              parallelShock:
                type: number
                format: float
                description: required Parallel Shock value.
              shortShock:
                type: number
                format: float
                description: required Short Shock value.
              longShock:
                type: number
                format: float
                description: required Long Shock value.
        createdBy:
          type: string
          description: the userid of the creator of a regulation.
        creationTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the regulation was created.
        modifiedBy:
          type: string
          description: the userid of the last user to update a regulation.
        modifiedTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the regulation was last updated.
        version:
          type: integer
          format: int32
          description: The version number of the regulation representation. This representation
            is version 2.
        links:
          type: array
          description: The links that apply to the regulation.
          items:
            $ref: "#/components/schemas/link"
