    tableData:
      title: Additional table data other than the history data table
      description: additional data table.
      properties:
        count:
          type: integer
          description: The actual number of rows returned in the collection.
        columnCount:
          type: integer
          description: The number of columns in the collection.
        columns:
          type: array
          description: The rows' corresponding column names as JSON strings. They
            match the columns of the underlying database table columns
          items:
            type: string
        rows:
          type: array
          description: The results of this query as an array containing arrays of
            data.
          items:
            type: object
            properties:
              cells:
                description: Each data row retrived from the database based on the
                  query filter.
                type: array
                items: {}
        version:
          type: integer
          format: int32
          description: The version number of the row set representation. This representation
            is version 2.
    tableDataInfo:
      title: The result of the table data operating
      description: The result of the table data operating.
      properties:
        rowCount:
          type: integer
          description: the number of rows affected from this operation.
    tableDataProcessStatus:
      title: streaming table data process status
      description: a row set of data about processing status for asynchronous operations
      properties:
        columns:
          type: array
          description: The names of status properties as JSON strings.
          items:
            type: string
        rows:
          type: array
          description: The values for the progress status properties. There is only
            one row data.
          items:
