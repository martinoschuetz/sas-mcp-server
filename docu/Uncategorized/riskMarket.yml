              - $ref: "#/components/schemas/historyV2"
              - $ref: "#/components/schemas/curveHistory"
          application/vnd.sas.data.row.set+json;version=2:
            schema:
              oneOf:
              - $ref: "#/components/schemas/historyV2"
              - $ref: "#/components/schemas/curveHistory"
          application/vnd.sas.risk.location:
            schema:
              $ref: "#/components/schemas/uploadHistoryLocation"
            example:
              $ref: "#/components/examples/uploadHistoryLocation/value"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadHistoryData"
            example:
              $ref: "#/components/examples/uploadHistoryData/value"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.data.row.set+json:
              schema:
                $ref: "#/components/schemas/historyV2"
              examples:
                json:
                  $ref: "#/components/examples/historyV2"
            application/vnd.sas.data.row.set+json;version=1:
              schema:
                $ref: "#/components/schemas/historyV1"
              examples:
                json:
                  $ref: "#/components/examples/historyV1"
            application/vnd.sas.data.row.set+json;version=2:
              schema:
                $ref: "#/components/schemas/historyV2"
              examples:
                json:
                  $ref: "#/components/examples/historyV2"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/historyDataCollection"
              examples:
                json:
                  $ref: "#/components/examples/historyDataCollection"
            application/vnd.sas.risk.variable.data.processing.status+json:
              schema:
                $ref: "#/components/schemas/historyDataStreamingStatus"
              examples:
                json:
                  $ref: "#/components/examples/historyDataStreamingStatus"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /variables/history#import:
    post:
      tags:
      - Variables
      summary: Import historical information for a collection of variables
      description: Imports historical information for a collection of variables or
        an Excel file.  Note that only version 2 of the row set data structure is
        supported for input, but both version 1 and version 2 may be returned. All
        referenced variables from the input should already exist in the system. When
        importing an Excel file, client should use accept header application/vnd.sas.collection+json
        (sync) or application/vnd.sas.risk.variable.data.processing.status+json (async).  In
        async operation, the response header Content-Location provides a polling URL
        for the processing status (Get method).
      operationId: importVariablesHistory
      requestBody:
        description: the historical information to import
        content:
          application/vnd.sas.data.row.set+json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/historyV2"
              - $ref: "#/components/schemas/curveHistory"
          application/vnd.sas.data.row.set+json;version=2:
            schema:
              oneOf:
              - $ref: "#/components/schemas/historyV2"
              - $ref: "#/components/schemas/curveHistory"
          application/vnd.sas.risk.location:
            schema:
              $ref: "#/components/schemas/uploadHistoryLocation"
            example:
              $ref: "#/components/examples/uploadHistoryLocation/value"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadHistoryData"
            example:
              $ref: "#/components/examples/uploadHistoryData/value"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.data.row.set+json:
              schema:
                $ref: "#/components/schemas/historyV2"
              examples:
                json:
