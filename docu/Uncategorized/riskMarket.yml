          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No variable exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
