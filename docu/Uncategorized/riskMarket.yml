      operationId: updateHoliday
      parameters:
      - name: holidayId
        description: the id of the holiday day
        in: path
        required: true
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        schema:
          type: string
        description: The timestamp obtained from the most recent `Last-Modified` response
          header. Must match the timestamp when the object was last modified.
      - name: If-Match
        in: header
        schema:
          type: string
        description: The value obtained from the most recent `Etag` response header.
