  /tabledata:
    get:
      tags:
      - Table Data
      summary: Get the table data from the given table type
      description: Get rows of data from the given table type and apply filter as
        requested. In addition to the listed query parameters, all table columns can
        be used as filters, so they depend on the table types.
      operationId: getTableData
      parameters:
      - $ref: "#/components/parameters/filter"
      - name: tableType
        description: the type of table this request to query on. It maps to a data
          table.
        in: query
        required: true
        schema:
          type: string
      - name: latest
        description: when latest=true, return the latest data record and the sortBy
          parameter will be turned off, if present.
        in: query
        required: false
        schema:
          type: boolean
      - name: useHistoryFormat
        description: when useHistoryFormat=true, return the data in historical data
          format. Note that currently this option only works with the index_data table
          data type.
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tableData"
              examples:
                json:
                  $ref: "#/components/examples/tableData"
            application/vnd.sas.data.row.set+json:
              schema:
                $ref: "#/components/schemas/tableData"
              examples:
                json:
                  $ref: "#/components/examples/tableData"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      tags:
      - Table Data
      summary: Delete the table data from the given table type
      description: Delete rows of data from the given table type with the filter in
        the request. In addition to the listed query parameters, all table columns
        can be used as filters, so they depend on the table types.
      operationId: deleteTableData
      parameters:
      - $ref: "#/components/parameters/filter"
      - name: tableType
        description: the type of table this request to query on. It maps to a data
          table.
        in: query
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The request succeeded.
          content:
            application/vnd.sas.risk.table.data.info+json:
              schema:
                $ref: "#/components/schemas/tableDataInfo"
              examples:
                json:
                  $ref: "#/components/examples/tableDataInfo"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /tabledata/export:
    post:
      tags:
      - Table Data
      summary: Export data from the database to other location (file or CAS table)
      description: Export data from the specified table type, apply the filter and
        output the result data to the location specified in the request header and
        query parameters. When exporting to Excel, depending on the Accept header,
        the operation can be synchronous or asynchronous. With an asynchronous request,
        the Content-Location response header provides a polling URL for the process
        status. When the status becomes "completed", polling the process again by
        setting the Accept request header to 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        to download the exported file.
      operationId: exportTableData
      parameters:
      - $ref: "#/components/parameters/locationType"
      - $ref: "#/components/parameters/location"
      - $ref: "#/components/parameters/fileName"
      - $ref: "#/components/parameters/filter"
      - name: tableType
        description: the type of table this request to query on. It maps to a data
          table.
        in: query
        required: true
        schema:
          type: string
      - name: sessionId
        in: query
        schema:
          type: string
        description: The ID of a cas session that should be used when exporting the
          resources, typically used when locationType is libname and location is a
          session-based caslib. Applicable only for CAS related operation.
      - name: serverName
        in: query
        schema:
          type: string
        description: The name of the server to be used for exporting the resources,
          only used when there are multiple cas servers in the environment and using
          a specific server is necessary Applicable only for CAS related operation.
      - name: scope
        in: query
        schema:
          type: string
        description: one of global|session.  Determines if the exported table exists
          at global or session scope.  Default is session if locationType is directory
          or if a sessionId is passed; if locationType is libname and no sessionId
          is passed, default is global. Applicable only for CAS related operation.
      - name: replace
        in: query
        schema:
          type: boolean
        description: when true, an existing table will be replaced during export;
          when false, an existing table causes the operation to fail. Applicable only
          for CAS related operation.
      requestBody:
        description: Only applicable when exporting to a CAS table. The location info
          is used only when they are not available in request parameters.
        content:
          application/vnd.sas.risk.location+json:
            schema:
              $ref: "#/components/schemas/dataLocation"
            examples:
              json:
                $ref: "#/components/examples/dataLocation"
      responses:
        "200":
          description: a binary file stream when exporting to a file. -- The request
            succeeded.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
                description: synchrorous operation to export in Excel format
            application/vnd.sas.risk.table.data.processing.status+json:
              schema:
                $ref: "#/components/schemas/tableDataProcessStatus"
              examples:
                json:
                  $ref: "#/components/examples/tableDataProcessStatus"
            application/vnd.sas.risk.table.data.info+json:
              schema:
                $ref: "#/components/schemas/tableDataInfo"
              examples:
                json:
                  $ref: "#/components/examples/tableDataInfo"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /tabledata/export/group:
    post:
      tags:
      - Table Data
      summary: Export data based on table data dynamic groups in the request body
        (file or CAS table)
      description: Export data from the specified table type, using the conditions
        in the specified dynamic groups as filters. In addition, apply the request
        filters and output the result data to the location specified in the request
        header and query parameters. When exporting to Excel, depending on the Accept
        header, the operation can be synchronous or asynchronous. With an asynchronous
        request, the Content-Location response header provides a polling URL for the
        process status. When the status becomes "completed", polling the process again
        by setting the Accept request header to 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        to download the exported file. Note that for exporting to CAS, location info
        must be in request parameter instead of in the request body.
      operationId: exportGroupTableData
      parameters:
      - $ref: "#/components/parameters/filter"
      - name: tableType
        description: the type of table this request to query on. It maps to a data
          table.
        in: query
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/vnd.sas.risk.table.data.processing.status+json
          - application/vnd.sas.risk.table.data.info+json
        description: The media type of the response. When exporting to Excel, the
          valid values are 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          for synchronous operation, and 'application/vnd.sas.risk.table.data.processing.status+json'
          for asynchronous operation. When exporting to CAS table, the valid value
          is 'application/vnd.sas.risk.table.data.info+json'.
      requestBody:
        description: A list of table data dynamic group names
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/idList"
            examples:
              json:
                $ref: "#/components/examples/idList"
      responses:
        "200":
          description: a binary file stream when exporting to a file. -- The request
            succeeded.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
                description: synchorous operation for Excel export
            application/vnd.sas.risk.table.data.processing.status+json:
              schema:
                $ref: "#/components/schemas/tableDataProcessStatus"
              examples:
                json:
                  $ref: "#/components/examples/tableDataProcessStatus"
            application/vnd.sas.risk.table.data.info+json:
              schema:
                $ref: "#/components/schemas/tableDataInfo"
              examples:
                json:
                  $ref: "#/components/examples/tableDataInfo"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /tabledata/import:
    post:
      tags:
      - Table Data
      summary: Import data from the file or CAS table to the data base
      description: Import data from the file or CAS table to the data base. The paging
        parameters are used to control CAS import only. The default limit is 100.
      operationId: importTableData
      parameters:
      - $ref: "#/components/parameters/pagingStart"
      - $ref: "#/components/parameters/pagingLimit"
      - $ref: "#/components/parameters/sortBy"
      - $ref: "#/components/parameters/locationType"
      - $ref: "#/components/parameters/location"
      - $ref: "#/components/parameters/fileName"
      - $ref: "#/components/parameters/filter"
      - name: tableType
        description: the type of table to import to. It maps to a data table.
        in: query
        required: true
        schema:
          type: string
      - name: sesssionId
        in: query
        schema:
          type: string
        description: The ID of a cas session that should be used when exporting the
          resources; typically used when locationType is libname and location is a
          session-based caslib. Applicable only for CAS related operation.
      - name: serverName
        in: query
        schema:
          type: string
        description: The name of the server to be used for exporting the resources;
          only used when there are multiple cas servers in the environment and using
          a specific server is necessary Applicable only for CAS related operation.
      - name: scope
        in: query
        schema:
          type: string
        description: one of global|session.  Determines if the exported table exists
          at global or session scope.  Default is session if locationType is directory
          or if a sessionId is passed; if locationType is libname and no sessionId
          is passed, default is global. Applicable only for CAS related operation.
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/tableDataFile"
            examples:
              json:
                $ref: "#/components/examples/tableDataFile"
          application/vnd.sas.risk.location+json:
            schema:
              $ref: "#/components/schemas/dataLocation"
            examples:
              json:
                $ref: "#/components/examples/dataLocation"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.risk.table.data.processing.status+json:
              schema:
                $ref: "#/components/schemas/tableDataProcessStatus"
              examples:
                json:
                  $ref: "#/components/examples/tableDataProcessStatus"
            application/vnd.sas.risk.table.data.info+json:
              schema:
                $ref: "#/components/schemas/tableDataInfo"
              examples:
                json:
                  $ref: "#/components/examples/tableDataInfo"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /tabledata/types:
    get:
      tags:
      - Table Data
      summary: Get all supported table data types from the system
      description: Get all supported table data types from the system
      operationId: getTableDataTypes
      responses:
        "200":
          description: an array of strings of table data types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tableDataTypes"
