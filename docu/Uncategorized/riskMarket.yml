---
openapi: 3.0.3
info:
  title: Risk Market
  description: The Risk Market API manages a set of variable definitions and historical
    values.
  version: "4"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- description: an example server for experimentation
  url: "https://example.com/riskMarket"
tags:
- name: Variables
  description: The operations for the variables resource.
- name: Regulations
  description: The operations for the regulations resource.
- name: Transformations
  description: The operations for the transformations resource.
- name: Currencies
  description: The operations for the currencies resource.
- name: Holidays
  description: The operations for the holidays resource.
- name: Table Data
  description: The operations for the table data resource.
- name: Root
  description: The operations for the root resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootLinks"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
  /commons/validations/variables:
    post:
      tags:
      - Variables
      summary: Validates multiple variables
      description: Validates multiple variables from a posted resource.
      operationId: validateVariables
      requestBody:
        description: The variables to be validated
        required: true
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/variableValidation"
            examples:
              json:
                $ref: "#/components/examples/variableValidation"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/variableCollection"
              examples:
                json:
                  $ref: "#/components/examples/variableCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /holidays:
    get:
      tags:
      - Holidays
      summary: Get all holiday days from schedule name given in query
      description: Get all the holiday days with the given query parameters or filter.
      operationId: getHolidaysByScheduleName
      parameters:
      - name: calendarName
        description: the name of the holiday schedule
        in: query
        required: false
        schema:
          type: string
      - name: calendarType
        description: the type of the holiday schedule
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/holidayCollection"
              examples:
                json:
                  $ref: "#/components/examples/holidayCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/holidayCollection"
              examples:
                json:
                  $ref: "#/components/examples/holidayCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /holidays/list:
    post:
      tags:
      - Holidays
      summary: Get all holiday days from a schedule name and year given in query
      description: Get all the holiday days with the given schedule name and years.
        Schedule and calendar names are used interchangeably in this api document.
      operationId: getHolidaysByScheduleNameAndYear
      parameters:
      - name: years
        description: the range of years of the holidays to retrieve
        in: query
        required: true
        schema:
          type: string
        example: |
          2025
          2024-2025
      - name: accept
        description: The media type of the response, see response types.
        in: header
        required: false
        schema:
          type: string
          default: application/vnd.sas.collection+json
          description: The media type of the response, e.g. application/json or application/vnd.sas.risk.holiday.collection+json.
          enum:
          - application/vnd.sas.collection+json
          - text/csv
      requestBody:
        description: the names of calendar schedules to query. If omitted, all holiday
          schedules will be returned.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/idList"
            examples:
              json:
                $ref: "#/components/examples/idList"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/holidayCollection"
              examples:
                json:
                  $ref: "#/components/examples/holidayCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/holidayCollection"
              examples:
                json:
                  $ref: "#/components/examples/holidayCollection"
            text/csv:
              schema:
                type: string
              example: |
                CalendarName,Date
                USA_HOLIDAYS,2025-01-01
                USA_HOLIDAYS,2025-01-04
                USA_HOLIDAYS,2025-01-05
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /holidays/export:
    post:
      tags:
      - Holidays
      summary: Export holidays as a an Excel file
      description: Export holidays per query parameters to an Excel file.
      operationId: exportHolidays
      parameters:
      - name: calendarName
        description: the name of the holiday schedule
        in: query
        required: false
        schema:
          type: string
      - name: calendarType
        description: the type of the holiday schedule
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: a binary file stream when exporting to a file. -- The request
            succeeded.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
              example:
                $ref: "#/components/examples/holidayUploadFile/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /holidays/import:
    post:
      tags:
      - Holidays
      summary: Parse, validate and import all holidays as a collection
      description: Parse, validate and import all holidays in the input Excel file
        and return them as a collection.
      operationId: importHolidays
      parameters:
      - name: deleteFirst
        description: default is true, whether to delete existing holidays before importing
          new ones
        in: query
        required: false
        schema:
          type: string
      requestBody:
        description: A file uploaded to be processed
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/holidayUploadFile"
            example:
              $ref: "#/components/examples/holidayUploadFile/value"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/holidayImport"
              examples:
                json:
                  $ref: "#/components/examples/holidayImport"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /holidays/report:
    post:
      tags:
      - Holidays
      summary: Parse and validate all holidays as a collection
      description: Parse and validate all holidays in the input Excel file and return
        them as a collection.
      operationId: reportHolidays
      requestBody:
        description: A file uploaded to be parsed
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/holidayUploadFile"
            example:
              $ref: "#/components/examples/holidayUploadFile/value"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/holidayReport"
              examples:
                json:
                  $ref: "#/components/examples/holidayReport"
            application/vnd.sas.risk.holiday.report+json:
              schema:
                $ref: "#/components/schemas/holidayReport"
              examples:
                json:
                  $ref: "#/components/examples/holidayReport"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /holidays/schedule:
    get:
      tags:
      - Holidays
      summary: Get all holiday schedules
      description: Get all the holiday schedule in the system. Holiday schedule and
        calendar names are used interchangeably in this api document.
      operationId: getHolidaySchedules
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/holidayScheduleCollection"
              examples:
                json:
                  $ref: "#/components/examples/holidayScheduleCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/holidayScheduleCollection"
              examples:
                json:
                  $ref: "#/components/examples/holidayScheduleCollection"
    post:
      tags:
      - Holidays
      summary: Create a new holiday schedule
      description: Create a new holiday schedule
      operationId: createHolidaySchedule
      requestBody:
        description: The holiday schedule to be created
        required: true
        content:
          application/vnd.sas.risk.holiday.schedule+json:
            schema:
              $ref: "#/components/schemas/holidaySchedule"
            examples:
              json:
                $ref: "#/components/examples/holidaySchedule"
          application/json:
            schema:
              $ref: "#/components/schemas/holidaySchedule"
            examples:
              json:
                $ref: "#/components/examples/holidaySchedule"
      responses:
        "201":
          description: The holiday schedule was created.
          headers:
            Location:
              description: The URI of the newly created holiday schedule.
              schema:
                type: string
          content:
            application/vnd.sas.risk.holiday.schedule+json:
              schema:
                $ref: "#/components/schemas/holidaySchedule"
              examples:
                json:
                  $ref: "#/components/examples/holidaySchedule"
            application/json:
              schema:
                $ref: "#/components/schemas/holidaySchedule"
              examples:
                json:
                  $ref: "#/components/examples/holidaySchedule"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /holidays/schedule/import:
    post:
      tags:
      - Holidays
      summary: Parse, validate and import holiday schedules as a collection
      description: Parse, validate and import all holiday schedules as a collection
        in jsonand return the in the same format.
      operationId: importHolidaySchedules
      requestBody:
        description: A collection of holiday schedules in json format
        required: true
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/holidayScheduleCollection"
            examples:
              json:
                $ref: "#/components/examples/holidayScheduleCollection"
          application/json:
            schema:
              $ref: "#/components/schemas/holidayScheduleCollection"
            examples:
              json:
                $ref: "#/components/examples/holidayScheduleCollection"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/holidayScheduleCollection"
              examples:
                json:
                  $ref: "#/components/examples/holidayScheduleCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/holidayScheduleCollection"
              examples:
                json:
                  $ref: "#/components/examples/holidayScheduleCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /holidays/schedule/{holidayScheduleId}:
    get:
      tags:
      - Holidays
      summary: Get schedule by its id
      description: Get the holiday schedule with the given id
      operationId: getHolidaysSchedule
      parameters:
      - name: holidayScheduleId
        description: the id of the holiday schedule
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.risk.holiday.schedule+json:
              schema:
                $ref: "#/components/schemas/holidaySchedule"
              examples:
                json:
                  $ref: "#/components/examples/holidaySchedule"
            application/json:
              schema:
                $ref: "#/components/schemas/holidaySchedule"
              examples:
                json:
                  $ref: "#/components/examples/holidaySchedule"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    put:
      tags:
      - Holidays
      summary: Update a holiday schedule by its id
      description: Update the holiday schedule with the given id
      operationId: updateHolidaySchedule
      parameters:
      - name: holidayScheduleId
        description: the id of the holiday schedule
        in: path
        required: true
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        schema:
          type: string
        description: The timestamp obtained from the most recent `Last-Modified` response
          header. Must match the timestamp when the object was last modified.
      - name: If-Match
        in: header
        schema:
          type: string
        description: The value obtained from the most recent `Etag` response header.
          Must match the value when the object was last modified.
      requestBody:
        description: The holiday schedule to be updated
        required: true
        content:
          application/vnd.sas.risk.holiday.schedule+json:
            schema:
              $ref: "#/components/schemas/holidaySchedule"
            examples:
              json:
                $ref: "#/components/examples/holidaySchedule"
          application/json:
            schema:
              $ref: "#/components/schemas/holidaySchedule"
            examples:
              json:
                $ref: "#/components/examples/holidaySchedule"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.risk.holiday.schedule+json:
              schema:
                $ref: "#/components/schemas/holidaySchedule"
              examples:
                json:
                  $ref: "#/components/examples/holidaySchedule"
            application/json:
              schema:
                $ref: "#/components/schemas/holidaySchedule"
              examples:
                json:
                  $ref: "#/components/examples/holidaySchedule"
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the object was last modified.
              schema:
                type: string
            ETag:
              description: A hashed value generated when the object was last modified.
              schema:
                type: string
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No holiday schedule exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "412":
          description: The If-Unmodified-Since or If-Match request header did not
            match the resource's last modified timestamp or hashed value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: The request headers did not include an If-Unmodified-Since
            or If-Match precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      tags:
      - Holidays
      summary: Delete a holiday schedule by its id
      description: Delete the holiday schedule with the given id
      operationId: deleteHolidaySchedule
      parameters:
      - name: holidayScheduleId
        description: the id of the holiday schedule
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The request succeeded; nothing to return
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
