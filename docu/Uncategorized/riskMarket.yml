      description: Adds/Updates multiple variables from a posted resource. Note that
        if an input variable only has name and type info and it already exists in
        the system, the import(update) will not happen for that variable, and it will
        be omitted from the response.
      operationId: importVariables
      requestBody:
        description: The variables to be added/updated. Synchronous operation - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
