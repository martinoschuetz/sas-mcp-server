                  $ref: "#/components/examples/tableDataTypes"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /tabledata/analyze:
    get:
      tags:
      - Table Data
      summary: Get all supported table data types matching the uploaded file, typically
        only one type is returned
      description: Get the table types that match the given file
      operationId: getTableDataTypesInFile
      responses:
        "200":
          description: An array of matched table data types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tableDataTypes"
              examples:
                json:
                  $ref: "#/components/examples/tableDataTypes"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /tabledata/dataTableStatus:
    get:
      tags:
      - Table Data
      summary: Get the status of a data table
      description: Get the current status of a specific data table
      operationId: getDataTableStatus
      responses:
        "200":
          description: The current status of the data table
          content:
            application/vnd.sas.risk.datatable.status+json:
              schema:
                $ref: "#/components/schemas/dataTableStatus"
              examples:
                json:
                  $ref: "#/components/examples/dataTableStatus"
            application/json:
              schema:
                $ref: "#/components/schemas/dataTableStatus"
              examples:
                json:
                  $ref: "#/components/examples/dataTableStatus"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /variables:
    get:
      tags:
      - Variables
      summary: Get the collection of existing variables in summary form
      description: Returns the collection of existing variables, of media type "application/vnd.sas.risk.variable.summary".  This
        collection supports [paging](https://developer.sas.com/rest-apis/riskMarket-v3/docs/getting-started/usage-notes#pagination),
        max page size (limit) is 10000, [filtering](https://developer.sas.com/rest-apis/riskMarket-v3/docs/getting-started/usage-notes#filtering),
        and [sorting](https://developer.sas.com/rest-apis/riskMarket-v3/docs/getting-started/usage-notes#sorting).  Filtering
        and sorting are supported on character, number, and boolean variable properties.
      operationId: getVariableSummaries
      parameters:
      - $ref: "#/components/parameters/pagingStart"
      - $ref: "#/components/parameters/pagingLimit"
      - $ref: "#/components/parameters/sortBy"
      - $ref: "#/components/parameters/filter"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/variableSummaryCollection"
              examples:
                json:
                  $ref: "#/components/examples/variableSummaryCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/variableSummaryCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    post:
      tags:
      - Variables
      summary: Create a new variable
      description: Creates a new variable.
      operationId: createVariable
      requestBody:
        description: A variable to be created.
        required: true
        content:
          application/vnd.sas.risk.variable+json:
            schema:
              $ref: "#/components/schemas/variable"
            examples:
              json:
                $ref: "#/components/examples/variable"
      responses:
        "201":
          description: The variable was created.
          headers:
            Location:
              description: The URI of the newly created variable.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in "EEE, dd MMM yyyy HH:mm:ss GMT" format
                when the variable was last modified.
              schema:
                type: string
            ETag:
              description: A hashed value generated when the variable was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.risk.variable+json:
              schema:
                $ref: "#/components/schemas/variable"
              examples:
                json:
                  $ref: "#/components/examples/variable"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /variables#query:
    post:
      tags:
      - Variables
      summary: Get details about an arbitrary collection of variables
      description: Returns a detailed collection of variables based on a given list
        of variable names or ids.  The returned list will contain all variables in
        the posted list of names/ids and any related variables that are members of
        an included group, array, curve or surface, or have some other relationship
        to one of the posted variables.  The items in the collection use the `application/vnd.sas.risk.variable`
        media type.  This query does not support sorting or paging -- all variables
        as described above will be returned in a single collection in an arbitrary
        order.  This query supports filtering.
      operationId: getVariableDefinitions
      parameters:
      - name: onlyType
        required: false
        in: query
        schema:
          type: string
        description: The valid values are factor, array, curve, surface and group.
          When set, only variables with the requested type are returned, including
          members in the nested structures.
      - name: expandDynamicMembers
        required: false
        in: query
        schema:
          type: boolean
        description: When set to true, dynamic group members such as curve or surface
          will be expanded its factor members. Groups as members of a dynamic group
          are not expanded.
      - $ref: "#/components/parameters/asOfDate"
      - $ref: "#/components/parameters/filter"
      requestBody:
        description: the names or ID's of the variables to return
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/idList"
            examples:
              json:
                $ref: "#/components/examples/idList"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/variableCollection"
              examples:
                json:
                  $ref: "#/components/examples/variableCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /variables#export:
    post:
      tags:
      - Variables
      summary: Get an arbitrary collection of variables as downloadable file
      description: Returns a collection of variables as a file.  The file type is
        specified as the Accept parameter in the header.  The response body will be
        binary and can be saved as a file. This query supports filtering.
      operationId: exportVariablesAsFile
      parameters:
      - $ref: "#/components/parameters/filter"
      - name: groupBy
        in: query
        schema:
          type: string
          enum:
          - roleCategory
          - type
          - currency
          - source
          - role
        description: The column name of which unique values to be used as sheet names.
          Variables with the corresponding column values will be included in the sheet.
      requestBody:
        description: the names or ID's of the variables to export
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/idList"
            examples:
              json:
                $ref: "#/components/examples/idList"
      responses:
        "200":
          description: a binary file stream when exporting to a file. -- The request
            succeeded.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /variables/yieldClasses:
    get:
      tags:
      - Variables
      summary: Get the collection of yield classes in use
      description: Returns the collection of yield classes currently in use. This
        collection does not support filtering, sorting, or paging.
      operationId: getYcClassesInUse
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/baseCollection2"
              examples:
                json:
                  value:
                    accept: application/json
                    items:
                    - discount
                    - forward
                    - spot
                    count: 3
                    limit: 3
                    version: 2
            application/json:
              schema:
                $ref: "#/components/schemas/baseCollection2"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /variables/deletions:
    post:
      tags:
      - Variables
      summary: Deletes the list of variables
      description: The provided list of variables will be validated to make sure that
        their deletion will not leave any invalid variables behind. Those variables
        that would cause an invalid variable to be left would be reported as an error
        and removed from the list being deleted. When including the deleteMembers
        parameter set to true, the requested variables along with all underlying variables
        will be deleted. For example, in their respective member lists curveA references
        factor1 and factor2 while curveB references factor1. Issuing a delete on curveA
        with deleteMembers=true would result in a partial delete and report that factor1
        could not be deleted and curveA along with factor2 would be removed.
      operationId: deleteVariables
      parameters:
      - $ref: "#/components/parameters/deleteMembers"
      requestBody:
        description: the names or ID's of the variables to delete
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/idList"
            examples:
              json:
                $ref: "#/components/examples/idList"
      responses:
        "204":
          description: The request succeeded; nothing to return
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /variables/history:
    post:
      tags:
      - Variables
      summary: Get historical information for an arbitrary collection of factors
      description: Returns historical information for a collection of variables based
        on the given list of variable names or ids.  Note that only risk factors can
        have history; values of instrument variables are not dated, and history of
        groups, arrays, curves and surfaces is described by the history of the scalar
        members. If an empty request body is posted, then all variables will be reported.
        This query does not support paging with sampling and sorting is only supported
        on date; the historical data is returned as a single rowset in ascending or
        descending order by date. The scope of the historical information returned
        can be limited by the optional startDate and endDate parameters.
      operationId: getVariablesHistory
      parameters:
      - $ref: "#/components/parameters/startDate"
      - $ref: "#/components/parameters/endDate"
      - $ref: "#/components/parameters/marketState"
      - $ref: "#/components/parameters/sampleSize"
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/pagingStart"
      - $ref: "#/components/parameters/pagingLimit"
      - $ref: "#/components/parameters/sortBy"
      - name: marketDataType
        in: query
        required: false
        schema:
          type: string
        description: when set, only returns the history data of the give marketDataType.
      requestBody:
        description: the names or ID's of the variables to return
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/idList"
            examples:
              json:
                $ref: "#/components/examples/idList"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.data.row.set+json:
              schema:
                $ref: "#/components/schemas/historyV2"
              examples:
                json:
                  $ref: "#/components/examples/historyV2"
            application/vnd.sas.data.row.set+json;version=1:
              schema:
                $ref: "#/components/schemas/historyV1"
              examples:
                json:
                  $ref: "#/components/examples/historyV1"
            application/vnd.sas.data.row.set+json;version=2:
              schema:
                $ref: "#/components/schemas/historyV2"
              examples:
                json:
                  $ref: "#/components/examples/historyV2"
            application/json:
              schema:
                $ref: "#/components/schemas/historyV2"
            application/vnd.sas.risk.variable.data+json:
              schema:
                $ref: "#/components/schemas/multiValueHistory"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /variables/history/report:
    post:
      tags:
      - Variables
      summary: Report import historical information for a collection of variables
      description: Reports historical information for a collection of variables or
        an Excel file.  Note that only version 2 of the row set data structure is
        supported for input, but both version 1 and version 2 may be returned. When
        reporting, client should use accept header application/vnd.sas.collection+json.
      operationId: reportVariablesHistory
      requestBody:
        description: the historical information to report
        content:
          application/vnd.sas.data.row.set+json:
