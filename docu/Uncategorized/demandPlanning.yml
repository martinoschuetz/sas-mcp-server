components:
  schemas:
    root:
      title: The root of an API
      required:
      - links
      - version
      type: object
      properties:
        version:
          type: integer
          description: The schema version of the media type.
        links:
          type: array
          description: The links that apply to the resource.
          items:
            $ref: '#/components/schemas/link'
      description: A list of links to top level resources available from the root
        of the API.
    etlJobRequest:
      required:
      - delimiter
      - factPath
      - factPrefix
      - loadType
      type: object
      properties:
        factPath:
          type: string
          description: location of fact file.
        factPrefix:
          type: string
          description: The prefix of the fact data sources.
        delimiter:
          type: string
          description: "The delimiter used in the fact data. Allowed delimiters are\
            \ comma, pipe, colon and exclamation mark. By default, the pipe character\
            \ is used as a delmiter."
        loadType:
          type: string
          description: The load type for the fact load. Allowed values are REFRESH
            and MERGE.
      description: Represent the etl request .
    etlSwitchRulesJobRequest:
      required:
      - dateInFormat
      - delimiter
      - factPath
      - loadType
      - productGroupSetId
      - switchRuleFileName
      - switchRuleProductFileName
      type: object
      properties:
        productGroupSetId:
          type: string
          description: Product Group Set id of the set in which product group is being
            created.
        factPath:
          type: string
          description: location of csv file.
        switchRuleFileName:
          type: string
          description: Rules csv file name.
        switchRuleProductFileName:
          type: string
          description: Products csv file name.
        delimiter:
          type: string
          description: "The delimiter used in the fact data. Allowed delimiters are\
            \ comma, pipe, colon and exclamation mark. By default, the pipe character\
            \ is used as a delmiter."
        loadType:
          type: string
          description: The load type for the fact load. Allowed values are REFRESH
            and MERGE.
        dateInFormat:
          type: string
          format: date-time
      description: Represent the etl request for importing Switch Rules.
    prepareDataRequest:
      required:
      - causals
      - dimensions
      - doSegmentation
      - forecastHorizonDuration
      - historicalDataDuration
      - kpi
      - library
      - periodicityGrain
      - priceDemandModel
      type: object
      properties:
        kpi:
          $ref: '#/components/schemas/kpis'
        priceDemandModel:
          type: boolean
          description: If True template is price demand model else generic.
        periodicityGrain:
          type: string
          description: Enum value of peridiocity.
          enum:
          - SECOND
          - MINUTE
          - HOUR
          - DAY
          - WEEKDAY
          - WEEK
          - WEEKV
          - TENDAY
          - SEMIMONTH
          - MONTH
          - R445MON
          - R454MON
          - R544MON
          - QTR
          - R445QTR
          - R454QTR
          - R544QTR
          - SEMIYEAR
          - YEAR
          - YEARV
          - R445YR
          - R454YR
          - R544YR
        historicalDataDuration:
          type: integer
          description: integer value of historical data duration.
        forecastHorizonDuration:
          type: integer
          description: integer value of forecast horizon duration.
        doSegmentation:
          type: boolean
          description: "If True segmentaion will be apllied ,only true is applicable\
            \ for price dmand planning."
        dimensions:
          type: array
          description: links
          items:
            $ref: '#/components/schemas/dimensions'
        causals:
          type: array
          description: links
          items:
            $ref: '#/components/schemas/kpis'
        library:
          type: string
          description: contains library location where ABT will be created.
        links:
          type: array
          description: links
          items:
            $ref: '#/components/schemas/link'
      description: Represent the scope summary.
    kpis:
      required:
      - columnId
      - hierarchicalAggregationOption
      - missingValueInterpretation
      - tableId
      - timeIntervalAccumulation
      type: object
      properties:
        tableId:
          type: string
          description: table id
        columnId:
          type: string
          description: column id
        columnName:
          type: string
          description: column Name
        hierarchicalAggregationOption:
          type: string
          description: hierarchical Aggregation option available in visual forecasting
        timeIntervalAccumulation:
          type: string
          description: time Interval Accumulation available in visual forecasting
        missingValueInterpretation:
          type: string
          description: missing value Interpretation available in visual forecasting
        version:
          type: integer
          description: resource version
          format: int32
      description: "Select the key performance indicator (KPI). The KPI is the variable\
        \ that is to be forecasted for the new product. For example, select Demand\
        \ to forecast the demand for the new product."
    dimensions:
      required:
      - dimensionId
      - dimensionTypeId
      - hierarchyId
      - levels
      type: object
      properties:
        dimensionId:
          type: string
          description: Dimension Id.
        dimensionTypeId:
          type: string
          description: Dimension type Id.
        hierarchyId:
          type: string
          description: Hierarchy Id.
        levels:
          type: array
          description: levels for the selected dimensions.
          items:
            $ref: '#/components/schemas/levels'
        version:
          type: integer
          description: resource version
          format: int32
      description: "Dimensions for which you want to forecast (for example, product\
        \ or store location)."
    levels:
      required:
      - levelId
      - levelType
      type: object
      properties:
        levelId:
          type: string
          description: level Id.
        levelType:
          type: string
          description: level Type.
          enum:
          - BYVAR
          - SEASONALITY
          - REG
          - FORECAST
        version:
          type: integer
          description: resource version
          format: int32
      description: Represents levels for the selected dimensions.
    forecastJob:
      required:
      - dependentVariable
      - doSegmentation
      - forecastProjectDetails
      - library
      - priceDemandModel
      type: object
      properties:
        forecastNamePrefix:
          type: string
          description: This string will be used as prefix for all the projects created
            through this request
        dependentVariable:
          $ref: '#/components/schemas/kpis'
        independentVariables:
          $ref: '#/components/schemas/kpis'
        byVariables:
