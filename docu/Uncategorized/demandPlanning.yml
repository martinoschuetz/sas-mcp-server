  /jobs/{jobId}:
    get:
      tags:
      - Job
      summary: Find job
      description: Find job with the given job
      operationId: getJob
      parameters:
      - name: jobId
        in: path
        description: Id of job
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Get job using jobId successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/job'
            application/vnd.sas.demand.planning.job+json:
              schema:
                $ref: '#/components/schemas/job'
        "404":
          description: Job with the given id does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
            application/vnd.sas.demand.planning.job+json:
              schema:
                $ref: '#/components/schemas/error'
    delete:
      tags:
      - Job
      summary: Delete job
      description: Delete job using jobId
      operationId: deleteJob
      parameters:
      - name: jobId
        in: path
        description: Id of job
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Job deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/job'
            application/vnd.sas.demand.planning.job+json:
              schema:
                $ref: '#/components/schemas/job'
        "404":
          description: Job does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
            application/vnd.sas.demand.planning.job+json:
              schema:
                $ref: '#/components/schemas/error'
  /jobs/{jobId}/state:
    get:
      tags:
      - Job
      summary: Get job state
      description: Get current state of the job
      operationId: getJobState
      parameters:
      - name: jobId
        in: path
        description: Id of job
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Returns current state of the job
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Job does not exist
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/error'
    put:
      tags:
      - Job
      summary: Update the state of the job
      description: Updates the state of the current job. The new state must be set
        as either the value query parameter or in the body of the request. The value
        query parameter takes precedence if both are specified.
      operationId: updateJobState
      parameters:
      - name: If-Match
        in: header
        description: Update the resource only if its current ETag header matches this
          value.
        required: false
        schema:
          type: string
      - name: jobId
        in: path
        description: The ID of the job.
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: "The value of the state. If this value and the body specify a\
          \ state, then this value takes precedence."
        required: false
        schema:
          type: string
      requestBody:
        description: The new value of the state.
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          headers:
            ETag:
              description: The entity tag which conveys the modification state of
                the job.
              schema:
                type: string
          description: The request succeeded.
        "400":
          description: "The request was invalid. An invalid request occurs in the\
            \ following scenarios: <ul> <li>An invalid state value was provided.</li>\
            \ <li>The state was not specified in the value query parameter or in the\
            \ body of the request. </li> </ul>\n"
        "404":
          description: Job does not exist
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/error'
        "412":
          description: >
            One of the headers, If-Match or If-Unmodified-Since does not\
            \ match the current resource state. The resource might have been modified\
            \ by another operation when this client obtained the resource with GET\
            \ and when this update was tried. The client should GET the most recent\
            \ representation of the resource and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
        "428":
          description: |
            The request headers did not include an If-Match precondition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
