openapi: 3.0.3
info:
  title: CAS Proxy
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  description: >
    ### Overview


    The CAS Proxy API provides a <I>gateway</I> to a specific CAS REST server.

    This API exists to allow REST requests to be directed to a specific CAS server
    using the CAS server name

    as part of the request URI.<p>


    ### Headers, Body, and Query Parameters


    #### Headers


    All headers from the original request are copied directly to the request being
    made to the CAS REST server.


    #### Body


    The body from the original request is copied directly to the request being made
    to the CAS REST server.


    #### Query Parameters


    All query parameters submitted are passed on to the CAS REST server.



    ### Examples


    A few examples follow.


    #### Controller Information


    http://{roothost}/casProxy/servers/{serverName}/cas


    ```{

    "type": "Controller",

    "state": "Running",

    "client": 45781,

    "control": 65486,

    "process": {
      "id": "133386",
      "owner": "userId",
      "uptime": 219.25,
      "userCPU": 0.13,
      "sysCPU": 0.29,
      "memoryUsed": 7131136,
      "maxMemoryUsed": 7131136,
      "threadCount": 17,
      "maxThreadCount": 17,
      "ioCount": 16,
      "os": {
        "name": "Linux",
        "version": "#1 SMP Wed Jul 1 18:23:37 EDT 2015",
        "release": "2.6.32-573.el6.x86_64"
      },
      "system": {
        "type": "",
        "name": "X86_64 Linux"
      },
      "casVersion": {
        "version": "V.03.00M0D04242016",
        "buildDate": "Apr 24 2016",
        "buildTime": "18:54:54"
      }
    }

    ```}


