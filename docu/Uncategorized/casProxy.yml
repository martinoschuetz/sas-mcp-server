  "/servers/{serverName}/{passThroughUrl}":
    get:
      operationId: General
      summary: Make CAS REST call passing the GET http verb
      description: Makes REST call to CAS server name specified
      tags:
      - General
      parameters:
      - description: The name of the server.
        in: path
        name: serverName
        required: true
        schema:
          type: string
      - name: passThroughUrl
        in: path
        required: true
        description: The portion of the URL that is passed directly to the CAS Server
          REST API. See CAS Server REST API documentation for available functionality.
        schema:
          type: string
      responses:
        "200":
          description: >
            See CAS Server REST API documentation for responses. NOTE -
            Responses returned by this service generally are from connections
            made to the CAS Server REST API. See CAS Server REST API
            documentation for available functionality.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - the user does not have permission to complete this
            request.
        "404":
          description: Not Found - the requested server name does not exist.
