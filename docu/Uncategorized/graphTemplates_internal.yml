---
openapi: 3.0.3
info:
  version: "1"
  title: Graph Templates Internal
  description: The Graph Template Service API provides the means to store and retrieve
    graph template content and the associated metadata.
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: http://mock-graphTemplates_internal.apifirst.unx.sas.com/graphTemplates
  description: kubernetes mock server
tags:
- name: Transfer (Import Multipart)
  description: The operations for the transfer object resource.
paths:
  /graphTemplates#importMultipart:
    post:
      summary: Import to create a new graph template using multipart input
      description: Create a new graph template using multipart input. The only provider
        of multipart data at this time is the transfer microservice which constructs
        the files parameter based on V9 SAS package content. Other than the old graph
        template id, all other graph template properties are preserved.
      operationId: createGraphTemplateUsingMultipart
      tags:
      - Transfer (Import Multipart)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  description: Generated files based on V9 SAS package content.
                  type: string
              required:
              - files
        required: true
      responses:
        "201":
          description: Graph template is imported.
          headers:
            Location:
              description: The URI of the newly created graph template
              schema:
                type: string
          content:
            application/vnd.sas.transfer.import.summary+json:
              schema:
                $ref: "#/components/schemas/importSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/importSummary"
        "400":
          description: Bad Request. The multipart form data is not valid.
          content:
            application/vnd.sas.transfer.import.summary+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
components:
  schemas:
    error:
      $ref: "#/components/schemas/error2"
    importSummary:
      description: The representation of an import summary.
      required:
      - name
      - id
      - state
      - resultUri
      - type
      properties:
        id:
          type: string
          description: The id string value of the object that was created/updated
            during the import.
        name:
          type: string
          description: The name string value of the object that was created/updated
            during the import
        state:
          type: string
          description: The state of the import operations.
          enum:
          - completed
          - canceled
          - failed
          - completedWithWarnings
          - completedWithErrors
        logEntries:
          type: array
          description: A list of log entries.
          items:
            $ref: "#/components/schemas/logEntry"
        resultUri:
          type: string
          description: The resource URI of the object created/updated during the import.
        type:
          type: string
          description: The type of the resource.
    logEntry:
      description: TODO.
      properties:
        level:
          type: string
          description: The level of the log entry.
          enum:
          - info
          - warn
          - error
        message:
          type: string
          description: The localized text of the log entry.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
