---
openapi: 3.0.3
info:
  title: List Data
  description: This List Data API enables users to manage lookup lists across products
    and solutions.
  version: "9"
  contact:
    name: "SAS Developers"
    url: "https://developer.sas.com"
    email: "devex@sas.com"
tags:
- name: Root
  description: "This endpoint is associated with the operations for the root resource\
    \ of the List Data API."
- name: List Definition
  description: "These endpoints are associated with a list's definition."
- name: List State and Contents
  description: "These endpoints are associated with a list's state and contents."
- name: List Revisions
  description: "These endpoints are associated with a list's revisions."
- name: List Relations
  description: "This endpoint is associated with a list's relationships with other\
    \ objects that are managed by the Catalog service."
- name: Asynchronous Content Loading
  description: "These endpoints are associated with the asynchronous loading of a\
    \ list's contents."
- name: Clear List Contents
  description: "These endpoints are associated with clearing and removing all of a\
    \ list's contents."
- name: Update List Content State
  description: "These endpoints are associated with updating the deployed state of\
    \ a list's rows."
servers:
- url: http://example.com/listData
  description: This is an example base URL.
paths:
  /:
    get:
      tags:
      - Root
      operationId: root
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level collections and actions
        that are provided by the List Data API.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/api"
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/api"
            application/vnd.sas.api+json;version=1:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/api"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /lists:
    post:
      tags:
      - List Definition
      operationId: createList
      summary: Create a list
      description: |
        Creates a new list definition.

        When you create a new list, you define the properties of a new tabular data set, but the list initially has no contents. List contents are loaded and managed by using other endpoints that are available with the List Data API.

        A list's properties describe the structure, functionality, and state of a list.  A list's contents, which are the list's data, is a sub-resource of the list.

        The structure of a list represents the data that you will import as the list contents. The list data description is represented by column information objects. The column objects map information about the source data (for example, column name, data type, and position) to the list's structure.

        When you create the list's structure, you need to identify at least one column as a key. This column is used to construct a lookup key for the record, which is used to retrieve the record from the contents data store. You can create complex lookup keys by identifying more than one column as a key.

        You must add lists to a folder. A list inherits the permissions of the folder of which it is a member. The default folder '/SAS Content/Products/List Data' provides public permissions. You can move lists to different folders and manage authorizations for a folder by using SAS Environment Manager.

        A list can be immutable, which means a client has only a single opportunity to load contents.
        Once an immutable list has contents, you cannot update the list. You can only delete it.

        The state of a list can be either deployed or developing.  You cannot delete a deployed list.

        A list can have an expiry that is associated only with the list's rows. This expiry value is a UNIX timestamp, which enables consumers of list data to choose whether to ignore expired list items. No action is taken by the service once the expiry is reached.

        The 'defaultExpiry' property is the time, in seconds, after which newly added rows are considered expired. When rows are added, an expiry property is also added, which is equal to the current UNIX Epoch time plus the default expiry value. Enforcement of the expiry is left to the consumer, and no action is taken by the service when the expiration time is reached.

        You can define a list that supports storing multiple records by using the same key value by setting the 'duplicateKeysEnabled' property to true.
        This means that when a client retrieves a value by using a lookup key, more than one record could be returned.
        Once data is added to the list, you cannot convert this list type to a standard list type.

        Creating a list also creates the first revision of that list, which you can see by using the GET /lists/{listId}/revisions endpoint.
      parameters:
      - in: query
        name: parentFolderUri
        required: false
        description: |
          The URI for the parent folder to which a list is added. For more information about folders, see [Folders](https://developer.sas.com/rest-apis/folders).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/listResource"
            examples:
              json:
                $ref: "#/components/examples/createListResourceRequestBody"
          application/vnd.sas.listdata.list+json:
            schema:
              $ref: "#/components/schemas/listResource"
            examples:
              json:
                $ref: "#/components/examples/createListResourceRequestBody"
          application/vnd.sas.listdata.list+json;version=1:
            schema:
              $ref: "#/components/schemas/listResourceVersionOne"
            examples:
              json:
                $ref: "#/components/examples/createListResourceVersionOneRequestBody"
      responses:
        "201":
          description: A list was created.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
            Location:
              description: The URI of the list.
              schema:
                type: string
                format: uri
            If-Match:
              description: An ETag in the format of W/"_the-last-updated-timestamp-in-UNIX-nanosecond-time_".
              schema:
                type: string
                format: date-time
          content:
            "application/vnd.sas.listdata.list+json":
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
            "application/vnd.sas.listdata.list+json;version=1":
              schema:
                $ref: "#/components/schemas/listResourceVersionOne"
              examples:
                json:
                  $ref: "#/components/examples/listResourceVersionOneRepresentation"
            "application/json":
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
        "400":
          # TODO: currently if list already exists api returns back with 400 instead of '409 - Conflict'
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
      - List Definition
      operationId: getLists
      summary: Get a collection of lists
      description: Returns a collection of lists.
      parameters:
      - $ref: "#/components/parameters/StartCollectionQueryParam"
      - $ref: "#/components/parameters/LimitCollectionQueryParam"
      - $ref: "#/components/parameters/FilterCollectionQueryParam"
      - $ref: "#/components/parameters/SortByCollectionQueryParam"
      - $ref: "#/components/parameters/FolderIdQueryParam"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/listResourceCollection"
              examples:
                json:
                  $ref: "#/components/examples/listResourceCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/listResourceCollection"
              examples:
                json:
                  $ref: "#/components/examples/listResourceCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /lists/{listId}:
    parameters:
    - $ref: "#/components/parameters/ListId"
    head:
      tags:
      - List Definition
      operationId: headersForList
      summary: Check that a list exists
      description: |
        Checks for the existence of a list.

        A successful response (for example, 200 OK) indicates that the list exists. An unsuccessful response (for example, 404 Not Found) indicates that the list does not exist.
      parameters:
      - in: header
        name: Accept
        description: The desired response type.
        example: application/json
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.sas.listdata.list+json
          - application/vnd.sas.listdata.list+json;version=1
          - application/vnd.sas.listdata.listdetails+json
          - application/vnd.sas.listdata.listdetails+json;version=1
          - application/vnd.sas.listdata.listdetails.consumers+json
          - application/vnd.sas.transfer.object+json
          - application/vnd.sas.summary+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Location:
              description: The URI of the list.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/resourceCollection"
              examples:
                json:
                  $ref: "#/components/examples/getListsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
      - List Definition
      operationId: getList
      summary: Get a list
      description: Returns a list.
      parameters:
      - in: header
        name: Accept
        description: The desired response type.
        example: application/json
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.sas.listdata.list+json
          - application/vnd.sas.listdata.list+json;version=1
          - application/vnd.sas.listdata.listdetails+json
          - application/vnd.sas.listdata.listdetails.consumers+json
          - application/vnd.sas.transfer.object+json
          - application/vnd.sas.summary+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
            application/vnd.sas.listdata.list+json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
            application/vnd.sas.listdata.list+json;version=1:
              schema:
                $ref: "#/components/schemas/listResourceVersionOne"
              examples:
                json:
                  $ref: "#/components/examples/listResourceVersionOneRepresentation"
            application/vnd.sas.listdata.details+json:
              schema:
                $ref: "#/components/schemas/listDetails"
              examples:
                json:
                  $ref: "#/components/examples/listDetails"
            application/vnd.sas.listdata.details+json;version=1:
              schema:
                $ref: "#/components/schemas/listDetailsVersionOne"
              examples:
                json:
                  $ref: "#/components/examples/listDetailsVersionOne"
            application/vnd.sas.listdata.details.consumers+json:
              schema:
                $ref: "#/components/schemas/listDetailsWithConsumers"
              examples:
                json:
                  $ref: "#/components/examples/listDetailsWithConsumers"
            application/vnd.sas.listdata.details.consumers+json;version=1:
              schema:
                $ref: "#/components/schemas/listDetailsWithConsumersVersionOne"
              examples:
                json:
                  $ref: "#/components/examples/listDetailsWithConsumersVersionOne"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                json:
                  $ref: "#/components/examples/summary"
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/transferObject"
              examples:
                json:
                  $ref: "#/components/examples/transferObject"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
      - List Definition
      operationId: updateList
      summary: Update a list's properties
      description: |
        Updates a list's properties.

        In some situations, you cannot edit properties that are not marked
        as Read-Only.

        __Restricted Updates When a List Contains Contents__

        Once a list has contents, you cannot update the following properties:
        * 'name'
        * 'isImmutable'
        * 'columns'
        * 'ColumnInfo' objects in 'columns'
          - 'name'
          - 'dataType'
          - 'position'
          - 'isKey'
          - 'keyPosition'
          - 'dataMask'

        Once a list has contents, you can update the 'duplicateKeysEnabled' property to be true, but you cannot update it to be false.

        __Administrative Editing Privileges__

        From the list above, only the 'dataMask' property for the 'ColumnInfo' object can be modified after a list has contents. A user with privileged authorization can create, update, and delete the 'dataMask' property for the 'ColumnInfo' object.

        See the endpoint [`/lists/{listId}/privilegedEdit`](#operations-List_Definition-updatePrivileged) for more details.
      requestBody:
        content:
          application/vnd.sas.listdata.list+json:
            schema:
              $ref: "#/components/schemas/listResource"
            examples:
              json:
                $ref: "#/components/examples/listResourceRepresentation"
          application/vnd.sas.listdata.list+json;version=1:
            schema:
              $ref: "#/components/schemas/listResourceVersionOne"
            examples:
              json:
                $ref: "#/components/examples/listResourceVersionOneRepresentation"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
            Location:
              description: The URI of the list.
              schema:
                type: string
                format: uri
            If-Match:
              description: An ETag in the format of W/"_the-last-updated-timestamp-in-UNIX-nanosecond-time_".
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.listdata.list+json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
            application/vnd.sas.listdata.list+json;version=1:
              schema:
                $ref: "#/components/schemas/listResourceVersionOne"
              examples:
                json:
                  $ref: "#/components/examples/listResourceVersionOneRepresentation"
            application/json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
      - List Definition
      operationId: deleteList
      summary: Delete a list
      description: |
        Removes a list from the system.

        When you delete a list, the list's definition and any import or purge jobs that are associated with the list are removed.

        **IMPORTANT:** Deleting a list does not remove the list's contents.  If required, you should remove the list's contents before you delete the list.
        To clear the list's contents, you must create a purge job. See the [`/lists/{listId}/purgeJobs`](#operations-Clear_List_Contents-createPurgeJob) endpoint for details.
        This two-step process for clearing and deleting a list is due to the non-deterministic
        time it could take to clear the contents of a list.

        You only can delete a list when its 'state' property is set to 'developing' and the list is not part of a relationship that is registered in the Catalog service.

        A list's deletion fails if the list has any associated import or purge jobs that are running.
        If you believe that an import or purge job is incorrectly marked as running, you can force a list to delete. Doing so does not stop import or purge jobs that are running.
        You cannot force a list to delete when the 'state' property is set to 'deployed' or the list is involved in a relationship.
      parameters:
      - in: path
        name: listId
        description: "A universally unique identifier for a list."
        example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
        required: true
        schema:
          type: string
      - in: query
        name: force
        required: false
        description: "An indicator for whether to force a list deletion when associated\
          \ jobs are running. A forced deletion cannot occur when the list's 'state'\
          \ property is set to 'deployed' or the list is involved in a relationship."
        schema:
          type: boolean
          default: false
          example: false
      responses:
        "204":
          description: The list was deleted.
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /lists/{listId}/privilegedDelete:
    parameters:
    - in: path
      name: listId
      description: "A universally unique identifier for a list."
      example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
      required: true
      schema:
        type: string
    - in: query
      name: force
      required: false
      description: "An indicator for whether to force a list deletion when associated\
        \ jobs are running. A forced deletion cannot occur when the list's 'state'\
        \ property is set to 'deployed' or the list is involved in a relationship."
      schema:
        type: boolean
        default: false
        example: false
    delete:
      tags:
      - List Definition
      operationId: deletePrivilegedList
      summary: Delete a list (privileged)
      description: |
        Removes a list from the system.

        When you delete a list, the list's definition and any import or purge jobs that are associated with the list are removed.

        **IMPORTANT:** Deleting a list does not remove the list's contents.  If required, you should remove the list's contents before you delete the list.
        To clear the list's contents, you must create a purge job. See the [`/lists/{listId}/purgeJobs`](#operations-Clear_List_Contents-createPurgeJob) endpoint for details.
        This two-step process for clearing and deleting a list is due to the non-deterministic
        time it could take to clear the contents of a list.

        There is an exception to the two-step process for clearing and deleting a list. When you delete an immutable list ('isImmutable' is set to 'true'), the contents and list are removed in a single synchronous call.
        This is due to the restriction that you cannot create a purge job for an immutable list. It is recommended that very large lists are not immutable.

        You only can delete a list when its 'state' property is set to 'developing' and the list is not part of a relationship that is registered in the Catalog service.

        A list's deletion fails if the list has any associated import or purge jobs that are running.
        If you believe that an import or purge job is incorrectly marked as running, you can force a list to delete. Doing so does not stop import or purge jobs that are running.
        You cannot force a list to delete when the 'state' property is set to 'deployed' or the list is involved in a relationship.
      responses:
        "204":
          description: The list was deleted.
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /lists/{listId}/privilegedEdit:
    parameters:
    - in: path
      name: listId
      description: "A universally unique identifier for a list."
      required: true
      schema:
        type: string
    put:
      tags:
      - List Definition
      operationId: updatePrivileged
      summary: Update a list's properties (privileged)
      description: |
        Updates a list's properties by a user who has privileged authorization.

        This operation enables you to perform standard updates to a list's properties and privileged updates, such as changing the data mask on columns in the list-content records.

        In some situations, you cannot edit properties that are not marked as Read-Only.

        __Restricted Updates When a List Contains Content__

        Once a list has contents, you cannot update the following properties:
        * 'name'
        * 'isImmutable'
        * 'columns'
        * 'ColumnInfo' objects in 'columns'
          - 'name'
          - 'dataType'
          - 'position'
          - 'isKey'
          - 'keyPosition'
          - 'dataMask'

        Once a list has contents, you can update the 'duplicateKeysEnabled' property to be true, but you cannot update it to be false.

        __Administrative Editing Privileges__

        From the list above, only the 'dataMask' property for the 'ColumnInfo' object can be modified after a list has contents. A user with privileged authorization can create, update, and delete the 'dataMask' property for the 'ColumnInfo' object.

        To enable a user to have access this endpoint, an authorization rule must be created for the URI `/lists/{listId}/privilegedEdit` that allows updates.
      requestBody:
        content:
          application/vnd.sas.listdata.list+json:
            schema:
              $ref: "#/components/schemas/listResource"
            examples:
              json:
                $ref: "#/components/examples/listResourceRepresentation"
          application/vnd.sas.listdata.list+json;version=1:
            schema:
              $ref: "#/components/schemas/listResourceVersionOne"
            examples:
              json:
                $ref: "#/components/examples/listResourceVersionOneRepresentation"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
            Location:
              description: The URI of the list.
              schema:
                type: string
                format: uri
            If-Match:
              description: An ETag in the format of W/"_the-last-updated-timestamp-in-UNIX-nanosecond-time_".
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.listdata.list+json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
            application/vnd.sas.listdata.list+json;version=1:
              schema:
                $ref: "#/components/schemas/listResourceVersionOne"
              examples:
                json:
                  $ref: "#/components/examples/listResourceVersionOneRepresentation"
            application/json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /lists/{listId}/state:
    parameters:
    - in: path
      name: listId
      description: "A universally unique identifier for a list."
      example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
      required: true
      schema:
        type: string
    get:
      tags:
      - List State and Contents
      operationId: getListState
      summary: Get the state of a list
      description: Returns a value of 'deployed' or 'developing' for the list's 'state'
        property. A deployed list cannot be deleted.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
          content:
            text/plain:
              schema:
                type: string
                description: "A valid value for the 'state' property, which is either\
                  \ 'deployed' or 'developing'."
                example: developing
              examples:
                text:
                  value: "developing"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
      - List State and Contents
      operationId: updateListState
      summary: Update the state of a list
      description: Updates the list's 'state' property value as either 'deployed'
        or 'developing'.
      parameters:
      - in: query
        name: value
        required: true
        description: "A valid value for the 'state' property, which is either 'deployed'\
          \ or 'developing'. A deployed list cannot be deleted."
        example: "developing"
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
          content:
            application/vnd.sas.listdata.list+json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
            application/vnd.sas.listdata.list+json;version=1:
              schema:
                $ref: "#/components/schemas/listResourceVersionOne"
              examples:
                json:
                  $ref: "#/components/examples/listResourceVersionOneRepresentation"
            application/json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /lists/{listId}/contents:
    parameters:
    - in: path
      name: listId
      description: "A universally unique identifier for a list."
      required: true
      schema:
        type: string
    head:
      tags:
      - List State and Contents
      operationId: headersForListContents
      summary: Check that a list has contents
      description: |
        Checks the existence of a list's contents.

        A successful response (for example, 200 OK) indicates that the list has contents. An unsuccessful response (for example, 404 Not Found) indicates that the list does not have contents.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
      - List State and Contents
      operationId: getListContents
      summary: Get a list's contents
      description: |
        Returns a collection of the list's contents.

        The operation supports filtering of the contents based on values for columns that are marked as key columns
        (for example, 'isKey' set to 'true'). Only the following filtering functions are supported:

        - the functions `startsWith`, `endsWith`, `contains`, and `eq`.
        - the logical function `and(e1,e2,\[,..,eN\])` for grouping filters. This function cannot be nested or specified more than once within a filter string. The logical function `or()` is not supported.
        - a single function per key column. The example `and(startWith(key1,"ABC"),endsWith(key1,"123"))` is not supported.
        - filtering is not permitted on a key column if it has a data mask.

        See [Filtering in REST APIs](https://developer.sas.com/rest-apis/listData-v6/docs/getting-started/usage-notes#filtering) for more information about filtering collections.

        If a list includes data masking for any column, the value for that column is redacted.
      parameters:
      - $ref: "#/components/parameters/StartCollectionQueryParam"
      - $ref: "#/components/parameters/LimitCollectionQueryParam"
      - $ref: "#/components/parameters/FilterCollectionQueryParam"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/resourceCollection"
              examples:
