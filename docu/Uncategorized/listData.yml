    errorCommon:
      title: Error Common
      description: "This schema defines the common error properties."
      readOnly: true
      properties:
        version:
          type: integer
          description: "The version number of the error representation. This representation\
            \ is version 2."
          default: 2
          example: 2
        httpStatusCode:
          type: integer
          description: "The HTTP status code for the error."
          example: 406
        message:
          type: string
          description: "The error message."
          example: Not Acceptable
        details:
          type: array
          description: "A list of strings with details."
          items:
            type: string
            example: "path: /listData/"
          example:
          - "application/vnd.sas.api+json;version=1"
          - "application/vnd.sas.api+json"
          - "application/json"
          - "path: /listData/"
          - "correlator: ae54a062-33d2-4b6a-a9af-97348a160947"

    errorResponse:
      title: Error
      description: "This schema defines the representation of an error with additional\
        \ errors."
      readOnly: true
      allOf:
      - $ref: "#/components/schemas/errorCommon"
      properties:
        id:
          type: string
          description: "The string ID for the error."
        errorCode:
          type: integer
          description: "The numeric ID for the error."
        remediation:
          type: string
          description: "A message that describes how to resolve the error."
        errors:
          type: array
          description: "Additional errors that occurred."
          items:
            $ref: "#/components/schemas/errorResponseItem"
        links:
          type: array
          description: "The links that apply to the error."
          items:
            $ref: "#/components/schemas/link"
    errorResponseItem:
      title: Error Item
      description: "This schema defines the representation of an error."
      readOnly: true
      allOf:
      - $ref: "#/components/schemas/errorCommon"
      properties:
        id:
          type: string
          description: "The string ID for the error."
        errorCode:
          type: integer
          description: "The numeric ID for the error."
        remediation:
          type: string
          description: "A message that describes how to resolve the error."
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
    errorLeafNodeResponse:
      title: Error Single Level
      description: "This schema defines the representation of an error without another\
        \ level of errors."
      required:
      - version
      properties:
        message:
          type: string
          description: "The error message."
        id:
          type: string
          description: "The string ID for the error."
        errorCode:
          type: integer
          description: "The numeric ID for the error."
        httpStatusCode:
          type: integer
          description: "The HTTP status code for the error."
        details:
          type: array
          description: "Messages that provide additional details about the cause of\
            \ the error."
          items:
            type: string
        remediation:
          type: string
          description: "A message that describes how to resolve the error."
        version:
          type: integer
          description: "The version number of the error representation. This representation\
            \ is version 2."
          example: 2
          default: 2
    link:
      title: Link
      description: "This schema defines a link to a related operation or resource."
      readOnly: true
      properties:
        method:
          type: string
          description: "The HTTP method to invoke this endpoint."
        rel:
          type: string
          description: "The relationship of this URL to the object."
        uri:
          type: string
          description: "The relative URI of the REST endpoint."
        href:
          type: string
          description: "The full URL of the REST endpoint."
        title:
          type: string
          description: "The title for the link."
        type:
          type: string
          description: "The media type that is consumed or produced."
        itemType:
          type: string
          description: "If this link is to a container, the value is the media type\
            \ or the link type for the items in the container."
        responseType:
          type: string
          description: "The media type or link type of the response body for a `PUT`,\
            \ `POST`, or `PATCH` operation."
        responseItemType:
          type: string
          description: "The media type or link type of the items in the response body\
            \ for a `PUT`, `POST`, or `PATCH` operation."
    api:
      title: API
      description: "This schema defines the list of top-level resources that are available\
        \ from the root of the API."
      readOnly: true
      properties:
        version:
          type: integer
          description: "The version number of the API representation. This is version\
            \ 1."
          default: 1
          example: 1
        links:
          type: array
          description: "The API's top-level links."
          items:
            $ref: "#/components/schemas/link"
    listResourceRevision:
      title: List Revision
      description: This schema defines the list revision properties.
      type: object
      properties:
        id:
          type: string
          description: "A unique identifier for the list revision."
          example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
          readOnly: true
        listResourceId:
          type: string
          description: "The unique identifier of the associated list."
          example: 9ec45a61-774c-488e-99a0-03dfde70b966
          readOnly: true
        revision:
          type: number
          description: "An identifier for the order of the list revision."
          readOnly: true
          example: 2
        description:
          type: string
          description: "A textual description of the list revision."
          readOnly: true
          nullable: true
          default: ""
        label:
          type: string
          nullable: true
          description: "A short textual label, which is appropriate for client UIs."
          readOnly: true
        createdBy:
          type: string
          readOnly: true
          description: "The name of the user that created the list."
          example: "userA"
        creationTimeStamp:
          type: string
          readOnly: true
          description: "A timestamp for when the list was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ."
          example: "2022-02-25T20:35:44Z"
    listResourceRevisionCollection:
      title: List Resource Revision Collection
      description: This schema describes a collection of list resource revisions.
      allOf:
      - $ref: "#/components/schemas/resourceCollection"
      properties:
        items:
          type: array
          description: "The items on this page of the collection. Each item in this\
            \ list is of a type that is listed as acceptable."
          example: []
          items:
            $ref: "#/components/schemas/listResourceRevision"
    membershipQueryCollection:
      title: Membership Query Collection
      description: "This schema defines the membership queries from a client."
      properties:
        correlationId:
          type: string
          description: "An optional ID that is provided by the client to associate\
            \ a request to its response."
        includeDeveloping:
          type: boolean
          description: "An indicator for whether to include records that are in the\
            \ developing state in the membership query results. Records in the deployed\
            \ state are always included, regardless of this flag's value. The default\
            \ value is 'false'."
        includeExpired:
          type: boolean
          description: "An indicator for whether to include records that have expired\
            \ in the membership query results. The default value is 'false'."
        queries:
          type: array
          description: "A collection of query objects, where each query object corresponds\
            \ to a specific list."
          items:
            type: object
            properties:
              id:
                type: string
                description: "An ID string that is provided by the client to identify\
                  \ a specific query in the response to the query. This is needed\
                  \ because there is no restriction on multiple-object queries that\
                  \ do not target the same list."
                readOnly: false
              listId:
                type: string
                description: "The ID of the list that is the target of the query."
                example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
                readOnly: false
              values:
                type: array
                description: "A collection of values for whose membership in a list\
                  \ is determined. Only use values that are stored in the key-value\
                  \ column."
                readOnly: false
                items:
                  oneOf:
                  - type: string
                  - type: number
    jobRepresentation:
      title: Job Representation
      description: This schema defines the job representation properties.
      type: object
      properties:
        id:
          type: string
          description: "The unique identifier for the job."
          example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: "The version number for this media type's schema."
          example: 1
        type:
          type: string
          readOnly: true
          description: 'The type of job. The type can be "import", "purge", or "state".'
          example: "import"
        creationTimeStamp:
          type: string
          readOnly: true
          description: "A timestamp for when the job was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ."
          example: "2022-02-25T20:35:44Z"
        completedTimeStamp:
          type: string
          readOnly: true
          description: "A timestamp for when the job completed, in the format of YYYY-MM-DDThh:mm:ss.sssZ."
          example: "2022-02-25T20:35:44Z"
        createdBy:
          type: string
          readOnly: true
          description: "The name of the user that created the list."
          example: "userA"
        lastUpdated:
          type: string
          readOnly: true
          description: "A timestamp for when the job last was updated, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ."
          example: "2022-02-25T20:35:44Z"
        listId:
          type: string
          description: "The unique identifier of the associated list."
          example: 9ec45a61-774c-488e-99a0-03dfde70b966
          readOnly: true
    membershipResultCollection:
      title: Membership Result Collection
      description: "This schema defines the membership results from a client."
      properties:
        version:
          type: integer
          readOnly: true
          description: "The version number for this media type's schema."
          example: 1
        correlationId:
          type: string
          description: "A correlation ID that is returned only if it is set in the\
            \ request. Otherwise, an empty string is returned."
        includeDeveloping:
          type: boolean
          description: "An indicator for whether to include records that are in the\
            \ developing state in the membership query results. Records in the deployed\
            \ state are always included, regardless of this flag's value. The default\
            \ value is 'false'."
          example: false
        includeExpired:
          type: boolean
          description: "An indicator for whether to include records that have expired\
            \ in the membership query results. The default value is 'false'."
          example: false
        results:
          type: array
          description: "The results from an array query. An empty query indicates\
            \ that no memberships were found or that an error occurred."
          items:
            type: object
            properties:
              id:
                type: string
                description: "An ID used to identify a query from the query request."
                readOnly: true
              listId:
                type: string
                description: "The ID of the list that is the target of the query."
                readOnly: true
              listName:
                type: string
                description: "The name of the list against which the membership query\
                  \ was executed."
                readOnly: true
              listLabel:
                type: string
                description: "The label of the list from the list-resource entity."
                readOnly: true
              members:
                type: array
                description: "A collection of values from the membership query that\
                  \ existed in the target list."
                readOnly: true
                items:
                  type: string
              errors:
                type: array
