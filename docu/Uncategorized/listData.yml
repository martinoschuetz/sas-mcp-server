          content:
            text/csv:
              schema:
                type: string
                description: "A CSV file that contains the headers and contents for\
                  \ a list."
                example: export.csv
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
            Location:
              description: The URI of the list.
              schema:
                type: string
                format: uri
            ETag:
              description: An ETag in the format of W/"_the-last-updated-timestamp-in-UNIX-nanosecond-time_".
              schema:
                type: string
