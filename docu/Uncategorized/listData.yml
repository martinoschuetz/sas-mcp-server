  /lists/{listId}/importJobs:
    parameters:
    - in: path
      name: listId
      description: "A universally unique identifier for a list."
      required: true
      schema:
        type: string
    post:
      tags:
      - Asynchronous Content Loading
      operationId: createImportJob
      summary: Create an import job
      description: |
        Updates a list's contents asynchronously by uploading a file.

        You can create a new import job only if no other import jobs or purge jobs are running on the list.

        The Character Separated Values (CSV) data file must contain a header record as the first row. The header record must contain the name of the columns.
        An import job uploads the contents of a data file if the file that contains a header includes matching names and positions as defined in the list's 'columns' property.
        A column value can be empty if the column value is not a part of a key value or the column data type is not a number.

        The List Data API verifies that all the records are in the required format before it loads them into the data store.  Because a large number of records
        could contain errors, there is a threshold of the number of errors that can occur before the validation is terminated.
        No records are loaded if there are validation errors.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dataFile:
                  type: string
                  description: "A file that contains records (data) that are added\
                    \ to a list's contents."
                  format: binary
                  example: "data.csv"
                delimiter:
                  type: string
                  default: ","
                  example: ","
                  description: "The character delimiter that is used in the CSV data\
                    \ file. The character delimiter is typically a comma. Newline\
                    \ characters (for example, \\n or \\r) cannot be used as a delimiter."
      responses:
        "202":
          description: The request has been accepted for processing, but the processing
            has not been completed.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
          content:
            application/vnd.sas.listdata.importjob+json:
              schema:
                $ref: "#/components/schemas/importJob"
              examples:
                json:
                  $ref: "#/components/examples/importJobExample"
            application/json:
              schema:
                $ref: "#/components/schemas/importJob"
              examples:
                json:
                  $ref: "#/components/examples/importJobExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
      - Asynchronous Content Loading
      operationId: getImportJobs
      summary: Get a collection of import jobs
      description: Returns a collection of import jobs for a specific list.
      parameters:
      - $ref: "#/components/parameters/StartCollectionQueryParam"
      - $ref: "#/components/parameters/LimitCollectionQueryParam"
      - $ref: "#/components/parameters/FilterCollectionQueryParam"
      - $ref: "#/components/parameters/SortByCollectionQueryParam"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/resourceCollection"
              examples:
                json:
                  $ref: "#/components/examples/getImportJobsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/resourceCollection"
              examples:
                json:
                  $ref: "#/components/examples/getImportJobsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
