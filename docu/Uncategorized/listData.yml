            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/listResourceCollection"
              examples:
                json:
                  $ref: "#/components/examples/listResourceCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/listResourceCollection"
              examples:
                json:
                  $ref: "#/components/examples/listResourceCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /query/privilegedMemberships:
    post:
      tags:
      - List State and Contents
      operationId: createPrivilegedMembershipQuery
      summary: Create a query for privileged memberships
      description: |
        Enables a client to define a query to determine which values in a set are key values of a list. IDs must be unique within a set of query objects.

        The query returns a set of values or members that exist for the list. The feature also enables a client to send multiple queries in a single request.
      requestBody:
        required: true
        content:
          application/vnd.sas.listdata.membership.query+json:
            schema:
              $ref: "#/components/schemas/membershipQueryCollection"
            examples:
              json:
                $ref: "#/components/examples/membershipQueryCollection"
          application/json:
            schema:
              $ref: "#/components/schemas/membershipQueryCollection"
            examples:
              json:
                $ref: "#/components/examples/membershipQueryCollection"
      responses:
        "201":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
            Location:
              description: The URI of the list.
              schema:
                type: string
                format: uri
            If-Match:
              description: An ETag in the format of W/"_the-last-updated-timestamp-in-UNIX-nanosecond-time_".
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.listdata.membership.result+json:
              schema:
                $ref: "#/components/schemas/membershipResultCollection"
              examples:
                json:
                  $ref: "#/components/examples/membershipResultCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/membershipResultCollection"
              examples:
                json:
                  $ref: "#/components/examples/membershipResultCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /lists/{listId}/jobs:
    parameters:
    - in: path
      name: listId
      description: "The unique identifier for a list."
      required: true
      schema:
        type: string
    head:
      tags:
      - List State and Contents
      operationId: headersForListJobs
      summary: Check that a list has a running job
      description: |
        Checks for the existence of a running job that is associated with a list.

        A successful response (for example, 200 OK) indicates that a job is executing for the list. An unsuccessful response (for example, 404 Not Found) indicates that there are no jobs executing for the list.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
      - List State and Contents
      operationId: getListJobs
      summary: Get a list's job history
      description: |
        Returns a collection of the list's job history.
      parameters:
      - $ref: "#/components/parameters/StartCollectionQueryParam"
      - $ref: "#/components/parameters/LimitCollectionQueryParam"
      - $ref: "#/components/parameters/FilterCollectionQueryParam"
      - $ref: "#/components/parameters/SortByCollectionQueryParam"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/jobRepresentation"
              examples:
                json:
                  $ref: "#/components/examples/jobsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/jobRepresentation"
              examples:
                json:
                  $ref: "#/components/examples/jobsCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  responses:
    BadRequest:
      description: The request was invalid.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
          examples:
            json:
              $ref: "#/components/examples/badRequestErrorExample"
    NotFound:
      description: No item exists at the requested path.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
          examples:
            json:
              $ref: "#/components/examples/notFoundErrorExample"
    Forbidden:
      description: The user did not have the necessary permissions.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
          examples:
            json:
              $ref: "#/components/examples/forbiddenErrorExample"
    Conflict:
      description: The request could not be completed due to a conflict with an existing
        resource.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
          examples:
            json:
              $ref: "#/components/examples/conflictErrorExample"
    InternalServerError:
      description: The request could not be fulfilled because of an unexpected server
        error.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
          examples:
            json:
              $ref: "#/components/examples/internalServerErrorExample"
    NotAcceptable:
      description: The specified media type is not supported.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorCommon"
          examples:
            json:
              $ref: "#/components/examples/notAcceptableErrorExample"
    UnsupportedMediaType:
      description: The requested media type is not supported.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorCommon"
          examples:
            json:
              $ref: "#/components/examples/unsupportedMediaTypeErrorExample"
  schemas:
    resourceCollection:
      title: Resource Collection
      description: This schema defines a paginated collection of resources.
      properties:
        name:
          type: string
          description: "The name of the collection."
          readOnly: true
        start:
          type: integer
          description: "The zero-based index of the first item in the collection."
          readOnly: true
          default: 0
          example: 0
        limit:
          type: integer
          default: 10
          description: "The number of items that can be requested for the collection."
          readOnly: true
          example: 10
        count:
          type: integer
          description: "If populated, the number of items in the collection."
          readOnly: true
          format: int64
          example: 2
        accept:
          type: string
          description: "A space-delimited list of media types from which an `Accept`\
            \ header might be constructed."
          readOnly: true
          example: application/json
        items:
          type: array
          description: "The items on this page of the collection. Each item in this\
            \ list is of a type that is listed as acceptable."
          example: [{"x": "1", "y": "1"}, {"x": "2", "y": "2"}]
          items:
            properties:
              object:
                type: object
                description: "A resource entry."
        links:
          type: array
          description: "The links that apply to the collection."
          readOnly: true
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: "The version number of the collection representation. This\
            \ representation is version 2."
          readOnly: true
    listResourceVersionOne:
      title: List Properties Version One
      description: This schema defines the properties of the first version of a list.
      type: object
      required:
      - name
      - state
      - columns
      properties:
        id:
          type: string
          description: "A unique identifier for the list."
          example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: "The version number for this media type's schema."
          example: 1
        name:
          type: string
          description: "The name of the list. The list name is not case-sensitive,\
            \ must be unique within the system, and cannot be updated once it is created."
          example: "list-a"
          readOnly: false
        state:
          type: string
          description: "An indicator for whether the list can be used by deployed\
            \ artifacts. A list can be either deployed or developing. Only developing\
            \ lists can be deleted."
          default: "developing"
          example: "developing"
        description:
          type: string
          description: "A textual description of the list."
          nullable: true
          default: ""
        createdBy:
          type: string
          readOnly: true
          description: "The name of the user that created the list."
          example: "userA"
        modifiedBy:
          type: string
          readOnly: true
          description: "The name of the user that made the last update to the list."
          example: "user2"
        creationTimeStamp:
          type: string
          readOnly: true
          description: "A timestamp for when the list was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ."
          example: "2022-02-25T20:35:44Z"
        modifiedTimeStamp:
          type: string
          readOnly: true
          description: "A timestamp for when the list was last modified, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ."
          example: "2022-02-25T20:35:44Z"
        isImmutable:
          type: boolean
          description: "An indicator for whether the list's contents can be altered\
            \ after it is imported."
          default: false
        columns:
          type: array
          readOnly: false
          description: |
            Columns are a collection of 'ColumnInfo' objects that define the structure of the list's content. 'ColumnInfo' objects map
            properties such as name, position, and data type to the imported source data (for example, a CSV file). Columns also mark which values are used to construct lookup keys. Key properties are flagged as such and are assigned a position for where their values are placed
            in the lookup key.

            The number of columns in the data source's header must match the number of columns (that is, the number of 'ColumnInfo' objects) that are defined for a list. The value for the 'ColumnInfo' position's object must be a sequential set of positions such as 1..N,
            where N is the number of columns in the header. For example, if the input data has a 3-column header, there must be a 'ColumnInfo' object for each position 1, 2, and 3.
          items:
            $ref: "#/components/schemas/columnInfo"
          minItems: 1
          uniqueItems: true
        defaultExpiry:
          type: number
          readOnly: false
          description: "The value that sets the expiration of newly added rows."
          example: 10000
        label:
          type: string
          nullable: true
          description: "A short textual label, which is appropriate for client UIs."
        links:
          type: array
          readOnly: true
          description: "The reference links that apply to this object."
          items:
            $ref: "#/components/schemas/link"
    listResource:
      title: List Properties
      description: This schema defines the list properties.
      type: object
      required:
      - name
      - state
      - columns
      properties:
        id:
          type: string
          description: "A unique identifier for the list."
          example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: "The version number for this media type's schema."
          example: 2
        name:
          type: string
          description: "The name of the list. The list name is not case-sensitive,\
            \ must be unique within the system, and cannot be updated once it is created."
          example: "list-a"
          readOnly: false
        state:
          type: string
          description: "An indicator for whether the list can be used by deployed\
            \ artifacts. A list can be either deployed or developing. Only lists in\
            \ developing can be deleted."
          default: "developing"
          example: "developing"
        description:
          type: string
          description: "A textual description of the list."
          nullable: true
          default: ""
        createdBy:
          type: string
          readOnly: true
          description: "The name of the user that created the list."
          example: "userA"
        modifiedBy:
          type: string
          readOnly: true
          description: "The name of the user that made the last update to the list."
          example: "user2"
        creationTimeStamp:
          type: string
          readOnly: true
          description: "A timestamp for when the list was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ."
          example: "2022-02-25T20:35:44Z"
        modifiedTimeStamp:
          type: string
          readOnly: true
          description: "A timestamp for when the list was last modified, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ."
          example: "2022-02-25T20:35:44Z"
        isImmutable:
          type: boolean
          description: "An indicator for whether the list's contents can be altered\
            \ after it is imported."
          default: false
        duplicateKeysEnabled:
          type: boolean
          description: "An indicator for whether the list might contain multiple records\
            \ with the same key."
          default: false
        columns:
          type: array
          readOnly: false
          description: |
            Columns are a collection of 'ColumnInfo' objects that define the structure of the list's content. 'ColumnInfo' objects map
            properties such as name, position, and data type to the imported source data (for example, a CSV file). Columns also mark which values are used to construct lookup keys. Key properties are flagged as such and are assigned a position for where their values are placed
            in the lookup key.

            The number of columns in the data source's header must match the number of columns (that is, the number of 'ColumnInfo' objects) that are defined for a list. The value for the 'ColumnInfo' position's object must be a sequential set of positions such as 1..N,
            where N is the number of columns in the header. For example, if the input data has a 3-column header, there must be a 'ColumnInfo' object for each position 1, 2, and 3.
          items:
            $ref: "#/components/schemas/columnInfo"
          minItems: 1
          uniqueItems: true
        defaultExpiry:
          type: number
          readOnly: false
          description: "The value that sets the expiration of newly added rows."
          example: 10000
        label:
          type: string
          nullable: true
          description: "A short textual label, which is appropriate for client UIs."
        links:
          type: array
          readOnly: true
          description: "The reference links that apply to this object."
          items:
            $ref: "#/components/schemas/link"
    listResourceCollection:
      title: List Resource Collection
      description: This schema describes a collection of list resources.
      allOf:
      - $ref: "#/components/schemas/resourceCollection"
      properties:
        items:
          type: array
          description: "The items on this page of the collection. Each item in this\
            \ list is of a type that is listed as acceptable."
          example: []
          items:
            $ref: "#/components/schemas/listResource"
    listDetailsVersionOne:
      title: List Details Version One
      description: "This schema defines the details of the first version of a list."
      type: object
      properties:
        id:
          type: string
          description: "A unique identifier for the list."
          example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: "The version number for this media type's schema."
          example: 1
        name:
          type: string
          description: "The name of the list. The list name is not case-sensitive,\
            \ must be unique within the system, and cannot be updated once it is created."
          example: "list-a"
          readOnly: false
        description:
          type: string
          description: "A textual description of the list."
          nullable: true
          default: ""
        parentFolder:
          type: string
          description: "The folder in which the list is stored."
          example: "myFolder"
          readOnly: true
        location:
          type: string
          description: "The full path to the folder in which the list is stored."
          example: "/public/myFolder"
          readOnly: true
        keyPrefix:
          type: string
          description: "The Redis key prefix that is used to access elements of the\
            \ list."
          example: "SAS|0|0|LIST|myList"
          readOnly: true
        links:
          type: array
          readOnly: true
          description: "The reference links that apply to this object."
          items:
            $ref: "#/components/schemas/link"
        revision:
          type: number
          readOnly: true
          description: "The number of revisions that exist to this list."
          example: 2
        deployedRevision:
          type: number
          readOnly: true
          description: "The number of the revision that is currently deployed."
          example: 3
    listDetails:
      title: List Details
      description: "This schema defines the list details."
      type: object
      properties:
        id:
          type: string
          description: "A unique identifier for the list."
          example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: "The version number for this media type's schema."
          example: 2
        name:
          type: string
          description: "The name of the list. The list name is not case-sensitive,\
            \ must be unique within the system, and cannot be updated once it is created."
          example: "list-a"
          readOnly: false
        description:
          type: string
          description: "A textual description of the list."
          nullable: true
          default: ""
        parentFolder:
          type: string
          description: "The folder in which the list is stored."
          example: "myFolder"
          readOnly: true
        location:
          type: string
          description: "The full path to the folder in which the list is stored."
          example: "/public/myFolder"
          readOnly: true
        keyPrefix:
          type: string
          description: "The Redis key prefix that is used to access elements of the\
            \ list."
          example: "SAS|0|0|LIST|myList"
          readOnly: true
        links:
