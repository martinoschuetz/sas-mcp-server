  /lists/{listId}/contents/state:
    parameters:
    - in: path
      name: listId
      description: "A universally unique identifier for a list."
      required: true
      schema:
        type: string
    put:
      tags:
      - Update List Content State
      operationId: updateListContentState
      summary: Update the state of a list's rows
      description: |
        Updates the state of a list's rows synchronously via a JSON request body.

        Optionally, you can update the expiry of the selected rows. When rows are deployed using this parameter, their expiries are also updated, even if the rows were already deployed.

        The expiry value of a row is represented as a UNIX timestamp, which is the number of seconds since the UNIX epoch (January 1, 1970).

        If the value for the 'exactExpiry' property is 'true', the value provided is taken to be a UNIX timestamp and is used directly. Otherwise, it is used as an offset, which is the number of seconds after now that the rows should expire.

        A request body to update the state of rows in a list must contain a collection of data record objects with keys that match the column definitions.

        The desired state (developing or deployed) must be specified in the body of the request.
      requestBody:
        required: false
        content:
          application/vnd.sas.collection+json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
            examples:
              json:
                $ref: "#/components/examples/updateListContentState"
          application/vnd.sas.listdata.dataset.details+json:
            schema:
              $ref: "#/components/schemas/listDataSetDetails"
            examples:
              json:
                $ref: "#/components/examples/updateListContentState"
          application/vnd.sas.listdata.dataset.details+json;version=1:
            schema:
              $ref: "#/components/schemas/listDataSetDetailsVersionOne"
            examples:
              json:
                $ref: "#/components/examples/updateListContentVersionOneState"
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
            examples:
              json:
                $ref: "#/components/examples/updateListContentState"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
            Location:
              description: The URI of the list.
              schema:
                type: string
                format: uri
            ETag:
              description: An ETag in the format of W/"_the-last-updated-timestamp-in-UNIX-nanosecond-time_".
              schema:
                type: string
          content:
            application/vnd.sas.listdata.list+json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
            application/vnd.sas.listdata.list+json;version=1:
              schema:
                $ref: "#/components/schemas/listResourceVersionOne"
              examples:
                json:
                  $ref: "#/components/examples/listResourceVersionOneRepresentation"
            application/json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
