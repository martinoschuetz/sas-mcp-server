              schema:
                $ref: "#/components/schemas/listDataSetDetails"
              examples:
                json:
                  $ref: "#/components/examples/getListContentDetailsExample"
            application/vnd.sas.listdata.dataset.details+json;version=1:
              schema:
                $ref: "#/components/schemas/listDataSetDetailsVersionOne"
              examples:
                json:
                  $ref: "#/components/examples/getListContentDetailsVersionOneExample"
            application/json:
              schema:
                $ref: "#/components/schemas/resourceCollection"
              examples:
                json:
                  $ref: "#/components/examples/getListContentsSasCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
      - List State and Contents
      operationId: updateListContents
      summary: Update a list's contents
      description: |
        Update the contents of a list synchronously via a JSON request body. An update can include the removal of list records.

        A request body to update a list's contents must contain a collection of data record objects with key-value pairs that match the column definitions.

        To insert a record, all key and data column values are required.

        Updating and deleting records varies based on the 'duplicateKeysEnabled' property of the list.

        When 'duplicateKeysEnabled' is set to false:  
        - To update a record, all key column values are required and only the data column values that are provided are updated.
        - To delete a record, all key column values are required.

        When 'duplicateKeysEnabled' is set to true:  
        - Records might not be updated, because new entries with key and data column values can be inserted.
        - To delete a record, all key and data column values are required.

        The contents of the list can be edited only if the most recent revision is the deployed revision.
      parameters:
      - in: path
        name: listId
        required: true
        description: "A universally unique identifier for a list."
        schema:
          type: string
      - in: query
        name: op
        description: "The operation type for the PUT method. Supported operations\
          \ are 'upsert', which updates or inserts records, and 'delete', which deletes\
          \ existing records."
        schema:
          type: string
          description: "The specified operation."
          default: "upsert"
      requestBody:
        required: false
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/resourceCollection"
            examples:
              json:
                $ref: "#/components/examples/addListContentEntriesRequestBody"
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
            examples:
              json:
                $ref: "#/components/examples/addListContentEntriesRequestBody"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
            Location:
              description: The URI of the list.
              schema:
                type: string
                format: uri
            If-Match:
              description: An ETag in the format of W/"_the-last-updated-timestamp-in-UNIX-nanosecond-time_".
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.listdata.list+json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
            application/vnd.sas.listdata.list+json;version=1:
              schema:
                $ref: "#/components/schemas/listResourceVersionOne"
              examples:
                json:
                  $ref: "#/components/examples/listResourceVersionOneRepresentation"
            application/json:
              schema:
                $ref: "#/components/schemas/listResource"
              examples:
                json:
                  $ref: "#/components/examples/listResourceRepresentation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /lists/{listId}/privilegedContents:
