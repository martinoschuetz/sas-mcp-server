          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
            examples:
              json:
                $ref: "#/components/examples/updateListContentStateJob"
      responses:
        "202":
          description: The request has been accepted for processing, but the processing
            has not been completed.
          headers:
            Content-Type:
              description: The media type for the body of the request or response.
              schema:
                type: string
                format: string
          content:
            application/vnd.sas.listdata.updatecontentstatejob+json:
