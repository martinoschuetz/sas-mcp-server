              examples:
                json:
                  $ref: "#/components/examples/purgeJobExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
      - Clear List Contents
      operationId: getPurgeJobs
      summary: Get a collection of purge jobs
      description: Returns a collection of purge jobs for a specific list. A purge
        job removes the list's contents.
      parameters:
      - $ref: "#/components/parameters/StartCollectionQueryParam"
      - $ref: "#/components/parameters/LimitCollectionQueryParam"
      - $ref: "#/components/parameters/FilterCollectionQueryParam"
      - $ref: "#/components/parameters/SortByCollectionQueryParam"
      responses:
