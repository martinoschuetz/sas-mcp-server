          description: "The number of the revision that is currently deployed."
          example: 3
        recordCount:
          type: number
          readOnly: true
          description: "The total number of records in the current list revision,\
            \ excluding records from previous revisions. A returned value of '-1'\
            \ means that the count could not be calculated at the time of the request."
          example: 1000
        memoryBytes:
          type: number
          readOnly: true
          description: "The estimated memory that Redis uses to store the list. A\
            \ returned value of '-1' means that the memory usage could not be calculated\
            \ at the time of the request."
          example: 20000
    listConsumer:
      title: List Consumers
      description: This schema defines the list consumer details.
      type: object
      properties:
        relationshipId:
          type: string
          readOnly: true
          description: The relationship instance ID that is managed by the Catalog
            service.
          example: "f59529c3-be3a-4f9e-9a23-d4443a30d3cf"
        relationshipUri:
          type: string
          readOnly: true
          description: The URI to the relationship that is managed by the Catalog
            service.
          example: "/catalog/instances/f59529c3-be3a-4f9e-9a23-d4443a30d3cf"
        relationshipDefinitionId:
          type: string
          readOnly: true
          description: The ID of the Catalog service definition of the relationship.
          example: "d56002e5-fd2e-437f-a45e-a1bf75e4a913"
        consumerId:
          type: string
          readOnly: true
          description: The ID of the consuming entity.
          example: "3ce976dc-9e13-454f-a7e0-0505f2faaf0f"
        consumerUri:
          type: string
          readOnly: true
          description: The URI to a Catalog service instance of the consuming entity.
          example: "/catalog/instances/3ce976dc-9e13-454f-a7e0-0505f2faaf0f"
    listDetailsWithConsumersVersionOne:
      title: List Details with Consumers Version One
      description: "This schema defines the details with consumers of the first version\
        \ of a list."
      allOf:
      - $ref: "#/components/schemas/listDetailsVersionOne"
      properties:
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/listConsumer"
    listDetailsWithConsumers:
      title: List Details with Consumers
      description: "This schema defines the list details with consumers."
      allOf:
      - $ref: "#/components/schemas/listDetails"
      properties:
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/listConsumer"
    listConsumerList:
      title: List Resource Consumer List
      description: "This schema defines the list consumers."
      properties:
        consumerCount:
          type: integer
          description: The number of consumers.
          readOnly: true
          example: 10
        consumers:
          type: array
          description: A list of list resource consumers.
          readOnly: true
          items:
            $ref: "#/components/schemas/listConsumer"
          example: [{"relationshipId": "f59529c3-be3a-4f9e-9a23-d4443a30d3cf", "relationshipUri": "/catalog/instances/f59529c3-be3a-4f9e-9a23-d4443a30d3cf",
              "relationshipDefinitionId": "d56002e5-fd2e-437f-a45e-a1bf75e4a913",
              "consumerId": "3ce976dc-9e13-454f-a7e0-0505f2faaf0f", "consumerUri": "/catalog/instances/3ce976dc-9e13-454f-a7e0-0505f2faaf0f"}]
    summary:
      title: Summary Details
      description: "This schema defines the summary details of a list that is required\
        \ by the Catalog service."
      properties:
        creationTimeStamp:
          type: string
          format: date-time
        createdBy:
          type: string
        modifiedTimeStamp:
          type: string
          format: date-time
        modifiedBy:
          type: string
        version:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
        typeDefName:
          type: string
        iconUri:
          type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
    transferObject:
      title: Transfer Object
      description: "This schema defines the transfer object schema that is required\
        \ by the Transfer service."
    columnInfo:
      title: Column Information
      description: "This schema identifies the column information objects that define\
        \ the properties for a list."
      type: object
      required:
      - name
      - dataType
      - position
      properties:
        id:
          type: string
          description: "A unique identifier for a column."
          readOnly: true
          example: uuid
        name:
          type: string
          description: "The name of the column in the input data files header."
          example: "userId"
        dataType:
          type: string
          description: |
            "The type of input data for the column. Valid values are 'number', 'string', 'datetime', 'currency' or 'currency_code'.""
          example: "string"
          enum:
          - number
          - string
          - datetime
          - currency
          - currency_code
        isKey:
          type: boolean
          description: "An indicator that the column's value is used to create the\
            \ key value for the key-value data store."
          default: false
          example: true
        keyPosition:
          type: integer
          description: "A 1-based position index that specifies where a column's value\
            \ is located in the record's key value. A '0' means not a key. Only positive\
            \ values are valid. For all the key columns, the key positions must be\
            \ contiguous and without duplicates. If 'isKey' is set to 'false', then\
            \ 'keyPosition' is automatically set to '0' and user input for this value\
            \ is ignored."
          example: 1
        position:
          type: integer
          description: "The location of the column values in the delimited entry from\
            \ the input data. Location is used when importing, storing, and retrieving\
            \ values from the input data and the key-value data store. For the header\
            \ 'userId,name,salary', the position of 'userId' is '1'."
          example: 1
        dataMask:
          $ref: "#/components/schemas/dataMask"
    dataMask:
      title: Data Mask
      type: object
      description: "This schema defines the data mask for a column's value when retrieving\
        \ a list's contents."
      required:
      - name
      - regex
      - replace
      - example
      properties:
        name:
          type: string
          description: "The name of the data-masking action for previewing the list\
            \ data."
          example: "Mask Start"
        regex:
          type: string
          description: "The regular expression for the data mask where members of\
            \ the group are displayed."
          example: ".(....$)|."
        replace:
          type: string
          description: "The replace expression for the groups that result from the\
            \ 'regex' property. Only characters in 'regex' groups (for example, $1)\
            \ are displayed. All other characters are masked."
          example: "*$1"
        example:
          type: string
          description: "An example of the expected output of a redacted record."
          example: "****1234"
    importJob:
      title: Import Job
      type: object
      description: "This schema defines the import job that loads a list's contents\
        \ from a data file."
      properties:
        id:
          type: string
          readOnly: true
          description: "A universally unique identifier for an import job."
          example: b791e348-984e-439d-bff4-5b4163d897af
        version:
          type: integer
          readOnly: true
          description: "The version number for this media type's schema."
          example: 1
          default: 1
        state:
          type: string
          readOnly: true
          description: "The job's state. The state can be either 'running', 'completed',\
            \ or 'failed'."
          example: running
        fileName:
          type: string
          readOnly: true
          description: "The name of the file that contains the records to import."
          example: "data.csv"
        sha256Sum:
          type: string
          readOnly: true
          description: "The SHA256 hash of the file contents that is used to import\
            \ the records."
          example: "69091e2c774812266d577dc83472a2ab81687efde1e276feb0aaa77d637df11c"
        creationTimeStamp:
          type: string
          readOnly: true
          description: "A timestamp for when the job was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ."
          example: 2022-05-31T14:31:57Z
        createdBy:
          type: string
          readOnly: true
          description: "The ID of the user (the ID of the user object) who created\
            \ the import job."
          example: userA
        completedTimeStamp:
          type: string
          readOnly: true
          description: "A timestamp for when the job was last modified, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ."
          example: 2022-05-31T14:31:57Z
        listId:
          type: string
          readOnly: true
          description: "The unique identifier of the list for which the import job\
            \ was created."
          example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
        totalErrors:
          type: integer
          readOnly: true
          description: "The total number of errors that occurred during the import\
            \ job's validation process. Descriptive error objects are returned in\
            \ the 'errors' array. However, there is a threshold to the number of error\
            \ objects that are returned."
          example: 1001
        results:
          type: object
          readOnly: true
          properties:
            recordCount:
              type: integer
              description: "The number of records that are imported as part of the\
                \ import job."
              example: 100
          description: "The result that is shown only when a job completes."
        errors:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/errorLeafNodeResponse"
          description: "For a job that fails, an array of error types that occurred\
            \ during validation.  There is a threshold to the number of errors that\
            \ are returned."
        links:
          type: array
          description: "The link relations that apply to the job."
          items:
            $ref: "#/components/schemas/link"
    listDataSet:
      title: List Data Set
      description: |
        "This schema defines the object that contains the metadata for a list's columns and content records that are stored in an array of rows."
      properties:
        listId:
          type: string
          readOnly: true
          description: "A universally unique identifier for a list."
          example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
        name:
          type: string
          description: "The name of the collection."
          readOnly: true
          example: list-a
        version:
          type: integer
          readOnly: true
          description: "The version number for this media type's schema."
          example: 1
        createdBy:
          type: string
          readOnly: true
          description: "The user that created the list."
          example: userA
        creationTimeStamp:
          type: string
          description: "A timestamp for when the list was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ."
          example: "2022-02-25T20:35:44Z"
        modifiedBy:
          type: string
          readOnly: true
          description: "The user that made the last update to the list."
          example: userA
        modifiedTimeStamp:
          type: string
          description: "A timestamp for when the list was last updated, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ."
          example: "2022-02-25T20:35:44Z"
        columnCount:
          type: integer
          description: "The number of columns in the data."
        columns:
          type: array
          description: "The metadata about the columns of the data."
          items:
            type: object
            properties:
              name:
                type: string
                description: "The name of the column in the input data file's header."
              dataType:
                type: string
                description: |
                  The type of input data for the column. Valid values are 'number', 'string', 'datetime', 'currency' or 'currency_code'."
                enum:
                - number
                - string
                - datetime
                - currency
                - currency_code
              position:
                type: integer
                description: "The location of the column values in the delimited entry\
                  \ from the input data. Location is used when you import, store,\
                  \ and retrieve values from the input data and the key-value data\
                  \ store. For the header, 'userId,name,salary', the position of 'userId'\
                  \ is '1'."
              isKey:
                type: boolean
                description: "An indicator to use the column's value to create the\
                  \ key value for the key-value data store."
              keyPosition:
                type: integer
                description: "A 1-based position index that specifies where a column's\
                  \ value is located in the record's key value. A '0' means not a\
                  \ key. Only positive values are valid. For all the key columns,\
                  \ the key positions must be contiguous and without duplicates. If\
                  \ 'isKey' is set to 'false', then 'keyPosition' is automatically\
                  \ set to '0' and user input for this value is ignored."
              dataMask:
                type: object
                description: "A restriction or redaction on the presentation of a\
                  \ column's value when you retrieve a list's contents. See the [DataMask\
                  \ Schema](#model-dataMask) for more information."
                properties:
                  name:
                    type: string
                  regex:
                    type: string
                  replace:
                    type: string
                  example:
                    type: string
          example:
          - name: userId
            dataType: string
            position: 1
            isKey: true
            keyPosition: 1
          - name: firstName
            dataType: string
            position: 2
            isKey: false
            keyPosition: 0
          - name: lastName
            dataType: string
            position: 3
            isKey: false
            keyPosition: 0
          - name: salary
            datatype: number
            position: 4
            isKey: false
            keyPosition: 0
            dataMask: {"name": "hide-all", "regex": ".", "replace": "*", "example": "*****"}

        rowCount:
          type: integer
          readOnly: true
          description: "The total number of rows in the data."
          example: 3
        rows:
          type: array
          readOnly: true
          description: "A collection of objects that contains arrays of heterogeneous\
            \ data from the list."
          items:
            example: [["58b2a1a2", "Aron", "Denesik", 745072], ["6e107010", "Chery",
                "Kunze", 935262], ["38c0e0c7", "Letha", "Goldner", 672002]]
    listDataSetDetailsVersionOne:
      title: List Data Set Details Version One
      description: |
        "This schema defines the object that contains a collection of row values and metadata."
      properties:
        name:
          type: string
          description: "The name of the collection."
          readOnly: true
        start:
          type: integer
          description: "The zero-based index of the first item in the collection."
          readOnly: true
          default: 0
          example: 0
        limit:
          type: integer
          default: 10
          description: "The number of items that can be requested for the collection."
          readOnly: true
          example: 10
        count:
          type: integer
          description: "If populated, the number of items in the collection."
          readOnly: true
          format: int64
          example: 2
        accept:
          type: string
          description: "A space-delimited list of media types from which an `Accept`\
            \ header might be constructed."
          readOnly: true
          example: application/json
        items:
          type: array
          description: "The items on this page of the collection. Each item in this\
            \ list is of a type that is listed as acceptable."
          example: [{"deployed": "deployed", "expiry": "1685974424", "values": {"x": "1",
                "y": "1"}}, {"deployed": "developing", "expiry": "1685974424", "values": {
                "x": "2", "y": "2"}}]
          items:
            properties:
              object:
                type: object
                description: "A resource entry."
        links:
          type: array
          description: "The links that apply to the collection."
          readOnly: true
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: "The version number of the collection representation. This\
            \ representation is version 1."
          readOnly: true
    listDataSetDetails:
      title: List Data Set Details
      description: |
        "This schema defines the object that contains a collection of row values and metadata."
      properties:
        name:
          type: string
          description: "The name of the collection."
          readOnly: true
        start:
          type: integer
          description: "The zero-based index of the first item in the collection."
          readOnly: true
          default: 0
          example: 0
        limit:
          type: integer
          default: 10
          description: "The number of items that can be requested for the collection."
          readOnly: true
          example: 10
        count:
          type: integer
          description: "If populated, the number of items in the collection."
          readOnly: true
          format: int64
          example: 2
        accept:
          type: string
          description: "A space-delimited list of media types from which an `Accept`\
            \ header might be constructed."
          readOnly: true
          example: application/json
        items:
          type: array
          description: "The items on this page of the collection. Each item in this\
            \ list is of a type that is listed as acceptable."
          example: [{"state": "deployed", "expiry": "1685974424", "values": {"x": "1",
                "y": "1"}}, {"state": "developing", "expiry": "1685974424", "values": {
                "x": "2", "y": "2"}}]
          items:
            properties:
              object:
                type: object
                description: "A resource entry."
        links:
          type: array
          description: "The links that apply to the collection."
          readOnly: true
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: "The version number of the collection representation. This\
            \ representation is version 2."
          readOnly: true
    purgeJob:
      title: Purge Job
      type: object
      description: "This schema defines the resource that contains information about\
        \ an asynchronous job that removes a list's contents."
      properties:
        id:
          type: string
          readOnly: true
          description: "A universally unique identifier for a purge job."
          example: c796b3cd301e
        version:
          type: integer
          readOnly: true
          description: "The version number for this media type's schema."
          example: 1
        state:
          type: string
          readOnly: true
          description: "The job's state. Values are 'running','completed', and 'failed'."
          example: running
        listId:
          type: string
          readOnly: true
          description: "The unique identifier of the list for which the purge job\
            \ was created."
          example: 3659ea38-2618-4474-aeac-0bf6cfd3c322
        creationTimeStamp:
