- url: http://example.com/dataDiscovery
  description: The root of the dataDiscovery API
components:
  schemas:
    model:
      title: Model
      description: The Model consumes assessment reports, and generates suggestions
        for suggestion reports. Note that some providers may restrict the kind of
        models that can be used with the service.
      type: object
      required:
      - name
      - providerName
      - modelURI
      properties:
        version:
          type: integer
          format: int32
          description: The version number of the Model representation. 1 is the only
            supported version.
        id:
          type: string
          description: "Unique identifier of the Model.  This field is generated by\
            \ the service, and (if specified) for PUT requests, it must match the\
            \ URL parameter. Max length: 36"
        name:
          type: string
          description: "Name of the Model. Max length: 100"
        description:
          type: string
          description: "Descriptive text for this model. Max length: 1000"
        modelURI:
          type: string
          description: "URI associated with this model.  Max length: 1000"
        scope:
          type: string
          description: "Optional value that qualifies the context for model operation.\
            \  Max length: 10"
        remediationURI:
          type: string
          description: "URI of a resource that can assist in implementing the suggestions\
            \ from this model; note that providers can restrict the kinds of resources\
            \ used for remediation. Max length: 1000"
        filterCriteria:
          type: string
          description: "A filter expression that is interpreted by the provider to\
            \ apply policies to the model's operation. Max length: 1000"
        providerName:
          type: string
          description: "Name of provider associated with this model. Max length: 100"
        createdBy:
          type: string
          description: The user who created this Model. This field is generated by
            the service.
        creationTimeStamp:
          type: string
          format: date-time
          description: Timestamp of Model creation. This field is generated by the
            service.
        modifiedBy:
          type: string
          description: The last user to modify this Model. This field is generated
            by the service.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Timestamp of last modification. This field is generated by
            the service.
        links:
          type: array
          description: HATEOAS links.
          items:
            $ref: "#/components/schemas/link"
    modelCollection:
      title: Model collection
      description: A collection of Models.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The list of models.
            items:
              $ref: "#/components/schemas/model"
    assessmentJob:
      title: Assessment Job
      description: The Assessment Job is used to track the asynchronous construction
        of Assessment reports. Consumers can monitor the state property; when it moves
        to either 'completed' or 'failed', the job is complete and (if successful)
        the report is available.
      type: object
      required:
      - name
      - resourceURI
      - providerName
      properties:
        version:
          type: integer
          format: int32
          description: The version number of the Job representation. 1 is the only
            supported version.
        id:
          type: string
          description: "Unique identifier of the assessment Job. This field is generated\
            \ by the service. Max length: 36."
        name:
          type: string
          description: "Name of the job. Max length: 100"
        description:
          type: string
          description: "Descriptive text for this job. Max length: 1000"
        resourceURI:
          type: string
          description: The URI of the resource being assessed.
        providerName:
          type: string
          description: "The name of the assessment provider to use during evaluation.\
            \ Max length: 100."
        parameters:
          type: object
          description: Key/Value parameters for the use by the provider. See the provider
            documentation to populate this map correctly.
          additionalProperties:
            type: string
        state:
          type: string
          description: "The current state of the job: pending, running, canceled,\
            \ completed, failed, or timedOut."
        endTimeStamp:
          description: The date when the job finished. This uses the yyyy-MM-ddTHH:mm:ss.SSSZ
            format.
          type: string
        heartbeatTimeStamp:
          description: The date of the last received heartbeat. This uses the yyyy-MM-ddTHH:mm:ss.SSSZ
            format.
          type: string
        expirationTimeStamp:
          description: The formatted time stamp of when the job expires and is deleted
            by the job execution API. This uses the yyyy-MM-ddTHH:mm:ss.SSSZ format
            and is set by the API upon job completion based on the expiresAfter member
            value of the job request.
          type: string
        heartbeatInterval:
          type: integer
          format: int32
          description: The interval in seconds that the heartbeatTimeStamp is updated
            by the provider before the job times out. This is 0 if there is no heartbeat.
        elapsedTime:
          type: integer
          format: int64
          description: The number of milliseconds that elapsed from the time the job
            was started until it finished, or the amount of time that has passed if
            it is still running.
        expiresAfter:
          type: string
          description: "The duration of time (in [W3C XML duration format](https://www.w3.org/TR/xmlschema-2/#duration))\
            \ after the job is complete when the job should be deleted by the job\
            \ execution API. For example, to indicate that the job would expire after\
            \ 30 days, write: `P30D`."
        results:
          type: object
          description: "Key/Value results from the provider. If the job succeeds,\
            \ a 'reportURI' "
          additionalProperties:
            type: string
        error:
          $ref: "#/components/schemas/error2"
        createdBy:
          type: string
          description: The user who created this job. This field is generated by the
            service.
        creationTimeStamp:
          type: string
          format: date-time
          description: Timestamp of job creation. This field is generated by the service.
        modifiedBy:
          type: string
          description: The last user to modify this Model. This field is generated
            by the service.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Timestamp of last modification. This field is generated by
            the service.
        links:
          type: array
          description: HATEOAS links.
          items:
            $ref: "#/components/schemas/link"
    assessmentJobCollection:
      title: Assessment Job Collection
      description: A collection of Assessment Jobs.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
