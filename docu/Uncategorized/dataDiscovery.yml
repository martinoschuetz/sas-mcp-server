    suggestion:
      title: Suggestion
      description: The Suggestion is the data element that appears in a suggestion
        report. It represents a single suggestion as computed by the provider. The
        id field is provided to support the PATCH operation on a suggestion report.
      type: object
      required:
      - subject
      - action
      - score
      properties:
        version:
          type: integer
          format: int32
          description: The version number of the Suggestion representation. 1 is the
            only supported version.
        id:
          type: string
          description: "Unique identifier of the Suggestion. This field is generated\
            \ by the service. Max length: 36"
        action:
          type: string
          description: "The label returned by the provider; applications interpret\
            \ this label to react to suggestions. Max length: 100"
        subject:
          type: string
          description: "The subject for the suggestion; for example, a table provider\
            \ may provide subjects representing columns within the table, or for the\
            \ table itself. Max length: 100."
        score:
          type: number
          description: The score associated with the suggestion. This is generally
            a value between 0 and 1 (inclusive), but may vary by provider.
        description:
          type: string
          description: Additional text that accompanies the suggestion. Max length
            1000.
