---
openapi: 3.0.3
info:
  description: "This API is deprecated as of 2024.03 and will be removed in a future\
    \ release.\nThe data discovery API provides a mid-tier component that supports\
    \ the dimensions of data discovery. Service providers enable the assessment and\
    \ recommendation capabilities for arbitrary resources, using a report metaphor\
    \ for computation and presentation of analytic products."
  version: "2"
  title: Data Discovery
  license:
    name: SAS Institute
    url: https://support.sas.com/techsup/license/index.html
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
tags:
- name: Root
  description: The root of the dataDiscovery API.
- name: Models
  description: Manage models.
- name: Assessment Jobs
  description: Create and manage assessment jobs.
- name: Assessment Reports
  description: Create and manage assessment reports.
- name: Suggestion Jobs
  description: Create and manage suggestion jobs.
- name: Suggestion Reports
  description: Create and manage suggestion reports.
- name: Training Data Jobs
  description: Create and manage data sets used to retrain models.
- name: Model Provisioning Jobs
  description: Provision models for execution.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level resources surfaced through
        this API. This collection includes links to enumerate and register models;
        enumerate and create assessment jobs; enumerate assessment reports; enumerate
        and create suggestion jobs; enumerate suggestion reports; enumerate and create
        training data jobs; and enumerate and create model provisioning jobs.
      operationId: root
      parameters:
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - "application/vnd.sas.api+json"
          - "application/json"
          default: "application/vnd.sas.api+json"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                API:
                  $ref: "#/components/examples/rootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                API:
                  $ref: "#/components/examples/rootResponse"
        "404":
          description: The service is not available.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Service Unavailable:
                  $ref: "#/components/examples/404NotAvailable"
    head:
      tags:
      - Root
      summary: Check if the Data Discovery service is available
      description: Returns whether or not the service is running.
      operationId: headersForRoot
      parameters:
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - "application/vnd.sas.api+json"
          - "application/json"
          default: "application/vnd.sas.api+json"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
        "404":
          description: The service is not available.
  /models:
    get:
      tags:
      - Models
      summary: Get a list of models
      description: Returns a list of models.
      operationId: getModels
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the model collection.  Media type
          application/vnd.sas.collection+json;version=2 is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/json
      - name: Accept-Item
        in: header
        description: Requested representation of the model items in the collection.  Media
          type application/vnd.sas.data.discovery.model+json is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.model+json
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: start
        in: query
        description: 0-based Offset of first model to return.  Defaults to 0.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of models to return.  Defaults to 10.
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: "The criteria for sorting the models. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/dataDiscovery-v2/docs/getting-started/usage-notes#sorting).\
          \ <br>The default sort order is name:ascending. <br>Sorting can use the\
          \ following fields: <ul><li>createdBy</li><li>creationTimeStamp</li><li>description</li><li>filterCriteria</li><li>id</li><li>modelURI</li><li>modifiedBy</li><li>modifiedTimeStamp</li><li>name</li><li>providerName</li><li>remediationURI</li></ul> "
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: "The criteria for filtering the models. See [Filtering in REST\
          \ APIs](https://developer.sas.com/rest-apis/dataDiscovery-v2/docs/getting-started/usage-notes#filtering).\
          \ <br>Filters can use the following fields:  <ul><li>createdBy</li><li>creationTimeStamp</li><li>description</li><li>filterCriteria</li><li>id</li><li>modelURI</li><li>modifiedBy</li><li>modifiedTimeStamp</li><li>name</li><li>providerName</li><li>remediationURI</li></ul> "
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Returns the list of models.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/modelCollection"
              examples:
                Models:
                  $ref: "#/components/examples/modelCollectionResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/modelCollection"
              examples:
                Models:
                  $ref: "#/components/examples/modelCollectionResponse"
        "404":
          description: The service is not available.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Service Unavailable:
                  $ref: "#/components/examples/404NotAvailable"
    post:
      tags:
      - Models
      summary: Create a new model
      description: Creates a new model using the body content of the request. <p>Note
        that the lifecycle attributes (id, createdBy, modifiedBy, creationTimeStamp,
        modifiedTimeStamp) are ignored on input, and will be populated with generated
        values on output.
      operationId: createModel
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the model.  Media type application/vnd.sas.data.discovery.model+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.model+json
          - application/json
      - name: Content-Type
        in: header
        description: representation of the model item in the body.  Media type application/vnd.sas.data.discovery.model+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.model+json
          - application/json
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.data.discovery.model+json:
            schema:
              $ref: "#/components/schemas/model"
            examples:
              Model:
                $ref: "#/components/examples/modelRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/model"
            examples:
              Model:
                $ref: "#/components/examples/modelRequest"
        description: representation of the model item in the body.  Media type application/vnd.sas.data.discovery.model+json
          is the default.
        required: true
      responses:
        "201":
          description: Created. The response contains the model
          headers:
            Location:
              description: The URI of the model
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.discovery.model+json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                Model:
                  $ref: "#/components/examples/modelResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                Model:
                  $ref: "#/components/examples/modelResponse"
        "400":
          description: Invalid input
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Bad Request:
                  $ref: "#/components/examples/400BadRequest"
        "409":
          description: The model could not be created due to a conflict; this is generally
            caused by giving a model the same name as an existing model.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Conflict:
                  $ref: "#/components/examples/409Conflict"
  "/models/{modelId}":
    get:
      tags:
      - Models
      summary: Get a model using the provided modelId
      description: Returns a model with the given modelId if it exists
      operationId: getModel
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the model.  Media type application/vnd.sas.data.discovery.model+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.model+json
          - application/json
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: modelId
        in: path
        description: The model id.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              $ref: "#/components/headers/eTagHeader"
          content:
            application/vnd.sas.data.discovery.model+json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                Model:
                  $ref: "#/components/examples/modelResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                Model:
                  $ref: "#/components/examples/modelResponse"
        "404":
          description: The object was not found.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Not Found:
                  $ref: "#/components/examples/404NotFound"
    head:
      tags:
      - Models
      summary: Check if the model exists
      description: Returns whether or not the model with the specified id exists.
      operationId: headersForModel
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the model.  Media type application/vnd.sas.data.discovery.model+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.model+json
          - application/json
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: modelId
        in: path
        description: The model id.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK. Model exists.
          headers:
            ETag:
              $ref: "#/components/headers/eTagHeader"
        "404":
          description: The object was not found.
    put:
      tags:
      - Models
      summary: Update the model
      description: "Updates the model with the specified Id using the representation\
        \ in the request body. <p>Note that the lifecycle attributes ( createdBy,\
        \ modifiedBy, creationTimeStamp, modifiedTimeStamp) are ignored on input,\
        \ and will be populated with generated values on output. If the model has\
        \ a value for the id property that does not match the Id in the URL, a 400\
        \ response is generated.<p>This operation is a conditional PUT, and must be\
        \ accompanied by an etag header. "
      operationId: updateModel
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the model.  Media type application/vnd.sas.data.discovery.model+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.model+json
          - application/json
      - $ref: "#/components/parameters/ifMatchParam"
      - name: Content-Type
        in: header
        description: representation of the model item in the body.  Media type application/vnd.sas.data.discovery.model+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.model+json
          - application/json
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: modelId
        in: path
        description: The model id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.data.discovery.model+json:
            schema:
              $ref: "#/components/schemas/model"
            examples:
              Model:
                $ref: "#/components/examples/modelRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/model"
            examples:
              Model:
                $ref: "#/components/examples/modelRequest"
        description: "representation of the model item in the body.  Media type application/vnd.sas.data.discovery.model+json\
          \ is the default. "
        required: true
      responses:
        "200":
          description: OK. Model updated.
          content:
            application/vnd.sas.data.discovery.model+json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                Model:
                  $ref: "#/components/examples/modelResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                Model:
                  $ref: "#/components/examples/modelResponse"
          headers:
            ETag:
              $ref: "#/components/headers/eTagHeader"
        "400":
          description: Bad request. Ensure that the id in the body matches the URL,
            and that all required fields are present.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Bad Request:
                  $ref: "#/components/examples/400BadRequest"
        "404":
          description: The object was not found.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Not Found:
                  $ref: "#/components/examples/404NotFound"
        "409":
          description: The model could not be updated due to a conflict; this is generally
            caused by giving a model the same name as an existing model.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Conflict:
                  $ref: "#/components/examples/409Conflict"
        "412":
          description: "Precondition failed: The model has changed since it was last\
            \ fetched."
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Precondition Failed:
                  $ref: "#/components/examples/412PreconditionFailed"
        "428":
          description: Precondition required. Include an If-Match header with the
            request.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Precondition Required:
                  $ref: "#/components/examples/428PreconditionRequired"
    delete:
      tags:
      - Models
      summary: Delete the model with the given Id
      description: Deletes the model if exists, or returns a 404 if the model does
        not exist.
      operationId: deleteModel
      parameters:
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: modelId
        in: path
        description: The model id.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No content; the model has been deleted
  /assessmentJobs:
    get:
      tags:
      - Assessment Jobs
      summary: Get a list of assessment jobs
      description: Returns a list of assessment jobs.
      operationId: getAssessmentJobs
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the assessment job collection.  Media
          type application/vnd.sas.collection+json;version=2 is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/json
      - name: Accept-Item
        in: header
        description: Requested representation of the items in the collection.  Media
          type application/vnd.sas.data.discovery.assessment.job+json is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.assessment.job+json
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: start
        in: query
        description: 0-based Offset of first job to return.  Defaults to 0.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of jobs to return.  Defaults to 10.
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: "The criteria for sorting the jobs. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/dataDiscovery-v2/docs/getting-started/usage-notes#sorting).\
          \ <br>The default sort order is name:ascending. <br>Sorting can use the\
          \ following fields: <ul><li>createdBy</li><li>creationTimeStamp</li><li>description</li><li>endTimeStamp</li><li>expirationTimeStamp</li><li>expiresAfter</li><li>heartbeatInterval</li><li>id</li><li>modifiedBy</li><li>modifiedTimeStamp<li>resourceURI</li><li>state</li></ul>"
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: "The criteria for filtering the jobs. See [Filtering in REST\
          \ APIs](https://developer.sas.com/rest-apis/dataDiscovery-v2/docs/getting-started/usage-notes#filtering).\
          \ <br>Filters can use the following fields:  <ul><li>createdBy</li><li>creationTimeStamp</li><li>description</li><li>endTimeStamp</li><li>expirationTimeStamp</li><li>expiresAfter</li><li>heartbeatInterval</li><li>id</li><li>modifiedBy</li><li>modifiedTimeStamp</li><li>resourceURI</li><li>state</li></ul>"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Returns the list of jobs.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/assessmentJobCollection"
              examples:
                Assessment Job Collection:
                  $ref: "#/components/examples/assessmentJobCollectionResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/assessmentJobCollection"
              examples:
                Assessment Job Collection:
                  $ref: "#/components/examples/assessmentJobCollectionResponse"
        "404":
          description: The service is not available.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Service Unavailable:
                  $ref: "#/components/examples/404NotAvailable"
        "502":
          description: A service dependency is not available. In practice, this is
            an indication that the Job Execution Service is not available.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Bad Gateway:
                  $ref: "#/components/examples/502BadGateway"
    post:
      tags:
      - Assessment Jobs
      summary: Create a new assessment job
      description: Creates a new assessment job using the body content of the request.
        <p>Note that the lifecycle attributes (id, createdBy, modifiedBy, creationTimeStamp,
        modifiedTimeStamp) are ignored on input, and will be populated with generated
        values on output.
      operationId: createAssessmentJob
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the assessment job.  Media type application/vnd.sas.data.discovery.assessment.job+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.assessment.job+json
          - application/json
      - name: Content-Type
        in: header
        description: representation of the job in the body.  Media type application/vnd.sas.data.discovery.assessment.job+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.assessment.job+json
          - application/json
      - name: sessionId
        in: query
        description: Specifies the session identifier. If provided, the session ID
          is forwarded to the provider to use in its processing.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.data.discovery.assessment.job+json:
            schema:
              $ref: "#/components/schemas/assessmentJob"
            examples:
              Assessment Job Request:
                $ref: "#/components/examples/assessmentJobRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/assessmentJob"
            examples:
              Assessment Job Request:
                $ref: "#/components/examples/assessmentJobRequest"
        description: representation of the job in the body.  Media type application/vnd.sas.data.discovery.assessment.job+json
          is the default.
        required: true
      responses:
        "201":
          description: Created. The response contains the job, which can be used to
            check on the report.
          headers:
            Location:
              description: The URI of the job
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.discovery.assessment.job+json:
              schema:
                $ref: "#/components/schemas/assessmentJob"
              examples:
                Assessment Job Response:
                  $ref: "#/components/examples/assessmentJobResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/assessmentJob"
              examples:
                Assessment Job Response:
                  $ref: "#/components/examples/assessmentJobResponse"
        "202":
          description: Accepted. The response contains the job, which can be used
            to check on the report.
          headers:
            Location:
              description: The URI of the job
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.discovery.assessment.job+json:
              schema:
                $ref: "#/components/schemas/assessmentJob"
              examples:
                Assessment Job Response:
                  $ref: "#/components/examples/assessmentJobResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/assessmentJob"
              examples:
                Assessment Job Response:
                  $ref: "#/components/examples/assessmentJobResponse"
        "400":
          description: Invalid input
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Bad Request:
                  $ref: "#/components/examples/400BadRequest"
        "502":
          description: A service dependency is not available. In practice, this is
            an indication that the Job Execution Service is not available.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Bad Gateway:
                  $ref: "#/components/examples/502BadGateway"
