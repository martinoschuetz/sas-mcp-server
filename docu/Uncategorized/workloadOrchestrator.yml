  responses:
    badRequestSetConfigurationResponse:
      description: |-
        The grid configuration or tenant configuration was not acceptable
        because some part of it had an error. The message and possibly the details
        contain the error that must be corrected. The error might include the following problems:
         * Invalid request content (for example, expecting JSON and getting HTML)
         * Required field values are missing
         * Numeric field values are out of range
         * Invalid field values for enumerations
         * Invalid field value combinations
         * Invalid HMAC values
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: "The number of seconds that a finished job remains in the cache\
              \ was not within the permitted range."
    badRequestJobsDeleteResponse:
      description: |-
        The job deletion request contained a problem. It can be one of the following problems:
         * Missing job ID array.
         * Invalid job ID array.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: "The jobIds array in the jobs-delete request is not specified."
    badRequestJobSubmitResponse:
      description: |-
        The job submission contained a problem. The following list is of potential problems:
         * Invalid version or missing version
         * Invalid job type
         * Missing job command or missing Kubernetes definition for a job, pod, or podTemplate
         * Invalid startAfter time
         * Invalid consumed or required resource
         * Invalid limit
         * Invalid queue
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: "The job JSON content has an unknown job type. It must be 'COMMAND'\
              \ or 'KUBERNETESJOB'."
    badRequestJobStatesResponse:
      description: |-
        The jobs-state request contained a problem. It can be one of the following problems:
         * Missing job ID array.
         * Invalid job ID array.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: "The jobIds array in the jobs-state request is not specified."
    badRequestUpdateLoggersResponse:
      description: |-
        The update loggers request contained a problem. It can be one of the following problems:
         * Invalid JSON
         * Invalid logger array.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: "The logger name was not specified or has no length."
    badHostStateResponse:
      description: |-
        The host-state value is missing or is not valid.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: "The host state was not defined in the URL. The URL must contain\
              \ 'value=<state>' where <state> is 'open' or 'closed'."
    badJobStateResponse:
      description: |-
        The job-state value is missing or is not valid.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: "The job state is not defined in the URL. The URL must contain\
              \ 'value=<state>' where <state> is 'suspended', 'resumed', or 'canceled'."
    badQueueStateResponse:
      description: |-
        The queue-state value is missing or is not valid.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: "The queue state is not defined in the URL. The URL must contain\
              \ 'value=<state>' where <state> is 'open-active', 'open-inactive', 'closed-active',\
              \ or 'closed-inactive'."
    eTagDoesNotMatchResponse:
      description: The ETag value does not match the current configuration's ETag
        value.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 412
            message: "The request's 'ETag' value from the If-Match header does not\
              \ match the 'ETag' value of the current configuration."
    forbiddenJobResponse:
      description: |-
        The request was rejected because the user does not have access to the job.
        The user must be one of the following people:
         * the person who submitted the job
         * a grid administrator
         * a tenant administrator
         * a queue administrator for the queue to which the job was submitted
         * a user-group administrator where the user-group membership allowed the user to submit the job to the queue.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 403
            message: "The job ID is not owned by the specified user."
    forbiddenJobRequestResponse:
      description: |-
        The job submission was not accepted because the user was forbidden. It can be one of the following problems:
         * Queue is closed.
         * Queue cannot be used by the submitting user.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 403
            message: "The user is not allowed to use the queue specified in the job."
    forbiddenNotGridAdminResponse:
      description: The request was rejected because the user is not a grid administrator.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 403
            message: "Authorization failure. The specified user is not an administrator."
    forbiddenNotAdminResponse:
      description: The request was rejected because the user is not a grid administrator
        or a tenant administrator.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 403
            message: "Authorization failure. The specified user is not an administrator."
    forbiddenNotQueueAdminResponse:
      description: >-
        The request was rejected because the user is not a grid administrator, a tenant
        administrator,
        or the administrator of the queue.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 403
            message: "The specified user is not a queue administrator for the specified\
              \ queue."
    forbiddenNotBackupUserResponse:
      description: >-
        The request was rejected because the user is not a valid backup service user.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 403
            message: "The specified user is not a valid backup service user."
    forbiddenQueueResponse:
      description: |-
        The request was rejected because the user does not have access to the queue.
        The user must have access the queue by being one of the following people:
         * a grid administrator
         * a tenant administrator for the same tenant as the queue
         * a tenant-queue administrator for the queue in the tenant to which the administrator belongs
         * a user allowed to use the queue as defined in the queue's `user` field.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 403
    forbiddenQueueStateResponse:
      description: |-
        The request was rejected because the user does not have authority to administer the queue.
        The user must have authority to administer the queue by being one of the following people:
         * a grid administrator
         * a tenant administrator for the same tenant as the queue
         * a tenant-queue administrator for the queue in the tenant to which the administrator belongs
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 403
    forbiddenTenantResponse:
      description: >-
        The request was rejected because the user is in a tenant
        and the request can only be made from the control plane.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 403
            message: "Authorization failure. The specified user is not a member of\
              \ the control plane."
    hostNotFoundResponse:
      description: The requested host was not found. See the returned error response
        for more information and acceptable response types.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 404
    jobNotFoundResponse:
      description: The requested job was not found. See the returned error response
        for more information and acceptable response types.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 404
    queueNotFoundResponse:
      description: The requested queue was not found. See the returned error response
        for more information and acceptable response types.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 404
    noIfMatchResponse:
      description: The request did not contain an If-Match header.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 428
            message: "The request did not include an If-Match header that contains\
              \ the configuration's 'ETag' value."
    notAcceptableResponse:
      description: The requested response type is not acceptable. See the returned
        error response for more information and acceptable response types.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 406
