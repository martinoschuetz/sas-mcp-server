---
openapi: 3.0.3
info:
  title: SAS Workload Orchestrator
  version: "7"
  description: |-
    The SAS Workload Orchestrator API enables clients to interact with
    SAS Workload Orchestrator to process jobs and manage policies
    that dictate how those jobs are processed.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/workloadOrchestrator
  description: Kubernetes mock server
tags:
- name: Root
  description: Contains the operations for the root resource of the SAS Workload Orchestrator
    API.
- name: Grid
  description: Contains the operations to work with grid configuration and information.
- name: Manager
  description: Contains the operations to get grid manager information.
- name: Hosts
  description: Contains the operations to monitor and manage hosts.
- name: Queues
  description: Contains the operations to monitor and manage queues.
- name: Jobs
  description: Contains the operations to create, monitor, and manage jobs.
- name: Utilities
  description: Contains utility operations to work with logs and logger levels.
paths:
  /:
    get:
      summary: Get API resource links
      description: Returns a list of links to the top-level resources in this API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/apiInfoResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/apiInfoResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /grid#getGridInformation:
    get:
      summary: Get the grid information
      description: Returns information about the grid including the build date, cluster
        version, and license validity.
      operationId: getGridInfo
      tags:
      - Grid
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.grid.info+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/gridInfo"
              examples:
                gridInfo:
                  $ref: "#/components/examples/gridInfo"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /grid#getGridConfiguration:
    get:
      summary: Get the grid configuration
      description: Returns the grid configuration.
      operationId: getGridConfig
      tags:
      - Grid
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
              example: W/"1655120228210222000"
          content:
            application/vnd.sas.sasgrid.grid.config+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/gridConfig"
              examples:
                gridConfig:
                  $ref: "#/components/examples/gridConfig"
            application/json:
              schema:
                $ref: "#/components/schemas/gridConfig"
              examples:
                gridInfo:
                  $ref: "#/components/examples/gridConfig"
        "403":
          $ref: "#/components/responses/forbiddenNotGridAdminResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /grid#getGridConfigurationForTransfer:
    get:
      summary: Get the grid configuration for transfer
      description: Returns the grid configuration so that it can be used by the transfer
        service.
      operationId: getGridConfigForExport
      tags:
      - Grid
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
              example: W/"1655120228210222000"
          content:
            application/vnd.sas.transfer.object+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/transferObject"
              examples:
                gridConfig:
                  $ref: "#/components/examples/gridConfigTransferObject"
        "403":
          $ref: "#/components/responses/forbiddenNotGridAdminResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /grid#getTenantInformation:
    get:
      summary: Get the tenant information
      description: Returns an array of tenant names.
      operationId: getTenantInfo
      tags:
      - Grid
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.grid.tenant.info+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/tenantInfo"
              examples:
                tenantInfo:
                  $ref: "#/components/examples/tenantInfo"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /grid#getTenantConfiguration:
    get:
      summary: Get the tenant configuration
      description: Returns the tenant configuration for the administrator's tenant.
      operationId: getTenantConfig
      tags:
      - Grid
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
              example: W/"1655120228210222000"
          content:
            application/vnd.sas.sasgrid.grid.tenant.config+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/tenantConfig"
              examples:
                tenantConfig:
                  $ref: "#/components/examples/tenantConfig"
        "403":
          $ref: "#/components/responses/forbiddenNotAdminResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /grid#setGridConfiguration:
    put:
      summary: Update the grid configuration
      description: Updates the grid configuration to the newly specified configuration.
      operationId: updateGridConfig
      tags:
      - Grid
      parameters:
      - name: If-Match
        in: header
        required: true
        description: The value of the 'ETag' header that was returned from a GET or
          previous PUT of the configuration.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/vnd.sas.sasgrid.grid.config+json;version=1;charset=utf-8:
            schema:
              $ref: "#/components/schemas/gridConfig"
            examples:
              gridConfig:
                $ref: "#/components/examples/gridConfig"
          application/json:
            schema:
              $ref: "#/components/schemas/gridConfig"
            examples:
              gridConfig:
                $ref: "#/components/examples/gridConfig"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
              example: W/"1655120228210222000"
          content:
            application/vnd.sas.sasgrid.grid.config+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/gridConfig"
              examples:
                gridConfig:
                  $ref: "#/components/examples/gridConfig"
            application/vnd.sas.sasgrid.grid.config.msgs+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/gridConfigMsgs"
              examples:
                gridConfigMsgs:
                  $ref: "#/components/examples/gridConfigMsgs"
            application/json:
              schema:
                $ref: "#/components/schemas/gridConfig"
              examples:
                gridInfo:
                  $ref: "#/components/examples/gridConfig"
        "400":
          $ref: "#/components/responses/badRequestSetConfigurationResponse"
        "403":
          $ref: "#/components/responses/forbiddenNotGridAdminResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
        "412":
          $ref: "#/components/responses/eTagDoesNotMatchResponse"
        "428":
          $ref: "#/components/responses/noIfMatchResponse"
  /grid#setGridConfigurationFromTransfer:
    put:
      summary: Set the grid configuration from a transfer
      description: Sets the grid configuration from a transfer object that is used
        by the transfer service.
      operationId: updateGridConfigFromTransfer
      tags:
      - Grid
      requestBody:
        required: true
        content:
          application/vnd.sas.transfer.object+json;version=1;charset=utf-8:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              gridConfig:
                $ref: "#/components/examples/gridConfigTransferObject"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
              example: W/"1655120228210222000"
          content:
            application/vnd.sas.sasgrid.grid.config+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/gridConfig"
              examples:
                gridConfig:
                  $ref: "#/components/examples/gridConfig"
            application/vnd.sas.sasgrid.grid.config.msgs+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/gridConfigMsgs"
              examples:
                gridConfigMsgs:
                  $ref: "#/components/examples/gridConfigMsgs"
            application/json:
              schema:
                $ref: "#/components/schemas/gridConfig"
              examples:
                gridConfig:
                  $ref: "#/components/examples/gridConfig"
        "400":
          $ref: "#/components/responses/badRequestSetConfigurationResponse"
        "403":
          $ref: "#/components/responses/forbiddenNotGridAdminResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /grid#setTenantConfiguration:
    put:
      summary: Update the tenant configuration
      description: Updates the tenant configuration for the administrator's tenant.
        This is necessary in a multi-tenant environment because the user names and
        groups are only available for an administrator belonging to the same tenant.
      operationId: updateTenantConfig
      tags:
      - Grid
      requestBody:
        required: true
        content:
          application/vnd.sas.sasgrid.grid.tenant.config+json;version=1;charset=utf-8:
            schema:
              $ref: '#/components/schemas/tenantConfig'
            examples:
              tenantConfig:
                $ref: "#/components/examples/tenantConfig"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
              example: W/"1655120228210222000"
          content:
            application/vnd.sas.sasgrid.grid.tenant.config+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/tenantConfig"
              examples:
                tenantConfig:
                  $ref: "#/components/examples/tenantConfig"
            application/vnd.sas.sasgrid.grid.tenant.config.msgs+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/gridConfigMsgs"
              examples:
                tenantConfigMsgs:
                  $ref: "#/components/examples/gridConfigMsgs"
            application/json:
              schema:
                $ref: "#/components/schemas/tenantConfig"
              examples:
                tenantConfig:
                  $ref: "#/components/examples/tenantConfig"
        "400":
          $ref: "#/components/responses/badRequestSetConfigurationResponse"
        "403":
          $ref: "#/components/responses/forbiddenNotAdminResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
        "412":
          $ref: "#/components/responses/eTagDoesNotMatchResponse"
        "428":
          $ref: "#/components/responses/noIfMatchResponse"
  /manager:
    get:
      summary: Get the manager information
      description: Returns information about the manager that includes the current
        manager host name and the counts of hosts in various states. This is only
        available to users in the control plane.
      operationId: getManagerInfo
      tags:
      - Manager
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.manager.info+json;version=2;charset=utf-8:
              schema:
                $ref: "#/components/schemas/managerInfo"
              examples:
                managerInfo:
                  $ref: "#/components/examples/managerInfo"
            application/json:
              schema:
                $ref: "#/components/schemas/managerInfo"
              examples:
                managerInfo:
                  $ref: "#/components/examples/managerInfo"
        "403":
          $ref: "#/components/responses/forbiddenTenantResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /hosts:
    get:
      summary: Get host information for all hosts
      description: Returns the information about all server hosts that are currently
        being managed. This is only available to users in the control plane.
      operationId: getHosts
      tags:
      - Hosts
      parameters:
      - $ref: "#/components/parameters/hostsFilter"
      - $ref: "#/components/parameters/sortBy"
      - $ref: "#/components/parameters/collectionStart"
      - $ref: "#/components/parameters/collectionLimit"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.hosts+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/hosts"
              examples:
                hosts:
                  $ref: "#/components/examples/hosts"
            application/vnd.sas.collection+json;version=2;charset=utf-8:
              schema:
                $ref: "#/components/schemas/hostsCollection"
              examples:
                hostsCollection:
                  $ref: "#/components/examples/hostsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/hostsCollection"
              examples:
                hostsCollection:
                  $ref: "#/components/examples/hostsCollection"
        "403":
          $ref: "#/components/responses/forbiddenTenantResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /hosts/{hostName}:
    get:
      summary: Get host information for a specific host
      description: Returns the information about the specified host. This is only
        available to users in the control plane.
      operationId: getHost
      tags:
      - Hosts
      parameters:
      - $ref: "#/components/parameters/hostName"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.host+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/host"
              examples:
                host:
                  $ref: "#/components/examples/host"
            application/json:
              schema:
                $ref: "#/components/schemas/host"
              examples:
                host:
                  $ref: "#/components/examples/host"
        "403":
          $ref: "#/components/responses/forbiddenTenantResponse"
        "404":
          $ref: "#/components/responses/hostNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    head:
      summary: Determine the existence of a specific host
      description: Returns the headers about the specified host. This is only available
        to users in the control plane.
      operationId: headersForHost
      tags:
      - Hosts
      parameters:
      - $ref: "#/components/parameters/hostName"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/forbiddenTenantResponse"
        "404":
          $ref: "#/components/responses/hostNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /hosts/{hostName}/state:
    put:
      summary: Change the state of a host
      description: Changes the scheduling state of a host. The host might be 'open'
        which allows it to accept new jobs or 'closed' which prevents the host from
        receiving new jobs. The operation is only available to grid administrators.
      operationId: updateHostState
      tags:
      - Hosts
      parameters:
      - $ref: "#/components/parameters/hostName"
      - $ref: "#/components/parameters/hostState"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.host+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/host"
              examples:
                host:
                  $ref: "#/components/examples/host"
            application/json:
              schema:
                $ref: "#/components/schemas/host"
              examples:
                host:
                  $ref: "#/components/examples/host"
        "400":
          $ref: "#/components/responses/badHostStateResponse"
        "403":
          $ref: "#/components/responses/forbiddenNotGridAdminResponse"
        "404":
          $ref: "#/components/responses/hostNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /jobs:
    get:
      summary: Get job information for all jobs
      description: |-
        Returns the information about all jobs that are active in the system that can be optionally filtered by the specified query parameters.
        The job information might be full job information or just the job ID.
      operationId: getJobs
      tags:
      - Jobs
      parameters:
      - $ref: "#/components/parameters/jobsAcceptItem"
      - $ref: "#/components/parameters/jobsFirstJobID"
      - $ref: "#/components/parameters/jobsLastJobID"
      - $ref: "#/components/parameters/jobsFirstEndTime"
      - $ref: "#/components/parameters/jobsLastEndTime"
      - $ref: "#/components/parameters/jobsQueue"
      - $ref: "#/components/parameters/jobsHost"
      - $ref: "#/components/parameters/jobsTenant"
      - $ref: "#/components/parameters/jobsUser"
      - $ref: "#/components/parameters/jobsState"
      - $ref: "#/components/parameters/jobsFilter"
      - $ref: "#/components/parameters/sortBy"
      - $ref: "#/components/parameters/collectionStart"
      - $ref: "#/components/parameters/collectionLimit"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.jobs+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/jobsInfo"
              examples:
                jobs:
                  $ref: "#/components/examples/jobsInfo"
            application/vnd.sas.sasgrid.job.ids+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/jobIds"
              examples:
                jobs:
                  $ref: "#/components/examples/jobIds"
            application/vnd.sas.collection+json;version=2;charset=utf-8:
              schema:
                $ref: "#/components/schemas/jobsCollection"
              examples:
                jobsCollection:
                  $ref: "#/components/examples/jobsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/jobsCollection"
              examples:
                jobsCollection:
                  $ref: "#/components/examples/jobsCollection"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    post:
      summary: Submit a job
      description: Submits a job for processing.
      operationId: createJob
      tags:
      - Jobs
      requestBody:
        required: true
        content:
          application/vnd.sas.sasgrid.job.request+json;version=1;charset=utf-8:
            schema:
              $ref: "#/components/schemas/jobRequest"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/jobRequest"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequest"
      responses:
        "201":
          description: The request succeeded.
          headers:
            Location:
              description: The URI of the newly created job.
              schema:
                type: string
              example: "/jobs/1234"
          content:
            application/vnd.sas.sasgrid.job+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/jobInfo"
              examples:
                job:
                  $ref: "#/components/examples/jobInfo"
            application/json:
              schema:
                $ref: "#/components/schemas/jobInfo"
              examples:
                job:
                  $ref: "#/components/examples/jobInfo"
        "400":
          $ref: "#/components/responses/badRequestJobSubmitResponse"
        "403":
          $ref: "#/components/responses/forbiddenJobRequestResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /jobs/deletions:
    post:
      summary: Delete jobs from job tables in the database
      description: |-
        Deletes jobs specified by the request job ID array from the job tables in the database. 
        If any job specified in the array is not in a finished state with a valid end time,
        it will not be deleted.
      operationId: deleteJobs
      tags:
      - Jobs
      requestBody:
        required: true
        content:
          application/vnd.sas.sasgrid.jobs.ids+json;version=1;charset=utf-8:
            schema:
              $ref: '#/components/schemas/jobIds'
            examples:
              jobsDeletionsRequest:
                $ref: "#/components/examples/jobIds"
          application/json:
            schema:
              $ref: '#/components/schemas/jobIds'
            examples:
              jobsDeletionsRequest:
                $ref: "#/components/examples/jobIds"
      responses:
        "204":
          description: The request succeeded but no content is returned.
        "400":
          $ref: "#/components/responses/badRequestJobsDeleteResponse"
        "403":
          $ref: "#/components/responses/forbiddenNotGridAdminResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /jobs/info:
    get:
      summary: Get job request options
      description: |-
        Requests information about the queues, hosts, and tags available for a job request.
        The returned jobs include only the jobs that the user is allowed to view:
        * Normal users can view only the jobs that they submitted.
        * User-group administrators can view only the jobs that were allowed to use the queue because of the administrator's user group.
        * Queue administrators can view all jobs for the queue that they administer.
        * Grid administrators can view all jobs.
      operationId: getJobRequestInfo
      tags:
      - Jobs
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.job.request.options+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/jobRequestOptions"
              examples:
                jobRequestOptions:
                  $ref: "#/components/examples/jobRequestOptions"
            application/json:
              schema:
                $ref: "#/components/schemas/jobRequestOptions"
              examples:
                jobRequestOptions:
                  $ref: "#/components/examples/jobRequestOptions"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    post:
      summary: Get job execution information
      description: >-
        Requests the list of hosts from which to select a host for use if the job
        request was processed.
        It also returns the information about the queue for the job request.
      operationId: getJobExecutionInfo
      tags:
      - Jobs
      requestBody:
        required: true
        content:
          application/vnd.sas.sasgrid.job.request+json;version=1;charset=utf-8:
            schema:
              $ref: "#/components/schemas/jobRequest"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/jobRequest"
            examples:
              jobRequest:
                $ref: "#/components/examples/jobRequest"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.job.request.info+json;version=1;charset=utf-8:
              schema:
                $ref: '#/components/schemas/jobExecutionInfo'
              examples:
                jobExecutionInfo:
                  $ref: "#/components/examples/jobExecutionInfo"
            application/json:
              schema:
                $ref: '#/components/schemas/jobExecutionInfo'
              examples:
                jobExecutionInfo:
                  $ref: "#/components/examples/jobExecutionInfo"
        "400":
          $ref: "#/components/responses/badRequestJobSubmitResponse"
        "403":
          $ref: "#/components/responses/forbiddenJobRequestResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /jobs/{jobId}:
    get:
      summary: Get job information for a specific job
      description: |-
        Returns the information about a specific job.
        The job is returned only if the user is allowed to view the job:
        * Normal users can view only the jobs that they submitted.
        * User-group administrators can view only the jobs that were allowed to use the queue because of the administrator's user group.
        * Queue administrators can view all jobs for the queue that they administer.
        * Grid administrators can view all jobs.
      operationId: getJob
      tags:
      - Jobs
      parameters:
      - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.job+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/jobInfo"
              examples:
                job:
                  $ref: "#/components/examples/jobInfo"
            application/json:
              schema:
                $ref: "#/components/schemas/jobInfo"
              examples:
                job:
                  $ref: "#/components/examples/jobInfo"
        "403":
          $ref: "#/components/responses/forbiddenJobResponse"
        "404":
          $ref: "#/components/responses/jobNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    head:
      summary: Check for the existence of a specific job
      description: |-
        Returns the headers associated with a specific job.
        The job headers are returned only if the user is allowed to view the job:
        * Normal users can view only the jobs that they submitted.
        * User-group administrators can view only the jobs that were allowed to use the queue because of the administrator's user group.
        * Queue administrators can view all jobs for the queue that they administer.
        * Grid administrators can view all jobs.
      operationId: headersForJob
      tags:
      - Jobs
      parameters:
      - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/forbiddenJobResponse"
        "404":
          $ref: "#/components/responses/jobNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /jobs/{jobId}/state:
    put:
      summary: Change the state of a job
      description: |-
        Changes the state of a job. The valid states are 'suspended', 'resumed', and 'canceled'.
        To change the state of the job, the caller must be one of the following people:
        * the job submitter
        * a grid administrator
        * a queue administrator for the queue in which the job is submitted
        * a user-group administrator for the user group that is used to allow the job to be submitted
      operationId: updateJobState
      tags:
      - Jobs
      parameters:
      - $ref: "#/components/parameters/jobId"
      - $ref: "#/components/parameters/jobState"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.job+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/jobInfo"
              examples:
                jobState:
                  $ref: "#/components/examples/jobInfo"
            application/json:
              schema:
                $ref: "#/components/schemas/jobInfo"
              examples:
                jobState:
                  $ref: "#/components/examples/jobInfo"
        "400":
          $ref: "#/components/responses/badJobStateResponse"
        "403":
          $ref: "#/components/responses/forbiddenJobResponse"
        "404":
          $ref: "#/components/responses/jobNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /jobs/state:
    post:
      summary: Get the state of the specified jobs
      description: Returns the execution state of the specified jobs.
      operationId: getJobsState
      tags:
      - Jobs
      requestBody:
        required: true
        content:
          application/vnd.sas.sasgrid.jobs.state.request+json;version=1;charset=utf-8:
            schema:
              $ref: '#/components/schemas/jobsStateRequest'
            examples:
              jobsStateRequest:
                $ref: "#/components/examples/jobsStateRequest"
          application/json:
            schema:
              $ref: '#/components/schemas/jobsStateRequest'
            examples:
              jobsStateRequest:
                $ref: "#/components/examples/jobsStateRequest"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.jobs.state+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/jobsStateResponse"
              examples:
                jobsState:
                  $ref: "#/components/examples/jobsStateResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/jobsStateResponse"
              examples:
                jobsState:
                  $ref: "#/components/examples/jobsStateResponse"
        "400":
          $ref: "#/components/responses/badRequestJobStatesResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /loggers:
    get:
      summary: Get the available logger information
      description: Returns the name and level for all of the loggers available.
      operationId: getLoggerInfo
      tags:
      - Utilities
      parameters:
      - $ref: "#/components/parameters/loggerHost"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.loggers.response+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/loggersLevelInfo"
              examples:
                loggersResponse:
                  $ref: "#/components/examples/loggersLevelInfo"
            application/json:
              schema:
                $ref: "#/components/schemas/loggersLevelInfo"
              examples:
                loggersResponse:
                  $ref: "#/components/examples/loggersLevelInfo"
        "403":
          $ref: "#/components/responses/forbiddenNotGridAdminResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    put:
      summary: Set the logger information
      description: Updates the logger settings for a specified host.
      operationId: updateLoggerInfo
      tags:
      - Utilities
      requestBody:
        required: true
        content:
          application/vnd.sas.sasgrid.loggers.request+json;version=1;charset=utf-8:
            schema:
              $ref: '#/components/schemas/loggersLevelRequest'
            examples:
              loggersRequest:
                $ref: "#/components/examples/loggersLevelRequest"
          application/json:
            schema:
              $ref: '#/components/schemas/loggersLevelRequest'
            examples:
              loggersRequest:
                $ref: "#/components/examples/loggersLevelRequest"
      responses:
        "204":
          description: The request succeeded but no content is returned.
        "400":
          $ref: "#/components/responses/badRequestUpdateLoggersResponse"
        "403":
          $ref: "#/components/responses/forbiddenNotGridAdminResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /logs:
    get:
      summary: Get log information
      description: Retrieves the latest log output.
      operationId: getLogInfo
      tags:
      - Utilities
      parameters:
      - $ref: "#/components/parameters/logsLogger"
      - $ref: "#/components/parameters/logsLevel"
      - $ref: "#/components/parameters/logsThreshold"
      - $ref: "#/components/parameters/logsStartTime"
      - $ref: "#/components/parameters/logsEndTime"
      - $ref: "#/components/parameters/logsHost"
      - $ref: "#/components/parameters/collectionStart"
      - $ref: "#/components/parameters/collectionLimit"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.logs+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/logsInfo"
              examples:
                logs:
                  $ref: "#/components/examples/logsInfo"
            application/vnd.sas.collection+json;version=2;charset=utf-8:
              schema:
                $ref: "#/components/schemas/logsCollection"
              examples:
                logs:
                  $ref: "#/components/examples/logsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/logsCollection"
              examples:
                logs:
                  $ref: "#/components/examples/logsCollection"
        "403":
          $ref: "#/components/responses/forbiddenNotGridAdminResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /queues:
    get:
      summary: Get queue information for all queues
      description: >-
        Returns the information about all queues that are defined in the system.
        Grid administrators can get queue information for any queue in the system.
        Users who are not grid administrators can get queue information about queues
        for their tenant only.
      operationId: getQueues
      tags:
      - Queues
      parameters:
      - $ref: "#/components/parameters/queuesFilter"
      - $ref: "#/components/parameters/sortBy"
      - $ref: "#/components/parameters/collectionStart"
      - $ref: "#/components/parameters/collectionLimit"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.queues+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/queues"
              examples:
                queues:
                  $ref: "#/components/examples/queues"
            application/vnd.sas.collection+json;version=2;charset=utf-8:
              schema:
                $ref: "#/components/schemas/queuesCollection"
              examples:
                queuesCollection:
                  $ref: "#/components/examples/queuesCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/queuesCollection"
              examples:
                queuesCollection:
                  $ref: "#/components/examples/queuesCollection"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /queues/{queueName}:
    get:
      summary: Get queue information for a specific queue
      description: |-
        Returns the information about a specific queue. The queue information is returned only if the user is allowed to view the queue:
        * Grid administrators can get queue information for any queue in the system.
        * Users who are not grid administrators can get queue information about queues for their tenant only.
      operationId: getQueue
      tags:
      - Queues
      parameters:
      - $ref: "#/components/parameters/queueName"
      - $ref: "#/components/parameters/queueTenant"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.queue+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/queue"
              examples:
                queue:
                  $ref: "#/components/examples/queue"
            application/json:
              schema:
                $ref: "#/components/schemas/queue"
              examples:
                queue:
                  $ref: "#/components/examples/queue"
        "403":
          $ref: "#/components/responses/forbiddenQueueResponse"
        "404":
          $ref: "#/components/responses/queueNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
    head:
      summary: Determine if a specific queue exists
      description: |-
        Returns the headers associated with a specific queue. The queue headers are returned only if the user is allowed to view the queue:
        * Grid administrators can get queue information for any queue in the system.
        * Users who are not grid administrators can get queue information about queues for their tenant only.
      operationId: headersForQueue
      tags:
      - Queues
      parameters:
      - $ref: "#/components/parameters/queueName"
      - $ref: "#/components/parameters/queueTenant"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/forbiddenQueueResponse"
        "404":
          $ref: "#/components/responses/queueNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /queues/{queueName}/state:
    put:
      summary: Change the state of the queue
      description: |-
        Changes the state of a queue. The valid states are 'open-active', 'open-inactive', 'closed-active', and 'closed-inactive'.
        * Grid administrators can change the state of any queue.
        * Tenant administrators can change the state of any queue belonging to the tenant that they administer.
        * Queue administrators can change the state of the queue that they administer.
      operationId: updateQueueState
      tags:
      - Queues
      parameters:
      - $ref: "#/components/parameters/queueName"
      - $ref: "#/components/parameters/queueState"
      - $ref: "#/components/parameters/queueTenant"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.sasgrid.queue+json;version=1;charset=utf-8:
              schema:
                $ref: "#/components/schemas/queue"
              examples:
                queue:
                  $ref: "#/components/examples/queue"
            application/json:
              schema:
                $ref: "#/components/schemas/queue"
              examples:
                queue:
                  $ref: "#/components/examples/queue"
        "400":
          $ref: "#/components/responses/badQueueStateResponse"
        "403":
          $ref: "#/components/responses/forbiddenNotQueueAdminResponse"
        "404":
          $ref: "#/components/responses/queueNotFoundResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /backup:
    get:
      summary: Retrieves tenant configuration for backup
      description: >-
        Returns the tenant grid configuration which includes the tenant's administrator
        list, queue information, and user group information.
        This call can only be made by valid backup service users.
      operationId: getTenantBackupInfo
      tags:
      - Utilities
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tenantBackup"
              examples:
                tenantBackupResponse:
                  $ref: "#/components/examples/tenantBackup"
        "403":
          $ref: "#/components/responses/forbiddenNotBackupUserResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
  /restore:
    post:
      summary: Restore tenant configuration from backup
      description: >-
        Provides the tenant grid configuration to replace the current tenant's administrator
        list, queue information, and user group information.
        This call can only be made by valid backup service users.
      operationId: restoreTenantInfo
      tags:
      - Utilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tenantBackup'
            examples:
              loggersRequest:
                $ref: "#/components/examples/tenantBackup"
      responses:
        "204":
          description: The request succeeded and no content is returned.
        "403":
          $ref: "#/components/responses/forbiddenNotBackupUserResponse"
        "406":
          $ref: "#/components/responses/notAcceptableResponse"
components:
#--------------------------------------------------------------------
#
#                       PARAMETERS
#
#--------------------------------------------------------------------
  parameters:
    collectionLimit:
      name: limit
      description: The maximum number of items returned in the collection. This is
        available only when the return type is application/vnd.sas.collection.
      in: query
      required: false
      schema:
        type: integer
        default: 10
        maximum: 1000
    collectionStart:
      name: start
      description: The starting-item offset of the items returned in the collection.
        This is available only when the return type is application/vnd.sas.collection.
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    hostName:
      name: hostName
      description: The short host name of the server host.
      in: path
      required: true
      schema:
        type: string
    hostState:
      name: value
      description: The desired state of the host.
      in: query
      required: true
      schema:
        type: string
        enum:
        - "open"
        - "closed"
    hostsFilter:
      name: filter
      description: |-
        The filter to apply when querying a host collection. The following table shows the fields that you
        can use in the filter functions, the sortBy query parameter, and a basic filter.
        For more information about the syntax of the filter query parameter, the sortBy query parameter, or
        basic filtering, see the Usage Notes.
        |  **Field Name**  | **Description** | **Type** |
        |------------------|-----------------|----------|
        |name              | The short name of the host. | string |
        |fqdn              | The fully-qualified domain name of the host. | string |
        |hostType          | The host-type name that the host is assigned. | string |
        |buildDate         | The build date of SAS Workload Orchestrator on the host in YYYY-MM-DDThh:mm:ssZ format. | date-time string |
        |osName            | The name of the operating system on the host. | string |
        |osDesc            | The description of the operating system on the host. | string |
        |cpuVendor         | The CPU vendor. | string |
        |cpuArch           | The CPU architecture. | string |
        |lastUpdateTime    | The last update time in YYYY-MM-DDThh:mm:ssZ format. | date-time string |
        |state             | The state of the host. See the Host Information schema for the list of valid values.| string |
        |hostClosed        | Flag that indicates the host is closed by the grid administrator. | Boolean |
        |hostCordoned      | Flag that indicates the host is cordoned by the Kubernetes administrator. | Boolean |
        |reservedMemory    | The amount of memory that is allocated to other pods on the host. | number |
        |reservedCores     | The amount of cores that is allocated to other pods on the host. | number |
        |jobsRunning       | The number of running jobs on the host. | number |
        |jobsSuspended     | The number of running jobs that are suspended on the host. | number |
      in: query
      required: false
      schema:
        type: string
    jobsAcceptItem:
      name: Accept-Item
      description: Select the desired item representation in a returned SAS collection
        of jobs.
      in: header
      schema:
        type: string
        enum:
        - application/vnd.sas.sasgrid.job+json
        - application/vnd.sas.sasgrid.job.id+json
    jobsFilter:
      name: filter
      description: |-
        The filter to apply when querying a job collection. The following table shows the fields that you
        can use in the filter functions, the sortBy query parameter, and a basic filter.
        For more information about the syntax of the filter query parameter, the sortBy query parameter, or
        basic filtering, see the Usage Notes.
        |  **Field Name**  | **Description** | **Type** |
        |------------------|-----------------|----------|
        |id                  |The ID of the job.| string |
        |name                |The name of the job.| string |
        |queue               |Queue on which the job is executing.| string |
        |priority            |The priority of the queue at the time the job started running.| number |
        |project             |The project to associate with the job.| string |
        |user                |The user that submitted the job.| string |
        |tenant              |The tenant of the user.| string |
        |userGroup           |A user group that the group was associated with when it was submitted.| string |
        |restartable         |A flag that indicates the job is restartable.| Boolean |
        |type                |The job type.| string |
        |cmd                 |The command that executes the job for a COMMAND job type.| string |
        |k8sJobDef           |A Kubernetes PodSpec, PodTemplate, or Job definition in JSON for the pod to be launched.| string |
        |k8sNamespace        |The namespace in which the job must start.| string |
        |k8sSecrets          |The list of environment variables in the k8sJobDef that must be presented as secrets instead of environment variables.| string |
        |state               |The state of the job. See the Job Information schema for the list of valid values.| string |
        |pendingCause        |The reason the job is still pending. See the Job Information schema for the list of valid values.| string |
        |startAfter          |The date-time to wait before releasing the job to scheduling.| date-time string |
        |submitTime          |The time the job was submitted.| date-time string |
        |startTime           |The time the job started running.| date-time string |
        |endTime             |The time the job completed processing.| date-time string |
        |lastCheckTime       |The time the processing information was last checked, updated, or both.| date-time string |
        |exitCode            |The return code from the process. If the code is non-zero, the job is assumed to have failed.| number |
        |launchStatus        |The error code from the launch of the process. If the status is non-zero, the launch failed.| number |
        |executionHost       |The host name of the host on which the job is executing.| string |
        |executionIP         |The IP address of the execution host.| string |
        |executionHostAliases|The aliases of the execution host.| string |
        |k8sObjName          |The Kubernetes pod name that is executing the job.| string |
        |requeueCount        |The number of times that a restartable job has been requeued.| number |
        |totalTimePending    |The total number of seconds that the job spent pending.| number |
        |totalTimeStarting   |The total number of seconds that the job spent starting.| number |
        |totalTimeRunning    |The total number of seconds that the job spent running.| number |
        |totalTimeSuspAdmin  |The total number of seconds that the job spent suspended due to a REST API request.| number |
        |totalTimeSuspThresh |The total number of seconds that the job spent suspended due to exceeding a host suspension threshold.| number |
      in: query
      required: false
      schema:
        type: string
    jobId:
      name: jobId
      description: The ID of the job.
      in: path
      required: true
      schema:
        type: string
    jobState:
      name: value
      description: The desired state of the job.
      in: query
      required: true
      schema:
        type: string
        enum:
        - "suspended"
        - "resumed"
        - "canceled"
    jobsFirstJobID:
      name: firstJobId
      description: The lowest job ID value returned in the collection.
      in: query
      required: false
      schema:
        type: string
    jobsLastJobID:
      name: lastJobId
      description: The highest job ID value returned in the collection.
      in: query
      required: false
      schema:
        type: string
    jobsFirstEndTime:
      name: firstEndTime
      description: The earliest end time of a job returned in the collection.
      in: query
      required: false
      schema:
        type: string
    jobsLastEndTime:
      name: lastEndTime
      description: The latest end time of a job returned in the collection.
      in: query
      required: false
      schema:
        type: string
    jobsQueue:
      name: queue
      description: The name of the queue that the job must have so it can be returned
        in the collection.
      in: query
      required: false
      schema:
        type: string
    jobsHost:
      name: host
      description: The short host name of the execution host that the job must have
        so it can be returned in the collection.
      in: query
      required: false
      schema:
        type: string
    jobsTenant:
      name: tenant
      description: The name of the tenant that the job must have so it can be returned
        in the collection.
      in: query
      required: false
      schema:
        type: string
    jobsUser:
      name: user
      description: The name of the user that the job must have so it can be returned
        in the collection.
      in: query
      required: false
      schema:
        type: string
    jobsState:
      name: state
      description: The job state that the job must have so it can be returned in the
        collection.
      in: query
      required: false
      schema:
        type: string
        enum:
        - PENDING
        - RUNNING
        - SUSPENDED
        - FINISHED
        - ARCHIVED
        - ALL
        - ACTIVE
    loggerHost:
      name: host
      description: The short host name of the host that is used to return the logger
        information.
      in: query
      required: false
      schema:
        type: string
    logsLogger:
      name: logger
      description: The name of the logger that a log line must have so it can be returned
        in the collection.
      in: query
      required: false
      schema:
        type: string
    logsLevel:
      name: level
      description: The logging level that a log line must have so it can be returned
        in the collection.
      in: query
      required: false
      schema:
        type: string
        enum:
        - TRACE
        - DEBUG
        - INFO
        - WARN
        - ERROR
        - FATAL
    logsThreshold:
      name: threshold
      description: The name of the logger that a log line must have (at a minimum)
        to be returned in the collection.
      in: query
      required: false
      schema:
        type: string
        enum:
        - TRACE
        - DEBUG
        - INFO
        - WARN
        - ERROR
        - FATAL
    logsStartTime:
      name: startTime
      description: The earliest time that a log line must be returned in the collection.
      in: query
      required: false
      schema:
        type: string
    logsEndTime:
      name: endTime
      description: The latest time that a log line must be returned in the collection.
      in: query
      required: false
      schema:
        type: string
    logsHost:
      name: host
      description: The short host name of the host from which to query log lines.
      in: query
      required: false
      schema:
        type: string
    queueName:
      name: queueName
      description: The name of the queue.
      in: path
      required: true
      schema:
        type: string
    queueState:
      name: value
      description: The desired state of the queue.
      in: query
      required: true
      schema:
        type: string
        enum:
        - "open-active"
        - "open-inactive"
        - "closed-active"
        - "closed-inactive"
    queueTenant:
      name: tenant
      description: The tenant of the desired queue.
      in: query
      required: false
      schema:
        type: string
    queuesFilter:
      name: filter
      description: |-
        The filter to apply when querying a queue collection. The following table shows the fields that you
        can use in the filter functions, the sortBy query parameter, and a basic filter.
        For more information about the syntax of the filter query parameter, the sortBy query parameter, or
        basic filtering, see the Usage Notes.
        |  **Field Name**  | **Description** | **Type** |
        |------------------|-----------------|----------|
        |name         |The name of the queue.| string |
        |tenant       |The tenant that owns the queue.| string |
        |state        |The state of the queue. See the Queue Information schema for the list of valid values.| string |
        |jobsPending  |The total number of jobs that are pending in the queue.| number |
        |jobsRunning  |The total number of jobs that are running in the queue.| number |
        |jobsSuspended|The total number of jobs that are suspended in the queue.| number |
      in: query
      required: false
      schema:
        type: string
    sortBy:
      name: sortBy
      description: |-
        The sort criteria to apply to the query results.
        See the individual resource's filter query parameter for the
        list of fields that are available for sorting. See the Usage Notes for
        more information about the sortBy syntax.
      in: query
      required: false
      schema:
        type: string
  schemas:
    gridInfo:
      title: Grid Information
      description: Provides information about the current grid processing.
      type: object
      properties:
        buildDate:
          description: The build timestamp of the SGMG executable.
          type: string
          format: date-time
          readOnly: true
          example: "2022-07-25T12:04:14Z"
        currentManager:
          description: The host/pod name of the current grid manager.
          type: string
          readOnly: true
          example: "sas-workload-orchestrator-0"
        gridVersion:
          description: The container version of the sas-workload-orchestrator container.
          type: string
          readOnly: true
          example: "1.7.4-20220725.1658715170338"
        licenseExpires:
          description: The date on which the current license expires.
          type: string
          format: date
          readOnly: true
          deprecated: true
          example: "2022-10-25"
        userInfo:
          $ref: "#/components/schemas/userInfo"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    gridConfig:
      title: Grid Configuration
      description: Provides the grid-configuration information.
      type: object
      properties:
        name:
          description: The name of the grid configuration.
          type: string
          example: "Grid Config as of 2022-10-13"
        description:
          description: The description of the grid configuration.
          type: string
          example: "Grid Config that adds time-based overrides for the weekend."
        jobChangeCmd:
          description: >-
            Points to a script file that is called when a job is submitted.
            The script file is passed the job request JSON on STDIN and must return
            the modified job request JSON on STDOUT.
            If the return code of the script is non-zero, the job is rejected.
            The path must be mounted in the sas-workload-orchestrator statefulset.
          type: string
          example: "/scripts/jobChangeCmd.sh"
        port:
          description: The port on which the SGMG executable listens. This cannot
            be changed.
          type: integer
          format: int32
          readOnly: true
        userNamesNoCase:
          description: When set, a flag that indicates user-name comparisons are case
            insensitive.
          type: boolean
        hostInactiveSecs:
          description: The number of seconds that the manager waits to hear from a
            host before it is considered inactive.
          type: integer
          example: 60
          minimum: 60
          maximum: 3600
          default: 60
        hostUnknownSecs:
          description: The number of seconds that a host remains in the INACTIVE state
            before it is purged from the grid.
          type: integer
          example: 900
          minimum: 300
          maximum: 21600
          default: 900
        hostUpdateSecs:
          description: The number of seconds that a daemon waits between sending host
            updates to the manager.
          type: integer
          example: 15
          minimum: 5
          maximum: 300
          default: 15
        jobPurgeSecs:
          description: The number of seconds that a completed job remains in memory
            before it is purged from the manager.
          type: integer
          example: 3600
          minimum: 15
          maximum: 604800
          default: 3600
        jobUpdateSecs:
          description: >-
            The number of seconds that a daemon waits between updating the manager
            with job status information.
            Job state change events can cause the daemon to update the state sooner.
          type: integer
          example: 15
          minimum: 5
          maximum: 300
          default: 15
        jobLifetimeCount:
          description: >-
            The maximum number of completed job records allowed to remain in the database
            tables.
            When the number of completed job records exceeds this value, the oldest
            records are deleted.
            This field is new in version 3 of the grid configuration.
          type: integer
          example: 60000
          minimum: 1000
          maximum: 1000000
          default: 100000
        jobLifetimeDays:
          description: >-
            The number of days a completed job will remain in the database tables
            before being  automatically deleted from the tables.
            This field is new in version 3 of the grid configuration.
          type: integer
          example: 90
          minimum: 7
          maximum: 100000
          default: 60
        managerUpdateSecs:
          description: >-
            The maximum number of seconds that a manager waits between updates of
            the manager state.
            Other events (job updates, host updates) can cause the manager to update
            the state sooner.
          type: integer
          example: 15
          minimum: 5
          maximum: 300
          default: 15
        roundRobinSecs:
          description: The number of seconds that a host must not be used if the host
            was just scheduled a job. Zero means disabled.
          type: integer
          example: 1
          minimum: 0
          maximum: 300
          default: 0
        schedulerUpdateSecs:
          description: >-
            The maximum number of seconds that a manager waits between trying to schedule
            pending jobs.
            Job events (job completion, job submission) can cause the manager to run
            the scheduler sooner.
          type: integer
          example: 15
          minimum: 5
          maximum: 300
          default: 15
        scalingRequestSecs:
          description: The number of seconds that the host manager delays between
            receiving a scaling request from the scheduler and creating a scaling
            pod. Used only when scaled hosts exist and waiting might result in another
            job completing, which frees up an opportunity for a job to run. Ignored
            when scaled hosts do not exist because there is never an opportunity for
            a job to run when hosts do not exist.
          type: integer
          example: 60
          minimum: 0
          maximum: 3600
          default: 0
        scalingHostWaitSecs:
          description: The number of seconds that the host manager waits between the
            creation of a scaling pod and a response from the new host before cancelling
            the scaling request.
          type: integer
          example: 60
          minimum: 60
          maximum: 3600
          default: 600
        scalingHostUpSecs:
          description: The number of seconds that the host manager waits after a new
            scaling host responds before honoring a new scaling request for the same
            host type.
          type: integer
          example: 300
          minimum: 0
          maximum: 3600
          default: 300
        maxStdOutLines:
          description: The number of lines to keep at the end of the STDOUT/STDERR
            of the job. If set to 0, all lines are kept.
          type: integer
          example: 50
          minimum: 0
          maximum: 10000
          default: 50
        userResources:
          description: An array of user-defined resources.
          type: array
          items:
            $ref: "#/components/schemas/userDefinedResource"
        compareOrder:
          description: |-
            An array of predefined metrics that determines the compare order for host selection.
            The order in which the metric is listed is the order that the metric is considered in the compare.
            The metric can be any resource name, but generally is a predefined dynamic-resource name or 
            any user-defined host-dynamic resource name. The predefined resource names are:
            |  **Field Name**  |        **Description**               | **Type** |
            |------------------|--------------------------------------|----------|
            |cpuRating         | The CPU rating of the host.          | static   |
            |cores             | The number of cores on the host.     | static   |
            |memory            | The total memory on the host.        | static   |
            |swap              | The total swap space on the host.    | static   |
            |temp              | The total temp space on the host.    | static   |
            |utilization       | The total utilization on the host.   | dynamic  |
            |runQueue15s       | The 15-second run queue on the host. | dynamic  |
            |runQueue1m        | The 1-minute run queue on the host.  | dynamic  |
            |runQueue15m       | The 15-minute run queue on the host. | dynamic  |
            |diskIORate        | The disk IO rate on the host.        | dynamic  |
            |netIORate         | The network IO rate on the host.     | dynamic  |
            |ioRate            | The total IO rate on the host.       | dynamic  |
            |pgRate            | The page rate on the host.           | dynamic  |
            |usedMemory        | The used memory on the host.         | dynamic  |
            |usedSwap          | The used swap space on the host.     | dynamic  |
            |usedTemp          | The used temp space on the host.     | dynamic  |
          type: array
          items:
            type: string
          example: ["runQueue15s", "ioRate"]
        admins:
          description: An array of administrator user names or group names.
          type: array
          items:
            type: string
          example: ["admin1", "admin2"]
        tenantAdmins:
          description: An array of tenant administrators.
          type: array
          items:
            $ref: "#/components/schemas/tenantAdmin"
        hostTypes:
          description: An array of host type configurations.
          type: array
          items:
            $ref: "#/components/schemas/hostType"
        queues:
          description: An array of queue configurations.
          type: array
          items:
            $ref: "#/components/schemas/queueConfig"
        userGroups:
          description: An array of user-group configurations.
          type: array
          items:
            $ref: "#/components/schemas/userGroupConfig"
        hostGroups:
          description: An array of host group configurations.
          type: array
          items:
            $ref: "#/components/schemas/hostGroupConfig"
        version:
          description: Specifies the version number of this representation schema.
            This is version 3.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 3
    gridConfigMsgs:
      title: Grid Configuration Messages
      description: Provides the grid configuration information.
      type: object
      properties:
        msgs:
          description: An array of message strings localized to caller's locale.
          type: array
          items:
            type: string
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    host:
      title: Host Information
      description: Provides information about a host in the grid.
      type: object
      properties:
        name:
          description: The short name of the host.
          type: string
          maxLength: 250
        fqdn:
          description: The fully-qualified domain name of the host.
          type: string
          maxLength: 253
        aliases:
          description: Aliases by which this host is known.
          type: array
          items:
            type: string
        ipAddresses:
          description: IP addresses that are associated with this host.
          type: array
          items:
            type: string
            maxLength: 250
        configInfo:
          $ref: "#/components/schemas/hostConfigInfo"
        staticInfo:
          $ref: "#/components/schemas/hostStaticInfo"
        dynamicInfo:
          $ref: "#/components/schemas/hostDynamicInfo"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    hosts:
      title: Hosts Information
      description: Provides information about all hosts in the grid.
      type: object
      properties:
        hosts:
          description: An array of host information objects.
          type: array
          items:
            $ref: "#/components/schemas/host"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    hostsCollection:
      title: Host Collection
      description: Provides an array of host information objects that satisfies the
        host collection request.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            description: An array of host information objects.
            type: array
            items:
              $ref: "#/components/schemas/host"
    hostConfigInfo:
      title: Host Current Configuration Information
      description: >-
        Information about the host's current configuration as defined in the configuration
        file.
        If time-based configurations exist, these values might change as the host's
        configuration changes.
      type: object
      allOf:
      - $ref: "#/components/schemas/hostTypeTimeBasedParameters"
      - type: object
        properties:
          hostType:
            description: The name of host type with which this host is associated.
            type: string
            maxLength: 250
            example: "Night Servers"
    hostDynamicInfo:
      title: Host Dynamic Resource Information
      description: Information about the host that does change over time.
      type: object
      properties:
        lastUpdateTime:
          description: The last time the host was updated.
          type: string
          format: date-time
          example: "2022-07-28T19:57:51Z"
        state:
          description: |-
            The state of the host. The following states are available:
            | **State Name**   | **Description** |
            |------------------|-----------------|
            |OPEN-INACTIVE     | The host is open. It has not contacted the manager in the required amount of time. |
            |OPEN-ADDED        | The host is open. It has been added because it is a manager candidate, but the host has not contacted the manager. |
            |OPEN-OK           | The host is open. It is functioning correctly and can accept jobs. |
            |OPEN-OVERLOADED   | The host is open. It is above its scheduling threshold and cannot accept jobs. |
            |OPEN-FULL         | The host is open. The maximum number of jobs are running on the host. |
            |OPEN-UNKNOWN      | The host is open. The status of the host is unknown. |
            |CLOSED-INACTIVE   | The host is closed. It has not contacted the manager in the required amount of time. |
            |CLOSED-ADDED      | The host is closed. It has been added because it is a manager candidate, but the host has not contacted the manager. |
            |CLOSED-OK         | The host is closed. It is functioning correctly and could accept jobs if it were not closed. |
            |CLOSED-OVERLOADED | The host is closed. It is above its scheduling threshold and cannot accept jobs. |
            |CLOSED-FULL       | The host is closed. The maximum number of jobs are running on the host. |
            |CLOSED-UNKNOWN    | The host is closed. The status of the host is unknown. |
          type: string
          maxLength: 40
          example: "OPEN-OK"
        hostClosed:
          description: A flag that indicates whether the host is closed to scheduling.
          type: boolean
        hostCordoned:
          description: A flag that indicates whether the host is cordoned by the Kubernetes
            administrator.
          type: boolean
        licenseValid:
          description: A flag that indicates whether the license is valid.
          type: boolean
          deprecated: true
        licenseType:
          description: The type of license under which the grid is running.
          type: string
          maxLength: 40
          example: "KUBERNETES"
          deprecated: true
        licenseExpireDate:
          description: The date that the license expires.
          type: string
          format: date
          example: "2022-10-25"
          deprecated: true
        utilization:
          description: CPU utilization (0.0 - 1.0)
          type: number
          format: double
          example: 0.052387
        runQueue15s:
          description: The number of threads on the run queue averaged over 15 seconds.
          type: number
          format: double
          example: 0.466667
        runQueue1m:
          description: The number of threads on the run queue averaged over 1 minute.
          type: number
          format: double
          example: 1.866667
        runQueue15m:
          description: The number of threads on the run queue averaged over 15 minutes.
          type: number
          format: double
          example: 1.084444
        diskIORate:
          description: The rate of disk IO (MB/s)
          type: number
          format: double
          example: 0.000000
        netIORate:
          description: The rate of network IO (MB/s)
          type: number
          format: double
          example: 0.000000
        ioRate:
          description: The rate of all IO (network and disk, MB/s)
          type: number
          format: double
          example: 0.000000
        pgRate:
          description: The rate of paging (MB/s) (Kubernetes does not use swap.)
          type: number
          format: double
          example: 0.000000
        usedMemory:
          description: Memory (in MB) consumed by running processes.
          type: number
          format: double
          example: 31640.488281
        usedSwap:
          description: Swap space (in MB) consumed by running processes. (Kubernetes
            does not use swap.)
          type: number
          format: double
          example: 0.000000
        usedTemp:
          description: Temp space (in MB) consumed by running processes.
          type: number
          format: double
          example: 104150.632813
        reservedMemory:
          description: Amount of memory (in MB) reserved by the OS or Kubernetes.
          type: number
          format: double
          example: 8585.664917
        reservedCores:
          description: Number of cores reserved by the OS or Kubernetes.
          type: number
          format: double
          example: 3.560000
        jobsRunning:
          description: The number of jobs running on the host.
          type: integer
          format: uint64
          example: 0
        jobsSuspended:
          description: The number of jobs in a suspended state on the host.
          type: integer
          format: uint64
          example: 0
    hostGroupConfig:
      title: Host Group Configuration
      description: Provides configuration information about a host group.
      type: object
      properties:
        name:
          description: The name of host group.
          type: string
          example: FastHosts
        members:
          description: An array of host names and host groups that are members of
            this host group.
          type: array
          items:
            type: string
          example: ["host1", "slowHosts"]
    hostStaticInfo:
      title: Host Static Resource Information
      description: Information about the host that does not change over time. It contains
        how much of the static information has been consumed by jobs.
      type: object
      properties:
        buildDate:
          description: The date that daemon code was built.
          type: string
        cpuRating:
          description: The CPU rating relative to other hosts. It is calculated in
            the daemon by running a loop of floating-point operations.
          type: number
          format: double
        cpuRatingAllocated:
          description: CPU rating allocated (always 0.0)
          type: number
          format: double
        cores:
          description: The number of cores on the host.
          type: number
          format: double
        coresAllocated:
          description: The number of cores on the host allocated to jobs.
          type: number
          format: double
        memory:
          description: Total memory (in MB) (1024 * 1024)
          type: number
          format: double
        memoryAllocated:
          description: Total memory (in MB) allocated to jobs.
          type: number
          format: double
        swap:
          description: Total swap space (in MB)
          type: number
          format: double
        swapAllocated:
          description: Total swap space (in MB) allocated to jobs.
          type: number
          format: double
        temp:
          description: Total temp space (in MB)
          type: number
          format: double
        tempAllocated:
          description: Total temp space (in MB) allocated to jobs.
          type: number
          format: double
        osName:
          description: The name of the operating system
          type: string
          maxLength: 250
        osDesc:
          description: The description of the operating system
          type: string
          maxLength: 250
        cpuVendor:
          description: CPU vendor name
          type: string
          maxLength: 250
        cpuArch:
          description: CPU architecture
          type: string
          maxLength: 250
        properties:
          description: Key/value pairs (in the form <key>=<value>) provided by host.
          type: array
          items:
            type: string
          example: ["workload.sas.com/class=compute", "kubernetes.io/os=linux"]
    hostType:
      title: Host Type Configuration
      description: >-
        Provides the configuration of a host type that can be used in queue definitions
        and scheduling processing.
      type: object
      allOf:
      - $ref: "#/components/schemas/hostTypeTimeBasedParameters"
      - type: object
        properties:
          name:
            description: The name of the host type.
            type: string
            maxLength: 250
            example: "Overflow Hosts"
          description:
            description: The description of the host type.
            type: string
            example: "This host type will be used for any overflow work needed."
          role:
            description: >-
              The host role for which this host type is used. One of 'manager' or
              'server'.
              The SAS Viya platform allows defining host types for the 'server' role
              only.
            type: string
            enum:
            - "manager"
            - "server"
          scalable:
            description: A flag that indicates this host type is scalable in Kubernetes.
            type: boolean
          externalURL:
            description: >-
              A URL to redirect REST API calls for the manager.
              This is not used on the SAS Viya platform.
            type: string
            example: "https://my.loadbalancer.mycompany.com:1234"
          hostNames:
            description: An array of host names that are in this host type.
            type: array
            items:
              type: string
            example: ["host1.mycompany.com", "host2.mycompany.com"]
          hostNamePatterns:
            description: >-
              An array of host name patterns to compare against a host name for a
              match. The comparison determines if the host can be in this host type.
              The pattern must be an International Components for Unicode (ICU) regular
              expression to match against any daemon hosts' short host name or its
              aliases.
            type: array
            items:
              type: string
            example: ["host*.mycompany.com", "myhost*.mycompany.com"]
          hostIpPatterns:
            description: >-
              An array of IP address patterns to compare against a host's IP address
              for a match. The comparison determines if the host can be in this host
              type.
              The pattern must be an International Components for Unicode (ICU) regular
              expression to match against the IP addresses specified by the host or
              associated with the connection socket on the manager.
            type: array
            items:
              type: string
            example: ["10.2.34.*", "10.2.35.*"]
          hostIpRanges:
            description: >-
              An array of IP address-range patterns to compare against a host's IP
              address for a match. The comparison determines if the host can be in
              this host type.
              The pattern must be a CIDR-range expression to determine if the connecting
              host is in the specified subnet or matches the specified address.
              Standard IPV4 or IPV6 addresses can be specified or CIDR notation of
              subnets as defined in Wikipedia's Classless Inter-Domain Routing.
            type: array
            items:
              type: string
            example: ["10.2.34.0/16", "10.2.35.0/16"]
          hostProperties:
            description: >-
              An array of key/value strings of the form '<key>=<value>' to compare
              against a host's IP address for a match. The comparison determines if
              the host can be in this host type.
              On the SAS Viya platform the key/value strings come from the node labels.
            type: array
            example: ["gpuEnabled=true"]
          timeBasedOverrides:
            description: An array of time-based parameter overrides along with the
              time the overrides take effect.
            type: array
            items:
              $ref: "#/components/schemas/hostTypeTimeBasedOverride"
          version:
            description: Specifies the version number of this representation schema.
              This is version 2.
            type: integer
            format: int32
            readOnly: true
            minimum: 1
            maximum: 2
    hostTypeTimeBasedOverride:
      title: Host Type Time-Based Overrides Configuration
      description: Provides the parameters in a host type that can be changed by a
        time-based override.
      type: object
      allOf:
      - $ref: "#/components/schemas/hostTypeTimeBasedParameters"
      - type: object
        properties:
          name:
            description: The name of this time-based override.
            type: string
            example: "night-time"
          validIntervals:
            description: The array of time intervals in which the time-based parameters
              are used.
            type: array
            items:
              $ref: "#/components/schemas/timeBasedIntervals"
    hostTypeTimeBasedParameters:
      title: Host Type Time-Based Configuration
      description: Provides the parameters in a host type that can be changed by a
        time-based override.
      type: object
      properties:
        maxJobsAllowed:
          description: |-
            The number of concurrent jobs that this host can run at a time:
            * If the value is greater than 0, that value is used.
            * If the value is less than 0, the absolute value of the number is multiplied by the number of CPU cores on the host.
            * If the value is 0, no jobs are allowed to run on that host.
          type: integer
          format: int32
          example: 5
          default: 250
          minimum: -250
          maximum: 10000
        minScalableNodes:
          description: |-
            The minimum number of scalable nodes that must be running for this host type.
            This field is ignored if the host type is not scalable.
            * If the default configuration is being parsed, and the value is either -1 or not specified, the value will be set to 0.
            * If a configuration other than the default is being parsed, and the value is either -1 or not specified, the default configuration's value is used.
          type: integer
          format: int32
          example: 5
          default: -1
          minimum: -1
          maximum: 100
        tags:
          description: Tags provided for scheduling.
          type: array
          items:
            type: string
        scheduleThresholds:
          description: When entered, the thresholds that prevent scheduling to hosts
            in this host type.
          type: array
          items:
            $ref: "#/components/schemas/hostTypeThreshold"
        suspendThresholds:
          description: When entered, the thresholds that cause jobs on hosts in this
            host type to be suspended.
          type: array
          items:
            $ref: "#/components/schemas/hostTypeThreshold"
        scaleThresholds:
          description: When entered, the thresholds that cause additional nodes associated
            with this scalable host type to be added.
          type: array
          items:
            $ref: "#/components/schemas/hostTypeThreshold"
        thresholdScaleNumNodes:
          description: |-
            The number of scalable nodes that will be added when the scaling threshold is entered for this host type.
            This field is ignored if the host type is not scalable.
            * If the default configuration is being parsed, and the value is either -1 or not specified, the value will be set to 1.
            * If a configuration other than the default is being parsed, and the value is either -1 or not specified, the default configuration's value is used.
          type: integer
          format: int32
          example: 2
          default: 1
          minimum: -1
          maximum: 100
        thresholdScaleWaitSecs:
          description: |-
            The number of seconds to wait before adding additional scalable nodes when the scaling threshold is entered for this host type.
            This field is ignored if the host type is not scalable.
            * If the default configuration is being parsed, and the value is either -1 or not specified, the value will be set to 60.
            * If a configuration other than the default is being parsed, and the value is either -1 or not specified, the default configuration's value is used.
          type: integer
          format: int32
          example: 120
          default: 60
          minimum: -1
          maximum: 3600
    hostTypeThreshold:
      title: Host Type Threshold
      type: object
      description: Provides the start and end values for a metric that indicates a
        host is in a specified threshold.
      properties:
        metric:
          description: |-
            The name of the metric to check for this threshold.
            The metric can be any resource name, but generally is a predefined dynamic-resource name or 
            any user-defined host-dynamic resource name. The predefined resource names are:
            |  **Field Name**  |        **Description**               | **Type** |
            |------------------|--------------------------------------|----------|
            |cpuRating         | The CPU rating of the host.          | static   |
            |cores             | The number of cores on the host.     | static   |
            |memory            | The total memory on the host.        | static   |
            |swap              | The total swap space on the host.    | static   |
            |temp              | The total temp space on the host.    | static   |
            |utilization       | The total utilization on the host.   | dynamic  |
            |runQueue15s       | The 15-second run queue on the host. | dynamic  |
            |runQueue1m        | The 1-minute run queue on the host.  | dynamic  |
            |runQueue15m       | The 15-minute run queue on the host. | dynamic  |
            |diskIORate        | The disk IO rate on the host.        | dynamic  |
            |netIORate         | The network IO rate on the host.     | dynamic  |
            |ioRate            | The total IO rate on the host.       | dynamic  |
            |pgRate            | The page rate on the host.           | dynamic  |
            |usedMemory        | The used memory on the host.         | dynamic  |
            |usedSwap          | The used swap space on the host.     | dynamic  |
            |usedTemp          | The used temp space on the host.     | dynamic  |
          type: string
        startOperator:
          description: The comparison operator that is used to enter the threshold.
          type: string
          enum:
          - "GT"
          - "LT"
          - "EQ"
          - "GE"
          - "LE"
          - ">"
          - "<"
          - "="
          - ">="
          - "<="
        startValue:
          description: The value to use for the comparison to enter the threshold.
          type: number
        endOperator:
          description: The comparison operator that is used to exit the threshold.
          type: string
          enum:
          - "GT"
          - "LT"
          - "EQ"
          - "GE"
          - "LE"
          - ">"
          - "<"
          - "="
          - ">="
          - "<="
        endValue:
          description: The value to use for the comparison to exit the threshold.
          type: number
    jobEnvVar:
      title: Job Environment Variable
      description: Provides information about an environment variable.
      type: object
      properties:
        name:
          description: The name of the environment variable.
          type: string
          example: SAS_LOG_LEVEL
        value:
          description: The value of the environment variable.
          type: string
          example: DEBUG
    jobExecutionInfo:
      title: Job Execution Information
      description: Provides information to request that a job be scheduled.
      type: object
      properties:
        hosts:
          description: A list of hosts (in order of best available) to run the job.
          type: array
          items:
            $ref: "#/components/schemas/host"
        queue:
          $ref: "#/components/schemas/queue"
        version:
          description: The current version of this media type. Currently set to 1.
          type: integer
          minimum: 1
          maximum: 1
    jobHostSchedulingInfo:
      title: Job Host Scheduling Information
      description: Provides information about a host's ability to make a select during
        the scheduling process for a specific job.
      type: object
      properties:
        hostName:
          description: The name of the host.
          type: string
        state:
          description: |-
            The resulting host scheduling state for a job during the last scheduling run. The following states are available:
            | **State Name**                      | **Description** |
            |-------------------------------------|-----------------|
            | HOST-STATE-AVAILABLE                | The host can run the job. |
            | HOST-STATE-FULL                     | The host has reached the maximum number of jobs it is allowed. |
            | HOST-STATE-NOT-AVAILABLE-CLOSED     | The host is closed. |
            | HOST-STATE-NOT-AVAILABLE-OVERLOADED | The host is overloaded according to a scheduling threshold. |
            | HOST-STATE-NOT-AVAILABLE-NO-SLOTS   | The host does not allow jobs to be run on it. |
            | HOST-STATE-NOT-AVAILABLE-INACTIVE   | The host is in the INACTIVE state. |
            | HOST-STATE-NOT-AVAILABLE-UNKNOWN    | The host has changed to the UNKNOWN state. |
            | HOST-STATE-NOT-IN-QUEUE             | The host is not part of the list of hosts for the queue. |
            | HOST-STATE-NOT-ENOUGH-CON-RES       | The host does not have enough of a consumable resource. |
            | HOST-STATE-NOT-ENOUGH-REQ-RES       | The host does not have the required resources. |
            | HOST-STATE-NOT-IN-FINAL-HOST-LIST   | The host is not in the list of hosts required by the job and queue. |
            | HOST-STATE-MISSING-REQUIRED-TAGS    | The host does not have all of the tags required by the job and queue. |
            | HOST-STATE-JOB-QUEUE-FULL-HOST      | The job's queue has exceeded the number of jobs it can send to this host. |
          type: string
          maxLength: 40
          enum:
          - HOST-STATE-AVAILABLE
          - HOST-STATE-FULL
          - HOST-STATE-NOT-AVAILABLE-CLOSED
          - HOST-STATE-NOT-AVAILABLE-OVERLOADED
          - HOST-STATE-NOT-AVAILABLE-NO-SLOTS
          - HOST-STATE-NOT-AVAILABLE-INACTIVE
          - HOST-STATE-NOT-AVAILABLE-UNKNOWN
          - HOST-STATE-NOT-IN-QUEUE
          - HOST-STATE-NOT-ENOUGH-CON-RES
          - HOST-STATE-NOT-ENOUGH-REQ-RES
          - HOST-STATE-NOT-IN-FINAL-HOST-LIST
          - HOST-STATE-MISSING-REQUIRED-TAGS
          - HOST-STATE-JOB-QUEUE-FULL-HOST

    jobInfo:
      title: Job Information
      description: Provides information about a job including its request and processing
        information.
      type: object
      properties:
        id:
          description: The ID of the job.
          type: integer
          readOnly: true
        request:
          $ref: "#/components/schemas/jobRequestInfo"
        processingInfo:
          $ref: "#/components/schemas/jobProcessingInfo"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    jobProcessingInfo:
      title: Job Processing Information
      description: Provides information about a job's processing.
      type: object
      readOnly: true
      properties:
        state:
          description: |-
            The state of the job. The following states are available:
            | **State Name**                | **Description** |
            |-------------------------------|-----------------|
            | UNKNOWN                       | Job state cannot be determined. |
            | PENDING                       | Job is pending in a queue. |
            | PENDING-SUSPENDED-ADMIN       | Job is pending in the queue, but suspended by the administrator. |
            | STARTING                      | Job has been sent to a host to run. |
            | STARTING-SUSPENDED-ADMIN      | Job is at the execution host, but was suspended by the administrator before the host was able to launch the command. |
            | STARTING-SUSPENDED-THRESHOLD  | Job is at the execution host, but was suspended by the host's suspension threshold before the host was able to launch the command. |
            | STARTING-SUSPENDED-PREEMPTION | Job is at the execution host, but was suspended by the scheduler because the job was preempted before the host was able to launch the command. |
            | RUNNING                       | Job is running on the execution host. |
            | RUNNING-SUSPENDED-ADMIN       | Job was running at the execution host, but was suspended by the administrator. |
            | RUNNING-SUSPENDED-THRESHOLD   | Job was running at the execution host, but was suspended by the host's suspension threshold. |
            | RUNNING-SUSPENDED-PREEMPTION  | Job was running at the execution host, but was suspended by the scheduler because the job was preempted. |
            | LAUNCH-ERROR                  | Job failed to launch correctly. |
            | COMPLETED                     | Job ran and completed with a zero return code. |
            | FAILED                        | Job ran and completed with a non-zero return code. |
            | KILLED                        | Job was killed through the REST API. |
            | KILLED-LIMIT                  | Job was killed because it exceeded a limit specified in the job or queue. |
            | HOST-FAILED                   | Job was killed because its execution host failed and the job was not marked as being re-runnable. |
            | REQUEUING                     | Job is in the process of being requeued to be restarted. |
          type: string
          maxLength: 40
          enum:
          - UNKNOWN
          - PENDING
          - PENDING-SUSPENDED-ADMIN
          - STARTING
          - STARTING-SUSPENDED-ADMIN
          - STARTING-SUSPENDED-THRESHOLD
          - STARTING-SUSPENDED-PREEMPTION
          - RUNNING
          - RUNNING-SUSPENDED-ADMIN
          - RUNNING-SUSPENDED-THRESHOLD
          - RUNNING-SUSPENDED-PREEMPTION
          - LAUNCH-ERROR
          - COMPLETED
          - FAILED
          - KILLED
          - KILLED-LIMIT
          - HOST-FAILED
          - REQUEUING
          example: COMPLETED
        pendingCause:
          description: |-
            The reason the job is still pending. The following causes are available:
            | **Cause**                            | **Description** |
            |--------------------------------------|-----------------|
            | PEND-NOT-RUN-THROUGH-SCHEDULER       | The job has not been run through the scheduler. |
            | PEND-NOT-ENOUGH-GLOBAL-CON-RES       | The job has a consumable-resource requirement that cannot be met. |
            | PEND-NOT-ENOUGH-GLOBAL-REQ-RES       | The job has a resource requirement that cannot be met. |
            | PEND-NO-HOSTS                        | There are no hosts available for this job. |
            | PEND-HOSTS-FULL-NO-QUEUES-TO-PREEMPT | The hosts available to this job are all full and there are no queues that can be preempted. |
            | PEND-HOSTS-FULL-NO-JOB-TO-PREEMPT    | The hosts available to this job are all full and there are no jobs that can be preempted. |
            | PEND-QUEUE-FULL-JOBS                 | The queue has reached the limit of jobs per queue. |
            | PEND-QUEUE-FULL-USER                 | The queue has reached the limit of jobs per user for this user. |
            | PEND-QUEUE-INACTIVE                  | The job's queue is inactive. |
            | PEND-CANNOT-MERGE-QUEUE-INFO         | The queue information could not be merged. |
            | PEND-NOT-AFTER-STARTTIME             | The job has a start time which is in the future. |
            | PEND-BACKOFF-DELAY                   | The job is waiting for a backoff delay to expire. |
            | PEND-FAILED-TO-START                 | The job failed to start on the assigned host. |
          type: string
          maxLength: 40
          example: "PEND-NO-HOSTS"
        hostSchedulingInfo:
          description: Scheduling information for all hosts selected as candidates
            to run this job.
          type: array
          items:
            $ref: "#/components/schemas/jobHostSchedulingInfo"
        queue:
          description: Queue on which the job is executing.
          type: string
          maxLength: 250
          example: "normal"
        exchangeCreds:
          description: A flag that is the logical OR of the exchangeCreds flag on
            the job and the exchangeCreds flag on the queue. Valid in SAS v9 Windows
            only.
          type: boolean
          example: false
          deprecated: true
        userGroup:
          description: A user group that the group was associated with when it was
            submitted. Used to determine if the user-group administrator can manage
            this job.
          type: string
          maxLength: 100
          example: "accounting"
        suspendFlags:
          description: Flags that are set to determine the various states of suspension.
            The flag is used internally to determine when a job is suspended and the
            methods of the suspension.
          type: integer
          example: 256
        queuePriority:
          description: The priority of the queue at the time the job started running.
          type: integer
          example: 34
        submitTime:
          description: The time the job was submitted.
          type: string
          format: date-time
          example: "2022-07-28T12:03:14Z"
        startTime:
          description: The time the job started running.
          type: string
          format: date-time
          example: "2022-07-28T12:03:14Z"
        endTime:
          description: The time the job completed processing.
          type: string
          format: date-time
          example: "2022-07-28T12:04:10Z"
        lastCheckTime:
          description: The time the processing information was last checked, updated,
            or both.
          type: string
          format: date-time
          example: "2022-07-28T12:04:14Z"
        launchStatus:
          description: The error code from the launch of the process. If non-zero,
            the launch failed.
          type: integer
          example: 0
        processId:
          description: The process ID of the job process. Valid in SAS v9 only.
          type: integer
          example: 34887
        k8sObjName:
          description: The Kubernetes pod name executing the job.
          type: string
          example: "sas-batch-server-ad54-12347896-23"
        requeueCount:
          description: The number of times a restartable job has been requeued.
          type: integer
          example: 0
        executionHost:
          description: The host name of the host on which the job is executing.
          type: string
          example: "host1.mycompany.com"
        executionIP:
          description: The IP address of the execution host.
          type: string
          maxLength: 100
          example: "10.20.3.45"
        executionHostAliases:
          description: >-
            An array of aliases of the execution host. On the SAS Viya platform this
            usually includes the sas-workload-orchestrator daemon
            pod that is managing the job on the assigned node.
          type: array
          items:
            type: string
          example: ["sas-workload orchestrator-da463"]
        exitCode:
          description: The return code from the process. If the code is non-zero,
            the job is assumed to have failed.
          type: integer
          example: 102
        totalTimePending:
          description: The total number of seconds that the job spent pending.
          type: integer
          format: uint64
          example: 5
        totalTimeStarting:
          description: The total number of seconds that the job spent starting.
          type: integer
          format: uint64
          example: 32
        totalTimeRunning:
          description: The total number of seconds that the job spent running.
          type: integer
          format: uint64
          example: 640
        totalTimeSuspAdmin:
          description: The total number of seconds that the job spent suspended due
            to a REST API request.
          type: integer
          format: uint64
          example: 0
        totalTimeSuspThresh:
          description: The total number of seconds that the job spent suspended due
            to exceeding a host suspension threshold.
          type: integer
          format: uint64
          example: 0
        totalTimeSuspPreempt:
          description: The total number of seconds that the job spent suspended due
            to preemption. Valid in SAS v9 only.
          type: integer
          format: uint64
          example: 0
        hosts:
          description: >-
            The intersected list of host names from the job request and the queue
            that was used to determine where this job was allowed to run.
          type: array
          items:
            type: string
          example: ["host1.mycompany.com", "host2.mycompany.com"]
        requiredTags:
          description: The combined list of tags from the job request and queue that
            was used to determine where this job was allowed to run.
          type: array
          items:
            type: string
          example: ["gpuEnabled", "fastIO"]
        consumedResources:
          description: >-
            The combined array of consumable static-resource values from the job request
            and from the queue
            that was used to determine where this job was allowed to run.
          type: array
          items:
            $ref: "#/components/schemas/jobStaticResourceRequirement"
        requiredResources:
          description: >-
            The combined array of required static-resource values from the job request
            and from the queue
            that was used to determine where this job was allowed to run.
          type: array
          items:
            $ref: "#/components/schemas/jobStaticResourceRequirement"
        limits:
          description: >-
            The combined array of limit values from the job request and from the queue
            that is used to limit the job's processing.
          type: array
          items:
            $ref: "#/components/schemas/jobResourceLimit"
        limitValues:
          description: The actual limit values as reported during processing.
          type: array
          items:
            $ref: "#/components/schemas/jobResourceLimit"
        stdOutput:
          description: The STDOUT lines captured during processing. The number of
            lines is determined by the 'maxStdOutLines' value in the grid configuration.
          type: array
          items:
            type: string
          example: ["This was output by the running process to STDOUT", "So was this"]
    jobRequest:
      title: Job Request
      description: Provides information to request that a job be scheduled.
      type: object
      properties:
        request:
          $ref: "#/components/schemas/jobRequestInfo"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    jobRequestInfo:
      title: Job Request Information
      description: Provides information about a job request.
      type: object
      properties:
        name:
          description: The name of the job.
          type: string
          maxLength: 100
          example: "End of month processing"
        queue:
          description: The name of the queue to which the job is submitted.
          type: string
          maxLength: 250
          example: "priority"
        project:
          description: The project to associate with the job.
          type: string
          maxLength: 100
          example: "Accounting"
        user:
          description: The user that submitted the job.
          type: string
          maxLength: 100
          example: "user132"
        tenant:
          description: The tenant of the user.
          type: string
          maxLength: 100
          example: "acme"
        startAfter:
          description: The date-time to wait before releasing the job to scheduling.
          type: string
          format: date-time
          example: "2022-07-28T12:03:14Z"
        restartable:
          description: A flag that indicates the job is restartable.
          type: boolean
        exchangeCreds:
          description: A flag that indicates the Kerberos credentials must be exchanged.
            Only used on Windows. This is not used on the SAS Viya platform.
          type: boolean
          deprecated: true
        type:
          description: |-
            The job type.
            * COMMAND jobs use the cmd, args, and envVars fields. COMMAND jobs are launched by TKELS on an execution host. If the field is not provided, COMMAND is assumed.
            * KUBERNETESJOB uses the k8sJobDef, k8sNamespace, and k8sSecrets fields. KUBERNETESJOBs are launched as pods in Kubernetes.
          type: string
          maxLength: 40
          enum:
          - COMMAND
          - KUBERNETESJOB
          example: "COMMAND"
        cmd:
          description: The command to execute the job for a COMMAND job type.
          type: string
          example: "/bin/bash"
        args:
          description: The arguments for the command for a COMMAND job type.
          type: array
          items:
            type: string
          example: ["-c", "ls", "-al"]
        envVars:
          description: The environment variables to set for the process.
          type: array
          items:
            $ref: "#/components/schemas/jobEnvVar"
        k8sJobDef:
          description: A Kubernetes PodSpec, PodTemplate, or Job definition in JSON
            for the pod to be launched.
          type: string
        k8sNamespace:
          description: >-
            The namespace in which the job must start. The namespace must be set to
            the current namespace.
            SAS Workload Orchestrator does not support launching pods in a namespace
            other than the current namespace.
          type: string
          example: "my-namespace"
        k8sSecrets:
          description: The list of environment variables in the k8sJobDef that must
            be presented as secrets instead of environment variables.
          type: array
          items:
            type: string
          example: ["MY_SPECIAL_TOKEN"]
        hosts:
          description: |-
            The list of host names on which this job is allowed to run. When a job is submitted, SAS Workload Orchestrator determines the hosts
            on which a job can run by using the following criteria:
            * If both the job and the queue specify hosts, only the hosts that are in both the job's host list and the queue's host list are used. If no hosts are in both lists, the job does not run.
            * If the job request specifies hosts, but the queue does not, the job's host list is used.
            * If the job request does not specify hosts, but the queue does, the queue's host list is used.
            * If neither the job nor the queue specify hosts, all hosts are used.
          type: array
          items:
            type: string
          example: ["host1.mycompany.com", "host2.mycompany.com"]
        requiredTags:
          description: >-
            The list of tags required to be on hosts for this job to run. The union
            of the requiredTags and the queue's requiredTags
            determine the final list of requiredTags.
          type: array
          items:
            type: string
          example: ["gpuEnabled", "fastIO"]
        consumedResources:
          description: >-
            An array of consumable static-resources values that must be available
            on a host before a job is scheduled to that host.
            After the job is scheduled, the resource values are decremented from the
            host's total.
            The maximum value between the job request value and the queue value is
            used to determine if the job can be scheduled.
          type: array
          items:
            $ref: "#/components/schemas/jobStaticResourceRequirement"
        requiredResources:
          description: >-
            An array of consumable static-resources values that must be available
            on a host before a job is scheduled to that host.
            The resource values are not decremented from the host's total.
            The maximum value between the job request value and the queue value is
            used to determine if the job can be scheduled.
          type: array
          items:
            $ref: "#/components/schemas/jobStaticResourceRequirement"
        limits:
          description: >-
            An array of consumable static-resources values that must be available
            on a host before a job is scheduled to that host.
            The resource values are not decremented from the host's total.
            The minimum value between the job request value and the queue value is
            used when the job is run.
          type: array
          items:
            $ref: "#/components/schemas/jobResourceLimit"
        properties:
          description: The list of key/value pairs associated with the job.
          type: array
          items:
            type: string
          example: ["key1=value1", "key2=value2"]
    jobRequestOptions:
      title: Job Options Information
      description: Provides information about the values that can be used in a job
        request.
      type: object
      readOnly: true
      properties:
        availableQueues:
          description: The queues that can be used by the requesting user.
          type: array
          items:
            type: string
        availableHosts:
          description: The hosts that are available to run jobs.
          type: array
          items:
            type: string
        availableTags:
          description: The tags that are available on the available hosts.
          type: array
          items:
            type: string
        availableConsumableResources:
          description: The names of the resources that can be specified in the consumedResources
            field of a job request.
          type: array
          items:
            type: string
        availableRequiredResources:
          description: The names of the resources that can be specified in the requiredResources
            field of a job request.
          type: array
          items:
            type: string
        availableLimits:
          description: The names of the limits that can be specified in the limits
            field of a job request.
          type: array
          items:
            type: string
        version:
          description: The current version of this media type. Currently set to 1.
          type: integer
          format: int32
          minimum: 1
          maximum: 1
    jobResourceLimit:
      title: Job Resource Limit
      description: Provides information for specifying a job resource limit.
      type: object
      properties:
        name:
          description: |-
            The name of the limit resource to check. The limit names are all predefined. The following names are available:
            | **Limit Name** | **Description** |
            |--------------|-----------------|
            | maxMemory    | Maximum memory that the job can use. |
            | maxCpuTime   | Maximum CPU seconds that the job can use. |
            | maxClockTime | Maximum number of seconds that a job can run. |
            | maxIoTotal   | Maximum number of megabytes of data that the job can read and write. |
            | maxIoRate    | Maximum number of bytes that the job can read/write in a second. |
            | maxPageRate  | Maximum number of pages in and pages out that the job can perform in a second. |
          type: string
          enum:
          - maxMemory
          - maxCpuTime
          - maxClockTime
          - maxIoTotal
          - maxIoRate
          - maxPageRate
        value:
          description: The value of the resource that cannot be exceeded.
          type: number
          format: double
    jobStateInfo:
      title: Job State Information
      description: Provides a job's processing information.
      type: object
      properties:
        id:
          description: The ID of the job.
          type: integer
          readOnly: true
          example: 135
        processingInfo:
          $ref: "#/components/schemas/jobProcessingInfo"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    jobStaticResourceRequirement:
      title: Static Resource Requirement
      description: Provides information for specifying a host static resource required
        for a job.
      type: object
      properties:
        name:
          description: >-
            The name of the resource to check. The name can be a predefined static-resource
            name or
            the name of a user-defined globalStatic, globalStaticConsumable, hostStatic,
            or hostStaticConsumable resource.
            Predefined resource names include cpuRating, cores, memory, swap, and
            temp.
            NOTE: The globalStaticConsumable and hostStaticConsumable resources can
            be used in either the consumedResources or
            requiredResources arrays on queues and in job requests. The globalStatic
            and hostStatic resources can be used
            in only the requiredResources arrays on queues and in job requests.
          type: string
        value:
          description: The amount of resource to require, consume, or both.
          type: number
          format: double
    jobsCollection:
      title: Job Collection
      description: Provides an array of job information objects that satisfies the
        job collection request.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            description: An array of job objects.
            type: array
            items:
              $ref: "#/components/schemas/jobInfo"
    jobIds:
      title: Job IDs
      description: Provides a list of job IDs.
      type: object
      properties:
        jobIds:
          description: A list of job IDs.
          type: array
          items:
            type: integer
          example: [135, 136, 137]
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    jobsInfo:
      title: Jobs Information
      description: Provides job information for one or more jobs.
      type: object
      properties:
        jobs:
          description: An array of job information objects.
          type: array
          items:
            $ref: "#/components/schemas/jobInfo"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    jobsStateRequest:
      title: Jobs State Request
      description: Requests to get the job state for a list of jobs.
      type: object
      properties:
        jobIds:
          description: A list of job IDs. The associated job states are returned for
            this list.
          type: array
          items:
            type: string
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    jobsStateResponse:
      title: Jobs State Response
      description: Response from a job's state request.
      type: object
      properties:
        jobStates:
          description: An array of job processing information for the requested jobs.
          type: array
          items:
            $ref: "#/components/schemas/jobStateInfo"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    loggerLevelInfo:
      title: Logger Information
      description: Information about a logger and its assigned level.
      type: object
      properties:
        name:
          description: The name of the logger.
          type: string
          example: App.Grid.SGMG.Log.HTTP
        level:
          description: |-
            The logging level that is currently assigned to the logger. The following levels are available:
            | **Level Name** | **Description** |
            |----------------|-----------------|
            | NONE  | Turn off all logging from this logger. |
            | FATAL | Only log FATAL messages. |
            | ERROR | Only log FATAL and ERROR messages. |
            | WARN  | Only log FATAL, ERROR, and WARN messages. |
            | INFO  | Only log FATAL, ERROR, WARN, and INFO messages. |
            | DEBUG | Only log FATAL, ERROR, WARN, INFO, and DEBUG messages. |
            | TRACE | Only log FATAL, ERROR, WARN, INFO, DEBUG, and TRACE messages. |
            | ALL   | Log all messages. |
            | NULL  | Log messages based on the parent-logger setting. |
          type: string
          enum:
          - NONE
          - FATAL
          - ERROR
          - WARN
          - INFO
          - DEBUG
          - TRACE
          - ALL
          - "NULL"

    loggersLevelInfo:
      title: Host Logger Information
      description: Information about the loggers and their assigned levels for a specific
        host.
      type: object
      properties:
        hostName:
          description: The name of the host on which the loggers are located.
          type: string
          example: "myhost"
        loggers:
          description: An array of logger-level objects.
          type: array
          items:
            $ref: "#/components/schemas/loggerLevelInfo"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    loggersLevelRequest:
      title: Hosts' Loggers' Level Set Request
      description: Loggers and their requested levels to set on specific hosts.
      type: object
      properties:
        hosts:
          description: An array of host names to set the requested logger level.
          type: array
          items:
            type: string
          example: ["myhost1", "myhost2"]
        loggers:
          description: An array of logger-level objects.
          type: array
          items:
            $ref: "#/components/schemas/loggerLevelInfo"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    logLine:
      title: Log Line Object
      description: Contains information about a single log line.
      type: object
      properties:
        logger:
          description: The logger that generated the line.
          type: string
          example: "App.Grid.SGMG.Log.HTTP"
        level:
          description: |-
            The logging level to which the log line was set. The following levels are available:
            | **Level Name** | **Description** |
            |----------------|-----------------|
            | FATAL | Only log FATAL messages. |
            | ERROR | Only log FATAL and ERROR messages. |
            | WARN  | Only log FATAL, ERROR, and WARN messages. |
            | INFO  | Only log FATAL, ERROR, WARN, and INFO messages. |
            | DEBUG | Only log FATAL, ERROR, WARN, INFO, and DEBUG messages. |
            | TRACE | Only log FATAL, ERROR, WARN, INFO, DEBUG, and TRACE messages. |
          type: string
          enum:
          - FATAL
          - ERROR
          - WARN
          - INFO
          - DEBUG
          - TRACE
        msg:
          description: The message text that was output.
          type: string
          example: "[00000005] sas - SAS Workload Orchestrator Daemon - Version 4.0\
            \ (2022-08-01T22:12:01Z)"
        dateTime:
          description: The GMT date and time that the message was output by the logger.
          type: string
          format: date-time
          example: "2022-08-08T02:14:28Z"
    logsCollection:
      title: Log Line Object Collection
      description: Provides an array of log lines (in the SAS collection format) that
        meet the requested filters.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            description: An array of log line objects.
            type: array
            items:
              $ref: "#/components/schemas/logLine"
    logsInfo:
      title: Log Line Object Array
      description: Provides an array of log lines (in the original SAS Workload Orchestrator
        format) that meet the requested filters.
      type: object
      properties:
        lines:
          description: An array of log line objects.
          type: array
          items:
            $ref: "#/components/schemas/logLine"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    managerInfo:
      title: Manager Information
      description: Provides information about the manager.
      type: object
      properties:
        currentUser:
          description: The user name of the current user making the managerInfo request.
          type: string
          example: "user1"
        numJobs:
          description: The current number of jobs in the manager.
          type: integer
          example: 23
        numPendingJobs:
          description: The current number of jobs that are pending.
          type: integer
        numSuspendedJobs:
          description: The current number of jobs that are suspended by the administrator.
          type: integer
        numRunningJobs:
          description: The current number of jobs that are running.
          type: integer
        numHosts:
          description: The current number of hosts in the grid.
          type: integer
        numActiveHosts:
          description: The current number of active hosts in the grid.
          type: integer
        numInactiveHosts:
          description: The current number of inactive hosts in the grid.
          type: integer
        numClosedHosts:
          description: The current number of hosts in the grid that have been closed
            either by the administrator or because the hosts have no job slots.
          type: integer
        numFullHosts:
          description: The current number of hosts in the grid that have been closed
            because they cannot handle any more jobs.
          type: integer
        numOverloadedHosts:
          description: The current number of hosts in the grid that are above their
            scheduling thresholds.
          type: integer
        currentManager:
          description: The host name of the current grid manager host.
          type: string
          example: sas-workload-orchestrator-0
        managerCandidates:
          description: The names of hosts that are available to become a manager in
            a failover situation.
          type: array
          items:
            type: string
        globalStaticInfo:
          description: >-
            An array of name-value pairs that represents the maximum values and
            allocated values of the user-defined global static resources.
            The maximum-value name is the name of the user-defined global static resource.
            The allocated-value name is the name of the user-defined global static
            resource with the word 'Allocated' as a suffix.
          type: array
          items:
            $ref: "#/components/schemas/jobStaticResourceRequirement"
    queue:
      title: Queue Information
      description: Provides information about a queue including its configuration
        and operational information.
      type: object
      properties:
        name:
          description: The name of the queue.
          type: string
          maxLength: 250
          example: Priority
        description:
          description: The description of the queue.
          type: string
          maxLength: 1000
          example: "Queue for high priority jobs"
        tenant:
          description: The tenant of the queue.
          type: string
          maxLength: 250
          example: "acme"
        configInfo:
          $ref: "#/components/schemas/queueTimeBasedParameters"
        processingInfo:
          $ref: "#/components/schemas/queueProcessingInfo"
    queues:
      title: Queues Information
      description: Provides information about a collection of queues in the grid.
      type: object
      properties:
        queues:
          description: An array of queue information objects.
          type: array
          items:
            $ref: "#/components/schemas/queue"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          maximum: 1
    queuesCollection:
      title: Queue Collection
      description: Provides an array of queue information objects that satisfies the
        queue collection request.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            description: An array of queue information objects.
            type: array
            items:
              $ref: "#/components/schemas/queue"
    queueConfig:
      title: Queue Configuration
      type: object
      description: Provides the queue configuration that is used to implement workload-management
        policy.
      allOf:
      - $ref: "#/components/schemas/queueTimeBasedParameters"
      - type: object
        properties:
          name:
            description: The name of the queue.
            type: string
            maxLength: 250
            example: Priority
          description:
            description: The description of the queue.
            type: string
            maxLength: 1000
            example: "Queue for high priority jobs"
          tenant:
            description: The tenant associated with this queue.
            type: string
            maxLength: 250
            example: "acme"
          timeBasedOverrides:
            description: An array of time-based parameter overrides along with the
              time the overrides take effect.
            type: array
            items:
              $ref: "#/components/schemas/queueTimeBasedOverride"
          version:
            description: Specifies the version number of this representation schema.
              This is version 1.
            type: integer
            format: int32
            readOnly: true
            minimum: 1
            maximum: 2
    queueProcessingInfo:
      title: Queue Processing Information
      description: Provides information about the processing in the queue.
      type: object
      properties:
        state:
          description: |-
            The state of the queue. The following states are available:
            | **State Name**  | **Description** |
            |-----------------|-----------------|
            | OPEN-ACTIVE     | Queue is open to accepting jobs and is actively scheduling jobs. |
            | OPEN-INACTIVE   | Queue is open to accepting jobs but is not currently scheduling jobs. |
            | CLOSED-ACTIVE   | Queue is not accepting jobs but is actively scheduling the jobs it already has. |
            | CLOSED-INACTIVE | Queue is not accepting jobs and is not currently scheduling jobs. |
          type: string
          maxLength: 40
          enum:
          - OPEN-ACTIVE
          - OPEN-INACTIVE
          - CLOSED-ACTIVE
          - CLOSED-INACTIVE
        jobsPending:
          description: The number of jobs pending in the queue.
          type: integer
          format: int64
        jobsRunning:
          description: The number of jobs running out of the queue.
          type: integer
          format: int64
        jobsSuspended:
          description: The number of jobs suspended in the queue.
          type: integer
          format: int64
    queueTimeBasedOverride:
      title: Queue Time-Based Overrides Configuration
      description: Provides the parameters in a queue that can be changed by a time-based
        override.
      type: object
      allOf:
      - $ref: "#/components/schemas/queueTimeBasedParameters"
      - type: object
        properties:
          name:
            description: The name of this time-based override.
            type: string
            example: "night-time"
          validIntervals:
            description: The array of time intervals that the time-based parameters
              can use.
            type: array
            items:
              $ref: "#/components/schemas/timeBasedIntervals"
    queueTimeBasedParameters:
      title: Queue Time-Based Configuration
      description: Provides the parameters in a queue that can be changed by a time-based
        override.
      type: object
      properties:
        exchangeCreds:
          description: A flag that is the logical OR of the exchangeCreds flag on
            the job and the exchangeCreds flag on the queue. Valid in SAS v9 Windows
            only.
          type: boolean
          example: false
          deprecated: true
        isDefaultQueue:
          description: A flag that indicates whether this queue is the default queue.
            Only one queue can be the default queue at a time.
          type: boolean
        willRestartJobs:
          description: A flag that indicates that restartable jobs can be restarted
            in this queue.
          type: boolean
        priority:
          description: >-
            The priority value of this queue relative to other queues.
            A '-1' indicates to use the value in the default configuration.
          type: integer
          format: int32
          example: 35
          minimum: -1
          maximum: 2147483647
        maxJobs:
          description: >-
            The maximum number of jobs that can be running at any time from this queue.
            A '-1' indicates to use the value in the default configuration.
            A '0' indicates there is no limit.
          type: integer
          format: int64
          example: 12
          minimum: -1
          maximum: 10000
          default: 0
        maxJobsPerUser:
          description: >-
            The maximum number of jobs that can be running at any time from the same
            user.
            A '-1' indicates to use the value in the default configuration.
            A '0' indicates there is no limit.
          type: integer
          format: int64
          example: 4
          minimum: -1
          maximum: 10000
          default: 0
        maxJobsPerHost:
          description: >-
            The maximum number of jobs that can be running at any time on the same
            host.
            A '-1' indicates to use the value in the default configuration.
            A '0' indicates there is no limit.
          type: integer
          format: int64
          example: 8
          minimum: -1
          maximum: 10000
          default: 0
        scalingMinJobs:
          description: The number of jobs that must be in the pending state for the
            amount of time indicated by scalingMinSecs before a scaling request is
            made. Used only when scaled hosts exist and waiting might result in another
            job completing, which frees up an opportunity for a job to run. Ignored
            when scaled hosts do not exist because there is never an opportunity for
            a job to run when hosts do not exist. A '-1' indicates to use the value
            in the default configuration.
          type: integer
          format: int64
          example: 8
          minimum: -1
          maximum: 10000
          default: 0
        scalingMinSecs:
          description: The number of seconds a job must be in the pending state before
            being considered for a scaling request. Used only when scaled hosts exist
            and waiting might result in another job completing, which frees up an
            opportunity for a job to run. Ignored when scaled hosts do not exist because
            there is never an opportunity for a job to run when hosts do not exist.
            A '-1' indicates to use the value in the default configuration.
          type: integer
          format: int64
          example: 60
          minimum: -1
          maximum: 3600
          default: 0
        admins:
          description: The list of users and groups that can be the queue's administrators.
          type: array
          items:
            type: string
          example: ["queueAdmin", "queueAdminGroup"]
        users:
          description: The list of users and groups that can use the queue. If no
            users are specified, all users can use the queue.
          type: array
          items:
            type: string
          example: ["queueUser", "queueUserGroup"]
        hostNames:
          description: The list of host names on which this queue can schedule jobs
            to run.
          type: array
          items:
            type: string
          example: ["host1", "host2"]
        hostTypes:
          description: The list of host types on which this queue can schedule jobs
            to run.
          type: array
          items:
            type: string
          example: ["hostType1", "hostType2"]
        requiredTags:
          description: The list of tags required to be on hosts such that this queue
            can schedule jobs to the host.
          type: array
          items:
            type: string
          example: ["gpuEnabled", "fastIO"]
        consumedResources:
          description: >-
            An array of consumable static-resources values that must be available
            on a host before a job is scheduled to that host.
            After the job is scheduled, the resource values are decremented from the
            host's total.
          type: array
          items:
            $ref: "#/components/schemas/jobStaticResourceRequirement"
        requiredResources:
          description: >-
            An array of consumable static-resources values that must be available
            on a host before a job is scheduled to that host.
            The resource values are not decremented from the host's total.
          type: array
          items:
            $ref: "#/components/schemas/jobStaticResourceRequirement"
        limits:
          description: >-
            An array of consumable static-resources values that must be available
            on a host before a job is scheduled to that host.
            The resource values are not decremented from the host's total.
          type: array
          items:
            $ref: "#/components/schemas/jobResourceLimit"
        preempts:
          description: A list of queues that this queue can preempt if it has jobs
            to schedule and the grid has no openings to run a job from this queue.
          type: array
          items:
            type: string
          example: ["batch"]
    tenantAdmin:
      title: Tenant Administrator
      description: Provides the list of tenant user names or groups that can be a
        tenant for a specific group.
      type: object
      properties:
        tenant:
          description: The name of tenant.
          type: string
          example: "acme"
        admins:
          description: An array of tenant administrator user names or group names.
          type: array
          items:
            type: string
          example: ["tenantAdmin1", "tenantAdmin2"]
    tenantBackup:
      title: Tenant Backup Configuration
      description: Provides the backup configuration for a specific tenant. It includes
        the tenant's administrator list, queue information, and user group information.
      type: object
      properties:
        tenant:
          description: The name of the tenant.
          type: string
          example: "acme"
        admins:
          description: An array of tenant administrator user names or group names.
          type: array
          items:
            type: string
          example: ["tenantAdmin1", "tenantAdmin2"]
        queues:
          description: The queues configured for the tenant.
          type: array
          items:
            $ref: "#/components/schemas/queueConfig"
        userGroups:
          description: The user groups configured for the tenant.
          type: array
          items:
            $ref: "#/components/schemas/userGroupConfig"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          minimum: 1
          maximum: 1
    tenantConfig:
      title: Tenant Configuration
      description: Provides the configuration of users in the grid configuration for
        a specific tenant.
      type: object
      properties:
        tenant:
          description: The name of the tenant.
          type: string
          example: "acme"
        admins:
          description: An array of tenant administrator user names or group names.
          type: array
          items:
            type: string
          example: ["tenantAdmin1", "tenantAdmin2"]
        queues:
          description: The queues configured for the tenant.
          type: array
          items:
            $ref: "#/components/schemas/tenantQueueConfig"
        userGroups:
          description: The user groups configured for the tenant.
          type: array
          items:
            $ref: "#/components/schemas/userGroupConfig"
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          minimum: 1
          maximum: 1
    tenantInfo:
      title: Tenant Information
      description: Provides information about the tenants in the grid.
      type: object
      readOnly: true
      properties:
        tenants:
          description: The list of tenants available to the grid.
          type: array
          items:
            type: string
          example: ["uaa", "acme"]
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          minimum: 1
          maximum: 1
    tenantQueueConfig:
      title: Tenant Queue Configuration
      description: Provides the queue configuration that can be modified by a tenant
        administrator.
      type: object
      allOf:
      - $ref: "#/components/schemas/tenantQueueTimeBasedInfo"
      - type: object
        properties:
          name:
            description: The name of the queue.
            type: string
            maxLength: 250
            example: Priority
          description:
            description: The description of the queue.
            type: string
            maxLength: 1000
            example: "Queue for high priority jobs"
          tenant:
            description: The name of the tenant.
            type: string
            maxLength: 250
            example: "acme"
          timeBasedOverrides:
            description: Time-based overrides for the queue administrators and users.
            type: array
            items:
              $ref: "#/components/schemas/tenantQueueTimeBasedConfig"
    tenantQueueTimeBasedConfig:
      title: Tenant Queue Time-Based Overrides Configuration
      description: Provides a time-based queue configuration that can be modified
        by a tenant administrator.
      type: object
      allOf:
      - $ref: "#/components/schemas/tenantQueueTimeBasedInfo"
      - type: object
        properties:
          name:
            description: The name of the time-based configuration.
            readOnly: true
            example: "Night Time"
    tenantQueueTimeBasedInfo:
      title: Tenant Queue Time-Based Configuration
      description: Provides time-based queue configuration information that can be
        modified by a tenant administrator.
      type: object
      properties:
        admins:
          description: Tenant users and tenant groups that are the queue's administrators.
          type: array
          items:
            type: string
          example: ["tenantAdmin1", "tenantAdminGroup"]
        users:
          description: Tenant users and tenant groups that can use the queue.
          type: array
          items:
            type: string
          example: ["tenantUser1", "tenantQueueGroup"]
    timeBasedIntervals:
      title: Time-Based Interval
      type: object
      description: Provides a start-time expression and end-time expression that specify
        when the values in this object override the default values.
      properties:
        start:
          description: The CRON expression representing when the time interval begins.
          type: string
          example: "* 1 * * *"
        end:
          description: The CRON expression representing when the time interval ends.
          type: string
          example: "* 2 * * *"
    transferObject:
      title: Transfer Object
      description: Provides information about a transfer object.
      properties:
        id:
          type: string
          format: object-id
          description: A unique identifier of the object.
        version:
          type: integer
          description: >-
            This media type's schema version number. This representation is
            version 1.
        summary:
          $ref: "#/components/schemas/summary"
        content:
          type: string
          description: >-
            Optional. This is the content object that must be serialized in a
            format that is valid for Internet transmission. Valid encoding formats
            include Base64 or JSON data structures. The content provider provides
            the
            content object. The transfer service expects no visibility into or understanding
            of this value.
        state:
          type: string
          description: The state of the transfer object. It can be enabled or disabled.
        fileServiceContent:
          type: string
          description: deprecated
        connectors:
          type: array
          description: >-
            A list of associations or references to other external objects that must
            be
            recreated on import.
          items:
            $ref: "#/components/schemas/transferObjectConnector"
        substitutions:
          type: object
          description: >-
            A map with keys of parameter and value. The map replaces the value of
            'parameter' with the value of 'value'.
          additionalProperties:
            type: string
        links:
          type: array
          description: Paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
    userDefinedResource:
      title: User Defined Resource
      description: Provides information about a user-defined resource.
      type: object
      properties:
        name:
          description: The name of the user-defined resource.
          type: string
          example: "SASWORK Size"
        type:
          description: |-
            The type of user-defined resource. The following types are available:
            | **Type Name**           | **Description** |
            |-------------------------|-----------------|
            | globalStatic            | (DEPRECATED) A value that is static in the cluster. The value can be compared against a global value by jobs as they are submitted. The resource value is initialized on startup and when the configuration changes. |
            | globalStaticConsumable  | A value that is static in the cluster. The value can be consumed by jobs as they are submitted. The resource value is initialized on startup and when the configuration changes. |
            | hostStatic              | A value that is static to a host. When jobs are submitted, they compare this value against a host's value. The resource value is initialized on startup and when the manager makes changes. |
            | hostStaticConsumable    | A value that is static to a host. The value can be consumed by jobs as they are submitted. The resource value is initialized on startup and when the manager makes changes. |
            | hostDynamic             | A value that is dynamic to a host. The value can be used in the compare order for scheduling jobs, schedule thresholds, and suspension thresholds. The value is updated periodically by the status manager when it updates the predefined-dynamic values. |
            | k8sNodeStaticConsumable | A value that is static to a host. The value can be used in the compare order for scheduling jobs, schedule thresholds, and suspension thresholds. The value is retrieved from the Kubernetes 'allocatable' object so the name must match a property in that object. |
          type: string
          enum:
          - globalStatic
          - globalStaticConsumable
          - hostStatic
          - hostStaticConsumable
          - hostDynamic
          - k8sNodeStaticConsumable
        greaterIsBetter:
          description: >-
            A flag that indicates a larger value is better than a smaller value in
            comparisons.
            When this resource is used in the compare order, the flag tells us how
            to use the value in an evaluation.
          type: boolean
        scriptFilePath:
          description: >-
            The path to the script file that is called to produce the host static
            / host static consumable resource's value.
            The script is passed the name of the resource as a parameter. The script
            outputs
            a double value to STDOUT that represents the current value of the resource.
            The path to the script file must be a mounted path in the sas-workload-orchestrator
            statefulset and daemonset.
          type: string
        value:
          description: If this is a host static resource and scriptFilePath is not
            specified, a hard-coded value can be used.
          type: number
          example: 34.73
        version:
          description: Specifies the version number of this representation schema.
            This is version 1.
          type: integer
          format: int32
          minimum: 1
          maximum: 1
    userGroupConfig:
      title: User Group Configuration
      description: Provides configuration information about a user group.
      type: object
      properties:
        name:
          description: The name of a user group. On the SAS Viya platform it is assumed
            that the user group is defined in the Identities service.
          type: string
          example: NormalQueueAdmin
        tenant:
          description: >-
            The name of the tenant in which this user group is a part. 
          type: string
          example: "acme"
        members:
          description: >-
            The list of users or groups that are part of this user group.
            On the SAS Viya platform user-group membership is handled by the Identities
            service and this field is ignored.
          type: array
          items:
            type: string
          example: ["userGroupMember1", "userGroupUser2"]
        admins:
          description: A list of users or groups that are administrators of this user
            group.
          type: array
          items:
            type: string
          example: ["userGroup1Admin", "userGroupsAdmins"]
    userInfo:
      title: User Information
      description: Provides information about the user requesting grid information.
      type: object
      properties:
        isGridAdmin:
          description: Indicates whether the user is a grid administrator.
          type: boolean
          readOnly: true
        isTenantAdmin:
          description: Indicates whether the user is a tenant administrator.
          type: boolean
          readOnly: true
        name:
          description: The name of the user as specified in the OAuth token.
          type: string
          readOnly: true
          example: "user1"
        queuesAdministered:
          description: The list of queues that the user can administer.
          type: array
          readOnly: true
          items:
            type: string
          example: ["normal", "priority"]
        tenant:
          description: The tenant with which the user is associated.
          type: string
          readOnly: true
          example: "acme"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
