servers:
- url: "http://example.com/reportAlerts"
  description: The alerts API server.
components:
  requestBodies:
    subscription:
      content:
        application/vnd.sas.report.alert.subscription+json:
          schema:
            $ref: "#/components/schemas/subscription"
          examples:
            subscriptionReqBody:
              $ref: "#/components/examples/subscriptionRequestBody"
        application/json:
          schema:
            $ref: "#/components/schemas/subscription"
          examples:
            subscriptionReqBody:
              $ref: "#/components/examples/subscriptionRequestBody"
      description: Subscription to create.  Includes one or more subscribers. Indicates
        the report and the alertable condition in the report. Gives options for intervals
        between evaluations of the condition.
      required: true
  schemas:
    subscription:
      title: Subscription
      type: object
      x-sas-media-type:
        name: application/vnd.sas.report.alert.subscription
        version: 1
      description: Subscription  of users to a data condition in a report. The type
        corresponding to application/vnd.sas.report.alert.subscription.
      required:
      - id
      - report
      - alertableConditionName
      properties:
        version:
          type: integer
          description: This media type's schema version number.
        id:
          type: string
          description: The unique identifier assigned on creation. Note that this
            property is set by the server when a new subscription is created and is
            returned to the client, but the client should not assign a value to it.
            If a subscription already exists and is being updated, the client must
            keep the value originally assigned by the server.
          format: object-id
        createdBy:
          type: string
          description: The id of the user who created this subscription.
        creationTimeStamp:
          type: string
          format: date-time
          description: The date and time the subscription wast first created.
        modifiedBy:
          type: string
          description: The id of the last user who modified this subscription.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The date and time the subscription was last modified.
        lastQueriedTimeStamp:
          type: string
          description: The date and time of the last retrieval from the database for
            the purpose of evaluating the condition. This is read and set by the Report
            Alerts Evaluator  as it works through all the subscriptions during background
            processing.
          format: date-time
        subscribers:
          type: array
          description: Users that are currently subscribers to this subscription.
          items:
            $ref: "#/components/schemas/subscriber"
        report:
          $ref: "#/components/schemas/reportReference"
        alertableConditionName:
          description: The unique name of the condition within the report. Identifies
            the BIRD AlertableState element that is associated with the BIRD Condition
            of a visual element. It is a string having a pattern of "as" followed
            by up to 12 digits, e.g. "as12345".
          type: string
        evaluation:
          description: The evaluation object determines how often the subscription
            is evaluated. If the evaluation object is not supplied, it is interpreted
            as if it were supplied with a value of "systemControlled" specified for
            its intervalControl property.
          type: object
          required:
          - intervalControl
          properties:
            intervalControl:
              description: Strategy for how the interval is determined. If this is
                systemControlled, the intervalValue and the intervalUnit are ignored,
                and the evaluation system uses its own defaults for selecting the
                interval between running queries. If the value is "lookupReportStrategy",
                the system uses values specified in the report, and looks them up
                at evaluation time.
              type: string
              enum:
              - systemControlled
              - fixedInterval
              - lookupReportStrategy
            intervalUnit:
              description: Unit of interval for evaluation frequency. It is required
                when intervalControl is "fixedInterval", and if intervalControl is
                not "fixedInterval", it is ignored.
              type: string
              enum:
              - days
              - hours
              - minutes
              - seconds
            intervalValue:
              description: The amount of time between evaluations in the units specified
                by intervalUnit. It is required when intervalControl is "fixedInterval",
                and if intervalControl is not "fixedInterval", it is ignored. This
                is a target minimum amount of time between evaluations of the condition,
                which may require running CAS data queries so setting it correctly
                serves to prevent running data queries too often. It is considered
                a recommendation, not a firm guarantee, and the system should evaluate
                the condition each time the interval has expired unless other checks
                tell the system that the answer is already known.   The answer may
                be cached and known to still be valid when the elapsed time is passed.
              type: number
        notification:
          description: Determines the minimum time between notifications to subscribers.
            If the notification object is not supplied, the default is as if it were
            supplied with a value of "systemControlled" specified for the notification.intervalControl
            property.
          type: object
          required:
          - intervalControl
          properties:
            intervalControl:
              description: The strategy for how the interval betwen notifications
                is determined. If the value is systemControlled, the intervalValue
                and the intervalUnit are ignored, and the system chooses a notification
                interval based on some user preference or application default. If
                the value is "fixedInterval", notifications will not be sent any more
                often than the actual value and unit specified. If the value is "lookupReportStrategy",
                the system will use the values specified in the report by looking
                them up at evaluation time.
              type: string
              enum:
              - systemControlled
              - fixedInterval
              - lookupReportStrategy
            intervalUnit:
              description: Unit of notification interval if the intervalControl attribute
                is "fixedInterval." The unit is required if intervalControl is "fixedInterval";
                otherwise it is ignored.
              type: string
              enum:
              - days
              - hours
              - minutes
              - seconds
            intervalValue:
              description: Value of notification interval if the intervalControl attribute
                is "fixedInterval". The value is required if intervalControl is "fixedInterval";
                otherwise it is ignored.
              type: number
        links:
          type: array
          description: Paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
    evaluationCandidate:
      title: Candidate Subscription for Evaluation
      type: object
      x-sas-media-type:
        name: application/vnd.sas.report.alert.candidate
        version: 1
      description: Designates a subscription that is a candidate for evaluation. It
        contains timestamps for when  a subscription was last retrieved and processed
        by the Report Alerts Evaluator. It contains a reference link to the original
        subscription but does not repeat the fields of that object. Its purpose is
        to help multiple cooperating Report Alert Evaluator service instances to coordinate
        their work and to find the next condition(s) to be checked.
      required:
      - id
      properties:
        id:
          type: string
          description: the unique identifier
          format: object-id
        version:
          type: integer
          description: This schema version of this object.
        lastQueriedTimeStamp:
          type: string
          format: date-time
          description: The date and time the subscription was last queried.
        links:
          type: array
          description: Links that apply to this object, especially for retrieving
            the subscription and subscribers.
          items:
            $ref: "#/components/schemas/link"
    subscriber:
      title: Subscriber
      description: The user subscribed to a data condition in a report with information
        about how to notify the user.
      type: object
      x-sas-media-type:
        name: application/vnd.sas.report.alert.subscriber
        version: 1
      required:
      - userId
      properties:
        userId:
          description: Identifier of user.
          type: string
        group:
          description: Whether subscriber is a group, not a single identity.
          type: boolean
          default: false
        sendEmail:
          description: Whether to send email when notifying.
          type: boolean
          default: true
        sendSms:
          description: Whether to send SMS message when notifying.
          type: boolean
          default: false
        retainNotification:
          description: Whether to retain the notification after sending
          type: boolean
          default: false
        modifiedBy:
          type: string
          description: The user who most recently modified the subscriber.
        modifiedTimeStamp:
          type: string
          description: The time stamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            subscriber was last modified.
          format: date-time
    subscriberCollection:
      title: Resource Collection of Subscribers.
      description: A collection of subscriber representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/subscriber"
            description: The array of representations.
    reportReference:
      title: Reference to Report
      description: Information needed in order to label a reference to a report and
        to create the link to the report resource.
      type: object
      required:
      - uri
      properties:
        name:
          type: string
          description: A user readable name, typically the name shown in a file selector.
            It is intended to be used in notification messages to a subscriber. It
            is likely the one that is returned as the name field of the application/vnd.sas.report
            media type from the Reports Rervice, but it can be set to any name that
            is more descriptive.
        uri:
          type: string
          description: The resource URI for the report by which it is available from
            the reports service.
    alertableCondition:
      title: Alertable Condition
      description: Information about an "AlertableState" in a BIRD Report and the
        conditional expression that defines it.
      type: object
      x-sas-media-type:
        name: application/vnd.sas.report.alert.condition
        version: 1
      required:
      - alertableState
      - report
      properties:
        alertableState:
          description: The unique name of the BIRD AlertableState element in the report.
          type: string
          example: as456
        report:
          $ref: "#/components/schemas/reportReference"
        expression:
          description: The data condition specified in BIRD expression language
          type: string
          example: "gt(${bi123}, 10000)"
        clauseName:
          type: string
          description: Unique internal name for condition clause in the report
        visualElementName:
          type: string
          description: BIRD report internal name for the visual element showing alertable
            data.
        dataItemNames:
          description: The data items involved in the condition when evaluated.
          type: array
          items:
            type: string
            title: Internal names for data items used by the visual element and in
              the condition expression.
        defaultEvaluation:
          description: The default setting for subscriptions for the time interval
            between evaluations of the condition. If the defaultEvaluation object
            is not supplied on a condition, it is interpreted as if the defaultEvaluation.intervalControl
            attribute were "systemControlled."
          type: object
          required:
          - intervalControl
          properties:
            intervalControl:
              description: Default strategy for determining the evaluation frequency
                interval for subscriptions to the condition.
              type: string
              enum:
              - systemControlled
              - fixedInterval
            intervalUnit:
              description: Default unit of time for evaluation frequency. The unit
                is required if the intervalControl is "fixedInterval"; otherwise,
                it is ignored. Note that the value "seconds" is allowed by the API,
                but the VA Editor user interface only provides selection of days,
                hours, or minutes.
              type: string
              enum:
              - days
              - hours
              - minutes
              - seconds
            interval:
              type: number
              description: Value of interval for evaluation frequency. The value is
                required if the intervalControl is "fixedInterval"; otherwise, it
                is ignored.
              minimum: 1
        defaultNotification:
          description: The default settings for minimum time between notifications
            for subscriptions to the condition. If the defaultNotification object
            is not supplied on a condition, it is interpreted as if the defaultNotification.intervalControl
            attribute were systemControlled.
          type: object
          required:
          - intervalControl
          properties:
            intervalControl:
              description: Default strategy for how notification interval is determined
                for subscriptions to the condition.
              type: string
              enum:
              - systemControlled
              - fixedInterval
              default: systemControlled
            intervalUnit:
              description: Unit of interval for time between notifications if intervalControl
                is "fixedInterval". The unit "seconds" is allowed by the API, but
                note that the VA Editor user interface only provides selection of  days,
                hours, or minutes. The unit is required if the intervalControl is
                "fixedInterval"; otherwise, it is ignored.
              type: string
              enum:
              - days
              - hours
              - minutes
              - seconds
            interval:
              description: Minimum time interval between notifications if intervalControl
                is "fixedInterval". The value is required if the intervalControl is
                "fixedInterval"; otherwise, it is ignored.
              type: number
              minimum: 1
        id:
          type: string
          format: object-id
          description: A system-generated id that appears in reponse objects.  Does
            not need to be provided on requests.
        version:
          type: integer
          description: The version of this object.
        links:
          type: array
          description: Links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    collection2:
      title: Collection
      description: A collection of zero or more resource representations. Collections
        are often paginated and the items array contains one page of representations.
      required:
      - items
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Array consisting API resource representations, normally a
              page worth.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
  examples:
    invalidCondition:
      description: >
        invalid alertable condition
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 27804, "message": "The\
          \ alertable condition name requested is invalid: ..", "details": ["path:\
            \ /reportAlerts/conditions", "correlator: 070b768e-0e4d-4745-9f1d-cb17e5faae36"]}
    conditionResponseBody:
      description: >
        condition collection
      value: {"id": "23f0ce6b-8c67-482f-a787-76d87364b16a", "version": 1, "alertableState": "as42",
        "report": {"uri": "/reports/reports/d7b26fc7-c7d7-4c88-b554-4382bd0b84b9",
          "name": "Test Report for Alert Subscriptions"}, "expression": "gt(${bi1},200)",
        "clauseName": "cc43", "visualElementName": "ve32", "dataItemNames": ["bi38"],
        "defaultEvaluation": {"interval": 10, "intervalUnit": "minutes", "intervalControl": "fixedInterval"},
        "defaultNotification": {"interval": 1, "intervalUnit": "days", "intervalControl": "fixedInterval"},
        "links": [{"method": "GET", "rel": "self", "href": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28",
            "uri": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28",
            "type": "application/vnd.sas.report.alert.condition"}, {"method": "GET",
            "rel": "getReportContent", "href": "/reports/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/content",
            "uri": "/reports/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/content",
            "type": "application/vnd.sas.report.content", "title": "Get BIRD Content\
              \ of Report"}, {"method": "GET", "rel": "getReportConditions", "href": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28",
            "uri": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28",
            "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.report.alert.condition"},
          {"method": "GET", "rel": "getSubscribers", "href": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28/subscribers",
            "uri": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28/subscribers",
            "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.report.alert.subscriber"}]}
    eTagNotProvided:
      description: >
        eTag is missing
      value: {"version": 2, "httpStatusCode": 428, "errorCode": 27821, "message": 'The
          header field "If-Match" is missing or does not have a value.', "details": [
          "path: /reportAlerts/...", "correlator: c9656b50-2d9c-43a8-872d-026b1fb78e24"],
        "remediation": "Specify the resource's entity tag."}
    subscriptionNotFound:
      description: >
        subscription not found
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 27802, "message": "record\
          \ not found", "details": ["subscription not found for id=...", "path: /reportAlerts/subscriptions/...",
          "correlator: 7c47391d-5d61-4c97-b464-a0cc11b97295"]}
    subscriptionRequestBody:
      description: >
        subscription request body
      value: {"id": "", "alertableConditionName": "as42", "report": {"uri": "/reports/reports/d7b26fc7-c7d7-4c88-b554-4382bd0b84b9",
          "name": "Report for Testing Alert Conditions"}, "evaluation": {"interval": 10,
          "intervalUnit": "minutes", "intervalControl": "fixedInterval"}, "notification": {
          "interval": 1, "intervalUnit": "days", "intervalControl": "fixedInterval"},
        "subscribers": [{"userId": "SASAdministrators", "group": true, "sendEmail": false,
            "sendSms": false, "retainNotification": true}, {"userId": "sasuser", "group": false,
            "sendEmail": true, "sendSms": true, "retainNotification": true}]}
    conditionCollectionItems:
      description: >
        condition collection items
      value: [{"id": "23f0ce6b-8c67-482f-a787-76d87364b16a", "version": 1, "alertableState": "as42",
          "report": {"uri": "/reports/reports/d7b26fc7-c7d7-4c88-b554-4382bd0b84b9",
            "name": "Test Report for Alert Subscriptions"}, "expression": "gt(${bi1},200)",
          "clauseName": "cc43", "visualElementName": "ve32", "dataItemNames": ["bi38"],
          "defaultEvaluation": {"interval": 10, "intervalUnit": "minutes", "intervalControl": "fixedInterval"},
          "defaultNotification": {"interval": 1, "intervalUnit": "days", "intervalControl": "fixedInterval"},
          "links": [{"method": "GET", "rel": "self", "href": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28",
              "uri": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28",
              "type": "application/vnd.sas.report.alert.condition"}, {"method": "GET",
              "rel": "getReportContent", "href": "/reports/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/content",
              "uri": "/reports/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/content",
              "type": "application/vnd.sas.report.content", "title": "Get BIRD Content\
                \ of Report"}, {"method": "GET", "rel": "getReportConditions", "href": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28",
              "uri": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28",
              "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.report.alert.condition"},
            {"method": "GET", "rel": "getSubscribers", "href": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28/subscribers",
              "uri": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28/subscribers",
              "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.report.alert.subscriber"}]}]
    userIdNotMatch:
      description: >
        input error; userId not match the path parameter
      value: {"version": 2, "httpStatusCode": 400, "message": "user id must match\
          \ the subscriber in the body of the request", "details": ["path: /reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28/subscribers/sasdemo",
          "correlator: a7c712b8-f052-4682-aff9-1636284b6478"]}
    invalidInput:
      description: >
        invalid input
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 27805, "message": "the\
          \ input is not valid", "details": ["path: /reportAlerts/...", "correlator:\
            \ 1af7bdcb-7fde-4dab-b756-b013b64c3c64"]}
    userConflict:
      description: >
        conflict; user already exists.
      value: {"version": 2, "httpStatusCode": 409, "errorCode": 27806, "message": "User\
          \ sasdemo is already subscribed to alertable condition as28 of report 7f844d15-6c14-47f5-a746-c9f830cb534e.",
        "details": ["path: /reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28/subscribers/",
          "correlator: 0187b50e-e4a7-4d0e-9e04-34c7d14fdfe1"]}
    subscriberResponseBody:
      description: >
        subscriber response body
      value: {"userId": "sasdemo", "group": false, "sendEmail": true, "sendSms": false,
        "retainNotification": true, "links": [{"method": "GET", "rel": "self", "href": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28/subscribers/sasdemo",
            "uri": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28/subscribers/sasdemo",
            "type": "application/vnd.sas.report.alert.subscriber"}, {"method": "DELETE",
            "rel": "deleteSubscriber", "href": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28/subscribers/sasdemo",
            "uri": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28/subscribers/sasdemo"},
          {"method": "PUT", "rel": "updateSubscriber", "href": "/reportAlerts/reports/7f844d15-6c14-47f5-a746-c9f830cb534e/conditions/as28/subscribers/sasdemo",
