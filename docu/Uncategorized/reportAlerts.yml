---
openapi: 3.0.3
info:
  version: "3"
  title: Report Alerts
  description: Creates, reads, updates, and deletes subscriptions to alertable data
    conditions in reports.
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
tags:
- name: Root
  description: The API root for a list of links.
- name: Subscription
  description: The endpoints for subscriptions to alertable data conditions.
- name: Condition
  description: The endpoints for alertable data conditions in reports.
- name: Subscriber
  description: The endpoints for subscriber resources.
- name: Evaluator
  description: The endpoints for internal use only.
paths:
  /:
    get:
      summary: Get a list of top-level links
      description: Returns a collection of links to the top-level collections surfaced
        through this API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: The services top-level links.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/rootLinks"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/rootLinks"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.api+json"
  /subscriptions#standard:
    get:
      operationId: getSubscriptions
      summary: Get a list of either summary or full subscriptions
      tags:
      - Subscription
      description: Gets collection of either full or summary Subscription objects,
        controlled by the type requested in the Accept-Item header. Full objects are
        not that much larger than summary objects, so the usual pattern of getting
        a collection of summary objects, then following "self" links to the full objects
        has less importance here. Optional query params of start/limit/filter/sortBy
        can be used, such as to query for a certain report's subscriptions.
      parameters:
      - name: Accept
        description: the collection media type
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          default: application/vnd.sas.collection+json
      - name: Accept-Item
        description: This is an optional header. If not present, items of application/vnd.sas.summary+json
          type are returned. The other valid value is application/vnd.sas.report.alert.subscription+json,
          which gives full subscription items.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.summary+json
          - application/vnd.sas.report.alert.subscription+json
          default: application/vnd.sas.summary+json
      - name: start
        in: query
        description: 0-based index of first one to return.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: maximum number of results to return.
        required: false
        schema:
          type: integer
          default: 20
      - name: filter
        in: query
        description: Filter criteria for returned reports. Subscription attributes
          that can be used include id, reportName, reportUri, alertableConditionName,
          evaluationIntervalUnit, evaluationIntervalValue, evaluationQueryEvaluationControl,
          createdBy, creationTimeStamp, modifiedBy, and modifiedTimeStamp.
        required: false
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort criteria for returned report.  See https://developer.sas.com/rest-apis/reportAlerts-v3/docs/getting-started/usage-notes#sorting
          for more information on the format of the sort keys. The default sorting
          is name ascending.  Report attributes that can be used are id, name, description,
          createdBy, creationTimeStamp, modifiedBy, and modifiedTimeStamp.
        required: false
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: Successful response.  The collection returned can be empty.
          headers:
            Content-Type:
              description: collection media type
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/subscription"
              examples:
                subscriptionCollection:
                  $ref: "#/components/examples/subscriptionCollection"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/subscription"
              examples:
                subscriptionCollection:
                  $ref: "#/components/examples/subscriptionCollection"
        "400":
          description: The input parameters are invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidParameter:
                  $ref: "#/components/examples/invalidParameterValue"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidParameter:
                  $ref: "#/components/examples/invalidParameterValue"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
        "406":
          description: Not Acceptable.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidMediaType:
                  $ref: "#/components/examples/invalidMediaType"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidMediaType:
                  $ref: "#/components/examples/invalidMediaType"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
    post:
      operationId: createSubscription
      summary: Create a new subscription from information given in the body of the
        request
      description: Create one subscription for one or more subscribers to an alertable
        condition in a report.
      tags:
      - Subscription
      requestBody:
        $ref: "#/components/requestBodies/subscription"
      responses:
        "201":
          description: Successful response. Created subscription.
          headers:
            Location:
              description: The full URL for the new subscription
              schema:
                type: string
                format: url
            ETag:
              description: string that identifies the current state of the subscription
                for subsequent use on PUT
              schema:
                type: string
            Content-Type:
              description: the type returned, a standard
              schema:
                type: string
                enum:
                - application/vnd.sas.report.alert.subscription+json
                - application/json
                default: application/vnd.sas.report.alert.subscription+json
          content:
            application/vnd.sas.report.alert.subscription+json:
              schema:
                $ref: "#/components/schemas/subscription"
              examples:
                subscriptionRespBody:
                  $ref: "#/components/examples/subscriptionResponseBody"
            application/json:
              schema:
                $ref: "#/components/schemas/subscription"
              examples:
                subscriptionRespBody:
                  $ref: "#/components/examples/subscriptionResponseBody"
        "400":
          description: The input is not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidInput:
                  $ref: "#/components/examples/invalidInput"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidInput:
                  $ref: "#/components/examples/invalidInput"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
  "/subscriptions/{subscriptionId}":
    get:
      operationId: getSubscription
      summary: Get a subscription
      tags:
      - Subscription
      description: Get one subscription by its identifier.
      parameters:
      - name: subscriptionId
        description: The resource identifier for a single subscription.
        in: path
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          headers:
            ETag:
              description: A string identifying this particular state of the subscription.
              schema:
                type: string
                enum:
                - application/vnd.sas.report.alert.subscription+json
                - application/json
                default: application/vnd.sas.report.alert.subscription+json
            Location:
              description: The full URL for the resource
              schema:
                type: string
          content:
            application/vnd.sas.report.alert.subscription+json:
              schema:
                $ref: "#/components/schemas/subscription"
              examples:
                subscriptionRepBody:
                  $ref: "#/components/examples/subscriptionResponseBody"
            application/json:
              schema:
                $ref: "#/components/schemas/subscription"
              examples:
                subscriptionRepBody:
                  $ref: "#/components/examples/subscriptionResponseBody"
        "404":
          description: Subscription Not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                subscriptionNotFound:
                  $ref: "#/components/examples/subscriptionNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                subscriptionNotFound:
                  $ref: "#/components/examples/subscriptionNotFound"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
    head:
      operationId: headersForSubscription
      summary: Existence check one subscription
      tags:
      - Subscription
      description: Existence check one subscription by its identifier.
      parameters:
      - name: subscriptionId
        description: The resource identifier for a single subscription.
        in: path
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          headers:
            ETag:
              description: A string identifying this particular state of the subscription.
              schema:
                type: string
                enum:
                - application/vnd.sas.report.alert.subscription+json
                - application/json
                default: application/vnd.sas.report.alert.subscription+json
            Location:
              description: The full URL for the resource
              schema:
                type: string
          content:
            application/vnd.sas.report.alert.subscription+json:
              schema:
                $ref: "#/components/schemas/subscription"
              examples:
                subscriptionRepBody:
                  $ref: "#/components/examples/subscriptionResponseBody"
            application/json:
              schema:
                $ref: "#/components/schemas/subscription"
              examples:
                subscriptionRepBody:
                  $ref: "#/components/examples/subscriptionResponseBody"
        "404":
          description: Subscription Not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                subscriptionNotFound:
                  $ref: "#/components/examples/subscriptionNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                subscriptionNotFound:
                  $ref: "#/components/examples/subscriptionNotFound"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
    put:
      operationId: updateSubscription
      summary: Modify a subscription
      tags:
      - Subscription
      description: Update a subscription, replacing its contents with the subscription
        in the request body.
      parameters:
      - name: subscriptionId
        description: the resource identifier for a single subscription
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: The ETag identifier from last GET of the subscription.
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/subscription"
      responses:
        "200":
          description: Successful response.
          headers:
            ETag:
              description: A tag that identifies this revision of the object.
              schema:
                type: string
          content:
            application/vnd.sas.report.alert.subscription+json:
              schema:
                $ref: "#/components/schemas/subscription"
              examples:
                subscriptionRespBody:
                  $ref: "#/components/examples/subscriptionResponseBody"
            application/json:
              schema:
                $ref: "#/components/schemas/subscription"
              examples:
                subscriptionRespBody:
                  $ref: "#/components/examples/subscriptionResponseBody"
        "400":
          description: The input subscription is not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidInput:
                  $ref: "#/components/examples/invalidInput"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidInput:
                  $ref: "#/components/examples/invalidInput"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
        "404":
          description: Subscription does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                subscriptionNotFound:
                  $ref: "#/components/examples/subscriptionNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                subscriptionNotFound:
                  $ref: "#/components/examples/subscriptionNotFound"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
        "412":
          description: The ETag provided does not match the current version of the
            object
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                eTagNotMatch:
                  $ref: "#/components/examples/eTagNotMatch"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                eTagNotMatch:
                  $ref: "#/components/examples/eTagNotMatch"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
        "428":
          description: The ETag was not provided when updating an existing type. (Not
            enforced)
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                eTagNotProvided:
                  $ref: "#/components/examples/eTagNotProvided"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                eTagNotProvided:
                  $ref: "#/components/examples/eTagNotProvided"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
    delete:
      operationId: deleteSubscription
      summary: Delete a subscription
      tags:
      - Subscription
      description: Delete a subscription identified by its id.
      parameters:
      - name: subscriptionId
        description: the resource identifier for a single subscription
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No content, meaning successful deletion
        "400":
          description: The input subscription is not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                inputValidation:
                  $ref: "#/components/examples/inputValidation"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
  /subscriptions#evaluation:
    x-sas-internal: true
    get:
      operationId: getSubscriptionCandidates
      summary: Gets collection of evaluation candidates
      tags:
      - Evaluator
      description: This "evaluation candidate resource" is intended only for the use
        of the Report Alert Evaluator service. It serves to coordinate the work of
        multiple Report Alert Evaluator services in a cluster by returning the batch
        of candidate subscriptions that should be evaluated next. Gets a fixed number
        that is limited by the configuration property "query.maxNumberOfSubscriptions".
        The collection is ordered in ascending order of the the last time the subscription
        was returned for evaluation by this endpoint.
      parameters:
      - name: Accept-Item
        description: This header must be set to application/vnd.sas.report.alert.candidate+json
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/vnd.sas.report.alert.candidate+json
      - name: limit
        description: This parameter is expected as part of the standard for collections,
          but it will be ignored.
        in: query
        required: false
        schema:
          type: integer
      - name: start
        description: This parameter is expected as part of the standard for collections,
          but it will be ignored.
        in: query
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: Successful response.  Ordered list of subscriptions that are
            candidates for evaluation.
          headers:
            Content-Length:
              description: The number of subscription candidates that returned. Might
                be zero, meaning there are no subscriptions, which is not an error.
              schema:
                type: integer
            Content-Type:
              description: the actual returned collection type
              schema:
                type: string
                default: application/vnd.sas.collection+json
          content:
            application/vnd.sas.collection+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/evaluationCandidate"
              examples:
                subscriptionCandidateCollection:
                  $ref: "#/components/examples/subscriptionCandidateCollection"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/evaluationCandidate"
              examples:
                subscriptionCandidateCollection:
                  $ref: "#/components/examples/subscriptionCandidateCollection"
        "400":
          description: The input is not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidParameter:
                  $ref: "#/components/examples/invalidParameterValue"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidParameter:
                  $ref: "#/components/examples/invalidParameterValue"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
  /conditions:
    get:
      operationId: getConditions
      summary: Get a collection of alertable conditions for a designated report
      description: Returns a collection containing the alertable conditions in a designated
        persistent report. Conditions do not have to be subscribed to in order to
        be returned. For this collection the standard paging parameters are not supported.
        The usual intent is to retrieve all conditions for the report.  It is typical
        that there might be a one or two conditions for each primary visual element
        in the report.
      tags:
      - Condition
      parameters:
      - name: Accept-Item
        description: Specifies the required type and format of the returned elements
          in the collection
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.report.alert.condition+json
          - application/json
          default: application/vnd.sas.report.alert.condition+json
      - name: reportUri
        in: query
        description: Resource URI of a persisted report.
        required: true
        schema:
          type: string
      - name: alertableConditionName
        in: query
        description: Name of an AlertableState BIRD element in the report. If it is
          omitted, all AlertableStates in the  report are retrieved.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response.  The collection returned can be empty,
            however, if the report exists but has no AlertableState elements.
          headers:
            Content-Type:
              description: application/vnd.sas.collection
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/alertableCondition"
              examples:
                conditionCollectionItems:
                  $ref: "#/components/examples/conditionCollectionItems"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/alertableCondition"
              examples:
                conditionCollectionItems:
                  $ref: "#/components/examples/conditionCollectionItems"
        "400":
          description: The input parameters are invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidCondition:
                  $ref: "#/components/examples/invalidCondition"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidCondition:
                  $ref: "#/components/examples/invalidCondition"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
        "404":
          description: Not Found. This may be returned if the requested report does
            not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                reportNotFound:
                  $ref: "#/components/examples/reportNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                reportNotFound:
                  $ref: "#/components/examples/reportNotFound"
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
  "/reports/{reportId}/conditions":
    get:
      operationId: getConditionsForReport
      summary: Gets a collection of the alertable conditions for a single report
      description: Gets the alertable conditions for a single report. This is alternative
        syntax for using the query paramater, as in '/conditions/?reportUri={reportUri}'.
        It is provided for consistency with the resource path for the subscribers
        collection, which extends the path out to "/reports/{reportId}/conditions/{alertableConditionName}/subscribers".
      tags:
      - Condition
      parameters:
      - name: Accept
        description: Specifies the required type and format of the returned elements
          in the collection
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/json
          default: application/vnd.sas.collection+json
      - name: Accept-Item
        description: Specifies the required type and format of the returned elements
          in the collection
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.report.alert.condition+json
          - application/json
          default: application/vnd.sas.report.alert.condition+json
      - name: reportId
        in: path
        description: Resource id of a persisted report.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Ignored. This standard collection query parameter is documented
          to suppress arREST warnings
        schema:
          type: integer
      - name: start
        in: query
        description: Ignored. This standard collection query parameter is documented
          to suppress arREST warnings
        schema:
          type: integer
      responses:
        "200":
          description: Successful response. Collection can exist, although may be
            empty when retrieved.
          headers:
            Content-Type:
              description: application/vnd.sas.collection
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.report.alert.condition
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/collection2"
              examples:
                conditionCollection:
                  $ref: "#/components/examples/conditionCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/collection2"
              examples:
                conditionCollection:
                  $ref: "#/components/examples/conditionCollection"
        "404":
          description: Report resource not found. This error is not returned if report
            exists but there are no conditions in the report.
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                reportNotFound:
                  $ref: "#/components/examples/reportNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                reportNotFound:
                  $ref: "#/components/examples/reportNotFound"
    head:
      operationId: headersForConditionsForReport
      summary: Existence check a collection of the alertable conditions for a single
        report
      description: Existence check the alertable conditions for a single report. This
        is alternative syntax for using the query paramater, as in '/conditions/?reportUri={reportUri}'.
        It is provided for consistency with the resource path for the subscribers
        collection, which extends the path out to "/reports/{reportId}/conditions/{alertableConditionName}/subscribers".
      tags:
      - Condition
      parameters:
      - name: Accept
        description: Specifies the required type and format of the returned elements
          in the collection
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/json
          default: application/vnd.sas.collection+json
      - name: Accept-Item
        description: Specifies the required type and format of the returned elements
          in the collection
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.report.alert.condition+json
          - application/json
          default: application/vnd.sas.report.alert.condition+json
      - name: reportId
        in: path
        description: Resource id of a persisted report.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Ignored. This standard collection query parameter is documented
          to suppress arREST warnings
        schema:
          type: integer
      - name: start
        in: query
        description: Ignored. This standard collection query parameter is documented
          to suppress arREST warnings
        schema:
          type: integer
      responses:
        "200":
          description: Successful response. Collection can exist, although may be
            empty when retrieved.
          headers:
            Content-Type:
              description: application/vnd.sas.collection
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.report.alert.condition
              schema:
