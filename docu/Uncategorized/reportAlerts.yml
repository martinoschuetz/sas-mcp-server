      summary: Create a new subscriber to an existing subscription
      description: Creates a new subscriber based on the representation in the request
        body.  Finds the first current subscription to the given condition and report,
        then adds the subscriber to that subscription.  Does not modify the subscription
        other than adding the subscriber. (Current conventions in the report authoring
        tool are that a subscription is created when the first user is subscribed,
        but not just because a BIRD AlertableState exists in the report.)  Therefore,
        this operation has a choice of whether to create a subscription if none exists
        and subscribe the user, or, if there is no existing subscription, treat it
        as an error, and fail the POST operation.
      operationId: createSubscriber
      tags:
      - Subscriber
      parameters:
      - name: reportId
        in: path
        required: true
        description: The unique resource identifier for the report.
        schema:
          type: string
      - name: alertableConditionName
        in: path
        required: true
        description: The identifier for the alertable condition in the report. It
          is the "name" attribute of an "AlertableState" BIRD element. It is unique
          only within the scope of the report content.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.report.alert.subscriber+json:
            schema:
              $ref: "#/components/schemas/subscriber"
            examples:
              subscriberReqBody:
                $ref: "#/components/examples/subscriberRequestBody"
          application/json:
            schema:
              $ref: "#/components/schemas/subscriber"
            examples:
              subscriberReqBody:
                $ref: "#/components/examples/subscriberRequestBody"
