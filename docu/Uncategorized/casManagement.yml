      description: Deletes a table from Caslib source. Note that is not an unload.
        This operation physically removes the source table (if the source is writable).
        For path-based caslibs, this physically removes the file.
      parameters:
      - name: serverName
        description: Server name containing the Caslib.
        in: path
        required: true
        schema:
          type: string
