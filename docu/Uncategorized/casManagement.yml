      properties:
        version:
          type: integer
          description: The media type's schema version number.
        name:
          type: string
          description: The unique name of this engine within its data source.
        nickname:
          type: string
          description: The user visible nickname of the engine.
        legalName:
          type: string
          description: The engine's short legal name.
        providerId:
          type: string
          description: The unique identifier of this engine's provider.
        dataSourceId:
          type: string
          description: The unique identifier of this engine's parent data source.
        licensed:
          type: boolean
          description: If true, the engine is licensed. If false, the engine is not
