        name: application/vnd.sas.cas.source.table
        version: 1
    casTableReference:
      title: Table Reference
      description: Table reference information.
      properties:
        sessionId:
          description: Session ID of the table. For tables in session scope, the session
            ID is required to access it.
          type: string
        sourceCaslibName:
          description: Optional name of the source caslib corresponding to the table.
          type: string
        sourceTableName:
          description: Optional name of the source table file corresponding to the
            table.
          type: string
        tableUri:
          description: Reference to the table.
          type: string
      required:
      - tableUri
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.table.reference
        version: 1
    caslibCollection:
      title: Caslib Collection
      description: The list of caslibs for the requested CAS server and optional session.
      type: object
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
      - properties:
          items:
            type: array
            description: An array containing caslib resources.
            items:
              $ref: "#/components/schemas/caslib"
    caslib:
      title: Caslib
      description: The representation of a caslib. Note that links are returned only
        for GET calls.
      properties:
        attributes:
          description: Contains an array of key/object pairs related to caslib type-specific
            settings. Supports simple object types (string, boolean, integer, long)
            as well as nested arrays. See reference documentation for specific caslib
            types to determine proper key/object pairs for defining a specific caslib.
          type: array
          items:
            $ref: "#/components/schemas/keyValueModel"
        description:
          description: Description of the caslib.
          type: string
        name:
          description: Name of the caslib.
          type: string
        metadataId:
          description: A read-only property containing the metadata ID assigned to
            this caslib.
          type: string
        path:
          description: The path of the caslib.
          type: string
        scope:
          description: The scope of the caslib. Valid values include session or global.
          type: string
        hidden:
          description: The hidden value of the caslib. True if this is a hidden caslib.
            False otherwise.
          type: boolean
        transient:
          description: The transient value of the caslib. True if this is a transient
            caslib. False otherwise.
          type: boolean
        type:
          description: Type of the Caslib. Valid values include any caslib type supported
            by the CAS server, such as Path, HDFS, DNFS, LASR, Teradata, Greenplum,
            and Oracle.
          type: string
        version:
          description: The version of this object.
          type: integer
      required:
      - name
      - type
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.caslib
        version: 1
    caslibCreateRequest:
      title: Caslib Create Request
      description: Caslib definition and options related to creation of the Caslib.
      properties:
        caslib:
