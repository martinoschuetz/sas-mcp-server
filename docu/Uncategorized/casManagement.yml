            items:
              $ref: "#/components/schemas/casServerLoggerSummary"
    casServerLoggerSummary:
      title: CAS Server Logger Summary
      description: Summary information about a CAS server logger.
      properties:
        name:
          description: The name of the logger.
          type: string
        level:
          description: The level of the logger. Valid level values include info, warn,
            error, fatal, debug, and trace.
          type: string
        links:
          type: array
          description: The navigable links relative to this media type.
          items:
            $ref: "#/components/schemas/link"
        version:
          description: Version of the schema. This representation is version 1.
          type: integer
      required:
      - version
      - name
      - level
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.server.logger.summary
        version: 1
    casServerLogger:
      title: CAS Server Logger
      description: Detailed information about a CAS server logger.
      properties:
        name:
          description: The name of the logger.
          type: string
        level:
          description: The level of the logger. Valid level values include info, warn,
            error, fatal, debug, and trace.
          type: string
        applyToController:
          description: This property is used only when modifying logger settings.
            It is not returned when reading settings. If true, the change will apply
            both at the controller level and session level. If true, applyToNewSessions
            option is treated as true.
          type: boolean
        applyToNewSessions:
          description: This property is used only when modifying logger settings.
            It is not returned when reading settings. If true, the change will apply
            only to the current session, but will apply to newly created sessions
            on the CAS server. If false, the change will apply only to the current
            session, and will not apply to future sessions. Defaults to false if unspecified.
            If applyToController is set to true, then the change will always apply
            to new sessions, and applyToNewSessions property is ignored.
          type: boolean
        links:
          type: array
          description: The navigable links relative to this media type.
          items:
            $ref: "#/components/schemas/link"
        version:
          description: Version of the schema. This representation is version 1.
          type: integer
      required:
      - version
      - name
      - level
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.server.logger
        version: 1
    casPolicyCollection:
