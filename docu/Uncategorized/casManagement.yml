            $ref: "#/components/schemas/keyValueModel"
        links:
          type: array
          description: The navigable links relative to this media type.
          items:
            $ref: "#/components/schemas/link"
        version:
          description: Version of the schema. This representation is version 1.
          type: integer
      required:
      - version
      - name
      - type
      - attributes
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.server.policy.summary
        version: 1
    casServerPolicy:
      title: CAS Server Policy
      description: Detailed information about a CAS server policy.
      properties:
        name:
          description: The name of the policy.
          type: string
        type:
          description: The type of the policy. Valid type values include globalCaslibs,
            priorityLevels, and priorityAssignments.
          type: string
        attributes:
          description: List of key/value pairs for the attributes of the policy. See
            the CAS documentation for details about valid keys and values for each
            policy type.
          type: array
          items:
            $ref: "#/components/schemas/keyValueModel"
        links:
          type: array
          description: The navigable links relative to this media type.
          items:
            $ref: "#/components/schemas/link"
        version:
          description: Version of the schema. This representation is version 1.
          type: integer
      required:
      - version
      - name
      - type
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.server.policy
        version: 1
