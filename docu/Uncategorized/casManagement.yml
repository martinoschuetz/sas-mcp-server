          type: string
        owner:
          description: Owner of the session.
          type: string
        state:
          description: Connected state of the session. Valid values include Inactive,
            Connected, Disconnected, Exception, Terminate, Removed.
          type: string
        transactionState:
          description: State of transaction on the session. Valid values include started
