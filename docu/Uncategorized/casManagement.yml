  "/servers/{serverName}/caslibs/{caslibName}/tables":
    get:
      operationId: getTables
      summary: Get a list of tables
      description: >-
        Returns a collection of tables accessible by the CAS server in the
        Caslib. Tables in this context refer to both loaded CAS tables as well
        as unloaded source tables. - For path-based caslibs, the source table
        shown will be the first matching .sashdat, .sas7bdat, .parquet, or .csv file
        found, in that order, independent of case. - For non-path-based caslibs
        (such as DBMS libraries), the source table used will be the first
        matching source table name found, independent of case.

        Supports SAS standard paging query parameters. Supports SAS standard paging
        query parameters, sorting, and filtering. Schema of items returned in the
        response collection is included below, and are of type application/vnd.sas.cas.table+json.
      parameters:
      - name: serverName
        description: Server name for which tables are being requested.
        in: path
        required: true
        schema:
          type: string
      - name: caslibName
        description: The Caslib name for which tables are being requested.
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        description: Session ID (used when session-specific tables are also desired
          in results).
        in: query
        required: false
        schema:
          type: string
      - name: state
        description: Omitting this value includes both loaded and unloaded (source)
          tables in the result. Specifying a value here filters the results to tables
          that match a particular state. Valid values include loaded (loaded tables)
          and unloaded (unloaded tables).
        in: query
        required: false
        schema:
          type: string
      - name: scope
        description: Omitting this value includes tables of all scopes. Specifying
          a value here filters the results to tables that match a particular scope.
          Valid values include session and global.
        in: query
        required: false
        schema:
          type: string
      - name: sourcesOnly
        description: Determines whether source tables should be displayed. Defaults
          to false.
        in: query
        schema:
          type: boolean
      - name: excludeItemLinks
        description: Determines whether item links are excluded from results. Defaults
          to false.
        in: query
        schema:
          type: boolean
      - name: start
        description: The starting index of the first item in a page. Defaults to 0.
        in: query
        schema:
          type: integer
      - name: limit
        description: Maximum number of items to return in this page of results. The
          actual number of returned items can be less if the collection has been exhausted.
          Defaults to 10.
        in: query
        schema:
          type: integer
      - name: filter
        description: "Filter criteria for returned items. The valid filter fields\
          \ are the first-level fields in each item. The supported functions are and,\
          \ or, not, eq, lt, le, gt, ge, contains, startsWith, endsWith, and isNull.\
          \ Some sample queries: <ul> <li>Search by name: starting with filter=startsWith(name,\
          \ 'CAS')</li> <li>Search by name: filter=eq(name, 'CASUSER')</li> <li>Search\
          \ for multiple items: filter=in(name, 'CASUSER', 'Public')</li> </ul>"
        in: query
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        description: "Sort returned items. The sort criteria supports the first-level\
          \ fields in each item. Some sample sorts: <ul> <li>Sort by ascending name:\
          \ sortBy=name:ascending</li> <li>Sort by descending name: sortBy=name:descending</li>\
          \ </ul> The default sort is by name in ascending order."
        in: query
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. The list of tables for the requested
            CAS server, CAS library, and optional session was returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/tableCollection"
              examples:
                tableCollection:
                  $ref: "#/components/examples/tableCollectionExample"
            application/json:
              schema:
                $ref: "#/components/schemas/tableCollection"
              examples:
                tableCollection:
                  $ref: "#/components/examples/tableCollectionExample"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The requested CAS server or Caslib does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
      tags:
      - Tables
    post:
      operationId: uploadTable
      summary: Upload a data file to the collection of tables
      description: Uploads a data file to the table collections using a multipart
        form-data post. Supported data files are csv, xls, xlsx/xlsm, sas7bdat and
        sashdat.
      parameters:
      - name: serverName
        description: Server name for which tables are being requested.
        in: path
        required: true
        schema:
          type: string
      - name: caslibName
        description: The Caslib name for which tables are being requested.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                sessionId:
                  description: Session ID (used when session-specific tables are also
                    desired in results).
                  type: string
                tableName:
                  description: The name of the table to be created.
                  type: string
                variables:
                  description: >-
                    The optional list of variables and their attributes, in JSON
                    format. The value is a single string containing a JSON array
                    of variable objects, each describing a variable and one or
                    more of its attributes. When not specified, the best guess
                    for column attributes will be made.  When uploading csv data,
                    containsHeaderRow should be set to true and a header row provided
                    to ensure column names are properly set.  This option then further
                    sets attributes of those columns.

                    Each variable in the array may have one or more of the following
                    properties.

                    <table> <tr><th>Property</th><th>Type</th><th>Description</th></tr>
                    <tr><td>name <b>(required)</b></td><td>string</td><td>specifies
                    the name for the variable.</td></tr> <tr><td>label</td><td>string</td><td>specifies
                    the descriptive label for the variable.</td></tr> <tr><td>type</td><td>string</td><td>specifies
                    the data type for the variable.  Sample values include BINARY,
                    CHAR, DATE, DATETIME, DECQUAD, DECSEXT, DOUBLE, INT32, INT64,
                    TIME, VARBINARY, VARCHAR.</td></tr> <tr><td>format</td><td>string</td><td>specifies
                    the format to apply to the variable.</td></tr> <tr><td>length</td><td>integer</td><td>specifies
                    the unformatted length of the variable. This parameter applies
                    to fixed-length character variables (type="CHAR") only. The value
                    must be a positive integer greater than 0.</td></tr> <tr><td>formattedLength</td><td>integer</td><td>specifies
                    the length of format field plus the length of the format precision.</td></tr>
                    </table> A simple sample value is included below. <table> <tr><th>Sample
                    value</th></tr> <tr><td>[ {"name":"Make","type":"VARCHAR"}, {"name":"Model","type":"VARCHAR"},
                    {"name":"Type","type":"VARCHAR"}, {"name":"Origin","type":"VARCHAR"},
                    {"name":"Drive train","type":"VARCHAR"}, {"name":"MSRP","type":"VARCHAR",
                    "format":"DOLLAR8."}, {"name":"Invoice","type":"VARCHAR", "format":"DOLLAR8."},
                    {"name":"Engine Size","type":"DOUBLE"}, {"name":"Cylinders","type":"INT32"},
                    {"name":"Horsepower","type":"INT32"}, {"name":"City MPG","type":"INT32"},
                    {"name":"Highway MPG","type":"INT32"}, {"name":"Weight","type":"INT32"},
                    {"name":"Wheelbase","type":"INT32"}, {"name":"Length","type":"INT32"}
                    ]</td></tr> </table>
                  type: string
                indexVars:
                  description: An optional list of variables in the uploaded data.
                    The corresponding variables in the resulting table are marked
                    as indexed. The parameter is valid for csv, xls, and xlsx files
                    only.
                  type: array
                  items:
                    type: string
                format:
                  description: Format of the data file. The supported formats are
                    csv, xls, xlsx, sas7bdat and sashdat.
                  type: string
                label:
                  description: Label placed on the new table.
                  type: string
                scope:
                  description: The scope to which to load the table. Valid values
                    include global and session. Defaults to global.
                  type: string
                replace:
                  description: If true, any pre-existing table with the same name
                    will be replaced. Defaults to false.
                  type: boolean
                encoding:
                  description: Encoding of the file contents. The parameter is valid
                    for CSV files only. Defaults to utf-8.
                  type: string
                allowTruncation:
                  description: Allow truncation of character data that is too long
                    for a given field. The parameter is valid for CSV files only.
                    Defaults to true.
                  type: boolean
                allowEmbeddedNewLines:
                  description: Preserves new lines that are embedded in text fields.
                    The parameter is valid for CSV files only. Defaults to false.
                  type: boolean
                delimiter:
                  description: Delimiter character. The parameter is valid for CSV
                    files only. Defaults to ','.
                  type: string
                varchars:
                  description: Use variable character lengths. The parameter is valid
                    for CSV files only. Defaults to true.
                  type: boolean
                scanRows:
                  description: Number of rows to scan when determining column types.
                    The parameter is valid for CSV files only. Default is 20. Set
                    to zero to scan all rows in the file.
                  type: integer
                  format: int64
                threadCount:
                  description: Number of threads to use on each CAS node to process
                    the CSV data. The parameter is valid for CSV files only. Default
                    is one thread per licensed CPU. Set to 0 to use the default.
                  type: integer
                  format: int64
                stripBlanks:
                  description: If true, remove leading and trailing blanks from character
                    variables. The parameter is valid for CSV files only. Defaults
                    to false.
                  type: boolean
                containsHeaderRow:
                  description: If true, first row is used for column names. The parameter
                    is valid for csv, xls and xlsx files only. Defaults to false.
                  type: boolean
                sheetName:
                  description: Specifies the name of worksheet to import from a Microsoft
                    Excel file. The parameter is valid for xls and xlsx files only.
                    If no sheet name is specified, the first sheet is used.
                  type: string
                password:
                  description: Password used to read a protected SAS data set. The
                    parameter is valid for sas7bdat files only.
                  type: string
                decryptionKey:
                  description: Key used to decrypt the data file. The parameter is
                    valid for sas7bdat and sashdat files only.
                  type: string
                stringLengthMultiplier:
                  description: Specifies to increase the width of fixed-byte-width
                    character columns. The number of bytes needed for multi-byte characters
                    depends on the particular characters in the string. The parameter
                    is valid for sas7bdat files only.
                  type: integer
                  format: double
                varcharConversionThreshold:
                  description: Sets a threshold in bytes so that columns of type 'char'
                    whose length meets or exceeds the threshold are converted to type
                    'varchar'. For example, if varcharConversionThreshold=20, a 'char'
                    column of length 20 is converted to 'varchar' but a 'char' column
                    of length 19 is not converted. The parameter is valid for sas7bdat
                    files only.
                  type: integer
                  format: double
                varcharConversion:
                  description: Acts as an alias for varcharConversionThreshold. If
                    both varcharConversion and varcharConversionThreshold are provided,
                    the value of varcharConversionThreshold will be used. The parameter
                    is valid for sas7bdat files only.
                  type: integer
                  format: double
                file:
                  description: Data file in one of the supported formats. This MUST
                    be the last parameter.
                  type: string
                  format: binary
              required:
              - tableName
              - format
              - file
      responses:
        "201":
          description: The list of newly uploaded tables was returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/tableDetails"
              examples:
