    casLoadRequest:
      title: CAS Load Request
      description: Inputs when loading a source table or file to a CAS table.
      properties:
        copies:
          description: Number of copies to create in memory. Defaults to 1.
          type: integer
        label:
          description: Label to use on the output table.
          type: string
        outputCaslibName:
          description: Name of the output caslib to which the source table or external
            file will be loaded. If not specified, defaults to the caslib name containing
            the table to be loaded.
          type: string
        outputTableName:
          description: Name of the output CAS table. If not specified, defaults to
            the same name as the table being loaded.
          type: string
        parameters:
          description: "A name and value pair map of additional parameters to pass\
            \ when performing the load. These parameters generally are passed directly\
            \ to the Caslib source as part of the load operation and are specific\
            \ to the source type. Exceptions include the following parameters, which\
            \ are passed directly to the load operation: * importOptions * groupBy\
            \ * orderBy * vars See the CAS action documentation for loadTable for\
            \ more information about the valid parameter values."
          type: object
        replace:
          description: If true, any pre-existing table with the same name is replaced.
            Defaults to false. Note that already-loaded global tables cannot be replaced.
          type: boolean
        replaceMode:
          description: "When replace is true, the replace mode to use when the table\
            \ is already at loaded state. Valid values include: * always - always\
            \ replace * newer - replace only if the source table is newer than the\
            \ last time the table was loaded If omitted, defaults to always."
          type: string
        scope:
          description: Scope to which to load the table. Valid values include \session\
            and \global\. Defaults to \global\.
          type: string
      required:
      - outputCaslibName
      - outputTableName
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.table.load.request
        version: 2
    casSaveRequest:
      title: CAS Save Request
      description: Inputs when saving a CAS table to a source table or external file.
      type: object
      properties:
        caslibName:
          description: Name of the output caslib to which the source table or external
            file will be written. If not specified, defaults to the caslib name containing
            the table to be saved.
          type: string
        format:
          description: Format of the output file. Valid values include *sashdat*,
            *csv*, *parquet*, *sas7bdat*. Defaults to sashdat.
          type: string
        replace:
          description: If true, any pre-existing table with the same name is replaced.
            Defaults to false.
          type: boolean
        compress:
          description: If true and saving to a sashdat, the saved table is compressed.
            Defaults to false.
          type: boolean
        tableName:
          description: Name of the output table or external file. If specified, this
            name is always used. The file extension will always honor the format requested
            (or default to sashdat). If this parameter is not specified, the name
            defaults to the same name as the source of the table being saved, provided
            it differs in case only from the name of the table being saved. If no
            source table name is available, then the name will be the same as the
            table. The following table shows sample scenarios and the value chosen
            by default for the tableName when this parameter is omitted. <table> <tr><th>table</th><th>state</th><th>source</th><th>format</th><th>default
            tableName</th></tr> <tr><td>MOREDATA</td><td>loaded</td><td></td><td>sashdat</td><td>MOREDATA.sashdat</td></tr>
            <tr><td>MYDATA</td><td>loaded</td><td>MyData.sashdat</td><td></td><td>MyData.sashdat</td></tr>
            <tr><td>MYDATA</td><td>loaded</td><td>MyData.sashdat</td><td>csv</td><td>MyData.csv</td></tr>
            <tr><td>DATA2</td><td>unloaded</td><td>data2.csv</td><td></td><td>data2.sashdat</td></tr>
            <tr><td>DATA3</td><td>unloaded</td><td>data3.csv</td><td>csv</td><td>data3.csv</td></tr>
            <tr><td>DATA4</td><td>loaded</td><td>OtherData.csv</td><td></td><td>DATA4.sashdat</td></tr>
            <tr><td>DATA5</td><td>unloaded</td><td>OtherData.csv</td><td>csv</td><td>DATA5.csv</td></tr>
            </table>
          type: string
        sourceTableName:
          description: Normally, the source table name for an unloaded table is determined
            automatically and this option is not required. If specified, this specific
            source table name is used as the source data to read for the save table
            operation.
          type: string
        parameters:
          description: "A name/value pair map of additional parameters to pass when\
            \ performing the save in the event that the table being saved is not already\
            \ in memory as a CAS table and needs to be accessed from the source. These\
            \ parameters generally are passed directly to the caslib source when accessing\
            \ the data and are specific to the source type. Exceptions include the\
            \ following parameters, which are passed directly to the Save operation:\
            \ * importOptions * groupBy * orderBy * vars See the CAS action documentation\
            \ for saveTable for details about the valid parameter values."
          type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.table.save.request
        version: 2
    casTableCreateRequest:
