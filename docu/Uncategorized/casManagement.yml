        description: The Caslib name whose source contains the table.
        in: path
        required: true
        schema:
          type: string
      - name: tableName
        description: The table name to be deleted.
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        description: Session ID (used when a session specific Caslib is being accessed).
        in: query
        required: false
        schema:
          type: string
      - name: sourceTableName
        description: The source file name to delete. This name should be the sourceTableName
          returned by a GET on this table resource. In general, it must be a possible
          source file for the table being referenced. For example, if the URL references
          the table MYTABLE, deletion of yourtable.sashdat would not be allowed, but
          deletion of MyTable.sashdat would be permitted. Deletion of the source table
          for non-path-based caslibs is not supported.
        in: query
        required: true
        schema:
          type: string
