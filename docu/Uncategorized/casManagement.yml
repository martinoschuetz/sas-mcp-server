      - required:
        - items
      - properties:
          items:
            type: array
            description: An array containing policy resources.
            items:
              $ref: "#/components/schemas/casServerPolicySummary"
    casServerPolicySummary:
      title: CAS Server Policy Summary
      description: Summary information about a CAS server policy.
