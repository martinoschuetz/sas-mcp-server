          type: boolean
        permission:
          description: If the directory is being created, determines the permission
            to set on the filesystem directory. Valid values include GROUPREAD, GROUPWRITE,
            GROUPWRITEPUBLICREAD, PRIVATE, PUBLICREAD, and PUBLICWRITE.
          type: string
        version:
          description: The version of this object.
          type: integer
      required:
      - caslib
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.caslib.create.request
        version: 1
    keyValueModel:
      title: Key/Value Array
      description: An array of key/object pairs related to Caslib type-specific settings.
        Supports simple object types (string, boolean, integer, long) as well as nested
        arrays. See reference documentation for specific Caslib types to determine
        proper key/object pairs for defining a specific Caslib.
      allOf:
      - properties:
          key:
            type: string
            description: The key name.
          value:
            type: object
            description: The value of the key.
        required:
        - key
        type: object
    attributesMap:
      title: Attributes Nap
      description: The settings for this service.
      type: object
      properties:
        application:
          $ref: "#/components/schemas/applicationCaslib"
        default:
          $ref: "#/components/schemas/defaultCaslib"
        reference:
          $ref: "#/components/schemas/referenceCaslib"
        system:
          $ref: "#/components/schemas/systemCaslib"
        tempTablesCopiesCount:
          type: integer
          description: The number of extra copies of temporary tables.
        fileUploadEnabled:
          type: boolean
          description: The setting used to enable/disable local file uploads.
        maxFileUploadSize:
          type: integer
          description: The maximum file size in megabytes allowed for local file uploads.
            A value of -1 indicates no size limit.
    applicationCaslib:
      title: Application Caslib
      description: The CAS server and Caslib containing application data, such as
        map data.
      type: object
      properties:
        casServer:
          type: string
          description: The name of the CAS server.
        caslib:
          type: string
          description: The name of the CAS library.
    defaultCaslib:
      title: Default Caslib
      description: The default CAS server and Caslib for users.
      type: object
      properties:
        casServer:
          type: string
          description: The name of the CAS server.
        caslib:
          type: string
          description: The name of the CAS library.
    referenceCaslib:
      title: Reference Caslib
      description: The CAS server and Caslib containing reference data.
      type: object
      properties:
        casServer:
          type: string
          description: The name of the CAS server.
        caslib:
          type: string
          description: The name of the CAS library.
    systemCaslib:
      title: System Caslib
      description: The CAS server and Caslib used by the system for data produced
        during normal operation, such as audit records and monitoring data
      type: object
      properties:
        casServer:
          type: string
          description: The name of the CAS server.
        caslib:
          type: string
          description: The name of the CAS library.
    settings:
      title: CAS Management Service Settings
      description: The settings exposed for commons usage patterns of CAS servers.
      x-sas-media-type:
        name: application/vnd.sas.attributes
        version: 1
      required:
      - version
      - links
      - attributes
      properties:
        version:
          type: integer
          description: Version information for this attribute list.
        links:
          type: array
          description: The navigable links relative to this media type.
          items:
            $ref: "#/components/schemas/link"
        attributes:
          $ref: "#/components/schemas/attributesMap"
    stringArray:
      title: String Array
      description: An array of tag values set on the server.
      type: object
      allOf:
      - properties:
          value:
            type: string
            description: An individual string value.
        required:
        - value
        type: object
    tableCollection:
      title: Tables Collection
      description: The list of tables for the requested CAS server and optional session.
        A table represents both the CAS table as well as information about the source
        file or table with which it is associated.
      type: object
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
      - required:
        - items
      - properties:
          items:
            type: array
            description: An array containing table resources.
            items:
              $ref: "#/components/schemas/tableDetails"
    tableDetails:
      title: Table Details
      description: Detailed information about a table.
      properties:
        attributes:
          description: List of key/object pairs for additional attributes of the source
            table. For example, a path-based CAS library can include attributes for
            file system attributes, like owner, group, time, permission, or size as
            reported by the underlying filesystem.
          type: object
        characterSet:
          description: Character set of the table.
          type: string
        columnCount:
          description: Number of columns in the table.
          format: int64
          type: integer
        created:
          description: Date created represented as a string.
          type: string
        createdBy:
          description: User who created the table in memory. This is the last user
            who changed the state of the table to 'loaded'.
          type: string
        encoding:
          description: Encoding of the table.
          type: string
        lastModified:
          description: Date last modified represented as a string.
          type: string
        lastModifiedBy:
          description: User who last modified the loaded table in memory. This value
            is returned only if the in-memory table has been modified. Otherwise,
            the table has not been modified since loaded by the 'createdBy' user.
          type: string
        lastAccessed:
          description: For loaded tables, the date last accessed is represented as
            a string.
          type: string
        sourceLastModified:
          description: Date the source file or table was last modified (when available).
          type: string
        label:
          description: Label of the table, if available.
          type: string
        name:
          description: Name of the table.
          type: string
        repeated:
          description: True if the table is repeated.
          type: boolean
        rowCount:
          description: Number of rows in the table. Depending upon the cost of obtaining
            this value, it can be omitted in some cases.
          format: int64
          type: integer
        disconnected:
          description: Whether the table is disconnected from its original source
            or not. If value is true, then permissions set on this table will not
            be set on the original/underlying table.
          type: boolean
        scope:
          description: For a table with state of loaded, the scope of the loaded table.
            Valid values are session or global.
          type: string
        state:
          description: Indicates whether a table is loaded into CAS. Valid values
            are loaded or unloaded.
          type: string
        tableReference:
          $ref: "#/components/schemas/casTableReference"
      required:
      - name
      - state
      - scope
      - characterSet
      - encoding
      - columnCount
      - created
      - lastModified
      - createdBy
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.table
        version: 3
    casServerNodeCollection:
