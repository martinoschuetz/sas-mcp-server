---
openapi: 3.0.3
info:
  title: CAS Management
  description: The CAS Management API enables users to manage and perform actions
    on common resources related to Cloud Analytic Services (CAS).
  version: "10"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
tags:
- name: Root
  description: Contains operations for the root resource.
- name: Servers
  description: Contains operations to manage CAS servers.
- name: Sessions
  description: Contains operations to create and manage CAS server sessions.
- name: Caslibs
  description: Contains operations to create and manage caslibs.
- name: Nodes
  description: Contains operations to create and manage worker nodes on a CAS server.
- name: Sources
  description: Contains operations to return information about data sources.
- name: Tables
  description: Contains operations to create and manage tables in a caslib.
- name: Columns
  description: Contains operations to return information from columns in a table.
- name: Provider
  description: Contains operations for data table providers.
- name: Loggers
  description: Contains operations to create and manage loggers for a CAS server.
- name: Policies
  description: Contains operations to create and manage policies on a CAS server.
- name: Settings
  description: Contains operations to return settings information.
paths:
  /:
    get:
      operationId: root
      summary: Get API resource links
      description: Returns API information. Produces application/json and application/vnd.sas.api+json.
      responses:
        "200":
          description: Version information about the API, as well as top level API
            entry points.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
      tags:
      - Root
    head:
      operationId: headersForRoot
      summary: Check availability of API
      description: Returns whether the CAS Management service is running or not. This
        is identical to a GET request but returns only the HTTP headers with no document
        body.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded. Service is running and available.
  "/dataSources/{dataTableProviderId}/tables":
    get:
      operationId: getTablesProvider
      summary: Get a collection of tables
      description: Returns a collection of tables as application/vnd.sas.data.table
        or application/vnd.sas.data.table.summary. Supports both loaded and unloaded
        tables.
      parameters:
      - name: start
        description: The starting index of the first item in a page. Defaults to 0.
        in: query
        schema:
          type: integer
      - name: limit
        description: Maximum number of items to return in this page of results. The
          actual number of returned items can be less if the collection has been exhausted.
          Defaults to 10.
        in: query
        schema:
          type: integer
      - name: dataTableProviderId
        description: See Data Tables API documentation for details about dataTableProviderId.
          A sample value is `cas~fs~serverName~fs~caslibName`.
        in: path
        required: true
        schema:
          type: string
      - name: Accept-Item
        description: "The desired representation. The Accept-Item options are: <ul>\
          \ <li>application/vnd.sas.data.table+json</li> <li>application/vnd.sas.data.table.summary+json</li>\
          \ <li>blank</li> </ul> If the Accept-Item header is not provided, then the\
          \ application/vnd.sas.data.source+json representation will be returned."
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.table.summary+json
          - application/vnd.sas.data.table+json
      - name: loaded
        description: Determines whether loaded tables are *included* in the results.
          Defaults to *true*. Note that a value of *false* does not imply that source
          tables should be included, only that loaded tables should be excluded.
        in: query
        required: false
        schema:
          type: boolean
      - name: scope
        description: "When loaded tables are included, determines which loaded tables\
          \ are returned. Valid values include: - *all* Includes tables in both session\
          \ scope and global scope - *global* Includes tables only in a global scope\
          \ Defaults to *all*."
        in: query
        required: false
        schema:
          type: string
      - name: sources
        description: Determines whether source tables are *included* in the results.
          Defaults to *true*. Note that a value of *false* does not imply that loaded
          tables should be included, only that source tables should be excluded.
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: The request succeeded. The list of tables was returned.
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The requested CAS server or Caslib does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
      tags:
      - Provider
  "/dataTables/dataSources/{dataTableProviderId}/tables/{tableName}":
    get:
      operationId: getTableProvider
      summary: Get a table
      description: Returns a specific table. Supports both loaded and unloaded tables.
      parameters:
      - name: dataTableProviderId
        description: See Data Tables API documentation for details about dataTableProviderId.
          A sample value is `cas~fs~serverName~fs~caslibName`.
        in: path
        required: true
        schema:
          type: string
      - name: tableName
        description: The name of the table.
        in: path
        required: true
        schema:
          type: string
      - name: loaded
        description: Determines whether a loaded table is included in the results.
          Defaults to *true*. Note that a value of *false* does not imply that a source
          table should be included, only that a loaded table should be excluded.
        in: query
        required: false
        schema:
          type: boolean
      - name: scope
        description: "When a loaded table is included, determines which loaded table\
          \ is returned. Valid values include: <ul> <li>all - Includes tables in both\
          \ session scope and global scope</li> <li>global - Includes tables only\
          \ in a global scope</li> </ul> Defaults to *all*."
        in: query
        required: false
        schema:
          type: string
      - name: sources
        description: Determines whether a source table is *included* in the results.
          Defaults to *true*. Note that a value of *false* does not imply that a loaded
          table should be included, only that a source table should be excluded.
        in: query
        required: false
        schema:
          type: boolean
      - name: detailGroups
        description: "A comma-separated list of detail groups to return in the representation.\
          \ Some detail groups require more time to retrieve. This parameter allows\
          \ opting-in to the following detail groups in cases where they are not already\
          \ included: <ul> <li>all - Include all detail groups</li> <li>unloaded Columns\
          \ - Include column counts for unloaded tables. This information is retrieved\
          \ if available from the source.</li> <li>unloadedRows - Include row counts\
          \ for unloaded tables. This information is retrieved if available from the\
          \ source. Row counts from HDFS are not provided.</li> </ul>"
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - all
            - unloadedColumns
            - unloadedRows
      responses:
        "200":
          description: The request succeeded. The list of tables was returned.
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.data.table+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.data.table.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The requested CAS server or Caslib does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
      tags:
      - Provider
  /commons/settings:
    get:
      operationId: getSettings
      summary: Get the shared API settings
      description: Returns the possible settings that this API shares.
      tags:
      - Settings
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.attributes+json:
              schema:
                $ref: "#/components/schemas/settings"
              examples:
                settings:
                  $ref: "#/components/examples/settingsExample"
            application/json:
              schema:
                $ref: "#/components/schemas/settings"
              examples:
                settings:
                  $ref: "#/components/examples/settingsExample"
  /servers:
    get:
      operationId: getServers
      summary: Get a list of CAS servers
      description: Returns a collection of CAS servers. Supports SAS standard paging
        query parameters, sorting, and filtering. Schema of items returned in the
        response collection is included below, and are of type application/vnd.sas.cas.server+json.
      parameters:
      - name: start
        description: The starting index of the first item in a page. Defaults to 0.
        in: query
        schema:
          type: integer
      - name: limit
        description: Maximum number of items to return in this page of results. The
          actual number of returned items can be less if the collection has been exhausted.
          Defaults to 10.
        in: query
        schema:
          type: integer
      - name: filter
        description: "Filter criteria for returned items. The valid filter fields\
          \ are the first-level fields in each item. The supported functions are and,\
          \ or, not, eq, lt, le, gt, ge, contains, startsWith, endsWith, and isNull.\
          \ Some sample queries: <ul> <li>Search by name starting with: filter=startsWith(name,\
          \ 'cas')</li> <li>Search by name: filter=eq(name, 'cas-shared-default')</li>\
          \ <li>Search for multiple items: filter=in(name, 'cas-shared-default', 'cas-host-default')</li>\
          \ </ul>"
        in: query
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        description: "Sort returned items. The sort criteria supports the first-level\
          \ fields in each item. Some sample sorts: <ul> <li>Sort by ascending name:\
          \ sortBy=name:ascending</li> <li>Sort by descending name: sortBy=name:descending</li>\
          \ </ul> The default sort is by name in ascending order."
        in: query
        schema:
          type: string
          format: sort-criteria
      - name: excludeItemLinks
        description: Determines whether item links are excluded from results. Defaults
          to false.
        in: query
        schema:
          type: boolean
      responses:
        "200":
          description: The request succeeded. The collection of CAS servers was returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/casServerCollection"
              examples:
                casServerCollection:
                  $ref: "#/components/examples/casServerCollectionExample"
            application/json:
              schema:
                $ref: "#/components/schemas/casServerCollection"
              examples:
                casServerCollection:
                  $ref: "#/components/examples/casServerCollectionExample"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The requested CAS server does not exist.
      tags:
      - Servers
  "/servers/{serverName}":
    get:
      operationId: getServer
      summary: Get a CAS server
      description: Returns a specific CAS server definition.
      parameters:
      - name: serverName
        description: The name of the server.
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The CAS server definition was returned
          content:
            application/vnd.sas.cas.server+json:
              schema:
                $ref: "#/components/schemas/casServer"
              examples:
                casServer:
                  $ref: "#/components/examples/casServerExample"
            application/json:
              schema:
                $ref: "#/components/schemas/casServer"
              examples:
                casServer:
                  $ref: "#/components/examples/casServerExample"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.cas.server+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The requested CAS server does not exist.
      tags:
      - Servers
  "/servers/{serverName}/caslibs":
    get:
      operationId: getCaslibs
      summary: Get a list of caslibs
      description: Returns a collection of caslibs available on the CAS server. Supports
        SAS standard paging query parameters, sorting, and filtering. This is a generic
        call for obtaining Caslib information. Since Caslib data source content varies
        widely depending on the attributes of a given data source, the information
        is returned as application/vnd.sas.cas.caslib+json, containing key/value pairs
        as returned from CAS. For specifics on a given Caslib data source type and
        its attributes, see the CAS libraries documentation. Schema of items returned
        in the response collection is included below, and are of type application/vnd.sas.cas.caslib+json.
      parameters:
      - name: serverName
        description: Server name for which caslibs are being requested.
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        description: Session ID (used when session-specific caslibs are also desired
          in results).
        in: query
        required: false
        schema:
          type: string
      - name: includeHidden
        description: Determines whether caslibs marked as hidden should be included
          in the results. Defaults to false.
        in: query
        required: false
        schema:
          type: boolean
      - name: start
        description: The starting index of the first item in a page. Defaults to 0.
        in: query
        schema:
          type: integer
      - name: limit
        description: Maximum number of items to return in this page of results. The
          actual number of returned items can be less if the collection has been exhausted.
          Defaults to 10.
        in: query
        schema:
          type: integer
      - name: filter
        description: "Filter criteria for returned items. The valid filter fields\
          \ are the first-level fields in each item. The supported functions are and,\
          \ or, not, eq, lt, le, gt, ge, contains, startsWith, endsWith, and isNull.\
          \ Some sample queries: <ul> <li>Search by name starting with: filter=startsWith(name,\
          \ 'CAS')</li> <li>Search by name: filter=eq(name, 'CASUSER')</li> <li>Search\
          \ for multiple items: filter=in(name, 'CASUSER', 'Public')</li> </ul>"
        in: query
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        description: "Sort returned items. The sort criteria supports the first-level\
          \ fields in each item. Some sample sorts: <ul> <li>Sort by ascending name:\
          \ sortBy=name:ascending</li> <li>Sort by descending name: sortBy=name:descending</li>\
          \ </ul> The default sort is by name in ascending order."
        in: query
        schema:
          type: string
          format: sort-criteria
      - name: excludeItemLinks
        description: Determines whether item links are excluded from results. Defaults
          to false.
        in: query
        schema:
          type: boolean
      responses:
        "200":
          description: The request was successful.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/caslibCollection"
              examples:
                caslibCollection:
                  $ref: "#/components/examples/caslibCollectionExample"
            application/json:
              schema:
                $ref: "#/components/schemas/caslibCollection"
              examples:
                caslibCollection:
                  $ref: "#/components/examples/caslibCollectionExample"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The requested CAS server or Caslib does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
      tags:
      - Caslibs
    post:
      operationId: createCaslib
      summary: Create a Caslib
      description: Defines a new caslib.
      parameters:
      - name: serverName
        description: Server name for which caslibs should be defined.
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        description: Session ID (useful when session-specific Caslib is desired).
        in: query
        required: false
        schema:
          type: string
      - name: createDirectory
        description: When creating a path-based Caslib, this parameter indicates whether
          the leaf-node of the path referenced by the Caslib. Should be created if
          it does not already exist. Applicable when creating a path-based Caslib.
          Defaults to false.
        in: query
        required: false
        schema:
          type: boolean
      requestBody:
        $ref: "#/components/requestBodies/caslib"
      responses:
        "201":
          description: The Caslib was defined successfully. Information about the
            defined Caslib is returned. Note that links are returned only for GET
            calls, and are not included in the POST response (though listed here so
            that endpoints in this documentation can share the same schema definition).
          headers:
            Location:
              description: The location of the newly created resource.
              schema:
                type: string
          content:
            application/vnd.sas.cas.caslib+json:
              schema:
                $ref: "#/components/schemas/caslib"
              examples:
                caslib:
                  $ref: "#/components/examples/caslibExample"
            application/json:
              schema:
                $ref: "#/components/schemas/caslib"
              examples:
                caslib:
                  $ref: "#/components/examples/caslibExample"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.cas.caslib+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The requested CAS server does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
      tags:
      - Caslibs
  "/servers/{serverName}/caslibs#advanced":
    post:
      operationId: createCaslibAdvanced
      summary: Create a Caslib with advanced options
      description: "Defines a new Caslib using more advanced options. Note: If present,\
        \ remove '#advanced' from the URL before submitting."
      parameters:
      - name: serverName
        description: Server name for which caslibs should be defined.
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        description: Session ID (useful when session-specific Caslib is desired).
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.cas.caslib.create.request+json:
            schema:
              $ref: "#/components/schemas/caslibCreateRequest"
            examples:
              caslibCreateRequest:
                $ref: "#/components/examples/caslibCreateRequestExample"
          application/json:
            schema:
              $ref: "#/components/schemas/caslibCreateRequest"
            examples:
              caslibCreateRequest:
                $ref: "#/components/examples/caslibCreateRequestExample"
      responses:
        "201":
          description: The Caslib was defined successfully. Information about the
            defined Caslib is returned. Note that links are returned only for GET
            calls, and are not included in the POST response (though listed here so
            that endpoints in this documentation can share the same schema definition).
          content:
            application/vnd.sas.cas.caslib+json:
              schema:
                $ref: "#/components/schemas/caslib"
              examples:
                caslib:
                  $ref: "#/components/examples/caslibExample"
            application/json:
              schema:
                $ref: "#/components/schemas/caslib"
              examples:
                caslib:
                  $ref: "#/components/examples/caslibExample"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.cas.caslib+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The requested CAS server does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
      tags:
      - Caslibs
  "/servers/{serverName}/caslibs/{caslibName}":
    delete:
      operationId: deleteCaslib
      summary: Remove a Caslib definition
      description: Removes a Caslib definition.
      parameters:
      - name: serverName
        description: Server name containing the Caslib.
        in: path
        required: true
        schema:
          type: string
      - name: caslibName
        description: The Caslib name on which to perform the operation.
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        description: Session ID on which to perform the operation.
        in: query
        required: false
        schema:
          type: string
      - name: deleteDirectory
        description: Set to true to also remove the caslib backing directory for path-based
          caslibs (if empty). Defaults to false.
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "204":
          description: The Caslib definition was removed.
        "400":
          description: The request parameters were invalid.
        "404":
          description: The requested CAS server or Caslib does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
      tags:
      - Caslibs
    get:
      operationId: getCaslib
      summary: Get a Caslib
      description: Retrieves a single Caslib.
      parameters:
      - name: serverName
        description: Server name containing the caslibs being requested.
        in: path
        required: true
        schema:
          type: string
      - name: caslibName
        description: The Caslib name being requested.
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        description: Session ID (used when a session-specific Caslib is being requested).
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. Information about the requested Caslib
            was returned.
          content:
            application/vnd.sas.cas.caslib+json:
              schema:
                $ref: "#/components/schemas/caslib"
              examples:
                caslib:
                  $ref: "#/components/examples/caslibExample"
            application/json:
              schema:
                $ref: "#/components/schemas/caslib"
              examples:
                caslib:
                  $ref: "#/components/examples/caslibExample"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.cas.caslib+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The requested CAS server or Caslib does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
      tags:
      - Caslibs
    patch:
      operationId: patchCaslib
      summary: Edit a global Caslib
      description: "Edits properties of an existing global Caslib. Session Caslib\
        \ properties cannot be edited. Editable properties include the following:\
        \ * description * path"
      parameters:
      - name: serverName
        description: Server name containing the global Caslib to be edited.
        in: path
        required: true
        schema:
          type: string
      - name: caslibName
        description: The name of the global Caslib to be edited.
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        description: Session ID. Note that editing session-based caslibs is not supported.
          Passing sessionId is provided to avoid creating a new CAS session, improving
          performance of the call.
        in: query
        required: false
        schema:
          type: string
      - name: createDirectory
        description: Indicates whether the leaf subdirectory of the path specified
          should be created when changing the path. If set to true, the directory
          will be created if it does not exist. Defaults to false.
        in: query
        required: false
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/caslib"
      responses:
        "200":
          description: The Caslib was edited successfully.
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.cas.caslib+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The requested CAS server or Caslib does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
        "412":
          description: Precondition Failed.
          content:
            application/vnd.sas.cas.caslib+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      tags:
      - Caslibs
  "/servers/{serverName}/caslibs/{caslibName}/sources":
    get:
      operationId: getSources
      summary: Get a list of source files or tables
      description: Returns a collection of source files or tables accessible through
        the data source defined for the Caslib. For path-based caslibs, this list
        will include files in the file system. For non-path-based caslibs, such as
        database data sources, this list will include database tables. The list is
        returned without regard to the loaded or unloaded state of the source file
        or table. Sorting and filtering are not supported. SAS standard paging query
        parameters are supported. Schema of items returned in the response collection
        is included below, and are of type application/vnd.sas.cas.source.table+json.
      parameters:
      - name: serverName
        description: Server name for which source tables are being requested.
        in: path
        required: true
        schema:
          type: string
      - name: caslibName
        description: The Caslib name for which source tables are being requested.
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        description: Session ID (used when session-specific tables are also desired
          in results).
        in: query
        required: false
        schema:
          type: string
