          type: string
        type:
          description: The type of the column.  Valid values are CHAR, NUM, VARCHAR.
          type: string
        label:
          description: The label of the column.
          type: string
        format:
          description: The format of the column.
          type: string
        formattedLength:
          description: The formatted length of the column.
          type: integer
        numberFormatLength:
          description: The value of the numberFormatLength setting on the column.
          type: integer
        numberFormatDecimals:
          description: The value of the numberFormatDecimals setting on the column.
          type: integer
        rawLength:
