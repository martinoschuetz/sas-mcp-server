            schema:
              $ref: "#/components/schemas/casServerPolicy"
            examples:
              casServerPolicy:
                $ref: "#/components/examples/casServerPolicyExample"
        description: Fields to update in the existing policy.
        required: true
      responses:
        "200":
          description: Updated information for the specified policy was returned.
          content:
            application/vnd.sas.cas.server.policy+json:
              schema:
                $ref: "#/components/schemas/casServerPolicy"
              examples:
                casServerPolicy:
                  $ref: "#/components/examples/casServerPolicyExample"
            application/json:
              schema:
                $ref: "#/components/schemas/casServerPolicy"
              examples:
                casServerPolicy:
                  $ref: "#/components/examples/casServerPolicyExample"
        "304":
          description: The policy was not modified.
        "400":
          description: An error occurred.
          content:
            application/vnd.sas.cas.server.policy+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Either the server name does not exist, or the policy for which
            an update is requested does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
        "412":
          description: Precondition Failed.
          content:
            application/vnd.sas.cas.server.policy+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      tags:
      - Policies
    delete:
      operationId: deletePolicy
      summary: Remove a policy
      description: Removes a policy from a CAS server.
      parameters:
      - name: serverName
        description: Server name containing the policy.
        in: path
        required: true
        schema:
          type: string
      - name: policyName
        description: Policy to delete.
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The policy was removed.
        "400":
          description: An error occurred.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The server name does not exist, or the policy does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
      tags:
      - Policies
  "/jobs/servers/{serverName}/caslibs/{caslibName}/tables/{tableName}/columns/{columnName}/frequency":
    post:
      operationId: createJobColumnFrequency
      summary: Create a frequency table for a column
      description: Creates a job, which gets the frequency for a single column in
        the loaded CAS table. The result is output to the new CAS table requested
        by the passed query parameters.
      parameters:
      - name: tableName
        description: The name of the input table for which column frequency is requested.
        in: path
        required: true
        schema:
          type: string
      - name: columnName
        description: The name of column for which frequency info is requested.
        in: path
        required: true
        schema:
          type: string
      - name: serverName
        description: The name of the server containing the input Caslib.
        in: path
        required: true
        schema:
          type: string
      - name: caslibName
        description: The name of the Caslib containing the input table.
        in: path
        required: true
        schema:
          type: string
      - name: outputCaslibName
        description: The name of the Caslib for the output CAS table.
        in: query
        required: true
        schema:
          type: string
      - name: outputTableName
        description: "The name of output CAS table. The following columns of interest\
          \ are in the output table: <table> <tr><th>Column Name</th><th>Content</th></tr>\
          \ <tr><td>Frequency</td><td>The frequency of the value</td></tr> <tr><td>FmtVar</td><td>The\
          \ formatted value</td></tr> <tr><td>CharVar</td><td>For a character column,\
          \ the unformatted value</td></tr> <tr><td>NumVar</td><td>For a numeric column,\
          \ the unformatted value</td></tr> </table>"
        in: query
        required: true
        schema:
          type: string
      - name: outputTableScope
        description: The scope of the output table. Valid values in include session
          and global. Defaults to global. Global caslibs can contain global and session
          tables. Session caslibs can only contain session tables.
        in: query
        required: false
        schema:
          type: string
      - name: sessionId
        description: The optional ID of the session containing the Caslib. If unspecified,
          only tables in global caslibs will be accessible.
        in: query
        required: false
        schema:
          type: string
      - name: sortBy
        description: "The optional order by which to sort the results. If omitted,\
          \ sorting is not performed. An ascending sort is more performant than a\
          \ descending sort. Valid sort column names include: Frequency and FmtVar.\
          \ Valid sort order values include: ascending and descending. When sorting\
          \ by Frequency, the FmtVar is automatically used as the secondary ascending\
          \ sort. Sample sortBy values: <table> <tr><th>Value of sortBy</th><th>Result</th></tr>\
          \ <tr><td>Frequency:ascending</td><td>sort by ascending Frequency, ascending\
          \ FmtVar</td></tr> <tr><td>Frequency:descending</td><td>sort by descending\
          \ Frequency, ascending FmtVar</td></tr> <tr><td>FmtVar:ascending</td><td>sort\
          \ by ascending FmtVar</td></tr> <tr><td>FmtVar:descending</td><td>sort by\
          \ descending FmtVar</td></tr> </table>"
        in: query
        required: false
        schema:
          type: string
      responses:
        "201":
          description: The asynchronous job for obtaining column frequency was submitted.
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
        "404":
          description: The requested CAS server or Caslib does not exist.
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
      tags:
      - Columns
servers:
