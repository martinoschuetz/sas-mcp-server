    engineDefinitionExample:
      description: A sample definition of an engine.
      value:
        $schema: http://json-schema.org/draft-04/schema#
        title: DNFS
        description: dnfs
        type: object
        additionalProperties: false
        required:
        - engineName
        properties:
          engineName:
            title: DNFS
            type: string
            default: DNFS
            enum:
            - DNFS
          general:
            title: General options
            description: General options for this Caslib.
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
                title: Path
                description: specifies data source-specific information.  For PATH,
                  DNFS and HDFS, this is a file system path.
                default: ""
                properties:
                  isUserName:
                    enum:
                    - false
                  isPassword:
                    enum:
                    - false
                  isPath:
                    enum:
                    - false
                  isHideValue:
                    enum:
                    - false
                  isRequired:
                    enum:
                    - false
                  isCommon:
                    enum:
                    - true
                  toolTip:
                    enum:
                    - Specifies data source-specific information.  For PATH, DNFS
                      and HDFS, this is a file system path.
              hidden:
                type: boolean
                title: Hidden
                description: when set to True, the Caslib is added as a hidden Caslib.
                default: false
                properties:
                  isHideValue:
                    enum:
                    - false
                  isRequired:
                    enum:
                    - false
                  isCommon:
                    enum:
                    - true
                  toolTip:
                    enum:
                    - When set to True, the Caslib is added as a hidden Caslib.
              transient:
                type: boolean
                title: Transient
                description: when set to True, the Caslib is added as a transient
                  Caslib.
                default: false
                properties:
                  isHideValue:
                    enum:
                    - false
                  isRequired:
                    enum:
                    - false
                  isCommon:
                    enum:
                    - true
                  toolTip:
                    enum:
                    - When set to True, the Caslib is added as a transient Caslib.
              session:
                type: boolean
                title: Session scope
                description: when set to True, the Caslib is scoped to the current
                  session only. Tables that you load in this session cannot be accessed
                  from other sessions. If you specify False, then the Caslib is visible
                  to other sessions, subject to access controls.
                default: true
                properties:
                  isHideValue:
                    enum:
                    - false
                  isRequired:
                    enum:
                    - false
                  isCommon:
                    enum:
                    - true
                  toolTip:
                    enum:
                    - When set to True, the Caslib is scoped to the current session
                      only. Tables that you load in this session cannot be accessed
                      from other sessions. If you specify False, then the Caslib is
                      visible to other sessions, subject to access controls.
              name:
                type: string
                title: Caslib
                description: specifies the name of the Caslib to add.
                properties:
                  isUserName:
                    enum:
                    - false
                  isPassword:
                    enum:
                    - false
                  isPath:
                    enum:
                    - false
                  isHideValue:
                    enum:
                    - false
                  isRequired:
                    enum:
                    - true
                  isCommon:
                    enum:
                    - true
                  toolTip:
                    enum:
                    - Specifies the name of the Caslib to add.
              description:
                type: string
                title: Description
                description: specifies a description of the Caslib.
                default: ""
                properties:
                  isUserName:
                    enum:
                    - false
                  isPassword:
                    enum:
                    - false
                  isPath:
                    enum:
                    - false
                  isHideValue:
                    enum:
                    - false
                  isRequired:
                    enum:
                    - false
                  isCommon:
                    enum:
                    - true
                  toolTip:
                    enum:
                    - Specifies a description of the Caslib.
              createDirectory:
                type: boolean
                title: Create directory
                description: when set to True, the server attempts to create the directory
                  for the Caslib.
                default: false
                properties:
                  isHideValue:
                    enum:
                    - false
                  isRequired:
                    enum:
                    - false
                  isCommon:
                    enum:
                    - true
                  toolTip:
                    enum:
                    - When set to True, the server attempts to create the directory
                      for the Caslib.
              permission:
                type: string
                title: Permission
                description: specifies the host access controls on the Caslib when
                  directory creation is requested.
                enum:
                - GroupRead
                - GroupWrite
                - GroupWritePublicRead
                - Private
                - PublicRead
                - PublicWrite
                properties:
                  isUserName:
                    enum:
                    - false
                  isPassword:
                    enum:
                    - false
                  isPath:
                    enum:
                    - false
                  isHideValue:
                    enum:
                    - false
                  isRequired:
                    enum:
                    - false
                  isCommon:
                    enum:
                    - true
                  toolTip:
                    enum:
                    - Specifies the host access controls on the Caslib when directory
                      creation is requested.
              subDirectories:
                type: boolean
                title: Subdirectories
                description: when set to True, tables and files in subdirectories
                  of the path specified in the Caslib definition are accessible from
                  the Caslib.
                default: false
                properties:
                  isHideValue:
                    enum:
                    - false
                  isRequired:
                    enum:
                    - false
                  isCommon:
                    enum:
                    - true
                  toolTip:
                    enum:
                    - When set to True, tables and files in subdirectories of the
                      path specified in the Caslib definition are accessible from
                      the Caslib.
              activeOnAdd:
                type: boolean
                title: Active on add
                description: when set to True, the new Caslib becomes the active Caslib.
                default: true
                properties:
                  isHideValue:
                    enum:
                    - false
                  isRequired:
                    enum:
                    - false
                  isCommon:
                    enum:
                    - true
                  toolTip:
                    enum:
                    - When set to True, the new Caslib becomes the active Caslib.
