    createTemplateRequest:
      summary: Create template request
      description: Here is an example of using a POST request to create a stored template
        for natural language generation which can be executed in the future. The field
        `templateText` contains the template code that will be executed on a call
        to the `documents` endpoint with the URI of this template object. Templates
        may also contain properties. These properties are simple name-value pairs
        represented in an array within a template, and can be used for filtering upon
        retrieval. The property names need to be unique among individual templates.
      value: {"name": "This name is optional.", "description": "This description is\
          \ optional.", "templateText": "Hello, $name!", "properties": [{"name": "optionalProperty1",
            "value": "propertyValue"}, {"name": "optionalProperty2", "value": "propertyValue"}]}
    documentFromTextRequest:
      summary: Create document from text request
      description: Here is an example of using a POST request to create a document
        object using template text directly (not referencing any stored template object).
        The only required field is `templateText`. `data` is any valid json structure
        that will be used by the template provided. `language` is specified by the
        [ISO-639-1 short code](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes),
        and is set to a language ("en") which has language helpers supported by this
        API. `timeToLive` is given in seconds and if omitted will be replaced by the
        server default (negative numbers equate to no expiration). In this example,
        the `timeToLive` field specifies that this document can be deleted from the
        underlying database after 60 seconds.
      value: {"name": "This name is optional", "requestType": "text", "description": "This\
          \ description is optional", "language": "en", "templateText": "Hello, $foo!",
        "data": {"foo": "bar"}, "timeToLive": 60}
