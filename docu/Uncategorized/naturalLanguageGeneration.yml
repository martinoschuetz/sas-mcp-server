    createDocumentFromUriRequest:
      summary: Create document using template URI request
      description: Here is an example of using a POST request to create a document
        object using a reference to an existing template. The template is supplied
        via a URI that maps to a pre-existing template. The only required field is
        `templateUri`. `data` is any valid json structure that will be used by the
        template provided. `language` defaults to "en", but can be specified by the
        [ISO-639-1 short code](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes).
        `timeToLive` is given in seconds and if omitted will be replaced by the server
        default (negative numbers equate to no expiration). In this example, the `timeToLive`
        field specifies that this document can be deleted from the underlying database
        after 60 seconds.
