components:
  schemas:
    documentRequest:
      title: Request to Create a Document Object
      type: object
      required:
      - requestType
      properties:
        data:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: This is the JSON data that is passed alongside a template to
            the template execution endpoint. This data can be accessed from within
            the template as part of the template logic or as part of the template
            output.
        language:
          $ref: "#/components/schemas/languageCode"
        timeToLive:
          type: integer
          description: The time for the document to live given in seconds. Negative
            numbers mean never delete. Optional, default provided.
          format: int32
        name:
          maxLength: 250
          type: string
          description: The name supplied by the consumer for this document.
        description:
          maxLength: 1000
          type: string
          description: The description of this document.
        requestType:
          type: string
          description: The type of request being submitted. Especially useful when
            creating multiple documents at once in a mixture of text and uri types.
          enum:
          - uri
          - text
        version:
          type: integer
          description: The schema version of the document request object.
      description: The root object to create a document, the sub objects require either
        text or a uri and are determined based on the type field
      discriminator:
        propertyName: requestType
    documentRequestFromUri:
      title: Template URI and accompanying data
      description: |
        Represents a request to create a document object using a
        reference to an existing template. The template is supplied via a URI
        that maps to a pre-existing template. The only required field
        is `templateUri`. `data` is any valid json structure that will be used
        by the template provided. `language` is specified by the
        [ISO-639-1 short code](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes).
        If the `$LangTool` Velocity tool is used in the template, the language specified
        must be one that is supported by this API.
        `timeToLive` is given in seconds and if omitted will be replaced by the
        server default (negative numbers equate to no expiration).
      allOf:
      - $ref: "#/components/schemas/documentRequest"
      - required:
        - templateUri
        type: object
        properties:
          templateUri:
            type: string
            description: The template uri being supplied to generate this document
          links:
            type: array
            items:
              $ref: "#/components/schemas/link"
      x-discriminator-value: uri
      x-sas-media-type:
        name: application/vnd.sas.cognitive.natural.language.generation.document.request.from.uri
        version: 2
    documentRequestFromText:
      title: Template Text and accompanying data
      description: |
        Represents a request to create a document object using
        template text directly (not referencing any stored template object). The
        only required field is `templateText`. `data` is any valid json
        structure that will be used by the template provided. `language` is
        specified by the
        [ISO-639-1 short code](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes).
        `timeToLive` is given in seconds and if omitted will be replaced by the
        server default (negative numbers equate to no expiration).
      allOf:
      - $ref: "#/components/schemas/documentRequest"
      - required:
        - templateText
        type: object
        properties:
          templateText:
            type: string
            description: The template text being supplied to generate this document
          links:
            type: array
            items:
              $ref: "#/components/schemas/link"
      x-discriminator-value: text
      x-sas-media-type:
        name: application/vnd.sas.cognitive.natural.language.generation.document.request.from.text
        version: 2
    documentRequests:
      title: Set of document requests from raw text
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: This is the JSON data that is passed alongside the templates
            to the template execution endpoint. This data can be accessed from within
            the template as part of the template logic or as part of the template
            output.
        items:
          type: array
          description: Array containing documentRequest objects.
          items:
            $ref: "#/components/schemas/documentRequest"
      description: A set of document requests to be generated by the API
    documentsAsJson:
      title: Set of documents, json formatted
      description: A set of documents available within the current type system with
        json as the output
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Array containing documents.
            items:
              $ref: "#/components/schemas/document"
      x-sas-media-type:
        name: application/vnd.sas.cognitive.natural.language.generation.documents.as.json
        version: 2
    documents:
      title: Set of documents
      description: A set of documents available within the current type system
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Array containing documents.
            items:
              $ref: "#/components/schemas/document"
    document:
      title: Document generated by the apply template function
      description: |
        Represents a rendered document from a call to the
        naturalLanguageGeneration API. The field `result` is rendered natural
        language from the output of the template. If the template was provided
        by URI then `templateId` will be a reference to that template.
      required:
      - result
      type: object
      properties:
        id:
          type: string
          description: The server-generated ID that uniquely identifies this document
        name:
          maxLength: 250
          type: string
          description: The name supplied by the consumer for this document.
        description:
          maxLength: 1000
          type: string
          description: The description of this document.
        result:
          type: string
          description: The entire string of the result of the template.
        inputData:
          type: object
          properties: {}
          description: The data that was used with the given template to generate
            this document.
        templateId:
          type: string
          description: The template that was used with the data to produce this document.
        createdBy:
          type: string
          description: The user who created the document.
        modifiedBy:
          type: string
          description: The user who most recently modified the document.
        creationTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            document was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            document was last modified.
          format: date-time
        expirationTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            document will be deleted. If null or missing document will never be deleted.
          format: date-time
        links:
          type: array
          description: Array containing documents.
          items:
            $ref: "#/components/schemas/link"
      x-sas-etaggable: false
    documentAsJson:
      title: A document object with json formatting
      description: A document with the output json formatted where possible
      allOf:
      - $ref: "#/components/schemas/document"
    languageCode:
      type: string
      description: The two letter ISO 639-1 value for selecting a language.
      enum:
      - ar
      - cs
      - da
      - de
      - el
      - en
      - es
      - fa
      - fi
      - fr
      - he
      - hi
      - hr
      - hu
      - id
      - it
      - ja
      - ko
      - nb
      - nl
      - "no"   # swagger-codegen will change this to 'false' if unquoted
      - pl
      - pt
      - ru
      - sh
      - sk
      - sl
      - sr
      - sv
      - th
      - tr
      - vi
      - zh
    templates:
      title: Collection of templates
      description: A collection of all templates requested using the filtering params
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Array containing all template objects.
            items:
              $ref: "#/components/schemas/template"
    template:
      title: Template
      description: |
        Represents a stored template to be executed at a later date.
        Specifically, the field `templateText` contains the actual template code
        that will be executed on a call to the documents endpoint with the uri
        of this template object. Templates can also contain property values.
        These properties are simple name/value pairs represented in an array
        within a template. The property names need to be unique among and
        individual template only.
      required:
      - name
      type: object
      properties:
        id:
          type: string
          pattern: ^$|^[0-9a-zA-Z]{8}-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{12}$
          description: The server-generated ID that uniquely identifies this template
        templateText:
          type: string
          description: The template code that will generate the example sentence given
            the data provided.
        name:
          maxLength: 250
          type: string
          description: The name, supplied by the consumer, of this template.
        description:
          maxLength: 1000
          type: string
          description: The description of this template.
        createdBy:
          type: string
          description: The user who created the template.
        modifiedBy:
          type: string
          description: The user who most recently modified the template.
        creationTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            template was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            template was last modified.
          format: date-time
        links:
          type: array
          description: Array containing documents.
          items:
            $ref: "#/components/schemas/link"
        properties:
          type: array
          description: A property store for this template
          items:
            $ref: "#/components/schemas/property"
    templateTransferObject:
      title: Template transfer object
      description: The transfer object for a template.
      allOf:
      - $ref: "#/components/schemas/transferObject"
      - required:
        - content
        type: object
        properties:
          content:
            $ref: "#/components/schemas/template"
    documentTransferObject:
      title: Document transfer object
      description: The transfer object for a document.
      allOf:
      - $ref: "#/components/schemas/transferObject"
      - required:
        - content
        type: object
        properties:
          content:
            $ref: "#/components/schemas/document"
    languages:
      title: Set of languages
      description: A set of languages currently supported by the natural language
        generation API.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Array containing all supportedLanguage objects.
            items:
              $ref: "#/components/schemas/language"
    language:
      title: Template language object
      type: object
      properties:
        languageCode:
          $ref: "#/components/schemas/languageCode"
        name:
          type: string
          description: The plain text name of the ISO 639-1 code supplied for this
            language.
      description: A language supported in the natural language generation API for
        processing templates. This dictates what language-specific tools should be
        loaded when executing a template to produce a document. The language tools
        always allow access to other languages even when one is chosen by using this
        parameter. Languages are referenced using the ISO-639-1 short form.
    api:
      title: API
      required:
      - links
      - version
      type: object
      properties:
        version:
          minimum: 1
          type: integer
          description: The version number of the API representation. This is version
            1.
        links:
          type: array
          description: The API's top-level links.
          items:
            $ref: "#/components/schemas/link"
      description: The list of links to top-level resources and operations available
