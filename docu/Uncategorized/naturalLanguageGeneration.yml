---
openapi: 3.0.3
info:
  title: Natural Language Generation
  description: |
    This API generates natural language given both data and templates
    using advanced natural language concepts.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  version: "2"
servers:
- url: https://example.com/naturalLanguageGeneration
  description: This is an example of a base URL.
security:
- SASLogon:
  - openid
tags:
- name: Root
  description: Operations for the root resource.
- name: Documents
  description: A document is produced when a template is executed and contains the
    result of the template execution. Interact with these operations to execute template
    code.
- name: Templates
  description: A template is plain text representing the code that will be passed
    to the template execution context along with optional data to generate the desired
    natural language. Interact with these operations to store templates for future
    execution.
- name: Transfer
  description: Operations for transferring object resources.
- name: Languages
  description: Operations for natural languages supported by this API.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get API resource links
      description: |
        Return a list of links to the top level resources in this API. This entry point does not require authentication. Some
        links may be omitted for non-authenticated calls.
      operationId: root
      responses:
        "200":
          description: A collection of link objects.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/apiResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/apiResponse"
      security:
      - SASLogon:
        - openid
    head:
      tags:
      - Root
      summary: Determine if API resource links are available
      description: |
        Determines if the list of links to the top level resources in this API are available. This entry point does not require
        authentication.
      operationId: headersForRoot
      responses:
        "200":
          description: API resource links are available
      security:
      - SASLogon:
        - openid
  /documents:
    get:
      tags:
      - Documents
      summary: Get All Documents
      description: Returns a collection of documents that have been stored for the
        current user. If no such document exists, an empty collection is returned.
      operationId: getDocuments
      parameters:
      - name: filter
        in: query
        description: The criteria for filtering the collection. See [Filtering in
          REST APIs](https://developer.sas.com/rest-apis/naturalLanguageGeneration-v2/docs/getting-started/usage-notes#filtering)
        schema:
          type: string
          format: string
      - name: start
        in: query
        description: The start index for pagination
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The limit parameter for pagination
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: The criteria for sorting the collection. See [Sorting in REST
          APIs](https://developer.sas.com/rest-apis/naturalLanguageGeneration-v2/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: All of the current documents
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/documents"
              examples:
                default:
                  $ref: "#/components/examples/documentCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/documents"
              examples:
                default:
                  $ref: "#/components/examples/documentCollection"
      security:
      - SASLogon:
        - openid
    post:
      tags:
      - Documents
      summary: Create a Document from Raw Template Text
      description: The endpoint that combines the provided template and data into
        a string response
      operationId: createDocumentFromText
      requestBody:
        description: Apply the given data to the template provided.
        content:
          application/vnd.sas.cognitive.natural.language.generation.document.request.from.text+json:
            schema:
              $ref: "#/components/schemas/documentRequestFromText"
            examples:
              default:
                $ref: "#/components/examples/documentFromTextRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/documentRequestFromText"
            examples:
              default:
                $ref: "#/components/examples/documentFromTextRequest"
        required: true
      responses:
        "201":
          description: Document created from text
          headers:
            Location:
              description: The URL of the document.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.cognitive.natural.language.generation.document+json:
              schema:
                $ref: "#/components/schemas/document"
              examples:
                default:
                  $ref: "#/components/examples/document"
            application/json:
              schema:
                $ref: "#/components/schemas/document"
              examples:
                default:
                  $ref: "#/components/examples/document"
        "400":
          description: The provided template was either missing or empty.
          content:
            application/vnd.sas.cognitive.natural.language.generation.document+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
      x-codegen-request-body-name: payload
  /documents#asJsonResponse:
    post:
      tags:
      - Documents
      summary: Create a Document from a Raw Template Text with the data access formatted
        as Json
      description: The endpoint that combines the provided template and data into
        a string response. Any time data is used it is json formatted rather than
        using traditional toString() format.
      operationId: createDocumentFromTextAsJsonResponse
      requestBody:
        description: Apply the given data to the template provided.
        content:
          application/vnd.sas.cognitive.natural.language.generation.document.request.from.text+json:
            schema:
              $ref: "#/components/schemas/documentRequestFromText"
            examples:
              default:
                $ref: "#/components/examples/documentFromTextAsJsonRequest"
        required: true
      responses:
        "201":
          description: Document created from text
          headers:
            Location:
              description: The URL of the document.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.cognitive.natural.language.generation.document.as.json+json:
              schema:
                $ref: "#/components/schemas/documentAsJson"
              examples:
                default:
                  $ref: "#/components/examples/documentFromTextAsJsonResponse"
        "400":
          description: The provided template was either missing or empty.
          content:
            application/vnd.sas.cognitive.natural.language.generation.document.as.json+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
      x-codegen-request-body-name: payload
  /documents#multiPost:
    post:
      tags:
      - Documents
      summary: Create multiple documents
      description: The endpoint that combines the provided template and data into
        a string response
      operationId: createDocuments
      requestBody:
        description: Apply the given data to the templates provided.
        content:
          application/vnd.sas.cognitive.natural.language.generation.document.requests+json:
            schema:
              $ref: "#/components/schemas/documentRequests"
            examples:
              default:
                $ref: "#/components/examples/documentMultiPostRequest"
        required: true
      responses:
        "201":
          description: Documents created from text
          headers:
            Location:
              description: The URL where the documents were created.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/documents"
              examples:
                default:
                  $ref: "#/components/examples/documentMultiPostResponse"
        "400":
          description: The provided template was either missing or empty.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
      x-sas-returns-heterogeneous-collection: true
      x-codegen-request-body-name: payload
  /documents#multiPostAsJsonResponse:
    post:
      tags:
      - Documents
      summary: Create multiple documents with data access formatted as json
      description: The endpoint that combines the provided template and data into
        a string response. When data is accessed then it is formatted as Json rather
        than toString().
      operationId: createDocumentsAsJsonResponse
      requestBody:
        description: Apply the given data to the templates provided.
        content:
          application/vnd.sas.cognitive.natural.language.generation.document.requests+json:
            schema:
              $ref: "#/components/schemas/documentRequests"
            examples:
              default:
                $ref: "#/components/examples/documentsFromTextAsJsonRequest"
        required: true
      responses:
        "201":
          description: Documents created from text
          headers:
            Location:
              description: The URL where the documents were created.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.cognitive.natural.language.generation.documents.as.json+json:
              schema:
                $ref: "#/components/schemas/documentsAsJson"
              examples:
                default:
                  $ref: "#/components/examples/documentsFromTextAsJsonResponse"
        "400":
          description: The provided template was either missing or empty.
          content:
            application/vnd.sas.cognitive.natural.language.generation.documents.as.json+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
      x-sas-returns-heterogeneous-collection: true
      x-codegen-request-body-name: payload
  /documents#byURI:
    post:
      tags:
      - Documents
      summary: Create a Document with a Template URI
      description: The endpoint that combines the provided template and data into
        a string response
      operationId: createDocumentFromUri
      requestBody:
        description: Apply the given data to the template provided.
        content:
          application/vnd.sas.cognitive.natural.language.generation.document.request.from.uri+json:
            schema:
              $ref: "#/components/schemas/documentRequestFromUri"
            examples:
              default:
                $ref: "#/components/examples/createDocumentFromUriRequest"
        required: true
      responses:
        "201":
          description: Document created from uri
          headers:
            Location:
              description: The URL of the document.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.cognitive.natural.language.generation.document+json:
              schema:
                $ref: "#/components/schemas/document"
              examples:
                default:
                  $ref: "#/components/examples/createDocumentFromUriResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/document"
              examples:
                default:
                  $ref: "#/components/examples/createDocumentFromUriResponse"
        "400":
          description: The given uri did not contain a valid template.
          content:
            application/vnd.sas.cognitive.natural.language.generation.document+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
      x-codegen-request-body-name: payload
  /documents#byURIAsJsonResponse:
    post:
      tags:
      - Documents
      summary: Create a Document with a Template URI and data formatted as Json
      description: The endpoint that combines the provided template and data into
        a string response and outputs the template with Json toString instead of normal
        Velocity output
      operationId: createDocumentFromUriAsJsonResponse
      requestBody:
        description: Apply the given data to the template provided.
        content:
          application/vnd.sas.cognitive.natural.language.generation.document.request.from.uri+json:
            schema:
              $ref: "#/components/schemas/documentRequestFromUri"
            examples:
              default:
                $ref: "#/components/examples/createDocumentFromUriAsJsonRequest"
        required: true
      responses:
        "201":
          description: Document created from uri
          headers:
            Location:
              description: The URL of the document.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.cognitive.natural.language.generation.document.as.json+json:
              schema:
                $ref: "#/components/schemas/documentAsJson"
              examples:
                default:
                  $ref: "#/components/examples/createDocumentFromUriAsJsonResponse"
        "400":
          description: The given uri did not contain a valid template.
          content:
            application/vnd.sas.cognitive.natural.language.generation.document.as.json+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
      x-codegen-request-body-name: payload
  /documents#transfer:
    post:
      tags:
      - Documents
      summary: Create a new document from a transfer object
      description: Create a new document from transfer object.
      operationId: createDocumentFromTransfer
      requestBody:
        description: The document in transferable format.
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/documentTransferObject"
            examples:
              default:
                $ref: "#/components/examples/createDocumentFromTransferRequest"
        required: true
      responses:
        "201":
          description: A document was imported successfully.
          headers:
            ETag:
              description: The entity tag for the newly created document.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the document was last modified.
              schema:
                type: string
            Location:
              description: The URI of the newly created document.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/documentSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/documentSummary"
        "400":
          description: The request was invalid. There was a provider mismatch between
            the transfer object content and requested provider.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
      x-codegen-request-body-name: documentTransfer
  /documents/{documentId}:
    get:
      tags:
      - Documents
      summary: Retrieve a specific document
      description: Returns the current document specified by the id provided.
      operationId: getDocument
      parameters:
      - name: documentId
        in: path
        description: The ID of the document to lookup
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The contents of the document
          content:
            application/vnd.sas.cognitive.natural.language.generation.document+json:
              schema:
                $ref: "#/components/schemas/document"
              examples:
                default:
                  $ref: "#/components/examples/document"
            application/json:
              schema:
                $ref: "#/components/schemas/document"
              examples:
                default:
                  $ref: "#/components/examples/document"
        "404":
          description: The supplied ID was not found
          content:
            application/vnd.sas.cognitive.natural.language.generation.document+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorNotFound"
      security:
      - SASLogon:
        - openid
    delete:
      tags:
      - Documents
      summary: Delete the specified document from the server
      description: Deletes the document specified by its id.
      operationId: deleteDocument
      parameters:
      - name: documentId
        in: path
        description: The ID of the document to lookup
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The document was successfully deleted.
        "404":
          description: The supplied ID was not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorNotFound"
      security:
      - SASLogon:
        - openid
    head:
      tags:
      - Documents
      summary: Retrieve headers for the document
      description: Retrieve headers for the document. Can also be used to check if
        the document exists.
      operationId: headersForDocument
      parameters:
      - name: documentId
        in: path
        description: The ID of the document to lookup
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The supplied ID exists
        "404":
          description: The supplied ID was not found
      security:
      - SASLogon:
        - openid
  /documents/{documentId}#transfer:
    get:
      tags:
      - Documents
      summary: Return the document in transfer object format
      description: Return the transfer object of the specified document.
      operationId: getDocumentAsTransfer
      parameters:
      - name: documentId
        in: path
        description: The ID for the document.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The document returned as a transfer
            object.
          headers:
            ETag:
              description: The entity tag for the document.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the document was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/documentTransferObject"
              examples:
                default:
                  $ref: "#/components/examples/documentAsTransfer"
        "404":
          description: No document exists at the requested path.
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorNotFound"
      security:
      - SASLogon:
        - openid
    put:
      tags:
      - Documents
      summary: Update an existing document using a transfer object
      description: Update a document using the transfer object. If no existing document
        is found, a new document is created.
      operationId: updateDocumentFromTransfer
      parameters:
      - name: documentId
        in: path
        description: The ID for the document.
        required: true
        schema:
          type: string
      requestBody:
        description: Document to be imported.
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/documentTransferObject"
            examples:
              default:
                $ref: "#/components/examples/documentAsTransfer"
        required: true
      responses:
        "200":
          description: The request succeeded. The imported or updated document returned
            in resource summary format.
          headers:
            ETag:
              description: The entity tag for the newly created template.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the template was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/documentSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/documentSummary"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
      security:
      - SASLogon:
        - openid
      x-codegen-request-body-name: Document in transferable format
  /templates:
    get:
      tags:
      - Templates
      summary: Get All Templates
      description: Returns a collection of templates that have been stored for the
        current user. If no such templates exist, an empty collection is returned.
      operationId: getTemplates
      parameters:
      - name: filter
        in: query
        description: The criteria for filtering the collection. See [Filtering in
          REST APIs](https://developer.sas.com/rest-apis/naturalLanguageGeneration-v2/docs/getting-started/usage-notes#filtering)
        schema:
          type: string
          format: string
      - name: start
        in: query
        description: The start index for pagination
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The limit parameter for pagination
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: The criteria for sorting the collection. See [Sorting in REST
          APIs](https://developer.sas.com/rest-apis/naturalLanguageGeneration-v2/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: All of the current templates
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/templates"
              examples:
                default:
                  $ref: "#/components/examples/templateCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/templates"
              examples:
                default:
                  $ref: "#/components/examples/templateCollection"
      security:
      - SASLogon:
        - openid
      x-annotations:
      - com.sas.authorization.annotations.FilterLinks
    post:
      tags:
      - Templates
      summary: Create Template
      description: Create a new template by supplying the template code directly.
      operationId: createTemplate
      requestBody:
        description: The template that you want created, without id, that will be
          supplied by the database
        content:
          application/vnd.sas.cognitive.natural.language.generation.template+json:
            schema:
              $ref: "#/components/schemas/template"
            examples:
              default:
                $ref: "#/components/examples/createTemplateRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/template"
            examples:
              default:
                $ref: "#/components/examples/createTemplateRequest"
        required: false
      responses:
        "201":
          description: Created Template
          headers:
            Location:
              description: The URL of the template.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.cognitive.natural.language.generation.template+json:
              schema:
                $ref: "#/components/schemas/template"
              examples:
                default:
                  $ref: "#/components/examples/template"
            application/json:
              schema:
                $ref: "#/components/schemas/template"
              examples:
                default:
                  $ref: "#/components/examples/template"
        "400":
          description: The templateText provided was missing or empty.
          content:
            application/vnd.sas.cognitive.natural.language.generation.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
      x-codegen-request-body-name: payload
  /templates#transfer:
    post:
      tags:
      - Templates
      summary: Create a new template from a transfer object
      description: Create a new template from transfer object.
      operationId: createTemplateFromTransfer
      requestBody:
        description: The template in transferable format.
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/templateTransferObject"
            examples:
              default:
                $ref: "#/components/examples/templateAsTransfer"
        required: true
      responses:
        "201":
          description: A template was imported successfully.
          headers:
            ETag:
              description: The entity tag for the newly created template.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the template was last modified.
              schema:
                type: string
            Location:
              description: The URI of the newly created template.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/templateSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/templateSummary"
        "400":
          description: The request was invalid. There was a provider mismatch between
            the transfer object content and requested provider.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorBadRequest"
