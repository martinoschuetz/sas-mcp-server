---
openapi: 3.0.3
info:
  version: "3"
  title: Search Index
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: >
    SearchIndex API is used to index SAS Objects and CAS Tables so that the
    content is available for search through Search Service.
tags:
- name: Root
  description: The API root.
- name: Schema
  description: The endpoints checking if specified index does exist.
- name: IndexingJob
  description: The endpoints initiating the indexing job requests.
- name: IndexJob
  description: The endpoints managing the index job and its status.
paths:
  /:
    head:
      tags:
      - Root
      operationId: headersForRoot
      summary: Check if Search Index Service is available
      description: This endpoint can be used to check the availability of the Search
        Index-Service.
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: Service not available
          headers:
            Content-Type:
              schema:
                type: string
    get:
      tags:
      - Root
      operationId: root
      summary: "Get a list of top-level links "
      description: Returns the top level URI of all the REST component for Search
        Index Service.
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/searchIndexRoot"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/searchIndexRoot"
        "404":
          description: Service not available
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /schema:
    head:
      tags:
      - Schema
      operationId: headersForSchema
      summary: Check if specified index does exist
      description: This endpoint can be used to check the availability of the given
        index.
      parameters:
      - name: indexCaslib
        in: query
        description: Name of cas library where given indexTableName is saved.
        required: false
        schema:
          type: string
      - name: indexTableName
        in: query
        description: Name of cas index for which schema needs to be fetched.
        required: false
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: Language/locale to use for localizing the response.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
        "400":
          description: "The request was not valid. There are multiple error scrnario\
            \ check status code, error code and error message for more details."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/invalidQuery"
        "404":
          description: Error while trying to fetch the schema. The specified index
            does not exist in CAS. Contact your system administrator.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
    get:
      tags:
      - Schema
      operationId: getSchema
      summary: Get a schema
      description: >
        Get list of fields of a schema defined in search service. This API will
        fetch the schema information. The response would have information about
        the fields which are been configured.
        <br><br> This API has following usage: <ul> <li>If indexCaslib and indexTableName
        parameter is populated then the service would connect to searchindex database
        to fetch schema information of a given indexName. This
         would typically be used in scenarios where a user want to get the information
         on non default indexName. Sample scenario would be when a user wants to
         have information on schema populated for CAS tables.</li><li>If indexCaslib
        and indexTableName parmater is not populated then in this case the service
        would bring the static schema which is used to configure index for SAS objects.
        A sample use case would be to know the schema of the default index been populated
        by the scheduler.
         The default schema name would be present in application properties and would
         be configurable through consul. In this case all the attributes would be
         populated.</li></ul>
      parameters:
      - name: indexCaslib
        in: query
        description: Name of CAS library where given indexTableName is saved.
        required: false
        schema:
          type: string
      - name: indexTableName
        in: query
        description: Name of CAS index for which schema needs to be fetched.
        required: false
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: Language/locale to use for localizing the response.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.search.index.schema+json:
              schema:
                $ref: "#/components/schemas/searchSchema"
              examples:
                json:
                  $ref: "#/components/examples/searchSchema"
            application/json:
              schema:
                $ref: "#/components/schemas/searchSchema"
              examples:
                json:
                  $ref: "#/components/examples/searchSchema"
        "400":
          description: The request was not valid. There are multiple error scrnario
            check status code, error code and error message for more details.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/invalidQuery"
        "404":
          description: Error while trying to fetch the schema. The specified index
            does not exist in CAS. Contact your system administrator.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /index/jobs#DeploymentIndexing:
    post:
      tags:
      - IndexingJob
      operationId: createDeploymentIndexing
      summary: Initiate Deployment Indexing
      description: >
        This API will be used to initiate deployment indexing on a multi-tenant
        deployment by the Provider  administrator user only. The Provider
        administrator user can also select a sub-set of *onboarded* tenants for
        initiating indexing. This API internally triggers indexing for a set of
        tenants by invoking their  respective REST end-points. It then
        aggregates the asynchronous response of the individual indexing tasks of
        tenants and returns it as response. The indexing triggered is only for
        the SAS Objects for the set  of tenants. If no tenant list is provided
        in the request, the indexing would be triggered for all the  *onboarded*
        tenants in the deployment. POST /index/jobs operation is overloaded, see
        also the operation at  #op:startIndexingForSingleUser . Following would
        be the sequence of states   <table>  <tr>  <th>State</th>
        <th>Description</th> </tr> <tr>  <td>pending</td> <td>The indexing
        process has been initiated. At least one job is still in progress.</td>
        </tr> <tr>  <td>completed </td> <td>The indexing job for all tenants was
        successful.</td> </tr>
        <tr>  <td>completedWithWarnings</td>  <td>Indexing failed for at least
        one tenant</td> </tr> <tr>  <td>failed</td> <td>Indexing job for  all
        tenants failed</td> </tr> </table>
      parameters:
      - name: Accept-Language
        in: header
        description: Language/locale to use for localizing the response.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.search.index.deployment.request+json:
            schema:
              $ref: "#/components/schemas/deploymentIndexRequest"
            examples:
              json:
                $ref: "#/components/examples/deploymentIndexRequest"
      responses:
        "202":
          description: ACCEPTED
          headers:
            Location:
              description: URI of the created resource
              schema:
                type: string
          content:
            application/vnd.sas.search.index.deployment.job+json:
              schema:
                $ref: "#/components/schemas/indexJob"
              examples:
                json:
                  $ref: "#/components/examples/indexJob"
        "400":
          description: Invalid list of tenants provided for initiating Deployment
            Indexing.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/invalidQuery"
  /index/jobs#SingleUserIndexing:
    post:
      tags:
      - IndexingJob
      operationId: createIndexingByUser
      summary: Initiate Indexing
      description: >
        This API will be used to aggregate SAS objects content. This
         would collect the pre-existing data of all registered SAS types e.g. report
         and the aggregated data would be indexed once the scheduler job runs. This
         API will use the default indexName provided in application properties. This
         API will be used to index data with static schema as defined in Schema API
         above. We already have a scheduled job to aggregate data and index content,
         but if there is some discrepancy in data and user wants to manually initiate
         full feed to aggregate all data in that case this API will be used. As mentioned
         this is an asynchronous call so it will have different states which can
         be tracked through/jobs API. POST /index/jobs operation is overloaded, see
        also
         the operation at #op:startDeploymentIndexing
         Following would be the sequence of states
         <table>  <tr>  <th>State</th> <th>Description</th> </tr> <tr>  <td>pending</td>
         <td>The process is initialized. </td> </tr> <tr>  <td>running </td> <td>The
         process is running</td> </tr> <tr>  <td>typesAggregated</td> <td>Type is
         fetched from Type Service</td> </tr> <tr>  <td>dataExtracted</td> <td>All
         data is extracted and aggregated for next indexing to happen.</td> </tr>
         <tr>  <td>typeServiceFailed</td> <td>Failed to fetch types from type Service.</td>
         </tr> </table>
      parameters:
      - name: Accept-Language
        in: header
        description: Language/locale to use for localizing the response.
        required: false
        schema:
          type: string
      - name: jobCorrelationId
        in: query
        description: It is a correlation identifier used to group indexing jobs which
          are part of deployment indexing. This value is generated by the service
          itself. This value must not be added by API consumers explicitly.
        required: false
        schema:
          type: string
      responses:
        "202":
          description: ACCEPTED
          headers:
            Location:
              description: URI of the created resource
              schema:
                type: string
          content:
            application/vnd.sas.search.index.feed+json:
              schema:
                $ref: "#/components/schemas/indexJob"
              examples:
                json:
                  $ref: "#/components/examples/indexJob"
            application/json:
              schema:
                $ref: "#/components/schemas/indexJob"
              examples:
                json:
                  $ref: "#/components/examples/indexJob"
  "/index/typeJobs/{objectTypeName}":
    post:
      tags:
      - IndexingJob
      operationId: createIndexingByType
      summary: Initiate type specific indexing
      description: >
        "As described above in Full feed section,this API will be used
        to initiate full feed for specific object type. This would be an asynchronous
        call which would return response once the process thread starts. This API
        will typically be used to index SAS objects content specific to a type mentioned
        in path variable. This API will use the default indexName provided in application
        properties. The consumer of the API must provide a valid value for place holder
        '{objectTypeName}'
         in the URI. This API will be used to index data with static schema as defined
        in Schema API. We already have a scheduled job to index content, but if
        there is some discrepancy in data and user wants to manually initiate full
        feed for specific type in that case this API will be used. This is an asynchronous
        call ,so different states can be tracked through jobId. Following would
        be the sequence of states
        <table>  <tr>  <th>State</th> <th>Description</th> </tr> <tr>  <td>pending</td>

        <td>The process is initialized </td> </tr> <tr>  <td>running </td> <td>The

        process is running</td> </tr> <tr>  <td>typesAggregated</td> <td>Type is

        fetched from Type Service</td> </tr> <tr>  <td>dataExtracted</td> <td>All

        data is extracted and aggregated for next indexing to happen.</td> </tr>

        <tr>  <td>typeServiceFailed</td> <td>Failed to fetch types from type Service.</td>

        </tr> </table>"
      parameters:
      - name: objectTypeName
        in: path
        description: Name of the specific object type
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: Language/locale to use for localizing the response.
        required: false
        schema:
          type: string
      responses:
        "202":
          description: Type specific indexing job is accepted.
          headers:
            Location:
              description: URI of the created resource.
              schema:
                type: string
          content:
            application/vnd.sas.search.index.feed+json:
              schema:
                $ref: "#/components/schemas/indexJob"
              examples:
                json:
                  $ref: "#/components/examples/typeJobResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/indexJob"
              examples:
                json:
                  $ref: "#/components/examples/typeJobResponse"
        "400":
          description: Bad Request. The request is not properly formed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/invalidQuery"
          headers:
            Content-Type:
              description: Type of error object
              schema:
                type: string
            Location:
              description: The URI of the newly created account.
              schema:
                type: string
  /casTableIndex/jobs:
    post:
      tags:
      - IndexingJob
      operationId: createCasTableIndex
      summary: CAS-Table indexing
      description: >
        This API would be used to initiate full feed for specified CAS
        table in the given indexName. The response would be asynchronous
        response. In this case the table must be a CAS table residing in CAS
        Server. This API will configure the schema provided in the requestBody
        and create index. After the index is created it would index the complete
        CAS table according to the schema provided. In the schema request body
        there should always be at least one primary Key defined. Field name and
        type should correspond to column names and types in CAS table. Currently
        due to back-end dependency Search Service supports only 4 data types:
        'string' , 'integer' , 'decimal' and 'timeStamp'. This is an
        asynchronous call ,so different states can be tracked through jobId.
        Following would be the sequence of states <table>  <tr>  <th>State</th>
        <th>Description</th> </tr> <tr>  <td>pending</td> <td>The process is
        initialized. </td> </tr> <tr>  <td>running </td> <td>The process is
        running</td> </tr> <tr><td>schemaConfigured</td><td>Schema is
        configured for given index</td> </tr> <tr>  <td>schemaError</td> <td>
        Error configuring schema. Process ends.</td> </tr>
        <tr>  <td>indexed</td> <td> CAS table data is indexed.Process ends.</td>
        </tr> <tr>  <td>failedToIndex</td> <td> Failures while indexing CAS
        table data.</td> </tr><tr>  <td>failedToConfigure</td> <td> Failures
        while configuring search schema .</td> </tr> <tr>  <td>casError</td>
        <td>Some CAS Server error occurred during this process. Process
        abort</td> </tr> </table>
      parameters:
      - name: indexCaslib
        in: query
        description: Name of cas library where given indexTableName is saved.
        required: false
        schema:
          type: string
      - name: indexTableName
        in: query
        description: Name of cas index for which schema needs to be fetched.
        required: false
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: Language/locale to use for localizing the response.
        required: false
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/searchSchema"
      responses:
        "202":
          description: CAS Table indexing job is accepted.
          headers:
            Location:
              description: URI of the created resource
              schema:
                type: string
          content:
            application/vnd.sas.search.index.feed+json:
              schema:
                $ref: "#/components/schemas/indexJob"
              examples:
                json:
                  $ref: "#/components/examples/indexJob"
            application/json:
              schema:
                $ref: "#/components/schemas/indexJob"
              examples:
                json:
                  $ref: "#/components/examples/indexJob"
        "400":
          description: The request was not valid. There are multiple error scrnario
            check status code, error code and error message for more details.
          headers:
            Content-Type:
              description: Type of error object
              schema:
                type: string
            Location:
              description: The URI of the newly created account.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/invalidQuery"
  "/jobs/{jobId}#SingleIndexJob":
    head:
      tags:
      - IndexJob
      operationId: headersForJobexist
      summary: Check if jobId exist
      description: This end-point can be used to check the availability of the given
        jobId. The consumer of the API must provide a valid job id for the placeholder
        {jobId} in the above URI.
      parameters:
      - name: jobId
        in: path
        required: true
        description: Unique number for tracking purpose job
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: Language/locale to use for localizing the response.
        required: false
        schema:
          type: string
      - name: If-Match
        required: false
        description: The entity tag obtained from the most recent ETag response header.
          It must match the current entity tag.
        in: header
        schema:
          type: string
      - name: Last-Modified
        required: false
        description: The date when entity modified last time. It must match the current
          entity last-modified date time.
        in: header
        schema:
          type: string
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              required: true
              description: the content type
              schema:
                type: string
            Last-Modified:
              required: true
              description: The last modified date and time of the api.
              schema:
                type: string
        "404":
          description: Specified jobId does not exist.
          headers:
            Content-Type:
              required: true
              description: the content type
              schema:
                type: string
            Last-Modified:
              required: true
              description: The last modified date and time of the api.
              schema:
                type: string
    get:
      tags:
      - IndexJob
      operationId: getIndexJob
      summary: Get a status of job
      description: The API would be used to get the current state of the indexing
        process running. This would be tracked through the given JobId. The various
        state are explained in respective asynchronous API's. This API would be used
        to get the current state of all asynchronous REST end points like /index,/index/casTableIndex,
        /index/typeJobs/{objectTypeName}.
      parameters:
      - name: jobId
        in: path
        required: true
        description: Unique number for tracking purpose job
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: Language/locale to use for localizing the response.
        required: false
        schema:
          type: string
      - name: If-Match
        required: false
        description: The entity tag obtained from the most recent ETag response header.
          It must match the current entity tag.
        in: header
        schema:
          type: string
      - name: Last-Modified
        required: false
        description: The date when entity modified last time. It must match the current
          entity last-modified date time.
        in: header
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/vnd.sas.search.index.feed+json:
              schema:
                $ref: "#/components/schemas/indexJob"
              examples:
                json:
                  $ref: "#/components/examples/indexJob"
            application/json:
              schema:
                $ref: "#/components/schemas/indexJob"
              examples:
                json:
                  $ref: "#/components/examples/indexJob"
          headers:
            Content-Type:
              required: true
              description: the content type
              schema:
                type: string
            Last-Modified:
              required: true
              description: The last modified date and time of the api.
              schema:
                type: string
        "404":
          description: The specified JobId does not exits.Please provide a valid jobId.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
          headers:
            Content-Type:
              required: true
              description: The content type
              schema:
                type: string
            Last-Modified:
              description: Indicates the date and time at which the original resource
                was last modified.
              schema:
                type: string
                format: dateTime
  "/jobs/{jobId}#DeploymentIndexJob":
    get:
      tags:
      - IndexJob
      operationId: getDeploymentJob
      summary: Get the status of deployment indexing job
      description: "The API would be used to get the current state of the deployment\
        \ indexing job status. This would internally aggregate the job status for\
        \ each tenant for a given jobId and return a overall status of the job as\
        \ well. The consumer of the API must provide a valid deployment index job\
        \ id for the place holder '{jobId}' in the above URI."
      parameters:
      - name: jobId
        in: path
        required: true
        description: Unique number for tracking purpose of a job
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: Language/locale to use for localizing the response.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            "application/vnd.sas.search.index.deployment.job+json":
              schema:
                $ref: "#/components/schemas/deploymentJob"
              examples:
                json:
                  $ref: "#/components/examples/indexJob"
            "application/json":
              schema:
                $ref: "#/components/schemas/deploymentJob"
              examples:
                json:
                  $ref: "#/components/examples/indexJob"
          headers:
            Content-Type:
              required: true
              description: the content type
              schema:
                type: string
            Last-Modified:
              required: true
              description: The last modified date and time of the api.
              schema:
                type: string
        "404":
          description: The specified JobId does not exits.Please provide a valid jobId.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
          headers:
            Content-Type:
              required: true
              description: The content type
              schema:
                type: string
            Last-Modified:
              description: Indicates the date and time at which the original resource
                was last modified.
              schema:
                type: string
                format: dateTime
servers:
- url: http://example.com/searchIndex
  description: This is an example server.
components:
  requestBodies:
    searchSchema:
      content:
        application/vnd.sas.search.index.schema+json:
          schema:
            $ref: "#/components/schemas/searchSchema"
          examples:
            json:
              $ref: "#/components/examples/searchSchemaRequestBody"
        application/json:
          schema:
            $ref: "#/components/schemas/searchSchema"
          examples:
            json:
              $ref: "#/components/examples/searchSchemaRequestBody"
      required: true
      description: Index Schema representation.
  schemas:
    deploymentJob:
      title: SearchIndex Deployment Response
      description: SearchIndex Deployment Response representation corresponding to
        deployment indexing request.
      properties:
        state:
          type: string
          description: "Current state of the process. If started it would be running. "
        jobId:
          type: string
          description: unique number to track jobs
        links:
          type: array
          description: "A list of links as per Link representation. "
          items:
            $ref: "#/components/schemas/link"
        tenantJobs:
          type: array
          description: " A list of job status of tenants who were part of the job."
          items:
            $ref: "#/components/schemas/tenantIndexJob"
        version:
          type: integer
          description: "version of the current response type  "
    tenantIndexJob:
      title: Tenant index job
      description: Tenant index job representation.
      properties:
        tenantId:
          type: string
          description: The id of the tenant for which the indexing has been initiated
        state:
          type: string
          description: "Current state of the process. If started it would be running. "
        creationTimeStamp:
          type: string
          description: The timestamp when the process started.
        endTimeStamp:
          type: string
          description: The timestamp when the process ended.
        jobId:
          type: string
          description: unique number to track jobs
        createdBy:
          type: string
          description: "created by : user/logged-in user"
        links:
          type: array
          description: " a list of links as per Link representation. "
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: "version of the current response type  "
    indexJob:
      title: Index job
      description: Index job representation.
      properties:
        state:
          type: string
          description: "Current state of the process. If started it would be running. "
        creationTimeStamp:
          type: string
          description: The timestamp when the process started.
        endTimeStamp:
          type: string
          description: The timestamp when the process ended.
        jobId:
          type: string
          description: unique number to track jobs
        createdBy:
          type: string
          description: "created by : user/logged-in user"
        links:
          type: array
          description: " a list of links as per Link representation. "
          items:
            $ref: "#/components/schemas/link"
