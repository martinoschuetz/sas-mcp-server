          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /processes/{processId}/subprocesses/{subprocessId}/variables/{variableName}:
    get:
      operationId: getSubprocessVariable
      tags:
      - Processes
      summary: Get variable by name from the subprocess
      description: Retrieve variable with specified name.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      - name: subprocessId
        in: path
        description: Subprocess id
        required: true
        schema:
          type: string
          format: object-id
      - name: variableName
        in: path
        description: Variable name
        required: true
