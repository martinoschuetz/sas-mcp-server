          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /processes/{processId}/subprocesses/{subprocessId}/variables/{variableName}/history:
    get:
      operationId: getSubprocessVariableHistory
      tags:
      - Processes
      summary: Get variable by name from the subprocess
      description: Retrieve modification history of the variable with specified name.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      - name: subprocessId
        in: path
        description: Subprocess id
        required: true
        schema:
          type: string
          format: object-id
      - name: variableName
        in: path
        description: Variable name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/variableCollection"
              examples:
                default:
                  $ref: "#/components/examples/processVariableCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/variableCollection"
              examples:
                default:
                  $ref: "#/components/examples/processVariableCollection"
        "404":
          description: Not Found. The process id and subprocess id could not be found
            in the workflow history service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /processes/{processId}/tasks:
    get:
      operationId: getProcessTasks
      tags:
      - Processes
      summary: Get tasks for a process
      description: Returns a collection of tasks.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/taskCollection"
