---
openapi: 3.0.3
info:
  version: "2"
  title: Workflow History
  description: The Workflow History API provides historical tracking of workflows
    executed using the Workflow Service. The Workflow History tracks process status
    for all workflows and maintains full change history for processes, tasks, and
    variables. This API is intended for use by the Workflow Manager administration
    tool and can be used for report generation
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- description: This is an example of a base URL.
  url: https://example.com/workflowHistory
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Processes
  description: Contains the operations to read, delete processes.
- name: Definitions
  description: Contains the operations to read definitions.
- name: HistoryEvents
  description: Contains the operations to read, update, delete history events.
paths:
  /:
    get:
      operationId: root
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a collection of links to the top-level collections surfaced
        through this API.
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
    head:
      operationId: headersForRoot
      tags:
      - Root
      summary: Check if the service is available
      description: Returns whether or not the service is running.
      responses:
        "200":
          description: OK. Service is running and available
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
  /definitions:
    get:
      operationId: getDefinitions
      tags:
      - Definitions
      summary: Get definitions
      description: Return a collection of definitions that have been part of active
        workflows.
      parameters:
      - name: start
        in: query
        description: The starting index of the first definition in a page. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of definitions to return in this page of results.
          The actual number of returned definitions may be less if the collection
          has been exhausted. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: The criteria for filtering the ${pluralNames}. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/workflowHistory-v2/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the ${pluralNames}. See [Sorting in
          REST APIs](https://developer.sas.com/rest-apis/workflowHistory-v2/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                application/vnd.sas.workflow.history.definition+json:
                  $ref: "#/components/examples/historyDefinitionsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                application/vnd.sas.workflow.history.definition+json:
                  $ref: "#/components/examples/historyDefinitionsCollection"
        "400":
          description: There was invalid data in the request. May provide an additional
            error code.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
  /definitions/{definitionId}:
    get:
      operationId: getDefinition
      tags:
      - Definitions
      summary: Get definition
      description: Returns information about the definition and metrics about the
        processes that have been run with it.
      parameters:
      - name: definitionId
        in: path
        description: definition id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.workflow.history.definition+json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                default:
                  $ref: "#/components/examples/historyDefinition"
        "404":
          description: Not Found. The definition id could not be found in the workflow
            history service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /definitions/{definitionId}/revisions:
    get:
      operationId: getDefinitionReversions
      tags:
      - Definitions
      summary: Get a list of the revisions for a definition that have been instantiated
        for a process
      description: Returns a collection of definitions.  Standard paging, filtering,
        and sorting options are provided.
      parameters:
      - name: definitionId
        in: path
        description: definition id
        required: true
        schema:
          type: string
          format: object-id
      - name: start
        in: query
        description: The starting index of the first group in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of definitions to return in this page of results.
          The actual number of definitions groups may be less if the collection has
          been exhausted. Defaults to 10.
        schema:
          type: integer
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                default:
                  $ref: "#/components/examples/historyDefinitionsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                default:
                  $ref: "#/components/examples/historyDefinitionsCollection"
        "400":
          description: There was invalid data in the request. May provide an additional
            error code.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
  /definitions/{definitionId}/revisions/{revision}:
    get:
      operationId: getDefinitionRevision
      tags:
      - Definitions
      summary: Get history for a specific revision of a definition. Including metrics
        about the associated processes
      description: Returns a revision of a definition.
      parameters:
      - name: definitionId
        in: path
        description: definition id
        required: true
        schema:
          type: string
          format: object-id
      - name: revision
        in: path
        description: Revision number
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.workflow.history.definition+json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                default:
                  $ref: "#/components/examples/historyDefinition"
        "400":
          description: There was invalid data in the request. May provide an additional
            error code.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
  /definitions/{definitionId}/revisions/{revision}/model:
    get:
      operationId: getDefinitionModel
      tags:
      - Definitions
      summary: Get the definition model
      description: Returns the definition model.
      parameters:
      - name: definitionId
        in: path
        description: definition id
        required: true
        schema:
          type: string
          format: object-id
      - name: revision
        in: path
        description: Revision number
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.workflow.history.definition+json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                default:
                  $ref: "#/components/examples/historyDefinition"
        "400":
          description: There was invalid data in the request. May provide an additional
            error code.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: Not Found. The definition id and revision id could not be found
            in the workflow history service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /processes:
    get:
      operationId: getProcesses
      tags:
      - Processes
      summary: Get processes
      description: Return a collection of historical processes. Standard paging options
        are provided.
      parameters:
      - name: start
        in: query
        description: The starting index of the first process in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of processes to return in this page of results.
          The actual number of returned processes may be less if the collection has
          been exhausted. Defaults to 10.
        schema:
          type: integer
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/processCollection"
              examples:
                default:
                  $ref: "#/components/examples/processesCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/processCollection"
              examples:
                default:
                  $ref: "#/components/examples/processesCollection"
        "400":
          description: There was invalid data in the request. May provide an additional
            error code.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
    post:
      operationId: bulkDeleteProcesses
      tags:
      - Processes
      summary: Bulk delete processes
      description: Delete multiple processes once.
      requestBody:
        content:
          application/vnd.sas.selection+json:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
              default:
                $ref: "#/components/examples/processesIdCollection"
          application/json:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
              default:
                $ref: "#/components/examples/processesIdCollection"
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/deleteSelectionResultCollection"
              examples:
                default:
                  $ref: "#/components/examples/processesCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/deleteSelectionResultCollection"
              examples:
                default:
                  $ref: "#/components/examples/processesCollection"
  /processes/{processId}:
    get:
      operationId: getProcess
      tags:
      - Processes
      summary: Get process
      description: Return information about a single process given its unique process
        id.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.workflow.history.process+json:
              schema:
                $ref: "#/components/schemas/process"
              examples:
                default:
                  $ref: "#/components/examples/process"
        "404":
          description: Not Found. The process id could not be found in the workflow
            history service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    delete:
      operationId: deleteProcess
      tags:
      - Processes
      summary: Delete process
      description: Delete process with specified process id.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "204":
          description: The process was deleted.
  /processes/{processId}/history:
    get:
      operationId: getProcessHistory
      tags:
      - Processes
      summary: Get the process state history
      description: Return information about a single process given its unique process
        id.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/processStateCollection"
              examples:
                default:
                  $ref: "#/components/examples/processStatesCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/processStateCollection"
              examples:
                default:
                  $ref: "#/components/examples/processStatesCollection"
        "404":
          description: Not Found. The process id could not be found in the workflow
            history service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /processes/{processId}/variables:
    get:
      operationId: getProcessVariables
      tags:
      - Processes
      summary: Get process variables
      description: Returns a collection of variables including the change history.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      - name: name
        in: query
        description: Names of the variables to return in the collection result.
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/variableCollection"
              examples:
                default:
                  $ref: "#/components/examples/processVariableCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/variableCollection"
              examples:
                default:
                  $ref: "#/components/examples/processVariableCollection"
        "404":
          description: Not Found. The process id could not be found in the workflow
            history service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /processes/{processId}/variables/{variableName}:
    get:
      operationId: getProcessVaraible
      tags:
      - Processes
      summary: Get variable by name
      description: Retrieve variable with specified name.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      - name: variableName
        in: path
        description: Variable name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.workflow.history.variable+json:
              schema:
                $ref: "#/components/schemas/variable"
              examples:
                default:
                  $ref: "#/components/examples/processVariable"
        "404":
          description: Not Found. The process id could not be found in the workflow
            history service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /processes/{processId}/variables/{variableName}/history:
    get:
      operationId: getProcessVariableHistory
      tags:
      - Processes
      summary: Get variable history by name
      description: Retrieve variable history for the specified variable name.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      - name: variableName
        in: path
        description: Variable name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/variableCollection"
              examples:
                default:
                  $ref: "#/components/examples/processVariableCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/variableCollection"
              examples:
                default:
                  $ref: "#/components/examples/processVariableCollection"
        "404":
          description: Not Found. The process id could not be found in the workflow
            history service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /processes/{processId}/subprocesses:
    get:
      operationId: getSubprocesses
      tags:
      - Processes
      summary: Get subprocesses of a process
      description: Returns a collection of subprocesses.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/subprocessCollection"
              examples:
                default:
                  $ref: "#/components/examples/processSubprocessesCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/subprocessCollection"
              examples:
                default:
                  $ref: "#/components/examples/processSubprocessesCollection"
        "404":
          description: Not Found. The process id could not be found in the workflow
            history service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /processes/{processId}/subprocesses/{subprocessId}:
    get:
      operationId: getSubprocess
      tags:
      - Processes
      summary: Get subprocess of a process
      description: Returns information about a single subprocess.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      - name: subprocessId
        in: path
        description: Subprocess id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.workflow.history.subprocess+json:
              schema:
                $ref: "#/components/schemas/subprocess"
              examples:
                default:
                  $ref: "#/components/examples/subprocess"
        "404":
          description: Not Found. The process id and subprocess id could not be found
            in the workflow history service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /processes/{processId}/subprocesses/{subprocessId}/variables:
    get:
      operationId: getSubprocessVariables
      tags:
      - Processes
      summary: Get variables from the subprocess
      description: Returns a collection of variables.
      parameters:
      - name: processId
        in: path
        description: Process id
        required: true
        schema:
          type: string
          format: object-id
      - name: subprocessId
        in: path
        description: Subprocess id
        required: true
        schema:
          type: string
          format: object-id
      - name: scope
        in: query
        description: Scope of the variables to be retrieved. Valid values [local,inherited,null].
          Defaults to null.
        schema:
          type: string
      - name: name
        in: query
        description: Names of the variables to return in the collection result.
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/variableCollection"
              examples:
                default:
                  $ref: "#/components/examples/processVariableCollection"
            application/json:
