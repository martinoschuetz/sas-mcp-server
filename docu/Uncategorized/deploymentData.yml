---
openapi: 3.0.3
info:
  title: DeploymentData
  version: "2"
  description: This API reports data about the deployment of SAS Viya via REST.
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: https://developer.sas.com
tags:
- name: Root
  description: The operations for the root resource.
- name: CadenceVersion
  description: Information about the cadence version of the deployment.
- name: LicenseFile
  description: Information about the SAS Viya license file.
- name: PermissionToggles
  description: Permission toggles that control features.
servers:
- url: https://example.com/deploymentData
  description: Deployment Data API server
paths:
  /:
    get:
      tags:
      - Root
      operationId: root
      summary: Top level root resource
      description: Retrieve the top-level entry points for the DeploymentData API.
      responses:
        "200":
          description: Root entry points
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
            Last-Modified:
              description: When the resource was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/root"
        "404":
          description: DeploymentData API is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/404NotAvailable"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/404NotAvailable"
    head:
      tags:
      - Root
      operationId: headersForRoot
      summary: Root headers
      description: Retrieve the headers for the root resource.
      responses:
        "200":
          description: Headers for root resource
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
            Last-Modified:
              description: When the resource was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/root"
        "404":
          description: DeploymentData API is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/404NotAvailable"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/404NotAvailable"
  /cadenceVersion:
    get:
      tags:
      - CadenceVersion
      operationId: getCadenceVersion
      summary: Get cadence version
      description: Retrieve cadence version details of the deployment.
      responses:
        "200":
          description: Cadence version details
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
            Last-Modified:
              description: When the resource was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.deployment.data.cadence.version:
              schema:
                $ref: "#/components/schemas/cadenceVersion"
              examples:
                api:
                  $ref: "#/components/examples/cadenceVersion"
            application/json:
              schema:
                $ref: "#/components/schemas/cadenceVersion"
              examples:
                api:
                  $ref: "#/components/examples/cadenceVersion"
    head:
      tags:
      - CadenceVersion
      operationId: headersForCadenceVersion
      summary: Cadence version headers
      description: Retrieve headers for the cadence version resource.
      responses:
        "200":
          description: Headers for cadence version
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
            Last-Modified:
              description: When the resource was last modified.
              schema:
                type: string
                format: date-time
  /licenseFile:
    get:
      tags:
      - LicenseFile
      operationId: getLicenseFile
      summary: Get license file
      description: Retrieve license file information.
      responses:
        "200":
          description: License file details
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
            Last-Modified:
              description: When the resource was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.deployment.data.license.file:
              schema:
                $ref: "#/components/schemas/licenseFile"
              examples:
                api:
                  $ref: "#/components/examples/licenseFile"
            application/json:
              schema:
                $ref: "#/components/schemas/licenseFile"
              examples:
                api:
                  $ref: "#/components/examples/licenseFile"
    head:
      tags:
      - LicenseFile
      operationId: headersForLicenseFile
      summary: License file headers
      description: Retrieve headers for the license file resource.
      responses:
        "200":
          description: Headers for license file
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
            Last-Modified:
              description: When the resource was last modified.
              schema:
                type: string
                format: date-time
  /permissionToggles:
    get:
      tags:
      - PermissionToggles
      operationId: getPermissionToggles
      summary: Get permission toggles
      description: Retrieve all permission toggles for this deployment.
      responses:
        "200":
          description: Permission toggles
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
            Last-Modified:
              description: When the resource was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/permissionToggleCollection"
              examples:
                api:
                  $ref: "#/components/examples/permissionToggles"
            application/json:
              schema:
                $ref: "#/components/schemas/permissionToggleCollection"
              examples:
                api:
                  $ref: "#/components/examples/permissionToggles"
components:
  schemas:
    api:
      type: object
      description: Top-level API entry points for the DeploymentData service.
      properties:
        version:
          type: string
          description: Version of the API.
        links:
          type: array
          description: Hypermedia links to related resources.
          items:
            $ref: "#/components/schemas/link"
    link:
      type: object
      description: A hypermedia link to another API resource.
      properties:
        method:
          type: string
          description: HTTP method for the link.
        rel:
          type: string
          description: Relation type describing the link’s purpose.
        href:
          type: string
          description: Target URL for the link.
        type:
          type: string
          description: Media type of the linked resource.
    cadenceVersion:
      type: object
      description: Represents cadence version information for the deployment.
      properties:
        version:
          type: string
          description: Version of the cadence.
        cadenceName:
          type: string
          description: Human-readable cadence name.
        cadenceDate:
          type: string
          format: date
          description: Date associated with the cadence.
    licenseFile:
      type: object
      description: Represents details of the SAS Viya license file.
      properties:
        version:
          type: string
          description: Version of the license file.
        fileName:
          type: string
          description: Name of the license file.
        content:
          type: string
          description: Encoded content of the license file.
    permissionToggleCollection:
      type: object
      description: A collection of permission toggles for this deployment.
      properties:
        version:
          type: string
          description: Version of the collection format.
        count:
          type: integer
          description: Number of toggles in the collection.
        items:
          type: array
          description: List of permission toggles.
          items:
            $ref: "#/components/schemas/permissionToggle"
    permissionToggle:
      type: object
      description: A single permission toggle that controls a feature.
      properties:
        name:
          type: string
          description: Name of the toggle.
        enabled:
          type: boolean
          description: Indicates whether the toggle is enabled.
    error2:
      type: object
      description: Error response schema for API failures.
      properties:
        version:
          type: string
          description: Version of the error response schema.
        httpStatusCode:
          type: integer
          description: HTTP status code of the error.
        message:
          type: string
          description: Error message summary.
        details:
          type: string
          description: Detailed error information.
  examples:
    404NotAvailable:
      summary: Error - API Unavailable
      description: Example error response
      value:
        version: "1"
        httpStatusCode: 404
        message: Not Found
        details: The Service is unavailable.
    permissionToggles:
      summary: Permission toggles response
      description: Example permission toggles list
      value:
        version: "1"
        count: 2
        items:
        - name: featureA
          enabled: true
        - name: featureB
          enabled: false
    licenseFile:
      summary: License file response
      description: Example license file details
      value:
        version: "1"
        fileName: "license.sas"
        content: "BASE64_ENCODED_CONTENT"
    root:
      summary: Root API Response
      description: Example of root entry points
      value:
        version: "1"
        links:
        - method: GET
          rel: cadenceVersion
          href: /deploymentData/cadenceVersion
          type: application/vnd.sas.deployment.data.cadence.version
        - method: GET
          rel: licenseFile
          href: /deploymentData/licenseFile
          type: application/vnd.sas.deployment.data.license.file
        - method: GET
          rel: permissionToggles
          href: /deploymentData/permissionToggles
          type: application/vnd.sas.collection+json
    cadenceVersion:
      summary: Cadence version response
      description: Example cadence version of deployment
      value:
        version: "1"
        cadenceName: stable
        cadenceDate: "2025-09-19"
