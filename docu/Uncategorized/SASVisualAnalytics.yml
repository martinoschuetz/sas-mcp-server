---
openapi: 3.0.3
info:
  title: VisualAnalytics
  description: >
    This strictly private API is for the use of the Visual Analytics application.
    It is tightly coupled with
    the application and subject to change, possibly breaking, without notice (it is
    part of the same
    executable as the application).

    The initial purpose of this API is to improve startup times for the newly logging
    in user.
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
  version: "2"
tags:
- name: Root
  description: Root hateoas links.
- name: Startup
  description: Operation to assist initializing the application.
paths:
  /ui:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: getRoot
      parameters:
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/api_links"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/api_links"
        "304":
          description: not modified, the browser cache is current.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
  /ui/startup:
    get:
      tags:
      - Startup
      summary: Get startup details for the user
      description: >
        This operation performs what were initially 10 (or more) separate requests
        from the client. This is done
        server side for performance reasons. 
      operationId: getStartup
      parameters:
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      - name: vanPreferences
        in: query
        description: if true, use internal logic to build the preferences filter.
          The production use case will likely specify this.
        required: false
        schema:
          type: boolean
          default: false
      - name: preferenceIds
        in: query
        description: >
          Optional CSV list of preference IDs, add these to the calculated preferences
          filter.  May be used in conjunction with "vanPreferences" and "preferencesFilter".
        required: false
        schema:
          type: string
      - name: excludePreferenceIds
        in: query
        description: >
          This CSV list specifies preference IDs to explicitly exclude.  The motive
          is to allow
          the client to exclude highly volatile preferences so as to increase the
          likelihood of
          a client cache hit (e.g. eTags).  Likely this is for "sas.van.userStateBlock".
        required: false
        schema:
          type: string
      - name: preferencesFilter
        in: query
        description: >
          Optional filter string for preferences. If specified it will be used. May
          be used
          in conjunction with "vanPreferences" and "preferenceIds".
        required: false
        schema:
          type: string
      - name: showPreferencesFilter
        in: query
        description: >
          If true, the fully calculated preferences filter is returned in member "preferencesFilter".
        required: false
        schema:
          type: boolean
          default: false
      - name: timeoutMSec
        in: query
        description: >
          How long, in milliseconds, to wait for responses; default 20000 (20 seconds).
        required: false
        schema:
          type: integer
          default: 20000
      - name: reset
        in: query
        description: if true, caches are cleared before the operation proceeds.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
          content:
            application/vnd.sas.va.startup+json:
              schema:
                $ref: "#/components/schemas/startup"
              examples:
                normal:
                  $ref: "#/components/examples/startup_normal"
                errors:
                  $ref: "#/components/examples/startup_errors"
            application/json:
              schema:
                $ref: "#/components/schemas/startup"
              examples:
                normal:
                  $ref: "#/components/examples/startup_normal"
                errors:
                  $ref: "#/components/examples/startup_errors"
        "304":
          description: not modified, the browser cache is current.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
    head:
      tags:
      - Startup
      summary: Existence check startup details for the user
      description: >
        This operation performs what were initially 10 (or more) separate requests
        from the client. This is done
        server side for performance reasons. 
      operationId: headersForStartup
      parameters:
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      - name: vanPreferences
        in: query
        description: if true, use internal logic to build the preferences filter.
          The production use case will likely specify this.
        required: false
        schema:
          type: boolean
          default: false
      - name: preferenceIds
        in: query
        description: >
          Optional CSV list of preference IDs, add these to the calculated preferences
          filter.  May be used in conjunction with "vanPreferences" and "preferencesFilter".
        required: false
        schema:
          type: string
      - name: excludePreferenceIds
        in: query
        description: >
          This CSV list specifies preference IDs to explicitly exclude.  The motive
          is to allow
          the client to exclude highly volatile preferences so as to increase the
          likelihood of
          a client cache hit (e.g. eTags).  Likely this is for "sas.van.userStateBlock".
        required: false
        schema:
          type: string
      - name: preferencesFilter
        in: query
        description: >
          Optional filter string for preferences. If specified it will be used. May
          be used
          in conjunction with "vanPreferences" and "preferenceIds".
        required: false
        schema:
          type: string
      - name: showPreferencesFilter
        in: query
        description: >
          If true, the fully calculated preferences filter is returned in member "preferencesFilter".
        required: false
        schema:
          type: boolean
          default: false
      - name: timeoutMSec
        in: query
        description: >
          How long, in milliseconds, to wait for responses; default 20000 (20 seconds).
        required: false
        schema:
          type: integer
          default: 20000
      - name: reset
        in: query
        description: if true, caches are cleared before the operation proceeds.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
          content:
            application/vnd.sas.va.startup+json:
              schema:
                $ref: "#/components/schemas/startup"
              examples:
                normal:
                  $ref: "#/components/examples/startup_normal"
                errors:
                  $ref: "#/components/examples/startup_errors"
            application/json:
              schema:
                $ref: "#/components/schemas/startup"
              examples:
                normal:
                  $ref: "#/components/examples/startup_normal"
                errors:
                  $ref: "#/components/examples/startup_errors"
        "304":
          description: not modified, the browser cache is current.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
  /ui/startupMobile:
    get:
      tags:
      - Startup
      summary: Get startup details for the Mobile user
      description: >
        This operation performs what were initially 10 (or more) separate requests
        from the Mobile client. This is done
        server side for performance reasons. 
      operationId: getStartupMobile
      parameters:
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      - name: timeoutMSec
        in: query
        description: >
          How long, in milliseconds, to wait for responses; default 20000 (20 seconds).
        required: false
        schema:
          type: integer
          default: 20000
      - name: reset
        in: query
        description: if true, caches are cleared before the operation proceeds.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
          content:
            application/vnd.sas.va.mobile.startup+json;version=2:
              schema:
                $ref: "#/components/schemas/startupMobile"
              examples:
                mobile:
                  $ref: "#/components/examples/startup_mobileV2"
            application/vnd.sas.va.mobile.startup+json;version=1:
              schema:
                $ref: "#/components/schemas/startupMobile"
              examples:
                mobile:
                  $ref: "#/components/examples/startup_mobileV1"
            application/vnd.sas.va.mobile.startup+json:
              schema:
                $ref: "#/components/schemas/startupMobile"
              examples:
                mobile:
                  $ref: "#/components/examples/startup_mobileV2"
            application/json:
              schema:
                $ref: "#/components/schemas/startupMobile"
              examples:
                mobile:
                  $ref: "#/components/examples/startup_mobileV2"
        "304":
          description: not modified, the client's cache is current.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
    head:
      tags:
      - Startup
      summary: Existence check startup details for the Mobile user
      description: >
        This operation performs what were initially 10 (or more) separate requests
        from the Mobile client. This is done
        server side for performance reasons. 
      operationId: headersForStartupMobile
      parameters:
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      - name: timeoutMSec
        in: query
        description: >
          How long, in milliseconds, to wait for responses; default 20000 (20 seconds).
        required: false
        schema:
          type: integer
          default: 20000
      - name: reset
        in: query
        description: if true, caches are cleared before the operation proceeds.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
        "304":
          description: not modified, the client's cache is current.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
servers:
- url: http://example.com/SASVisualAnalytics
  description: Sample server URL.
components:
  schemas:
    startup:
      title: Startup
      description: >
        The curated startup data for the user.  In some cases, the original data fetched
        for the user
        is filtered, only returning content which this client uses.  This saves considerably
        on the
        download payload.
      x-sas-media-type:
        name: application/vnd.sas.va.startup+json
        version: "1"
      properties:
        errors:
          description: >
            If any subsystem call fails, an error will be in this array with details.
            Error member 'errorCode'
            will be specified and indicates the subsystem which failed.  The codes
            are:
            12000-cadence version, 12001-guest support, 12002-preferences, 12003-authorization,
            12004-themes,
            12005-settings report data, 12006-settings maps, 12007-settings CAS Mgmt,
            12008-settings report renderer,
            12009-settings visual analytics administration, 12010-links visual analytics
            administration,
            12011-links reports, 12012-links report templates, 12013-licenses.

            Note: in order to artificially force errors to be returned, specify request
            parameters:  ?reset=true,timeoutMSec=1
          type: array
          items:
            $ref: "#/components/schemas/error2"
        cadenceVersion:
          type: string
          description: The current cadence version, e.g. "2020".
        guestAccess:
          type: boolean
          description: Does this server support guest logon.
        authorization:
          description: >
            The result of authorization analysis for the user.  This will be two maps,
            "authorized" and "notAuthorized".
            In each case the map keys will be the URI in question, the value the HTTP
            verb checked.  For example:
            "/reportRenderer/images":"POST".
          type: object
          properties:
            authorized:
              description: the authorized URIs (map of URI-HTTP verb)
              type: object
              additionalProperties:
                type: string
            notAuthorized:
              description: the NOT authorized URIs (map of URI-HTTP verb)
              type: object
              additionalProperties:
                type: string
        defaultReportTheme:
          description: The default report theme. This is a simple pass through of
            whatever "/themes/themes/@defaultReportTheme" returns.
          type: object
        preferences:
          description: simple map of preference key to preference value.
          type: object
          additionalProperties:
            type: string
        settings:
          description: settings from several services
          type: object
          properties:
            reportData:
              $ref: "#/components/schemas/attributes"
            maps:
              $ref: "#/components/schemas/attributes"
            casManagement:
              $ref: "#/components/schemas/attributes"
            reportRenderer:
              $ref: "#/components/schemas/attributes"
            visualAnalyticsAdministration:
              $ref: "#/components/schemas/attributes"
        serviceLinks:
          description: >
            Navigation links for 3 services- "visual analytics administration", "reports"
            and "report templates".
            By design and at the request of the client, member "href" is removed (for
            download performance reasons).
          type: object
          properties:
            visualAnalyticsAdministration:
              $ref: "#/components/schemas/api"
            reports:
              $ref: "#/components/schemas/api"
            reportTemplates:
              $ref: "#/components/schemas/api"
        durations:
          description: debug information, map of timings of each operation as well
            as the total time to complete. Not returned at customer sites.
          type: object
          additionalProperties:
            type: string
        preferencesFilter:
          description: >
            optional debug information, indicating the calculated filter sent to the
            preferences service. This is
            only returned if request parameter "showPreferencesFilter=true".
          type: string
        version:
          description: Schema version, this schema is version 1.
          type: integer
    startupMobile:
      title: Startup for mobile
      description: >
        The curated startup data for the user, for "mobile" use.  In some cases, the
        original data fetched for the user
        is filtered, only returning content which this client uses.  This saves considerably
        on the
        download payload.
      x-sas-media-type:
        name: application/vnd.sas.va.mobile.startup+json
        version: "2"
      properties:
        errors:
          description: |
            If any subsystem call fails, an error will be in this array with details.
            Error member 'errorCode' will be specified and indicates the subsystem which failed. The codes are:
            12000-cadence version, 
            12005-settings report data, 12006-settings maps, 12009-settings visual analytics administration,
            12011-links reports, 12013-licenses, 12014-report images, 12015-links report images,
            12016-search, 12018-feature flags, 12019-report version, 12020-reports, 12021-identities.

            Note: in order to artificially force errors to be returned, specify request parameters:  ?reset=true,timeoutMSec=1
          type: array
          items:
            $ref: "#/components/schemas/error2"
        cadenceVersion:
          type: string
          description: The current cadence version, e.g. "2020".
        cadenceDisplayName:
          type: string
          description: The current cadence display name, e.g. "Fast R/TR".
        serviceLinks:
          description: >
            Navigation links for the service- "report images". Other services could
            be added as needed.
            By design and at the request of the client, member "href" is removed (for
            download performance reasons).
          type: object
          properties:
            reportImages:
              $ref: "#/components/schemas/api"
        searchExists:
          description: does search appear to be installed
          type: boolean
        settings:
          description: |
            settings from several services

            Starting in **Version 2**:
            * **visualAnalyticsAdministration** has been added
            * **deviceManagement** has been removed
          type: object
          properties:
            reportData:
              $ref: "#/components/schemas/attributes"
            maps:
              $ref: "#/components/schemas/attributes"
            deviceManagement:
              $ref: "#/components/schemas/attributes"
            visualAnalyticsAdministration:
              $ref: "#/components/schemas/attributes"
        featureFlags:
          description: list of the enabled feature flags
          type: array
          items:
            type: string
        reportVersionDefault:
          description: the default report version.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/reportVersion"
        reportVersions:
          description: array of all report versions
          type: array
          items:
            $ref: "#/components/schemas/reportVersion"
        identity:
          description: caller's identity from identities service. Note links have
            been reduced to those desired.
          type: object
          properties:
            id:
              description: the user's ID
              type: string
            name:
              description: the user's name
              type: string
            links:
              description: >
                3 links: "self", "avatar", "avatarContent"
              type: array
              items:
                $ref: "#/components/schemas/api"
        durations:
          description: debug information, map of timings of each operation as well
            as the total time to complete. Not returned at customer sites.
          type: object
          additionalProperties:
            type: string
        version:
          description: Schema version, this schema is version 2.
          type: integer
    reportVersion:
      title: report version
      description: report version, from /reports/versions
      properties:
        schema:
          description: the report schema, e.g. "4.29.0"
          type: string
        mediaType:
          description: the media type integer, e.g. 34
          type: integer
        version:
          description: the version of this schema, the current version is 1
          type: integer
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    attributes:
      title: Attributes
      description: Contains a set of attributes in the form of a map from string names
        to arbitrary values. The values may be strings, numbers, booleans, arrays,
        objects or null.
      x-sas-media-type:
        name: application/vnd.sas.attributes
        version: 1
      required:
      - version
      - attributes
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        description:
          type: string
          description: A description of the set of attributes.
        label:
          type: string
          description: A brief description or label for the set of attributes.
        attributes:
          type: object
          description: 'The map of attribute names to values.  The set of names is
            open, though individual services may define a closed set needed for a
            given resource in that service. The value of each attribute may be of
            types: number, string, boolean, array, or object.  Although property this
            is required, the mapping object can be empty, unless stated otherwise
            by specific documentation for resources where the application/vnd.sas.attributes
            type is used.'
          additionalProperties: true
        links:
          description: Links to associated resources and operations. APIs may provide
            links for the link relations `self', `update` (to replace the attributes),
            `patch` (to update some attributes) or others.
          type: array
          items:
            $ref: "#/components/schemas/link"
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
  examples:
    api_links:
      description: API links from "/ui".
      value: {"version": 1, "links": [{"method": "GET", "rel": "startup", "href": "/SASVisualAnalytics/ui/startup",
            "uri": "/SASVisualAnalytics/ui/startup", "type": "application/vnd.sas.va.startup+json"},
          {"method": "GET", "rel": "startupVANPreferences", "href": "/SASVisualAnalytics/ui/startup?vanPreferences=true",
            "uri": "/SASVisualAnalytics/ui/startup?vanPreferences=true", "type": "application/vnd.sas.va.startup+json"},
          {"method": "GET", "rel": "startupMobile", "href": "/SASVisualAnalytics/ui/startupMobile",
            "uri": "/SASVisualAnalytics/ui/startupMobile", "type": "application/vnd.sas.va.mobile.startup+json"}]}
    startup_mobileV1:
      description: "mobile return values V1"
      value: {"durations": {"cadenceVersion": "2.388µs", "featureFlags": "15.897285ms",
          "identities": "18.781308ms", "linksReportImages": "23.904754ms", "linksSearch": "1.452µs",
          "reportVersion": "1.313µs", "reports": "990ns", "settingsMaps": "939ns",
          "settingsReportData": "1.695µs", "total": "24.010696ms"}, "cadenceVersion": "2020",
        "cadenceDisplayName": "Fast R/TR", "serviceLinks": {"reportImages": [{"method": "POST",
              "rel": "createJob", "uri": "/reportImages/jobs", "type": "application/vnd.sas.report.images.job.request",
              "responseType": "application/vnd.sas.report.images.job"}, {"method": "POST",
              "rel": "createJobWithParameters", "uri": "/reportImages/jobs", "responseType": "application/vnd.sas.report.images.job"},
            {"method": "POST", "rel": "createJobReportBody", "uri": "/reportImages/jobs",
              "type": "application/vnd.sas.report.content", "responseType": "application/vnd.sas.report.images.job"},
            {"method": "DELETE", "rel": "deleteForReport", "uri": "/reportImages/images?reportUri={reportUri}"},
            {"method": "DELETE", "rel": "deleteAll", "uri": "/reportImages/images"},
            {"method": "GET", "rel": "settings", "uri": "/reportImages/commons/settings",
              "type": "application/vnd.sas.attributes"}, {"method": "GET", "rel": "reportSummary",
              "uri": "/reportImages/reportSummary?reportUri={reportUri}", "type": "text/plain"}]},
        "searchExists": true, "settings": {"reportData": {"attributes": {"comparisonEpsilon": "1e-12",
              "enableInteractiveData": false, "enableMultiDimensionalSubtotals": true,
              "exportExcelColumnLimit": 16384, "exportExcelRowLimit": 100000, "exportTSVandCSVColumnLimit": 16384,
              "exportTSVandCSVRowLimit": 100000, "joinQueryTimeoutSeconds": 300, "maxRowsLookup.bubble": 25000,
              "maxRowsLookup.buttonBar": 100, "maxRowsLookup.crosstab": 40000, "maxRowsLookup.customContent": 40000,
              "maxRowsLookup.dropdown": 500, "maxRowsLookup.dualAxisTimeSeries": 10000,
              "maxRowsLookup.geoBubble": 25000, "maxRowsLookup.geoContour": 40000,
              "maxRowsLookup.geoHeatmap": 25000, "maxRowsLookup.geoLine": 10000, "maxRowsLookup.geoPie": 25000,
              "maxRowsLookup.geoRegion": 5000, "maxRowsLookup.geoScatter": 40000,
              "maxRowsLookup.graphDefault": 3000, "maxRowsLookup.heatbox": 800, "maxRowsLookup.heatmap": 3000,
              "maxRowsLookup.keyValue": 100, "maxRowsLookup.kpi": 10, "maxRowsLookup.list": 50000,
              "maxRowsLookup.listTable": 40000, "maxRowsLookup.scatter": 40000, "maxRowsLookup.textInput": 40000,
              "maxRowsLookup.timeSeries": 10000, "maxRowsLookup.treeMap": 1500, "maxRowsLookup.wordCloud": 100,
              "socketTimeoutLiveCancellableMillis": 900000}}, "maps": {"attributes": {
              "defaultOSMCommunicationProtocol": "https", "localEsriServicesRequiresAuthentication": false,
