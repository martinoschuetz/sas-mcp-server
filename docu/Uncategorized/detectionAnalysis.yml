---
openapi: 3.0.3
info:
  title: Detection Analysis
  version: "1"
  description: |
    This API provides operations for analyzing and managing detection markings and triage information.
    Detection Analysis API enables solutions to retrieve and filter marking data for fraud detection,
    transaction monitoring, and alert management.
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
servers:
- url: "http://example.com/detectionAnalysis"
  description: example server
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Markings
  description: Contains the operations for managing detection markings and triage
    information.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a list of top-level links.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/api"
        "404":
          description: Service is not available.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/service_not_available_error_503"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/service_not_available_error_503"
  "/markings":
    get:
      summary: List markings
      description: |
        Retrieves a paginated list of detection markings with optional filtering by organization,
        classification, alert type, and entity type. Returns a collection of marking items with pagination metadata.
      operationId: getMarkings
      tags:
      - Markings
      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      - $ref: "#/components/parameters/organizationIdParam"
      - $ref: "#/components/parameters/messageClassificationNmParam"
      - $ref: "#/components/parameters/alertTypeCdParam"
      - $ref: "#/components/parameters/entityTypeIdParam"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Content-Disposition:
              description: Indicates that the content is a downloadable CSV file (when
                requested). The CSV file contains a file name and a disposition type.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/markingCollection"
              examples:
                default:
                  $ref: "#/components/examples/list_markings"
            application/json:
              schema:
                $ref: "#/components/schemas/markingCollection"
              examples:
                default:
                  $ref: "#/components/examples/list_markings"
            application/csv:
              schema:
                type: string
                description: A CSV formatted representation of markings. This file
                  is returned as a downloadable attachment when the client requests
                  a CSV file (Accept application/csv or ?format=csv).
              examples:
                default:
                  summary: Example CSV content (first line is header)
                  value: |-
                    messageId,lastModifiedDttm,lastModifiedByNm,revisionId,createdDttm,messageOrganizationNm,messageOrganizationId,messageClassificationNm,alertTypeCd,entityValueNm,entityTypeId
                    msg-12345,2026-02-12T10:30:00Z,john.doe,1,2026-02-10T08:15:00Z,ACME Corp,org-001,Fraud Detection,SUSPICIOUS_ACTIVITY,Account-789,ACCOUNT
components:
  parameters:
    startParam:
      name: start
      in: query
      description: The 0-based offset of the first resource to return. The default
        is '0'.
      schema:
        type: integer
        minimum: 0
        default: 0
    limitParam:
      name: limit
      in: query
      description: The maximum number of resources to return. The default is '20'.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 20
    filterParam:
      name: filter
      in: query
      description: "The filter criteria for returned resources. For more information,\
        \ see [Filtering in REST APIs](https://developer.sas.com/rest-apis/detectionAnalysis-v1/docs/getting-started/usage-notes#filtering)"
      schema:
        type: string
        format: filter-criteria
    sortByParam:
      name: sortBy
      in: query
      description: "Specifies the sorting for returned resources. For more information,\
        \ see [Sorting in REST APIs](https://developer.sas.com/rest-apis/detectionAnalysis-v1/docs/getting-started/usage-notes#sorting)"
      schema:
        type: string
        format: sort-criteria
    organizationIdParam:
      name: organizationId
      in: query
      description: Filter by the message organization ID.
      required: false
      schema:
        type: string
    messageClassificationNmParam:
      name: messageClassificationNm
      in: query
      description: Filter by the message classification name.
      required: false
      schema:
        type: string
    alertTypeCdParam:
      name: alertTypeCd
      in: query
      description: Filter by the alert type code.
      required: false
      schema:
        type: string
    entityTypeIdParam:
      name: entityTypeId
      in: query
      description: Filter by the entity type ID.
      required: false
      schema:
        type: string
  headers:
    locationHeader:
      description: The URI of the resource.
      schema:
        type: string
    lastModifiedHeader:
      description: The date and time that the resource was last modified.
      schema:
        type: string
        format: date-time
    etagHeader:
      description: The entity tag that identifies the current version of the resource.
      schema:
        type: string
  schemas:
    marking:
      type: object
      description: Represents a detection marking with associated metadata.
      properties:
        messageId:
          type: string
          description: A unique identifier for the message.
        lastModifiedDttm:
          type: string
          format: date-time
          description: The timestamp when the marking was last modified.
        lastModifiedByNm:
          type: string
          description: The name of the user who last modified the marking.
        revisionId:
          type: integer
          format: int16
          description: The revision identifier for the marking.
        createdDttm:
          type: string
          format: date-time
          description: The timestamp when the marking was created.
        messageProcessedDttm:
          type: string
          format: date-time
          description: The timestamp when the message was processed.
        messageOrganizationNm:
          type: string
          description: The name of the organization to which the message belongs.
        messageOrganizationId:
          type: string
          description: A unique identifier for the organization to which the message
            belongs.
        messageClassificationNm:
          type: string
          description: The classification name of the message.
        alertTypeCd:
          type: string
          description: The alert type code.
        entityValueNm:
          type: string
          description: The name of the entity value.
        entityTypeId:
          type: string
          description: Unique identifier for the entity type
      required:
      - messageId
    markingCollection:
      title: MarkingCollection
      description: A collection of marking items with pagination metadata.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The results of a query.
            items:
              $ref: "#/components/schemas/marking"
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
  examples:
    service_not_available_error_503:
      description: A sample response when the service is not available.
      value: {"version": 2, "httpStatusCode": 503, "errorCode": 1000000, "message": "Service\
          \ not available"}
    api:
      description: Returns a list of API links.
      value:
        version: 1
        links:
        - rel: markings
          method: GET
          href: /detectionAnalysis/markings
          uri: /detectionAnalysis/markings
          type: application/vnd.sas.collection+json
        - rel: self
          method: GET
          href: /detectionAnalysis
          uri: /detectionAnalysis
          type: application/vnd.sas.api+json
    list_markings:
      description: A response example for listing markings with pagination.
      value:
        name: markings
        accept: application/vnd.sas.detection.marking
        count: 2
        start: 0
        limit: 20
        items:
        - messageId: "msg-12345"
          lastModifiedDttm: "2026-02-12T10:30:00Z"
          lastModifiedByNm: "john.doe"
          revisionId: 1
          createdDttm: "2026-02-10T08:15:00Z"
          messageProcessedDttm: "2026-02-10T08:20:00Z"
          messageOrganizationNm: "ACME Corp"
          messageOrganizationId: "org-001"
          messageClassificationNm: "Fraud Detection"
          alertTypeCd: "SUSPICIOUS_ACTIVITY"
          entityValueNm: "Account-789"
          entityTypeId: "ACCOUNT"
        - messageId: "msg-67890"
          lastModifiedDttm: "2026-02-11T14:45:00Z"
          lastModifiedByNm: "jane.smith"
          revisionId: 2
          createdDttm: "2026-02-09T12:00:00Z"
          messageProcessedDttm: "2026-02-09T12:05:00Z"
          messageOrganizationNm: "Global Bank"
          messageOrganizationId: "org-002"
          messageClassificationNm: "Transaction Monitoring"
          alertTypeCd: "HIGH_RISK_TRANSACTION"
          entityValueNm: "Transaction-456"
          entityTypeId: "TRANSACTION"
        links:
        - rel: self
          method: GET
          href: /detectionAnalysis/markings?start=0&limit=20
          uri: /detectionAnalysis/markings
          type: application/vnd.sas.collection+json
        - rel: collection
          method: GET
          href: /detectionAnalysis/markings
          uri: /detectionAnalysis/markings
          type: application/vnd.sas.collection+json
