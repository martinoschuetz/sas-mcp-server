---
openapi: 3.0.3
info:
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  title: Theme Content
  description: The Theme Content API manages a repository of theme content resources.
  version: "2"
tags:
- name: Theme Content
  description: The operations for a theme content resource.
- name: Theme Content Item
  description: The operations for a theme content resource item.
- name: Root
  description: The operations for the root resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the top-level links
      description: The root links for this API.
      operationId: root
      responses:
        "200":
          description: The API's links.
          headers:
            Content-Type:
              schema:
                type: string
                format: media-type
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/root_links"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/root_links"
    head:
      tags:
      - Root
      summary: Get the headers for the API
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded. The service is available.
          headers:
            Content-Type:
              schema:
                type: string
  "/themes/{themeId}":
    get:
      summary: Get theme proxy resource
      description: Returns theme content metadata
      tags:
      - Theme Content
      operationId: getTheme
      parameters:
      - $ref: "#/components/parameters/themeId"
      - name: excludeFields
        in: query
        required: false
        description: Comma-separated field names to exclude from the response. The
          only supported value is contentItemUris.
        schema:
          type: string
          enum:
          - contentItemUris
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the theme proxy.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the theme content was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.theme.content+json:
              schema:
                $ref: "#/components/schemas/themeContent"
              examples:
                json:
                  $ref: "#/components/examples/getThemeResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/themeContent"
              examples:
                json:
                  $ref: "#/components/examples/getThemeResponse"
        "400":
          description: The request is not valid. If excludeFields parameter specified
            it must have value 'contentItemUris'.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getTheme400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getTheme400Response"
        "404":
          description: No such resource exists for the given ID or path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getTheme404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getTheme404Response"
    head:
      summary: Get the headers for theme proxy
      description: Returns the headers for the specified theme content metadata
      tags:
      - Theme Content
      operationId: headersForTheme
      parameters:
      - $ref: "#/components/parameters/themeId"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the theme proxy.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the theme content was last modified.
              schema:
                type: string
        "404":
          description: No such resource exists for the given ID or path.
  "/themes/{themeId}/content":
    put:
      summary: Update theme content
      description: Updates theme content based on the representation in the request
        body. Restricted to members of ApplicationAdministrators group.
      operationId: updateThemeContent
      tags:
      - Theme Content
      parameters:
      - $ref: "#/components/parameters/themeId"
      requestBody:
        content:
          application/zip:
            schema:
              type: string
              format: binary
            examples:
              sampleFile:
                summary: A sample file
                externalValue: './examples/theme-content.zip'
        description: The representation of theme content.
        required: true
      responses:
        "200":
          description: Theme content was updated.
          headers:
            ETag:
              description: The entity tag for the theme content.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the theme content resource was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.theme.content+json:
              schema:
                $ref: "#/components/schemas/themeContent"
              examples:
                json:
                  $ref: "#/components/examples/putThemeContentResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/themeContent"
              examples:
                json:
                  $ref: "#/components/examples/putThemeContentResponse"
        "400":
          description: The theme content request is not valid. Ensure the provided
            content is not greater than 1MB and that the themeId in the path matches
            the zip content.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putThemeContent400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putThemeContent400Response"
    delete:
      summary: Delete theme content
      description: Deletes theme content for the specified theme. Restricted to members
        of ApplicationAdministrators group.
      tags:
      - Theme Content
      operationId: deleteThemeContent
      parameters:
      - $ref: "#/components/parameters/themeId"
      responses:
        "204":
          description: The theme content was deleted.
        "404":
          description: No theme content exists at the requested path.
  "/themes/{themeId}/content/{themeContentResourcePath}":
    get:
      summary: Get theme content resource item
      description: Returns a theme content resource item.
      tags:
      - Theme Content Item
      operationId: getThemeContent
      parameters:
      - $ref: "#/components/parameters/themeId"
      - name: themeContentResourcePath
        in: path
        required: true
        description: A path parameter specified by the client, not the service.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: The entity tag obtained from the most recent `ETag` response
          header.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The type of content in the response
              schema:
                type: string
            ETag:
              description: The entity tag for the theme content resource item.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the theme content resource item was last modified.
              schema:
                type: string
          content:
            text/css:
              schema:
                type: string
              examples:
                css:
                  summary: A stylesheet
                  value: '.Menu {color: #008000; border: 1px solid blue;}'
        "302":
          description: Theme content resource item exists at the static theme content
            location.
          headers:
            Location:
              description: The redirect URL for a theme content resource item at another
                endpoint.
              schema:
                type: string
        "304":
          description: Theme content resource item not modified - If-None-Match header
            value and current ETag values match.
        "404":
          description: No such resource exists for the given ID or path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getThemeResource404Response"
    head:
      summary: Get the headers for a theme content resource item
      description: Returns the headers for the specified theme content resource item.
        Also used to determine whether a particular theme content resource item exists.
      tags:
      - Theme Content Item
      operationId: headersForThemeContentResource
      parameters:
      - $ref: "#/components/parameters/themeId"
      - name: themeContentResourcePath
        in: path
        required: true
        description: A path parameter specified by the client, not the service.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: The entity tag obtained from the most recent `ETag` response
          header.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The type of content in the response
              schema:
                type: string
            ETag:
              description: The entity tag for the theme content resource item.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the theme content resource item was last modified.
              schema:
                type: string
        "304":
          description: Theme content resource item not modified - If-None-Match header
            value and current ETag values match.
        "404":
          description: No such resource exists for the given ID or path.
servers:
- url: http://example.com/themeContent
  description: Sample server URL.
components:
  parameters:
    themeId:
      name: themeId
      in: path
      required: true
      description: The unique identifier for the theme.
      schema:
        type: string
  schemas:
    error:
      $ref: "#/components/schemas/error2"
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    themeContent:
      title: Theme proxy
      description: Information about a theme's content.
      x-sas-media-type:
        name: application/vnd.sas.theme.content
        version: 1
      properties:
        id:
          type: string
          description: The unique identifier of the theme.
        createdBy:
          type: string
          description: User ID of the person who created this resource.
        creationTimeStamp:
          type: string
          description: Time stamp when the Theme Content was created, in `YYYY-MM-DDThh:mm:ss.sssZ`
            format
        modifiedTimeStamp:
          type: string
          description: Time stamp when the Theme Content was last modified, in `YYYY-MM-DDThh:mm:ss.sssZ`
            format
        modifiedBy:
          type: string
          description: User ID of the person who last modified this resource.
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        contentItemUris:
          type: array
          description: An array of relative URI strings for each theme content resource
            item.
          items:
            type: string
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
  examples:
    root_links:
      summary: Theme Content service endpoints
      description: List of endpoints for Theme Content service
      value: {"links": [{"method": "GET", "rel": "getContent", "href": "/themeContent/themes/{themeId}/content/{themeContentResourcePath}",
            "uri": "/themeContent/themes/{themeId}/content/{themeContentResourcePath}",
            "responseType": "text/css"}, {"method": "PUT", "rel": "updateContent",
            "href": "/themeContent/themes/{themeId}/content", "uri": "/themeContent/themes/{themeId}/content",
            "type": "application/zip", "responseType": "application/vnd.sas.theme.content"}],
        "version": 1}
    getTheme404Response:
      summary: Not Found for GET theme
      description: This is an example Not Found response for GET theme.
      value: {"version": 2, "httpStatusCode": 404, "message": "Not Found", "details": [
          "Theme content not found for id abcd1234", "path: /themeContent/themes/abcd1234",
          "correlator: 88bd2ff5-95e2-4cc2-b219-94e278f4d37e"]}
    getTheme400Response:
      summary: Bad request for GET theme
      description: This is an example Bad Request response for GET theme.
      value: {"version": 2, "httpStatusCode": 400, "message": "Bad Request", "details": [
          "excludeFields value is limited to contentItemUris", "path: /themeContent/themes/abcd1234",
          "correlator: 8c2babcd-2107-4999-9bdf-06645d103bca"]}
    getThemeResource404Response:
      summary: Not Found for GET theme content resource item
      description: This is an example Not Found response for GET theme content resource
        item.
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 11504, "message": "Theme\
          \ content not found for id abcd1234", "details": ["path: /themeContent/themes/abcd1234/content/12.5/sas/hc/ui/core/themes/abcd1234/library.css",
          "correlator: c4160e0d-57a6-4077-9cc3-3da9ebaee756"]}
    getThemeResponse:
      summary: Response to GET to retrieve information about a theme.
      description: Here is an example of using the GET request to retrieve information
        about a specific theme.
      value: {"creationTimeStamp": "2023-06-20T14:35:27.442306Z", "createdBy": "anonymous",
        "modifiedTimeStamp": "2023-06-20T14:35:27.442306Z", "modifiedBy": "anonymous",
        "links": [{"method": "GET", "rel": "self", "href": "/themeContent/themes/abcd1234",
            "uri": "/themeContent/themes/abcd1234", "type": "application/vnd.sas.theme.content+json"},
          {"method": "GET", "rel": "theme", "href": "/themes/themes/abcd1234", "uri": "/themes/themes/abcd1234"},
          {"method": "PUT", "rel": "updateContent", "href": "/themeContent/themes/abcd1234/content/",
            "uri": "/themeContent/themes/abcd1234/content/", "type": "application/zip",
            "responseType": "application/vnd.sas.theme.content+json"}, {"method": "DELETE",
            "rel": "delete", "href": "/themeContent/themes/abcd1234/content/", "uri": "/themeContent/themes/abcd1234/content/"}],
        "id": "abcd1234", "contentItemUris": ["12.5/sas/hc/ui/core/themes/abcd1234/library.css"]}
    putThemeContentResponse:
      summary: Response to PUT to update theme content.
      description: Here is an example of using the PUT request to update theme content.
      value: {"creationTimeStamp": "2023-06-20T20:50:46.631295Z", "createdBy": "anonymous",
        "modifiedTimeStamp": "2023-06-20T20:50:46.631295Z", "modifiedBy": "anonymous",
        "links": [{"method": "GET", "rel": "self", "href": "/themeContent/themes/abcd1234",
            "uri": "/themeContent/themes/abcd1234", "type": "application/vnd.sas.theme.content+json"},
          {"method": "GET", "rel": "theme", "href": "/themes/themes/abcd1234", "uri": "/themes/themes/abcd1234"},
          {"method": "PUT", "rel": "updateContent", "href": "/themeContent/themes/abcd1234/content/",
            "uri": "/themeContent/themes/abcd1234/content/", "type": "application/zip",
            "responseType": "application/vnd.sas.theme.content+json"}, {"method": "DELETE",
            "rel": "delete", "href": "/themeContent/themes/abcd1234/content/", "uri": "/themeContent/themes/abcd1234/content/"}],
        "id": "abcd1234", "contentItemUris": ["12.5/sas/hc/ui/core/themes/abcd1234/library.css"]}
    putThemeContent400Response:
      summary: Bad request for PUT theme content
      description: This is an example Bad Request response for PUT theme content.
      value: {"version": 2, "httpStatusCode": 400, "message": "Bad Request", "details": [
          "ThemeID mismatch between path parameter abcd1234 and zip entry 12.5/sas/hc/ui/core/themes/abcd/library.css",
          "path: /themeContent/themes/abcd1234/content/", "correlator: 4d87e052-85de-4525-bf60-89d21c5e9017"]}
