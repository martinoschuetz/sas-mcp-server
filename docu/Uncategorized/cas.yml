      description: Get an appender by name.
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Cas
      operationId: getAppenderInfo
      description: Get information about a particular appender.
      summary: Get appender information
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appender'
              example:
                $ref: '#/components/examples/Appender'
            application/vnd.sas.cas.direct.appender:
              schema:
                $ref: '#/components/schemas/Appender'
              example:
                $ref: '#/components/examples/Appender'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/Appender'
              example:
                $ref: '#/components/examples/Appender'
    put:
      tags:
      - Cas
      operationId: updateCASAppenderName
      description: 'Add a new appender to the system, either a console appender or
        a file appender. Some parameters are specific to the file appender and, although
        marked as required, are not required for the console appender.'
      summary: Add a new appender
      parameters:
      - name: type
        description: 'The type of appender being added, either "file" or "console".'
        in: query
        required: true
        schema:
          type: string
          enum:
          - file
          - console
      - name: flush
        description: Immediately flushes output instead of buffering.
        in: query
        required: true
        schema:
          type: boolean
      - name: append
        description: 'When type=="file", causes the appender to append to existing
          content in the file instead of truncating it.'
        in: query
        required: true
        schema:
          type: boolean
      - name: path
        description: 'When type=="file", the path where the file will reside.'
        in: query
        required: true
        schema:
          type: string
      - name: namePrefix
        description: 'When type == "file", prefix used for filenames of log files.
          Helpful when using routing several groups of loggers to different appenders.'
        in: query
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            example:
              type: file
              flush: true
              append: true
              path: /path/of/file/dir
              namePrefix: mycaslog
            schema:
              type: object
              properties:
                type:
                  description: >-
                    The type of appender being added, either "file" or
                    "console".
                  type: string
                  enum:
                  - file
                  - console
                flush:
                  description: Immediately flushes output instead of buffering.
                  type: boolean
                append:
                  description: >-
                    When type=="file", causes the appender to append to existing
                    content in the file instead of truncating it.
                  type: boolean
                path:
                  description: When type=="file", the path where the file will reside.
                  type: string
                namePrefix:
                  description: >-
                    When type == "file", prefix used for filenames of log files.
                    Helpful when using routing several groups of loggers to
                    different appenders.
                  type: string
              required:
              - type
              - flush
              - append
              - path
              - namePrefix
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
