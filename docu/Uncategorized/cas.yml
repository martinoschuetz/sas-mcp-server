---
openapi: 3.0.3
info:
  version: '4'
  title: CAS REST
  description: The CAS REST API provides REST access to CAS functionality and server
    information, including CAS session management, running actions, and uploading
    data to the CAS server.
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
  license:
    name: sas
    url: 'http://developer.sas.com'
x-documentation-title: 'SAS Cloud Analytic Services: REST API Version 4 Reference'
security:
- Basic_Credentials: []
- CAS_OAuth: []
servers:
- url: 'http://mock-cas.apifirst.unx.sas.com/cas'
  description: This is an example base URL.
tags:
- name: Actions
  description: Action information and execution.
- name: Cas
  description: CAS information.
- name: Sessions
  description: Session information and management.
- name: System
  description: System information.
- name: Grid
  description: Grid information.
- name: Deprecated
  description: Being removed in a future release.
paths:
  /cas:
    get:
      tags:
      - Cas
      operationId: getCASInformation
      description: |
        Get information about the CAS servers.
      summary: Get grid information
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CASServer'
              examples:
                objectExample:
                  $ref: '#/components/examples/CASServer'
            application/vnd.sas.cas.direct.action.results:
              schema:
                $ref: '#/components/schemas/CASServer'
              examples:
                objectExample:
                  $ref: '#/components/examples/CASServer'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/CASServer'
              examples:
                objectExample:
                  $ref: '#/components/examples/CASServer'
    delete:
      tags:
      - Cas
      description: Shut down the CAS servers.
      summary: Shut down the CAS servers
      operationId: shutdownCAS
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResults'
              examples:
                objectExample:
                  $ref: '#/components/examples/ActionResults'
            application/vnd.sas.cas.direct.action.results:
              schema:
                $ref: '#/components/schemas/ActionResults'
              examples:
                objectExample:
                  $ref: '#/components/examples/ActionResults'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/ActionResults'
              examples:
                objectExample:
                  $ref: '#/components/examples/ActionResults'
        '403':
          description: The user is not a CAS Administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                objectExample:
                  $ref: '#/components/examples/ErrorResponse'
            application/vnd.sas.cas.direct.action.results:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                objectExample:
                  $ref: '#/components/examples/ErrorResponse'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                objectExample:
                  $ref: '#/components/examples/ErrorResponse'
  /cas/configuration:
    get:
      tags:
      - Cas
      operationId: getCASConfiguration
      description: Configuration settings for the server.
      summary: Configuration settings for the server
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CASConfigurationValue'
              examples:
                values:
                  $ref: '#/components/examples/CASConfigurationValue'
            application/vnd.sas.cas.direct.configuration.value:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CASConfigurationValue'
              examples:
                values:
                  $ref: '#/components/examples/CASConfigurationValue'
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CASConfigurationValue'
              examples:
                values:
                  $ref: '#/components/examples/CASConfigurationValue'
  /cas/type:
    get:
      tags:
      - Cas
      description: Server type.
      summary: Server type
      operationId: getCASServerType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    $ref: '#/components/schemas/CASServerType'
              example:
                value: $ref '#/components/examples/CASServerType'
            application/vnd.sas.cas.direct.server.type:
              schema:
                type: object
                properties:
                  type:
                    $ref: '#/components/schemas/CASServerType'
              example:
                value: $ref '#/components/examples/CASServerType'
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: object
                properties:
                  type:
                    $ref: '#/components/schemas/CASServerType'
              example:
                value: $ref '#/components/examples/CASServerType'
  /cas/state:
    get:
      tags:
      - Cas
      operationId: getCASState
      description: |
        Get the state of the CAS server.
      summary: CAS server state
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    $ref: '#/components/schemas/CASServerState'
              example:
                value: $ref '#/components/examples/CASServerType'
            application/vnd.sas.cas.direct.server.state:
              schema:
                type: object
                properties:
                  state:
                    $ref: '#/components/schemas/CASServerState'
              example:
                value: $ref '#/components/examples/CASServerType'
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: object
                properties:
                  state:
                    $ref: '#/components/schemas/CASServerState'
              example:
                value: $ref '#/components/examples/CASServerType'
  /cas/nodeNames:
    get:
      tags:
      - Cas
      operationId: getCASNodeNames
      description: Get a list of connected node names for the CAS grid.
      summary: List connected nodes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: [Node1, Node2]
            application/vnd.sas.cas.direct.node.name.list:
              schema:
                type: array
                items:
                  type: string
              example: [Node1, Node2]
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: array
                items:
                  type: string
              example: [Node1, Node2]
  /cas/nodeCount:
    get:
      tags:
      - Cas
      operationId: getCASNodeCount
      description: Get a count of connected nodes.
      summary: Connected node count
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
              example: 2
            application/vnd.sas.cas.direct.node.count:
              schema:
                type: integer
              example: 2
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: integer
              example: 2
  /cas/nodes:
    get:
      tags:
      - Cas
      operationId: getCASNodes
      description: List of CAS nodes.
      summary: Node List
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CASNode'
              examples:
                value:
                  $ref: '#/components/examples/CASNode'
            application/vnd.sas.cas.direct.node.list:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CASNode'
              examples:
                value:
                  $ref: '#/components/examples/CASNode'
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CASNode'
              examples:
                value:
                  $ref: '#/components/examples/CASNode'
    put:
      operationId: updateCASNodes
      tags:
      - Cas
      description: Add one or more nodes to the grid.
      summary: Add nodes
      parameters:
      - name: node
        description: |
          One or more node names to add. They should be in the grid nodes configuration file.
          When using a body of application/x-www-form-urlencoded, only one node will be added, even if multiple node parameters are specified in the form.
        required: true
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: role
        description: Role for node. Only "worker" is currently supported.
        required: true
        in: query
        schema:
          type: string
          enum:
          - worker
          - controller
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResults'
              examples:
                objectExample:
                  $ref: '#/components/examples/ActionResults'
            application/vnd.sas.cas.direct.action.results:
              schema:
                $ref: '#/components/schemas/ActionResults'
              examples:
                objectExample:
                  $ref: '#/components/examples/ActionResults'
            application/vnd.sas.cas.direct.results-table:
              schema:
                $ref: '#/components/schemas/ActionResults'
              examples:
                objectExample:
                  $ref: '#/components/examples/ActionResults'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/ActionResults'
              examples:
                objectExample:
                  $ref: '#/components/examples/ActionResults'
    delete:
      tags:
      - Cas
      description: Remove one or more nodes from the grid. Parameters should be in
        the request body in JSON format. Directly calls the removeNode CAS action
        to remove the node from the grid.
      summary: Remove nodes
      operationId: removeNode
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
            example: ["worker99.mycompany.com", "worker100.mycompany.com"]
          multipart/form-data:
            schema:
              type: array
              items:
                type: string
            example: ["worker99.mycompany.com", "worker100.mycompany.com"]
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                type: string
            example: ["worker99.mycompany.com", "worker100.mycompany.com"]
        description: One or more node names to remove.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResults'
              examples:
                objectExample:
                  $ref: '#/components/examples/ActionResults'
            application/vnd.sas.cas.direct.action.results:
              schema:
                $ref: '#/components/schemas/ActionResults'
              examples:
                objectExample:
                  $ref: '#/components/examples/ActionResults'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/ActionResults'
              examples:
                objectExample:
                  $ref: '#/components/examples/ActionResults'
  '/cas/nodes/{nodeName}':
    parameters:
    - name: nodeName
      in: path
      description: Name of node
      required: true
      schema:
        type: string
    get:
      tags:
      - Cas
      description: Get information about the specified node.
      summary: Get node information
      operationId: getNodeInfo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CASNode'
              examples:
                value:
                  $ref: '#/components/examples/CASNode'
            application/vnd.sas.cas.direct.node:
              schema:
                $ref: '#/components/schemas/CASNode'
              examples:
                value:
                  $ref: '#/components/examples/CASNode'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/CASNode'
              examples:
                value:
                  $ref: '#/components/examples/CASNode'
  '/cas/nodes/{nodeName}/metrics':
    parameters:
    - name: nodeName
      in: path
      description: Name of node
      required: true
      schema:
        type: string
    get:
      tags:
      - Cas
      operationId: getNodeMetrics
      description: Get metrics for the specified node.
      summary: Get node metrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CASNodeMetrics'
              example:
                value:
                  $ref: '#/components/examples/CASNodeMetrics'
            application/vnd.sas.cas.direct.node.metrics:
              schema:
                $ref: '#/components/schemas/CASNodeMetrics'
              example:
                value:
                  $ref: '#/components/examples/CASNodeMetrics'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/CASNodeMetrics'
              example:
                value:
                  $ref: '#/components/examples/CASNodeMetrics'
  '/cas/nodes/{nodeName}/sessionProcesses':
    parameters:
    - name: nodeName
      in: path
      description: Name of node
      required: true
      schema:
        type: string
    get:
      tags:
      - Cas
      operationId: getNodeSessionProcesses
      description: Returns a list of process identifiers for all session processes
        running on a node.
      summary: Get process identfiers for session processes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
              example: [1, 2, 3]
            application/vnd.sas.cas.direct.node.process.identifier.list:
              schema:
                type: array
                items:
                  type: integer
              example: [1, 2, 3]
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: array
                items:
                  type: integer
              example: [1, 2, 3]
  '/cas/nodes/{nodeName}/sessionProcessesForUser':
    parameters:
    - name: nodeName
      in: path
      description: Name of node
      required: true
      schema:
        type: string
    get:
      tags:
      - Cas
      operationId: getNodeSessionProcessesForUser
      description: Returns a list of process identifiers for all session processes
        for the specified user.
      summary: Get process identifiers for a user's session processes
      parameters:
      - name: userName
        in: query
        required: true
        description: Name of user.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
              example: [1, 2, 3]
            application/vnd.sas.cas.direct.node.process.identifier.list:
              schema:
                type: array
                items:
                  type: integer
              example: [1, 2, 3]
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: array
                items:
                  type: integer
              example: [1, 2, 3]
  /cas/nodes/metrics:
    get:
      tags:
      - Cas
      operationId: getMetricsForCASNodes
      description: |
        List of nodes running CAS servers, including cpuLoad of the
        system running the CAS server. Retrieving the load information
        requires extra communication with the grid nodes. /cas/nodes
        is provided for cases where performance is of the essence and
        CPU load information is not needed.
      summary: List of CAS nodes with CPU load
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ArrayOfNodesWithCPULoad
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeMetrics'
              examples:
                value:
                  $ref: '#/components/examples/CASNodeMetrics'
            application/vnd.sas.cas.direct.node.metrics.list:
              schema:
                title: ArrayOfNodesWithCPULoad
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeMetrics'
              examples:
                value:
                  $ref: '#/components/examples/CASNodeMetrics'
            application/vnd.sas.cas.direct.error.response:
              schema:
                title: ArrayOfNodesWithCPULoad
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeMetrics'
              examples:
                value:
                  $ref: '#/components/examples/CASNodeMetrics'
  /cas/nodes/processCPUTimes:
    get:
      tags:
      - Cas
      operationId: getProcessCPUTimesForCASNodes
      description: Returns node status and CPU time for all nodes.
      summary: Node status and CPU time for all nodes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ArrayOfNodesWithCPUTimes
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeCPUTime'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeCPUTime'
            application/vnd.sas.cas.direct.node.cputime.list:
              schema:
                title: ArrayOfNodesWithCPUTimes
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeCPUTime'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeCPUTime'
            application/vnd.sas.cas.direct.error.response:
              schema:
                title: ArrayOfNodesWithCPUTimes
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeCPUTime'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeCPUTime'
  /cas/nodes/memoryMetrics:
    get:
      tags:
      - Cas
      operationId: getMemoryMetricsForCASNodes
      description: Returns node status and memory utilization for all nodes.
      summary: Node status and memory utilization for all nodes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ArrayOfNodesWithMemoryMetrics
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeMemoryMetrics'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeMemoryMetrics'
            application/vnd.sas.cas.direct.node.memory.metrics.list:
              schema:
                title: ArrayOfNodesWithMemoryMetrics
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeMemoryMetrics'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeMemoryMetrics'
            application/vnd.sas.cas.direct.error.response:
              schema:
                title: ArrayOfNodesWithMemoryMetrics
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeMemoryMetrics'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeMemoryMetrics'
  /cas/nodes/processMetrics:
    get:
      tags:
      - Cas
      operationId: getProcessMetricsForCASNodes
      description: Returns node information and main process metrics for all nodes.
      summary: Node information and main process metrics for all nodes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ArrayOfNodesWithProcessMetrics
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeProcessMetrics'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeProcessMetrics'
            application/vnd.sas.cas.direct.node.process.metrics.list:
              schema:
                title: ArrayOfNodesWithProcessMetrics
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeProcessMetrics'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeProcessMetrics'
            application/vnd.sas.cas.direct.error.response:
              schema:
                title: ArrayOfNodesWithProcessMetrics
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeProcessMetrics'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeProcessMetrics'
  /cas/nodes/cpuTime:
    get:
      tags:
      - Cas
      operationId: getCPUTimeForCASNodes
      description: Returns CPU times with node type for all nodes.
      summary: CPU times for all nodes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeCPUTimeWithType'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeCPUTimeWithType'
            application/vnd.sas.cas.direct.node.cputime-with-type.list:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeCPUTimeWithType'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeCPUTimeWithType'
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CASNodeCPUTimeWithType'
              examples:
                values:
                  $ref: '#/components/examples/CASNodeCPUTimeWithType'
  /cas/process:
    get:
      tags:
      - Cas
      operationId: getCASProcessInformation
      description: Information about the CAS process.
      summary: CAS process information
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CASProcess'
              example:
                $ref: '#/components/examples/CASProcess'
            application/vnd.sas.cas.direct.server.process:
              schema:
                $ref: '#/components/schemas/CASProcess'
              example:
                $ref: '#/components/examples/CASProcess'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/CASProcess'
              example:
                $ref: '#/components/examples/CASProcess'
  /cas/ports:
    get:
      tags:
      - Cas
      operationId: getCASPorts
      description: Listening ports.
      summary: CAS port information
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    description: Client port number.
                    type: integer
                  control:
                    description: 'Control port number, used internally for grid communication.'
                    type: integer
              example:
                client: 8080
                control: 7070
            application/vnd.sas.cas.direct.ports:
              schema:
                type: object
                properties:
                  client:
                    description: Client port number.
                    type: integer
                  control:
                    description: 'Control port number, used internally for grid communication.'
                    type: integer
              example:
                client: 8080
                control: 7070
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: object
                properties:
                  client:
                    description: Client port number.
                    type: integer
                  control:
                    description: 'Control port number, used internally for grid communication.'
                    type: integer
              example:
                client: 8080
                control: 7070
  /cas/actions:
    get:
      tags:
      - Actions
      operationId: getCASActionDefinitions
      description: Get parameter definitions for actions in JSON form.
      summary: Get parameter definitions for actions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  actionSets:
                    description: |
                      List of action sets available to the system, including
                      action sets that have not been loaded.
                    type: array
                    items:
                      $ref: '#/components/schemas/ActionSet'
                  actionGroups:
                    description: |
                      List of composite action sets (aggregations of other action sets)
                      available to the system, including composite action sets that
                      have not been loaded.
                    type: array
                    items:
                      $ref: '#/components/schemas/ActionSetGroup'
              examples:
                actionSets:
                  value:
                    $ref: '#/components/examples/ActionSet'
            application/vnd.sas.cas.direct.action.list:
              schema:
                type: object
                properties:
                  actionSets:
                    description: |
                      List of action sets available to the system, including
                      action sets that have not been loaded.
                    type: array
                    items:
                      $ref: '#/components/schemas/ActionSet'
                  actionGroups:
                    description: |
                      List of composite action sets (aggregations of other action sets)
                      available to the system, including composite action sets that
                      have not been loaded.
                    type: array
                    items:
                      $ref: '#/components/schemas/ActionSetGroup'
              examples:
                actionSets:
                  value:
                    $ref: '#/components/examples/ActionSet'
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: object
                properties:
                  actionSets:
                    description: |
                      List of action sets available to the system, including
                      action sets that have not been loaded.
                    type: array
                    items:
                      $ref: '#/components/schemas/ActionSet'
                  actionGroups:
                    description: |
                      List of composite action sets (aggregations of other action sets)
                      available to the system, including composite action sets that
                      have not been loaded.
                    type: array
                    items:
                      $ref: '#/components/schemas/ActionSetGroup'
              examples:
                actionSets:
                  value:
                    $ref: '#/components/examples/ActionSet'
  '/cas/actions/{actionName}':
    parameters:
    - name: actionName
      in: path
      description: |
        Name of action. Can be expressed as actionSet.action to
        specify an action in a specific actionSet.
      required: true
      schema:
        type: string
    get:
      tags:
      - Actions
      operationId: getDefinitionForAction
      description: |
        Get parameter definitions for the specified action. If an action set is
        not specified as part of the name, a list of
        actions from all action sets with the matching name is returned.
      summary: Get parameter defintions for an action
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionDefinition'
              example:
                $ref: '#/components/schemas/ActionDefinition'
            application/vnd.sas.cas.direct.action.definition.list:
              schema:
                type: array
