      schema:
        type: integer
    - name: threadId
      in: path
      description: Thread identifier.
      required: true
      schema:
        type: integer
    get:
      tags:
      - Grid
      operationId: getThreadIdForGridNodeThread
      description: Get information about the specified thread.
      summary: Get thread information on a grid node
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
              example:
                value:
                  $ref: '#/components/examples/Thread'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/Thread'
              example:
                value:
                  $ref: '#/components/examples/Thread'
            application/vnd.sas.cas.direct.thread:
              schema:
                $ref: '#/components/schemas/Thread'
              example:
                value:
                  $ref: '#/components/examples/Thread'
        '404':
          description: The thread or process no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                objectExample:
                  $ref: '#/components/examples/ErrorResponse'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                objectExample:
                  $ref: '#/components/examples/ErrorResponse'
            application/vnd.sas.cas.direct.thread:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                objectExample:
                  $ref: '#/components/examples/ErrorResponse'
  '/grid/{name}/processes/{processId}/threads/{threadId}/stack':
    parameters:
    - name: name
      in: path
      description: Name of node.
      required: true
      schema:
        type: string
    - name: processId
      in: path
      description: PID of process.
      required: true
      schema:
        type: integer
    - name: threadId
      in: path
      description: Thread identifier.
      required: true
      schema:
        type: integer
    get:
      tags:
      - Grid
      operationId: getStackForGridNodeThread
      summary: Get a stack trace on a grid node
      description: Get a stack trace the specified thread.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: [Grid Stack Trace 1, Grid Stack Trace 2]
            application/vnd.sas.cas.direct.error.response:
              schema:
                type: array
                items:
                  type: string
              example: [Grid Stack Trace 1, Grid Stack Trace 2]
            application/vnd.sas.cas.direct.stack:
              schema:
                type: array
                items:
                  type: string
              example: [Grid Stack Trace 1, Grid Stack Trace 2]
        '404':
          description: The thread or process no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                objectExample:
                  $ref: '#/components/examples/ErrorResponse'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                objectExample:
                  $ref: '#/components/examples/ErrorResponse'
            application/vnd.sas.cas.direct.stack:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                objectExample:
                  $ref: '#/components/examples/ErrorResponse'
  '/grid/{name}/top':
    parameters:
    - name: name
      in: path
      description: Name of node.
      required: true
      schema:
        type: string
    get:
      tags:
      - Grid
      operationId: getMetricsInTopFormatForGridNode
      description: |
        Returns a collection of system metrics for the specified host,
        similar to the information
        gathered and displayed by the <tt>top</tt> utility for UNIX/Linux.
      summary: Get system metrics on a grid node
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopSystemMetrics'
              example:
                $ref: '#/components/examples/TopSystemMetrics'
            application/vnd.sas.cas.direct.top-system-metrics:
              schema:
                $ref: '#/components/schemas/TopSystemMetrics'
              example:
                $ref: '#/components/examples/TopSystemMetrics'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/TopSystemMetrics'
              example:
                $ref: '#/components/examples/TopSystemMetrics'
  '/grid/{name}/top/{user}':
    parameters:
    - name: name
      in: path
      description: Name of node.
      required: true
      schema:
        type: string
    - name: user
      in: path
      description: Name of user for which process list is provided.
      required: true
      schema:
        type: string
    get:
      tags:
      - Grid
      operationId: getMetricsForUserInTopFormatForGridNode
      description: |
        Returns a collection of system metrics, similar to the information
        gathered and displayed by the <tt>top</tt> utility for UNIX/Linux, for
        the specified user. If the user is not an administrator, then the processes
        returned include processes created for the specified user, e.g. processes
        for sessions owned by the user.
      summary: Get system metrics for a user on a grid node
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopSystemMetrics'
              example:
                $ref: '#/components/examples/TopSystemMetrics'
            application/vnd.sas.cas.direct.top-system-metrics:
              schema:
                $ref: '#/components/schemas/TopSystemMetrics'
              example:
                $ref: '#/components/examples/TopSystemMetrics'
            application/vnd.sas.cas.direct.error.response:
              schema:
                $ref: '#/components/schemas/TopSystemMetrics'
              example:
                $ref: '#/components/examples/TopSystemMetrics'
components:
  securitySchemes:
    Basic_Credentials:
      type: http
      description: HTTP basic authentication. Use only with SSL enabled.
      scheme: basic
    CAS_OAuth:
      type: oauth2
      description: CAS OAuth2 authentication. OAuth scopes are only used for group
        memberships.
      flows:
        implicit:
          authorizationUrl: 'https://site-specific-url'
          scopes: {}
  schemas:
    CASNode:
      title: CAS Node Information
      description: CAS Node Information
      properties:
        name:
          description: The name of the node. May or may not match the actual hostname
            of the node depending on the name used in the grid hosts file.
          type: string
        port:
          description: The port number being used by the CAS protocol listener.
          type: integer
        type:
          $ref: '#/components/schemas/CASServerType'
        connected:
          description: True if the node is currently connected to the grid.
          type: boolean
        pid:
          description: The process ID of the CAS server process.
          type: integer
        httpPort:
          description: Port being used by HTTP listener.
          type: integer
        httpProtocol:
          description: Protocol being used by HTTP listener.
          type: string
          enum:
          - http
          - https
        uuid:
          description: Unique identifier for the node.
          type: string
    CASNodeMetrics:
      title: CAS Node Metrics
      description: CAS Node Metrics
      properties:
        name:
          description: The name of the node. May or may not match the actual hostname
            of the node depending on the name used in the grid hosts file.
          type: string
        port:
          description: The port number being used by the CAS protocol listener.
          type: integer
        type:
          $ref: '#/components/schemas/CASServerType'
        connected:
          description: Indicates if the server is running and connected to the grid.
          type: boolean
        pid:
          description: The process ID of the CAS server process.
          type: integer
        httpPort:
          description: Port being used by HTTP listener.
          type: integer
        httpProtocol:
          description: Protocol being used by HTTP listener.
          type: string
          enum:
          - http
          - https
        uuid:
          description: Unique identifier for the node.
          type: string
        cpuLoad:
          description: CPU load on the system.  CAS servers running on Windows return
            0.
          type: number
          format: double
    CASNodeCPUTime:
      title: CAS Node CPU Time
      description: CASNodeCPUTime
      properties:
        name:
          description: The name of the node. May or may not match the actual hostname
            of the node depending on the name used in the grid hosts file.
          type: string
        pid:
          description: The process ID of the CAS server process.
          type: string
        connected:
          description: Indicates if the server is running and connected to the grid.
          type: boolean
        type:
          $ref: '#/components/schemas/CASServerType'
        cpuTime:
          $ref: '#/components/schemas/CPUTime'
    CASNodeCPUTimeWithType:
      title: CAS Node CPU Time With Node Type
      description: |
        The time properties will be omitted from the object if the CPU times cannot be
        retrieved from the grid node. Existence only needs to be checked for one of the
        CPU time fields: if one is omitted, all are omitted.
      properties:
        name:
          description: The name of the node. May or may not match the actual hostname
            of the node depending on the name used in the grid hosts file.
          type: string
        type:
          $ref: '#/components/schemas/CASServerType'
        pid:
          description: The process ID of the CAS server process.
          type: string
        connected:
          description: Indicates if the server is running and connected to the grid.
          type: boolean
        userTimeHz:
          description: 'Amount of time spent by the CPU executing in user space, in
            hertz/cycles. This property will be omitted if the value cannot be retrieved
            from the grid node.'
          type: integer
        systemTimeHz:
          description: 'Amount of time spent by the CPU executing in system space,
            in hertz/cycles. This property will be omitted if the value cannot be
            retrieved from the grid node.'
          type: integer
        idleTimeHz:
          description: 'Amount of time spent by the CPU executing in system space,
            in hertz/cycles. This property will be omitted if the value cannot be
            retrieved from the grid node.'
          type: integer
        iowaitTimeHz:
          description: 'Amount of time spent by the CPU waiting for IO to complete,
            in hertz/cycles. This property will be omitted if the value cannot be
            retrieved from the grid node.'
          type: integer
        irqTimeHz:
          description: 'Amount of time spent by the CPU processing IRQs, in hertz/cycles.
            This property will be omitted if the value cannot be retrieved from the
            grid node.'
          type: integer
        softirqTimeHz:
          description: 'Amount of time spent by the CPU processing soft IRQs, in hertz/cycles.
            This property will be omitted if the value cannot be retrieved from the
            grid node.'
          type: integer
    CASNodeMemoryMetrics:
      title: CAS Node Memory Metrics
      description: CAS Node Memory Metrics
      properties:
        name:
          type: string
          description: The name of the node. May or may not match the actual hostname
            of the node depending on the name used in the grid hosts file.
        pid:
          description: The process ID of the CAS server process.
          type: string
        connected:
          description: Indicates if the server is running and connected to the grid.
          type: boolean
        type:
          $ref: '#/components/schemas/CASServerType'
        MemTotal_kB:
          description: 'Total physical memory available ot the system, in kilobytes.'
          type: integer
        MemFree_kB:
          description: 'Amount of free physical memory, in kilobytes.'
          type: integer
        SwapTotal_kB:
          description: 'Total amount of swap space available to the system, in kilobytes.'
          type: integer
        SwapFree_kB:
          description: 'Amount of free swap space, in kilobytes.'
          type: integer
        VmallocTotal_kB:
          description: 'Total amount of virtual memory, in kilobytes.'
          type: integer
        VmallocUsed_kB:
          description: Amount of virtual memory used in the system in kilobytes.
          type: integer
    CASNodeProcessMetrics:
      title: CAS Node Process Metrics
      description: CAS Node Process Metrics
      properties:
        name:
          type: string
          description: Node name.
        pid:
          type: string
          description: Process identifier of the server process.
        connected:
          type: boolean
          description: Indicates if the server is running and connected to the grid.
        type:
          $ref: '#/components/schemas/CASServerType'
        metrics:
          description: List of metrics.
          type: array
          items:
            $ref: '#/components/schemas/Process'
    CASServer:
      title: CAS Server Information
      description: CAS Server Information
      properties:
        type:
          $ref: '#/components/schemas/CASServerType'
        state:
          $ref: '#/components/schemas/CASServerState'
        client:
          description: Client port.
          type: integer
          example: 5570
        control:
          description: Control port.
          type: integer
          example: 5571
        idleTime:
          description: Amount of time in seconds since the last session create/destroy
            or node create/destroy.
          type: integer
          example: 315619314
        process:
          $ref: '#/components/schemas/CASProcess'
        maxSessions:
          description: The maximum number of sessions allowed to run on the server
            at the same time.
          type: integer
          example: 5000
        sessionCount:
          description: Number of sessions currently running.
          type: integer
          example: 1
        createdSessionsCount:
          description: Number of sessions created since the server started.
          type: integer
          example: 1727
        lastSessionActivity:
          description: The last session life cycle event (created or destroyed) that
            occured on the server.
          type: object
          properties:
            uuid:
              description: The unique identifier of the session that last had a lifecycle
                event.
              type: string
              example: "fb6ded1b-3e23-2446-becb-899709060a0f"
            gmtTime:
              description: The GMT POSIX time that the event occurred.
              type: integer
              example: 2306676112
            event:
              description: The event that occurred. "startup" indicates server startup
                and session has not yet been created.
              type: string
              enum:
              - startup
              - create
              - destroy
              example: "destroy"
        license:
          description: License information for the CAS server.
          type: object
          properties:
            gracePeriod:
              description: Number of days after license expiration the license continues
                working with warning messages printed to execution logs.
              type: integer
              example: 45
            licenseExpires:
              description: 'Date and time of license expiration in the form ''ddmmmyyyy:HH:MM:ss''.'
              type: string
              example: 02May2023:00:00:00
            licensePath:
              description: Path of the license file in the installation.
              type: string
              example: "/cas/license/license.sas"
            maxCPUs:
              description: Maximum number of CPUs licensed for use across the entire
                grid. Value is null if no maximum is set.
              type: integer
              example: 1
            maxSessions:
              description: Deprecated. Will be removed in a future release.
              type: integer
              example: 5000
            sessionCount:
              description: Deprecated. Will be removed in a future release.
              type: integer
              example: 1
            siteName:
              description: Your site name.
              type: string
              example: "SCI..."
            siteNumber:
              description: Your site number.
              type: integer
              example: 70180938
            startCPU:
              description: 'First CPU to license, indexed from 0. Value is null if
                not set.'
              type: integer
              example: 1
            unusedSessions:
              description: Deprecated. Will be removed in a future release.
              type: integer
              example: 4999
            warningPeriod:
              description: 'Number of days after the grace period when the license
                will continue to work but with a stronger log message. After the warning
                period expires, the license is no longer valid and the software will
                stop running.'
              type: integer
              example: 46
    Session:
      title: Session Information
      description: Session Information
      properties:
        id:
          description: The identifier for the session.
          type: string
          example: 4092f24d-15f1-4c2e-8a06-9cb616c1a392
        uuid:
          description: 'The unique identifier for the session, same as id. Provided
            for backward compatibility.'
          type: string
          example: 4092f24d-15f1-4c2e-8a06-9cb616c1a392
        name:
          description: The displayed name for the session.
          type: string
        state:
          description: The state of the session. Usually 'connected' or 'disconnected'.
          type: string
          example: connected
        httpPort:
          description: The port used by the HTTP listener.
          type: integer
        httpProtocol:
          description: The protocol used by the HTTP listener.
          type: string
          enum:
          - http
          - https
        user:
          description: The username of the owner of the session.
          type: string
        owner:
          description: Synonym for user.
          type: string
        provider:
          description: The authentication provider used when authenticating the creater
            of the session.
          type: string
        idleTime:
          description: The amount of time the session has been idle in seconds. A
            session is considered idle when it not executing an action.
          type: object
          properties:
            hours:
              description: Number of hours.
              type: integer
            minutes:
              description: Number of minutes.
              type: integer
            seconds:
              description: Number of seconds.
              type: integer
        actionCount:
          description: Total number of actions executed.
          type: integer
        activeAction:
          description: The action currently being executed (or last executed if idle).
          type: string
        isIdle:
          description: 'TRUE if the session is idle, meaning it not currently executing
            an action.'
          type: boolean
          example: false
        clientCount:
          description: Number of clients connected to the session.
          type: integer
    CPU:
      title: CPU Information
      description: 'CPU information'
      properties:
        processor:
          description: Processor number in the system. Processors in the system are
            numbered starting at 0.
          type: integer
        vendor_id:
          description: The CPU manufacturer.
          type: string
        cpu_family:
          description: CPU family. Linux does not document what values match which
            families.
          type: integer
        model:
          description: CPU model.
          type: integer
        model_name:
          description: 'Name of the CPU model'
          type: string
        stepping:
          description: The stepping (revision number) of the CPU.
          type: integer
        cpu_MHz:
          description: Speed of the CPU in MHz.
          type: number
          format: double
        cache_size:
          type: string
          description: Value with units.
        physical_id:
          description: Physical identifier of the CPU.
          type: integer
        siblings:
          description: Not documented by Linux.
          type: integer
        core_id:
          description: The ID of the core for these attributes.
          type: integer
        cpu_cores:
          description: Number of cores in the CPU.
          type: integer
        apicid:
          description: The advanced programmer interrupt controller ID number. Assigned
            by the firmware.
          type: integer
        initial_apicid:
          description: The initial APIC identifier.
          type: integer
        fpu:
          description: Inidicates if the CPU has a FPU unit.
          type: string
          enum:
          - 'yes'
          - 'no'
        fpu_exception:
          description: Indicates that the FPU has exception handling.
          type: string
          enum:
          - 'yes'
          - 'no'
        cpuid_level:
          description: 'The CPUID value for the processor. For Intel processors, describes
            features of the CPU. See [CPUID](https://en.wikipedia.org/wiki/CPUID)
            for more information.'
          type: integer
        wp:
          description: Not documented by Linux.
          type: string
          enum:
          - 'yes'
          - 'no'
        flags:
          description: CPU flags.
          type: array
          items:
            type: string
        bogomips:
          description: A Linux measurement of CPU speed. Can be used to compare several
            systems and determine if their performance is similar.
          type: number
          format: double
        clflush_size:
          description: 'Size of a cache line, as in the amount of cache flushed by
            the CLFLUSH instruction on Intel processors.'
          type: integer
        cache_alignment:
          description: 'The memory alignment of a cache line, in bytes.'
          type: integer
        address_sizes:
          description: 'Describes the address sizes supported by the CPU, in human
            readable form.'
          type: string
        power_management:
          type: string
          description: Power management information. May be null if no information
            available.
    CPUMetrics:
      title: CPU Metrics
      description: CPU Metrics
      properties:
        cpu:
          type: integer
          description: 'Element 0 is of type string, value "all".'
        userTimeHz:
          description: 'Amount of time spent by the CPU executing in user space, in
            hertz/cycles.'
          type: integer
        systemTimeHz:
          description: 'Amount of time spent by the CPU executing in system space,
            in hertz/cycles.'
          type: integer
        idleTimeHz:
          description: 'Amount of time spent by the CPU executing in system space,
            in hertz/cycles.'
          type: integer
        iowaitTimeHz:
          description: 'Amount of time spent by the CPU waiting for IO to complete,
            in hertz/cycles.'
          type: integer
        irqTimeHz:
          description: 'Amount of time spent by the CPU processing IRQs, in hertz/cycles.'
          type: integer
        softirqTimeHz:
          description: 'Amount of time spent by the CPU processing soft IRQs, in hertz/cycles.'
          type: integer
    MemoryMetrics:
      title: Memory Metrics
      description: Memory Metrics
      properties:
        MemTotal_kB:
          description: 'Total mount of physical memory, in kilobytes.'
          type: integer
        MemFree_kB:
          description: 'Amount of free physical memory, in kilobytes.'
          type: integer
        MemAvailable_kB:
          description: 'When provided by the operating system (some Linux platforms),
            value is an estimate of how much memory is available without swapping.
            Otherwise the value is calculated based on virtual memory information
            returned by the OS. Value is in kilobytes.'
          type: integer
        Buffers_kB:
          description: 'Amount of memory used for raw disk blocks, in kilobytes.'
          type: integer
        Cached_kB:
          description: 'Size of the in-memory cache for files read from disk, not
            including the amount of swap cached memory, in kilobytes.'
          type: integer
        SwapCached_kB:
          description: 'Size of memory that has been swapped out but also resides
            in swap space, in kilobytes. Linux tracks this so that it can avoid swapping
            out pages that are already on disk, saving IO.'
          type: integer
        Active_kB:
          description: 'Memory that has been used more recently, in kilobytes. Linux
            will avoid reclaiming this to increase performance.'
          type: integer
        Inactive_kB:
          description: 'Memory that has not been recently used, in kilobytes.'
          type: integer
        Active(anon)_kB:
          description: Value meaning not documented by Linux.
          type: integer
        Inactive(anon)_kB:
          description: Value meaning not documented by Linux.
          type: integer
        Active(file)_kB:
          description: Value meaning not documented by Linux.
          type: integer
        Inactive(file)_kB:
          description: Value meaning not documented by Linux.
          type: integer
        Unevictable_kB:
          description: 'Unevictable memory, in kilobytes. The unevictable-lru infrastructure
            is an additional LRU (last recently used) list that was implemented to
            address performance issues in large memory systems. See Documentation/vm/unevictable-lru.txt
            in the Linux sources for more information.'
          type: integer
        Mlocked_kB:
          description: 'Locked memory, in kilobytes, as used by the unevictable LRU
            (last recently used) infrastructure.  The unevictable-lru infrastructure
            is an additional LRU list that was implemented to address performance
            issues in large memory systems. See Documentation/vm/unevictable-lru.txt
            in the Linux sources for more information.'
          type: integer
        SwapTotal_kB:
          description: 'Total amount of swap space available, in kilobytes.'
          type: integer
        SwapFree_kB:
          description: 'Amount of swap space free, in kilobytes.'
          type: integer
        Dirty_kB:
          description: 'Memory waiting to be written back to disk, in kilobytes.'
          type: integer
        Writeback_kB:
          description: 'Memory actively being written back to disk, in kilobytes.'
          type: integer
        AnonPages_kB:
          description: Pages mapped into user-space that are not from files.
          type: integer
        Mapped_kB:
          description: 'Memory used for mapping files, in kilobytes.'
          type: integer
        Shmem_kB:
          description: Value meaning not documented by Linux.
          type: integer
        Slab_kB:
          description: In-kernel data structures cache.
          type: integer
        SReclaimable_kB:
          description: Size of the 'slab' portion that might be reclaimed.
          type: integer
        SUnreclaim_kB:
          description: Size of the 'slab' portion that cannot be reclaimed.
          type: integer
        KernelStack_kB:
          description: Amount of memory used by kernel stacks in kilobytes.
          type: integer
        PageTables_kB:
          description: 'Amount of memory used by the lowest level of page tables,
            in kilobytes.'
          type: integer
        NFS_Unstable_kB:
          description: 'Amount of pages that have been sent to an NFS server but have
            not yet been written to stable storage, in kilobytes.'
          type: integer
        Bounce_kB:
          description: Memory used for bounce buffers for block devices.
          type: integer
        WritebackTmp_kB:
          description: Amount of FUSE memory used for writeback buffers.
          type: integer
        CommitLimit_kB:
          description: 'Amount of memory available to the system, with the overcommit
            ratio factored in. Only used if overcommit accounting is enabled.'
          type: integer
        Committed_AS_kB:
          description: 'Amount of memory currently allocated by the system, including
            memory allocated by processes but not used.'
          type: integer
        VmallocTotal_kB:
          description: Amount of memory available for vmalloc.
          type: integer
        VmallocUsed_kB:
          description: Amount of memory allocated via vmalloc.
          type: integer
        VmallocChunk_kB:
          description: Largest block of free vmalloc memory.
          type: integer
        HardwareCorrupted_kB:
          description: Value meaning not documented by Linux.
          type: integer
        CmaTotal_kB:
          description: Total contiguous memory reserved for use by the kernel. Value
            is not provided by all Linux distributions. When the value is not provided,
            the attribute is omitted.
          type: integer
        CmaFree_kB:
          description: Continguous memory area that is free to use by the kernel.
            Value is not provided by all Linux distributions. When the value is not
            provided, the attribute is omitted.
          type: integer
        AnonHugePages_kB:
          description: Huge pages mapped into user space that are not from files.
          type: integer
        HugePages_Total:
          description: Size of the pool of huge pages.
          type: integer
        HugePages_Free:
          description: Number of free huge pages.
          type: integer
        HugePages_Rsvd:
          description: Number of reserved huge pages. Reserved huge pages are used
            by Linux to guarantee that application can allocate a huge page when a
            fault occurs.
          type: integer
        HugePages_Surp:
          description: Number of surplus (overcommit)  huge pages.
          type: integer
        Hugepagesize_kB:
          description: The size of a huge page in kilobytes.
          type: integer
        DirectMap4k_kB:
          description: 'Amount of 4k blocks that are direct mapped, in kilobytes.'
          type: integer
        DirectMap2M_kB:
          description: 'Amount of 2 megabyte blocks that are direct mapped, in kilobytes.'
          type: integer
        DirectMap1G_kB:
          description: 'Amount if 1 gigabyte blocks that are direct mapped, in kilobytes.'
          type: integer
    SystemInformation:
      title: System Information
      description: System Information
      properties:
        clockTicksPerSecond:
          description: Number of CPU clock ticks per second. Use this value to convert
            CPU metrics in hertz/cycles to seconds.
          type: number
          format: double
        pageSize:
          description: Page size ing bytes.
          type: integer
        version:
          description: Version of the system.
          type: string
        maxSystemThreads:
          description: Maximum number of threads that can be created by the system.
          type: integer
        bootCommand:
          description: The command used to boot the system.
          type: string
        oneMinLoadAvg:
          description: The one minute load average for the system.
          type: number
          format: double
        fiveMinLoadAvg:
          description: The five minute load average for the system.
          type: number
          format: double
        fifteenMinLoadAvg:
          description: The fifteen minute load average for the system. Can also be
            'null' if no value available from OS.
          type: number
          format: double
        openFiles:
          description: Number of open files for all processes in the system.
          type: integer
        freeFiles:
          description: Number of free files for all processes in the system.
          type: integer
        maxFiles:
          description: Maximum number of open files across all processes in the system.
          type: integer
        inodes:
          description: Maximum number of inodes for the system.
          type: integer
        freeInodes:
          description: Number of free inodes in the system.
          type: integer
        uptimeSeconds:
          description: Number of seconds the system has been running.
          type: number
          format: double
        idleSeconds:
          description: Number of seconds spent in the idle process.
          type: number
          format: double
        memory:
          $ref: '#/components/schemas/MemoryMetrics'
        cpus:
          title: ArrayOfCPUs
          type: array
          items:
            $ref: '#/components/schemas/CPU'
        cpuMetrics:
          description: |
            Array of metrics information for CPUs on the system. Element
            0 of list contains metrics for all CPUs.
          type: array
          items:
            $ref: '#/components/schemas/CPUMetrics'
    Process:
      title: Process
      description: Process
      properties:
        pid:
          description: Process identifier.
          type: string
        id:
          type: string
          description: Same value as PID.
        userId:
          type: string
          description: UID of process owner.
        username:
          type: string
          description: |
            If username cannot be determined from UID, contains
            string representation of UID.
        command:
          description: 'Command used to start the process, including command line
            parameters.'
          type: string
        state:
          description: The current state of the process.
          type: string
          enum:
          - Running
          - Sleeping
          - Disk Wait
          - Zombie
          - Traced
          - Paging
        userCPUTime:
          description: 'Amount of time spent executing in user space, in hertz/cycles.'
          type: number
          format: double
        systemCPUTime:
          description: 'Amount of time spent executing in system space, in hertz/cycles.'
          type: number
          format: double
        totalCPUTime:
          description: 'Total CPU usage, in hertz/cycles.'
          type: number
          format: double
        clockTicksPerSecond:
          description: Number of clock ticks (cycles) per second. Use to convert CPU
            times to seconds.
          type: number
          format: double
        nice:
          description: Priority of the process.
          type: integer
        threads:
          description: Number of threads being used by the process.
          type: integer
          example: 1
        vmSize:
          description: 'Virtual memory size of the process, in bytes.'
          type: string
        rss:
          description: 'Resident set size (physical memory usage) for the process,
            in bytes.'
          type: string
        cpu:
          type: string
          description: Number of CPU running the process.
          example: "12"
        commandLine:
          description: The command used to start the process.
          type: array
          items:
            type: string
    CPUTime:
      title: CPU Time
      description: CPUTime
      properties:
        userCPUTime:
          type: number
          format: double
        systemCPUTime:
          description: Time in HZ.
          type: number
          format: double
        totalCPUTime:
          description: Time in HZ.
          type: number
          format: double
        clockTicksPerSecond:
          description: Use to convert HZ to seconds.
          type: integer
    Thread:
      title: Thread
      description: Thread
      properties:
        pid:
          description: The process ID of the owner process.
          type: string
        id:
          type: string
          description: Thread identifier.
        userId:
          type: string
          description: UID of process owner.
        username:
          type: string
          description: |
            If username cannot be determined from UID, contains
            string representation of UID.
        command:
          description: Command used to start the process.
          type: string
        state:
          description: State of the thread.
          type: string
          enum:
          - Running
          - Sleeping
          - Disk Wait
          - Zombie
          - Traced
          - Paging
        userCPUTime:
          description: 'Amount of time the thread has executed in user space, in hertz/cycles.'
          type: number
          format: double
        systemCPUTime:
          description: 'Amount of time the thread has executed in user space, in hertz/cycles.'
          type: number
          format: double
        totalCPUTime:
          description: 'Amount of time the thread has executed in user space, in hertz/cycles.'
          type: number
          format: double
        clockTicksPerSecond:
          description: Number of clock ticks (cycles) per second. Use to convert CPU
            times to seconds.
          type: number
          format: double
        nice:
          description: The priority of the thread.
          type: integer
        vmSize:
          description: 'Virtual memory size, in bytes.'
          type: string
        rss:
          description: 'Resident set size, in bytes.'
          type: string
        cpu:
          type: string
          description: Number of CPU running the thread.
        stackTrace:
          description: The contents of the thread's current execution stack.
          type: array
          items:
            type: string
    CASServerType:
      title: CAS Server Type
      description: CAS Server type. 'BackupController' and 'Backup' are synonyms.
        Compare for both values to determine if server is a backup controller.
      type: string
      enum:
      - Controller
      - Worker
      - BackupController
      - Backup
    CASServerState:
      title: CAS Server State
      description: CAS Server State
      type: string
      enum:
      - Starting Up
      - Running
      - Shutting Down
    CASProcess:
      title: CAS Process
      description: CAS Process
      properties:
        id:
          description: Process ID.
          type: string
        owner:
          description: User that owns the CAS process.
          type: string
        uptime:
          description: 'Time that the server has been running, in seconds.'
          type: number
          format: double
        userCPU:
          description: User CPU time for the process.
          type: number
          format: double
        sysCPU:
          description: System CPU time for the process.
          type: number
          format: double
        memoryUsed:
          description: 'Memory currently used by the process, in bytes.'
          type: integer
        maxMemoryUsed:
          description: 'Maximum memory used by the process, in bytes.'
          type: integer
        threadCount:
          description: Number of threads being run by the process.
          type: integer
        maxThreadCount:
          description: Maximum number of threads being run by the process.
          type: integer
        ioCount:
          description: 'IO count, in bytes.'
          type: integer
        os:
          type: object
          description: Operating system information.
          properties:
            name:
              description: Operating system name.
              type: string
            version:
              description: Operating system version.
              type: string
            release:
              description: Operating system release.
              type: string
        system:
          type: object
          description: System information.
          properties:
            type:
              description: System type.
              type: string
            name:
              description: System name.
              type: string
        casVersion:
          type: object
          description: Version information.
          properties:
            version:
              type: string
              description: Version of the CAS server.
            buildDate:
              type: string
              description: Build date of the CAS server.
            buildTime:
              type: string
              description: Build time of the CAS server.
    ActionResults:
      title: Action Results
      description: Action Results
      type: object
      properties:
        status:
          description: Always returns 0. Use disposition.statusCode instead.
          type: integer
        log:
          description: Concatenation of log entries into a single string.
          type: string
        results:
          $ref: '#/components/schemas/ResultsTable'
        logEntries:
          description: |
            A list of log messages generated by the action. These are the same as the
            log attribute, but include log level so that they can be filtered for display
            (e.g. display only errors).
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        disposition:
          $ref: '#/components/schemas/Disposition'
        changedResources:
          description: |
            A list of enumerated strings that represents state changes in the
            server that occurred while running the action. Clients can use these
            flags to distinguish what local resources must be refreshed (e.g.
            lists of caslibs) to reflect the current state of the server.
          type: array
          items:
            $ref: '#/components/schemas/ChangedResources'
        metrics:
          $ref: '#/components/schemas/ActionResultsMetrics'
    LogEntry:
      title: Log Entry
      description: Log Entry
      type: object
      properties:
        level:
          description: Level of the log entry.
          type: string
          enum:
          - all
          - trace
          - info
          - warn
          - error
          - fatal
          - none
        message:
          description: The text of the log entry.
          type: string
    Disposition:
      title: Action Disposition
      description: Disposition
      type: object
      properties:
        severity:
          description: Severity of the error.
          type: string
          enum:
          - Normal
          - Warning
          - Error
        reason:
          description: Reason for the error.
          type: string
          enum:
          - OK
          - Authorization
          - Network
          - Memory
          - Authentication
          - Exception
          - Abort
        statusCode:
          description: Status of the execution. 0 = success.
          type: integer
        formattedStatus:
          description: A formatted representation of the statusCode. May be null.
          type: string
        debugInfo:
          description: Additional debugging information. May be null.
          type: string
        changedResources:
          description: A list of server resources that were changed by the action.
            Applications can use this value to determine what local copies of server
            information must be updated to match the new state of the server.
          type: array
          items:
            $ref: '#/components/schemas/CASResource'
        metrics:
          $ref: '#/components/schemas/ActionMetrics'
    CASResource:
      title: CAS Resource
      description: CAS Resource
      type: string
      enum:
      - caslibs
      - tables
      - actionsets
      - datasources
      - caslibPermissions
      - actionPermissions
      - administrators
      - BWList
    ActionMetrics:
      title: Action Metrics
      description: Action Metrics
      properties:
        elapsedTime:
          description: 'Real time consumed by the action, in seconds'
          type: number
          format: double
        cpuUserTime:
          description: User CPU time used by the action on all nodes.
          type: number
          format: double
        cpuSystemTime:
          description: System CPU time used by the action on all nodes.
          type: number
          format: double
        systemTotalMemory:
          description: Total memory available to the system in bytes.
          type: integer
        systemNodes:
          description: Total nodes in the session.
          type: integer
        systemCores:
          description: Number of cores in the session.
          type: integer
        memory:
          description: Memory used by the action on all nodes in bytes.
          type: integer
        osMemory:
          description: OS memory used by the action on all nodes in bytes.
          type: integer
        systemMemory:
          description: System memory used by the action in bytes.
          type: integer
        memoryQuota:
          description: Memory quota.
          type: integer
        ioPageReclaims:
          description: Page reclaims.
          type: integer
        ioPageFaults:
          description: Page faults.
          type: integer
        ioReadFaults:
          description: Read faults.
          type: integer
        ioReadBlocks:
          description: Block input operations.
          type: integer
        ioReadCalls:
          description: Number of read requests.
          type: integer
        ioWriteCalls:
          description: Number of write requests.
          type: integer
        ioReadBytes:
          description: Bytes read.
          type: integer
        ioWriteBytes:
          description: Bytes written.
          type: integer
        ioWriteBytesCancelled:
          description: Bytes written but cancelled.
          type: integer
        voluntaryContextSwitches:
          description: Number of voluntary context switches.
          type: integer
        involuntaryContextSwitches:
          description: Number of involuntary context switches.
          type: integer
    ResultsTable:
      title: Results Table
      description: Results Table
      properties:
        _ctb:
          type: boolean
          description: Always true. Indicates that the JSON object is a ResultsTable.
        label:
          description: Label for the table.
          type: string
        title:
          description: Title for the table.
          type: string
        name:
          description: Name of the table.
          type: string
        schema:
          type: array
          description: |
            Describes the data in each column, including data types.
          items:
            $ref: '#/components/schemas/ResultsTableColumn'
        attributes:
          type: object
          description: Attributes defined for the table. No formal schema is used
            for table attributes.
        rows:
          description: |
            Table data, array of column data. Column data objects match the
            type specified in the schema attribute.
          type: array
          items:
            type: object
    ResultsTableColumn:
      title: Results Table Column
      description: Results Table Column
      properties:
        name:
          description: The name of the column.
          type: string
        label:
          description: The label for the column.
          type: string
          example: Some column label
        format:
          description: The format used to display the data.
          type: string
        type:
          description: The column's data type.
          type: string
          enum:
          - int
          - double
          - string
          - decsext
          example: int
        width:
          description: The width of the column.
          type: integer
        attributes:
          description: Attributes for the table. No formal schema exists for column
            attributes.
          type: object
    CASAdministrator:
      title: CAS Administrator
      description: CAS Administrator
      type: object
      properties:
        name:
          description: The name for the administrator.
          type: string
          example: SAS Administrators
        id:
          description: The unique identifier for the administrator. Not a UUID.
          type: string
          example: "1"
        isGroup:
          type: boolean
          description: 'If true, name field is a group name rather than a user name.'
          example: true
        type:
          description: 'Administrator type. A data administrator can only administer
            caslibs and tables. A CAS administrator can administer data as well as
            server lifecycle, including node addition and removal.'
          type: string
          enum:
          - cas
          - data
          example: cas
    APIResult:
      title: API Result
      description: API Result
      type: object
      properties:
        result:
          type: string
          description: |
            The result of the call. "Success" indicates that the call was successful.
            Other values are a description of the failure.
          example: "Success"
    CASNotifications:
      title: CAS Notifications
      description: CAS Notifications
      type: object
      properties:
        list:
          description: |
            List of messages for the specified time period. The timeStamp field
            can be used to order the messages.
          type: array
          items:
            $ref: '#/components/schemas/CASMessage'
        timeStamp:
          description: The time that the returned list was generated. Send this back
            to the server on subsequent calls to get messages after this was generated.
          type: integer
        state:
          description: The current state of the CAS server.
          type: string
          enum:
          - Shutting Down
          - Starting Up
          - Running
    CASMessage:
      title: CAS Message
      description: CAS Message
      type: object
      properties:
        text:
          description: The text of the message.
          type: string
        severity:
          description: 'The severity of the message. 0 = all, 1 = trace, 2 = debug,
            3 = informational, 4 = warning, 5 = error, 6 = fatal.'
          type: integer
        timeStamp:
          description: 'The time the message was generated, in POSIX seconds.'
          type: integer
    ProcessEnvironment:
      title: Process Environment
      description: Process Environment
      type: array
      items:
        $ref: '#/components/schemas/EnvironmentVariable'
    EnvironmentVariable:
      title: Environment Variable
      description: Environment Variable
      type: object
      properties:
        name:
          description: The name of the environment variable.
          type: string
        value:
          description: The value of the environment variable.
          type: string
    TopSystemMetrics:
      title: Top System Metrics
      description: Top System Metrics
      type: object
      properties:
        cpuLoad:
          description: |
            System CPU load, which is orders of magnitude of
            system load. 1.0 = normal, higher numbers indicate more load.
            CAS servers running on Windows return 0.
          type: number
          format: double
        system:
          $ref: '#/components/schemas/SystemInformation'
        processes:
          title: ArrayOfProcesses
          type: array
          items:
            $ref: '#/components/schemas/Process'
    SessionOwner:
      title: Session Owner
      description: Session Owner
      type: object
      properties:
        user:
          description: The name of the user that owns the session.
          type: string
        owner:
          description: Synonym for user.
          type: string
    ErrorCode:
      title: Error Code
      description: An identifier for the failure that occurred.
      type: string
      enum:
      - ActionFailed
      - ActionInsufficientCredentials
      - ActionParmsBadType
      - ActionParseError
      - ActionSendFailed
      - ActionSetUnknown
      - ActionUnknown
      - AdminExists
      - AdminRequired
      - AdminUnknown
      - AuthRequired
      - AuthTypeNotSupported
      - BadJSONType
      - BadMethod
      - ConnectFailed
      - ExceptionOccurred
      - IncorrectParameterValue
      - InsufficientPermissions
      - JSONParseError
      - LoggerExists
      - NoActionDefinitions
      - NodeDisconnected
      - NodeUnknown
      - PathNotFound
      - ParameterEmpty
      - ParameterInvalidValue
      - ParameterMissing
      - ParameterWrongType
      - ProcessIdentifierNotNumber
      - ProcessOrThreadUnknown
      - ProcessUnknown
      - RoleNotAssumed
      - SessionDoesNotRespond
      - SessionNoId
      - SessionNoNodes
      - SessionReturnedError
      - SessionUnknown
      - ThreadUnknown
      - UnsupportedForOutputType
    ErrorResponse:
      title: Error Response
      description: Error Response
      type: object
      properties:
        error:
          description: |
            Describes the error that occurred.
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          description: |
            Additional information about the error, usually the object/entity
            involved in the failure. For example, a 404 response with the SessionUnknown
            code would provide the session id as details.




            Value is null if there is no additional information.
          type: string
        disposition:
          $ref: '#/components/schemas/Disposition'
    ChangedResources:
      title: Changed Resources
      description: Changed Resources
      type: string
      enum:
      - caslibs
      - tables
      - actionsets
      - datasource
      - caslibPermissions
      - actionPermissions
      - administrators
      - BWList
    ActionResultsMetrics:
      title: Action Results Metrics
      description: Action Results Metrics
      type: object
      properties:
        elapsedTime:
          description: 'Elapsed time on all nodes while running the action, in seconds.'
          type: number
          format: double
        cpuUserTime:
          description: 'User CPU time used on all nodes while running the action,
            in seconds.'
          type: number
          format: double
        cpuSystemTime:
          description: 'Systen CPU time used on all nodes while running the action,
            in seconds.'
          type: number
          format: double
        systemTotalMemory:
          description: 'Total memory available to the system, in bytes.'
          type: integer
        systemNodes:
          description: Number of nodes (machines).
          type: integer
        systemCores:
          description: Number of cores in the session.
          type: integer
        memory:
          description: Memory used by the action on all nodes in bytes.
          type: integer
        osMemory:
          description: OS memory used by the action on all nodes in bytes.
          type: integer
        systemMemory:
          description: System memory used by the action in bytes.
          type: integer
        memoryQuota:
          description: Memory quota in bytes.
          type: integer
        ioPageReclaims:
          description: Page reclaims.
          type: integer
        ioPageFaults:
          description: Page faults.
          type: integer
        ioReadFaults:
          description: Read faults.
          type: integer
        ioReadBlocks:
          description: Block input operations.
          type: integer
        ioReadCalls:
          description: Number of read requests.
          type: integer
        ioWriteCalls:
          description: Number of write requests.
          type: integer
        ioReadBytes:
          description: Bytes read.
          type: integer
        ioWriteBytes:
          description: Bytes written.
          type: integer
        ioWriteBytesCancelled:
          description: Bytes written but cancelled.
          type: integer
        voluntaryContextSwitches:
          description: Number of voluntary context switches.
          type: integer
        involuntaryContextSwitches:
          description: Number of involuntary context switches.
          type: integer
        dataMovementBytes:
          description: |
            Total number of bytes of data moved between nodes on the grid
            while running the action.
          type: integer
    ActionDefinition:
      title: Action Definition
      description: Action Definition
      type: object
      properties:
        actionSet:
          description: |
            Action set that contains the action.
          type: string
        description:
          description: |
            Description of the action.
          type: object
          properties:
            text:
              type: string
        label:
          description: |
            Label for the action for user interfaces.
          type: object
          properties:
            text:
              type: string
        name:
          description: |
            Name of the action.
          type: string
        parameters:
          description: |
            Array of parameters for the action.
          type: array
          items:
            $ref: '#/components/schemas/ActionParameter'
        results:
          description: |
            List of results returned by the action. Not all actions provide this
            information. If not provided, refer to the action documentation, which can be found
            at:
            <ul>
            <li style="list-style-type:none;"><a target="_blank" href="http://documentation.sas.com/#/?cdcId=vdmmlcdc&cdcVersion=8.1&docsetId=caspg&docsetTarget=titlepage.htm">System Programming Guide</a></li>
            <li style="list-style-type:none;"><a target="_blank" href="http://documentation.sas.com/#/?cdcId=vdmmlcdc&cdcVersion=8.1&docsetId=casanpg&docsetTarget=titlepage.htm">Analytics Programming Guide</a></li>
            <li style="list-style-type:none;"><a target="_blank" href="http://documentation.sas.com/#/?cdcId=vdmmlcdc&cdcVersion=8.1&docsetId=casactstat&docsetTarget=titlepage.htm">Statistics Programming Guide</a></li>
            <li style="list-style-type:none;"><a target="_blank" href="http://documentation.sas.com/#/?cdcId=vdmmlcdc&cdcVersion=8.1&docsetId=casactml&docsetTarget=titlepage.htm">Data Mining and Machine Learning Programming Guide</a></li>
            </ul>
          type: array
          items:
            $ref: '#/components/schemas/ActionResultValue'
        entry:
          description: Entry point for the action. Used internally.
          type: string
        id:
          description: Unique identifier for this definition. Not a UUID.
          type: string
        jsonObjectType:
          description: The type of this object. Value is always "action" for this
            schema.
          type: string
    ActionParameter:
      title: Action Parameter
      type: object
      description: |
        Defines an action parameter.
      properties:
        description:
          description: |
            Description of the parameter.
          type: string
        name:
          description: Parameter name.
          type: string
        alias:
          description: |
            List of alternative, equivalent names for the parameter. Used to provide
            shorter names or alternative spellings for a parameter.

            For example, a parameter could have a primary name in camelcase and
            underscore format. The name could be "caseSensitive" and have an
            alias of "case_sensitive".
          type: array
          items:
            $ref: '#/components/schemas/Alias'
        type:
          description: Data type of parameter value.
          type: string
          enum:
          - Boolean
          - Blob
          - Date
          - DateTime
          - Double
          - Int32
          - Int64
          - Items
          - List
          - NilList
          - String
          - Table
          - Time
          - BooleanList
          - BlobList
          - DateList
          - DateTimeList
          - DoubleList
          - Int32List
          - Int64List
          - ItemsList
          - StringList
          - TableList
          - TimeList
          - enumlist
          - enum
          - ParamArray
          - ParamList
          - Alternatives
        paramlistName:
          description: |
            When the parameter is of type ParamList, an optional name for the
            parameter list.
          type: string
        subparameters:
          description: List of parameters describing the parameters in the ParamList.
          type: array
          items:
            $ref: '#/components/schemas/ActionParameter'
        constants:
          description: |
            When parameter is of type enum, this list defines the values for the enum.
          type: array
          items:
            $ref: '#/components/schemas/EnumValue'
        default:
          description: |
            Default value for this parameter. Data type matches the type of the parameter.
        informat:
          description: |
            Name of a SAS informat to use on strings that are supplied as parameter
            values. If an informat is supplied, then any string provided as a parameter
            value will be formatted using the informat, and the result (whether
            string or numeric) will be used as the value instead.
          type: string
        exclmax:
          description: |
            The (numeric) parameter, or list item count, must be less than, but
            not equal to, the specified value.
          type: number
        exclmin:
          description: |
            The (numeric) parameter, or list item count, must be greater than,
            but not equal to, the specified value.
          type: number
        minvalue:
          description: |
            The (numeric) parameter must be greater than or equal to the specified value.
          type: number
        maxvalue:
          description: |
            The (numeric) parameter must be less than or equal to the specified value.
          type: number
        flagKeyedlist:
          description: |
            When set on a list parameter, the list should contain keys. For JSON,
            this means that the list should be a JSON object rather than a JSON
            array.
          type: boolean
        flagRequired:
          description: |
            When true, a value for this parameter is required.
          type: boolean
        flagNotblank:
          description: |
            When set on a string, the string cannot be null, nor empty, nor all blanks.
          type: boolean
        flagNotnull:
          description: |
            Value cannot be null.
          type: boolean
        flagBytemeasure:
          description: |
            When set on an int32 or int64 parameter, the value can be specified as a
            string instead with a byte unit suffix of 'b' for bytes (ignored), 'k'
            for kilobytes, 'm' for megabytes, 'g' for gigabytes, and 't' for terabytes.




            For these memory units, 1 kilobytes = 1024 bytes.
          type: boolean
        flagHidden:
          description: |
            Parameter is not shown to the user. Usually set on parameters reserved
            for internal use.
          type: boolean
        flagHidedefault:
          description: |
            If set, the default value is not shown to the user. Used in cases
            where default values are not significant, e.g. setting a double
            to DOUBLE_MAX.
          type: boolean
        flagIscompvar:
          description: |
            When set on a string list parameter, the list contains computed column
            names. User interfaces can check this flag and generate the appropriate interface.
          type: boolean
        flagIsgroupby:
          description: |
            When set on a string parameter, the parameter is a group by clause.
            User interfaces can check this flag and generate the appropriate interface.
          type: boolean
        flagIsorderby:
          description: |
            When set on a string parameter, the parameter is an order by clause.
            User interfaces can check this flag and generate the appropriate interface.
          type: boolean
        flagIspassword:
          description: |
            When set on a string parameter, the parameter is a password, and the value
            should be protected (e.g. obscured in user interfaces).
          type: boolean
        flagIsunique:
          description: |
            When set on a list of any type, the list must contain unique values.
            Only lists of type boolean, int32, int64, double, date, datetime, and string
            are validated for uniqueness when the parameters are processed before
            running the action.
          type: boolean
        flagIsusername:
          description: |
            When set on a string parameter, value is a user name.
          type: boolean
        flagIsvar:
          description: |
            When set on a string or stringlist parameter, the value(s) are
            variable names. User interfaces can check this flag and generate the
            appropriate interface.
          type: boolean
        flagIswhere:
          description: |
            When set on a string parameter, the parameter is a where clause. User
            interfaces can check this flag and generate an interface specific to where
            clauses.
          type: boolean
        flagNopreload:
          description: |
            When set on a table parameter, CAS does not preload the specified table
            before the action is started, allowing the action itself to determine
            if the table should be opened.
          type: boolean
        id:
          description: Unique identifier for this definition. Not a UUID.
          type: string
        jsonObjectType:
          description: The type of this object. Value is always "param" for this schema.
          type: string
        label:
          description: Label for the parameter.
          type: object
          properties:
            text:
              description: The text of the label.
              type: string
        minitems:
          description: Minimum items.
          type: string
    Alias:
      title: Alias
      type: object
      description: 'Alias Object'
      properties:
        name:
          type: string
          description: |
            List of alternative, equivalent names for an item, providing shorter
            names or alternative spellings. For example, an alias could provide
            the underscore form of a camelcase name.
        hidden:
          description: |
            If true, alias is not displayed by clients and not documented to users.




            This attribute might not included in the object when value is false.
          type: boolean
    EnumValue:
