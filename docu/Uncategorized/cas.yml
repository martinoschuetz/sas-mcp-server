      summary: Change logging level
      operationId: changeLoggingLevel
      requestBody:
        required: false
        content:
          application/json:
            example:
              level: debug
              appender: ''
            schema:
              type: object
              properties:
                appender:
                  description: >
                    Name of one or more appenders to use to write log messages,
                    separated by commas or as an array when using JSON.
                  type: string
                level:
                  description: New logging level to be used for the logger.
                  type: string
                  enum:
                  - 'null'
                  - all
                  - trace
                  - debug
                  - info
                  - warn
                  - error
                  - fatal
                  - 'off'
              required:
              - level
      parameters:
      - name: appender
        in: query
        required: false
        description: |
          Name of one or more appenders to use to write log messages, separated by commas or as an array when using JSON.
        schema:
          type: string
      - name: level
        in: query
        required: true
        description: New logging level to be used for the logger.
        schema:
          type: string
          enum:
          - 'null'
          - all
          - trace
          - debug
          - info
          - warn
          - error
          - fatal
          - 'off'
      responses:
        '200':
          description: OK
