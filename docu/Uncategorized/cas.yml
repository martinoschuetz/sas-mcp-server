      type: string
      enum:
      - ''
      - all
      - All
      - trace
      - Trace
      - debug
      - Debug
      - info
      - Info
      - warn
      - Warn
      - error
      - Error
      - fatal
      - Fatal
      - 'off'
      - 'Off'
    CASConfigurationValue:
      title: CAS Configuration Value
      description: A name/value pair that specifies a configuration option.
      type: object
      properties:
        name:
          description: The name of the option.
          type: string
        value:
          description: 'The value of the option as a string. If the value is sensitive
            data for security reasons, the value is a string of asterisks.'
          type: string
        isPassword:
          description: 'When TRUE, value is obscured and not provided, even for administrators.'
          type: boolean
        source:
          description: The original source of the option value. "External" sources
            include things like Consul.
          type: string
          enum:
          - File
          - Command Line
          - Environment
          - External
          - Internal/Computed
          - Set
          - default
    Caslib:
      title: Caslib - CAS Library
      description: Defines the information needed to access data from a particular
        data storage system/data provider.
      type: object
      properties:
        Name:
          description: caslib name.
          type: string
        Type:
          description: caslib source type.
          type: string
        Description:
          description: Description of the caslib.
          type: string
        Path:
          description: 'Path to the caslib files, for data sources that use path-based
            storage.'
          type: string
        Definition:
          description: 'Name/value pairs that define parameters for accessing data.
            If there are multiple definitions, then multiple objects are created with
            the same name. The first entry contains valid data for all attributes,
            and subsequent objects only use the Definition field.'
          type: string
        Subdirs:
          description: 'If non-zero, subdirectories are valid.'
          type: number
          format: double
        Local:
          description: 'Local flag. 0=false, 1=true.'
          type: number
          format: double
        Active:
          description: 'caslib is active for use. 0=false, 1=true.'
          type: number
          format: double
        Personal:
          description: 'If true, caslib is created for a specific user (e.g. CASUSER).
            0=false, 1=true.'
          type: number
          format: double
        Hidden:
          description: 'caslib is hidden from user interfaces. 0=false, 1=true.'
          type: number
          format: double
        Transient:
          description: 'caslib is a temporary caslib created for a particular unit
            of work and may be when the work is completed.  0=false, 1=true.'
          type: number
          format: double
