    delete:
      parameters:
      - name: command
        in: query
        description: Select the method used to end the session.
        required: true
        schema:
          type: string
          enum:
          - endSession
          - cancel
          - terminate
      tags:
      - Sessions
      operationId: destroySession
      summary: Destroy a session
      description: |
        Destroy a session. The method used to end the session is determined by
        the value of the "command" option. For "endSession", the session is ended
        using the endSession action, and no output is returned upon success.
        For "cancel", the session is eonded using the
        cancelSession action (run in a transient session), and an empty JSON object
        is returned upon success. For "terminate", the
        session's processes are terminated on all of the CAS nodes and an empty
        JSON object is returned upon success.
      responses:
        '200':
          description: OK
        '404':
          description: Unknown session.
          content:
            application/json:
              schema:
