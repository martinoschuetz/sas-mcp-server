    post:
      tags:
      - Cas
      description: Adds a new logger to the logging system using the specified level
        and appender. Can only be performed by a CAS Administrator. The appender associated
        with the logger must have already been created.
      summary: Add a new logger to the logging system
      operationId: addLogger
      parameters:
      - name: appender
        in: query
        required: false
        description: |
          Name of one or more appenders to use to write log messages, separated by commas or as an array when using JSON.
        schema:
          type: string
      - name: level
        in: query
        required: true
        description: 'New logging level to be used for the logger, one of "null",
          "all", "trace", "debug", "info", "warn", "error", "fatal", "off".'
        schema:
          type: string
          enum:
          - 'null'
          - all
          - trace
          - debug
          - info
          - warn
          - error
          - fatal
          - 'off'
      responses:
        '201':
          description: Created
