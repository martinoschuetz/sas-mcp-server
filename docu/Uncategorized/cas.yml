        name:
          description: The name of the session.
          type: string
        user:
          description: The user that created the session.
          type: string
        owner:
          description: Synonym for user.
          type: string
        state:
          description: The state of the session. Usually 'connected' or 'disconnected'.
          type: string
          enum:
          - default
          - unknown
          - inactive
          - connected
          - disconnected
          - exception
          - terminate
          - removed
