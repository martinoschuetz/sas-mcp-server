      operationId: createContext
      tags:
      - Contexts
      requestBody:
        content:
          application/vnd.sas.connect.context+json;version=1:
            schema:
              $ref: "#/components/schemas/context"
            examples:
              contextRequest:
                $ref: "#/components/examples/context"
          application/json:
            schema:
              $ref: "#/components/schemas/context"
            examples:
              contextRequest:
                $ref: "#/components/examples/context"
        description: SAS/CONNECT context information
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of created context.
              schema:
                type: string
            ETag:
              description: Entity tag of created context.
              schema:
                type: string
          content:
            application/vnd.sas.connect.context+json;version=1:
              schema:
                $ref: "#/components/schemas/contextWithLinks"
              examples:
                context:
                  $ref: "#/components/examples/contextWithLinks"
            application/json:
              schema:
                $ref: "#/components/schemas/contextWithLinks"
              examples:
                context:
                  $ref: "#/components/examples/contextWithLinks"
        "400":
          description: >
            | Error Code | "Bad Request" Error
            Description                         |

            | ---------- | -------------------------------------------------------
            |

            |   32702    | The SAS/CONNECT context name or ID is not specified.    |

            |   32750    | The SAS/CONNECT SIGNON type is not specified.           |

            |   32751    | The SAS/CONNECT SIGNON type is not valid. It must be SPAWNER
            or LAUNCHER.               |

            |   32720    | The launcher context ID is not specified.               |

            |   32721    | The launcher context ID is not valid.                   |

            |   32760    | The spawner host is not specified.                      |

            |   32761    | The spawner port is not valid.  It must be a number larger
            than 1024 and less than 32768.                         |

            |   32710    | The encryption algorithm is not specified.              |

            |   32711    | The specified encryption algorithm is not valid. It must
            be SSL, AES, RC2, RC4, DES, TRIPLEDES, or SASPROPRIETARY.        |
          content:
            application/vnd.sas.connect.context+json;version=1:
              schema:
                $ref: "#/components/schemas/sasErrorResponse"
              examples:
                context:
                  $ref: "#/components/examples/sasErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/sasErrorResponse"
              examples:
                context:
                  $ref: "#/components/examples/sasErrorResponse"
        "409":
          description: >
            | Error Code | "Conflict" Error
            Description                            |

            | ---------- | -------------------------------------------------------
            |

            |   32700    | The SAS/CONNECT context name ''{0}'' already exists with
            ID ''{1}''. |
          content:
            application/vnd.sas.connect.context+json;version=1:
              schema:
                $ref: "#/components/schemas/sasErrorResponse"
              examples:
                context:
                  $ref: "#/components/examples/sasErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/sasErrorResponse"
              examples:
                context:
                  $ref: "#/components/examples/sasErrorResponse"
