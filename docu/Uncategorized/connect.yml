---
openapi: 3.0.3
info:
  version: "1"
  title: SAS/CONNECT
  description: >
    The SAS/CONNECT API enables clients to define and manage SAS/CONNECT
    servers.

    A SAS/CONNECT server is defined through a SAS/CONNECT server context. Contexts
    can be

    created, read, updated and deleted via the REST API.


    SAS/CONNECT servers are defined in a context as being launched by the SAS/CONNECT
    spawner

    or the Launcher. If a server is launched by the spawner, the host and port

    of the spawner is stored in the context. If the server is started by the Launcher,

    the Launcher context is stored in the SAS/CONNECT context along with

    other options to provide information on how to launch the server.


    The SAS/CONNECT API's servers resource provides a way to manage a SAS/CONNECT
    server

    that is launched through the Launcher. This resource will allow you to create,

    monitor, optionally terminate, and delete SAS/CONNECT servers. A server's status
    can be

    polled to determine its state and is assumed to be active once the server's state
    is RUNNING,

    the server's host is defined and the server's port is non-zero. A server can be
    terminated

    through the REST API if it does not shutdown. Lastly, a server must be deleted
    when its

    information is no longer needed.

    <br> <br><b>Terminology:</b> <br><br>
    Connect: A Connect context is a group of information that represents a logical
    Connect server to the REST API consumer. It contains all the information necessary
    for SAS/CONNECT to know how to process a Connect server request. It is analogous
    to information contained in logical connect server under a SAS application server
    context
    in SAS 9.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    email: "devex@sas.com"
    url: "https://developer.sas.com"
servers:
- url: http://example.com/connect
  description: kubernetes mock server
tags:
- name: Root
  description: Information related to the root resource of the SAS/CONNECT API.
- name: Contexts
  description: Information related to starting SAS/CONNECT servers.
- name: Servers
  description: Management of SAS/CONNECT servers.
