          default: 1
        contextId:
          description: SAS/CONNECT context ID
          type: string
        launcherOptions:
          description: A collection of properties to pass to the SAS Launch service
            when starting a SAS/CONNECT server process.
          type: object
          properties:
            sasProperties:
              description: Properties to add to the SAS command line when starting
                a SAS/CONNECT server process.
              type: object
              properties:
