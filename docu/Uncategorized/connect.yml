      - Servers
      parameters:
      - $ref: "#/components/parameters/ServerIDParm"
      - $ref: "#/components/parameters/ServerStateParm"
      responses:
        "202":
          description: The SAS/CONNECT server will be terminated.
        "400":
          description: >
            | Error Code | "Bad Request" Error
