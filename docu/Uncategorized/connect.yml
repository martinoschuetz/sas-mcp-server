          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/sasErrorResponse"
              examples:
                serverState:
                  $ref: "#/components/examples/sasErrorResponse"
        "500":
          description: |
            | Error Code | "Server Error" Error Description          |
            | ---------- | ----------------------------------------- |
            |   32733    | Cannot kill process for specified server  |
