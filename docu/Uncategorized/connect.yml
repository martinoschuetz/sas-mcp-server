      allOf:
      - $ref: "#/components/schemas/objectLinks"
      - type: object
        properties:
          version:
            type: integer
            description: Object schema version
            default: 1
    contextLauncherOptions:
      description: An object in a SAS/CONNECT Context that contains launch information
        using the SAS Launcher service.
      type: object
      required:
      - contextId
      properties:
        contextId:
          type: string
          description: Launcher context ID
        gridProviderOptions:
          type: string
          description: Additional grid provider options to use if server launched
            on grid
        sasOptions:
          type: string
          description: Additional SAS options to use when launching the server
        requiredResources:
          type: string
          description: Resources required if server launched on grid
    contextSpawnerOptions:
      description: An object in a SAS/CONNECT Context that contains connection information
        to a SAS/CONNECT spawner.
      type: object
      required:
      - host
      - port
      properties:
        host:
          type: string
          description: Host the spawner is running on
        port:
          type: integer
          description: Port the spawner is listening on
    context:
      description: An application/vnd.sas.connect.context object containing SAS/CONNECT
        Context information
      type: object
      required:
      - version
      - name
      - signonType
      properties:
        version:
          type: integer
          description: Object schema version
          default: 1
        id:
          type: string
          description: SAS/CONNECT context ID
        name:
          type: string
          description: localizable context name
        description:
          type: string
          description: Context description
        signonType:
          description: Type of SIGNON. How the SAS/CONNECT server will be created
          type: string
          enum:
          - spawner
          - launcher
        spawnerOptions:
          $ref: "#/components/schemas/contextSpawnerOptions"
        launcherOptions:
          $ref: "#/components/schemas/contextLauncherOptions"
        requireEncryption:
          description: Flag to indicate whether to require encryption
          type: boolean
        encryptionAlgorithm:
          description: Type of encryption to be used for communication
          type: string
          enum:
          - ssl
          - aes
          - rc2
          - rc4
          - des
          - tripledes
          - sasproprietary
        allowXCmd:
          description: Flag to indicate if the connect server should allow XCMDs
          type: boolean
    contextWithLinks:
      description: An application/vnd.sas.connect.context object along with its HATEOS
        links
      allOf:
      - $ref: "#/components/schemas/context"
