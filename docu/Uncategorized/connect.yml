                  $ref: "#/components/examples/sasErrorResponse"
components:
  parameters:
    IfMatch.Header.Required:
      name: If-Match
      in: header
      description: Entity tag (ETag) value of object to be updated.
      required: true
      schema:
        type: string
    ContextNameQueryParm:
      name: name
      in: query
      description: Name of SAS/CONNECT context to use
      required: true
      schema:
        type: string
    ContextQueryParm:
      name: contextId
      in: query
      description: ID of SAS/CONNECT context to use
      required: false
      schema:
        type: string
    ContextIdPathParm:
      name: contextId
      in: path
      description: ID of SAS/CONNECT context to use
      required: true
      schema:
        type: string
    ContextAcceptHeaderParm:
      name: Accept-Item
      in: header
      required: false
      description: >
        The desired context representation.


        The Accept-Item header options are:

        <ul>
          <li>application/vnd.sas.connect.context.summary</li>
          <li>application/vnd.sas.connect.context</li>
        </ul>


        If the application/vnd.sas.connect.context media type is specified, all context
        information is returned.


        If the application/vnd.sas.connect.context.summary media type is specified
        or no Accept-Item header is specified,

        only the context name, description, and ID are returned along with a self
        link.
      schema:
        type: string
        enum:
        - application/vnd.sas.connect.context.summary
        - application/vnd.sas.connect.context
    DebugQueryParm:
      name: enableDebug
      in: query
      description: Flag to indicate whether to enable debug logging
      required: false
      schema:
        type: boolean
    ServerIDParm:
      name: serverId
      in: path
      description: ID of SAS/CONNECT server
      required: true
      schema:
        type: string
    ServerStateParm:
      name: value
      in: query
      description: New server state - only 'canceled' is valid and will terminate
        the server
      required: true
      schema:
        type: string
    CollectionStartParm:
      name: start
      in: query
      description: 0-based offset of first object to return.  Defaults to 0.
      schema:
        type: integer
    CollectionLimitParm:
      name: limit
      in: query
      description: Maximum number of objects to return.  Defaults to 30.
      schema:
        type: integer
    CollectionFilterParm:
      name: filter
      in: query
      description: Filter criteria for returned information.
      schema:
        type: string
        format: filter-criteria
    CollectionSortByParm:
      name: sortBy
      in: query
      description: Sort returned objects by specified sort order.
      schema:
        type: string
        format: sort-criteria
  schemas:
    resourceCollection:
      description: A collection of resources
      type: object
      properties:
        start:
          type: integer
          description: The 0-based index of the result.
        count:
          type: integer
          description: The actual number of results returned in the collection.
        limit:
          type: integer
          description: The number of items to return in each page
        name:
          type: string
          description: The abstract name of the collection; what the "items" member
            represents.
        accept:
          type: string
          description: A space-separated list of link types of the items in this collection.
        links:
          type: array
          description: Paging links that apply to this collection
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: collection schema version
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    objectLinks:
      description: An array of resource links
      type: object
      properties:
        links:
          type: array
          description: Links related to this object and actions on this object
          items:
            $ref: "#/components/schemas/link"
    trackedObject:
      description: A set of properties that allow a resource to be tracked
      type: object
      properties:
        creationTimeStamp:
          type: string
          format: date-time
          description: Timestamp of creation.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Timestamp of last modification
        createdBy:
          type: string
          format: string
          description: The user who creates the object
        modifiedBy:
          type: string
          format: string
          description: The user who last modified the object
    rootOutput:
      description: An application/vnd.sas.api object returning links to all resources
