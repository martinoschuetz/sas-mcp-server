components:
  schemas:
    error:
      $ref: "#/components/schemas/error2"
    archiveRequest:
      description: Request to archive a resource
      type: object
      required:
      - objectUri
      - objectMediaType
      properties:
        createdBy:
          description: userid of the user who created this request
          type: string
        creationTimeStamp:
          description: creation date of this request
          type: string
          format: date-time
        description:
          description: description of the request
          type: string
        id:
          description: the unique identifier of this job request.
          type: string
        links:
          description: zero or more link objects
          type: array
          items:
            $ref: "#/components/schemas/link"
        modifiedBy:
          description: userid of the user who last modified the request.
          type: string
        modifiedTimeStamp:
          description: date of last modification
          type: string
          format: date-time
        name:
          description: name of the request
          type: string
        objectUri:
          description: The URI of the object to be archived
          type: string
        objectMediaType:
          description: The media type of the object to be archived
          type: string
        revision:
          description: revision of this resource
          type: integer
          format: int64
        version:
          description: version of the resource
          type: integer
          format: int32
    exportJob:
      description: Job to export a resource
      type: object
      properties:
        completedTimeStamp:
          description: timestamp when the Job was completed
          type: string
          format: date-time
        createdBy:
          description: userid of the user who created this job
          type: string
        creationTimeStamp:
          description: creation date of this job
          type: string
          format: date-time
        description:
          description: description of this job
          type: string
        error:
          $ref: "#/components/schemas/error2"
        errorCount:
          description: count of errors from this job
          type: integer
          format: int32
        id:
          description: the unique identifier of this job.
          type: string
        links:
          description: zero or more link objects
          type: array
          items:
            $ref: "#/components/schemas/link"
        modifiedBy:
          description: userid of the user who last modified the request.
          type: string
        modifiedTimeStamp:
          description: date of last modification
          type: string
          format: date-time
        name:
          description: name of the request
          type: string
        request:
          $ref: "#/components/schemas/exportRequest"
        results:
          description: the results of this job
          type: object
          additionalProperties:
            type: string
        startedTimeStamp:
          description: when this job was started
          type: string
          format: date-time
        state:
          description: the current status of the job
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - canceled
          - canceling
          - completedWithWarnings
          - completedWithErrors
        version:
          description: the version of the representation of this object
          type: integer
          format: int32
    exportRequest:
      description: Request to export an object
      type: object
      properties:
        description:
          description: description of the request
          type: string
        items:
          description: items in the request
          type: array
          items:
            type: string
        name:
          description: name of the request
