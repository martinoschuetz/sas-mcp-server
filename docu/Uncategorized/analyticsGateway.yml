  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
servers:
- url: "http://example.com/analyticsGateway"
  description: Example base url.
tags:
- name: ArchiveController
  description: Archive Controller.
- name: PipelineTemplateController
  description: Pipeline Template Controller.
- name: ProjectController
  description: Project Controller.
- name: ProjectAssociationController
  description: Project Association Controller.
- name: RootController
  description: Root Controller.
- name: ProviderController
  description: Provider Controller.
- name: ComponentController
  description: Component Controller.
- name: ComponentTemplateController
  description: Component Template Controller.
- name: PipelineController
  description: Pipeline Controller.
- name: ToolboxController
  description: Toolbox Controller.
- name: SegmentationController
  description: Segmentation Controller.
paths:
  /:
    get:
      tags:
      - RootController
      summary: Get the API object
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                "Default":
                  $ref: "#/components/examples/RootGet200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                "Default":
                  $ref: "#/components/examples/RootGet200Response"
        "404":
          description: Not Found
  /archives/export:
    post:
      tags:
      - ArchiveController
      summary: Create an Archive
      description: Create an archive (transfer package). A successful response body
        will contain the export job created to complete the task.
      operationId: createExportArchive
      requestBody:
        content:
          application/vnd.sas.analytics.archive.request+json:
            schema:
              $ref: "#/components/schemas/archiveRequest"
            examples:
              default:
                $ref: "#/components/examples/ArchivePostExportRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/archiveRequest"
            examples:
              default:
                $ref: "#/components/examples/ArchivePostExportRequest"
        description: A request to build an archive
        required: true
      responses:
        "202":
          description: "Accepted. See the returned export job object for details of\
            \ the export."
          content:
            application/vnd.sas.transfer.export.job+json:
              schema:
                $ref: "#/components/schemas/exportJob"
              examples:
                default:
                  $ref: "#/components/examples/ArchivePostExport202Response"
            application/json:
              schema:
                $ref: "#/components/schemas/exportJob"
              examples:
                default:
                  $ref: "#/components/examples/ArchivePostExport202Response"
        "400":
          description: Bad Input
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/ArchivePostExport400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/ArchivePostExport400Response"
        "404":
          description: The specified project does not exist
          content:
            application/vnd.sas.transfer.export.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/ArchivePostExport404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/ArchivePostExport404Response"
        "406":
          description: The specified Accept media type is not supported.
          content:
            application/vnd.sas.transfer.export.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/ArchivePostExport406Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/ArchivePostExport406Response"
        "415":
          description: The specified Content-Type request header is not a supported
            media type.
          content:
            application/vnd.sas.analytics.project.association+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/ArchivePostExport415Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/ArchivePostExport415Response"
