    analyticsSegmentationPlan:
      title: Analytics Segmentation Plan
      description: A resource that encapsulates the plan for segmenting the data such
        that different segments can be modeled differently.
      x-sas-media-type:
        name: application/vnd.sas.analytics.segmentation.plan
        version: 1
      required:
      - defaultTemplateName

      properties:
        id:
          type: string
          description: The unique identifier for the resource.
          example: "d6d2dd86-f3de-47f4-a006-8e7d2b9e3d63"
          maximum: 255
        name:
          type: string
          description: A name for the segmentation plan.
          example: "Segment By Country"
          maximum: 100
        description:
          type: string
          description: A description of the segmentation plan.
          example: "This segmentation plan segments the data based on the country\
            \ code in the data."
          maximum: 500
        defaultTemplateName:
          type: string
          description: The name of the default template to use for modeling segment
            data.<br/> This may be overridden for individual segments.
          example: "Auto-forecasting"
          minimum: 1
          maximum: 100
        state:
          type: string
          maximum: 20
          description: This is a read-only, system-generated field that is the aggregated
            state of all of the segments. Order of precedence is a listed below, with
            the running state being the highest precedence. The state of the plan
            is the highest priority state of any segment in the plan.
          enum:
          - running
          - pending
          - modified
          - failed
          - canceled
          - created
          - completed
          example: "created"
        attributes:
          type: object
          additionalProperties: true
          description: Additional segment attributes that are specific to different
            implementations of a segmentation plan. This allows those to be added
            to this resource.
          example:
            foo: {bar: "prime", new: true}
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: "An array of links to related resources and actions.<br/>Includes:<dl><dt>self</dt>\
            \           <dd>retrieve the segmentation plan </dd><dt>up</dt>      \
            \       <dd>retrieve the parent of the segmentation plan </dd><dt>addSegments</dt>\
            \    <dd>add a collection of segments to the segmentation plan </dd><dt>deleteSegments</dt>\
            \ <dd>delete all segments in the segmentation plan </dd><dt>segments</dt>\
            \       <dd>retrieve the segments in the segmentation plan </dd><dt>template</dt>\
            \       <dd>retrieve the default template to use when creating pipelines\
            \ for segments in the segmentation plan </dd></dl>Other links may be added\
            \ by the consumer of the API for their own use."
          example: [{"method": "GET", "rel": "self", "href": "/analyticsDataSegmentation/plans/d6d2dd86-f3de-47f4-a006-8e7d2b9e3d63",
              "type": "application/vnd.sas.analytics.segmentation.plan", "uri": "/analyticsDataSegmentation/plans/d6d2dd86-f3de-47f4-a006-8e7d2b9e3d63"},
            {"method": "POST", "rel": "addSegments", "href": "/analyticsDataSegmentation/plans/d6d2dd86-f3de-47f4-a006-8e7d2b9e3d63/segments",
              "type": "application/vnd.sas.collection", "item-type": "application/vnd.sas.analytics.segment",
              "uri": "/analyticsDataSegmentation/plans/d6d2dd86-f3de-47f4-a006-8e7d2b9e3d63/segments"},
            {"method": "DELETE", "rel": "deleteSegments", "href": "/analyticsDataSegmentation/plans/d6d2dd86-f3de-47f4-a006-8e7d2b9e3d63/segments",
              "uri": "/analyticsDataSegmentation/plans/d6d2dd86-f3de-47f4-a006-8e7d2b9e3d63/segments"},
            {"method": "GET", "rel": "segments", "href": "/analyticsDataSegmentation/plans/d6d2dd86-f3de-47f4-a006-8e7d2b9e3d63/segments",
              "type": "application/vnd.sas.collection", "item-type": "application/vnd.sas.analytics.segment",
              "uri": "/analyticsDataSegmentation/plans/d6d2dd86-f3de-47f4-a006-8e7d2b9e3d63/segments"},
            {"method": "GET", "rel": "template", "href": "/analyticsPipelines/templates/analyticsPipelines/templates",
              "type": "application/vnd.sas.analytics.pipeline.template", "uri": "/analyticsPipelines/templates/analyticsPipelines/templates"}]
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1
          minimum: 1
          maximum: 1
          readOnly: true
        createdBy:
          type: string
          description: The user who created the segmentation plan.
          maximum: 255
          example: "{userId}"
        creationTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            segmentation plan was created.
          format: date-time
          example: "2024-06-12T16:49:40.628Z"
        modifiedBy:
          type: string
          description: The user who most recently modified the segmentation plan.
          maximum: 255
          example: "{userId}"
        modifiedTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            segmentation plan was last modified.
          format: date-time
          example: "2024-06-12T16:49:40.628Z"
        revision:
          type: integer
          description: A revision number that is incremented on every update to the
            segmentation plan.
          format: int64
          minimum: 0
          maximum: 9223372036854775807
