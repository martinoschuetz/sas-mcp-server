  /archives/import:
    post:
      tags:
      - ArchiveController
      summary: Upload an archive and begin import process
      description: "Upload an archive and automatically begin import process, returning\
        \ an ImportJob to allow for monitoring the job state"
      operationId: createImportArchive
      parameters:
      - name: parentFolderUri
        in: query
        description: "Specifies the URI of the folder in which to place the imported\
          \ project."
        required: false
        schema:
          type: string
          default: ""
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            examples:
              default:
                $ref: "#/components/examples/ArchivePostImportRequest"
        description: An archive file
        required: true
      responses:
