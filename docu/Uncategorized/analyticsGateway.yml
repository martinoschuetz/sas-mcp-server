      description: A resource that encapsulates the modeling for a given data segment.
      x-sas-media-type:
        name: application/vnd.sas.analytics.segment
        version: 1
      properties:
        id:
          type: string
          description: The unique identifier for the resource.
          example: "46cd070d-d5e7-4633-93a3-a840bf098e51"
          maximum: 255
        name:
          type: string
          description: A name for the segment. There is no attempt made to make these
            unique.
          example: "USA"
          maximum: 100
        description:
          type: string
          description: A description of the segment model suitable for debugging.
          example: "United States of America"
          maximum: 500
        cardinality:
          type: integer
          description: The number of records in the data that are included in this
            segment.
          example: 2374
          minimum: 0
          maximum: 2147483647
        discriminators:
          type: array
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: A name for the discriminator. There is no attempt made
                  to make these unique.
                example: "_SEG_"
                maximum: 256
              longValue:
                type: integer
                format: int64
                description: A numeric value for the discriminator.
                example: 78
                maximum: 9223372036854775807
                minimum: -9223372036854775808
              doubleValue:
                type: number
                format: double
                description: A numeric value for the discriminator.
                example: 3.14159265
                maximum: 1.7976931348623157e+308
                minimum: -1.7976931348623157e+308
              stringValue:
                type: string
                description: A string value for the discriminator.
                example: blue
                maximum: 4000
            description: A distinct data value. It is expected that only one of the
              value properties will be set for a discriminator, but this is not enforced.
          description: The set of distinct data values used to identify data that
            is part of this segment.
        fitStatistics:
          type: array
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: A name for the fitStatistic. There is no attempt made
                  to make these unique.
                example: "WMAPE"
                maximum: 256
              value:
                type: number
                format: double
                description: The value for the fitStatistic.
                example: 3.45
                maximum: 1.7976931348623157e+308
                minimum: -1.7976931348623157e+308
            description: A fit statistic.
          description: The collection of fit statistics calculated for the segment.
        templateName:
          type: string
          maximum: 100
          description: The name of the template to use for modeling the segment data.<br/>
            If no template is specified for the segment the defaultTemplateName in
            the plan specifies the name of the template for the segment.
          example: "Auto-forecasting"
        customized:
          type: boolean
          description: Indicates whether or not the pipeline for the segment has been
            customized.<br/> True if the pipeline was customized any time after creation,
            false otherwise.
          readOnly: true
          example: false
        dirty:
          type: boolean
          description: Indicates whether or not the pipeline for the segment should
            be rerun for reasons that are not tracked by the segmentation service.
            Only impacts the execution of pipelines that are in the completed state.
