  /componentTemplates:
    head:
      tags:
      - ComponentTemplateController
      summary: Retrieve all component templates
      description: Retrieve the collection of Component Template Summaries for all
        component templates. Use ?custom=true to retrieve only those that were not
        provided by SAS.
      operationId: headersForComponentTemplates
      parameters:
      - name: Accept-Item
        in: header
        description: Media type for the items to be included in the resource collection.
          This can be specified to get the full resource or just a summary.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.component.template.summary+json
          - application/vnd.sas.analytics.component.template+json
          default: application/vnd.sas.analytics.component.template.summary+json
      - name: custom
        in: query
        description: Include only custom (non SAS) component templates.
        required: false
        schema:
          type: boolean
          default: false
      - name: start
        in: query
        description: Offset of first component template to retrieve (0-based).
        required: false
        schema:
          type: string
          default: "0"
      - name: limit
        in: query
        description: Maximum number of component templates to retrieve.
        required: false
        schema:
          type: string
          default: "10"
      - name: sortBy
        in: query
        description: Sort criteria for retrieved component templates
        required: false
        schema:
          type: string
          default: group
      - name: filter
        in: query
        description: "Filter criteria for retrieved component templates (A common\
          \ filter for this endpoint would be to filter based on the current application\
          \ like this: eq(application,datamining)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Identifies a specific job version.
              schema:
                type: string
            Last-Modified:
              description: Indicates the date and time the job was last modified.
              schema:
                type: string
    get:
      tags:
      - ComponentTemplateController
      summary: Retrieve all component templates
      description: Retrieve the collection of Component Template Summaries for all
        component templates. Use ?custom=true to retrieve only those that were not
        provided by SAS.
      operationId: getComponentTemplates
      parameters:
      - name: Accept-Item
        in: header
        description: Media type for the items to be included in the resource collection.
          This can be specified to get the full resource or just a summary.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.component.template.summary+json
          - application/vnd.sas.analytics.component.template+json
          default: application/vnd.sas.analytics.component.template.summary+json
      - name: custom
        in: query
        description: Include only custom (non SAS) component templates.
        required: false
        schema:
          type: boolean
          default: false
      - name: start
        in: query
        description: Offset of first component template to retrieve (0-based).
        required: false
        schema:
          type: string
          default: "0"
      - name: limit
        in: query
        description: Maximum number of component templates to retrieve.
        required: false
        schema:
          type: string
          default: "10"
      - name: sortBy
        in: query
        description: Sort criteria for retrieved component templates
        required: false
        schema:
          type: string
          default: group
      - name: filter
        in: query
        description: "Filter criteria for retrieved component templates (A common\
          \ filter for this endpoint would be to filter based on the current application\
          \ like this: eq(application,datamining)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
            "Last-Modified":
              description: The time at which the pipeline was last updated.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/componentTemplateSummaryCollection"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTemplatesGetTemplates200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/componentTemplateSummaryCollection"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTemplatesGetTemplates200Response"
    post:
      tags:
      - ComponentTemplateController
      summary: Import a component template from a zip file
      description: "Import a component template from a zip file containing one to\
        \ three entries. First, a required file named 'template.json' containing the\
        \ json representation for the component template. Second, an optional file\
        \ named 'code.txt' containing the code to be inserted into the component template.\
        \ Third, an optional file named 'validation.xml' containing the validation\
        \ logic to be applied to the component template. "
      operationId: createComponentTemplates
      requestBody:
        content:
          application/octet-stream:
            schema:
              $ref: "#/components/schemas/archive"
            examples:
              default:
                $ref: "#/components/examples/ComponentTemplatesImportFromZipRequest"
        description: inputStream
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: location of the newly created resource
              schema:
                type: string
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/vnd.sas.analytics.component.template+json:
              schema:
                $ref: "#/components/schemas/componentTemplate"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTemplatesImportFromZip201Response"
            application/json:
              schema:
                $ref: "#/components/schemas/componentTemplate"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTemplatesImportFromZip201Response"
        "400":
          description: Bad Input
          content:
            application/vnd.sas.analytics.component.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTemplatesImportFromZip400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTemplatesImportFromZip400Response"
