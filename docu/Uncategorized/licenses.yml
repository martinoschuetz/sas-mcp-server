---
openapi: 3.0.3
info:
  title: Licenses
  version: "2"
  description: >
    The License REST API provides a read only list of product license information
    obtained from the license file.
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: https://developer.sas.com
tags:
- name: Root
  description: The operations for the root resource.
- name: DataConnector
  description: Information about data connector licenses.
- name: Grant
  description: Information about all product licenses.
- name: Product
  description: Information about a product.
- name: Site
  description: Information about a cusomter site.
servers:
- url: https://example.com/licenses
  description: Server for the Licenses API.
paths:
  /:
    get:
      operationId: root
      description: API root links.
      summary: The API top-level root resource
      tags:
      - Root
      responses:
        "200":
          description: Version information about the API, as well as top level API
            entry points.
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/root"
        "404":
          description: Licenses API is not available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/404NotAvailable"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/404NotAvailable"
    head:
      operationId: headersForRoot
      description: |
        Retrieves header information for the service.

        It can also be used to verify that the service is available.
      summary: Get header information for the service
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded. The Deployment Data service is available.
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/root"
        "404":
          description: Licenses API is not available.
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/404NotAvailable"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/404NotAvailable"
  /dataConnectors:
    get:
      tags:
      - DataConnector
      operationId: getDataConnectors
      summary: Data providers that run in CAS
      description: Data provider modules run in CAS and communicate with an external
        data sources. This endpoint returns product summary information only.
      responses:
        "200":
          description: A summary collection of products.
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json; version=2:
              schema:
                oneOf:
                - $ref: "#/components/schemas/productSummaryCollection"
              examples:
                api:
                  $ref: "#/components/examples/dataConnector"
            application/vnd.sas.collection+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/productSummaryCollection"
              examples:
                api:
                  $ref: "#/components/examples/dataConnector"
            application/json:
              schema:
                $ref: "#/components/schemas/productSummaryCollection"
              examples:
                api:
                  $ref: "#/components/examples/dataConnector"
  /grants:
    get:
      tags:
      - Grant
      operationId: getGrants
      summary: A bundle of multiple product licenses as a single resource
      description: A grant contains the values that make up the expiration calculation.
      parameters:
      - name: productId
        in: query
        description: >
          The product id corresponds with the setinit product id.
          Multiple productIds are separated using the ','.
          For example productId=0,1,2.
          If productId of 2 does not exist, only 0 and 1 will be returned.
          If none if of the supplied values exist, an empty list of features is returned.
          If a non-integer value is supplied, a 400 Bad Request is returned.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded and matching products are returned.
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
          content:
            application/vnd.sas.license.grant+json; version=1:
              schema:
                $ref: "#/components/schemas/grant"
              examples:
                api:
                  $ref: "#/components/examples/grant"
            application/vnd.sas.license.grant+json:
              schema:
                $ref: "#/components/schemas/grant"
              examples:
                api:
                  $ref: "#/components/examples/grant"
            application/json:
              schema:
                $ref: "#/components/schemas/grant"
              examples:
                api:
                  $ref: "#/components/examples/grant"
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/404NotAvailable"
  /products/{productId}:
    get:
      tags:
      - Product
      operationId: getProduct
      summary: A single product license
      description: >
        By default, a summary product license is returned.
        If the Accept header is set to application/vnd.sas.license.product,
        then a full product license is returned.
      parameters:
      - in: path
        name: productId
        description: The product id corresponds with the setinit product id.
        schema:
          type: integer
        required: true
      - in: header
        name: Accept
        description: Summary and detail information of returned products.
        schema:
          type: string
          enum:
          - application/vnd.sas.license.product
          - application/vnd.sas.license.product.summary
          default: application/vnd.sas.license.product.summary
      responses:
        "200":
          description: The request succeeded and the matching product is returned.
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
          content:
            application/vnd.sas.license.product+json; version=1:
              schema:
                $ref: "#/components/schemas/product"
              examples:
                api:
                  $ref: "#/components/examples/fullProduct"
            application/vnd.sas.license.product+json:
              schema:
                $ref: "#/components/schemas/product"
              examples:
                api:
                  $ref: "#/components/examples/fullProduct"
            application/vnd.sas.license.product.summary+json; version=1:
              schema:
                $ref: "#/components/schemas/productSummary"
              examples:
                api:
                  $ref: "#/components/examples/summaryProduct"
            application/vnd.sas.license.product.summary+json:
              schema:
                $ref: "#/components/schemas/productSummary"
              examples:
                api:
                  $ref: "#/components/examples/summaryProduct"
            application/json:
              schema:
                $ref: "#/components/schemas/productSummary"
              examples:
                api:
                  $ref: "#/components/examples/summaryProduct"
  /products:
    get:
      tags:
      - Product
      operationId: getProducts
      summary: A collection of product licenses
      description: >
        By default, this endpoint returns a summary of the product license information.
        If the Accept-Item header is set to application/vnd.sas.license.product,
        then a full product license is returned.
      parameters:
      - in: header
        name: Accept-Item
        description: Summary and detail information of returned products.
        schema:
          type: string
          enum:
          - application/vnd.sas.license.product+json
          - application/vnd.sas.license.product.summary+json
          default: application/vnd.sas.license.product.summary+json
      - in: query
        name: productId
        description: >
          The product id corresponds with the setinit product id.
          Multiple productIds are separated using the ','.
          For example productId=0,1,2.
          If productId of 2 does not exist, only 0 and 1 will be returned.
          If none if of the supplied values exist, an empty collection is returned.
          If a non-integer value is supplied, a 400 Bad Request is returned.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: |
          Sort returned items.
          The sort criteria supports the first-level fields in each item.

          Some sample sorts:

            | Description | Sample Query Parameters |
            | ----------- | ------- |
            | Sort by ascending name | sortBy=name:ascending |
            | Sort by descending name | sortBy=name:descending |

          The default sort is by id in ascending order.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: A collection of product licenses.
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json; version=2:
              schema:
                oneOf:
                - $ref: "#/components/schemas/productSummaryCollection"
              examples:
                api:
                  $ref: "#/components/examples/products"
            application/vnd.sas.collection+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/productSummaryCollection"
              examples:
                api:
                  $ref: "#/components/examples/products"
            application/json:
              schema:
                $ref: "#/components/schemas/productSummaryCollection"
              examples:
                api:
                  $ref: "#/components/examples/products"
  /site:
    get:
      tags:
      - Site
      operationId: getSite
      summary: Returns site wide information
      description: Returns site wide license information such as the site name and
        release version.
      responses:
        "200":
          description: Returns site wide information.
          headers:
            Etag:
              description: A unique identifier for the resource.
              schema:
                type: string
          content:
            application/vnd.sas.license.site+json; version=1:
              schema:
                $ref: "#/components/schemas/site"
              examples:
                api:
                  $ref: "#/components/examples/site"
            application/vnd.sas.license.site+json:
              schema:
                $ref: "#/components/schemas/site"
              examples:
                api:
                  $ref: "#/components/examples/site"
            application/json:
              schema:
                $ref: "#/components/schemas/site"
              examples:
                api:
                  $ref: "#/components/examples/site"
components:
  schemas:
    grant:
      title: grant
      type: object
      x-tags:
      - grant
      - licenses
      description: A single resource containing all product license information.
      properties:
        features:
          description: A list of products and their contraints.
          type: array
          items:
            $ref: "#/components/schemas/feature"
        links:
          type: array
          description: Links that apply to this grant.
          items:
            $ref: "#/components/schemas/link"
        release:
          description: The release version.
          type: string
        siteName:
          description: A name for the site or company to which this license is granted.
          type: string
        siteNum:
          description: A unique identifier for the site to which this license is granted.
          type: string
        version:
          description: Version of the schema. This is version 1.
          type: integer
      required:
      - features
      - links
      - release
      - siteName
      - siteNum
      - version
      example:
        features:
        - constraints:
            expiration:
              gracePeriod: P62D
              warningPeriod: P31D
              timeStamp: "2016-10-06T00:00+0000"
            maxCpuCores: 0
          ids:
            00000000-0000-1000-8000-7a34ac19a362: Base SAS
        - constraints:
            expiration:
              gracePeriod: P62D
              warningPeriod: P31D
              timeStamp: "2016-10-06T00:00+0000"
            maxCpuCores: 0
          ids:
            00000001-0000-1000-8000-7a34ac19a362: SAS/STAT
        links:
        - href: /licenses/grants?productId=0,1
          method: GET
          rel: self
          type: application/vnd.sas.license.grant
          uri: /licenses/grants?productId=0,1
        - href: /licenses/grants
          method: GET
          rel: up
          responseType: application/vnd.sas.api
          uri: licenses/grants
        release: "9.5"
        siteName: SAS Institute Inc.
        siteNum: "0"
        version: 1
    product:
      title: product
      type: object
      x-tags:
      - product
      - licenses
      description: Product detail information.
      properties:
        cpuCount:
          description: A limit on the number of CPU cores.
          type: integer
        expirationDate:
          description: >
            The date the license expires. The license will continue to be honored
            until both the grace and warning periods have elapsed.
          type: string
        expirationDays:
          description: The number of days from January 1, 1960 to the expiration date.
          type: string
        expired:
          description: >
            False if the license is valid. True if the server date is beyond the
            expiration date + grace period + warning period.
          type: boolean
        graceDate:
          description: >
            The grace period end date. In the date range between expiration date and
            graceDate, a warning should be shown. After this date, a more severe
            warning should be shown.
          type: string
        gracePeriod:
          description: >
            True if a set number of days had elapsed after the expiration date. A
            warning should be displayed.
          type: boolean
        id:
          description: The licensed product number.
          type: integer
        links:
          type: array
          description: Links that apply to this product.
          items:
            $ref: "#/components/schemas/link"
        name:
          description: The licensed product name.
          type: string
        warningDate:
          description: >
            The warning end date. In date range bewteen graceDate and warningDate,
            a
            more severe warning should be shown. After this date, the product should
            stop functioning.
          type: string
        warningPeriod:
          description: >
            True if a set number of days had elapsed after the expiration date and
            the
            grace period. A more severe warning should be displayed.
          type: boolean
      required:
      - cpuCount
      - expirationDate
      - expirationDays
      - expired
      - graceDate
      - gracePeriod
      - id
      - links
      - name
      - warningDate
      - warningPeriod
      example:
        cpuCount: 1
        expirationDate: "2002-01-02"
        expirationDays: "15342"
        expired: true
        graceDate: "2002-01-12"
        gracePeriod: true
        id: 1
        links:
        - href: /licenses/products/1
          method: GET
          rel: self
          type: application/vnd.sas.license.product
          uri: /licenses/products/1
        - href: /licenses/products/1
          method: GET
          rel: alternate
          itemType: application/vnd.sas.license.product.summary
          uri: /licenses/products/1
        - href: /licenses/products
          method: GET
          rel: up
          type: application/vnd.sas.collection
          uri: /licenses/products
        name: Base SAS
        warningDate: "2002-01-22"
        warningPeriod: true
    productSummary:
      title: productSummary
      type: object
      x-tags:
      - product
      - licenses
      - summary
      description: >
        A single resources containing product name and id, and an indicator indicating
        if the license is currently valid
      properties:
        expired:
          description: >
            False if the license is valid. True if the server date is beyond the
            expiration date + grace period + warning period
          type: boolean
        id:
          description: The licensed product number
          type: integer
        links:
          type: array
          description: Links that apply to this product summary.
          items:
            $ref: "#/components/schemas/link"
        name:
          description: The licensed product name
          type: string
      required:
      - expired
      - id
      - links
      - name
      example:
        expired: false
        id: 0
        links:
        - href: /licenses/products/0
          method: GET
          rel: self
          type: application/vnd.sas.license.product
          uri: /licenses/products/0
        - href: /licenses/products/0
          method: GET
          rel: alternate
          type: application/vnd.sas.license.product.summary
          uri: /licenses/products/0
        - href: /licenses/products
          method: GET
          rel: up
          uri: /licenses/products
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.license.product
        name: Base SAS
    productSummaryCollection:
      title: productSummaryCollection
      type: object
      x-tags:
      - licenses
      - product
      description: A standard SAS collection (of ProductSummaries).
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - properties:
          items:
            type: array
            description: Array of Product summaries.
            items:
              $ref: "#/components/schemas/productSummary"
      example:
        name: products
        start: 0
        limit: 0
        count: 1665
        accept: application/vnd.sas.license.product.summary
        links:
        - href: /licenses/products
          method: GET
          rel: self
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.license.product
          uri: /licenses/products
        - href: /licenses/products
          method: GET
          rel: alternate
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.license.product.summary
          uri: /licenses/products
        - href: /licenses
          method: GET
          rel: up
          type: application/vnd.sas.api
          uri: licenses
        items:
        - expired: false
          id: 0
          name: Base SAS
          links:
          - href: /licenses/products/0
            method: GET
            rel: self
            type: application/vnd.sas.license.product
            uri: /licenses/products/0
          - href: /licenses/products/0
            method: GET
            rel: alternate
            itemType: application/vnd.sas.license.product.summary
            uri: /licenses/products/0
          - href: /licenses/products
            method: GET
            rel: up
            type: application/vnd.sas.collection
            uri: /licenses/products
        - expired: false
          id: 1
          name: SAS/STAT
          links:
          - href: /licenses/products/1
            method: GET
            rel: self
            type: application/vnd.sas.license.product
            uri: /licenses/products/1
          - href: /licenses/products/1
            method: GET
            rel: alternate
            itemType: application/vnd.sas.license.product.summary
            uri: /licenses/products/1
          - href: /licenses/products
            method: GET
            rel: up
            type: application/vnd.sas.collection
            uri: /licenses/products
    site:
      title: site
      type: object
      x-tags:
      - site
      - licenses
      description: Returns site wide information.
      properties:
        gracePeriod:
          description: >
            A duration past the nominal expiration time stamp. During this period
            the
            feature shall continue operating without warning the user.
          type: string
        links:
          type: array
          description: Links that apply to this site.
          items:
            $ref: "#/components/schemas/link"
        osName:
          description: The OS where the server is running.
          type: string
        release:
          description: The software release.
          type: string
        serverDate:
          description: >
            The server expiration date. This is a global expiration
            for products that do not have their own expiration date.
          type: string
        serverDateNum:
          description: The server expiration date expressed as a number of days since
            January 1, 1960.
          type: string
        siteName:
          description: A name for the site or company to which this license is granted.
          type: string
        siteNum:
          description: A unique identifier for the site to which this license is granted.
          type: string
        warningPeriod:
          description: >
            A duration past the nominal expiration time stamp plus the grade period
            (if any). During this period the feature shall continue operating but
            will
            warn the user of imminent cessation.
          type: string
      required:
      - gracePeriod
      - links
      - osName
      - release
      - serverDate
      - serverDateNum
      - siteName
      - siteNum
      - warningPeriod
      example:
        gracePeriod: P62D
        links:
        - href: /licenses/site
          method: GET
          rel: self
          type: application/vnd.sas.license.site
          uri: /licenses/site
        - href: /licenses
          method: GET
          rel: up
          type: application/vnd.sas.api
          uri: /licenses
        osName: Centos 6.7
        release: V03
        serverDate: "2017-05-18"
        serverDateNum: "20950"
        siteName: SAS Institute Inc.
        siteNum: "12345678"
        warningPeriod: P31D
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    feature:
      description: This is the schema for a feature.
      title: feature
      type: object
      x-tags:
      - grant
      - licenses
      properties:
        constraints:
          $ref: "#/components/schemas/constraints"
        ids:
          description: >
            The caller passes a set of feature IDs to invoke a feature. If the
            intersection of that set and the keys of 'ids' is non-empty then this
            feature block will be tested.
          type: object
          additionalProperties:
            type: string
      required:
      - constraints
      - ids
    constraints:
      description: This is the schema for constraints
      title: constraints
      type: object
      x-tags:
      - grant
      - licenses
      properties:
        expiration:
          type: object
          properties:
            gracePeriod:
              description: >
                A duration past the nominal expiration time stamp. During this period
                the
                feature shall continue operating without warning the user.
              type: string
            timeStamp:
              description: >
                Time stamp at which the feature ceases to be nominally valid. If the
                'gracePeriod' and/or 'warningPeriod' properties are present, then
                those
