---
openapi: 3.0.3
info:
  version: "6"
  title: Comments
  description: "The Comments Service REST API enables clients to retrieve collection\
    \ of comments for single resourceUri as well as multiple resourceUris. The api\
    \ to get recent comments for a associated object is provided. \nVersion 4 provides\
    \ functionality to associate a comment with sub-element of an object."
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
tags:
- name: Root
  description: Root API of Comments Service.
- name: Comments
  description: API for CRUD operations of comments.
- name: ParentComments
  description: API to get the parent comments fitting the filter.
paths:
  /:
    head:
      summary: Check if comment service is available
      description: Returns whether comment service is running. It also returns headers
        that get "/" Api returns.
      operationId: headersForRoot
      tags:
      - Root
      responses:
        "200":
          description: (OK) The service is available and running
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
        "503":
          description: Service Temporarily Unavailable
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error10"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error10"
    get:
      summary: Get list of top-level links
      description: Returns top level links of comment service surfaced through this
        API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/commentsRoot"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/commentsRoot"
        "503":
          description: Service Temporarily Unavailable
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error10"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error10"
  /comments:
    post:
      summary: Create a new comment
      description: Create a new comment.
      operationId: createComment
      tags:
      - Comments
      requestBody:
        content:
          application/vnd.sas.comment+json:
            schema:
              $ref: "#/components/schemas/commentToCreate"
            examples:
              json:
                $ref: "#/components/examples/createCommentRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/commentToCreate"
            examples:
              json:
                $ref: "#/components/examples/createCommentRequest"
        description: Comment to create
      responses:
        "201":
          description: "(Created): The new comment created and returned in the response\
            \ body."
          headers:
            ETag:
              description: ETag for current resource
              schema:
                type: string
            Last-Modified:
              description: Last modified time stamp of the resource
              schema:
                type: string
            Location:
              description: URI of the created resource
              schema:
                type: string
            Sas-Application-Name:
              description: Application name
              schema:
                type: string
          content:
            application/vnd.sas.comment+json:
              schema:
                $ref: "#/components/schemas/comment"
              examples:
                json:
                  $ref: "#/components/examples/createComment"
            application/json:
              schema:
                $ref: "#/components/schemas/comment"
              examples:
                json:
                  $ref: "#/components/examples/createComment"
        "400":
          description: Bad request if Null value is assigned to resourceUri field.
            Valid values for priority are low , medium and high else bad request is
            thrown.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error3"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error3"
        "404":
          description: Creating a comment with invalid resourceUri
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error11"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error11"
        "503":
          description: Service Temporarily Unavailable
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error10"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error10"
    head:
      summary: Check if comments exist for given resourceUri
      description: Returns whether comments exist for given resourceUri.
      operationId: headersForGetComments
      tags:
      - Comments
      parameters:
      - name: resourceUri
        in: query
        required: false
        description: Path of resourceUri
        schema:
          type: string
      - name: elementId
        in: query
        required: false
        description: Path of sub element id.
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: The starting index of the first entry in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Maximum number of entries to return in this page of results.
          The actual number of returned entries may be less if the collection has
          been exhausted. Defaults to 10.
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        required: false
        description: Filter criteria for returned collection of comments.Filter will
          be applied on comments database and result will contain all the comments
          matching to filter expression and sorted by creation time stamp
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        required: false
        description: Sorted collection of comments. When value for sortBy field is
          not provided default sort order is ascending by creationTimeStamp.
        schema:
          type: string
          format: sort-criteria
      - name: If-Match
        required: false
        description: The entity tag obtained from the most recent ETag response header.
          It must match the current entity tag.
        in: header
        schema:
          type: string
      responses:
        "200":
          description: "(OK): The comments for given resourceUri exist"
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
        "503":
          description: Service Temporarily Unavailable
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error10"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error10"
    get:
      summary: Find comments by provided filter
      description: Find comments by provided filter and if provided resourceUri. Standard
        paging, filtering and sorting options are available.
      operationId: getComments
      tags:
      - Comments
      parameters:
      - name: resourceUri
        in: query
        required: false
        description: URI of associated/parent object
        schema:
          type: string
      - name: elementId
        in: query
        required: false
        description: Path of sub element id.
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: The starting index of the first entry in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Maximum number of entries to return in this page of results.
          The actual number of returned entries may be less if the collection has
          been exhausted. Defaults to 10.
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        required: false
        description: Filter criteria for returned collection of comments.Filter will
          be applied on comments database and result will contain all the comments
          matching to filter expression and sorted by creation time stamp
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        required: false
        description: Sorted collection of comments. When value for sortBy field is
          not provided default sort order is ascending by creationTimeStamp.
        schema:
          type: string
          format: sort-criteria
      - name: If-Match
        required: false
        description: The entity tag obtained from the most recent ETag response header.
          It must match the current entity tag.
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/commentsCollection"
              examples:
                json:
                  $ref: "#/components/examples/commentsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/commentsCollection"
              examples:
                json:
                  $ref: "#/components/examples/commentsCollection"
        "400":
          description: (Bad Request) An Invalid filter or combination of request parameters
            was provided
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error4"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error4"
  /comments#multi:
    post:
      summary: Get comments for multiple resourceUri
      description: This POST operation is used to obtain the comments for multiple
        resources. Since some requests may be too large to fit in a request URL and
        query parameter, this POST allow passing the list of resources in the request
        body using the application/vnd.sas.selection+json media type. The response
        is the set of comments associated with all the resources in the request. It
        is recommended to provide limit value as 500 or less. If limit is not provided
        for this API, it will provide all matching records, as by default limit is
        set to maximum value.
      operationId: createCommentsForMultipleResourcesUri
      tags:
      - Comments
      parameters:
      - name: start
        in: query
        required: false
        description: The starting index of the first entry in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Maximum number of entries to return in this page of results.
          The actual number of returned entries may be less if the collection has
          been exhausted. Defaults to Maximum value i.e.; 2,147,483,647.
        schema:
          type: integer
      requestBody:
        content:
          application/vnd.sas.selection+json:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
              json:
                $ref: "#/components/examples/multiCommentRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
              json:
                $ref: "#/components/examples/multiCommentRequest"
        description: Multiple resourceUri's specified as array of string.
        required: true
      responses:
        "200":
          description: "(OK): The comments for the given resourceUri were found and\
            \ returned as a List of comments."
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/commentsCollection"
              examples:
                json:
                  $ref: "#/components/examples/multiComments"
            application/json:
              schema:
                $ref: "#/components/schemas/commentsCollection"
              examples:
                json:
                  $ref: "#/components/examples/multiComments"
        "400":
          description: "(Bad Request):  Request body is malformed."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error4"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error4"
  /parentComments:
    get:
      summary: This REST end point gives only parent/topic comments which fits in
        filter criteria
      description: This REST end point gives only parent/topic comments which fits
        in filter criteria. Standard paging, filtering and sorting options are available.
      operationId: getParentComments
      tags:
      - ParentComments
      parameters:
      - name: resourceUri
        in: query
        required: true
        description: Path of resourceUri
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: The starting index of the first entry in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Maximum number of entries to return in this page of results.
          The actual number of returned entries may be less if the collection has
          been exhausted. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        required: true
        description: Filter criteria for returned collection of comments.Filter will
          be applied on comments database and result will contain parent comments
          matching to filter expression and sorted by creation time stamp
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        required: false
        description: Sorted collection of comments. When value for sortBy field is
          not provided default sort order is ascending by creationTimeStamp.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/commentsCollection"
              examples:
                json:
                  $ref: "#/components/examples/parentComments"
            application/json:
              schema:
                $ref: "#/components/schemas/commentsCollection"
              examples:
                json:
                  $ref: "#/components/examples/parentComments"
        "400":
          description: (Bad Request):An Invalid filter or combination of request parameters
            was provided
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error9"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error9"
  /recentComments:
    get:
      summary: Find recent comments by resourceUri
      description: Find recent comments by their resourceUri.
      operationId: getRecentComments
      tags:
      - Comments
      parameters:
      - name: resourceUri
        in: query
        required: true
        description: Path of resourceUri
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Maximum number of entries to return in this page of results.
          The actual number of returned entries may be less if the collection has
          been exhausted. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        required: false
        description: Filter criteria for returned collection of comments.Filter will
          be applied on comments database and result will contain all the comments
          matching to filter expression and sorted by creation time stamp
        schema:
          type: string
          format: filter-criteria
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/commentsCollection"
              examples:
                json:
                  $ref: "#/components/examples/recentComments"
            application/json:
              schema:
                $ref: "#/components/schemas/commentsCollection"
              examples:
                json:
                  $ref: "#/components/examples/recentComments"
        "400":
          description: (Bad Request):An Invalid filter or combination of request parameters
            was provided
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error5"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error5"
  /comments/{commentId}:
    head:
      summary: Check if comment with given id exist
      description: Returns whether or not comment with given id exist.
      operationId: headersForGetComment
      tags:
      - Comments
      parameters:
      - name: commentId
        in: path
        description: Id of the comment
        required: true
        schema:
          type: string
      - name: If-Match
        required: false
        description: The entity tag obtained from the most recent ETag response header.
          It must match the current entity tag.
        in: header
        schema:
          type: string
      responses:
        "200":
          description: (OK). The comment exist.
          headers:
            ETag:
              description: ETag for the resource
              schema:
                type: string
            Last-Modified:
              description: Last modified time stamp of the resource
              schema:
                type: string
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
        "404":
          description: "(Not Found): No comment found for given identifier."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
    get:
      summary: Get a comment by id
      description: Get a comment by its id.
      operationId: getComment
      tags:
      - Comments
      parameters:
      - name: commentId
        in: path
        description: Id of the comment to get
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "(OK): The comment is found and returned in the response body"
          headers:
            ETag:
              description: ETag for the resource
              schema:
                type: string
            Last-Modified:
              description: Last modified time stamp of the resource
              schema:
                type: string
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.comment+json:
              schema:
                $ref: "#/components/schemas/comment"
              examples:
                json:
                  $ref: "#/components/examples/getComment"
            application/json:
              schema:
                $ref: "#/components/schemas/comment"
              examples:
                json:
                  $ref: "#/components/examples/getComment"
        "404":
          description: "(Not Found): No comment found for given identifier"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error6"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error6"
    put:
      summary: Update or replace a comment
      description: Update or replace a comment.
      operationId: updateComment
      tags:
      - Comments
      parameters:
      - name: If-Match
        in: header
        description: Client needs to specify priously pulled <b>ETag</b> as <b>If-Match</b>
          header.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: Client needs to specify priously pulled <b>Last-Modified</b>
          timestamp as <b>If-Unmodified-Since</b> header.
        schema:
          type: string
      - name: commentId
        in: path
        description: Id of the comment to update
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.comment+json:
            schema:
              $ref: "#/components/schemas/commentToUpdate"
            examples:
              json:
                $ref: "#/components/examples/updateCommentRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/commentToUpdate"
            examples:
              json:
                $ref: "#/components/examples/updateCommentRequest"
        description: Updated comment
        required: true
      responses:
        "200":
          description: "(OK): Comment is updated and returned the response"
          headers:
            ETag:
              description: ETag for current resource
              schema:
                type: string
            Last-Modified:
              description: Last modified time stamp of the resource
              schema:
                type: string
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.comment+json:
              schema:
                $ref: "#/components/schemas/comment"
              examples:
                json:
                  $ref: "#/components/examples/updateComment"
            application/json:
              schema:
                $ref: "#/components/schemas/comment"
              examples:
                json:
                  $ref: "#/components/examples/updateComment"
        "400":
          description: "(Bad Request): There was a validation error for the request"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error7"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error7"
        "404":
          description: "(Not Found): No comment found for given identifier."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error6"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error6"
        "412":
          description: "(Precondition Failed): Another operation modified the resource.\
            \ Get updated representation of resource, before retrying."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/updateCommentErr"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/updateCommentErr"
        "428":
          description: "(Precondition Required): Request must have 'if-unmodified-since'\
            \ or 'if-match' header. Set appropriate values for 'if-unmodified-since'\
            \ or 'if-match' headers, before retrying."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error8"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error8"
    delete:
      summary: Delete a comment
      description: Delete a comment by id.
      operationId: deleteComment
      tags:
      - Comments
      parameters:
      - name: commentId
        in: path
        description: Id of the comment to delete
        required: true
        schema:
          type: string
      - name: recursive
        in: query
        description: do a recursive delete of the comment
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "204":
          description: "(No Content): Comment is deleted"
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
        "404":
          description: "(Not Found): No comment found for given identifier."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error6"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error6"
