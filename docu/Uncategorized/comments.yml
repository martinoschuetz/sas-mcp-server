                type: string
            Last-Modified:
              description: Last modified time stamp of the resource
              schema:
                type: string
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/commentResourceSummary"
              examples:
                json:
                  $ref: "#/components/examples/commentSummaryByID"
            application/json:
              schema:
                $ref: "#/components/schemas/commentResourceSummary"
              examples:
                json:
                  $ref: "#/components/examples/commentSummaryByID"
        "404":
          description: "(Not Found): No comment found for given identifier"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error6"
