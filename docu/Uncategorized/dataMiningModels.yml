---
openapi: 3.0.3
info:
  description: "The Data Mining Models API provides a mechanism to manage and track\
    \ the list of candidate models. Candidate models are compared to determine a project\
    \ champion. Candidate models are generated when: <ul><li>A pipeline compare node\
    \ is run and a pipeline champion is automatically calculated.</li><li>A user manually\
    \ adds a model from the pipeline compare panel.</li><li>A user imports a model\
    \ from the pipeline compare panel action menu.</li></ul>Candidate models can be\
    \ compared and tested. They can be manually designated as project champion to\
    \ override the calculated champion. Other actions that can be performed on models\
    \ through the basic CRUD operations are: create, read, update, and delete."
  version: "2"
  title: Data Mining Models
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: https://support.sas.com/techsup/license/index.html
tags:
- name: Models
  description: The operations on data mining models.
- name: Root
  description: The root resource contains links to other resources.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the API object
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getTypesRootResponse"
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getTypesRootResponse"
  /models:
    head:
      tags:
      - Models
      summary: Get headers for models
      description: The endpoint to get headers for model collections by an ID.
      operationId: headersForModels
      parameters:
      - name: start
        in: query
        description: The index of the first model to return.
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The maximum number of models to return.
        required: false
        schema:
          type: integer
          format: int64
          default: 10
      - name: sortBy
        description: Sort criteria for the returned list of models. The sort criteria
          supports all the fields in either ascending or descending order.  See [REST
          API Standards](https://developer.sas.com/rest-apis/dataMiningModels-v2/docs/getting-started/usage-notes#sorting)
          for more information on the format of the sort keys.
        in: query
        schema:
          type: string
          format: sort-criteria
      - name: filter
        description: "Filter criteria for the returned list of models. See the [REST\
          \ API Standards](https://developer.sas.com/rest-apis/dataMiningModels-v2/docs/getting-started/usage-notes#filtering)\
          \ for more information on the format of the filter. The supported functions\
          \ are: and, or, not, eq, ne, lt, le, gt, ge, contains, startsWith, endsWith.\
          \ Filtering can be performed on all the fields."
        in: query
        schema:
          type: string
          format: filter-criteria
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
            ETag:
              schema:
                type: string
        '400':
          description: One or more parameters were invalid.
          headers:
            Content-Type:
              schema:
                type: string
            ETag:
              description: E-Tag for response.
              schema:
                type: string
    get:
      tags:
      - Models
      summary: Get all data mining models
      description: Retrieve a collection of all data mining model resources.
      operationId: getModels
      parameters:
      - name: start
        in: query
        description: The index of the first model to return.
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The maximum number of models to return.
        required: false
        schema:
          type: integer
          format: int64
          default: 10
      - name: sortBy
        description: Sort criteria for the returned list of models. The sort criteria
          supports all the fields in either ascending or descending order.  See [REST
          API Standards](https://developer.sas.com/rest-apis/dataMiningModels-v2/docs/getting-started/usage-notes#sorting)
          for more information on the format of the sort keys.
        in: query
        schema:
          type: string
          format: sort-criteria
      - name: filter
        description: "Filter criteria for the returned list of models. See the [REST\
          \ API Standards](https://developer.sas.com/rest-apis/dataMiningModels-v2/docs/getting-started/usage-notes#filtering)\
          \ for more information on the format of the filter. The supported functions\
          \ are: and, or, not, eq, ne, lt, le, gt, ge, contains, startsWith, endsWith.\
          \ Filtering can be performed on all the fields."
        in: query
        schema:
          type: string
          format: filter-criteria
      responses:
        "200":
          description: Ok
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/modelCollection"
              examples:
                json:
                  $ref: "#/components/examples/getModels"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/modelCollection"
              examples:
                json:
                  $ref: "#/components/examples/getModels"
        "400":
          description: Representations could not be created for the model entities.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                invalidFilter:
                  $ref: "#/components/examples/invalidFilterError"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                invalidFilter:
                  $ref: "#/components/examples/invalidFilterError"
    post:
      tags:
      - Models
      summary: Create a data mining model
      description: Create a data mining model with the content passed in the body
        of the request.
      operationId: createModel
      requestBody:
        $ref: "#/components/requestBodies/model"
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: The URL of the created model
              schema:
                type: string
                format: uri
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                json:
                  $ref: "#/components/examples/postModel"
            application/vnd.sas.analytics.data.mining.model+json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                json:
                  $ref: "#/components/examples/postModel"
        "400":
          description: Request body has invalid fields or is incomplete or if no assessment
            statistics are available for the model's component.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
            application/vnd.sas.analytics.data.mining.model+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
    delete:
      tags:
      - Models
      summary: Unpin models
      description: The endpoint to unpin models. If a model is a calculated pipeline
        champion, unpinning will update the model to set its userCreated and projectOverridingChampion
        fields to false. If a model is not a calculated pipeline champion, unpinning
        will delete it.
      operationId: deleteUnpinModels
      parameters:
      - name: action
        in: query
        description: Action to be performed for the endpoint. The value must be "unpin."
        required: true
        schema:
          type: string
      - name: modelIds
        in: query
        description: Comma-separated list of model IDs. These are the IDs of the models
          that will be unpinned.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No content
        "400":
          description: Request parameters are missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: '#/components/examples/unpinMissingParamError'
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: '#/components/examples/unpinMissingParamError'
  "/models/{modelId}":
    head:
      tags:
      - Models
      summary: Get headers for an model
      description: The endpoint to get headers for a specific model specified by an
        ID.
      operationId: headersForModel
      parameters:
      - name: modelId
        in: path
        description: modelId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
            ETag:
              schema:
                type: string
        '404':
          description: No project with the provided ID was found.
          headers:
            Content-Type:
              schema:
                type: string
            ETag:
              description: E-Tag for response.
              schema:
                type: string
    get:
      tags:
      - Models
      summary: Get a single data mining model
      description: Get a data mining model resource that corresponds to the specified
        model id.
      operationId: getModel
      parameters:
      - name: modelId
        in: path
        description: Model identifier
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                json:
                  $ref: "#/components/examples/getModel"
            application/vnd.sas.analytics.data.mining.model+json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                json:
                  $ref: "#/components/examples/getModel"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                json:
                  $ref: "#/components/examples/getModel"
        "404":
          description: Specified model was not found
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/notFoundError"
            application/vnd.sas.analytics.data.mining.model+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/notFoundError"
    put:
      tags:
      - Models
      summary: Update a data mining model
      description: Update an existing data mining model with the content passed in
        the body of the request.
      operationId: updateModel
      parameters:
      - in: header
        name: If-Match
        required: true
        description: Update the model only if the model's current ETag header matches.
          this value
        schema:
          type: string
      - name: modelId
        in: path
        description: Model identifier
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/model"
      responses:
        "200":
          description: OK
          headers:
            Location:
              description: The URL of the model
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                json:
                  $ref: "#/components/examples/getModel"
            application/vnd.sas.analytics.data.mining.model+json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                json:
                  $ref: "#/components/examples/getModel"
        "400":
          description: Request body has invalid fields or is incomplete
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
            application/vnd.sas.analytics.data.mining.model+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
        "404":
          description: Specified model was not found
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/notFoundError"
            application/vnd.sas.analytics.data.mining.model+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/notFoundError"
        "412":
          description: Precondition Failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/preconditionFailedError"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/preconditionFailedError"
        "428":
          description: Precondition required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/preconditionRequiredError"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/preconditionRequiredError"
    delete:
      tags:
      - Models
      summary: Delete a data mining model
      description: Delete an existing data mining model resource that corresponds
        to the specified model id.
      operationId: deleteModel
      parameters:
      - name: modelId
        in: path
        description: id of the model
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No content
        "404":
          description: Specified model was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                generic:
                  $ref: '#/components/examples/notFoundError'
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                generic:
                  $ref: '#/components/examples/notFoundError'
  "/models/{modelId}/champion":
    put:
      tags:
      - Models
      summary: Override the natural champion and get a comparison table of models
        from a filter query for a set of Models. The table marks champion status and
        includes assessment statistics
      description: The response has the type application/vnd.sas.analytics.data.mining.model.comparison+json.
      operationId: overrideChampion
      parameters:
      - in: header
        name: If-Match
        description: Override the model champion only if the model's current ETag
          header matches this value
        schema:
          type: string
      - name: modelId
        in: path
        description: Model identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelComparisonRequest'
            examples:
              generic:
                $ref: '#/components/examples/putChampion'
          application/vnd.sas.analytics.data.mining.model.comparison.request+json:
            schema:
              $ref: '#/components/schemas/modelComparisonRequest'
            examples:
              generic:
                $ref: '#/components/examples/putChampion'
        description: query
        required: true
      responses:
        "200":
          description: Ok
          headers:
            Location:
              description: The URL of the model comparison result
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/modelComparison"
              examples:
                generic:
                  $ref: '#/components/examples/getModelComparison'
            application/vnd.sas.analytics.data.mining.model.comparison+json:
              schema:
                $ref: "#/components/schemas/modelComparison"
              examples:
                generic:
                  $ref: '#/components/examples/getModelComparison'
        "400":
          description: Request body has invalid fields or is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                invalidFilter:
                  $ref: "#/components/examples/invalidFilterError"
            application/vnd.sas.analytics.data.mining.model.comparison+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                invalidFilter:
                  $ref: "#/components/examples/invalidFilterError"
        "412":
          description: Precondition Failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: '#/components/examples/preconditionFailedError'
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: '#/components/examples/preconditionFailedError'
servers:
- url: http://example.com/dataMiningModels
  description: kubernetes mock server
components:
  requestBodies:
    model:
      content:
        application/vnd.sas.analytics.data.mining.model+json:
          schema:
            $ref: "#/components/schemas/model"
          examples:
            json:
              $ref: "#/components/examples/ModelRequestBody"
        application/json:
          schema:
            $ref: "#/components/schemas/model"
          examples:
            json:
              $ref: "#/components/examples/ModelRequestBody"
      description: model
      required: true
  schemas:
    modelComparisonRequest:
      title: Model comparison request
      type: object
      description: The model comparison request contains the list of models to be
        compared and the criteria to be used to determine the champion.
      properties:
        links:
          description: Must contain context and collection links. The collection link
            is either for a collection of Analytics components or Models. The Analytics
            components collection must be a POST.
          type: array
          items:
            $ref: "#/components/schemas/link"
        parameters:
          $ref: "#/components/schemas/analyticsQueryParameters"
    modelComparison:
      title: Model comparison
      type: object
      description: The result of comparing models that includes the list of models
        compared, the statistics generated for the models and the calculated champion
        among them.
      properties:
        version:
          type: integer
          format: int32
          description: version of the resource
        columnMetadata:
          type: object
          description: Metadata about the individual statistics that are returned.
        comparisonProperties:
          type: object
          description: The properties used to compare models and calculate a champion.
        models:
          $ref: "#/components/schemas/modelCollection"
    modelCollection:
      title: Model collection
      type: object
      description: A collection of models.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The array of model representations.
            items:
              $ref: "#/components/schemas/model"
    analyticsQueryParameters:
      title: Analytics query parameters
      type: object
      description: This Analytics query parameters resource has fields to set 'start',
        'limit', 'filter' and 'sortBy' query parameters.
      properties:
        start:
          description: starting point of the result set. default value = 0
          type: integer
        limit:
          description: maximum number of items in the result set. default value =
            30
          type: integer
        filter:
          description: filter query string. eg. and(eq(state, 'running'), in(id, 'id1',
            'id2'))
          type: string
        sortBy:
          description: sort by string. eg. 'id:ascending'
          type: string
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    model:
      title: Model
      description: The data mining model includes information about the algorithm
        used to generate the model, the generated assessment statistics and the characteristics
        of the model.
      x-sas-media-type:
        name: vnd.sas.analytics.data.mining.model
        version: 1
      properties:
        id:
          type: string
          description: The unique model identifier
        name:
          type: string
          description: The model name
        description:
          type: string
          description: The model description
        createdBy:
          type: string
          description: The user who created this model
        modifiedBy:
          type: string
          description: The user who modified this model
        creationTimeStamp:
          type: string
          description: The formatted time stamp when the model was created, in yyyy-mm-ddThh:mm:ssZ
            format
        modifiedTimeStamp:
          type: string
          description: The formatted time stamp when the model was modified, in yyyy-mm-ddThh:mm:ssZ
            format
        version:
          type: integer
          format: int32
          description: Version of the resource
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
        algorithmName:
          type: string
          description: The localized model algorithm name, for example regression
            or model tree
        arguments:
          type: object
          description: Holds compare arguments for the model
        assessmentMap:
          type: object
          description: Holds assessment criteria for the model mapped by partition
            with partition name as the key. Each value holds a Map of String key value
            pairs representing the statistic name and its value.
        calculatedPipelineChampion:
          type: boolean
          description: True if a user has explicitly created this model or declared
            it an adhoc champion. False if the model was created through the model
            compare component for a calculated pipeline champion.
        champion:
          type: boolean
          description: True if this model is the champion of models returned as part
            of a collection.
        contentUri:
          type: string
          description: Used to locate the content generated by the server tier
        published:
          type: boolean
          description: True if the model has been published using the model manager
            publishing service, if ignored default to false
        registered:
          type: boolean
          description: True if the model is registered with model manager, if ignored
            default to false
        userCreatedModel:
          type: boolean
          description: True if a user has explicitly created this model or declared
            it an adhoc champion. False if the model was created through the model
            compare component for a calculated pipeline champion.
        projectOverridingChampion:
          type: boolean
          description: True if the user has designated that this model overrides all
            other champions for a project.
        registrationId:
