---
openapi: 3.0.3
info:
  version: "3"
  title: QKB Management
  description: |
    The QKB Management API is used to retrieve information about and perform
    administrative operations on Quality Knowledge Bases (QKBs) stored in the
    cloud.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/qkbManagement
  description: The SAS QKB Management server.
tags:
- name: Root
  description: Contains operations for the root resource.
- name: QKB
  description: Contains operations for QKB resource.
- name: Environments
  description: Contains operations for execution environments.
- name: Contexts
  description: Contains operations for execution contexts.
- name: Jobs
  description: Contains operations for import jobs.
paths:
  /:
    get:
      summary: List top-level operations
      description: Returns a list of available top-level operations provided by this
        API.
      tags:
      - Root
      operationId: root
      parameters:
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.api+json
          - application/json
          default: application/vnd.sas.api+json
      responses:
        "200":
          description: The request succeeded. A list of available operations is displayed.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                API:
                  $ref: "#/components/examples/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                API:
                  $ref: "#/components/examples/api"
    head:
      summary: Check service availability
      description: Returns whether the QKB Management service is running.
      tags:
      - Root
      operationId: headersForRoot
      parameters:
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.api+json
          - application/json
          default: application/vnd.sas.api+json
      responses:
        "200":
          description: The request succeeded. The service is available and running.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
  /qkbs:
    get:
      summary: Retrieve a list of all available QKBs on all available contexts
      description: Returns a list of all QKBs available to the user on all available
        execution target servers.
      tags:
      - QKB
      operationId: getAllQkbs
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: Requested representation of QKB items in the collection. The
          media type application/vnd.sas.qkb.management.qkb.summary+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.qkb.summary+json
          - application/vnd.sas.qkb.management.qkb+json
      - name: start
        in: query
        description: The 0-based index of the first QKB to return. This defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of QKBs to return in this page of results.
          The actual number of returned QKBs might be less if the collection has been
          exhausted. This defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: The filter criteria for returned QKBs. <br> The supported functions
          are and, or, not, eq, lt, le, gt, ge, contains, startsWith, endsWith, and
          isNull. Some sample queries <ul> <li>Search by name starting with /qkbManagement/qkbs?filter=startsWith(name,
          'qkb')</li> <li>Search by name /qkbManagement/qkbs?filter=eq(name, 'demoqkb1')</li>
          <li>Search for multiple QKBs /qkbManagement/qkbs?filter=in(name, 'demoqkb1',
          'demoqkb2', 'demoqkb3')</li> </ul>
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The sort-returned QKBs. <br> The default sort order is ascending
          on name field. Some sample sorts <ul> <li>Sort ascending by name /qkbManagement/qkbs?sortBy=name:ascending</li>
          <li>Sort descending by name /qkbManagement/qkbs?sortBy=name:descending</li>
          </ul>
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. A list of available QKBs is returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/allQkbsCollection"
              examples:
                allQkbsCollection:
                  $ref: "#/components/examples/allQkbsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/allQkbsCollection"
              examples:
                allQkbsCollection:
                  $ref: "#/components/examples/allQkbsCollection"
  /environments:
    get:
      summary: Retrieve a list of all available execution environments
      description: Returns a list of all execution environments available to the user.
      tags:
      - Environments
      operationId: getEnvironments
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: Requested representation of environment items in the collection.
          The media type application/vnd.sas.qkb.management.environment+json is the
          default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.environment+json
      - name: start
        in: query
        description: 0-based index of first context to return. Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of environments to return in this page of
          results. The actual number of returned environments might be less if the
          collection has been exhausted. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: The filter criteria for returned environments. <br> The supported
          functions are and, or, not, eq, lt, le, gt, ge, contains, startsWith, endsWith,
          and isNull. Some sample queries <ul> <li>Search by name starting with /qkbManagement/environments?filter=startsWith(name,
          'env')</li> <li>Search by name /qkbManagement/environments?filter=eq(name,
          'env1')</li> <li>Search for multiple environments /qkbManagement/environments?filter=in(name,
          'env1', 'env2', 'env3')</li> </ul>
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The sort-returned environments. <br> The default sort order is
          ascending on name field. Some sample sorts <ul> <li>Sort ascending by name
          /qkbManagement/environments?sortBy=name:ascending</li> <li>Sort descending
          by name /qkbManagement/environments?sortBy=name:descending</li> </ul>
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. Available environments are displayed.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/environmentCollection"
              examples:
                environmentCollection:
                  $ref: "#/components/examples/environmentCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/environmentCollection"
              examples:
                environmentCollection:
                  $ref: "#/components/examples/environmentCollection"
  "/environments/{environmentName}":
    get:
      summary: Retrieve environment details
      description: Returns information about a particular execution environment.
      tags:
      - Environments
      operationId: getEnvironmentByName
      parameters:
      - name: Accept
        in: header
        required: false
        description: The requested representation of the response. The media type
          application/vnd.sas.qkb.management.environment+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.environment+json
      - name: environmentName
        in: path
        description: Environment Name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. Environment information is displayed.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.qkb.management.environment+json:
              schema:
                $ref: "#/components/schemas/environment"
              examples:
                environment:
                  $ref: "#/components/examples/environment"
            application/json:
              schema:
                $ref: "#/components/schemas/environment"
              examples:
                environment:
                  $ref: "#/components/examples/environment"
        "404":
          description: The requested environment does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
    head:
      summary: Check if an environment exists
      description: This checks if an environment exists.
      tags:
      - Environments
      operationId: headersForEnvironmentByName
      parameters:
      - name: Accept
        in: header
        required: false
        description: The requested representation of the response. The media type
          application/vnd.sas.qkb.management.environment+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.environment+json
      - name: environmentName
        in: path
        description: Environment Name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The environment exists.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          description: The environment does not exist.
  "/environments/{environmentName}/contexts":
    get:
      summary: Retrieve a list of all available execution contexts
      description: Returns a list of all execution contexts available to the user.
      tags:
      - Contexts
      operationId: getEnvironmentContexts
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: Requested representation of context items in the collection.
          The media type application/vnd.sas.qkb.management.context+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.context+json
      - name: environmentName
        in: path
        description: Environment Name
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: 0-based index of first context to return. Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of contexts to return in this page of results.
          The actual number of returned contexts might be less if the collection has
          been exhausted. This defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: The filter criteria for returned contexts. <br> The supported
          functions are and, or, not, eq, lt, le, gt, ge, contains, startsWith, endsWith,
          and isNull. Some sample queries <ul> <li>Search by name starting with /qkbManagement/contexts?filter=startsWith(name,
          'env')</li> <li>Search by name /qkbManagement/contexts?filter=eq(name, 'context1')</li>
          <li>Search for multiple contexts /qkbManagement/contexts?filter=in(name,
          'context1', 'context2', 'context3')</li> </ul>
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The sort-returned contexts. <br> The default sort order is ascending
          on name field. Some sample sorts <ul> <li>Sort ascending by name /qkbManagement/contexts?sortBy=name:ascending</li>
          <li>Sort descending by name /qkbManagement/contexts?sortBy=name:descending</li>
          </ul>
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. Available contexts are displayed.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/contextCollection"
              examples:
                contextCollection:
                  $ref: "#/components/examples/contextCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/contextCollection"
              examples:
                contextCollection:
                  $ref: "#/components/examples/contextCollection"
        "404":
          description: The requested environment does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
  "/environments/{environmentName}/contexts/{contextName}":
    get:
      summary: Retrieve context details
      description: Returns information about a particular execution context.
      tags:
      - Contexts
      operationId: getEnvironmentContextByName
      parameters:
      - name: Accept
        in: header
        required: false
        description: The requested representation of the response. The media type
          application/vnd.sas.qkb.management.context+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.context+json
      - name: environmentName
        in: path
        description: Environment Name
        required: true
        schema:
          type: string
      - name: contextName
        in: path
        description: Context Name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. Context information is displayed.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.qkb.management.context+json:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
            application/json:
              schema:
                $ref: "#/components/schemas/context"
              examples:
                context:
                  $ref: "#/components/examples/context"
        "404":
          description: The requested environment or context does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
    head:
      summary: Check if a context exists
      description: This checks if a context exists.
      tags:
      - Contexts
      operationId: headersForEnvironmentContextByName
      parameters:
      - name: Accept
        in: header
        required: false
        description: The requested representation of the response. The media type
          application/vnd.sas.qkb.management.context+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.context+json
      - name: environmentName
        in: path
        description: Environment Name
        required: true
        schema:
          type: string
      - name: contextName
        in: path
        description: Context Name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The context exists.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          description: The requested environment or context does not exist.
  "/environments/{environmentName}/contexts/{contextName}/qkbs":
    get:
      summary: Retrieve a list of all available QKBs on a context
      description: Returns a list of all QKBs available on a particular execution
        context to the user
      tags:
      - QKB
      operationId: getContextQkbs
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: Requested representation of QKB items in the collection. The
          media type application/vnd.sas.qkb.management.qkb.summary+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.qkb+json
          - application/vnd.sas.qkb.management.qkb.summary+json
      - name: environmentName
        in: path
        description: Environment Name
        required: true
        schema:
          type: string
      - name: contextName
        in: path
        description: Context Name
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: The 0-based index of the first QKB to return. This defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of QKBs to return in this page of results.
          The actual number of returned QKBs might be less if the collection has been
          exhausted. This defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: The filter criteria for returned QKBs. <br> The supported functions
          are and, or, not, eq, lt, le, gt, ge, contains, startsWith, endsWith, and
          isNull. Some sample queries <ul> <li>Search by name starting with /qkbManagement/contexts/{contextName}/qkbs?filter=startsWith(name,
          'demoqkb')</li> <li>Search by name /qkbManagement/contexts/{contextName}/qkbs?filter=eq(name,
          'demoqkb1')</li> <li>Search for multiple QKBs /qkbManagement/contexts/{contextName}/qkbs?filter=in(name,
          'demoqkb1', 'demoqkb2', 'demoqkb3')</li> </ul>
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The sort-returned QKBs. <br> The default sort order is ascending
          on name field. Some sample sorts <ul> <li>Sort ascending by name /qkbManagement/contexts/{contextName}/qkbs?sortBy=name:ascending</li>
          <li>Sort descending by name /qkbManagement/contexts/{contextName}/qkbs?sortBy=name:descending</li>
          </ul>
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. The available QKBs are listed.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/qkbCollection"
              examples:
                qkbCollection:
                  $ref: "#/components/examples/qkbCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/qkbCollection"
              examples:
                qkbCollection:
                  $ref: "#/components/examples/qkbCollection"
        "404":
          description: The requested environment or context does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
  "/environments/{environmentName}/contexts/{contextName}/qkbs/{qkbName}":
    get:
      summary: Retrieve QKB information about a context
      description: Returns information about a particular QKB on a particular execution
        context.
      tags:
      - QKB
      operationId: getQkbByName
      parameters:
      - name: Accept
        in: header
        required: false
        description: The requested representation of the response. The media type
          application/vnd.sas.qkb.management.qkb+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.qkb+json
          - application/vnd.sas.qkb.management.qkb.summary+json
      - name: environmentName
        in: path
        description: Environment Name
        required: true
        schema:
          type: string
      - name: contextName
        in: path
        description: Context Name
        required: true
        schema:
          type: string
      - name: qkbName
        in: path
        description: QKB Name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. QKB information is displayed.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.qkb.management.qkb+json:
              schema:
                $ref: "#/components/schemas/qkb"
              examples:
                qkb:
                  $ref: "#/components/examples/qkb"
            application/vnd.sas.qkb.management.qkb.summary+json:
              schema:
                $ref: "#/components/schemas/qkb"
              examples:
                qkb:
                  $ref: "#/components/examples/qkb"
            application/json:
              schema:
                $ref: "#/components/schemas/qkb"
              examples:
                qkb:
                  $ref: "#/components/examples/qkb"
        "404":
          description: The requested QKB does not exist for the given environment
            and context.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
    head:
      summary: Check if a QKB exists on a context
      description: This checks if a QKB exists on a context.
      tags:
      - QKB
      operationId: headersForQkbByName
      parameters:
      - name: Accept
        in: header
        required: false
        description: The requested representation of the response. The media type
          application/vnd.sas.qkb.management.qkb+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.qkb+json
          - application/vnd.sas.qkb.management.qkb.summary+json
      - name: environmentName
        in: path
        description: The name of the environment.
        required: true
        schema:
          type: string
      - name: contextName
        in: path
        description: The name of the context.
        required: true
        schema:
          type: string
      - name: qkbName
        in: path
        description: The name of the QKB.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The QKB exists.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          description: The requested QKB does not exist for the given environment
            and context.
    delete:
      summary: Delete a QKB from a context
      description: Removes a QKB from the execution context. Requires proper authorization.
      tags:
      - QKB
      operationId: deleteQkbByName
      parameters:
      - name: environmentName
        in: path
        description: Environment Name
        required: true
        schema:
          type: string
      - name: contextName
        in: path
        description: Context Name
        required: true
        schema:
          type: string
      - name: qkbName
        in: path
        description: QKB name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The QKB was deleted.
        "403":
          description: The user does not have the necessary permissions to delete
            the QKB.
        "404":
          description: The QKB does not exist.
  /importJobs:
    post:
      tags:
      - Jobs
      summary: Submit request to Import a QKB
      description: Submits request to add a QKB to an execution context. Once the
        request is submitted, the import operation continues asynchronously.
      operationId: createImportJob
      parameters:
      - name: Accept
        in: header
        description: The requested representation of the response. The media type
          application/vnd.sas.qkb.management.job+json is the default.
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: The multi-part request file of QARC or QAR format.
                  type: string
                  format: binary
                job:
                  $ref: "#/components/schemas/jobInput"
              required:
              - file
              - job
        required: true
      responses:
        "202":
          description: The import job was successfully accepted, and the asynchoronous
            operation has started.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              description: The URL of the created resource.
              schema:
                type: string
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.qkb.management.job:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                job:
                  $ref: "#/components/examples/job"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                job:
                  $ref: "#/components/examples/job"
        "400":
          description: The request was invalid. An invalid combination of request
            parameters was provided.
        "404":
          description: The context was not found.
    get:
      summary: Retrieve collection of pending import job requests
      description: Returns the collection of pending import job requests.
      tags:
      - Jobs
      operationId: getImportJobs
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: The requested representation of job items in the collection.
          The media type application/vnd.sas.qkb.management.job+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.job+json
      - name: start
        in: query
        description: 0-based index of first job to return. Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of jobs to return in this page of results.
          The actual number of returned QKBs might be less if the collection has been
          exhausted. The default is 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: The filter criteria for returned jobs. <br> The supported functions
          are and, or, not, eq, lt, le, gt, ge, contains, startsWith, endsWith, and
          isNull. Some sample queries <ul> <li>Search by name starting with /qkbManagement/importJobs?filter=startsWith(id,
          'abc')</li> <li>Search by name /qkbManagement/importJobs?filter=eq(id, 'abc')</li>
          <li>Search for multiple QKBs /qkbManagement/importJobs?filter=in(id, 'abc1',
          'abc2', 'abc3')</li> </ul>
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The sort-returned jobs. <br> The default sort order is ascending
          on id field. Some sample sorts <ul> <li>Sort ascending by name /qkbManagement/importJobs?sortBy=id:ascending</li>
          <li>Sort descending by id /qkbManagement/importJobs?sortBy=id:descending</li>
          </ul>
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. Job status collection is displayed.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/jobCollection"
              examples:
                jobCollection:
                  $ref: "#/components/examples/jobCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/jobCollection"
              examples:
                jobCollection:
                  $ref: "#/components/examples/jobCollection"
  "/importJobs/{jobID}":
    get:
      summary: Retrieve the import job status
      description: This returns the status of import job.
      tags:
      - Jobs
      operationId: getJob
      parameters:
      - name: Accept
        in: header
        required: false
        description: The requested representation of the response. The media type
          application/vnd.sas.qkb.management.job+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.job+json
      - name: If-None-Match
        in: header
        required: false
        description: The ETag header.
        schema:
          type: string
      - name: jobID
        in: path
        description: The job ID.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The job information is displayed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.qkb.management.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                job:
                  $ref: "#/components/examples/job"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                job:
                  $ref: "#/components/examples/job"
        "304":
          description: This job was not modified.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          description: The job was not available.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
    head:
      summary: Check if a job exists
      description: This checks if a job exists.
      tags:
      - Jobs
      operationId: headersForJob
      parameters:
      - name: Accept
        in: header
        required: false
        description: The requested representation of the response. The media type
          application/vnd.sas.qkb.management.job+json is the default.
        schema:
          type: string
          enum:
          - application/vnd.sas.qkb.management.job+json
      - name: If-None-Match
        in: header
        required: false
        description: The ETag header.
        schema:
          type: string
      - name: jobID
        in: path
        description: The job ID.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The job exists.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "304":
          description: This job was not modified.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          description: The job does not exist.
    delete:
      summary: Delete the import job and staged QKB
      description: Removes an import job and clears the staged QKB. This action requires
        proper authorization.
      tags:
      - Jobs
      operationId: deleteJob
      parameters:
      - name: jobID
        in: path
        description: The job ID.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The import job was deleted.
        "404":
          description: The job does not exist.
  "/importJobs/{jobID}/content":
    get:
      deprecated: true
      summary: Retrieve QKB contents for a job
      description: This endpoint is deprecated. Returns a stream of the QKB contents.
        This is used by a CAS Action to download the QKB.
      tags:
      - Jobs
      operationId: getQkbContents
      parameters:
      - name: jobID
        in: path
        description: The job ID.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. A stream of the QKB contents is displayed.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/octet-stream:
              schema:
                type: object
                properties:
                  file:
                    description: The contents of a QKB in QARC or QAR format.
                    type: string
                    format: binary
        "404":
          description: The job is not available.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error2:
                  $ref: "#/components/examples/error2"
components:
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      required:
      - version
      - links
      properties:
        links:
          $ref: "#/components/schemas/links"
        version:
          format: int32
          type: integer
          description: The version of the media type that represents this API. The
            version described here is version 1.
    environment:
      title: Environment
      type: object
      description: Information about an execution environment.
      properties:
        version:
          type: integer
          description: The media type version. The supported values in the set {1}.
        name:
          type: string
          description: The unique environment name.
        links:
          type: array
          description: The links that apply to this context.
          items:
            $ref: "#/components/schemas/link"
    environmentCollection:
      title: Environment Collection
      type: object
      description: A pageable collection of environments.
      properties:
        name:
          type: string
          description: The name of the collection environments in the context of the
            request.
        accept:
          type: string
          description: A space-separated list of link types of the items in this collection.
        links:
          type: array
          description: The paging links that apply to this resource collection.
          items:
            $ref: "#/components/schemas/link"
        items:
          type: array
          description: The actual result of the query.
          items:
            $ref: "#/components/schemas/environment"
        version:
          type: integer
          description: The version of the collection schema.
    context:
      title: Context
      type: object
      description: The summary information about a context.
      properties:
        version:
          type: integer
          description: The media type version. The supported values in the set {1}.
        name:
          type: string
          description: The unique context name.
        type:
          type: string
          description: The type of context.
        description:
          type: string
          description: The description of the environment.
        host:
          type: string
          description: The host name of the context.
        state:
          type: string
          description: The state of the context. The state is the value from the casManagement
            API, along with 'unknown host' for hosts that cannot be resolved.
        isSuperUserAllowed:
          type: string
          description: The indicator to show if the Superuser role is assumable on
