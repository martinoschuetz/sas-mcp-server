              assetId:
                type: string
                format: uuid
              assetName:
                type: string
              assetType:
                type: string
              includesGenerativeAI:
                type: string
                enum: [yes, no]
                readOnly: true
                description: Whether the linked asset includes generative AI capabilities
              role:
                nullable: true
                allOf:
                - $ref: "#/components/schemas/ChampionChallengerRole"
              alertCount:
                type: integer
              approvalStatus:
                type: string
                nullable: true
              riskLevel:
                type: string
                enum: [high, moderate, low, not-applicable]
                nullable: true
              ownerName:
                type: string
                nullable: true
              lastModified:
                type: string
                format: date-time
                nullable: true
              containedAssets:
                type: array
