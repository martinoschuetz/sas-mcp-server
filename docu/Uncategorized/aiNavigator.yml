      type: object
      description: Authenticated user profile with effective permissions.
      required:
      - id
      - email
      - name
      - organizationId
      - roles
      - permissions
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user.
        email:
          type: string
          format: email
          description: User's email address.
        name:
          type: string
          description: User's full display name (FirstName + LastName).
        organizationId:
          type: string
          format: uuid
          description: Organization (tenant) the user belongs to.
        roles:
          type: array
          description: |
            Role names assigned to the user in this organization.
            This list may expand in future versions; clients should handle unknown role values gracefully.
          items:
            type: string
        permissions:
          type: object
          description: |
            Effective permissions keyed by frontend resource name. Each value is the list of
            granted actions for that resource. Admin wildcard permissions are expanded into
            concrete resource/action pairs.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            assets: ["read", "create"]
            policies: ["read"]
