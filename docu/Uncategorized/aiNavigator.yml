          description: |
            Generic: read, write, delete, admin, share.
            Domain-scoped: {resource}:{action} e.g. asset:read, model:create, usecase:edit, usecase:delete, role:read.
          pattern: "^(read|write|delete|admin|share|[a-z]+:[a-z]+)$"
      responses:
