    - $ref: "#/components/parameters/roleId"
    get:
      operationId: getRolePermissions
      tags:
      - Roles
      summary: Get role permissions
      description: Retrieve all permissions assigned to a role
      responses:
        "200":
          description: Successful response
          headers:
            ETag:
              description: Entity tag for cache validation
              schema:
                type: string
            Last-Modified:
              description: Last modification date
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                      description: >-
                        Generic: read, write, delete, admin, share.
                        Domain-scoped: {resource}:{action} e.g. asset:read, model:create,
                        usecase:edit.
                      pattern: "^(read|write|delete|admin|share|[a-z]+:[a-z]+)$"
              example:
                permissions: ["read", "write"]
            application/vnd.sas.collection:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                      description: >-
                        Generic: read, write, delete, admin, share.
                        Domain-scoped: {resource}:{action} e.g. asset:read, model:create,
                        usecase:edit.
                      pattern: "^(read|write|delete|admin|share|[a-z]+:[a-z]+)$"
              example:
                permissions: ["read", "write"]
        "404":
          $ref: "#/components/responses/response404RoleNotFound"
    post:
      operationId: addPermissionToRole
      tags:
      - Roles
      summary: Add permission to role
      description: Add a permission to a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - permission
              properties:
                permission:
                  type: string
                  description: >-
                    Generic: read, write, delete, admin, share.
                    Domain-scoped: {resource}:{action} e.g. asset:read, model:create,
                    usecase:edit.
                  pattern: "^(read|write|delete|admin|share|[a-z]+:[a-z]+)$"
            example:
              permission: "write"
          application/vnd.sas.ainavigator.permission+json:
            schema:
              type: object
              required:
              - permission
              properties:
                permission:
                  type: string
                  description: >-
                    Generic: read, write, delete, admin, share.
                    Domain-scoped: {resource}:{action} e.g. asset:read, model:create,
                    usecase:edit.
                  pattern: "^(read|write|delete|admin|share|[a-z]+:[a-z]+)$"
            example:
              permission: "write"
      responses:
        "204":
          description: Permission added
        "400":
          $ref: "#/components/responses/response400ValidationError"
        "404":
          $ref: "#/components/responses/response404RoleNotFound"
        "409":
          description: Permission already exists on role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /organizations/{orgId}/roles/{roleId}/permissions/{permission}:
