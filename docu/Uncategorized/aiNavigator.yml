            $ref: "#/components/schemas/errorResponse"
    response412PreconditionFailedEtagMismatch:
      description: Precondition failed - ETag mismatch
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response413RequestTooLarge:
      description: |
        Request body exceeds the maximum allowed size (10 MB). The handler
        wraps the body with `http.MaxBytesReader`; oversized payloads are
        rejected before being parsed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response422InvalidStateTransitionE:
      description: Invalid state transition (e.g., incomplete to approved)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
