          schema:
            $ref: "#/components/schemas/errorResponse"
  schemas:
    api:
      title: API
      description: The collection of links to top-level resources and operations that
        are available from the root of the API.
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          default: 1
        links:
          type: array
          description: The API's top-level links.
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      description: "A link to a related operation or resource."
      required:
      - rel
      properties:
        method:
          type: string
          description: "The HTTP method to invoke this endpoint."
        rel:
          type: string
          description: "The relationship of this URL to the object."
        uri:
          type: string
          description: "The relative URI of the REST endpoint."
        href:
          type: string
          description: "The full URL of the REST endpoint."
        title:
          type: string
          description: "The title for the link."
        type:
          type: string
          description: "The media type that is consumed or produced."
        itemType:
          type: string
          description: "If this link is to a container, the value is the media type\
            \ or the link type for the items in the container."
        responseType:
          type: string
          description: "The media type or link type of the response body for a `PUT`,\
            \ `POST`, or `PATCH` operation."
        responseItemType:
          type: string
          description: "The media type or link type of the items in the response body\
            \ for a `PUT`, `POST`, or `PATCH` operation."
    paginationResponse:
      type: object
      description: Pagination metadata for list responses (SAS API standard start/limit/count).
      properties:
        start:
          type: integer
          description: Zero-based offset of the first item returned.
        limit:
          type: integer
          description: Number of items per page.
        count:
          type: integer
          format: int64
          description: Total number of items across all pages.
    tabAccessResponse:
      type: object
      description: A single tab access configuration for a (tab, assetType, role)
        combination.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the tab access config row.
        organizationId:
          type: string
          format: uuid
          readOnly: true
          description: The organization this config belongs to.
        tabId:
          type: string
          description: Tab identifier (e.g. overview, properties).
          enum: [overview, properties, assetRelationships, assessments, appliedPolicies,
            dataGovernance, development, changeLog]
        assetType:
          type: string
          description: Asset type this config applies to (e.g. MODEL, USE_CASE, AGENT,
            AI_SYSTEM).
        role:
          type: string
          description: Role this config applies to.
          enum: [viewer, contributor]
        isVisible:
          type: boolean
          description: Whether the tab is visible to users with this role.
        isEditable:
          type: boolean
          description: Whether users with this role can edit content in the tab.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp.
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 last-update timestamp.
    tabAccessListResponse:
      type: object
      description: Paginated list of tab access configurations.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/tabAccessResponse"
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    tabAccessUpsertRequest:
      type: object
      description: Request body for upserting a tab access configuration.
      required:
      - tabId
      - assetType
      - role
      - isVisible
      - isEditable
      properties:
        tabId:
          type: string
          description: Tab to configure.
          enum: [overview, properties, assetRelationships, assessments, appliedPolicies,
            dataGovernance, development, changeLog]
        assetType:
          type: string
          description: Asset type to configure (e.g. MODEL, USE_CASE, AGENT, AI_SYSTEM).
        role:
          type: string
          description: Role to configure.
          enum: [viewer, contributor]
        isVisible:
          type: boolean
          description: Whether the tab should be visible to this role.
        isEditable:
          type: boolean
          description: Whether users with this role can edit content in the tab.
    tabAccessResolutionResponse:
      type: object
      description: Effective tab access for a single tab after applying defaults.
      properties:
        tabId:
          type: string
          description: Tab identifier.
        isVisible:
          type: boolean
          description: Whether the tab is visible.
        isEditable:
          type: boolean
          description: Whether the tab content is editable.
    tabAccessResolutionListResponse:
      type: object
      description: Resolved tab access for all tabs for a given role and asset type.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/tabAccessResolutionResponse"
    ErrorCode:
      type: integer
      description: |
        Stable machine-readable error code enumeration.

        Each value has a stable symbolic name (see x-enum-varnames) that is
        part of the public API contract. Frontend i18n mapping and support
        tooling SHOULD key off the numeric code or its symbolic name rather
        than the localized `message` field.

        Range allocation:
          * 4000-4009: Validation errors (HTTP 400)
          * 4010-4019: Authentication errors (HTTP 401)
          * 4030-4039: Authorization errors (HTTP 403); except 4034 (HTTP 425)
            and 4037 (HTTP 410) which carry lifecycle semantics
          * 4040-4049: Resource not found (HTTP 404)
          * 4050-4059: Authorization sub-states (HTTP 403)
          * 4060-4069: Not acceptable (HTTP 406)
          * 4090-4099: Resource conflict (HTTP 409)
          * 4120-4129: Precondition failed (HTTP 412)
          * 4130-4139: Request too large (HTTP 413)
          * 4280-4289: Precondition required (HTTP 428)
          * 5000-5029: Server errors (HTTP 500)
          * 5030-5039: Service unavailable (HTTP 503)
      enum:
      - 4000
      - 4001
      - 4002
      - 4003
      - 4010
      - 4011
      - 4012
      - 4013
      - 4030
      - 4031
      - 4032
      - 4033
      - 4034
      - 4035
      - 4036
      - 4037
      - 4038
      - 4040
      - 4041
      - 4042
      - 4060
      - 4090
      - 4091
      - 4092
      - 4120
      - 4130
      - 4280
      - 4290
      - 5001
      - 5002
      - 5030
      x-enum-varnames:
      - VALIDATION_FAILED
      - VALIDATION_FIELD_REQUIRED
      - VALIDATION_FIELD_INVALID
      - SUBSCRIPTION_LIMIT_EXCEEDED
      - AUTH_INVALID_CREDENTIALS
      - AUTH_TOKEN_EXPIRED
      - AUTH_TOKEN_INVALID
      - AUTH_TOKEN_MISSING
      - FORBIDDEN
      - FORBIDDEN_TENANT_ACCESS
      - ORGANIZATION_NOT_PROVISIONED
      - ACCOUNT_NOT_ACTIVE
      - TENANT_NOT_READY
      - ACCOUNT_SUSPENDED
      - ACCOUNT_IN_EXPORT_GRACE
      - ACCOUNT_FINALIZED
      - IDENTITY_MISMATCH_REJECTED
      - RESOURCE_NOT_FOUND
      - USER_NOT_FOUND
      - ASSET_NOT_FOUND
      - NOT_ACCEPTABLE
      - RESOURCE_CONFLICT
      - USER_ALREADY_EXISTS
      - RESOURCE_LOCKED
      - PRECONDITION_FAILED
      - REQUEST_TOO_LARGE
      - PRECONDITION_REQUIRED
      - RATE_LIMIT_EXCEEDED
      - INTERNAL_ERROR
      - DATABASE_ERROR
      - SERVICE_UNAVAILABLE
      x-enum-descriptions:
      - Request validation failed
      - Required field is missing
      - Field value is invalid
      - Use case count has reached the plan limit
      - Invalid email or password
      - Authentication token has expired
      - Authentication token is invalid
      - Authentication token is missing
      - Access denied
      - Cannot access this tenant
      - Authenticated user has no active organization membership
      - User account is inactive, locked, or pending
      - Tenant workspace is being prepared (HTTP 425; carries retryAfterMs)
      - Subscription is suspended
      - Subscription is unsubscribed but still within the export-grace window
      - Subscription is unsubscribed and the export-grace window has expired (HTTP
        410)
      - JWT subject does not match the pending user's bound auth0_sub
      - Generic resource not found
      - User not found
      - Asset not found
      - Requested media type not supported
      - Generic resource conflict (e.g. asset name collision within an organization)
      - User with this email already exists
      - Resource is locked (deployed/retired) and cannot be modified
      - Resource state does not match precondition (e.g. ETag mismatch)
      - Request body exceeds size limit
      - Precondition header required for operation (e.g. If-Match)
      - Too many requests from this client
      - Internal server error
      - Database operation failed
      - Service temporarily unavailable

    errorResponse:
      type: object
      description: Standard error response envelope matching the APIError wire format
        produced by internal/apperrors.WriteError.
      properties:
        error:
          type: object
          properties:
            version:
              type: integer
              description: Error schema version for backward compatibility. Always
                1.
            httpStatusCode:
              type: integer
              description: HTTP status code repeated in the body for convenience.
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human-readable, localized error summary.
            requestId:
              type: string
              description: Correlation ID matching the X-Request-ID response header.
            field:
              type: string
              description: JSON path to the affected field for field-level validation
                errors.
            remediation:
              type: string
              description: Actionable guidance to resolve the error.
            retryAfterMs:
              type: integer
              description: |
                Recommended client-side wait before retrying, in milliseconds.
                Present only on `TENANT_NOT_READY` (4034); emitted alongside the
                `Retry-After` HTTP header.
            errors:
              type: array
              description: Nested child errors for multi-field validation failures.
              items:
                $ref: "#/components/schemas/apiErrorDetail"
            links:
              type: array
              description: HATEOAS-style navigation links.
              items:
                type: object
                properties:
                  rel:
                    type: string
                  href:
                    type: string
                  method:
                    type: string
                  title:
                    type: string
    apiErrorDetail:
      type: object
      description: Nested error detail with the same shape as the parent error object
        in errorResponse.
      properties:
        version:
          type: integer
        httpStatusCode:
          type: integer
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        requestId:
          type: string
        field:
          type: string
        remediation:
          type: string
        errors:
          type: array
          items:
            type: object
        links:
          type: array
          items:
            type: object
    organization:
      type: object
      description: Organization (tenant) entity representing a multi-tenant organization.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Internal AIN organization UUID (server-generated UUID v7).
        tenantId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
          description: |
            Auth0 / OIDC org_id used as the cross-system join key. Distinct
            from `id`. Set at provisioning time via POST /admin/tenants and
            immutable thereafter.
        name:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [active, suspended, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    createOrganizationRequest:
      type: object
      description: |
        Request body for creating a new organization. The server generates the
        internal UUID `id`; the caller supplies `tenantId` (Auth0 org_id) as
        the cross-system join key.
      required:
      - tenantId
      - name
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
          description: Auth0 / OIDC org_id used as the cross-system join key.
        name:
          type: string
          minLength: 1
          maxLength: 255
        displayName:
          type: string
          maxLength: 255
        status:
          type: string
          enum: [active, suspended, archived]
          default: active
    updateOrganizationRequest:
      type: object
      description: Request body for updating an existing organization.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        displayName:
          type: string
          maxLength: 255
        status:
          type: string
          enum: [active, suspended, archived]
    organizationListResponse:
      type: object
      description: Paginated list of organizations.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/organization"
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    organizationSubscription:
      type: object
      description: |
        Azure Marketplace subscription state for an organization. One
        subscription per organization, enforced by `tenantId` uniqueness.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organizationId:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
          description: Denormalized Auth0 org_id (matches organizations.tenantId).
        azureSubscriptionId:
          type: string
          description: Azure Marketplace subscription identifier.
        tenantSlug:
          type: string
        planTier:
          type: string
          enum: [basic, standard, professional, enterprise]
        useCaseLimit:
          type: integer
          minimum: 0
        subscriptionStatus:
          type: string
          enum: [active, suspended, unsubscribed]
          description: |
            Subscription lifecycle status. Intentionally asymmetric to
            organizations.status — the management plane translates
            `unsubscribed` → `archived` when projecting to the org row.
        purchaserEmail:
          type: string
          nullable: true
        termUnit:
          type: string
          nullable: true
        termStartDate:
          type: string
          format: date-time
          nullable: true
        termEndDate:
          type: string
          format: date-time
          nullable: true
        autoRenew:
          type: boolean
        isFreeTrial:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    firstAdminBlock:
      type: object
      description: Identity for the first administrator user provisioned with the
        tenant.
      required:
      - email
      properties:
        email:
          type: string
          format: email
        givenName:
          type: string
        familyName:
          type: string
    provisionTenantRequest:
      type: object
      additionalProperties: false
      description: |
        Request body for POST /admin/tenants. Atomically creates the
        organization, its subscription row, and the first administrator user.
        Unknown fields are rejected with 400.
      required:
      - tenantId
      - tenantSlug
      - name
      - displayName
      - firstAdmin
      - planTier
      - useCaseLimit
      - azureSubscriptionId
      - isFreeTrial
      - autoRenew
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
          description: Auth0 / OIDC org_id used as the cross-system join key.
        tenantSlug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
        name:
          type: string
          minLength: 1
          maxLength: 255
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        firstAdmin:
          $ref: "#/components/schemas/firstAdminBlock"
        planTier:
          type: string
          enum: [basic, standard, professional, enterprise]
        useCaseLimit:
          type: integer
          minimum: 0
        azureSubscriptionId:
          type: string
        mgmtSubscriptionId:
          type: string
          format: uuid
          description: Optional management service subscriptions.id UUID for cross-system
            correlation.
        termUnit:
          type: string
        termStartDate:
          type: string
          format: date-time
        termEndDate:
          type: string
          format: date-time
        isFreeTrial:
          type: boolean
        autoRenew:
          type: boolean
    patchTenantRequest:
      type: object
      additionalProperties: false
      description: |
        Request body for PATCH /admin/tenants/{oidcOrgID}. All fields are
        optional; only present fields are applied to the subscription row.
        Unknown fields are rejected with 400.
      properties:
        planTier:
          type: string
          enum: [basic, standard, professional, enterprise]
        useCaseLimit:
          type: integer
          minimum: 0
        subscriptionStatus:
          type: string
          enum: [active, suspended, unsubscribed]
        azureSubscriptionId:
          type: string
        tenantSlug:
          type: string
        purchaserEmail:
          type: string
        termUnit:
          type: string
        termStartDate:
          type: string
          format: date-time
        termEndDate:
          type: string
          format: date-time
        isFreeTrial:
          type: boolean
        autoRenew:
          type: boolean
    tenantResponse:
      type: object
      description: |
        Combined organization + subscription response for admin tenant
        endpoints. The `subscription` block is absent when no subscription
        row exists for the organization.
      required:
      - id
      - tenantId
      - name
      - displayName
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Internal AIN organization UUID (server-generated UUID v7).
        tenantId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
          description: Auth0 / OIDC org_id used as the cross-system join key.
        name:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [active, suspended, archived]
        subscription:
          $ref: "#/components/schemas/organizationSubscription"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    organizationProfile:
      type: object
      description: Organization profile containing metadata, health status configurations,
        and alert dismissal settings
      required:
      - organizationId
      - name
      - createdAt
      - updatedAt
      - healthStatusConfigs
      - alertDismissalConfig
      properties:
        organizationId:
          type: string
          format: uuid
          description: Unique identifier for the organization
          readOnly: true
        name:
          type: string
          description: Name of the organization
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Optional description of the organization
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the profile was created
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the profile was last updated
          readOnly: true
        healthStatusConfigs:
          type: array
          description: Array of health status configuration items
          minItems: 3
          items:
            type: object
            required:
            - code
            - value
            properties:
              code:
                type: string
                description: Configuration code identifier
              value:
                type: boolean
                description: Whether this health check is enabled
        alertDismissalConfig:
          type: object
          description: Alert dismissal configuration
          required:
          - code
          - value
          properties:
            code:
              type: string
              description: Configuration code identifier
            value:
              type: integer
              minimum: 0
              description: Number of days to wait before recreating a dismissed alert
    organizationProfileUpdate:
      type: object
      description: Schema for updating organization profile. Only specified fields
        will be updated (partial update supported).
      properties:
        name:
          type: string
          description: Name of the organization
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Optional description of the organization. Set to null to clear.
          maxLength: 2000
        healthStatusConfigs:
          type: array
          description: Array of health status configuration items to replace existing
            configs
          minItems: 3
          items:
            type: object
            required:
            - code
            - value
            properties:
              code:
                type: string
                description: Configuration code identifier
              value:
                type: boolean
                description: Whether this health check is enabled
        alertDismissalConfig:
          type: object
          description: Alert dismissal configuration
          required:
          - code
          - value
          properties:
            code:
              type: string
              description: Configuration code identifier
            value:
              type: integer
              minimum: 0
              description: Number of days to wait before recreating a dismissed alert
