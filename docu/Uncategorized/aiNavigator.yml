          $ref: "#/components/responses/response400ValidationError"
        "404":
          $ref: "#/components/responses/response404ImportTemplateNotFound"
        "401":
          $ref: "#/components/responses/response401AuthenticationRequiredOrInvalid"
        "403":
          $ref: "#/components/responses/response403UserLacksRequiredPermissions"
        "500":
          $ref: "#/components/responses/response500InternalServerError"
      security:
      - bearerAuth: []

  /organizations/{orgId}/assets:batchCreate:
    post:
      summary: Bulk create assets from import (all-or-nothing transaction)
      description: |
        Creates all assets in the request inside a single database transaction.
        If any individual asset fails validation or conflicts with an existing name,
        the entire batch is rolled back and a 400 response is returned.

        The 400 error body contains a nested `errors` array with one entry per failed row.
        Each nested error includes `rowIndex` (0-based), `assetName`, and a `message`
        describing the failure. This provides per-row detail within the single 400 response.

        A 207 Multi-Status response is not used because the operation is all-or-nothing:
        either all rows succeed (201) or none do (400). Partial success is not supported.
      operationId: batchCreateAssets
      tags:
      - Import
      parameters:
      - name: orgId
        in: path
        required: true
        description: Organization ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/bulkCreateAssetsRequest"
      responses:
        "201":
          description: All assets created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/bulkCreateAssetsResponse"
        "400":
          description: |
            One or more assets failed validation. The transaction was rolled back; no assets were created.
            The `errors` array in the response body contains per-row failure details
            (rowIndex, assetName, message).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "401":
          $ref: "#/components/responses/response401AuthenticationRequiredOrInvalid"
        "403":
          $ref: "#/components/responses/response403UserLacksRequiredPermissions"
        "500":
          $ref: "#/components/responses/response500InternalServerError"
  /reference-data:
    get:
      tags:
      - ReferenceData
      operationId: getReferenceDataCollection
      summary: List reference data types
      description: |
        Returns reference data types in SAS collection format. Public by
        exception (SAIDNAVAI-3012); response is identical for all callers.
        Localized via `Accept-Language`. Supports conditional GET.
      security: []
      parameters:
      - name: types
        in: query
        required: false
        description: |
          Optional comma-separated filter (e.g. `asset-types,user-roles`).
          Raw value max 1000 chars; unknown names yield `400`.
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/RefDataTypeName"
      - name: If-None-Match
        in: header
        required: false
        description: Previous ETag; matching value yields `304`.
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        description: BCP-47 locale (e.g. `en-US`). Defaults to `en-US`.
        schema:
          type: string
          example: en-US
      responses:
        "200":
          description: Reference data collection.
          headers:
            ETag:
              description: SHA256 of definitions; use for conditional GET.
              schema:
                type: string
            Cache-Control:
              description: Always `max-age=3600, public`.
              schema:
                type: string
            Content-Language:
              description: Locale used to localize the body.
              schema:
                type: string
                example: en-US
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/RefDataCollectionResponse"
        "304":
          description: Not modified; cached body still valid.
          headers:
            ETag:
              description: Current definitions ETag.
              schema:
                type: string
            Cache-Control:
              description: Always `max-age=3600, public`.
              schema:
                type: string
            Content-Language:
              description: Locale that would have been used.
              schema:
                type: string
                example: en-US
        "400":
          description: Invalid `types` parameter (too long or unknown name).
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /reference-data/{typeName}:
    get:
      tags:
      - ReferenceData
      operationId: getReferenceDataType
      summary: Get a single reference data type
      description: |
        Returns one reference data type with all its values and HATEOAS links.
        Public by exception (SAIDNAVAI-3012). Localized via `Accept-Language`.
        Supports conditional GET.
      security: []
      parameters:
      - name: typeName
        in: path
        required: true
        description: Reference type name (kebab-case).
        schema:
          $ref: "#/components/schemas/RefDataTypeName"
      - name: If-None-Match
        in: header
        required: false
        description: Previous ETag; matching value yields `304`.
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        description: BCP-47 locale (e.g. `en-US`). Defaults to `en-US`.
        schema:
          type: string
          example: en-US
      responses:
        "200":
          description: Reference data type with values.
          headers:
            ETag:
              description: SHA256 of definitions; use for conditional GET.
              schema:
                type: string
            Cache-Control:
              description: Always `max-age=3600, public`.
              schema:
                type: string
            Content-Language:
              description: Locale used to localize the body.
              schema:
                type: string
                example: en-US
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/RefDataSingleTypeResponse"
        "304":
          description: Not modified; cached body still valid.
          headers:
            ETag:
              description: Current definitions ETag.
              schema:
                type: string
            Cache-Control:
              description: Always `max-age=3600, public`.
              schema:
                type: string
            Content-Language:
              description: Locale that would have been used.
              schema:
                type: string
                example: en-US
        "404":
          description: Unknown reference type.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
