          description: Updated policy provider
          maxLength: 255
          nullable: true
        penaltyForNonCompliance:
          type: string
          description: Updated penalties
          maxLength: 500
          nullable: true
        geographies:
          type: array
          description: Updated geographic regions
          items:
            type: string
          nullable: true
        classificationOptions:
          type: array
