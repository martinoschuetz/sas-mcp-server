    DataSet:
      type: object
      description: |
        Dataset entity representing data governance information for a model.
        38 business fields organized into sections:
        Overview (16), Metadata (2), Governance (7), Privacy (4),
        Modification (2), Provenance (6), Notes (1).
      required:
      - id
      - organizationId
      - assetId
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique dataset identifier
        organizationId:
          type: string
          format: uuid
          readOnly: true
          description: Organization (tenant) this dataset belongs to
        assetId:
          type: string
          format: uuid
          readOnly: true
          description: Asset (model or agent) this dataset is associated with
        datasetName:
          type: string
          maxLength: 255
          description: |
            Conditional - Required when model assetSource = internal
        datasetPurpose:
          type: string
          description: Purpose and intended use of the dataset
        datasetTypes:
          type: array
          items:
            type: string
            enum:
            - AUDIO
            - GEOSPATIAL
            - GRAPH
            - IMAGE
            - MULTIMODAL
            - TABULAR
            - TEXT
            - TIME_SERIES
            - UNAVAILABLE
            - UNKNOWN
            - VIDEO
        originGeography:
          type: string
          description: Geographic origin of the data
        dataDescription:
          type: string
          description: Detailed description of the dataset contents
        sourceSystem:
          type: string
          description: System where the data originates
        linkToDataset:
          type: string
          description: URL or path to access the dataset
        datasetVersion:
          type: string
          description: Version identifier for the dataset
        timePeriodCovered:
          type: string
          description: Time range the data covers
        datasetOwner:
          type: string
          description: Person or team responsible for the dataset
        includesSyntheticData:
          type: string
          enum: [yes, no]
          description: Whether the dataset contains synthetic data
        numberOfColumns:
          type: string
          description: Number of columns/features in the dataset
        numberOfRows:
          type: string
          description: Number of rows/records in the dataset
        datasetSize:
          type: string
          description: Size of the dataset (e.g., "2.5 GB")
        datasetStatus:
          type: string
          description: Current status of the dataset
        datasetTags:
          type: array
          items:
            type: string
          description: Tags for categorization and search
        rowDescription:
          type: string
          description: Description of what each row represents
        domain:
          type: array
          items:
            type: string
            enum:
            - AGRICULTURE
            - AUTOMOTIVE
            - EDUCATION
            - ENERGY_AND_UTILITIES
            - ENVIRONMENTAL_SCIENCES
            - FINANCE_AND_BANKING
            - GOVERNMENT_AND_PUBLIC_SECTOR
            - HEALTHCARE
            - HOSPITALITY_AND_TOURISM
            - INSURANCE
            - MANUFACTURING
            - MEDIA_AND_ENTERTAINMENT
            - PHARMACEUTICALS_AND_BIOTECH
            - REAL_ESTATE
            - RETAIL_AND_ECOMMERCE
            - TECHNOLOGY_AND_SOFTWARE
            - TELECOMMUNICATIONS
            - TRANSPORTATION_AND_LOGISTICS
            - OTHER
        # Governance Section (7 fields)
        datasetIntendedUse:
          type: array
          items:
            type: string
          description: Intended uses for the dataset
        suitableUseCase:
          type: string
          description: Description of suitable use cases
        privacyClassification:
          type: string
          description: Privacy classification level
        licensing:
          type: string
          enum: [yes, no]
          description: Whether the dataset has a license
        licenseType:
          type: string
          description: |
            Conditional - only when licensing = Yes
        licensingDetails:
          type: string
          description: |
            Conditional - only when licensing = Yes
        complianceFrameworks:
          type: array
          items:
            type: object
            properties:
              frameworkName:
                type: string
                description: Name of the compliance framework
              complianceStatus:
                type: string
                enum: [not-started, in-progress, compliant, non-compliant, not-applicable]
        protectedGroups:
