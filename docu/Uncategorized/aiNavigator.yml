  /organizations/{orgId}/tab-access:
    parameters:
    - $ref: "#/components/parameters/orgId"
    get:
      summary: List tab access configurations
      description: |
        Returns all stored tab access configurations for the organization.
        Optionally filtered by assetType. Admin and Compliance Officer roles
        always bypass tab restrictions and are never stored here.
      operationId: listTabAccess
      tags:
      - Tab Access
      parameters:
      - name: assetType
        in: query
        required: false
        description: Filter by asset type (e.g. MODEL, USE_CASE, AGENT, AI_SYSTEM)
        schema:
          type: string
      - name: start
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        required: false
        description: Maximum number of items to return (max 100; values above 100
          are silently clamped)
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        "200":
          description: List of tab access configurations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tabAccessListResponse"
        "401":
          $ref: "#/components/responses/response401Unauthorized"
        "403":
          $ref: "#/components/responses/response403Forbidden"
        "500":
          $ref: "#/components/responses/response500InternalServerError"
    put:
      summary: Upsert a tab access configuration
      description: |
        Creates or updates the tab visibility and editability for a specific
        (tabId, assetType, role) combination within the organization.
        Only Admin role may call this endpoint (organization:edit permission).
        No If-Match required — this is a state-setting operation.
      operationId: upsertTabAccess
      tags:
      - Tab Access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/tabAccessUpsertRequest"
      responses:
        "200":
          description: Updated tab access configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tabAccessResponse"
        "400":
          description: Bad request (invalid tabId, assetType, or role)
        "401":
          $ref: "#/components/responses/response401Unauthorized"
        "403":
          $ref: "#/components/responses/response403Forbidden"
        "500":
          $ref: "#/components/responses/response500InternalServerError"
  /organizations/{orgId}/tab-access/resolve:
    parameters:
    - $ref: "#/components/parameters/orgId"
    get:
      summary: Resolve effective tab access for a role
      description: |
        Returns the effective visibility and editability for every tab for the
        given assetType and role. When no row is stored for a tab, role-based
        defaults are applied: viewer sees only Overview; contributor sees all tabs.
      operationId: resolveTabAccess
      tags:
      - Tab Access
      parameters:
      - name: assetType
        in: query
        required: true
        description: Asset type to resolve access for (e.g. MODEL, USE_CASE)
        schema:
          type: string
      - name: role
        in: query
        required: true
        description: Role to resolve access for (viewer or contributor)
        schema:
          type: string
          enum: [viewer, contributor]
      responses:
        "200":
          description: Resolved tab access for all tabs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tabAccessResolutionListResponse"
        "400":
          description: Bad request (missing or invalid assetType/role)
        "401":
          $ref: "#/components/responses/response401Unauthorized"
        "403":
          $ref: "#/components/responses/response403Forbidden"
        "500":
          $ref: "#/components/responses/response500InternalServerError"
  /organizations/{orgId}/audit-trail:
    parameters:
    - $ref: "#/components/parameters/orgId"
    get:
      operationId: listAuditTrail
      summary: List org-wide audit trail
      description: |
        Returns a paginated, filterable list of changelog entries across all
        assets in the organization. Each entry includes the asset name and type
        resolved via JOIN at query time.

        Access is restricted to compliance-officer and admin roles.
      tags:
      - Audit Trail
      parameters:
      - name: start
        in: query
        required: false
        description: Zero-based offset for pagination
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        required: false
        description: Maximum number of items to return (max 100; values above 100
          are silently clamped)
        schema:
          type: integer
          maximum: 100
          default: 50
      - name: startDate
        in: query
        required: false
        description: Filter entries on or after this RFC3339 timestamp
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        required: false
        description: Filter entries on or before this RFC3339 timestamp
        schema:
          type: string
          format: date-time
      - name: userId
        in: query
        required: false
        description: Filter entries by the user who performed the action
        schema:
          type: string
      - name: action
        in: query
        required: false
        description: Filter entries by event type
        schema:
          type: string
          enum:
          - ASSET_CREATED
          - ASSESSMENT_APPROVED
          - ALERT_CREATED
          - ALERT_RESOLVED
          - ALERT_DISMISSED
          - ASSET_LINKED
          - ASSET_UNLINKED
          - POLICY_APPLIED
          - POLICY_REMOVED
          - POLICY_CLASSIFICATION_CHANGED
          - VERSION_CHANGED
          - ASSET_DELETED
          - ASSET_RESTORED
          - ASSET_DUPLICATED
          - ASSET_ROLE_ASSIGNED
          - ASSET_ROLE_CHANGED
          - ASSET_ROLE_CLEARED
          - APPROVAL_STATUS_CHANGED
          - DEPLOYMENT_STATUS_CHANGED
      - name: search
        in: query
        required: false
        description: |
          Full-text search across asset name, event description,
          and user name (case-insensitive substring match)
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditTrailResponse"
              example:
                data:
                - id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                  assetId: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
                  assetName: "Credit Risk Model"
                  assetType: "model"
                  eventType: "POLICY_APPLIED"
                  event: "Policy 'Trustworthy AI Lifecycle' applied"
                  userId: "cccccccc-cccc-cccc-cccc-cccccccccccc"
                  userName: "Jennifer Chen"
                  userRole: "administrator"
                  assetRole: "Owner"
                  createdAt: "2026-04-01T14:30:00Z"
                pagination:
                  start: 0
                  limit: 50
                  count: 1
        "400":
          description: Bad request (invalid query parameter format)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "401":
          $ref: "#/components/responses/response401Unauthorized"
        "403":
          $ref: "#/components/responses/response403Forbidden"
        "500":
          $ref: "#/components/responses/response500InternalServerError"
