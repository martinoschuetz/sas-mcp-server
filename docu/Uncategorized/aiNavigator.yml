                  $ref: "#/components/schemas/ContainedAssetSummary"
        reverseDependencies:
          type: array
          items:
            type: object
            properties:
              parentAssetId:
                type: string
                format: uuid
              parentAssetName:
                type: string
              parentAssetType:
                type: string
              role:
                nullable: true
                allOf:
                - $ref: "#/components/schemas/ChampionChallengerRole"
              isParentDeployed:
                type: boolean
                nullable: true
              alertCount:
                type: integer
              approvalStatus:
                type: string
                nullable: true
              ownerName:
                type: string
                nullable: true
              lastModified:
                type: string
                format: date-time
                nullable: true
              relatedAssets:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedAssetSummary"
        summary:
          $ref: "#/components/schemas/RelationshipsSummary"
    LinkedAssetGridResponse:
      type: object
      readOnly: true
      description: Paginated grid of related assets (AR-5)
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LinkedAssetGridItem"
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    AvailableAssetOwner:
      type: object
      readOnly: true
      description: Owner information for an available asset
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    AvailableAssetCard:
      type: object
      readOnly: true
      description: A single card in the AR-6 available assets list
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        assetType:
          type: string
          enum: [model, agent, use-case]
        alertCount:
          type: integer
        approvalStatus:
          type: string
          nullable: true
        lastUpdatedTimestamp:
          type: string
          format: date-time
          nullable: true
        assetOwner:
          $ref: "#/components/schemas/AvailableAssetOwner"
        assetStage:
          type: string
          nullable: true
        includesGenerativeAI:
          type: string
          enum: [yes, no]
          nullable: true
          readOnly: true
          description: Whether this asset includes generative AI. For use cases, derived
            from linked child assets.
    AvailableAssetsResponse:
      type: object
      readOnly: true
      description: Paginated list of assets available for linking (AR-6)
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AvailableAssetCard"
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    AssetReferenceLinks:
      description: |
        Reference links view - Returns a paginated list of reference links (URL + display text) attached to an asset.
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, url, displayText]
            properties:
              id:
                type: string
                format: uuid
              url:
                type: string
                format: uri
              displayText:
                type: string
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    AssetCreateRequest:
      type: object
      description: |
        Base schema for creating all asset types.
        Contains common fields shared across models, agents, and use cases.
        Excludes readOnly fields (id, organizationId, timestamps, createdBy, lastUpdatedBy, alertCount, assessmentCompletionPercentage).
      required:
      - name
      - assetType
      - includesGenerativeAI
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Asset name - Required, must be unique within organization
        assetType:
          type: string
          enum: [model, agent, use-case]
          description: Type of asset - Required, immutable after creation
        assetOwner:
          type: string
          description: ID of the asset owner - Required only when permissionGroups
            is non-empty. Must have Contributor role or higher
        permissionGroups:
          type: array
          items:
            type: string
            format: uuid
          description: Access control groups. Optional; Defaults to "Organization-Wide"
            if empty
        intendedUse:
          type: string
          description: Business context - Optional
        expectedBenefit:
          type: string
          description: Business context - Optional
        outOfScopeUsage:
          type: string
          description: Business context - Optional
        knownLimitations:
          type: string
          description: Business context - Optional
        targetUsers:
          type: string
          description: Business context - Optional
        expectedVolume:
          type: string
          description: Business context - Optional
        includesGenerativeAI:
          type: string
          enum: [yes, no]
          description: Required; When yes - enables Content Filtering Status field
            (Models/Agents), enables Generative AI fields
        businessFunction:
          type: array
          items:
            type: string
            enum:
            - Analytics and insights
            - Clinical operations
            - Customer service
            - Engineering and product
            - Environmental and safety
            - Facilities management
            - Finance
            - Human resources
            - Investment management
            - IT and infrastructure
            - Legal and compliance
            - Marketing
            - Operations
            - Quality assurance
            - Sales
            - Security and risk
            - Strategy and planning
            - Supply chain
            - Other
          description: Multi-select business function categories - Optional
        tags:
          type: array
          items:
            type: string
          description: Keywords for categorization - Optional; Free-form text tags
    AssetUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        metadata:
          type: object
          additionalProperties: true
        assetLinks:
          type: array
          description: Replaces all existing relationships (Use Cases and Agents only)
          items:
            $ref: "#/components/schemas/AssetLinkInput"
    AssetDeletionResponse:
      type: object
      description: Response returned after successfully deleting an asset (soft delete)
      required:
      - assetId
      - assetType
      - deletedAt
      - deletedBy
      properties:
        assetId:
          type: string
          format: uuid
          description: Unique identifier of the deleted asset
        assetName:
          type: string
          description: Name of the deleted asset
        assetType:
          type: string
          enum: [model, agent, use-case]
          description: Type of the deleted asset
        deletedAt:
          type: string
          format: date-time
          description: Timestamp when the asset was deleted
        deletedBy:
          type: string
          format: uuid
          description: User ID who deleted the asset
        permanentDeletionDate:
          type: string
          format: date-time
          description: Scheduled date for permanent deletion (30 days after deletedAt)
        warnings:
          type: array
          description: List of warnings about data that will be affected by the deletion
          items:
            type: string
        includesGenerativeAI:
          type: string
          enum: [yes, no]
          nullable: true
          description: Whether the deleted asset includes generative AI.
        unlinkedAssets:
          type: array
          description: Assets that were unlinked during deletion (for use cases only)
          items:
            $ref: "#/components/schemas/RelatedAssetSummary"
    DeletedAssetResponse:
      type: object
      description: Representation of a soft-deleted asset within the retention window
      required:
      - id
      - name
      - assetType
      - owner
      - deletedBy
      - deletedAt
      - daysRemaining
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the deleted asset
        name:
          type: string
          description: Display name of the deleted asset
        assetType:
          type: string
          enum: [use-case, model, agent]
          description: Type of the deleted asset
        version:
          type: string
          description: Version string of the asset (omitted if not set)
        owner:
          type: string
          description: Display name of the asset owner resolved from the users table
        deletedBy:
          type: string
          description: Display name of the user who performed the soft delete
        deletedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the asset was soft deleted
        daysRemaining:
          type: integer
          minimum: 0
          maximum: 30
          description: Days remaining in the 30-day retention window before permanent
            deletion
    DeletedAssetsListResponse:
      type: object
      description: Paginated list of soft-deleted assets within the retention window
      required:
      - items
      - totalCount
      properties:
        items:
          type: array
          description: Soft-deleted assets visible to the caller
          items:
            $ref: "#/components/schemas/DeletedAssetResponse"
        totalCount:
          type: integer
          minimum: 0
          description: Total number of soft-deleted assets matching the query
    ModelCreateRequest:
      description: |
        Request schema for creating a Model.
        Extends AssetCreateRequest with Model-specific required and optional fields.
      allOf:
      - $ref: "#/components/schemas/AssetCreateRequest"
      - type: object
        required:
        - assetSource
        - assetStage
        properties:
          assetSource:
            type: string
            enum: [internal, external]
            description: |
              Required; Immutable after creation; Determines available Asset Stage values
          assetStage:
            type: string
            enum:
            - development
            - testing
            - evaluation
            - pilot
            - production
            - retired
            - prohibited
            description: |
              Lifecycle stage - Required.
              When assetSource = internal: Values are [development, testing, production, retired, prohibited]
              When assetSource = external: Values are [evaluation, pilot, production, retired, prohibited]
          usageAuthorization:
            type: string
            enum: [pending, authorized, restricted, prohibited]
            description: |
              Required. Authorization status for model usage. Specifies governance constraints on usage.
          vendorProvider:
            type: string
            description: |
              Conditional - Required when assetSource = external; Optional when assetSource = internal
          contentFilteringStatus:
            type: string
            enum: [active, inactive, partial]
            description: |
              Conditional - Only visible/editable when includesGenerativeAI = Yes
          authorizationNotes:
            type: string
            description: |
              Optional; Recommended when usageAuthorization = restricted or prohibited
          versionIdentifier:
            type: string
            description: |
              Optional; Manual text field
          modelFamily:
            type: string
            description: |
              Optional; Only visible/editable when includesGenerativeAI = Yes
          accessMethod:
            type: string
            enum: [api, on-premise, fine-tuned-instance, hosted-service, cloud-platform,
              custom-deployment]
            description: |
              Optional; Only visible/editable when includesGenerativeAI = Yes
          trainingDataKnown:
            type: string
            enum: [known, unknown, unsure]
            description: |
              Conditional - Only visible/editable when includesGenerativeAI = Yes
              Whether the training data used by the model is known and documented
          securityMeasures:
            type: string
            description: |
              Optional; Documents cyber threat protection and access controls
          redTeamingStrategy:
            type: string
            description: |
              Optional; Documents approach for testing against adversarial scenarios
          assetLinks:
            type: array
            description: |
              Assets to link on creation (Models can link to other Models)
            items:
              $ref: "#/components/schemas/AssetLinkInput"
    AgentCreateRequest:
      description: |
        Request schema for creating an Agent.
        Extends AssetCreateRequest with Agent-specific required and optional fields.
        Agent has same fields as Model.
      allOf:
      - $ref: "#/components/schemas/AssetCreateRequest"
      - type: object
        required:
        - assetSource
        - assetStage
        properties:
          assetSource:
            type: string
            enum: [internal, external]
            description: |
              Required; Immutable after creation; Determines available Asset Stage values
          assetStage:
            type: string
            enum:
            - development
            - testing
            - evaluation
            - pilot
            - production
            - retired
            - prohibited
            description: |
              Lifecycle stage - Required.
              When assetSource = internal: Values are [development, testing, production, retired, prohibited]
              When assetSource = external: Values are [evaluation, pilot, production, retired, prohibited]
          usageAuthorization:
            type: string
            enum: [pending, authorized, restricted, prohibited]
            description: |
              Required. Authorization status for model usage. Specifies governance constraints on usage.
          vendorProvider:
            type: string
            description: |
              Conditional - Required when assetSource = external; Optional when assetSource = internal
          contentFilteringStatus:
            type: string
            enum: [active, inactive, partial]
            description: |
              Conditional - Only visible/editable when includesGenerativeAI = Yes
          authorizationNotes:
            type: string
            description: |
              Optional; Recommended when usageAuthorization = restricted or prohibited
          versionIdentifier:
            type: string
            description: |
              Optional; Manual text field
          modelFamily:
            type: string
            description: |
              Optional; Only visible/editable when includesGenerativeAI = Yes
          accessMethod:
            type: string
            enum: [api, on-premise, fine-tuned-instance, hosted-service, cloud-platform,
              custom-deployment]
            description: |
              Optional; Only visible/editable when includesGenerativeAI = Yes
          securityMeasures:
            type: string
            description: |
              Optional; Documents cyber threat protection and access controls
          redTeamingStrategy:
            type: string
            description: |
              Optional; Documents approach for testing against adversarial scenarios
          assetLinks:
            type: array
            description: Assets to link on creation (Agents can link to Models)
            items:
              $ref: "#/components/schemas/AssetLinkInput"
    UseCaseCreateRequest:
      description: |
        Request schema for creating a Use Case.
        Extends AssetCreateRequest with UseCase-specific required and optional fields.
      allOf:
      - $ref: "#/components/schemas/AssetCreateRequest"
      - type: object
        required:
        - deploymentStatus
        properties:
          approver:
            type: string
            description: Conditional - Required when at least one policy is applied;
              Optional if no policies applied
          approvalStatus:
            type: string
            enum: [pending-review, under-review, approved, approved-with-limitations,
              declined, on-hold, retired]
            description: "Conditional - Required when at least one policy is applied;\
              \ Default: pending-review"
          approvalStatusNotes:
            type: string
            description: Optional - Context and reasoning for approval decisions;
              Recommended for declined or on-hold
          deploymentStatus:
            type: string
            enum: [not-deployed, deployed, retired]
            description: "Required; Default: not-deployed"
          deploymentGeographies:
            type: array
            items:
              type: string
            description: Optional - Documents where the use case is deployed
          humanOversightLevel:
            type: string
            enum: [manual-only, human-in-the-loop, human-on-the-loop, supervised-autonomy,
              full-autonomy]
            description: Optional - Level of human oversight in the use case
          appliedPolicies:
            type: array
            items:
              type: string
              format: uuid
            description: Optional - List of policy UUIDs to apply on creation
          securityMeasures:
            type: string
            description: Optional - Documents cyber threat protection and access controls
          redTeamingStrategy:
            type: string
            description: Optional - Documents approach for testing against adversarial
              scenarios
          assetLinks:
            type: array
            description: Assets to link on creation (Use Cases can link to Models
              and Agents)
            items:
              $ref: "#/components/schemas/AssetLinkInput"
    AssetInventorySummary:
      type: object
      description: |
        Aggregated summary metrics for Asset Inventory Grid.
        Totals at a glance - displayed at top of grid.
      required:
      - totalAssets
      - maxAllowedCount
      - useCaseCount
      - modelCount
      - agentCount
      properties:
        totalAssets:
          type: integer
          description: Total number of assets user has access to
        maxAllowedCount:
          type: integer
          description: Total number of assets with "Max Allowed" policy classification
        useCaseCount:
          type: integer
          description: The number of use cases
        modelCount:
          type: integer
          description: The number of models
        agentCount:
          type: integer
          description: The number of agents
    AssetGridItem:
      type: object
      description: |
        Single row in the Asset Inventory Grid.
        Some fields are conditional based on assetType.
      required:
      - id
      - isFavorited
      - name
      - assetType
      - alertCount
      properties:
        id:
          type: string
          format: uuid
          description: Unique asset identifier
        isFavorited:
          type: boolean
          description: |
            Indicates if current user has marked asset as favorite.
            Displayed as star icon - clickable toggle.
        name:
          type: string
          description: Asset name from Properties Tab
        assetType:
          type: string
          enum:
          - use-case
          - model
          - agent
          description: "Asset Type: Use Case, Model, or Agent"
        alertCount:
          type: integer
          minimum: 0
          description: Number of active Alerts associated with the asset
        highestPolicyClassification:
          type: string
          enum:
          - PROHIBITED
          - HIGH
          - STANDARD
          - UNCLASSIFIED
          nullable: true
          description: |
            Highest policy classification across all applied policies.
            From Applied Policies Tab.
            ONLY populated for Use Cases; null for Models/Agents.
        approvalStatus:
          type: string
          enum:
          - pending-review
          - under-review
          - approved
          - approved-with-limitations
          - declined
          - on-hold
          - retired
          nullable: true
          description: |
            Use Case Approval Status from Properties Tab.
            ONLY populated for Use Cases; null for Models/Agents.
        usageAuthorization:
          type: string
          enum:
          - pending
          - authorized
          - restricted
          - prohibited
          nullable: true
          description: |
            Usage Authorization from Properties Tab.
            ONLY populated for Models/Agents; null for Use Cases.
        assetOwnerDetails:
          type: object
          nullable: true
          description: Asset Owner object with id and displayName from Properties
            Tab
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
        includesGenerativeAI:
          type: string
          enum: [yes, no]
          nullable: true
          description: From Properties Tab
        assessmentCompletionPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: |
            Calculated as percentage of answered questions from Assessments Tab.
            Value between 0.00 and 1.00 (displayed as percentage in UI).
        lastUpdatedTimestamp:
          type: string
          format: date-time
          nullable: true
          description: Last Updated Timestamp from Properties Tab
        appliedPolicies:
          type: array
          nullable: true
          description: |
            List of policies applied from Applied Policies Tab.
            ONLY populated for Use Cases; null for Models/Agents.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              classification:
                type: string
              classificationDisplay:
                type: string
                nullable: true
                description: |
                  Human-readable display label for the classification value.
                  Example: "High Risk" for classification value "HIGH".
        vendorProvider:
          type: string
          nullable: true
          description: |
            Vendor/Provider from Properties Tab.
            ONLY populated when assetSource = external.
            ONLY for Models/Agents; null for Use Cases.
        modelFamily:
          type: string
          nullable: true
          description: |
            From Development Tab.
            ONLY populated when Includes Generative AI = Yes.
            For Agents: populated only when Includes Generative AI = Yes.
        versionIdentifier:
          type: string
          nullable: true
          description: |
            From Properties Tab.
            ONLY populated for Models/Agents; null for Use Cases.
        assetStage:
          type: string
          enum:
          - development
          - testing
          - production
          - retired
          - prohibited
          - evaluation
          - pilot
          nullable: true
          description: |
            Asset Stage from Properties Tab.
            ONLY populated for Models/Agents; null for Use Cases.
            Internal assets: development, testing, production, retired, prohibited
            External assets: evaluation, pilot, production, retired, prohibited
        assetSource:
          type: string
          enum:
          - internal
          - external
          nullable: true
          description: |
            Internal field to support conditional display rules.
            Determines Asset Stage options and Vendor display.
            ONLY for Models/Agents; null for Use Cases.
        deploymentStatus:
          type: string
          enum:
          - not-deployed
          - deployed
          - retired
          nullable: true
          description: |
            Deployment Status from Properties Tab.
            ONLY populated for Use Cases; null for Models/Agents.
    AssetInventoryResponse:
      type: object
      description: |
        Response for Asset Inventory Grid view.
        Contains aggregated summary metrics, paginated asset data, and pagination info.
      required:
      - summary
      - data
      - pagination
      properties:
        summary:
          $ref: "#/components/schemas/AssetInventorySummary"
        data:
          type: array
          description: Paginated list of assets for the grid
          items:
            $ref: "#/components/schemas/AssetGridItem"
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    FrameworkResponse:
      type: object
      description: A policy framework with its available classification options.
      required:
      - name
      - classifications
      properties:
        name:
          type: string
          description: Policy framework name (e.g. "EU AI Act", "NIST AI RMF")
        classifications:
          type: array
          description: Available classification options for this framework. Empty
            array if none defined.
          items:
            type: string
        classificationTypes:
          type: object
          description: Mapping of classification option name to its tier type (e.g.
            "Unacceptable Risk" → "prohibited"). Used by the FE to style pills correctly
            without deriving type from option name.
          additionalProperties:
            type: string
    ChangeLogEntry:
      type: object
      description: |
        Single entry in the asset change log audit trail.
        Represents a recorded event or change to the asset.
      required:
      - id
      - eventType
      - event
      - userName
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the change log entry
        eventType:
          type: string
          enum:
          - ASSET_CREATED
          - ASSESSMENT_APPROVED
          - ALERT_CREATED
          - ALERT_RESOLVED
          - ALERT_DISMISSED
          - ASSET_LINKED
          - ASSET_UNLINKED
          - POLICY_APPLIED
          - POLICY_REMOVED
          - POLICY_CLASSIFICATION_CHANGED
          - VERSION_CHANGED
          - ASSET_DELETED
          - ASSET_DUPLICATED
          description: |
            Type of tracked action that occurred.
            Derived from tracked actions list in shared requirements.
        event:
          type: string
          description: |
            Human-readable description of the change or event.
            Examples:
            - "Use case 'Source Code Security Review' created"
            - "Policy 'Trustworthy AI Lifecycle' applied with classification 'High Risk'"
            - "Alert created: Missing Required Assessments"
            - "Model version updated from 2.2.1 to 2.3.0"
        notes:
          type: string
          nullable: true
          description: |
            Additional notes about the change.
            From shared requirements: "Additional notes about the change"
        userId:
          type: string
          nullable: true
          description: |
            User ID who performed the action.
            Null for system-generated events (e.g., automated alerts).
        userName:
          type: string
          description: |
            Display name of the user who performed the action.
            Shows "System" for automated/system-generated events.
        userRole:
          type: string
          nullable: true
          description: |
            Role of the user at the time of the event.
            "System" for automated events, null for user events.
            Role resolution is deferred (SAIDNAVAI-1995) until a
            mapping between the three internal role systems and
            display values is defined.
        assetRole:
          type: string
          enum:
          - Owner
          - Approver
          nullable: true
          description: |
            User's role relative to the asset at time of event.
            - Owner: User was the asset owner
            - Approver: User was an approver (Use Case only)
            - null: User had no special asset role
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the event occurred
    ChangeLogResponse:
      type: object
      description: |
        Paginated response for asset change log.
        Contains change log entries and pagination metadata.
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          description: List of change log entries for the current page
          items:
            $ref: "#/components/schemas/ChangeLogEntry"
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    AuditTrailEntry:
      type: object
      description: |
        Single entry in the org-wide audit trail.
        Extends ChangeLogEntry with asset metadata resolved via JOIN,
        so assetName and assetType reflect the asset at query time.
      required:
      - id
      - assetId
      - assetName
      - assetType
      - eventType
      - event
      - userId
      - userName
      - userRole
      - assetRole
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the changelog entry
        assetId:
          type: string
          format: uuid
          description: ID of the asset the event belongs to
        assetName:
          type: string
          description: Display name of the asset at query time
        assetType:
          type: string
          description: Asset type (e.g. use-case, model, agent, ai-system)
        eventType:
          type: string
          enum:
          - ASSET_CREATED
          - ASSESSMENT_APPROVED
          - ALERT_CREATED
          - ALERT_RESOLVED
          - ALERT_DISMISSED
          - ASSET_LINKED
          - ASSET_UNLINKED
          - POLICY_APPLIED
          - POLICY_REMOVED
          - POLICY_CLASSIFICATION_CHANGED
          - VERSION_CHANGED
          - ASSET_DELETED
          - ASSET_RESTORED
          - ASSET_DUPLICATED
          - ASSET_ROLE_ASSIGNED
          - ASSET_ROLE_CHANGED
          - ASSET_ROLE_CLEARED
          - APPROVAL_STATUS_CHANGED
          - DEPLOYMENT_STATUS_CHANGED
          description: Type of tracked action that occurred
        event:
          type: string
          description: Human-readable description of the change or event
        userId:
          type: string
          nullable: true
          description: ID of the user who performed the action; null for system events
        userName:
          type: string
          description: Display name of the user; "System" for automated events
        userRole:
          type: string
          nullable: true
          description: |
            The user's system role at the time of the event.
            Maps to canonical refdata keys: viewer, contributor,
            compliance-officer, administrator. "System" for system events.
        assetRole:
          type: string
          enum:
          - Owner
          - Approver
          nullable: true
          description: |
            User's role relative to the asset at time of event.
            null when the user had no special asset role.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the event occurred
    AuditTrailResponse:
      type: object
      description: Paginated response for the org-wide audit trail endpoint.
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          description: Audit trail entries for the current page
          items:
            $ref: "#/components/schemas/AuditTrailEntry"
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    DashboardInventoryResponse:
      type: object
      description: |
        Lightweight asset list for dashboard inventory view.
        Returned via Accept: application/vnd.sas.ainavigator.dashboard.inventory+json
      required:
      - assets
      - start
      - limit
      - count
      properties:
        assets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              assetName:
                type: string
              assetType:
                type: string
                enum: [model, agent, use-case]
              alerts:
                type: integer
              owner:
                type: string
              lastUpdated:
                type: string
                format: date-time
              approvalStatus:
                type: string
                nullable: true
              isFavorite:
                type: boolean
              description:
                type: string
                nullable: true
              includesGenerativeAI:
                type: string
                enum: [yes, no]
                nullable: true
                description: Whether this asset includes generative AI. For use cases,
                  derived from linked child assets.
        start:
          type: integer
          description: Zero-based offset of the first item in this page.
        limit:
          type: integer
          description: Maximum number of items per page.
        count:
          type: integer
          format: int64
          description: Total number of items across all pages.
    createQuestionRequest:
      type: object
      description: Request to create a question within a policy.
      required:
      - number
      - prompt
      - required
      - level
      - topic
      properties:
        number:
          type: integer
          description: Question number (must be positive and unique within policy)
          minimum: 1
        prompt:
          type: string
          description: The question prompt text
        required:
          type: boolean
          description: Whether the question requires an answer
        level:
          type: string
          description: The level at which the question applies
          enum: [organizational, asset]
        assetLevel:
          type: array
          description: Asset types this question applies to (required when level is
            asset)
          items:
            type: string
            enum: [use-case, model, agent]
        topic:
          type: string
          description: The topic category for the question
        prerequisiteQuestionNumber:
          type: integer
          description: Question number that must be answered first
          nullable: true
        prerequisiteAnswerChoice:
          type: string
          description: Required answer to prerequisite question
          nullable: true
        version:
          type: string
          description: Version identifier for the question
          maxLength: 50
          nullable: true
    createPolicyRequest:
      type: object
      description: Request to create a new policy with associated questions.
      required:
      - name
      - source
      - geographies
      - questions
      - organizationId
      - createdBy
      properties:
        name:
          type: string
          description: Policy name
          minLength: 1
          maxLength: 255
        source:
          type: string
          description: Source of the policy
          enum: [internal, external]
        classificationOptions:
          type: array
          description: Classification options (must be provided with classificationTypes)
          items:
            type: string
        classificationTypes:
          type: object
          description: Mapping of classification options to types (must be provided
            with classificationOptions)
          additionalProperties:
            type: string
            enum: [standard-risk, high-risk, prohibited]
        geographies:
          type: array
          description: Geographic regions where policy applies
          minItems: 1
          items:
            type: string
        questions:
          type: array
          description: Questions associated with the policy
          minItems: 1
          items:
            $ref: "#/components/schemas/createQuestionRequest"
        organizationId:
          type: string
          format: uuid
          readOnly: true
          description: Organization ID
        description:
          type: string
          description: Detailed policy description
          maxLength: 2000
          nullable: true
        version:
          type: string
          description: Policy version identifier
          maxLength: 50
          nullable: true
        tags:
          type: array
          description: Tags for categorization
          maxItems: 20
          items:
            type: string
        governingBody:
          type: string
          description: Organization or authority governing this policy
          maxLength: 255
          nullable: true
        policyProvider:
          type: string
          description: Provider or source of the policy
          maxLength: 255
          nullable: true
        penaltyForNonCompliance:
          type: string
          description: Penalties for violating this policy
          maxLength: 500
          nullable: true
        policyIdentifier:
          type: string
          description: |
            Optional - Unique 6-character alphanumeric identifier for the policy.
            If not provided, a random 6-character alphanumeric ID is auto-generated.
            Accepts uppercase and lowercase; stored as uppercase. Pattern: ^[A-Za-z0-9]{6}$
          maxLength: 6
          pattern: "^[A-Za-z0-9]{6}$"
        createdBy:
          type: string
          description: User ID who created the policy
