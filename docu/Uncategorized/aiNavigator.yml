          type: integer
          description: Display order of the question within the policy
        question:
          type: string
          description: The question text
        requirementLevel:
          type: string
          enum: [required, optional]
          description: Whether the question must be answered
        questionLevel:
          type: string
          enum: [organizational, asset]
          description: Scope of the question
        questionSource:
          type: string
          description: How the question was assigned
