        steps:
          type: string
          description: Workflow steps the agent follows. Visible when assetType=agent.
        skillsServiceOfferings:
          type: string
          description: Skills or service offerings. Visible when assetType=agent.
        communicationProtocol:
          type: string
          enum: [a2a, mcp, fipa-acl]
          description: Inter-agent communication protocol. Visible when assetType=agent.
        externalToolsAndApis:
          type: string
          description: External tools and APIs used. Visible when assetType=agent.
        autonomyLevel:
          type: string
          description: Degree of autonomy. Visible when assetType=agent.
        perceptionMechanisms:
          type: string
          description: How the agent perceives its environment. Visible when assetType=agent.
        memoryArchitecture:
          type: string
          enum: [short-term, long-term, episodic, consensus-memory, vector-databases]
          description: Type of memory architecture. Visible when assetType=agent.
        planningAndDecisionMakingLogic:
          type: string
          description: Planning and decision-making approach. Visible when assetType=agent.
        learningMechanisms:
          type: string
          enum: [reinforcement-learning, incremental, lifelong-learning, feedback-loops]
          description: How the agent learns and adapts. Visible when assetType=agent.
        toolUseStrategy:
          type: string
          description: Strategy for selecting and using tools. Visible when assetType=agent.
        multiAgentCoordination:
          type: string
          description: How the agent coordinates with other agents. Visible when assetType=agent.
        goalSetting:
          type: string
          description: How goals are defined and managed. Visible when assetType=agent.
        guardrailsApplied:
          type: string
          description: Safety guardrails applied. Visible when assetType=agent.
        links:
          type: array
          description: Array of reference links to external resources.
          items:
