            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response404OrganizationProfileNotFound:
      description: Organization profile not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response404PolicyNotFound:
      description: Policy not found
      content:
