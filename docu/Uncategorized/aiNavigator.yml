  /organizations/{orgId}/assets/{assetId}:
    get:
      tags:
      - Assets
      summary: Get Asset by ID or Change Log
      description: |
        Retrieves a single asset by its ID OR its change log based on Accept header.

        **Content Negotiation:**
        - Default (no Accept header, `*/*`, or `application/json`) → enriched response with
          resolved display names (ownerName, createdByName, etc.) and computed counts.
        - `application/vnd.sas.resource+json` → raw domain response without enrichment.
        - Other specific media types (see below) → specialised views (relationships, changelog, etc.).

        **Asset Details:**
        - Accept: application/vnd.sas.ainavigator.asset+json (or other asset media types)
        - Returns full asset with properties, development info, data governance, etc.

        **Change Log:**
        - Accept: application/vnd.sas.ainavigator.assets.changelog+json
        - Returns chronological history of changes and events
        - Pagination and filtering parameters apply only to changelog requests

        Change log includes all audit trail events:
        - Asset creation
        - Assessment approval
        - Alert appearance, resolution, dismissal
        - Asset linkages
        - Policy assignment/classification (Use Cases only)
        - Version changes (Models/Agents/AI Systems only)
      operationId: getAsset
      security:
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/orgId"
      - name: assetId
        in: path
        required: true
        description: UUID of the asset
        schema:
          type: string
          format: uuid
      - name: assetType
        in: query
        required: false
        description: >
          Type of asset. Optional — if omitted, the asset type is resolved
          from the database. If provided, must be one of the listed values
          (the value is informational only; routing uses the stored type).
        schema:
          type: string
          enum: [model, agent, use-case]
      - name: start
        in: query
        description: Zero-based offset for pagination
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Maximum number of items to return (max 100; values above 100
          are silently clamped)
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: sortBy
        in: query
        description: Sort order for changelog. Ignored for asset details.
        schema:
          type: string
          enum:
          - CREATED_AT_DESC
          - CREATED_AT_ASC
          default: CREATED_AT_DESC
      - name: eventType
        in: query
        description: Filter changelog by event types (comma-separated). Ignored for
          asset details.
        schema:
          type: array
          items:
            type: string
            enum:
            - ASSET_CREATED
            - ASSESSMENT_APPROVED
            - ALERT_CREATED
            - ALERT_RESOLVED
            - ALERT_DISMISSED
            - ASSET_LINKED
            - ASSET_UNLINKED
            - POLICY_APPLIED
            - POLICY_REMOVED
            - POLICY_CLASSIFICATION_CHANGED
            - VERSION_CHANGED
        style: form
        explode: false
      - name: userId
        in: query
        description: Filter changelog by user who performed the action. Ignored for
          asset details.
        schema:
          type: string
          format: uuid
      - name: startDate
        in: query
        description: Filter changelog from date (inclusive). Ignored for asset details.
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Filter changelog until date (inclusive). Ignored for asset details.
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: |
            Asset details with field visibility controlled by Accept header.
            - Complete representations return all entity fields (32 for Model, 32 for Agent, 32 for UseCase)
            - View representations return filtered subsets (e.g., only dataGovernance fields)
            - Same underlying entity, different projections based on media type
          headers:
            ETag:
              description: Entity tag for cache validation
              schema:
                type: string
          content:
            application/vnd.sas.ainavigator.asset+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Model"
                - $ref: "#/components/schemas/Agent"
                - $ref: "#/components/schemas/UseCase"
                discriminator:
                  propertyName: assetType
                  mapping:
                    model: "#/components/schemas/Model"
                    agent: "#/components/schemas/Agent"
                    use-case: "#/components/schemas/UseCase"
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/EnrichedModel"
                - $ref: "#/components/schemas/EnrichedAgent"
                - $ref: "#/components/schemas/EnrichedUseCase"
                discriminator:
                  propertyName: assetType
                  mapping:
                    model: "#/components/schemas/EnrichedModel"
                    agent: "#/components/schemas/EnrichedAgent"
                    use-case: "#/components/schemas/EnrichedUseCase"
            application/vnd.sas.resource+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Model"
                - $ref: "#/components/schemas/Agent"
                - $ref: "#/components/schemas/UseCase"
                discriminator:
                  propertyName: assetType
                  mapping:
                    model: "#/components/schemas/Model"
                    agent: "#/components/schemas/Agent"
                    use-case: "#/components/schemas/UseCase"
            application/vnd.sas.ainavigator.model+json:
              schema:
                $ref: "#/components/schemas/Model"
            application/vnd.sas.ainavigator.model.development+json:
              schema:
                $ref: "#/components/schemas/ModelWithDevelopment"
            application/vnd.sas.ainavigator.agent+json:
              schema:
                $ref: "#/components/schemas/Agent"
            application/vnd.sas.ainavigator.usecase+json:
              schema:
                $ref: "#/components/schemas/UseCase"
            application/vnd.sas.ainavigator.asset.assessments+json:
              schema:
                $ref: "#/components/schemas/AssetAssessments"
            application/vnd.sas.ainavigator.asset.alerts+json:
              schema:
                $ref: "#/components/schemas/AssetAlerts"
            application/vnd.sas.ainavigator.asset.relationships+json:
              schema:
                $ref: "#/components/schemas/AssetRelationshipsView"
            application/vnd.sas.ainavigator.asset.referencelinks+json:
              schema:
                $ref: "#/components/schemas/AssetReferenceLinks"
            application/vnd.sas.ainavigator.assets.changelog+json:
              schema:
                $ref: "#/components/schemas/ChangeLogResponse"
        "400":
          $ref: "#/components/responses/response400InvalidRequest"
        "401":
          $ref: "#/components/responses/response401AuthenticationRequiredOrInvalid"
        "403":
          $ref: "#/components/responses/response403UserLacksRequiredPermissions"
        "404":
          $ref: "#/components/responses/response404ResourceNotFound"
    put:
      tags:
      - Assets
      summary: Update Asset
      description: Updates an existing asset within the specified organization
      operationId: updateAsset
      security:
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/orgId"
      - name: assetId
        in: path
        required: true
        description: UUID of the asset
        schema:
          type: string
          format: uuid
      - name: assetType
        in: query
        required: false
        description: Type of asset
        schema:
          type: string
          enum: [model, agent, use-case]
      requestBody:
        required: true
        description: |
          Request body format depends on Content-Type:
          - application/json: Standard asset update (Model, Agent, or UseCase fields)
          - application/vnd.sas.ainavigator.asset.relationships+json: Full replacement of
            asset relationships. Body is an array of AssetLinkInput objects. Sending an empty
            array removes all links. Only use-case and agent asset types support this.
          - application/vnd.sas.ainavigator.asset.referencelinks+json: Full replacement of
            reference links. Body is an array of UpsertLinkRequest objects. Entries with an id
            are upserted (updated if the ID exists, created with that ID if not found); entries
            without an id are created with a server-generated UUID; existing IDs omitted from
            the array are deleted. Sending an empty array removes all reference links.
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/Model"
              - $ref: "#/components/schemas/Agent"
              - $ref: "#/components/schemas/UseCase"
              discriminator:
                propertyName: assetType
                mapping:
                  model: "#/components/schemas/Model"
                  agent: "#/components/schemas/Agent"
                  use-case: "#/components/schemas/UseCase"
          application/vnd.sas.ainavigator.asset.relationships+json:
            schema:
              type: array
              description: |
                Full replacement of all asset relationships for this container asset.
                Each item specifies a contained asset to link, with an optional role.
                Sending an empty array removes all existing links.
                Only use-case and agent asset types support relationship updates;
                model returns 400.
              items:
                $ref: "#/components/schemas/AssetLinkInput"
          application/vnd.sas.ainavigator.asset.referencelinks+json:
            schema:
              type: array
              description: |
                Full replacement of all reference links for this asset.
                Entries with an id are upserted: updated if the ID exists in this asset's
                links, or created with that ID if not found. Entries without an id are
                created with a server-generated UUID. Existing IDs omitted from the array
                are deleted. Sending an empty array removes all reference links.
              items:
                type: object
                required: [url, displayText]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: >
                      Omit to create a new entry with a server-generated UUID.
                      Provide to upsert: the entry is updated if this ID exists in
                      the
                      asset's current links, or created with this ID if not found.
                  url:
                    type: string
                    format: uri
                  displayText:
                    type: string
      responses:
        "200":
          description: |
            Asset updated successfully.
            - When Content-Type is application/json: returns complete asset entity with all fields.
            - When Content-Type is application/vnd.sas.ainavigator.asset.relationships+json:
              returns AssetRelationshipsView with the updated relationship state.
            - When Content-Type is application/vnd.sas.ainavigator.asset.referencelinks+json:
              returns AssetReferenceLinks with the updated reference links state.
          content:
            application/vnd.sas.ainavigator.asset+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Model"
                - $ref: "#/components/schemas/Agent"
                - $ref: "#/components/schemas/UseCase"
                discriminator:
                  propertyName: assetType
                  mapping:
                    model: "#/components/schemas/Model"
                    agent: "#/components/schemas/Agent"
                    use-case: "#/components/schemas/UseCase"
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/Model"
                - $ref: "#/components/schemas/Agent"
                - $ref: "#/components/schemas/UseCase"
                discriminator:
                  propertyName: assetType
                  mapping:
                    model: "#/components/schemas/Model"
                    agent: "#/components/schemas/Agent"
                    use-case: "#/components/schemas/UseCase"
            application/vnd.sas.ainavigator.asset.relationships+json:
              schema:
                $ref: "#/components/schemas/AssetRelationshipsView"
            application/vnd.sas.ainavigator.asset.referencelinks+json:
              schema:
                $ref: "#/components/schemas/AssetReferenceLinks"
        "400":
          $ref: "#/components/responses/response400InvalidRequest"
        "401":
          $ref: "#/components/responses/response401AuthenticationRequiredOrInvalid"
        "403":
          $ref: "#/components/responses/response403UserLacksRequiredPermissions"
        "404":
          $ref: "#/components/responses/response404ResourceNotFound"
    delete:
      tags:
      - Assets
      summary: Delete Asset
      description: |
        Soft deletes an asset within the specified organization.

        **Authorization:**
        - Asset Owner: Can delete own assets
        - Administrator: Can delete any asset
        - Others: 403 Forbidden

        **Business Rules:**

        Use Case Constraints:
        - CANNOT delete if deploymentStatus = "deployed"
        - Must change to "not-deployed" or "retired" first
        - Linked assets (Models, Agents) are NOT deleted, only unlinked

        Model/Agent/AI System Constraints:
        - CANNOT delete if linked to any active use case
        - Must unlink from all use cases before deletion
        - 409 response includes list of blocking use cases

        **Soft Delete:**
        - Asset marked deleted (deleted_at timestamp set)
        - 30-day retention before permanent deletion
        - 7-day warning notification before permanent deletion
        - Deleted assets excluded from standard queries
        - Can be restored within retention period (separate endpoint)

        **Data Handling:**

        Deleted:
        - Asset entity and all properties
        - Current assessment responses (not approved ones)
        - Active alerts specific to asset
        - Asset relationships (links)
        - Permission group associations

        Preserved (Audit Trail):
        - Deletion audit record (who, when, asset snapshot)
        - Historical policy applications/removals
        - Approved assessment responses at deletion time
        - Change log entries
        - Historical resolved alerts
      operationId: deleteAsset
      security:
      - bearerAuth: []
      parameters:
      - $ref: "#/components/parameters/orgId"
      - name: assetId
        in: path
        required: true
        description: UUID of the asset
        schema:
          type: string
          format: uuid
      - name: assetType
        in: query
        required: false
        description: Type of asset - validates type-specific business rules
        schema:
          type: string
          enum: [model, agent, use-case]
      responses:
        "204":
          description: Asset soft deleted successfully
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                invalidUUID:
                  summary: Invalid UUID path parameter
                  value:
                    error:
                      code: 4002
                      message: "Invalid UUID format"
                invalidAssetType:
                  summary: Invalid assetType value
                  value:
                    error:
                      code: 4002
                      message: "Invalid query parameter value"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "401":
          $ref: "#/components/responses/response401AuthenticationRequiredOrInvalid"
        "403":
          description: User lacks required permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                insufficientPermissions:
                  summary: User cannot delete this asset
                  value:
                    error:
                      code: 4030
                      message: "Insufficient permissions to delete this asset"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                assetNotFound:
                  summary: Asset does not exist
                  value:
                    error:
                      code: 4040
                      message: "Asset not found"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "409":
          description: Conflict - asset cannot be deleted due to business rule violations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                useCaseDeployed:
                  summary: Use case has DEPLOYED status
                  value:
                    error:
                      code: 4090
                      message: "Cannot delete use case with deployed status"
                modelLinkedToUseCases:
                  summary: Model linked to active use cases
                  value:
                    error:
                      code: 4090
                      message: "Cannot delete model that is linked to active use cases"
                agentLinkedToUseCases:
                  summary: Agent linked to active use cases
                  value:
                    error:
                      code: 4090
                      message: "Cannot delete agent that is linked to active use cases"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
