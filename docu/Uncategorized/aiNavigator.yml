                updatedAt: "2026-01-15T10:30:00Z"
        "401":
          $ref: "#/components/responses/response401Unauthorized"
        "404":
          $ref: "#/components/responses/response404NotificationNotFound"
    delete:
      operationId: deleteNotification
      tags:
      - Notifications
      summary: Delete notification
      description: >
        Soft delete a single notification. The notification is no longer
