        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          readOnly: true
        policyId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
          nullable: true
          description: Null for organizational assessments, set for asset-level assessments
        active:
          type: boolean
          description: Whether this is the current active assessment for the policy
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
