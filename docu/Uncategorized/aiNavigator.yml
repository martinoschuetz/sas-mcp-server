---
openapi: 3.0.3
info:
  title: AI Navigator
  description: The AI Navigator core API is used to manage an organization, its users,
    and assets in the AI Navigator solution.
  version: "1"
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: https://developer.sas.com
servers:
- url: https://api.example.com/aiNavigator/v1
  description: Production server
- url: https://staging-api.example.com/aiNavigator/v1
  description: Staging server
- url: https://mock.example.com/aiNavigator/v1
  description: Mock server for development
tags:
- name: Root
  description: API root endpoint providing links to top-level resources.
- name: Organizations
  description: Organization (tenant) management.
- name: Users
  description: User management within organizations.
- name: Groups
  description: Group management and membership.
- name: Roles
  description: Role and permission management for RBAC.
- name: Assets
  description: |
    Asset management with RBAC and polymorphic support.
    Supports multiple asset types (model, agent, use-case) via assetType discriminator.
- name: DataSets
  description: |
    Dataset management for model data governance.
    Datasets are sub-resources of models, representing data governance information.
- name: Alerts
  description: |
    Alert management for compliance, risk, and operational notifications.
    Supports asset-level and organization-level alerts with dismissal workflow.
- name: Assessments
  description: |
    Assessment management for policy compliance tracking.
    Assessments capture answers to policy questions for an organization or asset.
- name: Notifications
  description: |
    User notification management for system events.
    Supports notification CRUD, read tracking, bulk operations, and per-type delivery preferences.
- name: Dashboard
  description: |
    Dashboard aggregation endpoints for organizational reporting.
    Read-only analytics on health, metrics, assessments, risk, and governance.
- name: Import
  description: |
    Asset import wizard endpoints for bulk creation and field-mapping template management.
    Supports schema mapping templates and all-or-nothing batch asset creation.
- name: ReferenceData
  description: |
    Public reference data endpoints serving static enum values for client UI.
    Unauthenticated by exception — see SAIDNAVAI-3012. No tenant-scoped data.
security:
- bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication for API access.
    m2mAuth:
      type: oauth2
      description: |
        Machine-to-machine authentication for /admin/tenants endpoints. The
        bearer token is an admin-audience JWT issued by the control plane and
        carries `tenants:read` and/or `tenants:write` scopes. These routes
        are mounted outside the standard ValidateOrgContext chain because
        M2M tokens carry no org_id claim.
      flows:
        clientCredentials:
          tokenUrl: https://ain.local/oauth/token
          scopes:
            tenants:read: Read tenant and subscription state
            tenants:write: Provision and update tenants
  parameters:
    orgId:
      name: orgId
      in: path
      required: true
      description: Internal AIN organization UUID (server-generated UUID v7).
      schema:
        type: string
        format: uuid
    oidcOrgID:
      name: oidcOrgID
      in: path
      required: true
      description: |
        Auth0 / OIDC org_id used as the cross-system join key. This is the
        external identifier supplied at provisioning time and stored as
        `organizations.tenant_id`. Distinct from the internal UUID `orgId`.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: "^[A-Za-z0-9._-]+$"
    assetId:
      name: assetId
      in: path
      required: true
      description: Asset ID
      schema:
        type: string
        format: uuid
    userId:
      name: userId
      in: path
      required: true
      description: User ID
      schema:
        type: string
    groupId:
      name: groupId
      in: path
      required: true
      description: Group ID
      schema:
        type: string
        format: uuid
    roleId:
      name: roleId
      in: path
      required: true
      description: Role ID
      schema:
        type: string
        format: uuid
    policyId:
      name: policyId
      in: path
      required: true
      description: Policy ID
      schema:
        type: string
        format: uuid
    alertId:
      name: alertId
      in: path
      required: true
      description: Alert ID
      schema:
        type: string
        format: uuid
  responses:
    response400BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response400BadRequestInvalidUuid:
      description: Bad request (invalid UUID or query parameters)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response400BadRequestInvalidBody:
      description: Bad request (invalid body, too many items, duplicates)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response400BadRequestValidationError:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response400BadRequestInvalidQuery:
      description: Bad request — invalid query parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response400InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response400InvalidRequestParameters:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response400MissingOrInvalidAssettype:
      description: Missing or invalid assetType query parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response400ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response401AuthenticationRequired:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response401AuthenticationRequiredOrInvalid:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response401Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response403Forbidden:
      description: |
        Forbidden. The response `code` field distinguishes the cause; clients
        should branch on it rather than on the localized `message`. Possible
        codes: `FORBIDDEN` (4030), `FORBIDDEN_TENANT_ACCESS` (4031),
        `ORGANIZATION_NOT_PROVISIONED` (4032), `ACCOUNT_NOT_ACTIVE` (4033),
        `ACCOUNT_SUSPENDED` (4035), `ACCOUNT_IN_EXPORT_GRACE` (4036),
        `IDENTITY_MISMATCH_REJECTED` (4038). Lifecycle codes (4035, 4036, plus
        the 410 `ACCOUNT_FINALIZED` 4037) drive the frontend's
        status-aware `/account/{suspended,export,finalized}` pages.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response403ForbiddenCallerLacksGroup:
      description: Forbidden — caller lacks group:edit permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response403UserLacksRequiredPermissions:
      description: User lacks required permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response404AlertNotFound:
      description: Alert not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response404AnswerNotFound:
      description: Answer not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response404AppliedPolicyNotFound:
      description: Applied policy not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response404AssetNotFound:
      description: Asset not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response404AssetNotFoundOr:
      description: Asset not found or not in soft-deleted state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response404AssetNotInGroup:
      description: |
        Resource not found. Returned when the asset does not exist within the
        organization, or when the asset is not a member of the specified group.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response404DatasetOrModelNot:
      description: Dataset or model not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response404GroupNotFound:
      description: Group not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    response404NotificationNotFound:
      description: Notification not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
        application/vnd.sas.error+json:
