      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/assessment"
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    assetAssessmentSummaryResponse:
      type: object
      description: Aggregated assessment data for an asset across all applied policies.
        Use-case assets include org-level answers and answers from linked models and
        agents in counts; models and agents report asset-level counts only.
      required:
      - assetId
      - assetName
      - overallStatus
      - approvalPercentage
      - totalQuestions
      - submittedQuestions
      - approvedQuestions
      - policies
      properties:
        assetId:
          type: string
          format: uuid
          description: The asset ID.
        assetName:
          type: string
          description: The asset name.
        includesGenerativeAI:
          type: string
          enum: [yes, no]
          nullable: true
          description: Whether this asset includes generative AI. For use cases, derived
            from linked child assets.
        overallStatus:
          type: string
          enum:
          - incomplete
          - in_progress
          - approved
          description: "Overall status: all approved -> approved, any completed ->\
            \ in_progress, all incomplete -> incomplete."
        approvalPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Rounded integer 0-100 percentage of questions with status=approved
            within the in-scope set.
        totalQuestions:
          type: integer
          format: int64
          minimum: 0
          description: Total number of questions across all policies in scope.
        submittedQuestions:
          type: integer
          format: int64
          minimum: 0
          description: Count of questions with status=submitted within the in-scope
            set, exclusive of approved.
        approvedQuestions:
          type: integer
          format: int64
          description: Number of questions with status approved.
        policies:
          type: array
          description: Per-policy assessment breakdown. Empty array if no assessments
            exist.
          items:
            $ref: "#/components/schemas/policyAssessmentSummaryItem"
    policyAssessmentSummaryItem:
      type: object
      description: Assessment summary for a single policy applied to an asset. Use-case
        assets include org-level answers and answers from linked models and agents
        in counts; models and agents report asset-level counts only.
      required:
      - id
      - name
      - status
      - approvalPercentage
      - totalQuestions
      - submittedQuestions
      - approvedQuestions
      properties:
        id:
          type: string
          format: uuid
          description: The policy ID.
        name:
          type: string
          description: The policy name.
        status:
          type: string
          enum:
          - incomplete
          - in_progress
          - approved
          description: "Policy status: all approved -> approved, any submitted/approved\
            \ -> in_progress, all incomplete -> incomplete."
        approvalPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Rounded integer 0-100 percentage of questions with status=approved
            for this policy within the in-scope set.
        totalQuestions:
          type: integer
          format: int64
          minimum: 0
          description: Total number of questions for this policy in scope.
        submittedQuestions:
          type: integer
          format: int64
          minimum: 0
          description: Count of questions with status=submitted for this policy, exclusive
            of approved.
        approvedQuestions:
          type: integer
          format: int64
          description: Number of questions with status approved.
    notification:
      type: object
      description: User-facing notification for system events.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
        notificationType:
          type: string
          enum:
          - new-alert-on-asset
          - missing-asset-owner
          - assigned-as-asset-owner
          - designated-as-approver
          - policy-applied-to-use-case
          - ownership-transferred-to-user
          - ownership-transferred-from-user
          - asset-linked-to-use-case
          - asset-pending-deletion
        title:
          type: string
          maxLength: 255
        message:
          type: string
        referenceId:
          type: string
          format: uuid
          nullable: true
          description: ID of the referenced entity (asset, alert, etc.)
        referenceType:
          type: string
          nullable: true
          description: Type of the referenced entity
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Extensible JSON for template variables or extra context
        isRead:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    enrichedNotification:
      allOf:
      - $ref: "#/components/schemas/notification"
      - type: object
        description: |
          Enriched notification with resolved asset and alert context.
          Returned by default (application/json or no Accept header).
          Send Accept: application/vnd.sas.resource+json for raw notification without enrichment.
        properties:
          asset:
            type: object
            nullable: true
            description: Summary of the referenced asset (resolved from referenceId
              when referenceType=asset)
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              assetType:
                type: string
                enum: [model, agent, use-case]
              includesGenerativeAI:
                type: string
                enum: [yes, no]
                nullable: true
                description: Whether this asset includes generative AI. For use cases,
                  derived from linked child assets.
              ownerName:
                type: string
                nullable: true
          alert:
            type: object
            nullable: true
            description: Summary of the referenced alert (resolved when notificationType=new-alert-on-asset)
            properties:
              id:
                type: string
                format: uuid
              alertType:
                type: string
              alertSeverity:
                type: string
                enum: [low, medium, high]
              description:
                type: string
