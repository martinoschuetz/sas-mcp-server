    DevelopmentUpdateRequest:
      type: object
      description: |
        Request body for creating or updating development information.
        All fields are optional for partial updates.
        Field applicability depends on asset type and includesGenerativeAI value.
      properties:
        link:
          type: string
          description: Link to model source or documentation
        function:
          type: array
          items:
            type: string
            enum: [CLASSIFICATION, REGRESSION, CLUSTERING, ANOMALY_DETECTION, RECOMMENDATION,
              GENERATION, SUMMARIZATION, TRANSLATION, OTHER]
          description: Primary function(s) the model performs.
        developer:
          type: string
          description: Name of the person or team who developed the model.
        assetLastModifiedDate:
          type: string
          description: Date when the model asset was last modified.
        executionTool:
          type: string
          description: Tool or platform used to execute the model.
        executionToolVersion:
          type: string
          description: Version of the execution tool.
        executionRequirements:
          type: string
          description: Requirements for executing the model.
        monitoringTool:
          type: string
          description: Tool used to monitor the model in production.
        costs:
          type: string
          description: Cost associated with running or maintaining the model.
        inputType:
          type: string
          enum: [TABULAR, TEXT, IMAGE, AUDIO, VIDEO, MULTIMODAL, OTHER]
          description: Visible when includesGenerativeAI=NO.
        inputVariableNames:
          type: array
          items:
            type: string
          description: Names of input variables. Visible when includesGenerativeAI=NO.
        outputType:
          type: string
          enum: [TABULAR, TEXT, IMAGE, AUDIO, VIDEO, MULTIMODAL, OTHER]
          description: Type of output produced. Visible when includesGenerativeAI=NO.
        outputVariableNames:
          type: array
          items:
            type: string
          description: Names of output variables. Visible when includesGenerativeAI=NO.
        algorithms:
          type: string
          description: Algorithm(s) used in the model. Visible when includesGenerativeAI=NO.
        developmentCodeLanguages:
          type: string
          description: Programming language(s) used during development. Visible when
            includesGenerativeAI=NO.
        executionCodeLanguages:
          type: string
          description: Programming language(s) used for execution. Visible when includesGenerativeAI=NO.
        developmentTool:
          type: string
          description: Tool used for model development. Visible when includesGenerativeAI=NO.
        developmentToolVersion:
          type: string
          description: Version of the development tool. Visible when includesGenerativeAI=NO.
        targetVariable:
          type: string
          description: Target variable the model predicts. Visible when includesGenerativeAI=NO.
        targetLevel:
          type: string
          enum: [BINARY, NOMINAL, ORDINAL, INTERVAL]
          description: Measurement level of the target variable. Visible when includesGenerativeAI=NO.
        targetValues:
          type: array
          items:
            type: string
          description: Possible values of the target variable. Visible when includesGenerativeAI=NO.
        targetEventValue:
          type: array
          items:
            type: string
          description: Event value(s) for classification models. Visible when includesGenerativeAI=NO.
        outputEventPredictionVariable:
          type: string
          description: Output variable containing event predictions. Visible when
            includesGenerativeAI=NO.
        outputEventProbabilityVariable:
          type: string
          description: Output variable containing event probabilities. Visible when
            includesGenerativeAI=NO.
        outputSegmentationVariable:
          type: string
          description: Output variable for segmentation results. Visible when includesGenerativeAI=NO.
        outputClusterVariable:
          type: string
          description: Output variable for clustering results. Visible when includesGenerativeAI=NO.
        outputGenerationVariable:
          type: string
          description: Output variable for generated content. Visible when includesGenerativeAI=NO.
        baseModel:
          type: string
          description: Base foundation model used. Visible when includesGenerativeAI=Yes.
        finetuningDataset:
          type: string
          description: Dataset used for fine-tuning. Visible when includesGenerativeAI=Yes.
        apiEndpoint:
          type: string
          description: API endpoint URL for accessing the model. Visible when includesGenerativeAI=Yes.
        contextWindowSize:
          type: integer
          description: Maximum context window size in tokens. Visible when includesGenerativeAI=Yes.
        licenseType:
          type: string
          enum: [commercial, open-source, research]
          description: License type governing model usage. Visible when includesGenerativeAI=Yes.
        rateLimits:
          type: string
          description: Rate limits for API calls. Visible when includesGenerativeAI=Yes.
        usageRestrictions:
          type: string
          description: Restrictions on model usage. Visible when includesGenerativeAI=Yes.
        costPerInputToken:
          type: number
          format: double
          description: Cost per input token in USD. Visible when includesGenerativeAI=Yes.
        costPerOutputToken:
          type: number
          format: double
          description: Cost per output token in USD. Visible when includesGenerativeAI=Yes.
        promptTemplates:
          type: string
          description: Prompt templates for using the model. Visible when includesGenerativeAI=Yes.
        modelFamily:
          type: string
          description: Foundation model family name. Visible when includesGenerativeAI=Yes.
        accessMethod:
          type: string
          enum: [api, on-premise, fine-tuned-instance, hosted-service, cloud-platform,
