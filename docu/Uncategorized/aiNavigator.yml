    delete:
      operationId: removeGroupMember
      tags:
      - Groups
      summary: Remove a user from a group
      description: >
        Removes the association between the given user and group within the
        given organization. This operation is idempotent — if the user is not
        currently a member of the group the request succeeds with 204. The user
        and group entities themselves are not deleted.
        Cross-tenant requests return 403 (forbidden) — the authenticated
        tenant does not match the requested organization.
      security:
      - bearerAuth: []
      responses:
        "204":
          description: Member removed (or was already not a member — idempotent)
        "400":
          description: Bad request — malformed path parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "403":
          $ref: "#/components/responses/response403ForbiddenCallerLacksGroup"
        "404":
          description: Group not found in organization (also returned for cross-tenant
            requests)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "500":
          $ref: "#/components/responses/response500InternalServerError"
