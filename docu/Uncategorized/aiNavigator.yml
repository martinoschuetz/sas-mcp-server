    ModelWithDevelopment:
      description: |
        Model entity with development information included.
        Returned when Accept header is application/vnd.sas.ainavigator.model.development+json.
      allOf:
      - $ref: "#/components/schemas/Model"
      - type: object
        properties:
          development:
            $ref: "#/components/schemas/Development"
    alert:
      type: object
      description: Alert entity representing compliance, risk, or operational notifications.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          readOnly: true
        alertType:
          type: string
          enum:
          - missing-assessments
          - deployed-without-approval
          - no-assigned-owner
          - owner-account-inactive
          - no-assigned-approver
          - no-linked-data
          - linked-asset-version-changed
          - no-active-admins
          - max-use-case-missing-org-answers
          - platform-connection-issue
        alertScope:
          type: string
          enum: [asset-level, organization-level]
        alertStatus:
          type: string
          enum: [active, resolved, dismissed]
        alertSeverity:
          type: string
          enum: [low, medium, high]
        assetId:
          type: string
          format: uuid
          nullable: true
          description: "Required when alertScope=asset-level, must be null when alertScope=organization-level"
        policyId:
          type: string
          format: uuid
          nullable: true
          description: "Optional for organization-level policy alerts, must be null\
            \ for asset-level alerts"
        affectedUseCaseCount:
          type: integer
          nullable: true
          description: "Number of affected use cases (for organization-level alerts)"
        dismissedAt:
          type: string
          format: date-time
          nullable: true
        dismissedByUserId:
          type: string
          format: uuid
          nullable: true
        dismissalJustification:
          type: string
          nullable: true
          minLength: 10
          maxLength: 500
        dismissedUntil:
          type: string
          format: date-time
          nullable: true
          description: "Suppression period end date"
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        descriptionTemplateKey:
          type: string
          description: "i18n bundle key for alert description"
        templateVariables:
          type: object
          additionalProperties: true
          description: "Dynamic variables for template rendering"
        description:
          type: string
          description: "Rendered alert description"
        count:
          type: integer
          description: "Occurrence count for consolidated alerts"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: "Version for optimistic locking"
    alertListResponse:
      type: object
      description: Paginated list of alerts.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/alert"
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    enrichedAlert:
      type: object
      description: >
        Denormalized enriched alert with flat asset and user metadata.
        This is the default response for alert GET endpoints.
        Send Accept: application/json to receive the raw domain response instead.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          readOnly: true
        alertType:
          type: string
          enum:
          - missing-assessments
          - deployed-without-approval
          - no-assigned-owner
          - owner-account-inactive
          - no-assigned-approver
          - no-linked-data
          - linked-asset-version-changed
          - no-active-admins
          - max-use-case-missing-org-answers
          - platform-connection-issue
        alertScope:
          type: string
          enum: [asset-level, organization-level]
        alertStatus:
          type: string
          enum: [active, resolved, dismissed]
        alertSeverity:
          type: string
          enum: [low, medium, high]
        assetId:
          type: string
          format: uuid
          nullable: true
          description: "Asset ID when alertScope=asset-level"
        assetName:
          type: string
          nullable: true
          description: "Asset name resolved from asset lookup (enriched)"
        assetType:
          type: string
          nullable: true
          description: "Asset type resolved from asset lookup (enriched)"
        includesGenerativeAI:
          type: string
          enum: [yes, no]
          nullable: true
          description: "Whether the asset includes generative AI. For use cases, derived\
            \ from linked child assets (enriched)."
        ownerName:
          type: string
          nullable: true
          description: "Asset owner display name resolved from asset.ownerID → user\
            \ lookup (enriched)"
        policyId:
          type: string
          format: uuid
          nullable: true
          description: "Policy ID for organization-level policy alerts"
        affectedUseCaseCount:
          type: integer
          nullable: true
          description: "Number of affected use cases (for organization-level alerts)"
        dismissedAt:
          type: string
          format: date-time
          nullable: true
        dismissedByUserId:
          type: string
          format: uuid
          nullable: true
        dismissedByName:
          type: string
          nullable: true
          description: "Display name of user who dismissed the alert (enriched)"
        dismissedByEmail:
          type: string
          nullable: true
          format: email
          description: "Email of user who dismissed the alert (enriched)"
        dismissalJustification:
          type: string
          nullable: true
          minLength: 10
          maxLength: 500
        dismissedUntil:
          type: string
          format: date-time
          nullable: true
          description: "Suppression period end date"
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        descriptionTemplateKey:
          type: string
          description: "i18n bundle key for alert description"
        templateVariables:
          type: object
          additionalProperties: true
          description: "Dynamic variables for template rendering"
        description:
          type: string
          description: "Rendered alert description (server-side localized)"
        count:
          type: integer
          description: "Occurrence count for consolidated alerts"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: "Version for optimistic locking"
    enrichedAlertListResponse:
      type: object
      description: Paginated list of enriched alerts with embedded metadata.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/enrichedAlert"
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    alertStatsResponse:
      type: object
      description: Aggregated alert statistics for an organization.
      properties:
        totalActive:
          type: integer
          format: int64
          description: "Count of alerts with active status"
        totalResolved:
          type: integer
          format: int64
          description: "Count of alerts with resolved status"
        totalDismissed:
          type: integer
          format: int64
          description: "Count of alerts with dismissed status"
        highSeverity:
          type: integer
          format: int64
          description: "Count of active alerts with high severity"
        mediumSeverity:
          type: integer
          format: int64
          description: "Count of active alerts with medium severity"
        lowSeverity:
          type: integer
          format: int64
          description: "Count of active alerts with low severity"
    dismissAlertRequest:
      type: object
      description: Request body for dismissing an alert.
      required:
      - justification
      properties:
        justification:
          type: string
          minLength: 10
          maxLength: 500
          description: "Reason for dismissing the alert"
        suppressionDays:
          type: integer
          minimum: 1
          maximum: 365
          description: >
            Optional override for suppression period in days. When omitted,
            the value is read from the organization profile's AlertDismissalConfig
            (default: 7 days). Only validated when explicitly provided.
    metricSummary:
      type: object
      description: Aggregate metrics summarizing completion and approval status of
        answers within an assessment.
      properties:
        answerCount:
          type: integer
          description: Total number of answers in the assessment
        incompleteCount:
          type: integer
          description: Number of answers with incomplete status
        submittedCount:
          type: integer
          description: Number of answers with submitted status
        approvedCount:
          type: integer
          description: Number of answers with approved status
    answerResponse:
      type: object
