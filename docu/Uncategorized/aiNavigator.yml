        status:
          type: string
          enum: [incomplete, submitted, approved]
          description: Current answer status
        version:
          type: integer
          description: Optimistic concurrency version
        answeredAt:
          type: string
          format: date-time
          nullable: true
          description: When the answer was last provided
        answeredBy:
          type: string
          format: uuid
          nullable: true
          description: User ID who last answered
        answeredByName:
          type: string
          nullable: true
          description: Display name of the user who last answered
        approvedAt:
          type: string
          format: date-time
          nullable: true
          description: When the answer was approved
        approvedBy:
          type: string
          format: uuid
          nullable: true
          description: User ID who approved
        approvedByName:
          type: string
          nullable: true
          description: Display name of the approver
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: HATEOAS links for this question
