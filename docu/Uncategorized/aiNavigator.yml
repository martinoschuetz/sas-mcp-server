                name: "Acme Corporation"
                displayName: "ACME Corp"
                status: "active"
                createdAt: "2025-12-02T10:30:00Z"
                updatedAt: "2025-12-02T10:30:00Z"
            application/vnd.sas.ainavigator.organization+json:
              schema:
                $ref: "#/components/schemas/organization"
