    Asset:
      description: |
        Base schema for all asset types.
        Contains common fields shared across models, agents, and use cases.
        Total: 21 common fields.
      type: object
      required:
      - id
      - organizationId
      - name
      - assetType
      - includesGenerativeAI
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
          readOnly: true
        organizationId:
          type: string
          format: uuid
          description: Multi-tenant isolation
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Asset name, unique per organization. Required, must be unique
            within organization.
        assetType:
          type: string
          enum: [model, agent, use-case]
          description: Type discriminator. Required, immutable after creation.
        assetOwner:
          type: string
          description: User responsible for the asset. Required only when permissionGroups
            is non-empty. Must be user with Contributor role or higher; Must be in
            at least one of asset's Permission Groups (UNLESS user is Admin or Compliance
            Officer); Cannot be same as Approver (Use Case only).
        permissionGroups:
          type: array
          items:
            type: string
            format: uuid
          description: Access control groups. Optional; Defaults to "Organization-Wide"
            if empty; When changed, must validate Asset Owner is still in at least
            one group.
        createdTimestamp:
          type: string
          format: date-time
          description: Auto-generated at creation
          readOnly: true
        lastUpdatedTimestamp:
          type: string
          format: date-time
          description: Auto-updated on any field change
          readOnly: true
        createdBy:
          type: string
          description: Auto-set to current user at creation
          readOnly: true
        lastUpdatedBy:
          type: string
          description: Auto-updated to current user on any change
          readOnly: true
        alertCount:
          type: integer
          description: Calculated - Count of active alerts (status = ACTIVE) for this
            asset
          readOnly: true
        assessmentCompletionPercentage:
          type: number
          format: double
          minimum: 0.00
          maximum: 1.00
          description: Calculated - approvedQuestions / totalQuestions; Includes questions
            from linked assets for Use Cases
          readOnly: true
        intendedUse:
          type: string
          description: Business context - Optional
        expectedBenefit:
          type: string
          description: Business context - Optional
        outOfScopeUsage:
          type: string
          description: Business context - Optional
        knownLimitations:
          type: string
          description: Business context - Optional
        targetUsers:
          type: string
          description: Business context - Optional
        expectedVolume:
          type: string
          description: Business context - Optional
        includesGenerativeAI:
          type: string
          enum: ["yes", "no"]
          description: Required; When yes - enables Content Filtering Status field
            (Models/Agents), enables Generative AI fields (modelFamily, accessMethod,
            contentFilteringStatus)
        businessFunction:
          type: array
          items:
            type: string
            enum:
            - Analytics and insights
            - Clinical operations
            - Customer service
            - Engineering and product
            - Environmental and safety
            - Facilities management
            - Finance
            - Human resources
            - Investment management
            - IT and infrastructure
            - Legal and compliance
            - Marketing
            - Operations
            - Quality assurance
            - Sales
            - Security and risk
            - Strategy and planning
            - Supply chain
            - Other
          description: Multi-select business function categories - Optional
        tags:
          type: array
          items:
            type: string
          description: Keywords for categorization - Optional; Free-form text tags
      discriminator:
        propertyName: assetType
        mapping:
          model: "#/components/schemas/Model"
          agent: "#/components/schemas/Agent"
          use-case: "#/components/schemas/UseCase"
    Model:
      description: |
        Complete Model schema.
        Total: 33 fields (21 Asset + 12 Model-specific).
        Media type views filter this schema to show specific field subsets.
      allOf:
      - $ref: "#/components/schemas/Asset"
      - type: object
        required:
        - assetSource
        - assetStage
        properties:
          assetSource:
            type: string
            enum: [internal, external]
            description: Required; Immutable after creation; Determines available
              Asset Stage values
          assetStage:
            type: string
            enum:
            - development
            - testing
            - evaluation
            - pilot
            - production
            - retired
            - prohibited
            description: |
              Lifecycle stage - Required.
              When assetSource = internal: Values are [development, testing, production, retired, prohibited]
              When assetSource = external: Values are [evaluation, pilot, production, retired, prohibited]
              Auto-set to prohibited (read-only) when usageAuthorization = prohibited
              Becomes editable when usageAuthorization changes from prohibited
          usageAuthorization:
            type: string
            enum: [pending, authorized, restricted, prohibited]
            description: |
              Required. Authorization status for model usage. Specifies governance constraints on usage.
              When set to prohibited: Asset Stage auto-set to prohibited and becomes read-only
              Prevents asset from being linked to any Use Case
          vendorProvider:
            type: string
            description: |
              Conditional - Required when assetSource = external; Optional when assetSource = internal
              Examples: "OpenAI", "Anthropic", "Google", "Meta"
          contentFilteringStatus:
            type: string
            enum: [active, inactive, partial]
            description: |
              Conditional - Only visible/editable when includesGenerativeAI = Yes
              Hidden when includesGenerativeAI = No
          authorizationNotes:
            type: string
            description: |
              Optional; Recommended when usageAuthorization = restricted or prohibited
              Provides audit trail for compliance
          versionIdentifier:
            type: string
            description: |
              Optional; Manual text field
              Examples: "1.0", "Nov 2024", "Production"
          modelFamily:
            type: string
            description: |
              Optional; Only visible/editable when includesGenerativeAI = Yes
              Hidden when includesGenerativeAI = No
          accessMethod:
            type: string
            enum: [api, on-premise, fine-tuned-instance, hosted-service, cloud-platform,
              custom-deployment]
            description: |
              Optional; Only visible/editable when includesGenerativeAI = Yes
              Hidden when includesGenerativeAI = No
          trainingDataKnown:
            type: string
            enum: [known, unknown, unsure]
            description: |
              Conditional - Only visible/editable when includesGenerativeAI = Yes
              Whether the training data used by the model is known and documented
          securityMeasures:
            type: string
            description: |
              Optional
              Documents cyber threat protection and access controls
          redTeamingStrategy:
            type: string
            description: |
              Optional
              Documents approach for testing against adversarial scenarios
    Agent:
      description: |
        Complete Agent schema.
        Total: 32 fields (21 Asset + 11 Agent-specific).
        Media type views filter this schema to show specific field subsets.
      allOf:
      - $ref: "#/components/schemas/Asset"
      - type: object
        required:
        - assetSource
        - assetStage
        properties:
          assetSource:
            type: string
            enum: [internal, external]
            description: Required; Immutable after creation; Determines available
              Asset Stage values
          assetStage:
            type: string
            enum:
            - development
            - testing
            - evaluation
            - pilot
            - production
            - retired
            - prohibited
            description: |
              Lifecycle stage - Required.
              When assetSource = internal: Values are [development, testing, production, retired, prohibited]
              When assetSource = external: Values are [evaluation, pilot, production, retired, prohibited]
              Auto-set to prohibited (read-only) when usageAuthorization = prohibited
              Becomes editable when usageAuthorization changes from prohibited
          usageAuthorization:
            type: string
            enum: [pending, authorized, restricted, prohibited]
            description: |
              Required. Authorization status for model usage. Specifies governance constraints on usage.
              When set to prohibited: Asset Stage auto-set to prohibited and becomes read-only
              Prevents asset from being linked to any Use Case
          vendorProvider:
            type: string
            description: |
              Conditional - Required when assetSource = external; Optional when assetSource = internal
              Examples: "OpenAI", "Anthropic", "Google", "Meta"
          contentFilteringStatus:
            type: string
            enum: [active, inactive, partial]
            description: |
              Conditional - Only visible/editable when includesGenerativeAI = Yes
              Hidden when includesGenerativeAI = No
          authorizationNotes:
            type: string
            description: |
              Optional; Recommended when usageAuthorization = restricted or prohibited
              Provides audit trail for compliance
          versionIdentifier:
            type: string
            description: |
              Optional; Manual text field
              Examples: "1.0", "Nov 2024", "Production"
          modelFamily:
            type: string
            description: |
              Optional; Only visible/editable when includesGenerativeAI = Yes
              Hidden when includesGenerativeAI = No
          accessMethod:
            type: string
            enum: [api, on-premise, fine-tuned-instance, hosted-service, cloud-platform,
              custom-deployment]
            description: |
              Optional; Only visible/editable when includesGenerativeAI = Yes
              Hidden when includesGenerativeAI = No
          securityMeasures:
            type: string
            description: |
              Optional
              Documents cyber threat protection and access controls
          redTeamingStrategy:
            type: string
            description: |
              Optional
              Documents approach for testing against adversarial scenarios
    UseCase:
      description: |
        Complete Use Case schema with inheritance.
        Total: 34 fields (21 Asset + 13 UseCase-specific).
        Use Cases extend Asset directly.
        Media type views filter this schema to show specific field subsets.
      allOf:
      - $ref: "#/components/schemas/Asset"
      - type: object
        required:
        - deploymentStatus
        properties:
          approver:
            type: string
            description: |
              Conditional - Required when at least one policy is applied; Optional if no policies applied
              Must be user with Contributor role or higher; Cannot be same as Asset Owner
              Triggers "Missing Approver for Use Case with Applied Policy" alert if missing when policy applied
          approvalStatus:
            type: string
            enum: [pending-review, under-review, approved, approved-with-limitations,
              declined, on-hold, retired]
            description: |
              Conditional - Required when at least one policy is applied; Default: pending-review
              Only Approver can change status; State transitions must be valid
          approvalDate:
            type: string
            format: date-time
            readOnly: true
            description: |
              Auto-generated - Auto-set when approvalStatus changes to approved or approved-with-limitations
              Read-only; Null until approved
          approvedBy:
            type: string
            readOnly: true
            description: |
              Auto-generated - Auto-set to Approver user when approved
              Read-only; Null until approved
          approvalStatusNotes:
            type: string
            description: |
              Optional - Context and reasoning for approval decisions
              Recommended for Declined or On Hold; Creates audit trail for governance compliance
          deploymentStatus:
            type: string
            enum: [not-deployed, deployed, retired]
            description: |
              Required; Default: not-deployed
              When deployed: Most fields become read-only (exceptions: approvalStatus, deploymentStatus, permissionGroups); Cannot link/unlink assets
              When retired: Permanently locked (terminal state); Cannot change back; deploymentStatus field becomes read-only
              Triggers "Deployed without Approval" alert if deployed and approvalStatus is not approved/approved-with-limitations
          everDeployed:
            type: boolean
            readOnly: true
            description: |
              Permanently set to true when the Use Case first reaches deployed status. Never resets.
          deploymentGeographies:
            type: array
            items:
              type: string
            description: |
              Optional - Documents where the use case is deployed
              Array of geography strings (e.g., ["US", "EU", "APAC"])
          humanOversightLevel:
            type: string
            enum: [manual-only, human-in-the-loop, human-on-the-loop, supervised-autonomy,
              full-autonomy]
            description: Optional - Level of human oversight for the use case
          appliedPolicies:
            type: array
            items:
              type: string
              format: uuid
            readOnly: true
            description: |
              Read-only - Array of AppliedPolicy IDs associated with this use case
              Populated from applied_policy table where use_case_id matches
              To manage applied policies, use the AppliedPolicy endpoints
              Empty array if no policies applied
          versionFamilyId:
            type: string
            format: uuid
            readOnly: true
            description: |
              Auto-generated - Auto-generated on first version; Links all versions of same Use Case together
              Read-only
          ucVersion:
            type: number
            format: double
            readOnly: true
            description: |
              Auto-generated - Auto-generated; Starts at 1.0; Auto-increments (1.0 → 2.0) when new version created
              Read-only
          policyClassificationType:
            type: string
            enum: [standard-risk, high-risk, prohibited]
            readOnly: true
            nullable: true
            description: |
              Computed - Highest policy classification type across all applied policies.
              Returns null when no policies are applied. Ranking: prohibited > high-risk > standard-risk.
          securityMeasures:
            type: string
            description: |
              Optional - Documents cyber threat protection and access controls
          redTeamingStrategy:
            type: string
            description: |
              Optional - Documents approach for testing against adversarial scenarios
    EnrichmentFields:
      type: object
      description: |
        Flat denormalized enrichment fields added to enriched asset responses.
        Resolved at the service layer from related entities (users, groups, alerts).
        All fields are optional; absent when the underlying value is unknown.
      properties:
        ownerName:
          type: string
          description: Display name of the asset owner, resolved from assetOwner user
            ID.
          readOnly: true
        createdByName:
          type: string
          description: Display name of the user who created the asset, resolved from
            createdBy.
          readOnly: true
        lastUpdatedByName:
          type: string
          description: Display name of the user who last updated the asset, resolved
            from lastUpdatedBy.
          readOnly: true
        permissionGroupNames:
          type: array
          items:
            type: string
          description: Display names of the permission groups assigned to the asset.
          readOnly: true
        linkedAlertCount:
          type: integer
          format: int64
          description: |
            Count of active alerts on assets linked to this asset (e.g., alerts on Models
            linked to a Use Case). Field is omitted when zero or when the asset does not
            aggregate alerts.
          readOnly: true
    EnrichedModel:
      description: |
        Enriched Model response. Embeds the full Model schema and adds resolved
        display-name fields and computed counts. Returned by default for GET on
        a Model asset (no Accept header or `application/json`).
      allOf:
      - $ref: "#/components/schemas/Model"
      - $ref: "#/components/schemas/EnrichmentFields"
      - type: object
        properties:
          assetType:
            type: string
            enum: [model]

    EnrichedAgent:
      description: |
        Enriched Agent response. Embeds the full Agent schema and adds resolved
        display-name fields and computed counts. Returned by default for GET on
        an Agent asset (no Accept header or `application/json`).
      allOf:
      - $ref: "#/components/schemas/Agent"
      - $ref: "#/components/schemas/EnrichmentFields"
      - type: object
        properties:
          assetType:
            type: string
            enum: [agent]

    EnrichedUseCase:
      description: |
        Enriched Use Case response. Embeds the full UseCase schema and adds
        resolved display-name fields and computed counts. Returned by default
        for GET on a Use Case asset (no Accept header or `application/json`).
      allOf:
      - $ref: "#/components/schemas/UseCase"
      - $ref: "#/components/schemas/EnrichmentFields"
      - type: object
        properties:
          assetType:
            type: string
            enum: [use-case]

    AppliedPolicy:
      description: |
        Applied Policy represents a policy applied to a specific use case.
        Created from a policy template with all questions included by default.
        Questions can be optionally customized (required questions must be included).
      type: object
      required:
      - id
      - policyId
      - useCaseId
      - organizationId
      - appliedQuestions
      - classification
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for this applied policy instance
        policyId:
          type: string
          format: uuid
          description: ID of the policy template this was created from
        useCaseId:
          type: string
          format: uuid
          description: ID of the use case this policy is applied to
        organizationId:
          type: string
          format: uuid
          readOnly: true
          description: Organization ID for multi-tenant isolation
        appliedQuestions:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Array of question IDs included in this applied policy.
            Defaults to all questions from the policy template.
            Can be customized but must include all required questions.
        classification:
          type: object
          required:
          - classificationOption
          - classificationType
          properties:
            classificationOption:
              type: string
              description: User-selected classification level (e.g., "Sensitive",
                "Public")
            classificationType:
              type: string
              enum: [standard-risk, high-risk, prohibited]
              description: Determines deployment eligibility for the use case
          description: Data classification rules for this applied policy
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when this applied policy was created
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when this applied policy was last updated
        createdBy:
          type: string
          readOnly: true
          description: User ID who created this applied policy
        updatedBy:
          type: string
          readOnly: true
          description: User ID who last updated this applied policy
        etag:
          type: string
          readOnly: true
          description: |
            Per-item ETag for optimistic locking. Populated only in list responses.
            Use this value as the `If-Match` header when calling PUT on this resource.
            For single-resource GET and PUT responses, read the `ETag` response header instead.
    AppliedPolicyCreateRequest:
      description: Request body for creating a new applied policy
      type: object
      required:
      - policyId
      - useCaseId
      - classification
      properties:
        policyId:
          type: string
          format: uuid
          description: ID of the policy template to apply
        useCaseId:
          type: string
          format: uuid
          description: ID of the use case to apply the policy to
        classification:
          type: object
          required:
          - classificationOption
          - classificationType
          properties:
            classificationOption:
              type: string
              description: Classification level (e.g., "Sensitive", "Public")
            classificationType:
              type: string
              enum: [standard-risk, high-risk, prohibited]
              description: Determines deployment eligibility
          description: Data classification rules
    AppliedPolicyUpdateRequest:
      description: Request body for updating an applied policy
      type: object
      properties:
        appliedQuestions:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Optional - Updated list of question IDs.
            Must include all required questions from the policy.
        classification:
          type: object
          properties:
            classificationOption:
              type: string
              description: Updated classification level
            classificationType:
              type: string
              enum: [standard-risk, high-risk, prohibited]
              description: Updated classification type
          description: Optional - Updated classification rules
    AppliedPolicyListResponse:
      description: Paginated list of applied policies
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AppliedPolicy"
        start:
          type: integer
          description: Zero-based offset of the first item
        limit:
          type: integer
          description: Number of items per page
        count:
          type: integer
          format: int64
          description: Total number of applied policies
    AssetAssessments:
      description: |
        Assessments view - Returns model or agent with only assessment data visible.
        This is a filtered view of the complete Model/Agent schema.
      type: object
      required: [id, name, assetType]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        assetType:
          type: string
          enum: [model, agent, use-case]
        assessments:
          type: object
          properties:
            topics:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum: [incomplete, pending-review, approved]
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        question:
                          type: string
                        answer:
                          type: string
                        status:
                          type: string
                          enum: [incomplete, pending-review, approved]
                        answeredBy:
                          type: string
                          format: uuid
                        answeredAt:
                          type: string
                          format: date-time
                        approvedBy:
                          type: string
                          format: uuid
                        approvedAt:
                          type: string
                          format: date-time
            overallStatus:
              type: string
              enum: [incomplete, pending-review, approved]
    AssetAlerts:
      description: |
        Alerts view - Returns model or agent with only alert data visible.
        This is a filtered view of the complete Model/Agent schema.
      type: object
      required: [id, name, assetType]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        assetType:
          type: string
          enum: [model, agent, use-case]
        alerts:
          type: object
          properties:
            active:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                    enum: [missing-assessments, deployed-without-approval, no-assigned-owner,
                      owner-account-inactive, no-assigned-approver, no-linked-data,
                      linked-asset-version-changed, no-active-admins, max-use-case-missing-org-answers,
                      platform-connection-issue]
                  severity:
                    type: string
                    enum: [low, medium, high]
                  message:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  details:
                    type: object
            resolved:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  severity:
                    type: string
                  message:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  resolvedAt:
                    type: string
                    format: date-time
                  resolvedBy:
                    type: string
                    format: uuid
            summary:
              type: object
              properties:
                activeCount:
                  type: integer
                criticalCount:
                  type: integer
                highCount:
                  type: integer
    ChampionChallengerRole:
      type: string
      nullable: true
      enum:
      - champion
      - challenger
      description: |
        Role designation for an asset within a relationship.
        Source: ChampionChallengerRoles enum from use-case-functional-requirements.md
        NOTE: Values updated to lowercase as part of SAIDNAVAI-2663 enum kebab-case normalization.
        - champion: Primary asset designated for production use
        - challenger: Alternative asset being evaluated or tested
        - null: No role designation
    AssetLinkInput:
      type: object
      required:
      - assetId
      properties:
        assetId:
          type: string
          format: uuid
          description: ID of the asset to link
        role:
          $ref: "#/components/schemas/ChampionChallengerRole"
    AssetLinkDetail:
      type: object
      description: Linked asset details in relationships response
      properties:
        assetId:
          type: string
          format: uuid
        assetName:
          type: string
          readOnly: true
        assetType:
          type: string
          enum: [model, agent]
          readOnly: true
        includesGenerativeAI:
          type: string
          enum: [yes, no]
          nullable: true
          readOnly: true
          description: Whether this asset includes generative AI. For use cases, derived
            from linked child assets.
        role:
          $ref: "#/components/schemas/ChampionChallengerRole"
        containedAssets:
          type: array
          readOnly: true
          description: For Agents only - Models contained within this Agent
          items:
            $ref: "#/components/schemas/ContainedAssetSummary"
        linkedDate:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the asset was linked (from AssetLink.CreatedAt)
        linkedByUserId:
          type: string
          format: uuid
          readOnly: true
          description: User ID who created the link (from AssetLink.CreatedBy)
        lastUpdatedTimestamp:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the linked asset was last updated
        assetOwner:
          type: object
          readOnly: true
          description: Owner of the linked asset
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
    ContainedAssetSummary:
      type: object
      readOnly: true
      description: Model contained inside an Agent (read-only from parent perspective)
      properties:
        assetId:
          type: string
          format: uuid
        assetName:
          type: string
        assetType:
          type: string
          enum: [model]
        role:
          $ref: "#/components/schemas/ChampionChallengerRole"
        includesGenerativeAI:
          type: string
          enum: [yes, no]
          nullable: true
          readOnly: true
          description: Whether this model includes generative AI.
    ReverseDependencyDetail:
      type: object
      readOnly: true
      description: Parent asset that links to this asset
      properties:
        parentAssetId:
          type: string
          format: uuid
        parentAssetName:
          type: string
        parentAssetType:
          type: string
          enum: [use-case, agent]
        role:
          $ref: "#/components/schemas/ChampionChallengerRole"
        relatedAssets:
          type: array
          description: Other assets linked to the same parent (for context)
          items:
            $ref: "#/components/schemas/RelatedAssetSummary"
    RelatedAssetSummary:
      type: object
      readOnly: true
      description: Other assets linked to the same parent (for context when viewing
        reverse dependencies)
      properties:
        assetId:
          type: string
          format: uuid
        assetName:
          type: string
        assetType:
          type: string
          enum: [model, agent]
        role:
          $ref: "#/components/schemas/ChampionChallengerRole"
        includesGenerativeAI:
          type: string
          enum: [yes, no]
          nullable: true
          readOnly: true
          description: Whether this asset includes generative AI.
    RelationshipsSummary:
      type: object
      readOnly: true
      description: Aggregated counts for relationships
      properties:
        totalAssetLinks:
          type: integer
        championCount:
          type: integer
        challengerCount:
          type: integer
        modelCount:
          type: integer
        agentCount:
          type: integer
        reverseDependencyCount:
          type: integer
        useCaseCount:
          type: integer
        championInCount:
          type: integer
          description: Number of parents where this asset is Champion (Models only)
        challengerInCount:
          type: integer
          description: Number of parents where this asset is Challenger (Models only)
    AssetRelationshipsView:
      type: object
      description: |
        Relationships view for an asset.
        Response structure varies by asset type:
        - Use Case: assetLinks populated, reverseDependencies empty
        - Agent: assetLinks and reverseDependencies populated
        - Model: assetLinks empty, reverseDependencies populated
      required:
      - id
      - name
      - assetType
      - assetLinks
      - summary
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        assetType:
          type: string
          enum: [model, agent, use-case]
        assetLinks:
          type: array
          description: Assets directly linked to this asset (editable for Use Cases
            and Agents)
          items:
            $ref: "#/components/schemas/AssetLinkDetail"
        reverseDependencies:
          type: array
          readOnly: true
          description: Parent assets that link to this asset (read-only)
          items:
            $ref: "#/components/schemas/ReverseDependencyDetail"
        summary:
          $ref: "#/components/schemas/RelationshipsSummary"
    LinkedAssetGridItem:
      type: object
      readOnly: true
      description: A single row in the AR-5 related assets grid
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        assetType:
          type: string
          enum: [model, agent, use-case]
        includesGenerativeAI:
          type: string
          enum: [yes, no]
          nullable: true
          readOnly: true
          description: Whether this asset includes generative AI. For use cases, derived
            from linked child assets.
        relationshipDirection:
          type: string
          enum: [forward, reverse]
        role:
          type: string
