    delete:
      tags:
      - DimensionMember
      summary: Delete a dimension member
      description: |
        Delete a dimension member and all its descendants from a specified dimension.

        **Business Rules:**
        - Maximum levels in a dimension: 64
        - Maximum Dimensions: 128
        - Maximum Dimension Members under one parent: 64,000

        **Deletion Behavior:**
        - This operation always deletes the member and all its descendants (bottom-up order)
        - If the member or any descendant is referenced by accounts (for structural dimensions), the operation returns 409 Conflict
        - If the member has attribute associations (for attribute dimensions), the operation returns 409 Conflict
        - System/reserved members ('root', 'none', 'all') cannot be deleted

        **Rollup Restructuring:**
        - When deleting the last child of a parent, the rollup account hierarchy is automatically restructured
        - This ensures consistency in account aggregation

        **Permissions:**
        - User must have write access to the model
      operationId: deleteDimensionMember
      parameters:
      - name: modelGUID
        in: path
        description: The unique identifier of a model.
        required: true
        schema:
          type: string
          format: uuid
      - name: dimensionId
        in: path
        description: The unique identifier of a dimension.
        required: true
        schema:
          type: string
          format: uuid
      - name: dimensionMemberId
        in: path
        description: The unique identifier of the dimension member to delete.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: |
            Dimension member deleted successfully. The response includes:
            - X-Deleted-Members-Count: Total number of members deleted (including descendants)
            - X-Operation-Id: Unique operation identifier for audit trail
          headers:
            X-Deleted-Members-Count:
              description: Total count of deleted members (includes the root member
                and all descendants)
              schema:
                type: integer
            X-Operation-Id:
              description: Unique operation identifier for audit trail purposes
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Cache control directives
              schema:
                type: string
        "404":
          description: Model, dimension, or dimension member not found.
          headers:
            Content-Type:
              description: Type of error object
              schema:
                type: string
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/deleteDimensionMember404"
        "409":
          description: |
            Conflict: Dimension member cannot be deleted because it is in use.

            **For Structural Dimensions:** The member or one of its descendants is referenced by existing accounts.

            **For Attribute Dimensions:** The member has existing attribute associations.

            Use the CheckDimensionMemberInUse endpoint to verify usage before attempting deletion.
          headers:
            Content-Type:
              description: Type of error object
              schema:
                type: string
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                structuralDimensionInUse:
                  $ref: "#/components/examples/deleteDimensionMember409"
                attributeDimensionInUse:
                  $ref: "#/components/examples/deleteDimensionMember409_attribute"
        "403":
          description: User does not have write access to the model.
          headers:
            Content-Type:
              description: Type of error object
              schema:
                type: string
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/deleteDimensionMember403"
        "500":
          description: Internal server error. Failed to complete the deletion transaction.
          headers:
            Content-Type:
              description: Type of error object
              schema:
                type: string
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/deleteDimensionMember500"
  "/models/{modelGUID}/dimensions/{dimensionId}/dimensionMembers/{dimensionMemberId}/inUse":
    get:
      tags:
      - DimensionMember
      summary: Check if a dimension member is in use
      description: |
        Determine whether a dimension member (and its descendants) is currently in use by any accounts or attribute associations.

        **Dimension Type Specific Behavior:**

        - **Structural Dimensions:** Checks if the member or any of its descendants are referenced by existing accounts. This is used to verify if the member can be safely deleted.

        - **Attribute Dimensions:** Checks if the member has any attribute associations. Returns the usage status along with relevant business rules.

        **Response Details:**
        The response includes:
        - Member and dimension identification information
        - Dimension type (STRUCTURAL or ATTRIBUTE)
        - InUse flag indicating current usage status
        - Localized message describing the usage status
        - Hyperlinks (self reference and delete link if not in use)

        **Use Cases:**
        - Pre-deletion validation: Call this endpoint before attempting to delete a member
        - UI workflow support: Display usage status to users in the UI
        - Dependency checking: Verify impacts before structural changes

        **Permissions:**
        - User must have read access to the model
      operationId: getDimensionMemberInUse
      parameters:
      - name: modelGUID
        in: path
        description: The unique identifier of a model.
        required: true
        schema:
          type: string
          format: uuid
      - name: dimensionId
        in: path
        description: The unique identifier of a dimension.
        required: true
        schema:
          type: string
          format: uuid
      - name: dimensionMemberId
        in: path
        description: The unique identifier of the dimension member to check.
        required: true
        schema:
          type: string
          format: uuid
      responses:
