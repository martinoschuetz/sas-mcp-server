        required: false
        schema:
          type: string
          format: uuid
      - name: accountId
        in: query
        description: The unique identifier of a rollup account if you want to get
          the children accounts under that rollup account.
        required: false
        schema:
          type: string
          format: uuid
      - name: accountProperty
        in: query
        description: Any property of an account.
        required: false
        schema:
          type: integer
          format: int64
      - name: start
        in: query
        schema:
          type: integer
          format: int64
        description: The starting index of the first item in a page. The default value
          is 0.
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
        description: Maximum number of items to return. The default value is 10.
      - name: If-Modified-Since
        required: false
        description: Server will return 200 response only if the request resource
          is modified after the given date
        in: header
        schema:
          type: string
          format: dateTime
      - name: filter
        in: query
        schema:
          type: string
        description: "Filterable fields are periodId, scenarioId, moduleId, accountId\
          \ or accountProperty"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Last-Modified:
              description: Indicates the date and time at which the original resource
                was last modified.
              schema:
                type: string
                format: dateTime
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/accountSummaryCollection"
              examples:
                default:
                  $ref: "#/components/examples/getAccountCollection200"
            application/json:
              schema:
                $ref: "#/components/schemas/accountSummaryCollection"
              examples:
                default:
                  $ref: "#/components/examples/getAccountCollection200"
        "400":
          description: The request is invalid.
          headers:
            Content-Type:
              description: Type of error object
              schema:
                type: string
            Last-Modified:
              description: Indicates the date and time at which the original resource
                was last modified.
              schema:
                type: string
                format: dateTime
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/getAccountCollection400"
    post:
      x-sas-internal: true
      summary: Create a new account
      description: "Create an account or behavior account or multiple accounts or\
        \ behaviors. User does not create rollup accounts, they get created implicitly\
        \ in account hierarchy."
      parameters:
      - name: modelGUID
        in: path
        description: The unique identifier of a model.
        required: true
