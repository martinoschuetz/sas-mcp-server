components:
  schemas:
    account:
      title: Account Resource
      x-sas-internal: true
      description: An account is a point where measure values accumulate in a model
        and is defined by an intersection of dimension members, one dimension member
        from each dimension in a module. Accounts are periodic elements. The accounts
        in one period and scenario may exist in another period and scenario. And,
        when an account (same dimension signature) exists in multiple period and scenarios,
        its cost in one period/scenario is independent of its cost in another period
        and scenario.
      required:
      - creationTimeStamp
      - createdBy
      - modifiedTimeStamp
      - accountId
      - type
      - periodReference
      - scenarioReference
      - name
      - reference
      - moduleReference
      - accountProperties
      - version
      - links
      properties:
        creationTimeStamp:
          type: string
          format: date-time
          description: date and time at which the account was created
        createdBy:
          type: string
          description: the user who created the account
          example: "admin"
        modifiedTimeStamp:
          type: string
          format: date-time
          description: date and time at which the account was modified.
