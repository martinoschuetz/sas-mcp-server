  "/models/{modelGUID}/accounts":
    get:
      x-sas-internal: true
      summary: Return a collection of accounts or rollup accounts
      description: Returns the collection of accounts or rollup accounts. This collection
        is paginated and sorted based on creation time. The items in the collection
        use the application/vnd.sas.cost.and.profitability.model.account.summary representation.
      tags:
      - Account
      operationId: getAccounts
      parameters:
      - name: modelGUID
        in: path
        description: The unique identifier of a model.
        required: true
        schema:
          type: string
          format: uuid
      - name: periodId
        in: query
        description: The unique identifier of a period.
        required: false
        schema:
          type: string
          format: uuid
      - name: scenarioId
        in: query
        description: The unique identifier of a scenario.
        required: false
        schema:
          type: string
          format: uuid
      - name: moduleId
        in: query
