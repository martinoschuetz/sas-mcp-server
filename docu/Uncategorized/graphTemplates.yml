  /graphTemplates#indexableGraphTemplates:
    head:
      summary: Returns a collection of search indexes of graph templates
      description: Returns a collection of search indexes of graph templates. This
        overloads the getGraphTemplates operation and is distinguished by that op
        with the Accept-Item header which is required for this operation (not required
        for the other). This operation exists for use by the Search Index Service.
      operationId: headersForIndexableGraphTemplates
      tags:
      - Search Indexing
      parameters:
      - name: Accept-Item
        in: header
        description: Accept-Item header
        required: true
        schema:
          type: string
          enum:
          - application/vnd.sas.search.indexable.data+json
      - name: start
        in: query
        description: 0-based offset of the first search indexes of graph template
          to return.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Maximum number of search indexes of graph template to return.
        required: false
        schema:
          type: integer
          default: 20
      responses:
        "200":
          description: graph template links
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json
              schema:
                $ref: "#/components/schemas/indexableGraphTemplateCollection"
        "400":
          description: Bad Request.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json
              schema:
                type: string
    get:
      summary: Returns a collection of search indexes of graph templates
      description: Returns a collection of search indexes of graph templates. This
        overloads the getGraphTemplates operation and is distinguished by that op
        with the Accept-Item header which is required for this operation (not required
        for the other). This operation exists for use by the Search Index Service.
      operationId: getIndexableGraphTemplates
      tags:
      - Search Indexing
      parameters:
      - name: Accept-Item
        in: header
        description: Accept-Item header
        required: true
        schema:
          type: string
          enum:
          - application/vnd.sas.search.indexable.data+json
      - name: start
        in: query
        description: 0-based offset of the first search indexes of graph template
          to return.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Maximum number of search indexes of graph template to return.
        required: false
        schema:
          type: integer
          default: 20
      responses:
        "200":
          description: graph template links
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json
              schema:
                $ref: "#/components/schemas/indexableGraphTemplateCollection"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/indexableGraphTemplateCollection"
              examples:
                json:
                  $ref: "#/components/examples/responseGetGraphTemplatesSearchIndex"
            application/json:
              schema:
                $ref: "#/components/schemas/indexableGraphTemplateCollection"
              examples:
                json:
                  $ref: "#/components/examples/responseGetGraphTemplatesSearchIndex"
        "400":
          description: Bad Request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetGraphTemplatesBadRequest"
