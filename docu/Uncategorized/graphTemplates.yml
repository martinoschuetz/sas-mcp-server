---
openapi: 3.0.3
info:
  title: Graph Templates
  version: "1"
  description: The Graph Template Service API provides the means to store and retrieve
    graph template content and the associated metadata.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: http://mock-graphTemplates.apifirst.unx.sas.com/graphTemplates
  description: kubernetes mock server
tags:
- name: Root
  description: The operations for the root resource.
- name: Graph Template Collection
  description: The operations for the graph templates content resource.
- name: Graph Template
  description: The operations for a graph template resource.
- name: Search Indexing
  description: The operations for the indexable data resource.
- name: Transfer Import And Export
  description: The operations for the transfer object resource.
paths:
  /:
    head:
      operationId: headersForRoot
      tags:
      - Root
      description: Get the links for the API
      summary: Returns the links to the top-level resources for the API
      responses:
        "200":
          description: A collection of link objects.
          headers:
            Content-Type:
              description: application/vnd.sas.api+json;version=1
              schema:
                $ref: "#/components/schemas/api"
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: A collection of link objects.
          headers:
            Content-Type:
              description: application/vnd.sas.api+json;version=1
              schema:
                $ref: "#/components/schemas/api"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/responseGetRoot"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/responseGetRoot"
  /graphTemplates#graphTemplates:
    get:
      summary: Get a collection of Graph Templates
      description: Returns a list of graph templates.  Standard paging, filtering,
        and sorting options are provided. This is overloaded via the <code>getIndexableGraphTemplates</code>
        operation to get indexable; this operation is used if Accept-Item is not set
        or is <code>application/vnd.sas.graph.template+json</code>
      operationId: getGraphTemplates
      tags:
      - Graph Template Collection
      parameters:
      - name: name
        in: query
        description: Return only templates with the specified name.
        schema:
          type: string
      - name: start
        in: query
        description: 1-based Offset of first template to return.  Defaults to 1.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of templates to return.  Defaults to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: The criteria for filtering the items. Graph template attributes
          that can be used are id, name, description, createdBy, creationTimeStamp,
          modifiedBy, and modifiedTimeStamp. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/graphTemplates-v1/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the items. Graph template attributes
          that can be used are id, name, description, createdBy, creationTimeStamp,
          modifiedBy, and modifiedTimeStamp. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/graphTemplates-v1/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json
              schema:
                type: string
            Content-Item-Type:
              description: application/json
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/graphTemplateCollection"
              examples:
                json:
                  $ref: "#/components/examples/responseGetGraphTemplates"
            application/json:
              schema:
                $ref: "#/components/schemas/graphTemplateCollection"
              examples:
                json:
                  $ref: "#/components/examples/responseGetGraphTemplates"
        "400":
          description: An Invalid filter or combination of request parameters was
            provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetGraphTemplatesBadRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetGraphTemplatesBadRequest"
    post:
      summary: Create a new graph template
      description: Creates a new graph template based on the representation in the
        request body.
      operationId: create
      tags:
      - Graph Template Collection
      parameters:
      - name: parentFolderUri
        in: query
        required: true
        description: URI of folder in the Folders Service to add new graph template
          as a child.
        schema:
          type: string
          format: relative URI
      requestBody:
        content:
          application/vnd.sas.graph.template+json:
            schema:
              $ref: "#/components/schemas/createGraphTemplate"
            examples:
              json:
                $ref: "#/components/examples/requestBodyGraphTemplate"
          application/json:
            schema:
              $ref: "#/components/schemas/createGraphTemplate"
            examples:
              json:
                $ref: "#/components/examples/requestBodyGraphTemplate"
        description: Graph template to create.
        required: true
      responses:
        "201":
          description: New graph template created. ETag header is returned. See https://developer.sas.com/rest-apis/graphTemplates-v1/docs/getting-started/usage-notes#conditional-operations.
          headers:
            Location:
              description: The URI of the newly created graph template
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of the object.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the object.
              schema:
                type: string
          content:
            application/vnd.sas.graph.template+json:
              schema:
                $ref: "#/components/schemas/graphtemplate"
              examples:
                json:
                  $ref: "#/components/examples/responseGraphTemplate"
            application/json:
              schema:
                $ref: "#/components/schemas/graphtemplate"
              examples:
                json:
                  $ref: "#/components/examples/responseGraphTemplate"
        "400":
          description: Bad Request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responsePostGraphTemplatesBadRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responsePostGraphTemplatesBadRequest"
        "409":
          description: Conflict. Graph Template with the same name is already a member
            of the folder.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateConflict"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateConflict"
  "/graphTemplates/{graphTemplateId}":
    head:
      summary: Get a graph template
      description: Returns the representation of the specified template.
      operationId: headersForGraphTemplate
      tags:
      - Graph Template
      parameters:
      - $ref: "#/components/parameters/graphTemplateId"
      responses:
        "200":
          description: Returns the graph template
          headers:
            ETag:
              description: A tag that identifies this revision of the object.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the object.
              schema:
                type: string
        "404":
          description: Graph Template does not exist
          headers:
            Content-Type:
              description: Graph Template not found.
              schema:
                type: string
    get:
      summary: Get a graph template
      description: Returns the representation of the specified template.
      operationId: getGraphTemplate
      tags:
      - Graph Template
      parameters:
      - $ref: "#/components/parameters/graphTemplateId"
      responses:
        "200":
          description: Returns the graph template
          headers:
            ETag:
              description: A tag that identifies this revision of the object.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the object.
              schema:
                type: string
          content:
            application/vnd.sas.graph.template+json:
              schema:
                $ref: "#/components/schemas/graphtemplate"
              examples:
                json:
                  $ref: "#/components/examples/responseGraphTemplate"
            application/json:
              schema:
                $ref: "#/components/schemas/graphtemplate"
              examples:
                json:
                  $ref: "#/components/examples/responseGraphTemplate"
        "404":
          description: Graph Template does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGraphTemplateNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGraphTemplateNotFound"
    delete:
      summary: Delete graph template
      description: |
        The specified graph template is deleted.
      operationId: deleteGraphTemplate
      tags:
      - Graph Template
      parameters:
      - $ref: "#/components/parameters/graphTemplateId"
      responses:
        "204":
          description: Graph template is deleted
        "404":
          description: Graph template does not exist
          content:
            application/vnd.sas.graph.template+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGraphTemplateNotFound"
    put:
      summary: Update a graph template
      description: Updates the specified graph template based on the representation
        in the request body.
      operationId: updateGraphTemplate
      tags:
      - Graph Template
      parameters:
      - $ref: "#/components/parameters/graphTemplateId"
      - name: If-Match
        in: header
        description: The ETag that was returned from a GET, POST or PUT of this graph
          template.  If the ETag does not match, the update will fail.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the lastModified date of the graph template.  If
          the graph template has been updated since this time, the update will fail.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.graph.template+json:
            schema:
              $ref: "#/components/schemas/updateGraphTemplate"
            examples:
              json:
                $ref: "#/components/examples/requestBodyPutGraphTemplate"
          application/json:
            schema:
              $ref: "#/components/schemas/updateGraphTemplate"
            examples:
              json:
                $ref: "#/components/examples/requestBodyPutGraphTemplate"
        description: Graph template to update.
        required: true
      responses:
        "200":
          description: Graph Template Updated
          headers:
            ETag:
              description: A tag that identifies this revision of the object.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the object.
              schema:
                type: string
          content:
            application/vnd.sas.graph.template+json:
              schema:
                $ref: "#/components/schemas/updateGraphTemplate"
              examples:
                json:
                  $ref: "#/components/examples/responseGraphTemplate"
            application/json:
              schema:
                $ref: "#/components/schemas/updateGraphTemplate"
              examples:
                json:
                  $ref: "#/components/examples/responseGraphTemplate"
        "400":
          description: Bad Request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetGraphTemplatesBadRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetGraphTemplatesBadRequest"
        "404":
          description: Graph template does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGraphTemplateNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGraphTemplateNotFound"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resource's last modified time stamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responsePreconditionFailed"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responsePreconditionFailed"
        "428":
          description: Precondition Required - The request headers did not include
            a `If-Match` or `If-Unmodified-Since` precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responsePreconditionRequired"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responsePreconditionRequired"
