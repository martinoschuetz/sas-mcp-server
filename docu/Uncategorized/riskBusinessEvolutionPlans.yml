---
openapi: 3.0.3
info:
  title: Risk Business Evolution Plans
  description: The Risk Business Evolution Plans API manages a set of plans for future
    changes to a portfolio.
  version: '1'
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
servers:
- url: 'https://example.com/riskPortfolios/evolutionPlans'
  description: an example server for experimentation
tags:
- name: Plans
  description: The operations for the evolutionPlans collection resource.
- name: Plan
  description: The operations for an evolution plan resource.
- name: Root
  description: The operations for the root resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the root links
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: '#/components/examples/rootLinks'
            application/json:
              schema:
                $ref: "#/components/schemas/api"
  /plans:
    get:
      tags:
      - Plans
      summary: Get evolution plans
      description: 'Returns the collection of existing plans, of media type `application/vnd.sas.risk.business.evolution.plan`.  This
        collection supports [paging](https://developer.sas.com/apis/rest/Topics/#pagination),
        [filtering](https://developer.sas.com/apis/rest/Topics/#filters), and [sorting](https://developer.sas.com/apis/rest/Topics/#sorting).  Filtering
        and sorting are supported on all properties.'
      operationId: getPlans
      parameters:
      - $ref: '#/components/parameters/pagingStart'
      - $ref: '#/components/parameters/pagingLimit'
      - $ref: '#/components/parameters/sortBy'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/evolutionPlanCollection'
              examples:
                json:
                  $ref: '#/components/examples/evolutionPlanCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/evolutionPlanCollection'
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
      x-internal: false
    post:
      tags:
      - Plan
      summary: Create an evolution plan
      description: Creates a new evolution plan.  When using application/json, only
        the plan itself may be created; the resources must be appended separately.  When
        using multipart/form-data, the plan and the resources may be created in a
        single operaion.
      operationId: createPlan
      parameters:
      - $ref: '#/components/parameters/sourceId'
      requestBody:
        description: A plan to be created.
        required: true
        content:
          application/vnd.sas.risk.business.evolution.plan:
            schema:
              $ref: '#/components/schemas/createPlan'
            examples:
              json:
                $ref: '#/components/examples/createPlan'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/uploadPlan'
            examples:
              multipart/form-data:
                $ref: '#/components/examples/uploadPlan'
      responses:
        '201':
          description: The plan was created.
          headers:
            Location:
              description: The URI of the newly created plan.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the plan was last modified.
              schema:
                type: string
            ETag:
              description: A hashed value generated when the plan was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.risk.business.evolution.plan:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
            application/json:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /plans/@item:
    get:
      tags:
      - Plan
      summary: Lookup an evolution plan
      description: Returns the representation of the plan described by the query.  A
        filter must be specified that describes a single item in the collection.
      operationId: getPlanByFilter
      parameters:
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: The request succeeded.
          headers:
            ETag:
              description: A hashed value generated when the plan was last modified.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the plan was last modified.
              schema:
                type: string
            Content-Location:
              description: The location of the plan
              schema:
                type: string
          content:
            application/vnd.sas.risk.business.evolution.plan+json:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
              examples:
                json:
                  $ref: '#/components/examples/evolutionPlan'
            application/json:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
        '400':
          description: No valid filter describing a unique resource was included in
            the request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        '404':
          description: No qualifying plan exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  '/plans/{planId}':
    get:
      tags:
      - Plan
      summary: Get an evolution plan
      description: Returns the specified plan.
      operationId: getPlan
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the plan.
      responses:
        '200':
          description: The request succeeded.
          headers:
            ETag:
              description: A hashed value generated when the plan was last modified.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the plan was last modified.
              schema:
                type: string
            Content-Location:
              description: The location of the plan
              schema:
                type: string
          content:
            application/vnd.sas.risk.business.evolution.plan+json:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
              examples:
                json:
                  $ref: '#/components/examples/evolutionPlan'
            application/json:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
        '404':
          description: No plan exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    put:
      tags:
      - Plan
      summary: Update an evolution plan
      description: Updates the metadata of the specified plan, leaving its resources
        alone.
      operationId: updatePlan
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the plan.
      - name: If-Unmodified-Since
        in: header
        schema:
          type: string
        description: The timestamp obtained from the most recent `Last-Modified` response
          header. Must match the timestamp when the plan was last modified.
      - name: If-Match
        in: header
        schema:
          type: string
        description: The value obtained from the most recent `Etag` response header.
          Must match the value when the plan was last modified.
      requestBody:
        description: A plan to be created.
        required: true
        content:
          application/vnd.sas.business.evolution.:
            schema:
              $ref: '#/components/schemas/updatePlan'
            examples:
              json:
                $ref: '#/components/examples/updatePlan'
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.risk.business.evolution.plan+json:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
              examples:
                json:
                  $ref: '#/components/examples/evolutionPlan'
            application/json:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the plan was last modified.
              schema:
                type: string
            ETag:
              description: A hashed value generated when the plan was last modified.
              schema:
                type: string
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        '404':
          description: No plan exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        '412':
          description: The If-Unmodified-Since or If-Match request header did not
            match the resource's last modified timestamp or hashed value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        '428':
          description: The request headers did not include an If-Unmodified-Since
            or If-Match precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    post:
      tags:
      - Plan
      summary: Updates an evolution plan and resources
      description: Updates an existing plan, its resources, or both in a single operation
      operationId: updatePlanAndResources
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the plan.
      - $ref: '#/components/parameters/sourceId'
      - name: If-Unmodified-Since
        in: header
        schema:
          type: string
        description: The timestamp obtained from the most recent `Last-Modified` response
          header. Must match the timestamp when the plan was last modified.
      - name: If-Match
        in: header
        schema:
          type: string
        description: The value obtained from the most recent `Etag` response header.
          Must match the value when the plan was last modified.
      requestBody:
        description: The plan to be updated
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/uploadPlan'
            examples:
              multipart/form-data:
                $ref: '#/components/examples/uploadPlan'
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.risk.business.evolution.plan+json:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
              examples:
                json:
                  $ref: '#/components/examples/evolutionPlan'
            application/json:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the plan was last modified.
              schema:
                type: string
            ETag:
              description: A hashed value generated when the plan was last modified.
              schema:
                type: string
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        '404':
          description: No plan exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        '412':
          description: The If-Unmodified-Since or If-Match request header did not
            match the resource's last modified timestamp or hashed value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        '428':
          description: The request headers did not include an If-Unmodified-Since
            or If-Match precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      tags:
      - Plan
      summary: Delete an evolution plan
      description: Deletes a plan.
      operationId: deletePlan
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the plan.
      responses:
        '204':
          description: The request succeeded; nothing to return
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  '/plans/{planId}/target':
