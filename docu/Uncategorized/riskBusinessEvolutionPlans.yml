      description: The multipart/form-data representation of a plan and resources.  Note
        that the plan must be the first part of the multipart form and that both the
        target and the allocation are optional
      properties:
        plan:
          $ref: '#/components/schemas/createPlan'
        target:
          title: Target Balances
          description: The target balances for the plan.
          type: object
        allocation:
          title: allocation mix
          description: The allocation mix for the plan.
          type: object
    uploadTarget:
      title: Upload Target
      description: The multipart/form-data representation of a plan's target balances.
      properties:
        target:
          title: target balances
          type: object
          description: The target balances for the plan.
    targetBalances:
      title: Target Balances
      description: A table containing the target balances by reporting segmont for
        future horizons
      properties:
        classificationVariables (1-n):
          type: object
          description: one or more columns containing properties of instruments in
            a portfolios used as primary reporting values
        changeType:
          type: string
          enum:
          - value
          - rel
          - abs
          - rel_time
          - abs_time
          description: a code indicating how the target balance will be computed.
        horizons (1-n):
          type: number
          description: one or more sequentially numbered columns (start with 1) representing
            a sequential list of future horizons
    uploadAllocation:
      title: Upload Allocation
      description: The multipart/form-data representation of a plan's allocation mix.
      properties:
        allocation:
