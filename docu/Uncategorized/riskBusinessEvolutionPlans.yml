            Content-Location:
              description: The location of the target balances data
              schema:
                type: string
          content:
            application/vnd.sas.risk.business.evolution.plan.target+csv:
              schema:
                $ref: '#/components/schemas/targetBalances'
              examples:
                csv:
                  $ref: '#/components/examples/targetBalances'
            text/csv:
              schema:
                $ref: '#/components/schemas/targetBalances'
        '404':
          description: No plan exists at the requested path or the plan does not have
            target balances.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    post:
      tags:
      - Plan
      summary: Updates target balances
      description: Updates the target balances data for a plan.
      operationId: updateTarget
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the plan.
      - name: If-Unmodified-Since
        in: header
        schema:
          type: string
        description: The timestamp obtained from the most recent `Last-Modified` response
          header. Must match the timestamp when the plan was last modified.
      - name: If-Match
        in: header
        schema:
          type: string
        description: The value obtained from the most recent `Etag` response header.
          Must match the value when the plan was last modified.
      requestBody:
        description: The updated target balances data for a plan
        required: true
        content:
          application/vnd.sas.risk.business.evolution.plan.target:
            schema:
              $ref: '#/components/schemas/targetBalances'
            examples:
              csv:
                $ref: '#/components/examples/targetBalances'
          text/csv:
            schema:
              $ref: '#/components/schemas/targetBalances'
            examples:
              csv:
                $ref: '#/components/examples/targetBalances'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/uploadTarget'
            examples:
              multipart/form-data:
                $ref: '#/components/examples/uploadTarget'
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.risk.business.evolution.plan+json:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
              examples:
                json:
                  $ref: '#/components/examples/evolutionPlan'
            application/json:
              schema:
                $ref: '#/components/schemas/evolutionPlan'
          headers:
            Last-Modified:
              description: 'The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the plan was last modified.'
              schema:
                type: string
            ETag:
              description: A hashed value generated when the plan was last modified.
              schema:
                type: string
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        '404':
          description: No plan exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        '412':
          description: The If-Unmodified-Since or If-Match request header did not
            match the resource's last modified timestamp or hashed value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        '428':
          description: The request headers did not include an If-Unmodified-Since
            or If-Match precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      tags:
      - Plan
      summary: Delete target balances
      description: Deletes a plan's target balances data
      operationId: deleteTarget
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the plan.
      responses:
        '204':
          description: The request succeeded; nothing to return
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  '/plans/{planId}/allocation':
    get:
      tags:
      - Plan
      summary: Get allocation mix
