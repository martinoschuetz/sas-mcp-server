  '/plans/{planId}/export':
    get:
      tags:
      - Plan
      summary: Export an evolution plan
      description: Exports a plan's resources to a specified location, creating two
        tables -- one for the target balances data and one for the allocation mix
        data.
      operationId: exportPlan
      parameters:
      - $ref: '#/components/parameters/locationType'
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/fileName'
      - name: planId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the plan.
      - name: sesssionId
        in: query
        schema:
          type: string
        description: The ID of a cas session that should be used when exporting the
          resources; typically used when locationType is LIBNAME and location is a
          session-based caslib.
      - name: serverName
        in: query
        schema:
          type: string
        description: The name of the server to be used for exporting the resources;
          only used when there are multiple cas servers in the environment and using
          a specific server is necessary.
      - name: scope
        in: query
        schema:
          type: string
        description: one of global|session.  Determines if the exported table exists
          at global or session scope.  Default is session if locationType is DIRECTORY
          or if a sessionId is passed; if locationTYpe is LIBNAME and no sessionId
          is passed, default is global.
      - name: replace
        in: query
        schema:
          type: boolean
        description: when true, an existing table will be replaced during export;
          when false, an existing table causes the operation to fail
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.risk.business.evolution.plan.export.report:
              schema:
                $ref: '#/components/schemas/exportReport'
              examples:
                json:
                  $ref: '#/components/examples/exportReport'
            application/json:
              schema:
                $ref: '#/components/schemas/exportReport'
              examples:
                json:
                  $ref: '#/components/examples/exportReport'
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
components:
  parameters:
    filter:
      name: filter
      in: query
      schema:
        type: string
      description: The criteria for filtering the items in a collection. See [SAS
        REST APIs&colon; Filtering](https://developer.sas.com/reference/filtering/).
    pagingStart:
      name: start
      in: query
      schema:
        type: integer
        format: int32
        default: 0
      description: pagination parameter, what is the starting index.
    pagingLimit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        default: 20
      description: 'pagination parameter, how many items to return.'
    sortBy:
      name: sortBy
      in: query
      schema:
        type: string
      description: The criteria for sorting the items in a collection. See [SAS REST
        APIs&colon; Sorting](https://developer.sas.com/reference/sorting/).
    locationType:
      name: locationType
      in: query
      schema:
        type: string
        enum:
        - DIRECTORY
        - LIBNAME
      required: true
      description: The type of server location to which plans will be written.
    location:
      name: location
      in: query
      schema:
        type: string
      required: true
      description: The server location to which plans will be written. Varies based
        on locationType. When LIBNAME, the name of the cas library containing the
        table to be written|read.  When DIRECTORY, the filesystem path on the server
        the document to be written|read.
    fileName:
      name: fileName
      in: query
      schema:
        type: string
      required: true
      description: The base name of the File or Table to which plans will be written
    sourceId:
      name: sourceId
      in: query
      schema:
        type: string
      description: the ID of a plan from which target balances or allocation mix data
        will be copied if they are missing from an uploaded request body using mulitpart/form-data.
  schemas:
    evolutionPlanCollection:
      title: Plan Collection
      description: A collection of evolution plans.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/evolutionPlan'
    evolutionPlan:
      title: Evolution Plan
      description: A plan for future changes in a portfolio.
      properties:
        id:
          title: Plan ID
          description: The unique ID assigned to a plan.
          type: string
        name:
          type: string
          description: The name of the plan.
        description:
