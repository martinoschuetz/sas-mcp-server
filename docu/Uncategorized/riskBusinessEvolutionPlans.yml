          type: object
          description: The allocation mix for the plan.
    allocationMix:
      title: Allocation Mix
      description: A table containing the allocation mix by reporting segmont for
        future horizons
      properties:
        classificationVariables (1-n):
          type: object
          description: one or more columns containing properties of instruments in
            a portfolios used as primary reporting values
        allocationGroup:
          type: string
          description: name of a group of items in a portfolio that will be used to
            generate simulated items
        horizons (1-n):
          type: number
          description: one or more sequentially numbered columns (start with 1) representing
            a sequential list of future horizons
