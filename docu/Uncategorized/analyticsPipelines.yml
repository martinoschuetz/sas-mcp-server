---
openapi: 3.0.3
info:
  title: Analytics Pipelines
  description: A common pipeline API for analytics applications
  version: "3"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: "http://example.com/analyticsPipelines"
  description: kubernetes mock server
tags:
- name: Pipelines
  description: The operations for the pipelines resource.
- name: PipelineTemplates
  description: The operations for the pipeline templates resource.
- name: PipelinePolicies
  description: The operations for the pipeline policies resource.
- name: Root
  description: The operations for the root resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/GetRoot200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/GetRoot200Response"
    head:
      tags:
      - Root
      summary: Get the headers for the API
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded.
          headers: {}
  /pipelines:
    get:
      tags:
      - Pipelines
      summary: Get a collection of pipelines
      description: Returns a collection of pipelines based on the specified pagination,
        filtering, and sorting options. The media type of the items in the collection
        is controlled using the Accept-Item header. When full pipelines are requested,
        the components within each pipeline are always summary representations.
      operationId: getPipelines
      parameters:
      - name: start
        description: The index of the first pipeline to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of pipelines to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the pipelines. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/analyticsPipelines-v3/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the pipelines. See [Sorting in REST
          APIs](https://developer.sas.com/rest-apis/analyticsPipelines-v3/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: unlocalized
        in: query
        description: Disables localization in the response when this query parameter
          is present.
        required: false
        allowEmptyValue: true
        schema:
          type: string
      - name: Accept-Item
        in: header
        description: Requested media type for pipeline collection items.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.pipeline.summary+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.analytics.pipeline+json
          default: application/vnd.sas.analytics.pipeline.summary+json
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/pipelineCollection"
              examples:
                default:
                  $ref: "#/components/examples/GetPipelines200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/pipelineCollection"
              examples:
                default:
                  $ref: "#/components/examples/GetPipelines200Response"
    post:
      tags:
      - Pipelines
      summary: Create a new pipeline
      description: The request body must have either a name or a link of rel 'derivedFrom'
        to a template that can provide a name. link (of rel 'policy') to the pipeline's
        policy resource must be included in the request's links.  The request can
        optionally include an initial set of components and connections for the pipeline.
        See the detailed documentation for further information on how components and
        connections are specified.
      operationId: createPipeline
      parameters:
      - $ref: "#/components/parameters/componentType"
      requestBody:
        content:
          application/vnd.sas.analytics.pipeline+json:
            schema:
              $ref: "#/components/schemas/createPipeline"
            examples:
              default:
                $ref: "#/components/examples/CreatePipelineRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/createPipeline"
            examples:
              default:
                $ref: "#/components/examples/CreatePipelineRequest"
        description: The representation of a pipeline.
        required: true
      responses:
        "201":
          description: A pipeline was created.
          headers:
            Location:
              description: The URL of the pipeline.
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/CreatePipeline201Response"
            application/json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/CreatePipeline201Response"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/CreatePipeline400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/CreatePipeline400Response"
  /pipelines#fromTemplate:
    post:
      tags:
      - Pipelines
      summary: Create a new pipeline from a pipeline template
      description: Creates a new pipeline using properties, components and connections
        from a pipeline template.
      operationId: createPipelineFromTemplate
      parameters:
      - $ref: "#/components/parameters/componentType"
      requestBody:
        content:
          application/vnd.sas.analytics.pipeline.template+json:
            schema:
              $ref: "#/components/schemas/pipelineTemplate"
            examples:
              default:
                $ref: "#/components/examples/CreatePipelineFromTemplateRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/pipelineTemplate"
            examples:
              default:
                $ref: "#/components/examples/CreatePipelineFromTemplateRequest"
        description: The pipeline template used to create the pipeline.
        required: true
      responses:
        "201":
          description: A pipeline was created.
          headers:
            Location:
              description: The URL of the pipeline.
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/CreatePipelineFromTemplate201Response"
            application/json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/CreatePipelineFromTemplate201Response"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/CreatePipelineFromTemplate400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/CreatePipelineFromTemplate400Response"
  "/pipelines/{pipelineId}":
    get:
      tags:
      - Pipelines
      summary: Get a pipeline
      description: Returns the representation of the specified pipeline.
      operationId: getPipeline
      parameters:
      - name: pipelineId
        in: path
        description: The unique identifier for the pipeline.
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/componentType"
      - name: unlocalized
        in: query
        description: Disables localization in the response when this query parameter
          is present.
        required: false
        allowEmptyValue: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
            "Last-Modified":
              description: The time at which the pipeline was last updated.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/GetPipeline200Response"
            application/vnd.sas.analytics.pipeline.summary+json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/GetPipeline200ResponsePipelineSummary"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/GetPipeline200ResponseSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/GetPipeline200Response"
        "404":
          description: No pipeline exists at the requested path.
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/GetPipeline404Response"
            application/vnd.sas.analytics.pipeline.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/GetPipeline404Response"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/GetPipeline404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/GetPipeline404Response"
    head:
      tags:
      - Pipelines
      summary: Get the headers for a pipeline
      description: Returns the headers for the specified pipeline. Also used to determine
        whether a particular pipeline exists.
      operationId: headersForPipeline
      parameters:
      - name: pipelineId
        in: path
        description: The unique identifier for the pipeline.
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/componentType"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
            "Last-Modified":
              description: The time at which the pipeline was last updated.
              schema:
                type: string
        "404":
          description: No pipeline exists at the requested path.
    put:
      tags:
      - Pipelines
      summary: Update an existing pipeline
      description: This request can be used to change pipeline properties such as
        name and description. It can also be used to add or remove pipeline components/connections.
        Connection endpoints can also be modified, but properties of individual components
        cannot be modified. Use the component's 'update' link for such component-level
        changes.  See the detailed documentation for further information on how components
        and connections are specified.
      operationId: updatePipeline
      parameters:
      - name: pipelineId
        in: path
        description: The unique identifier for the pipeline.
        required: true
        schema:
          type: string
      - in: header
        name: If-Match
        description: Update the scope resource only if the resources current ETag
          header matches this value
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.analytics.pipeline+json:
            schema:
              $ref: "#/components/schemas/updatePipeline"
            examples:
              default:
                $ref: "#/components/examples/UpdatePipelineRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/updatePipeline"
            examples:
              default:
                $ref: "#/components/examples/UpdatePipelineRequest"
        description: The representation of a pipeline.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/UpdatePipeline200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/UpdatePipeline200Response"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/UpdatePipeline400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/UpdatePipeline400Response"
        "404":
          description: No pipeline exists at the requested path.
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/UpdatePipeline404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/UpdatePipeline404Response"
        "412":
          description: Precondition Failed
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/UpdatePipeline412Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/UpdatePipeline412Response"
        "428":
          description: Precondition Required
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/UpdatePipeline428Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/UpdatePipeline428Response"
    patch:
      tags:
      - Pipelines
      summary: Selectively update a pipeline
      description: The request body must contain a [JSON Patch](https://tools.ietf.org/html/rfc6902)
        specification of the requested pipeline changes. The patch is applied to the
        existing pipeline representation. The result of the patch is handled exactly
        the same as an update request made using the 'PUT' method. See the 'PUT' documentation
        for more details.
      operationId: patchPipeline
      parameters:
      - name: pipelineId
        in: path
        description: The unique identifier for the pipeline.
        required: true
        schema:
          type: string
      - in: header
        name: If-Match
        description: Update the scope resource only if the resources current ETag
          header matches this value
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/patchOperationArray"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline200Response"
        "400":
          description: The patch request is syntactically invalid.
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline400Response"
        "404":
          description: No pipeline exists at the requested path.
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline404Response"
        "412":
          description: Precondition Failed
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline412Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline412Response"
        "422":
          description: Unprocessable Entity.  The patch request is syntactically valid
            but the update it describes is not valid.
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline422Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline422Response"
        "428":
          description: Precondition Required
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline428Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PatchPipeline428Response"
    delete:
      tags:
      - Pipelines
      summary: Delete a pipeline
      description: Deletes the specified pipeline. The component and flow resources
        associated with the pipeline are also deleted.
      operationId: deletePipeline
      parameters:
      - name: pipelineId
        in: path
        description: The unique identifier for the pipeline.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The pipeline was deleted.
        "404":
          description: No pipeline exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/DeletePipeline404Response"
  "/pipelines/{pipelineId}#transfer":
    get:
      tags:
      - Pipelines
      summary: Get a pipeline transfer object
      description: Packages a pipeline into a transfer object. This endpoint is meant
        for use via the transfer microservice. See [Transfer API](/apis/transfer/v2/swagger.yaml)
        for usage.
      operationId: getPipelineForTransfer
      parameters:
      - name: pipelineId
        in: path
        description: The unique identifier for the pipeline.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
            "Last-Modified":
              description: The time at which the pipeline was last updated.
              schema:
                type: string
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/transferObject"
              examples:
                default:
                  $ref: "#/components/examples/GetPipelineTransferObject200Response"
        "404":
          description: No pipeline exists at the requested path.
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/GetPipelineTransferObject404Response"
    put:
      tags:
      - Pipelines
      summary: Create or update a pipeline from a transfer object
      description: Updates a pipeline to match the content of the provided transfer
        object. If the pipeline does not exist, it is created. This is not a conditional
        PUT request. This endpoint is meant for use via the transfer microservice.
        See [Transfer API](/apis/transfer/v2/swagger.yaml) for usage.
      operationId: updatePipelineFromTransfer
      parameters:
      - name: pipelineId
        in: path
        description: The unique identifier for the pipeline.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              default:
                $ref: "#/components/examples/PutPipelineTransferObjectRequest"
        description: The transfer object containing the pipeline.
        required: true
      responses:
        "200":
          description: An existing pipeline was updated.
          headers:
            ETag:
              description: Identifies a specific pipeline version.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/PutPipelineTransferObject200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/PutPipelineTransferObject200Response"
        "201":
          description: The pipeline was created.
          headers:
            Location:
              description: The URL of the pipeline.
              schema:
                type: string
                format: uri
            ETag:
              description: Identifies a specific pipeline version.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/PutPipelineTransferObject201Response"
            application/json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/PutPipelineTransferObject201Response"
        "400":
          description: The pipeline could not be created because the request was invalid.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PutPipelineTransferObject400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PutPipelineTransferObject400Response"
  "/pipelines/{pipelineId}/validPredecessors":
    get:
      tags:
      - Pipelines
      summary: Get a collection of predecessor component templates
      description: Returns a collection of the component templates that are valid
        to precede the specified pipeline component.
      operationId: getValidPredecessors
      parameters:
      - name: pipelineId
        in: path
        description: The unique identifier for the pipeline.
        required: true
        schema:
          type: string
      - name: componentId
        in: query
        description: The id of the pipeline component for which to find valid predecessors.
        required: true
        schema:
          type: string
          format: string
      - name: start
        description: The index of the first component template to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of component template to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the component templates. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/analyticsPipelines-v3/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the component templates. See [Sorting
          in REST APIs](https://developer.sas.com/rest-apis/analyticsPipelines-v3/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: Accept-Item
        in: header
        description: Requested media type for collection items.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.component.template.summary+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.component.template+json
          default: application/vnd.sas.analytics.component.template.summary+json
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/collection2"
              examples:
                default:
                  $ref: "#/components/examples/GetValidPredecessors200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/collection2"
              examples:
                default:
                  $ref: "#/components/examples/GetValidPredecessors200Response"
  "/pipelines/{pipelineId}/validSuccessors":
    get:
      tags:
      - Pipelines
      summary: Get a collection of successor component templates
      description: Returns a collection of the component templates that are valid
        to succeed the specified pipeline component.
      operationId: getValidSuccessors
      parameters:
      - name: pipelineId
        in: path
        description: The unique identifier for the pipeline.
        required: true
        schema:
          type: string
      - name: componentId
        in: query
        description: The id of the pipeline component for which to find valid successors.
        required: true
        schema:
          type: string
          format: string
      - name: start
        description: The index of the first component template to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of component template to return.
        in: query
