        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the policies. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/analyticsPipelines-v3/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the policies. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/analyticsPipelines-v3/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: Accept-Item
        in: header
