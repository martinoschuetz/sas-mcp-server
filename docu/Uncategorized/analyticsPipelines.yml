      description: A process flow for analytic components. Pipelines group individual
        components into a higher-level workflow
      x-sas-media-type:
        name: application/vnd.sas.analytics.pipeline
        version: 3
      allOf:
      - $ref: "#/components/schemas/pipelineSummary"
      - type: object
        properties:
          revision:
            type: integer
            description: A revision number that is incremented on every update to
              the pipeline.
            format: int64
          componentType:
            description: Media type for pipeline components.
            type: string
            default: application/vnd.sas.summary
            enum:
            - application/vnd.sas.summary
            - application/vnd.sas.analytics.component.summary
            - application/vnd.sas.analytics.component
          swimLanes:
            type: array
            description: The pipeline's swim lanes, ordered as they are defined in
              the pipeline policy. A swim lane is a container for components with
              the same policy constraints.
            items:
              properties:
                name:
                  type: string
                  description: A unique, descriptive identifier for the swim lane.
                orderConstraints:
                  type: array
                  description: Display order constraints for components in a swim
                    lane. Each predecessor/successor pair is a hint for the preferred
                    display order for components. These constraints do not affect
                    execution order.
                  items:
                    properties:
                      predecessor:
                        type: string
                        description: The id of the predecessor component. For added
                          components, this is a placeholder id.
                      successor:
                        type: string
                        description: The id of the successor component. For added
                          components, this is a placeholder id.
                orderedComponentIds:
                  type: array
                  description: Ids for each component in the swim lane in display
                    order. The defined connections and display order contraints contribute
                    to this ordering.
                  items:
                    type: string
                components:
                  type: object
                  description: The swim lane's components, indexed by id.
                  additionalProperties:
                    $ref: "#/components/schemas/analyticsComponentSummary"
          connections:
            type: object
            description: The pipeline's component connections, indexed by connection
              id. Connections add sequential execution constraints to pairs of components.
            additionalProperties:
              $ref: "#/components/schemas/pipelineComponentConnection"
          version:
            type: integer
            format: int32
            description: The version number of this representation schema.  This representation
              is version 3.
