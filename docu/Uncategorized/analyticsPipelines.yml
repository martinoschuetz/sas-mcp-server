components:
  parameters:
    componentType:
      name: componentType
      in: query
      description: Requested media type for pipeline components.
      required: false
      schema:
        type: string
        enum:
        - application/vnd.sas.summary+json
        - application/vnd.sas.analytics.component.summary+json
        - application/vnd.sas.analytics.component+json
        default: application/vnd.sas.analytics.component.summary+json
  requestBodies:
    patchOperationArray:
      content:
        application/json-patch+json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/patchOperation"
          examples:
            default:
              $ref: "#/components/examples/PatchRequest"
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/patchOperation"
          examples:
            default:
              $ref: "#/components/examples/PatchRequest"
      description: An array of JSON Patch operations.
  schemas:
    persistPipeline:
      title: Persist Pipeline
      description: Common properties for pipeline persistence operations.
      properties:
        name:
          type: string
          description: The pipeline name.
        description:
          type: string
          description: The pipeline description.
        version:
          type: integer
          format: int32
          description: The version number of this representation schema.  This representation
            is version 2.
    createPipeline:
      title: Create Pipeline
      description: The representation used to create a new pipeline.
      required:
      - name
      - links
      allOf:
      - $ref: "#/components/schemas/persistPipeline"
      - type: object
        properties:
          swimLanes:
            type: array
            description: The new pipeline's swim lanes, ordered as they are defined
              in the pipeline policy. If not present, empty swim lanes are created,
              based on the pipeline policy.
            items:
              properties:
                name:
                  type: string
                  description: A unique, descriptive identifier for the swim lane.
                orderConstraints:
                  type: array
                  description: Display order constraints for components in a swim
                    lane. Each predecessor/successor pair is a hint for the preferred
                    display order for components. These constraints do not affect
                    execution order.
                  items:
                    properties:
                      predecessor:
                        type: string
                        description: The id of the predecessor component. For added
                          components, this is a placeholder id.
                      successor:
                        type: string
                        description: The id of the successor component. For added
                          components, this is a placeholder id.
                components:
                  type: object
                  description: The swim lane's components, indexed by id.
                  additionalProperties:
                    $ref: "#/components/schemas/createAnalyticsComponent"
          connections:
            type: object
            description: The pipeline's component connections, indexed by connection
              id. Connections add sequential execution constraints to pairs of components.
            additionalProperties:
              $ref: "#/components/schemas/createComponentConnection"
    updatePipeline:
      title: Update Pipeline
      description: The representation used to update an existing pipeline.
      required:
      - id
      - revision
      - name
      - links
      allOf:
      - $ref: "#/components/schemas/persistPipeline"
      - type: object
        properties:
          id:
            type: string
            description: A unique identifier for the pipeline.
          revision:
            type: integer
            description: Pipeline revision number. Must be equal to the pipeline's
              current revision number.
            format: int64
          swimLanes:
            type: array
            description: The new pipeline's swim lanes, ordered as they are defined
              in the pipeline policy.
            items:
              properties:
                name:
                  type: string
                  description: A unique, descriptive identifier for the swim lane.
                orderConstraints:
                  type: array
                  description: Display order constraints for components in a swim
                    lane. Each predecessor/successor pair is a hint for the preferred
                    display order for components. These constraints do not affect
                    execution order.
                  items:
                    properties:
                      predecessor:
                        type: string
                        description: The id of the predecessor component. For added
                          components, this is a placeholder id.
                      successor:
                        type: string
                        description: The id of the successor component. For added
                          components, this is a placeholder id.
                components:
                  type: object
                  description: The swim lane's components, indexed by id. The properties
                    of an existing component cannot be updated with this operation.
                    Instead, update the component directly.
                  additionalProperties:
                    $ref: "#/components/schemas/createAnalyticsComponent"
          connections:
            type: object
            description: The pipeline's component connections, indexed by connection
              id. Connections add sequential execution constraints to pairs of components.
            additionalProperties:
              $ref: "#/components/schemas/updateComponentConnection"
    createComponentConnection:
      title: Create Component Connection
      description: A representation of a request to create a new connection between
        two pipeline components.
      properties:
        id:
          type: string
          description: A placeholder identifier for the new connection.
        from:
          type: string
          description: The placeholder id of the connection source component. This
            component must complete execution before the target component can execute.
        to:
          type: string
          description: The placeholder id of the connection target component. This
            component can begin execution only after the source component completes.
    updateComponentConnection:
      title: Update Component Connection
      description: A representation of a request to add or update a connection between
        two pipeline components.
      properties:
        id:
          type: string
          description: An identifier for the connection. For added connections, this
            is a placeholder id.
        from:
          type: string
          description: The id of the connection source component. For added components,
            this is a placeholder id. This component must complete execution before
            the target component can execute.
        to:
          type: string
          description: The id of the connection target component. For added components,
            this is a placeholder id. This component can begin execution only after
            the source component completes.
    pipelineCollection:
      title: Pipeline Collection
      description: A collection of pipeline representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              anyOf:
              - $ref: "#/components/schemas/pipelineSummary"
              - $ref: "#/components/schemas/pipeline"
              - $ref: "#/components/schemas/summary"
            description: The array of pipeline summary representations.
    persistPipelineTemplate:
      title: Persist Pipeline Template
      description: Common properties for template persistence operations.
      properties:
        name:
          type: string
          description: The template name.
        description:
          type: string
          description: The template description.
        application:
          type: string
          description: The name of the application in which the template is used.
        provider:
          type: string
          description: The name of the organization providing the template. For SAS-provided
            templates, the value is 'SAS'.
        links:
          description: The links that apply to the template.
          type: array
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          format: int32
          description: The version number of this representation schema.  This representation
            is version 2.
    createPipelineTemplate:
      title: Create Pipeline Template
      description: The representation used to create a new template.
      required:
      - name
      - prototype
      allOf:
      - $ref: "#/components/schemas/persistPipelineTemplate"
      - type: object
        properties:
          prototype:
            $ref: "#/components/schemas/pipeline"
    updatePipelineTemplate:
      title: Update Pipeline Template
      description: The representation used to update an existing template.
      required:
      - id
      - revision
      - name
      - applicationId
      - prototype
      allOf:
      - $ref: "#/components/schemas/persistPipelineTemplate"
      - type: object
        properties:
          id:
            type: string
            description: A unique identifier for the template.
          revision:
            type: integer
            description: Template revision number. Must be equal to the pipeline's
              current revision number.
            format: int64
          prototype:
            $ref: "#/components/schemas/pipeline"
    pipelineTemplateCollection:
      title: Pipeline Template Collection
      description: A collection of pipeline template representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              anyOf:
              - $ref: "#/components/schemas/pipelineTemplateSummary"
              - $ref: "#/components/schemas/pipelineTemplate"
              - $ref: "#/components/schemas/summary"
            description: The array of pipeline template representations.
    createPipelinePolicy:
      title: Create Pipeline Policy
      description: The representation used to create a new policy.
      properties:
        name:
          type: string
          description: The policy name.
        description:
          type: string
          description: The policy description.
        links:
          description: The links that apply to the policy.
          type: array
          items:
            $ref: "#/components/schemas/link"
        acceptRule:
          type: string
          description: A global constraint, in the form of a [filter expression](https://developer.sas.com/rest-apis/analyticsPipelines-v3/docs/getting-started/usage-notes#filtering)
            that operates on a component template. The expression must evaluate to
            true for a component's template if it is allowed in any swim lane in the
            pipeline. If not specified, then this rule rejects no component.
        swimLanes:
          type: array
          description: The policies for the swim lanes which comprise the pipeline.
            Each policy imposes additional restrictions on the types of components
            that may be contained within them.
          items:
            properties:
              name:
                type: string
                description: A descriptive name for the swim lane. The name is unique
                  among all swim lanes in the policy.
              acceptRule:
                type: string
                description: A swim lane-specific constraint, in the form of a [filter
                  expression](https://developer.sas.com/rest-apis/analyticsPipelines-v3/docs/getting-started/usage-notes#filtering)
                  that operates on a component template. The expression must evaluate
                  to true for a component's template if it is allowed in the swim
                  lane. If not specified, then this rule rejects no component.
              minComponentCount:
                type: integer
                format: int32
                description: The minimum number of components in the swim lane. The
                  default is 0.
              maxComponentCount:
                type: integer
                format: int32
                description: The maximum number of components in the swim lane. A
                  value of 0 means there is no limit.
              sourceLaneIndices:
                type: array
                description: The lanes from which  components can connect to components
                  in this lane. A null or empty array means that connections are allowed
                  from any lane before this lane.
                items:
                  type: integer
                  format: int32
              targetLaneIndices:
                type: array
                description: The lanes to which components in this lane can connect.
                  A null or empty array means that connections are allowed to any
                  lane after this lane.'
                items:
                  type: integer
                  format: int32
        version:
          type: integer
          format: int32
          description: The version number of this representation schema.  This representation
            is version 1.
    updatePipelinePolicy:
      title: Update Pipeline Policy
      description: The representation used to update a new policy.
      allOf:
      - $ref: "#/components/schemas/createPipelinePolicy"
      - type: object
        properties:
          id:
            type: string
            description: A unique identifier for the policy.
          revision:
            type: integer
            description: Policy revision number. Must be equal to the policy's current
              revision number.
            format: int64
    pipelinePolicyCollection:
      title: Pipeline Policy Collection
      description: A collection of pipeline policy representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              anyOf:
              - $ref: "#/components/schemas/pipelinePolicySummary"
              - $ref: "#/components/schemas/pipelinePolicy"
              - $ref: "#/components/schemas/summary"
            description: The array of pipeline policy representations.
    createAnalyticsComponent:
      title: Create Component
      description: The representation used to create a new component.
      properties:
        name:
          type: string
          description: The component name.
        description:
          type: string
          description: The component description.
        group:
          type: string
          description: The component group name. Similar components can be grouped
            together by assigning the same group name to each.
