    pipelinePolicy:
      title: Pipeline Policy
      description: A set of constraints that govern the structure of a pipeline
      allOf:
      - $ref: "#/components/schemas/pipelinePolicySummary"
      - type: object
        properties:
          revision:
            type: integer
            description: A revision number that is incremented on every update to
              the policy.
            format: int64
          acceptRule:
            type: string
            description: A global constraint, in the form of a filter expression that
              operates on a component template. The expression must evaluate to true
              for a component's template if it is allowed in any swim lane in the
              pipeline. If not specified, then this rule rejects no component.
          swimLanes:
            type: array
            description: The policies for the swim lanes which comprise the pipeline.
              Each policy imposes additional restrictions on the types of components
              that may be contained within them.
            items:
              properties:
                name:
                  type: string
                  description: A descriptive name for the swim lane. The name is unique
                    among all swim lanes in the policy.
                acceptRule:
                  type: string
                  description: A swim lane-specific constraint, in the form of a filter
                    expression that operates on a component template. The expression
                    must evaluate to true for a component's template if it is allowed
                    in the swim lane. If not specified, then this rule rejects no
                    component.
                minComponentCount:
                  type: integer
                  format: int32
                  description: The minimum number of components in the swim lane.
                    The default is 0.
                maxComponentCount:
                  type: integer
                  format: int32
                  description: The maximum number of components in the swim lane.
                    A value of 0 means there is no limit.
                sourceLaneIndices:
                  type: array
                  description: The lanes from which  components can connect to components
                    in this lane. A null or empty array means that connections are
                    allowed from any lane before this lane.
                  items:
                    type: integer
                    format: int32
                targetLaneIndices:
                  type: array
                  description: The lanes to which components in this lane can connect.
                    A null or empty array means that connections are allowed to any
                    lane after this lane.'
                  items:
                    type: integer
                    format: int32
          version:
            type: integer
            format: int32
            description: The version number of this representation schema.  This representation
              is version 1.
