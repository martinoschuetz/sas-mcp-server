    sourceDefinition:
      title: Source Definition
      description: Information about a data source definition.
      type: object
      required:
      - id
      - providerId
      - name
      properties:
        id:
          type: string
          description: The unique data source definition identifier.
          maxLength: 36
        providerId:
          type: string
          description: The provider identifier.
          minLength: 1
          maxLength: 36
        name:
          type: string
          description: The non-unique name of the data source.
          minLength: 1
          maxLength: 250
        dataSourceId:
          type: string
          description: A non-unique identifier of the associated data source.
          minLength: 0
          maxLength: 2048
        description:
          type: string
          description: A brief description of the data source definition.
          minLength: 0
          maxLength: 1000
        createdBy:
          type: string
          description: The user who created this source definition.
        modifiedBy:
          type: string
          description: The last user to modify this data source definition.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for the source definition creation.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for the last source definition modification.
        defaultLibref:
          type: string
          description: A libref for use when LIBNAME statement is auto generated.
          minLength: 1
          maxLength: 8
        attributes:
          type: object
          description: >
            The map of attribute names to values for this source definition.
            The contents of this field usually include data source engine properties
            and options
            just like the ones used in defining a library using a LIBNAME statement.
            Refer to compute service engines API [`engines`](https://developer.sas.com/rest-apis/compute/#engines)
            for engine and options information.
            The value of each attribute may be of types: number, string, boolean,
            or
            object like a map. If an attribute does not have a value, the value should
            be set to null.
          additionalProperties: {}
          minLength: 0
          maxLength: 65535
        version:
          type: integer
          description: The source definition schema version.
        links:
          type: array
          description: Paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
