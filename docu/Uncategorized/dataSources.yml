  "/providers/{providerId}/allowedPaths":
    get:
      x-sas-since: "4"
      operationId: getAllowedPaths
      summary: Get a list of allowed paths
      description: >-
        Returns a collection of allowed paths for the specified provider.
        Allowed paths define authorization rules for paths that users can access.
        Standard paging, filtering, and sorting options are specified in the
        Parameters section below.

        When the Accept header is set to text/plain, the response returns a
        space-separated list of quoted paths suitable for use in SAS code.
        If a configured path includes substitution variables such as $USER or
        $(SAS_USER_NAME), those variables are replaced with the current user's ID
        in the text/plain output.
        Each path is automatically quoted according to SAS quoting rules:

        - Paths containing single quotes are wrapped in double quotes
        - Paths containing double quotes are wrapped in single quotes
        - Paths containing both single and double quotes are wrapped in double quotes,
          with internal double quotes escaped by doubling them (e.g., "" represents
        a literal " in SAS)
        - Paths without quotes are wrapped in double quotes for safety

        Only paths that the user is authorized to access are included in the response.
        For JSON responses, substitution variables remain unchanged and are
        returned exactly as stored.
      tags:
      - Allowed Paths
      parameters:
      - $ref: "#/components/parameters/ProviderIDPathParam"
      - $ref: "#/components/parameters/StartQueryParam"
      - $ref: "#/components/parameters/LimitQueryParam"
      - name: filter
        in: query
        description: |
          Filter criteria for returned allowed paths. The supported
          functions are and, or, not, eq, lt, le, gt, ge, contains,
          startsWith, endsWith, and isNull. Not all functions are supported for all fields.
          Some sample queries include the following:
          - Search by paths starting with: /dataSources/providers/{providerId}/allowedPaths?filter=startsWith(paths, '/data')
          - Search by path value: /dataSources/providers/{providerId}/allowedPaths?filter=contains(paths, '/data/mypath')
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: |
          Sort returned allowed paths. The sort criteria supports
          the following fields in either ascending or descending order: createdBy, modifiedBy,
          creationTimeStamp, and modifiedTimeStamp. Sorting is not supported on the paths field.
          Some sample sorts include the following:
          - Sort ascending by paths: /dataSources/providers/{providerId}/allowedPaths?sortBy=createdBy:ascending
          - Sort descending by paths: /dataSources/providers/{providerId}/allowedPaths?sortBy=modifiedTimeStamp:descending
          The default sort is by paths in ascending order.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. Any allowed paths are returned in a
            resource collection or as plain text depending on the Accept header.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/allowedPathCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/allowedPathCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/allowedPathCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/allowedPathCollection"
            text/plain:
              schema:
                type: string
                description: >-
                  A space-separated list of quoted paths suitable for SAS code.
                  Substitution variables such as $USER and $(SAS_USER_NAME)
                  are replaced with the current user's ID in this output.
                  Each path is quoted according to SAS quoting rules to handle
                  special characters like quotes. Only paths the user is authorized
                  to access are included.
              examples:
                simplePaths:
                  value: '"/data/shared/projects" "/data/shared/reports"'
                  summary: Simple paths without special characters
                pathsWithSingleQuotes:
                  value: '"/data/user''s/files" "/data/joe''s/projects"'
                  summary: Paths containing single quotes (wrapped in double quotes)
                pathsWithDoubleQuotes:
                  value: '''/data/"shared"/files'' ''/data/"temp"/output'''
                  summary: Paths containing double quotes (wrapped in single quotes)
                pathsWithBothQuotes:
                  value: '"/data/user''s/""shared""/files"'
                  summary: Path with both quote types (double quotes escaped by doubling)
                pathsWithResolvedSubstitutionVariables:
                  value: '"/data/home/sasjoe/projects" "/data/home/sasjoe/datasets"'
                  summary: Paths with substitution variables resolved to the current
                    user ID
        "400":
          description: |
            The request was invalid. Invalid requests occur in the following scenarios:
            - A negative start value is provided.
            - A negative limit value is provided.
            - An unsupported field is specified in the sortBy parameter.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: No provider exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
    post:
      x-sas-since: "4"
      operationId: createAllowedPath
      summary: Create an allowed path
      description: >-
        Creates an allowed path from the provided request. The paths field can
        include substitution variables such as $USER or $(SAS_USER_NAME).
      tags:
      - Allowed Paths
      parameters:
      - $ref: "#/components/parameters/ProviderIDPathParam"
      requestBody:
        content:
          application/vnd.sas.data.source.allowed.path+json:
            schema:
              $ref: "#/components/schemas/createAllowedPath"
            examples:
              createAllowedPathRequest:
                $ref: "#/components/examples/createAllowedPathRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/createAllowedPath"
            examples:
              createAllowedPathRequest:
                $ref: "#/components/examples/createAllowedPathRequest"
        description: Allowed path to create. The paths field is required and specifies
          the file system paths that users are allowed to access. Paths can include
          substitution variables such as $USER or $(SAS_USER_NAME).
        required: true
      responses:
        "201":
          description: An allowed path was created.
          headers:
            Location:
              description: The URI of the newly created allowed path.
              schema:
                type: string
            Last-Modified:
