---
openapi: 3.0.3
info:
  version: "4"
  title: Data Sources
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: |
    The Data Sources API works in concert with the Data Tables and Row Sets APIs
    to navigate, reference, and retrieve data in the SAS Viya ecosystem. The
    Data Sources API enables retrieval of metadata for data sources and linking
    to their respective tables.
    The Data Sources API also supports allowedPaths.
tags:
- name: Providers
  description: Contains data source operations for the providers resource.
- name: Sources
  description: Contains operations for data sources resource.
- name: Source Definitions
  description: Contains operations for the data source definitions resource.
- name: Sessions
  description: Contains operations to access data sources using the sessions resource.
- name: Root
  description: Contains operations for the root resource of the Data Sources API.
- name: Engines
  description: Contains operations for engines of the Data Sources API.
- name: Transfer
  description: Contains operations to transfer object resources.
- name: Allowed Paths
  description: Contains operations for allowed paths authorization rules for data
    source providers.
paths:
  /:
    get:
      operationId: root
      summary: Get a collection of top-level links
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                schemaval:
                  $ref: "#/components/examples/rootLinks"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                schemaval:
                  $ref: "#/components/examples/rootLinks"
  /providers:
    get:
      operationId: getProviders
      summary: Get a list of providers
      description: >-
        Returns a collection of application/vnd.sas.data.provider.summary
        resources. Standard paging, filtering, and sorting options are specified
        in the Parameters section below.
      tags:
      - Providers
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: |
          The desired provider representation.
          The Accept-Item options are:
          - application/vnd.sas.data.provider.summary+json
          - application/vnd.sas.data.provider+json
          If the application/vnd.sas.data.provider.summary type is
          specified or no Accept-Item header is present, the providers are
          returned as the summary representation provider objects. In this
          case, the provider contains the following properties: id, version, and links.
        schema:
          type: string
          enum:
          - application/vnd.sas.data.provider.summary+json
          - application/vnd.sas.data.provider+json
      - $ref: "#/components/parameters/StartQueryParam"
      - $ref: "#/components/parameters/LimitQueryParam"
      - name: filter
        in: query
        description: |
          Filter criteria for returned providers. The only valid filter field
          is id. The supported functions are and, or, not, eq, lt, le, gt, ge,
          contains, startsWith, endsWith, and isNull. Some sample queries:
          - Search by id starting with: /dataSources/providers?filter=startsWith(id, 'prov')
          - Search by id: /dataSources/providers?filter=eq(id, 'provider1')
          - Search for multiple providers: /dataSources/providers?filter=in(id, 'provider1', 'provider2', 'provider3')
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: |
          Sort returned providers. The only valid sorting option is the
          id field. The default sort order is ascending on the id field. Some
          sample sorts include the following:
          - Sort ascending by id: /dataSources/providers?sortBy=id:ascending
          - Sort descending by id: /dataSources/providers?sortBy=id:descending
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. Any providers are returned in a resource
            collection.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/providerSummaryCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/providerSummaryCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/providerSummaryCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/providerSummaryCollection"
        "400":
          description: |
            The request was invalid. Invalid requests occur in the following scenarios:
            - A negative start value is provided.
            - A negative limit value is provided.
            - An unsupported field is specified in the sortBy parameter.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
  "/providers/{providerId}":
    get:
      operationId: getProvider
      summary: Gets the provider
      description: Returns information about a single provider based on its unique
        ID.
      parameters:
      - $ref: "#/components/parameters/ProviderIDPathParam"
      tags:
      - Providers
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.data.provider+json:
              schema:
                $ref: "#/components/schemas/provider"
              examples:
                schemaval:
                  $ref: "#/components/examples/provider"
                preferenceLink:
                  $ref: "#/components/examples/sessionHandlingExample"
            application/vnd.sas.data.provider.summary+json:
              schema:
                $ref: "#/components/schemas/provider"
              examples:
                schemaval:
                  $ref: "#/components/examples/provider"
                preferenceLink:
                  $ref: "#/components/examples/sessionHandlingExample"
            application/json:
              schema:
                $ref: "#/components/schemas/provider"
              examples:
                schemaval:
                  $ref: "#/components/examples/provider"
                preferenceLink:
                  $ref: "#/components/examples/sessionHandlingExample"
        "404":
          description: No provider exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  "/providers/{providerId}/sourceDefinitions":
    get:
      x-sas-since: "2"
      operationId: getSourceDefinitions
      summary: Get a list of data source definitions
      description: >-
        Returns a collection of application/vnd.sas.source.definition resources.
        Standard paging, filtering, and sorting options are specified in the
        Parameters section below.
      tags:
      - Source Definitions
      parameters:
      - $ref: "#/components/parameters/ProviderIDPathParam"
      - $ref: "#/components/parameters/StartQueryParam"
      - $ref: "#/components/parameters/LimitQueryParam"
      - name: filter
        in: query
        description: |
          Filter criteria for returned data source definitions. The supported
          functions are and, or, not, eq, lt, le, gt, ge, contains,
          startsWith, endsWith, and isNull. Some sample queries include the following:
          - Search by name starting with: /dataSources/providers/{providerId}/sourceDefinitions?filter=startsWith(name, 'sour')
          - Search by name: /dataSources/providers/{providerId}/sourceDefinitions?filter=eq(name, 'source1')
          - Search for multiple source definitions: /dataSources/providers/{providerId}/sourceDefinitions?filter=in(name, 'source1', 'source2', 'source3')
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: |
          Sort returned data source definitions. The sort criteria supports
          the following fields in either ascending or descending order (name,
          type, createdBy, modifiedBy, creationTimeStamp, and
          modifiedTimeStamp). Some sample sorts include the following:
          - Sort ascending by name: /dataSources/providers/{providerId}/sourceDefinitions?sortBy=name:ascending
          - Sort descending by name: /dataSources/providers/{providerId}/sourceDefinitions?sortBy=name:descending
          The default sort is by name in ascending order.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. Any data source definitions are returned
            in a resource collection.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/sourceDefinitionCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/sourceDefinitionCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/sourceDefinitionCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/sourceDefinitionCollection"
        "400":
          description: |
            The request was invalid. Invalid requests occur in the following scenarios:
            - A negative start value is provided.
            - A negative limit value is provided.
            - An unsupported field is specified in the sortBy parameter.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: No provider exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
    post:
      x-sas-since: "2"
      operationId: createSourceDefinition
      summary: Create a data source definition
      description: Creates a date source definition from the provided request.
      tags:
      - Source Definitions
      parameters:
      - $ref: "#/components/parameters/ProviderIDPathParam"
      requestBody:
        content:
          application/vnd.sas.data.source.definition+json:
            schema:
              $ref: "#/components/schemas/createSourceDefinition"
            examples:
              createSourceDefinitionSASRequest:
                $ref: "#/components/examples/createSourceDefinitionSASRequest"
              createSourceDefinitionPostgreSQLRequest:
                $ref: "#/components/examples/createSourceDefinitionPostgreSQLRequest"
              createSourceDefinitionOracleRequest:
                $ref: "#/components/examples/createSourceDefinitionOracleRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/createSourceDefinition"
            examples:
              createSourceDefinitionSASRequest:
                $ref: "#/components/examples/createSourceDefinitionSASRequest"
              createSourceDefinitionPostgreSQLRequest:
                $ref: "#/components/examples/createSourceDefinitionPostgreSQLRequest"
              createSourceDefinitionOracleRequest:
                $ref: "#/components/examples/createSourceDefinitionOracleRequest"
        description: Source definition to create. The only fields validated are providerId
          and defaultLibref. Other fields are not validated. The attributes are not
          required for the source definition but they are needed to actually use the
          source definition to access tables.
        required: true
      responses:
        "201":
          description: A source definition was created.
          headers:
            Location:
              description: The URI of the newly created source definition.
              schema:
                type: string
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this object.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.source.definition+json:
              schema:
                $ref: "#/components/schemas/sourceDefinition"
              examples:
                sourceDefinitionSAS:
                  $ref: "#/components/examples/sourceDefinitionSAS"
                sourceDefinitionPostgresSQL:
                  $ref: "#/components/examples/sourceDefinitionPostgresSQL"
                sourceDefinitionOracle:
                  $ref: "#/components/examples/sourceDefinitionOracle"
            application/json:
              schema:
                $ref: "#/components/schemas/sourceDefinition"
              examples:
                sourceDefinitionSAS:
                  $ref: "#/components/examples/sourceDefinitionSAS"
                sourceDefinitionPostgresSQL:
                  $ref: "#/components/examples/sourceDefinitionPostgresSQL"
                sourceDefinitionOracle:
                  $ref: "#/components/examples/sourceDefinitionOracle"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: No provider exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  "/providers/{providerId}/sourceDefinitions#transfer":
    post:
      summary: Create source definition from transfer object
      description: Create a new source definition from transfer object. Other than
        the old source definition ID, all other source definition properties are preserved.
      operationId: createSourceDefinitionFromTransfer
      tags:
      - Transfer
      parameters:
      - $ref: "#/components/parameters/ProviderIDPathParam"
      requestBody:
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              schemaval:
                $ref: "#/components/examples/transferObject"
          application/json:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              schemaval:
                $ref: "#/components/examples/transferObject"
        description: The source definition to be imported.
        required: true
      responses:
        "201":
          description: A source definition was imported successfully.
          headers:
            Location:
              description: The URI of the newly created source definition.
              schema:
                type: string
            ETag:
              description: The entity tag for the newly created source definition.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the source definition was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/transferObjectSummary"
              examples:
                schemaval:
                  $ref: "#/components/examples/transferObjectSummary"
            application/vnd.sas.summary+json;version=1:
              schema:
                $ref: "#/components/schemas/transferObjectSummary"
              examples:
                schemaval:
                  $ref: "#/components/examples/transferObjectSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/transferObjectSummary"
              examples:
                schemaval:
                  $ref: "#/components/examples/transferObjectSummary"
        "400":
          description: The request was invalid. There was a provider mismatch between
            the transfer object content and requested provider.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: No provider exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  "/providers/{providerId}/sourceDefinitions/{sourceDefinitionId}":
    get:
      x-sas-since: "2"
      operationId: getSourceDefinition
      summary: Get a data source definition
      description: Returns information about a single source based on its unique ID.
      parameters:
      - $ref: "#/components/parameters/ProviderIDPathParam"
      - $ref: "#/components/parameters/SourceDefinitionIDPathParam"
      tags:
      - Source Definitions
      responses:
        "200":
          description: The request succeeded.
          headers:
            Location:
              description: The URI of the newly created source definition.
              schema:
                type: string
            ETag:
              description: The entity tag for the source definition.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the source definition was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.data.source.definition+json:
              schema:
                $ref: "#/components/schemas/sourceDefinition"
              examples:
                example-1:
                  $ref: "#/components/examples/sourceDefinitionSAS"
                example-2:
                  $ref: "#/components/examples/sourceDefinitionPostgresSQL"
                example-3:
                  $ref: "#/components/examples/sourceDefinitionOracle"
            application/json:
              schema:
                $ref: "#/components/schemas/sourceDefinition"
              examples:
                example-1:
                  $ref: "#/components/examples/sourceDefinitionSAS"
                example-2:
                  $ref: "#/components/examples/sourceDefinitionPostgresSQL"
                example-3:
                  $ref: "#/components/examples/sourceDefinitionOracle"
        "404":
          description: |
            No provider or data source definition exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
    put:
      x-sas-since: "2"
      operationId: updateSourceDefinition
      summary: Update a data source definition
      description: Updates an existing data source definition through a full replacement
        of the resource. The ID field might not be modified by this operation.
      tags:
      - Source Definitions
      parameters:
      - $ref: "#/components/parameters/ProviderIDPathParam"
      - $ref: "#/components/parameters/SourceDefinitionIDPathParam"
      - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        content:
          application/vnd.sas.data.source.definition+json:
            schema:
              $ref: "#/components/schemas/updateSourceDefinition"
            examples:
              schemaval:
                $ref: "#/components/examples/updateSourceDefinitionRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/updateSourceDefinition"
            examples:
              schemaval:
                $ref: "#/components/examples/updateSourceDefinitionRequest"
        description: The source definition to update.
        required: true
      responses:
        "200":
          description: The request succeeded. Data source definition updated successfully.
          headers:
            Location:
              description: The URI of the newly created source definition.
              schema:
                type: string
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this data source definition.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.source.definition+json:
              schema:
                $ref: "#/components/schemas/sourceDefinition"
              examples:
                schemaval:
                  $ref: "#/components/examples/updateSourceDefinitionResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/sourceDefinition"
              examples:
                schemaval:
                  $ref: "#/components/examples/updateSourceDefinitionResponse"
        "400":
          description: The request was invalid. This occurs when the user provides
            an ID in the request that does not match the ID in the path of the URL.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: No data source definition exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
        "406":
          description: This is an example of an error that could be returned for unsupported
            requested media type.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error406"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error406"
        "412":
          description: The ETag provided does not match the current version of the
            object.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error412"
        "428":
          description: The If-Match header was not provided when updating an existing
            type.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error428"
    delete:
      x-sas-since: "2"
      operationId: deleteSourceDefinition
      summary: Delete a data source definition
      description: Deletes the specified data source definition.
      tags:
      - Source Definitions
      parameters:
      - $ref: "#/components/parameters/ProviderIDPathParam"
      - $ref: "#/components/parameters/SourceDefinitionIDPathParam"
      responses:
        "204":
          description: The data source definition was deleted.
        "400":
          description: Bad Request
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: |
            No provider or data source definition exists at the requested path.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  "/providers/{providerId}/sourceDefinitions/{sourceDefinitionId}#transfer":
    get:
      summary: Check transfer object availability
      description: Return the transfer object of the specified source definition.
      operationId: getSourceDefinitionAsTransfer
      tags:
      - Transfer
      parameters:
      - $ref: "#/components/parameters/ProviderIDPathParam"
      - $ref: "#/components/parameters/SourceDefinitionIDPathParam"
      responses:
        "200":
          description: The request succeeded. The source definition returned as a
            transfer object.
          headers:
            Location:
              description: The URI of the newly created source definition.
              schema:
                type: string
            ETag:
              description: The entity tag for the source definition.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the source definition was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/transferObject"
              examples:
                schemaval:
                  $ref: "#/components/examples/transferObject"
        "404":
          description: |
            No provider or data source definition exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
    put:
      summary: Update source definition with transfer object
      description: Updates a source definition using the transfer object. If no existing
        source definition is found, a new source definition is created. Either way,
        all other source definition properties are preserved.
      operationId: updateSourceDefinitionFromTransfer
      tags:
      - Transfer
      parameters:
      - $ref: "#/components/parameters/ProviderIDPathParam"
      - $ref: "#/components/parameters/SourceDefinitionIDPathParam"
      - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              schemaval:
                $ref: "#/components/examples/transferObject"
        description: Source definition to be imported.
        required: true
      responses:
        "200":
          description: The request succeeded. The imported or updated source definition
            returned in resource summary format.
          content:
            application/vnd.sas.summary:
              schema:
                $ref: "#/components/schemas/transferObjectSummary"
              examples:
                schemaval:
                  $ref: "#/components/examples/transferObjectSummary"
        "400":
          description: |
            The request was invalid. There is a mismatch in the transfer object
            content and one of the following requested resources:
            - The provider.
            - The data source definition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
