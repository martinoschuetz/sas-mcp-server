        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
  parameters:
    DataSourceAcceptItemHeader:
      name: Accept-Item
      in: header
      description: |
        The desired data source representation.
        If no Accept-Item header is present, the full representation of data sources are returned.
      schema:
        type: string
        enum: [application/vnd.sas.data.source+json, application/vnd.sas.data.source.summary+json]
        default: "application/vnd.sas.data.source+json"
    PreserveSessionQueryParam:
      name: preserveSession
      in: query
      description: This only has effect when the sessionId query parameter is not
        specified. If this is set to true, no sessionId is provided and the session
        created by the data service provider is not destroyed. All returned links,
        except the "self" link, have the sessionId query parameter added to their
        respective URIs. Also, they contain an additional session link to the application/vnd.sas.data.session
        resource that corresponds to the provided sessionId. If set to false or not
        specified, the session is destroyed after the request is complete. Defaults
        to false.
      schema:
        type: boolean
    IfMatchHeader:
      name: If-Match
      in: header
      description: The ETag that was returned from a GET, POST, PUT, PATCH, or HEAD
        of this object.  If the ETag does not match, the update will fail.
      required: true
      schema:
        type: string
    SourceDefinitionIDPathParam:
      name: sourceDefinitionId
      in: path
      description: The ID for the source definition.
      required: true
      schema:
        type: string
    AllowedPathIDPathParam:
      name: allowedPathId
      in: path
      description: The ID for the allowed path.
      required: true
      schema:
        type: string
    StartQueryParam:
      name: start
      in: query
      description: 0-based Offset of first object to return.  Defaults to 0.
      schema:
        type: integer
    SourceIDPathParam:
      name: sourceId
      in: path
      description: The ID for the source.
      required: true
      schema:
        type: string
    EngineNamePathParam:
      name: engineName
      in: path
      description: The unique name of this engine within its data source.
      required: true
      schema:
        type: string
    SessionIDQueryPathParam:
      name: sessionId
      in: query
      description: The unique identifier of the session used to access the data service
        provider's backing service. When this is not specified, the data service provider
        creates a temporary session and then destroys it after the request is complete.
        If this is specified, all returned links, except the "self" link, have the
        sessionId query parameter added to their respective URIs. Also, they contain
        an additional session link to the application/vnd.sas.data.session resource
        that corresponds to the provided sessionId.
      schema:
        type: string
    SessionIDPathParam:
      name: sessionId
      in: path
      description: The unique identifier of the session used to access the data service
        provider's backing service.
      required: true
      schema:
        type: string
    LimitQueryParam:
      name: limit
      in: query
      description: Maximum number of objects to return.  Defaults to 10.
      schema:
        type: integer
    ProviderIDPathParam:
      name: providerId
      in: path
      description: The ID for the provider.
      required: true
      schema:
        type: string
