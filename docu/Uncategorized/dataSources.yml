    sessionHandlingExample:
      summary: Session handling
      description: >
        Certain Data Sources service providers support session-based data retrieval.
        To determine whether this is supported by any particular
        provider, query `/dataTables/providers/{providerId}` to retrieve the [`application/vnd.sas.data.provider`](https://developer.sas.com/apis/rest/DataManagement/#application-vnd.sas.data.provider)
        media type. Then check the `usesSessions` member.
      value: {}
    retrieveTablesLinkExample:
      summary: Retrieving Tables
      description: |
        Here is an example of using a GET request on the [`application/vnd.sas.data.source`](https://developer.sas.com/apis/rest/DataManagement/#application-vnd.sas.data.source) to return a resource.
        - From a caslib data source, the `tables` link is provided to give the user the ability to list all of the available tables for that caslib.
        - You can use the link to retrieve a collection of [`application/vnd.sas.data.table`](https://developer.sas.com/apis/rest/DataManagement/#application-vnd.sas.data.table) resources from the [Data Tables API](https://developer.sas.com/apis/rest/DataManagement/#data-tables).
      value: {"method": "GET", "rel": "tables", "href": "/dataTables/dataSources/cas~fs~cas-shared-default~fs~MYCASLIB/tables",
        "uri": "/dataTables/dataSources/cas~fs~cas-shared-default~fs~MYCASLIB/tables",
        "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.data.table"}
    queryParamsExample:
      summary: Query Parameters
      description: |
        If sessions are supported by the provider, the following query parameters are supported for calls to `/dataSources/providers/{providerId}/sources/{sourceId}`
        and `/dataSources/providers/{providerId}/sources/{sourceId}/children`

        | Name               | Type      | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   |
        |--------------------|-----------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
        | `?sessionId`       | `string`  | The unique identifier of the session used to access the data service provider's backing service. When this is not specified, the data service provider creates a temporary session and then destroys it after the request is complete. If this is specified, the sessionId query parameter is added to the respective URIs for all returned links, except the `self` link.  Also, they contain an additional `session` link to the [application/vnd.sas.data.session](https://developer.sas.com/apis/rest/DataManagement/#application-vnd.sas.data.session) resource that corresponds to the provided sessionId. |
        | `?preserveSession` | `Boolean` | This has effect only when the `?sessionId` query parameter is not specified. If this is set to true, no `?sessionId` is provided and the session created by the data service provider is not destroyed. The sessionId query parameter is added to the respective URIs for all returned links, except the `self` link. Also, they contain an additional `session` link to the application/vnd.sas.data.session resource that corresponds to the provided `?sessionId`. If set to false or not specified, the session is destroyed after the request is complete. Defaults to false.                                                                          |
      value: {}
    linkRelationsExample:
      summary: Link Relations
      description: >
        **Session Link**

        The `session` link is added anytime the `sessionId` is provided by the user
        or the `preserveSession` query parameter is set to true.
        This `session` link uses the [application/vnd.sas.data.session](https://developer.sas.com/apis/rest/DataManagement/#application-vnd.sas.data.session)
        media type.
        The `href` is `/dataSources/providers/{providerId}/sources/{sourceId}/sessions/{sessionId}`.
        This is provided so that the client can obtain further links to destroy the
        session if they want to do so.

        **sessionScoped Link**

        The `sessionScoped` link is added anytime the `sessionId` is provided by the
        user or the `preserveSession` query parameter is set to true.
        This link gives the user access to a session-scoped version of the `self`
        link. Users must understand that they are working with a session that is temporary
        by its nature.
        The `self`link is the resource identifier that the user persists. The `sessionScoped`
        link can be used for immediate access and work being done with the resource
        by the client.
      value: {}
