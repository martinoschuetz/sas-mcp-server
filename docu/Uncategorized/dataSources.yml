    preserveSessionExample:
      summary: Client Does Not Specify a sessionId and Specifies preserveSession=true
      description: >-
        Here is an example of the sessionId being placed on the returned links when
        the user sets the `preserveSession` query parameter to true, so the temporary
        session is preserved (not destroyed).

        * In the example, 756b212c-56b1-8848-ad52-f86fcb06301f is the session identifier
        for a temporary session that is preserved.
        * The service returns a `session` link that points to the appropriate session
        in the path `/dataSources/providers/{providerId}/sources/{sourceId}/sessions/{sessionId}`,
        where `sourceId` corresponds to the level of the data hierarchy that the session
        is associated with (such as the first-level CAS server for CAS).
        * The `sessionId` is appended as a query parameter to all links except the
        `self` link, and the `sessionScoped` link is appended to the respective resource.

        Note: The data provider service creates a temporary session to request the
        data from the backing service and then destroys that session upon completion
        of the request. This occurs when a user does not provide a session identifier
        to a data source that uses sessions.

        ```
        # HTTP GET request to get a table with preserveSession set to true
        GET /dataSources/providers/cas/sources/casServer~fs~MYCASLIB?preserveSession=true
        #Response application/vnd.sas.data.source+json
