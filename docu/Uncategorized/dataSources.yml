  schemas:
    provider:
      title: Provider
      type: object
      description: Information about a Provider.
      properties:
        id:
          type: string
          description: |
            The unique provider identifier.
        version:
          type: integer
          description: The provider schema version.
        apiVersion:
          type: integer
          description: The provider API version.
        usesSessions:
          type: boolean
          description: If this value is true, this provider supports sessions. If
            false, sessions are not supported.
        sourceDefinitionsSupport:
          type: string
          description: >
            Indicates to the dataSources service how it should handle source
            definition persistence for this provider. The possible values are
            none (no support) and providedByDataSources (data sources service
            stores source definitions for the provider).
          x-sas-since: "2"
        attributes:
          type: object
          description: Additional provider-specific attributes.
          additionalProperties: {}
        links:
          type: array
          description: Links that apply to this resource.
          items:
            $ref: "#/components/schemas/link"
    providerSummary:
      title: Provider Summary
      type: object
      description: Summary information about a provider.
      properties:
        id:
          type: string
          description: |
            The unique provider identifier.
        version:
          type: integer
          description: The provider schema version.
        links:
          type: array
          description: Links that apply to this resource.
          items:
            $ref: "#/components/schemas/link"
    providerSummaryCollection:
      title: Provider Summary Collection
      type: object
      description: A pageable collection of provider resources.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/providerSummary"
            description: The array that contains provider summary resources.
    source:
      title: Data Source
      type: object
      description: Information about a data source.
      properties:
        id:
          type: string
          description: |
            The unique data source identifier.
        providerId:
          type: string
          description: |
            The source provider identifier.
        name:
          type: string
          description: |
            The non-unique name of the data source.
        description:
          type: string
          description: |
            A brief description of the source.
        hasTables:
          type: boolean
          description: >
            If this value is true, this source is a table container.
            If this value is false, this source is not a table container.
        hasEngines:
          type: boolean
          description: >
            If this value is true, this source, this source has engines available
            for it.
            If this value is false, this source does not have engines available for
            it.
        createdBy:
          type: string
          description: |
            The user who created this source.
        modifiedBy:
          type: string
          description: |
            The last user to modify this source.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for the source creation.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for the last source modification.
        attributes:
          type: object
          description: |
            The attributes for this source.
          additionalProperties: {}
        version:
          type: integer
          description: The source schema version.
        links:
          type: array
          description: The paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
    sourceCollection:
      title: Data Source Collection
      type: object
      description: A pageable collection of source objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
