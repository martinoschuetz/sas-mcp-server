              examples:
                json:
                  $ref: "#/components/examples/error12"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/error12"
  /entries/{entryId}:
    get:
      tags:
      - User
      - Admin
      operationId: getEntry
      summary: Get audit entry
      description: Returns information about a single audit entry based on its unique
