---
openapi: 3.0.3
info:
  version: "7"
  title: Audit
  description: >
    The Audit API provides resource for creating and retrieving audit records within
    the system.
    <br><br><b>Version 1:</b><ul><li>provides basic read only functionality that allows
    administrators to retrieve existing audit records</li></ul><br>
    <b>Version 2:</b><ul><li>adds the ability for administrators to create audit records</li>
    <li>adds a POST method to the /audit/entries endpoint to search for audit records
    via a request body</li>
    <li>enhances the security model to allow for users to view their own audit activity</li></ul><br>
    <b>Version 3:</b><ul><li>Added the 'administrativeAction' flag to the resource
    and security audit entry types.</li></ul>
    <b>Version 4:</b><ul><li>provides basic read only functionality that allows administrators
    to retrieve existing audit records</li></ul>
    <b>Version 5:</b><ul><li>Added support for ObjectType, ObjectName, ObjectPath,
    ApplicationName and ServiceName. Also remaned the SessionSignature to SessionId.</li></ul>
    <b>Version 6:</b><ul><li>Added support for InsertionTimeStamp to resource, security
    and activity tables.</li></ul>
    <b>Version 7:</b><ul><li>Added 'User Interaction' and 'Secure' columns in activity
    tables.</li></ul>
    </ul>
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: "devex@sas.com"
servers:
- url: http://example.com/audit
  description: This is an example base URL.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: User
  description: Contains the operations for the User resource.
- name: Admin
  description: Contains the operations for the Admin resource.
paths:
  /:
    get:
      tags:
      - Root
      operationId: root
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level collections surfaced through
        this API.  These top level links will include "entries".
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                getrootresponse:
                  $ref: "#/components/examples/getrootresponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                getrootresponse:
                  $ref: "#/components/examples/getrootresponse"
  /entries:
    get:
      tags:
      - User
      - Admin
      operationId: getEntries
      summary: Get audit entries
      description: Returns a collection of audit entries of type `application/vnd.sas.audit.entry.resource+json`
        and/or `application/vnd.sas.audit.entry.security+json`.  Standard paging,
        filtering, and sorting options are provided.
      parameters:
      - name: start
        in: query
        description: The starting index of the first entry in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of entries to return in this page of results.
          The actual number of returned entries may be less if the collection has
          been exhausted. Defaults to 50.
        schema:
          type: integer
      - name: type
        in: query
        description: Return entries based on their type.  Must be equal to one of
          the following values - "resource" or "security".
        schema:
          type: string
      - name: user
        in: query
        description: Return entries based on the associated user.
        schema:
          type: string
      - name: filter
        in: query
        description: Filter criteria for returned entries.
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort returned entries.  The sort criteria supports the following
          fields in either ascending or descending order (name, description).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/entryCollection"
              examples:
                getentriesresponse:
                  $ref: "#/components/examples/getentriesresponse"
            application/json:
              schema:
                $ref: "#/components/schemas/entryCollection"
              examples:
                getentriesresponse:
                  $ref: "#/components/examples/getentriesresponse"
        "400":
          description: An invalid filter or combination of request parameters was
            provided.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/error3"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/error3"
    post:
      tags:
      - Admin
      x-sas-since: "2"
      operationId: createResourceEntry
      summary: Create a resource entry
      description: Create an audit resource entry in the collection.  Only entries
        of type `application/vnd.sas.audit.entry.resource+json` can be created.
      requestBody:
        content:
          application/vnd.sas.audit.entry.resource+json:
            schema:
              $ref: "#/components/schemas/createResourceEntry"
            examples:
              postschema:
                $ref: "#/components/examples/postschema"
              postentry:
                $ref: "#/components/examples/postentry"
          application/json:
            schema:
              $ref: "#/components/schemas/createResourceEntry"
            examples:
              postentry:
                $ref: "#/components/examples/postentry"
        description: The resource entry
        required: true
      responses:
        "201":
          description: Created
          headers:
            Last-Modified:
              description: The ISO8601 timestamp representing the last time this entry
                was updated.
              schema:
                type: string
            Location:
              description: URL of the created resource
              schema:
                type: string
          content:
            application/vnd.sas.audit.entry.resource+json:
              schema:
                $ref: "#/components/schemas/entryResource"
              examples:
                postrespfields:
                  $ref: "#/components/examples/postrespfields"
                postentry:
                  $ref: "#/components/examples/postresponse"
            application/json:
              schema:
                $ref: "#/components/schemas/entryResource"
              examples:
                postrespfields:
                  $ref: "#/components/examples/postrespfields"
                postentry:
                  $ref: "#/components/examples/postresponse"
        "400":
          description: An invalid resource entry was provided.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Location:
              description: The location of the returned content.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/error13"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/error13"
