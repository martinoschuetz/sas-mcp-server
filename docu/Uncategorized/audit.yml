components:
  schemas:
    entryCollection:
      title: Audit Entry Collection
      description: A collection of audit entries
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: The array of `application/vnd.sas.audit.entry.resource` an`application/vnd.sas.audit.entry.security`
              representations.
            items:
              anyOf:
              - $ref: "#/components/schemas/entryResource"
              - $ref: "#/components/schemas/entrySecurity"
    baseCollection:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    entryBase:
      title: Base Properties
      description: Base properties used by entryResource and entrySecurity
      properties:
        id:
          type: string
          format: object-id
          description: The entry id.
        type:
          type: string
          description: The audit type.
        action:
          type: string
          description: The audit action (e.g. a read, update, or create action).
        user:
          type: string
          description: The userid associated with the event.
        remoteAddress:
          type: string
          description: The remote address from which the event originated.
        description:
          type: string
          description: Informational message describing the event.
        application:
          type: string
          description: The name of the source application the audit record originated
            from.
        state:
          type: string
          description: The state of the action, valid values include "success" or
            "failure".
        timeStamp:
          type: string
          format: date-time
          description: Timestamp of entry creation.
        traceId:
          type: string
          description: The trace id associated with the event.
        properties:
          type: object
          description: properties map (string, string).
        links:
          type: array
          description: Links that apply to this resource.
          items:
            $ref: "#/components/schemas/link"
        sessionSignature:
          type: string
          description: The session identifier
        insertionTimeStamp:
          type: string
          format: date-time
          description: The insertion timestamp records the time when a record is added
            to the audit database.
    link:
      title: Link
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method to invoke this endpoint.
        rel:
          type: string
          description: The relationship of this URL to the object.
        uri:
          type: string
          description: The relative URI of the REST endpoint.
        href:
          type: string
          description: The full URL of the REST endpoint.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type consumed/produced.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    entryResource:
      title: Resource Audit Entry
      description: resource audit entry representation
      required:
      - version
      - type
      - action
      - application
      - state
      - uri
      - user
      allOf:
      - $ref: "#/components/schemas/entryBase"
      - type: object
        properties:
          uri:
            type: string
            description: The uri from which this audit record was initiated.
          type:
            type: string
            description: The audit type, equivalent to "resource".
          httpContext:
            $ref: "#/components/schemas/httpContext"
          version:
            type: integer
            description: The version of the resource audit entry representation.  The
              supported versions are `1`,`2`,`3`,`4` and `5`.
