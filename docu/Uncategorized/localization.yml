  "/bundles/{bundleId}":
    x-sas-internal: true
    get:
      summary: Get a bundle
      description: 'Returns the resolved bundles for the locale specified in the Accept-Language.
        The resolved bundles have the full set of message keys. The locale indicates
        a language, a region and a script such as zh-Hans-CN, en-US. The region and
        the script are optional. The locale follows <a href="https://tools.ietf.org/html/bcp47">BCP-47</a>.
        The bundle id consists of three items &lt;service name&gt;-&lt;bundle type&gt;-&lt;bundle
        format&gt;. For more information, see the Terminology section on the **Details**
        tab.'
      operationId: getBundle
      tags:
      - Internal Message Bundles
      parameters:
      - description: The bundle ID.
        in: path
        name: bundleId
        required: true
        schema:
          type: string
      - description: "The locale, if not specified, a 400 error is returned."
        in: header
        name: Accept-Language
        required: true
        schema:
          type: string
