                      region: string
                      script: string
                      version: 1
              schema:
                $ref: "#/components/schemas/localizationContentTypeCollection"
          headers:
            Content-Type:
              description: Represents the content type. multipart/form-data, application/zip,
                or application/vnd.sas.collection+json.
              schema:
                $ref: "#/components/schemas/localizationContentTypeCollection"
