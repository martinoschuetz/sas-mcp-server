  "/contents/{namespace}":
    get:
      operationId: getContentTypeSummaries
      summary: Get a list of type summaries or message bundles
      tags:
      - Message Bundles
      description: |-
        Returns a list of type summaries or message bundles as properties files or a ZIP file.
        Retrieves one of five resources by specifying the http header Accept and
        Accept-Item. Only the second item requires the http header
        Accept-Language and returns a set of all message bundles that belong
        to the <i>namespace</i>.
        <table border="1"><tr><th>&nbsp;</th><th>resource</th><th>Accept http request header</th><th>Accept-Item http request header</th></tr>
        <tr><td align="center">1</td><td>a set of types summary</td><td>application/json or application/vnd.sas.collection+json</td><td>application/json or application/vnd.sas.localization.content.type+json</td></tr>
        <tr><td align="center">2</td><td>a set of message bundles</td><td>application/vnd.sas.collection+json</td><td>application/vnd.sas.localization.content+json</td></tr>
        <tr><td align="center">3</td><td>message bundles as the properties files</td><td>multipart/form-data</td><td>application/vnd.sas.properties.file</td></tr>
        <tr><td align="center">4</td><td>message bundles as a ZIP file using MIME</td><td>multipart/form-data</td><td>application/zip</td></tr>
        <tr><td align="center">5</td><td>message bundles as a ZIP file</td><td>application/zip</td><td>&nbsp;</td></tr>
        </table>
        <b>Retrieving (exporting) the message bundles as the properties files or a ZIP file.</b>
        <p>
        The properties file names are followed by the naming convention, which is described in the section "import/export the message bundles as properties files".
        In the http response, the properties files, the ZIP file, or the ZIP file that is in the MIME multipart/form-data format <a href="https://www.rfc-editor.org/rfc/rfc7578">RFC7578</a>.
        The character encoding of the properties files is utf-8.
        </p>
        <p>
        When the Accept http header is application/zip, the http response body is the content of the ZIP file.
        The Accept-Item http header must be specified when the Accept http header is application/json, application/vnd.sas.collection+json, or multipart/form-data. The available values are "application/zip" and "application/vnd.sas.properties.file".
        When the "application/zip" is specified for the Accept-Item http header, a ZIP file is returned  in a MIME part.
        When the "application/vnd.sas.properties.file" is specified, each properties file is returned in a MIME part.
        </p>
        <p>
        Using the <b>curl</b> command, a ZIP file can be downloaded.<br/>
        Here is an example.
        <pre>
        HOST=[Your cluster address]
        TOKEN=[Access token]
        curl -X GET -o archive.zip \
        -H "authorization:bearer $TOKEN" \
        -H "Accept: application/zip" \
        https://$HOST/localization/contents/entertainment
        </pre>
        The example downloads the archive.zip file that contains all the properties files in the
        namespace "entertainment".
        </p>
      parameters:
      - description: "Query filter, supported fields are `type` and `id`."
        in: query
        name: filter
        required: false
        schema:
          type: string
      - description: Offset of first item to retrieve (0-based). Defaults to 0.
        in: query
        name: start
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - description: Maximum number of items to retrieve. Defaults to 30 for a set
          of type summary. 0 for the message bundles, means all the message bundles.
        in: query
        name: limit
        required: false
        schema:
          default: 30
          format: int32
          type: integer
      - description: |-
          The Accept-Language http header is required only when the Accept
          http header is "application/vnd.sas.collection+json" and the
          Accept-Item http header is
          "application/vnd.sas.localization.content+json".<br/>
          This API returns the [resolved bundles](#LocaleChain) for the local
          specified in the Accept-Language.<br/>
          The resolved bundles have the full set of message keys.
          The locale follows
          <a href="https://tools.ietf.org/html/bcp47">BCP-47</a>. The bundle
          id consists of three items
          &lt;service name&gt;-&lt;bundle type&gt;-&lt;bundle format&gt;.
          <br/>See the Terminology section for detail.
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      - description: |-
          <ul>
          <li>application/vnd.sas.localization.content.type+json for a set of types summary
          <li>application/vnd.sas.localization.content+json for a set of
            message bundles. The Accept-Language is required in this case.
          <li>application/vnd.sas.properties.file or application/zip for message bundles as properties files or a ZIP file
          </ul>
        in: header
        name: Accept-Item
        required: false
        schema:
          enum:
          - application/json
          - application/vnd.sas.localization.content.type+json
          - application/vnd.sas.properties.file
          - application/zip
          type: string
      - description: |-
          <ul>
          <li>application/vnd.sas.collection+json for a set of types summary
          <li>multipart/form-data for message bundles as properties files or a ZIP file
          <li>application/json for a ZIP file
          </ul>
        in: header
        name: Accept
        required: true
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.sas.sas.collection+json
          - multipart/form-data
      responses:
        "200":
          description: |-
            The request succeeded.
            <p>
            For the Example-1 of Media type "multipart/form-data", here are
            the http headers Content-Type and Content-Item-Type.
            <pre>Content-Type: multipart/form-data;boundary=aBoundaryString
            Content-Item-Type: application/vnd.sas.properties.file</pre>
            For the Example-2 of Media type "multipart/form-data",
            the http headers Content-Type and Content-Item-Type are below.
            <pre>Content-Type: multipart/form-data;boundary=aBoundaryString
            Content-Item-Type: application/zip</pre>
            </p>
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  fileImage:
                    type: string
                    format: binary
              examples:
                Example-1:
                  value: |-
                    --aBoundaryString
                    Content-Disposition: form-data; name="file"; filename="myNamespace_default.properties"
                    Content-Type: text/plain

                    kitchen+knife+table+name=message text
                    kitchen+knife+table+label=message text
                    kitchen+knife+table+manufacture=message text
                    kitchen+knife+table+description=message text
                    kitchen+knife+clasp+name=message text
                    kitchen+knife+clasp+label=message text
                    kitchen+knife+clasp+manufacture=message text
                    kitchen+knife+clasp+description=message text
                    kitchen+knife+jackknife+name=message text
                    kitchen+knife+jackknife+label=message text
                    kitchen+knife+jackknife+manufacture=message text
                    kitchen+knife+jackknife+description=message text
                    --aBoundaryString
                    Content-Disposition: form-data; name="file"; filename="myNamespace_fr.properties"
                    Content-Type: text/plain

                    kitchen+knife+table+name=French message text
                    kitchen+knife+table+label=French message text
                    kitchen+knife+table+manufacture=French message text
                    kitchen+knife+table+description=French message text
                    kitchen+knife+clasp+name=French message text
                    kitchen+knife+clasp+label=French message text
                    kitchen+knife+clasp+manufacture=French message text
                    kitchen+knife+clasp+description=French message text
                    kitchen+knife+jackknife+name=French message text
                    kitchen+knife+jackknife+label=French message text
                    kitchen+knife+jackknife+manufacture=French message text
                    kitchen+knife+jackknife+description=French message text
                    --aBoundaryString--
                Example-2:
                  value: |-
                    --aBoundaryString
                    Content-Disposition: form-data; name="file"; filename="properties.zip"
                    Content-Type: application/zip
                    Content-Transfer-Encoding: base64

                    (ZIP file encoded in base64)
                    --aBoundaryString--
            application/zip:
              schema:
                type: object
                properties:
                  fileImage:
                    type: string
                    format: binary
              examples:
                Example-1:
                  value: |-
                    (ZIP file content)
            application/json:
              examples:
                example-1:
                  value:
                    accept: string
                    count: 0
                    items:
                    - id: string
                      links:
                      - href: string
                        itemType: string
                        method: string
                        rel: string
                        responseItemType: string
                        responseType: string
                        title: string
                        type: string
                        uri: string
                      namespace: string
