                      itemType: string
                      method: string
                      rel: string
                      responseItemType: string
                      responseType: string
                      title: string
                      type: string
                      uri: string
                    message: string
                    remediation: string
                    version: 0
              schema:
                $ref: "#/components/schemas/error2"
