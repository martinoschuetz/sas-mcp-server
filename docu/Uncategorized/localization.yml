                  --aBoundaryString--
              example-2:
                value: |-
                  --aBoundaryString
                  Content-Disposition: form-data; name="file"; filename="properties.zip"
                  Content-Type: application/zip
                  Content-Transfer-Encoding: base64

                  (ZIP file encoded in base64)
                  --aBoundaryString--
        description: |-
          The properties files must be written in UTF-8.
          <p>
          The http request body can contain multiple properties files or a ZIP file in the MIME multipart/form-data format <a href="https://www.rfc-editor.org/rfc/rfc7578">RFC7578</a>. The Content-Type must be `multipart/form-data` followed by the `boundary=` MIME parameter to specify the boundary of the MIME parts. Here is an example.
          <pre>Content-Type: multipart/form-data; boundary=aBoundaryString</pre>
          Each MIME part needs to have the MIME header `Content-Disposition`, which has parameters <i>name="file"</i> and <i>filename=</i>. <br/>
          Here are examples.
          <pre>Content-Disposition: form-data; name="file"; filename="myNamespace_default.properties"</pre>
          <pre>Content-Disposition: form-data; name="file"; filename="myProperties.zip"</pre>
          </p>
          <p>
          Each properties file is assumed to put in each MIME body. The content of each properties file can be encoded in the quoted-printable or base64.
          <br/>
          If the content is encoded in quoted-printable or base64, the MIME header "Content-Transfer-Encoding" needs to be specified to indicate the encoding.<br/>
          </p>
          <p>
          If a ZIP file is included in the MIME body, the MIME header "Content-Type" must indicate "application/zip". Also, the content of the ZIP file should be encoded in base64. The MIME header "Content-Transfer-Encoding" needs to be specified to indicate base64 as below.
          <pre>
          Content-Type: application/zip
          Content-Transfer-Encoding: base64
          </pre>
          </p>
