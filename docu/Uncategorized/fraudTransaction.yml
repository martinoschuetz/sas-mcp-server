components:
  requestBodies:
    search:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/search"
      description: request body for POST request
  schemas:
    aggregation:
      type: object
      properties:
        excludeFields:
          type: array
          items:
            type: string
        excludedFields:
          type: array
          items:
            type: string
        name:
          type: string
          description: The field that is aggregated
      title: aggregation
      description: This is the representation of kind of aggregation
    fieldTermCounts:
      type: object
      properties:
        max:
          type: number
          format: double
          description: The maximum value for a numeric field
        min:
          type: number
          format: double
          description: The minimum value for a numeric field
        termCount:
          type: integer
          format: int64
          description: Number of distinct values (i.e. cardinality)
        termName:
          type: string
          description: The name of a field
        version:
          type: integer
          format: int32
          description: This media type's schema version number
      title: fieldTermCounts
      description: This is the representation of field counts
    fieldValueAggregateStats:
      type: object
      properties:
        children:
          type: array
          description: Nested list of values
          items:
            $ref: "#/components/schemas/fieldValueAggregateStats"
        count:
          type: integer
          format: int32
          description: Matched number of values
        max:
          type: number
          format: double
          description: ${fieldValueAggregateStats.max}
        min:
          type: number
          format: double
          description: ${fieldValueAggregateStats.min}
        name:
          type: string
          description: Value of field name
        pct:
          type: number
          format: double
        score:
          type: number
          format: double
        scoreLevel:
          type: number
          format: double
        size:
          type: integer
          format: int32
          description: Number of items
        subSize:
          type: number
          format: double
          description: Number of items for nested list of values
        total:
          type: integer
          format: int32
          description: Total number of unique values
        version:
          type: integer
          format: int32
          description: This media type's schema version number
      title: fieldValueAggregateStats
      description: This is the representation of field aggregate statistics
    sampleStats:
      type: object
      properties:
        diskSize:
          type: integer
          format: int64
          description: Used disk space
        name:
          type: string
          description: Sample name
        numDocuments:
          type: integer
          format: int32
          description: Number of records
        numFields:
          type: integer
          format: int32
          description: Number of unique fields
        numTerms:
          type: integer
          format: int32
          description: Number of unique values
        termCounts:
          type: object
          description: cardinality for each field
          additionalProperties:
            $ref: "#/components/schemas/fieldTermCounts"
        version:
          type: integer
          format: int32
          description: This media type's schema version number
      title: sampleStats
      description: This is the representation of a transaction sample
    search:
      type: object
      required:
      - version
      properties:
        aggregations:
          type: object
          description: aggregation on fields
          additionalProperties:
            $ref: "#/components/schemas/aggregation"
        pageNumber:
          type: integer
          format: int64
          description: page number
        pageSize:
          type: integer
          format: int64
          description: page size
        queryString:
          type: string
          description: query string
        version:
          type: integer
          format: int32
          description: version of representation
      title: search
      description: This is a representation of search request
