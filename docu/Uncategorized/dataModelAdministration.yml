---
openapi: 3.0.3
info:
  title: Data Model Administration
  version: "1"
  description: |
    The Data Model Administration API enables you to configure and manage data models.
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: example.com/dataModelAdministration
  description: Local mock server
tags:
- description: Contains the operations for the root resource.
  name: Root
- description: Operations for managing tables in a data model.
  name: Tables
- description: Operations for managing table templates.
  name: Table Templates
- description: Operations for managing templates.
  name: Templates
- description: Operations for managing metadata.
  name: Metadata
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      operationId: root
      description: Returns a list of links to the top-level operations that are surfaced
        through this API.
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getDataModelAdministrationRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getDataModelAdministrationRootResponse"
          headers:
            Content-Type:
              description: Media type of the resource
              schema:
                type: string
        "404":
          $ref: "#/components/responses/404"
  /dataModels/{dataModelId}/tables/jobs:
    post:
      tags:
      - Tables
      description: |
        Creates a job to create tables in a data model. The job will have a system-generated ID.

        If a table with the same name already exists, it will be overwritten.
      summary: Create a job to create tables in a data model
      operationId: createDataModelTablesJob
      parameters:
      - $ref: "#/components/parameters/dataModelId"
      requestBody:
        $ref: "#/components/requestBodies/createDataModelTables"
      responses:
        "201":
          description: The job has finished executing
          headers:
            Location:
              description: URL of the job status resource
              schema:
                type: string
          content:
            application/vnd.sas.create-data-model-tables.job+json:
              schema:
                $ref: "#/components/schemas/createDataModelTablesJob"
              examples:
                completed:
                  $ref: "#/components/examples/completedCreateTablesJob"
                failed:
                  $ref: "#/components/examples/failedCreateTablesJob"
            application/json:
              schema:
                $ref: "#/components/schemas/createDataModelTablesJob"
              examples:
                completed:
                  $ref: "#/components/examples/completedCreateTablesJob"
                failed:
                  $ref: "#/components/examples/failedCreateTablesJob"
        "202":
          description: The job is running
          headers:
            Location:
              description: URL of the job status resource
              schema:
                type: string
          content:
            application/vnd.sas.create-data-model-tables.job+json:
              schema:
                $ref: "#/components/schemas/createDataModelTablesJob"
              examples:
                running:
                  $ref: "#/components/examples/runningCreateTablesJob"
            application/json:
              schema:
                $ref: "#/components/schemas/createDataModelTablesJob"
              examples:
                running:
                  $ref: "#/components/examples/runningCreateTablesJob"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
    get:
      tags:
      - Tables
      description: Returns the list of jobs to create tables in a data model.
      summary: Get the jobs to create tables in a data model
      operationId: getDataModelTableJobs
      parameters:
      - $ref: "#/components/parameters/dataModelId"
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/createDataModelTablesJobCollection"
              examples:
                default:
                  $ref: "#/components/examples/createDataModelTablesJobCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/createDataModelTablesJobCollection"
              examples:
                default:
                  $ref: "#/components/examples/createDataModelTablesJobCollection"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
    head:
      tags:
      - Tables
      description: Checks wether the list of jobs to create tables in a data model
        exists.
      summary: Get the headers for retrieving the list of jobs to create tables in
        a data model
      operationId: headersForGetDataModelTableJobs
      parameters:
      - $ref: "#/components/parameters/dataModelId"
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
  /dataModels/{dataModelId}/tables/jobs/{jobId}:
    parameters:
    - $ref: "#/components/parameters/dataModelId"
    - $ref: "#/components/parameters/jobId"
    get:
      tags:
      - Tables
      description: |
        Returns a job to create tables in a data model.

        If one or more tables cannot be created, the job itself will be successful but its state will be 'failed'.

        The error in the response lists which tables could not be created.
      summary: Get the job to create tables in a data model
      operationId: getDataModelTableJob
      parameters:
      - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.create-data-model-tables.job+json:
              schema:
                $ref: "#/components/schemas/createDataModelTablesJob"
              examples:
                running:
                  $ref: "#/components/examples/runningCreateTablesJob"
                completed:
                  $ref: "#/components/examples/completedCreateTablesJob"
                failed:
                  $ref: "#/components/examples/failedCreateTablesJob"
            application/json:
              schema:
                $ref: "#/components/schemas/createDataModelTablesJob"
              examples:
                running:
                  $ref: "#/components/examples/runningCreateTablesJob"
                completed:
                  $ref: "#/components/examples/completedCreateTablesJob"
                failed:
                  $ref: "#/components/examples/failedCreateTablesJob"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "404":
          $ref: "#/components/responses/404"
    head:
      tags:
      - Tables
      description: Checks whether a job to create tables in a data model exists.
      summary: Get the headers for retrieving a job to create tables in a data model
      operationId: headersForGetDataModelTableJob
      parameters:
      - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/head200"
        "404":
          $ref: "#/components/responses/404"
  /templates:
    get:
      summary: Get the list of templates
      description: Returns the list of templates.
      operationId: getTemplates
      tags:
      - Templates
      parameters:
      - $ref: "#/components/parameters/dataModelType"
      - $ref: "#/components/parameters/dataModelTypeVersion"
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The expected response to a valid request.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/templateCollection"
              examples:
                default:
                  $ref: "#/components/examples/templateCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/templateCollection"
              examples:
                default:
                  $ref: "#/components/examples/templateCollection"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
  /templates/{templateId}:
    parameters:
    - name: templateId
      in: path
      required: true
      description: The ID of the template to retrieve
      schema:
        type: string
    get:
      summary: Get a single template and the columns related to the template
      description: Returns the details for a specific view or table template and the
        related columns.
      operationId: getTemplate
      tags:
      - Templates
      responses:
        "200":
          description: The expected response to a valid request.
          content:
            application/vnd.sas.health.template+json:
              schema:
                $ref: "#/components/schemas/template"
              examples:
                default:
                  $ref: "#/components/examples/template"
            application/json:
              schema:
                $ref: "#/components/schemas/template"
              examples:
                default:
                  $ref: "#/components/examples/template"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
    patch:
      summary: Update specific validations for a specified template
      description: |
        Partially updates a template by updating template column validations as specified in a JSON patch.
        See https://datatracker.ietf.org/doc/html/rfc6902 for details about the JSON patch.
        Only the "replace" operation for a JSON patch is supported. No other operations for a JSON patch are supported.

        After the update, a representation of the updated template is returned.
      operationId: patchTemplate
      tags:
      - Templates
      requestBody:
        $ref: "#/components/requestBodies/patchTemplate"
      responses:
        "200":
          description: The target table was updated successfully. Return a JSON representation
            of the updated target table.
          content:
            application/vnd.sas.health.default-target-table:
              schema:
                $ref: "#/components/schemas/template"
              examples:
                Updated Target Table:
                  $ref: "#/components/examples/template"
            application/json:
              schema:
                $ref: "#/components/schemas/template"
              examples:
                Updated Target Table:
                  $ref: "#/components/examples/template"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "404":
          $ref: "#/components/responses/404"
        "400":
          description: The JSON patch request is not well-formed (for example, invalid
            JSON syntax).
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "409":
          description: |
            The patch request is syntactically valid but would result in a resource state that is inconsistent or invalid.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/conflict"
        "415":
          description: |
            The server refuses to accept the request because the payload format is in an unsupported format.

            For example the payload's Content-Type may not match the expected Content-Type.

            The response SHOULD include an Accept-Patch response header to notify the client what patch document media types are supported.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/unsupportedMediaType"
        "412":
          $ref: "#/components/responses/412"
    head:
      summary: Get the headers for a single template
      description: Checks whether a template exists.
      operationId: headersForGetTemplate
      tags:
      - Templates
      responses:
        "200":
          $ref: "#/components/responses/head200"
        "404":
          $ref: "#/components/responses/404"
  /metadata:
    parameters:
    - name: metadataId
      in: query
      required: false
      description: The ID of the metadata to retrieve
      schema:
        type: string
      example: 84005d9d-7caa-47a8-942c-7746db09a8bd
    - $ref: "#/components/parameters/filterParam"
    - $ref: "#/components/parameters/limitParam"
    get:
      summary: Get a metadata for a given ID
      description: Returns the details for a specific metadata.
      operationId: getMetadata
      tags:
      - Metadata
      responses:
        "200":
          description: The expected response to a valid request.
          content:
            application/vnd.sas.health.metadata+json:
              schema:
                $ref: "#/components/schemas/metadata"
              examples:
                default:
                  $ref: "#/components/examples/metadata"
            application/json:
              schema:
                $ref: "#/components/schemas/metadata"
              examples:
                default:
                  $ref: "#/components/examples/metadata"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
    head:
      summary: Get the headers for a single metadata entry
      description: Checks whether metadata exists.
      operationId: headersForGetMetadata
      tags:
      - Metadata
      responses:
        "200":
          $ref: "#/components/responses/head200"
        "404":
          $ref: "#/components/responses/404"
    patch:
      summary: Modify metadata
      description: Update metadata. Only add and remove operations are supported.
      operationId: patchMetadata
      requestBody:
        $ref: "#/components/requestBodies/metadataIdPatch"
      tags:
      - Metadata
      responses:
        "200":
          description: The request succeeded and the metadata has been updated.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "412":
          $ref: "#/components/responses/412"
        "422":
          $ref: "#/components/responses/422"
components:
  schemas:
    template:
      title: template
      description: The schema for a template.
      type: object
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          templateId:
            example: efc53099-96b2-4126-90a8-b5b59140a4fd
            type: string
          dataModelType:
            example: SINGLESTORE
            type: string
          dataModelTypeVersion:
            example: v2.1
            type: string
          templateName:
            example: HLS_PATIENT
            type: string
          templateDescription:
            example: patients
            type: string
          defaultTemplate:
            example: true
            type: boolean
          columns:
            type: array
            items:
              $ref: "#/components/schemas/column"
          version:
            type: integer
            title: Representation Version
            description: The schema version number for the media type.
            example: 1
          links:
            type: array
            title: Template Links
            description: The links that apply to this object.
            items:
              $ref: "#/components/schemas/link"
    metadata:
      title: metadata
      description: The schema for a metadata.
      type: object
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          metadataId:
            example: 5b7e1b77-9834-4b9d-987b-09c058aa2336
            type: string
          name:
            example: Code Systems Metadata
            type: string
          description:
            example: List of Code Systems
            type: string
          items:
            type: array
            items:
              $ref: "#/components/schemas/metadataItem"
          version:
            type: integer
            title: Representation Version
            description: The schema version number for the media type.
            example: 1
          links:
            type: array
            title: Metadata Links
            description: The links that apply to this object.
            items:
              $ref: "#/components/schemas/link"
    metadataItem:
      title: metadata item
      description: The schema for a metadata item.
      type: object
      properties:
        id:
          example: 05412e98-8a64-4c89-a146-2da4b6cd33e9
          type: string
        value:
          example: ICD-10
          type: string
        label:
          example: ICD-10
          type: string
    metadataPatchRequest:
      title: metadata patch request
      description: The schema for a metadata patch request.
      type: array
      items:
        type: object
        description: A list of operations to be applied to the target metadata in
          JSON Patch format.
        properties:
          op:
            type: string
            description: The operation to perform on the metadata.
            enum:
            - add
            - remove
          path:
            type: string
            description: Path to metadata item to delete.
            example: /items/0f665477-a21b-47ed-bc49-e05ac9a6cf72
          value:
            type: object
            properties:
              value:
                type: string
                example: ICD-10
              label:
                type: string
                example: ICD-10
            required:
            - value
            - label
        required:
        - op
        - path
    templateSummary:
      title: templateSummary
      description: The schema for a summary of a template.
      type: object
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          templateId:
            example: efc53099-96b2-4126-90a8-b5b59140a4fd
            type: string
          dataModelType:
            example: SINGLESTORE
            type: string
          dataModelTypeVersion:
            example: v2.1
            type: string
          templateName:
            example: HLS_PATIENT
            type: string
          templateDescription:
            example: patients
            type: string
          defaultTemplate:
            example: true
            type: boolean
          version:
            type: integer
            title: Representation Version
            description: The schema version number for the media type.
            example: 1
          links:
            type: array
            title: Table Links
            description: The links that apply to this object.
            items:
              $ref: "#/components/schemas/link"
    templateCollection:
      title: Collection of Templates
      description: A collection of templates.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query
            items:
              $ref: "#/components/schemas/templateSummary"
    column:
      title: Column
      description: The schema for a column in a table in a data model.
      type: object
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          id:
            example: efc53099-96b2-4126-90a8-b5b59140a4fd
            type: string
          name:
            example: given_nm
            type: string
          description:
            example: column description
            type: string
          defaultColumn:
            example: true
            type: boolean
          dataType:
            example: VARCHAR(250)
            type: string
    createDataModelTablesRequest:
      description: |
        The schema for the request to create tables in a data model.
        Tables are created from templates.
        Each table has an associated template.
      title: Schema for the Request to Create Data Model Tables
      type: object
      required:
      - tableTemplates
      properties:
        tableTemplates:
          type: array
          title: Templates
          description: IDs for the templates.
          items:
            type: string
          example:
          - 58c77eeb-dd78-497e-8674-2faeaf32a35c
          - 4eb887d5-1f1a-4517-a096-09bc184e249d
    createDataModelTablesJob:
      description: The schema of the job that creates tables in a data model.
      title: Schema of a Job That Creates Tables in a Data Model
      type: object
      required:
      - id
      - state
      - creationTimeStamp
      properties:
        id:
          type: string
          example: 3f43350e-061d-4d35-a684-ce6a9dedcf04
        state:
          type: string
          enum:
          - running
          - completed
          - completedWithErrors
          - failed
          example: completed
        creationTimeStamp:
          type: string
          example: 2022-12-05T10:15:30-05:00
        error:
          $ref: "#/components/schemas/error2"
        version:
          type: integer
          example: 1
        links:
          type: array
          title: Job Links
          description: The links that apply to the job that creates tables in a data
            model.
          items:
            $ref: "#/components/schemas/link"
    createDataModelTablesJobCollection:
      title: Collection of Jobs Table That Create Tables in a Data Model
      description: A collection of jobs that create tables in a data model.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query
            items:
              $ref: "#/components/schemas/createDataModelTablesJob"
    patchTemplateRequest:
      title: Schema of patch request for a template
      description: Request body for patch request for a template
      properties:
        columns:
          type: array
          title: Template columns
          description: Array of template column information
          items:
            description: Column information containing column id and column validations.
            type: object
            properties:
              id:
                description: Id of column being updated
                type: string
              validations:
                description: Validation value for the column
                type: string
                example: required
    trackedResource:
      title: Tracked Resource
      description: This class is used to provide common attributes and behaviors around
        tracking who and when objects were created and modified to representation
        objects.
      properties:
        createdBy:
          type: string
          description: The username of whoever created the resource.
        modifiedBy:
          type: string
          description: The username of whoever last modified the resource.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the resource was created.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the resource was last modified.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
