        An HTTP date-formatted timestamp that indicates the date and time at which the origin server believes that the selected representation was last modified, as determined at the conclusion of the request. The timestamp is used to determine whether the resource is the same as the previously stored one. Less accurate than an ETag header, it is a fallback mechanism. Conditional requests that contain If-Modified-Since or If-Unmodified-Since headers use this field.
