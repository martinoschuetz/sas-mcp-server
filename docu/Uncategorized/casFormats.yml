            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      summary: Modifies the specified format in the specified format library on the
        specified CAS server
      tags:
      - Formats
