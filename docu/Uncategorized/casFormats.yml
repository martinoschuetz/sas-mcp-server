---
openapi: 3.0.3
info:
  description: >
    The CAS Formats API provides the ability to maintain and manipulate
    user-defined formats in the CAS server.

    User-defined formats are used to map one value to another, allowing the user to
    determine how data is displayed, such as converting numeric values to strings.

    In the CAS server, user-defined formats are stored in one or more format libraries.  Format
    libraries maybe be persisted in a table in a caslib or to a file on disk.

    Format libraries have either session scope (formats available to all nodes of
    the session they are defined in) or global scope (formats available to all nodes
    of all sessions of the server).  To create a globally scoped format, a session
    scoped format must be promoted to global scope.

    The format search path defines the order in which format libraries are searched
    when locating a specific format.  If a global format library is part of the format
    search path, then a copy of the promoted library becomes a session-scoped format
    library with the same name. Retaining locally means the format library remains
    unmodified during the session.

    When a format is created with a specific locale, that locale is prepended to the
    format Id.  For example, a format $ABC may have multiple entries like: $ABC, en-$ABC,
    en_US-$ABC, it-$ABC, it_IT-$ABC, etc.

    When a format is applied to a raw value, the CAS session's locale is used for
    formatting purposes.  If a CAS session id is passed in on the request, then that
    session's locale will be used.  If no session id is passed on the request, a new
    one is created.  The locale set on the Accept-Language header of the request will
    become the new CAS session's locale.  So, if Accept-Language=en-US when using
    format $ABC, CAS will first try to locate en_US-$ABC.  If that is not found, it
    next tries en-$ABC.  If that is not found it will use $ABC if it exists.

    Link to documentation: http://documentation.sas.com/?cdcId=pgmsascdc&cdcVersion=9.4_3.3&docsetId=casformats&docsetTarget=titlepage.htm

    Authentication: <p> The API is secured and only accessible by authenticated users.
    </p>
  title: CAS Formats
  version: "3"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
paths:
  /:
    get:
      description: Returns a list of links to the top-level collections surfaced through
        this API.  HEAD is also supported and will return status and headers only.
      operationId: root
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
      summary: Get a list of top-level links
      tags:
      - Root
    head:
      description: Retrieves headers for the service. Can also be used to check if
        the service is available.
      operationId: headersForRoot
      responses:
        "200":
          description: OK.  The service is available.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/api"
      summary: Get headers for service
      tags:
      - Root
  "/servers/{serverId}/formatLibraries":
    get:
      description: Fetches a list of format libraries on the specified CAS server.  If
        none exist, an empty list is returned.
      operationId: getFormatLibraries
      parameters:
      - description: The ID of the CAS server containing the format libraries.
        in: path
        name: serverId
        required: true
        schema:
          type: string
      - description: The optional session ID of the CAS session containing the format
          libraries.  If not specified, a new session will be created.
        in: query
        name: sessionId
        required: false
        schema:
          type: string
      - description: The scope of format the libraries returned.  global or session.  If
          omitted, defaults to both global and session.
        in: query
        name: scope
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/formatLibrary"
            application/json:
              schema:
                $ref: "#/components/schemas/formatLibrary"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Not Found
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "500":
          description: Server Error
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      summary: Fetches a list of format libraries on the specified CAS server.  If
        none exist, an empty list is returned.
      tags:
      - FormatLibraries
    post:
      description: Creates/loads a format library from an item store, table, SAS catalog
        or just makes up an empty format library.  If format library already exists,
        it will be replaced.
      operationId: createFormatLibraries
      parameters:
      - description: The ID of the CAS server containing the format library.
        in: path
        name: serverId
        required: true
        schema:
          type: string
      - description: The optional session ID of the CAS session containing the format
          library.  If not specified, a new session will be created.
        in: query
        name: sessionId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.cas.format.source+json:
            schema:
              $ref: "#/components/schemas/source"
          application/json:
            schema:
              $ref: "#/components/schemas/source"
        description: Information necessary to create the format library from an item
          store, table, or just create an empty format library.
        required: true
      responses:
        "201":
          description: Success
          headers:
            Location:
              description: Location (URL) to fetch the format library just created.
              schema:
                type: string
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/formatLibraryPost"
            application/json:
              schema:
                $ref: "#/components/schemas/formatLibraryPost"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Not Found
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "500":
          description: Server Error
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      summary: Creates/loads a format library from an item store, table or just makes
        up an empty format library.  If format library already exists, it will be
        replaced.
      tags:
      - FormatLibraries
  "/servers/{serverId}/formatLibraries/{formatLibraryId}":
    delete:
      description: Deletes the specified format library on the specified CAS server.
      operationId: deleteFormatLibrary
      parameters:
      - description: The ID of the CAS server containing the format library to delete.
        in: path
        name: serverId
        required: true
        schema:
          type: string
      - description: The ID of the format library to persist. The ID is derived from
          the name but is safe for use in a URI.
        in: path
        name: formatLibraryId
        required: true
        schema:
          type: string
      - description: The optional session ID of the CAS session containing the format
          library to delete.  If not specified, a new session will be created.
        in: query
        name: sessionId
        required: false
        schema:
          type: string
      - description: "The scope the format library is to be dropped from.  NOTE: if\
          \ global is specified, the format library must be removed from session scope\
          \ first.  This will be done automatically.  This means that specifying a\
          \ scope of both or global will do the same thing.  Possible values are session,\
          \ global, or both.  The default value is session."
        in: query
        name: scope
        required: false
        schema:
          type: string
      - description: Whether format library should be removed from search order upon
          deletion.  Default is true.
        in: query
        name: removeFromSearchOrder
        required: false
        schema:
          type: boolean
      responses:
        "204":
          description: Success
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error2"
        "500":
          description: Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error2"
      summary: Deletes the specified format library on the specified CAS server.
      tags:
      - FormatLibraries
    get:
      description: Fetches the specified format library on the specified CAS server.
      operationId: getFormatLibrary
      parameters:
      - description: The ID of the CAS server containing the format library.
        in: path
        name: serverId
        required: true
        schema:
          type: string
      - description: The ID of the format library to fetch. The ID is derived from
          the name but is safe for use in a URI.
        in: path
        name: formatLibraryId
        required: true
        schema:
          type: string
      - description: Scope to get format library information for.  Can be global or
          session.  Defaults to session.
        in: query
        name: scope
        required: false
        schema:
          type: string
          default: session
      - description: The optional session ID of the CAS session containing the format
          library.  If not specified, a new session will be created.
        in: query
        name: sessionId
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/singleFormatLibrary"
            application/json:
              schema:
                $ref: "#/components/schemas/singleFormatLibrary"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Not Found
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "500":
          description: Server Error.  If format library not found, error code is 18705.
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      summary: Fetches the specified format library on the specified CAS server
      tags:
      - FormatLibraries
    post:
      description: Persists a format library to a CAS table.   The path for this operation
        is in the Location response header of the POST operation (/servers/{serverId}/formatLibraries)
        that created the format library.  The table can be used as input for creation
        of another format library via the create endpoint (POST - /servers/{serverId}/formatLibraries).
      operationId: persistFormatLibrary
      parameters:
      - description: The ID of the CAS server containing the format library.
        in: path
        name: serverId
        required: true
        schema:
          type: string
      - description: The ID of the format library to persist to a CAS table.
        in: path
        name: formatLibraryId
        required: true
        schema:
          type: string
      - description: The optional session ID of the CAS session containing the format
          library.  If not specified, a new session will be created.
        in: query
        name: sessionId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.cas.format.persist+json:
            schema:
              $ref: "#/components/schemas/formatLibraryPersist"
          application/json:
            schema:
              $ref: "#/components/schemas/formatLibraryPersist"
        description: Information necessary to persist the format library to a table.
        required: true
      responses:
        "201":
          description: Success
          headers:
            Location:
              description: Location (URL) to fetch the format library just created.
              schema:
                type: string
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/singleFormatLibrary"
            application/json:
              schema:
                $ref: "#/components/schemas/singleFormatLibrary"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Not Found
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "500":
          description: Server Error
          content:
            application/vnd.sas.cas.format.library+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      summary: Persists a format library to a CAS table.   The path for this operation
        is in the Location response header of the POST operation (/servers/{serverId}/formatLibraries)
        that created the format library.  The table can be used as input for creation
        of another format library via the create endpoint (POST - /servers/{serverId}/formatLibraries)
      tags:
      - FormatLibraries
  "/servers/{serverId}/formatLibraries/{formatLibraryId}/formats":
    get:
      description: Fetches a list of format summaries in the specified format library.  If
        none exist, an empty list is returned.
      operationId: getFormatsInFormatLibrary
      parameters:
      - description: The ID of the CAS server containing the format library.
        in: path
        name: serverId
        required: true
        schema:
          type: string
      - description: The ID of the format library to list formats in.
        in: path
        name: formatLibraryId
        required: true
        schema:
          type: string
      - description: Format library scope to get format summary information for.  Can
          be global or session.  Defaults to global.
        in: query
        name: scope
        required: false
        schema:
          type: string
          default: global
      - description: The optional session ID of the CAS session containing the format
          library.  If not specified, a new session will be created.
        in: query
        name: sessionId
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/formatSummaries"
            application/json:
              schema:
                $ref: "#/components/schemas/formatSummaries"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Not Found
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "500":
          description: Server Error
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      summary: Fetches a list of format summaries in the specified format library.  If
        none exist, an empty list is returned
      tags:
      - Formats
    post:
      description: Creates a format and adds it to the specified format library on
        the specified CAS server.  If format already exists in format library, 409
        conflict is returned.  If format library does not exist, 404 is returned.
      operationId: addFormat
      parameters:
      - description: The ID of the CAS server containing the format library.
        in: path
        name: serverId
        required: true
        schema:
          type: string
      - description: The ID of the format library to add a format to.
        in: path
        name: formatLibraryId
        required: true
        schema:
          type: string
      - description: Scope of format library to add format in.  Can be global or session.  Defaults
          to session.
        in: query
        name: scope
        required: false
        schema:
          type: string
          default: session
      - description: The optional session ID of the CAS session containing the format
          library.  If not specified, a new session will be created.
        in: query
        name: sessionId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.cas.format+json:
            schema:
              $ref: "#/components/schemas/format"
          application/json:
            schema:
              $ref: "#/components/schemas/format"
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/format"
        description: application/vnd.sas.cas.format+json item to be created.
        required: true
      responses:
        "201":
          description: Success
          headers:
            Location:
              description: Location (URL) to fetch the format library just created.
              schema:
                type: string
            etag:
              description: etag value to be used for modifying this format
              schema:
                type: integer
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/format"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/format"
            application/json:
              schema:
                $ref: "#/components/schemas/format"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Not Found
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "500":
          description: Server Error
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      summary: Creates a format and adds it to the specified format library on the
        specified CAS server.  If format already exists in format library, 409 conflict
        is returned
      tags:
      - Formats
  "/servers/{serverId}/formatLibraries/{formatLibraryId}/formats#multipost":
    post:
      description: Creates formats and adds them to the specified format library on
        the specified CAS server.  If a format already exists in the format library,
        409 conflict is returned.  If there is a problem adding one or more formats,
        then the returned collection will contain the errors interspersed with the
        successfully added formats.  A list of application/vnd.sas.cas.format+json
        or application/vnd.sas.cas.format.summary+json object can be returned.  Specify
        which type you would like in the 'Accept-Item' header.  If this header is
        omitted, then response will default to application/vnd.sas.cas.format+json
        objects.  No Location or ETag headers are returned when a collection is passed
        to this POST call.
      operationId: addMultiFormats
      parameters:
      - description: The ID of the CAS server containing the format library.
        in: path
        name: serverId
        required: true
        schema:
          type: string
      - description: The ID of the format library to add a format to.
        in: path
        name: formatLibraryId
        required: true
        schema:
          type: string
      - description: Scope of format library to add format in.  Can be global or session.  Defaults
          to session.
        in: query
        name: scope
        required: false
        schema:
          type: string
          default: session
      - description: The optional session ID of the CAS session containing the format
          library.  If not specified, a new session will be created.
        in: query
        name: sessionId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/format"
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/format"
        description: application/vnd.sas.collection+json list of application/vnd.sas.cas.format+json
          items to be created.
        required: true
      responses:
        "201":
          description: Success
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/collection2"
            application/vnd.sas.cas.format.summary+json:
              schema:
                $ref: "#/components/schemas/collection2"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/collection2"
            application/json:
              schema:
                $ref: "#/components/schemas/collection2"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.cas.format.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Not Found
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.cas.format.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.cas.format.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "500":
          description: Server Error
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.cas.format.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      summary: Creates formats and adds them to the specified format library on the
        specified CAS server.  If format already exists in format library, 409 conflict
        is returned.  If format library does not exist, 404 is returned
      tags:
      - Formats
  "/commons/validations/servers/{serverId}/formatLibraries/{formatLibraryId}/formats":
    post:
      description: Validates a collection of formats without actually adding them.  Returns
        application/vnd.sas.validation+json with first error encountered in it.
      operationId: validateFormat
      parameters:
      - description: The ID of the CAS server containing the format library.
        in: path
        name: serverId
        required: true
        schema:
