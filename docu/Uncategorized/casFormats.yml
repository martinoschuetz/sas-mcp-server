tags:
- description: User-defined formats.
  name: Formats
- description: Specialized libraries that contain formats.
  name: FormatLibraries
- description: An ordered list of format libraries.
  name: SearchOrder
- description: Root resources.
  name: Root
servers:
- url: http://example.com/casFormats
  description: This is an example base URL.
components:
  schemas:
    format:
      description: "Information for a format.  Link to documentation: http://documentation.sas.com/?cdcId=pgmsascdc&cdcVersion=9.4_3.3&docsetId=casformats&docsetTarget=titlepage.htm"
      example:
        ranges:
        - range: 1=value1
        - range: 2=value2
        - range: 3=value3
        libraryName: libName
        locale: en_US
        name: formatName
        version: 1
      properties:
        locale:
          description: The locale of this format.  CAS will lower case this and pre-pend
            it to the name.
          type: string
        dataType:
          description: Indicates whether the value is date, time, or dateTime.
          type: string
        fill:
          description: Indicates fill character (one character only) for PICTURE format.
          type: string
        libraryName:
          description: The name of the format library.
          type: string
        mult:
          description: Indicates multiplier for PICTURE format instead of computing
            based on decimal points. The server default is 0.
          type: number
        name:
          description: The name of the format.
          type: string
        noEdit:
          description: indicates non-picture label for PICTURE format.
          type: string
        prefix:
          description: Indicates prefix characters for PICTURE format.
          type: string
        ranges:
          description: The list of range values.
          type: array
          items:
            $ref: "#/components/schemas/range"
        version:
          description: version of this object
          type: integer
      required:
      - name
      - libraryName
      - ranges
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.format
        version: 1
    range:
      type: object
      description: A range.
    formatLibrary:
      title: formatLibraries
      type: object
      description: Information for a format library.
      example:
        name: formatLibraries
        count: 2
        items:
        - inSearchPath: true
          libraryName: myFormatLibrary
          caslibName: FORMATS
          tableName: myFormatLibrary
          links:
          - href: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
            itemType: application/vnd.sas.cas.format.library
            method: GET
            rel: self
            uri: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
          - href: /casFormats/servers/casServer/formatLibraries/myFormatLibrary?removeFromSearchOrder=true
            method: DELETE
            rel: delete
            uri: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
          - href: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
            itemType: application/vnd.sas.cas.format.persist
            method: POST
            rel: persist
            uri: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
          - href: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
            itemType: application/vnd.sas.cas.format.summary
            method: GET
            rel: formats
            type: application/vnd.sas.collection
            uri: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
          scope: global
          version: 1
        - inSearchPath: true
          libraryName: myFormatLibrary2
          caslibName: FORMATS
          tableName: whateverTableName
          links:
          - href: /casFormats/servers/casServer/formatLibraries/myFormatLibrary2
            itemType: application/vnd.sas.cas.format.library
            method: GET
            rel: self
            uri: /casFormats/servers/casServer/formatLibraries/myFormatLibrary2
          - href: /casFormats/servers/casServer/formatLibraries/myFormatLibrary2?removeFromSearchOrder=true
            method: DELETE
            rel: delete
            uri: /casFormats/servers/casServer/formatLibraries/myFormatLibrary2
          - href: /casFormats/servers/casServer/formatLibraries/myFormatLibrary2
            itemType: application/vnd.sas.cas.format.persist
            method: POST
            rel: persist
            uri: /casFormats/servers/casServer/formatLibraries/myFormatLibrary2
          - href: /casFormats/servers/casServer/formatLibraries/myFormatLibrary2
            itemType: application/vnd.sas.cas.format.summary
            method: GET
            rel: formats
            type: application/vnd.sas.collection
            uri: /casFormats/servers/casServer/formatLibraries/myFormatLibrary2
          scope: global
          version: 1
        links:
