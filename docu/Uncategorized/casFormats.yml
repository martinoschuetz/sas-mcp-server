          uri: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
        - href: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
          itemType: application/vnd.sas.cas.format.persist
          method: POST
          rel: persist
          uri: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
        - href: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
          itemType: application/vnd.sas.cas.format.summary
          method: GET
          rel: formats
          type: application/vnd.sas.collection
          uri: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
        scope: global
        version: 1
      properties:
        inSearchPath:
          description: is format library in format library search path? true or false.  Derived,
            not settable by user.
          type: boolean
        libraryName:
          description: The name of the format library.
          type: string
        scope:
          description: session or global.
          type: string
        caslibName:
          description: The caslib the table this format library was persisted to resides
            in.
          type: string
        tableName:
          description: The table this format library was persisted to.
          type: string
        version:
          description: version of this object
          type: integer
