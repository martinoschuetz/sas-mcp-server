      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.format.library
        version: 1
    source:
      description: Information needed to create format library.
      example:
        libraryName: fmtLibName
        scope: global
        searchOrder: append
        sourceUri: itemstore:/some/path/to/the/item/store/itemStore123
        type: itemStore
        version: 1
      properties:
        libraryName:
          description: Name of the format library to load in to CAS.
          type: string
        scope:
          description: session (the default) or global.  When loading up a cas format
            library, it will have a session or global scope.
          type: string
        searchOrder:
          description: Specifies how this new format library will appear in the search
            order.  Choices are append (the default, append to end of search order),
            insert (insert at begining of search order), none (don't add to search
            order), or replace (replace current search order with a new one containing
            just this format library).
          type: string
        sourceUri:
          description: "Information pointing to the location of the type to pull format\
            \ library from.  Prefixed with 'itemstore:' in the case of itemStore type,\
            \ 'catalog:' in the case of a SAS catalog and 'table:' in the case of\
            \ a CAS table (sashdat) that a casManagement or dataTables uri is not\
            \ used for.  Note: The itemstore and table locations must be accesible\
            \ by the CAS controller or backup controller.  The SAS catalog location\
            \ must be accesible by the compute server's SAS session."
          type: string
        type:
          description: Type of container format library is being pulled from.  itemStore,
            table, catalog, or new (just create an empty format library).   In the
            case of 'table' it specifies a CAS table type and will consist of a uri
            returning a type of application/vnd.sas.data.table+json.
          type: string
        version:
          description: version of this object
          type: integer
      required:
      - sourceUri
      - type
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.format.source
        version: 1
