    formatLibraryPersist:
      description: Information needed to persist a format library to a table (use
        caslibName and tableName).  Note that the table will not be loaded in to memory,
        but be on disk in the caslib's directory.  To save format library to it's
        corresponding default caslib and table (set at CAS startup) leave the caslib
        and table fields blank.
      example:
        caslibName: Formats
        replace: true
        tableName: userformats1
        version: 1
      properties:
        caslibName:
          description: Caslib name in which table is in that format library is saved
            in.  Leave this field, and tableName field, blank for default caslib set
            at CAS startup.
          type: string
        replace:
          description: Specifies whether to overwrite an existing table with the same
            name.  Defaults to true.
          type: boolean
        tableName:
          description: Table name of table to save format library in.  Leave this
            field, and caslibName field, blank for default table set at CAS startup.
          type: string
        version:
          description: version of this object
          type: integer
      required:
      - caslibName
      - tableName
      type: object
      x-sas-media-type:
        name: application/vnd.sas.cas.format.persist
        version: 1
