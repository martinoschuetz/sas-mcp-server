            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: Precondition Required.
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "500":
