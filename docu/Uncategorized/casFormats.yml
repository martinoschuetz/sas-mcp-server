    singleFormatLibrary:
      description: Information for a format library.
      example:
        inSearchPath: true
        libraryName: myFormatLibrary
        caslibName: FORMATS
        tableName: myFormatLibrary
        links:
        - href: /casFormats/servers/casServer/formatLibraries/myFormatLibrary
