    put:
      description: >-
        Modifies the specified format in the specified format library on the
        specified CAS server.


        Note that a header value *must* now be supplied.  The header is the If-Match
        header.  It's value must be a value corresponding to the current state of
        the format being modified in CAS (hashcode).  A client will get this value
        from the etag header which now will be returned from a get format ranges call
        which is


        GET /servers/{serverId}/formatLibraries/{formatLibraryId}/formats/{formatId}.


        The purpose of this is to prevent modification of a format that has been modified
        by someone else since it was last fetched, which would cause the interim changes
        to be overwritten.
      operationId: updateFormat
      parameters:
      - description: The ID of the CAS server containing the format library.
        in: path
        name: serverId
        required: true
        schema:
          type: string
      - description: The ID of the format library to add a format to.
        in: path
        name: formatLibraryId
        required: true
        schema:
          type: string
      - description: "The ID of the format to modify.  Note: ID may have locale prepended\
          \ to it."
        in: path
        name: formatId
        required: true
        schema:
          type: string
      - description: Scope of format library to modify format in.  Can be global or
          session.  Defaults to session.
        in: query
        name: scope
        required: false
        schema:
          type: string
          default: session
      - description: The optional session ID of the CAS session containing the format
          library.  If not specified, a new session will be created.
        in: query
        name: sessionId
        required: false
        schema:
          type: string
      - description: Value corresponding to the current state of the format being
          modified in CAS (hashcode).  A client will get this value from the etag
          header which is returned from a get format call.
        in: header
        name: If-Match
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/vnd.sas.cas.format+json:
            schema:
              $ref: "#/components/schemas/format"
          application/json:
            schema:
              $ref: "#/components/schemas/format"
        description: application/vnd.sas.cas.format+json item to be modified.
        required: true
      responses:
        "200":
          description: Success
          headers:
            Location:
              description: Location (URL) to fetch the format just modified.
              schema:
                type: string
            etag:
              description: etag value to be used for modifying this format
              schema:
                type: integer
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/format"
            application/json:
              schema:
                $ref: "#/components/schemas/format"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Not Found
          content:
            application/vnd.sas.cas.format+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "412":
          description: Precondition Failed.
