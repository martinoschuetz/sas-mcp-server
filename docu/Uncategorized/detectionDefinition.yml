  /messageClassifications:
    post:
      summary: Create a message classification
      tags:
      - Message Classifications
      operationId: createMessageClassification
      description: Creates a message classification from a JSON representation.
      requestBody:
        description: A JSON representation of the message classification to be created.
        content:
          application/vnd.sas.detection.message.classification+json:
            schema:
              $ref: "#/components/schemas/messageClassification"
            examples:
              default:
                $ref: "#/components/examples/new_message_classification"
              with key code:
                $ref: "#/components/examples/new_message_classification_with_keycode"
          application/json:
            schema:
              $ref: "#/components/schemas/messageClassification"
            examples:
              default:
                $ref: "#/components/examples/new_message_classification"
              with key code:
                $ref: "#/components/examples/new_message_classification_with_keycode"
      responses:
        "201":
          description: The message classification was created.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.message.classification+json:
              schema:
                $ref: "#/components/schemas/messageClassification"
              examples:
                default:
                  $ref: "#/components/examples/message_classification"
            application/json:
              schema:
                $ref: "#/components/schemas/messageClassification"
              examples:
                default:
                  $ref: "#/components/examples/message_classification"
        "400":
          description: |
            The request was invalid.
            The following are possible reasons:
            - The message classification name or key code might not be valid.
            - The parent message classification with the specified ID might not exist.
            - The message classification key code might not be prefixed with its parent's keyCode.
            - The system might not be able to generate a key code for the message classification due to the following:
               - The parent message classification is already at the deepest allowed level.
               - The parent message classification already has the maximum number of allowed children.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/new_msgclass_error_400"
        "409":
          description: |
            The request could not be completed due to a conflict with an existing resource.
            The following are possible reasons:
            - The name or key code of the message classification might not be unique.
            - The root message classification already exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/new_msgclass_error_409"
    get:
      summary: Get message classifications
      tags:
      - Message Classifications
      operationId: getMessageClassificationList
      description: Returns the collection of message classifications.
      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/messageClassificationCollection"
              examples:
                default:
                  $ref: "#/components/examples/get_message_classifications"
            application/json:
              schema:
                $ref: "#/components/schemas/messageClassificationCollection"
              examples:
                default:
                  $ref: "#/components/examples/get_message_classifications"
        "400":
          description: |
            The request was invalid.
            The following is a possible reason:
            - The query parameter might be invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_msgclasses_error_400"
  /messageClassifications/exports:
    post:
      summary: Export message classifications
      tags:
      - Message Classifications
      operationId: createMessageClassificationsExport
      description: |
        Exports message classifications in CSV format.
        To export an entire message classification hierarchical structure, or any subtree of the entire structure,
        to a CSV file, complete these steps:
        1. Set the <b>Accept</b> header to one of the following:
            - application/vnd.sas.detection.message.classification+csv
            - text/csv
        2. (Optional) Provide the message classification ID to export in the request `parentId` parameter.
        If no `parentId` value is provided, the entire message classification hierarchy is exported.
      parameters:
      - $ref: "#/components/parameters/mcExportRelativeToParentIdParam"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.detection.message.classification+csv:
              schema:
                $ref: "#/components/schemas/messageClassificationCsv"
              examples:
                default:
                  $ref: "#/components/examples/export"
            text/csv:
              schema:
                $ref: "#/components/schemas/messageClassificationCsv"
              examples:
                default:
                  $ref: "#/components/examples/export"
  /messageClassifications/imports:
    post:
      summary: Import message classifications
      tags:
      - Message Classifications
      operationId: createMessageClassificationsImport
      description: |
        Imports message classifications from a CSV file.
        To import an entire message classification hierarchical structure from a CSV file, complete these steps:
        1. Set the <b>Content-Type</b> header to text/csv.
        2. Provide the message classification hierarchical structure in the request body.
        3. To validate a CSV file and receive the summary first, set the <b>Accept</b> header to application/vnd.sas.detection.message.classification.import.validation+json.
        4. Correct all errors that were reported in the previous step and re-validate the file until no validation errors are found.
        5. To import the message classification hierarchical structure, set the <b>Accept</b> header to application/vnd.sas.detection.message.classification+json or application/json.

        If a message classification already exists with a given `keyCode`, that message classification will be updated.
        Only the `name` and `displayName` fields can be modified.
      parameters:
      - $ref: "#/components/parameters/mcImportRelativeToParentIdParam"
      requestBody:
        description: The comma-separated message classification values to import.
        content:
          text/csv:
            schema:
              $ref: "#/components/schemas/messageClassificationCsv"
            examples:
              import-csv:
                $ref: "#/components/examples/import_message_classifications"
          application/vnd.sas.detection.message.classification+csv:
            schema:
              $ref: "#/components/schemas/messageClassificationCsv"
            examples:
              import-csv:
                $ref: "#/components/examples/import_message_classifications"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.detection.message.classification.import.validation+json:
              schema:
                $ref: "#/components/schemas/messageClassificationImportValidation"
              examples:
                valid-import:
                  $ref: "#/components/examples/import_validation_200_valid"
                invalid-import:
                  $ref: "#/components/examples/import_validation_200_invalid"
        "201":
          description: A hierarchy of message classifications was created from the
            import file.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.message.classification+json:
              schema:
                $ref: "#/components/schemas/messageClassification"
              examples:
                default:
                  $ref: "#/components/examples/message_classification"
            application/json:
              schema:
                $ref: "#/components/schemas/messageClassification"
              examples:
                default:
                  $ref: "#/components/examples/message_classification"
        "400":
          description: |
            The request was invalid.
            The following are possible reasons:
            - The input CSV file is invalid (for example, it is missing required columns or contains incorrect data types).
            - The name or key code of a message classification is not unique.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/import_error_400"
