    updateRulePrioritizationInput:
      description: The updated execution priority of a rule relative to other rules
        in the same project.
      type: object
      properties:
        id:
          type: string
          description: The UUID of the rule.
          format: uuid
        executionOrderType:
          type: integer
          enum:
          - -1
          - 0
          - 1
          description: |
            The type of the execution order. There are three pre-defined sets of rules:
            (-1) Pre rules
            (0)  Dependency ordered rules
            (1)  Post rules

            The pre rules set executes first, then the dependency ordered rules set, then the post rules set.
          default: 0
        executionOrderPriority:
          type: integer
          description: |
            The priority of the rule within execution order type. This is
            required for pre rules or post rules and is
            ignored for dependency ordered rules.
      required:
      - id
    updateRuleInputv2:
      title: UpdateRule
