              examples:
                default:
                  $ref: "#/components/examples/update_msgclass_error_409"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/update_msgclass_error_412"
        "422":
          description: |
            The request cannot be processed even though it is syntactically valid.
            The following is a possible reason:
            - The message classification with the specified ID does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/update_msgclass_error_422"
        "428":
          description: The request headers did not include an `If-Match` or `If-Unmodified-Since`
            precondition.
          headers:
            Location:
