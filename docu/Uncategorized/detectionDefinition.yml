        type: string
    etagHeader:
      description: A hash code for the response resource.
      schema:
        type: string
  schemas:
    deployment:
      description: A detection deployment.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        buildNumber:
          type: integer
          readOnly: true
        state:
          type: string
