  /organizations:
    post:
      summary: Create an organization
      tags:
      - Organizations
      operationId: createOrganization
      description: |
        Creates an organization in the following way:
        - A default profile message schema shell named <i>&lt;Organization Name&gt; Profile</i>
          is created in the SAS Detection Message Schema service.
        - A default deployment definition is created for the organization.

        ### To create an organization from a JSON representation:
        1. Set the Content-type header to application/vnd.sas.detection.organization+json or application/json.
        2. Provide the organization's JSON representation in the request body.
        3. Set the organization's name, description and display name. You can use different names from the associated message classification.
        4. Specify at least one role and one message schema for the organization.
        5. (Optional) Assign additional roles, message schemas, and advanced lists.

        Note: The additional data that you provide must exist before your organization is created. An organization creation
          request fails if your preferred profile schema, a specified role, message schema, or advanced list does not exist.
      requestBody:
        description: A JSON representation of the organization to be created.
        content:
          application/vnd.sas.detection.organization+json:
            schema:
              $ref: "#/components/schemas/createOrganizationInput"
            examples:
              default:
                $ref: "#/components/examples/new_org_v3"
              prior-version:
                $ref: "#/components/examples/new_org_v2"
          application/json:
            schema:
              $ref: "#/components/schemas/createOrganizationInput"
            examples:
              default:
                $ref: "#/components/examples/new_org_v3"
              prior-version:
                $ref: "#/components/examples/new_org_v2"
      responses:
        "201":
          description: The organization was created.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.organization+json:
              schema:
                $ref: "#/components/schemas/organizationv2"
              examples:
                default:
                  $ref: "#/components/examples/org_v3"
            application/json:
              schema:
                $ref: "#/components/schemas/organizationv2"
              examples:
                default:
                  $ref: "#/components/examples/org_v3"
        "400":
          description: |
            The request was invalid.
            The following are possible reasons:
            - The organization name might not be a valid name.
            - The message classification with the specified ID might not exist.
            - The specified role or roles might not exist.
            - The specified role or roles might not be a role in the Detection Definition service.
            - The specified role or roles might not have the required organization capabilities.
            - The specified advanced list or lists might not exist.
            - No message schema is specified.
            - No role is specified.
            - The specified message schemas might contain variable definitions for the same
              `jsonPath` and `name` that do not match each other.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/new_org_error_400"
                no message schema:
                  $ref: "#/components/examples/new_org_no_message_schema_error_400"
                no role:
                  $ref: "#/components/examples/new_org_no_role_error_400"
        "409":
          description: |
            The request could not be completed due to a conflict with an existing resource.
            The following is a possible reason:
            - The organization name might not be unique.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/new_org_error_409"
        "422":
          description: |
            The request cannot be processed even though it is syntactically valid.
            The following is a possible reason:
            - The default profile schema was not created for the organization.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/new_org_error_422"
    get:
      summary: Get a list of organizations
      tags:
      - Organizations
      operationId: getOrganizationList
      description: |
        Returns the collection of organizations. In addition to listing an organization's properties, you can filter the list by the associated schema name, the schema ID, or both.
      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/organizationCollectionv2"
              examples:
                default:
                  $ref: "#/components/examples/get_orgs_v2"
            application/json:
              schema:
                $ref: "#/components/schemas/organizationCollectionv2"
              examples:
                default:
                  $ref: "#/components/examples/get_orgs_v2"
            application/vnd.sas.detection.organization.extended.collection+json:
              schema:
                $ref: "#/components/schemas/organizationExtendedCollectionv2"
              examples:
                default:
                  $ref: "#/components/examples/get_orgs_extended_v2"
        "400":
          description: |
            The request was invalid.
            The following is a possible reason:
            - The query parameter might be invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_orgs_error_400"
  /organizations/{orgId}:
    parameters:
    - $ref: "#/components/parameters/orgIdParam"
    get:
      summary: Get an organization
      parameters:
      - $ref: "#/components/parameters/depthParam"
      tags:
      - Organizations
      operationId: getOrganization
      description: |
        Retrieves the organization by its ID. Specify a depth to return the associated message classification
        and sub-message classifications up to the depth. If a depth is not specified, then no message classifications are returned.
        Set the depth to 0 to include only the associated message classification. To return all sub-message classifications,
        set depth to -1.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
          content:
            application/vnd.sas.detection.organization+json:
              schema:
                $ref: "#/components/schemas/organizationv2"
              examples:
                default:
                  $ref: "#/components/examples/org_v3"
            application/vnd.sas.detection.organization+json;version=2:
              schema:
                $ref: "#/components/schemas/organizationv2"
              examples:
                default:
                  $ref: "#/components/examples/org_v3"
            application/json:
              schema:
                $ref: "#/components/schemas/organizationv2"
              examples:
                default:
                  $ref: "#/components/examples/org_v3"
        "400":
          description: |
            The request was invalid.
            The following is a possible reason:
            - The organization ID might be invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_org_error_400"
    patch:
      summary: Update an organization
      tags:
      - Organizations
      operationId: patchOrganization
      description: |
        Updates the specified organization. You can update the name, description, and display name of an organization.
        You can also modify the organization's roles, schemas, and relations using the content type "application/json-patch+json".
      requestBody:
        description: |
          A JSON representation of one or more fields to be updated.
          If you are only changing the name, description, and/or display name, you can use content types "application/json"
          or "application/vnd.sas.detection.organization+json".

          The content type "application/json-patch+json" supports operations that `add` and `remove` roles, schemas, and other relations,
          as well as `replace` the name, description, and/or display name of the organization.
          The operations specified in the content are processed in the order of `replace`, `remove`, and `add`.
          For more details about the supported operations, select "application/json-patch+json" from the content type dropdown above.
        content:
          application/json-patch+json:
            schema:
              $ref: "#/components/schemas/patchOrganizationJsonPatchInput"
            examples:
              default:
                $ref: "#/components/examples/patch_org_v3"
              prior-version:
                $ref: "#/components/examples/patch_org"
          application/vnd.sas.detection.organization+json:
            schema:
              $ref: "#/components/schemas/updateOrganizationInput"
            examples:
              default:
                $ref: "#/components/examples/update_org"
          application/json:
            schema:
              $ref: "#/components/schemas/updateOrganizationInput"
            examples:
              default:
                $ref: "#/components/examples/update_org"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.organization+json:
              schema:
                $ref: "#/components/schemas/organizationv2"
              examples:
                default:
                  $ref: "#/components/examples/patch_org_v3_200"
            application/json:
              schema:
                $ref: "#/components/schemas/organizationv2"
              examples:
                default:
                  $ref: "#/components/examples/patch_org_v3_200"
        "400":
          description: |
            The request was invalid.
            The following are possible reasons:
            - The organization ID might be invalid.
            - The organization name might not be a valid name.
            - The ID in the request body might not match the ID in the URL.
            - A schema, role, or advanced list to be added might not exist.
            - A schema to be added might contain a variable definition that does not match
              the definition of a variable with the same `jsonPath` and `name` in the
              organization's current schemas, or in another schema that is to be added.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/update_org_error_400"
        "409":
          description: |
            The request could not be completed due to a conflict with an existing resource.
            The following are possible reasons:
            - The new name is in use by another organization.
            - A schema or advanced list to be removed is in use by projects in the organization.
            - All schemas or roles would be removed from the organization.
            - Removing a role or roles might remove required organization capabilities.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/update_org_error_409"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/update_org_error_412"
        "428":
          description: The request headers did not include an `If-Match` or `If-Unmodified-Since`
            precondition.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/update_org_error_428"
    delete:
      summary: Delete an organization
      tags:
      - Organizations
      operationId: deleteOrganization
      description: |
        Deletes an organization and removes all links to associated roles and message schemas.
        Also deletes the organization's deployment definition.
      responses:
        "204":
          description: The organization was deleted.
        "400":
          description: |
            The request was invalid.
            The following is a possible reason:
            - The organization ID is not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/org_id_error"
        "409":
          description: |
            The request could not be completed due to a conflict with an existing resource.
            The following is a possible reason:
            - One or more projects exist in the organization.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/delete_org_error_409"
