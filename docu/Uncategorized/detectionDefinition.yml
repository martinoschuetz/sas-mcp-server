          type: string
          description: The UUID of the model.
          readOnly: true
        version:
          type: number
          description: The version number for model.
          readOnly: true
        name:
          type: string
          description: The name of the model. Valid values are letters, numbers, hyphens,
            underscores, and spaces.
          maxLength: 25
        description:
          type: string
          description: The description of the model.
        status:
          type: string
          description: The completion status of the model registration process.
          enum:
          - complete
          - in_progress
          - has_errors
          - active
        organizationId:
          type: string
          description: The UUID of the organization to which the model is registered.
        invalidModelRepositoryModelId:
          type: boolean
          description: An indicator for whether the modelRepositoryModelId is now
            invalid.
        modelRepositoryModelId:
          type: string
          description: The unique identifier for the model in the model repository.
        modelRepositoryModel:
          $ref: "#/components/schemas/modelRepositoryModel"
        modelRepositoryModelProperties:
          $ref: "#/components/schemas/modelProperties"
        inputMapping:
          type: array
          description: The list of mappings from model input to message fields.
          items:
            $ref: "#/components/schemas/inputOutputMapping"
        outputMapping:
          type: array
          description: The list of mappings from the model output to message fields.
          items:
            $ref: "#/components/schemas/inputOutputMapping"
        isSignature:
          type: boolean
          description: An indicator for whether the model is a signature model.
        associatedModels:
          type: array
          description: The list of registered models that are associated with a signature.
          items:
            $ref: "#/components/schemas/modelv3"
        messageClassificationRelations:
          type: array
          description: The message classifications with which the model is associated.
          items:
            $ref: "#/components/schemas/messageClassification"
        rules:
          type: array
          description: The list of rules that are using the model.
          items:
            $ref: "#/components/schemas/rulev2"
        createdBy:
          type: string
          description: The user who created the model.
          readOnly: true
        modifiedBy:
          type: string
          description: The last user who modified the model.
          readOnly: true
        creationTimeStamp:
          type: string
          description: The creation timestamp of a model, in the format of `YYYY-MM-DDThh:mm:ss.sssZ`.
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: The timestamp of last update of a model, in the format of `YYYY-MM-DDThh:mm:ss.sssZ`.
          readOnly: true
        revision:
          type: integer
          description: The revision ID.
    postModelv3:
