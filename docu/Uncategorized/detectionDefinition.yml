    parameters:
    - $ref: "#/components/parameters/projectIdParam"
    post:
      summary: Disable rules
      tags:
      - Rules
      operationId: createDisabledRules
      description: |
        Disables a set of rules, so they cannot be run against incoming transactions.
        If any rule in the set cannot be disabled (for example, a rule has an invalid rule ID), then no rules are disabled.
      requestBody:
        description: Selection of rules
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ruleIdList"
            examples:
              default:
                $ref: "#/components/examples/update_rule_active"
          application/vnd.sas.detection.rule.id.list+json:
            schema:
              $ref: "#/components/schemas/ruleIdList"
            examples:
              default:
                $ref: "#/components/examples/update_rule_active"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/ruleDisableCollection"
              examples:
                default:
                  $ref: "#/components/examples/disable_rules"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/disable_rules_error_400"
  /projects/{projectId}/rules/enabled:
    parameters:
    - $ref: "#/components/parameters/projectIdParam"
    post:
      summary: Enable rules
      tags:
      - Rules
      operationId: createEnabledRules
      description: |
        Enables a set of rules, so they can be run against incoming transactions.
        If any rule in the set cannot be enabled (for example, a rule has an invalid rule ID), then no rules are enabled.
      requestBody:
        description: Selection of rules
        content:
