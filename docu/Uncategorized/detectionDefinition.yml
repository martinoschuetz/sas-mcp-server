          readOnly: true
          description: The identifier of the base rule (shared by all versions of
            the rule).
        ruleVersion:
          type: number
          readOnly: true
          description: The version number of the rule.
        name:
          type: string
          readOnly: true
          description: The name of the rule.
        ruleTypeName:
          type: string
          readOnly: true
          description: The name of the rule type that is associated with this rule.
        state:
          type: string
          readOnly: true
          description: The current state of the rule.
        dependencies:
          type: array
          readOnly: true
