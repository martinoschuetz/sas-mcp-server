      type: array
      items:
        description: A list of JSONPatchOperation to be applied to the projects.
        type: object
        properties:
          op:
            description: |
              An operation to be performed in the patch. The following are supported operations:
              - *add*: adds a list relationship to one or more projects.
              - *remove*: removes a list relationship from one or more projects.
            type: string
            enum:
            - add
            - remove
          path:
            description: |
              The project relationship which is updated.
              The following are applicable values for supported operations:
              - *add*: adds *listRelations*.
              - *remove*: removes *listRelations*.
            type: string
            enum:
            - listRelations
          value:
            description: The project IDs to which a list relationship is added or
              removed.
            oneOf:
            - type: string
            - type: array
              items:
                type: string
        required:
        - op
        - path
        - value

