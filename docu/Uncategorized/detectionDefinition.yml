    modelIdArray:
      type: array
      description: The list of IDs of models to be deleted.
      items:
        $ref: "#/components/schemas/modelID"
    list:
      description: A detection lookup list.
      type: object
      properties:
        id:
          type: string
          description: The UUID of the list.
          readOnly: true
        name:
          type: string
          description: The name of the list.
          readOnly: true
        description:
          description: The description of the list.
          type: string
        version:
          type: number
          description: The version number for the list.
          readOnly: true
        creationTimeStamp:
          type: string
          description: The creation timestamp of the list, in the format of `YYYY-MM-DDThh:mm:ss.sssZ`.
          readOnly: true
        columns:
          type: array
          description: The list columns information.
          items:
            type: object
            properties:
              name:
                type: string
                description: The column name.
              datatype:
                type: string
                description: The type of data for the column.
              position:
                type: integer
                description: The column position in the list.
              isKey:
                type: boolean
                description: An indicator that the column's value is used to create
                  the key value.
              keyPosition:
                type: integer
                description: A 1-based position index that specifies where a column's
                  value is located in the key value. A '0' means not a key.
            required:
            - name
            - datatype
            - position
      required:
      - id
    listCollection:
      title: ListCollection
      description: A collection of list objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/list"
    rulePackageCollection:
      title: RulePackageCollection
      description: A collection of package objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/rulePackage"
    ruleEvaluationCriteria:
      description: The criteria that are used for the rule evaluation.
      type: object
      properties:
        messageLimit:
          type: number
          description: The maximum number of messages to be used for an evaluation.
        outcomeLimit:
          type: number
          description: The decision outcome limit for the rule evaluation.
        alertLimit:
          type: number
          description: The alert limit for the rule evaluation.
        updateFrequency:
          type: number
          description: The frequency in which to update statistics.
        logWithAdditionalDetails:
          type: boolean
          description: The additional log details.
    ruleImportResult:
      description: The imported rule result.
      type: object
      properties:
        baseRuleId:
          description: The base rule identifier that is assigned by the system.
          type: string
        ruleVersion:
          type: number
          readOnly: true
          description: The version number of the rule.
        name:
          description: The name of the rule.
          type: string
        code:
          description: The rule code.
          type: string
        alertTypeMatch:
          $ref: "#/components/schemas/alertTypeMatchingResult"
        messageClassificationMatch:
          $ref: "#/components/schemas/messageClassificationMatchingResult"
        messageClassificationMapping:
          $ref: "#/components/schemas/messageClassificationMappingResult"
        schemaNameMatch:
          $ref: "#/components/schemas/schemaNameMatchingResult"
        schemaNameMapping:
          $ref: "#/components/schemas/schemaNameMappingResult"
        profileVariableSetMatches:
          description: |
            The collection of matching results for the rule's profile variable sets.
            The profile variable sets that are required by the rule are matched to profile variable sets in the target environment by the following:

              * JSON path
              * key variable relations to message variables
          nullable: true
          type: array
          items:
            $ref: "#/components/schemas/variableSetKeyRelations"
        usedVariableMatches:
          description: The collection of matching results for the rule's usedVariables.
          nullable: true
          type: array
          items:
            $ref: "#/components/schemas/matchingResult"
        usedListMatches:
          description: The collection of matching results for the rule's usedLists.
          nullable: true
          type: array
          items:
            $ref: "#/components/schemas/matchingResult"
    alertTypeMatchingResult:
      title: matchingResult
      description: The matching result for the rule's alertType.
      allOf:
      - $ref: "#/components/schemas/matchingResult"
    messageClassificationMatchingResult:
      title: matchingResult
      description: The matching result for the rule's messageClassification.
      allOf:
      - $ref: "#/components/schemas/matchingResult"
    messageClassificationMappingResult:
      x-sas-internal: true
      title: mappingResult
      description: |
        The mapping from the rule's original `messageClassification` to the `messageClassification` of the rule after import.
        This property is set only if the original `messageClassification` was not found.
      allOf:
      - $ref: "#/components/schemas/mappingResult"
    schemaNameMatchingResult:
      title: matchingResult
      description: The matching result for the rule's schemaName.
      allOf:
      - $ref: "#/components/schemas/matchingResult"
    schemaNameMappingResult:
      x-sas-internal: true
      title: mappingResult
      description: |
        The mapping from the rule's original `schemaName` to the `schemaName` of the rule after import.
        This property is set only if the original `schemaName` was not found.
      allOf:
      - $ref: "#/components/schemas/mappingResult"
    matchingResult:
      description: The result of searching for a matching value.
      type: object
      properties:
        value:
          description: The value that was searched for.
          anyOf:
          - $ref: "#/components/schemas/anyValue"
        found:
          description: An indicator for whether the value was found in context.
          type: boolean
    mappingResult:
      description: A mapping from an original value to a mapped value.
      type: object
      properties:
        originalValue:
          description: The original value.
          anyOf:
          - $ref: "#/components/schemas/anyValue"
        mappedValue:
          description: The mapped value.
          anyOf:
          - $ref: "#/components/schemas/anyValue"
    anyValue:
      nullable: true
      description: Any value (for example, string, number, integer, Boolean, array,
        or object, including `null`).
      anyOf:
      - type: string
      - type: number
      - type: integer
      - type: boolean
      - type: array
        items: {}
      - type: object
    updateAlertType:
      description: An update request representation for an alert type.
      type: object
      properties:
        description:
          type: string
          description: The description of the alert type.
          maxLength: 1000
      required:
      - description
    updateMessage:
      title: UpdateMessage
      description: |
        An update request representation for a message.
      allOf:
      - $ref: "#/components/schemas/createMessage"
      - type: object
        properties:
          state:
            type: string
            description: |
              The state reflects the capabilities that are allowed on the message schema. The supplied value is case-insensitive.
              `Deployed` means that the message schema has been published successfully and is immutable.
              `Developing` means that the message schema is undergoing modifications. There can only be one "developing" version active.
              `Deployment-Ready` means that the message schema allows limited changes and is intended to be deployed.
            enum:
            - Developing
            - Deployed
            - Deployment-Ready
          revision:
            type: integer
            description: |
              The last revision update to the message.
              This a number that is used for database optimistic locking during concurrent requests.
              Each time an update occurs, the value is incremented.
              It must be provided for performing PATCH updates only.
              This number is independent of the multiple revisions of a schema.
            minimum: 0
        required: [revision]
