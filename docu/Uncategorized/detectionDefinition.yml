          readOnly: true
          default: false
          description: A flag to indicate whether the result is available.
        isLogAvailable:
          type: boolean
          readOnly: true
          default: false
          description: A flag to indicate whether the log is available.
        isTimingMetricsAvailable:
          type: boolean
          readOnly: true
          default: false
          description: A flag to indicate whether timing metrics are available.
        decisionMetrics:
          $ref: "#/components/schemas/confusionMetrics"
        alertMetrics:
          $ref: "#/components/schemas/confusionMetrics"
        alerts:
          type: number
