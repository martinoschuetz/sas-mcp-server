      tags:
      - Lists
      operationId: deleteList
      description: Deletes a list with the specified list ID.
      parameters:
      - $ref: "#/components/parameters/listIdParam"
      responses:
        "204":
          description: The list was deleted.
components:
  parameters:
    startParam:
      name: start
      in: query
      description: The 0-based offset of the first resource to return.  The default
        is '0'.
      schema:
        type: integer
    limitParam:
      name: limit
      in: query
      description: The maximum number of resources to return.  The default is '100'.
      schema:
        type: integer
    filterParam:
      name: filter
      in: query
      description: "The filter criteria for returned resources. For more information,\
        \ see [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters)."
      schema:
        type: string
        format: filter-criteria
    sortByParam:
      name: sortBy
      in: query
      description: "Specifies the sorting for returned resources. For more information,\
        \ see [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)."
      schema:
        type: string
        format: sort-criteria
    projectIdParam:
      name: projectId
      in: path
      description: The UUID of the project.
      required: true
      schema:
        type: string
        format: uuid
    ruleIdParam:
      name: ruleId
      in: path
      description: The UUID of the rule.
      required: true
      schema:
        type: string
        format: uuid
    baseRuleIdParam:
      name: baseRuleId
      in: query
      description: The identifier of the base rule.
      required: true
      schema:
        type: string
    impactAnalysisIdParam:
      name: impactAnalysisId
      in: path
      description: The ID of the impact analysis.
      required: true
      schema:
        type: string
        format: uuid
    orgIdParam:
      name: orgId
      in: path
      description: The UUID of the organization.
      required: true
      schema:
        type: string
    orgIdsParam:
      name: orgIds
      in: query
      description: |
        A list of the organization UUIDs separated by '|'
        (for example, `orgIds=123e4567-e89b-12d3-a456-426614174000|123e4567-e89b-12d3-a456-426614174001`).
      required: false
      schema:
        type: string
    deploymentIdParam:
      name: deploymentId
      in: path
      description: The unique ID of the deployment.
      required: true
      schema:
        type: string
    organizationIdParam:
      name: organization
      in: query
      description: The unique ID of the organization.
      required: false
      schema:
        type: string
    depDefOrgIdParam:
      name: organization
      in: query
      description: The UUID of the organization.
      required: true
      schema:
        type: string
    roleIdParam:
      name: roleId
      in: path
      description: The ID of a role.
      required: true
      schema:
        type: string
    orgIdQueryParam:
      name: orgId
      in: query
      required: false
      description: The ID of an organization.
      schema:
        type: string
    orgIdFilterParam:
      name: organizationID
      in: query
      required: false
      description: The identifier for an organization. Only projects with this identifier
        will be returned.
      schema:
        type: string
    messageClassificationIdParam:
      name: messageClassificationId
      in: path
      description: The UUID of the message classification.
      required: true
      schema:
        type: string
    mcExportRelativeToParentIdParam:
      name: parentId
      in: query
      description: |
        The UUID of the message classification to export.

        The selected message classification and its descendants will be exported.
      required: false
      schema:
        type: string
    mcImportRelativeToParentIdParam:
      name: parentId
      in: query
      description: |
        The UUID of the parent message classification to which the CSV payload is to be imported.
        <br>
        Keycodes in the CSV content are only partial, and are relative to the keyCode of the parent. For example, if the parent's keyCode is "1.2", and the CSV content has a keyCode value of "1",
        the message classification is imported with keyCode "1.2.1".
      required: false
      schema:
        type: string
    depthParam:
      name: depth
      in: query
      required: false
      description: |
        The depth to which sub-message classifications are to be retrieved with the message classification.
        Specify a value of -1 to retrieve all sub-message classifications.
        Specify a value of 0 to retrieve no sub-message classifications.
        Specify a positive number to retrieve sub-message classifications up to the depth.
      schema:
        type: integer
        maximum: 8
    schemaNameParam:
      name: schemaName
      in: path
      description: The unique name of a message schema.
      required: true
      schema:
        type: string
    catIdsParam:
      name: catIds
      in: query
      description: |
        A list of message categories separated by '|'.
         * `composite` - a container that holds other message schemas.
         * `linked` - schemas that have been added to other message schemas.
         * `unlinked` - schemas that have not been added to other message schemas.
      required: false
      schema:
        type: string
        enum: [composite, linked, unlinked]
    modelIdParam:
      name: modelId
      in: path
      description: The ID of the model.
      required: true
      schema:
        type: string
    optionalOrgIdParam:
      name: orgId
      in: query
      description: The ID of the organization.
      required: false
      schema:
        type: string
    inUseParam:
      name: inUse
      in: query
      description: An indicator to filter packages based on whether they are in use
        by the organization.
      required: false
      schema:
        type: boolean
    getModelAcceptParam:
      name: Accept
      in: header
      required: false
      description: |
        The media type representation for a returned resource.
        Use 'application/vnd.sas.detection.getsasmodel.extended+json' to return
        associated information from model repository.
      schema:
        type: string
        format: media-type
        enum:
        - application/json
        - application/vnd.sas.detection.getsasmodel+json
        - application/vnd.sas.detection.getsasmodel.extended+json
        default: application/vnd.sas.detection.getsasmodel+json
    getModelAcceptItemParam:
      name: Accept-Item
      in: header
      required: false
      description: |
        The media type representation for items in the returned collection.
        Use 'application/vnd.sas.detection.getsasmodel.extended+json' to return
        associated information from the model repository.
      schema:
        type: string
        format: media-type
        enum:
        - application/vnd.sas.detection.getsasmodel+json
        - application/vnd.sas.detection.getsasmodel.extended+json
        default: application/vnd.sas.detection.getsasmodel+json
    getModelOperationalStateParam:
      name: modelOperationalState
      in: query
      required: false
      description: |
        Specifies whether to return the operational state information for each model. The default is `false`.
      schema:
        type: boolean
    getModelPropertiesAccepParam:
      $ref: "#/components/parameters/getModelPropertiesAcceptParam"
    languageIdParam:
      name: languageId
      in: path
      description: The programming language code.
      required: true
      schema:
        type: string
        enum: [ds2]
    criteriaQueryParam:
      name: criteria
      in: query
      required: true
      description: |
        Specify a single capability or a combination of capabilities to be checked.

        The combination of capabilities is expressed in the following format:
        <blockquote>
        criteria = capability.name | expression

        where expression = AND | OR ( capability.name | expression, ...)
        </blockquote>
        For example, `set criteria=sda.projects.view` to check whether the current user can view projects.

        Set `criteria=AND(sda.projects.view, sda.rules.update)` to check whether the current user can create or update
        rules in a project.
      schema:
        type: string
    projectIdQueryParam:
      name: projectId
      in: query
      required: false
      description: The UUID of a project.
      schema:
        type: string
    roleIdQueryParam:
      name: roleId
      in: query
      required: false
      description: The identifier of a role. It is applicable only if the current
        user is a SAS Administrator. If the 'roleId' parameter is set, then the 'orgId'
        parameter is ignored.
      schema:
        type: string
    systemQueryParam:
      name: system
      in: query
      required: false
      description: Indicates to return the list of capabilities of SAS Detection Architecture.
        It is applicable only if the current user is a SAS Administrator. If the system
        parameter is specified, then both the 'roleId' and 'orgId' parameters are
        ignored.
      schema:
        type: string
    alertTypeCdParam:
      name: alertTypeCode
      in: path
      description: The alert type code.
      required: true
      schema:
        type: string
    messageNmQueryParam:
      name: messageName
      in: query
      required: false
      description: The message name.
      schema:
        type: string
    variableIdParam:
      name: variableId
      in: path
      description: The identifier of the variable.
      required: true
      schema:
        type: string
    variableSetIdParam:
      name: variableSetId
      in: path
      description: The identifier of the variable set.
      required: true
      schema:
        type: string
    includeSharedVariablesParam:
      name: includeShared
      in: query
      description: |
        Indicates whether to include shared variables from other projects in the response.
        If set to `true`, the response includes variables that are defined and shared from other projects.
      required: false
      schema:
        type: boolean
        default: false
    listIdParam:
      name: listId
      in: path
      description: The UUID of the list.
      required: true
      schema:
        type: string
    messageIdParam:
      name: messageId
      in: path
      description: The UUID of the message.
      required: true
      schema:
        type: string
    getRulesAcceptItemParam:
      name: Accept-Item
      in: header
      required: false
      description: The media type representation for items in the returned collection.
      schema:
        type: string
        format: media-type
        enum:
        - application/vnd.sas.detection.rule+json
        - application/vnd.sas.detection.rule.with.metrics+json
        default: application/vnd.sas.detection.rule+json
    ruleTypeNameParam:
      name: ruleTypeName
      in: query
      required: false
      description: The rule type to be returned from the query.
      schema:
        type: string
        enum:
        - variable
        - decision
    getRulePrioritizationsAcceptItemParam:
      name: Accept-Item
      in: header
      required: false
      description: The media type representation for items in the returned collection.
      schema:
        type: string
        format: media-type
        enum:
        - application/vnd.sas.detection.rule.prioritization+json
    importRulesMappingParam:
      $ref: "#/components/parameters/mappingParam"
    getVariablesAcceptItemParam:
      name: Accept-Item
      in: header
      required: false
      description: The media type representation for items in the returned collection.
      schema:
        type: string
        format: media-type
        enum:
        - application/vnd.sas.detection.variable+json
        - application/vnd.sas.detection.key.variable+json
        default: application/vnd.sas.detection.variable+json
    getVariablesFilterTypeParam:
      name: filterType
      in: query
      required: false
      description: |
        Controls which filters, if any, are applied by the service to get the variables.
        Any `filterType` filters are applied in addition to any filters supplied by the client
        as `filter` parameters.
          * `none` - No additional filters are applied by the service.
          * `modelKey` - Additional filters are applied by the service in order to select
          variables that can be mapped to an existing model variable.
          * `profileKey` - Additional filters are applied by the service in order to select
          key variables for the profile variable sets.
      schema:
        type: string
        enum: [none, modelKey, profileKey]
        default: none
    getVariableSetVariablesAcceptItemParam:
      name: Accept-Item
      in: header
      required: false
      description: The media type representation for items in the returned collection.
      schema:
        type: string
        format: media-type
        enum:
        - application/vnd.sas.detection.variable.rule.usage.summary+json
        - application/vnd.sas.detection.variable.profile.rule.usage.summary+json
        - application/vnd.sas.detection.message.variable.profile+json
        default: application/vnd.sas.detection.variable.rule.usage.summary+json
    baseRuleIdQueryParam:
      name: baseRuleID
      in: query
      description: The base rule ID.
      required: false
      schema:
        type: string
    mappingParam:
      x-sas-internal: true
      name: mapping
      in: query
      description: |
        Controls whether the import attempts to map unmatched dependencies in the target environment.
          - strict: import does not attempt to map unmatched dependencies.
              - Unmatched dependencies of the rule *object* remain empty, and prevent promotion of the rule to Testing.
              - Unmatched dependencies of the rule *code* result in syntax errors.
          - relaxed: import attempts to map unmatched dependencies.
              - Unmatched message classifications are mapped to the top level message classification of the project.
              - Unmatched message schemas are mapped to a valid message schema of the project.
      required: false
      schema:
        type: string
        enum:
        - strict
        - relaxed
        default: strict
    ruleReferenceIDQueryParam:
      name: ruleReferenceID
      in: query
      description: The rule reference ID.
      required: false
      schema:
        type: string
    getModelPropertiesAcceptParam:
      name: Accept
      in: header
      required: false
      description: |
        The media type representation for a returned resource.
        Use 'application/vnd.sas.detection.sasmodel.properties.extended+json' to return
        the `usesStoredSignatureMappings` and `signaturesHaveInputVariables` fields.
      schema:
        type: string
        format: media-type
        enum:
        - application/json
        - application/vnd.sas.detection.sasmodel.properties+json
        - application/vnd.sas.detection.sasmodel.properties.extended+json
        default: application/vnd.sas.detection.sasmodel.properties+json
    alertTypeCodeQueryParam:
      name: alertTypeCode
      in: query
      description: The alert type code.
      required: false
      schema:
        type: string
  headers:
