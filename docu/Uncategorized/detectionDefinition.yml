      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/listCollection"
              examples:
                default:
                  $ref: "#/components/examples/get_lists"
            application/json:
              schema:
                $ref: "#/components/schemas/listCollection"
              examples:
                default:
                  $ref: "#/components/examples/get_lists"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_lists_error_400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_lists_error_400"
  /lists/{listId}:
    get:
      deprecated: true
      summary: Get a specific list
      tags:
      - Lists
      operationId: getList
      description: Retrieves a specified list.
      parameters:
      - $ref: "#/components/parameters/listIdParam"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/list"
              examples:
                default:
                  $ref: "#/components/examples/get_list"
            application/json:
              schema:
                $ref: "#/components/schemas/list"
              examples:
                default:
                  $ref: "#/components/examples/get_list"
        "409":
          description: The request could not be completed due to a conflict with an
            existing resource.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_list_id_error_409"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_list_id_error_409"
    post:
      deprecated: true
      summary: Register a list
      tags:
      - Lists
      operationId: createList
      description: Registers a list with the specified list ID from the List Data
        service.
      parameters:
      - $ref: "#/components/parameters/listIdParam"
      responses:
        "201":
          description: The list was created.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
        "409":
          description: |
            The request could not be completed due to a conflict with an existing resource.
            The following are possible reasons:
