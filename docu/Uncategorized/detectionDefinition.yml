  /projects/{projectId}/rules/{ruleId}/revisions:
    parameters:
    - $ref: "#/components/parameters/projectIdParam"
    - $ref: "#/components/parameters/ruleIdParam"
    post:
      deprecated: true
      summary: Create a new rule version
      tags:
      - Rules
      operationId: createRuleVersionInProject
      description: |
        Creates a new rule (with a new version number) from an existing rule in the same project.

        The new rule is created in the Coding state, has the same base-rule ID as the existing rule,
        and has the next sequential rule version number for the base-rule ID.

        Other field values are copied from the existing rule that the new rule was created from.
      requestBody:
        content:
          application/vnd.sas.detection.rule+json:
            schema:
              description: An empty request object.
              type: object
              nullable: true
            examples:
              default:
                value: {}
          application/json:
            schema:
              description: An empty request object.
              type: object
              nullable: true
            examples:
              default:
                value: {}
      responses:
        "201":
          description: A new rule version was created.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.detection.rule+json:
              schema:
                $ref: "#/components/schemas/createRuleVersionResponsev2"
              examples:
                default:
                  $ref: "#/components/examples/create_rule_version_v2"
            application/json:
              schema:
                $ref: "#/components/schemas/createRuleVersionResponsev2"
              examples:
                default:
                  $ref: "#/components/examples/create_rule_version_v2"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_rule_version_error_400"
        "409":
          description: |
            The request could not be completed due to a conflict with an existing resource.  For example, a new rule cannot
            be created in the Coding state because a rule with the same base-rule ID already exists in either the Coding
            state or the Testing state.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create_rule_version_error_409"
  /projects/{projectId}/rules/transitions:
    parameters:
    - $ref: "#/components/parameters/projectIdParam"
    post:
      summary: Update the state of a rule set
      tags:
      - Rules
      operationId: createRulesStateTransition
      description: |
        Updates the state of a set of rules to Coding, Testing, Production, or Recycle.
        The update is atomic. Either all the provided rules are updated,
        or none of the rules are updated.
        These are the supported state transitions and their consistency requirements.
        ### Coding to Testing
        * Rule code must be free of syntax errors.
        * Rule type dependencies must be satisfied. A variable rule that depends on a decision rule cannot be promoted.
        * Rule state dependencies must be satisfied in the Testing state.
          A rule cannot be promoted to Testing if it depends on a rule in Coding, unless the rule it depends on is also promoted at the same time.
        * A rule cannot depend on itself, either directly or indirectly.
        * If the rule code uses an action that creates an alert, the rule must be associated with an alert type.
        * If the rule belongs to an organization that deploys testing rules, then the rule code cannot use an inactive advanced list.
        ### Testing to Production
        * Rule state dependencies must be satisfied in the Production state.
          A rule cannot be promoted to Production if it depends on a rule in Testing, unless the rule it depends on is also promoted at the same time.
        * A rule cannot depend on itself, either directly or indirectly
        * The rule code cannot use an inactive advanced list.
        ### Production to Recycle
        * Rule state dependencies must be satisfied in the Production and Testing states.
          A rule cannot be moved to Recycle if other rules in Production or Testing depend on it.
        ### Testing to Coding
        * Rule state dependencies must be satisfied in the Testing state. A rule cannot be moved to Coding if other rules in Testing depend on it.
        ### Coding to Recycle
        * Rule dependencies are not enforced in Coding, so this transition is always allowed.
      requestBody:
        description: Selection of rules and state transition
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ruleTransition"
            examples:
              default:
                $ref: "#/components/examples/update_rule_state"
              requestApproval:
                $ref: "#/components/examples/request_approval_update_rule_state"
          application/vnd.sas.detection.rule.transition+json:
            schema:
              $ref: "#/components/schemas/ruleTransition"
            examples:
              default:
                $ref: "#/components/examples/update_rule_state"
              requestApproval:
                $ref: "#/components/examples/request_approval_update_rule_state"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/ruleTransitionCollection"
              examples:
                default:
                  $ref: "#/components/examples/promote_rules"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/promote_rules_error_400"
        "409":
          description: |
            The request could not be completed due to a conflict with an existing resource.
            The following are possible reasons:
            - A rule cannot be moved to `destinationState` because it depends on a rule that is not available in that state.
            - A resource `revision` in the request body is not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/promote_rules_error_409"
  /projects/{projectId}/rules/prioritizations:
    parameters:
    - $ref: "#/components/parameters/projectIdParam"
    get:
      summary: Get active rules by prioritization
      tags:
      - Rules
      operationId: getRulePrioritizations
      description: |
        Retrieves the active rules in the project in prioritized order, based on rule type, execution order type, and execution order priority as follows:
        - Variable rules
          - Pre-rules
          - Dependency-ordered rules
          - Post rules
        - Decision rules
          - Pre-rules
          - Dependency-ordered rules
          - Post rules
      parameters:
      - $ref: "#/components/parameters/getRulePrioritizationsAcceptItemParam"
      - $ref: "#/components/parameters/ruleTypeNameParam"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/rulePrioritizationCollection"
              examples:
                default:
                  $ref: "#/components/examples/get_rule_prioritizations"
            application/json:
              schema:
                $ref: "#/components/schemas/rulePrioritizationCollection"
              examples:
                default:
                  $ref: "#/components/examples/get_rule_prioritizations"
    patch:
      summary: Update rule prioritizations
      tags:
      - Rules
      operationId: patchRulePrioritizations
      description: |
        Updates rule prioritizations in the project.
        Rule prioritizations can be updated for rules in the following states:
          - Coding
          - Testing
          - Production
      requestBody:
        description: Difference set (diff) of rule prioritizations
        content:
          application/vnd.sas.detection.rule.prioritization.diff+json:
            schema:
              $ref: "#/components/schemas/rulePrioritizationDiff"
            examples:
              default:
                $ref: "#/components/examples/update_rule_prioritizations"
          application/json:
            schema:
              $ref: "#/components/schemas/rulePrioritizationDiff"
            examples:
              default:
                $ref: "#/components/examples/update_rule_prioritizations"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              $ref: "#/components/headers/etagHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/rulePrioritizationCollection"
              examples:
                default:
                  $ref: "#/components/examples/get_rule_prioritizations_updated"
            application/json:
              schema:
                $ref: "#/components/schemas/rulePrioritizationCollection"
              examples:
                default:
                  $ref: "#/components/examples/get_rule_prioritizations_updated"
        "400":
          description: The request was invalid
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/update_rule_prioritizations_error_400"
        "409":
          description: |
            The request could not be completed due to a conflict with an existing resource.
            The following is a possible reason:
            - The request attempts to change the prioritization of a rule that is not in an allowed state.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/update_rule_prioritizations_error_409"
        "412":
          description: The supplied precondition was not satisfied. This typically
            indicates stale data.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/update_rule_prioritizations_error_412"
        "422":
          description: |
            The request cannot be processed even though it is syntactically valid.
            The following are possible reasons:
              - The reprioritized rules would not be consistent with strong rule dependencies.
                 - A rule would be moved before a rule that it has a strong dependency on.
                 - A rule would be moved after a rule that has a strong dependency on it.
              - The reprioritized rules would result in 2 or more rules of the same type (variable or decision)
                and the same execution order type (Pre Rules or Post Rules) having the same execution order priority.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/update_rule_prioritizations_error_422"
        "428":
          description: The request headers did not include an `If-Match` or `If-Unmodified-Since`
            precondition.
          headers:
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/update_rule_prioritizations_error_428"
