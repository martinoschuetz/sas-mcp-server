          maxLength: 32
          description: |
            The kind of defined message schema that can be used for categorization. Potential values are
            `banking`, `insurance`, `payments`, or `healthcare`.
            The subtype allows only lowercase alphanumeric characters. It will
            be converted automatically to lowercase.
          example: financial
          pattern: "^[A-Za-z0-9+_-]+$"
