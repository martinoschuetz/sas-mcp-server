          type: integer
          readOnly: true
          description: The version number of the rule prioritization representation
            schema. This representation is version 1.
    ruleDependency:
      description: A dependency on another rule and the rule that satisfies the dependency.
      type: object
      properties:
        dependency:
          description: A dependency on another rule.
          type: object
          properties:
            dependencyType:
              description: >
                The type of dependency.
                  + `STRONG` - This rule depends on another rule using `detection.hasRuleFired()`.
                  + `WEAK` - This rule depends on a user variable whose value is assigned
                by another rule.
              type: string
              enum:
              - STRONG
              - WEAK
            ruleId:
              description: |
                The unique identifier of the other rule on which this rule depends.
                Set this for WEAK dependencies only.
              type: string
            baseRuleId:
              description: |
                The base rule ID of the other rule on which this rule depends.
                Set this for STRONG dependencies only.
              type: string
            usedVariables:
              description: |
                The message schema variables that are assigned by the other rule, which causes the dependency.
                Set this for WEAK dependencies only.
              type: array
              items:
                $ref: "#/components/schemas/ruleUsedVariable"
            creationTimeStamp:
              type: string
            createdBy:
              type: string
        resolvedRule:
          description: The rule that satisfies the dependency.
          type: object
          properties:
            ruleId:
              description: The unique identifier of the resolved rule.
              type: string
            baseRuleId:
              description: The base rule ID of the resolved rule.
              type: string
            ruleVersion:
              description: The version number of the resolved rule.
              type: integer
            name:
              description: The name of the resolved rule.
              type: string
            ruleTypeName:
              description: The name of the rule type for the resolved rule.
              type: string
            state:
              description: The state of the resolved rule.
              type: string
    ruleUsedVariable:
