        outcomes:
          $ref: "#/components/schemas/outcomes"
        alertTypeMetrics:
          description: The alert type metrics.
          type: array
          items:
            $ref: "#/components/schemas/alertTypeMatrix"
        decisionValueMetrics:
          $ref: "#/components/schemas/decisionValueMetrics"
        criteria:
          $ref: "#/components/schemas/impactAnalysisCriteria"
        creationTimeStamp:
          type: string
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        version:
          type: number
          readOnly: true
          description: The version number of the impact analysis schema.
        revision:
          type: number
          readOnly: true
          description: The last revision update to the impact analysis.
      required:
      - name
    impactAnalysisCriteria:
      description: A detection impact analysis criteria.
      type: object
      properties:
        name:
          type: string
          description: The name of the impact analysis.  Valid values are letters,
            numbers, hyphens, underscores, and spaces.
          maxLength: 150
        description:
          type: string
          description: A description of the impact analysis.
          maxLength: 1000
        rules:
          type: array
          items:
            $ref: "#/components/schemas/impactAnalysisRule"
          description: The rules that are selected for the impact analysis.
        rangeStartDate:
          type: string
          description: The message range start date.
        rangeEndDate:
          type: string
          description: The message range end date.
        outcomeLimit:
          type: number
          description: The decision outcome limit for the impact analysis.
        alertLimit:
          type: number
          description: The alert limit for the impact analysis.
        logWithAdditionalDetails:
          type: boolean
          description: The additional log details.
        userVariablePrimingDuration:
          type: number
          description: The user variable priming duration.
        userVariablePrimingUnit:
          type: string
          description: The user variable priming duration unit.
          enum: ["HOURS", "DAYS"]
        forceUserVariableRecalculation:
          type: boolean
          description: An indicator for whether to force the recalculation of the
            user variables.
        scheduleTime:
          type: string
          description: The scheduled time in UTC. An impact analysis job will be initiated
            at the time specified.
        notificationRecipients:
          type: string
          description: |
            The type of recipient who receives a notification when the impact analysis job is completed.
            If set to `user`, a notification is sent to the user that is initiating the impact analysis.
            If set to `group`, a notification is sent to all users associated with the project group.
      required:
      - name
      - rules
      - rangeStartDate
      - rangeEndDate
    impactAnalysisRule:
      description: The rule that is used to run the impact analysis.
      type: object
      properties:
        ruleId:
          type: string
          readOnly: true
          description: The ID of the rule.
          format: uuid
        baseRuleId:
          type: string
          readOnly: true
