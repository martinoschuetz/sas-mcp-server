      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/ruleSyntaxError"
    ruleSummary:
      description: A summary of a detection rule.
      type: object
      properties:
        id:
          type: string
          description: The UUID of the rule.
          format: uuid
        name:
          type: string
          description: The name of the rule.
        description:
          type: string
          description: The description of the rule.
        creationTimeStamp:
          type: string
        createdBy:
          type: string
        modifiedTimeStamp:
          type: string
        modifiedBy:
          type: string
        revision:
          type: number
        version:
          type: number
      required:
      - id
      - revision
    ruleSummaryCollection:
      title: RuleSummaryCollection
      description: A collection of rule summary objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/ruleSummary"
    ruleExportCollection:
      description: A collection of exported rules and the objects that the rules depend
        on.
      type: object
      properties:
        rules:
          description: The exported rules.
          type: array
          items:
            $ref: "#/components/schemas/ruleExport"
        profileVariableSets:
          description: The profile variable sets that contain profile variables used
            by the exported rules.
          type: array
          items:
            $ref: "#/components/schemas/profileVariableSetExport"
        version:
          description: The version of the rule export collection schema.
          type: integer
      required:
      - rules
    ruleImportValidation:
      description: The validation result.
      type: object
      properties:
        rulesCount:
          description: The number of rules in the import request body.
          type: integer
        validationDetails:
          description: The collection of import validation results of the rules.
          type: array
          items:
            $ref: "#/components/schemas/ruleImportResult"
    ruleImportCollection:
      description: The import result.
      type: object
      properties:
        rulesSummary:
          description: The summary of the rules that were imported.
          type: object
          properties:
            createdCount:
              description: The number of rules that were created by the import.
              type: integer
            withSyntaxErrorsCount:
              description: The number of rules that were created by the import that
                had syntax errors.
        profileVariableSetsSummary:
          description: The summary of the profile variable sets that are used by the
            rules that were imported.
          type: object
          properties:
            matchedCount:
              description: The number of distinct profile variable sets that matched
                an existing profile variable set in the target environment.
              type: integer
            unmatchedCount:
              description: The number of distinct profile variable sets that did not
                match an existing profile variable set in the target environment.
              type: integer
        profileVariablesSummary:
          description: The summary of the profile variables that are used by the rules
            that were imported.
          type: object
          properties:
            matchedCount:
              description: The number of distinct profile variables that matched an
                existing profile variable in the target environment.
              type: integer
            unmatchedCount:
              description: The number of distinct profile variables that did not match
                an existing profile variable in the target environment.
              type: integer
            createdCount:
              description: The number of distinct profile variables that were created
                by the import.
              type: integer
            externalCount:
              description: |
                The number of distinct profile variables for which the `isExternal` flag was set to `true`.
              type: integer
        messageClassificationsSummary:
          description: The summary of the message classifications that are used by
            the rules that were imported.
          type: object
          properties:
            matchedCount:
              description: The number of distinct message classifications that matched
                an existing message classification in the target environment.
              type: integer
            unmatchedCount:
              description: The number of distinct message classifications that did
                not match an existing message classification in the target environment.
              type: integer
        messageSchemasSummary:
          description: The summary of the message schemas that are used by the rules
            that were imported.
          type: object
          properties:
            matchedCount:
              description: The number of distinct message schemas that matched an
                existing message schema in the target environment.
              type: integer
            unmatchedCount:
              description: The number of distinct message schemas that did not match
                an existing message schema in the target environment.
              type: integer
        validationResult:
          $ref: "#/components/schemas/ruleImportValidation"
        rules:
          description: The created rules.
          type: array
          items:
            $ref: "#/components/schemas/ruleWithCodev2"
        variableCreationResults:
          description: The details of a profile variable creation.
          type: array
          items:
            type: object
            properties:
              schemaName:
                description: The name of the message schema that contains the profile
                  variable.
                type: string
              jsonPath:
                description: The JSON path of the variable set that contains the profile
                  variable.
                type: string
              name:
                description: The name of the profile variable.
                type: string
              httpStatusCode:
                description: Status code from the HTTP request to create the profile
                  variable (failure responses only).
                type: integer
              errorCode:
                description: Error code from the HTTP request to create the profile
                  variable (failure responses only).
                type: integer
              message:
                description: Error message from the HTTP request to create the profile
                  variable (failure responses only).
                type: string
