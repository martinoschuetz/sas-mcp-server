  /capabilities/granted:
    get:
      summary: Get a user's capabilities
      tags:
      - Capabilities
      operationId: getCapabilitiesGrantedStatus
      description: |
        Returns whether the current user has been granted capabilities within
        the service. Specify the capabilities to be checked with the criteria
        parameter. A single capability can be checked or you can specify a
        combination of capabilities to check (for example,
        <b>AND(sda.projects.view, sda.rules.view)</b>). Returns 'true' if the
        current user has the capabilities, or and 'false' if they do not. Some
        capabilities are granted at service scope, and other capabilities are
        granted at organization or project scope. If the criteria parameter
        consists of one or more capabilities with a project scope, then you must
        provide a projectId. If the criteria parameter consists of one or more
        capabilities with an organization scope, then you must provide an orgId
        (unless you specified a projectId).
      parameters:
      - $ref: "#/components/parameters/criteriaQueryParam"
      - $ref: "#/components/parameters/orgIdQueryParam"
      - $ref: "#/components/parameters/projectIdQueryParam"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                type: boolean
              example: true
        "400":
          description: |
            The request was invalid.
            The following are possible reasons:
            - The criteria parameter might be missing.
            - The capability name or names in the criteria parameter might not be valid.
            - The scope is missing or is incorrect (for example, it is missing the orgId parameter when checking an organization scope capability).
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/check_capabilities_error_400"
