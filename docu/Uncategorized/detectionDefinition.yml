    patch_org_v3:
      description: |
        A sample request to update an organization with the role relation version 1 and version 2.
        The version 2 has property `isProfileEditor` to indicate whether the users with this role can edit the profile schema of the organization.
        If `version` is not set, the default is version 1, which is equivalent to setting `isProfileEditor` to 'true' in version 2.

        This request does the following:
          - Removes the role __SDAConsoleAdmin__.
          - Grants the role __SDAModelAdmin__ with the profile editing right by using the combined `remove` and `add` operations.
          - Adds the role __SDAJrRulesEditor__ without the profile editing right.
          - Adds the role __SDASrRulesEditor__ by ID only, which is equivalent to setting `isProfileEditor` to 'true' in version 2.
      value: [{"op": "remove", "path": "roleRelations", "value": ["SDAConsoleAdmin",
            "SDAModelAdmin"]}, {"op": "add", "path": "roleRelations", "value": [{
              "roleId": "SDAJrRulesEditor", "isProfileEditor": false, "version": 2},
            {"roleId": "SDAModelAdmin", "isProfileEditor": true, "version": 2}]},
        {"op": "add", "path": "roleRelations", "value": "SDASrRulesEditor"}]
