  /variableSets/{variableSetId}/variables:
    parameters:
    - $ref: "#/components/parameters/variableSetIdParam"
    - $ref: "#/components/parameters/projectIdQueryParam"
    - $ref: "#/components/parameters/includeSharedVariablesParam"
    get:
      summary: Get a list of variables
      tags:
      - Message Schemas
      operationId: getVariableSetVariables
      description: |
        Retrieves the variables of a variable set. The information that is returned depends
        on the value of the optional `Accept-Item` header provided in the request.
        By default, the response items include the number of rules that use each variable
        and the ID of the rules, when applicable.

        Optionally, the response items can include a reference to the source project where each variable
        is defined, when the `variableSetId` identifies a profile variable set.

        If the specified `variableSetId` identifies a profile variable set, the user must be a member of the project in
        order to view the variables.

        If a `projectId` is specified, the variable set must be a profile variable set.
        By default, only the variables of the variable set that were created in that project are returned.
        To return shared variables that are owned by other projects, also set the `includeShared` query parameter to `true`.
      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      - $ref: "#/components/parameters/getVariableSetVariablesAcceptItemParam"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/variableRuleUsageSummaryCollection"
                - $ref: "#/components/schemas/profileVariableRuleUsageSummaryCollection"
                - $ref: "#/components/schemas/profileVariableSummaryCollection"
              examples:
                default:
                  $ref: "#/components/examples/get_variable_set_variables"
                profile:
                  $ref: "#/components/examples/get_variable_set_profile_variables"
                profile - project view:
                  $ref: "#/components/examples/get_variable_set_profile_variables_project_view"
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/variableRuleUsageSummaryCollection"
                - $ref: "#/components/schemas/profileVariableRuleUsageSummaryCollection"
                - $ref: "#/components/schemas/baseCollection2"
              examples:
                default:
                  $ref: "#/components/examples/get_variable_set_variables"
                profile:
                  $ref: "#/components/examples/get_variable_set_profile_variables"
                profile - project view:
                  $ref: "#/components/examples/get_variable_set_profile_variables_project_view"
        "400":
          description: |
            The request was invalid.
            The following is a possible reason:
            - The `variableSetId` path parameter is not in the correct format.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_variable_set_variables_error_400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_variable_set_variables_error_400"
        "422":
          description: |
            The request cannot be processed even though it is syntactically valid.
            The following is a possible reason:
            - The variable set specified does not belong to the profile message schema of the organization.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_variable_set_variables_error_422"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_variable_set_variables_error_422"
  /variableSets/{variableSetId}/variables/{variableId}:
    parameters:
    - $ref: "#/components/parameters/variableSetIdParam"
    - $ref: "#/components/parameters/variableIdParam"
    - $ref: "#/components/parameters/projectIdQueryParam"
    get:
      summary: Get a variable
      tags:
      - Message Schemas
      operationId: getVariableSetVariable
      description: |
        Retrieves one variable of a variable set.

        If it is a profile variable set, the user must be a member of the project in
        order to view the variable.

        If a `projectId` is specified, the variable set must be a profile variable set.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
          content:
            application/vnd.sas.detection.message.variable.profile+json:
              schema:
                $ref: "#/components/schemas/primaryProjectProfileVariableSummary"
              examples:
                profile:
                  $ref: "#/components/examples/get_variable_set_profile_variable"
                profile - project view:
                  $ref: "#/components/examples/get_variable_set_profile_variable_project_view"
            application/json:
              schema:
                $ref: "#/components/schemas/primaryProjectProfileVariableSummary"
              examples:
                profile:
                  $ref: "#/components/examples/get_variable_set_profile_variable"
                profile - project view:
                  $ref: "#/components/examples/get_variable_set_profile_variable_project_view"
        "404":
          description: No variable with the specified identifier exists at the requested
            path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_variable_set_profile_variable_error_404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/get_variable_set_profile_variable_error_404"
  /lists:
    get:
