            $ref: "#/components/schemas/ruleDependency"
        executionOrderType:
          type: integer
          enum:
          - -1
          - 0
          - 1
          description: |
            Type of the execution order. There are three pre-defined sets of rules.
            (-1) Pre rules
            (0)  Dependency ordered rules
            (1)  Post rules

            The pre rules set executes first, then the dependency ordered rules set, then the post rules set.
        executionOrderPriority:
          type: integer
