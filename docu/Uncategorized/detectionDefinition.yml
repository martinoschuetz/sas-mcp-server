            - The list does not exist in the List Data service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/create-list_error_409"
            application/json:
              schema:
