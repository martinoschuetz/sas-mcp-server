        models:
          type: array
          items:
            $ref: "#/components/schemas/deployablemodel"
          description: Models included in the deployment package.
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/deploymentschema"
          description: Schemas included in the deployment package.
        createdBy:
          type: string
          description: The user who created the object.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the object was created, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
        modifiedBy:
          type: string
          description: The user who most recently modified the object.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the object was last modified, in the
            format of `YYYY-MM-DDThh:mm:ss.sssZ`.
        version:
          type: integer
          description: The API representation version.
          default: 1
    deploymentCollection:
      title: deploymentCollection
      description: A collection of deployment objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/deployment"
    deploymentPackage:
      description: The details of updates since the last deployment and deployable
        candidates.
      type: object
      properties:
        id:
          type: string
          description: The unique ID of the organization.
        name:
          type: string
          description: The internal short name of the organization.
        displayName:
          type: string
          description: The descriptive name of the organization.
        latestDeploymentId:
          type: string
          description: The unique ID of the latest deployment for the organization.
        state:
          type: string
          description: The state of the deployment (for example, building, publishing,
            completed, failed).
          readOnly: true
        lastDeploymentTimeStamp:
          type: string
          format: date-time
          description: The time of the last successful deployment.
        rulesAdded:
          type: array
          items:
            $ref: "#/components/schemas/deployablerule"
          description: The rules added since the last deployment.
        rulesUpdated:
          type: array
          items:
            $ref: "#/components/schemas/deployablerule"
          description: The rules updated since the last deployment.
        rulesRemoved:
          type: array
          items:
            $ref: "#/components/schemas/deployablerule"
          description: The rules removed since the last deployment.
        productionRules:
          type: array
          items:
            $ref: "#/components/schemas/deployablerule"
          description: The production rules that are eligible for the current deployment.
        testingRules:
          type: array
          items:
            $ref: "#/components/schemas/deployablerule"
          description: The testing rules that are eligible for the current deployment.
        modelsAdded:
          type: array
          items:
            $ref: "#/components/schemas/deployablemodel"
          description: The models added since the last deployment.
        modelsRemoved:
          type: array
          items:
            $ref: "#/components/schemas/deployablemodel"
          description: The models removed since the last deployment.
        models:
          type: array
          items:
            $ref: "#/components/schemas/deployablemodel"
          description: The models that are eligible for the current deployment.
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/deploymentschema"
          description: The schemas that are eligible for the current deployment.
        rulesAddedCount:
          type: integer
          description: The number of rules added since the last deployment.
        rulesUpdatedCount:
          type: integer
          description: The number of rules updated since the last deployment.
        rulesRemovedCount:
          type: integer
          description: The number of rules removed since the last deployment.
        modelsAddedCount:
          type: integer
          description: The number of models added since the last deployment.
        modelsRemovedCount:
          type: integer
          description: The number of models removed since the last deployment.
        canDeploy:
          type: boolean
          readOnly: true
          description: A flag to indicate whether the current user can deploy the
            organization.
    deploymentPackageCollection:
      title: deploymentPackageCollection
      description: A collection of deployment packages.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/deploymentPackage"
    deploymentDefinition:
      description: The deployment definitions for an organization.
      type: object
      properties:
        organizationId:
          type: string
          description: The organization ID of the organization.
          readOnly: true
        detectionURL:
          type: string
          description: The URL to connect to the Detection Definition service.
          maxLength: 256
        deployTestingRules:
          type: boolean
          description: An indicator for whether to deploy rules in the testing state.
        expiresAfter:
          type: integer
          description: The expiration in days after which deployments are deleted.
          default: 14
        destination:
          type: string
          description: The destination for the deployment package.
          maxLength: 100
        tdrTopic:
          type: string
          description: The transaction repository Kafka topic.
          maxLength: 255
        restartDetectionService:
          description: When set to `true`, the Detection Definition service is restarted
            automatically after successfully publishing a model.
          type: boolean
        createdBy:
          type: string
          description: The user who created the object.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the object was created, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
        modifiedBy:
          type: string
          description: The user who most recently modified the object.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the object was last modified, in the
            format of `YYYY-MM-DDThh:mm:ss.sssZ`.
        maxMessageLength:
          type: integer
          description: The maximum number of bytes expected in an input or output
            message. Valid values are between 64,000 and 2,147,483,647 bytes.
          default: 64000
          maximum: 2147483647
        autoDeployment:
          type: boolean
          description: If set to `true`, a deployment is automatically done when a
            rule is promoted to production.
        autoDeploymentDelayInSeconds:
          type: integer
          description: |
            The number of seconds to count down after a rule is promoted to production before an automatic deployment is done.
            If a subsequent rule is promoted to production during this period, then the count-down time is reset and begins again.
            This ensures that when promoting a large number of rules to production, only one automatic deployment occurs after the last rule is promoted.
        generateFullSchema:
          type: boolean
          description: An indicator for whether the full schema details are generated.
            The full schema details are generated when this property is set to `true`.
        imageName:
          type: string
          description: |
            Specifies the name of the image to use for the deployment.
            A deployment definition is created by default when an organization is created. The default image name is set to the lowercase value of the organization name (without any special characters).
            The image must be hosted in a container registry that is accessible by the Detection Definition service. Different container registry vendors might have different
            requirements for image names and might support a broader range of characters. In this case, you can update the default value for the image name to a new value
            that conforms to those requirements. The new value must meet the following restrictions:

            + The value must start with a letter, a number, or a period.
            + The value can include dashes, a single underscore, or a double underscore.
            + The value cannot contain other special characters, spaces, or multi-byte characters.
          maxLength: 50
        datasetCredentialDomain:
          type: string
          description: The domain name for the credentials that are used to password-protect
            message data sets created by an impact analysis or a rule evaluation.
          maxLength: 100
        minAllowedVariableSetCount:
          type: integer
          readOnly: true
          description: The minimum number of variable sets to be defined in the profile
            schema for the organization.
        maxAllowedVariableSetCount:
          type: integer
          description: The total number of variable sets defined in the profile schema
            for the organization. A maximum of 34 can be set for the Oracle storage
            type. An unlimited option (maxAllowedVariableSetCount not present) can
            be set for the Redis storage type; however, once set, it cannot be changed
            to any other value. Additionally, the storage type cannot be changed to
            Oracle if the unlimited option is set for Redis.
          default: 8
          minimum: 1
        profileStorageType:
          type: string
          description: The database type used for profile storage.
          maxLength: 50
          default: "Redis"
          enum:
          - Redis
          - Oracle
        profileStorageOptions:
          type: array
          readOnly: true
          description: The available options for profile storage, along with their
            details.
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the profile storage option.
              state:
                type: string
                description: The state of the profile storage option, indicating whether
                  it is currently used for profile storage or is available to be used
                  for profile storage.
                enum:
                - selected
                - available
                - unavailable
              maxVariableSetCount:
                type: integer
                description: The maximum number of variable sets allowed for the profile
                  storage option.
              maxVariableSetKeyLength:
                type: integer
                description: The maximum length allowed for variable set keys for
                  the profile storage option.
              unlimitedOptionAvailable:
                type: boolean
                description: An indicator for whether an unlimited option is available
                  for the profile storage option. This is valid for 'Redis' storage
                  type only.
        version:
          type: integer
          description: The API representation version.
          default: 2
    deploymentDefinitionValidation:
      description: The deployment definition properties for an organization that can
        be validated.
      type: object
      properties:
        organizationId:
          type: string
          description: The organization ID of the organization.
        detectionUrl:
          type: string
          description: The URL to connect to the Detection Definition service.
          maxLength: 256
        tdrTopic:
          type: string
          description: The transaction repository Kafka topic.
          maxLength: 255
        imageName:
          type: string
          description: |
            Specifies the name of the image to use for the deployment.
            A deployment definition is created by default when an organization is created. The default image name is set to the lowercase value of the organization name (without any special characters).
            The image must be hosted in a container registry that is accessible by the Detection Definition service. Different container registry vendors might have different
            requirements for image names and might support a broader range of characters. In this case, you can update the default value for the image name to a new value
            that conforms to those requirements. The new value must meet the following restrictions:

            + The value must start with a letter, a number, or a period.
            + The value can include dashes, a single underscore, or a double underscore.
            + The value cannot contain other special characters, spaces, or multi-byte characters.
    deploymentDefinitionValidationResponse:
      description: The response from validating a deployment definition that passed
        validation.
      type: array
      items:
        description: The response for a single validated field in a deployment definition.
        type: object
        properties:
          field:
            type: string
            description: The field that was validated.
          valid:
            type: boolean
            description: An indicator for whether the field passed validation. Valid
              values are `true` (the field passed validation) and `false` (the field
              failed validation).
          message:
            type: string
            description: The reason why the field failed validation. If the field
              passed validation, then 'message' is not included in the response.
          version:
            type: integer
            description: The version of the API.
            default: 1
    rulev2:
      description: A detection rule (without code).
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The UUID of the rule.
          format: uuid
        name:
          type: string
          description: The name of the rule.  Valid values are letters, numbers, hyphens,
            underscores, and spaces.
          maxLength: 256
        description:
          type: string
          description: The description of the rule.
          maxLength: 1000
        baseRuleId:
          type: string
          readOnly: true
          description: The identifier of the base rule (shared by all versions of
            the rule).
        ruleVersion:
          type: number
          readOnly: true
          description: The version number of the rule.
        messageClassificationId:
          type: string
          description: The UUID of the associated message classification.
          format: uuid
        schemaName:
          type: string
          description: The unique name of the associated message schema.
        projectId:
          type: string
          readOnly: true
          description: The UUID of the associated project.
          format: uuid
        ruleTypeName:
          type: string
          description: |
            The name of the rule type that is associated with this rule.
            The rule type cannot be changed after the rule has been created.
          enum:
          - variable
          - decision
          default: decision
        state:
          type: string
          readOnly: true
          description: The current state of the rule.
        pendingApproval:
          type: boolean
          readOnly: true
          default: false
          description: A flag to indicate whether the current state of the rule is
            pending approval.
        keywords:
          type: string
          maxLength: 20
          description: The keywords that apply to the rule.
        alertType:
          type: string
          maxLength: 15
          description: The alert type to be used for the rule.
        alertReason:
          type: string
          maxLength: 765
          description: The alert reason for any alerts that were generated by the
            rule.
        executionOrderType:
          enum:
          - -1
          - 0
          - 1
          type: integer
          readOnly: true
          description: |
            The type of the execution order. There are three pre-defined sets of rules.
            (-1) Pre rules
            (0)  Dependency ordered rules
            (1)  Post rules
            The pre-rule set executes first, then the dependency ordered rule set, then the post rule set.
        executionOrderPriority:
          type: integer
          readOnly: true
          description: The priority of the execution order.
        configuredOperationalState:
          default: "0"
          enum:
          - "0"
          - "1"
          type: string
          readOnly: true
          description: |
            The configured operational state of the rule.
            (0) Active
            (1) ExecutionDisabled
        operationalState:
          enum:
          - "-2"
          - "-1"
          - "0"
          - "1"
          type: string
          readOnly: true
          description: |
            The operational state of the rule in the ODE.
            (-2) NotPresent - The rule is not running in the ODE.
            (-1) Unknown    - Connection to ODE is not established.
            (0)  Active
            (1)  ExecutionDisabled
        operationalTimeLimit:
          type: integer
          description: The maximum execution time for the rule (in microseconds).
          minimum: 1
          maximum: 2147483647
        authoringMethod:
          type: string
          description: The method that is used to create the rule.
          enum:
          - code
          - assistant
        creationTimeStamp:
          type: string
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        modifiedTimeStamp:
          type: string
          readOnly: true
        modifiedBy:
          type: string
          readOnly: true
        revision:
          type: number
          readOnly: true
          description: The last revision update to the rule. This is used for optimistic
            concurrency control.
        version:
          type: number
          readOnly: true
          description: The version number of the rule schema.
      required:
      - name
      - messageClassificationId
      - schemaName

    rulewithcodev2:
      $ref: "#/components/schemas/ruleWithCodev2"
    rulewithmetricsv2:
      $ref: "#/components/schemas/ruleWithMetricsv2"
    rulecode:
      $ref: "#/components/schemas/ruleCode"
    parsedrule:
      $ref: "#/components/schemas/parsedRule"
    ruleWithLegalPreReqs:
      description: The representation of a rule with its list of rules that are valid
        preconditions.
      type: object
      properties:
        id:
          type: string
          description: The UUID of the rule.
          readOnly: true
          format: uuid
        baseRuleId:
          type: string
          description: The identifier of the base rule (shared by all versions of
            the rule).
          readOnly: true
        ruleVersion:
          type: number
          description: The version number of the rule.
          readOnly: true
        name:
          type: string
          description: The name of the rule.
          readOnly: true
        ruleTypeName:
          type: string
          description: The name of the rule type that is associated with this rule.
          readOnly: true
        state:
          type: string
          description: The current state of the rule.
          readOnly: true
        validPreconditions:
          type: array
          description: |
            The list of rules that are valid preconditions of the rule.
            The valid preconditions of a rule are other rules in the same project that:
              * use the same message schema.
              * are in the same message classification lineage based on parent
              or child relationships.
              * satisfy the valid rule dependency criteria.
          readOnly: true
          items:
            type: object
            description: A rule that is a valid precondition for another rule.
            properties:
              id:
                type: string
                description: The ID of the valid precondition rule.
                readOnly: true
                format: uuid
              baseRuleId:
                type: string
                description: The base rule ID of the valid precondition rule.
                readOnly: true
              name:
                type: string
                description: The name of the valid precondition rule.
                readOnly: true
              state:
                type: string
                description: The current state of the valid precondition rule.
                readOnly: true
        creationTimeStamp:
          type: string
          description: The timestamp for when the rule was created.
          readOnly: true
        createdBy:
          type: string
          description: The user who created the rule.
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: The timestamp when the rule was last modified.
          readOnly: true
        modifiedBy:
          type: string
          description: The user who last modified the rule.
          readOnly: true
        version:
          type: integer
          description: The version number of the object schema.
          readOnly: true
        revision:
          type: integer
          description: The last revision update to the rule.
          readOnly: true
    validationRule:
      description: The minimal representation of a rule.
      type: object
      properties:
        code:
          type: string
          description: A Base64 encoded rule code.
        schemaName:
          type: string
          description: The unique name of the associated message schema.
      required:
      - code
      - schemaName
    ruleSyntaxError:
      description: A validation error in the rule code.
      type: object
      properties:
        row:
          type: integer
          description: The line number of the error message.
        column:
          type: integer
          description: The starting column number of the error message.
        warning:
          type: boolean
          description: An indicator whether there is an error or warning. If 'true',
            there is a warning.
        message:
          type: string
          description: The error message details.
        version:
          type: number
    ruleTransitionCollection:
      title: RuleTransitionCollection
