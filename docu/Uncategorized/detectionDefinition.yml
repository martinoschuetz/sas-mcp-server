          readOnly: true
        jobEndTime:
          type: string
          format: date-time
          description: The timestamp when the impact analysis job completed, in the
            format of `YYYY-MM-DDThh:mm:ss.sssZ`.
          readOnly: true
        estJobEndTime:
          type: string
          format: date-time
          description: The estimated timestamp when the impact analysis job will be
            completed, in the format of `YYYY-MM-DDThh:mm:ss.sssZ`. The estimated
            time will be available only when the job has started processing messages.
          readOnly: true
        jobDuration:
          type: integer
          readOnly: true
          description: The duration time in seconds for the job that is running.
        jobId:
          type: string
          readOnly: true
          description: The ID of the job submitted.
          format: uuid
        sessionId:
          type: string
          readOnly: true
          description: The session ID that is used for the impact analysis.
        totalMessageCount:
          type: number
          readOnly: true
          description: The total number of messages processed.
        processedMessageCount:
          type: number
          readOnly: true
          description: The number of messages processed so far.
        firedMessageCount:
          type: number
          readOnly: true
          description: The number of messages fired on by the rules.
        projectId:
          type: string
          readOnly: true
          description: The ID of the associated project.
        canBeCanceled:
          type: boolean
          readOnly: true
          default: false
          description: A flag to indicate whether the impact analysis can be canceled.
        canBeDeleted:
