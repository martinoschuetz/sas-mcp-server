      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/variableRuleUsageSummary"
    profileVariableRuleUsageSummary:
      description: A summary of the usage of a profile variable by rules.
      title: ProfileVariableRuleUsageSummary
