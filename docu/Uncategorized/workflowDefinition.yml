---
openapi: 3.0.3
info:
  version: '4'
  title: Workflow Definition
  description: 'The workflow definition API is provided to manage workflow definitions
    for the Workflow Manager. Workflow Manager publishes BPMN documents to the Workflow
    API so that they can be instantiated into workflow processes. When rendering the
    BPMN document Workflow Manager uses a proprietary data format. The Workflow Definition
    API provides translation to and from BPMN to the proprietary rendering format.
    In addition, the Workflow Definition API provides endpoints for users to save
    private versions of BPMN documents before they are published to the Workflow API.
    The Workflow History API keeps a copy of all definitions if the definition is
    deleted from the Workflow API it can be retrieved from the  Workflow History API.
    Workflow definition API also is provided to manage customized task templates.
    Customized task templates is stored in file API and used by Workflow Manager.'
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
servers:
- description: This is an example of a base URL.
  url: 'https://example.com/workflowDefinition'
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Definitions
  description: 'Contains the operations to read, update definitions.'
- name: TaskTemplates
  description: 'Contains the operations to read, update and delete task templates.'
- name: PromptAttributes
  description: 'Contains the operations to read, update and delete prompt attributes.'
paths:
  /:
    get:
      operationId: root
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentType'
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
    head:
      operationId: headersForRoot
      tags:
      - Root
      summary: Check if the service is available
      description: Returns whether or not the service is running.
      responses:
        '200':
          description: OK. Service is running and available
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentType'
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
  /definitions:
    get:
      tags:
      - Definitions
      summary: Get definitions
      description: Return a collection of workflow definitions and draft files.
      operationId: getDefinitions
      parameters:
      - name: start
        in: query
        description: The starting index of the first definition in a page. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of definitions to return in this page of results.
          The actual number of returned definitions may be less if the collection
          has been exhausted. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: 'The criteria for filtering the ${pluralNames}. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/workflowDefinition-v4/docs/getting-started/usage-notes#filtering).'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: 'The criteria for sorting the ${pluralNames}. See [Sorting in
          REST APIs](https://developer.sas.com/rest-apis/workflowDefinition-v4/docs/getting-started/usage-notes#sorting).'
        schema:
          type: string
          format: sort-criteria
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentType'
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/definitionAggregationCollection'
              examples:
                application/vnd.sas.workflow.definition.summary+json:
                  $ref: "#/components/examples/aggregationDefinitionsCollection"
            application/json:
              schema:
                $ref: '#/components/schemas/definitionAggregationCollection'
              examples:
                application/vnd.sas.workflow.definition.summary+json:
                  $ref: "#/components/examples/aggregationDefinitionsCollection"
    post:
      tags:
      - Definitions
      description: Creates a public revision of a workflow definition in the Workflow
        service. This revision is accessible to all users that have been granted permission
        to it in the Workflow Service. Operations such as retrieving a collection
        of definitions or deleting a definition are handled through the Workflow service
        API.
      summary: Create the initial public revision of a workflow definition in the
        workflow service
      operationId: createDefinition
      requestBody:
        content:
          application/vnd.sas.workflow.definition.visual+json:
            schema:
              $ref: '#/components/schemas/visualModel'
            examples:
              default:
                $ref: "#/components/examples/createDefinition"
          application/json:
            schema:
              $ref: '#/components/schemas/visualModel'
            examples:
              default:
                $ref: "#/components/examples/createDefinition"
        description: This is the visual graph representation. The format is defined
          by GoJS and is proprietary to the GoJS rendering engine.
        required: true
      responses:
        '201':
          description: The definition was created in the workflow service.
          headers:
            ETag:
              description: The entity tag for the workflow definition.
              schema:
                type: string
            Location:
              description: The URI of the newly created workflow definition.
              schema:
                type: string
          content:
            application/vnd.sas.workflow.definition.summary+json:
              schema:
                $ref: '#/components/schemas/definitionSummary'
              examples:
                default:
                  $ref: "#/components/examples/summaryDefinition"
            application/json:
              schema:
                $ref: '#/components/schemas/definitionSummary'
              examples:
                default:
                  $ref: "#/components/examples/summaryDefinition"
        '400':
          description: There was invalid data in the request. May provide an additional
            error code.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
  /definitions#private:
    post:
      tags:
      - Definitions
      summary: Create a private revision of the workflow definition. The definition
        is stored in the file service
      description: Creates a private revision of a workflow definition in the File
        service. This revision is only accessible by the user that created it. Search
        and delete are handled through the File service.
      operationId: createPrivateDefinition
      requestBody:
        content:
          application/vnd.sas.workflow.definition.visual+json:
            schema:
              $ref: '#/components/schemas/visualModel'
            examples:
              default:
                $ref: "#/components/examples/createDefinition"
          application/json:
            schema:
              $ref: '#/components/schemas/visualModel'
            examples:
              default:
                $ref: "#/components/examples/createDefinition"
        description: This is the visual graph representation. The format is defined
          by GoJS and is proprietary to the GoJS rendering engine.
        required: true
      responses:
        '201':
          description: The definition was created in the file service
          headers:
            ETag:
              description: The entity tag for the workflow definition.
              schema:
                type: string
            Location:
              description: The URI of the newly created workflow definition.
              schema:
                type: string
          content:
            application/vnd.sas.file+json:
              schema:
                $ref: '#/components/schemas/fileResource'
              examples:
                default:
                  $ref: "#/components/examples/summaryFile"
            application/json:
              schema:
                $ref: '#/components/schemas/fileResource'
              examples:
                default:
                  $ref: "#/components/examples/summaryFile"
        '400':
          description: There was invalid data in the request. May provide an additional
            error code.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
  /definitions#import:
    post:
      tags:
      - Definitions
      summary: Import a BPMN file from the user's file system and create a private
        revisiom. The BPMN is validated during the import
      description: Import a BPMN file from the local file system and a private revision
        of a workflow definition in the File service. This revision is only accessible
        by the user that created it. Search and delete are handled through the File
        service.
      operationId: importDefinition
      parameters:
      - name: definitionId
        in: query
        required: true
        description: 'If supplied, the id of the definition to replace with this import.'
        schema:
          type: string
      - name: definitionName
        in: query
        required: true
        description: The name of the model. This will be the name of the definition
          in workflow service.
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/bpmnDocument'
            examples:
              default:
                $ref: "#/components/examples/createDefinition"
        description: The input for this endpoint is a BPMN xml document.
        required: true
      responses:
        '201':
          description: The definition was created in the file service
          headers:
            ETag:
              description: The entity tag for the workflow definition.
              schema:
                type: string
            Location:
              description: The URI of the newly created workflow definition.
              schema:
                type: string
          content:
            application/vnd.sas.file+json:
              schema:
                $ref: '#/components/schemas/fileResource'
              examples:
                default:
                  $ref: "#/components/examples/summaryFile"
            application/json:
              schema:
                $ref: '#/components/schemas/fileResource'
              examples:
                default:
                  $ref: "#/components/examples/summaryFile"
        '400':
          description: There was invalid data in the request. May provide an additional
            error code.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
  '/definitions/{definitionId}':
    put:
      tags:
      - Definitions
      summary: Update the public revision of the workflow definition in Workflow Service
      description: Update the public revision of a workflow definition in the Workflow
        service. This creates a new revision of the definition in the Workflow service.
        See the Workflow service API for information about Revisions of workflow definitions.
      operationId: updateDefinition
      parameters:
      - name: definitionId
        in: path
        description: The id of the definition. This is the id of the definition in
          the Workflow service.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The etag that was returned from a GET of the object. This etag
          corresponds with the definition in the workflow service.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.workflow.definition.visual+json:
            schema:
              $ref: '#/components/schemas/visualModel'
            examples:
              default:
                $ref: "#/components/examples/createDefinition"
          application/json:
            schema:
              $ref: '#/components/schemas/visualModel'
            examples:
              default:
                $ref: "#/components/examples/createDefinition"
        required: true
      responses:
        '200':
          description: The definition was updated in the workflow service
          headers:
            ETag:
              description: The entity tag for the workflow definition.
              schema:
                type: string
            Location:
              description: The URI of the update workflow definition.
              schema:
                type: string
          content:
            application/vnd.sas.workflow.definition.summary+json:
              schema:
                $ref: '#/components/schemas/definitionSummary'
              examples:
                default:
                  $ref: "#/components/examples/summaryDefinition"
            application/json:
              schema:
                $ref: '#/components/schemas/definitionSummary'
              examples:
                default:
                  $ref: "#/components/examples/summaryDefinition"
        '400':
          description: There was invalid data in the request. May provide an additional
            error code.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        '404':
          description: Not Found. The definition id could not be found in the workflow
            service.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        '409':
          description: A name or id conflict exists with an existing record.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/conflict"
        '412':
          description: Precondition Failed. The ETag provided does not match the current
            state of the object.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        '428':
          description: The request headers did not include a `If-Match` precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
  '/definitions/{definitionId}#private':
    put:
      tags:
      - Definitions
      summary: Update the user's private revision of the workflow definition
      description: Update the user's private revision of a workflow definition in
        the File service. This replaces the content of the private version of the
        definition.
      operationId: updatePrivateDefinition
      parameters:
      - name: definitionId
        in: path
        description: The id of the definition. This is the id of the definition in
          the Workflow service.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The etag that was returned from a GET of the object. This etag
          corresponds with the definition in the workflow service.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.workflow.definition.visual+json:
            schema:
              $ref: '#/components/schemas/visualModel'
            examples:
              default:
                $ref: "#/components/examples/createDefinition"
        required: true
      responses:
        '200':
          description: The definition was updated in the file service
          headers:
            ETag:
              description: The entity tag for the workflow definition.
              schema:
                type: string
            Location:
              description: The URI of the updated workflow definition.
              schema:
                type: string
          content:
            application/vnd.sas.file+json:
              schema:
                $ref: '#/components/schemas/fileResource'
              examples:
                default:
                  $ref: "#/components/examples/summaryFile"
            application/json:
              schema:
                $ref: '#/components/schemas/fileResource'
              examples:
                default:
                  $ref: "#/components/examples/summaryFile"
        '400':
          description: There was invalid data in the request. May provide an additional
            error code.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        '404':
          description: Not Found. The file or workflow service definition could not
            be located.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        '412':
          description: Precondition Failed. The ETag provided does not match the current
            state of the object.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        '428':
          description: The request headers did not include a `If-Match` precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
  '/definitions/{definitionId}/revisions':
    get:
      tags:
      - Definitions
      summary: Read all public revisions of the workflow definition from the Workflow
        service
      description: 'Read all workflow definition revisions from the workflow service.
        The {revision} is a  a revision of the corresponding definition in the workflow
        service.'
      operationId: getDefinitionRevisions
      parameters:
      - name: definitionId
        in: path
        description: The id of the definition. This is the id of the definition in
          the Workflow service.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentType'
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/definitionSummaryCollection'
              examples:
                default:
                  $ref: "#/components/examples/summaryDefinitionsCollection"
            application/json:
              schema:
                $ref: '#/components/schemas/definitionSummaryCollection'
              examples:
                default:
                  $ref: "#/components/examples/summaryDefinitionsCollection"
        '404':
          description: 'Not Found. The workflow definition revisions could not be
            located in the workflow service because the definition id is not correct.'
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    head:
      tags:
      - Definitions
      summary: Check that revisions for a definition exist
      description: 'Returns information about all workflow definition revisions from
        the Workflow service. The revisions are associated with the specified definition
        in the Workflow service.'
      operationId: headersForDefinitionRevisions
      parameters:
      - name: definitionId
        in: path
        description: The ID of the definition in the Workflow service.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
        '404':
          description: 'No workflow definition revisions could be found in the Workflow
            service because the definition ID is invalid.'
  '/definitions/{definitionId}/revisions/{revision}/model':
    get:
      tags:
      - Definitions
      summary: Read a public revision of the workflow definition from the Workflow
        service
      description: 'Read the workflow definition from the workflow service and produce
        the GoJS visual representation. This method determines is used if the {source}
        is ''engine''. The {revision} is a  a revision of the corresponding definition
        in the workflow service.'
      operationId: getDefinition
      parameters:
      - name: definitionId
        in: path
        description: The id of the definition. This is the id of the definition in
          the Workflow service.
        required: true
        schema:
          type: string
      - name: revision
        in: path
        description: The revision of the bpmn. This is the revision of the definition
          in the Workflow service.
        required: true
        schema:
          type: string
      - name: source
        in: query
        required: true
        description: 'Source where the model will be read [engine | file | history].
          ''Engine'' reads from the workflow service.'
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: The entity tag for the workflow definition.
              schema:
                type: string
          content:
            application/vnd.sas.workflow.definition.visual+json:
              schema:
                $ref: '#/components/schemas/visualModel'
              examples:
                default:
                  $ref: "#/components/examples/fullDefinitionVisualModel"
            application/json:
              schema:
                $ref: '#/components/schemas/visualModel'
              examples:
                default:
                  $ref: "#/components/examples/fullDefinitionVisualModel"
        '404':
          description: 'Not Found. The workflow definition revision could not be located
            in the workflow service. Or if requesting a current revision, could not
            be located in the file service.'
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  '/definitions/{definitionId}/revisions/{revision}/model#private':
    get:
      tags:
      - Definitions
      summary: Read the user's private revision of the workflow definition from the
        File service
      description: 'Read the workflow definition from the file service and produce
        the GoJS visual representation. This method is used if the {source} is ''file''.
        The {revision} is the  id of the file in the file service.'
      operationId: getDefinitionFromFile
      parameters:
      - name: definitionId
        in: path
        description: The id of the definition. This is the id of the definition in
          the Workflow service.
        required: true
        schema:
          type: string
      - name: revision
        in: path
        description: The revision of the bpmn. This is the file resource id in the
          file service.
        required: true
        schema:
          type: string
      - name: source
        in: query
        required: true
        description: 'Source where the model will be read [engine | file | history].
          ''File'' reads the current draft from the file service.'
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: The entity tag for the workflow definition.
              schema:
                type: string
          content:
            application/vnd.sas.workflow.definition.visual+json:
              schema:
                $ref: '#/components/schemas/visualModel'
              examples:
                default:
                  $ref: "#/components/examples/fullDefinitionVisualModel"
            application/json:
              schema:
                $ref: '#/components/schemas/visualModel'
              examples:
                default:
                  $ref: "#/components/examples/fullDefinitionVisualModel"
        '404':
          description: 'Not Found. The workflow definition revision could not be located
            in the workflow service. Or if requesting a current revision, could not
            be located in the file service.'
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  '/definitions/{definitionId}/revisions/{revision}/model#history':
    get:
      tags:
      - Definitions
      summary: Read a public revision of the workflow definition from the Workflow
        History service
      description: 'Read the workflow definition from the workflow history service
        and produce the GoJS visual representation. This method determines is used
        if the {source} is ''history''. The {revision} is a  a revision of the corresponding
        definition in the Workflow History service. No updates can be made to definitions
        in the Workflow History service.'
      operationId: getDefinitionFromHistory
      parameters:
      - name: definitionId
        in: path
        description: The id of the definition. This is the id of the definition in
          the Workflow history service.
        required: true
        schema:
          type: string
      - name: revision
        in: path
        description: The revision of the bpmn. This is the revision of the definition
          in the Workflow History service.
        required: true
        schema:
          type: string
      - name: source
        in: query
        required: true
        description: 'Source where the model will be read [engine | file | history].
          ''History'' reads from the Workflow History service.'
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentType'
          content:
            application/vnd.sas.workflow.definition.visual+json:
              schema:
                $ref: '#/components/schemas/visualModel'
              examples:
                default:
                  $ref: "#/components/examples/fullDefinitionVisualModel"
            application/json:
              schema:
                $ref: '#/components/schemas/visualModel'
              examples:
                default:
                  $ref: "#/components/examples/fullDefinitionVisualModel"
        '404':
          description: 'Not Found. The workflow definition revision could not be located
            in the workflow service. Or if requesting a current revision, could not
            be located in the file service.'
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /taskTemplates:
    get:
      tags:
      - TaskTemplates
      summary: Get collection of task templates
      description: Return a collection of workflow task templates definition.
      operationId: getTaskTemplates
      parameters:
      - name: start
        in: query
        description: The starting index of the first task templates in a page. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of task templates to return in this page of results.
          The actual number of returned task templates may be less if the collection
          has been exhausted. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: 'The criteria for filtering the ${pluralNames}. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/workflowDefinition-v4/docs/getting-started/usage-notes#filtering).'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: 'The criteria for sorting the ${pluralNames}. See [Sorting in
          REST APIs](https://developer.sas.com/rest-apis/workflowDefinition-v4/docs/getting-started/usage-notes#sorting).'
        schema:
          type: string
          format: sort-criteria
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentType'
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/taskTemplateCollection'
              examples:
                default:
                  $ref: "#/components/examples/taskTemplatesCollection"
            application/json:
              schema:
                $ref: '#/components/schemas/taskTemplateCollection'
              examples:
                default:
                  $ref: "#/components/examples/taskTemplatesCollection"
        '400':
          description: An invalid filter or combination of request parameters was
            provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
