info:
  title: 'SAS Health: Add-in Manager REST API'
  description: 'Service for creating, managing, and executing Health Add-ins.'
  version: '1'
tags:
- name: Root
  description: The operations for the root resource
- name: Template
  description: The operations for the template resource
- name: Instance
  description: The operations for the instance resource
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
            application/json:
              schema:
                $ref: '#/components/schemas/api'
    head:
      tags:
      - Root
      summary: Get the headers for the API
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      operationId: headersForRoot
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
            application/json:
              schema:
                $ref: '#/components/schemas/api'
  /templates:
    get:
      tags:
      - Template
      summary: Get a collection of templates
      description: |
        Returns a collection of templates based on the specified pagination, filtering, and sorting options. The items in the collection use the `application/vnd.sas.summary+json` media type.
      operationId: getTemplates
      parameters:
      - name: Accept
        in: header
        description: |
          The requested representation of the template collection. Media type 'application/vnd.sas.collection+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/json
      - name: Accept-Item
        in: header
        description: |
          Requested representation of the template items in the collection. Media type 'application/vnd.sas.summary+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.summary+json
          - application/vnd.sas.health.add-in.template+json
          - application/json
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/sortBy'
      - $ref: '#/components/parameters/excludeItemLinks'
      - $ref: '#/components/parameters/excludeJobDefinitions'
      responses:
        '200':
          description: Returns the collection of templates.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/templateSummaryCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/templateSummaryCollection'
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    post:
      tags:
      - Template
      summary: Create a new template
      description: Creates a new template based on the representation in the request
        body.
      operationId: createTemplate
      parameters:
      - name: Content-Type
        in: header
        description: |
          Representation of the template in the body. Media type 'application/vnd.sas.health.add-in.template+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.health.add-in.template+json
          - application/json
      - name: Accept
        in: header
        description: |
          Requested representation of the template. Media type 'application/vnd.sas.health.add-in.template+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.health.add-in.template+json
          - application/json
      - name: createDefault
        in: query
        required: false
        description: Whether or not to set default name and category on creation.
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/vnd.sas.health.add-in.template+json:
            schema:
              $ref: '#/components/schemas/createTemplateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/createTemplateRequest'
        description: |
          The representation of a template to create. Media type 'application/vnd.sas.health.add-in.template+json' is the default.
        required: true
      responses:
        '201':
          description: A template was created.
          headers:
            Location:
              description: The URI of the template.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the template.
              schema:
                type: string
          content:
            application/vnd.sas.health.add-in.template+json:
              schema:
                $ref: '#/components/schemas/template'
            application/json:
              schema:
                $ref: '#/components/schemas/template'
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.health.add-in.template+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        '409':
          description: |
            Conflict. The template could not be created since a template with the same name already exists.
          content:
            application/vnd.sas.health.add-in.template+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
