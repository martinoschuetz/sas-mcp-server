                $ref: '#/components/schemas/template'
            application/json:
              schema:
                $ref: '#/components/schemas/template'
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.health.add-in.template+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        '404':
          description: Template not found.
        '409':
          description: |
            Conflict. The template could not be updated since a template with the same name already exists.
          content:
            application/vnd.sas.health.add-in.template+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        '412':
          description: The Template last modified date does not correspond to the
