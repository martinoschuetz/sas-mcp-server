  '/templates/{templateId}/startExecution':
    parameters:
    - name: templateId
      in: path
      required: true
      description: The unique identifier for the template.
      schema:
        type: string
    - name: sessionId
      in: query
      required: false
      description: 'The compute session ID to use. If not set, a new session is requested.'
      schema:
        type: string
    post:
      tags:
      - Template
      summary: Execute the template code
      description: Runs an asynchronous job via the job execution service and returns
        the pending job.
      operationId: executeTemplate
      parameters:
      - name: Content-Type
        in: header
        description: |
          Representation of the code in the body. Media type 'application/vnd.sas.health.add-in.template+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.health.add-in.template+json
          - application/json
      - name: Accept
        in: header
        description: |
          Requested representation of the job. Media type 'application/vnd.sas.job.execution.job+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.job.execution.job+json
          - application/json
      requestBody:
        content:
          application/vnd.sas.health.add-in.template+json:
            schema:
              $ref: '#/components/schemas/updateTemplateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/updateTemplateRequest'
        description: |
          The optional representation of a template to run code for, if not running the saved code.
      responses:
        '201':
          description: The job execution began successfully.
          headers:
            Location:
              description: The URI of the job execution job.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the job execution job.
              schema:
                type: string
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
        '400':
          description: There was an error beginning the execution.
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        '404':
          description: No template exists at the requested path.
