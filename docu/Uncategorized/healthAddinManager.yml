        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.health.add-in.instance+json
          - application/json
      - name: If-Match
        in: header
        description: The ETag of the instance being modified.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.health.add-in.instance+json:
            schema:
