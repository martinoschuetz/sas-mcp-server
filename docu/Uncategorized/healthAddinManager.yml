              $ref: '#/components/schemas/updateInstanceRequest'
        description: |
          The representation of an instance to update. Media type 'application/vnd.sas.health.add-in.instance+json' is the default.
        required: true
      responses:
        '200':
          description: The instance was updated.
          headers:
            ETag:
              description: The entity tag for the instance.
              schema:
                type: string
          content:
            application/vnd.sas.health.add-in.instance+json:
              schema:
                $ref: '#/components/schemas/instance'
            application/json:
              schema:
                $ref: '#/components/schemas/instance'
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.health.add-in.instance+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        '404':
          description: Instance not found.
        '409':
          description: |
            Conflict. The instance could not be updated since an instance with the same name already exists for the given template.
          content:
            application/vnd.sas.health.add-in.instance+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        '412':
          description: The Instance last modified date does not correspond to the
            submitted ETag.
        '422':
          description: The request body does not contain an instance and cannot be
            processed.
        '428':
          description: No If-Match header was provided.
    delete:
      tags:
      - Instance
      summary: Delete an instance
      description: Deletes the instance with the specified ID
      operationId: deleteInstance
      responses:
        '204':
          description: The request succeeded or the instance was not found.
  '/instances/{instanceId}/startExecution':
    parameters:
    - name: instanceId
      in: path
      required: true
      description: The unique identifier for the instance.
      schema:
        type: string
    - name: sessionId
      in: query
      required: false
      description: 'The compute session ID to use. If not set, a new session is requested.'
      schema:
        type: string
    post:
      tags:
      - Instance
      summary: Execute the instance code
      description: Runs an asynchronous job via the job execution service and returns
        the pending job.
      operationId: executeInstance
      parameters:
      - name: Content-Type
        in: header
        description: |
          Representation of the code in the body. Media type 'application/vnd.sas.health.add-in.instance+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.health.add-in.instance+json
          - application/json
      - name: Accept
        in: header
        description: |
          Requested representation of the job. Media type 'application/vnd.sas.job.execution.job+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.job.execution.job+json
          - application/json
      requestBody:
        content:
          application/vnd.sas.health.add-in.instance+json:
            schema:
              $ref: '#/components/schemas/updateInstanceRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/updateInstanceRequest'
        description: |
          The optional representation of an instance to run code for, if not running the saved code.
      responses:
        '201':
          description: The job execution began successfully.
          headers:
            Location:
              description: The URI of the job execution job.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the job execution job.
              schema:
                type: string
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
        '400':
          description: There was an error beginning the execution.
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        '404':
          description: No instance exists at the requested path.
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
