                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        '404':
          description: Instance not found
        '409':
          description: |
            Conflict. The instance could not be updated since a template with the same name already exists.
          content:
            application/vnd.sas.health.add-in.instance+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        '412':
          description: The Instance last modified date does not correspond to the
            submitted ETag.
        '428':
          description: No If-Match header was provided.
    patch:
      tags:
      - Instance
      summary: Patch an instance
      description: |
        Updates an instance based on the representation in the request body. As a PATCH, only the fields that need changing must be sent, in addition to the ID.
      operationId: patchInstance
      parameters:
      - name: Content-Type
        in: header
        description: |
          Representation of the instance in the body. Media type 'application/vnd.sas.health.add-in.instance+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.health.add-in.instance+json
          - application/json
      - name: Accept
        in: header
        description: |
