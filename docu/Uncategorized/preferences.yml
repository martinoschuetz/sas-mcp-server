---
openapi: 3.0.3
info:
  version: "2"
  title: Preferences
  description: >
    The preferences API provides storage and retrieval for application-based
    user preferences.  Clients should be prepared to handle all valid HTTP
    response codes, including 3xx redirection response codes. <br> <br>
    <b>Delegates</b> <br><br> The preferences API recognizes one delegate
    value, <b>@currentUser</b>.  This may be used in the path anywhere a userid
    is accepted to represent the currently authenticated user. <br> <br> All GET
    operations have a corresponding HEAD with identical signature and semantics
    except the resource body is not returned.
    <br> <br><b>Terminology:</b> <br><br>
    Preference: A user-specific key/value pair representing some application data
    item.
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
servers:
- url: http://example.com/preferences
  description: kubernetes mock server
- url: http://example.com/preferences
  description: local mock server
tags:
- name: Root
  description: The operations for the root resource.
- name: User
  description: The operations for normal user consumption.
paths:
  /:
    get:
      tags:
      - Root
      summary: Returns links to the user preferences collections
      operationId: root
      description: |
        Returns links that get or create preferences for the current user.
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getPreferencesRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getPreferencesRootResponse"
  "/preferences/{userId}":
    get:
      tags:
      - User
      summary: Get preferences for user
      operationId: getPreferences
      description: >
        Get preferences for the specified user.  Only an administrative user is
        allowed to retrieve preferences for a user other than themselves.
      parameters:
      - name: userId
        in: path
        required: true
        description: The userid of the user to get preferences for.  The @currentUser
          delegate may be used to indicate the currently authenticated user.
        schema:
          type: string
      - name: filter
        in: query
        description: |
          Filter criteria for returned preferences.
        schema:
          type: string
          format: filter-criteria
      - name: start
        in: query
        description: 0-based Offset of first preference to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of preferences to return.  Defaults to 20.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sort returned preferences.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: Success. The preferences (if any) are returned in a resource
            collection.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/preferenceCollection"
              examples:
                json:
                  $ref: "#/components/examples/getprefapp"
            application/json:
              schema:
                $ref: "#/components/schemas/preferenceCollection"
              examples:
                json:
                  $ref: "#/components/examples/getprefapp"
        "400":
          description: An invalid filter or other parameter was provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getPreferences400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getPreferences400Response"
    post:
      tags:
      - User
      summary: Create or update a set of preferences
      operationId: createOrUpdatePreferences
      description: Accepts a ResourceCollection of application/vnd.sas.preference
        objects in the request body, and either updates or creates the preferences
        to match those.  Note that the id for each preference should be namespace-qualified
        to prevent collisions.  The application is not part of the key, so it doesn't
        factor into uniqueness.  A name collision in id will result in an overwrite
        of the preferences.
      parameters:
      - name: userId
        in: path
        description: The userid of the user to set options for. The @currentUser delegate
          may be used to indicate the currently authenticated user.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/preferenceCollection"
            examples:
              json:
                $ref: "#/components/examples/preferenceCollectionBodyExample"
          application/json:
            schema:
              $ref: "#/components/schemas/preferenceCollection"
            examples:
              json:
                $ref: "#/components/examples/preferenceCollectionBodyExample"
        required: true
      responses:
        "200":
          description: Success.  The preferences were created or updated and returned.
          headers:
            Content-Location:
              description: The base URI for the user whose preferences are being updated,
                e.g. /preferences/preferences/imauser.
              schema:
                type: string
            Content-Type:
              description: The media type for the response (application/vnd.sas.collection+json).
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/preferenceCollection"
              examples:
                json:
                  $ref: "#/components/examples/postPreferencesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/preferenceCollection"
              examples:
                json:
                  $ref: "#/components/examples/postPreferencesResponse"
        "201":
          description: Success.  The preferences were created or updated and returned.
          headers:
            Content-Location:
              description: The base URI for the user whose preferences are being updated,
                e.g. /preferences/preferences/imauser.
              schema:
                type: string
            Content-Type:
              description: The media type for the response (application/vnd.sas.collection+json).
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/preferenceCollection"
              examples:
                json:
                  $ref: "#/components/examples/postPreferencesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/preferenceCollection"
              examples:
                json:
                  $ref: "#/components/examples/postPreferencesResponse"
        "400":
          description: Missing or malformed request body.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/postPreferences400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/postPreferences400Response"
    delete:
      tags:
      - User
      summary: Delete a set of preferences
      operationId: deletePreferences
      description: >
        Accepts a ResourceCollection of application/vnd.sas.preference objects
        in the request body,  and deletes the preferences in the collection. If
        a preference is provided that does not exist,  it is ignored and
        processing continues.
      parameters:
      - name: userId
        in: path
        description: The userid of the user to delete options for. The @currentUser
          delegate may be used to indicate the currently authenticated user.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/preferenceCollection"
            examples:
              json:
                $ref: "#/components/examples/preferenceCollectionBodyExample"
          application/json:
            schema:
              $ref: "#/components/schemas/preferenceCollection"
            examples:
              json:
                $ref: "#/components/examples/preferenceCollectionBodyExample"
        required: true
      responses:
        "204":
          description: Success.  The preferences were deleted.
  "/preferences/{userId}/{preferenceId}":
    get:
      description: Get a single preference for a user by identifier.
      tags:
      - User
      summary: Get a specific user preference
      operationId: getPreference
      parameters:
      - name: userId
        in: path
        required: true
        description: The userid of the user the preference belongs to.  The @currentUser
          delegate may be used here to indicate the currently authenticated user.
        schema:
          type: string
      - name: preferenceId
        in: path
        required: true
        description: The identifier of the preference.  This should be a namespace-qualified
          value to prevent naming collisions.
        schema:
          type: string
      responses:
        "200":
          description: Success.  The preference is returned.
          headers:
            Content-Location:
              description: The URI of the preference.
              schema:
                type: string
          content:
            application/vnd.sas.preference+json:
              schema:
                $ref: "#/components/schemas/preference"
              examples:
                json:
                  $ref: "#/components/examples/getPreferenceResponseExample"
            application/json:
              schema:
                $ref: "#/components/schemas/preference"
              examples:
                json:
                  $ref: "#/components/examples/getPreferenceResponseExample"
        "404":
          description: No preference with the given id was found for the user.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getPreference404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getPreference404Response"
    head:
      tags:
      - User
      summary: Check availability of a Preference
      operationId: headersForPreference
      description: |
        Retrieve the headers and check the availability of a Preference.
      parameters:
      - name: userId
        in: path
        required: true
        description: The userid of the user the preference belongs to.  The @currentUser
          delegate may be used here to indicate the currently authenticated user.
        schema:
          type: string
      - name: preferenceId
        in: path
        required: true
        description: The identifier of the preference.  This should be a namespace-qualified
          value to prevent naming collisions.
        schema:
          type: string
      responses:
        "200":
          description: success.  The preference is returned.
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: Not Found.  No preference with the given id was found.
          headers:
            Content-Type:
              schema:
                type: string
    put:
      description: Create or update a single preference for the user specified.  Note
        that the id for each preference should be namespace-qualified to prevent collisions.  The
        application is not part of the key, so it doesn't factor into uniqueness.  A
        name collision in id will result in an overwrite of the preference.
      tags:
      - User
      summary: Create/Update a preference for the user
      operationId: updatePreference
      parameters:
      - name: userId
        in: path
        required: true
        description: The userid of the user the preference belongs to.  The @currentUser
          delegate may be used here to indicate the currently authenticated user.
        schema:
          type: string
      - name: preferenceId
        in: path
        required: true
        description: The identifier of the preference to create or update.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.preference:
            schema:
              $ref: "#/components/schemas/preference"
            examples:
              json:
                $ref: "#/components/examples/preferenceBodyExample"
          application/json:
            schema:
              $ref: "#/components/schemas/preference"
            examples:
              json:
                $ref: "#/components/examples/preferenceBodyExample"
        required: true
      responses:
        "200":
          description: Success. The preference was updated and returned.
          content:
            application/vnd.sas.preference:
              schema:
                $ref: "#/components/schemas/preference"
              examples:
                json:
                  $ref: "#/components/examples/singlePreferenceResponseExample"
            application/json:
              schema:
                $ref: "#/components/schemas/preference"
              examples:
                json:
                  $ref: "#/components/examples/singlePreferenceResponseExample"
        "201":
          description: Success. The preference was created and returned.
          content:
            application/vnd.sas.preference:
              schema:
                $ref: "#/components/schemas/preference"
              examples:
                json:
                  $ref: "#/components/examples/singlePreferenceResponseExample"
            application/json:
              schema:
                $ref: "#/components/schemas/preference"
              examples:
                json:
                  $ref: "#/components/examples/singlePreferenceResponseExample"
        "204":
          description: Success. The preference was created.
          content:
            application/vnd.sas.preference:
              schema:
                $ref: "#/components/schemas/preference"
              examples:
                json:
                  $ref: "#/components/examples/singlePreferenceResponseExample"
            application/json:
              schema:
                $ref: "#/components/schemas/preference"
              examples:
                json:
                  $ref: "#/components/examples/singlePreferenceResponseExample"
        "400":
          description: The request body was missing or malformed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/putPref400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/putPref400Response"
    delete:
      tags:
      - User
      description: Delete a single preference for the user.
      summary: Delete a preference for the user
      operationId: deletePreference
      parameters:
      - name: userId
        in: path
        required: true
        description: The userid of the user the preference belongs to.  The @currentUserDelegate
          may be used here to indicate the currently authenticated user.
        schema:
          type: string
      - name: preferenceId
        in: path
        required: true
        description: The identifier for the preference to be deleted.
        schema:
          type: string
      responses:
        "204":
          description: No Content.  The preference was deleted.
components:
  examples:
    getPreferencesRootResponse:
      summary: Preferences service endpoints
      description: List of endpoints for preferences service.
      value: {"version": 1, "links": [{"method": "GET", "rel": "preferences", "href": "/preferences/preferences/@currentUser",
            "uri": "/preferences/preferences/@currentUser", "type": "application/vnd.sas.collection",
            "itemType": "application/vnd.sas.preference"}, {"method": "POST", "rel": "newPreferences",
            "href": "/preferences/preferences/@currentUser", "uri": "/preferences/preferences/@currentUser",
            "type": "application/vnd.sas.collection", "responseType": "application/vnd.sas.collection",
            "itemType": "application/vnd.sas.preference", "responseItemType": "application/vnd.sas.preference"},
          {"method": "PUT", "rel": "createPreferences", "href": "/preferences/preferences/@currentUser",
            "uri": "/preferences/preferences/@currentUser", "type": "application/vnd.sas.preference",
            "responseType": "application/vnd.sas.collection", "responseItemType": "application/vnd.sas.preference"},
          {"method": "PUT", "rel": "createPreference", "href": "/preferences/preferences/@currentUser/{preferenceId}",
            "uri": "/preferences/preferences/@currentUser/{preferenceId}", "type": "application/vnd.sas.preference"},
          {"method": "DELETE", "rel": "deletePreferences", "href": "/preferences/preferences/@currentUser",
            "uri": "/preferences/preferences/@currentUser", "type": "application/vnd.sas.collection",
            "itemType": "application/vnd.sas.preference"}]}
    postPreferences400Response:
      summary: Bad Request for POST preferences
      description: Here is an example Bad Request response for POST preferences.
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 11003, "message": "The\
          \ preference was not valid.", "details": ['Invalid preference name "custom.color#".
            Preference names cannot contain the following characters: % & / ! # ''
            ( ) * + , : ; = ? @ [ ] { } | $', "path: /preferences/preferences/user1",
          "correlator: dc5ffdd8-2096-482d-81b6-1efda2502273"]}
    getPreference404Response:
      summary: Not Found for GET preference
      description: Here is an example Not Found response for Get preference.
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 11000, "message": 'The
          preference ID "custom.color" was requested for the user "user1" but could
          not be found.', "details": ["path: /preferences/preferences/@currentUser/custom.color",
          "correlator: 876a6e02-7e08-4229-85d7-20e5018685f8"]}
    deletePreference404Response:
      summary: Not Found for DELETE preference
      description: Here is an example Not Found response for Delete preference.
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 11000, "message": 'The
          preference with the ID "custom.color" for the user "user1" could not be
          found for deletion.', "details": ["path: /preferences/preferences/@currentUser/custom.color",
          "correlator: 041b63db-76b5-4ab9-8317-0d2bcaf31e28"]}
    putPref400Response:
      summary: Bad Request for PUT preference
      description: Here is an example Bad Request response for PUT preference.
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 11003, "message": "The\
          \ preference was not valid.", "details": ["Application violated constraint\
            \ max of 100", "path: /preferences/preferences/@currentUser", "correlator:\
            \ 77c48ea3-909d-43a8-8810-fbca75a13580"]}
    getPreferences400Response:
      summary: Bad Request for GET preferences
      description: Here is an example Bad Request response for GET preferences when
        invalid filter specified.
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 1100, "message": "Bad\
          \ Request", "details": ["Encountered unsupported function: invalid", "path:\
            \ /preferences/preferences/@currentUser", "correlator: 7168f1a6-b735-44ec-9a17-1aa6953eda7e"]}
    postPreferencesResponse:
      summary: Sample response for POST preferences
      description: Here is an example response to POST preferences.
      value: {"links": [{"method": "GET", "rel": "collection", "href": "/preferences/preferences/user1",
            "uri": "/preferences/preferences/user1", "type": "application/vnd.sas.collection"},
          {"method": "GET", "rel": "self", "href": "/preferences/preferences/user1?start=0&limit=20",
            "uri": "/preferences/preferences/user1?start=0&limit=20", "type": "application/vnd.sas.collection"},
          {"method": "PUT", "rel": "createPreference", "href": "/preferences/preferences/user1",
            "uri": "/preferences/preferences/user1", "type": "application/vnd.sas.preference",
            "responseType": "application/vnd.sas.preference"}, {"method": "DELETE",
            "rel": "delete", "href": "/preferences/preferences/user1", "uri": "/preferences/preferences/user1",
            "type": "application/vnd.sas.collection", "responseType": "application/vnd.sas.collection"},
          {"method": "POST", "rel": "update", "href": "/preferences/preferences/user1",
            "uri": "/preferences/preferences/user1", "type": "application/vnd.sas.collection",
            "responseType": "application/vnd.sas.collection"}], "name": "preferences",
        "accept": "application/vnd.sas.preference", "start": 0, "count": 2, "items": [
          {"id": "testapp.pref1", "value": "value1", "application": "testapp", "version": 1,
            "links": [{"method": "GET", "rel": "self", "href": "/preferences/preferences/user1/testapp.pref1",
                "uri": "/preferences/preferences/user1/testapp.pref1", "type": "application/vnd.sas.preference"},
              {"method": "PUT", "rel": "update", "href": "/preferences/preferences/user1/testapp.pref1",
                "uri": "/preferences/preferences/user1/testapp.pref1", "type": "application/vnd.sas.preference"},
              {"method": "DELETE", "rel": "delete", "href": "/preferences/preferences/user1/testapp.pref1",
                "uri": "/preferences/preferences/user1/testapp.pref1"}]}, {"id": "testapp.pref2",
            "value": "value2", "application": "testapp", "version": 1, "links": [
              {"method": "GET", "rel": "self", "href": "/preferences/preferences/user1/testapp.pref2",
                "uri": "/preferences/preferences/user1/testapp.pref2", "type": "application/vnd.sas.preference"},
              {"method": "PUT", "rel": "update", "href": "/preferences/preferences/user1/testapp.pref2",
                "uri": "/preferences/preferences/user1/testapp.pref2", "type": "application/vnd.sas.preference"},
              {"method": "DELETE", "rel": "delete", "href": "/preferences/preferences/user1/testapp.pref2",
                "uri": "/preferences/preferences/user1/testapp.pref2"}]}], "limit": 20,
        "version": 2}
    getprefapp:
      summary: Get preferences for a specific application
      description: Here is an example response to GET /preferences/preferences/@currentUser?filter=eq(application,
        'testapp').
      value: {"links": [{"method": "GET", "rel": "collection", "href": "/preferences/preferences/stpweb1",
            "uri": "/preferences/preferences/stpweb1", "type": "application/vnd.sas.collection"},
          {"method": "GET", "rel": "self", "href": "/preferences/preferences/stpweb1?filter=eq(application,%20'testapp')&start=0&limit=20",
            "uri": "/preferences/preferences/stpweb1?filter=eq(application,%20'testapp')&start=0&limit=20",
            "type": "application/vnd.sas.collection"}, {"method": "PUT", "rel": "createPreference",
            "href": "/preferences/preferences/stpweb1", "uri": "/preferences/preferences/stpweb1",
            "type": "application/vnd.sas.preference", "responseType": "application/vnd.sas.preference"},
          {"method": "DELETE", "rel": "delete", "href": "/preferences/preferences/stpweb1",
            "uri": "/preferences/preferences/stpweb1", "type": "application/vnd.sas.collection",
            "responseType": "application/vnd.sas.collection"}, {"method": "POST",
            "rel": "update", "href": "/preferences/preferences/stpweb1", "uri": "/preferences/preferences/stpweb1",
            "type": "application/vnd.sas.collection", "responseType": "application/vnd.sas.collection"}],
        "name": "preferences", "accept": "application/vnd.sas.preference", "start": 0,
        "count": 2, "items": [{"id": "testapp.pref1", "value": "value1", "application": "testapp",
            "version": 1, "links": [{"method": "GET", "rel": "self", "href": "/preferences/preferences/stpweb1/testapp.pref1",
                "uri": "/preferences/preferences/stpweb1/testapp.pref1", "type": "application/vnd.sas.preference"},
              {"method": "PUT", "rel": "update", "href": "/preferences/preferences/stpweb1/testapp.pref1",
                "uri": "/preferences/preferences/stpweb1/testapp.pref1", "type": "application/vnd.sas.preference"},
              {"method": "DELETE", "rel": "delete", "href": "/preferences/preferences/stpweb1/testapp.pref1",
                "uri": "/preferences/preferences/stpweb1/testapp.pref1"}]}, {"id": "testapp.pref2",
            "value": "value2", "application": "testapp", "version": 1, "links": [
              {"method": "GET", "rel": "self", "href": "/preferences/preferences/stpweb1/testapp.pref2",
                "uri": "/preferences/preferences/stpweb1/testapp.pref2", "type": "application/vnd.sas.preference"},
              {"method": "PUT", "rel": "update", "href": "/preferences/preferences/stpweb1/testapp.pref2",
                "uri": "/preferences/preferences/stpweb1/testapp.pref2", "type": "application/vnd.sas.preference"},
              {"method": "DELETE", "rel": "delete", "href": "/preferences/preferences/stpweb1/testapp.pref2",
                "uri": "/preferences/preferences/stpweb1/testapp.pref2"}]}], "limit": 20,
        "version": 2}
    getPreferenceResponseExample:
      summary: GET a single preference for the current user
      description: Here is a sample response to GET /preferences/preferences/@currentUser/testapp.pref2.
      value: {"id": "testapp.pref2", "value": "value2", "application": "testapp",
        "version": 1, "links": [{"method": "GET", "rel": "self", "href": "/preferences/preferences/stpweb1/testapp.pref2",
            "uri": "/preferences/preferences/stpweb1/testapp.pref2", "type": "application/vnd.sas.preference"},
          {"method": "PUT", "rel": "update", "href": "/preferences/preferences/stpweb1/testapp.pref2",
            "uri": "/preferences/preferences/stpweb1/testapp.pref2", "type": "application/vnd.sas.preference"},
          {"method": "DELETE", "rel": "delete", "href": "/preferences/preferences/stpweb1/testapp.pref2",
            "uri": "/preferences/preferences/stpweb1/testapp.pref2"}]}
    collection:
      summary: Collection
      description: Here is a sample response that is a collection of preferences.
      value: {"name": "preferences", "start": 0, "limit": 20, "accept": "application/vnd.sas.preference",
        "count": 0, "links": [{"method": "string", "rel": "string", "uri": "string",
            "href": "string", "type": "string"}], "items": [{"id": "sas.wip.home.folder.name",
            "description": "a test object", "application": "WIP", "value": "myhomefoldername",
            "version": 1}], "version": 1}
    preferenceCollectionBodyExample:
      summary: Body that is a collection of preferences
      description: This is an example body that is a collection of preferences.
      value: {"items": [{"id": "testapp.pref1", "value": "value1", "application": "testapp"},
          {"id": "testapp.pref2", "value": "value1", "application": "testapp"}, {
            "id": "testapp.pref3", "value": "value1", "application": "myapp"}]}
    preferenceBodyExample:
      summary: Preference body example
      description: This is an example preference body.
