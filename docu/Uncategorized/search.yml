        schema:
          type: string
      - name: facetsCount
        in: query
        required: false
        description: This parameter will limit the number of facet values received
          in response and will be applicable to all facetable fields in response.
          Default is 100
        schema:
          type: integer
          default: 100
      - name: maxMinFields
        in: query
        required: false
        description: Name of the comma separated numeric or date fields on which the
          aggregation Max and Min are required.
        schema:
          type: string
      - name: relaxed
        in: query
        required: false
        description: An indicator, if 'true', would add wild card '*' meaningfully
          to the words in the query. Defaulted to 'false'.
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/query"
            examples:
              json:
                $ref: "#/components/examples/query"
        description: query parameter contains query string and different search protocol
          functions.
        required: true
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.search.response+json:
              schema:
                $ref: "#/components/schemas/searchCollection"
              examples:
                json:
                  $ref: "#/components/examples/getContent"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/searchCollection"
              examples:
                json:
                  $ref: "#/components/examples/getContent"
            application/json:
              schema:
                $ref: "#/components/schemas/searchCollection"
              examples:
                json:
                  $ref: "#/components/examples/getContent"
        "400":
          description: "The request was not valid. There are multiple error scenario\
            \ refer error code and message for more detail."
          content:
            application/vnd.sas.error+json:
              schema:
