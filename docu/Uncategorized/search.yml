  /facets#getFacetsResultsWithPlainTextQuery:
    post:
      tags:
      - SearchOnFacets
      operationId: getFacetsResultsWithPlainTextQuery
      summary: Faceted search
      description: "This endpoint provides a default list of facets available in the\
        \ index at a given point of time. Facets can be visualized as the categories.\
        \ Endpoint response contains the facet names and different values for that\
        \ facet with count of each value.  \nThe information about SAS type and author\
        \ can be pre-fetched using  facets API before making the actual search query.\
        \ Use-case of the endpoint is to formulate the advanced search like a user\
        \ wants to search only in '2G Reports' created by 'Sam Andrew' having text\
        \ 'Quaterly Sales'.\n"
      parameters:
      - name: facetFields
        in: query
        required: false
        description: "Name of  the facet fields to be shown in reponse "
        schema:
          type: string
      - name: sortBy
        in: query
        description: "An optional parameter to control the sort order of the output.The\
          \ sort criteria supports the following fields in either ascending or descending\
          \ order  \n**name**  \n**distinctValueCount**  \nThe format of the parameter\
          \ is **sortBy=field:order** Defaulting sorting order is descending.\n"
        required: false
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: "The starting index of the first item in a page. The index is\
          \ 0-based. Default is 0 "
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        required: false
        description: "The maximum number of items to return in this page of results.\
          \ The actual number of returned items may be less if the collection has\
          \ been exhausted. The default is 100 "
        schema:
          type: integer
          default: 100
      - name: indexCaslib
        in: query
        required: false
        description: Name of cas library where given indexTableName is saved. If indexCaslib
          and indexTableName parameter is not provided ,then searching would be performed
          on default index used for VA.
        schema:
          type: string
      - name: indexTableName
        in: query
        required: false
        description: Name of CAS Index where search needs to be performed.If indexCaslib
          and indexTableName parameter is not provided ,then searching would be performed
          on default index used for VA.
        schema:
          type: string
      - name: facetsCount
        in: query
        required: false
        description: This parameter will limit the number of facet values received
          in response and will be applicable to all facetable fields in response.
          Default is 100
        schema:
          type: integer
          default: 100
      - name: maxMinFields
        in: query
        required: false
        description: Name of the comma separated numeric or date fields on which the
          aggregation Max and Min are required.
        schema:
          type: string
      - name: relaxed
        in: query
        required: false
        description: An indicator, if 'true', would add wild card '*' meaningfully
          to the words in the query. Defaulted to 'false'.
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/filter"
            examples:
              json:
                $ref: "#/components/examples/filter"
        description: filter parameter contains query string and different search protocol
          functions.
        required: true
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/facetsCollection"
              examples:
                json:
                  $ref: "#/components/examples/facetsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/facetsCollection"
              examples:
                json:
                  $ref: "#/components/examples/facetsCollection"
        "400":
          description: "The request was not valid. There are multiple error scenario\
            \ refer error code and message for more details."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/invalidQuery"
        "404":
          description: "Specified index do not exist."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
