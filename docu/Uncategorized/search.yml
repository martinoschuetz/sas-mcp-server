  /facets/{field}#getFacetFieldResultsWithPlainTextQuery:
    post:
      tags:
      - SearchOnFacet
      operationId: getFacetFieldResultsWithPlainTextQuery
      summary: Type-Specific faceted search
      description: "Search Facets Service provides a particular facet available in\
        \ the index at a given point of time. It must be noted that the response contains\
        \ requested facet for eligible type that have been indexed.  \nThis API can\
        \ be used in case of 'Advanced Search' scenario. End user will use this API\
        \ when they want to see facet information for single field like sasAuthor\
        \ instead of getting facets for whole index.\n"
      parameters:
      - name: field
        in: path
        description: 'Name of the facetable field.In case if the facet field has special
          character ,then field parameter should be provided with default value as
          "@facetName" and the facet field should be populate in query paramter "facetName".

          If in a schema there is a field with name as "@facetName" in this case if
          facetName is provided as query parameter,then calculation of facet will
          be done on the value provided in facetName. Sample uri would look like "/search/facets/@facetName?facetName=location''id.'
        required: true
        schema:
          type: string
      - name: facetName
        in: query
        description: 'Name of the facetable field.This was added since there can be
          special characters in a facet field like "/" or "?" or any reserved URI
          character. If field with special character is used as path parameter it
          would break the URL.

          Hence this parameter was introduced to overcome this limitation.For example
          the facetName can be "/.*product''^id" , "/%#;location;<>{}()[] id" ,"/open#@date"
          ,"\?closing#date","location''name" ,"Prod Name Spcl Char''1". These names
          should be url encoded.

          '
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        description: "An optional parameter to control the sort order of the output.The\
          \ sort criteria supports the following fields in either ascending or descending\
          \ order  \n**value**  \n**count**  \nThe format of the parameter is **sortBy=field:order**\
          \ Defaulting sorting order is descending. If field and order is not provided\
          \ then default sorting will be performed on **count:descending**\n"
        required: false
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: "The starting index of the first item in a page. The index is\
          \ 0-based. Default is 0 "
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        required: false
        description: "The maximum number of items to return in this page of results.\
          \ The actual number of returned items may be less if the collection has\
          \ been exhausted. The default is 100 "
        schema:
          type: integer
          default: 100
      - name: indexCaslib
        in: query
        required: false
        description: Name of cas library where given indexTableName is saved. If indexCaslib
          and indexTableName parameter is not provided ,then searching would be performed
          on default index used for VA.
        schema:
          type: string
      - name: indexTableName
        in: query
        required: false
        description: Name of CAS Index where search needs to be performed.If indexCaslib
          and indexTableName parameter is not provided ,then searching would be performed
          on default index used for VA.
        schema:
          type: string
      - name: facetsCount
        in: query
        required: false
        description: This parameter will limit the number of facet values received
          in response. Default is 100
        schema:
          type: integer
          default: 100
      - name: relaxed
        in: query
        required: false
        description: An indicator, if 'true', would add wild card '*' meaningfully
          to the words in the query. Defaulted to 'false'.
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/filter"
            examples:
              json:
                $ref: "#/components/examples/filter"
        description: "filter parameter contains query string and different search\
          \ protocol functions."
        required: true
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/facetsCollection"
              examples:
                json:
                  $ref: "#/components/examples/facetsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/facetsCollection"
              examples:
                json:
                  $ref: "#/components/examples/facetsCollection"
        "400":
          description: "The request was not valid. There are multiple error scenario\
            \ refer error code and message for more details."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/invalidQuery"
        "404":
          description: "Specified index do not exist."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /facets/@facetName#getFacetFieldResultsWithComplexQuery:
    post:
      tags:
      - SearchOnFacet
      operationId: getFacetFieldResultsWithComplexQuery
      summary: Type-Specific faceted search with complex query
      description: "Search Facets Service provides a particular facet available in\
        \ the index at a given point of time. It must be noted that the response contains\
        \ requested facet for eligible type that have been indexed.  \nThis API can\
        \ be used in case of 'Advanced Search' scenario. End user will use this API\
        \ when they want to see facet information for single field like sasAuthor\
        \ instead of getting facets for whole index.\n"
      parameters:
      - name: start
        in: query
        required: false
        description: "The starting index of the first item in a page. The index is\
          \ 0-based. Default is 0 "
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        required: false
        description: "The maximum number of items to return in this page of results.\
          \ The actual number of returned items may be less if the collection has\
          \ been exhausted. The default is 100 "
        schema:
          type: integer
          default: 100
      requestBody:
        $ref: "#/components/requestBodies/searchRequest"
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/facetsCollection"
              examples:
                json:
                  $ref: "#/components/examples/facetsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/facetsCollection"
              examples:
                json:
                  $ref: "#/components/examples/facetsCollection"
        "400":
          description: "The request was not valid. There are multiple error scenario\
            \ refer error code and message for more details."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/invalidQuery"
        "404":
          description: "Specified index do not exist."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /authorize/{correlationId}:
    post:
      tags:
      - AuthorizeSearch
      operationId: getAuthorizedSearchResults
      summary: Get a authorized list of objects
      description: "The Search Service is responsible for returning only those matching\
        \ SAS Objects for the query string for which the end user has at least READ\
        \ permission. The main purpose to introduce this endpoint in our service is\
        \ to use domain specific cache that we build. The cache for authorized records\
        \ are maintained per user with some context of query expression. The query\
        \ expression is used to determine if the request for authorization could be\
        \ processed from the cache or the request must be forwarded to the actual\
        \ authorization service.\nWe use our domain specific local cache to return\
        \ results for some scenario as it turns out to be over 10-50 times faster\
        \ than the authorization service call. If the data does not exist in cache,\
        \ the request is sent to Authorization Service to get the records authorized\
        \ for READ access. The response from the service is cached for next calls.\
        \ This cache is purged in a timely fashion to ensure that no stale content\
        \ is served.\nCAS-Search will send the search result in the POST body of this\
        \ API and authorization end point of search service will decide whether search\
        \ result need to go for authorization against Authorization service or to\
        \ return the search results from cache.\ncorrelationId is a random string\
        \ used as key to cache authorization context of the original logged in user\
        \ who initiated search request and query expression. If the authorization\
        \ is to be performed against the Authorization Service, then the original\
        \ user's **Authorization Context** that is cached is passed in the request.\
        \ It must be observed that this REST API was invoked by search client user\
        \ sas.search on behalf of the actual client, hence cannot be used. Hence need\
        \ of the cached authorization context in the flow.\nA brief description of\
        \ the search use case, and(matchAny(\"sample\"))\n1.The client issues HTTP\
        \ POST search request /search/content with payload\n2.Search service generates\
        \ random correlationId, stores Authorization Context of the logged-in user\
        \ and query string in the distributed Geode locator cache. We will use this\
        \ cached Authorization Context for actual authorization against Authorization\
        \ Service. Search Service passes this **correlationId** to CAS Search in request\
        \ so that CAS Search could use it in call back.\n3.It MUST be noted that search\
        \ service uses it's service client (sas.search) to invoke CAS API for search\
        \ as not all users might have access to CAS. Using service client ensures\
        \ that for each search request we can access CAS.\n4.CAS Search does its search,\
        \ finds multiple candidates for the query string, and issues HTTP POST /search/authorize/{correlationId}\
        \ (Search Service's REST API for Authorization of records) with payload having\
        \ a list of URI for matching records.\n5.Search service will pulls our user\
        \ & query string from the cache based on the **correlationId** and decide\
        \ whether search results need to go for authorization to Authorization service\
        \ or to return the search results from cache.\n6.Finally this API returns\
        \ only those records which have been authorized for the originally logged-in\
        \ user to CAS.\n7.CAS Search now calculates facets or the residual records\
        \ & returns the response to search service.\nNote--By the **callback** nature\
        \ of this endpoint, we do not expect any other client to call this method."
      parameters:
      - name: correlationId
        in: path
        required: true
        description: " It is the key of the cache and the corresponding value of the\
          \ correlationId is the Authorization context of the logged in user and query\
          \ string"
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.search.authorize+json:
            schema:
              $ref: "#/components/schemas/authorizationBody"
            examples:
              json:
                $ref: "#/components/examples/authorizationBody"
          application/json:
            schema:
              $ref: "#/components/schemas/authorizationBody"
            examples:
              json:
                $ref: "#/components/examples/authorizationBody"
        required: true
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.search.authorize+json:
              schema:
                $ref: "#/components/schemas/authorizationResponse"
              examples:
                json:
                  $ref: "#/components/examples/authorizationResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/authorizationResponse"
              examples:
                json:
                  $ref: "#/components/examples/authorizationResponse"
        "400":
          description: " Bad Request."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/invalidQuery"
servers:
- url: http://example.com/search
  description: This is an example server.
components:
  requestBodies:
    searchRequest:
      content:
        application/vnd.sas.search.request+json:
          schema:
            $ref: "#/components/schemas/searchRequest"
          examples:
            json:
              $ref: "#/components/examples/searchRequest"
      description: facet request object contains search query parameter and other
        supporting parameters
      required: true
  schemas:
    searchCollection:
      title: search result
      description: A collection of Search results
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/resultsRecords"
            description: search results fields.
          limited:
            type: boolean
            description: The flag indicating if the authorized obejcts for the query
              is larger than the pre-defined limit (defaulted to 20,000)
          facets:
            type: array
            description: list of facets available for the query
            items:
              $ref: "#/components/schemas/facetsRepresentation"
    resultsRecords:
      type: object
      description: Search result holding searched records
      properties:
        title:
          type: string
          description: title/name of the actual object
        description:
          type: string
          description: description of the object
        resourceUri:
          type: string
          description: unique object identifier for the object
        sasType:
          type: string
          description: Content type name of the object
        creationTimeStamp:
          type: string
          description: Creation date of the object in the yyyy-mm-ddThh:mm:ss.SSSZ
            format
        modifiedTimeStamp:
          type: string
          description: Last modified date of the object in the yyyy-mm-ddThh:mm:ss.SSSZ
            format
        createdBy:
          type: string
          description: User name of the user who created the object
        modifiedBy:
          type: string
          description: User name of the user who modified the object most recently
        createdByLabel:
          type: string
          description: Display name of the user who created the object
        modifiedByLabel:
          type: string
          description: Display name of the user who modified the object most recently
        keywords:
          type: string
          description: Keywords, if any associated with the object
        matchingText:
          type: string
          description: Snippet of the text that matched the string value string of
            the function matchAny(...) prefixed function in the query string. The
            matching text would be surrounded by  startTag &  endTag
        matchingFields:
          type: string
          description: It is 'semi-colon' delimited list of fields in which the matching
            text were found
        customFields:
          type: array
          description: key/value pair name-value
          items:
            $ref: "#/components/schemas/keyValuePair"
    keyValuePair:
      type: object
      description: Object holding name and it's value of searchable field apart from
        standard search record field.
      properties:
        name:
          type: string
          description: " name of custom field"
        value:
          type: string
          description: " value of custom field"
    facetsRepresentation:
      type: object
      description: Facet Representation Object.
      properties:
        version:
          type: integer
          description: version number
        name:
          type: string
          description: Name of the facet field
        totalAvailableCount:
          type: integer
          description: " This count is the sum of count of all facets values shown\
            \ under results."
        distinctValueCount:
          type: integer
          description: Distinct count of values from facetable field.
        missingValueCount:
          type: integer
          description: Number of missing values from facetable field.
        results:
          type: array
          description: array of results
          items:
            $ref: "#/components/schemas/facet"
        maximumValue:
          type: string
          description: Max field count of a given facet field.
        minimumValue:
          type: string
          description: Minimum field count of a given facet field.
    facet:
      type: object
      description: Object holding facet name and it's count.
      properties:
        value:
          type: string
          description: Value of facet field.
        count:
          type: integer
          description: Number of facet.
    query:
      type: string
      default: and(matchAny("sample"),in(sasType, "folder", "file"),in(sasAuthor,
        "sas.SASDataExplorer", "sas.studio"))
      description: This string defines content to be searched in combination with
        the filters and aggregations to be applied.
    filter:
      type: string
      default: and(matchAny("sample"),in(sasType, "folder", "file"),in(sasAuthor,
        "sas.SASDataExplorer", "sas.studio"))
      description: This string defines content to be searched in combination with
        the filters and aggregations to be applied.
    facetsCollection:
      title: facets
      description: A collection of facets
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/facetsRepresentation"
            description: facets results
    authorizationResponse:
      type: object
      description: Response Object holding object URI's that are authorizied.
      properties:
        version:
          type: integer
          description: version number
        links:
          type: array
          description: " a list of com.sas.commons.rest.Link objects as per Link representation. "
          items:
            $ref: "#/components/schemas/link"
        objectUriList:
          type: array
          description: list of object URI
          items: {}
    authorizationBody:
      type: object
      description: Request Object holding object URI's that needs to be send for authorization
      properties:
        version:
          type: integer
          description: version number
        objectUriList:
          type: array
          description: list of object URI
          items: {}
    searchRequest:
      description: A search request object.
      type: object
      properties:
        version:
          type: integer
          description: version number
        query:
          type: string
          description: Query string and different search protocol functions.
        fields:
          type: array
          description: Indicates that while searching, facet information is required
            in the response or not. The default value will be "true"
          items: {}
        facetFields:
          type: array
          description: If a client wants to receive facets on facetable fields other
            than default, they need to provide the field names explicitly separated
            by a comma.
          items: {}
        faceted:
          type: boolean
          description: Indicates that while searching, facet information is required
