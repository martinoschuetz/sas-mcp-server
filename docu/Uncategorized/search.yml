---
openapi: 3.0.3
info:
  version: "3"
  title: Search
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: "Search API works in conjunction with SearchIndex API. SearchIndex\
    \ API is responsible for indexing the SAS type objects while Search API will be\
    \ used to search these objects in CAS based deployment.   \nCAS based index server\
    \ is going to be primary search and indexing engine that Search API and SearchIndex\
    \ API is going to use.\n"
tags:
- name: Root
  description: The API root.
- name: Search
  description: The endpoints for searching SAS type objects.
- name: SearchOnFacets
  description: The endpoints managing faceted search.
- name: SearchOnFacet
  description: The endpoints managing the type specific faceted search.
- name: AuthorizeSearch
  description: The endpoint to display authorized list of objects.
paths:
  /:
    head:
      tags:
      - Root
      operationId: headersForRoot
      summary: Check if Search Service is available
      description: This endpoint can be used to check the availability of the Search-Service.
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: Service not available
          headers:
            Content-Type:
              schema:
                type: string
    get:
      tags:
      - Root
      operationId: root
      summary: Get a list of top level links
      description: Returns the top level URI of all the REST component for Search
        Service
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/searchroot"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/searchroot"
        "404":
          description: Service not available.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /content:
    get:
      tags:
      - Search
      operationId: getSearchResults
      summary: Get a SAS type Objects
      description: This search-service endpoint is used to search SAS type objects
        in CAS based indexing server and returns the authorized SAS type objects for
        current user.
      parameters:
      - name: query
        in: query
        required: true
        description: query parameter contains query string and different search protocol
          functions.
        schema:
          type: string
          default: matchAny("sample")
      - name: start
        in: query
        required: false
        description: " It is the index count indicating the location of the starting\
          \ element from where the result needs to be sent. If value is not provided\
          \ then default value will be '0'."
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        required: false
        description: " It is the count of the records which needs to be returned to\
          \ the client. If value is not provided then default value will be '10'"
        schema:
          type: integer
          default: 10
      - name: fields
        in: query
        required: false
        description: " Indicates the fields which need to be returned in the response,\
          \ if the client wants a fewer list of fields instead of default response.\
          \ Default response list is subset of indexed fields."
        schema:
          type: string
          default: title,description,resourceUri,sasType,creationTimeStamp,modifiedTimeStamp,createdBy,modifiedBy,createdByLabel,modifiedByLabel,keywords
      - name: faceted
        in: query
        required: false
        description: ' Indicates that while searching, facet information is required
          in the response or not. The default value will be "true".'
        schema:
          type: boolean
          default: true
      - name: facetFields
        in: query
        required: false
        description: " If a client wants to receive facets on facetable fields other\
          \ than default, they need to provide the field names explicitly separated\
          \ by a comma. Default facetable fields are sasType, sasAuthor, sasAuthorLabel "
        schema:
          type: string
          default: sasType,sasAuthor,sasAuthorLabel,modifiedTimeStamp
      - name: sortBy
        in: query
        required: false
        description: " This parameter will be used for sorting specified field in\
          \ ascending or descending order .Ex sortBy=title: ascending. If only field\
          \ is mentioned then default sorting order will be descending. Default behavior\
          \ will be sort by relevance if sortBy parameter does not mention anything "
        schema:
          type: string
      - name: indexCaslib
        in: query
        required: false
        description: Name of cas library where given indexTableName is saved. If indexCaslib
          and indexTableName parameter is not provided ,then searching would be performed
          on default index used for VA.
        schema:
          type: string
      - name: indexTableName
        in: query
        required: false
        description: Name of CAS Index where search needs to be performed.If indexCaslib
          and indexTableName parameter is not provided ,then searching would be performed
          on default index used for VA.
        schema:
          type: string
      - name: facetsCount
        in: query
        required: false
        description: This parameter will limit the number of facet values received
          in response and will be applicable to all facetable fields in response.
          Default is 100
        schema:
          type: integer
          default: 100
      - name: maxMinFields
        in: query
        required: false
        description: Name of the comma separated numeric or date fields on which the
          aggregation Max and Min are required.
        schema:
          type: string
      - name: relaxed
        in: query
        required: false
        description: An indicator, if 'true', would add wild card '*' meaningfully
          to the words in the query. Defaulted to 'false'.
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.search.response+json:
              schema:
                $ref: "#/components/schemas/searchCollection"
              examples:
                json:
                  $ref: "#/components/examples/getContent"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/searchCollection"
              examples:
                json:
                  $ref: "#/components/examples/getContent"
            application/json:
              schema:
                $ref: "#/components/schemas/searchCollection"
              examples:
                json:
                  $ref: "#/components/examples/getContent"
        "400":
          description: "The request was not valid. There are multiple error scenario\
            \ refer error code and message for more detail."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/invalidQuery"
        "404":
          description: "Specified index do not exist."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
