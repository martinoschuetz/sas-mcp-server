    head:
      tags:
      - DataSelectionLaunch
      summary: Retrieve all data selection launch for a given data selection
      description: Retrieve all data selection launch based on data selection id.
      operationId: headersForDataSelectionLaunches
      parameters:
      - name: dataSelectionId
        in: path
        description: The data selection id
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: Filter criteria for retrieved data selection Attribute.
        required: false
        schema:
          type: string
        allowEmptyValue: false
      - name: limit
        in: query
        description: Maximum number of data selection Attribute to retrieve. Defaults
          to 10
        required: false
        schema:
          type: integer
          default: 10
          format: int32
        allowEmptyValue: false
      - name: sortBy
        in: query
        description: Sort criteria for retrieved data selection Attribute.
        required: false
        schema:
          type: string
        allowEmptyValue: false
      - name: start
        in: query
        description: Offset of data selection Attribute to retrieve (0-based). Defaults
          to 0
        required: false
        schema:
          type: integer
          default: 0
          format: int32
        allowEmptyValue: false
      responses:
        "200":
          description: List of data selection launches was found.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Last-Modified:
              description: Indicates the date and time at which the original resource
                was last modified.
              schema:
                type: string
                format: dateTime
        "404":
          description: Data selection launches was not found.
    post:
      tags:
      - DataSelectionLaunch
      summary: Create a new data selection launch
      description: Create a new data selection launch.
      operationId: createLaunch
      parameters:
      - name: dataSelectionId
        in: path
        description: The data selection id
        required: true
        schema:
          type: string
      - name: keepDataSelectionLaunchId
        in: query
        description: The user can provide a user-defined ID but the keepDataSelectionLaunchId
          field must be set to true.
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        description: Data selection launch data
        required: false
        content:
