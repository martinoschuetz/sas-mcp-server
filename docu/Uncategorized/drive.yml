              examples:
                queries:
                  $ref: "#/components/examples/queries"
  /queries/foldersHaveContent:
    get:
      summary: Check if folders have content
      description: |
        Given a list of folder URIs, determine whether any of the provided folders
        contain items, which may include other folders.
        If a filter is provided, only children that match the filter will be considered.
      operationId: getFoldersHaveContentQuery
      tags:
      - Queries
      parameters:
      - name: folderUris
        in: query
        required: true
        description: Comma-separated list of folder URIs to check.
        schema:
          type: string
      - name: filter
        in: query
        description: Filter to apply when checking for content items within each folder.
        schema:
          type: string
      - name: recursive
        in: query
        description: Whether to check provided folders recursively.
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: A map of folder URIs to boolean values indicating whether each
            folder has content.
          headers: {}
          content:
            application/vnd.sas.drive.query.foldersHaveContent+json:
              schema:
                $ref: "#/components/schemas/foldersHaveContent"
              examples:
                foldersHaveContentTrue:
                  $ref: "#/components/examples/foldersHaveContentTrue"
                foldersHaveContentFalse:
                  $ref: "#/components/examples/foldersHaveContentFalse"
            application/json:
              schema:
                $ref: "#/components/schemas/foldersHaveContent"
              examples:
