---
openapi: 3.0.3
info:
  version: "1"
  title: Drive
  description: |
    Provides a consistent API to Viya for SAS Drive web applications and Nova Commons Content Components.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/drive
  description: This is an example base URL.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Items
  description: 'Operations for retrieving [items](docs/overview#items "Terminology:
    Items").'
- name: Ancestries
  description: 'Operations for retrieving [ancestries](docs/overview#ancestries "Terminology:
    Ancestries").'
- name: Queries
  description: Operations for executing queries.
- name: Sort Criteria
  description: Operations for retrieving sort criteria.
- name: Validations
  description: Operations for validating values.
- name: Thumbnails
  description: Operations for thumbnails.
- name: Actions
  description: 'Operations for retrieving [actions](docs/overview#actions "Terminology:
    Actions").'
paths:
  /:
    get:
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/root"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/root"
              examples:
                root:
                  $ref: "#/components/examples/root"
  /items:
    get:
      summary: Get items matching a query
      description: |
        Acquire items that contain resources which represent various Viya objects.  This endpoint is the primary purpose of the Drive API, as it enables a consumer to query for all known persistent resources in the Viya environment.
      operationId: getItems
      tags:
      - Items
      parameters:
      - name: Accept-Item
        in: header
        description: Select the desired collection item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.drive.item+json
      - name: queryMode
        in: query
        required: true
        description: |
          Determines the method for acquiring items:
          * `drives` &mdash; Returns immutable persistent drives and consumer-defined transient drives.  Uses `persistentDriveIds` and `transientDriveConfigs` query parameters.
          * `folder` &mdash; Returns items that reside within the folder that has the provided folder URI. Requires `parentFolderUri` query parameter.
          * `search` &mdash; Executes a search on the Catalog Search API with the given filter and returns the resulting items. Requires `queryModeFilter` query parameter.
          * `sharing` &mdash; Returns shared items that match the provided sharing mode. Requires `sharingType` query parameter.
          * `items` &mdash; Returns items that match the given filter.  Requires `itemIds` query parameter.
          * `recommendations` &mdash; Returns all recommended items.
          * `quarantined` &mdash; Returns all quarantined items.
        schema:
          type: string
          enum:
          - drives
          - folder
          - search
          - sharing
          - items
          - recommendations
          - quarantined
      - name: persistentDriveIds
        in: query
        description: |+
          Applicable when `queryMode` is `drives`.  Comma-separated list of drive ids to include.  Special values:
          * `none` &mdash; Returns no persistent drives.
          * `all` &mdash; Returns all known persistent drives.

          Examples:

          * All persistent drives: `persistentDriveIds=all`
          * One specific persistent drive: `persistentDriveIds=drive-myFolder`
          * Several specific persistent drives: `persistentDriveIds=drive-myFolder,drive-favorites,drive-trash`

        schema:
          type: array
          items:
            type: string
            anyOf:
            - enum:
              - none
              - all
            - {}
          default:
          - none
        style: form
        explode: false
      - name: transientDriveConfigs
        in: query
        description: |
          Applicable when `queryMode` is `drives`. Array of transient drive
          configurations converted to JSON. Make sure to escape any URI-reserved characters..

          Example:
          * Return a single transient folder drive: `transientDriveConfigs=[{"transientType":"folder","idQualifier":"reports01","folderUri":"/folders/folders/2F0e0de9e1-b4c8-4d55-b86d-516b1568fcf7","name":"2019a Reports"}]`
          * Return a single transient search drive: `transientDriveConfigs=[{"transientType":"search","idQualifier":"reports02","filter":"and(eq(type,'report'),eq(createdBy,'user01'))","name":"2019b Reports"}]`
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/transientDriveConfig"
      - name: parentFolderUri
        in: query
        description: |
          Required when `queryMode` is `folder`. Items residing within the folder with the given folder URI will be returned.
        schema:
          type: string
      - name: queryModeFilter
        in: query
        description: |
          Filter forwarded to underlying API requests.
          Each underlying API has unique filter requirements that don't necessarily
          correlate with Drive API item objects. This is useful for specifying search queries,
          or for a Quick Drive instance that only shows reports.

          Supporting `queryMode` values:
          * `folders` &mdash; `queryModeFilter` is optional and is passed to the Folders API as the `filter` query parameter (a SAS REST filter).
          * `search` &mdash; `queryModeFilter` is required and is passed to the Catalog Search API as the `q` query parameter (a custom query syntax).
          * `sharing` &mdash; `queryModeFilter` is optional and is passed to the Authorization API as the `filter` query parameter (a SAS REST filter).
          Other `queryMode` values do not support `queryModeFilter`.

          Example:
          * `in(type,'report','file')`
        schema:
          type: string
      - name: filter
        in: query
        description: |
          \u1F6A7 Reserved for future use: This parameter has special API First rules and is reserved for future use. The hope is that `filter` will someday replace `queryModeFilter` while providing a consistent filter interface regardless of underlying API calls.
        schema:
          type: string
      - name: q
        in: query
        description: |
          \u1F6A7 Reserved for future use: Applicable when `queryMode` is `search`. In the future, this may be used to handle user queries. Example: "type:report title:(Graphs or Cars)".
        schema:
          type: string
      - name: sharingType
        in: query
        description: |
          Required when `queryMode` is `sharing`.  Values:
          * `sharedByMe` &mdash; Return all items the user has shared with others.
          * `sharedWithMe` &mdash; Return all items other users have shared with the current user.
        schema:
          type: string
          enum:
          - sharedByMe
          - sharedWithMe
      - name: itemIds
        in: query
        description: |
          Required when `queryMode` is `items`.  Comma-separated list of item ids of items to return. This is treated like a collection filter, so invalid or missing item ids will not be represented in the response, duplicate item ids will only return one item, and the response item order might not match the original order of the item ids.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: sortBy
        in: query
        description: |
          Optional SAS REST sort criteria.  The `sortBy` parameters follows the Sorting Collections API Standard. Sort directions (ascending, descending) are supported; sorting strengths (primary, secondary, tertiary, etc.) are not. Only a few sort keys are recognized, with more to come in future releases:
          * `name` &mdash; Sort by item name.
          * `creationTimeStamp` &mdash; Sort by `shortcutMetadata.creationTimeStamp` if present; otherwise `resource.creationTimeStamp`.
          * `modifiedTimeStamp` &mdash; Sort by `shortcutMetadata.modifiedTimeStamp` if present; otherwise `resource.modifiedTimeStamp`.
          * `isFolder` &mdash; Sort by `resource.type.isFolder`. If used, must be supplied as the first sort criteria. Note that an `ascending` sort (the default direction) will list non-folder items first, then folders. To list folders first, `descending` should be specified.

          Multiple sorting criteria may be supplied, with earlier criteria taking precedence over later ones.

          For details on which `queryMode` values support which `sortBy` keys, check out the [getSortCriteria](getSortCriteria "Operation: getSortCriteria") endpoint.

          Examples:
          * Sort by item name from A to Z: `name`
          * Sort by item name in descending order, from Z to A: `name:descending`
          * List folders, earliest creation first, then list non-folders, earliest creation first: `isFolder:descending,creationTimeStamp`
        schema:
          type: string
          default: isFolder:descending,name
      - name: start
        in: query
        description: |
          SAS REST `start` paging info to forward to underlying API requests.
          In the future, the API may return links with differing `start` values
          to support API-side paging.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: |
          Maximum number of items to return in each page, silently capped to 1000.
        schema:
          type: integer
          default: 20
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/itemCollection"
              examples:
                itemCollection:
                  $ref: "#/components/examples/itemCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/itemCollection"
              examples:
                itemCollection:
                  $ref: "#/components/examples/itemCollection"
        "400":
          description: The caller provided incorrect query parameters, such as not
            including `parentFolderUri` when `queryMode` was `folder`, or supplied
            an invalid value for a provided query parameter.
          headers: {}
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
    post:
      summary: Get items matching a query via POST
      description: |
        Uses "Get via POST" to prevent too-long URIs.
      operationId: getItemsViaPost
      tags:
      - Items
      parameters:
      - name: Accept-Item
        in: header
        description: Select the desired collection item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.drive.item+json
      requestBody:
        content:
          application/vnd.sas.drive.items.request+json:
            schema:
              $ref: "#/components/schemas/itemsRequest"
            examples:
              itemsRequest:
                $ref: "#/components/examples/itemsRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/itemsRequest"
            examples:
              itemsRequest:
                $ref: "#/components/examples/itemsRequest"
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/itemCollection"
              examples:
                itemCollection:
                  $ref: "#/components/examples/itemCollection-post"
            application/json:
              schema:
                $ref: "#/components/schemas/itemCollection"
              examples:
                itemCollection:
                  $ref: "#/components/examples/itemCollection-post"
        "400":
          description: The caller provided incorrect query parameters, such as not
            including `parentFolderUri` when `queryMode` was `folder`, or supplied
            an invalid value for a provided query parameter.
          headers: {}
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
  /items/{itemId}:
    head:
      summary: Get headers for a single item
      description: Acquire the headers for an item containing a resource which represents
        a Viya object.
      operationId: headersForItem
      tags:
      - Items
      parameters:
      - name: itemId
        in: path
        required: true
        description: Item id of the requested item.
        schema:
          type: string
      - name: folderUri
        in: query
        description: Supplied only for transient folder drives. Supplies the folder
          URI that backs the drive.
        schema:
          type: string
      - name: filter
        in: query
        description: Supplied only for transient search drives. Supplies the search
          query that backs the drive.
        schema:
          type: string
      - name: name
        in: query
        description: Supplied only for transient drives.  Supplies the user-facing
          name of the drive.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers: {}
        "400":
          description: The caller provided invalid path or query parameters.
          headers: {}
        "404":
          description: The requested resource could not be found.
          headers: {}
    get:
      summary: Get a single item
      description: Acquire an item containing a resource which represents a Viya object.
      operationId: getItem
      tags:
      - Items
      parameters:
      - name: itemId
        in: path
        required: true
        description: Item id of the requested item.
        schema:
          type: string
      - name: folderUri
        in: query
        description: Supplied only for transient folder drives. Supplies the folder
          URI that backs the drive.
        schema:
          type: string
      - name: filter
        in: query
        description: Supplied only for transient search drives. Supplies the search
          query that backs the drive.
        schema:
          type: string
      - name: name
        in: query
        description: Supplied only for transient drives.  Supplies the user-facing
          name of the drive.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.drive.item+json:
              schema:
                $ref: "#/components/schemas/item"
              examples:
                item-myFolder:
                  $ref: "#/components/examples/item-myFolder"
                item-report:
                  $ref: "#/components/examples/item-report"
                item-file:
                  $ref: "#/components/examples/item-file"
                item-shortcut:
                  $ref: "#/components/examples/item-shortcut"
            application/vnd.sas.drive.item.details+json:
              schema:
                $ref: "#/components/schemas/itemDetails"
              examples:
                itemDetails:
                  $ref: "#/components/examples/itemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/item"
              examples:
                item-myFolder:
                  $ref: "#/components/examples/item-myFolder"
                item-report:
                  $ref: "#/components/examples/item-report"
                item-file:
                  $ref: "#/components/examples/item-file"
                item-shortcut:
                  $ref: "#/components/examples/item-shortcut"
        "400":
          description: The caller provided invalid path or query parameters.
          headers: {}
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
        "404":
          description: The requested resource could not be found.
          headers: {}
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error404"
              examples:
                error404:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error404"
              examples:
                error404:
                  $ref: "#/components/examples/error404"
  /ancestries:
    get:
      summary: Get ancestries for a collection of items
      description: |
        Acquire ancestries for a collection of items.
      operationId: getAncestries
      tags:
      - Ancestries
      parameters:
      - name: Accept-Item
        in: header
        description: Select the desired collection item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.drive.ancestry+json
      - name: itemIds
        in: query
        required: true
        description: |
          Comma-separated list of item ids of items to query for ancestries. This is treated like a collection filter, so invalid or missing item ids will not be represented in the response, duplicate item ids will only return at most one ancestry, and the response ancestry order might not match the original order of the item ids.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: truncateDriveConfigs
        in: query
        description: |
          Array of truncate drive configurations converted to JSON.
          Ancestor lists will be truncated to the most-descendant matching truncate drive configuration.

          For example, if the supplied truncate drive configurations include "My Folders" and "Folder1",
          and an item's location is "SAS Content/Users/sas123/My Folders/Folder1/Folder2/Report1",
          then the returned ancestry of "Report1" will be the equivalent of "Folder1/Folder2".

          By default, ancestries are not truncated. Make sure to escape any URI-reserved characters.

          Example:
          * `truncateDriveConfigs=[{"folderUri":"/folders/folders/2F0e0de9e1-b4c8-4d55-b86d-516b1568fcf7","name":"2019a Reports"}]`
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/truncateDriveConfig"
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/ancestryCollection"
              examples:
                ancestryCollection:
                  $ref: "#/components/examples/ancestryCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/ancestryCollection"
              examples:
                ancestryCollection:
                  $ref: "#/components/examples/ancestryCollection"
        "400":
          description: The caller provided incorrect query parameters.
          headers: {}
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
    post:
      summary: Get ancestries for a collection of items via POST
      description: Uses "Get via POST" to prevent too-long URIs.
      operationId: getAncestriesViaPost
      tags:
      - Ancestries
      parameters:
      - name: Accept-Item
        in: header
        description: Select the desired collection item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.drive.ancestry+json
      requestBody:
        content:
          application/vnd.sas.drive.ancestries.request+json:
            schema:
              $ref: "#/components/schemas/ancestriesRequest"
            examples:
              ancestriesRequest:
                $ref: "#/components/examples/ancestriesRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/ancestriesRequest"
            examples:
              ancestriesRequest:
                $ref: "#/components/examples/ancestriesRequest"
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/ancestryCollection"
              examples:
                ancestryCollection:
                  $ref: "#/components/examples/ancestryCollection-post"
            application/json:
              schema:
                $ref: "#/components/schemas/ancestryCollection"
              examples:
                ancestryCollection:
                  $ref: "#/components/examples/ancestryCollection-post"
        "400":
          description: The caller provided incorrect query parameters.
          headers: {}
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
  /ancestries/{ancestryId}:
    head:
      summary: Get headers for a single ancestry
      description: Acquire the headers for the ancestry of an item.
      operationId: headersForAncestry
      tags:
      - Ancestries
      parameters:
