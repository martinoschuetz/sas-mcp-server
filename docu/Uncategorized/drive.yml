  /commons/validations/items/{itemId}/name:
    put:
      summary: Validate an item name
      description: |
        Validate that a potential item name:
        * Contains valid characters.
        * Is of a valid length.
        * Is appropriate for a given typeDefName.
        * Does not create a conflict within a parent folder.

        The name may be applied to:
        * Creating a new item.
        * Renaming an existing item within a folder.
        * Moving an existing item to another folder.
        * Deassociating an existing item from the Folders API.
      operationId: validateItemName
      tags:
      - Validations
      parameters:
      - name: itemId
        in: path
        required: true
        description: |
          Item id of the existing item whose new name will be validated, or `@new`, signifying an item to be created.
        schema:
          type: string
      - name: value
        in: query
        required: true
        description: New name to validate.
        schema:
          type: string
      - name: typeDefName
        in: query
        description: |
          Type definition name of the item.  Required if `itemId` is `@new`. If the item already exists, then `typeDefName` may be omitted, as the existing `typeDefName` will be used.
        schema:
          type: string
      - name: parentFolderUri
        in: query
        description: |
          URI of the intended parent folder for the item.  If the item already exists, then `parentFolderUri` may be omitted as the existing `parentFolderUri` will be used.  If `parentFolderUri` cannot be determined or is `none`, then the intended item is assumed to be orphaned.
        schema:
          type: string
      - name: renameOnConflict
        in: query
        description: Whether to recalculate a new name should a conflict occur.
        schema:
          type: boolean
          default: false
      - name: nameConflictPattern
        in: query
        description: Should a conflict occur, the pattern used to recalculate a new
          name.
        schema:
          type: string
      responses:
        "200":
          description: Validation proceeded, though the validation itself may have
            failed.
          headers: {}
          content:
            application/vnd.sas.validation+json:
              schema:
                $ref: "#/components/schemas/itemNameValidation"
              examples:
                itemNameValidationSuccess:
                  $ref: "#/components/examples/itemNameValidationSuccess"
                itemNameValidationError:
                  $ref: "#/components/examples/itemNameValidationError"
            application/json:
              schema:
                $ref: "#/components/schemas/itemNameValidation"
              examples:
                itemNameValidationSuccess:
                  $ref: "#/components/examples/itemNameValidationSuccess"
                itemNameValidationError:
                  $ref: "#/components/examples/itemNameValidationError"
        "400":
          description: The caller provided invalid path or query parameters, and a
            validation was not able to be performed.
          headers: {}
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
