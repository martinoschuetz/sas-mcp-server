    get:
      summary: Get links to supported sort criteria
      description: |
        Returns links to acquire supported sort criteria for various Drive API endpoints.

        Different Drive API endpoints use different underlying APIs, and each API supports different sort criteria. For example, the Folders API supports sorting by `creationTimeStamp`, whereas the Authorization API (for shared items) does not.  This endpoint allows a consumer to check which sort criteria are available for each endpoint, and the consumer may wish to dynamically update the UI to reflect these capabilities (for example, disabling sort for shared items). As sort support grows, this endpoint will reflect any sort criteria improvements.
      operationId: getSortCriteria
