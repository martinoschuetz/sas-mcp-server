          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    collection:
      description: Schema for application/vnd.sas.collection.
      type: object
      properties:
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    error400:
      description: Error 400.
      allOf:
      - $ref: "#/components/schemas/error2"
    error404:
      description: Error 404.
      allOf:
      - $ref: "#/components/schemas/error2"
    foldersHaveContent:
      description: Schema for application/vnd.sas.drive.query.foldersHaveContent.
      type: object
      required:
      - result
      properties:
        result:
          type: string
          enum:
          - "true"
          - "false"
          - timeout
          - tooManySubFolders
          - error
          description: |
            Result of the query.  Possible values:
            * "true": At least one of the provided folders contains content items.
            * "false": None of the provided folders contain content items.
            * "timeout": The query operation timed out before a result could be determined.
            * "tooManySubFolders": One or more of the provided folders contains too many sub-folders to complete the operation.
            * "error": An error occurred while processing the request.
            Results of "timeout", "tooManySubFolders", and "error" return an error object.
        error:
          type: object
          description: |
            If an error occurred while processing the request, this field contains a description of the error.
          allOf:
          - $ref: "#/components/schemas/error2"
    item:
      description: Schema for application/vnd.sas.drive.item.
      type: object
      properties:
        id:
          type: string
          description: 'Unique Drive API [item identifier](docs/overview#user-content-terminology-item-id
            "Terminology: item id").'
        name:
          type: string
          description: Item name, which might not match the resource name.
        viewType:
          type: string
          description: |
            Defines the [view](docs/overview#user-content-terminology-item "Terminology: item") of the underlying resource.  Valid values:
            * `common` &mdash; [Canonical view](docs/overview#user-content-terminology-common-view "Terminology: common view") of a resource.
            * `shortcut` &mdash; [Reference view](docs/overview#user-content-terminology-shortcut-view "Terminology: shortcut view") of a resource.
            * `commonReference` &mdash; [Reference view](docs/overview#user-content-terminology-common-reference-view "Terminology: common reference view") of a resource that should be treated as a `common` view.
            * `drive` &mdash; [Drive view](docs/overview#user-content-terminology-drive-view "Terminology: drive view") of a resource.
          enum:
          - common
          - shortcut
          - commonReference
          - drive
        driveMetadata:
          type: object
          description: Appears only if `viewType` is `drive`.  Contains drive-specific
            metadata.
          properties:
            driveType:
              type: string
              description: |
                Describes the drive type:
                * `persistent` &mdash; Item is a Drive API-derived [persistent drive](docs/overview#user-content-terminology-persistent-drive "Terminology: persistent drive").
                * `transient` &mdash; Item is a consumer-defined [transient drive](docs/overview#user-content-terminology-transient-drive "Terminology: transient drive").
              enum:
              - persistent
              - transient
            persistentType:
              type: string
              description: |
                Appears only if `driveType` is `persistent`.  Identifies the persistent drive:
                * `favorites` &mdash; Item represents the user's [Favorites drive](docs/overview#user-content-terminology-favorites-drive "Terminology: Favorites drive")
                * `myFolder` &mdash; Item represents the user's [My Folder drive](docs/overview#user-content-terminology-my-folder-drive "Terminology: My Folder drive")
                * `root` &mdash; Item represents the [Root drive](docs/overview#user-content-terminology-root-drive "Terminology: Root drive").
                * `history` &mdash; Item represents the user's [History drive / Recents drive](docs/overview#user-content-terminology-history-drive "Terminology: History drive / Recents drive")
                * `trash` &mdash; Item represents the user's [Trash drive / Recycle Bin drive](docs/overview#user-content-terminology-trash-drive "Terminology: Trash drive / Recycle Bin drive").
                * `sharedByMe` &mdash; Item represents the user's [Shared By Me drive](docs/overview#user-content-terminology-shared-by-me-drive "Terminology: Shared By Me drive").
                * `sharedWithMe` &mdash; Item represents the user's [Shared With Me drive](docs/overview#user-content-terminology-shared-with-me-drive "Terminology: Shared With Me drive").
                * `recommendations` &mdash; Item represents the user's [Recommendations drive](docs/overview#user-content-terminology-recommendations-drive "Terminology: Recommendations drive").
                * `quarantined` &mdash; Item represents the user's [Quarantined drive](docs/overview#user-content-terminology-quarantined-drive "Terminology: Quarantined drive").
                * `application` &mdash; Item represents an [application drive](docs/overview#user-content-terminology-application-drive "Terminology: application drive").
              enum:
              - favorites
              - myFolder
              - root
              - history
              - trash
              - sharedByMe
              - sharedWithMe
              - recommendations
              - quarantined
              - application
            appId:
              type: string
              description: |
                Appears only if `persistentType` is `application`.  Application id associated with the application drive.
            transientType:
              type: string
              description: |
                Appears only if `driveType` is `transient`.  This will match the `transientType` in the transient drive config supplied by the consumer.  Possible values:
                * `folder` &mdash; Transient drive represents an existing folder.
                * `search` &mdash; Transient drive represents a search query.
              enum:
              - folder
              - search
            idQuantifier:
              type: string
              description: Appears only if `driveType` is `transient`.  This will
                match the `idQualifier` in the transient drive config supplied by
                the consumer.
            folderUri:
              type: string
              description: Appears only if `transientType` is `folder`.  This will
                match the `folderUri` in the transient drive config supplied by the
                consumer.
            filter:
              type: string
              description: Appears only if `transientType` is `search`.  This will
                match the `filter` in the transient drive config supplied by the consumer.
        shortcutMetadata:
          type: object
          description: |
            Appears only if `viewType` is `shortcut`.  Contains shortcut-specific metadata which may
            differ from the resource-specific information.
          properties:
            creationTimeStamp:
              type: string
              description: Time shortcut was created.
            modifiedTimeStamp:
              type: string
              description: Time shortcut was modified.
            createdBy:
              allOf:
              - description: Identity information of the user who created this shortcut.
              - $ref: "#/components/schemas/simpleUser"
            modifiedBy:
              allOf:
              - description: Identity information of the user who last modified this
                  shortcut.
              - $ref: "#/components/schemas/simpleUser"
            type:
              type: object
              description: Contains shortcut-specific type-related changes that differ
                from the resource.
              properties:
                label:
                  type: string
                  description: 'Human-readable localized name of the shortcut type.
                    Example: "Report (Shortcut)".'
                pluralLabel:
                  type: string
                  description: 'Human-readable localized plural name of the shortcut
                    type. Example: "Reports (Shortcuts)".'
        memberOrder:
          type: string
          description: |
            Order value of the item within a folder with no sort applied compared to its siblings.
            Order values might not be equally-spaced.  Items will lesser values appear before items
            with greater values.
        resource:
          $ref: "#/components/schemas/resource"
        links:
          description: |
            Links for the item.  Expected links include:
            * `rel=self` &mdash; Link to itself with standard fields.
            * `rel=details` &mdash; Link to itself with extra details.
            * `rel=ancestry` &mdash; Query the ancestry for the item.
            * `rel=actions` &mdash; Query the available actions for the item.
          type: array
          items:
            $ref: "#/components/schemas/link"
    itemCollection:
      description: Schema for a collection of items as `application/vnd.sas.drive.item`
        representations.
      allOf:
      - type: object
        properties:
          name:
            type: string
            description: "The name of the collection: `items`."
          accept:
            type: string
            description: |
              A space-delimited list of media types from which an `Accept` header may be constructed: `application/vnd.sas.drive.item`.
          items:
            type: array
            description: An array of items as `application/vnd.sas.drive.item` representations.
            items:
              $ref: "#/components/schemas/item"
          links:
            description: |
              Links for the collection.  Expected links include:
              * `rel=self` &mdash; Self-link for the collection.
              * `rel=collection` &mdash; General link for the base collection.
            type: array
            items:
              $ref: "#/components/schemas/link"
      - $ref: "#/components/schemas/collection"
    itemDetails:
      description: Schema for application/vnd.sas.drive.item.details.
      allOf:
      - $ref: "#/components/schemas/item"
      - type: object
        properties:
          details:
            type: object
            description: |
              Item-specific details that aren't usually required when consumers request items. These details are typically displayed in information panels where more info is desired.
            properties:
              ancestry:
                type: object
                allOf:
                - description: Current ancestry of the item.
                - $ref: "#/components/schemas/ancestry"
              previousAncestry:
                type: object
                allOf:
                - description: |
                    If this item is in a Recycle Bin, then its original ancestry prior to being recycled is provided. This is useful for manually restoring an item back to its original parent.
                - $ref: "#/components/schemas/ancestry"
              relatedItems:
                type: array
                description: Array of other items that share a relationship with the
                  current item per the Relationships API.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the related item.
                    iconKey:
                      type: string
                      description: Nova-defined icon key for the type associated with
                        the related item.
                    type:
                      type: object
                      description: Type information for the related item.
                      properties:
                        label:
                          type: string
                          description: |
                            Human-readable localized name of the related item's type. Example: "Report".
                    links:
                      description: |
                        Links for the related item.  Expected links include:
                        * `rel=resource` &mdash; Direct link to the related item resource object from its owning persistent API.
                        * `rel=item` &mdash; Provide the `common` item view type for the related item from the Drive API.
                      type: array
                      items:
                        $ref: "#/components/schemas/link"
    itemNameValidation:
      description: Schema for application/vnd.sas.validation.
      allOf:
      - $ref: "#/components/schemas/validation"
      - type: object
        properties:
          name:
            type: string
            description: |
              If the query parameter `renameOnConflict` was `true`, then the new calculated non-conflicting name,
              based on the pattern defined in `nameConflictPattern`.
    itemsRequest:
      description: Query request for taking advantage of "Get via POST".
      type: object
      required:
      - queryMode
      properties:
        queryMode:
          description: |
            Determines the method for acquiring items:
            * `drives` &mdash; Returns immutable persistent drives and consumer-defined transient drives.  Uses `persistentDriveIds` and `transientDriveConfigs` query parameters.
            * `folder` &mdash; Returns items that reside within the folder that has the provided folder URI. Requires `parentFolderUri` query parameter.
            * `search` &mdash; Executes a search on the Catalog Search API with the given filter and returns the resulting items. Requires `queryModeFilter` query parameter.
            * `sharing` &mdash; Returns shared items that match the provided sharing mode. Requires `sharingType` query parameter.
            * `items` &mdash; Returns items that match the given filter.  Requires `itemIds` query parameter.
            * `recommendations` &mdash; Returns all recommended items.
            * `quarantined` &mdash; Returns all quarantined items.
          type: string
          enum:
          - drives
          - folder
          - search
          - sharing
          - items
          - recommendations
          - quarantined
        persistentDriveIds:
          description: |+
            Applicable when `queryMode` is `drives`.  Array of drive ids to include.  Special values:
            * `none` &mdash; Returns no persistent drives.
            * `all` &mdash; Returns all known persistent drives.

            Examples:

            * All persistent drives: `["all"]`
            * One specific persistent drive: `["drive-myFolder"]`
            * Several specific persistent drives: `["drive-myFolder", "drive-favorites", "drive-trash"]`

          type: array
          items:
            type: string
            anyOf:
            - enum:
              - none
              - all
            - {}
          default:
          - none
        transientDriveConfigs:
          description: |+
            Applicable when `queryMode` is `drives`. Array of transient drive
            configurations.


          type: array
          items:
            $ref: "#/components/schemas/transientDriveConfig"
        parentFolderUri:
          description: |
            Required when `queryMode` is `folder`. Items residing within the folder with the given folder URI will be returned.
          type: string
        queryModeFilter:
          description: |
            Filter forwarded to underlying API requests.
            Each underlying API has unique filter requirements that don't necessarily
            correlate with Drive API item objects. This is useful for specifying search queries,
            or for a Quick Drive instance that only shows reports.

            Supporting `queryMode` values:
            * `folders` &mdash; `queryModeFilter` is optional and is passed to the Folders API as the `filter` query parameter (a SAS REST filter).
            * `search` &mdash; `queryModeFilter` is required and is passed to the Catalog Search API as the `q` query parameter (a custom query syntax).
            * `sharing` &mdash; `queryModeFilter` is optional and is passed to the Authorization API as the `filter` query parameter (a SAS REST filter).
            Other `queryMode` values do not support `queryModeFilter`.

            Example:
            * `in(type,'report','file')`
          type: string
        filter:
          description: |
            \u1F6A7 Reserved for future use: This parameter has special API First rules and is reserved for future use. The hope is that `filter` will someday replace `queryModeFilter` while providing a consistent filter interface regardless of underlying API calls.
          type: string
        q:
          description: |
            \u1F6A7 Reserved for future use: Applicable when `queryMode` is `search`. In the future, this may be used to handle user queries. Example: "type:report title:(Graphs or Cars)".
          type: string
        sharingType:
          description: |
            Required when `queryMode` is `sharing`.  Values:
            * `sharedByMe` &mdash; Return all items the user has shared with others.
            * `sharedWithMe` &mdash; Return all items other users have shared with the current user.
          type: string
          enum:
          - sharedByMe
          - sharedWithMe
        itemIds:
          description: |
            Required when `queryMode` is `items`.  Array of item ids of items to return. This is treated like a collection filter, so invalid or missing item ids will not be represented in the response, duplicate item ids will only return one item, and the response item order might not match the original order of the item ids.
          type: array
          items:
            type: string
        sortBy:
          description: |
            Optional SAS REST sort criteria.  The `sortBy` parameters follows the Sorting Collections API Standard. Sort directions (ascending, descending) are supported; sorting strengths (primary, secondary, tertiary, etc.) are not. Only a few sort keys are recognized, with more to come in future releases:
            * `name` &mdash; Sort by item name.
            * `creationTimeStamp` &mdash; Sort by `shortcutMetadata.creationTimeStamp` if present; otherwise `resource.creationTimeStamp`.
            * `modifiedTimeStamp` &mdash; Sort by `shortcutMetadata.modifiedTimeStamp` if present; otherwise `resource.modifiedTimeStamp`.
            * `isFolder` &mdash; Sort by `resource.type.isFolder`. If used, must be supplied as the first sort criteria. Note that an `ascending` sort (the default direction) will list non-folder items first, then folders. To list folders first, `descending` should be specified.

            Multiple sorting criteria may be supplied, with earlier criteria taking precedence over later ones.

            For details on which `queryMode` values support which `sortBy` keys, check out the [getSortCriteria](getSortCriteria "Operation: getSortCriteria") endpoint.

            Examples:
            * Sort by item name from A to Z: `name`
            * Sort by item name in descending order, from Z to A: `name:descending`
            * List folders, earliest creation first, then list non-folders, earliest creation first: `isFolder:descending,creationTimeStamp`
          type: string
          default: isFolder:descending,name
        start:
          description: |
            SAS REST `start` paging info to forward to underlying API requests.
            In the future, the API may return links with differing `start` values
            to support API-side paging.
          type: integer
          default: 0
        limit:
          description: |
            Maximum number of items to return in each page, silently capped to 1000.
          type: integer
          default: 20
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    pagingOptions:
      title: Paging Options
      description: >
        Paging details for page-oriented requests. Note when included in a request,
        must be null if "returnMultiple" is false, must not be null if "returnMultiple"
        is true.
      type: object
      required:
      - start
      - limit
      properties:
        start:
          type: integer
          description: Start index, 0-based, of the first thumbnail to return.
        limit:
          type: integer
          description: Number of thumbnails to return in a single "page".
    pagingState:
      title: Paging State
      description: Object returned if paging had been requested
      type: object
      required:
      - start
      - limit
      - count
      properties:
        start:
          type: integer
          description: start index (0-based) of the first thumbnai.
        limit:
          type: integer
          description: number of thumbnails returned in a single "page"
        count:
          type: integer
          description: number of available thumbnails.
    resource:
      description: Schema for application/vnd.sas.drive.resource.
      type: object
      properties:
        id:
          type: string
          description: Original resource URI referring to its owning API.
        name:
          type: string
          description: Name of the resource.
        description:
          type: string
          description: Description of the resource.
        creationTimeStamp:
          type: string
          description: Time resource was created.
        modifiedTimeStamp:
          type: string
          description: Time resource was last modified.
        createdBy:
          type: object
          allOf:
          - description: Identity information of the user who created this resource.
          - $ref: "#/components/schemas/simpleUser"
        modifiedBy:
          type: object
          allOf:
          - description: Identity information of the user who last modified this resource.
          - $ref: "#/components/schemas/simpleUser"
        type:
          type: object
          description: Type information for the resource.
          properties:
            sasType:
              type: string
              description: |
                SAS type (or "public type") of the resource.  Examples: "report", "file".
            typeDefName:
              type: string
              description: |
                Type definition name of the resource, which may include a secondary type.  Examples: "report", "file_jpeg", "file_link_drive".
            isFolder:
              type: boolean
              description: Whether this resource represents a container of other items.  If
                true, this doesn't necessarily mean that the resource is of the Folders
                API; rather this resource' URI can be queried for children via the
                Drive API.
              default: false
            label:
              type: string
              description: |
                Human-readable localized name of the type.  Example: "Report".
            pluralLabel:
              type: string
              description: |
                Human-readable localized plural name of the type.  Example: "Reports".
        imagery:
          type: object
          description: Describes relevant human-facing iconography and visual imagery,
            such as thumbnails.
          properties:
            iconKey:
              type: string
              description: |
                Nova-defined icon key for the type associated with this resource. See [icon](docs/overview#user-content-terminology-icon "Terminology: icon") for details. Example: "Folder".
            thumbnailKey:
              type: string
              description: |
                Nova-defined thumbnail key for the type associated with this resource. See [thumbnail](docs/overview#user-content-terminology-thumbnail "Terminology: thumbnail") for details. Example: "ThumbnailFolder16x9".
            links:
              type: array
              description: |
                Links for the imagery, when applicable.  Expected links include:
                * `rel=createThumbnailJob` &mdash; Resource-specific thumbnail job.
                * `rel=defaultThumbnailImage` &mdash; Type-specific thumbnail image.

                See [thumbnail](docs/overview#user-content-terminology-thumbnail "Terminology: thumbnail") for details and thumbnail priority.
              items:
                $ref: "#/components/schemas/link"
        flags:
          type: object
          description: Various boolean status flags associated with the resource.  Flags
            only appear if true, and if no flags are true, then the `flags` property
            will not be present.
          properties:
            isUsersMyFolder:
              type: boolean
              description: True if the resource is the current user's My Folder folder.
              default: false
            isUsersFavoritesFolder:
              type: boolean
              description: True if the resource is the current user's Favorites folder.
              default: false
            inUsersFavoritesTopLevel:
              type: boolean
              description: True if the resource is referenced within the top level
                of the current user's Favorites folder.
              default: false
            inUsersFavoritesRecursive:
              type: boolean
              description: True if the resource is referenced anywhere recursively
                within the current user's Favorites folder.
              default: false
            isUsersHistoryFolder:
              type: boolean
              description: True if the resource is the current user's History ("Recents")
                folder.
              default: false
            inUsersHistory:
              type: boolean
              description: True if the resource is referenced within the current user's
                History ("Recents") folder.
              default: false
            isAnyTrashFolder:
              type: boolean
              description: True if the resource is any user's trash ("Recycle Bin")
                folder.
              default: false
            inAnyTrashTopLevel:
              type: boolean
              description: True if the resource is inside the top level of any user's
                trash ("Recycle Bin") folder.
              default: false
            inAnyTrashRecursive:
              type: boolean
              description: True if the resource is anywhere recursively inside any
                user's trash ("Recycle Bin") folder.
              default: false
            isUsersTrashFolder:
              type: boolean
              description: True if the resource is the current user's trash ("Recycle
                Bin") folder.
              default: false
            inUsersTrashTopLevel:
              type: boolean
              description: True if the resource is inside the top level of the current
                user's trash ("Recycle Bin") folder.
              default: false
            inUsersTrashRecursive:
              type: boolean
              description: True if the resource is anywhere recursively inside the
                current user's trash ("Recycle Bin") folder.
              default: false
            isSharedByMeFolder:
              type: boolean
              description: True if the resource is the current user's Shared By Me
                folder.
              default: false
            inSharedByMeTopLevel:
              type: boolean
              description: True if the resource has been shared directly by the current
                user.
              default: false
            inSharedByMeRecursive:
              type: boolean
              description: |
                True if the resource is has been shared directly or indirectly by the current user. Example: Resources inside a folder that was shared by the current user.
              default: false
            isSharedWithMeFolder:
              type: boolean
              description: True if the resource is the current user's Shared With
                Me folder.
              default: false
            inSharedWithMeTopLevel:
              type: boolean
              description: True if the resource is has been shared directly with the
                current user.
              default: false
            inSharedWithMeRecursive:
              type: boolean
              description: |
                True if the resource is has been shared directly or indirectly with the current user. Example: Resources inside a folder that was shared with the current user.
              default: false
            inUsersRecommendations:
              type: boolean
              description: True if the resource is listed in the current user's Recommendations
                collection.
              default: false
            inQuarantine:
              type: boolean
              description: 'True if the resource has been [quarantined](docs/overview#user-content-terminology-quarantined-drive
                "Terminology: Quarantined drive") by its underlying persistent API.'
              default: false
        folderMetadata:
          type: object
          description: Information relevent to resources of type `folder`.
          properties:
            memberCount:
              type: integer
              description: Count of user-accessible items that exist in this folder.
            properties:
              type: object
              description: 'Map of folder-specific properties, if applicable.  Example:
                { "allowMove": "false" }.'
              additionalProperties:
                type: string
        fileMetadata:
          type: object
          description: Information relevant to resources of type `file`.
          properties:
            contentDisposition:
              type: string
              description: |
                Value of the Content-Disposition header in the response when downloading the file content directly from the Files API. Ex: "attachment;filename*=UTF-8''Sample File.txt"
            contentType:
              type: string
              description: 'The media type of the file content. Ex: "text/plain"'
            encoding:
              type: string
              description: 'The character encoding of the file content. Ex: "UTF-8"'
            size:
              type: integer
              description: The size of the file content in bytes.
        quarantineMetadata:
          type: object
          description: Information relevent to quarantined resources, if applicable.
          properties:
            urlDetected:
              type: boolean
              description: True if an absolute URL containing a non-approved domain
                was detected during a prior security scan.
            virusDetected:
              type: boolean
              description: True if a virus was detected during a prior security scan.
        recommendationMetadata:
          type: object
          description: Information relevant to recommendations, if applicable.
          properties:
            score:
              type: integer
              description: Relevancy score based on the current user.
            reasons:
              type: array
              description: List of reasons why a resource was recommended.
              items:
                type: string
        links:
          type: array
          description: |
            Links for the resource.  Expected links include:
            * `rel=resource` &mdash; Direct link to the resource object from its owning persistent API.
            * `rel=children` &mdash; Acquire child items for a folder.
            * `rel=commonView` &mdash; Provide the `common` item view type for the resource.
            * `rel=embed` &mdash; Embed resource inside a web page.
            * `rel=download` &mdash; Download resource to one's local computer.
          items:
            $ref: "#/components/schemas/link"
    root:
      description: Schema for /drive.
      allOf:
      - $ref: "#/components/schemas/api"
    simpleUser:
      description: Limited identity information of a user.
      type: object
      properties:
        id:
          description: User id.
          type: string
        name:
          description: Localizable user name.
          type: string
    sizingOptions:
      title: Sizing Options
      description: >
        Sizing options; providers should honor values suitable to the type of object
        for which they provide thumbnails, and clients should supply values suitable
        to their presentation needs.
      type: object
      properties:
        viewWidth:
          type: integer
          description: CSS Pixel image width.
        viewHeight:
          type: integer
          description: CSS Pixel image height.
        devicePixelRatio:
          type: number
          format: float
          default: 1.0
          description: device pixel ratio; some mobile devices support values greater
            than 1. (default is 1.0)
        maxTextCharacters:
          type: integer
          description: if plain text is returned, the maximum number of characters
            to return.
        maxTableColumns:
          type: integer
          description: if a table or other CSV presentation is returned, the maximum
            number of columns to return.
        maxTableRows:
          type: integer
          description: if a table or other CSV presentation is returned, the maximum
            number of rows to return.
    sortCriteria:
      description: Schema for application/vnd.sas.drive.sortCriteria.
      type: object
      properties:
        queryMode:
          description: For the `items` endpoint, the value of `queryMode` to which
            the following list of sortCriteria apply.
          type: string
        sortCriteria:
          description: List of supported sort criteria.
          type: array
          items:
            type: object
            properties:
              key:
                description: Sort key that can be used in a `sortBy` parameter for
                  the given endpoint.
                type: string
              directions:
                description: List of supported sort directions for the associated
                  `key` for the given endpoint.
                type: array
                items:
                  type: string
                  enum:
                  - ascending
                  - descending
    sortCriteriaCollection:
      description: Schema for a collection of sort criteria as `application/vnd.sas.drive.sortCriteria`
        representations.
      allOf:
      - type: object
        properties:
          name:
            type: string
            description: "The name of the collection: `sortCriteria`."
          accept:
            type: string
            description: |
              A space-delimited list of media types from which an `Accept` header may be constructed: `application/vnd.sas.drive.sortCriteria`.
          items:
            type: array
            description: An array of sort criteria as `application/vnd.sas.drive.sortCriteria`
              representations.
            items:
              $ref: "#/components/schemas/sortCriteria"
          links:
            description: |
              Links for the collection.  Expected links include:
              * `rel=self` &mdash; Self-link for the collection.
              * `rel=collection` &mdash; General link for the base collection.
            type: array
            items:
              $ref: "#/components/schemas/link"
      - $ref: "#/components/schemas/collection"
    sortCriteriaRoot:
      description: Schema for /drive/sortCriteria.
      allOf:
      - $ref: "#/components/schemas/api"
    staticThumbnailCollection:
      description: Schema for a collection of static thumbnails as `application/vnd.sas.link`
        representations.
      allOf:
      - type: object
        properties:
          name:
            type: string
            description: "The name of the collection: `staticThumbnails`."
          accept:
            type: string
            description: |
              A space-delimited list of media types from which an `Accept` header may be constructed: `application/vnd.sas.link`.
          items:
            type: array
            description: An array of static thumbnails as `application/vnd.sas.link`
              representations.
            items:
              $ref: "#/components/schemas/api"
          links:
            description: |
              Links for the collection.  Expected links include:
              * `rel=self` &mdash; Self-link for the collection.
              * `rel=collection` &mdash; General link for the base collection.
            type: array
            items:
              $ref: "#/components/schemas/link"
      - $ref: "#/components/schemas/collection"
    thumbnail:
      title: Thumbnail
      description: Information for retrieving a thumbnail.
      required:
      - state
      properties:
        state:
          type: string
          description: the state of this thumbnail
          enum:
          - pending
          - running
          - completed
          - failed
        error:
          $ref: "#/components/schemas/error2"
        modifiedTimeStamp:
          type: string
          description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format when
            the thumbnail was last modified.
          format: date-time
        links:
          type: array
          description: >
            Link relations for this thumbnail. Expect: 'thumbnail' (the thumbnail
            to pick up) and 'staleThumbnail' (an older thumbnail that can be picked
            up while a more current thumbnail is being prepared)
          items:
            $ref: "#/components/schemas/link"
    thumbnailJob:
      title: Thumbnail Job
      description: The representation of a thumbnail job.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.job
        version: 1
      required:
      - id
      - state
      - links
      - version
      properties:
        id:
          type: string
          description: The generated id for this job.
        state:
          type: string
          description: The state of this job.
          enum:
          - pending
          - running
          - completed
          - failed
        thumbnails:
          type: array
          description: Thumbnail objects, typically 1 unless paging had been requested.
          items:
            $ref: "#/components/schemas/thumbnail"
        error:
          $ref: "#/components/schemas/error2"
        duration:
          type: number
          format: float
          description: duration, in seconds, of the job.
        defaultThumbnailSasThemesIconKey:
          type: string
          description: >
            A number of fully themed "icons" are available within SAS Clients. If
            provided, this is that representation and should be used in preference
            to the the image specified by link relation "defaultThumbnailImage".
        pagingState:
          $ref: "#/components/schemas/pagingState"
        links:
          type: array
          description: Link relations for this job. Expect 'self' and 'defaultThumbnailImage'.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          format: int32
          description: The version number of the thumbnail job. This representation
            is version 1.
    thumbnailJobRequest:
      description: Schema for a thumbnail job request.
      allOf:
      - $ref: "#/components/schemas/thumbnailRequest"
    thumbnailRequest:
      title: Thumbnail Request
      description: A request to create a new job that creates or delivers a thumbnail.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.job.request
      required:
      - acceptItem
      - resourceUri
      properties:
        acceptItem:
          type: string
          description: >
            A media type string listing acceptable media types, possibly with quality
            values. Example: "image/*,text/plain;q=0.9,text/csv;q=0.8".
        resourceUri:
          type: string
          description: URI to the resource for which a thumbnail is needed.
        resourceType:
          type: string
          description: The SAS type of the resource for which a thumbnail is needed.
        detailLevel:
          type: string
          description: The expected level of detail. (default is "low")
          default: "low"
          enum:
          - low
          - high
        scope:
          type: string
          description: Whether a single element is to be represented, or the entire
            page. (default is "element")
          default: "element"
          enum:
          - element
          - page
        returnMultiple:
          type: boolean
          description: Whether a single thumbnail is to be returned (false) or multiple
            thumbnails (true). (default is false)
          default: false
        refresh:
          type: boolean
          description: Whether the freshest possible result is requested. (default
            is false)
          default: false
        sizingOptions:
          $ref: "#/components/schemas/sizingOptions"
        accessibilityOptions:
          $ref: "#/components/schemas/accessibilityOptions"
        themeId:
          type: string
          description: The client's current theme.
        pagingOptions:
          $ref: "#/components/schemas/pagingOptions"
        version:
          type: integer
          format: int32
          description: The version number of the thumbnail representation. This representation
            is version 1.
    thumbnailsRoot:
      description: Schema for /drive/thumbnails.
      allOf:
      - $ref: "#/components/schemas/api"
    transientDriveConfig:
      description: |
        Defines a transient drive that is parroted back to the consumer as a proper item object.  Transient drives are often represented as user-created application tabs, where a tab contains either the contents of an existing folder or the results of a search query.
      type: object
      properties:
        transientType:
          description: |
            The type of transient drive that is represented.  Values:
            * `folder` &mdash; Config represents an existing folder.
            * `search` &mdash; Config represents a search query.
          type: string
          enum:
          - folder
          - search
        idQualifier:
          description: |
            Used for differentiating multiple transient drives.  Each transient drive item will have an id in the form of "drive-{transientType}-{idQualifer}", or just "drive-{transientType}" if `idQualifier` is omitted.  Consumers wanting unique ids must specify unqiue `idQualifier` values.
          type: string
        folderUri:
          description: |
            Required if `transientType` is `folder`.  The URI of the folder object to be represented as a drive.
          type: string
        filter:
          description: |
            Required if `transientType` is `search`.  The search query to be represented as a drive.
          type: string
        name:
          description: |
            Name of transient drive.  If missing, then a name will be generated based on either the folder name or the search query.
          type: string
      required:
      - transientType
    truncateDriveConfig:
      description: |
        Defines a truncate drive configuration that allows ancestries to be truncated to special folder items.
      type: object
      properties:
        folderUri:
          description: The URI of the folder object to be represented as a truncate
            drive.
          type: string
        name:
          description: |
            Name override of a truncate drive.  If omitted, then a name will be generated based on the underlying folder name.
          type: string
      required:
      - folderUri
    validation:
      title: Validation Response
      description: The response from a pre-flight validation request. For APIs which
        support validation, the client can run operations (typically on resources
        in the `/commons/validation`) with `application/vnd.sas.validation+json` as
        the requested response type (via the `Accept:` request header). The service
        will validate the request but not execute the request, and return this response
        to indicate if the request was valid at the time it was made.
      x-sas-media-type:
        name: application/vnd.sas.validation
        version: 1
      required:
      - version
      - valid
      properties:
        version:
          description: This media type's schema version number. This representation
            is version 1.
          type: integer
        valid:
          description: "`true` if and only if the validation was successful."
          type: boolean
        error:
          $ref: "#/components/schemas/error2"
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
