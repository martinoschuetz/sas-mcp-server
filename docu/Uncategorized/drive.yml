  /thumbnails/jobs:
    post:
      summary: Get a synchronous thumbnail job
      description: |
        Return a synchronous thumbnail job based on the representation in the request body. The semantics here are
        "GET via POST". A persisted thumbnail job is not created, and the positive status is 200 (OK), not 201 (Created).

        Consumers use the Thumbnails API, which will access this Drive API endpoint when a resource of a
        Drive-supported type (that also provides dynamic thumbnails) is queried; this endpoint is not meant to be called
        directly by general consumers.

        An example of a qualifying resource would be a JPEG image:

        1. Consumer uses the Drive API for /drive/items and receives a JPEG resource.
        1. Consumer uses the Thumbnails API to request a dynamic thumbnail for the JPEG resource.
        1. Thumbnails API uses the Drive API to request a dynamic thumbnail for the JPEG resource.
        1. Drive API generates a thumbnail and sends it to the Thumbnails API as its response.
        1. Thumbnails API passes the thumbnail to the consumer as its response.
      operationId: getThumbnailJob
      tags:
      - Thumbnails
      parameters:
      - name: Accept-Locale
        in: header
        required: false
        description: SAS header for specifying a "format locale" distinct from the
          user's language (Accept-Language).  Usage and syntax is similar to https://tools.ietf.org/html/rfc7231#section-5.3.5
        schema:
          type: string
      - name: wait
        in: query
        required: false
        description: This service implements "long poll", how long to wait for an
          update before returning anyway, in floating point seconds. The maximum is
          30 seconds.
        schema:
          type: number
          format: float
          default: 0.5
      requestBody:
        content:
          application/vnd.sas.thumbnails.job.request+json:
            schema:
              $ref: "#/components/schemas/thumbnailJobRequest"
            examples:
              thumbnailJobRequest:
                $ref: "#/components/examples/thumbnailJobRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/thumbnailJobRequest"
            examples:
              thumbnailJobRequest:
                $ref: "#/components/examples/thumbnailJobRequest"
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                thumbnailJob:
                  $ref: "#/components/examples/thumbnailJob"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                thumbnailJob:
                  $ref: "#/components/examples/thumbnailJob"
        "400":
          description: The request was invalid.
          headers: {}
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
  /actions:
    get:
      summary: Get actions
      description: |
        Acquire actions that apply to a collection of items.
      operationId: getActions
      tags:
      - Actions
      parameters:
      - name: Accept-Item
        in: header
        description: Select the desired collection item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.drive.action+json
      - name: itemIds
        in: query
        description: |
          Comma-separated list of item ids of items to query for actions.

          If `itemIds` is omitted, then general actions that don't rely on specific items are returned.
          Examples of such actions may include upload (which uploads files to the user's My Folders folder)
          and createFolder (which creates a new folder in the user's My Folders folder).

          If `itemIds` contains zero ids, then zero actions are returned.

          If `itemIds` contains a single id, then all user-accessible actions that apply to the referenced item are returned
          (with supplied filters applied).

          If `itemIds` contains multiple ids, then all user-accessible actions that apply to every referenced item are returned.
          Any actions that apply to a subset of items but not every item are not returned.
          Any actions that apply to all items individually but can not be applied to all items at once are returned,
          but their `enabled` property is set to false. Typically a UI will display this action as grayed-out in a context menu.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: appId
        in: query
        description: |
          Application id referencing the current application.

          Specifying a current application may affect the returned action list order and default action,
          as they may differ across applications.
          For example, if AppA and AppB can both open items of type Report, the default action for a Report item in AppA will be AppA's open action,
          but the default action for the same item in AppB will be AppB's default action.
        schema:
          type: string
      - name: typeSet
        in: query
        description: |
          Action type filter, specified as the name of a single known type set.
          If supplied, only actions within the given type set are returned. The default type set is `none`.

          The `typeSet` parameter aligns with typical component regions, which allows consumers the ability to mimic similar areas.
          Individual action types may apply to one or more known type sets, and any given `typeSet` can be replaced with a specific `includedTypes` value,
          should a client prefer to mimic their own custom type set by way of filtering.
          The default `typeSet` is `none`, which provides an empty list of types.
          For an action type to be returned, it must be (in the `typeSet` list OR in `includedTypes`) AND not in `excludedTypes`.
        schema:
          type: string
          default: none
      - name: includedTypes
        in: query
        description: |
          Action type filter, provided as a comma-separated list of action types to include. If supplied, only actions with these types are returned. These action types are OR'd with the given `typeSet` list, if supplied.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: excludedTypes
        in: query
        description: |
          Action type filter, provided as a comma-separated list of action types to explicitly exclude. If supplied, actions with these types are excluded regardless of `typeSet` and `includedTypes` values.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: clipboardState
        in: query
        description: |
          State of the consumer-maintained clipboard.
        schema:
          type: string
          enum:
          - disabled
          - empty
          - copy
          - cut
          default: disabled
      - name: clipboardItemIds
        in: query
        description: |
          Comma-separated list of item ids for items in the consumer's clipboard. This parameter is only used if `clipboardState` is set to `copy` or `cut`.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: dropItemId
        in: query
        description: |
          Used for drag and drop operations when `typeSet` is `dragAndDrop`. This represents the target item that may receive the dragged items.
        schema:
          type: string
      - name: dropAtItemId
        in: query
        description: |
          Used for drag and drop operations when `typeSet` is `dragAndDrop`. This represents a parent item containing the target item that may receive the dragged items.
        schema:
          type: string
      - name: default
        in: query
        description: |
          When true, only the single default action with the highest priority is returned, should at least one action exist. This is typically used when querying the default action for an item, like when the user double-clicks an item.
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        description: |
          Maximum number of actions to return. If not specified, all applicable actions are returned.
        schema:
          type: integer
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/actionCollection"
              examples:
                actionCollection-file:
                  $ref: "#/components/examples/actionCollection-file"
                actionCollection-folder:
                  $ref: "#/components/examples/actionCollection-folder"
                actionCollection-multiple-items:
                  $ref: "#/components/examples/actionCollection-multiple-items"
                actionCollection-default-action:
                  $ref: "#/components/examples/actionCollection-default-action"
            application/json:
              schema:
                $ref: "#/components/schemas/actionCollection"
              examples:
                actionCollection-file:
                  $ref: "#/components/examples/actionCollection-file"
                actionCollection-folder:
                  $ref: "#/components/examples/actionCollection-folder"
                actionCollection-multiple-items:
                  $ref: "#/components/examples/actionCollection-multiple-items"
                actionCollection-default-action:
                  $ref: "#/components/examples/actionCollection-default-action"
        "400":
          description: The caller provided incorrect query parameters.
          headers: {}
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
    post:
      summary: Get actions via POST
      description: Uses "Get via POST" to prevent too-long URIs.
      operationId: getActionsViaPost
      tags:
      - Actions
      parameters:
      - name: Accept-Item
        in: header
        description: Select the desired collection item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.drive.action+json
      requestBody:
        content:
          application/vnd.sas.drive.actions.request+json:
            schema:
              $ref: "#/components/schemas/actionsRequest"
            examples:
              actionsRequest-single-item-with-clipboard:
                $ref: "#/components/examples/actionsRequest-single-item-with-clipboard"
              actionsRequest-multiple-items:
                $ref: "#/components/examples/actionsRequest-multiple-items"
