  schemas:
    accessibilityOptions:
      title: Accessibility Options
      description: This object describes accessibility requests; providers are not
        required to honor this
      type: object
      properties:
        highContrast:
          type: boolean
          default: false
          description: indicates whether "high contrast" visual adjustments are desired.
            (default is false)
    action:
      description: Schema for application/vnd.sas.drive.action.
      type: object
      properties:
        type:
          description: |
            Type of action.  Ex: "createFolder"

            Here's a table of [action types](docs/overview#action-types "Table: Action Types").
          type: string
        icon:
          description: |
            Nova icon key associated with the action.
          type: string
        label:
          description: |
            Label for the action.  Ex: "Create Folder"
          type: string
        enabled:
          description: |
            Indicates whether the action is enabled.  If true, the action can be executed
            on all the referenced items at once.  If false, the action can be executed
            on all the referenced items individually, but not all at once.

            This action is typically shown grayed-out in a menu.
          type: boolean
        default:
          description: |
            Whether this action could be a default action for the referenced items.  If
            multiple actions are marked as default, the consumer should choose the action
            with the lowest `orderValue` as the default action.

            This action is typically shown in bold in a menu.
          type: boolean
        typeSets:
          description: |
            Array of all type sets that contain this action.

            Here's a table of [type sets](docs/overview#action-type-sets "Table: Action Type Sets").
          type: array
          items:
            type: string
        section:
          description: |
            Section label for the action, used to group similar actions together in a menu.

            Sections are typically separated by dividers in a menu.

            Here's a table of [sections](docs/overview#action-sections "Table: Action Sections").
          type: string
        sectionValue:
          description: |
            Numerical value of the section.

            Sections with lower values are typically shown before sections with higher values.

            Here's a table of [sections](docs/overview#action-sections "Table: Action Sections").
          type: integer
        orderValue:
          description: |
            Numerical value for ordering actions within a menu and within their section.

            Actions with lower values are typically shown before actions with higher values.
          type: integer
        group:
          description: |
            Group information for the action, if applicable.

            Actions within a group are typically shown together in a sub-menu.  Groups with only
            one action are typically shown as normal actions without a sub-menu.
          type: object
          properties:
            id:
              description: |
                Group identifier.  Actions with the same group id belong to the same group.
              type: string
            label:
              description: |
                Group label.  Actions within the same group share this group label.
              type: string
        labelWithinGroup:
          description: |
            Action label when displayed within a group (sub-menu), which may differ from the default ungrouped `label`.
            For example, "Upload Folder" and "Upload File" could be grouped under "Upload >" with
            `labelWithinGroup` values of "Folder" and "File", respectively.
          type: string
        execution:
          description: |
            Responsibility for executing the action.  Some actions are executed primarily by the consumer (client),
            such as opening an item or copying an item to a clipboard. Other actions are executed primarily by the
            API (service) and require an additional request, such as deleting an item or creating a folder.

            Here's more info on [client execution](docs/overview#user-content-terminology-client-execution "Terminology: client execution") and [service execution](docs/overview#user-content-terminology-service-execution "Terminology: service execution").
          type: string
          enum:
          - client
          - service
        clientExecutionMetadata:
          description: |
            Information that may apply should the action be executed by the consumer (client).
            Each action may define its own metadata schema.
          type: object
          properties:
            links:
              description: |
                Links related to action execution by the consumer.
              type: array
              items:
                $ref: "#/components/schemas/link"
          additionalProperties: true
        serviceExecutionMetadata:
          description: |
            Information that may apply should the action be executed by the API (service).
            Each action may define its own metadata schema.
          type: object
          properties:
            links:
              description: |
                Links related to action execution by the API.
              type: array
              items:
                $ref: "#/components/schemas/link"
          additionalProperties: true
    actionCollection:
      description: Schema for a collection of actions as `application/vnd.sas.drive.action`
        representations.
      allOf:
      - type: object
        properties:
          name:
            type: string
            description: "The name of the collection: `actions`."
          accept:
            type: string
            description: |
              A space-delimited list of media types from which an `Accept` header may be constructed: `application/vnd.sas.drive.action`.
          items:
            type: array
            description: An array of actions as `application/vnd.sas.drive.action`
              representations.
            items:
              $ref: "#/components/schemas/action"
          links:
            description: |
              Links for the collection.  Expected links include:
              * `rel=self` &mdash; Self-link for the collection.
              * `rel=collection` &mdash; General link for the base collection.
            type: array
            items:
              $ref: "#/components/schemas/link"
      - $ref: "#/components/schemas/collection"
    actionsRequest:
      description: Query request for taking advantage of "Get via POST".
      type: object
      properties:
        itemIds:
          description: |
            Array of item ids of items to query for actions.

            If `itemIds` is omitted, then general actions that don't rely on specific items are returned.
            Examples of such actions may include upload (which uploads files to the user's My Folders folder)
            and createFolder (which creates a new folder in the user's My Folders folder).

            If `itemIds` contains zero ids, then zero actions are returned.

            If `itemIds` contains a single id, then all user-accessible actions that apply to the referenced item are returned
            (with supplied filters applied).

            If `itemIds` contains multiple ids, then all user-accessible actions that apply to every referenced item are returned.
            Any actions that apply to a subset of items but not every item are not returned.
            Any actions that apply to all items individually but can not be applied to all items at once are returned,
            but their `enabled` property is set to false. Typically a UI will display this action as grayed-out in a context menu.
          type: array
          items:
            type: string
        appId:
          description: |
            Application id referencing the current application.

            Specifying a current application may affect the returned action list order and default action,
            as they may differ across applications.
            For example, if AppA and AppB can both open items of type Report, the default action for a Report item in AppA will be AppA's open action,
            but the default action for the same item in AppB will be AppB's default action.
          type: string
        typeSet:
          description: |
            Action type filter, specified as the name of a single known type set.
            If supplied, only actions within the given type set are returned. The default type set is `none`.

            The `typeSet` parameter aligns with typical component regions, which allows consumers the ability to mimic similar areas.
            Individual action types may apply to one or more known type sets, and any given `typeSet` can be replaced with a specific `includedTypes` value,
            should a client prefer to mimic their own custom type set by way of filtering.
            The default `typeSet` is `none`, which provides an empty list of types.
            For an action type to be returned, it must be (in the `typeSet` list OR in `includedTypes`) AND not in `excludedTypes`.
          type: string
          default: none
        includedTypes:
          description: |
            Action type filter, provided as an array of action types to include. If supplied, only actions with these types are returned. These action types are OR'd with the given `typeSet` list, if supplied.
          type: array
          items:
            type: string
        excludedTypes:
          description: |
            Action type filter, provided as an array of action types to explicitly exclude. If supplied, actions with these types are excluded regardless of `typeSet` and `includedTypes` values.
          type: array
          items:
            type: string
        clipboardState:
          description: |
            State of the consumer-maintained clipboard.
          type: string
          enum:
          - disabled
          - empty
          - copy
          - cut
          default: disabled
        clipboardItemIds:
          description: |
            Array of item ids for items in the consumer's clipboard. This parameter is only used if `clipboardState` is set to `copy` or `cut`.
          type: array
          items:
            type: string
        dropItemId:
          description: |
            Used for drag and drop operations when `typeSet` is `dragAndDrop`. This represents the target item that may receive the dragged items.
          type: string
        dropAtItemId:
          description: |
            Used for drag and drop operations when `typeSet` is `dragAndDrop`. This represents a parent item containing the target item that may receive the dragged items.
          type: string
        default:
          description: |
            When true, only the single default action with the highest priority is returned, should at least one action exist. This is typically used when querying the default action for an item, like when the user double-clicks an item.
          type: boolean
          default: false
        limit:
          description: |
            Maximum number of actions to return. If not specified, all applicable actions are returned.
          type: integer
    ancestriesRequest:
      description: Query request for taking advantage of "Get via POST".
      type: object
      required:
      - itemIds
      properties:
        itemIds:
          description: |
            Array of item ids of items to query for ancestries. This is treated like a collection filter, so invalid or missing item ids will not be represented in the response, duplicate item ids will only return at most one ancestry, and the response ancestry order might not match the original order of the item ids.
          type: array
          items:
            type: string
        truncateDriveConfigs:
          description: |+
            Array of truncate drive configurations.
            Ancestor lists will be truncated to the most-descendant matching truncate drive configuration.

            For example, if the supplied truncate drive configurations include "My Folders" and "Folder1",
            and an item's location is "SAS Content/Users/sas123/My Folders/Folder1/Folder2/Report1",
            then the returned ancestry of "Report1" will be the equivalent of "Folder1/Folder2".

            By default, ancestries are not truncated. Make sure to escape any URI-reserved characters.


          type: array
          items:
            $ref: "#/components/schemas/truncateDriveConfig"
    ancestry:
      description: Schema for application/vnd.sas.drive.ancestry.
      type: object
      properties:
        id:
          description: Ancestry identifier.  This correlates with the original item
            id, which often represents a resource, shortcut or drive item.
          type: string
        incompleteDueToPermissions:
          description: |
            If true, then the user does not have authorization to view one or more of the ancesters in the ancestry tree for the provided item. Therefore only a partial ancestor list is returned.  If false or missing, then the user is authorized to view all ancestors.
          type: boolean
        ancestors:
          description: |
            Ordered list of all user-readable items that comprise the ancestry of the provided item, starting with the root drive item (or truncate drive item, if provided and applicable) and ending with the direct parent folder item of the provided item. If a user does not have read-access the direct parent folder item, or if the provided item has no ancestry, then this may be a zero-length array or may be entirely omitted.
          type: array
          items:
            description: Item ancestor of the provided item.
            type: object
            properties:
              id:
                description: Item id of the ancestor.
                type: string
              name:
                description: Name of the ancestor, which could be a drive item name
                  in the case of a root drive item or a truncate drive item.
                type: string
              links:
                description: |
                  Links for the ancestor.  Expected links include:
                  * `rel=ancestry` &mdash; Ancestry of the ancestor.
                  * `rel=item` &mdash; Item representation of the ancestor.
                type: array
                items:
                  $ref: "#/components/schemas/link"
        location:
          description: |
            User-friendly location path, created by joining the `name` fields of `ancestors` using `/` as a delimiter. If `ancestors` is empty or omitted, then `location` may be an empty string or omitted, too.
          type: string
        links:
          description: |
            Links for the ancestry.  Expected links include:
            * `rel=self` &mdash; Self-link for the ancestry.
            * `rel=item` &mdash; Item representation of the provided item.
          type: array
          items:
            $ref: "#/components/schemas/link"
    ancestryCollection:
      description: Schema for a collection of ancestries as `application/vnd.sas.drive.ancestry`
        representations.
      allOf:
      - type: object
        properties:
          name:
            type: string
            description: "The name of the collection: `ancestries`."
          accept:
            type: string
            description: |
              A space-delimited list of media types from which an `Accept` header may be constructed: `application/vnd.sas.drive.ancestry`.
          items:
            type: array
            description: An array of ancestries as `application/vnd.sas.drive.ancestry`
              representations.
            items:
              $ref: "#/components/schemas/ancestry"
          links:
            description: |
              Links for the collection.  Expected links include:
              * `rel=self` &mdash; Self-link for the collection.
              * `rel=collection` &mdash; General link for the base collection.
            type: array
            items:
              $ref: "#/components/schemas/link"
      - $ref: "#/components/schemas/collection"
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
