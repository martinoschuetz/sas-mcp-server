      - name: truncateDriveConfigs
        in: query
        description: |
          Defines an array of truncate drive configurations converted to JSON.
          Ancestor lists will be truncated to the most-descendant matching truncate drive configuration.

          For example, if the supplied truncate drive configurations include "My Folders" and "Folder1",
          and an item's location is "SAS Content/Users/sas123/My Folders/Folder1/Folder2/Report1",
          then the returned ancestry of "Report1" will be the equivalent of "Folder1/Folder2".

          By default, ancestries are not truncated. Make sure to escape any URI-reserved characters.

          Examples:
          * `truncateDriveConfigs=[{"folderUri":"/folders/folders/2F0e0de9e1-b4c8-4d55-b86d-516b1568fcf7","name":"2019a Reports"}]`
        schema:
          type: array
          items:
            $ref: "#/components/schemas/truncateDriveConfig"
      responses:
        "200":
          description: The request succeeded.
          headers: {}
        "400":
          description: The caller provided incorrect path or query parameters.
          headers: {}
        "404":
          description: The requested resource could not be found.
          headers: {}
    get:
      summary: Get a single ancestry
      description: Acquire the ancestry of an item.
      operationId: getAncestry
      tags:
      - Ancestries
      parameters:
      - name: ancestryId
        in: path
        required: true
        description: Ancestry id of the requested ancestry.
        schema:
          type: string
      - name: truncateDriveConfigs
        in: query
        description: |
          Defines an array of truncate drive configurations converted to JSON.
          Ancestor lists will be truncated to the most-descendant matching truncate drive configuration.

          For example, if the supplied truncate drive configurations include "My Folders" and "Folder1",
          and an item's location is "SAS Content/Users/sas123/My Folders/Folder1/Folder2/Report1",
          then the returned ancestry of "Report1" will be the equivalent of "Folder1/Folder2".

          By default, ancestries are not truncated. Make sure to escape any URI-reserved characters.

          Examples:
          * `truncateDriveConfigs=[{"folderUri":"/folders/folders/2F0e0de9e1-b4c8-4d55-b86d-516b1568fcf7","name":"2019a Reports"}]`
        schema:
          type: array
          items:
            $ref: "#/components/schemas/truncateDriveConfig"
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.drive.ancestry+json:
              schema:
                $ref: "#/components/schemas/ancestry"
              examples:
                ancestry:
                  $ref: "#/components/examples/ancestry"
            application/json:
              schema:
                $ref: "#/components/schemas/ancestry"
              examples:
                ancestry:
                  $ref: "#/components/examples/ancestry"
        "400":
          description: The caller provided incorrect path or query parameters.
          headers: {}
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error400"
              examples:
                error400:
                  $ref: "#/components/examples/error400"
        "404":
          description: The requested resource could not be found.
          headers: {}
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error404"
              examples:
                error404:
