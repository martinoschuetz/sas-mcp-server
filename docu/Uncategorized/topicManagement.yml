---
openapi: 3.0.3
info:
  title: Topic Management
  description: >
    This is a microservice for managing topics. <i>Topics</i> are essentially
    statistically generated categories. Topics are derived from natural
    groupings of important terms that occur in your documents. Topics are
    automatically generated and assigned to documents after running the topic
    node in the text analytics pipeline (the topics node must follow a text
    parsing node in the pipeline). A single document can contain more than one
    topic. The service can be used to display all the topics contained in the
    topics table generated by running the topic node. The default name of a
    topic is the top five terms that appear frequently in the topic. These terms
    are sorted in the topic name descending order based on their weight. <br />
    The Topic Management Service can be used for managing topics that were
    generated by the running the topic node in text analytics pipeline. The
    service can be used to retrieve all the topics in a topic table. A user can
    view all the documents matching a topic using the `documents service`. A
    user can also view the matching terms for a topic which are generated from
    the preceding `parse node` in text analytics pipeline. These terms can be
    retrieved from the `terms management service`. A user can create topics in
    the following way: <ul><li>using terms generated by running the preceding
    `parse` node in text analytics pipeline. </li> <li> merging two or more
    similar topics. </li></ul> Once the user has created the topics, he/she
    needs to re-run the topic node in text analytics pipeline. This will ensure
    the matching documents are retrieved for the newly created topic. A user can
    also promote a topic to create a category which creates the intermediate
    object (like a `promotion candidate`) to generate the category upon pipeline
    re-run. In order to view the category in the category taxonomy, one needs to
    run the the category node followed by the topic node in the text analytics
    pipeline. After this, the user can view the category generated from
    promoting a topic and its matching documents.

    <br> <br> Other services that interacts with this service: <ul><li>Terms Management
    REST API</li> <li>Documents REST API</li> </ul> <br><br>   Note that HEAD is supported
    for every GET request documented in the API. Simply change the HTTP verb from
    GET to HEAD, leaving other parameters the same.
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  version: "4"
  license:
    name: Copyright 2016 SAS Institute Inc.
tags:
- name: Root
  description: The operations for the root .
- name: Topics
  description: The operations for the topics resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      operationId: root
      description: |
        Returns the links to the top-level resources for the API.
      responses:
        "200":
          description: |
            The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "404":
          description: Service is not available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
    head:
      tags:
      - Root
      operationId: headersForRoot
      summary: Get the headers for the API
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      responses:
        "200":
          description: OK.
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "404":
          description: Service is not available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
  "/topicTables/{tableId}/promotion":
    post:
      tags:
      - Topics
      summary: Promote topics to categories
      operationId: multiPromoteTopics
      description: >
        Promotes topics to categories. This creates the intermediate object
        (like a "promotion candidate") to generate the category upon pipeline
        re-run. In order to view the category in the category taxonomy, one
        needs to run the the category node followed by the topic node in the
        text analytics pipeline. After this, the user can view the category
        generated from promoting a topic and its matching documents.
      parameters:
      - name: casServerId
        in: query
        required: true
        description: |
          The ID of the CAS server from which to fetch tables.
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: |
          The id of the CAS library from which to fetch tables
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        description: |
          The ID of the topic table
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.text.topic.promotion+json:
            schema:
              $ref: "#/components/schemas/promotion"
            examples:
              api:
                $ref: "#/components/examples/promoteTopicsRequestBody"
          application/json:
            schema:
              $ref: "#/components/schemas/promotion"
            examples:
              api:
                $ref: "#/components/examples/promoteTopicsRequestBody"
        description: >
          The requested body containing the topics which need to be promoted to
          categories.
        required: true
      responses:
        "204":
          description: |
            OK. The topics were promoted.
        "400":
          description: |
            One or more provided parameter values is invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/badRequestErrorResponse"
        "404":
          description: |
            A topic table with the given ID does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
        "409":
          description: >
            All the topics listed in the requested body have already been
            promoted.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/resourceExistsErrorResponse"
  "/topicTables/{tableId}/topics":
    get:
      tags:
      - Topics
      summary: Get a collection of topics
      operationId: getTopics
      description: >
        Returns a collection of topics based on the specified pagination option
        for the specified topic table. The items in the collection use the
        `application/vnd.sas.text.topic` media type.
      parameters:
      - name: casServerId
        in: query
        required: true
        description: |
          The ID of the CAS server from which to fetch tables.
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: |
          The id of the CAS library from which to fetch tables.
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        description: |
          The unique identifier of the topic table.
        schema:
          type: string
      - name: projectId
        in: query
        required: true
        description: >
          The project ID that the topics are associated with. If this value
          and 'componentId' are both included

          then each topic DTO that is returned will have a value set for 'promoted'
        schema:
          type: string
      - name: componentId
        in: query
        required: true
        description: >
          The compoenent ID that the topics are associated with. If this value
          and 'projectId' are both included

          then each topic DTO that is returned will have a value set for 'promoted'
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: |
          The index of the first topic to return. The default is 0.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        required: false
        description: >
          The maximum number of topics to return.

          The actual number of returned topics could be less if the collection has
          been

          exhausted. The default is 1000.
        schema:
          type: integer
          format: int32
          default: 1000
      - name: sortBy
        in: query
        description: "The sort criteria for the topic.  The sort criteria supports\
          \ the following fields in either ascending or descending order: id, termCutoff,\
          \ numberOfDocuments, numberOfTerms, documentCutoff, name. The table is sorted\
          \ by ascending id by default.  See [sorting collections](https://developer.sas.com/apis/rest/Topics/#sorting)."
        schema:
          type: string
          format: sort-criteria
      - $ref: "#/components/parameters/indexTableInfo"
      - $ref: "#/components/parameters/searchTerms"
      responses:
        "200":
          description: |
            OK. The topics were returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/topicCollection"
              examples:
                api:
                  $ref: "#/components/examples/getTopicsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/topicCollection"
              examples:
                api:
                  $ref: "#/components/examples/getTopicsResponse"
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "400":
          description: |
            The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTopics400ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTopics400ErrorResponse"
        "404":
          description: |
            A topic table with the given ID does not exist.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTopics404ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTopics404ErrorResponse"
    post:
      tags:
      - Topics
      summary: Creates a new topic from a list of terms
      operationId: createTopic
      description: >
        Creates a new topic in the specified topic table based on the provided
        list of terms.
      parameters:
      - name: casServerId
        in: query
        required: true
        description: |
          The ID of the CAS server from which to fetch tables.
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: |
          The id of the CAS library from which to fetch tables.
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        description: |
          The ID of the topic table.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.text.topic.new+json:
            schema:
              $ref: "#/components/schemas/newTopic"
            examples:
              api:
                $ref: "#/components/examples/createTopicsRequestBody"
          application/json:
            schema:
              $ref: "#/components/schemas/newTopic"
            examples:
              api:
                $ref: "#/components/examples/createTopicsRequestBody"
        description: >
          The list of terms which need to be merged to create a topic in the
          specified topic table.
        required: true
      responses:
        "201":
          description: |
            The topic was created successfully.
          headers:
            Location:
              description: The URL of the newly merged topic.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.text.topic+json:
              schema:
                $ref: "#/components/schemas/topic"
              examples:
                api:
                  $ref: "#/components/examples/getTopicResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/topic"
              examples:
                api:
                  $ref: "#/components/examples/getTopicResponse"
        "400":
          description: |
            The request was invalid.
          content:
            application/vnd.sas.text.topic+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/badRequestErrorResponse"
        "404":
          description: >
            The specified topic table is not found or the terms table for the
            specified topic does not exist or the term in the terms table for
            the specified topic does not exist.
          content:
            application/vnd.sas.text.topic+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
  "/topicTables/{tableId}/topics#mergeTopics":
    post:
      tags:
      - Topics
      summary: Merge two or more topics into one
      operationId: mergeTopics
      description: >
        Creates a new topic after merging two or more topics into a single topic
        based on the provided topic list in the requested body.
      parameters:
      - name: casServerId
        in: query
        required: true
        description: |
          The ID of the CAS server from which to fetch tables.
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: |
          The id of the CAS library from which to fetch tables.
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        description: |
          The unique identifier for the topic table.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.text.topic.list+json:
            schema:
              $ref: "#/components/schemas/topicIdList"
            examples:
              api:
                $ref: "#/components/examples/mergeTopicsRequestBody"
          application/json:
            schema:
              $ref: "#/components/schemas/topicIdList"
            examples:
              api:
                $ref: "#/components/examples/mergeTopicsRequestBody"
        description: |
          The list containing the unique identifiers for the topics to merge.
        required: true
      responses:
        "201":
          description: |
            The merged topic was created successfully.
          headers:
            Location:
              description: The URL of the newly created topic.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.text.topic+json:
              schema:
                $ref: "#/components/schemas/topic"
              examples:
                api:
                  $ref: "#/components/examples/mergeTopicsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/topic"
              examples:
                api:
                  $ref: "#/components/examples/mergeTopicsResponse"
        "400":
          description: |
            One or more provided parameter values is invalid.
          content:
            application/vnd.sas.text.topic+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/badRequestErrorResponse"
        "404":
          description: |
            A topic table with the given ID does not exist.
          content:
            application/vnd.sas.text.topic+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
  "/topicTables/{tableId}/topics/{topicId}":
    get:
      tags:
      - Topics
      summary: Get a specific topic
      operationId: getTopic
      description: >
        Retrieves the topic with the given ID from the topics table with the
        given table ID.
      parameters:
      - name: casServerId
        in: query
        required: true
        description: |
          The ID of the CAS server from which to fetch tables.
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: |
          The id of the CAS library from which to fetch tables
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        description: |
          The ID of the topic table
        schema:
          type: string
      - name: topicId
        in: path
        required: true
        description: |
          The ID of the topic
        schema:
          type: integer
      - name: projectId
        in: query
        required: true
        description: >
          The project ID that the topics are associated with. If this value
          and 'componentId' are both included

          then each topic DTO that is returned will have a value set for 'promoted'
        schema:
          type: string
      - name: componentId
        in: query
        required: true
        description: >
          The compoenent ID that the topics are associated with. If this value
          and 'projectId' are both included

          then each topic DTO that is returned will have a value set for 'promoted'
        schema:
          type: string
      - $ref: "#/components/parameters/indexTableInfo"
      - $ref: "#/components/parameters/searchTerms"
      responses:
        "200":
          description: |
            OK. The results were returned.
          content:
            application/vnd.sas.text.topic+json:
              schema:
                $ref: "#/components/schemas/topic"
              examples:
                api:
                  $ref: "#/components/examples/getTopicResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/topic"
              examples:
                api:
                  $ref: "#/components/examples/getTopicResponse"
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "400":
          description: |
            The request was invalid.
          content:
            application/vnd.sas.text.topic+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/badRequestErrorResponse"
        "404":
          description: >
            A topic table with the given ID does not exist, or a topic with the
            given ID does not exist in the specified topic table.
          content:
            application/vnd.sas.text.topic+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
  "/topicTables/{tableId}/topics#splitTopics":
    post:
      tags:
      - Topics
      summary: Split a topic
      operationId: splitTopics
      description: >
        Creates two new topics by splitting the topic whose ID is passed in as a
        query parameter
      parameters:
      - name: casServerId
        in: query
        required: true
        description: |
          The ID of the CAS server from which to fetch tables.
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: |
          The id of the CAS library from which to fetch tables.
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        description: |
          The unique identifier for the topic table.
        schema:
          type: string
      - name: topicId
        in: query
        required: true
        description: |
          The ID of the topic to split
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/topic"
            examples:
              api:
                $ref: "#/components/examples/splitTopicRequestBody"
        description: |
          Request payload should be null.
        required: true
      responses:
        "201":
          description: |
            The topic was successfully split.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/topicCollection"
              examples:
                api:
                  $ref: "#/components/examples/getTopicsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/topicCollection"
              examples:
                api:
                  $ref: "#/components/examples/getTopicsResponse"
        "400":
          description: |
            One or more provided parameter values is invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/badRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/badRequestErrorResponse"
        "404":
          description: |
            A topic table with the given ID does not exist.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
servers:
- url: "http://example.com/topicManagement"
  description: This is a sample base URL.
components:
  parameters:
    indexTableInfo:
      name: indexTableInfo
      in: query
      required: false
      description: >
        The information about the index table. The format is
        casLibName~fs~indexTableName

        where, the casLibName is the name of CAS library where the index table exists
        and

        indexTableName is the name of the index table. The index table is a CAS table
        used to support

        the search through topic documents. The 'search' query parameter can only
        be used when the value of this

        parameter is defined.
      schema:
        type: string
    searchTerms:
      name: search
      in: query
      required: false
      description: >
        Defines the keywords separated by space that will be used in searching
        the topic documents.

        Topic documents are matching documents to the specified topic.

        If there are any topic documents matching to the specified search criteria,
        then the topic information will

        be returned. Otherwise, a 404 http error will be returned to the user as there
        were no documents found that

        belong to the specified topic. The numberOfDocuments and numberOfTerms properties
        of the specified topic will

        be updated as well based on the search criteria.


        The following characters are reserved for special meaning (note, those characters
        are non-searchable):


        | Characters | Details about reserved characters |

        |---------------------------------------------------------------|--------------------------------------------------------------------------------|

        | + | Will not match any topic document that does not have this keyword. The
        '+' must follow the keyword. |

        | - | Matches any topic document that does not have this keyword. The '-'
        must follow the keyword. |

        | * | Wildcard character that matches any character within a word. |

        | " | Denotes a phrase that must be matched in exact sequence." |

        | +() | Used to group different keywords together. This notation will enforce
        to match topic documents containing at least one of those grouped keywords.
        |


        Some sample search parameters:


        | Sample Search Parameter   | Details about the search parameter |

        |---------------------------------------------------------------|--------------------------------------------------------------------------------|

        | wine                      | topic documents matching wine keyword |

        | +wine fruit               | topic documents containing 'wine' but can have
        'fruit' keyword as well </li> |

        | -wine fruit               | topic documents not containing 'wine' but should
        contain 'fruit'    |

        | wine \"smoked meat\"      | topic documents either containing 'wine' or
        'smoked meat' keywords  |

        | +(wine wines) fruit       | topic documents should contain at least 'wine'
        or 'wines' also they can have 'fruit' keyword |

        | +(wine wines) +fruit      | topic documents should contain at least 'wine'
        or 'wines' but also contain 'fruit' keyword |

        | +(wine wines) +fruit prime| topic documents should contain at least 'wine'
        or 'wines' but also contain 'fruit' keyword and can have 'prime' keyword|
      schema:
        type: string
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    topic:
      title: A topic
      description: A topic object.
      x-sas-media-type: application/vnd.sas.text.topic+json;version=1
      properties:
        id:
          type: string
          description: |
            The ID of the topic.
        name:
          type: string
          description: |
            The name of the topic.
        termCutoff:
          type: number
          description: >
            The topic term cutoff value indicating the threshold a term weight
            must meet

            to be included in the topic.
        numberOfDocuments:
          type: number
          description: |
            The number of documents that belong to the topic.
        numberOfTerms:
          type: number
          description: |
            The number of terms that belong to the topic.
        documentCutoff:
          type: number
          description: >
            The topic document cutoff value indicating the threshold a document
            weight must meet

            to be included in the topic.
        topicType:
          type: string
          description: Whether the topic was user generated or system generated
