        "result": "<p>This plot shows how the misclassification rate changes for subtrees,\
          \ which are created by pruning the full decision tree to various numbers\
          \ of leaves. The training error decreases as the number of leaves increases,\
          \ so the VALIDATE partition can be used to prune the tree to prevent overfitting.\
          \ For this decision tree model, the selected subtree based on the pruning\
          \ options has 29 leaves with a misclassification rate of 0.117 for the VALIDATE\
          \ partition.</p>", "inputData": {}, "templateId": "dm.tree_errorPlotMiscNLG",
