                \      during retraining.   */\n\n   logHeader(\"advisor_fetchOldmetaRoles\"\
                );\n\n   /* Fetch the previous target and its previous attributes\
                \ */\n   targetName    = '';\n   targetvartype = '';\n   targetfmt\
                \     = '';\n   varrow = resultDict[\"oldColumnMeta\"]['Fetch'].where(ROLE\
                \ = 'TARGET');\n   if varrow.nrows eq 0 then do;\n      print (warn)\
                \ 'Could not find the project target in the existing project metadata.';\n\
                \   end;\n   else do;\n      targetname    = varrow[1, \"Name\"];\n\
                \      targetvartype = varrow[1, \"VarType\"];\n      targetfmt  \
