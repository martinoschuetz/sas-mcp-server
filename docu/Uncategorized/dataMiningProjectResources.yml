                  );\nend advisor_setDictionaries;\n\nfunction advisor_makeTablemeta();\n\
                  \   /*\n      advisor_makeTablemeta make the table metadata.\n \
                  \  */\n\n   logHeader(\"advisor_makeTablemeta\");\n\n   table.tableDetails\
                  \ status=st_tableDetails result=r_tableDetails/ caslib=inputCaslib\
                  \ name=inputTable;\n   if st_tableDetails['severity'] = 2 then do;\n\
                  \      print (error) 'Table Details could not be retrieved.';\n\
                  \      return True;\n   end;\n\n   nobs     = r_tableDetails['TableDetails'][1,'Rows'];\n\
                  \   nbytes   = r_tableDetails['TableDetails'][1,'DataSize'];\n \
                  \  if debug then\n      print 'NOBS: ' nobs ' NBYTES: ' nbytes;\n\
                  \n   table.tableInfo status=st_tableInfo result=r_tableInfo/ caslib=inputCaslib\
                  \ name=inputTable;\n   if st_tableInfo['severity'] = 2 then do;\n\
                  \      print (error) 'Table Info could not be retrieved.';\n   \
                  \   return True;\n   end;\n\n   memname  = ktrim(r_tableInfo['TableInfo'][1,'Name']);\n\
                  \   if 'Label' in tabcolumns(r_tableInfo['TableInfo']) then do;\n\
                  \      memlabel = ktrim(r_tableInfo['TableInfo'][1,'Label']);\n\
                  \   end;\n   else do;\n      memlabel = '';\n   end;\n   ncols \
                  \   = r_tableInfo['TableInfo'][1,'Columns'];\n   crdate   = r_tableInfo['TableInfo'][1,'CreateTime'];\n\
