                \ exceed 32 bytes.\n   */\n\n   logHeader(\"advisor_validateVarAttrs\"\
                );\n\n   invalidNames = '';\n   varbinaryFlag = false;\n   r_columnInfo\
                \ = resultDict[\"basicColumnInfo\"];\n   do basicrow over r_columnInfo['ColumnInfo'];\n\
                \      varname = ktrim(basicrow['Column']);\n      if ktrim(basicrow[\"\
                Type\"]) = 'varbinary' then\n         varbinaryFlag = true;\n    \
                \  if length(varname) > 32 then\n         invalidNames = invalidNames\
                \ ||\" '\"|| varname||\"'\";\n   end;\n   if invalidNames ne ' ' then\
                \ do;\n      print (error) 'The following variable name(s) exceed\
                \ the 32-byte limit: ' invalidNames;\n   end;\n\n   if varbinaryFlag\
                \ then do;\n      print (error) ' The project metadata cannot be generated\
                \ because there exists at least one varbinary variable. Varbinary\
                \ variables are not supported.';\n   end;\n\n   if invalidNames ne\
                \ ' '  or varbinaryFlag then do;\n      return True;\n   end;\n\n\
                \   logFooter(\"advisor_validateVarAttrs\");\n\n   return False;\n\
                \nend advisor_validateVarAttrs;\n\nfunction advisor_getUserformats();\n\
                \   /*\n      advisor_getUserformats check if any variable name exceed\
                \ 32 bytes.\n   */\n\n   logHeader(\"advisor_getUserformats\");\n\n\
                \   advisor_initializeGlobal('userformatList', {});\n\n   /* Retrieve\
                \ the user formats available to the session */\n   sessionProp.listFmtLibs\
                \ status=rc_formatList result = r_formatList/ showMemNames=True;\n\
                \   if rc_formatList['severity'] = 2 then do;\n      print (error)\
                \ 'Could not retrieve the list of user defined formats.';\n      return\
                \ True;\n   end;\n\n   do fmtrow over r_formatList['listFmtLibs'];\n\
                \      userFormatList = userformatList + {upcase(fmtrow['Format'])};\n\
                \   end;\n   if debug then\n      print 'User defined formats: ' userformatList;\n\
                \n   logFooter(\"advisor_getUserformats\");\n\n   return False;\n\n\
                end advisor_getUserformats;\n\nfunction advisor_getBasicAttributes();\n\
                \   /*\n      advisor_getBasicAttributes retrieves the basic column\
                \ attributes.\n   */\n\n   logHeader(\"advisor_getBasicAttributes\"\
                );\n\n   table.columninfo status=rc_colinfo result=r_columnInfo/\n\
                \       table={name=inputTable, caslib=inputCaslib};\n   if rc_colinfo['severity']\
                \ = 2 then do;\n      print (error) 'Could not retrieve the column\
                \ attributes.';\n      return True;\n   end;\n\n   resultDict[\"basicColumnInfo\"\
                ] = r_columninfo;\n\n   /* Are there any column names exceeding 32\
                \ bytes?  Not yet supported\n      in SAS Viya */\n   if advisor_validateVarAttrs()\
                \ then return True;\n\n   logFooter(\"advisor_getBasicAttributes\"\
                );\n\n   return False;\n\nend advisor_getBasicAttributes;\n\nfunction\
                \ advisor_readGlobalMeta();\n   /*\n      advisor_readGlobalMeta read\
                \ the global metadata table.\n   */\n\n   logHeader(\"advisor_readGlobalMeta\"\
                );\n\n   /* Check if the global metadata  table exists */\n   table.tableExists\
                \ result=r_gmeta status=st_gmeta /  caslib=projectCaslib name=globalmeta;\n\
                \   if st_gmeta['severity'] = 2 then do;\n      print (error) 'Could\
                \ not verify if the global metadata table exists';\n      return True;\n\
                \   end;\n   if r_gmeta.exists = 0 then do;\n      print (error) 'Could\
                \ not verify if the global metadata table exists';\n      return True;\n\
                \   end;\n\n   if debug then do;\n      print 'globalmeta: ' globalmeta;\n\
                \      describe r_gmeta;\n   end;\n\n   /* Read in the current global\
                \ metadata table */\n   table.fetch result=r_gmeta status=st_gmeta\
                \ /\n         maxrows = 100000\n         to = 100000\n         table={\n\
                \            caslib=projectCaslib,\n            name=globalmeta,\n\
                \            vars={'name', 'format', 'type', 'role', 'level', 'order',\
                \ 'transform', 'impute', 'lowerlimit', 'upperlimit',\n           \
                \       'impconstchar', 'impconstnumb', 'assess_bias_flg'}\n     \
                \    };\n         if st_gmeta['severity'] = 2 then do;\n         \
                \   print (error) 'Could not read the global metadata table.';\n \
                \           return True;\n         end;\n\n   resultDict[\"globalMeta\"\
                ] = r_gmeta;\n\n   logFooter(\"advisor_readGlobalMeta\");\n\n   return\
                \ False;\n\nend advisor_readGlobalMeta;\n\nfunction advisor_makeStatmeta();\n\
                \   /*\n      advisor_makeStatmeta use CARDINALITY action to compute\
                \ summary statistics.\n   */\n\n   logHeader(\"advisor_makeStatmeta\"\
                );\n\n   /* Drop the outcard table if it exists */\n   table.dropTable\
                \ /  caslib=projectCaslib name=\"outcard\" quiet=True;\n   table.dropTable\
                \ /  caslib=projectCaslib name=\"outcard\" quiet=True;\n\n   cardinality.summarize\
                \ status=st_cardmeta /\n      table={name=inputTable, caslib=inputCaslib}\n\
                \      cardinality={caslib=projectCaslib, name=\"outcard\"}\n    \
                \  options={nLevels=maxCardLevel};\n\n   if st_cardmeta['severity']\
                \ = 2 then do;\n      print (error) 'Could not calculate summary statistics.';\n\
                \      return True;\n   end;\n\n   /* Read in the current statistics\
                \ table */\n   table.fetch result=r_cardmeta status=st_cardmeta /\n\
                \         maxrows = 100000\n         to =  100000\n         table={\n\
                \            caslib=projectCaslib,\n            name=\"outcard\",\n\
                \            vars={'_varname_', '_more_', '_cardinality_', '_rlevel_',\
                \ '_nmiss_', '_nobs_', '_sumfreqs_', '_min_', '_max_', '_stddev_',\
                \ '_mean_', '_skewness_', '_kurtosis_'}\n         };\n         if\
                \ st_cardmeta['severity'] = 2 then do;\n            print (error)\
                \ 'Could not read the cardinality table.';\n            return True;\n\
                \         end;\n\n   resultDict[\"metaStatistics\"] = r_cardmeta;\n\
                \n   logFooter(\"advisor_makeStatmeta\");\n\n   return False;\n\n\
                end advisor_makeStatmeta;\n\nfunction advisor_initializeAttributesVars(attrArrayName,\
                \ type);\n   /*\n      advisor_initializeAttributesVars initialize\
                \ the various metadata attributes with their default values.\n   */\n\
                \n   do _i = 1 to dim(attrArrayName);\n      attrname = attrArrayName[_i];\n\
                \      select(attrname);\n         when('assess_bias_flg') attributeDict[\"\
                attributeVals\"][\"assess_bias_flg\"] = 'N';\n         when('indexType')\
                \ attributeDict[\"attributeVals\"][\"indexType\"] = 'NONE';\n    \
                \     when('role') attributeDict[\"attributeVals\"][\"role\"] = 'INPUT';\n\
                \         otherwise do;\n            if type = 'num' then do;\n  \
                \             attributeDict[\"attributeVals\"][attrname] = .;\n  \
                \          end;\n            else do;\n               attributeDict[\"\
                attributeVals\"][attrname] = '';\n            end;\n         end;\n\
                \      end;\n   end;\n\nend advisor_initializeAttributesVars;\n\n\
                function advisor_setAttributeDefaults();\n   /*\n       advisor_setAttributeDefaults\
                \ initializes variables associated with the column meta columns.\n\
                \   */\n\n   do attrArray, attrType over attributeDict[\"attributeType\"\
                ];\n      advisor_initializeAttributesVars(attributeDict[attrArray],\
                \ attrType);\n   end;\n\nend advisor_setAttributeDefaults;\n\nfunction\
                \ advisor_setBasicAttributes(rowcolinfo);\n   /*\n      advisor_setBasicAttributes\
                \ initializes the basic attributes for a variable\n              \
                \                   based on the column information\n\n        Arguments:\n\
                \        1. rowcolinfo (Dictionary) - a single row of the column information\
                \ result set\n   */\n\n   varname         = ktrim(rowcolinfo[\"Column\"\
                ]);\n   vartype         = trim(rowcolinfo[\"Type\"]);\n\n   type \
                \  = 'N';\n   if upcase(vartype) in {'VARCHAR', 'CHAR', 'VARBINARY'}\
                \ then type = 'C';\n\n   rawlength       = rowcolinfo[\"RawLength\"\
                ];\n   formattedlength = rowcolinfo[\"FormattedLength\"];\n   format\
                \          = ktrim(rowcolinfo[\"Format\"]);\n   label           =\
                \ ktrim(rowcolinfo[\"Label\"]);\n\n   /* Identify the format Type\
                \ */\n   formatType = ' ';\n   if (missing(format) eq 0) then do;\n\
                \      formatType =upcase(fmtinfo(format, 'CAT'));\n\n       /* Is\
                \ it a user defined format */\n       if strip(formatType) eq  'FMTNAME\
                \ NOT FOUND' then do;\n          if upcase(format) in userformatList\
                \ then formatType = 'USER';\n       end;\n   end;\n\n   /* Process\
                \ the format */\n   nfl = rowcolinfo['NFL'];\n   nfd = rowcolinfo['NFD'];\n\
                \   if nfl > 0 then do;\n      if format ne '' then do;\n        \
                \ if type='N' then format = strip(format)||strip((string)nfl)||'.'||strip((string)nfd);\n\
                \         else format = strip(format)||strip((string)nfl)||'.';\n\
                \      end; else do; /* Fix for DMINE-8451 */\n         if type =\
                \ 'N' then format = strip((string)nfl)||'.'||strip((string)nfd);\n\
                \         else format = '$'||strip((string)nfl)||'.';\n      end;\n\
                \   end; else do;\n      if format ne '' then do;\n         format\
                \ = strip(format)||'.';\n      end;\n   end;\n\n   if type  eq 'N'\
                \ then level = 'INTERVAL';\n   else level = 'NOMINAL';\n\n   attributeDict[\"\
                attributeVals\"][\"varName\"]         = varName;\n   attributeDict[\"\
                attributeVals\"][\"varType\"]         = varType;\n   attributeDict[\"\
                attributeVals\"][\"type\"]            = type;\n   attributeDict[\"\
                attributeVals\"][\"rawlength\"]       = rawlength;\n   attributeDict[\"\
                attributeVals\"][\"format\"]          = format;\n   attributeDict[\"\
                attributeVals\"][\"formattedlength\"] = formattedlength;\n   attributeDict[\"\
                attributeVals\"][\"formatType\"]      = formatType;\n   attributeDict[\"\
                attributeVals\"][\"level\"]           = level;\n   attributeDict[\"\
                attributeVals\"][\"label\"]           = label;\n\n   /* By default\
                \ DATE/TIME/DATETIME variables are REJECTED */\n   if formatType in\
                \ {'DATE', 'TIME', 'DATETIME'} then\n      attributeDict[\"attributeVals\"\
                ][\"role\"]         = 'REJECTED';\n\n   if debug then\n       print\
                \ 'Name: ' varName '  Type: ' type ' varType: ' varType ' Length:\
                \ ' rawlength 'Fmt Length: ' formattedlength ' format: ' format: '\
                \ format type: ' formatType ' label: ' label ;\n\nend advisor_setBasicAttributes;\n\
                \nfunction advisor_setAttributesBasedOnName();\n   /*\n       advisor_setAttributesBasedOnName\
                \ modify the current attributes in attributeVals (current)\n     \
                \  variable based on the name and name prefix rules.\n   */\n\n  \
                \ freqCount   = attributeDict[\"freqCount\"];\n   weightCount = attributeDict[\"\
                weightCount\"];\n\n   /* Get the current attributes */\n   uname \
                \    = upcase(attributeDict[\"attributeVals\"][\"varName\"]);\n  \
                \ role      = attributeDict[\"attributeVals\"][\"role\"];\n   type\
                \      = attributeDict[\"attributeVals\"][\"type\"];\n   level   \
                \  = attributeDict[\"attributeVals\"][\"level\"];\n   rawlength =\
                \ attributeDict[\"attributeVals\"][\"rawlength\"];\n   comment   =\
                \ attributeDict[\"attributeVals\"][\"comment\"];\n\n   if exists(attributeNameDict[\"\
                dictnameList\"],uname) then do;\n      role = trim(attributeNameDict[\"\
                dictnameList\"][uname]['ROLE']);\n      level = trim(attributeNameDict[\"\
                dictnameList\"][uname]['LEVEL']);\n      if  exists(attributeNameDict[\"\
                dictnameList\"][uname],'COMMENT') then comment = trim(attributeNameDict[\"\
                dictnameList\"][uname]['COMMENT']);\n   end; else do;\n      uname_prefix\
                \ = scan(uname, 1, '_');\n      if scan(uname, 2, '_') = '' then uname_prefix='';\n\
                \n      if exists(attributeNameDict[\"dictprefixList\"],uname_prefix)\
                \ then do;\n         role  = trim(attributeNameDict[\"dictprefixList\"\
                ][uname_prefix]['ROLE']);\n         level = trim(attributeNameDict[\"\
                dictprefixList\"][uname_prefix]['LEVEL']);\n      end; else do;\n\
                \         do rolekey, rolevalue over attributeNameDict[\"dictroleList\"\
                ];\n            if index(uname, rolekey)=1 then do;\n            \
                \   role = trim(rolevalue['ROLE']);\n               if exists(rolevalue,'LEVEL')\
                \ then\n                 level = trim(rolevalue['LEVEL']);\n     \
                \          leave;\n            end;\n         end;\n      end;\n\n\
                \      /* Does the variable name ends with _ID */\n      if length(uname)>2\
                \  then do;\n         if substr(reverse(ktrim(uname)), 1, 3) = 'DI_'\
                \ then do;\n            role = 'ID';\n            level = 'NOMINAL';\n\
                \         end;\n      end;\n   end;\n\n   if rawlength > 80 then role\
                \ = 'TEXT';\n   else if role in {'FREQ', 'WEIGHT'} then do;\n    \
                \  if type = 'C' then role = 'INPUT';\n      else do;\n         if\
                \ freqcount then role = 'REJECTED';\n         else freqCount = 1;\n\
                \         if weightCount then role = 'REJECTED';\n         else weightCount\
                \ = 1;\n      end;\n   end;\n\n   /* Update the attributes */\n  \
                \ attributeDict[\"attributeVals\"][\"role\"]    = role;\n   attributeDict[\"\
                attributeVals\"][\"level\"]   = level;\n   attributeDict[\"attributeVals\"\
                ][\"comment\"] = comment;\n\n   /* Update the freq and weight counts\
                \ */\n   attributeDict[\"freqCount\"]   = freqCount;\n   attributeDict[\"\
                weightCount\"] = weightCount;\n\nend advisor_setAttributesBasedOnName;\n\
                \nfunction advisor_resetFreqWeightCount(role);\n   /*\n      advisor_resetFreqWeightCount\
                \ reset the FREQ or WEIGHT count to 0.  This function\n      is called\
                \ if the associated variable is not a valid FREQ or WEIGHT variable.\n\
                \   */\n\n   select(role);\n      when('FREQ') attributeNameDict[\"\
                freqCount\"] = 0;\n      when('WEIGHT') attributeNameDict[\"weightCount\"\
                ] = 0;\n      otherwise;\n   end;\n\nend advisor_resetFreqWeightCount;\n\
                \n\nfunction advisor_setAttributesBasedOnStats();\n   /*\n       advisor_setAttributesBasedOnStats\
                \ modify the current attributes in attributeVals (current)\n     \
                \  variable based on the summary statistics.\n   */\n   varname =\
                \ attributeDict[\"attributeVals\"][\"varName\"];\n   statrow = resultDict[\"\
                metaStatistics\"]['Fetch'].where(_VARNAME_ = ktrim(varname))[1];\n\
                \n   role       = attributeDict[\"attributeVals\"][\"role\"];\n  \
                \ level      = attributeDict[\"attributeVals\"][\"level\"];\n   type\
                \       = attributeDict[\"attributeVals\"][\"type\"];\n   comment\
                \    = attributeDict[\"attributeVals\"][\"comment\"];\n   formatType\
                \ = attributeDict[\"attributeVals\"][\"formatType\"];\n\n   if debug\
                \ then do;\n      print ' ';\n      print 'Statistics Meta:' ' Varname:\
                \ ' varname ' Values: ' statrow;\n      print ' ';\n   end;\n\n  \
                \ nlevel     = statrow[\"_cardinality_\"];\n   _more_     = statrow[\"\
                _more_\"];\n   _min_      = statrow[\"_min_\"];\n   _max_      = statrow[\"\
                _max_\"];\n   _min_      = statrow[\"_min_\"];\n   _nmiss_    = statrow[\"\
                _nmiss_\"];\n   _sumfreqs_ = statrow[\"_sumfreqs_\"];\n\n   nlevelmsg\
                \ = (string)nlevel;\n   if _more_ = 'Y' then nlevelmsg = '>254';\n\
                \n   /* Character Variables and Interval Variables below the IntervalCuttoff\
                \ */\n   if type = 'C' or (type='N' and nlevel < intervalCutoff and\
                \ _more_ = 'N')then do;\n      level = 'NOMINAL';\n      select(nlevel);\n\
                \         when(0) do;\n           advisor_resetFreqWeightCount(role);\n\
                \           level = 'NULL';\n           role  = 'REJECTED';\n    \
                \       comment = \"report.metadata_variable_allmissing.txt\";\n \
                \        end;\n         when(1) do;\n            level = 'UNARY';\n\
                \            if role ne 'FREQ' and role ne 'WEIGHT' then do; /* The\
                \ rule below doesn't apply to FREQ or WEIGHT */\n               if\
                \ _more_ = 'N' then do;\n                  role = 'REJECTED';\n  \
                \                comment = \"report.metadata_variable_constant.txt\"\
                ;\n               end; else do;\n                  if (missing(role)\
                \ ne 0) then role = 'INPUT';\n                  comment = \"report.metadata_variable_constantwithmissing.txt\"\
                ;\n               end;\n            end;\n         end;\n        \
                \ when(2) do;\n            level = 'BINARY';\n            if (missing(role)\
                \ ne 0) then role = 'INPUT';\n         end;\n         otherwise do;\n\
                \            if role ne 'TEXT' and role ne 'FREQ' and role ne 'WEIGHT'\
                \ then do; /* The rule below doesn't apply to TEXT, FREQ, or WEIGHT\
                \ */\n               level = 'NOMINAL';\n               if (nlevel\
                \ > min(maxClassLevels, 254)) or _more_ = 'Y' then do;\n         \
                \         role = 'REJECTED';\n                  comment = \"report.metadata_variable_toomanylevels.txt\"\
                ;\n               end;\n               if (missing(role) ne 0) then\
                \ role = 'INPUT';\n            end;\n         end;\n      end;\n \
                \  end; else do;\n       level = 'INTERVAL';\n       if role ne 'FREQ'\
                \ and role ne 'WEIGHT' then do; /* The rule below doesn't apply to\
                \ TEXT, FREQ, or WEIGHT */\n          if (missing(role) ne 0) then\
                \ role = 'INPUT';\n          if nlevel = 254 and _more_ = 'Y' then\
                \ nlevel = .;\n       end;\n   end;\n\n   pctmiss = .;\n   if (missing(_sumfreqs_)\
                \ eq 0) and (missing(_nmiss_) eq 0) then do;\n      if (_sumfreqs_\
                \ + _nmiss_)>0 then do;\n          pctmiss = 100*_nmiss_ / (_sumfreqs_\
                \ + _nmiss_);\n      end;\n   end;\n   if pctmiss = 100 then do;\n\
                \      advisor_resetFreqWeightCount(role);\n      role = 'REJECTED';\n\
                \      comment = \"report.metadata_variable_allmissing.txt\";\n  \
                \ end;\n   if applyMaxPercentMissing then do;\n      if (pctmiss <\
                \ 100) and (pctmiss > maxPercentMissing) then do;\n         advisor_resetFreqWeightCount(role);\n\
                \         role = 'REJECTED';\n         comment = \"report.metadata_variable_toomanymissings.txt\"\
                ;\n      end;\n   end;\n   if statrow[\"_rlevel_\"] = 'ID' then do;\n\
                \      if role ne 'TEXT' and role ne 'KEY' and ^(role eq 'REJECTED'\
                \ and formatType in {'DATE', 'TIME', 'DATETIME'}) then do;\n     \
                \    attributeDict[\"attributeVals\"][\"_rlevel_\"]    = 'ID'; /*\
                \ Used when retraining to check if a key is still valid */\n     \
                \    role = 'ID';\n      end;\n   end;\n\n   /* Update the statistics\
                \ variables in the attributeVals dictionary */\n   do attrname over\
                \ attributeDict[\"statAttrs\"];\n      if exists(statrow, attrname)\
                \ then do;\n         attributeDict[\"attributeVals\"][attrname] =\
                \ statrow[attrname];\n      end;\n   end;\n   attributeDict[\"attributeVals\"\
                ][\"pctmiss\"] = pctmiss;\n\n   /* Validate special role variables\
                \ if specified */\n   select(role);\n      when('FREQ')      advisor_validateFreq();\n\
                \      when('WEIGHT')    advisor_validateWeight();\n      when('PARTITION')\
                \ advisor_validatePartition();\n      when('KEY')       advisor_validateKey();\n\
                \      otherwise do;\n         attributeDict[\"attributeVals\"][\"\
                role\"]    = role;\n         attributeDict[\"attributeVals\"][\"comment\"\
                ] = comment;\n      end;\n   end;\n\n   attributeDict[\"attributeVals\"\
                ][\"level\"]     = level;\n   attributeDict[\"attributeVals\"][\"\
                nlevelmsg\"] = nlevelmsg;\n\nend advisor_setAttributesBasedOnStats;\n\
                \nfunction advisor_validateGlobalMeta(grow);\n   /*\n       advisor_validateGlobalMeta\
                \ check if the specified global metadata is compatible\n       with\
                \ the current data and attributes.  If not, then it will be reset\
                \ and ignored.\n       This function also checks for valid FREQ and\
                \ WEIGHT variables:\n          _ there can be at most one of each\
                \ role.\n          _ they cannot be all missing or have missing that\
                \ exceed the maximum cutoff (maxPercentMissing)\n            and applyMaxPercentMissing\
                \ is True\n          _ a FREQ variable cannot have negative values\
                \ and its maximum must be greater or equal to 1.\n          _ a WEIGHT\
                \ variable cannot have negative or all zero values.\n   */\n   globalChangesBitFlag\
                \ = 0;\n\n   /* Fetch current attributes */\n   varname = attributeDict[\"\
                attributeVals\"][\"varname\"];\n   role    = attributeDict[\"attributeVals\"\
                ][\"role\"];\n   level   = attributeDict[\"attributeVals\"][\"level\"\
                ];\n   type    = attributeDict[\"attributeVals\"][\"type\"];\n   comment\
                \ = attributeDict[\"attributeVals\"][\"comment\"];\n\n   /* Use to\
                \ validate the freq and weight variables if specified */\n   _min_\
                \   = attributeDict[\"attributeVals\"][\"_min_\"];\n   _max_   = attributeDict[\"\
                attributeVals\"][\"_max_\"];\n   pctmiss = attributeDict[\"attributeVals\"\
                ][\"pctmiss\"];\n   nlevel  = attributeDict[\"attributeVals\"][\"\
                _cardinality_\"];\n\n   /* Check if a new role has been specified\
                \ */;\n   if exists(grow, \"ROLE\") then do;\n      newrole = upcase(grow[\"\
                ROLE\"]);\n      if upcase(newrole) ne role and (missing(newrole)\
                \ eq 0) then do;\n         select(trim(newrole));\n             when('FREQ')\
                \ do; /* Check if the variable is a valid freq variable */\n     \
                \           if type = 'C' then do;\n                   grow[\"ROLE\"\
                ] = role; /* reset the globalmeta */\n                end; else if\
                \ (attributeDict[\"freqCount\"] = 1) then do; /* check if there is\
                \ already a FREQ variable */\n                   newrole = 'REJECTED';\n\
                \                   grow[\"ROLE\"] = newrole;\n                  \
                \ print(warn) 'A frequency variable has already been specified.  The\
                \ variable ' varname ' is assigned the role of Rejected.';\n     \
                \              comment = \"report.metadata_onlyonefreq_variable.txt\"\
                ;\n                   grow[\"COMMENT\"] = comment;\n             \
                \   end; else if (missing(_max_) eq 0) and (missing(_min_) eq 0) then\
                \ do;\n                   if _min_ < 0 then do;\n                \
                \      newrole = 'REJECTED';\n                      comment = \"report.metadata_variable_freqwithnegvalues.txt\"\
                ;\n                      globalChangesBitFlag = globalChangesBitFlag\
                \ + 8;\n                      print(warn) 'The variable ' varname\
                \ ' is not a valid frequency variable because it contains negative\
                \ values.  It is assigned the role of Rejected.';\n              \
                \     end; else if _max_ < 1 then do;\n                      newrole\
                \ = 'REJECTED';\n                      comment = \"report.metadata_variable_freqmaxlessthanone.txt\"\
                ;\n                      globalChangesBitFlag = globalChangesBitFlag\
                \ + 8;\n                      print(warn) 'The variable ' varname\
                \ ' is not a valid frequency variable because its values are all less\
                \ than 1.  It is assigned the role of Rejected.';\n              \
                \     end; else if applyMaxPercentMissing and (pctmiss < 100) and\
                \ (pctmiss > maxPercentMissing) then do; /* Check if the variable\
                \ has too many missing */\n                      newrole = 'REJECTED';\n\
                \                      comment = \"report.metadata_variable_toomanymissings.txt\"\
                ;\n                      print(warn) 'The variable ' varname ' is\
                \ not a valid frequency variable because it has too many missing values.\
                \  It is assigned the role of Rejected.';\n                   end;\
                \ else globalChangesBitFlag = globalChangesBitFlag + 1;\n        \
                \           grow[\"ROLE\"] = newrole;\n                   grow[\"\
                COMMENT\"] = comment;\n                end; else if !compfuzz(nlevel,\
                \ 0, 8) then do; /* Check if the variable is null */\n           \
                \        newrole = 'REJECTED';\n                   comment = \"report.metadata_variable_allmissing.txt\"\
                ;\n                   print(warn) 'The variable ' varname ' is not\
                \ a valid frequency variable because it only has missing values. \
                \ It is assigned the role of Rejected.';\n                   grow[\"\
                ROLE\"] = newrole;\n                   grow[\"COMMENT\"] = comment;\n\
                \                end; else do; /* If the variable meets the requirements\
                \ accept the new role of FREQ */\n                   globalChangesBitFlag\
