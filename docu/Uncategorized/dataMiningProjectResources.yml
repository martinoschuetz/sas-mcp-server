                  \      RI  = {'ROLE' = 'RESIDUAL',       'LEVEL' = 'INTERVAL'},\n\
                  \      RD  = {'ROLE' = 'RESIDUAL',       'LEVEL' = 'INTERVAL'},\n\
                  \      RDS = {'ROLE' = 'RESIDUAL',       'LEVEL' = 'INTERVAL'},\n\
                  \      RDT = {'ROLE' = 'RESIDUAL',       'LEVEL' = 'INTERVAL'},\n\
