                  \ the summary\n       statistics computed by the advanced advisor.\
                  \  A KEY variable will be set to REJECTED if:\n       _ It contains\
                  \ any missing values, i.e. pctmiss > 0\n       _ If the cardinality\
                  \ action determines that it is not an ID variable.  Ths would be\
                  \ that there are\n         non unique values.\n   */\n\n   pctmiss\
                  \  = attributeDict[\"attributeVals\"][\"pctmiss\"];\n   _rlevel_\
                  \ = attributeDict[\"attributeVals\"][\"_rlevel_\"];\n\n   newrole\
                  \ = 'KEY';\n\n   if (missing(pctmiss) eq 0) then do;\n      if pctmiss\
                  \ ne 0 then do;\n         newrole = 'REJECTED';\n         comment\
                  \ = \"report.metadata_variable_invalidkey.txt\";\n         print(warn)\
                  \ 'The variable ' varname ' is not a valid key variable because\
                  \ it has missing values.  It is assigned the role of Rejected.';\n\
                  \      end;\n\n      if newrole eq 'REJECTED' then do;\n       \
                  \  attributeDict[\"attributeVals\"][\"comment\"] = comment;\n  \
                  \    end;\n   end; else if (missing(_rlevel_) eq 0) then do;\n \
                  \     if _rlevel_ ne 'ID' then do;\n         newrole = 'REJECTED';\n\
                  \         comment = \"report.metadata_variable_invalidkey.txt\"\
                  ;\n         print(warn) 'The variable ' varname ' is not a valid\
                  \ key variable because it has duplicate values.  It is assigned\
                  \ the role of Rejected.';\n      end;\n\n      if newrole eq 'REJECTED'\
                  \ then do;\n         attributeDict[\"attributeVals\"][\"comment\"\
                  ] = comment;\n      end;\n   end;\n   attributeDict[\"attributeVals\"\
                  ][\"role\"] = newrole;\n\nend advisor_validateKey;\n\n\nfunction\
                  \ advisor_mergeOldMeta(omrow);\n   /*\n       advisor_mergeOldMeta\
                  \ merge the attributes from the current (old) project metadata\n\
                  \       with the metadata for the current (retrain( data and attributes.\
                  \  If the old attributes\n       are not compatible, then it will\
                  \ be ignored.\n       This function also checks for valid TARGET,\
                  \ FREQ, WEIGHT, PARTITION, and KEY variables:\n       if the previously\
                  \ defined variable of these roles are still in the new table, they\
                  \ will\n       preserved their role, and other variables with these\
                  \ roles that may have been set by\n       the global metadata and\
                  \ the name dictionaries will be reset.\n   */\n\n   /* Retrieve\
                  \ the attributes that may have been user set in the project metadata\
                  \ */\n   oldlevel            = omrow['level'];\n   oldnlevel   \
                  \        = omrow['nlevel'];\n   oldrole             = omrow['role'];\n\
                  \   oldorder            = omrow['order'];\n   oldimpute        \
                  \   = omrow['impute'];\n   oldimpconstchar     = omrow['impconstchar'];\n\
                  \   oldimpconstnum      = omrow['impconstnumb'];\n   oldtransform\
                  \        = omrow['transform'];\n   oldlowerlimit       = omrow['lowerlimit'];\n\
                  \   oldupperlimit       = omrow['upperlimit'];\n   oldassess_bias_flg\
                  \  = omrow['assess_bias_flg'];\n   oldcomment          = omrow['comment'];\n\
                  \n   /* Fetch current attributes */\n   varname = attributeDict[\"\
                  attributeVals\"][\"varname\"];\n   role    = attributeDict[\"attributeVals\"\
                  ][\"role\"];\n   level   = attributeDict[\"attributeVals\"][\"level\"\
                  ];\n   comment = attributeDict[\"attributeVals\"][\"comment\"];\n\
                  \n   /* Use to validate the freq and weight variables if specified\
                  \ */\n   _min_   = attributeDict[\"attributeVals\"][\"_min_\"];\n\
                  \   _max_   = attributeDict[\"attributeVals\"][\"_max_\"];\n   pctmiss\
                  \ = attributeDict[\"attributeVals\"][\"pctmiss\"];\n   nlevel  =\
                  \ attributeDict[\"attributeVals\"][\"_cardinality_\"];\n\n   /*\
                  \ Update the measurement level */\n   if oldnlevel ne nlevel then\
                  \ do; /* the measurement levels have changed */\n      if ^(level\
                  \ in {'UNARY', 'NULL', 'BINARY'}) then do;  /* refreshed column\
                  \ doesn't have 0, 1, 2 levels */\n         if  ^(oldlevel in {'UNARY',\
                  \ 'NULL', 'BINARY'}) then /* previous column version also didn't\
                  \ have 0, 1, 2 levels */\n             attributeDict[\"attributeVals\"\
                  ][\"level\"] = oldlevel;\n      end;\n   end; else do;\n      attributeDict[\"\
                  attributeVals\"][\"level\"] = oldlevel; /* The number of levels\
                  \ is the same so keep the old level*/\n   end;\n   /* Determine\
                  \ if a variable changed from a class to an interval or vice versa\
                  \ */\n   if (LEVEL = 'INTERVAL' and OLDLEVEL ne 'INTERVAL') or (LEVEL\
                  \ ne 'INTERVAL' and OLDLEVEL eq 'INTERVAL') then\n      groupLevelMatch\
                  \ = 0;\n   else\n      groupLevelMatch = 1;\n\n   if groupLevelMatch\
                  \ then do;\n      if missing(oldimpute) eq 0    then attributeDict[\"\
                  attributeVals\"][\"impute\"] = oldimpute;\n      if missing(oldtransform)\
                  \ eq 0 then attributeDict[\"attributeVals\"][\"transform\"] = oldtransform;\n\
                  \   end;\n   if missing(oldorder) eq 0             then attributeDict[\"\
                  attributeVals\"][\"order\"]            = oldorder;\n   if missing(oldimpconstchar)\
                  \ eq 0      then attributeDict[\"attributeVals\"][\"impconstchar\"\
                  ]     = oldimpconstchar;\n   if missing(oldimpconstnum) eq 0   \
                  \    then attributeDict[\"attributeVals\"][\"impconstnum\"]    \
                  \  = oldimpconstnum;\n   if missing(oldlowerlimit) eq 0        then\
                  \ attributeDict[\"attributeVals\"][\"lowerlimit\"]       = oldlowerlimit;\n\
                  \   if missing(oldupperlimit) eq 0        then attributeDict[\"\
                  attributeVals\"][\"upperlimit\"]       = oldupperlimit;\n   if missing(oldassess_bias_flg\
                  \ ) eq 0  then attributeDict[\"attributeVals\"][\"assess_bias_flg\"\
                  ]  = oldassess_bias_flg;\n\n   /* Validate that the previous role\
                  \ is still valid */\n   if oldrole in {'FREQ', 'WEIGHT', 'PARTITION',\
                  \ 'KEY'} then do;\n      select(oldrole);\n         when('FREQ')\
                  \      advisor_validateFreq();\n         when('WEIGHT')    advisor_validateWeight();\n\
                  \         when('PARTITION') advisor_validatePartition();\n     \
                  \    when('KEY')       advisor_validateKey();\n         otherwise;\n\
                  \      end;\n   end;\n   else if role in {'FREQ', 'WEIGHT', 'PARTITION',\
                  \ 'KEY'} then do; /* role was changed by the globalmeta or name\
                  \ dictionary */\n      attributeDict[\"attributeVals\"][\"role\"\
                  ] = oldrole;\n      attributeDict[\"attributeVals\"][\"comment\"\
                  ] = oldcomment;\n   end;\n   else if oldrole = 'REJECTED' then do;\n\
                  \      /* The previous role was rejected.  Check if the reason it\
                  \ was data driven (stats) or not.  If it was data\n         driven\
