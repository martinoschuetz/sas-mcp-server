        requestBody = {
          "dataTableUri": "/dataTables/dataSources/cas~fs~cas-shared-default~fs~Public/tables/HMEQ",
          "outputCasLibName": "",
          "outputTableName": ""
        }

        headers = {
            'content-type': "application/vnd.sas.analytics.data.mining.model.score.request+json",
            'accept': "application/vnd.sas.score.execution+json",
            'authorization': "TOKEN"
        }

        response = requests.request("POST", url, headers=headers, json=requestBody)

        print(response.text)
