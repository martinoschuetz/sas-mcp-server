        name: application/vnd.sas.analytics.pipeline.summary
        version: 1
      properties:
        createdBy:
          type: string
          description: The user who created the pipeline.
        modifiedBy:
          type: string
          description: The user who most recently modified the pipeline.
        creationTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            pipeline was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            pipeline was last modified.
          format: date-time
        id:
          type: string
          description: A unique identifier for the pipeline.
        name:
          type: string
          description: The pipeline name.
        description:
          type: string
          description: The pipeline description.
        version:
          type: integer
          format: int32
          description: The version number of the pipeline representation. This representation
            is version 1.
        links:
          description: The links that apply to the pipeline.
          type: array
          items:
            $ref: "#/components/schemas/link"
    parameter:
      title: Parameter
      description: Metadata describing a particular variable.
      required:
      - parameter
      - type
      - values
      properties:
        label:
          type: string
          description: 'The display name. May be localized.'
        length:
          type: integer
          format: int32
          description: 'The maximum width among this parameter''s values.'
        order:
          type: integer
          format: int32
          description: 'The index of this parameter in the collection.'
        parameter:
          type: string
          description: 'The parameter name. Should not be localized.'
        preformatted:
          type: boolean
          description: 'Indicates whether this parameter''s values have already been
            formatted.'
        type:
          type: string
          description: 'The data type of this parameter''s values.'
          enum:
          - undefined
          - num
          - char
          - report
        values:
          type: array
          description: 'Keys used to associate this parameter with values in the rows
            of data.'
          items:
            type: string
    pipelineComponentConnection:
      title: Pipeline Component Connection
      description: A representation of a connection between two pipeline components.
        Connected components are executed sequentially.
      properties:
        id:
          type: string
          description: A unique identifier for the connection.
        from:
          type: string
          description: The id of the connection source component. This component must
            complete execution before the target component can execute.
        to:
          type: string
          description: The id of the connection target component. This component can
            begin execution only after the source component completes.
    analyticsComponentSummary:
      title: Analytics Component Summary
      description: A summary of an analytics component representation.  It omits revision,
        code, executionProviderId, componentProperties, and validationModel
      x-sas-media-type:
        name: application/vnd.sas.analytics.component.summary
        version: 2
      properties:
        createdBy:
          type: string
          description: The user who created the component.
          maximum: 255
        modifiedBy:
          type: string
          description: The user who most recently modified the component.
          maximum: 255
        creationTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            component was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            component was last modified.
          format: date-time
        id:
          type: string
          description: A unique identifier for the component.
          maximum: 255
        name:
          type: string
          description: The component name.
          maximum: 100
        description:
          type: string
          description: The component description.
          maximum: 500
        group:
          type: string
          description: The component group name. Similar components can be grouped
            together by assigning the same group name to each.
          maximum: 36
        classification:
          type: string
          description: An application-defined component classification.
          maximum: 36
        state:
          type: string
          description: The current execution state of the component.
          enum:
          - undefined
          - created
          - modified
          - pending
          - waiting
          - running
          - completed
          - canceled
          - paused
          - deleted
          - failed
          maximum: 20
        iconCode:
          type: string
          description: An application-defined value that identifies a visual representation
            of the component type.
          maximum: 10
        imageUri:
          type: string
          description: A application-defined URI used to retrieve a visual representation
            of the component state.
          maximum: 500
        systemAttributes:
          type: object
          additionalProperties: true
          description: Additional properties, not visible to the user, that control
            component execution.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 2.
    scoreExecutionRequest:
      title: Score Execution Request
      description: Contains request details about how to generate score. This represents
        application/vnd.sas.score.execution.request media type (version 1).
      required:
      - name
      - scoreDefinitionId
      - mappedCodeUri
      - outputTable
      properties:
        type:
          type: string
          format: enumeration
          enum:
          - scoreDefinition
          - mappedCode
          default: scoreDefinition
          description: Score execution request can be either scoreDefinition or mappedCode.
            Default value is scoreDefinition.
        name:
          type: string
          description: The descriptive name for the request. Which will be shown when
            showing executions.
        description:
          type: string
          description: The description of the request.
        hints:
          type: object
          description: Hints used to execute an object for score.
          additionalProperties:
            type: string
        jobDefinition:
          $ref: "#/components/schemas/jobDefinition"
        jobDefinitionId:
          type: string
          description: Job definition id which is used to score. Either this or the
            jobDefinition should be used.
        scoreDefinition:
          $ref: "#/components/schemas/scoreDefinition"
        scoreDefinitionId:
          type: string
          description: Score definition id which is used to score an object. Valid
            only when type is scoreDefinition. Either this or the scoreDefinition
            should be part of the request. Should not use both of them. Only valid
            when the type is scoreDefinition.
        overrideScoreDefinition:
          $ref: "#/components/schemas/overrideScoreDefinition"
        mappedCode:
          type: string
          description: Inline mapped code. Valid only when type is mappedCode. Either
            this or mappedCodeUri should be used.
        mappedCodeUri:
          type: string
          description: Uri containing mapped code. Valid only when type is mappedCode.
            Either this or mappedCode should be used.
        outputTable:
          $ref: "#/components/schemas/outputTable"
        version:
          type: integer
          readOnly: true
          description: This media type's schema version number. This representation
            is version 1.
    outputTable:
      title: Output Table
      description: Output generated by score execution or analysis. This doesn't represent
        any top-level media type.
      required:
      - tableName
      - serverName
      - libraryName
      properties:
        tableName:
          type: string
          description: Table name where the score execution or analysis output is
            saved.
        libraryName:
          type: string
          description: Library where the table is located.
        serverName:
          type: string
          description: Server where the table is located.
    validationModel:
      title: Validation Model
      description: The validation rules applied to a map of properties.
      x-sas-media-type:
        name: application/vnd.sas.analytics.validation.model
        version: 3
      allOf:
      - $ref: "#/components/schemas/validationModelSummary"
      - type: object
        properties:
          revision:
            type: integer
            description: A revision number that is incremented on every update to
              the model.
            format: int64
          id:
            type: string
            description: A unique identifier for the model.
            maximum: 255
          name:
            type: string
            description: The model name.
            maximum: 100
          description:
            type: string
            description: The model description.
            maximum: 500
          items:
            type: array
            description: The top-level validation groups and properties
            items:
              anyOf:
              - $ref: "#/components/schemas/validationProperty"
              - $ref: "#/components/schemas/validationGroup"
          version:
            type: integer
            format: int32
            description: The version number of this representation schema.
    request:
      title: Job Request
      description: A job request.
      x-sas-media-type:
        name: application/vnd.sas.job.execution.job.request
        version: 3
      required:
      - id
      type: object
      properties:
        version:
          type: integer
          description: The version number of the representation. The current version
            is 3.
        id:
          type: string
          description: The unique identifier for the job request. This is only required
            for a persisted job request.
        name:
          type: string
          description: The name of the job request.
        description:
          type: string
          description: The description of the job request.
        creationTimeStamp:
          description: The timestamp for when the job request was created, in the
            format of `YYYY-MM-DDThh:mm:ss.sssZ`.  This is set only on a persisted
            job request.
          type: string
        modifiedTimeStamp:
          description: The timestamp for when the job request was last modified, in
            the format of `YYYY-MM-DDThh:mm:ss.sssZ`.  This is set only on a persisted
            job request.
          type: string
        createdBy:
          description: The ID of the user that created the job request.  This is set
            only on a persisted job request.
          type: string
        modifiedBy:
          description: The ID of the user that last modified the job request.  This
            is set only on a persisted job request.
          type: string
        jobDefinitionUri:
          type: string
          description: The URI of the job definition that is to be executed.  Either
            the `jobDefinitionUri` or the `jobDefinition` property must be set in
            a job request submitted to Job Execution service for execution.
        jobDefinition:
          $ref: "#/components/schemas/jobDefinition"
        expiresAfter:
          type: string
          description: The duration of time (in <a href="https://www.w3.org/TR/xmlschema-2/#duration"
            target="_blank">W3C XML duration format</a>) after the completion of the
            job when the job should be deleted by the Job Execution service. If a
            value is specified for this property, it overrides any value specified
            by the provider's `/commons/settings` endpoint for the job request.<p>For
            a job request that is embedded in the `application/vnd.sas.job.execution.job`
            media type, if a value is not already set for the `expiresAfter` property,
            the value is set by the Job Execution service to the provider's value,
            if one exists.
        arguments:
          type: object
          description: The values of the arguments in the format map<string, string>
            that contains name value pairs (map<name, value>). Values can be supplied
            for parameters not defined in the job definition. The maximum name length
            is 100.<p>Hibernate does not persist a map entry with a null value. Therefore,
            a persisted Job Request will not contain any such entries.<p>For a job
            request that is embedded in the 'application/vnd.sas.job.execution.job'
            media type, this value is set by the Job Execution service and contains
            the complete set of arguments that are to be used in the execution by
            the provider. Arguments that already exist in the original job request
            are left unchanged. If there are arguments in the job definition that
            do not exist in the original job request arguments map, those arguments
            and any default values, including null values, are added to the arguments
            map. However, since the Job object is persisted before being sent to the
            provider, no entries for such null-value arguments in the Job are sent
            to the provider (because of the Hibernate behavior of not persisting map/collection
            entries with null values). The Job Execution service also guarantees that
            any required argument has an associated non-null value.
        properties:
          type: object
          description: The value of properties in the format of (map<string, string>)
            that contains name value pairs (map<name, value>). The maximum name length
            is 100.
          additionalProperties:
            type: string
        createdByApplication:
          type: string
          description: The application that created the job request. The value is
            typically from the spring.application.name property. The value is used
            as the "creator" in the routing key of the Job State Change events, and
            if it is not present in the job request the value "jobExecution" is used.
            Valid characters are [a-zA-Z0-9] and the hyphen. The maximum length is
            64.
        links:
          type: array
          description: The links that are associated with the job request.
          items:
            $ref: "#/components/schemas/link"
    instant:
      title: Instant
      description: An instantaneous point on the time-line.
      properties:
        epochSecond:
          description: The number of seconds from the epoch of 1970-01-01T00:00:00Z.
          type: integer
          format: int64
        nano:
          description: The number of nanoseconds, later along the time-line, from
            the seconds field.  This is always positive, and never exceeds 999,999,999.
          type: integer
          format: int32
    overrideScoreDefinition:
      title: Override Score Definition
      description: Overrides the details of the existing Score definition.  This doesn't
        represent any top-level media type.
      properties:
        preprocessingCode:
          type: string
          description: Code which should be executed before executing actual code.
        objectDescriptor:
          $ref: "#/components/schemas/objectDescriptor"
        inputData:
          $ref: "#/components/schemas/inputData"
        mappings:
          type: array
          description: Array of mappings between score object variables and input
            data columns.
          items:
            $ref: "#/components/schemas/termMapping"
    validationGroup:
      title: Validation Group
      description: An aggregate member of a validation model.
      allOf:
      - $ref: "#/components/schemas/validationItem"
      - properties:
          style:
            type: string
            description: Application-defined style information used to render the
              group in a user interface.
            maximum: 100
          items:
            type: array
            items:
              $ref: "#/components/schemas/validationItem"
    enumerationGroupItem:
      title: Enumeration Group Item
      description: Represents an advanced analytics enumeration item
      properties:
        id:
          type: string
          description: The enumeration item id
        name:
          type: string
          description: The enumeration item name. It is localized based on the user
            locale.
    jobDefinition:
      title: Job Definition
      description: The job definition.
      type: object
      x-sas-media-type:
        name: application/vnd.sas.job.definition
        version: 2
      required:
      - code
      properties:
        version:
          type: integer
          description: The version of the resource. This version is 2.
        id:
          type: string
          description: The unique ID of the resource that is generated by the API.
        name:
          type: string
          description: The name of the job. The maximum length is 100.
        description:
          type: string
          description: A description of the job. The maximum length is 1000.
          x-sas-attributes:
            since: '2'
        type:
          type: string
          description: The type of job. This property determines the execution provider
            that executes this job. The maximum length is 250.
        code:
          type: string
          description: Execution provider specific code to be executed.
        parameters:
          type: array
          description: An array of input parameters to be collected when executing
            this job definition.
          items:
            $ref: "#/components/schemas/jobDefinitionParameter"
        properties:
          type: array
          description: An array of name/value pairs needed to execute a job definition.
            The maximum length of a name is 100.
          items:
            $ref: "#/components/schemas/property"
        createdBy:
          type: string
          description: The user that created this job.
        modifiedBy:
          type: string
          description: The user that modified this job.
        creationTimeStamp:
          type: string
          description: 'The formatted timestamp when the job was created, in the following
            format: yyyy-mm-ddThh:mm:ssZ.'
        modifiedTimeStamp:
          type: string
          description: 'The formatted timestamp when the job was modified, in the
            following format: yyyy-mm-ddThh:mm:ssZ.'
        links:
          type: array
          description: An array of link objects
          items:
            $ref: "#/components/schemas/link"
    scoreDefinition:
      title: Score Definition
      description: A definition containing details about Input Data, Score Object
        and Mapping. This represents application/vnd.sas.score.definition media type
        (version 1).
      required:
      - name
      - objectDescriptor
      - inputData
      properties:
        id:
          type: string
          readOnly: true
          description: The system-assigned unique ID for this object
        name:
          type: string
          description: The score definition name
        description:
          type: string
          description: The score definition description
        createdBy:
          type: string
          readOnly: true
          description: The user who created the score definition.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The date and time that the score definition was created.
        modifiedBy:
          type: string
          readOnly: true
          description: The userId of the authenticated user who last updated the score
            definition.
        modifiedTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The date and time that the score definition was last modified.
        preprocessingCode:
          type: string
          description: Preprocessing code that is executed before executing the Mapped
            Code.
        objectDescriptor:
          $ref: "#/components/schemas/objectDescriptor"
        inputData:
          $ref: "#/components/schemas/inputData"
        mappings:
          type: array
          description: Array of mappings between Score Object variables and Input
            Data columns.
          items:
            $ref: "#/components/schemas/termMapping"
        properties:
          type: object
          description: "The properties for this score definition that support scoring\
            \ for decisions and business rules. <ul> <li>outputServerName: The name\
            \ of a Cloud Analytic Server. <li>outputLibraryName: The name of a Cloud\
            \ Analytic Server library. <li>tableBaseName: The name of a table in the\
            \ output library. <li>test: A flag that indicates whether the score definition\
            \ is used for test scoring. Valid values are \"true\" and \"false\". </ul>\
            \ These additional properties support publish validation for decisions\
            \ and business rules. <ul> <li>asssetUri: The URI of the decision or business\
            \ rule that is being validated. <li>publishDestination: The name of a\
            \ publish destination. <li>publishType: The type of publish destination.\
            \ <li>publishName: The name for publishing the asset. </ul> "
          additionalProperties:
            type: string
        folderType:
          type: string
          readOnly: true
          description: Indicates the kind of folder where the score definition is
            housed.
        links:
          type: array
          readOnly: true
          description: Zero or more links to related resources or operations.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          readOnly: true
          description: This media type's schema version number. This representation
            is version 2.
    validationProperty:
      title: Validation Property
      description: A property member of a validation model.
      allOf:
      - $ref: "#/components/schemas/validationItem"
      - properties:
          type:
            type: string
            description: The data type of the property.
            enum:
            - string
            - code
            - dataLocation
            - resourceLocation
            - double
            - float
            - integer
            - boolean
            - external
          mediaType:
            type: string
            description: The property media type. Can be used with string and code
              data types. Further describes the property with an IANA media type.
          required:
            type: boolean
            description: An indication of whether the property is required to be present.
          selector:
            type: boolean
            description: An indication of whether the property is used to control
              access to a separate group of properties. Used with boolean properties
              only.
          targetRelation:
            type: string
            description: For properties of type "external", the name of a link relation
              that will be used by a client to navigate to and edit the property.
              Required for external propeties, and ignored for all other property
              types.
          constraints:
            type: array
            items:
              $ref: "#/components/schemas/validationConstraint"
    validationModelSummary:
      title: Validation Model Summary
      description: A summary of a validation model representation.
      x-sas-media-type:
        name: application/vnd.sas.analytics.validation.model.summary
        version: 1
      properties:
        createdBy:
          type: string
          description: The user who created the model.
          maximum: 255
        modifiedBy:
          type: string
          description: The user who most recently modified the model.
          maximum: 255
        creationTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            model was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            model was last modified.
          format: date-time
        id:
          type: string
          description: A unique identifier for the model.
          maximum: 255
        name:
          type: string
          description: The model name.
          maximum: 100
        description:
          type: string
          description: The model description.
          maximum: 500
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          format: int32
          description: The version number of this representation schema.
    termMapping:
      title: Mapping
      description: Assigning Input Data column to a variable of the generated Mapped
        Code of Score Object. This doesn't represent any top-level media type.
      required:
      - variableName
      - mappingType
      properties:
        variableName:
          type: string
          description: Name of the Score Object's variable.
        mappingType:
          description: The mapping type.
          type: string
          format: enumeration
          enum:
          - datasource
          - static
          - expected
        mappingValue:
          anyOf:
          - type: integer
          - type: number
          - type: array
          - type: boolean
          - type: object
          - type: string
          description: Value that is assigned to Score Object's variable. If the mappingType
            is dataSource then this should be column name of the Input Data. If the
            mappingType is static then this should be a constant value. If the mappingType
            is expected then this is the expected value of the output and it is always
            constant. Required if the mappingType is datasource.
    jobDefinitionParameter:
      title: Job Definition Parameter
      type: object
      description: The job definition parameter.
      required:
      - name
      properties:
        version:
          type: integer
          description: The version of the resource. This version is 1.
        name:
          type: string
          description: The name of the parameter. The maximum length is 100.
        type:
          type: string
          description: The type of the parameter (TABLE, NUMERIC, DATE, CHARACTER).
            The maximum length is 20.
        label:
          type: string
          description: The display value for the name of this parameter. The maximum
            length is 250.
        required:
          type: boolean
          description: Specifies if the parameter is required for execution.
        defaultValue:
          type: string
          description: The default value for this parameter, if one is not specified
            at execution time.
    property:
      title: Property
      description: A pair consisting of a string name and a string value. This is
        an element of `application/vnd.sas.properties`
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: The property name.
        value:
          type: string
          description: The property value.
    inputData:
      title: Input Data
      description: Input Data that will be scored.  This doesn't represent any top-level
        media type.
      required:
      - type
      - serverName
      - libraryName
      - tableName
      properties:
        type:
          type: string
          format: enumeration
          description: The type of input data.
          enum:
          - CASTable
          - Inline
          - Scenario
        serverName:
          type: string
          description: CAS Server name where CAS table is located. Valid only if the
            type is CASTable.
        libraryName:
          type: string
          description: CAS Library name where CAS table is located. Valid only if
            the type is CASTable.
        tableName:
          type: string
          description: Name of the CAS table. Valid only if the type is CASTable.
        code:
          type: string
          description: Code containing inline data. Valid only if the type is Inline.
        outputTableName:
          type: string
          description: Name of the output table that will be generated when the inline
            code is executed. Valid only if the type is Inline.
    objectDescriptor:
      title: Object Descriptor
      description: Descriptor of a Score Object whose logic is used to produce a score
        for Input Data. This doesn't represent any top-level media type.
      required:
      - uri
      properties:
        name:
          type: string
          description: Name of the Score Object.
        type:
          type: string
          description: Type of the Score Object.
        uri:
          type: string
          format: uri
          description: Uri to the Score Object.
    validationItem:
      title: Validation Item
      description: A member of a validation model.
      discriminator:
        propertyName: itemType
      properties:
        itemType:
          type: string
          description: Indicates whether this item represents a single property or
            a group of validation items.
          enum:
          - group
          - property
        id:
          type: string
          description: A unique identifier for the validation item.
          maximum: 36
        name:
          type: string
          description: The validation item's name, if any. If set, this value is unique
            among all items in the same parent group.
          maximum: 100
        displayName:
          type: string
          description: A user-friendly name for the validation item"
          maximum: 100
        description:
          type: string
          description: A description of the validation item
