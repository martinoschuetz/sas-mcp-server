                  \ 'Could not create the metadata table.';\n      return True;\n\
                  \   end;\n\n   logFooter(\"advisor_makeColumnmeta\");\nend advisor_makeColumnmeta;\n\
                  \nfunction advisor_readColumnMeta();\n   /*\n      advisor_readColumnMeta\
