                  \ the table containing timing log of the executed functions.  Default\
                  \ is advisorTimingLog (functional)\n*/\n/*-------------------------------------------------------------------------*/\n\
                  \nlogSeparator = \"============================================================\"\
                  ;\nstartDateTime = datetime();\n\nfunction logTimer(function);\n\
                  \   /*\n      logTimer() calculates the time a given function has\
                  \ run.\n   */\n   /* Current Duration */\n   timestamp = datetime()\
                  \ - startDateTimeDict[function];\n\n\n   /* Component Times */\n\
                  \   time_minutes = floor(timestamp / 60);\n   time_seconds = timestamp\
                  \ - (time_minutes * 60);\n\n   /* Format String */\n    return trim((String)\
                  \ time_minutes) || \" minutes \" || trim((String) time_seconds)\
                  \ || \" seconds\";\n\nend logTimer;\n\nfunction logHeader(function);\n\
                  \   /*\n      logHeader() prints the beginning of a function log\n\
                  \n      Arguments:\n      1. function (String) - name of function\n\
                  \   */\n   advisor_initializeGlobal('startDateTimeDict', {});\n\n\
                  \   startDateTimeDict[function] = datetime();\n\n   if debug then\
                  \ do;\n      print \"\";\n      print logSeparator;\n      print\
