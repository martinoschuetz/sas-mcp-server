      description: Updates project models according to the required 'action' query
        parameter
      operationId: updateProjectModels
      parameters:
      - name: projectId
        in: path
        description: The id of the project
        required: true
        schema:
          type: string
      - name: action
        in: query
        description: Currently only the unpin action is supported. If a model is a
          champion model, unpinning it will cause it to be updated so that it no longer
          appears as user-created or as the overriding project champion. If a model
          is a challenger model, unpinning it will cause it to be deleted.
        required: true
        schema:
          type: string
