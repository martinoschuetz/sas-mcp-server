                  \               = '',\n       weightname             = '',\n   \
                  \    partname               = '',\n       keyname              \
                  \  = ''\n   };\n\n   do var, val over optionGlobals;\n      if debug\
                  \ then do;\n         print \"Global Option Variable: \" var \" Value:\
