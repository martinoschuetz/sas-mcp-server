                  \      rc = advisor_validateVariable(gvar);\n      if rc then return\
                  \ True;\n   end;\n\n   optionGlobals = {\n       retrain       \
                  \         = False,\n       globalmeta             = '',\n      \
                  \ useGlobalMeta          = False,\n       advisorType          \
                  \  = \"ADVANCED\",\n       maxClassLevels         = 20,\n      \
                  \ intervalCutoff         = 20,\n       applyMaxPercentMissing =\
                  \ True,\n       maxPercentMissing      = 50,\n       maxCardLevel\
                  \           = 254,\n       /* Used as cache for special roles when\
