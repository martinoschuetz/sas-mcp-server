    getModelScoringSampleCodeResponse:
      summary: Model scoring sample code text response
      description: Model scoring sample code in Python (the default langauge).
      value: >
        import requests

        url = "https://HOST:PORT/dataMining/projects/9d63e067-1644-4ea4-8155-2c1790da487b/models/330f4e5d-c940-4816-820a-1c016d3fa70a/scoreExecutions"

