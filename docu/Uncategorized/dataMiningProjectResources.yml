                \n   /* Validate that the previous role is still valid */\n   if oldrole\
                \ in {'FREQ', 'WEIGHT', 'PARTITION', 'KEY'} then do;\n      select(oldrole);\n\
                \         when('FREQ')      advisor_validateFreq();\n         when('WEIGHT')\
