                \ {'name',    'role',    'level',    'comment',  'type',    'vartype',\
                \ 'format',  'formattype', 'informat', 'label',   'index',   'indextype',\
                \ 'length', 'fmtlength', 'order',   'transform', 'impute',  'lowerlimit',\
                \ 'upperlimit', 'impconstchar', 'impconstnumb', 'assess_bias_flg',\
                \ 'resourceId', 'id',\n                        'nlevel', 'nlevelmsg',\
                \ 'nobs', 'sumfreqs', 'nmiss', 'min',    'max',      'mean',   'stddev',\
                \ 'skewness', 'kurtosis', 'pctmiss',\n                        'rootname',\
                \ 'creator', 'family', 'distribution', 'levelpct1', 'levelpct2'};\n\
                \   cmColumnTypes = {'varChar', 'varChar', 'varChar',  'varChar',\
                \  'varChar', 'varChar', 'varChar', 'varChar',    'varChar',  'varChar',\
                \ 'varChar', 'varChar',   'int64',  'int64',     'varChar', 'varChar',\
                \   'varChar', 'double',     'double',     'varChar',      'double',\
                \       'varChar',          'varChar',    'varChar'\n            \
                \            'int64',  'varChar',   'int64', 'double',  'int64', 'double',\
                \ 'double'  , 'double', 'double', 'double',   'double',   'double',\n\
                \                        'varchar',  'varChar', 'varChar', 'varChar',\
                \     'double',    'double'};\n   columnmetaTbl = newtable(metadata,\
                \ cmColumns, cmColumnTypes);\n\n   if debug then do;\n      describe\
                \ resultDict[\"basicColumnInfo\"];\n\n      if advisorType eq \"ADVANCED\"\
                \ then do;\n         describe resultDict[\"metaStatistics\"];\n  \
                \    end;\n\n      if useGlobalMeta then do;\n         describe resultDict[\"\
                globalMeta\"];\n      end;\n   end;\n\n   attributeDict[\"freqCount\"\
                ] = 0;\n   attributeDict[\"weightCount\"] = 0;\n\n   /* Loop over\
                \ every variable in the column info table and determine the associated\
                \  attributes */\n   do basicrow over resultDict[\"basicColumnInfo\"\
