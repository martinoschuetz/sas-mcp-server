                  \ / caslib=projectCaslib name=tablemeta ;\n   if st_svtablemeta['severity']\
                  \ = 2 then do;\n      print (error) 'Could not create the tablemeta\
                  \ table.';\n      return True;\n   end;\n   if r_svtablemeta.exists\
                  \ = 0 then do;\n      print (error) 'Could not create the tablemeta\
                  \ table.';\n      return True;\n   end;\n\n   logFooter(\"advisor_makeTablemeta\"\
                  );\nend advisor_makeTablemeta;\n\nfunction advisor_validateVarAttrs();\n\
                  \   /*\n      advisor_validateVarAttrs check if any variable name\
                  \ exceed 32 bytes.\n   */\n\n   logHeader(\"advisor_validateVarAttrs\"\
                  );\n\n   invalidNames = '';\n   varbinaryFlag = false;\n   r_columnInfo\
                  \ = resultDict[\"basicColumnInfo\"];\n   do basicrow over r_columnInfo['ColumnInfo'];\n\
                  \      varname = ktrim(basicrow['Column']);\n      if ktrim(basicrow[\"\
                  Type\"]) = 'varbinary' then\n         varbinaryFlag = true;\n  \
                  \    if length(varname) > 32 then\n         invalidNames = invalidNames\
                  \ ||\" '\"|| varname||\"'\";\n   end;\n   if invalidNames ne ' '\
                  \ then do;\n      print (error) 'The following variable name(s)\
                  \ exceed the 32-byte limit: ' invalidNames;\n   end;\n\n   if varbinaryFlag\
                  \ then do;\n      print (error) ' The project metadata cannot be\
                  \ generated because there exists at least one varbinary variable.\
                  \ Varbinary variables are not supported.';\n   end;\n\n   if invalidNames\
                  \ ne ' '  or varbinaryFlag then do;\n      return True;\n   end;\n\
                  \n   logFooter(\"advisor_validateVarAttrs\");\n\n   return False;\n\
                  \nend advisor_validateVarAttrs;\n\nfunction advisor_getUserformats();\n\
                  \   /*\n      advisor_getUserformats check if any variable name\
                  \ exceed 32 bytes.\n   */\n\n   logHeader(\"advisor_getUserformats\"\
                  );\n\n   advisor_initializeGlobal('userformatList', {});\n\n   /*\
                  \ Retrieve the user formats available to the session */\n   sessionProp.listFmtLibs\
                  \ status=rc_formatList result = r_formatList/ showMemNames=True;\n\
                  \   if rc_formatList['severity'] = 2 then do;\n      print (error)\
                  \ 'Could not retrieve the list of user defined formats.';\n    \
                  \  return True;\n   end;\n\n   do fmtrow over r_formatList['listFmtLibs'];\n\
                  \      userFormatList = userformatList + {upcase(fmtrow['Format'])};\n\
                  \   end;\n   if debug then\n      print 'User defined formats: '\
                  \ userformatList;\n\n   logFooter(\"advisor_getUserformats\");\n\
                  \n   return False;\n\nend advisor_getUserformats;\n\nfunction advisor_getBasicAttributes();\n\
                  \   /*\n      advisor_getBasicAttributes retrieves the basic column\
                  \ attributes.\n   */\n\n   logHeader(\"advisor_getBasicAttributes\"\
                  );\n\n   table.columninfo status=rc_colinfo result=r_columnInfo/\n\
                  \       table={name=inputTable, caslib=inputCaslib};\n   if rc_colinfo['severity']\
                  \ = 2 then do;\n      print (error) 'Could not retrieve the column\
                  \ attributes.';\n      return True;\n   end;\n\n   resultDict[\"\
                  basicColumnInfo\"] = r_columninfo;\n\n   /* Are there any column\
