                \      end;\n   end;\n   attributeDict[\"attributeVals\"][\"role\"\
                ] = newrole;\n\nend advisor_validateKey;\n\n\nfunction advisor_mergeOldMeta(omrow);\n\
                \   /*\n       advisor_mergeOldMeta merge the attributes from the\
                \ current (old) project metadata\n       with the metadata for the\
