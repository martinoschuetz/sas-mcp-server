                  \ */\n   if advisor_validateVarAttrs() then return True;\n\n   logFooter(\"\
                  advisor_getBasicAttributes\");\n\n   return False;\n\nend advisor_getBasicAttributes;\n\
                  \nfunction advisor_readGlobalMeta();\n   /*\n      advisor_readGlobalMeta\
                  \ read the global metadata table.\n   */\n\n   logHeader(\"advisor_readGlobalMeta\"\
                  );\n\n   /* Check if the global metadata  table exists */\n   table.tableExists\
                  \ result=r_gmeta status=st_gmeta /  caslib=projectCaslib name=globalmeta;\n\
                  \   if st_gmeta['severity'] = 2 then do;\n      print (error) 'Could\
                  \ not verify if the global metadata table exists';\n      return\
                  \ True;\n   end;\n   if r_gmeta.exists = 0 then do;\n      print\
                  \ (error) 'Could not verify if the global metadata table exists';\n\
                  \      return True;\n   end;\n\n   if debug then do;\n      print\
                  \ 'globalmeta: ' globalmeta;\n      describe r_gmeta;\n   end;\n\
                  \n   /* Read in the current global metadata table */\n   table.fetch\
                  \ result=r_gmeta status=st_gmeta /\n         maxrows = 100000\n\
                  \         to = 100000\n         table={\n            caslib=projectCaslib,\n\
                  \            name=globalmeta,\n            vars={'name', 'format',\
                  \ 'type', 'role', 'level', 'order', 'transform', 'impute', 'lowerlimit',\
                  \ 'upperlimit',\n                  'impconstchar', 'impconstnumb',\
                  \ 'assess_bias_flg'}\n         };\n         if st_gmeta['severity']\
                  \ = 2 then do;\n            print (error) 'Could not read the global\
                  \ metadata table.';\n            return True;\n         end;\n\n\
                  \   resultDict[\"globalMeta\"] = r_gmeta;\n\n   logFooter(\"advisor_readGlobalMeta\"\
                  );\n\n   return False;\n\nend advisor_readGlobalMeta;\n\nfunction\
                  \ advisor_makeStatmeta();\n   /*\n      advisor_makeStatmeta use\
                  \ CARDINALITY action to compute summary statistics.\n   */\n\n \
                  \  logHeader(\"advisor_makeStatmeta\");\n\n   /* Drop the outcard\
                  \ table if it exists */\n   table.dropTable /  caslib=projectCaslib\
                  \ name=\"outcard\" quiet=True;\n   table.dropTable /  caslib=projectCaslib\
                  \ name=\"outcard\" quiet=True;\n\n   cardinality.summarize status=st_cardmeta\
                  \ /\n      table={name=inputTable, caslib=inputCaslib}\n      cardinality={caslib=projectCaslib,\
                  \ name=\"outcard\"}\n      options={nLevels=maxCardLevel};\n\n \
                  \  if st_cardmeta['severity'] = 2 then do;\n      print (error)\
                  \ 'Could not calculate summary statistics.';\n      return True;\n\
                  \   end;\n\n   /* Read in the current statistics table */\n   table.fetch\
                  \ result=r_cardmeta status=st_cardmeta /\n         maxrows = 100000\n\
                  \         to =  100000\n         table={\n            caslib=projectCaslib,\n\
                  \            name=\"outcard\",\n            vars={'_varname_', '_more_',\
                  \ '_cardinality_', '_rlevel_', '_nmiss_', '_nobs_', '_sumfreqs_',\
                  \ '_min_', '_max_', '_stddev_', '_mean_', '_skewness_', '_kurtosis_'}\n\
                  \         };\n         if st_cardmeta['severity'] = 2 then do;\n\
                  \            print (error) 'Could not read the cardinality table.';\n\
                  \            return True;\n         end;\n\n   resultDict[\"metaStatistics\"\
                  ] = r_cardmeta;\n\n   logFooter(\"advisor_makeStatmeta\");\n\n \
                  \  return False;\n\nend advisor_makeStatmeta;\n\nfunction advisor_initializeAttributesVars(attrArrayName,\
                  \ type);\n   /*\n      advisor_initializeAttributesVars initialize\
                  \ the various metadata attributes with their default values.\n \
                  \  */\n\n   do _i = 1 to dim(attrArrayName);\n      attrname = attrArrayName[_i];\n\
                  \      select(attrname);\n         when('assess_bias_flg') attributeDict[\"\
                  attributeVals\"][\"assess_bias_flg\"] = 'N';\n         when('indexType')\
                  \ attributeDict[\"attributeVals\"][\"indexType\"] = 'NONE';\n  \
                  \       when('role') attributeDict[\"attributeVals\"][\"role\"]\
                  \ = 'INPUT';\n         otherwise do;\n            if type = 'num'\
                  \ then do;\n               attributeDict[\"attributeVals\"][attrname]\
                  \ = .;\n            end;\n            else do;\n               attributeDict[\"\
                  attributeVals\"][attrname] = '';\n            end;\n         end;\n\
                  \      end;\n   end;\n\nend advisor_initializeAttributesVars;\n\n\
                  function advisor_setAttributeDefaults();\n   /*\n       advisor_setAttributeDefaults\
                  \ initializes variables associated with the column meta columns.\n\
                  \   */\n\n   do attrArray, attrType over attributeDict[\"attributeType\"\
                  ];\n      advisor_initializeAttributesVars(attributeDict[attrArray],\
                  \ attrType);\n   end;\n\nend advisor_setAttributeDefaults;\n\nfunction\
                  \ advisor_setBasicAttributes(rowcolinfo);\n   /*\n      advisor_setBasicAttributes\
                  \ initializes the basic attributes for a variable\n            \
                  \                     based on the column information\n\n      \
                  \  Arguments:\n        1. rowcolinfo (Dictionary) - a single row\
                  \ of the column information result set\n   */\n\n   varname    \
                  \     = ktrim(rowcolinfo[\"Column\"]);\n   vartype         = trim(rowcolinfo[\"\
                  Type\"]);\n\n   type   = 'N';\n   if upcase(vartype) in {'VARCHAR',\
                  \ 'CHAR', 'VARBINARY'} then type = 'C';\n\n   rawlength       =\
                  \ rowcolinfo[\"RawLength\"];\n   formattedlength = rowcolinfo[\"\
                  FormattedLength\"];\n   format          = ktrim(rowcolinfo[\"Format\"\
                  ]);\n   label           = ktrim(rowcolinfo[\"Label\"]);\n\n   /*\
                  \ Identify the format Type */\n   formatType = ' ';\n   if (missing(format)\
                  \ eq 0) then do;\n      formatType =upcase(fmtinfo(format, 'CAT'));\n\
                  \n       /* Is it a user defined format */\n       if strip(formatType)\
                  \ eq  'FMTNAME NOT FOUND' then do;\n          if upcase(format)\
                  \ in userformatList then formatType = 'USER';\n       end;\n   end;\n\
                  \n   /* Process the format */\n   nfl = rowcolinfo['NFL'];\n   nfd\
                  \ = rowcolinfo['NFD'];\n   if nfl > 0 then do;\n      if format\
                  \ ne '' then do;\n         if type='N' then format = strip(format)||strip((string)nfl)||'.'||strip((string)nfd);\n\
                  \         else format = strip(format)||strip((string)nfl)||'.';\n\
                  \      end; else do; /* Fix for DMINE-8451 */\n         if type\
                  \ = 'N' then format = strip((string)nfl)||'.'||strip((string)nfd);\n\
                  \         else format = '$'||strip((string)nfl)||'.';\n      end;\n\
                  \   end; else do;\n      if format ne '' then do;\n         format\
                  \ = strip(format)||'.';\n      end;\n   end;\n\n   if type  eq 'N'\
                  \ then level = 'INTERVAL';\n   else level = 'NOMINAL';\n\n   attributeDict[\"\
                  attributeVals\"][\"varName\"]         = varName;\n   attributeDict[\"\
                  attributeVals\"][\"varType\"]         = varType;\n   attributeDict[\"\
                  attributeVals\"][\"type\"]            = type;\n   attributeDict[\"\
                  attributeVals\"][\"rawlength\"]       = rawlength;\n   attributeDict[\"\
                  attributeVals\"][\"format\"]          = format;\n   attributeDict[\"\
                  attributeVals\"][\"formattedlength\"] = formattedlength;\n   attributeDict[\"\
                  attributeVals\"][\"formatType\"]      = formatType;\n   attributeDict[\"\
                  attributeVals\"][\"level\"]           = level;\n   attributeDict[\"\
                  attributeVals\"][\"label\"]           = label;\n\n   /* By default\
                  \ DATE/TIME/DATETIME variables are REJECTED */\n   if formatType\
                  \ in {'DATE', 'TIME', 'DATETIME'} then\n      attributeDict[\"attributeVals\"\
                  ][\"role\"]         = 'REJECTED';\n\n   if debug then\n       print\
                  \ 'Name: ' varName '  Type: ' type ' varType: ' varType ' Length:\
                  \ ' rawlength 'Fmt Length: ' formattedlength ' format: ' format:\
                  \ ' format type: ' formatType ' label: ' label ;\n\nend advisor_setBasicAttributes;\n\
                  \nfunction advisor_setAttributesBasedOnName();\n   /*\n       advisor_setAttributesBasedOnName\
                  \ modify the current attributes in attributeVals (current)\n   \
                  \    variable based on the name and name prefix rules.\n   */\n\n\
                  \   freqCount   = attributeDict[\"freqCount\"];\n   weightCount\
                  \ = attributeDict[\"weightCount\"];\n\n   /* Get the current attributes\
                  \ */\n   uname     = upcase(attributeDict[\"attributeVals\"][\"\
                  varName\"]);\n   role      = attributeDict[\"attributeVals\"][\"\
                  role\"];\n   type      = attributeDict[\"attributeVals\"][\"type\"\
                  ];\n   level     = attributeDict[\"attributeVals\"][\"level\"];\n\
                  \   rawlength = attributeDict[\"attributeVals\"][\"rawlength\"];\n\
                  \   comment   = attributeDict[\"attributeVals\"][\"comment\"];\n\
                  \n   if exists(attributeNameDict[\"dictnameList\"],uname) then do;\n\
                  \      role = trim(attributeNameDict[\"dictnameList\"][uname]['ROLE']);\n\
                  \      level = trim(attributeNameDict[\"dictnameList\"][uname]['LEVEL']);\n\
                  \      if  exists(attributeNameDict[\"dictnameList\"][uname],'COMMENT')\
                  \ then comment = trim(attributeNameDict[\"dictnameList\"][uname]['COMMENT']);\n\
                  \   end; else do;\n      uname_prefix = scan(uname, 1, '_');\n \
                  \     if scan(uname, 2, '_') = '' then uname_prefix='';\n\n    \
                  \  if exists(attributeNameDict[\"dictprefixList\"],uname_prefix)\
                  \ then do;\n         role  = trim(attributeNameDict[\"dictprefixList\"\
                  ][uname_prefix]['ROLE']);\n         level = trim(attributeNameDict[\"\
                  dictprefixList\"][uname_prefix]['LEVEL']);\n      end; else do;\n\
                  \         do rolekey, rolevalue over attributeNameDict[\"dictroleList\"\
                  ];\n            if index(uname, rolekey)=1 then do;\n          \
                  \     role = trim(rolevalue['ROLE']);\n               if exists(rolevalue,'LEVEL')\
                  \ then\n                 level = trim(rolevalue['LEVEL']);\n   \
                  \            leave;\n            end;\n         end;\n      end;\n\
                  \n      /* Does the variable name ends with _ID */\n      if length(uname)>2\
                  \  then do;\n         if substr(reverse(ktrim(uname)), 1, 3) = 'DI_'\
                  \ then do;\n            role = 'ID';\n            level = 'NOMINAL';\n\
                  \         end;\n      end;\n   end;\n\n   if rawlength > 80 then\
                  \ role = 'TEXT';\n   else if role in {'FREQ', 'WEIGHT'} then do;\n\
                  \      if type = 'C' then role = 'INPUT';\n      else do;\n    \
                  \     if freqcount then role = 'REJECTED';\n         else freqCount\
                  \ = 1;\n         if weightCount then role = 'REJECTED';\n      \
                  \   else weightCount = 1;\n      end;\n   end;\n\n   /* Update the\
                  \ attributes */\n   attributeDict[\"attributeVals\"][\"role\"] \
                  \   = role;\n   attributeDict[\"attributeVals\"][\"level\"]   =\
                  \ level;\n   attributeDict[\"attributeVals\"][\"comment\"] = comment;\n\
                  \n   /* Update the freq and weight counts */\n   attributeDict[\"\
                  freqCount\"]   = freqCount;\n   attributeDict[\"weightCount\"] =\
                  \ weightCount;\n\nend advisor_setAttributesBasedOnName;\n\nfunction\
                  \ advisor_resetFreqWeightCount(role);\n   /*\n      advisor_resetFreqWeightCount\
                  \ reset the FREQ or WEIGHT count to 0.  This function\n      is\
                  \ called if the associated variable is not a valid FREQ or WEIGHT\
                  \ variable.\n   */\n\n   select(role);\n      when('FREQ') attributeNameDict[\"\
                  freqCount\"] = 0;\n      when('WEIGHT') attributeNameDict[\"weightCount\"\
                  ] = 0;\n      otherwise;\n   end;\n\nend advisor_resetFreqWeightCount;\n\
                  \n\nfunction advisor_setAttributesBasedOnStats();\n   /*\n     \
                  \  advisor_setAttributesBasedOnStats modify the current attributes\
                  \ in attributeVals (current)\n       variable based on the summary\
                  \ statistics.\n   */\n   varname = attributeDict[\"attributeVals\"\
                  ][\"varName\"];\n   statrow = resultDict[\"metaStatistics\"]['Fetch'].where(_VARNAME_\
                  \ = ktrim(varname))[1];\n\n   role       = attributeDict[\"attributeVals\"\
                  ][\"role\"];\n   level      = attributeDict[\"attributeVals\"][\"\
                  level\"];\n   type       = attributeDict[\"attributeVals\"][\"type\"\
                  ];\n   comment    = attributeDict[\"attributeVals\"][\"comment\"\
                  ];\n   formatType = attributeDict[\"attributeVals\"][\"formatType\"\
                  ];\n\n   if debug then do;\n      print ' ';\n      print 'Statistics\
                  \ Meta:' ' Varname: ' varname ' Values: ' statrow;\n      print\
                  \ ' ';\n   end;\n\n   nlevel     = statrow[\"_cardinality_\"];\n\
                  \   _more_     = statrow[\"_more_\"];\n   _min_      = statrow[\"\
