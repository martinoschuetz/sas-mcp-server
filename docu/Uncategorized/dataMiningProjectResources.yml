                  \ = resultDict[\"oldColumnMeta\"]['Fetch'].where(upcase(NAME )=\
                  \ ktrim(varname) and TYPE = trim(type) and FORMAT = trim(format));\n\
                  \   if oldmetarow.nrows eq 0 then do;\n      if attributeDict[\"\
                  attributeVals\"][\"role\"] in {'TARGET', 'FREQ', 'WEIGHT', 'PARTITION',\
