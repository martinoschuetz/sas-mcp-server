                  \ initialized.\";\n      return True;\n   end;\n\nend advisor_validateVariable;\n\
                  \nfunction advisor_initializeGlobal(symbol, value);\n    /*\n  \
                  \      initializeGlobal() defines the symbol globally if it doesn't\
