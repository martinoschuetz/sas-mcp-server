                  \   };\n\n   if debug then\n      print 'dictprefixList: ' dictprefixList;\n\
                  \n   dictroleList ={\n      ASSESS         = {'ROLE'='ASSESS', \
                  \        'LEVEL'='INTERVAL'},\n      CLASSIFICATION = {'ROLE'='CLASSIFICATION',\
                  \ 'LEVEL'='NOMINAL'},\n      ID             = {'ROLE'='ID',    \
                  \         'LEVEL'='NOMINAL'},\n      INPUT          = {'ROLE'='INPUT'},\n\
                  \      PREDICT        = {'ROLE'='PREDICT'},\n      REJECTED    \
