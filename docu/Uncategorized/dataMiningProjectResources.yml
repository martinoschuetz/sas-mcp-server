                \      take the longest and identify possible bottlenecks */\n   global\
                \ timingLogTbl ;\n   setTimingLog();\n\n   logHeader(\"advisor_main\"\
                );\n\n   /* Check the expected global variables */\n   if advisor_validateGlobalVars()\
                \ then return True;\n\n   /* Make sure the projectcaslib is the active\
