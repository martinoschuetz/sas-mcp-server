                  \          execute(attrname || \" = '\"|| tranwrd(attrvalue, \"\
                  '\", \"''\") ||\"';\");\n         end;\n         else do;\n    \
                  \        execute(attrname || \" = \"|| attrvalue ||\";\");\n   \
                  \      end;\n      end;\n\n      rootname     =  varname;\n    \
                  \  creator      = '';\n      family       = '';\n      distribution\
                  \ = '';\n      levelpct1    = .;\n      levelpct2    =.;\n\n   \
                  \  if debug then do;\n        print 'Name: ' varName ' Role: ' role\
                  \  ' Level: ' level  ' Commment: ' comment;\n        print 'Type:\
                  \ ' type ' VarType: ' vartype ' Format: ' format ' Format Type:\
                  \ ' formatType 'Informat: ' informat;\n        print 'Label: ' label\
                  \ ' Index: ' index ' indexType: ' indextype ' Length: ' rawlength\
