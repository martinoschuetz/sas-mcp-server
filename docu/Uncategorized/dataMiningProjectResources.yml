                  \   /*\n      setTimingLog() set up the table that will contain\
                  \ timing log\n   */\n   advisor_initializeGlobal('timingLog', 'advisorTimingLog');\n\
                  \   if missing(timingLog) ne 0 then timingLog = 'advisorTimingLog';\n\
                  \n   /* Drop twice in case it's in global scope */\n   table.dropTable\
                  \ /  caslib=projectCaslib name=timingLog quiet=True;\n   table.dropTable\
                  \ /  caslib=projectCaslib name=timingLog quiet=True;\n   timingLogTbl\
                  \ = newtable(timinglog, { 'Function', 'Duration'}, { 'varChar',\
                  \ 'varChar'});\n\nend setTimingLog;\n\nfunction advisor_validateVariable(advisorVar);\n\
                  \   /*\n      advisor_validateVariable checks if a global variable\
                  \ has been defined and has\n      been assigned a (non-blank) value.\n\
                  \n        Arguments:\n        1. advisorVar (String) - name of global\
