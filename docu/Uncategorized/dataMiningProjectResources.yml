                  \ result=r_svmeta status=st_svmeta / caslib=projectCaslib name=metadata\
                  \ ;\n   if st_svmeta['severity'] = 2 then do;\n      print (error)\
                  \ 'Could not create the metadata table.';\n      return True;\n\
