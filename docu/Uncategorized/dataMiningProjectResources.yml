                \ = 'FREQ');\n   if varrow.nrows  then do;\n      freqname = varrow[1,\
                \ \"Name\"];\n   end;\n   varrow = resultDict[\"oldColumnMeta\"]['Fetch'].where(ROLE\
                \ = 'WEIGHT');\n   if varrow.nrows  then do;\n      weightname = varrow[1,\
                \ \"Name\"];\n   end;\n   varrow = resultDict[\"oldColumnMeta\"]['Fetch'].where(ROLE\
                \ = 'PARTITION');\n   if varrow.nrows  then do;\n      partname =\
                \ varrow[1, \"Name\"];\n   end;\n   varrow = resultDict[\"oldColumnMeta\"\
                ]['Fetch'].where(ROLE = 'KEY');\n   if varrow.nrows  then do;\n  \
                \    keyname = varrow[1, \"Name\"];\n   end;\n\n   logFooter(\"advisor_fetchOldmetaRoles\"\
                );\n\n   return False;\n\nend advisor_fetchOldmetaRoles;\n\nfunction\
                \ advisor_main();\n   /* Set debug to False if not specified by the\
