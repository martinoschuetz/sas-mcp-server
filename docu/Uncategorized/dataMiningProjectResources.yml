                  \ }) then do;\n         attributeDict[\"attributeVals\"][\"role\"\
                  ] = oldrole;\n         attributeDict[\"attributeVals\"][\"comment\"\
                  ] = oldcomment;\n      end; else do;\n         /* Use the current\
                  \ role based on the new data */\n      end;\n   end;\n   else do;\n\
                  \      /* Check if the current advisor rejected the variable based\
                  \ on stats but did not based on the old stats. */\n      if comment\
                  \ in { 'report.metadata_variable_toomanylevels.txt', 'report.metadata_variable_allmissing.txt',\n\
                  \                      'report.metadata_variable_constant.txt',\
                  \ 'report.metadata_variable_toomanymissings.txt' }\n         and\
                  \ ^(oldcomment in { 'report.metadata_variable_toomanylevels.txt',\
                  \ 'report.metadata_variable_allmissing.txt',\n                 \
                  \              'report.metadata_variable_constant.txt', 'report.metadata_variable_toomanymissings.txt'\
                  \ })\n         then do;\n         /* Use the current role based\
                  \ on the new data */\n      end; else do; /* Use the previous role\
                  \ and comment */\n         attributeDict[\"attributeVals\"][\"role\"\
                  ] = oldrole;\n         attributeDict[\"attributeVals\"][\"comment\"\
                  ] = oldcomment;\n      end;\n   end;\n\nend advisor_mergeOldMeta;\n\
                  \nfunction advisor_setAttributesBasedRetrain();\n   /*\n       advisor_setAttributesBasedOnRetrain\
                  \ modify the attributes of the current variables in attributeVals\n\
                  \       based on the previous column metadata.\n   */\n   varname\
