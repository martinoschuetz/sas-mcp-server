                  \ - Variable whose existance to check for\n        2. value (Any)\
                  \ - value to initialize variable to\n    */\n    if !exists(symbol)\
                  \ then do;\n        execute(\"global \" || symbol || \";\");\n \
                  \       execute(symbol || \" = value;\");\n    end;\n\n   if debug\
                  \ then do;\n      execute(\"print \" || symbol ||\";\");\n   end;\n\
                  \nend advisor_initializeGlobal;\n\nfunction advisor_validateGlobalVars();\n\
                  \   /*\n      advisor_validateGlobalVars checks if the expected\
                  \ global variables\n      have been defined and assigned values.\n\
                  \   */\n\n   logHeader(\"advisor_validateGlobalVars\");\n\n   globalvars\
