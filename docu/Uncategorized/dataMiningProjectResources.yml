                  ]    = dmCharAttrs;\n   attributeDict[\"statAttrs\"]      = statAttrs;\n\
                  \   attributeDict[\"attributeVals\"]  = attributeVals;\n\n   advisor_initializeGlobal('resultDict',\
                  \ {}); /* This dictionary will contain the various result sets */\n\
                  \n   if debug then do;\n      describe 'attributeNameDict: ' attributeNameDict;\n\
                  \      describe 'attributDict: ' attributeDict;\n      describe\
