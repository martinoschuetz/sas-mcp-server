                  \ end;\n\n   resultDict[\"oldColumnMeta\"] = r_oldmeta;\n\n   logFooter(\"\
                  advisor_readColumnMeta\");\n\n   return False;\n\nend advisor_readColumnMeta;\n\
                  \nfunction advisor_fetchOldmetaRoles();\n   /*\n      advisor_fetchOldmetaRoles\
