                \ Char: ' impconstchar  ' Imp Const Numb: ' impconstnumb  ' Assess\
                \ Bias_ Flag: ' assess_bias_flg;\n        print 'Nlevel: ' _cardinality_\
                \ ' NlevelMsg: ' nlevelmsg ' Nobs: ' _nobs_ ' Sum Freqs: ' _sumfreqs_\
                \  ' Nmiss: ' _nmiss_ ' Min: ' _min_ ' Max: ' _max_;\n        print\
