---
openapi: 3.0.3
info:
  description: The Project Resources API allows access to the resources that are a
    part of a Visual Data Mining and Machine Learning project. For SAS Advanced Analytics
    Internal use ONLY.
  version: "3"
  title: Data Mining Project Resources
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: https://support.sas.com/techsup/license/index.html
tags:
- name: AnalyticsProviderDetails
  description: Provides information to an analytics provider gateway when registering
    as an analytics provider.
- name: DataSource
  description: Contains the operations for working with tables in the project data
    source.
- name: Documents
  description: Contains the operations for working with Natural language documents.
- name: MacroVariables
  description: Contains the operations for managing macro variables.
- name: Models
  description: Contains the operations for managing data mining models.
- name: Pipelines
  description: Contains the operations for managing data mining pipelines.
- name: Projects
  description: Contains the operations for managing data mining projects.
- name: ProjectResources
  description: Contains the operations for working with various project-related resources.
- name: Retraining
  description: Contains the operations for data mining project retraining.
- name: Root
  description: Contains the operations for the root resource.
- name: Components
  description: Contains the operations for managing analytics components within data
    mining projects.
- name: Generative AI
  description: Contains the operations for managing generative AI jobs.
- name: Enumerations
  description: Provides the enumerations.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a collection of all currently-usable links
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getProjectResourcesRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getProjectResourcesRootResponse"
  /analyticsProviderDetails:
    head:
      tags:
      - AnalyticsProviderDetails
      summary: Get headers for the analytics provider details request
      description: Get headers for the analytics provider details request
      operationId: headersForAnalyticsProvider
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
    get:
      tags:
      - AnalyticsProviderDetails
      summary: Get the analytics provider details
      description: A required endpoint when registering as an analytics provider with
        the Analytics Gateway.  The response provides details about the provider and
        the types of analytics projects that the provider can handle.
      operationId: getAnalyticsProvider
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyticsProviderDetails"
              examples:
                json:
                  $ref: '#/components/examples/getAnalyticProviderDetailsResponse'
  /enumerations:
    get:
      tags:
      - Enumerations
      summary: Get the enumeration groups
      description: |
        Gets enumerations that are specific to the data mining workflow as well as a localized value that can be displayed in the current user's locale.
        This endpoint returns a resource collection of type enumerationGroup.
        It can be accessed by the
        GET /dataMiningProjectResources/enumerations endpoint.
      operationId: getEnumerationsResponse
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/enumerationGroup"
              examples:
                json:
                  $ref: "#/components/examples/getEnumerationsResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/enumerationGroup"
              examples:
                json:
                  $ref: "#/components/examples/getEnumerationsResponse"
  /documents/@document:
    head:
      tags:
      - Documents
      summary: Returns a document that matches the values provided in the required
        query parameters
      description: Allows retrieval of a specific document
      operationId: headersForSingleDocumentWithFilter
      parameters:
      - name: resourceId
        in: query
        description: The id of the resource for which the document was created
        required: true
        schema:
          type: string
      - name: templateId
        in: query
        description: The id of the template used to generate the document
        required: true
        schema:
          type: string
      - name: reportName
        in: query
        description: The name of the report for which the document was created
        required: true
        schema:
          type: string
      - name: reportOrder
        in: query
        description: The order number for the report for which the document was created
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
        "400":
          description: The required parameters were not provided on the request.
        "404":
          description: The requested document could not be found.
    get:
      tags:
      - Documents
      summary: Returns a document that matches the values provided in the required
        query parameters
      description: Allows retrieval of a specific document
      operationId: getSingleDocumentWithFilter
      parameters:
      - name: resourceId
        in: query
        description: The id of the resource for which the document was created
        required: true
        schema:
          type: string
      - name: templateId
        in: query
        description: The id of the template used to generate the document
        required: true
        schema:
          type: string
      - name: reportName
        in: query
        description: The name of the report for which the document was created
        required: true
        schema:
          type: string
      - name: reportOrder
        in: query
        description: The order number for the report for which the document was created
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/document'
              examples:
                json:
                  $ref: '#/components/examples/getSingleDocumentResponse'
            application/vnd.sas.cognitive.natural.language.generation.document+json:
              schema:
                $ref: '#/components/schemas/document'
              examples:
                json:
                  $ref: '#/components/examples/getSingleDocumentResponse'
        "400":
          description: The required parameters were not provided on the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getSingleDocument400Response'
            application/vnd.sas.cognitive.natural.language.generation.document+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getSingleDocument400Response'
        "404":
          description: The requested document could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getSingleDocument404Response'
            application/vnd.sas.cognitive.natural.language.generation.document+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getSingleDocument404Response'
  /macroVariables:
    head:
      tags:
      - MacroVariables
      summary: Get headers for the variable list
      description: Retrieve headers for the MacroVariableList Object (a set of lists
        of localized values) for data mining.
      operationId: headersForMacroVariableList
      parameters:
      - name: codeEditorLanguage
        in: query
        description: The language filter.
        required: false
        schema:
          type: string
          default: SAS
          enum:
          - sas
          - SAS
          - r
          - R
          - py
          - python
          - Python
          - score
          - Score
          - batch
          - Batch
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
        '400':
          description: The request was invalid.
    get:
      tags:
      - MacroVariables
      summary: Get the variable list
      description: Retrieve the MacroVariableList Object (a set of lists of localized
        values) for data mining.
      operationId: getMacroVariableList
      parameters:
      - name: codeEditorLanguage
        in: query
        description: The language filter.
        required: false
        schema:
          type: string
          default: SAS
          enum:
          - sas
          - SAS
          - r
          - R
          - py
          - python
          - Python
          - score
          - Score
          - batch
          - Batch
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.macro.variable.list+json:
              schema:
                $ref: '#/components/schemas/macroVariableList'
              examples:
                json:
                  $ref: "#/components/examples/getMacroVariablesResponse"
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.analytics.macro.variable.list+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getMacroVariables400Response"
  /projects:
    get:
      x-sas-internal: true
      tags:
      - Projects
      summary: Get data mining projects related to a certain model
      description: Get the data mining projects that match the target information
        of the given Common Model Repository model.
      operationId: getProjectsMatchingCMRModelTarget
      parameters:
      - name: start
        in: query
        description: start
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: sortBy
        required: false
        schema:
          type: string
      - name: registeredModelUri
        in: query
        description: registeredModelUri
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analyticsProjectCollection'
              examples:
                default:
                  $ref: "#/components/examples/getProjectsResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/analyticsProjectCollection'
              examples:
                default:
                  $ref: "#/components/examples/getProjectsResponse"
        '400':
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/getProjectsResponseBadRequest"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/getProjectsResponseBadRequest"
  /projects/{projectId}:
    post:
      x-sas-internal: true
      tags:
      - Projects
      summary: Retry creating the project
      description: This endpoint attempts to create the project if the initial attempt
        failed.
      operationId: retryProjectCreation
      parameters:
      - name: projectId
        in: path
        description: The ID of the project
        required: true
        schema:
          type: string
      - name: action
        in: query
        required: true
        description: The retry project creation action
        schema:
          type: string
          enum:
          - retryProjectCreation
          default: retryProjectCreation
      responses:
        '202':
          description: Accepted
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyticsProject"
              examples:
                json:
                  $ref: "#/components/examples/retryProjectCreationResponse"
            application/vnd.sas.analytics.project+json:
              schema:
                $ref: "#/components/schemas/analyticsProject"
              examples:
                json:
                  $ref: "#/components/examples/retryProjectCreationResponse"
        '400':
          description: The request to retry project creation is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/retryProjectCreationBadRequestResponse"
            application/vnd.sas.analytics.project+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/retryProjectCreationBadRequestResponse"
        '404':
          description: The specified project does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/retryProjectCreationNotFoundResponse"
            application/vnd.sas.analytics.project+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/retryProjectCreationNotFoundResponse"
  /projects/{projectId}/dataPlan:
    head:
      tags:
      - Projects
      summary: Get headers for the data plan request
      description: Get headers for the data plan request
      operationId: headersForDataPlan
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
        '404':
          description: Cannot find a data plan for this project.
    get:
      tags:
      - Projects
      summary: Get data mining project data management plan
      description: The response object contains the data management plan that is used
        with the project.
      operationId: getDataPlan
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/plan'
              examples:
                json:
                  $ref: '#/components/examples/getProjectDataPlanResponse'
            application/vnd.sas.data.plan+json:
              schema:
                $ref: '#/components/schemas/plan'
              examples:
                json:
                  $ref: '#/components/examples/getProjectDataPlanResponse'
        '404':
          description: Cannot find a data plan for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectDataPlan404Response'
            application/vnd.sas.data.plan+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectDataPlan404Response'
  /projects/{projectId}/dataSources/@defaultDataSource/sources:
    head:
      tags:
      - DataSource
      summary: Get headers for project data source request
      description: Get headers for project data source request
      operationId: headersForDefaultDataSourceSources
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - description: The starting index of the first item in a page.
        in: query
        name: start
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: Maximum number of items to return in this page of results. The
          actual number of returned items may be less if the collection has been exhausted.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - description: The ID of a CAS session to use for the request.
        in: query
        name: sessionId
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
        '404':
          description: The specified project does not exist.
    get:
      tags:
      - DataSource
      summary: Retrieve the list of sources for the project data source
      description: Retrieve the list of sources for the project data source.
      operationId: getDefaultDataSourceSources
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - description: The starting index of the first item in a page.
        in: query
        name: start
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: Maximum number of items to return in this page of results. The
          actual number of returned items may be less if the collection has been exhausted.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - description: The ID of a CAS session to use for the request.
        in: query
        name: sessionId
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/resourceAttributesCollection'
              examples:
                json:
                  $ref: '#/components/examples/getProjectDefaultDataSourcesResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/resourceAttributesCollection'
              examples:
                json:
                  $ref: '#/components/examples/getProjectDefaultDataSourcesResponse'
        '404':
          description: The specified project does not exist.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectDefaultDataSources404Response'
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectDefaultDataSources404Response'
  /projects/{projectId}/jobs:
    head:
      tags:
      - Projects
      summary: Get headers for project jobs request
      description: Get headers for project jobs request
      operationId: headersForJobMap
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
        '404':
          description: The specified project does not exist.
    get:
      tags:
      - Projects
      summary: Get the map of jobs associated with the project
      description: The response object contains a map of jobs that are keyed by the
        job type.
      operationId: getJobMap
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/projectJobMap'
              examples:
                json:
                  $ref: '#/components/examples/getProjectJobsResponse'
            application/vnd.sas.analytics.data.mining.project.job.map+json:
              schema:
                $ref: '#/components/schemas/projectJobMap'
              examples:
                json:
                  $ref: '#/components/examples/getProjectJobsResponse'
        '404':
          description: The specified project does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectJobs404Response'
            application/vnd.sas.analytics.data.mining.project.job.map+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectJobs404Response'
  /projects/{projectId}/logs:
    head:
      tags:
      - Projects
      summary: Get headers for project logs request
      description: Get headers for project logs request
      operationId: headersForLogLinks
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceLinkCollection'
              examples:
                json:
                  $ref: '#/components/examples/getProjectLogsResponse'
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/resourceLinkCollection'
              examples:
                json:
                  $ref: '#/components/examples/getProjectLogsResponse'
        '404':
          description: The specified project does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectLogs404Response'
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectLogs404Response'
    get:
      tags:
      - Projects
      summary: Get the collection of links to log files for the project
      description: The response object contains a collection of named links to log
        files for the project.
      operationId: getLogLinks
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceLinkCollection'
              examples:
                json:
                  $ref: '#/components/examples/getProjectLogsResponse'
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/resourceLinkCollection'
              examples:
                json:
                  $ref: '#/components/examples/getProjectLogsResponse'
        '404':
          description: The specified project does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectLogs404Response'
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectLogs404Response'
  /projects/{projectId}/tableGroups/tableRef:
    get:
      x-sas-internal: true
      tags:
      - Projects
      summary: Get the data table ref
      description: A TableRef referring to the source data table associated with the
        project.
      operationId: getDataTableRef
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
            Location:
              description: Location of the project TableRef
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tableRef"
              examples:
                json:
                  $ref: '#/components/examples/getProjectTableRef200Response'
            application/vnd.sas.analytics.table.ref+json:
              schema:
                $ref: "#/components/schemas/tableRef"
              examples:
                json:
                  $ref: '#/components/examples/getProjectTableRef200Response'
        '404':
          description: The specified project or its source data table could not be
            found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectTableRef404Response'
            application/vnd.sas.analytics.table.ref+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/getProjectTableRef404Response'
    post:
      x-sas-internal: true
      tags:
      - Projects
      summary: Save the table given the table URI
      description: A job that saves the table and the result of which includes the
        saved table uri is returned.
      operationId: saveProjectDataTable
      parameters:
      - name: projectId
        in: path
        description: The project ID
        required: true
        schema:
          type: string
      - name: sourceTableUri
        in: query
        description: The URI of the source table
        required: true
        schema:
          type: string
      - name: promote
        in: query
        description: If true, promote the table when it is saved
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/casSaveRequest'
            examples:
              default:
                $ref: "#/components/examples/saveComponentOutputTable"
          application/vnd.sas.cas.table.save.request+json:
            schema:
              $ref: '#/components/schemas/casSaveRequest'
            examples:
              default:
