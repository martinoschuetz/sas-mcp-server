                  \ and its previous attributes */\n   targetName    = '';\n   targetvartype\
                  \ = '';\n   targetfmt     = '';\n   varrow = resultDict[\"oldColumnMeta\"\
                  ]['Fetch'].where(ROLE = 'TARGET');\n   if varrow.nrows eq 0 then\
                  \ do;\n      print (warn) 'Could not find the project target in\
