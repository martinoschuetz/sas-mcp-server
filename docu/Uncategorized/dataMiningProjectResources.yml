                  \ 'CRDATE: ' crdate ' MODDATE: ' moddate 'RESOURCEID: ' resourceId\
                  \ ' ID: '  projectid;\n   end;\n\n   tmColumns     = {'memname',\
                  \ 'memtype', 'memlabel', 'engine', 'nobs',  'ncols', 'nbytes', 'crdate',\
                  \ 'moddate', 'resourceId', 'id'};\n   tmColumnTypes = {'varChar',\
                  \ 'varChar', 'varChar',  'varChar','int64', 'int64', 'int64',  'double',\
                  \ 'double',  'varChar',    'varChar'};\n   tablemetaTbl = newtable(tablemeta,\
                  \ tmColumns, tmColumnTypes);\n   addrow(tablemetaTbl , { memname,\
                  \ 'DATA', memlabel, 'CAS', nobs, ncols, nbytes, crdate, moddate,\
                  \ resourceId, projectid });\n\n   /* Drop the old version and save\
                  \ the new table */\n   table.dropTable /  caslib=projectCaslib name=tablemeta\
                  \ quiet=True;\n   table.dropTable /  caslib=projectCaslib name=tablemeta\
                  \ quiet=True;\n\n   saveresult tablemetaTbl caslib=projectCaslib\
                  \ casout=tablemeta  replace;\n   /* Check if the tablemeta table\
