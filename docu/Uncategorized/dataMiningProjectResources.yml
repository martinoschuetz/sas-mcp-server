                  \      'LEVEL'='INTERVAL'},\n      SEGMENT        = {'ROLE'='SEGMENT',\
                  \       'LEVEL'='NOMINAL'},\n      TARGET         = {'ROLE'='TARGET'},\n\
                  \      TEXT           = {'ROLE'='TEXT',          'LEVEL'='NOMINAL'},\n\
                  \      TIMEID         = {'ROLE'='TIMEID',        'LEVEL'='NOMINAL'}\n\
                  \   };\n\n   if debug then\n      print 'dictroleList: ' dictroleList;\n\
                  \n   attributeNameDict[\"dictnameList\"]   = dictnameList;\n   attributeNameDict[\"\
                  dictprefixList\"] = dictprefixList;\n   attributeNameDict[\"dictroleList\"\
