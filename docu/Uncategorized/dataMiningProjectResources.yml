                  ] = 'REJECTED';\n      return False; /* There is no row for this\
                  \ variable in the metadata so this is a new column */\n   end;\n\
                  \n   omrow = oldmetaRow[1];\n\n   advisor_mergeOldMeta(omrow);\n\
                  \   if debug then do;\n      print ' ';\n      print 'Old Columnmeta:'\
                  \ ' Varname: ' varname ' Attributes: ' omrow;\n      print ' ';\n\
                  \   end;\n\nend advisor_setAttributesBasedRetrain;\n\nfunction advisor_makeColumnmeta();\n\
                  \   /*\n       advisor_makeColumn make column metadata.\n   */\n\
                  \n   logHeader(\"advisor_makeColumnmeta\");\n\n   /* Building metadata\
