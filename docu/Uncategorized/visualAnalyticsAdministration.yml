          type: integer
          default: 0
      - name: limit
        in: query
        description: optional size limit for the returned collection
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: Filter criteria for finding a specific data table's corresponding
          default report data view.
        schema:
          type: string
      responses:
        "200":
          description: A collection of default report data views
          headers:
            ETag:
              description: The entity tag which conveys the modification state of
                the default report data views.
              schema:
                type: string
          content:
