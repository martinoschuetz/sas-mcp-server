---
openapi: 3.0.3
info:
  title: Visual Analytics Administration
  description: This is the Visual Analytics Administration API, handling custom graph
    type resources and default report data view resources.
  version: "3"
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
tags:
- name: Root
  description: The API root.
- name: CustomGraphTypes
  description: Operations on custom graph type resources.
- name: DefaultReportDataViews
  description: Operations on default report data view resources.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: The HATEOAS links for paths under this location.
      operationId: root
      responses:
        "200":
          description: A collection of links to this API's resources.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            "application/vnd.sas.api+json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                subscribe response:
                  $ref: "#/components/examples/apiResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                subscribe response:
                  $ref: "#/components/examples/apiResponse"
  /customGraphTypes:
    get:
      tags:
      - CustomGraphTypes
      summary: Get the collection of custom graph types
      description: The custom graph types that have been created.
      operationId: getCustomGraphTypes
      parameters:
      - name: If-None-Match
        in: header
        description: If this value matches the current ETag value, then 304 (Not Modified)
          is returned. Otherwise the normal GET proceeds (with ETag returned).
        schema:
          type: string
      - name: start
        in: query
        description: optional start index for the returned collection
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: optional size limit for the returned collection
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: A collection of custom graph types
          headers:
            ETag:
              description: The entity tag which conveys the modification state of
                the custom graph types.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/customGraphTypeCollection"
              examples:
                Custom graph collection:
                  $ref: "#/components/examples/customGraphCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/customGraphTypeCollection"
              examples:
                Custom graph collection:
                  $ref: "#/components/examples/customGraphCollection"
        "304":
          description: Not modified
    post:
      tags:
      - CustomGraphTypes
      summary: Create a custom graph type
      description: The data from which to create a custom graph type.
      operationId: createCustomGraphType
      requestBody:
        content:
          application/vnd.sas.van.custom.graph.type+json:
            schema:
              $ref: "#/components/schemas/customGraphType"
            examples:
              Custom graph request body:
                $ref: "#/components/examples/customGraphRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/customGraphType"
            examples:
              Custom graph request body:
                $ref: "#/components/examples/customGraphRequest"
        description: Representation of a new custom graph type.
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: The location (URL) of the new custom graph type.
              schema:
                type: string
            ETag:
              description: The entity tag which conveys the modification state of
                the new custom graph type.
              schema:
                type: string
          content:
            application/vnd.sas.van.custom.graph.type+json:
              schema:
                $ref: "#/components/schemas/customGraphType"
              examples:
                Custom graph object:
                  $ref: "#/components/examples/customGraphResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/customGraphType"
              examples:
                Custom graph object:
                  $ref: "#/components/examples/customGraphResponse"
        "400":
          description: Bad request (missing required field or field length is too
            long)
          content:
            application/vnd.sas.van.custom.graph.type+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
        "403":
          description: Forbidden. The user is not an administrator.
          content:
            application/vnd.sas.van.custom.graph.type+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError403"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError403"
  "/customGraphTypes/{customGraphTypeId}":
    get:
      tags:
      - CustomGraphTypes
      summary: Get a specific custom graph type
      description: The specified custom graph type.
      operationId: getCustomGraphType
      parameters:
      - name: customGraphTypeId
        in: path
        required: true
        description: The unique identifier of a custom graph type
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: If this value matches the current ETag value, then 304 (Not Modified)
          is returned. Otherwise the normal GET proceeds (with ETag returned).
