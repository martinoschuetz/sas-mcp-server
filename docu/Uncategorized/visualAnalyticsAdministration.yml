              $ref: "#/components/schemas/defaultReportDataView"
            examples:
              Default data view:
                $ref: "#/components/examples/defaultDataViewRequest"
        description: Representation of a new default report data view. The version,
          id, and links fields are ignored.
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: The location (URL) of the new default report data view.
              schema:
                type: string
            ETag:
              description: The entity tag which conveys the modification state of
                the new default report data view.
              schema:
                type: string
          content:
            application/vnd.sas.van.default.report.data.view+json:
              schema:
                $ref: "#/components/schemas/defaultReportDataView"
              examples:
