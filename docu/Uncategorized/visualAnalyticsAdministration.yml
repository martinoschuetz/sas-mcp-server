                Custom graph object:
                  $ref: "#/components/examples/customGraphResponse"
        "304":
          description: Not modified
        "404":
          description: Not found
          content:
            application/vnd.sas.van.custom.graph.type+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
    put:
      tags:
      - CustomGraphTypes
      summary: Update a custom graph type
      description: Update the specified custom graph type.
      operationId: updateCustomGraphType
      parameters:
      - name: customGraphTypeId
        in: path
        required: true
        description: The unique identifier of a custom graph type.
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: If this value matches the current ETag value, then the PUT operation
          proceeds; otherwise, a 412 (Precondition failed) is returned.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.van.custom.graph.type+json:
            schema:
              $ref: "#/components/schemas/customGraphType"
            examples:
              Custom graph object:
                $ref: "#/components/examples/customGraphResponse"
          application/json:
            schema:
              $ref: "#/components/schemas/customGraphType"
            examples:
              Custom graph object:
                $ref: "#/components/examples/customGraphResponse"
        description: Representation of the modified custom graph type.
        required: true
      responses:
        "200":
          description: OK; the updated custom graph type is returned.
          headers:
            ETag:
              description: The entity tag which conveys the modification state of
                the returned custom graph type.
              schema:
                type: string
          content:
            application/vnd.sas.van.custom.graph.type+json:
              schema:
                $ref: "#/components/schemas/customGraphType"
              examples:
                Custom graph object:
                  $ref: "#/components/examples/customGraphResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/customGraphType"
              examples:
                Custom graph object:
                  $ref: "#/components/examples/customGraphResponse"
        "304":
          description: Not modified
        "400":
          description: Bad request (the custom graph type in the body has a different
            id than the identifier specified in the path, or illegal values are specified
            in the supplied custom graph type).
          content:
            application/vnd.sas.van.custom.graph.type+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
        "403":
          description: Forbidden. The user is not an administrator.
          content:
            application/vnd.sas.van.custom.graph.type+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError403"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError403"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError403"
        "404":
          description: Not found; the custom graph type specified by the id parameter
            cannot be found.
          content:
            application/vnd.sas.van.custom.graph.type+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
        "412":
          description: Precondition failed
          content:
            application/vnd.sas.van.custom.graph.type+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
        "428":
          description: Precondition required
          content:
            application/vnd.sas.van.custom.graph.type+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
