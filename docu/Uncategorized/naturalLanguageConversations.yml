          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
    put:
      tags:
      - Transfer
      summary: Update an existing bot using a transfer object
      description: Update a bot using the transfer object. If no existing bot is found,
