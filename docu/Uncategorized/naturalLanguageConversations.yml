                default:
                  $ref: "#/components/examples/bot_summary_collection"
            application/json:
              schema:
                $ref: '#/components/schemas/botSummaryCollection'
              examples:
                default:
                  $ref: "#/components/examples/bot_summary_collection"
      security:
      - SASLogon:
        - openid
      x-annotations:
      - com.sas.authorization.annotations.FilterLinks
    post:
      tags:
      - Bots
      summary: Create bot
      description: Create a new bot.
      operationId: createBot
      requestBody:
        description: The create bot object.
        content:
          application/vnd.sas.natural.language.conversations.create.bot+json:
            schema:
              $ref: '#/components/schemas/createBot'
            examples:
              default:
                $ref: "#/components/examples/create_bot"
          application/json:
            schema:
              $ref: '#/components/schemas/createBot'
            examples:
              default:
                $ref: "#/components/examples/create_bot"
        required: true
      responses:
        "201":
          description: A bot was created
          headers:
            Location:
              description: The URL of the newly created resource
              schema:
                type: string
            Content-Type:
              description: media type of the newly created resource
              schema:
                type: string
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/vnd.sas.natural.language.conversations.bot.summary+json:
              schema:
                $ref: '#/components/schemas/botSummary'
              examples:
                default:
                  $ref: "#/components/examples/bot_summary"
            application/json:
              schema:
                $ref: '#/components/schemas/botSummary'
              examples:
                default:
                  $ref: "#/components/examples/bot_summary"
        "400":
          description: The provided bot was either missing or empty.
          content:
            application/vnd.sas.natural.language.conversations.bot.summary+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
      x-codegen-request-body-name: createBot
  /bots#transfer:
