---
openapi: 3.0.3
info:
  title: Natural Language Conversations
  description: This API manages Bots created using naturalLanguageConversations.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  version: "2"
servers:
- url: https://example.com/naturalLanguageConversations
  description: This is an example of a base URL.
security:
- SASLogon:
  - openid
tags:
- name: Root
  description: The API root.
- name: Bots
  description: The operations for bots.
- name: Revisions
  description: Contains operations related to revisions.
- name: Transfer
  description: Contains operations to transfer object resources.
- name: Sessions
  description: Contains operations related to sessions.
- name: Events
  description: Contains operations related to events.
- name: Session Statistics
  description: Contains operations related to session statistics.
- name: Bot Connectors
  description: Contains operations related to bot connectors.
- name: Dialogues
  description: Contains operations related to dialogues.
- name: Nodes
  description: Contains operations related to nodes.
- name: Attachments
  description: Contains operations related to nodes.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get API resource links
      description: Return a list of links to the top level resources in the API.
      operationId: root
      responses:
        "200":
          description: A collection of link objects.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                default:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                default:
                  $ref: "#/components/examples/root"
      security:
      - SASLogon:
        - openid
    head:
      tags:
      - Root
      summary: Determine if API resource links are available
      description: |
        Determines if the list of links to the top level resources in this API are available. This entry point does not require
        authentication.
      operationId: headersForRoot
      responses:
        "200":
          description: API resource links are available
      security:
      - SASLogon:
        - openid
  /bots:
    get:
      tags:
      - Bots
      summary: Get a collection of bots
      description: Returns a collection of bots.
      operationId: getBots
      parameters:
      - name: filter
        in: query
        description: The criteria for filtering the collection. See [Filtering in
          REST APIs](https://developer.sas.com/apis/rest/#filters)
        schema:
          type: string
          format: string
      - name: start
        in: query
        description: The start index for pagination
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The limit parameter for pagination
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: The criteria for sorting the collection. See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: A list of bot summaries
