              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
      x-codegen-request-body-name: botTransfer
  /bots/{botId}:
    get:
      tags:
      - Bots
      summary: Retrieve a bot
      description: Returns the contents of the bot provided by the id.
      operationId: getBot
      parameters:
      - name: botId
        in: path
        description: The ID of the bot to lookup
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The contents of this bot
          headers:
            ETag:
              description: The entity tag for the bot.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the bot was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.natural.language.conversations.bot+json:
              schema:
                $ref: '#/components/schemas/bot'
              examples:
                default:
                  $ref: "#/components/examples/bot"
        "404":
          description: The supplied ID was not found
          content:
            application/vnd.sas.natural.language.conversations.bot+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
      security:
      - SASLogon:
        - openid
    put:
      tags:
      - Bots
      summary: Modify bot
      description: Modify fields of an existing bot.
      operationId: updateBot
      parameters:
      - name: botId
        in: path
        description: The ID of the bot to lookup
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the bot.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The timestamp obtained from the most recent `Last-Modified` response
          header. Ignored when `If-Match` is specified, otherwise must match the timestamp
          when the bot was last modified.
        schema:
          type: string
      requestBody:
        description: Bot containing the updated fields
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateBot'
            examples:
              default:
                $ref: "#/components/examples/update_bot"
          application/vnd.sas.natural.language.conversations.update.bot+json:
            schema:
              $ref: '#/components/schemas/updateBot'
            examples:
              default:
                $ref: "#/components/examples/update_bot"
        required: true
      responses:
        "200":
          description: The bot was successfully updated.
          headers:
            ETag:
              description: The entity tag for the bot.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the bot was last modified.
              schema:
                type: string
            Location:
              description: The URL of the bot.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/botSummary'
              examples:
                default:
                  $ref: "#/components/examples/bot_summary"
            application/vnd.sas.natural.language.conversations.bot.summary+json:
              schema:
                $ref: '#/components/schemas/botSummary'
              examples:
                default:
                  $ref: "#/components/examples/bot_summary"
        "400":
          description: The supplied values were invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
            application/vnd.sas.natural.language.conversations.bot.summary+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
        "404":
          description: The supplied ID was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
            application/vnd.sas.natural.language.conversations.bot.summary+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resource's last modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_precondition_failed"
        "428":
          description: The request headers did not include a `If-Match` or `If-Unmodified-Since`
            precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_precondition_required"
      security:
      - SASLogon:
        - openid
      x-codegen-request-body-name: updatedBot
    delete:
      tags:
      - Bots
      summary: Delete the specified bot from the server
      description: Deletes the bot specified by its id.
      operationId: deleteBot
      parameters:
      - name: botId
        in: path
        description: The ID of the bot to lookup
        required: true
        schema:
          type: string
      - name: forceSessionDelete
        in: query
        description: Whether or not to ignore the running sessions check and force
          them to be deleted
        schema:
          type: boolean
          default: false
      responses:
        "204":
          description: The bot was successfully deleted
        "404":
          description: The supplied ID was not found
          content:
            application/vnd.sas.error:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
      security:
      - SASLogon:
        - openid
  /commons/validations/bots/{botId}:
    delete:
      tags:
      - Bots
      summary: Validate that the bot can be deleted
