components:
  schemas:
    createBot:
      title: Create Bot
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: User supplied name.
        description:
          type: string
          description: User supplied description.
        domainId:
          type: string
          description: The id of the naturalLanguageUnderstanding domain referenced
            by this bot.
        createdBy:
          type: string
          description: The user who created the node.
        modifiedBy:
          type: string
          description: The user who most recently modified the node.
        creationTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            node was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            node was last modified.
          format: date-time
        version:
          type: integer
          description: The version number of the resource. This representation is
            version 1
      description: The representation used to create a new bot.
    updateBot:
      title: Update Bot
      description: The representation used to update a bot.
      allOf:
      - $ref: '#/components/schemas/createBot'
      - required:
        - id
        type: object
        properties:
          id:
            type: string
            description: The unique identifier for the bot.
    botSummary:
      title: Bot Summary
      description: Summary representation of a bot.
      allOf:
      - $ref: '#/components/schemas/updateBot'
      - type: object
        properties:
          publishedRevisionId:
            type: string
            description: The currently published revision for the bot.
          links:
            type: array
            description: The links that apply to the resource.
            items:
              $ref: '#/components/schemas/link'
    bot:
      title: Bot
      description: The representation used for a bot.
      allOf:
      - $ref: '#/components/schemas/botSummary'
      - type: object
        properties:
          revisions:
            type: array
            description: Array of revisions for this bot.
            items:
              $ref: '#/components/schemas/botRevision'
          connectors:
            type: array
            description: Array of connectors for this bot.
            items:
              $ref: '#/components/schemas/connector'
    botSummaryCollection:
      title: Bot Collection
      description: A collection of bot objects.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - required:
        - items
        type: object
        properties:
          items:
            type: array
            description: An array that contains bots.
            items:
              $ref: '#/components/schemas/botSummary'
    botRevisionSummary:
      description: A bot revision summary
      required:
      - name
      type: object
      properties:
        id:
          pattern: ^$|^[0-9a-zA-Z]{8}-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{12}$
          type: string
          description: The unique identifier for the resource.
        name:
          maxLength: 100
          minLength: 1
          type: string
          description: The name of the resource.
        description:
          maxLength: 1000
          type: string
          description: The description of the resource.
        domainRevisionId:
          type: string
          description: The revision of the matching domain in the NLU service for
            this bot revision.
        createdBy:
          type: string
          description: The user who created the resource.
        creationTimeStamp:
          type: string
          description: The timestamp in YYYY-MM-DDThh:mm:ss.sssZ format when the resource
            was created.
          format: date-time
        modifiedBy:
          type: string
          description: The user who most recently modified the resource.
        modifiedTimeStamp:
          type: string
          description: The timestamp in YYYY-MM-DDThh:mm:ss.sssZ format when the resource
            was last modified.
          format: date-time
        links:
          type: array
          description: The links that apply to the resource.
          items:
            $ref: '#/components/schemas/link'
        version:
          type: integer
          description: The version number of the resource. This representation is
            version 1
    botRevision:
      description: A bot revision
      allOf:
      - $ref: '#/components/schemas/botRevisionSummary'
      - type: object
        properties:
          dialogues:
            type: array
            description: Array of dialogues for this bot.
            items:
              $ref: '#/components/schemas/dialogue'
          dialogueCategories:
            type: array
            description: Array of dialogue categories for this bot.
            items:
              $ref: '#/components/schemas/dialogueCategorySummary'
    botRevisionCollection:
      title: Revision Collection
      description: A collection of revisions.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - required:
        - items
        type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/botRevisionSummary'
    createDialogue:
      title: Create Dialogue
      required:
      - name
      type: object
      properties:
        id:
          type: string
          pattern: ^$|^[0-9a-zA-Z]{8}-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{12}$
          description: The unique identifier for the dialogue.
        name:
          type: string
          description: User supplied name.
        nodes:
          type: array
          description: Array of nodes for this dialogue.
          items:
            $ref: '#/components/schemas/node'
        edges:
          type: array
          description: Array of edges for this dialogue.
          items:
            $ref: '#/components/schemas/edge'
        category:
          $ref: '#/components/schemas/dialogueCategorySummary'
        createdBy:
          type: string
          description: The user who created the node.
        modifiedBy:
          type: string
          description: The user who most recently modified the node.
        creationTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            node was created.
          format: date-time
        modifiedTimeStamp:
          type: string
