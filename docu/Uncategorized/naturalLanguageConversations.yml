      description: Create a new bot from transfer object.
      operationId: createBotFromTransfer
      requestBody:
        description: The bot in transferable format.
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: '#/components/schemas/botTransferObject'
            examples:
              default:
                $ref: "#/components/examples/bot_transfer"
        required: true
      responses:
        "201":
          description: A bot was imported successfully.
          headers:
            ETag:
              description: The entity tag for the newly created bot.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the bot was last modified.
              schema:
                type: string
            Location:
              description: The URI of the newly created bot.
              schema:
                type: string
