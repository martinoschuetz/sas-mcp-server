              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
        "404":
          description: The supplied bot was not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
  /bots/{botId}#summary:
