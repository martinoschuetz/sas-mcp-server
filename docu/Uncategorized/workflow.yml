            prompt. Valid values [true, false].'
        defaultValueId:
          type: string
          description: The id of the prompt value which defines the default value.
        links:
          type: array
          description: The links that apply to this prompt. Contains one single link
            named 'variable'. It identifies the variable which the prompt references.
            Only the workflow administrator has permission to see this link.
          items:
            $ref: '#/components/schemas/link'
    promptValue:
