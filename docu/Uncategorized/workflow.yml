---
openapi: 3.0.3
info:
  version: '7'
  title: Workflow
  description: |
    "The Workflow Service provides for rapid deployment and flexible execution of BPMN based workflows. The Workflow Service executes a workflow definition modeled in Workflow Manager that represents a business task flow. A SAS solution can leverage workflow capabilities through the Workflow Service that support client interaction with the platform."
  termsOfService: 'https://www.sas.com/en_us/legal/copyright.html'
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
tags:
- name: Client Registrations
  description: The endpoints managing the client registration resource.
- name: Tags
  description: The endpoints managing the tag resource.
- name: Definitions
  description: The endpoints managing the definition resource and associated permissions.
- name: Processes
  description: The endpoints managing the process and subprocess resources.
- name: Variables
  description: The endpoints managing the variable resource.
- name: Tasks
  description: The endpoints managing the task resource.
- name: Messages
  description: The endpoints managing the message resource.
- name: Events
  description: The endpoints managing the event resource.
- name: Business Calendars
  description: The endpoints managing the business calendar resource.
- name: Timers
  description: The endpoints managing the timer resource.
- name: Root
  description: The root of the Workflow API.
- name: Transfer
  description: 'The endpoints to manage the transferring of workflow resources such
    as Tags, Business Calendars, Client Registrations and Definitions.'
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: 'Return a collection of links to the top-level collections surfaced
        through this API. In addition, this endpoint also supports the HEAD method
        which works similar to the GET method supporting the same headers but returns
        no response body." <p> <b>Authorization:</b> Any authenticated user. </p>'
      operationId: root
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                json:
                  $ref: "#/components/examples/api"
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                json:
                  $ref: "#/components/examples/api"
        '404':
          description: Service is not available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /clientRegistrations:
    get:
      tags:
      - Client Registrations
      summary: Get a collection of client registrations
      description: 'Returns a collection of client registrations. Standard paging,
        filtering, and sorting options are provided. The media type of the returned
        collection items is application/vnd.sas.workflow.client.registration+json.
        In addition, this endpoint also supports the HEAD method which works similar
        to the GET method supporting the same headers but returns no response body.
        <br><br> <b>Authorization:</b> Any authenticated user.'
      operationId: getClientRegistrations
      parameters:
      - name: Accept-Item
        in: header
        description: The media type of the resource items included in the returned
          collection.
        schema:
          type: string
          enum:
          - application/vnd.sas.workflow.client.registration+json
          - application/vnd.sas.workflow.client.registration+json;version=1
          - application/json
      - name: start
        in: query
        description: The starting index of the first group in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of client registrations to return in this page
          of results. The actual number of client registrations may be less if the
          collection has been exhausted. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: 'Filter criteria for returned tags. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/workflow-v6/docs/getting-started/usage-notes#filtering).'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort criteria for the client registrations collection.
        schema:
          type: string
          format: sort-criteria
      responses:
        '200':
          description: A page of client registration objects.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/clientRegistrationCollection'
              examples:
                json:
                  $ref: '#/components/examples/clientRegistrationCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/clientRegistrationCollection'
              examples:
                json:
                  $ref: '#/components/examples/clientRegistrationCollection'
        '400':
          description: 'Bad request. The request body, the filter, or sortBy or other
            query parameter may be malformed.'
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
    post:
      tags:
      - Client Registrations
      summary: Create a new client registration
      description: 'Add a client registration to the collection of client registrations.
        Each client application must register with the workflow service and associate
        its definitions to its respective client registration id. This association
        allows the workflow service to define authorization rules which limit which
        client can perform process management operations on a process instance as
        well route events to a specific client application queue. See the application/vnd.sas.workflow.client.registration
        media type for more information. <br><br> <b>Authorization:</b> The ability
        to create a client registration is restricted to Workflow Administrators and
        a client registering itself.'
      operationId: createClientRegistration
      requestBody:
        content:
          application/vnd.sas.workflow.client.registration+json:
            schema:
              $ref: '#/components/schemas/createClientRegistration'
            examples:
              json:
                $ref: "#/components/examples/createClientRegistration"
          application/json:
            schema:
              $ref: '#/components/schemas/createClientRegistration'
            examples:
              json:
                $ref: "#/components/examples/createClientRegistration"
        description: The client registration to be created.
        required: true
      responses:
        '201':
          description: A new client registration created.
          headers:
            Location:
              description: The URI of the newly created client registration.
              schema:
                type: string
          content:
            application/vnd.sas.workflow.client.registration+json:
              schema:
                $ref: '#/components/schemas/clientRegistration'
              examples:
                json:
                  $ref: '#/components/examples/clientRegistration'
            application/json:
              schema:
                $ref: '#/components/schemas/clientRegistration'
              examples:
                json:
                  $ref: '#/components/examples/clientRegistration'
        '400':
          description: Bad request. The request body may be malformed.
          content:
            application/vnd.sas.workflow.client.registration+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
        '409':
          description: 'Conflict. The client registration could not be created since
            a client already exists with the specified name, client id, or eventSubject.'
          content:
            application/vnd.sas.workflow.client.registration+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: '#/components/examples/duplicateResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: '#/components/examples/duplicateResourceResponse'
    patch:
      tags:
      - Client Registrations
      summary: Patch a client registration
      description: 'Patch a client registration. Use JSON Patch to update a client
        registration resource. Currently, this endpoint supports the ''test'' and
        ''replace'' JSON Patch operations. <br><br> <b>Authorization:</b> The ability
        to patch a client registration is restricted to Workflow Administrators and
        a client registering itself.'
      operationId: patchClientRegistration
      requestBody:
        content:
          application/json-patch:
            schema:
              $ref: '#/components/schemas/patchClientRegistration'
            examples:
              json:
                $ref: "#/components/examples/patchClientRegistration"
          application/json:
            schema:
              $ref: '#/components/schemas/patchClientRegistration'
            examples:
              json:
                $ref: "#/components/examples/patchClientRegistration"
        description: The patch to test and replace a client registration.
        required: true
      responses:
        '200':
          description: The patch was successful.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/clientRegistrationCollection'
              examples:
                json:
                  $ref: '#/components/examples/clientRegistrationCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/clientRegistrationCollection'
              examples:
                json:
                  $ref: '#/components/examples/clientRegistrationCollection'
        '400':
          description: Bad request. The request body may be malformed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
  '/clientRegistrations/{clientRegistrationId}':
    get:
      tags:
      - Client Registrations
      summary: Get a client registration
      description: 'Return information about a single client registration based on
        its unique id. In addition, this endpoint also supports the HEAD method which
        works similar to the GET method supporting the same headers but returns no
        response body. <br><br> <b>Authorization:</b> Any authenticated user.'
      operationId: getClientRegistration
      parameters:
      - name: clientRegistrationId
        in: path
        description: The client registration id.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.workflow.client.registration+json:
              schema:
                $ref: '#/components/schemas/clientRegistration'
              examples:
                json:
                  $ref: '#/components/examples/clientRegistration'
            application/json:
              schema:
                $ref: '#/components/schemas/clientRegistration'
              examples:
                json:
                  $ref: '#/components/examples/clientRegistration'
        '404':
          description: Not Found. There is no client registration with the specified
            client registration id.
          content:
            application/vnd.sas.workflow.client.registration+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
    head:
      tags:
      - Client Registrations
      summary: Check if client registration exists
      description: Return header information for given client registration.
      operationId: headersForClientRegistration
      parameters:
      - name: clientRegistrationId
        in: path
        description: The client registration id.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
        '404':
          description: Not Found. There is no client registration with the specified
            client registration id.
    delete:
      tags:
      - Client Registrations
      summary: Delete a client registration
      description: 'Delete the specified client registration and permanently remove
        it from the system. <br><br> <b>Authorization:</b> The ability to delete a
        client registration is restricted to Workflow Administrators.'
      operationId: deleteClientRegistration
      parameters:
      - name: clientRegistrationId
        in: path
        description: The client registration id.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        '204':
          description: Client Registration was deleted. No response body is returned.
        '404':
          description: Not Found. There is no client registration with the specified
            client registration id.
          content:
            application/vnd.sas.error:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  '/clientRegistrations/{clientRegistrationId}#export':
    get:
      tags:
      - Transfer
      summary: Get the transfer object for the specified client registration
      description: 'Get the transfer object for the specified client registration.
        <br><br> <b>Authorization:</b> Any authenticated user.'
      operationId: getClientRegistrationTransferObject
      parameters:
      - name: clientRegistrationId
        in: path
        description: The client registration id.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        '200':
          description: The request succeeded. Returns the transfer object for the
            specified client registration.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: '#/components/schemas/transferObject'
              examples:
                json:
                  $ref: '#/components/examples/transferObject'
            application/json:
              schema:
                $ref: '#/components/schemas/transferObject'
              examples:
                json:
                  $ref: '#/components/examples/transferObject'
        '404':
          description: Not Found. There is no client registration with the specified
            client registration id.
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  '/clientRegistrations/{clientRegistrationId}#import':
    put:
      summary: Create a client registration from the transfer object
      description: 'Create the specified client registration from the transfer object.
        <br><br> <b>Authorization:</b> The ability to create a client registration
        is restricted to Workflow Administrators and a client registering itself.'
      operationId: importClientRegistrationTransferObject
      tags:
      - Transfer
      parameters:
      - name: clientRegistrationId
        in: path
        description: The client registration id.
        required: true
        schema:
          type: string
          format: object-id
      requestBody:
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: '#/components/schemas/transferObject'
            examples:
              json:
                $ref: "#/components/examples/transferObjectRequest"
        description: The client registration transfer object to import.
        required: true
      responses:
        '200':
          description: 'Client registration already exists, no import necessary. Returns
            the client registration in resource summary format'
          headers:
            Location:
              description: The URI of the client registration.
              schema:
                type: string
        '201':
          description: A new client registration created. Returns the imported client
            registration in resource summary format.
          headers:
            Location:
              description: The URI of the newly created client registration.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: '#/components/schemas/resourceSummary'
              examples:
                json:
                  $ref: '#/components/examples/resourceSummary'
            application/json:
              schema:
                $ref: '#/components/schemas/resourceSummary'
              examples:
                json:
                  $ref: '#/components/examples/resourceSummary'
        '400':
          description: Bad request. The request body may be malformed.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
        '409':
          description: Conflict. The client registration could not be created because
            a client with the same id but different client id or eventSubject exists.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: '#/components/examples/duplicateResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: '#/components/examples/duplicateResourceResponse'
  /tags:
    get:
      tags:
      - Tags
      summary: Get a collection of tags
      description: 'Returns a collection of tags. Standard paging, filtering, and
        sorting options are provided. The media type of the returned collection  items
        is application/vnd.sas.workflow.tag+json. In addition, this endpoint also
        supports the HEAD method which works similar to the GET method supporting
        the same headers but returns no response body. <br><br> <b>Authorization:</b>
        Any authenticated user.'
      operationId: getTags
      parameters:
      - name: Accept-Item
        in: header
        description: The media type of the resource items included in the returned
          collection.
        schema:
          type: string
          enum:
          - application/vnd.sas.workflow.tag+json
          - application/vnd.sas.workflow.tag+json;version=1
          - application/json
      - name: start
        in: query
        description: The starting index of the first group in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of tags to return in this page of results. The
          actual number of tags may be less if the collection has been exhausted.
          Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: 'Filter criteria for returned tags. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/workflow-v6/docs/getting-started/usage-notes#filtering).'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort criteria for the tag collection.
        schema:
          type: string
          format: sort-criteria
      responses:
        '200':
          description: A page of tag summary objects.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/tagCollection'
              examples:
                json:
                  $ref: '#/components/examples/tagCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/tagCollection'
              examples:
                json:
                  $ref: '#/components/examples/tagCollection'
        '400':
          description: 'Bad request. The request body, the filter, sortBy, or other
            query parameter may be malformed.'
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
    post:
      tags:
      - Tags
      summary: Create a new tag
      description: 'Add a tag to the collection of tags. <br><br> <b>Authorization:</b>
        The ability to create a tag is restricted to Workflow Administrators and clients
        registered with the workflow service.'
      operationId: createTag
      requestBody:
        content:
          application/vnd.sas.workflow.tag+json:
            schema:
              $ref: '#/components/schemas/createTag'
            examples:
              json:
                $ref: "#/components/examples/createTag"
          application/json:
            schema:
              $ref: '#/components/schemas/createTag'
            examples:
              json:
                $ref: "#/components/examples/createTag"
        description: The name of the tag.
        required: true
      responses:
        '201':
          description: A new tag created.
          headers:
            Location:
              description: The URI of the newly created tag.
              schema:
                type: string
          content:
            application/vnd.sas.workflow.tag+json:
              schema:
                $ref: '#/components/schemas/tag'
              examples:
                json:
                  $ref: '#/components/examples/tag'
            application/json:
              schema:
                $ref: '#/components/schemas/tag'
              examples:
                json:
                  $ref: '#/components/examples/tag'
        '400':
          description: Bad request. The request body may be malformed.
          content:
            application/vnd.sas.workflow.tag+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
        '409':
          description: Conflict. The tag could not be created since a tag with the
            same name already exists.
          content:
            application/vnd.sas.workflow.tag+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: '#/components/examples/duplicateResourceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: '#/components/examples/duplicateResourceResponse'
  '/tags/{tagId}':
    get:
      tags:
      - Tags
      summary: Get a tag
      description: 'Return information about a single tag based on its unique id.
        In addition, this endpoint also supports the HEAD method which works similar
        to the GET method supporting the same headers but returns no response body.
        <br><br> <b>Authorization:</b> Any authenticated user.'
      operationId: getTag
      parameters:
      - name: tagId
        in: path
        description: The tag id.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.workflow.tag+json:
              schema:
                $ref: '#/components/schemas/tag'
              examples:
                json:
                  $ref: '#/components/examples/tag'
            application/json:
              schema:
                $ref: '#/components/schemas/tag'
              examples:
                json:
                  $ref: '#/components/examples/tag'
        '400':
          description: Bad request. The request body may be malformed.
          content:
            application/vnd.sas.workflow.tag+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
        '404':
          description: Not Found. There is no tag with the specified tag id.
          content:
            application/vnd.sas.workflow.tag+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
    head:
      tags:
      - Tags
      summary: Check headers for a tag
      description: Return headers for a tag.
      operationId: headersForTag
      parameters:
      - name: tagId
        in: path
        description: The tag id.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
        '400':
          description: Bad request. The request body may be malformed.
        '404':
          description: Not Found. There is no tag with the specified tag id.
    delete:
      tags:
      - Tags
      summary: Delete a tag
      description: 'Delete the specified tag and permanently remove it from the system."
        <br><br> <b>Authorization:</b> The ability to delete a tag is restricted to
        Workflow Administrators.'
      operationId: deleteTag
      parameters:
      - name: tagId
        in: path
        description: The tag id.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        '204':
          description: Tag deleted. No response body is returned.
        '400':
          description: Bad request. The request body may be malformed.
          content:
            application/vnd.sas.error:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
        '404':
          description: Not Found. There is no tag with the specified tag id.
          content:
            application/vnd.sas.error:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  '/tags/{tagId}#export':
    get:
      tags:
      - Transfer
      summary: Get the transfer object for the specified tag
      description: 'Get the transfer object for the specified tag. <br><br> <b>Authorization:</b>
        Any authenticated user.'
      operationId: getTagTransferObject
      parameters:
      - name: tagId
        in: path
        description: The tag id.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        '200':
          description: The request succeeded. Returns the transfer object for the
            specified tag.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: '#/components/schemas/transferObject'
              examples:
                json:
                  $ref: '#/components/examples/transferObject'
