  '/processes/{processId}/timers/{timerId}':
    post:
      tags:
      - Timers
      summary: Reschedule a timer
      description: 'Reschedule a pending timer associated with a process. The rescheduling
        will delete the existing timer and create a new one. The timer is initially
        scheduled when the process execution arrives in the timer catching event.
        <br><br> <b>Authorization:</b> The ability to reschedule a timer is restricted
        to Workflow Administrators and the registered client associated to the process.'
      operationId: rescheduleTimer
      parameters:
      - name: processId
        in: path
        description: The process id.
        required: true
        schema:
          type: string
          format: object-id
      - name: timerId
        in: path
        description: The timer id.
        required: true
        schema:
          type: string
          format: object-id
      - name: schedule
        in: query
        description: |
          The scheduling information:
          * For a single fire timer, the trigger timestamp that identifies when the timer will fire. This must conform to the ISO 8601 format for date and time representations.
          * For a repeat timer, the recurring timer interval. This must conform to the ISO 8601 format for recurring time interval representations.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: A rescheduled timer object. The existing timer is deleted and
            a new timer created.
          headers:
            Location:
              description: The URI of the rescheduled timer.
              schema:
                type: string
          content:
            application/vnd.sas.workflow.timer+json:
              schema:
                $ref: '#/components/schemas/timer'
              examples:
                json:
                  $ref: '#/components/examples/timer'
            application/vnd.sas.workflow.timer+json;version=1:
              schema:
                $ref: '#/components/schemas/timer'
              examples:
                json:
                  $ref: '#/components/examples/timer'
            application/vnd.sas.workflow.timer+json;version=2:
              schema:
                $ref: '#/components/schemas/timer'
              examples:
                json:
                  $ref: '#/components/examples/timer'
            application/json:
              schema:
                $ref: '#/components/schemas/timer'
              examples:
                json:
                  $ref: '#/components/examples/timer'
        '400':
          description: |
            Bad request. Returned if the schedule parameter is invalid:
            * trigger timestamp is missing for single fire timer
            * recurring time interval is specified for a single fire timer
            * recurring time interval is missing for a repeat fire timer
            * trigger timestamp is specified for a repeat fire timer
            * recurring time interval is invalid and does not conform to the ISO 8601 format for recurring time interval representations
          content:
            application/vnd.sas.workflow.timer+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/vnd.sas.workflow.timer+json;version=1:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/vnd.sas.workflow.timer+json;version=2:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
        '404':
          description: Not Found - process or timer does not exist.
          content:
            application/vnd.sas.workflow.timer+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
            application/vnd.sas.workflow.timer+json;version=1:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
            application/vnd.sas.workflow.timer+json;version=2:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
    put:
      tags:
      - Timers
      summary: Retry a timer
      description: 'Retry the failed timer associated with a process by changing the
        state from ''failed'' to ''pending''. When a timer fires, it triggers some
        action to occur.  If an exception occurs during the triggering of the action,
        the timer''s state is changed from ''pending'' to ''failed''. This endpoint
        can be used to change the state back to ''pending'' so that the timer will
        fire immediately and retry to execute the defined action. A timer can only
        be retried by a Workflow Administrator. <br><br> <b>Authorization:</b> The
        ability to retry a timer is restricted to Workflow Administrators and the
        registered client associated to the process.'
      operationId: retryTimer
      parameters:
      - name: processId
        in: path
        description: The process id.
        required: true
        schema:
          type: string
          format: object-id
      - name: timerId
        in: path
        description: The timer id.
        required: true
        schema:
          type: string
          format: object-id
      - name: state
        in: query
        description: 'The new state of the timer. This must be ''pending''.  When
          the state is changed to ''pending'', the timer will retry to trigger the
          defined action again.'
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The etag that was returned from a GET or PATCH.
        schema:
          type: string
      responses:
        '200':
          description: The pending timer object.
          headers:
            ETag:
              description: A tag that identifies the state of this object.
              schema:
                type: string
          content:
            application/vnd.sas.workflow.timer+json:
              schema:
                $ref: '#/components/schemas/timer'
              examples:
                json:
                  $ref: '#/components/examples/timer'
            application/vnd.sas.workflow.timer+json;version=1:
              schema:
                $ref: '#/components/schemas/timer'
              examples:
                json:
                  $ref: '#/components/examples/timer'
            application/vnd.sas.workflow.timer+json;version=2:
              schema:
                $ref: '#/components/schemas/timer'
              examples:
                json:
                  $ref: '#/components/examples/timer'
            application/json:
              schema:
                $ref: '#/components/schemas/timer'
              examples:
                json:
                  $ref: '#/components/examples/timer'
        '400':
          description: Bad request. Returned if the schedule parameter is invalid.
            The specified state must be 'pending'.
          content:
            application/vnd.sas.workflow.timer+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/vnd.sas.workflow.timer+json;version=1:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/vnd.sas.workflow.timer+json;version=2:
              schema:
