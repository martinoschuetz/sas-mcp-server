        executionListenerFailedMessage:
          type: string
          description: 'The exception message and stacktrace of the execution listener
            error. Available with [executionListenerFailed] type.'
        definitionId:
          type: string
          description: 'The id of the definition. Available with [processStarted,
            subProcessStarted, definitionEnabled, definitionDisabled] types.'
        definitionRevisions:
          type: integer
          description: 'The revision of the definition. Available with [processStarted,
