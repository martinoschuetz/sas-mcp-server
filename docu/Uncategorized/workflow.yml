    post:
      tags:
      - Processes
      summary: Send a signal to a process
      description: |
        Sends a signal to the specified process instance. The signal is delivered to signal catch events
        (both intermediate and boundary) within the process that are waiting for a signal with the matching name.

        By default, the signal is delivered to **all** matching subscriptions within the process (fire-all semantics).
        This is correct for BPMN scenarios such as parallel branches converging on the same signal.

        For targeted delivery to a specific subscription, provide the optional `subscriptionId` query parameter.
        Use the GET endpoint to discover available subscriptions and their IDs.
        <br><br>
        <b>Authorization:</b> The ability to send signals to a process is restricted to Workflow Administrators and the registered client associated to the process.
      operationId: signalProcess
      parameters:
      - name: processId
        in: path
        description: The process id.
        required: true
        schema:
          type: string
          format: object-id
      - name: subscriptionId
        in: query
        description: The ID of a specific signal subscription. When provided, only
          the specified subscription receives the signal. When omitted, all matching
          subscriptions receive the signal.
        required: false
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        description: The media type of the request body.
        schema:
          type: string
          enum:
          - application/vnd.sas.workflow.signal+json
          - application/vnd.sas.workflow.signal+json;version=1
          - application/vnd.sas.workflow.signal+json;version=2
          - application/vnd.sas.workflow.signal+json;version=3
          - application/json
      requestBody:
        description: The signal to send to the process.
        required: true
        content:
          application/vnd.sas.workflow.signal+json:
            schema:
              $ref: '#/components/schemas/signal'
            examples:
              json:
                $ref: '#/components/examples/sendSignal'
          application/vnd.sas.workflow.signal+json;version=1:
            schema:
              $ref: '#/components/schemas/signal'
            examples:
              json:
                $ref: '#/components/examples/sendSignal'
          application/vnd.sas.workflow.signal+json;version=2:
            schema:
              $ref: '#/components/schemas/signal'
            examples:
              json:
                $ref: '#/components/examples/sendSignal'
          application/vnd.sas.workflow.signal+json;version=3:
            schema:
              $ref: '#/components/schemas/signal'
            examples:
              json:
                $ref: '#/components/examples/sendSignal'
          application/json:
            schema:
              $ref: '#/components/schemas/signal'
            examples:
              json:
                $ref: '#/components/examples/sendSignal'
      responses:
        '200':
          description: The request succeeded. The signal was delivered and matching
            signal catch events in the process have been triggered.
        '400':
          description: The request was invalid. The request body is malformed or missing
            required fields.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
        '403':
          description: The user did not have the necessary permissions.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/forbiddenError"
        '404':
          description: No signal subscription exists at the requested path. The process
            does not exist or no matching signal subscription was found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
