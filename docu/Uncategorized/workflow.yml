            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/badRequestError"
        '404':
          description: Not Found - process or timer does not exist.
          content:
            application/vnd.sas.workflow.timer+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
            application/vnd.sas.workflow.timer+json;version=1:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
