          description: 'The name of the service task. Available with [serviceTaskStarted,
            serviceTaskFailed, serviceTaskCompleted, serviceTaskCanceled] types.'
        serviceTaskDefinitionId:
          type: string
          description: '<b>DEPRECATED</b>. Use [elementId] instead. The id of the
            service task as defined in the BPMN definition. Available in [serviceTaskStarted,
            serviceTaskFailed, serviceTaskCompleted, serviceTaskCanceled] types.'
        serviceTaskFailedMessage:
          type: string
          description: 'The exception message and stacktrace of the service task error.
