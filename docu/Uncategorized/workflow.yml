      description: 'Return a collection of events in chronological order. Standard
        paging is provided. The media type of the returned collection items is application/vnd.sas.event+json.
        In addition, this endpoint also supports the HEAD method which works similar
        to the GET method supporting the same headers but returns no response body.
        <br><br> <b>Authorization:</b> The ability to retrieve events is restricted
        to Workflow Administrators and the SAS Workflow History Service.'
      operationId: getEvents
      parameters:
      - name: start
        in: query
        description: The starting index of the first group in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of events to return in this page of results. The
          actual number of events may be less if the collection has been exhausted.
          Defaults to 10.
        schema:
          type: integer
      - name: timeStamp
        in: query
        description: 'Filter criteria for returned events, represented as a W3C/ISO
          8601 compliant timestamp string using yyyy-MM-dd''T''HH:mm:ss.SSSZ format.
          Only events created on or before the specified timestamp are returned.'
        schema:
          type: string
      responses:
        '200':
          description: Page of events.
          headers:
            Content-Type:
              schema:
                type: string
          content:
