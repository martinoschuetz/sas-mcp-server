    timer:
      description: The timer.
      properties:
        version:
          type: integer
          description: The timer schema version.
        id:
          type: string
          description: The timer id.
        name:
          type: string
          description: The timer name.
        state:
          type: string
          description: 'The state of the timer. Valid values [pending, failed].'
        elementId:
          type: string
          description: The flow element id of the timer defined in the BPMN definition.
        timerDefinitionId:
          type: string
          description: '<b>DEPRECATED</b>: Use [elementId] instead.'
        type:
          type: string
          description: 'The type of timer. Valid values [repeatFire, singleFire].'
        triggerTimeStamp:
          type: string
          format: date-time
          description: 'The trigger timestamp of the timer in ISO8601 format. For
            example, 2017-01-16T21:38:24.928Z.'
        repeat:
          type: string
          description: 'The repeat interval of the timer. Supported ISO8601 syntax
            includes ''R/<start>/<duration>'', ''Rnn/<start>/<duration>'', ''R/<duration>'',
            ''R/<duration>/<end>'' or ''Rnn/<duration>/<end>''. For example, R/2017-01-16T21:38:24.928Z/PT24H.'
        links:
          type: array
          description: The links that apply to this timer.
          items:
            $ref: '#/components/schemas/link'
    historyEventPayload:
      description: The event payload.
      type: object
      properties:
        version:
          type: integer
          description: The payload schema version.
        id:
          type: string
          description: The payload id.
        eventSubject:
          type: string
          description: The event subject used in routing events.
        details:
          type: array
          description: A list of details describing the historical actions which occurred.
          items:
            $ref: '#/components/schemas/eventDetail'
    eventDetail:
      description: A map containing key pairs which provide context for an action
        that occurred.
      properties:
        id:
          type: string
          description: The unique identifier for the detail.
        type:
          type: string
          description: 'The type of action that occurred. Valid types [processStarted,
            processCompleted, processCanceled, processSuspended, processResumed, subProcessStarted,
            subProcessCompleted, subProcessCanceled, participantsUpdated, taskStarted,
            taskCompleted, taskCanceled, taskUpdated, variableUpdated, callActivityStarted,
            callActivityCompleted, callActivityCanceled, gatewayStarted, gatewayCompleted,
            sequenceFlowTaken, messageWaiting, messageCompleted, messageCanceled,
            timerPending, timerCompleted, timerCanceled, timerFailed, serviceTaskStarted,
            serviceTaskFailed, serviceTaskCompleted, serviceTaskCanceled, executionListenerFailed,
            definitionEnabled, definitionDisabled].'
        rootId:
          type: string
          description: 'The id of the root process. Available with [processStarted]
            type.'
        processId:
          type: string
          description: The id of the process. Available with all types.
        processName:
          type: string
          description: 'The name of the process. Available with [processStarted] type.'
        subProcessId:
          type: string
          description: 'The id of the subProcess. Available with [subProcessStarted,
            subProcessCompleted, subProcessCanceled, taskStarted, variableUpdated,
            sequenceFlowTaken, messageWaiting, messageCompleted, messageCanceled,
            timerPending, timerCompleted, timerCanceled, timerFailed, serviceTaskStarted,
            serviceTaskFailed, serviceTaskCompleted, serviceTaskCanceled, executionListenerFailed]
            types.'
        parentId:
          type: string
          description: 'The id of the parent for this process/subProcess. The parent
            may be either the process itself or another subProcess. Available with
            [processStarted, subProcessStarted] types.'
        subProcessDefinitionId:
          type: string
          description: '<b>DEPRECATED</b>. Use [elementId] instead. The id of the
            subProcess as defined in the BPMN definition. Available in [subProcessStarted]
            type.'
        subProcessName:
          type: string
          description: 'The name of the subProcess. Available with [subProcessStarted]
            type.'
        taskId:
          type: string
          description: 'The id of the task. Available with [participantsUpdated, taskStarted,
            taskCompleted, taskCanceled, taskUpdated] types.'
        taskDefinitionId:
          type: string
          description: '<b>DEPRECATED</b> Use [elementId] instead. The id of the task
            as defined in the BPMN definition. Available in [taskStarted] type.'
        taskName:
          type: string
          description: 'The name of the task. Available with [taskStarted, taskCompleted,
            taskCanceled, taskUpdated] types.'
        taskDueTimeStamp:
          type: string
          description: 'The time the task should be completed by. Available with [taskStarted,
            taskUpdated] type.'
        taskUpdatedReason:
          type: string
          description: 'The reason the task was updated. Valid values [taskClaimed,
            taskReleased, taskTransferred, taskDelegated, dueTimeStampModified]. Available
            with [taskUpdated] type.'
        actualOwner:
          type: string
          description: 'The id of the user as defined in the Identities Service who
            is the actual owner of the task. Available with [taskUpdated] type.'
        delegator:
          type: string
          description: 'The id of the user as defined in the Identities Service who
            delegated the task to another user. Available with [taskUpdated] type.'
        participants:
          $ref: '#/components/schemas/eventParticipants'
        callActivityId:
          type: string
          description: 'The id of the call activity. Available with [callActivityStarted,
            callActivityCompleted, callActivityCanceled] types.'
        callActivityDefinitionId:
          type: string
          description: 'The id of the call activity as defined in the BPMN definition.
            Available in [callActivityStarted, callActivityCompleted, callActivityCanceled]
            type.'
        callActivityName:
          type: string
          description: 'The name of the call activity as defined in the BPMN definition.
            Available in [callActivityStarted] type.'
        gatewayId:
          type: string
          description: 'The id of the gateway. Available with [gatewayStarted, gatewayCompleted]
            types.'
        gatewayType:
          type: string
          description: 'The type of the gateway. Available with [gatewayStarted, gatewayCompleted]
            types.'
        variableName:
          type: string
          description: 'The name of the variable. Available with [variableUpdated]
            type.'
        variableValue:
          type: object
          description: 'The value of the variable. Available with [variableValue]
            type.'
        sequenceFlowId:
          type: string
          description: 'The id of the sequence flow as defined in the BPMN definition.
            Available with [sequenceFlowTaken] type.'
        sequenceFlowSourceId:
          type: string
          description: 'The id of the referenced source element in a sequence flow
            as defined in the BPMN definition. Available with [sequenceFlowTaken]
            type.'
        sequenceFlowTargetId:
          type: string
          description: 'The id of the referenced target element in a sequence flow
            as defined in the BPMN definition. Available with [sequenceFlowTaken]
            type.'
        messageDefinitionId:
