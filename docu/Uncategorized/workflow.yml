              $ref: "#/components/examples/createDefinition"
        application/json:
          schema:
            $ref: '#/components/schemas/createDefinition'
          examples:
            json:
              $ref: "#/components/examples/createDefinition"
      description: The BPMN model and optional comment for the workflow definition.
      required: true
  schemas:
    createTag:
      description: Create a new tag.
      required:
      - name
      - version
      properties:
        version:
          type: integer
          description: The tag schema version.
        name:
          type: string
          description: 'The name of the tag. Valid characters are all unicode letters,
            digits, hyphen, underscore and space.'
        clientRegistrationId:
          type: string
          description: The ID of the client registration associated with the tag.
    createBusinessCalendar:
      description: Create a new business calendar.
      required:
      - name
      - version
      - excludeCondition
      properties:
        version:
          type: integer
          description: The business calendar schema version.
        name:
          type: string
          description: |
            "The name of the business calendar. Valid characters are all unicode letters, digits, hyphen (-), underscore (_) and space ( )."
        description:
          type: string
          description: |
            "The description of the business calendar."
        excludeCondition:
          type: string
          description: |
            "The exclude condition of the business calendar."
    createDefinition:
      description: Create a new definition.
      required:
      - id
      - name
      - model
      - version
      properties:
        version:
          type: integer
          description: The definition schema version.
        id:
          type: string
          description: The id of the definition as defined in the BPMN process element.
        name:
          type: string
          description: The name of the definition as defined in the BPMN process element.
        model:
          type: string
          description: The BPMN Model for the workflow definition.
        comment:
          type: string
          description: The description of the definition.
    updateBusinessCalendar:
      description: Update a business calendar.
      properties:
        id:
          type: string
          description: The id of the business calendar.
        excludeCondition:
          type: string
          description: The exclude condition of the business calendar.
    updateLock:
      description: Lock or unlock a definition.
      properties:
        version:
          type: integer
          description: The definition lock schema version.
        lockedBy:
          type: string
          description: The id of the user as defined in the Identities Service requesting
            the lock or null if unlocking a definition.
    updateProcess:
      description: Update the state of a process.
      properties:
        version:
          type: integer
          description: The process schema version.
        id:
          type: string
          description: The id of the process.
        name:
          type: string
          description: The name of the process.
        description:
          type: string
          description: The description of the process.
        definitionId:
          type: string
          description: The definition id.
        definitionRevision:
          type: string
          description: The definition revision.
        state:
          type: string
          description: 'The state of the process. Valid values [running, suspended].'
    updateTask:
      description: Update a task.
      properties:
        version:
          type: integer
          description: The task schema version.
        id:
          type: string
          description: The id of the task.
        processId:
          type: string
          description: The id of the process associated with the task.
        dueTimeStamp:
          type: string
          description: The due date of the task.
    updateVariable:
      description: Update a variable.
      properties:
        version:
          type: integer
          description: The variable schema version.
        scope:
          type: string
          description: 'The scope of the variable. Valid values [local, inherited].'
        type:
          type: string
          description: 'The type of the variable. Valid values [string, number, dateTime,
            boolean].'
        name:
          type: string
          description: The variable name.
        value:
          type: object
          description: 'The variable value. Valid types [string, boolean, number].'
    updateVariables:
      description: Update process variables.
      properties:
        version:
          type: integer
          description: The variables schema version.
        variables:
          type: array
          description: The variables.
          items:
            $ref: '#/components/schemas/variable'
    createParticipant:
      description: Create a participant.
      properties:
        version:
          type: integer
          description: The participant schema version.
        principalType:
          type: string
          description: 'The type of the participant. Valid values [User, Group].'
        role:
          type: string
          description: 'The role of the participant. Valid values [PotentialOwner,
            ExcludedOwner].'
        principal:
          type: string
          description: The user id or group from the Identities Service.
    updateMessage:
      description: Update a message.
      properties:
        version:
          type: integer
          description: The message schema version.
        name:
          type: string
          description: The Message name.
        variables:
          type: array
          description: The variables to set on the process prior to the process continuing.
          items:
            $ref: '#/components/schemas/variable'
    createDefinitionPermission:
      description: Create a definition permission.
      properties:
        version:
          type: integer
          description: The definition permission schema version.
        type:
          type: string
          description: The type of the definition permission.
        principalType:
          type: string
          description: 'The type of principal associated with this permission. Valid
            values [User, Group].'
        principal:
          type: string
          description: The user id or group from the Identities Service.
    createClientRegistration:
      description: Create a client registration.
      type: object
      required:
      - id
      - clientName
      - clientId
      - eventSubject
      - version
      properties:
        version:
          type: integer
          description: The definition schema version.
        id:
          type: string
          description: The id of the client registration.
        clientName:
          type: string
          description: The name of the client.
        clientId:
          type: string
          description: The id of the client as defined in the Logon Service which
            is registered to use the workflow service.
        eventSubject:
          type: string
          description: 'The event subject is a key used to route events to a client
            specific queue that is bound to the workflow service exchange in RabbitMQ.
            Valid characters include Unicode letters, digits, dash(-), underscore(_),
            period(.), asterisk(*), and pound(#). The workflow service reserves event
            subject values starting with ''sas.workflow''.'
        enhancedTaskCompletionSecurity:
          type: string
          description: 'Enhanced task completion security further restricts how a
            task can be completed. When the value is "disabled", which is the default
            value, any user who can claim the task may complete it. When the value
            is set to "enabled" the workflow service will further restrict the completion
            of a task. The additional restriction will require users, who are not
            a workflow administrator, to complete the task from the client registered
            with the workflow service. The id of the required client can be found
            in the client registration resource associated with the workflow definition
            that was used to start the process.'
        privateTags:
          type: boolean
          description: The `privateTags` property indicates whether the tags associated
            with this client registration are private. When set to true, only the
            corresponding client can create or delete these tags.
        privateInstance:
          type: boolean
          description: The `privateInstance` property indicates whether the processes
            started by this client registration should be displayed as read-only.
            When set to true, these processes are not editable from the Workflow Manager
            UI.
    patchClientRegistration:
      description: Patch a client registration.
      required:
      - op
      - path
      - value
      properties:
        op:
          type: string
          description: The type of operation to perform on the client registration.
          enum:
          - test
          - replace
        path:
          type: string
          description: The URI of the client registration.
        value:
          $ref: '#/components/schemas/createClientRegistration'
    tag:
      description: The tag.
      properties:
        version:
          type: integer
          description: The tag schema version.
        id:
          type: string
          description: The tag id.
        name:
          type: string
          description: The tag name.
        clientRegistrationId:
          type: string
          description: The ID of the client registration associated with the tag.
        links:
          type: array
          description: The links that apply to this tag.
          items:
            $ref: '#/components/schemas/link'
    businessCalendar:
      description: The business calendar.
      properties:
        version:
          type: integer
          description: The business calendar schema version.
        id:
          type: string
          description: The business calendar id.
        name:
          type: string
          description: The business calendar name.
        description:
          type: string
          description: The business calendar description.
        excludeCondition:
          type: string
          description: |
            The exclude condition is a Boolean expression that excludes days of the week and/or specific dates. The business
            calendar can be defined on a timer to exclude days/dates when the timer triggers. Business calendars can also be
            defined on a user task's due date to exclude days/dates for the due date.  The logical operators that are
            supported include and, or, and not.
            Supported built-in functions include:
            * dayOfWeek() - Excludes specific days of the week. Valid values include [monday, tuesday, wednesday, thursday, friday, saturday, sunday].
            * date() - Excludes specific dates. This must conform to the ISO 8601 date format.

            Examples:
            dayOfWeek('saturday') || dayOfWeek('sunday')  - excludes weekend days
            dayOfWeek('saturday','sunday')   - excludes weekend days
            date('2020-10-27Z') - excludes Oct 27, 2020
            date('2020-10-27Z') and dayOfWeek('saturday') - excludes Oct 27, 2020 only if it falls on a saturday
            date('2020-10-27Z') ||  date('2020-10-28Z') - excludes the dates Oct 27, 2020 and Oct 28, 2020
        links:
          type: array
          description: The links that apply to this business calendar.
          items:
            $ref: '#/components/schemas/link'
    definition:
      description: The definition.
      properties:
        version:
          type: integer
          description: The definition schema version.
        id:
          type: string
          description: The definition id.
        name:
          type: string
          description: The name of definition.
        description:
          type: string
          description: The description of this definition.
        revision:
