          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/vnd.sas.collection+json;version=2
          - application/json
      - name: Accept-Item
        in: header
        description: The requested representation of the deployment items in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.business.orchestration.deployment+json
          - application/vnd.sas.business.orchestration.deployment+json;version=1
