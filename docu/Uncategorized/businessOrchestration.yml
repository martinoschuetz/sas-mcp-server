              examples:
                getDeployments:
                  $ref: "#/components/examples/getDeployments"
        "404":
          $ref: "#/components/responses/404serviceUnavailable"
        "500":
          $ref: "#/components/responses/500internalServerError"
    post:
      summary: Create a deployment
      tags:
      - Deployments
      description: Creates a new deployment.
      operationId: createDeployment
      parameters:
      - name: Accept
        description: >
          The requested representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.business.orchestration.deployment+json
          - application/vnd.sas.business.orchestration.deployment+json;version=1
          - application/json
      - name: Content-Type
        in: header
        description: >
          The representation of the deployment in the request body.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.business.orchestration.deployment+json
          - application/vnd.sas.business.orchestration.deployment+json;version=1
          - application/json
      requestBody:
        content:
          application/vnd.sas.business.orchestration.deployment+json:
            schema:
              $ref: "#/components/schemas/deploymentRequest"
            examples:
              Project:
                $ref: "#/components/examples/submitDeployment"
          application/vnd.sas.business.orchestration.deployment+json;version=1:
            schema:
              $ref: "#/components/schemas/deploymentRequest"
            examples:
              Project:
                $ref: "#/components/examples/submitDeployment"
          application/json:
            schema:
              $ref: "#/components/schemas/deploymentRequest"
            examples:
              Project:
                $ref: "#/components/examples/submitDeployment"
        description: >
          The representation of a deployment request.
        required: true
      responses:
        "201":
          description: A deployment was created.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.business.orchestration.deployment+json:
              schema:
