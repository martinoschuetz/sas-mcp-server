---
openapi: 3.0.3
info:
  version: "1"
  title: Business Orchestration
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: "https://developer.sas.com"
  description: >
    The Business Orchestration API provides functionality to manage project configuration
    and deployment.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
servers:
- url: "http://example.com/businessOrchestration"
  description: This is an example URL for the mock server.
tags:
- name: Root
  description: The operations for the root resource.
- name: Projects
  description: The operations for projects.
- name: Deployments
  description: The operations for deployments.
- name: Environments
  description: The operations for environments.
- name: Capabilities
  description: The operations for capabilities.
- name: Schemas
  description: The schema for projects.
paths:
  /:
    get:
      tags:
      - Root
      summary: Return a list of top-level links
      description: >
        Returns the links to the top-level resources for the API.
      operationId: root
      parameters:
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.api+json
          - application/json
      responses:
        "200":
          description: The request was successful.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                API:
                  $ref: "#/components/examples/rootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                API:
                  $ref: "#/components/examples/rootResponse"
        "404":
          description: The API is unavailable.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - API Unavailable:
                  $ref: "#/components/examples/404NotAvailable"
    head:
      tags:
      - Root
      summary: Check if the service is available
      description: Returns header information and a status of whether the service
        is available.
      operationId: headersForRoot
      parameters:
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.api+json
          - application/json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
        "404":
          description: The API is unavailable.
  /projects:
    get:
      summary: Get a list of projects
      tags:
      - Projects
      operationId: getProjects
      description: |
        Returns a list of projects.
      parameters:
      - name: Accept
        in: header
        description: The requested representation of the project collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/vnd.sas.collection+json;version=2
          - application/json
      - name: Accept-Item
        in: header
        description: The requested representation of the project items in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.business.orchestration.project+json
          - application/vnd.sas.business.orchestration.project+json;version=1
          - application/json
      - name: start
        in: query
        description: The zero-based offset of the first project to be returned.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: The maximum number of projects to be returned.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: >
          The criteria for sorting projects. See [Sorting in REST
          APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#sorting).
          Sorting can use the following fields: **archived**, **contentValid**, **createdBy**,
          **creationTimeStamp**, **description**, **id**, **modifiedBy**, **modifiedTimeStamp**,
          **name**, **shortName**.
        required: false
        schema:
          type: string
          default: name:ascending
      - name: filter
        in: query
        description: >
          The criteria for filtering projects. See [Filtering in REST
          APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#filtering).
          Filters can use the following fields: **archived**, **contentValid**, **createdBy**,
          **creationTimeStamp**, **description**, **id**, **modifiedBy**, **modifiedTimeStamp**,
          **name**, **shortName**.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/projectCollection"
              examples:
                getProjects:
                  $ref: "#/components/examples/getProjectListResponse"
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/projectCollection"
              examples:
                getProjects:
                  $ref: "#/components/examples/getProjectListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/projectCollection"
              examples:
                getProjects:
                  $ref: "#/components/examples/getProjectListResponse"
        "404":
          $ref: "#/components/responses/404serviceUnavailable"
    post:
      summary: Create a project
      tags:
      - Projects
      description: Creates a new project.
      operationId: createProject
      parameters:
      - name: Accept
        description: >
          The requested representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.business.orchestration.project+json
          - application/vnd.sas.business.orchestration.project+json;version=1
          - application/json
      - name: Content-Type
        in: header
        description: >
          The representation of the project in the request body.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.business.orchestration.project+json
          - application/vnd.sas.business.orchestration.project+json;version=1
          - application/json
      requestBody:
        content:
          application/vnd.sas.business.orchestration.project+json:
            schema:
              $ref: "#/components/schemas/projectRequest"
            examples:
              ProjectWithContent:
                $ref: "#/components/examples/submitProject"
              ProjectWithoutContent:
                $ref: "#/components/examples/submitProjectNoContent"
          application/vnd.sas.business.orchestration.project+json;version=1:
            schema:
              $ref: "#/components/schemas/projectRequest"
            examples:
              ProjectWithContent:
                $ref: "#/components/examples/submitProject"
              ProjectWithoutContent:
                $ref: "#/components/examples/submitProjectNoContent"
          application/json:
            schema:
              $ref: "#/components/schemas/projectRequest"
            examples:
              ProjectWithContent:
                $ref: "#/components/examples/submitProject"
              ProjectWithoutContent:
                $ref: "#/components/examples/submitProjectNoContent"
        description: >
          The representation of a project.
        required: true
      responses:
        "201":
          description: A project was created.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
            Location:
              $ref: "#/components/headers/locationHeader"
          content:
            application/vnd.sas.business.orchestration.project+json:
              schema:
                $ref: "#/components/schemas/projectResponse"
              examples:
                deployment:
                  $ref: "#/components/examples/createProjectResponse"
            application/vnd.sas.business.orchestration.project+json;version=1:
              schema:
                $ref: "#/components/schemas/projectResponse"
              examples:
                deployment:
                  $ref: "#/components/examples/createProjectResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/projectResponse"
              examples:
                deployment:
                  $ref: "#/components/examples/createProjectResponse"
        "400":
          $ref: "#/components/responses/400requestInvalid"
        "406":
          $ref: "#/components/responses/406unacceptableResponseType"
        "409":
          description: The project could not be created due to a conflict. This usually
            occurs when the project name or short name already exists.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Conflict:
                  $ref: "#/components/examples/409Conflict"
        "500":
          $ref: "#/components/responses/500internalServerError"
  "/projects/{projectId}":
    get:
      summary: Get project content
      tags:
      - Projects
      operationId: getProject
      description: Returns the content of a project by projectId.
      parameters:
      - name: Accept
        in: header
        description: The requested representation of the project.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.business.orchestration.project+json
          - application/vnd.sas.business.orchestration.project+json;version=1
          - application/json
      - name: projectId
        in: path
        description: Specifies the project identifier.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            ETag:
              $ref: "#/components/headers/eTagHeader"
          content:
            application/vnd.sas.business.orchestration.project+json:
              schema:
                $ref: "#/components/schemas/projectResponse"
              examples:
                Project:
                  $ref: "#/components/examples/getProjectResponse"
            application/vnd.sas.business.orchestration.project+json;version=1:
              schema:
                $ref: "#/components/schemas/projectResponse"
              examples:
                Project:
                  $ref: "#/components/examples/getProjectResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/projectResponse"
              examples:
                Project:
                  $ref: "#/components/examples/getProjectResponse"
        "404":
          $ref: "#/components/responses/404resourceNotFound"
        "500":
          $ref: "#/components/responses/500internalServerError"
    head:
      summary: Check for the existence of a project
      tags:
      - Projects
      operationId: headersForGetProject
      description: Checks for the existence of a project.
      parameters:
      - name: Accept
        in: header
        description: The requested representation of the project.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.business.orchestration.project+json
          - application/vnd.sas.business.orchestration.project+json;version=1
          - application/json
      - name: projectId
        in: path
        description: Specifies the project identifier.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
        "404":
          $ref: "#/components/responses/404unimplemented"
        "500":
          $ref: "#/components/responses/500internalServerError"
    put:
      summary: Update a project
      description: >
        Updates the project that is identified using the specified projectId.
        This operation is a conditional PUT. It must be accompanied by either an `If-Match`
        header with an ETag or an `If-Unmodified-Since` header with a timestamp.
      tags:
      - Projects
      operationId: updateProject
      parameters:
      - name: Accept
        description: >
          The requested representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.business.orchestration.project+json
          - application/vnd.sas.business.orchestration.project+json;version=1
          - application/json
      - name: If-Match
        in: header
        description: The value of the **ETag** header that was returned from a GET
          or previous PUT of this context. The request must include either the **If-Unmodified-Since**
          header or the **If-Match** header.
        required: false
        schema:
          type: string
          enum:
          - E-Tag
      - name: If-Unmodified-Since
        in: header
        description: The value of the **Last-Modified** header that was returned from
          a GET or previous PUT of this context. The request must include either the
          **If-Unmodified-Since** header or the **If-Match** header.
        required: false
        schema:
          type: string
          enum:
          - ddd, dd MMM yyyy HH':'mm':'ss 'GMT'
      - name: Content-Type
        in: header
        description: >
          The representation of the project in the request body.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.business.orchestration.project+json
          - application/vnd.sas.business.orchestration.project+json;version=1
          - application/json
      - name: projectId
        in: path
        description: Specifies the project identifier.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.business.orchestration.project+json:
            schema:
              $ref: "#/components/schemas/updateProject"
            examples:
              Project:
                $ref: "#/components/examples/updateProject"
          application/vnd.sas.business.orchestration.project+json;version=1:
            schema:
              $ref: "#/components/schemas/updateProject"
            examples:
              Project:
                $ref: "#/components/examples/updateProject"
          application/json:
            schema:
              $ref: "#/components/schemas/updateProject"
            examples:
              Project:
                $ref: "#/components/examples/updateProject"
        description: >
          The request body contains the representation of updated project details.
          The resource referenced in this request will be
          updated with the new details. The default media type is application/vnd.sas.business.orchestration.project+json.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: "#/components/headers/contentTypeResponseHeader"
            Last-Modified:
              $ref: "#/components/headers/lastModifiedHeader"
            ETag:
              $ref: "#/components/headers/eTagHeader"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/projectResponse"
              examples:
                getProjects:
                  $ref: "#/components/examples/getProjectResponse"
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/projectResponse"
              examples:
                getProjects:
                  $ref: "#/components/examples/getProjectResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/projectResponse"
              examples:
                getProjects:
                  $ref: "#/components/examples/getProjectResponse"
        "400":
          $ref: "#/components/responses/400requestInvalid"
        "404":
          $ref: "#/components/responses/404resourceNotFound"
        "409":
          description: The project could not be updated due to a conflict. This usually
            occurs when the project name or short name already exists.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Conflict:
                  $ref: "#/components/examples/409Conflict"
        "412":
          $ref: "#/components/responses/412preconditionFailed"
        "428":
          $ref: "#/components/responses/428preconditionRequired"
        "500":
          $ref: "#/components/responses/500internalServerError"
    delete:
      summary: Delete a project
      description: Deletes the project by the specified projectId.
      tags:
      - Projects
      operationId: deleteProject
      parameters:
      - name: projectId
        in: path
        description: Specifies the project identifier.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The project has been deleted.
        "400":
          $ref: "#/components/responses/400requestInvalid"
        "500":
          $ref: "#/components/responses/500internalServerError"
  "/deployments":
