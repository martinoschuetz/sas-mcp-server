      type: object
      title: Project
      properties:
        name:
          type: string
          description: The unique name of the project.
          maxLength: 255
        shortName:
          type: string
          description: >
            Specifies an alternate name for the project. The short name can contain
            up to 30 alphanumeric characters (lowercase letters only). Spaces and
            special characters, except the hyphen (-), are not allowed. The short
            name is used when the project is deployed. A short name is automatically
            assigned if not provided.
          maxLength: 30
          pattern: "^[a-z0-9-]+$"
        description:
          type: string
          description: The descriptive text for the project.
