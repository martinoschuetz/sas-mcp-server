  schemas:
    updateProject:
      description: >
        Contains information about a project.
      type: object
      title: Project
      properties:
        id:
          type: string
          description: >
            The unique identifier of the project. This field is generated by the service.
            For PUT requests, the ID must match the URL path parameter.
        name:
          type: string
          description: The unique name of the project.
          maxLength: 255
        shortName:
          type: string
          description: Specifies an alternate name for the project. The short name
            can contain up to 30 alphanumeric characters (lowercase letters only).
            Spaces and special characters, except the hyphen (-), are not allowed.
            The short name is used when the project is deployed.
          maxLength: 30
          pattern: "^[a-z0-9-]+$"
        description:
          type: string
          description: The descriptive text for the project.
          maxLength: 1000
        content:
          type: string
          description: The project content encoded in Base64.
        archived:
          type: boolean
          description: >
            Specifies whether the project is archived. Archived projects are read-only
            and cannot be modified or deployed.
        editMode:
          type: string
          description: >
            Specifies the mode in which the project should be edited.
          enum:
          - "code"
          - "diagram"
      required:
      - "id"
      - "name"
      - "shortName"
      - "editMode"
