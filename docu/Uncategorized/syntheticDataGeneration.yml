        "404":
          description: The generator or model was not found.
          content:
            application/vnd.sas.error+json:
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
              schema:
                $ref: "#/components/schemas/error2"
  /generators/{generatorId}/variables:
