      summary: Get API resource links
      tags:
      - Root
      operationId: root
      description: Return the list of links to top-level resources and operations
        available from the root of the API.
      responses:
        "200":
          description: A collection of link objects was successfully retrieved.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/apiResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/apiResponse"
          headers:
            Content-Type:
              schema:
                type: string
    head:
      summary: Check the state of the service
      tags:
      - Root
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded. The service is available.
          headers:
            Content-Type:
              schema:
                type: string
      description: Determine if the service is available.
