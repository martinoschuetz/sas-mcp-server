    request:
      title: Job Request
      description: A job request.
      x-sas-media-type:
        name: application/vnd.sas.job.execution.job.request
        version: 3
      required:
      - id
      type: object
      properties:
        version:
          type: integer
          description: The version number of the representation. The current version
            is 3.
        id:
          type: string
          description: The unique identifier for the job request. This is only required
            for a persisted job request.
        name:
          type: string
          description: The name of the job request.
        description:
          type: string
          description: The description of the job request.
        creationTimeStamp:
          description: The timestamp for when the job request was created, in the
            format of `YYYY-MM-DDThh:mm:ss.sssZ`.  This is set only on a persisted
            job request.
          type: string
        modifiedTimeStamp:
          description: The timestamp for when the job request was last modified, in
            the format of `YYYY-MM-DDThh:mm:ss.sssZ`.  This is set only on a persisted
            job request.
          type: string
        createdBy:
          description: The ID of the user that created the job request.  This is set
            only on a persisted job request.
          type: string
        modifiedBy:
          description: The ID of the user that last modified the job request.  This
            is set only on a persisted job request.
          type: string
        jobDefinitionUri:
          type: string
          description: The URI of the job definition that is to be executed.  Either
            the `jobDefinitionUri` or the `jobDefinition` property must be set in
            a job request submitted to Job Execution service for execution.
        jobDefinition:
          $ref: "#/components/schemas/jobDefinition"
        expiresAfter:
          type: string
          description: The duration of time (in <a href="https://www.w3.org/TR/xmlschema-2/#duration"
            target="_blank">W3C XML duration format</a>) after the completion of the
            job when the job should be deleted by the Job Execution service. If a
            value is specified for this property, it overrides any value specified
            by the provider's `/commons/settings` endpoint for the job request.<p>For
            a job request that is embedded in the `application/vnd.sas.job.execution.job`
            media type, if a value is not already set for the `expiresAfter` property,
            the value is set by the Job Execution service to the provider's value,
            if one exists.
        arguments:
          type: object
          description: The values of the arguments in the format map<string, string>
            that contains name value pairs (map<name, value>). Values can be supplied
            for parameters not defined in the job definition. The maximum name length
            is 100.<p>Hibernate does not persist a map entry with a null value. Therefore,
            a persisted Job Request will not contain any such entries.<p>For a job
            request that is embedded in the 'application/vnd.sas.job.execution.job'
            media type, this value is set by the Job Execution service and contains
            the complete set of arguments that are to be used in the execution by
            the provider. Arguments that already exist in the original job request
            are left unchanged. If there are arguments in the job definition that
            do not exist in the original job request arguments map, those arguments
            and any default values, including null values, are added to the arguments
            map. However, since the Job object is persisted before being sent to the
            provider, no entries for such null-value arguments in the Job are sent
            to the provider (because of the Hibernate behavior of not persisting map/collection
            entries with null values). The Job Execution service also guarantees that
            any required argument has an associated non-null value.
        properties:
          type: object
          description: The value of properties in the format of (map<string, string>)
            that contains name value pairs (map<name, value>). The maximum name length
            is 100.
          additionalProperties:
            type: string
        createdByApplication:
          type: string
          description: The application that created the job request. The value is
            typically from the spring.application.name property. The value is used
            as the "creator" in the routing key of the Job State Change events, and
            if it is not present in the job request the value "jobExecution" is used.
            Valid characters are [a-zA-Z0-9] and the hyphen. The maximum length is
            64.
        links:
          type: array
          description: The links that are associated with the job request.
          items:
            $ref: "#/components/schemas/link"
    jobDefinition:
      title: Job Definition
      description: The job definition.
      type: object
      x-sas-media-type:
        name: application/vnd.sas.job.definition
        version: 2
      required:
      - code
      properties:
        version:
          type: integer
          description: The version of the resource. This version is 2.
        id:
          type: string
          description: The unique ID of the resource that is generated by the API.
        name:
          type: string
          description: The name of the job. The maximum length is 100.
        description:
          type: string
          description: A description of the job. The maximum length is 1000.
          x-sas-attributes:
            since: '2'
        type:
          type: string
          description: The type of job. This property determines the execution provider
            that executes this job. The maximum length is 250.
        code:
          type: string
          description: Execution provider specific code to be executed.
        parameters:
          type: array
          description: An array of input parameters to be collected when executing
            this job definition.
          items:
            $ref: "#/components/schemas/jobDefinitionParameter"
        properties:
          type: array
          description: An array of name/value pairs needed to execute a job definition.
            The maximum length of a name is 100.
          items:
            $ref: "#/components/schemas/property"
        createdBy:
          type: string
          description: The user that created this job.
        modifiedBy:
          type: string
          description: The user that modified this job.
        creationTimeStamp:
          type: string
          description: 'The formatted timestamp when the job was created, in the following
            format: yyyy-mm-ddThh:mm:ssZ.'
        modifiedTimeStamp:
          type: string
          description: 'The formatted timestamp when the job was modified, in the
            following format: yyyy-mm-ddThh:mm:ssZ.'
        links:
          type: array
          description: An array of link objects
          items:
            $ref: "#/components/schemas/link"
    jobDefinitionParameter:
      title: Job Definition Parameter
      type: object
      description: The job definition parameter.
      required:
      - name
      properties:
        version:
          type: integer
          description: The version of the resource. This version is 1.
        name:
          type: string
          description: The name of the parameter. The maximum length is 100.
        type:
          type: string
          description: The type of the parameter (TABLE, NUMERIC, DATE, CHARACTER).
            The maximum length is 20.
        label:
          type: string
          description: The display value for the name of this parameter. The maximum
            length is 250.
        required:
          type: boolean
          description: Specifies if the parameter is required for execution.
        defaultValue:
          type: string
          description: The default value for this parameter, if one is not specified
            at execution time.
    property:
      title: Property
      description: A pair consisting of a string name and a string value. This is
        an element of `application/vnd.sas.properties`
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: The property name.
        value:
          type: string
          description: The property value.
