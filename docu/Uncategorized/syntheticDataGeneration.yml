                $ref: "#/components/schemas/variables"
            application/json:
              examples:
                default:
                  $ref: "#/components/examples/getVariablesResponse"
              schema:
                $ref: "#/components/schemas/variables"
        "404":
          description: The data generator was not found.
          content:
            application/vnd.sas.error+json:
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
              schema:
                $ref: "#/components/schemas/error2"
  /generators/{generatorId}/variables/{variableId}:
