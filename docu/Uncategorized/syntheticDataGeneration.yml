      responses:
        "200":
          description: The variable was successfully retrieved.
          headers:
            ETag:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the resource was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.synthetic.data.generation.variable+json:
              examples:
                default:
                  $ref: "#/components/examples/variableResponse"
              schema:
                $ref: "#/components/schemas/variable"
            application/json:
              examples:
                default:
                  $ref: "#/components/examples/variableResponse"
              schema:
                $ref: "#/components/schemas/variable"
        "404":
          description: The data generator or the variable was not found.
          content:
            application/vnd.sas.error+json:
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
              schema:
                $ref: "#/components/schemas/error2"
    head:
      summary: Determine if a variable exists
      tags:
      - Variables
      operationId: headersForVariable
      description: Determine if a variable exists.
      responses:
        "200":
          description: The variable was found.
          headers:
            ETag:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the resource was last modified.
              schema:
                type: string
        "404":
          description: The data generator or the variable was not found.
    put:
      summary: Update a variable
      operationId: updateVariable
      description: Update a variable.
      tags:
      - Variables
      parameters:
      - name: If-Match
        in: header
        required: true
        description: The entity tag for the resource.
        schema:
          type: string
      requestBody:
        description: The variable to update.
        content:
          application/vnd.sas.synthetic.data.generation.variable+json:
            examples:
              default:
                $ref: "#/components/examples/updateVariableRequest"
            schema:
              $ref: "#/components/schemas/variable"
      responses:
        "200":
          description: The variable was updated successfully.
          headers:
            ETag:
              description: The entity tag for the resource.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the resource was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.synthetic.data.generation.variable+json:
              schema:
                $ref: "#/components/schemas/variable"
              examples:
                default:
                  $ref: "#/components/examples/variableResponse"
            application/json:
              examples:
                default:
                  $ref: "#/components/examples/variableResponse"
              schema:
                $ref: "#/components/schemas/variable"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The data generator or variable was not found.
          content:
            application/vnd.sas.error+json:
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
              schema:
                $ref: "#/components/schemas/error2"
        "412":
          description: The request did not satisfy the If-Match header.
          content:
            application/vnd.sas.error+json:
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: The request did not contain the If-Match header.
          content:
            application/vnd.sas.error+json:
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
              schema:
                $ref: "#/components/schemas/error2"
components:
  schemas:
    generator:
      title: Generator
      description: A data generator.
      type: object
      required:
      - name
      - tableName
      - caslib
      properties:
        id:
          type: string
          description: The server-generated ID that uniquely identifies this resource.
        name:
          maxLength: 100
          type: string
          description: The name supplied by the consumer for this resource.
        description:
          maxLength: 1000
          type: string
          description: The description of this resource.
        createdBy:
          type: string
          description: The user who created this resource.
        modifiedBy:
          type: string
          description: The user who most recently modified this resource.
        creationTimeStamp:
          type: string
          description: The time stamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            resource was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The time stamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            resource was last modified.
          format: date-time
        links:
          type: array
          description: The links that apply to this resource.
          items:
            $ref: "#/components/schemas/link"
        tableName:
          type: string
          description: The name of the source table
          maxLength: 100
        caslib:
          type: string
          description: The name of the CAS library where the source table is loaded
          maxLength: 100
        casServer:
          type: string
          description: The name of the CAS server where the source table is loaded
          maxLength: 100
          default: cas-server-shared
        version:
          type: integer
          format: int32
          description: The version of the resource.
        state:
          $ref: "#/components/schemas/generatorState"
    generators:
      title: Collection of generators
      description: A collection of generators
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: An array that contains generator objects.
            items:
              $ref: "#/components/schemas/generator"
    variableRole:
      title: Variable Role
      description: Determines how the variable will be used during the data generation
        process.
      type: string
      enum:
      - input
      - rejected
    variable:
      title: Variable
      description: Information about a variable (column) in the source table.
      type: object
      required:
      - level
      - role
      properties:
        id:
          type: string
          description: The server-generated ID that uniquely identifies this variable.
        name:
          type: string
          description: The name of this resource.
        createdBy:
          type: string
          description: The user who created this resource.
        modifiedBy:
          type: string
          description: The user who most recently modified this resource.
        creationTimeStamp:
          type: string
          description: The time stamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            resource was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The time stamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            resource was last modified.
          format: date-time
        links:
          type: array
          description: The links that apply to this resource.
          items:
            $ref: "#/components/schemas/link"
        type:
          type: string
          description: The data type detected for the values in the source table for
            this variable.
          enum:
          - numeric
          - character
        level:
          type: string
          description: An indication of the number of unique values in the source
            table for this variable.
          enum:
          - interval
          - nominal
        role:
          $ref: "#/components/schemas/variableRole"
        version:
          type: integer
          format: int32
          description: Version of the resource
    variables:
      title: Collection of variables
      description: A collection of variables (columns)
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Array containing variable objects.
            items:
              $ref: "#/components/schemas/variable"
    model:
      title: Model
      description: A synthetic data generation model.
      type: object
      required:
      - type
      properties:
        id:
          type: string
          description: The server-generated ID that uniquely identifies this resource.
        name:
          maxLength: 100
          type: string
          description: The name supplied by the consumer for this resource.
        description:
          maxLength: 1000
          type: string
          description: The description of this resource.
        createdBy:
          type: string
          description: The user who created this resource.
        modifiedBy:
          type: string
          description: The user who most recently modified this resource.
        creationTimeStamp:
          type: string
          description: The time stamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            resource was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The time stamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            resource was last modified.
          format: date-time
        links:
          type: array
          description: The links that apply to this resource.
          items:
            $ref: "#/components/schemas/link"
        type:
          $ref: "#/components/schemas/modelType"
        numAssessSamples:
          type: integer
          format: int64
          description: Specifies how many observations to generate when assessing
            model performance.
          default: 1000
          minimum: 100
        state:
          $ref: "#/components/schemas/modelState"
        version:
          type: integer
          format: int32
          description: Version of the resource
      discriminator:
        propertyName: type
        mapping:
          tabularGan: "#/components/schemas/tabularGan"
          smote: "#/components/schemas/smote"
      x-sas-top-level-model: true
    models:
      title: Collection of models
      description: A collection of models
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Array containing model objects.
            items:
              $ref: "#/components/schemas/model"
    tabularGan:
      title: Tabular GAN model
      description: A tabular GAN model.
      allOf:
      - $ref: "#/components/schemas/model"
      - type: object
        properties:
          miniBatchSize:
            type: integer
            format: int64
            description: Number of observations to use in one training iteration.
            default: 64
            minimum: 1
          numAutoencoderEpochs:
            type: integer
            format: int64
            description: Specifies the number of passes through the training set to
              use when training the autoencoder model.
            default: 10
            minimum: 1
          numGanEpochs:
            type: integer
            format: int64
            description: Specifies the number of passes through the training set to
              use when training the tabular GAN model.
            default: 10
            minimum: 1
          checkpointFrequency:
            type: integer
            format: int64
            description: Specifies how frequently to save the tabular GAN model and
              report assessment statistics (in epochs).
            default: 5
            minimum: 1
          discriminatorRegularizationWeight:
            type: number
            format: double
            description: Specifies the weight to use for regularization of the tabular
              GAN model's discriminator.
            default: 10
            minimum: 0
          maxGmmIterations:
            type: integer
            format: int64
            description: Specifies how many iterations to train the Gaussian mixture
              model for calculating centroids.
            default: 10
            minimum: 1
      x-discriminator-value: tabularGan
    smote:
      title: SMOTE model
      description: A SMOTE model.
      allOf:
      - $ref: "#/components/schemas/model"
      x-discriminator-value: smote
    modelType:
      title: Model Type
      description: The model type. Indicates one of the enums [smote, tabularGan]
      type: string
      enum:
      - smote
      - tabularGan
    generatorState:
      title: Generator State
      description: The generator state. Indicates one of the enums [initiated, runningAdvisor,
        failed, ready].
      type: string
      enum:
      - initiated
      - runningAdvisor
      - failed
      - ready
    modelState:
      title: Model State
      description: The model state. Indicates one of the enums [initiated, training,
        stopping, failed, completed].
      type: string
      enum:
      - initiated
      - training
      - stopping
      - failed
      - completed
    generationJob:
      title: Generation job
      description: A request to generate data.
      type: object
      required:
      - numObs
      - caslib
      - table
      properties:
        numObs:
          type: integer
          format: int64
          description: Number of observations to generate.
          minimum: 1
        caslib:
          type: string
          description: The name of the CAS library where the table will be generated.
          maxLength: 100
        table:
          type: string
          description: The name of the generated table.
          maxLength: 100
        replace:
          type: boolean
          description: Specifies whether to replace the output table if is exists.
    assessmentType:
      title: Assessment Type
      description: The type of assessment.
      type: string
      enum:
      - binning
      - correlationDiffNorm
      - correlationMatrix
      - frequencyDistribution
      - pcaEigenvalue
      - pcaScore
      - variableDistributions
    assessmentTableColumn:
      title: Assessment table columm
      description: An assessment table column.
      type: object
      properties:
        name:
          type: string
          description: Name of the column
        format:
          type: string
          description: Format of the column
    assessmentTable:
      title: Assessment table
      description: An assessment table.
      type: object
      properties:
        type:
          $ref: "#/components/schemas/assessmentType"
        rowCount:
          type: integer
          format: int64
          description: Number of rows in assessments table.
        columns:
          type: array
          description: Array containing column objects.
          items:
            $ref: "#/components/schemas/assessmentTableColumn"
        createdBy:
          type: string
          description: The user who created this resource.
        modifiedBy:
          type: string
          description: The user who most recently modified this resource.
        creationTimeStamp:
          type: string
          description: The time stamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            resource was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The time stamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            resource was last modified.
          format: date-time
        links:
          type: array
          description: The links that apply to this resource.
          items:
            $ref: "#/components/schemas/link"
    assessments:
      title: Collection of assessments
      description: A collection of assessments.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Array containing assessment objects.
            items:
              $ref: "#/components/schemas/assessmentTable"
    assessmentRow:
      type: array
      description: An array of strings representing the cells in the row.
      items:
        anyOf:
        - type: string
        - type: number
    assessmentRows:
      title: Collection of assessment rows
      description: A collection of assessment rows.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Array containing assessment rows.
            items:
              $ref: "#/components/schemas/assessmentRow"
    job:
      title: Job
      description: The execution job.
      x-sas-media-type:
        name: application/vnd.sas.job.execution.job
        version: 4
      required:
      - id
      properties:
        version:
          type: integer
          description: The version number of the representation. The current version
            is 4.
        id:
          type: string
          description: The unique identifier that is generated by the API.
        state:
          type: string
          description: 'The current state of the job. Valid values: pending, running,
            canceled, completed, failed, timedOut. Also see "stateDetails".'
        stateDetails:
          type: string
          description: This member supplements the "state" member by providing an
            hint that additional information is available. It is a hint and not the
            actual information. The purpose of this member is for providers to provide
            a hint, where applicable, about the state set and for that hint to be
            used by components which convey state information to clients. It should
            be set in conjunction with "state".
        results:
          type: object
          description: The output of the job execution as a map<string, string>.
        error:
          $ref: "#/components/schemas/error2"
        jobRequest:
          $ref: "#/components/schemas/request"
        heartbeatInterval:
          type: integer
          format: int32
          description: The interval in seconds that the `heartbeatTimeStamp` should
            be updated by the provider or the job times out. The value for the `heatbeatInterval`
            is 0 when there is no heartbeat.
        heartbeatTimeStamp:
          description: The timestamp for when the last heartbeat was received, in
            the format of `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        creationTimeStamp:
          description: The timestamp for when the job was created, in the format of
            `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        modifiedTimeStamp:
          description: The timestamp for when the job was last modified, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        endTimeStamp:
          description: The timestamp for when the state of the job changed to completed
            or failed, in the format of `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        elapsedTime:
          description: If the job has ended, the value is the difference between the
            `endTimeStamp` and the `creationTimeStamp`. If the job has not ended,
            the value is the difference between the time that this representation
            was created and the `creationTimeStamp`. The units are in milliseconds.
            A value of -1 is returned, if a value is not set for the `creationTimeStamp`.
          type: number
        logLocation:
          description: The URI for the log, if one exists.  The provider may provide
            additional information.
          type: string
        expirationTimeStamp:
          description: The timestamp for when the job expires and will be deleted
            by the Job Execution service, in the format of `YYYY-MM-DDThh:mm:ss.sssZ`.
            This is set by the service after the job has completed based on the value
            of the `expiresAfter` member of the job request.
          type: string
        createdBy:
          description: The ID of the user that created or submitted the job.
          type: string
        modifiedBy:
          description: The ID of the user that last modified the job.
          type: string
        submittedByApplication:
          description: 'Value of the query parameter "submitter" on the POST endpoints
            to submit a job. If the query parameter is not present, the createdByApplication
            value from the embedded JobRequest is used. The createdByApplication value
            in the embedded JobRequest that is used is the same as what was in the
            submitted job request if one was present; if not the value "jobExecution"
            is used. The submittedByApplication value is used as the "submitter" in
            the routing routing key of Job State Change events. Only characters in
            the set [a-zA-Z0-9] and dash are valid for submitter. Max length: 64'
          type: string
        links:
          type: array
          description: The links that are associated with the job.
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
