---
openapi: 3.0.3
info:
  version: "1"
  title: Synthetic Data Generation
  description: The Synthetic Data Generation API is used to generate data sets via
    synthetic data models.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/syntheticDataGeneration
  description: This is an example base URL.
tags:
- name: Root
  description: Operations for the root resource.
- name: Generators
  description: Operations for synthetic data generators.
- name: Models
  description: Operations for models.
- name: Model Assessments
  description: Operations for model assessments.
- name: Variables
  description: Operations for the metadata associated with the source data for a generator.
paths:
