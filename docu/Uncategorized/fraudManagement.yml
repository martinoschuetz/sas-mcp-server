    transactionType:
      title: Transaction Type
      description: A transaction type is a transaction filter based on the component
        of the transaction. It is used to narrow the view a business unit has to the
        transaction population. For instance the solution may be used to detect fraud
        on a wide array of incoming transactions. But the credit department's rule
        writes may only be interested in creating rules on Credit Card related transactions.
        So they may define a set of transaction Types that filter out all but credit
        card transactions from their view of the world.
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: string
          description: The system-assigned unique ID for this object.
        displayName:
          type: string
          description: The name of the transaction followed by its 4 letter acronym
            . The 4 letter acronym is a (nicknamed) given to institute supplied stock
            transaction types. It is composed of the 2 letter account component value
            and 2 letter activity component value. For instance a Credit Card Authorization
            Request Transaction Type has the acronym CCCA. This value is blank for
            client defined Transaction Types.
