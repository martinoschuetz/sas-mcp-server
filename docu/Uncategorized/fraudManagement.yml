---
openapi: 3.0.3
info:
  title: Fraud Management
  description: The Fraud Management Service REST API was created to support the functions
    of the SAS Fraud Management Solution's HTML 5 based web application(s).
  version: '1'
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
  termsOfService: 'https://www.sas.com/en_us/legal/copyright.html'
servers:
- url: 'http://mock-fraudManagement.apifirst.unx.sas.com/fraudManagement'
  description: kubernetes mock server
tags:
- name: Rules
  description: 'Operations to create, update, delete, import/export and print rules.'
- name: Business Unit
  description: 'Operations to list, create, update, delete Business Unit.'
- name: Lookup List
  description: 'Operations to list, creare, update, delete Lookup List & Analyst List.'
- name: Organizations
  description: Operation to list all organizations.
paths:
  /businessUnits:
    get:
      summary: Returns a collection of business units the user is a member of
      operationId: getBusinessUnits
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Business Unit
      responses:
        '200':
          description: List of Business Units
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/BusinessUnitCollection'
              examples:
                example:
                  value:
                    links:
                    - rel: string
                      method: string
                      uri: string
                      href: string
                      title: string
                      type: string
                      itemType: string
                      responseType: string
                      responseItemType: string
                    name: string
                    accept: string
                    start: 0
                    count: 0
                    items:
                    - version: 0
                      id: 0
                      name: string
                      description: string
                      tenantMultiOrgId: 0
                    limit: 0
                    version: 0
            application/vnd.sas.finance.tenant.business.unit+json:
              schema:
                $ref: '#/components/schemas/BusinessUnitCollection'
              examples: {}
        '401':
          description: Unauthorized. This request requires valid authentication.
        '403':
          description: Forbidden. The user is not authorized to request this information.
        '404':
          description: Service is not available
  '/businessUnits/{businessUnitId}':
    get:
      summary: Returns attributes associated with a single business unit
      operationId: getBusinessUnit
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      description: |
        Since this API is not intended for public consumption, this request requires authorization.
      tags:
      - Business Unit
      responses:
        '200':
          description: Requested Business Unit
          content:
            application/vnd.sas.finance.tenant.business.unit+json:
              schema:
                $ref: '#/components/schemas/businessUnit'
        '401':
          description: Unauthorized. This request requires valid authentication.
        '403':
          description: Forbidden. The user is not authorized to request this information.
        '404':
          description: Service is not available
  '/businessUnits/{businessUnitId}/lookupListPrompts':
    get:
      summary: Get list of recognized lookup list definitions
      operationId: getLookupListPrompts
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: start
        required: false
        in: query
        description: start
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: limit
        schema:
          type: integer
      - name: fields
        required: false
        in: query
        description: fields
        schema:
          type: string
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '200':
          description: Returns list of recognized lookup list definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  '/businessUnits/{businessUnitId}/lookuplists':
    get:
      summary: Returns a collection of lookup lists the user has access to for the
        given Business Unit
      operationId: getLookupLists
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '200':
          description: Collection of Lookup Lists
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/LookupListCollection'
            application/vnd.sas.finance.decision.lookup.list+json:
              schema:
                $ref: '#/components/schemas/LookupListCollection'
        '401':
          description: Unauthorized. This request requires valid authentication.
        '403':
          description: Forbidden. The user is not authorized to request this information.
        '404':
          description: Service is not available
    post:
      summary: Create a new lookup list definition
      operationId: createLookupList
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/lookupList'
        description: The lookup list to create
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '200':
          description: OK
        '201':
          description: Created lookup list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lookupList'
        '400':
          description: The request was invalid
        '409':
          description: A lookup list with the same id has already been created
        '412':
          description: precondition failed
  '/buinessunits/{businessUnitId}/lookuplists/activate':
    post:
      summary: Activate a list of lookup lists
      operationId: activateLookupLists
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/lookupList'
        description: 'A list of all the lookup lists to update, each including an
          id property.'
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '201':
          description: Created
        '204':
          description: Activated lookup list(s)
        '400':
          description: The request was invalid
        '404':
          description: Specified lookup list was not found
        '409':
          description: A lookup list with the same id has already been updated
  '/buinessunits/{businessUnitId}/lookuplists/deactivate':
    post:
      summary: Deativate a list of lookup lists
      operationId: deactivateLookupLists
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/lookupList'
        description: 'A list of all the lookup lists to update, each including an
          id property. Lookup lists cannot be deactivated if they are in use.'
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '201':
          description: Created
        '204':
          description: Deactivated lookup list(s)
        '400':
          description: The request was invalid
        '404':
          description: Specified lookup list was not found
        '409':
          description: A lookup list with the same id has already been updated
  '/buinessunits/{businessUnitId}/lookuplists/reload':
    post:
      summary: Reload a list of lookup lists
      operationId: reloadLookupLists
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/lookupList'
        description: 'A list of all the lookup lists to update, each including an
          id property.'
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '201':
          description: Created
        '204':
          description: Reloaded lookup list(s)
        '400':
          description: The request was invalid
        '404':
          description: Specified lookup list was not found
        '409':
          description: A lookup list with the same id has already been updated
  '/businessUnits/{businessUnitId}/lookuplists/{lookupListId}':
    get:
      summary: Returns attributes associated with a single Lookup list
      operationId: getLookupListDetail
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: lookupListId
        required: true
        in: path
        description: The id of the Lookup List
        schema:
          type: integer
      description: |
        Since this API is not intended for public consumption, this request requires authorization.
      tags:
      - Lookup List
      responses:
        '200':
          description: Returns attributes associated with a single Lookup List
          content:
            application/vnd.sas.finance.decision.lookup.list+json:
              schema:
                $ref: '#/components/schemas/lookupList'
        '401':
          description: Unauthorized. This request requires valid authentication.
        '403':
          description: Forbidden. The user is not authorized to request this information.
        '404':
          description: Service is not available
    put:
      summary: Update the lookup list definition
      operationId: updateLookupList
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: lookupListId
        required: true
        in: path
        description: The id of the Lookup List
        schema:
          type: integer
      requestBody:
        content:
          application/vnd.sas.finance.decision.lookup.list+json:
            schema:
              $ref: '#/components/schemas/lookupList'
        description: The updated lookup list definition
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '200':
          description: Updated lookup list
          content:
            application/vnd.sas.finance.decision.lookup.list+json:
              schema:
                $ref: '#/components/schemas/lookupList'
        '400':
          description: The request was invalid
        '404':
          description: Specified lookup list was not found
        '409':
          description: A lookup list with the same id has already been updated
        '412':
          description: The ETag header did not match
        '428':
          description: ETag header must be included in the request
    delete:
      summary: Delete a lookup list
      operationId: deleteLookupList
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: lookupListId
        required: true
        in: path
        description: The id of the Lookup List
        schema:
          type: integer
      description: |
        Since this API is not intended for public consumption, this request requires authorization.
      tags:
      - Lookup List
      responses:
        '204':
          description: Deleted lookup list
        '401':
          description: Unauthorized. This request requires valid authentication.
        '403':
          description: Forbidden. The user is not authorized to request this information.
        '404':
          description: Specified lookup list was not found.
        '409':
          description: Lookup list with the same id has already been modified.
  '/businessUnits/{businessUnitId}/lookuplists/{lookupListId}/contents':
    get:
      summary: Returns the entries in a lookup list
      operationId: getLookupListContents
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: lookupListId
        required: true
        in: path
        description: The id of the Lookup List
        schema:
          type: integer
      description: |
        Since this API is not intended for public consumption, this request requires authorization.
      tags:
      - Lookup List
      responses:
        '200':
          description: Entries for the given lookup list.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          description: Unauthorized. This request requires valid authentication.
        '403':
          description: Forbidden. The user is not authorized to request this information.
        '404':
          description: Service is not available
    post:
      summary: Add an entry to a lookup list
      operationId: reuploadLookupListContentsFile
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: lookupListId
        required: true
        in: path
        description: The id of the Lookup List
        schema:
          type: integer
      - name: transactionId
        required: false
        in: query
        description: The transactionId
        schema:
          type: string
      - name: transactionStorageType
        required: false
        in: query
        description: 4 letter suffix of the table where the transaction is stored
          (e.g. CSCA)
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: If the transactionId is not specified then the contents of the
          body is a map containing the values to add
      description: |
        Since this API is not intended for public consumption, this request requires authorization.
      tags:
      - Lookup List
      responses:
        '200':
          description: success
        '401':
          description: Unauthorized. This request requires valid authentication.
        '403':
          description: Forbidden. The user is not authorized to request this information.
        '404':
          description: Service is not available
    delete:
      summary: Delete an entry from a lookup list
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: lookupListId
        required: true
        in: path
        description: The id of the Lookup List
        schema:
          type: integer
      - name: transactionId
        required: false
        in: query
        description: The transactionId
        schema:
          type: string
      - name: transactionStorageType
        required: false
        in: query
        description: 4 letter suffix of the table where the transaction is stored
          (e.g. CSCA)
        schema:
          type: string
      description: |
        Since this API is not intended for public consumption, this request requires authorization.
      tags:
      - Lookup List
      responses:
        '204':
          description: Entry deleted
        '401':
          description: Unauthorized. This request requires valid authentication.
        '403':
          description: Forbidden. The user is not authorized to request this information.
        '404':
          description: Service is not available
  '/businessUnits/{businessUnitId}/lookupLists/{lookupListId}/download':
    get:
      summary: Download a lookup list
      operationId: getDownloadLookupList
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: lookupListId
        required: true
        in: path
        description: The id of the Lookup List
        schema:
          type: integer
      - name: Accept
        in: header
        required: true
        description: Can download as a sas data file or a csv file. To download a
          csv file, include Accept=application/csv in the header. To download a sas
          file, include Accept=application/octet-stream+sas7bdat in the header
        schema:
          type: string
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '200':
          description: Downloaded lookup list
        '404':
          description: Specified lookup list was not found
        '406':
          description: Invalid headers.  Must specify Accept=application/csv or Accept=application/octet-stream+sas7bdat
  '/businessUnits/{businessUnitId}/lookupLists/{lookupListId}/rules':
    get:
      summary: Get rules associated with a specific list
      operationId: getLookupListRules
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: lookupListId
        required: true
        in: path
        description: The id of the Lookup List
        schema:
          type: integer
      - name: start
        required: false
        in: query
        description: start
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: limit
        schema:
          type: integer
      - name: fields
        required: false
        in: query
        description: fields
        schema:
          type: string
      - name: sortBy
        required: false
        in: query
        description: sortBy
        schema:
          type: string
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '200':
          description: Returns the rules associated with the lookup list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: The request was invalid
        '404':
          description: Specified lookup list was not found
  '/businessUnits/{businessUnitId}/lookuplists/files':
    get:
      summary: Get all uploaded lookup list file names
      operationId: getLookupListFiles
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: start
        required: false
        in: query
        description: start
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: limit
        schema:
          type: integer
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '200':
          description: Returns the filenames of all uploaded lookup list files
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: The request was invalid
    post:
      summary: Upload a new lookup list contents file
      operationId: uploadLookupListFile
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: Request body is the file to upload
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '201':
          description: created
        '204':
          description: Lookup list contents file uploaded successfully
        '400':
          description: The request was invalid
        '409':
          description: A contents file with the same name already exists
  '/businessUnits/{businessUnitId}/lookupLists/files/{fileName}/columns':
    get:
      summary: Get columns of an uploaded lookup list file
      operationId: getLookupListFileColumns
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: fileName
        required: true
        in: path
        description: Name of the contents file
        schema:
          type: string
      - name: start
        required: false
        in: query
        description: start
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: limit
        schema:
          type: integer
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '200':
          description: Returns columns of an uploaded lookup list file
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: The request was invalid
        '404':
          description: Specified file was not found
  '/businessUnits/{businessUnitId}/lookupLists/files/{fileName}/contents':
    get:
      summary: Get contents of an uploaded lookup list file
      operationId: getLookupListFileContents
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: fileName
        required: true
        in: path
        description: Name of the contents file
        schema:
          type: string
      - name: start
        required: false
        in: query
        description: start
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: limit
        schema:
          type: integer
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      tags:
      - Lookup List
      responses:
        '200':
          description: Returns contents of an uploaded lookup list file
          content:
            application/json:
              schema:
                type: object
        '400':
          description: The request was invalid
        '404':
          description: Specified file was not found
  '/businessUnits/{businessUnitId}/transactiontypes':
    get:
      summary: Return a list of transaction types defined for this business unit.
        (Used in production web app by Guided Rules feature)
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      description: |
        Since this API is not intended for public consumption, this request requires authorization.
      tags:
      - Transaction Types
      responses:
        '200':
          description: List of Transaction Types
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/TransactionTypeCollection'
            application/vnd.sas.finance.transaction.type+json:
              schema:
                $ref: '#/components/schemas/TransactionTypeCollection'
        '401':
          description: Unauthorized. This request requires valid authentication.
        '403':
          description: Forbidden. The user is not authorized to request this information.
        '404':
          description: Service is not available
  /businessUnits/{businessUnitId}/transactiontypes/{transactionTypeId}/actions:
    get:
      summary: Returns a list of actions defined for this transaction type. (Used
        in production web app by Guided Rules feature).
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      - name: transactionTypeId
        required: true
        in: path
        description: The id of the transaction type
        schema:
          type: integer
      description: |
        Since this API is not intended for public consumption, this request requires authorization.
      tags:
      - Actions
      responses:
        '200':
          description: List of Actions
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/ActionCollection'
            application/vnd.sas.finance.transaction.actions:
              schema:
                $ref: '#/components/schemas/ActionCollection'
        '401':
          description: Unauthorized. This request requires valid authentication.
        '403':
          description: Forbidden. The user is not authorized to request this information.
        '404':
          description: Service is not available
  /organizations:
    get:
      summary: Return a list of multiorg nodes this user has access to. (Used in production
        web app by Guided Rules feature)  feature).
      parameters:
      - name: businessUnit
        required: true
        in: query
        description: The id of the Business Unit
        schema:
          type: integer
      description: |
        Since this API is not intended for public consumption, this request requires authorization.
      tags:
      - Organizations
      responses:
        '200':
          description: List of Organizations
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/NodeCollection'
            application/vnd.sas.finance.transaction.node:
              schema:
                $ref: '#/components/schemas/NodeCollection'
        '401':
          description: Unauthorized. This request requires valid authentication.
        '403':
          description: Forbidden. The user is not authorized to request this information.
        '404':
          description: Service is not available
  '/businessUnits/{businessUnitId}/rules':
    post:
      tags:
      - Rules
      summary: 'Create a new rule. Required rule attributes on POST: name,transactionTypeId,
        multiOrgNodeID(Used in production web app by Guided Rules feature)'
      operationId: createRule
      parameters:
      - name: businessUnitId
        required: true
        in: path
        description: The id of the Business Unit
        schema:
          type: integer
      requestBody:
        $ref: '#/components/requestBodies/rule'
      description: 'Since this API is not intended for public consumption, this request
        requires authorization.'
      responses:
        '201':
          description: A Rule was created.
          headers:
            ETag:
              description: ETag for current resource
              schema:
                type: string
            Location:
              description: URI of the created resource
              schema:
                type: string
          content:
            application/vnd.sas.finance.decision.rule+json:
              schema:
                $ref: '#/components/schemas/rule'
            application/json:
              schema:
                $ref: '#/components/schemas/rule'
        '400':
          description: The request was invalid.
        '409':
          description: Another rule with the same ID has already been created.
    get:
      tags:
      - Rules
      summary: 'Returns a list of rules associated to a businessUnit'
      operationId: getRules
      responses:
        '200':
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/RuleCollection'
            application/vnd.sas.finance.alert.type+json:
              schema:
                $ref: '#/components/schemas/RuleCollection'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
      description: |-
        Since this API is not intended for public consumption, this request requires authorization.

        Retrieve some or all rules for the business unit, with or without paging
      parameters:
      - schema:
          type: string
        in: query
        name: fields
        description: Comma-separated list of fields to include
      - schema:
          type: string
        in: query
        name: filter
        description: The criteria for filtering the returned rules
      - schema:
          type: integer
        in: query
