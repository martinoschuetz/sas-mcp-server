    action:
      title: Action
      description: 'Business rules can take "actions" on incoming transactions. An
        example of an action is to recommend the credit card authorization request
        be declined. Or that an alert be created on the credit card. A Transaction
        Type has a collection of actions that rule writers can choose from when creating
        a rule that executes against that type of transaction. For instance a Credit
        Card Authorization Type of transaction may include actions (Approve, Refer,
        Decline, Pickup, Create Alert) . While a Payment Transaction type may include
        actions (Hold, Release, Cancel).'
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: string
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: The name of the action.
        description:
          type: string
          description: The description of the action.
        alertAction:
          type: boolean
          description: Is this an alert action and therefore requires additional configuration
            beyond just choosing to use the action . It will require a destination
            queue where the alert will be created and may have an optional alert reason.
    NodeCollection:
