    rule:
      title: Rule
      description: 'The value proposition for our solution is that our modeling team
        can create a model which will predict fraud better than our client could with
        business rules alone. And while customers recognize the value of analytic
        methods in predicting fraud, they also believe that they have unique business
        domain expertise that can be brought to bear on the problem. Therefore we
        offer the Rules Studio web application where individual users can author business
        rules that run after the model score code and can be used to enhance the fraud
        decision. The Rules Studio supports a peer development model. Hence a rule
        belongs not to the individual that authored it, but to the business unit that
        he/she was acting on behalf of when the rules was created. There are 2 types
        of rules: Classic Coding rules and Guided rules. Classic coding rules consist
        of logic in the form of SAS DATA step fragments of code which are authored
        in a free form code editor and deployed into a SAS Decision engine. Guided
        rules consist of a more structured set of decision logic and are authored
        in a point and click "guided" user interface. Note that there are many types
        of decision engines in the industry: inference engines, state based engines,
        sequential engines. The SAS Fraud Management decision engine is a sequential
        engine. It executes one rule after the other. Any dependencies between the
        rules are used to determine the execution order. Once all rules have execute,
        the most server recommendation to us returned. Rules may use resources such
        as lookup lists or user variables.'
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: string
          description: The system-assigned unique ID for this object.
        baseRuleId:
          type: integer
          description: Identifies the rule across all its version.
        revision:
          type: integer
          description: The particular version of the rule. The baseRuleId and the
            revision number uniquely identify a specific version of a rule.
        name:
          type: string
          description: The name of the rule.
        description:
          type: string
          description: rule description.
        ruleTypeName:
          type: string
          description: 'There are 3 types of rules: Authorization, Variable, Queue.'
        state:
          type: string
          description: 'Rules start out in Coding state, progress to the Testing state,
            then the Production state. Seasonal rules may be Deactivated. And finally
            rules may be placed in the Trash state. If a newer version of a rule replaces
            an older version in production, then the older version is put in an Archive
            state.'
        businessUnitId:
          type: integer
          description: Id of the business unit that owns this rule.
        transactionTypeId:
          type: integer
          description: Identifies the type of transactions this rule executes against.
        multiOrgNodeId:
          type: integer
          description: System supplied Id for the client supplied multiOrg label.
        alertReason:
          type: string
          description: 'If this rule creates an alert, this reason will be displayed
            to the analyst to explain in human terms why the rule created the alert.'
        guidedRule:
          type: boolean
          description: 'If true, then the guided rule editor was used to author this
            rule. Otherwise the classic code editor was used.'
        executionOrderType:
          type: integer
          description: 'There are 3 pre-defined sets of rules : Pre Rules (-1) , Dependency
            Ordered rules (0) , and Pre-rules (1). The Pre-rule set executes first,
            then the dependency ordered rule set, then the post rule set.'
        executionOrderPriority:
          type: integer
          description: Pre rules and Post rules are manually ordered. This is the
            execution order of the rules in the set. The lowest value rule executes
            first.
        expressions:
          $ref: '#/components/schemas/ruleExpression'
        ruleCode:
          type: string
          description: The SAS data step code fragment associated with this rule.
        createUser:
          type: string
          description: The userid of the user that created this lookup list definition.
        createTimestamp:
          type: string
          format: date-time
          description: The date and time when this rule was created.
        lastUpdateUser:
          type: string
          description: The userid of the user that last updated the rule definition.
        lastUpdateTimestamp:
          type: string
          format: date-time
          description: The date and time when this lookup list definition was changed
            in some way.
        lastUpdateNumber:
          type: integer
          description: The date and time when this lookup list definition was changed
            in some way.
    ruleExpression:
      title: Rule Expression
      description: Rule Expression
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: string
          description: The system-assigned unique ID for this object.
        type:
          type: string
          description: 'The type of expression. Valid values are: IF, AND, COMPARE,
            IN, NOT, OR, NOR, EXPRESSIONLIST, RANGE'
        operator:
          type: string
          description: 'Valid values are: AND, OR, NOT, EQUAL, NE, GT, GTE, LT, LTE,
            IN, NOTIN, NOTMISSING, MISSING'
