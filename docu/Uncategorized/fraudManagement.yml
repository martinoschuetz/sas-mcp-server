    node:
      title: MultiOrg Node
      description: 'A multiOrg is a hierarchical (tree) organization composed of MultiOrg
        nodes. Each node has a parent (except the root node(s)) and each node can
        have a list of child nodes. Each node has a decorative name such as "Sub Prime
        Portfolios" and a hierarchical key that represents the path from the root
        to the node. For instance the root node has a hierarchical Key of ''A'' and
        a node with a hierarchical key of ''AB'' would be a child of the root node,
        while a node with a hierarchical key of ''ABB'' would be a grandchild of the
        root node.'
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: string
          description: The system-assigned unique ID for this object.
        key:
          type: string
          description: Hierarchical key which represents the path from this node to
            the root node. For instance a A represents the root node. AB represents
            the 2nd child of the root node. etc...
        parentId:
          type: integer
          description: id of this node's parent node.
        tenantMultiOrgId:
          type: integer
          description: Each tenant lays claim to a non-overlapping branch of the tree.
            This value is the Id of the node associated with the tenant owning this
            branch of the tree.
        displayName:
          type: string
          description: The name used when displaying the node to users.
