    lookupList:
      title: Lookup List
      description: 'A Lookup list is a set of key/value(s) pairs or just a set of
        keys. Lookup lists are defined by rule administers for use in rules written
        by rule writers in the Rules Studio web application. An example of a lookup
        list is a compromised card list which contains a list of card numbers that
        are suspect and may in combination with elevated fraud scores warrant declining
        transactions on this card or assuming the risk and creating an alert which
        will be followed up on by a call center analyst or IVR system calling the
        card holder ASAP. In this case the card number is the key of the lookup list
        and there are no associated values for the card. the card is either present
        on the lookup list or not. This example also shows the use of lookup lists
        as a means to maintain PII data separate from the rule logic. <br> Another
        use of lookup lists is to separate rule parameters that may change frequently
        from the rule logic. In this case the list will have both a key and a set
        of returned values. For instance a score band table might have a key which
        is the score (integer value from 0 to 1000) and a response value that indicates
        if this value is considered ''high risk'', ''low risk'', etc. <br> Lookup
        lists are not a versioned resource. Once defined very little can be changed
        about the lookup list with out creating a new one. <br> Once a lookup list
        is created it is in an active state meaning it can be used by rules. If a
        rule writer wishes to delete a lookup list , they first make it inactive.
        This means the lookup list can not be used in any new rules. While inactive
        the rule writer should remove any references to the lookup list in existing
        rules. After all references to the lookup list have been removed, the inactive
        lookup list can be deleted. <br> There are 2 types of lookup lists in the
        solution. Rule based lookup lists which are bulk loaded with data when they
        are defined and whose lifecycle and content are managed by the rule writers/administrators..
        And analyst lookup list which are a collaborative resource defined by the
        rule writes/administrators for use by the analysts in the call center. They
        usually start out without any content and as analyst in the call center perform
        their investigations and interact with customers they add compromised/suspect
        entities to these lookup lists. Analyst accessible lookup lists are not as
        free form as rule based lookup lists. Analyst lookup lists consist of a key(s)
        that must correspond to transaction field(s). and a single returned data value
        which is the date the entry was added to the list. The date is used in rules
        to determine if the entry is so old that it should not be considered when
        making rule based decisions.'
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: integer
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: The name of the lookup list. This value is assigned by the
            rule administrator and used in the rule to refer to the lookup list. Lookup
            list names must be unique within a tenant.
        description:
          type: string
          description: Description of the content of this lookup list and its purpose.
        status:
          type: string
          description: Has a value of 'ACTIVE' or 'INACTIVE'. An active lookup list
            is one that can be used in new rules. An inactive lookup list is one that
            may be in use in production or testing rules but is being decommissioned.
            An inactive lookup list can not be used in new rules. Making a lookup
            list inactive is the first step to deleting it entirely.
        storageType:
          type: string
          description: 'Has a value of ''SOR'' or ''FILESYSTEM''. In past release
            lookup list content has been stored in the file system. However, in release
            4.4 a new type of lookup list was introduced that stored its content in
            the application database (aka System of Record database SOR)'
        analystAccessible:
          type: boolean
          description: 'If true, then analyst using the call center application can
            add and remove entries to the lookup list content .'
        expirationDays:
          type: integer
          description: 'If non-zero then the content on this list is transient and
            will be removed/expire after a certain number of days. This attribute
            is used with analyst accessible lists where call center staff are adding
            content to the lookup list. The though is that if these temporary additions
            are valid (or time insensitive), they will be rolled over to a more permanent
            list.. and the analysts additions will age off.'
        refreshTimestamp:
          type: string
          format: date-time
          description: 'The date and time when the content of the lookup list was
            last changed in the rules studio. For lookup lists that are stored in
            the filesystem, this means the date/time the file containing the lookup
            list content was modified on disk. If the lookup list is stored in the
            SOR data base then individual entries can be added and removed from the
            list . The refresh date is the date of the last entry added. removing
            an entry does not update the refresh timestamp. <br> Note that this refresh
            data refers to the last modified time of the lookup list content accessible
            to the rules studio for rule development and simulation of rule behavior.
            It is not necessarily the date/time of the lookup list content in the
            real-time engine. The real-time decision engine loads the lookup lists
            into memory at startup. A lookup list reload command can cause the engine
            to reload the entire contents of its in memory lookup list. But this does
            *not* happen automatically when new content is uploaded via the rules
            studio. Analyst accessible lookup lists can have individual entries added/removed
            to/from them. these updates are sent to the real-time engine in real-time.'
