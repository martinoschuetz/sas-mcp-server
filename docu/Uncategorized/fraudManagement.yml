components:
  requestBodies:
    rule:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/rule'
      required: true
    rulesWorkflow:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/rulesWorkflow'
  schemas:
    Collection:
      required:
      - version
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: |
            Zero or more link objects. See the above link relations table for a
            description of the link types.
        name:
          type: string
          description: |
            The abstract name of the collection; what the "items" member
            represents.  Note - The value SHOULD be something other than "items".
            That is, no not use "items".
        accept:
          type: string
          description: 'A space-separated list of link type names from which an Accept
            header for items may be constructed by appending a formt (+json, +xml)
            and optional ;version=n'
        start:
          type: integer
          description: The 0-based index of the first
        count:
          type: integer
          description: |
            The number of items in the collection. May be omitted if the count is
            not known start long integer.  The index of the first item in this
            collection view, 0-based.
        items:
          type: array
          items:
            type: object
        limit:
          type: integer
          description: The number of items to return in each page
        version:
          type: integer
          description: |
            This media type's schema version number. This representation is
            version 2.
    BusinessUnitCollection:
      required:
      - version
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: |
            Zero or more link objects. See the above link relations table for a
            description of the link types.
        name:
          type: string
          description: |
            The abstract name of the collection; what the "items" member
            represents.  Note - The value SHOULD be something other than "items".
            That is, no not use "items".
        accept:
          type: string
          description: 'A space-separated list of link type names from which an Accept
            header for items may be constructed by appending a formt (+json, +xml)
            and optional ;version=n'
        start:
          type: integer
          description: The 0-based index of the first
        count:
          type: integer
          description: |
            The number of items in the collection. May be omitted if the count is
            not known start long integer.  The index of the first item in this
            collection view, 0-based.
        items:
          type: array
          items:
            $ref: '#/components/schemas/businessUnit'
        limit:
          type: integer
          description: The number of items to return in each page
        version:
          type: integer
          description: |
            This media type's schema version number. This representation is
            version 2.
    businessUnit:
      title: Business Unit
      description: 'A Business Unit is a grouping of users who share access to common
        resources such as transaction types, rules, lookup lists, user variables,
        etc. A financial institution might define 2 business units one for its Credit
        Card Rule writes and one for its Debit Card Rule writes in order to give them
        customized views into the resource available to them. For instance a rule
        writer who is a member of the Credit Card Business unit would see Credit Card
        related transactions when selecting transactions his/her rule should execute
        on. While a rule write in the Debit Card business unit would only see Debit
        card transactions. The business unit concept helps scope what resources the
        user sees and interacts with to only those resources that are relevant to
        the business unit he is acting on behalf of. Users can belong to many business
        units and can switch which business unit they are acting on behalf of. when
        they switch business units, their view of the resources available to them
        changes to reflect the resources defined for that business unit.'
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: integer
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: Business Unit Name
        description:
          type: string
          description: Description of the business units purpose.
        tenantMultiOrgId:
          type: integer
          description: Tenant to which this business unit belongs (expressed as Tenant's
            MultiOrg Id)
