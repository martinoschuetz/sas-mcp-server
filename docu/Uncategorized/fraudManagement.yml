        accept:
          type: string
          description: 'A space-separated list of link type names from which an Accept
            header for items may be constructed by appending a formt (+json, +xml)
            and optional ;version=n'
        start:
          type: integer
          description: The 0-based index of the first
        count:
          type: integer
          description: |
            The number of items in the collection. May be omitted if the count is
            not known start long integer.  The index of the first item in this
            collection view, 0-based.
        items:
          type: array
          items:
            $ref: '#/components/schemas/queue'
        limit:
          type: integer
          description: The number of items to return in each page
        version:
          type: integer
          description: |
            This media type's schema version number. This representation is
            version 2.
    queue:
      title: Queue
      description: A queue is a means of managing the alert workload. When an alert
        is created it is assigned to a work queue. queues are grouped together into
        strategies and analyst are assigned to work alerts in a strategy. In this
        way a dedicated team of analysts can be assigned to work high risk strategies
        and be unaffected by the volume of low risk alerts coming into the system.
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: string
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: The name of the queue.
        description:
          type: string
          description: Description of the queue.
        strategyId:
          type: integer
          description: A strategy is a collection of queues. This is the id of the
            parent strategy for this queue.
        status:
          type: string
          description: 'ACTIVE or INACTIVE. ACTIVE: Active alerts in the queue can
            be serviced in outbound mode. INACTIVE: Active alerts in the queue cannot
            be serviced in outbound mode.'
        priority:
          type: integer
          description: queue priority where 1 is the highest priority queue.
        callResultNames:
          type: string
          description: 'After an analyst has called the customer and verified the
            transactions as OK or fraudulent, they status the alert in the call wrap
            up portion of the analyst workstation''s alert page with a call result
            from this list.'
        emails:
          type: array
          items:
            type: string
          description: array of emails
        letters:
          type: array
          items:
            type: string
          description: array of letters
        defaultEmail:
          type: string
          description: default email
        defaultSms:
          type: string
          description: default sms
        defaultLetter:
          type: string
          description: default letter
        sortOrder:
          type: string
          description: 'Specifies the default sort order for queues. Valid values
            are ASC (ascending) and DESC (descending). For numbers and amounts, ascending
            means from smallest to largest. For timestamps, ascending means form oldest
            to newest.'
        sortField:
          type: string
          description: 'Specifies the default field on which queues are sorted. Valid
            values are FRAUD_SCORE_1, FRAUD_SCORE_2, FRAUD_SCORE_3, FRAUD_SCORE_4
            (fraud score), LST_TRANSACTION_TIMESTAMP (last transaction date), and
            LST_TRANSACTION_AMT (dollar amount).'
        inbound:
          type: boolean
          description: Indicates that analyst working in bound calls from customers
            can create manual alerts in this queue.
        callLowerBound:
          type: integer
          description: Value between 0 and 23. Specifies the default calling hours
            (starting time) for a new queue.
        callUpperBound:
          type: integer
          description: Value between 0 and 23. Specifies the default calling hours
            (ending time) for a new queue.
        autoCloseNewAlerts:
          type: integer
          description: Specifies the number of days before an alert is closed if it
            has not been worked.
        callSuperseded:
          type: string
          description: Specifies whether the alerts within a queue can be worked outside
            of the specified customer calling hours.
        stickyQueue:
          type: boolean
          description: Specifies whether the Alerts in this queue are never reassigned
            (sticky) indicator is enabled (true) or disabled (false) for a new queue.
        routeAlertsInboundAllowed:
          type: boolean
          description: Are route alerts inbound allowed
        disableForceCheckout:
          type: boolean
          description: 'if true, then analysts are not able to check out an alert
            that has already been checked out by another analyst.'
        productionRulesAccepted:
          type: boolean
          description: 'it true, then queue accepts production rules. If false, then
            rules that are not in production that are associated with this queue cannot
            be promoted to production. This selection does not affect rules that are
            currently in production.'
        systemBlockDays:
          type: integer
          description: Specifies the number of days for a system block code. The date
            that the analyst sees is today plus the number in this property.
        transactionBlockDays:
          type: integer
          description: Specifies the number of days for a transaction block code.
            The date that is displayed by default to the analyst is today plus the
            number in this property.
        lastUpdateNumber:
          type: integer
          description: every time a change is made to the queue definition the last
            update number is incremented by one.
    AlertTypeCollection:
      required:
      - version
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: |
            Zero or more link objects. See the above link relations table for a
            description of the link types.
        name:
          type: string
          description: |
            The abstract name of the collection; what the "items" member
            represents.  Note - The value SHOULD be something other than "items".
            That is, no not use "items".
        accept:
          type: string
          description: 'A space-separated list of link type names from which an Accept
            header for items may be constructed by appending a formt (+json, +xml)
            and optional ;version=n'
        start:
          type: integer
          description: The 0-based index of the first
        count:
          type: integer
          description: |
            The number of items in the collection. May be omitted if the count is
            not known start long integer.  The index of the first item in this
            collection view, 0-based.
        items:
          type: array
          items:
            $ref: '#/components/schemas/alertType'
        limit:
          type: integer
          description: The number of items to return in each page
        version:
          type: integer
          description: |
            This media type's schema version number. This representation is
            version 2.
    alertType:
      title: Alert Type
      description: An alert is a work item created by an action in a rule while processing
        transactions and indicates there is a high degree of risk associated with
        the (card/account/customer/other) aspect of the transaction. An analyst working
        in the call center will use the analyst workstation web application to bring
        the alert to closure by investigating the account/card/customer's past behavior
        or by calling them.
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: string
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: Name of the alert type
        description:
          type: string
          description: Description of the alert type.
        AlertableEntityField:
          type: string
          description: The name of the field in the transaction used to create this
            alert.
        AlertableEntitySegmentAcronym:
          type: string
          description: 3 letter acronym of the segment the alertable entity field
            belongs to.
        contactAlertTypeID:
          type: string
          description: Single character designating the ID of the contact alert type.
        contactAlertableEntityField:
          type: string
          description: The name of the field in the transaction used to identify the
            contact for the alert.
        contactAlertableEntitySegmentAcronym:
          type: string
          description: 3 letter acronym of the segment the contact field belongs to.
        parentAlertTypeID:
          type: string
          description: Single character designating the ID of the parent alert type.
        parentAlertableEntityField:
          type: string
          description: The name of the field in the transaction used to identify the
            parent alert type.
    deployment:
      title: Deployment
      description: A deployment is a collection of all production rules and model
        choices for a tenant. A deployment is stored in a flat file which is ingested
        by a running OnDemand Decision Engine (ODE) to make decisions on incoming
        transactions. While an ODE is executing a deployment the rule writer is free
        to make changes to the rule base in the Rules Studio without effecting the
        running engine's rule base.
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: string
          description: The system-assigned unique ID for this object.
        tenantMultiOrgId:
          type: string
          description: Identifies which tenant this deployment is for by siting the
            tenant's root multiorg node id.
        status:
          type: string
          description: Values of 'Completed' or 'inProgress'
        buildContents:
          type: array
          description: Collection of application/vnd.sas.finance.tenant.deployment.item(s)
            in execution order.
          items:
            $ref: '#/components/schemas/deploymentItem'
        lastUpdateUser:
          type: string
          description: Name of the user that created this deployment.
        lastUpdateTimestamp:
          type: string
          format: date-time
          description: Time at which this deployment completed.
        contactAlertableEntityField:
          type: string
          description: The name of the field in the transaction used to identify the
            contact for the alert.
        contactAlertableEntitySegmentAcronym:
          type: string
          description: 3 letter acronym of the segment the contact field belongs to.
        parentAlertTypeID:
          type: string
          description: Single character designating the ID of the parent alert type.
        parentAlertableEntityField:
          type: string
          description: The name of the field in the transaction used to identify the
            parent alert type.
    deploymentItem:
      title: Deployment Item
      description: A deployment is a collection of all production rules and model
        choices for a tenant. A deployment is stored in a flat file which is ingested
        by a running OnDemand Decision Engine (ODE) to make decisions on incoming
        transactions. While an ODE is executing a deployment the rule writer is free
        to make changes to the rule base in the Rules Studio without effecting the
        running engine's rule base.
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: string
          description: The system-assigned unique ID for this object.
        ruleId:
          type: string
          description: Rule Id
        ruleState:
          type: string
          description: The state of the rule when it was deployed. The value will
            be either Production or Testing (if deploying testing rules to run on
            live transactions)
        ruleSlotId:
          type: integer
          description: When a rule fires it sets a bit in the rules fired array. This
            is the index of the bit used by this rule at the time of the deployment.
            Note that since the time of the deployment the rule may have been deactivated
            and its index given to another rule.
    logEventCollection:
      title: LogEvents
      description: Log Events from SAS
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        id:
          type: string
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: name of the Log Event.
        resultCount:
          type: integer
          description: Result Count
        warningCount:
          type: integer
          description: Warning Count
        errorCount:
          type: integer
          description: Error Count
        totalCount:
          type: integer
          description: Total Count
        matchCount:
          type: integer
          description: Match Count
        items:
          type: array
          items:
            $ref: '#/components/schemas/logEvent'
    logEvent:
