    put:
      operationId: updateAgent
      summary: Update an Agent by its ID
      description: Update an Agent by its ID.
      tags:
      - Agents
      parameters:
      - $ref: "#/paths/~1bots~1%7BagentId%7D/get/parameters/0"
      - name: If-Match
        in: header
        description: "The ETag that was returned from a GET, POST, PUT, PATCH, or\
          \ HEAD of this object.  If the ETag does not match, the update will fail."
        required: true
        schema:
          type: string
      - name: Content-Type
        required: true
        description: The representation in the request body.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.bot+json
          - application/vnd.sas.metadata.scheduled.bot+json
          - application/json
          default: application/vnd.sas.metadata.bot+json
      - name: Accept
        description: The desired representation for the response. The default is application/vnd.sas.metadata.definition+summary+json.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.bot+json
          - application/vnd.sas.metadata.scheduled.bot+json
          - application/vnd.sas.metadata.bot.summary+json
          - application/json
          default: application/vnd.sas.metadata.bot+json
      requestBody:
        content:
          application/vnd.sas.metadata.bot+json:
            schema:
              $ref: "#/paths/~1bots~1%7BagentId%7D/put/requestBody/content/application~1json/schema"
            examples:
              Agent:
                $ref: "#/paths/~1bots~1%7BagentId%7D/put/requestBody/content/application~1json/examples/Agent"
          application/vnd.sas.metadata.scheduled.bot+json:
            schema:
              title: Scheduled Agent
              description: A Catalog agent with scheduling information.
              type: object
              required:
              - name
              allOf:
              - $ref: "#/paths/~1bots~1%7BagentId%7D/put/requestBody/content/application~1json/schema"
              properties:
                triggers:
                  type: array
                  description: Schedule triggers used to automate running the agent.
                  items:
                    required:
                    - name
                    - type
                    properties:
                      id:
                        type: string
                        description: unique identifier for a particular trigger
                      type:
                        type: string
                        description: Specify type of trigger as a String.
                        enum:
                        - IMMEDIATE
                        - SIMPLE
                        - CRON
                        - TIMEEVENT
                        default: IMMEDIATE
                      name:
                        type: string
                        description: An identifier used in retrieving this trigger
                      group:
                        type: string
                        description: An identifier used in retrieving this trigger
                      applicationId:
                        type: string
                        description: An identifier used to describe the application
                          that created the trigger
                      start:
                        type: string
                        format: date-time
                        description: "A representation of the time when the scheduler\
                          \ will run the job. This time string expects a format based\
                          \ on the common form of ISO-8601, YYYY-MM-DDTHH:MM:SS.SSSZ,\
                          \ which is year-month-day letter 'T' hour:minute:second\
                          \ and fractions. Used by SIMPLE and CRON types."
                      end:
                        type: string
                        format: date-time
                        description: "A representation of the time when the scheduler\
                          \ will stop scheduling the job. This time string expects\
                          \ a format based on the common form of ISO-8601, YYYY-MM-DDTHH:MM:SS.SSSZ,\
                          \ which is year-month-day letter 'T' hour:minute:second\
                          \ and fractions. Used by SIMPLE and CRON types."
                      repeat:
                        type: integer
                        description: 'Set the number of times to repeat the job, given
                          other constraints. "-1" is special, meaning run the job
                          forever. Used by SIMPLE and CRON types.'
                        default: 1
                      interval:
                        type: array
                        description: Set the spacing between repetition of the job.
                          May be a single non-negative integer referring to the number
                          of interval units for all interval units except WEEKDAY
                          or a list of weekdays for the interval unit of WEEKDAY.
                          Used by SIMPLE and CRON types.
                        items:
                          type: string
                      intervalUnit:
                        type: string
                        description: Set the time unit for the spacing between job
                          executions. Used by SIMPLE and CRON types.
                        enum:
                        - SECOND
                        - MINUTE
                        - HOUR
                        - DAY
                        - WEEK
                        - WEEKDAY
                        - MONTH
                        - YEAR
                        default: DAY
                      day:
                        type: string
                        description: "Set the day of the week to run the job, given\
                          \ other constraints. Used by SIMPLE and CRON types."
                        enum:
                        - SUNDAY
                        - MONDAY
                        - TUESDAY
                        - WEDNESDAY
                        - THURSDAY
                        - FRIDAY
                        - SATURDAY
                        default: MONDAY
                      cron:
                        type: string
                        description: 'Specify a "cron expression" as a String. A cron
                          expression is a string comprised of 6 or 7 fields separated
                          by white space. For details on the values of the fields,
                          see http://www.quartz-scheduler.org/documentation/quartz-1.x/tutorials/crontrigger.
                          Required for CRON type.'
                      active:
                        type: boolean
                        description: designates if the associated job will be run
                          based on the definition of this trigger
                        default: true
                      timeEvent:
                        description: Collection of fields used for the TIMEEVENT type.
                          Required for TIMEEVENT type.
                        required:
                        - hours
                        - minutes
                        - recurrence
                        properties:
                          recurrence:
                            required:
                            - type
                            properties:
                              type:
                                type: string
                                description: RecurrenceType for the recurrence
                                enum:
                                - minutely
                                - hourly
                                - daily
                                - weekly
                                - monthly
                                - yearly
                                - datelist
                              startDate:
                                type: string
                                description: The date to start this recurrence specified
                                  as yyyy-mm-dd. Required for all recurrence types
                                  except datelist.
                                default: No default
                              endDate:
                                type: string
                                description: The date to end this recurrence specified
                                  as yyyy-mm-dd. Used by all recurrence types except
                                  datelist.
                                default: No default
                              skipCount:
                                type: integer
                                description: "The number of interval units to skip,\
                                  \ defaults to 1 meaning no skip. Used by all recurrence\
                                  \ types except datelist."
                                default: 1
                              daysOfWeek:
                                type: array
                                description: a list of weekdays. Required for weekly
                                  recurrence type. Used by monthly and yearly recurrence
                                  types in conjunction with occurrence but should
                                  contain only one weekday for these types.
                                items:
                                  type: string
                                  enum:
                                  - sunday
                                  - monday
                                  - tuesday
                                  - wednesday
                                  - thursday
                                  - friday
                                  - saturday
                                  default: No default
                              occurrence:
                                type: string
                                description: Ordinal value representing a specific
                                  week instance. Used by monthly and yearly recurrence
                                  types in conjunction with daysOfWeek.
                                enum:
                                - first
                                - second
                                - third
                                - fourth
                                - last
                                default: No default
                              dayOfMonth:
                                type: string
                                description: "The specific numerical value for a day.\
                                  \ Range is from 1 to 32. 32 is a special value meaning\
                                  \ the last day of the month, no matter how many\
                                  \ days the month has. If a day is specified but\
                                  \ does not exist, the job is skipped. Used by monthly\
                                  \ and yearly recurrence types as an alternative\
                                  \ to occurrence and daysOfWeek."
                                default: No default
                              monthOfYear:
                                type: string
                                description: The month to run the job. Required for
                                  yearly recurrence type.
                                enum:
                                - January
                                - February
                                - March
                                - April
                                - May
                                - June
                                - July
                                - August
                                - September
                                - October
                                - November
                                - December
                                default: No default
                              dates:
                                description: a list of dates using format yyyy-mm-dd.
                                  Required for the datelist recurrence type.
                                type: array
                                items:
                                  type: string
                                default: No default
                              expression:
                                type: string
                                description: A scheduler specific opaque field.  Not
                                  currently used by this scheduler
                                default: No default
                          hours:
                            type: string
                            description: "comma-separated list of hours for a TimeEvent\
                              \ trigger. Values should be between 0 and 23, inclusive."
                          minutes:
                            type: string
                            description: "comma-separated list of minutes for a TimeEvent\
                              \ trigger. Values should be between 0 and 59, inclusive."
                          timezone:
                            type: string
                            description: "timezone used to interpret hours:minutes\
                              \ for TimeEvent trigger"
                            default: GMT
                          maxOccurrence:
                            type: string
                            description: number of times to run the TimeEvent job.
                              The default of -1 means no maximum
                            default: "-1"
