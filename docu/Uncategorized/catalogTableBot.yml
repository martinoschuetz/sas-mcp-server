          type: string
          enum:
          - application/vnd.sas.metadata.bot+json
          - application/vnd.sas.metadata.scheduled.bot+json
          - application/vnd.sas.metadata.bot.summary+json
          - application/json
          default: application/vnd.sas.metadata.bot+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
            Etag:
              description: A tag that identifies this revision of the object.
              schema:
                type: string
            Last-Modified:
              description: "The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format\
                \ when the object was last modified."
              schema:
                type: string
          content:
            application/vnd.sas.metadata.bot+json:
              schema:
                $ref: "#/paths/~1bots~1%7BagentId%7D/put/requestBody/content/application~1json/schema"
              examples:
                Agent:
                  $ref: "#/paths/~1bots~1%7BagentId%7D/get/responses/200/content/application~1json/examples/Agent"
            application/vnd.sas.metadata.bot.summary+json:
              schema:
                title: Agent Summary
                description: Summary information about an agent.
                type: object
                required:
                - name
                - provider
                - parameters
                properties:
                  name:
                    type: string
                    description: the name of this agent; the maximum length is 100.
                  description:
                    type: string
                    description: The descriptive text for this agent; the maximum
                      length is 1000.
                  provider:
                    type: string
                    description: The name of the agent provider; the maximum length
                      is 100. This is automatically prefixed with "CATALOG-" to determine
                      the JES provider name.
                  parameters:
                    type: object
                    description: Provider specific JSON parameters for the agent in
                      the form of a map.
                  suppressChangeDetection:
                    type: boolean
                    description: "A hint to the provider that change detection is\
                      \ not needed when this property is set to true. This can be\
                      \ useful, for instance, when agent parameters have changed and\
                      \ necessitate a complete reanalysis of the content generated\
                      \ by the agent."
                  agentType:
                    type: string
                    description: The type of this agent; the valid values are `DiscoveryAgent`
                      or `SchemaExtractionAgent`. Defaults to `DiscoveryAgent`.
                  agentTypeLabel:
                    type: string
                    description: The localized displayable name of the agent type.
                    readOnly: true
              examples:
                Agent:
                  summary: Agent Summary
                  description: A summary representation of an agent.
                  value:
                    creationTimeStamp: "2021-09-17T14:46:05.376Z"
                    createdBy: sasuser
                    modifiedTimeStamp: "2021-09-17T14:46:33.836Z"
                    modifiedBy: sasuser
                    id: ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                    version: 1
                    provider: TABLE-BOT
                    name: Crawl SASHelp (compute)
                    description: Crawl the SASHelp library
                    agentType: DiscoveryAgent
                    agentTypeLabel: Discovery agent
                    parameters:
                      datasourceURI: /dataSources/providers/Compute/sources/eb654570-efb4-4d61-9814-3444869805b0~fs~SASHELP
                    links:
                    - method: GET
                      rel: self
                      href: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                      uri: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                      type: application/vnd.sas.metadata.bot
                    - method: GET
                      rel: up
                      href: /catalogTableBot/bots
                      uri: /catalogTableBot/bots
                      type: application/vnd.sas.collection
