      operationId: getAgent
      summary: Get an Agent by its ID
      description: Get an Agent by its ID.
      tags:
      - Agents
      parameters:
      - name: agentId
        required: true
        description: The ID of the Agent
        in: path
        schema:
          type: string
      - name: Accept
        description: The desired representation for the response.
