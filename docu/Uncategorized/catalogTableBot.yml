                      type: application/vnd.sas.metadata.bot
                      responseType: application/vnd.sas.metadata.bot
                    - method: DELETE
                      rel: delete
                      href: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                      uri: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
            application/vnd.sas.metadata.scheduled.bot+json:
              schema:
                $ref: "#/paths/~1bots~1%7BagentId%7D/put/requestBody/content/application~1vnd.sas.metadata.scheduled.bot%2Bjson/schema"
              examples:
                Scheduled Agent:
                  summary: Scheduled Agent
                  description: |
                    This response demonstrates an agent with a Scheduler service trigger. The scheduler service will run the agent according to the provided schedule. Note that triggers is an array, and so there can be more than one schedule associated with the agent.
                    The 'jobRequestURI' and 'scheduledJobURI' are (respectively) links to the agent's Environment Manager job request and Scheduler service resources.
                  value:
                    creationTimeStamp: "2021-09-17T14:46:05.376Z"
                    createdBy: sasuser
                    modifiedTimeStamp: "2021-09-17T14:46:33.836Z"
                    modifiedBy: sasuser
                    id: ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                    version: 1
                    provider: TABLE-BOT
                    name: Crawl SASHelp (compute)
                    description: Crawl the SASHelp library
                    agentType: DiscoveryAgent
                    agentTypeLabel: Discovery agent
                    parameters:
                      datasourceURI: /dataSources/providers/Compute/sources/eb654570-efb4-4d61-9814-3444869805b0~fs~SASHELP
                    triggers:
                    - type: TIMEEVENT
                      name: Nightly
                      active: true
                      recurrence:
                        type: daily
                        startDate: "2020-04-02"
                        skipCount: 1
                        dayOfMonth: 1
                      hours: "22"
                      minutes: "00"
                      duration: 100
                      timezone: America/New_York
                      maxOccurrence: -1
                    jobRequestURI: /jobExecution/jobRequests/2f85f24b-84ae-4ef0-b45e-5a253ac86131
                    scheduledJobURI: /scheduler/jobs/efd6a2d4-f0c3-40c4-a23e-e81b43916a4f
                    links:
                    - method: GET
                      rel: self
                      href: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                      uri: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                      type: application/vnd.sas.metadata.bot
                    - method: GET
                      rel: up
                      href: /catalogTableBot/bots
                      uri: /catalogTableBot/bots
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.metadata.bot
                    - method: PUT
                      rel: update
                      href: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                      uri: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                      type: application/vnd.sas.metadata.bot
                      responseType: application/vnd.sas.metadata.bot
                    - method: DELETE
                      rel: delete
                      href: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                      uri: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
            application/json:
              schema:
                $ref: "#/paths/~1bots~1%7BagentId%7D/put/requestBody/content/application~1json/schema"
              examples:
                Agent:
                  summary: Agent
                  description: A catalog agent response.
                  value:
                    creationTimeStamp: "2021-09-17T14:46:05.376Z"
                    createdBy: sasuser
                    modifiedTimeStamp: "2021-09-17T14:46:33.836Z"
                    modifiedBy: sasuser
                    version: 1
                    id: ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                    name: Crawl SASHelp (compute)
                    description: Crawl the SASHelp library
                    agentType: DiscoveryAgent
                    agentTypeLabel: Discovery agent
                    provider: TABLE-BOT
                    parameters:
                      datasourceURI: /dataSources/providers/Compute/sources/eb654570-efb4-4d61-9814-3444869805b0~fs~SASHELP
                    links:
                    - method: GET
                      rel: self
                      href: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                      uri: /catalogTableBot/bots/ba14bc66-8aaf-4a57-bff1-87a39774ac1a
                      type: application/vnd.sas.metadata.bot
                    - method: GET
                      rel: up
