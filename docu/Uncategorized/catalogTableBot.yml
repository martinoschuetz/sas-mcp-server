---
openapi: 3.0.3
info:
  version: "2"
  title: Catalog Table Bot
  description: |
    The Catalog Table Bot API is a Catalog Provider implementation that provisions Compute and CAS table metadata for the catalog API. This API is not intended to be used on its own; the Catalog API provides interfaces for using this API.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: "https://developer.sas.com"
servers:
- url: "http://example.com/catalogTableBot"
  description: The Catalog Table Bot server.
tags:
- name: Root
  description: The API root.
- name: Agents
  description: Agent lifecycle management.
paths:
  /:
    get:
      operationId: root
      summary: Get top-level resource links
      description: Returns a list of top-level resource links provided by the Catalog
        Table Bot API.
      tags:
      - Root
      parameters:
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.api+json
          - application/json
          default: application/vnd.sas.api+json
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              description: The media type of the response body.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/paths/~1/get/responses/200/content/application~1json/schema"
              examples:
                API:
                  $ref: "#/paths/~1/get/responses/200/content/application~1json/examples/API"
            application/json:
              schema:
                title: API
                description: The list of links to top-level resources and operations
                  available from the root of the API.
                x-sas-media-type:
                  name: application/vnd.sas.api
                  version: 1
                required:
                - version
                - links
                properties:
                  version:
                    type: integer
                    description: The version number of the API representation. This
                      is version 1.
                    minimum: 1
                  links:
                    description: The API's top-level links.
                    type: array
                    items:
                      title: Link
                      type: object
                      description: A link to a related operation or resource.
                      required:
                      - rel
                      properties:
                        method:
                          type: string
                          description: The HTTP method for the link.
                        rel:
                          type: string
                          description: The relationship of the link to the resource.
                        uri:
                          type: string
                          description: The relative URI for the link.
                        href:
                          type: string
                          description: The URL for the link.
                        title:
                          type: string
                          description: The title for the link.
                        type:
                          type: string
                          description: The media type or link type for the link.
                        itemType:
                          type: string
                          description: "If this is a link to a container, `itemType`\
                            \ is the media type or link type for the items in the\
                            \ container."
                        responseType:
                          type: string
                          description: "The media type or link type of the response\
                            \ body for a `PUT`, `POST`, or `PATCH` operation."
                        responseItemType:
                          type: string
                          description: "The media type or link type of the items in\
                            \ the response body for a `PUT`, `POST`, or `PATCH` operation."
              examples:
                API:
                  summary: Root API response
                  description: The root response consists of a collection of links
                    that can be used to navigate the Catalog Provider API. The examples
                    shown are for a provider named 'catalogTableBot'.
                  value:
                    version: 1
                    links:
                    - method: GET
                      rel: bots
                      href: /catalogTableBot/bots
                      uri: /catalogTableBot/bots
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.metadata.bot.summary
        "404":
          description: The Catalog Table Bot API is not available.
          content:
            application/vnd.sas.error+json:
              schema:
                title: Error
                type: object
                description: The representation of an error.
                x-sas-media-type:
                  name: application/vnd.sas.error
                  version: 2
                required:
                - httpStatusCode
                - version
                properties:
                  message:
                    type: string
                    description: The message for the error.
                  id:
                    type: string
                    description: The string ID for the error.
                  errorCode:
                    type: integer
                    description: The numeric ID for the error.
                  httpStatusCode:
                    type: integer
                    description: The HTTP status code for the error.
                  details:
                    type: array
                    description: Messages that provide additional details about the
                      cause of the error.
                    items:
                      type: string
                  remediation:
                    type: string
                    description: A message that describes how to resolve the error.
                  errors:
                    type: array
                    description: Any additional errors that occurred.
                    items:
                      $ref: "#/paths/~1/get/responses/404/content/application~1vnd.sas.error%2Bjson/schema"
                  links:
                    type: array
                    description: The links that apply to the error.
                    items:
                      $ref: "#/paths/~1/get/responses/200/content/application~1json/schema/properties/links/items"
                  version:
                    type: integer
                    description: The version number of the error representation. This
                      representation is version 2.
              examples:
                Error - Service Unavailable:
                  summary: Error - Service Unavailable
                  description: The service is unavailable.
                  value:
                    version: 2
                    httpStatusCode: 404
                    message: Not Found
                    details: The service is unavailable.
  "/bots/{agentId}":
    head:
      operationId: headersForBot
      summary: Get the headers for an Agent by its ID
      description: Get the headers for an Agent by its ID.
      tags:
      - Agents
      parameters:
      - $ref: "#/paths/~1bots~1%7BagentId%7D/get/parameters/0"
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.bot+json
          - application/vnd.sas.metadata.scheduled.bot+json
          - application/vnd.sas.metadata.bot.summary+json
          - application/json
          default: application/vnd.sas.metadata.bot+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
            Etag:
              $ref: "#/paths/~1bots~1%7BagentId%7D/get/responses/200/headers/Etag"
            Last-Modified:
              $ref: "#/paths/~1bots~1%7BagentId%7D/get/responses/200/headers/Last-Modified"
        "404":
          $ref: "#/paths/~1bots~1%7BagentId%7D/get/responses/404"
