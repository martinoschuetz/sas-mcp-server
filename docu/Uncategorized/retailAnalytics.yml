---
openapi: 3.0.3
info:
  title: Retail Analytics
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: The Retail Analytics API supports common functions that cut across
    all retail solutions.
  version: "8"
  license:
    name: SAS Institute Inc.
    url: https://support.sas.com/techsup/license/index.html
tags:
- name: Root
  description: The operations for the Root resource.
- name: Data Extract Types
  description: The GET all & by name operations for Data Extract Type resource.
- name: Data Extract Job
  description: The create, run, and get state operations for Data Extract Job resource.
- name: Contributers
  x-sas-internal: true
  description: Bootstrapping applications into gateway.
- name: Creation Request Type
  description: The GET all & by name operations for Creation Request Type resource.
- name: Creation Request Job
  description: The create, run and get state operations for Creation Request Job resource.
- name: Execution Request Type
  description: The GET all & by name operations for Execution Request Type resource.
- name: Execution Request Job
  description: The create, run and get state operations for Execution Request Job
    resource.
- name: Deletion Request Type
  description: The GET all & by name operations for Deletion Request Type resource.
- name: Deletion Request Job
  description: The create, run and get state operations for Deletion Request Job resource.
- name: Process Models
  description: The create, run and get state operations for Process models resource.
- name: Get Resource By ID Request Type
  description: The create, run and get state operations for Get resource by id request
    type resource.
- name: Get Resources Request Type
  description: The create, run and get state operations for Get Resources Request
    Type resource.
paths:
  /:
    get:
      summary: Get the API resource links
      description: Returns a list of links to the top-level resources of the API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/root"
              examples:
                default:
                  $ref: "#/components/examples/retailAnalyticsResponse200"
            application/json:
              schema:
                $ref: "#/components/schemas/root"
              examples:
                default:
                  $ref: "#/components/examples/retailAnalyticsResponse200"
    head:
      summary: Check the state of the service
      description: Indicates whether the service is available.
      tags:
      - Root
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded. The service is available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/root"
              examples:
                default:
                  $ref: "#/components/examples/retailAnalyticsResponse200"
            application/json:
              schema:
                $ref: "#/components/schemas/root"
              examples:
                default:
                  $ref: "#/components/examples/retailAnalyticsResponse200"
        "404":
          description: The service is not available.
  /processModels:
    get:
      tags:
      - Process Models
      summary: Get all process models
      description: Returns all available links for process models.
      operationId: getAllProcessModels
      parameters:
      - name: limit
        in: query
        description: The maximum number of members to return. Default value is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: start
        in: query
        description: The offset of first member to return. Default value is 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: filter
        in: query
        description: Filter is not supported for get all process models.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. A list of process models has been found.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/processModelCollection"
              examples:
                default:
                  $ref: "#/components/examples/getAllResponse200"
            application/json:
              schema:
                $ref: "#/components/schemas/processModelCollection"
              examples:
                default:
                  $ref: "#/components/examples/getAllResponse200"
      deprecated: false
  "/processModels/{processName}":
    post:
      tags:
      - Process Models
      summary: Create and run an instance of a process model by process name
      description: Creates an instance of a process model and executes the model if
        it is present in the system.
      operationId: createExecuteProcessModelRequest
      parameters:
      - in: path
        name: processName
        description: The name of the process model to run.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.retail.process.data:
            schema:
              $ref: "#/components/schemas/executeProcessModelDetails"
            examples:
              sample:
                value: {"parameters": {"initialize": {"Accept-Language": "", "serverSelection": "",
                      "filePath": "", "localeFileName": "", "dateFormat": "", "delimiter": "",
                      "version": 1}}}
          application/json:
            schema:
              $ref: "#/components/schemas/executeProcessModelDetails"
            examples:
              sample:
                value: {"parameters": {"initialize": {"Accept-Language": "", "serverSelection": "",
                      "filePath": "", "localeFileName": "", "dateFormat": "", "delimiter": "",
                      "version": 1}}}
        description: Process Flow parameters used to override default parameters
      responses:
        "201":
          description: The request succeeded. The process has been created from the
            process model.
          headers:
            Location:
              description: The URL of the newly created process models
              schema:
                type: string
            Last-Modified:
              description: The ISO8601 date string that represents the timestamp of
                the last update to this object.
              schema:
                type: string
            Etag:
              description: Identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.retail.process+json:
              schema:
                $ref: "#/components/schemas/process"
              examples:
                default:
                  $ref: "#/components/examples/postByIdResponse201"
            application/json:
              schema:
                $ref: "#/components/schemas/process"
              examples:
                default:
                  $ref: "#/components/examples/postByIdResponse201"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.retail.process+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/postByIdResponse400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/postByIdResponse400"
        "404":
          description: The request was invalid. The process model resource was not
            found or is not available.
          content:
            application/vnd.sas.retail.process+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/postByIdResponse404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/postByIdResponse404"
      deprecated: false
    get:
      tags:
      - Process Models
      summary: Get details of a Process Model specified by name.
      description: The API returns details about a Process Model, particularly the
        list of parameters it accepts with their default values.
      operationId: getProcessModelDetails
      parameters:
      - name: processName
        in: path
        description: Name of the Process Model to Run.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: (OK) The request has been accepted
          headers:
            Last-Modified:
              description: The ISO8601 date string that represents the timestamp of
                the last update to this object.
              schema:
                type: string
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.retail.process+json:
              schema:
                $ref: "#/components/schemas/processModelDetails"
              examples:
                default:
                  $ref: "#/components/examples/getByIdResponse200"
            application/json:
              schema:
                $ref: "#/components/schemas/processModelDetails"
              examples:
                default:
                  $ref: "#/components/examples/getByIdResponse200"
        "404":
          description: (Not Found) Process Model resource is not available.
          content:
            application/vnd.sas.retail.process+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/getByIdResponse404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/getByIdResponse404"
  "/processes/{processId}/state":
    get:
      tags:
      - Process Models
      summary: Get the state of the process by ID
      description: Returns the state of a process that is running or completed.
      operationId: getProcessState
      parameters:
      - name: processId
        in: path
        description: Identifies the process resource. This parameter cannot be empty.
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: Filter is not supported for state api.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The process resource was found and returned
            in the response body.
          content:
            application/vnd.sas.retail.process.state+json:
              schema:
                $ref: "#/components/schemas/processState"
              examples:
                default:
                  $ref: "#/components/examples/getStateById200"
            application/json:
              schema:
                $ref: "#/components/schemas/processState"
              examples:
                default:
                  $ref: "#/components/examples/getStateById200"
        "404":
          description: The request was invalid. The process state was not found or
            is not available.
          content:
            application/vnd.sas.retail.process.state+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/getStateByIdResponse404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/getStateByIdResponse404"
      deprecated: false
  /contributers:
    post:
      x-sas-internal: true
      tags:
      - Contributers
      summary: Create a retail application as contributer.
      description: Create a contribution entry for every service that a retail application
        supports. A successful response body contains the fully populated resource.
      operationId: createContributer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/retailAnalyticsContributer"
            examples:
              sample:
                value: {"description": "Contributing to Data Extract", "applicationName": "processFlow",
                  "services": ["dataExtractTypes"]}
          application/vnd.sas.retail.application.contribution+json:
            schema:
              $ref: "#/components/schemas/retailAnalyticsContributer"
            examples:
              sample:
                value: {"description": "Contributing to Data Extract", "applicationName": "processFlow",
                  "services": ["dataExtractTypes"]}
        description: Details of services contributed by the application
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: The URL of the newly created contributer
              schema:
                type: string
            Content-Type:
              description: media type of the newly created resource
              schema:
                type: string
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/retailAnalyticsContributer"
              examples:
                default:
                  $ref: "#/components/examples/contributersResponse201"
            application/vnd.sas.retail.application.contribution+json:
              schema:
                $ref: "#/components/schemas/retailAnalyticsContributer"
              examples:
                default:
                  $ref: "#/components/examples/contributersResponse201"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/contributersResponse400"
            application/vnd.sas.retail.application.contribution+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/contributersResponse400"
        "409":
          description: Conflict. The contributer could not be created since it already
            exists for the specified application name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/contributersResponse409"
            application/vnd.sas.retail.application.contribution+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/contributersResponse409"
  /dataExtractTypes:
    get:
      summary: Get data extract type summary resources
      description: Returns data extract type summary resources.
      operationId: getAllDataExtractTypes
      tags:
      - Data Extract Types
      responses:
        "200":
          description: The request succeeded. If data extract types are found, they
            are returned in a collection. If no data extract types are found, an empty
            collection is returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/dataExtractTypeSummaryCollection"
              examples:
                sample:
                  value: {"name": "/dataExtractTypes", "count": 2, "items": [{"name": "sampleExtractName1",
                        "displayName": "Sample Extract 1", "supportedFormats": ["csv"],
                        "supportedLocationTypes": ["fileSystem"], "links": [{"method": "GET",
                            "rel": "detail", "href": "/retailAnalytics/dataExtractTypes/sampleExtractName1",
                            "uri": "/retailAnalytics/dataExtractTypes/sampleExtractName1"}]},
                      {"name": "sampleExtractName2", "displayName": "Sample Extract\
                          \ 2", "supportedFormats": ["csv"], "supportedLocationTypes": [
                          "fileSystem"], "links": [{"method": "GET", "rel": "detail",
                            "href": "/retailAnalytics/dataExtractTypes/sampleExtractName2",
                            "uri": "/retailAnalytics/dataExtractTypes/sampleExtractName2"}]}],
                    "links": [{"method": "GET", "rel": "self", "href": "/retailAnalytics/dataExtractTypes",
                        "uri": "/retailAnalytics/dataExtractTypes", "type": "application/vnd.sas.collection"}],
                    "version": 2}
            application/json:
              schema:
                $ref: "#/components/schemas/dataExtractTypeSummaryCollection"
              examples:
                sample:
                  value: {"name": "/dataExtractTypes", "count": 2, "items": [{"name": "sampleExtractName1",
                        "displayName": "Sample Extract 1", "supportedFormats": ["csv"],
                        "supportedLocationTypes": ["fileSystem"], "links": [{"method": "GET",
                            "rel": "detail", "href": "/retailAnalytics/dataExtractTypes/sampleExtractName1",
                            "uri": "/retailAnalytics/dataExtractTypes/sampleExtractName1"}]},
                      {"name": "sampleExtractName2", "displayName": "Sample Extract\
                          \ 2", "supportedFormats": ["csv"], "supportedLocationTypes": [
                          "fileSystem"], "links": [{"method": "GET", "rel": "detail",
                            "href": "/retailAnalytics/dataExtractTypes/sampleExtractName2",
                            "uri": "/retailAnalytics/dataExtractTypes/sampleExtractName2"}]}],
                    "links": [{"method": "GET", "rel": "self", "href": "/retailAnalytics/dataExtractTypes",
                        "uri": "/retailAnalytics/dataExtractTypes", "type": "application/vnd.sas.collection"}],
                    "version": 2}
        "400":
          description: The request is invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                sample:
                  value: {"errorCode": 102805, "message": "Invalid value specified\
                      \ for request parameter - start.", "details": ["traceId: 8fbdada7f0cf803b",
                      "path: /retailAnalytics/dataExtractTypes"], "remediation": "Please\
                      \ specify valid value for request parameter - start.", "httpStatusCode": 400}
  "/dataExtractTypes/{name}":
    get:
      summary: Get data extract type detail resource
      description: Get data extract type resource with all details for the given unique
        data extract type name
      operationId: getDataExtractTypeDetailByName
      tags:
      - Data Extract Types
      parameters:
      - name: name
        in: path
        description: The unique name of the data extract type to be retrieved.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.retail.data.extract.type.detail:
              schema:
                $ref: "#/components/schemas/dataExtractTypeDetail"
              examples:
                sample:
                  value: {"name": "sampleExtractName1", "displayName": "Sample Extract\
                      \ 1", "supportedFormats": ["csv"], "supportedLocationTypes": [
                      "fileSystem"], "parameters": {"stringArrayParameter": ["Merchandise"],
                      "dateParameter": "2015-09-20T00:00:00.000Z"}, "links": [{"method": "GET",
                        "rel": "up", "href": "/retailAnalytics/dataExtractTypes",
                        "uri": "/retailAnalytics/dataExtractTypes"}, {"method": "GET",
                        "rel": "self", "href": "/retailAnalytics/dataExtractTypes/sampleExtractName1",
                        "uri": "/retailAnalytics/dataExtractTypes/sampleExtractName1"},
                      {"method": "POST", "rel": "submit", "href": "/retailAnalytics/dataExtracts/jobs",
                        "uri": "/retailAnalytics/dataExtracts/jobs"}]}
            application/json:
              schema:
                $ref: "#/components/schemas/dataExtractTypeDetail"
              examples:
                sample:
                  value: {"name": "sampleExtractName1", "displayName": "Sample Extract\
                      \ 1", "supportedFormats": ["csv"], "supportedLocationTypes": [
                      "fileSystem"], "parameters": {"stringArrayParameter": ["Merchandise"],
                      "dateParameter": "2015-09-20T00:00:00.000Z"}, "links": [{"method": "GET",
                        "rel": "up", "href": "/retailAnalytics/dataExtractTypes",
                        "uri": "/retailAnalytics/dataExtractTypes"}, {"method": "GET",
                        "rel": "self", "href": "/retailAnalytics/dataExtractTypes/sampleExtractName1",
                        "uri": "/retailAnalytics/dataExtractTypes/sampleExtractName1"},
                      {"method": "POST", "rel": "submit", "href": "/retailAnalytics/dataExtracts/jobs",
                        "uri": "/retailAnalytics/dataExtracts/jobs"}]}
        "404":
          description: Cannot find data extract type for the specified name.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                sample:
                  value: {"errorCode": 102805, "message": "Cannot find data extract\
                      \ type for the specified name.", "details": ["traceId: 8fbdada7f0cf803b",
                      "path: /retailAnalytics/dataExtractTypes/dataExtractName"],
                    "remediation": "Please specify valid value for request parameter\
                      \ - start.", "httpStatusCode": 400, "version": 2}
  "/dataExtracts/jobs":
    post:
      tags:
      - Data Extract Job
      summary: Create a data extract job.
      description: Create a data extract job with set of common input and individual
        tasks. A successful response body contains the fully populated resource with
        Job Id and individual task ids.
      operationId: createDataExtractJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/dataExtractJobRequest"
            examples:
              sample:
                value: {"name": "Sample Extract Job", "tasks": [{"dataExtractName": "sampleExtractName1",
                      "userDefinedExtractName": "extract1", "format": "csv", "locationType": "fileSystem",
                      "parameters": {"stringArrayParameter": ["Merchandise"], "dateParameter": "2015-09-20T00:00:00.000Z"}},
                    {"dataExtractName": "sampleExtractName2", "userDefinedExtractName": "extract2",
                      "format": "csv", "locationType": "fileSystem", "parameters": {
                        "stringParameter": "Merchandise", "integerArrayparameter": [
                          20, 30, 23]}}]}
          application/vnd.sas.retail.data.extract.job.detail+json:
            schema:
              $ref: "#/components/schemas/dataExtractJobRequest"
            examples:
              sample:
                value: {"name": "Sample Extract Job", "tasks": [{"dataExtractName": "sampleExtractName1",
                      "userDefinedExtractName": "extract1", "format": "csv", "locationType": "fileSystem",
                      "parameters": {"stringArrayParameter": ["Merchandise"], "dateParameter": "2015-09-20T00:00:00.000Z"}},
                    {"dataExtractName": "sampleExtractName2", "userDefinedExtractName": "extract2",
                      "format": "csv", "locationType": "fileSystem", "parameters": {
                        "stringParameter": "Merchandise", "integerArrayparameter": [
                          20, 30, 23]}}]}
        description: Details of the data extract job to be created
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: The URL of the newly created data extract job
              schema:
                type: string
            Content-Type:
              description: media type of the newly created resource
              schema:
                type: string
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dataExtractJobResponse"
              examples:
                sample:
                  value: {"id": "24378a20-486b-11ea-b77f-2e728ce88125", "name": "Sample\
                      \ Extract Job", "tasks": [{"id": "24378dcc-486b-11ea-b77f-2e728ce88125",
                        "dataExtractName": "sampleExtractName1", "userDefinedExtractName": "extract1",
                        "format": "csv", "locationType": "fileSystem", "parameters": {
                          "stringArrayParameter": ["Merchandise"], "dateParameter": "2015-09-20T00:00:00.000Z"},
                        "links": [{"method": "GET", "rel": "state", "href": "/retailAnalytics/dataExtracts/jobs/24378a20-486b-11ea-b77f-2e728ce88125/tasks/24378c82-486b-11ea-b77f-2e728ce88125/state",
                            "uri": "/retailAnalytics/dataExtracts/jobs/24378a20-486b-11ea-b77f-2e728ce88125/tasks/24378c82-486b-11ea-b77f-2e728ce88125/state"}]},
                      {"id": "24378dcc-486b-11ea-b77f-2e728ce88456", "dataExtractName": "sampleExtractName2",
                        "userDefinedExtractName": "extract2", "format": "csv", "locationType": "fileSystem",
                        "parameters": {"stringParameter": "Merchandise", "integerArrayparameter": [
                            20, 30, 23]}, "links": [{"method": "GET", "rel": "state",
                            "href": "/retailAnalytics/dataExtracts/jobs/24378a20-486b-11ea-b77f-2e728ce88125/tasks/24378dcc-486b-11ea-b77f-2e728ce88125/state",
                            "uri": "/retailAnalytics/dataExtracts/jobs/24378a20-486b-11ea-b77f-2e728ce88125/tasks/24378dcc-486b-11ea-b77f-2e728ce88125/state"}]}],
                    "links": [{"method": "GET", "rel": "up", "href": "/retailAnalytics/dataExtractTypes",
                        "uri": "/retailAnalytics/dataExtractTypes"}]}
            application/vnd.sas.retail.data.extract.job.detail+json:
              schema:
                $ref: "#/components/schemas/dataExtractJobResponse"
              examples:
                sample:
                  value: {"id": "24378a20-486b-11ea-b77f-2e728ce88125", "name": "Sample\
                      \ Extract Job", "tasks": [{"id": "24378dcc-486b-11ea-b77f-2e728ce88125",
                        "dataExtractName": "sampleExtractName1", "userDefinedExtractName": "extract1",
                        "format": "csv", "locationType": "fileSystem", "parameters": {
                          "stringArrayParameter": ["Merchandise"], "dateParameter": "2015-09-20T00:00:00.000Z"},
                        "links": [{"method": "GET", "rel": "state", "href": "/retailAnalytics/dataExtracts/jobs/24378a20-486b-11ea-b77f-2e728ce88125/tasks/24378c82-486b-11ea-b77f-2e728ce88125/state",
                            "uri": "/retailAnalytics/dataExtracts/jobs/24378a20-486b-11ea-b77f-2e728ce88125/tasks/24378c82-486b-11ea-b77f-2e728ce88125/state"}]},
                      {"id": "24378dcc-486b-11ea-b77f-2e728ce88456", "dataExtractName": "sampleExtractName2",
                        "userDefinedExtractName": "extract2", "format": "csv", "locationType": "fileSystem",
                        "parameters": {"stringParameter": "Merchandise", "integerArrayparameter": [
                            20, 30, 23]}, "links": [{"method": "GET", "rel": "state",
                            "href": "/retailAnalytics/dataExtracts/jobs/24378a20-486b-11ea-b77f-2e728ce88125/tasks/24378dcc-486b-11ea-b77f-2e728ce88125/state",
                            "uri": "/retailAnalytics/dataExtracts/jobs/24378a20-486b-11ea-b77f-2e728ce88125/tasks/24378dcc-486b-11ea-b77f-2e728ce88125/state"}]}],
                    "links": [{"method": "GET", "rel": "up", "href": "/retailAnalytics/dataExtractTypes",
                        "uri": "/retailAnalytics/dataExtractTypes"}]}
        "400":
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                sample:
                  value: {"errorCode": 102805, "message": "The request is not valid.",
                    "details": ["traceId: 8fbdada7f0cf803b", "path: /retailAnalytics/dataExtracts/jobs"],
                    "remediation": "Please check the request and validate it with\
                      \ the documentation.", "httpStatusCode": 400}
  "/dataExtracts/jobs/{jobId}/tasks/{taskId}/state":
    get:
      tags:
      - Data Extract Job
