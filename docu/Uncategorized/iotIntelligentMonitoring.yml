              examples:
                subscription:
                  $ref: "#/components/examples/subscription"
    post:
      tags:
      - Subscriptions
      summary: Add notification subscriptions
      description: Create one or more subscriptions based on body content.
      operationId: createNotificationSubscriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subscription'
            examples:
              subscription:
                $ref: "#/components/examples/subscription"
      responses:
        '201':
          description: Created
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
              examples:
                subscription:
                  $ref: "#/components/examples/subscription"
        '400':
          description: Error parsing request content.
        '409':
          description: Conflict - One or more of the subscriptions already exists.  Responsse
            will contain only those subscriptions that were added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
              examples:
                subscription:
                  $ref: "#/components/examples/subscription"
    put:
      tags:
      - Subscriptions
      summary: Update notification subscriptions
      description: Update one or more notification subscriptions based on body content.
      operationId: updateNotificationSubscriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subscription'
            examples:
              subscription:
                $ref: "#/components/examples/subscription"
      responses:
        '200':
          description: Updated
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
              examples:
                subscription:
                  $ref: "#/components/examples/subscription"
        '400':
          description: Error reading request body.
          content:
            text/plain:
              schema:
                type: string
              examples:
                notificationsubscriptionputerror:
                  value: Error reading request body
        '409':
          description: Conflict - One or more of the updates would cause a conflict.  Responsse
            will contain only those subscriptions that were updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
              examples:
                subscription:
                  $ref: "#/components/examples/subscription"
    delete:
      tags:
      - Subscriptions
      summary: Delete subscriptions
      description: Delete one or more subscriptions based on query parameters. At
        least one query parameter must be specified.
      operationId: deleteNotificationSubscriptions
      parameters:
      - name: subscriptionid
        schema:
          type: string
        in: query
        description: 'The id of the subscription to delete.  This takes precedence
          over  "subscriberemail" and "category".'
      - name: subscriberemail
        schema:
          type: string
        in: query
        description: 'The email address of the user for which to delete subscriptions.
          Can be combined with the "category" parameter.'
      - name: category
        schema:
          type: string
        in: query
        description: 'The category for which to delete subscriptions.  For notifications
          of type "Alert", this corresponds to the project id.  Can be combined with
          the "subscriberemail" parameter.'
      responses:
        '204':
          description: No Content - Subscriptions were successfully deleted.
        '404':
          description: Not Found - No subscriptons were found to delete
