---
openapi: 3.0.3
info:
  title: Intelligent Monitoring Server
  version: '1'
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
  description: SAS Intelligent Monitoring allows...
servers:
- url: 'http://mock-iotintelligentmonitoring.apifirst.unx.sas.com/iotIntelligentMonitoring'
  description: Mock server
- url: 'http://localhost{port}/{basePath}'
  description: Local test Server
  variables: {port: {default: ":8091", description: Port for local server.}, basePath: {
      default: "api/v1/cbm", description: Base version path for API.}}
tags:
- name: Alerts
  description: View and manipulate alerts from assets.
- name: Assets
  description: View and add assets used throughout SIM.
- name: Deployments
  description: View and manipulate deployments of assets.
- name: Devices
  description: View sensors and mappings for devices.
- name: Locations
  description: View and delete locations.
- name: Profiles
  description: View and manipulate profiles of assets.
- name: Projects
  description: View and manipulate projects of assets.
- name: Subscriptions
  description: View and manipulate notification subscription.
- name: General
  description: View general info about SIM server.
- name: Notification
  description: View and manage notifications.
paths:
  /:
    get:
      tags:
      - General
      summary: Root path
      description: Returns OK when server is running fine.
      operationId: root
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /alerts:
    get:
      tags:
      - Alerts
      summary: Returns an array of alerts
      description: Returns the alerts based on the search critiera or all the alerts.
      operationId: getAlerts
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/alert'
              examples:
                json:
                  $ref: "#/components/examples/getAlertsResponse"
      parameters:
      - name: search
        schema:
          type: string
        in: query
        description: string value to search on
      - name: field
        schema:
          type: string
        in: query
        description: field to search on for search value (repeat field parameter when
          searching on multiple fields)
      - name: timeperiod
        schema:
          type: string
        in: query
        description: the time period for which to return alerts. Valid values are
          1h, 6h, 12h, 1d, 7d, 30d.  If missing, all alerts are returned. Only one
          of timeperiod or emailid is valid. If both are present, timeperiod takes
          precedence.
      - name: emailid
        schema:
          type: string
        in: query
        description: the id of the alert to return.  This is intended for use only
          by email alerts. Only one of timeperiod or emailid is valid. If both are
          present, timeperiod takes precedence.
  /alerts/counts:
    get:
      tags:
      - Alerts
      summary: Returns the number of alerts
      description: Returns the number of alerts for today or a specified number of
        days.  If the days parameter is not specified, the total number of alerts
        is returned.  Otherwise, alerts per day for the spedified number of days including
        today is returned.
      operationId: getAlertCounts
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
              examples:
                alertcount:
                  value:
                    count: 0
      parameters:
      - name: days
        schema:
          type: integer
        in: query
        description: any value, the number of days for which to retrieve total alerts
          per day
  /alerts/{alertid}:
    get:
      tags:
      - Alerts
      summary: Returns an alert
      description: Returns the alert based on the id provided in the path.
      operationId: getAlert
      parameters:
      - name: alertid
        in: path
        schema:
          type: string
        required: true
        description: the id of the alert to get
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/alert'
              examples:
                alert:
                  $ref: "#/components/examples/alert"
  /assets:
    head:
      tags:
      - Assets
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
      summary: Returns proper headers for POST/PUT/DELETE
      description: Returns proper headers for post, put, and delete.
      operationId: headersForCreatingAssets
    post:
      tags:
      - Assets
      summary: Creates the assets
      description: Creates the asset hierarchy, tags and mappings provided from CSV
        content.
      operationId: createAssets
      responses:
        '201':
          description: Successful response.  Assets created.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Filetype:
                      type: string
                    Records:
                      type: integer
                    Total:
                      type: integer
              examples:
                Example 1:
                  value:
                  - Filetype: Hierarchy
                    Records: 2
                    Total: 2
                  - Filetype: Tags
                    Records: 12
                    Total: 12
                  - Filetype: Mapping
                    Records: 2
                    Total: 2
        '400':
          description: Failed to parse the asset data from the request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hierarchy:
                  type: string
                tags:
                  type: string
                mapping:
                  type: string
            examples:
              assetpostrequest:
                value:
                  hierarchy: 'blah,blah,blah'
                  tags: 'blah,blah,blah'
                  mapping: 'blah,blah,blah'
  /assets/validate:
    head:
      tags:
      - Assets
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
      summary: Returns proper headers for POST/PUT/DELETE
      description: Returns proper headers for post, put, and delete.
      operationId: headersForAssetValidation
    post:
      tags:
      - Assets
      summary: Validate CSV data for tags, mappings, or hierarchy
      description: Validates CSV data depending on type query parameter.
      operationId: createAssetValidation
      requestBody:
        content:
          text/plain:
            schema:
              type: string
            examples:
              assetvalidatepost:
                value: 'blah,blah,blah'
        description: CSV data depending on the type value
      responses:
        '201':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
              examples:
                sample:
                  value:
                    status: true
                    message: Validation passed.
        '400':
          description: Error validating asset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
              examples:
                sample:
                  value:
                    status: true
                    message: Validation passed.
      parameters:
      - name: type
        schema:
          type: string
        in: query
        description: '''hierarchy'' or ''mappings'' or ''tags'''
        required: true
  /assets/loadasset:
    post:
      tags:
      - Assets
      summary: Validate CSV data for tags, mappings, or hierarchy
      description: Validates CSV data depending on type query parameter.
      operationId: createAsset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/assetdatastorage'
            examples:
              categorysubcategory:
                $ref: "#/components/examples/categorysubcategory"
      responses:
        '201':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              schema:
                type: string
        '400':
          description: Error parsing request content.
  /assets/types:
    get:
      tags:
      - Assets
      summary: Returns an array of category and subcategory values for all assets.
      description: Needed so that assets are created only with existing a category
        and subcategory combination.
      operationId: getAssetTypes
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/categorysubcategory'
              examples:
                profilestorage:
                  $ref: "#/components/examples/categorysubcategory"
  /deployments:
    head:
      tags:
      - Deployments
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
      summary: Returns proper headers for POST/PUT/DELETE
      description: Returns proper headers for post, put, and delete.
      operationId: headersForDeployments
    get:
      tags:
      - Deployments
      summary: Returns an array of deployments
      description: Returns all the deployments.
      operationId: getDeployments
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deployment'
              examples:
                deployment:
                  $ref: "#/components/examples/deployment"
  /deployments/{deploymentid}:
    get:
      tags:
      - Deployments
      summary: Returns a deployment
      description: Returns the deployment based on the id in the path.
      operationId: getDeployment
      parameters:
      - name: deploymentid
        in: path
        schema:
          type: integer
        description: id of a deployment
        required: true
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deployment'
              examples:
                deployment:
                  $ref: "#/components/examples/deployment"
  /deployments/{deploymentid}/start:
    put:
      tags:
      - Deployments
      summary: Starts a deployment
      description: Starts the deployment of a project based on the deployment ID provided
        in the path.
      operationId: updateDeploymentToStartState
      parameters:
      - name: deploymentid
        in: path
        schema:
          type: integer
        required: true
        description: id of a deployment
      responses:
        '200':
          description: Deployment started.
        '400':
          description: Invalid deploymentid
          headers:
            Content-Type:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              examples:
                deploymentstarterror:
                  value: Invalid deploymentid
  /deployments/{deploymentid}/stop:
    put:
      tags:
      - Deployments
      summary: Stops a deployment
      description: Stops the deployment of a project based on the deployment ID provided
        in the path.
      operationId: updateDeploymentToStopState
      parameters:
      - name: deploymentid
        in: path
        schema:
          type: integer
        required: true
        description: id of a deployment
      responses:
        '200':
          description: Deployment stopped.
        '400':
          description: Invalid deploymentid
          headers:
            Content-Type:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              examples:
                deploymentsstoperror:
                  value: Invalid deploymentid
  /devices:
    head:
      tags:
      - Devices
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
      summary: Returns proper headers for POST/PUT/DELETE
      description: Returns proper headers for post, put, and delete.
      operationId: headersForDevices
    get:
      tags:
      - Devices
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
        description: string value to search on
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/deviceconfig'
                example:
                - $ref: "#/components/examples/deviceconfig"
      summary: Return one or more devices
      description: Returns the properties of the devices based on the ids provided
        in the query.
      operationId: getDevices
    delete:
      tags:
      - Devices
      summary: Deletes devices
      description: Deletes the devices specified
      operationId: deleteDevices
      parameters:
      - name: id
        in: query
        schema:
          type: array
          items:
            type: string
        required: true
        description: ids of devices to delete
      responses:
        '204':
          description: device ID required or ID not valid
        '400':
          description: device not found
  /devices/deployedcount:
    get:
      tags:
      - Devices
      summary: Return the total number of devices in deployed projects
      description: The number of unique devices in all deployed projects is returned.  All
        devices are counted even if they are not being monitored for offline status.
      operationId: getDeployedDeviceCount
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
              examples:
                deployeddevicecount:
                  value:
                    count: 10
  /devices/offlinecount:
    get:
      tags:
      - Devices
      summary: Return the total number of devices offline
      description: The number of unique devices offline in all deployed projects is
        returned. Only  devices being monitored for offline status are included in
        the count.
      operationId: getDeployedDeviceOfflineCount
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
              examples:
                deployeddeviceofflinecount:
                  value:
                    count: 10
  /devices/{deviceid}:
    get:
      tags:
      - Devices
      summary: Return a device
      description: Returns the properties of the device based on the id in the path.
      operationId: getDevice
      parameters:
      - name: deviceid
        in: path
        schema:
          type: string
        required: true
        description: the id of the device to get
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceconfig'
              examples:
                deviceconfig:
                  $ref: "#/components/examples/deviceconfig"
    put:
      tags:
      - Devices
      summary: Update the alias for a device
      description: Updates the alias for the device based on the id in the path.
      operationId: updateDevice
      parameters:
      - name: deviceid
        in: path
        schema:
          type: string
        required: true
        description: id of a device
      - name: alias
        schema:
          type: string
        in: query
        description: alias value to be set on the device
      - name: timeout
        in: query
        schema:
          type: integer
        description: time in minutes for determining device offline
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad Request. Either invalid deviceid or missing alias parameter.
          content:
            text/plain:
              schema:
                type: string
              examples:
                devicesputerror:
                  value: Invalid deviceid
    delete:
      tags:
      - Devices
      summary: Deletes a device
      description: Deletes the device specified
      operationId: deleteDevice
      parameters:
      - name: deviceid
        in: path
        schema:
          type: string
        required: true
        description: id of a device
      responses:
        '204':
          description: device ID required or ID not valid
        '400':
          description: device not found
  /devices/{deviceid}/sensors:
    get:
      tags:
      - Devices
      summary: Returns array of sensors for a device
      description: Returns all the SensorConfigs for the device based on the id in
        the path.
      operationId: getSensorsForDevice
      parameters:
      - name: deviceid
        in: path
        schema:
          type: string
        required: true
        description: id of a device
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sensorconfig'
              examples:
                sensorconfig:
                  $ref: "#/components/examples/sensorconfig"
  /devices/{deviceid}/mappings:
    get:
      tags:
      - Devices
      summary: Returns array of the mappings for a device
      description: Returns the MappingConfigs for the device based on the id in the
        path.
      operationId: getMappingsForDevice
      parameters:
      - name: deviceid
        in: path
        schema:
          type: string
        required: true
        description: id of a device
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mappingconfig'
              examples:
                mappingconfig:
                  $ref: "#/components/examples/mappingconfig"
  /devices/{deviceid}/sensorsWithProfiles:
    get:
      tags:
      - Devices
      summary: Returns array of sensors based on the upper and lower limit
      description: Returns array of sensors based on the upper and lower limit
      operationId: getSensorsWithProfilesForDevice
      parameters:
      - name: deviceid
        in: path
        schema:
          type: string
        required: true
        description: id of a device
      - name: profileID
        schema:
          type: number
        in: query
        description: id of a profile?
        required: true
      - name: upper
        schema:
          type: string
        in: query
        description: upper limit
        required: true
      - name: lower
        schema:
          type: string
        in: query
        description: lower limit
        required: true
      responses:
        '200':
          description: Array of SensorConfigs within the upper and lower limit based
            on the profile.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sensorconfig'
              examples:
                sensorconfig:
                  $ref: "#/components/examples/sensorconfig"
  /locations:
    head:
      tags:
      - Locations
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
      summary: Returns proper headers for POST/PUT/DELETE
      description: Returns proper headers for post, put, and delete.
      operationId: headersForLocations
    get:
      tags:
      - Locations
      summary: Returns an array of locations
      description: Returns all the locations.
      operationId: getLocations
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/assetdatastorage'
              examples:
                assetdatastorage:
                  $ref: "#/components/examples/assetdatastorage"
    delete:
      tags:
      - Locations
      summary: Deletes all the locations
      description: Deletes _all_ the locations
      operationId: deleteLocations
      responses:
        '204':
          description: No Content - locations were deleted.
  /profiles:
    head:
      tags:
      - Profiles
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
      summary: Returns proper headers for POST/PUT/DELETE
      description: Returns proper headers for post, put, and delete.
      operationId: headersForCreatingProfiles
    get:
      tags:
      - Profiles
      summary: Returns an array of profiles
      description: Returns all the profiles.
      operationId: getProfiles
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profilestorage'
              examples:
                profilestorage:
                  $ref: "#/components/examples/profilestorage"
    post:
      tags:
      - Profiles
      summary: Adds a profile
      description: Adds a profile.
      operationId: createProfile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                lastupdatedby:
                  type: string
            examples:
              sample:
                value:
                  name: profiletwo
                  status: Stopped
                  lastupdatedby: admin@admin.com
      responses:
        '201':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profilestorage'
              examples:
                profilestorage:
                  $ref: "#/components/examples/profilestorage"
        '400':
          description: Error parsing request content.
    delete:
      tags:
      - Profiles
      summary: Deletes the profiles and projects
      description: Deletes _all_ the projects and _all_ the profiles.
      operationId: deleteProfiles
      responses:
        '204':
          description: No Content - Profiles were deleted.
  /profiles/{profileid}:
    get:
      tags:
      - Profiles
      summary: Returns a profile
      description: Returns the profile based on the id in the path.
      operationId: getProfile
      parameters:
      - name: profileid
        in: path
        schema:
          type: string
        required: true
        description: the id of the profile to get
      responses:
        '200':
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/specificprofilestorage'
              examples:
                specificprofilestorage:
                  $ref: "#/components/examples/specificprofilestorage"
    put:
      tags:
      - Profiles
      summary: Update a profile
      description: Updates a profile.
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/specificprofilestorage'
            examples:
              specificprofilestorage:
                $ref: "#/components/examples/specificprofilestorage"
      parameters:
      - name: profileid
        in: path
        schema:
          type: string
        required: true
        description: id of the profile
      responses:
        '200':
          description: Successful response
        '400':
          description: Invalid id or profile data in request
          content:
            text/plain:
              schema:
                type: string
              examples:
                profilesputerror:
                  value: Invalid id
        '409':
          description: Mismatched profileid parameter and id in request body
          content:
            text/plain:
              schema:
                type: string
              examples:
                profilesputerror:
                  value: Mismatched profile id
    delete:
      tags:
      - Profiles
      summary: Delete a profile
      description: Deletes a profile (as long as it isn't being used by a project).
      operationId: deleteProfile
      parameters:
      - name: profileid
        in: path
        schema:
          type: string
        required: true
        description: id of a profile
      responses:
        '204':
          description: No Content - Profile was deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
              examples:
                sample:
                  value:
                    status: true
                    message: Profile Deleted
        '409':
          description: Confilct - Project was found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
              examples:
                sample:
                  value:
                    status: false
                    message: Profile Not Deleted, Project Found
  /profiles/{profileid}/start:
    put:
      tags:
      - Profiles
      summary: Starts a profile
      description: Starts the profile based on the id in the path for the duration
        provided in the body.
      operationId: updateProfileToStartState
      parameters:
      - name: profileid
        schema:
          type: string
        in: path
        required: true
        description: id of a profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/profileduration'
            examples:
              profileduration:
                $ref: "#/components/examples/profileduration"
      responses:
        '200':
          description: OK
        '400':
          description: Invalid profile id or duration specified.
          content:
            text/plain:
              schema:
                type: string
              examples:
                profilesputerror:
                  value: Invalid profile id
  /profiles/{profileid}/stop:
    put:
      tags:
      - Profiles
      summary: Stop a profile
      description: Stops the profile based on the id in the path.
      operationId: updateProfileToStopState
      parameters:
      - name: profileid
        schema:
          type: string
        in: path
        required: true
        description: id of a profile
      responses:
        '200':
          description: OK
        '400':
          description: Invalid id specified.
          content:
            text/plain:
              schema:
                type: string
              examples:
                profilestoperror:
                  value: Invalid id specified
