      operationId: getNotificationSubscriptions
      parameters:
      - name: subscriptionid
        schema:
          type: string
        in: query
        description: 'The id of the subscription to return.  This takes precedence
          over  "subscriberemail", "category", and "active".'
      - name: subscriberemail
        schema:
          type: string
        in: query
        description: 'The email address of the user for which to get subscriptions.
          Can be combined with the "category" and "active" parameters.'
      - name: category
        schema:
          type: string
        in: query
        description: 'The category for which to get subscriptions.  For notifications
          of type "Alert", this corresponds to the project id.  Can be combined with
          the "subscriberemail" and "active" parameters.'
      - name: active
        schema:
          type: string
        in: query
        description: 'The active status of the subscriptions.  Valid values are "true"
          and "false" (case-insensitive).  Can be combined with the "subscriberemail"
          and "category" parameters.'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
