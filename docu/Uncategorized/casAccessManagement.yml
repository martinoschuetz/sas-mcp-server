            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "500":
          description: Server Error
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
