servers:
- url: http://example.com/casAccessManagement
  description: This is an example base URL.
components:
  requestBodies:
    updateCasAccessControl:
      content:
        application/vnd.sas.cas.access.controls+json:
          schema:
            $ref: "#/components/schemas/updateCasAccessControl"
        application/json:
          schema:
            $ref: "#/components/schemas/updateCasAccessControl"
      description: List of Access Controls to apply to the specified column.
      required: true
    directoryRestriction:
      content:
        application/vnd.sas.cas.directory.restrictions+json:
          schema:
            $ref: "#/components/schemas/directoryRestriction"
        application/json:
          schema:
            $ref: "#/components/schemas/directoryRestriction"
      description: List of DirectoryRestrictions to be loaded in to the deny or allow
        list.
      required: true
    updateCasAccessControl2:
      content:
        application/vnd.sas.cas.access.controls+json:
          schema:
            $ref: "#/components/schemas/updateCasAccessControl"
        application/json:
          schema:
            $ref: "#/components/schemas/updateCasAccessControl"
      description: List of Access Controls to apply to the AddNode action.
      required: true
    updateCasAccessControl3:
      content:
        application/vnd.sas.cas.access.controls+json:
          schema:
            $ref: "#/components/schemas/updateCasAccessControl"
        application/json:
          schema:
            $ref: "#/components/schemas/updateCasAccessControl"
      description: List of Access Controls to apply to the shutdown action.
      required: true
  schemas:
    casAccessControl:
      description: An object of a cas action control.
      properties:
        version:
          type: integer
          description: Version of service this AC is from.
        origin:
          type: string
          description: Origin of this AC, can be 'Direct' or 'Inherited'.
        type:
          type: string
          description: "'grant' or 'deny'."
        permission:
          type: string
          description: The actual permission granted or denied.
        identityType:
          type: string
          description: "'guest', 'user' or 'group'."
        identity:
          type: string
          description: The actual ID of the user or group.
        creationTimeStamp:
          type: string
          description: Time stamp the permission was fetched?
        createdBy:
          type: string
          description: Identity that created the AC
        tableFilter:
          type: string
          description: Filter for a table.  Currently only applies to select permission.
    directoryRestriction:
      description: An object with a type and path for a directory.
      properties:
        version:
          type: integer
          description: Version of service this path is from.
        type:
          type: string
          description: "Type of caslib, (this is not currently used for anything):\
            \ 'connection', 'DNFS', 'ESP', 'HDFS', 'LASR', 'MVA', 'path', 'S3', or\
            \ 'unspecified."
        path:
          type: string
          description: The path the caslib refers to on the file system.
    updateCasAccessControl:
      description: An object to update an access control.
      title: CasAccessControl
      properties:
        version:
          type: integer
          description: Version of service to use.
        type:
          type: string
          description: "'grant' or 'deny'."
        permission:
          type: string
          description: The actual permission granted or denied.
        identityType:
          type: string
          description: "'user', 'group', or 'guest'."
        identity:
          type: string
          description: The actual ID of the user or group.
        tableFilter:
          type: string
          description: Filter for a table.  Currently only applies to select permission.
    casAdminIdentity:
      description: An object representing an admin identity.
      properties:
        version:
          type: integer
          description: Version of service to use.
        name:
          type: string
          description: Unique name of entry.  <identity>_<identity type>_<type or
            role>.
        description:
          type: string
          description: Role (action, data, or superUser).
        owner:
          type: string
          description: Owner of entry.
        creator:
          type: string
          description: Creator of entry.
        identity:
          type: string
          description: User or group name.
        identityType:
          type: string
          description: Type of identity (user, group, or guest).
        creationTimeStamp:
          type: string
          description: Timestamp of when record created.
        modificationTimeStamp:
          type: string
          description: Timestamp of when record modified.
    casAccessControlEffective:
      description: An object with information about an effective access control.
      properties:
        version:
          type: integer
          description: Version of service to use.
        identityType:
          type: string
          description: Type of identity (user, group, or guest).
        identity:
          type: string
          description: User or group name.
        readInfo:
          type: string
          description: Permission that applies to caslib, table, column or action.  Possible
            values are noDecision, denyDirect, denyInherited, grantDirect, grantDirectFiltered,
            grantInherited, or grantInheritedFiltered.
        select:
          type: string
          description: Permission that applies to caslib, table, column or action.  Possible
            values are noDecision, denyDirect, denyInherited, grantDirect, grantDirectFiltered,
            grantInherited, or grantInheritedFiltered.
        insert:
          type: string
          description: Permission that applies to caslib, table, or column.  Possible
            values are noDecision, denyDirect, denyInherited, grantDirect, grantDirectFiltered,
            grantInherited, or grantInheritedFiltered.
        update:
          type: string
          description: Permission that applies to caslib or table.  Possible values
            are noDecision, denyDirect, denyInherited, grantDirect, grantDirectFiltered,
            grantInherited, or grantInheritedFiltered.
        delete:
          type: string
          description: Permission that applies to caslib or table.  Possible values
            are noDecision, denyDirect, denyInherited, grantDirect, grantDirectFiltered,
            grantInherited, or grantInheritedFiltered.
        createTable:
          type: string
          description: Permission that applies to caslib or table.  Possible values
            are noDecision, denyDirect, denyInherited, grantDirect, grantDirectFiltered,
            grantInherited, or grantInheritedFiltered.
        dropTable:
          type: string
          description: Permission that applies to caslib or table.  Possible values
            are noDecision, denyDirect, denyInherited, grantDirect, grantDirectFiltered,
            grantInherited, or grantInheritedFiltered.
        alterTable:
          type: string
          description: Permission that applies to caslib or table.  Possible values
            are noDecision, denyDirect, denyInherited, grantDirect, grantDirectFiltered,
            grantInherited, or grantInheritedFiltered.
        promote:
          type: string
          description: Permission that applies to caslib.  Possible values are noDecision,
            denyDirect, denyInherited, grantDirect, grantDirectFiltered, grantInherited,
            or grantInheritedFiltered.
        alterCaslib:
          type: string
          description: Permission that applies to caslib.  Possible values are noDecision,
            denyDirect, denyInherited, grantDirect, grantDirectFiltered, grantInherited,
            or grantInheritedFiltered.
        manageAccess:
          type: string
          description: Permission that applies to caslib, table, column or action.  Possible
            values are noDecision, denyDirect, denyInherited, grantDirect, grantDirectFiltered,
            grantInherited, or grantInheritedFiltered.
        execute:
          type: string
          description: Permission that applies to action.  Possible values are noDecision,
            denyDirect, denyInherited, grantDirect, grantDirectFiltered, grantInherited,
            or grantInheritedFiltered.
        tableFilter:
          type: string
          description: Filter for a table.  Currently only applies to select permission.
    casAccessControlOrigin:
      description: Object with information about an access control.
      properties:
        version:
          type: integer
          description: Version of service to use.
        type:
          type: string
          description: "'grant', 'deny' or 'none'."
        permission:
          type: string
          description: The actual permission granted or denied.
        identityType:
          type: string
          description: Type of identity (user, group, or guest).
        identity:
          type: string
          description: User or group name.
        origin:
          type: string
          description: Origin of this AC, can be 'direct' or 'inherited'.
        objectType:
          type: string
          description: Caslib, table, column, or action.
        objectName:
          type: string
          description: Name of the object this permission came from/is on.
        tableFilter:
          type: string
          description: Filter for a table.  Currently only applies to select permission.
    casAccessControlPrincipalIdentity:
      description: Object with an identity and identity type.
      properties:
        version:
          type: integer
          description: Version of service this path is from.
        identityType:
          type: string
          description: Type of identity (user, group, or guest).
        identity:
          type: string
          description: User or group name.
    adminRoleCheck:
      description: Object with a boolean for the role.
      properties:
        version:
          type: integer
          description: Version of service this path is from.
        hasRole:
          type: boolean
          description: true or false.
    caslib:
      type: object
      description: Includes the representation of a caslib.   Note that links are
        only returned for GET calls.
      required:
      - name
      - type
      x-sas-media-type:
        name: application/vnd.sas.cas.caslib
        version: 1
      properties:
        version:
          type: integer
          description: version of this object
        name:
          type: string
          description: Name of the caslib
        type:
          type: string
          description: >
            Type of the caslib.  Valid values include any caslib type supported
            by the CAS server.  A partial list of sample values include: path,
            hdfs, dnfs, lasr, teradata, greenplum, oracle
        description:
          type: string
          description: Description of the caslib.
        scope:
          type: string
          description: The scope of the caslib.  Valid values include session or global.
        path:
          type: string
          description: The path of the caslib.
        attributes:
          $ref: "#/components/schemas/keyValueModel"
      example:
        version: 1
        name: CASUSER(userId)
        type: PATH
        description: Personal File System Caslib
        scope: global
        path: /u/userId/
        attributes:
          key: "value"
          subdirs: true
          active: false
          personal: true
        links:
        - method: GET
          rel: up
          href: /casManagement/servers/casServer/caslibs
          uri: /casManagement/servers/casServer/caslibs
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.cas.caslib
        - method: GET
          rel: self
          href: /casManagement/servers/casServer/caslibs/CASUSER(userId)
          uri: /casManagement/servers/casServer/caslibs/CASUSER(userId)
          type: application/vnd.sas.cas.caslib
        - method: PATCH
          rel: patch
          href: /casManagement/servers/casServer/caslibs/CASUSER(userId)
          uri: /casManagement/servers/casServer/caslibs/CASUSER(userId)
          type: application/vnd.sas.cas.caslib
          responseType: application/vnd.sas.cas.caslib
        - method: DELETE
          rel: delete
          href: /casManagement/servers/casServer/caslibs/CASUSER(userId)
          uri: /casManagement/servers/casServer/caslibs/CASUSER(userId)
        - method: GET
          rel: tables
          href: /casManagement/servers/casServer/caslibs/CASUSER(userId)/tables
          uri: /casManagement/servers/casServer/caslibs/CASUSER(userId)/tables
          type: application/vnd.sas.collection
    keyValueModel:
      description: An object of key value pairs.
      type: object
      required:
      - key
      properties:
        key:
          type: string
          description: string
        value:
          type: object
          description: string
    transactionLocksCollection:
      title: My Resource Summary Collection
      description: The array of application/vnd.sas.cas.transaction.locks representations.
      allOf:
      - type: object
        properties:
          transactionLocksCollection:
            type: array
            items:
              $ref: "#/components/schemas/transactionLocks"
    lockedText:
      type: string
      description: true means locked
    unlockedText:
      type: string
      description: false means not locked
    transactionLocks:
      type: object
      description: Lock information on an object.
      required:
      - caslib
      - checkOutType
      - sessionId
      - securityId
      x-sas-media-type:
        name: application/vnd.sas.cas.transaction.locks
        version: 1
      properties:
        version:
          type: integer
          description: version of this object
        caslib:
          type: string
          description: Name of the caslib
        table:
          type: string
          description: Name of the table
        column:
          type: string
          description: Name of the column
        actionSet:
          type: string
          description: Name of the action set
        action:
          type: string
          description: Name of the action
        checkOutType:
          type: string
          description: Type of lock on object.  shared or exclusive.
        sessionId:
          type: string
          description: Session guid that holds the lock.
        securityId:
          type: string
          description: Identity that holds the lock.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
