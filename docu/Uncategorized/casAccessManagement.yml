      - name: Accept
        in: header
        description: application/vnd.sas.collection+json
        required: true
        schema:
          type: string
      - name: serverId
        in: path
        description: The ID of the CAS server containing the table.
        required: true
        schema:
          type: string
      - name: caslibId
        in: path
        description: The caslib containing the table
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        description: The table.
        required: true
        schema:
          type: string
      - name: user
        in: query
        description: The list of user identities effective permissions are desired
          for. Please provide a '|' delimited list.  If no user or group list is provided,
          and guest is not true, all existing effective permissions will be returned.  To
          include the caller's effective access controls include an identity of @currentUser.
        required: false
        schema:
          type: string
      - name: group
        in: query
        description: The list of group identities effective permissions are desired
          for. Please provide a '|' delimited list.  If no user or group list is provided,
          and guest is not true, all existing effective permissions will be returned.
        required: false
        schema:
          type: string
      - name: guest
        in: query
        description: Specifies effective permissions are desired for guest account.  If
          no user or group list is provided, and guest is not true, all existing effective
          permissions will be returned.
        required: false
        schema:
          type: boolean
      - name: accessControlType
        in: query
        description: Access control type desired, (standard, effective, or origin).  Default
          value is standard.
        required: false
        schema:
          type: string
      - name: sessionId
        in: query
        description: The optional session ID of the CAS session containing the caslib.  If
          not specified, a new session will be created, and will only be able to see
          global caslibs.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Success, list of effective Access Controls returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/casAccessControlEffective"
            application/json:
              schema:
                $ref: "#/components/schemas/casAccessControlEffective"
        "404":
          description: Not Found
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
