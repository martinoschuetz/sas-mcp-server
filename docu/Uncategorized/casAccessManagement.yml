      - Caslibs
      parameters:
      - name: Content-Type
        in: header
        description: application/vnd.sas.cas.access.controls+json
        required: true
        schema:
          type: string
      - name: serverId
        in: path
        description: The ID of the CAS server containing the caslib.
        required: true
        schema:
          type: string
      - name: caslibId
        in: path
        description: The caslib
        required: true
        schema:
          type: string
      - name: sessionId
        in: query
        description: The optional session ID of the CAS session containing the caslib.  If
          not specified, a new session will be created, and will only be able to see
          global caslibs.
