  "/servers/{serverId}/caslibControls/{caslibId}#effective":
    get:
      operationId: getEffectiveAclsOnCaslib
      summary: Get the effective Access Controls on the specified caslib.
      description: >-
        Gets the effective Access Controls on the specified caslib.  The media
        type of the returned collection items will be
        application/vnd.sas.collection+json. The contents of the collection will
        be based upon the value of the accessControlType parameter.  If it is
        'effective' then the collection will contain
        application/vnd.sas.cas.effective.caslib.access.control+json items.


        Note that #effective should be removed from the URL path.  This is present
        in this documentation to distinguish between endpoints with the same path
        but different query parameter values.
      tags:
      - Caslibs
      parameters:
      - name: Accept
        in: header
        description: application/vnd.sas.collection+json
        required: true
        schema:
          type: string
      - name: serverId
        in: path
        description: The ID of the CAS server containing the caslib.
        required: true
        schema:
          type: string
      - name: caslibId
        in: path
        description: The caslib
        required: true
        schema:
          type: string
      - name: user
        in: query
        description: The list of user identities effective permissions are desired
          for. Please provide a '|' delimited list.  If no user or group list is provided,
          and guest is not true, all existing effective permissions will be returned.
        required: false
        schema:
          type: string
      - name: group
        in: query
        description: The list of group identities effective permissions are desired
          for. Please provide a '|' delimited list.  If no user or group list is provided,
          and guest is not true, all existing effective permissions will be returned.
        required: false
        schema:
          type: string
      - name: guest
        in: query
        description: Specifies effective permissions are desired for guest account.  If
          no user or group list is provided, and guest is not true, all existing effective
          permissions will be returned.
        required: false
        schema:
          type: boolean
      - name: accessControlType
        in: query
        description: Access control type desired, (standard, effective, or origin).  Default
          value is standard.
        required: false
        schema:
          type: string
      - name: sessionId
        in: query
        description: The optional session ID of the CAS session containing the caslib.  If
          not specified, a new session will be created, and will only be able to see
          global caslibs.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Success, list of effective Access Controls returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/casAccessControlEffective"
            application/json:
              schema:
                $ref: "#/components/schemas/casAccessControlEffective"
        "404":
          description: Not Found
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "415":
          description: Unsupported Media Type.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "500":
          description: Server Error
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
