      summary: Get the effective Access Controls on the specified table.
      description: >-
        Gets the Access Controls on the specified table. The media type of the
        returned collection of items will be
        application/vnd.sas.collection+json. The contents of the collection will
        be based upon the value of the accessControlType parameter.  If it is
        'effective' then the collection will contain
        application/vnd.sas.cas.access.effective.table.control+json items.


        Note that #effective should be removed from the URL path. This is present
        in this documentation to distinguish between endpoints with the same path
        but different query parameter values.
