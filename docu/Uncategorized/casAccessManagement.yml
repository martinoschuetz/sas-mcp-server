        application/vnd.sas.cas.access.origin.control+json items.


        Note that #origin should be removed from the URL path.  This is present in
        this documentation to distinguish between endpoints with the same path but
        different query parameter values.
      tags:
      - Caslibs
      parameters:
      - name: Accept
        in: header
        description: application/vnd.sas.collection+json
        required: true
        schema:
          type: string
      - name: serverId
        in: path
        description: The ID of the CAS server containing the caslib.
        required: true
        schema:
          type: string
      - name: caslibId
        in: path
        description: The caslib
        required: true
        schema:
          type: string
      - name: user
        in: query
        description: The user identity origin information is desired for.  One, and
          only one, identity must be provided (user, group, or guest).
        required: false
        schema:
          type: string
      - name: group
        in: query
        description: The group identity origin information is desired for.  One, and
          only one, identity must be provided (user, group, or guest).
        required: false
        schema:
          type: string
      - name: guest
        in: query
        description: Specifies effective permissions are desired for guest account.
          One, and only one, identity must be provided (user, group, or guest).
        required: false
        schema:
          type: boolean
      - name: accessControlType
        in: query
        description: Access control type desired, (standard, effective, or origin).  Default
          value is standard.
        required: false
        schema:
          type: string
      - name: sessionId
        in: query
