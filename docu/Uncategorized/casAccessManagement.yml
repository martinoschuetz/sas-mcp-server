---
openapi: 3.0.3
info:
  version: "3"
  title: CAS Access Management
  description: >-
    This API provides access controls for four CAS resource: CAS actions
    (/actions), CAS libraries (/caslibs), CAS tables (/tables), CAS table
    columns (/columns). This API also manages access controls for two
    administration actions: adding nodes to the server (/addNode) and shutting
    down the server (/shutdown). In addition, for the resources (actions,
    caslibs, columns and tables), this API provides lists of the access
    control identity types supported for those resources, the enumeration of
    permission types for those access controls, and the collection of
    permissions.


    Endpoints are provided to provide effective and origin access control information
    for specified CAS resources.


    Another feature of this API is the ability to manage CAS deny and allow lists
    (directory restrictions).  These contain lists of paths that where caslibs may
    be (in the case of inclusion in an allow list) or may not be (in the case of deny
    list) created.


    Yet another feature of this API is the ability to manage admin CAS user's roles.  Role
    membership can be checked.  Roles can be assumed, then dropped.  Admin users can
    be listed, added to the list, or removed from it.


    This API will also retrieve the principals associated with a specified CAS resource.


    This API also provides the ability to manage access controls for the stated CAS
    resources in a transactional framework.  The resource can be locked for a user's
    CAS session, alterred, interactions with other permissions examined, and then
    changes can be committed or rolled back.


    Expect a response of 401 if valid credentials are not passed.  403 Forbidden if
    the user is not authorized to access the resource or perform the operation.
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
