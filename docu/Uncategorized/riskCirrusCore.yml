          items:
            $ref: "#/components/schemas/link"
          readOnly: true
    batchJobs:
      title: Batch Jobs
      description: This is a collection of batch job records.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        readOnly: true
        properties:
          items:
            type: array
            description: The actual results of a query
            items:
              $ref: '#/components/schemas/batchJob'
    batchJob:
      title: Batch job
      description: The batch job definition
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
          readOnly: true
        id:
          type: string
          title: Batch job identifier.
          description: |
            The unique identifier of the batch job to be used during GET requests.
            This is a system assigned identifier.
          example: e7a95e4e-3ff6-41ba-b14f-3ab1e194ec29
          readOnly: true
        name:
          type: string
          title: Batch job name.
          description: |
            The name of the batch job assigned either by the user during batch job submission or system assigned if name was omitted.
          example: batch testUser 2023.09.01
          readOnly: true
        solution:
          type: string
          title: Risk Cirrus solution short name.
          description: |
            The solution short name to use to run batch job request.
          example: ECL
          readOnly: true
        solutionBranch:
          type: string
          title: Risk Cirrus solution git branch.
          description: |
            The solution git branch to use to run batch job request.
          example: main
          readOnly: true
        solutionCommit:
          type: string
          title: Risk Cirrus solution git commit hash.
          description: |
            The solution git commit to use to run batch job request.
          example: main
          readOnly: true
        state:
          type: string
          title: Batch job state.
          description: |
            The current state of the batch job: queued, running, completed, failed, timedOut, canceling, canceled.
          example: running
        error:
          type: string
          title: Batch job error message.
          description: |
            The error message describing the cause of the batch job 'failed' or 'canceled' state.
          example: Batch job timed out and was forcibly stopped.
        logLocation:
          type: string
          title: Log location.
          description: |
            The folder location on the SAS Content Server where submitted batch job files, logs and reports are published. The location will not be available until the job has finished.
          example: /Products/SAS Risk Cirrus Core/batch/e7a95e4e-3ff6-41ba-b14f-3ab1e194ec29
        logURI:
          type: string
          title: Log URI.
          description: |
            The URI of the batch job log file if it was created and published to the files service.The URI will not be available until the job has finished.
          example: /files/files/e7a95e4e-3ff6-41ba-b14f-3ab1e194ec29/content
        logReportURI:
          type: string
          title: Log report URI.
          description: |
            The URI of the batch job report file if it was created and published to the files service. The URI will not be available until the job has finished.
          example: /files/files/bb0b8c0c-4f44-4075-80fe-596569fac9fc/content
        stepsCount:
          type: integer
          title: Number of batch job steps.
          description: |
            The amount of batch job steps within the batch job. The amount will be available only after batch configuration file is parsed and validated, thus it will not be immediatly available.
          example: 3
          readOnly: true
        steps:
          type: array
          title: Steps of the batch job.
          description: |
            Batch job steps that are associated with this batch.
          items:
            $ref: '#/components/schemas/batchJobStep'
        createdBy:
          type: string
          title: Creator of the batch job.
          description: Username of the entity that submitted the batch job.
          example: testuser
          readOnly: true
        modifiedBy:
          type: string
          title: Last modifier of the batch job.
          description: |
            Username of the entity that last modified the batch job.
          example: testuser
          readOnly: true
        creationTimeStamp:
          type: string
          title: Creation timestamp of the batch job.
          description: |
            Date and time stamp of when the entity was created.
          format: date-time
          example: '2021-11-08T18:40:21.674894Z'
          readOnly: true
        modifiedTimeStamp:
          type: string
          title: Modification timestamp of the batch job
          description: Date and time stamp of when the entity was last modified.
          format: date-time
          example: '2021-11-08T18:40:21.674894Z'
          readOnly: true
        links:
          type: array
          description: Links that apply to this batch job
          items:
            $ref: "#/components/schemas/link"
          readOnly: true
      required:
      - state
      - solution
    batchJobStep:
      title: Batch job step
      description: Steps that are associated with a batch job.
      type: object
      properties:
        id:
          type: string
          title: Batch job step identifier
          description: |
            The unique identifier of the batch job step.
            This is a system assigned identifier.
          example: 4c94f814-fd3b-41c9-aad5-a66ac84b47ec
          readOnly: true
        jobId:
          type: string
          title: Batch job identifier.
          description: |
            The unique identifier of the batch job the step is assigned to.
          example: e7a95e4e-3ff6-41ba-b14f-3ab1e194ec29
          readOnly: true
        restPath:
          title: Cirrus Object rest path.
          type: string
          description: |
            The rest path of the Cirrus Object representing the running batch job step, and set by the batch configuration file.
          example: cycles
        objectId:
          title: Cirrus Object ID representing the running batch job step.
          type: string
          description: |
            The id of the cirrus object that is deleted, created, updated or run as batch job step.
          example: abc
        sourceSystemCd:
          title: Source system code of the cirrus object representing the running
            batch job step.
          type: string
          description: |
            The source system code of the cirrus object that is deleted, created, updated or run as batch job step.
          example: RCC
        action:
          title: Batch job step action.
          type: string
          description: Batch job step action performed agains cirrus object (e.g.
            DELETE, CREATE, UPDATE, RUN)
          example: DELETE
        state:
          title: Current state of the batch job step.
          type: string
          description: The current state of the batch job step.
          example: completed
          readOnly: true
        error:
          type: string
          title: Batch job step error message.
          description: |
            The error message describing the cause of the batch job step 'failed' or 'canceled' state.
          example: Batch job timed out and was forcibly stopped.
          readOnly: true
        order:
          type: integer
          title: Ordinal number of the step within batch job.
          description: |
            Ordinal number of the batch job step within the batch job execution queue.
          example: 1
          readOnly: true
        createdBy:
          type: string
          title: Creator of the batch job step.
          description: Username of the entity that submitted the batch job.
          example: testuser
          readOnly: true
        modifiedBy:
          type: string
          title: Last modifier of the batch job step.
          description: |
            Username of the entity that last modified the batch job.
          example: testuser
          readOnly: true
        creationTimeStamp:
          type: string
          title: Creation timestamp of the batch job step.
          description: |
            Date and time stamp of when the entity was created.
          format: date-time
          example: '2021-11-08T18:40:21.674894Z'
          readOnly: true
        modifiedTimeStamp:
          type: string
          title: Modification timestamp of the batch job step.
          description: Date and time stamp of when the entity was last modified.
          format: date-time
          example: '2021-11-08T18:40:21.674894Z'
          readOnly: true
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
        links:
          type: array
          description: Links that apply to this batch job
          items:
            $ref: "#/components/schemas/link"
          readOnly: true
      required:
      - jobId
      - solution
      - restPath
      - objectId
      - sourceSystemCd
      - action
      - order
      - state
    eventTriggerJobMonitoringCollection:
      title: Event Trigger Job Monitoring Collection
      description: This is a collection of event trigger job monitoring records.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        readOnly: true
        properties:
          items:
            type: array
            description: The actual results of a query
            items:
              $ref: '#/components/schemas/eventTriggerJobMonitoring'
    eventTriggerJobMonitoring:
      title: Event Trigger Job Monitoring
      description: An event trigger job monitoring record that tracks the retry state
        of event-triggered scripts.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
          readOnly: true
        id:
          type: string
          title: Event trigger job monitoring identifier.
          description: |
            The unique identifier of the event trigger job monitoring record.
            This is a system assigned identifier.
          example: 22b22cce-5cf7-4d90-b806-94a5b8bb9fda
          readOnly: true
        executionType:
          type: string
          title: Execution type.
          description: |
            The type of execution for the event trigger job.
            Values: compute (job execution service), riskCirrusCore (native execution).
          enum:
          - compute
          - riskCirrusCore
          example: compute
          readOnly: true
        scriptId:
          type: string
          title: Script ID.
          description: The identifier of the script to execute.
          example: script-123
          readOnly: true
        objectType:
          type: string
          title: Object type.
          description: The type of the object that triggered the event script.
          example: modelReview
          readOnly: true
        objectKey:
          type: string
          title: Object key.
          description: The unique key identifying the object that triggered the event
            script.
          example: abc123-def456
          readOnly: true
        originalUser:
          type: string
          title: Original user.
          description: The user who triggered the original action that created this
            monitoring record.
          example: testuser
          readOnly: true
        state:
          type: string
          title: State.
          description: |
            The current state of the event trigger job monitoring.
            Values: pending, submitted, failed, completed.
          enum:
          - pending
          - submitted
          - failed
          - completed
          example: pending
        attempts:
          type: integer
          title: Attempts.
          description: The number of retry attempts that have been made.
          example: 1
          readOnly: true
        maxAttempts:
          type: integer
          title: Max attempts.
          description: The maximum number of retry attempts allowed.
          example: 3
          readOnly: true
        nextRetryTime:
          type: string
          title: Next retry time.
          description: The timestamp when the next retry will be attempted.
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
          readOnly: true
        completedAt:
          type: string
          title: Completed at.
          description: The timestamp when the job completed (successfully or finally
            failed).
          format: date-time
          example: '2024-01-15T10:35:00.000Z'
          readOnly: true
        createdBy:
          type: string
          title: Created by.
          description: Username of the entity that created the event trigger job monitoring
            record.
          example: testuser
          readOnly: true
        modifiedBy:
          type: string
          title: Modified by.
          description: Username of the entity that last modified the event trigger
            job monitoring record.
          example: testuser
          readOnly: true
        creationTimeStamp:
          type: string
          title: Creation timestamp.
          description: Date and time stamp of when the entity was created.
          format: date-time
          example: '2024-01-15T10:00:00.000Z'
          readOnly: true
        modifiedTimeStamp:
          type: string
          title: Modification timestamp.
          description: Date and time stamp of when the entity was last modified.
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
          readOnly: true
        links:
          type: array
          description: Links that apply to this event trigger job monitoring record.
          items:
            $ref: "#/components/schemas/link"
          readOnly: true
      required:
      - state
      - executionType
      - scriptId
      - objectType
      - objectKey
    eventTriggerJobAttempts:
      title: Event Trigger Job Attempts
      description: This is a collection of event trigger job attempt records.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        readOnly: true
        properties:
          items:
            type: array
            description: The actual results of a query
            items:
              $ref: '#/components/schemas/eventTriggerJobAttempt'
    eventTriggerJobAttempt:
      title: Event Trigger Job Attempt
      description: A record of a single retry attempt for an event trigger job.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
          readOnly: true
        id:
          type: string
          title: Attempt identifier.
          description: |
            The unique identifier of this attempt record.
            This is a system assigned identifier.
          example: 33c33ddf-6dg8-52cb-c917-05b6c9cc0fea
          readOnly: true
        eventTriggerJobMonitoringId:
          type: string
          title: Event trigger job monitoring ID.
          description: The identifier of the parent event trigger job monitoring record.
          example: 22b22cce-5cf7-4d90-b806-94a5b8bb9fda
          readOnly: true
        attemptNumber:
          type: integer
          title: Attempt number.
          description: The sequential number of this attempt (1-based).
          example: 1
          readOnly: true
        submissionState:
          type: string
          title: Submission state.
          description: |
            The state of this specific attempt.
            Values: pending, submitted, running, completed, failed.
          enum:
          - pending
          - submitted
          - running
          - completed
          - failed
          example: completed
        jobExecutionId:
          type: string
          title: Job execution ID.
          description: The job execution service job ID if this was a compute execution.
          example: job-exec-abc123
          readOnly: true
        jobTerminalState:
          type: string
          title: Job terminal state.
          description: The terminal state of the job execution (if completed).
          example: completed
          readOnly: true
        lastError:
          type: string
          title: Last error.
          description: The error message if this attempt failed.
          example: Connection timeout
          readOnly: true
        attemptCompletedAt:
          type: string
          title: Attempt completed at.
          description: The timestamp when this attempt completed.
          format: date-time
          example: '2024-01-15T10:35:00.000Z'
          readOnly: true
        cleanupSteps:
          type: array
          title: Cleanup steps.
          description: The cleanup steps executed during this attempt, including their
            status and results.
          items:
            $ref: '#/components/schemas/cleanupStep'
          readOnly: true
        createdBy:
          type: string
          title: Created by.
          description: Username of the entity that created the attempt record.
          example: system
          readOnly: true
        modifiedBy:
          type: string
          title: Modified by.
          description: Username of the entity that last modified the attempt record.
          example: system
          readOnly: true
        creationTimeStamp:
          type: string
          title: Creation timestamp.
          description: Date and time stamp of when the attempt was created.
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
          readOnly: true
        modifiedTimeStamp:
          type: string
          title: Modification timestamp.
          description: Date and time stamp of when the attempt was last modified.
          format: date-time
          example: '2024-01-15T10:35:00.000Z'
          readOnly: true
        links:
          type: array
          description: Links that apply to this attempt record.
          items:
            $ref: "#/components/schemas/link"
          readOnly: true
      required:
      - submissionState
      - attemptNumber
      - eventTriggerJobMonitoringId
    cleanupStep:
      title: Cleanup Step
      description: A record of a cleanup step executed during a post-delete operation.
      type: object
      properties:
        resourceType:
          type: string
          title: Resource type.
          description: The type of resource that was cleaned up (e.g., logs, artifacts).
          example: logs
          readOnly: true
        resourceKey:
          type: string
          title: Resource key.
          description: The unique identifier or key of the resource that was cleaned
            up.
          example: log-20240115-abc123
          readOnly: true
        status:
          type: string
          title: Status.
          description: |
            The final status of this cleanup step.
            Values: completed, failed, submitted, not_required.
          enum:
          - completed
          - failed
          - submitted
          - not_required
          example: completed
          readOnly: true
        execution:
          type: string
          title: Execution.
          description: |
            Describes how this cleanup step was executed in this attempt.
            Values: attempted (cleanup was executed), carried_forward (result from a previous attempt), not_attempted (cleanup was intentionally skipped).
          enum:
          - attempted
          - carried_forward
          - not_attempted
          example: attempted
          readOnly: true
        reason:
          type: string
          title: Reason.
          description: |
            Optional reason for the execution decision or status (used for non-error context).
            Examples: completed_in_previous_attempt, not_required, possibly_already_deleted_in_previous_attempt, submitted_in_previous_attempt.
          example: completed_in_previous_attempt
          readOnly: true
        errorMessage:
          type: string
          title: Error message.
          description: The error message if this cleanup step failed.
          example: Failed to delete logs from storage.
          readOnly: true
        errorCategory:
          type: string
          title: Error category.
          description: |
            The category of error that occurred, used to determine retry strategy.
            Examples: fatal_error, possibly_already_deleted.
          example: fatal_error
          readOnly: true
