    post:
      tags:
      - Batch Jobs
      summary: Create a batch job
      operationId: createBatchJob
      description: |
        Submit a batch job and register a new batch job definition entry in the batch_job_definition database table
      parameters:
      - $ref: '#/components/parameters/batchJobSolutionParameter'
      - $ref: '#/components/parameters/batchJobSolutionBranchParameter'
      - $ref: '#/components/parameters/batchJobSolutionCommitParameter'
      - $ref: '#/components/parameters/batchJobNameParameter'
      - $ref: '#/components/parameters/batchJobCodeLibraryKeyParameter'
      - $ref: '#/components/parameters/batchJobCodeLibraryIDParameter'
      - $ref: '#/components/parameters/batchJobCodeLibrarySSCParameter'
      - $ref: '#/components/parameters/batchJobTimeoutMinParameter'
      - $ref: '#/components/parameters/batchJobCancelTimeoutSecParameter'
      - $ref: '#/components/parameters/batchJobWaitSleepSecParameter'
      - $ref: '#/components/parameters/batchJobLogLevelParameter'
      - $ref: '#/components/parameters/batchJobMaxParallelProcessesParameter'
      requestBody:
        required: true
        description: At least one batch configuration file and optional supplimental
          files to be submitted, e.g. batch configuration spreadsheet file, risk scenario
          import file, business evolution plan data loader file.
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                config:
                  type: string
                  format: binary
                  description: |
                    One mandatory spreadsheet file containing batch job configuration in the form of application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.
                    Batch configuration file must be tagged as "file" or "config" name attribute.
                    File name can be of any valid unique file name except: "log.txt", "log.zip", "log_report.xlsx"; within the batch job request.
                supplementFile:
                  type: string
                  format: binary
                  description: |
                    Optional supplimental file(s) that must be tagged with any name attribute other than "file" or "config".
                    File name can be of any valid unique file name except: "log.txt", "log.zip", "log_report.xlsx"; within the batch job request.
            examples: {}
      responses:
        '201':
          description: Batch job was submitted successfully.
          headers:
            Location:
              description: The URI of the newly created batch job.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.core.batch.job+json:
              schema:
                $ref: '#/components/schemas/batchJobs'
              examples:
                example:
                  $ref: '#/components/examples/getBatchJobResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/batchJobs'
              examples:
                example:
                  $ref: '#/components/examples/getBatchJobResponse'
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/postBatchJobErrorResponse'
