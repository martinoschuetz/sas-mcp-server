---
openapi: 3.0.3
info:
  version: '1'
  title: Risk Cirrus Core
  description: >
    SAS Risk Cirrus Core handles the deployment of Core content and provides
    code library management and code execution APIs for solutions on Core
  termsOfService: 'https://www.sas.com/en_us/legal/copyright.html'
  contact:
    name: 'SAS Developers'
    email: 'devex@sas.com'
    url: 'https://developer.sas.com'
servers:
- url: http://example.com/riskCirrusCore
  description: Sample server URL.
tags:
- name: Root Links
  description: Links of the Cirrus Core service.
- name: Code Repositories
  description: Remote Git repositories where SPRE code is stored.
- name: Code Library Actions
  description: Git actions performed for code libraries.
- name: Deployments
  description: Actions for solution deployments.
- name: Execute Script
  description: Actions for submitting Cirrus scripts.
- name: Triggers
  description: Actions for creating/updating triggers in Cirrus.
- name: Trigger Events
  description: Actions for interacting with trigger events.
- name: Batch Jobs
  description: Actions for interacting with batch job execution.
- name: AI Plugins
  description: Actions for importing AI plugin extensions.
- name: Connectors
  description: Manage connectors for external and internal providers.
- name: Connector Mappings
  description: Manage field mappings between source and destination objects.
paths:
  /:
    get:
      tags:
      - Root Links
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example:
                  $ref: '#/components/examples/getCoreRootResponse'
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example:
                  $ref: '#/components/examples/getCoreRootResponse'
  /codeRepositories:
    get:
      tags:
      - Code Repositories
      summary: Get a list of code repositories
      operationId: getRepositories
      description: |
        Get a list of code repositories.

        The code repositories returned can be filtered, sorted, and paged.

        The default sort order will be the code repository ID.

        Alternative sort orders may be by name, description, solution, user, modifiedBy, createdBy.

        It is also possible to filter on any of these fields, using the functions eq, gt, ge, lt, le, or contains.

        Returned items will be of media type application/vnd.sas.risk.core.repository.
      parameters:
      - name: start
        in: query
        description: 0-based Offset of first type to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of types to return.  Defaults to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: 'Filter criteria for returned types. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: 'Sort returned types. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).'
        schema:
          type: string
          format: sort-criteria
      responses:
        '200':
          description: The request succeeded and matching code repositories are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/codeRepositories'
              examples:
                example:
                  $ref: '#/components/examples/getCodeRepositoriesResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/codeRepositories'
              examples:
                example:
                  $ref: '#/components/examples/getCodeRepositoriesResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/getCodeRepositoriesErrorResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
    post:
      tags:
      - Code Repositories
      summary: Create a code repository
      operationId: createrRepository
      description: |
        Create a code repository in the system for storing SPRE code.

        The Git remote repository connection validations are executed when performing this operation.
      requestBody:
        content:
          application/vnd.sas.risk.core.repository+json:
            schema:
              $ref: '#/components/schemas/codeRepository'
            examples:
              example:
                $ref: '#/components/examples/createCodeRepositoryBody'
          application/json:
            schema:
              $ref: '#/components/schemas/codeRepository'
            examples:
              example:
                $ref: '#/components/examples/createCodeRepositoryBody'
        description: The code repository definition to be created.
        required: true
      responses:
        '201':
          description: Code repository definition created successfully.
          headers:
            Location:
              description: The URI of the newly created user repository.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.core.repository+json:
              schema:
                $ref: '#/components/schemas/codeRepository'
              examples:
                example:
                  $ref: '#/components/examples/createCodeRepositoryResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/codeRepository'
              examples:
                example:
                  $ref: '#/components/examples/createCodeRepositoryResponse'
        '400':
          description: |
            Bad Request.

            The request is not properly formed.

            This can happen if the type name in the path does not match the type name in the body or if the body is missing required fields.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/badRequestErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/badRequestErrorResponse'
        '403':
          description: 'Only administrators can create code repositories.'
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/forbiddenErrorResponse'
            'application/json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/forbiddenErrorResponse'
        '500':
          description: |
            Internal Server Error.

            This can happen if the remote Git connection information (user, token, url) is not valid.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/repoCreateAuthenticationErrorResponse'
            'application/json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/repoCreateAuthenticationErrorResponse'
  '/codeRepositories/{repositoryId}':
    get:
      tags:
      - Code Repositories
      summary: Get a specific code repository
      operationId: getRepository
      description: Get the specific code repository definition using existing identifier.
      parameters:
      - $ref: '#/components/parameters/repositoryIdParameter'
      responses:
        '200':
          description: The request succeeded and matching code repository is returned.
          headers:
            ETag:
              description: A tag that identifies this revision of this code repository.
              schema:
                type: string
            Last-Modified:
              description: The last modified date.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.core.repository+json:
              schema:
                $ref: '#/components/schemas/codeRepository'
              examples:
                example:
                  $ref: '#/components/examples/getCodeRepositoryResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/codeRepository'
              examples:
                example:
                  $ref: '#/components/examples/getCodeRepositoryResponse'
        '404':
          description: The request failed. No code repository with the given id was
            found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/codeRepositoryNotFoundErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/codeRepositoryNotFoundErrorResponse'
    put:
      tags:
      - Code Repositories
      summary: Update a specific code repository
      operationId: updateRepository
      parameters:
      - $ref: '#/components/parameters/repositoryIdParameter'
      - in: header
        name: If-Match
        description: |
          The value of the ETag that was returned from a GET or previous PUT of this code repository.

          This MUST match exactly the current value of the etag of the code repository.

          The Git remote repository connection validations are executed when performing this operation.
        schema:
          type: string
      description: Update a code repository in the system for storing SPRE code.
      requestBody:
        content:
          application/vnd.sas.risk.core.repository+json:
            schema:
              $ref: '#/components/schemas/codeRepository'
            examples:
              example:
                $ref: '#/components/examples/createCodeRepositoryBody'
          application/json:
            schema:
              $ref: '#/components/schemas/codeRepository'
            examples:
              example:
                $ref: '#/components/examples/createCodeRepositoryBody'
        description: The information of the specific code repository to be updated.
        required: true
      responses:
        '200':
          description: Code Repository definition updated successfully.
          headers:
            ETag:
              description: A tag that identifies this revision of this code repository.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.core.repository+json:
              schema:
                $ref: '#/components/schemas/codeRepository'
              examples:
                example:
                  $ref: '#/components/examples/createCodeRepositoryResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/codeRepository'
              examples:
                example:
                  $ref: '#/components/examples/createCodeRepositoryResponse'
        '400':
          description: |
            Bad Request.

            The request is not properly formed.

            This can happen if the body is missing required fields.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/badPutRequestErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/badPutRequestErrorResponse'
        '403':
          description: 'Only administrators can update code repositories.'
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/forbiddenErrorResponse'
            'application/json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/forbiddenErrorResponse'
        '404':
          description: The request failed. No code repository with the given id was
            found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/codeRepositoryNotFoundErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/codeRepositoryNotFoundErrorResponse'
        '412':
          description: The If-Match condition check did not pass.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/preConditionFailedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/preConditionFailedResponse'
        '428':
          description: Pre-Condition failed. If-Match header was not provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/IfMatchHeaderNotProvidedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/IfMatchHeaderNotProvidedResponse'
        '500':
          description: Internal Server Error. This can happen if the remote Git connection
            information (user, token, url) is not valid.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/repoUpdateAuthenticationErrorResponse'
            'application/json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/repoUpdateAuthenticationErrorResponse'
    delete:
      tags:
      - Code Repositories
      summary: Delete a specific code repository
      operationId: deleteRepository
      parameters:
      - $ref: '#/components/parameters/repositoryIdParameter'
      description: |
        Delete a code repository in the system.

        Deleting the definition of the code repository will not delete the actual Git repository, just the definition of that repository in the system.
      responses:
        '204':
          description: Code repository definition deleted successfully.
        '403':
          description: 'Only administrators can delete code repositories.'
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/forbiddenErrorResponse'
            'application/json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/forbiddenErrorResponse'
        '404':
          description: The request failed. No code repository with the given id was
            found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/deleteCodeRepositoryNotFoundErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/deleteCodeRepositoryNotFoundErrorResponse'
  /codeLibraryActions/getRepoBranches:
