                  $ref: '#/components/examples/codeLibActionBadRequestErrorResponse2'
        '404':
          description: The request failed. The git repository was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/codeLibActionRepoNotFoundErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
