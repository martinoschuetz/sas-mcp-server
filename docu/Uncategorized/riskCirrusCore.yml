  /importAIPlugin/{solutionShortName}:
    post:
      tags:
      - AI Plugins
      summary: Import an AI plugin archive
      operationId: importAIPlugin
      description: |
        Imports a ZIP archive containing AI plugin extension files for the specified solution.

        The archive is extracted into the service shared persistent volume under the normalized solution short name.
      parameters:
      - name: solutionShortName
        in: path
        required: true
        description: The solution short name that owns the AI plugin extension files.
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
      requestBody:
        description: Multipart form data containing the AI plugin ZIP archive in the
          `file` field.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '204':
          description: The AI plugin archive was imported successfully.
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '401':
          description: Unauthorized.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '409':
          description: An import is already running for the specified solution.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '500':
          description: Internal server error.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
