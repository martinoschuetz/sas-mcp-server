          example: application/vnd.sas.risk.core.promotion.config.link+json
        count:
          type: integer
          title: Count
          description: Number of links retrieved.
          example: 1
        start:
          type: integer
          title: Start Index
          description: Start index for pagination.
          example: 0
        limit:
          type: integer
          title: Limit
          description: Maximum number of links returned.
          example: 1
        name:
          type: string
          title: Name
          description: Name of the links collection.
          example: items
        items:
          type: array
          title: Link Items
          description: List of link items.
          items:
            $ref: '#/components/schemas/promotionLinksConfigurationSchema'
        links:
          type: array
          title: Links
          description: Pagination and collection-related links.
          items:
            $ref: "#/components/schemas/link"
    promotionLinksConfigurationSchema:
      title: Links Configuration
      description: Details about the link configurations.
      type: object
      properties:
        creationTimeStamp:
          type: string
          format: date-time
          title: Creation Timestamp
          description: Timestamp when the link configuration was created.
          example: 2024-11-11T23:31:26.434141Z
        createdBy:
          type: string
          title: Created By
          description: Identifier of the creator.
          example: sas.riskCirrusRCC
        modifiedTimeStamp:
          type: string
          format: date-time
          title: Modification Timestamp
          description: Timestamp when the link configuration was last modified.
          example: 2024-11-11T23:31:26.434141Z
        modifiedBy:
          type: string
          title: Modified By
          description: Identifier of the last modifier.
          example: sas.riskCirrusRCC
        key:
          type: string
          title: Key
          description: Unique identifier for the link configuration.
          example: 8e5186ec-eae8-4c2e-b71d-49656e9e5ddf
        links:
          type: array
          title: Links
          description: Related links for the configuration item.
          items:
            $ref: "#/components/schemas/link"
        solutionShortName:
          type: string
          title: Solution Short Name
          description: Abbreviated name of the solution.
          example: CORE
        objectRestPath:
          type: string
          title: Object REST Path
          description: REST path for the object.
          example: cycles
        linkType:
          type: string
          title: Link Type
          description: Type of the link.
          example: RCC|analysisRun_cycle
        linkTypeSide:
          type: integer
          title: Link Type Side
          description: Indicates the side of the link type.
          example: 1
        otherObjectRestPath:
          type: string
          title: Other Object REST Path
          description: REST path for the associated object.
          example: analysisRuns
        external:
          type: boolean
          title: External
          description: Flag specifying if the target artifact is external to the Cirrus
            environment.
          example: true
        externalService:
          type: string
          title: External Service
          description: Indicates the rest path of the external service providing the
            specified artifact.
          example: 'riskScenarios'
        externalServiceObject:
          type: string
          title: External Service Object
          description: Indicates the external artifact type rest path.
          example: 'scenarioSets'
        version:
          type: integer
          title: Version
          description: Version of the link configuration.
          example: 1
    promotionCustomFieldsConfigurationCollectionSchema:
