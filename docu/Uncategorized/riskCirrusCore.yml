  '/triggers/eventTriggerJobMonitoring/{id}/retry':
    post:
      tags:
      - Triggers
      summary: Retry a failed event trigger job
      operationId: retryEventTriggerJobMonitoring
      description: |
        Manually retry an event trigger job that failed or is pending.

        For **native execution type** (riskCirrusCore): The job executes synchronously
        and returns with the final state (`submissionCompleted` or `submissionFailed`).

        For **compute execution type**: Returns immediately with `state=pending`. The job
        is submitted to the job execution service in the background. Poll the monitoring
        record to check for state changes (`submitted` on success, or `submissionFailed`
        if submission fails).

        Cannot retry a job that has already completed successfully.
      parameters:
      - name: id
        in: path
        description: The identifier of an existing event trigger job monitoring record
          to retry.
        required: true
        schema:
          type: string
        example: 22b22cce-5cf7-4d90-b806-94a5b8bb9fda
      responses:
        '200':
          description: |
            The request succeeded. The updated monitoring record is returned.

            For native execution type, the response contains the final state after synchronous execution.
            For compute execution type, the response contains `state=pending` while the job is submitted in the background.
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.core.event-trigger-job-monitoring+json:
              schema:
                $ref: '#/components/schemas/eventTriggerJobMonitoring'
              examples:
                example:
                  $ref: '#/components/examples/retryEventTriggerJobMonitoringResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/eventTriggerJobMonitoring'
              examples:
                example:
                  $ref: '#/components/examples/retryEventTriggerJobMonitoringResponse'
        '400':
          description: |
            Bad Request.

            This can occur if attempting to retry a job that has already completed successfully, or if the execution type is not supported.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/eventTriggerJobMonitoringRetryErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/eventTriggerJobMonitoringRetryErrorResponse'
        '404':
          description: The request failed. No event trigger job monitoring record
            with the given id was found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/eventTriggerJobMonitoringNotFoundErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/eventTriggerJobMonitoringNotFoundErrorResponse'
