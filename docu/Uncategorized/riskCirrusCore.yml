    codeRepository:
      title: codeRepository
      description: The code repository definition
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
        key:
          type: string
          title: Code repository identifier.
          description: |
            The unique identifier of the code repository to be used during GET, DELETE and PUT requests.

            This is a system assigned identifier.
          example: 16372757e-011d-454d-905b-eb10b4a9e5a9
          readOnly: true
        name:
          title: Code repository name.
          type: string
          description: |
            The code repository name.

            This must be unique.

            The name cannot contain special characters and spaces.

            This name will be used as SAS_DOMAIN_ID  when adding the credentials provided to the credentials service (/credentials/domains/{SAS_DOMAIN_ID}).
          example: test_code_repository
        description:
          title: Code repository description.
          type: string
          description: The code repository description.
          example: This is a code repository for testing.
        solution:
          title: Code repository solution.
          type: string
          description: |
            The code repository solution.

            The code repository stores the SPRE code for this solution.
          example: Core
        url:
          title: The URL of the remote Git repository to store the SPRE code.
          type: string
          description: |
            The URL of the remote Git repository used to store the SPRE code.
          example: 'https://github.com/testuser/remote_repository.git'
        user:
          title: The user name to use to connect to the remote Git repository.
          type: string
          description: |
            The user name to use to connect to the remote Git repository.

            The user will be used to authenticate the connection to the remote Git repository.
          example: testuser
        email:
          title: The email (optional) to associate with the remote Git repository
          type: string
          description: |
            The email (optional) to associate with the remote Git repository

            This email is used when certain Git actions are performed against this remote Git repository.
          example: testuser@domain.com
        token:
          type: string
          title: The token to be used to authenticate the given user.
          description: |
            The token to be used to authenticate the given user.

            The token and user name will be used to authenticate the connection to the remote Git repository.

            The token is the administrator provided token for the particular user on the specific remote repository.

            The token is required on create requests, but will never be returned in any responses.
          example: e0219e321f796d83e9264549ba077c03f452dd94
          writeOnly: true
        credType:
          type: string
          title: The connection type.
          description: |
            The connection protocol type to be used to connect to the remote Git repository.

            For this version the connection type will be "https" only. The connection protocol type is determined from the provided URL of the remote Git repository.
          example: https
          readOnly: true
        createdBy:
          type: string
          description: Username of the entity that created this code repository
          example: testuser
          readOnly: true
        modifiedBy:
          type: string
          description: Username of the entity that last modified this code repository
          example: testuser
          readOnly: true
        creationTimeStamp:
          type: string
          description: Date and time stamp of when this entity was created.
          format: date-time
          example: '2021-11-08T18:40:21.674894Z'
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: Date and time stamp of when this entity was last modified.
          format: date-time
          example: '2021-11-08T18:40:21.674894Z'
          readOnly: true
        links:
          type: array
          description: Paging links that apply to this code repository
          items:
            $ref: "#/components/schemas/link"
          readOnly: true
        providerType:
          type: string
          description: |
            The remote GIT repository provider type.

            The providerType is not a required property on a request and if not provided, it will be tried to be determined from the repository URL.

            Based on the providerType, the {base64 token} for the git remote command operation execution will be generated.
          example: github
          enum:
          - gitlab
          - github
          - bitbucket
          - azure
      required:
      - name
      - solution
      - url
      - user
      - token
    runCodeRequestBody:
      title: runCodeRequestBody
