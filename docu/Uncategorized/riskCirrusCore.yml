  /deployments:
    get:
      tags:
      - Deployments
      summary: Get a list of deployments
      operationId: getDeployments
      description: |
        Get a list of deployments from the system.

        The deployments returned can be filtered, sorted, and paged.

        The default sort order will be the deployment ID.

        Alternative sort orders may be by creationTimeStamp.

        It is also possible to filter on any of these fields.  For example to return the latest deployment
        for the solution MRM with a semantic_version of 2022.10 use:
