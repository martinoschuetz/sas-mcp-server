            is version 1.
          example: 1
        id:
          type: string
          title: Job identifier.
          description: |
            The unique identifier of the job to be used during GET requests.

            This is a system assigned identifier.
          example: e7a95e4e-3ff6-41ba-b14f-3ab1e194ec29
          readOnly: true
        session_id:
          type: string
          title: Session ID.
          description: |
            The Compute session id for which the job was submitted.
          example: e7a95e4e-3ff6-41ba-b14f-3ab1e194ec29
          readOnly: true
        solution_id:
          type: string
          title: Solution ID.
          description: |
            The solution in which the job was submitted.
          example: RCC
        state:
          type: string
          title: State.
          description: |
            The current state of the job.
          example: running
        log_uri:
          type: string
          title: Log URI.
          description: |
            The URI of the completed job log. Will be null until the job has finished.
          example: /files/files/e7a95e4e-3ff6-41ba-b14f-3ab1e194ec29/content
        state_uri:
          type: string
          title: State URI.
          description: |
            The URI of the jobs state.
          example: /jobExecution/jobs/e7a95e4e-3ff6-41ba-b14f-3ab1e194ec29/state
        parent_object_id:
          type: string
          title: Parent Object ID.
          description: |
            The ID of the parent object containing the script to be run.
          example: e7a95e4e-3ff6-41ba-b14f-3ab1e194ec29
        parent_object_type:
          type: string
          title: Parent Object Type
          description: |
            The type of the parent object containing the script to be run.
          example: analysisRun
        createdBy:
          type: string
          description: Username of the entity that created this code repository
          example: testuser
          readOnly: true
        modifiedBy:
          type: string
          description: Username of the entity that last modified this code repository
          example: testuser
          readOnly: true
        creationTimeStamp:
          type: string
          description: Date and time stamp of when this entity was created.
          format: date-time
          example: '2021-11-08T18:40:21.674894Z'
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: Date and time stamp of when this entity was last modified.
          format: date-time
          example: '2021-11-08T18:40:21.674894Z'
          readOnly: true
        links:
          type: array
          description: Paging links that apply to this job
          items:
            $ref: "#/components/schemas/link"
          readOnly: true
      required:
