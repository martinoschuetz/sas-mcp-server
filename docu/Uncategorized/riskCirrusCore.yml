    runCodeResults:
      title: RunCodeResults
      description: This is the result of a successfully completed job submitted by
        POSTing to the runCode endpoint.
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
        jesJobId:
          type: string
          description: This is the id of the job submitted to SAS Job Execution service.
          example: 'b9a95e4e-3ff6-41ba-b14f-3ab1e194ec29'
        macroVars:
          type: array
          description: This object holds the requested macro variables from the job.
          readOnly: true
          items:
            type: object
            properties:
              scope:
                type: string
                description: The scope of the macro variable.
                example: 'GLOBAL'
              name:
                type: string
                description: The name of the macro variable.
                example: 'TEST'
              value:
                type: string
                description: The value of the macro variable
        table:
          type: object
          description: This is the table requested by the end user.
          readOnly: true
          properties:
            name:
              type: string
              description: The name of the table.
              example: 'CARS'
              readOnly: true
            libref:
              type: string
              description: The libref in which the table is assigned
              example: 'SASHELP'
              readOnly: true
            totalColumnCount:
              type: integer
              description: Specifies the total number of columns in the table.
              example: 15
              readOnly: true
            totalRowCount:
              type: integer
              description: Specifies the total number of rows the table has.
              example: 428
              readOnly: true
            dataStart:
              type: integer
              description: The starting row of the desired table.
              example: 0
              readOnly: true
            dataLimit:
              type: integer
              description: The total desired rows of the table from the dataStart
                value.
              example: 100
              readOnly: true
            where:
              type: string
              description: The applied where clause(s) to the table output.
              example: make="Acura"
            includeColumns:
              type: array
              description: The included columns of the table output.
              readOnly: true
              items:
                example: 'Make'
            filteredColumnCount:
              type: integer
              description: Specifies the number of columns in the table after the
                includeColumns filter is applied.
              example: 15
              readOnly: true
            filteredRowCount:
              type: integer
              description: Specifies the number of rows in the table after the dataStart,
                dataLimit and where clause are applied.
              example: 428
              readOnly: true
            data:
              type: object
              description: The data of the table.
              readOnly: true
              properties:
                version:
                  type: integer
                  description: The version of the SAS Compute media type schema.
                  example: 2
                  readOnly: true
                columnDetail:
                  type: string
                  description: Specifies the level of column information.
                  example: 'names'
                  readOnly: true
                columns:
                  type: array
                  description: Specifies the column information requested in array
                    format.
                  items:
                    type: string
                    example: 'Make'
                rows:
                  type: array
                  description: The rows of the table in array format.
                  readOnly: true
                  items:
                    type: array
                    description: An individual row.
                    items:
                      example: 'Acura'
                start:
                  type: integer
                  description: Starting point of the row set.
                  example: 0
                  readOnly: true
                links:
                  type: array
                  description: Paging links that apply to this deployment
                  items:
                    $ref: "#/components/schemas/link"
                  readOnly: true
