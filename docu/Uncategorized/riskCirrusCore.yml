  /executeScript/runCode:
    post:
      tags:
      - Execute Script
      summary: Triggers a script execution
      operationId: createRunCode
      description: |
        For quick jobs, use this endpoint to run code from a script object (or passed in the body)
        and get any desired macro variables and a data table out.
      parameters:
      - name: scriptKey
        in: query
        description: The script you wish to execute.
        required: false
        schema:
          type: string
        example: c04b9382-c57b-44ef-b137-381b05afb8d1
      - name: libref
        in: query
        description: The name of a libref containing the table you want to retrieve
          from the job.
        required: false
        schema:
          type: string
        example: SASHELP
      - name: table
        in: query
        description: The name of the table you want to retrieve from the job.
        required: false
        schema:
          type: string
        example: CARS
      - name: where
        in: query
        description: A SAS supported where clause used to filter the desired table.
        required: false
        schema:
          type: string
        example: make="Acura"
      - name: includeColumns
        in: query
        description: A comma seperated list of columns to include in from the desired
          table.
        required: false
        schema:
          type: string
        example: make,model,year
      - name: dataStart
        in: query
        description: The starting row for the row set of data out (default 0).
        required: false
        schema:
          type: integer
        example: 0
      - name: dataLimit
        in: query
        description: The range of data that will be captured after dataStart (default
          100) (maximum 10000).
        required: false
        schema:
          type: integer
        example: 100
      - name: timeOut
        in: query
        description: The amount of time you wish to wait for the job to complete in
          seconds (default 100) (maximum 500).
        required: false
        schema:
          type: integer
        example: 100
      - name: macroVars
        in: query
        description: A comma seperated list of macro variables you want to retrieve
          from the job.
        required: false
        schema:
          type: string
        example: VARIABLE1,VARIABLE2,VARIABLE3
      - name: computeSessionID
        in: query
        description: The key of an active compute session you wish to use.
        required: false
        schema:
          type: string
        example: c04b9382-c57b-44ef-b137-381b05afb8d1
      - name: preserveComputeSessionFlg
        in: query
        description: This flag indicates if you would like to preserve the compute
          session for later requests.
        schema:
          type: boolean
        example: false
      - name: preserveComputeSessionOnTimeOut
        in: query
        description: This flag indicates if you would like to preserve the compute
          session after a time-out occurs.
        schema:
          type: boolean
        example: false
      - name: format
        in: query
        description: This flag indicates if you would like SAS formats to be applied
          to the output data.
        schema:
          type: boolean
        example: false
      requestBody:
        content:
          application/vnd.sas.risk.core.runcoderesults+json:
            schema:
              $ref: '#/components/schemas/runCodeRequestBody'
            examples:
              example:
                $ref: '#/components/examples/runCodeBody'
          application/json:
            schema:
              $ref: '#/components/schemas/runCodeRequestBody'
            examples:
              example:
                $ref: '#/components/examples/runCodeBody'
        description: The parameters and code to be used in the run.
        required: false
      responses:
        '201':
          description: The request succeeded and the job has returned with a completed
            state.
          content:
            application/vnd.sas.risk.core.run.code:
              schema:
                $ref: '#/components/schemas/runCodeResults'
              examples:
                example:
                  $ref: '#/components/examples/runCodeResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/runCodeResults'
              examples:
                example:
                  $ref: '#/components/examples/runCodeResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/runCodeJobFailedErrorResponse'
