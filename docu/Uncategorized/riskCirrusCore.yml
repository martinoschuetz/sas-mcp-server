      - state
      - solution_id
      - session_id
    jobRequestSummary:
      title: Job Request Summary
      description: An object representing the requested job
      type: object
      properties:
        analysisRunKey:
          type: string
          title: Analysis run identifier.
          description: |
            The unique identifier of the analysis run to be used or created during the POST request.

            This is a system assigned identifier.
          example: e7a95e4e-3ff6-41ba-b14f-3ab1e194ec29
          readOnly: true
        parentObjectKey:
          type: string
          title: Parent object identifier.
          description: |
            The unique identifier of the parent (if used) for the POST request.

            This is a system assigned identifier.
          example: d7a95e4e-3ff6-41ba-b14f-3ab1e194ec29
          readOnly: true
        parentObjectRestPath:
          type: string
          title: Parent object rest path.
          description: |
            The rest path of the parent object (if used) for the POST request.
          example: cycles
          readOnly: true
        scriptkey:
          type: string
          title: Script object identifier.
          description: |
            The unique identifier of the script used during the POST request.

            This is a system assigned identifier.
          example: g7a95e4e-3ff6-41ba-b14f-3ab1e194ec29
          readOnly: true
        createdAt:
          type: string
          title: Created at timestamp.
          description: |
            The time stamp of when the job request was sent out during the POST request.
          example: 2022-07-06T11:12:00.709938-04:00
          readOnly: true
        createdInTag:
          type: string
          title: Created in tag.
          description: |
            The solution that the job request was sent out from during the POST request.
          example: CORE
          readOnly: true
        version:
          type: integer
          title: Version
          description: The version of the representation
          example: 2
          readOnly: true
        links:
          type: array
          title: Links
