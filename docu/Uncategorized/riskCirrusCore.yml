components:
  headers:
    ContentLength:
      description: The size of the log report spreadsheet.
      schema:
        type: integer
    ContentDisposition:
      description: Indicates the file is to be saved as an attachment with a suggested
        name.
      schema:
        type: string
  parameters:
    repositoryIdParameter:
      name: repositoryId
      in: path
      description: This is the identifier of an existing code repository.
      required: true
      schema:
        type: string
      example: 2017b850-151e-4315-91f2-57c9f633f344
    jobIdParameter:
      name: jobId
      in: path
      description: This is the identifier of an existing job.
      required: true
      schema:
        type: string
      example: 2017b850-151e-4315-91f2-57c9f633f344
    codeLibraryIdParameter:
      name: libId
      in: query
      description: This is the objectID of the code library object
      required: true
      schema:
        type: string
      example: release-core-2022.10
    codeLibrarySSCParameter:
      name: ssc
      in: query
      description: This is the sourceSystemCd of the code library object.  Defaults
        to 'RCC' if not provided.
      required: false
      schema:
        type: string
      example: RCC
    solutionIdParameter:
      name: solutionID
      in: query
      description: This is the solution ID of the analysis run.
      required: true
      schema:
        type: string
      example: core
    repoNameParameter:
      name: repoName
      in: query
      description: This is the repository name identifier for the remote git repository
        connection information
      required: true
      schema:
        type: string
      example: core-repo
    branchParameter:
      name: branch
      in: query
      description: This is the name of a branch in the remote git repository
      required: true
      schema:
        type: string
      example: release-core-2022.10
    solutionShortNameParameter:
      name: solutionShortName
      in: query
      description: The solution short name. Indicates what UI files to export/import
        and filters collection/export rules.
      required: false
      schema:
        type: string
      example: CORE
    includeUIFilesParameter:
      name: includeUIFiles
      in: query
      description: Indicates if the solution UI files should be exported in the promotion
        package.
      required: false
      schema:
        type: boolean
      example: true
    commitParameter:
      name: commit
      in: query
      description: This is the name of a commit ID (long or short) or tag in the remote
        git repository
      required: true
      schema:
        type: string
      example: c951e068d7ea99ddb38ee6b136078616268c9dc8
    locationTypeParameter:
      name: locationType
      in: query
      description: This is the type of the location parameter.  Valid options are
        files - Indicates that the location parameter is the ID of a file in the file
        service with ContentType=application/zip (a zip file). directory - Indicates
        that the location parameter is the path of a local directory available to
        the core service.
      required: true
      schema:
        type: string
      example: files
    locationParameter:
      name: location
      in: query
      description: The location from which to create/update the remote branch.  Either
        a file ID in the files service or a directory, depending on the value of locationType.
      required: true
      schema:
        type: string
      example: d781824a-db2b-48e6-af40-77b991c9de6f
    commitMessageParameter:
      name: message
      in: query
      description: This is the commit message to use if a new commit is created in
        the branch
      required: true
      schema:
        type: string
      example: 'Initial commit message'
    deploymentIdParameter:
      name: deploymentId
      in: path
      description: This is the identifier of an existing deployment.
      required: true
      schema:
        type: string
      example: 22b22cce-5cf7-4d90-b806-94a5b8bb9fda
    deploymentStepIdParameter:
      name: stepId
      in: path
      description: This is the identifier of a deployment step.
      required: true
      schema:
        type: string
      example: 9987481b-ee10-434b-ad55-9f3090758f66
    triggerIdParameter:
      name: triggerId
      in: path
      description: This is the identifier of an existing trigger.
      required: true
      schema:
        type: string
      example: 9987481b-ee10-434b-ad55-9f3090758f66
    objectRestPathParameter:
      name: objectRestPath
      in: query
      description: The rest path of the parent object of the job which contains the
        script (analysisRuns, cycles, or individualAssessments).
      required: true
      schema:
        type: string
      example: analysisRuns
    objectRestPathCodeLibParameter:
      name: objectRestPath
      in: query
      description: The rest path of the parent object which has 0 or more linked code
        libraries. If used objectKey must be specified.
      required: false
      schema:
        type: string
      example: analysisRuns,codeLibraries
    validateOnlyFlgParameter:
      name: validateOnlyFlg
      in: query
      description: Determines if validation should be performed without submitting
        the job (true or false)
      required: false
      schema:
        type: boolean
      example: true
    computeContextNameParameter:
      name: computeContextName
      in: query
      description: Defaults to value stored in Risk Cirrus Core Service configuration.
      required: false
      schema:
        type: string
      example: 'SAS Studio compute context'
    postExecScriptKeysParameter:
      name: postExecScriptKeys
      in: query
      description: Script keys that can be used in post-execution runs (for objectRestPath
        cycles only). These scripts will be linked to the spawned analysis run and
        availible for execution via the /executeScript/postExecution endpoint.
      required: false
      schema:
        type: string
      example: c04b9382-c57b-44ef-b137-381b05afb8d1,c04b9382-c57b-44ef-b137-381b05afb8d2
    userTaskNameParameter:
      name: userTaskName
      in: query
      description: The task of a given cycle which will be used to populate script
        parameters.
      required: true
      schema:
        type: string
      example: data_prep
    objectKeyParameter:
      name: objectKey
      in: query
      description: The key of the parent object of the job which contains the script.
      required: true
      schema:
        type: string
      example: 3278128b-3523-4612-b855-19f83024a918
    objectKeyCodeLibParameter:
      name: objectKey
      in: query
      description: The key of the parent object which has 0 or more linked code libraries.
        If used objectRestPath must be specified.
      required: false
      schema:
        type: string
      example: 3278128b-3523-4612-b855-19f83024a918
    batchJobIdParameter:
      name: jobId
      in: path
      description: This is the identifier of an existing batch job.
      required: true
      schema:
        type: string
      example: 2017b850-151e-4315-91f2-57c9f633f344
    batchJobDeleteForceParameter:
      name: force
      in: query
      description: This is the true/false flag to force delete the batch job from
        the database regardless of the errors during deletion of batch job artifacts
        (e.g. log).
      required: true
      schema:
        type: string
      example: '1'
    batchJobStepIdParameter:
      name: jobStepId
      in: path
      description: This is the identifier of an existing batch job step.
      required: true
      schema:
        type: string
      example: e96e1e58-6b7c-44d2-8521-601384ebdd32
    promotionConfigLinksIdParameter:
      name: configLinkId
      in: path
      description: This is the identifier of an existing promotion link configuration.
      required: true
      schema:
        type: string
      example: e96e1e58-6b7c-44d2-8521-601384ebdd32
    promotionConfigExportsIdParameter:
      name: configExportId
      in: path
      description: This is the identifier of an existing promotion export configuration.
      required: true
      schema:
        type: string
      example: e96e1e58-6b7c-44d2-8521-601384ebdd32
    promotionConfigCustomFieldsIdParameter:
      name: configCustomFieldId
      in: path
      description: This is the identifier of an existing promotion custom field configuration.
      required: true
      schema:
        type: string
      example: e96e1e58-6b7c-44d2-8521-601384ebdd32
    promotionJobIdParameter:
      name: jobId
      in: path
      description: This is the identifier of an existing promotion job.
      required: true
      schema:
        type: string
      example: e96e1e58-6b7c-44d2-8521-601384ebdd32
    batchJobSolutionParameter:
      name: solution
      in: query
      description: The solution ID to use for batch run. This parameter is mandatory
        and used to read solution configuration required to execute batch job. Default
        value is 'CORE'.
      required: true
      schema:
        type: string
      example: ECL
    batchJobSolutionBranchParameter:
      name: solutionBranch
      in: query
      description: The solution git branch to use for batch run. This parameter is
        optional and used to read solution configuration from a specific branch to
        execute batch job. Default value is an empty value that will resolve to the
        default solution (user) branch.
      required: false
      schema:
        type: string
      example: main
    batchJobSolutionCommitParameter:
      name: solutionCommit
      in: query
      description: The solution git commit of the batch. This parameter is optional
        and used to read solution configuration from a specific commit to execute
        batch job. Default value is an empty value that will resolve to the current
        active commit of the solution (user) branch. Set this parameter to the value
        of "latest" to use the latest commit of the solution (user) branch.
      required: false
      schema:
        type: string
      example: 04e4050860d2f5f26278a94f6f7296ba40ccdb8f
    batchJobNameParameter:
      name: name
      in: query
      description: The batch job name to assign to submitted job. If not specified,
        job name will generated as "batch <userName> <current date YYY.MM.DD>"
      required: false
      schema:
        type: string
      example: batch testUser 2023.09.01
    batchJobCodeLibraryKeyParameter:
      name: codeLibraryKey
      in: query
      description: The code library key identifier, where batch source code is located.
        Only one of the code library identifiers can be used, either codeLibraryID
        and codeLibrarySSC or codeLibraryKey. If none of the code library identifiers
        are provided, default code library will be read from the solution configuration
        parameter 'Batch.codeLibrary.default'.
      required: false
      schema:
        type: string
      example: bb0b8c0c-4f44-4075-80fe-596569fac9fc
    batchJobCodeLibraryIDParameter:
      name: codeLibraryID
      in: query
      description: The code library object ID, where batch source code is located.
        If specified, the codeLibrarySSC parameter is required. Only one of the code
        library identifiers can be used, either codeLibraryID and codeLibrarySSC or
        codeLibraryKey. If none of the code library identifiers are provided, default
        code library will be read from the solution configuration parameter 'Batch.codeLibrary.default'.
      required: false
      schema:
        type: string
      example: release-core-2023.09
    batchJobCodeLibrarySSCParameter:
      name: codeLibrarySSC
      in: query
      description: The code library object source system code, where batch source
        code is located. If specified, the codeLibraryID parameter is required. Only
        one of the code library identifiers can be used, either codeLibraryID and
        codeLibrarySSC or codeLibraryKey. If none of the code library identifiers
        are provided, default code library will be read from the solution configuration
        parameter 'Batch.codeLibrary.default'.
      required: false
      schema:
        type: string
      example: RCC
    batchJobLogLevelParameter:
      name: logLevel
      in: query
      description: The log level detailization to use during batch job execution (DEBUG,
        INFO, WARN, ERROR). If not specified, INFO log level is used by default.
      required: false
      schema:
        type: string
      example: INFO
    batchJobMaxParallelProcessesParameter:
      name: maxParallelProcesses
      in: query
      description: Maximum number of parallel processes that can be spawned during
        batch job execution. If not specified, batch program will use the number of
        CPU cores (recommended value).
      required: false
      schema:
        type: integer
      example: 8
    batchJobTimeoutMinParameter:
      name: jobTimeoutMin
      in: query
      description: The limit of the batch execution duration in minutes. If not specified,
        default timeout will be read from the solution configuration parameter 'Batch.job.timeout'.
      required: false
      schema:
        type: integer
      example: 8
    batchJobCancelTimeoutSecParameter:
      name: cancelTimeoutSec
      in: query
      description: |
        The amount of seconds to wait for the batch program to gracefully cancel its execution.
        If not specified, default cancelation timeout will be read from the solution configuration parameter 'Batch.job.cancelation.timeout'.
      required: false
      schema:
        type: integer
      example: 8
    batchJobWaitSleepSecParameter:
      name: jobWaitSleepSec
      in: query
      description: |
        The amount of seconds to wait before checking the status of the batch program execution.
        If not specified, default wait time will be read from the solution configuration parameter 'Batch.job.wait.sleep'.
      required: false
      schema:
        type: integer
      example: 8
  schemas:
    patchRequest:
      title: PatchRequest
      type: array
      description: Repository information to change.
      items:
        $ref: '#/components/schemas/patchDocument'
    patchDocument:
      title: PatchDocument
      description: A JSONPatch document as defined by RFC 6902
      required:
      - op
      - path
      - value
      properties:
        op:
          type: string
          description: The operation to be performed
          enum:
          - add
          - remove
          - replace
        path:
          type: string
          description: A JSON-Pointer
        value:
          type: string
          description: The value to be used within the operations.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    errorResponse:
      title: Error
      description: The representation of an error.
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The error message.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred
          items:
            $ref: '#/components/schemas/errorResponse'
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: '#/components/schemas/link'
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    jobParamsBody:
      title: jobParamsBody
      description: An example of parameters to use in script execution
      type: object
      properties:
        name:
          type: string
          title: Sample parameter for name
          description: This is a sample of what a parameter would look like
          example: Test Run
          readOnly: false
        startDate:
          type: string
          title: Sample parameter for a start date
          description: This is a sample of what a parameter would look like
          example: 2020-06-12
          readOnly: false
        data:
          type: string
          title: Sample parameter for data
          description: This is a sample of what a parameter would look like
          example: dataset
          readOnly: false
    jobRequestBody:
      title: Job Request Body
      description: An example of arguments for creating an execute script job.
      type: object
      properties:
        parentKey:
          type: string
          title: Parent Key
          description: The UUID of the parent object for which this job is being created.
          example: 7e2d70c1-6bac-47fb-903a-ffc892922f98
          readOnly: false
        parentRestPath:
          type: string
          title: Parent Rest Path
          description: The rest path of the parent object
          example: cycles
          readOnly: false
        analysisRunKey:
          type: string
          title: Analysis Run Key
          description: The key of the analysis run associated with the job to be created
            (leave emtpy for ad-hoc).
          example: 7e2d70c1-6bac-47fb-903a-ffc892922f98
          readOnly: false
        customFieldOverrides:
          title: Custom Field Overrides
          description: These are custom fields that should be set in the created analysis
            run (if one is created for the job).
          type: object
          readOnly: false
        parentToAnalysisRunLinkTypes:
          title: Parent To Analysis Run Link Types
          description: Link types between the analysis run and the parent object (usually
            used in the creation of the analysis run if one does not already exist).
            These links are meant to gather information from the parent that will
            be used in execution of the analysis run.
          readOnly: false
          type: object
          properties:
            parentLinkId:
              title: Parent Link ID
              type: string
              description: The link type ID between the analysis run and the parent
                object
              example: analysisRun_cycle
              readOnly: false
            codeLibraryLinkId:
              title: Code Library Link ID
              type: string
              description: The link type ID specifying the means to retrieve the code
                library from the parent obejct.
              example: cycle_codeLibrary
              readOnly: false
            codeLibraryDepLinkId:
              title: Code Library Dependants Link ID
              type: string
              description: The link type ID specifiying the means to retrieve the
                dependant code libraries from the parent obejct.
              example: cycle_codeLibrary_dependents
              readOnly: false
            configSetLinkId:
              title: Config Set Link ID
              type: string
              description: The link type ID specifying the configuration set to use
                from the parent object.
              example: cycle_configurationSet
              readOnly: false
        scriptKey:
          title: Script Key
          type: string
          description: The key of the script to be executed.
          example: 7e2d70c1-6bac-47fb-903a-ffc892922f98
          readOnly: false
        scriptParametersUIConfig:
          title: Script Parameters UI Configuration
          description: The configuration for how a work flow enabled parent can pass
            its parameters onto an analysis run used in the context of a script execution
            job. See the cycle use case for examples.
          type: object
          readOnly: false
          properties:
            customField:
              title: Custom Field
              type: string
              description: The custom field housing the current script parameters
                for the UI representation.
              example: currentTaskParameters
              readOnly: false
            taskFilter:
              title: Task Filter
              type: string
              description: The filter based on task name. This is used specifically
                for workflow enabled objects. If there are no tasks, this property
                can be omitted.
              example: Data Preparation
              readOnly: false
        scriptParameters:
          title: Script Parameters
          type: object
          description: The script parameters for use in script execution (backend
            format)
          readOnly: false
    promotionConfigurationSchema:
      title: Promotion Configuration
      description: Schema representation of the promotion configuration JSON response.
      type: object
      properties:
        version:
          type: integer
