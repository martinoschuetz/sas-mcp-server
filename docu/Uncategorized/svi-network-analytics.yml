---
openapi: 3.0.3
info:
  title: Visual Investigator Network Analytics
  description: This API is deprecated as of 2024.09 and will be removed in a future
    release. The VI Network Analytics API enables clients to execute various analytics
    operations on the CAS server provided by the networkSocial action set. This is
    primarily used from the Network view in VI to support analytics on the Network.
  version: "3"
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
  license:
    name: Terms of Use
    url: 'https://www.sas.com/en_us/legal/copyright.html'
tags:
- name: Root
  description: The root of the API.
- name: Centrality
  description: Centrality related endpoints.
paths:
  /:
    get:
      tags:
      - Root
      operationId: root
      summary: Get a list of top-level links
      description: >
        Returns a list of links to the top-level resources surfaced through this
        API. This will include access to the \"centrality\" resource which
        provides access to the analytics provided by CAS.
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                api:
                  $ref: '#/components/examples/api'
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                api:
                  $ref: '#/components/examples/api'
        "404":
          description: Service is not available.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
  /centrality:
    post:
      tags:
      - Centrality
      operationId: centrality
      summary: Calculate the centrality metrics for a network
      description: This endpoint has been replaced with /svi-sand/centrality as of
        2024.09. Calculates the centrality metrics of each node on the input network.
        The network is provided as a list of nodes and the edges between them.
      requestBody:
        content:
          application/vnd.sas.network.analytics.network+json:
            schema:
              $ref: '#/components/schemas/network'
            examples:
              network:
                $ref: '#/components/examples/network'
          application/json:
            schema:
              $ref: '#/components/schemas/network'
            examples:
              network:
                $ref: '#/components/examples/network'
        required: true
      responses:
        "200":
          description: OK.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/centralityMetricsCollection'
              examples:
                network:
                  $ref: '#/components/examples/centralityMetricsCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/centralityMetricsCollection'
              examples:
                network:
                  $ref: '#/components/examples/centralityMetricsCollection'
servers:
- url: 'https://example.com/svi-network-analytics'
  description: An example URL including the base path for this API.
components:
  schemas:
    api:
      description: The list of links to top-level resources and operations available
        from the root of the API.
      type: object
      properties:
        links:
          description: The API's top-level links.
          items:
            $ref: '#/components/schemas/link'
          type: array
        version:
          description: The version number of the API representation. This is version
            1.
          minimum: 1
          type: integer
    network:
      title: Network
      description: The representation of a network composed of a set of nodes and
        the edges between them.
      x-sas-type: Network
      x-sas-media-type:
        name: application/vnd.sas.network.analytics.network
        version: 1
      required:
      - version
      - nodes
      - edges
      properties:
        version:
          type: integer
          description: >
            This media type's schema version number. This representation is
            version 1.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/node'
          description: Array containing the nodes in the network.
        edges:
          type: array
          items:
            $ref: '#/components/schemas/edge'
          description: Array containing the edges in the network.
    node:
      title: Node
      description: A single node on the network.
      x-sas-type: Node
      x-sas-media-type:
        name: application/vnd.sas.network.analytics.node
        version: 1
      required:
      - id
      - version
      properties:
        id:
          type: string
          description: The unique ID of the node on the network.
        version:
          type: integer
          description: >
            This media type's schema version number. This representation is
            version 1.
    edge:
      title: Edge
      description: An edge representing a relationship between two nodes on the network.
      x-sas-type: Edge
      x-sas-media-type:
        name: application/vnd.sas.network.analytics.edge
        version: 1
      required:
      - id
      - version
      - source
      - target
      properties:
        id:
          type: string
          description: The unique ID of the edge on the network.
        source:
          type: string
          description: The unique ID of the source node on the network connected by
            the edge.
        target:
          type: string
          description: The unique ID of the target node on the network connected by
            the edge.
        version:
          type: integer
          description: >
            This media type's schema version number. This representation is
            version 1.
    centralityMetricsCollection:
      title: Centrality metrics collection
      description: A collection of centrality metrics.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/centralityMetrics'
            description: Array containing centrality metrics.
    centralityMetrics:
      title: Centrality metrics
      description: The representation of a node's different centrality values.
      x-sas-type: CentralityMetrics
      x-sas-media-type:
        name: application/vnd.sas.network.analytics.centrality.metrics
        version: 1
      required:
      - id
      - version
      properties:
        version:
          type: integer
          description: >
            This media type's schema version number. This representation is
            version 1.
        id:
          type: string
          description: The unique ID of the node on the network.
        degree:
          type: number
          format: double
          description: The degree of the node.
        eigen:
          type: number
          format: double
          description: The eigen centrality of the node.
        close:
          type: number
          format: double
          description: The closeness centrality of the node.
        between:
          type: number
          format: double
          description: The betweenness centrality of the node.
        influence1:
          type: number
          format: double
          description: The influence1 centrality of the node.
        influence2:
          type: number
          format: double
          description: The influence2 centrality of the node.
    link:
      description: A link to a related operation or resource.
      type: object
      properties:
        href:
          description: The URL for the link.
          type: string
        method:
          description: The HTTP method for the link.
          type: string
        rel:
          description: The relationship of the link to the resource.
          type: string
        responseItemType:
          description: 'The media type or link type of the items in the response body
            for a PUT`, `POST`, or `PATCH` operation.'
          type: string
        responseType:
          description: 'The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.'
          type: string
        type:
          description: The media type or link type for the link.
          type: string
    error2:
      description: The representation of an error.
      type: object
      properties:
        details:
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
          type: array
        errorCode:
          description: The numeric ID for the error.
          type: integer
        errors:
          description: Any additional errors that occurred.
          items:
            $ref: '#/components/schemas/error2'
          type: array
        httpStatusCode:
          description: The HTTP status code for the error.
          type: integer
        id:
          description: The string ID for the error.
          type: string
        links:
          description: The links that apply to the error.
          items:
            $ref: '#/components/schemas/link'
          type: array
        message:
          description: The message for the error.
          type: string
        remediation:
          description: A message that describes how to resolve the error.
          type: string
        version:
          description: The version number of the error representation. This representation
            is version 2.
          type: integer
    baseCollection2:
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an "items"
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2).
      type: object
      properties:
        accept:
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
          type: string
        count:
          description: If populated indicates the number of items in the collection.
          format: int64
          type: integer
        limit:
          description: The number of items that were requested for the collection.
          type: integer
        links:
          description: The links that apply to the collection.
          items:
            $ref: '#/components/schemas/link'
          type: array
        name:
          description: The name of the collection.
          type: string
        start:
          description: The zero-based index of the first item in the collection.
          format: int64
          type: integer
        version:
          description: The version number of the collection representation. This representation
            is version 2.
          type: integer
  examples:
    api:
      description: 'An example of the response from the /svi-network-analytics listing
        the top level links'
      value: {"version": 1, "links": [{"method": "POST", "rel": "centrality", "href": "/svi-network-analytics/centrality",
            "uri": "/svi-network-analytics/centrality", "type": "application/vnd.sas.network.analytics.network",
            "responseType": "application/vnd.sas.collection", "responseItemType": "application/vnd.sas.network.analytics.centrality.metrics"}]}
    network:
      description: 'This media type defines the request for /centrality containing
        the collection of nodes and edges that make up the network.'
      value: {"version": 1, "nodes": [{"version": 1, "id": "N1"}, {"version": 1, "id": "N2"},
          {"version": 1, "id": "N3"}], "edges": [{"version": 1, "id": "L1", "source": "N1",
            "target": "N2"}, {"version": 1, "id": "L2", "source": "N2", "target": "N3"}]}
    error2Response404:
      description: 'An example of a 404 resource not found Error message.'
      value: {"errorCode": "95144", "message": "No entity type was found with the\
          \ name \"example\".", "id": "af180279-0181-44ce-b31e-bb649d0231a0", "links": [],
        "version": 2, "httpStatusCode": 404}
    centralityMetricsCollection:
      description: 'This media type represents the centrality metrics for a 3 node
        in the network.'
      value: {"links": [], "name": "items", "accept": "application/vnd.sas.network.analytics.centrality.metrics",
        "items": [{"version": 1, "id": "1", "degree": 1, "eigen": 0.7071067811865479,
            "close": 0.6666666666666666, "between": 0, "influence1": 0.3333333333333333,
            "influence2": 0.6666666666666666}, {"version": 1, "id": "2", "degree": 2,
            "eigen": 1, "close": 1, "between": 1, "influence1": 0.6666666666666666,
            "influence2": 0.6666666666666666}, {"version": 1, "id": "3", "degree": 1,
            "eigen": 0.7071067811865479, "close": 0.6666666666666666, "between": 0,
            "influence1": 0.3333333333333333, "influence2": 0.6666666666666666}],
        "version": 2}
