        status: Success
    root:
      description: List of top-level links.
      value:
        version: 1
        links:
        - method: GET
          rel: decisionsRuntimeBuilderRoot
          href: /decisionsRuntimeBuilder
          uri: /decisionsRuntimeBuilder
          type: application/vnd.sas.api
        - method: GET
          rel: updateScr
          href: /decisionsRuntimeBuilder/update
          uri: /decisionsRuntimeBuilder/update
          responseType: application/vnd.sas.microanalytic.module
    ScrUpdateRequest:
      description: Update a SAS Container Runtime published image request.
      value:
        imageURI: "registry.myserver.com/scr-pipeline-apps/autopurchasedec1_1:3"
        publishDestination: scr-pipeline-apps
        publishTag: "1.5"
paths:
  /:
    get:
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level collections that are surfaced
        through the API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded. A collection of link objects was returned.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/root"
  /update:
    post:
      tags:
      - Update
      summary: Update a SAS Container Runtime published image
      description: Updates the SAS Container Runtime binary files in a published image.
      operationId: createUpdateScr
      requestBody:
        content:
          application/vnd.sas.scr.update.request+json:
            schema:
              $ref: "#/components/schemas/scrUpdateRequest"
            examples:
              default:
                description: Update a published image.
                value:
                  imageURI: "registry.myserver.com/scr-pipeline-apps/autopurchasedec1_1:3"
                  publishDestination: scr-pipeline-apps
                  publishTag: "1.5"
          application/json:
            schema:
              $ref: "#/components/schemas/scrUpdateRequest"
            examples:
              default:
                $ref: "#/components/examples/ScrUpdateRequest"
        description: updateReq
        required: true
      responses:
        "201":
          description: The SAS Container Runtime binary files were updated in the
            image.
          headers:
            Location:
              description: /decisionsRuntimeBuilder
              schema:
                type: string
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.scr.update.request+json:
              schema:
                $ref: "#/components/schemas/scrCommandResult"
              examples:
                default:
                  $ref: "#/components/examples/ScrCommandResult"
            application/json:
              schema:
                $ref: "#/components/schemas/baseCollection2"
              examples:
                default:
                  $ref: "#/components/examples/ScrCommandResult"
        "400":
          description: The request was invalid. The image was not updated.
          content:
            application/vnd.sas.scr.update.request+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  description: Bad request.
                  value:
                    httpStatusCode: 400
                    version: 2
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  description: Bad request.
                  value:
                    httpStatusCode: 400
                    version: 2
