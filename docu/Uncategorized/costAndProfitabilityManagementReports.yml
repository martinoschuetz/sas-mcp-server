---
openapi: 3.0.3
info:
  version: "1"
  title: Cost And Profitability Management Reports
  description: >
    The Cost and Profitability Management Reports Service provides functionality
    to Report models data to the data sources like xml file or database.
    <br><br> Features of this API include: <ul> <li>Read models data.</li> </ul>
  termsOfService: 'https://www.sas.com/en_us/legal/copyright.html'
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/costAndProfitabilityManagementReports
  description: Kubernetes mock server
tags:
- name: Root
  x-sas-internal: true
  description: The operations for the root resource.
- name: Export
  description: The export operation.
- name: Status
  x-sas-internal: true
  description: The status of reports microservice.
- name: Database
  description: Database Connection.
paths:
  /:
    get:
      x-sas-internal: true
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      responses:
        "200":
          description: OK
          content:
            "application/vnd.sas.api+json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/root200response"
            "application/json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/root200response"
          headers:
            Content-Type:
              required: true
              description: The content type.
              schema:
                type: string
            Last-Modified:
              required: true
              description: The last modified date and time of the api.
              schema:
                type: string
  "/reports/{modelId}/export":
    post:
      summary: Export a model
      description: "Export models data either to user-provided XML filename in the\
        \ PVC location of reports microservice or to an External Postgres Database\
        \ with user-provided connection details."
      tags:
      - Export
      operationId: createExport
      parameters:
      - name: modelId
        in: path
        description: The unique identifier of a model.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/vnd.sas.cost.and.profitability.management.reports.export+json:
            schema:
              $ref: "#/components/schemas/exportModel"
            examples:
              exportToxml:
                $ref: "#/components/examples/exportToXmlPostRequest"
              exportToDatabase:
                $ref: "#/components/examples/exportToDbPostRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/api"
            examples:
              default:
                $ref: "#/components/examples/application_json"
        description: Request body to export a model.
        required: true
      responses:
        "201":
          description: Export operation summary generated successfully.
          headers:
            Location:
              description: The URI of the newly exported model.
              schema:
                type: string
            Etag:
              description: Used as caching key for future requests.
              schema:
                type: string
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.cost.and.profitability.management.model.operations+json:
              schema:
                $ref: "#/components/schemas/exportOperation"
              examples:
                default:
                  $ref: "#/components/examples/exportStatus201"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/application_json"
        "400":
          description: Bad Request. The request is not properly formed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/exportStatus400"
          headers:
            Content-Type:
              description: Type of error object.
              schema:
                type: string
            Location:
              description: The URI of the newly exported model.
              schema:
                type: string
        "404":
          description: No model exists at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/exportStatus404"
          headers:
            Content-Type:
              description: Type of error object.
              schema:
                type: string
            Location:
              description: The URI of the newly exported model.
              schema:
                type: string
  "/reports/validation/dataSource":
    post:
      summary: Test the database connection
      description: "Tests the database connection whether it is successful or not\
        \ based on the provided database connection details"
      tags:
      - Database
      operationId: createDatabaseConnection
      requestBody:
        content:
          application/vnd.sas.cost.and.profitability.management.reports.database.connection+json:
            schema:
              $ref: "#/components/schemas/databaseConnectionDetails"
            examples:
              default:
                $ref: "#/components/examples/dbConnectionPostRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/api"
            examples:
              default:
                $ref: "#/components/examples/application_json"
        description: Request body to test database connection.
        required: true
      responses:
        "200":
          description: The database connection is successful.
          headers:
            Location:
              description: The URI of the database connection.
              schema:
                type: string
            Etag:
              description: Used as caching key for future requests.
              schema:
                type: string
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.cost.and.profitability.management.reports.database.connection+json:
              schema:
                $ref: "#/components/schemas/connectionSucceded"
              examples:
                default:
                  $ref: "#/components/examples/dbConnectionResponse200"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/application_json"
        "400":
          description: Bad Request. The request is not properly formed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/dbConnectionResponse400"
          headers:
            Content-Type:
              description: Type of error object
              schema:
                type: string
            Location:
              description: The URI of the database connection.
              schema:
                type: string
        "404":
          description: Requested resource does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/dbConnectionResponse404"
          headers:
            Content-Type:
              description: Type of the error object.
              schema:
                type: string
            Location:
              description: The URI of the database connection.
              schema:
                type: string
  "/status":
    get:
      x-sas-internal: true
      tags:
      - Status
      summary: Get status of reports microservice
      description: Get status of reports microservice.
      operationId: getExportStatus
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            "application/vnd.sas.content.reports+json":
              schema:
                $ref: "#/components/schemas/exportStatus"
              examples:
                default:
                  $ref: "#/components/examples/reportStatus200"
            "application/json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/application_json"
        "404":
          description: Export service not found at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/reportStatus404"
          headers:
            Content-Type:
              description: Type of error object.
              schema:
                type: string
components:
  schemas:
    exportModel:
      title: Representation Used in Requests to Export a Model
      description: Representation used in requests to export a model.
      required:
      - exportType
      properties:
        exportType:
          type: string
          title: Type of export operation
          description: Type of export operation.
          example: "xml"
        fileName:
          type: string
          title: Name of a File
          description: Name of a file under which model will be exported.
          example: "ParcelExpress.xml"
        overwrite:
          type: boolean
          title: overwrite file
          description: Default value is false , If you want to overwrite file with
            same name set to true.
          example: true
        periodScenarioList:
          $ref: "#/components/schemas/periodScenarioListDetails"
        databaseConnectionDetails:
          $ref: "#/components/schemas/databaseConnectionDetails"
    periodScenarioListDetails:
      title: Representation used in the request to specify Period Scenario List
      description: Representation used in the request to specify Period Scenario List
      required:
      - periodReference
      - scenarioReference
      properties:
        periodReference:
          type: string
          title: Period reference to export a model.
          description: Period reference to export a model.
          example: "2008 Q1"
        scenarioReference:
          type: string
          title: scenario reference to export a model.
          description: scenario reference to export a model.
          example: "Budget"
    databaseConnectionDetails:
      title: Representation Used in Requests to provide the database connection details.
      description: Representation Used in Requests to provide the database connection
        details.
      required:
      - host
      - port
      - authorizationDomainId
      - databaseName
      - databaseType
      properties:
        host:
          type: string
          title: Host name of the database
          description: Host name of the database.
          example: "cpm-viya-m1-m1.retail.sashq-d.openstack.sas.com"
        port:
          type: integer
          title: Port number for the database
          description: Port number for the database.
          example: 28523
        authorizationDomainId:
          type: string
          title: ID of authorization domain
          description: ID of authorization domain where the credentails of the database
            are stored.
          example: "ExternalPostgresAuth"
        databaseName:
          type: string
          title: Name of the database
          description: Name of the database.
          example: "ParcelExpressDB"
        databaseType:
          type: string
          title: Type of the database
          description: Type of the database.
          example: "postgres"
        advancedParameters:
          $ref: "#/components/schemas/advancedParameters"
    advancedParameters:
      title: Advanced parameters
      description: This is an object of advanced parameters with key value pair which
        are required based on the database.
      properties:
        property:
          title: advanced parameters
          type: string
          description: The name and value of the assignment property.
          example: value
    exportOperation:
      title: exportOperation
      description: "Export operation starts exporting a model and operation summary\
        \ is generated for reference."
      required:
      - creationTimeStamp
      - createdBy
      - modifiedTimeStamp
      - version
      - operationId
      - modelReference
      - modelName
      - operationType
      - operationStatus
      - startTime
      - endTime
      - links
      properties:
        creationTimeStamp:
          type: string
          format: date-time
          description: Date and time at which the model was exported.
        createdBy:
          type: string
          description: The user who exported the model.
          example: "admin"
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Date and time at which the model was modified.
        version:
          type: integer
          description: This represents the version (1).
          example: 1
        operationId:
          title: Unique ID of the Operation
          type: string
          description: The system assigned unique ID for the operation.
          example: "1a00b3ac-5542-488e-866c-281babc7c7fa"
        modelReference:
          title: Reference of the Model
          type: string
          description: The reference of the model. reference must be unique.
          example: "pe"
        modelName:
          title: Name of the Model
          type: string
          description: The Name of the model. name must be unique.
          example: "pe"
        operationType:
          title: Type of Operation
          type: string
          description: Type of operation .
          example: "Export"
        operationStatus:
          title: Status of Operation
          type: string
          description: Status of operation.
          example: "Running"
        startTime:
          title: Start Time of the Export
          type: string
          description: Start time of the export.
          example: "2022-09-16T10:29:29.273297948"
        endTime:
          title: End Time of the Export
          type: string
          description: End time of the export.
          example: "2022-09-16T10:29:29.273297948Z"
        links:
          type: array
          description: Paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
    exportStatus:
      x-sas-internal: true
      title: exportStatus
      description: "Export status whether it is running or not."
      properties:
        message:
          type: string
          description: If the user receives a welcome message, that means that the
            reports service is up.
          example: "Welcome to Reports service"
    connectionSucceded:
      title: Database connection
      description: This is response after database connection is successful.
      required:
      - message
      properties:
        message:
          type: string
          description: message returned after database connection is successful.
          example: "The database connection is successful."
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
  examples:
    exportToXmlPostRequest:
      value: {"exportType": "xml", "fileName": "PeExp.xml", "periodScenarioList": [
          {"periodReference": "2008 Q1", "scenarioReference": "Actual"}, {"periodReference": "2010\
              \ Q1", "scenarioReference": "Budget"}]}
      description: Example of request body for export to xml operation.
    exportStatus404:
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 140006, "message": "The\
          \ specified model does not exist.", "details": ["path: /costAndProfitabilityManagementReports/reports/d7648922-7f62-11ed-9b89-eae638ea1a8/export",
          "correlator: 4f38b9dd-ee67-4f52-a5ab-20255b1f9fe9"]}
      description: Example of 404 error for export operation.
    exportStatus400:
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 140001, "message": "The\
          \ filename contains special characters.", "details": ["path: /costAndProfitabilityManagementReports/reports/9cf9bbcf-6af6-11ed-a719-92a6ed302e75/export",
          "correlator: af6a0db5-eb5c-4961-8759-a4bfb522ff81"]}
      description: Example of 400 bad request error for export operation.
    dbConnectionPostRequest:
      value: {"host": "clustername.openstack.sas.com", "port": 28523, "authorizationDomainId": "ExternalPostgresAuth",
        "databaseName": "EXPDB", "databaseType": "POSTGRES", "advancedParameters": {
          "sslmode": "require"}}
      description: Example of request body for testing database connection.
    application_json:
      value: {"version": 1, "links": [{"method": "POST", "rel": "report", "href": "/costAndProfitabilityManagementReports/export",
            "uri": "/costAndProfitabilityManagementManagementReports/export", "type": "application/vnd.sas.cost.and.profitability.management.reports",
            "itemType": "application/vnd.sas.cost.and.profitability.management.reports"}]}
      description: Example of response displayed when we select content type application/json.
    root200response:
      value: {"version": 1, "links": [{"method": "POST", "rel": "exportModel", "href": "/costAndProfitabilityManagementReports/export",
            "uri": "/costAndProfitabilityManagementReports/export", "type": "application/vnd.sas.content.cost.and.profitability.management.reports.export"},
          {"method": "GET", "rel": "status", "href": "/costAndProfitabilityManagementReports/status",
            "uri": "/costAndProfitabilityManagementReports/status", "type": "application/vnd.sas.content.reports"}]}
      description: Example of response with status code 200 from root API.
    exportToDbPostRequest:
      value: {"exportType": "Database", "databaseConnectionDetails": {"host": "clustername.clusterdomain.com",
          "port": 5006, "authorizationDomainId": "authdomain", "databaseName": "export",
          "databaseType": "postgres", "advancedParameters": {"sslmode": "require"}},
        "periodScenarioList": [{"periodReference": "2008 Q1", "scenarioReference": "Actual"},
          {"periodReference": "2010 Q1", "scenarioReference": "Budget"}]}
      description: Example request body to perform export to database operation.
    reportStatus404:
      value: {"version": 2, "httpStatusCode": 404, "message": "There is no handler\
          \ defined for the path \"/costAndProfitabilityManagementReports/statu\".",
        "details": ["path: /costAndProfitabilityManagementReports/statu", "correlator:\
            \ c3027381-8165-404a-bd15-eca03ff8e6de"]}
      description: Example of 404 error for export status.
    exportStatus201:
      value: {"creationTimeStamp": "2022-10-04T04:48:54.191882Z", "createdBy": "sasboot",
        "modifiedTimeStamp": "2022-10-04T04:48:54.191883Z", "version": 1, "operationId": "d93dc65d-439f-11ed-be4c-061f7c1ae8da",
        "modelReference": "PE", "modelName": "PE", "operationType": "Export", "operationStatus": "Running",
        "startTime": "2022-10-04T04:48:54.18991722Z", "endTime": "0001-01-01T00:00:00Z",
        "links": [{"method": "GET", "rel": "self", "href": "/costAndProfitabilityManagementModels/operations/d93dc65d-439f-11ed-be4c-061f7c1ae8da",
            "uri": "/costAndProfitabilityManagementModels/operations/d93dc65d-439f-11ed-be4c-061f7c1ae8da",
            "type": "application/vnd.sas.cost.and.profitability.management.model.operations"}]}
      description: Example of response for export operation.
    dbConnectionResponse200:
      value: {"message": "The database connection is successful."}
      description: Example of response after database connection is successful.
    reportStatus200:
      value: "{\"message\":\"Welcome to Reports service\"}"
      description: Example of export status.
    dbConnectionResponse404:
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 12302, "message": "The\
          \ credential for the user \"cpstest\" in the domain \"ExternalPostgresAuthD\"\
          \ does not exist.", "details": ["traceId: 75a6b19b344815a4", "path: /credentials/domains/ExternalPostgresAuthD/secrets",
          "path: /costAndProfitabilityManagementReports/reports/validation/dataSource",
          "correlator: 0270c6ca-4038-4cf1-b98c-13def79329bd"]}
      description: Example of error response after database connection is unsuccessful.
    dbConnectionResponse400:
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 140014, "message": "The\
          \ application failed to establish a database connection. Contact your database\
          \ administrator. Message: dial tcp 10.121.22.194:943: connect: connection\
          \ refused", "details": ["path: /costAndProfitabilityManagementReports/reports/validation/dataSource",
          "correlator: 278127a5-e997-4cc5-b9f3-285316eb8f95"]}
      description: Example of error response after database connection is unsuccessful.
