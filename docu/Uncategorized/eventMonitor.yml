---
openapi: 3.0.3
info:
  version: "1"
  title: Event Monitor
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: >
    The Event Monitor API enables clients to perform the following tasks:

    * Work with Events
      * Get, Set and Delete event configuration.
    * Work with Providers
      * Get, Set and Delete provider configuations for file systems.
    * Get File Event
      * Retrieve if file event is verified.
    * Recieve Event Alerts
      * Get event alerts from registered providers.
tags:
- name: Api
  description: Get the links to all base resources managed by the Event Monitor.
- name: Events
  description: Contains the operations for the event resource.
- name: Provider
  description: Contains the operations for the provider resource.
- name: FileEvent
  description: Contains the operations for the file event  resource.
- name: EventAlert
  description: Contains the operations for the  event alert resource.
paths:
  /:
