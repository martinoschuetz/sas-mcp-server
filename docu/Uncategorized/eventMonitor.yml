  /eventMonitor/events:
    get:
      tags:
      - Events
      summary: Get a list of events
      description: "Returns a list of monitored events. Standard paging, filtering,\
        \ and sorting options are provided.<br>\nReturned items will be of media type\
        \ application/vnd.sas.monitor.event"
      operationId: getEvents
      responses:
        "200":
          headers:
            Last-Modified:
              description: the ISO8601 date string representing the timestamp of the
                last update to this event.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          description: OK.
          content:
            "application/vnd.sas.collection+json":
              schema:
                $ref: "#/components/schemas/event"
              examples:
                api:
                  $ref: "#/components/examples/event"
            "application/json":
              schema:
                $ref: "#/components/schemas/event"
              examples:
                api:
                  $ref: "#/components/examples/event"
        "400":
          description: The request was invalid.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/badRequestErrorResponse"
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/badRequestErrorResponse"
        "404":
          description: No resource exists at the requested path.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                api:
                  $ref: "#/components/examples/notFoundErrorResponse"
      parameters:
      - name: start
        in: query
        description: 0-based offset of first event to return. The default value is
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of events to return. The default value is 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned events. See [Filtering in REST\
          \ APIs](https://developer.sas.com/apis/rest/Topics/#filters). <br>Any member\
          \ of the Event object can be used to filter the results: id, name, eventType,\
          \ createdBy, modifiedBy, uri or source. Date fields currently cannot be\
          \ used to filter results. <br>Sample queries<br> <ul>  <li>Get events by\
          \ name: `/events?filter=contains(name, 'Sample')`</li> <li>Get events by\
          \ eventType: `/events?filter=in(eventType, 'file')` </ul>"
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort returned events. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).<br>
          The default sort order is name:ascending. Other valid sorting options are
          <ul><li><code>orderNum</code> the order specified by the user</li> <li><code>added</code>
          the timestamp when the item was added</li> <li><code>name</code> the event
          name </ul>
        schema:
          type: string
          format: sort-criteria
      - name: If-None-Match
        in: header
        description: Specifies the ETag that is associated with a value of the session
          state.
        required: false
        schema:
          type: string
    post:
      tags:
      - Events
      summary: Create a new event
      description: Creates a new event.
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/vnd.sas.event.monitor.event+json:
            schema:
              $ref: "#/components/schemas/event"
            examples:
              context:
                $ref: "#/components/examples/event"
          application/json:
            schema:
              $ref: "#/components/schemas/event"
            examples:
              context:
                $ref: "#/components/examples/event"
      responses:
        "201":
          description: An event was created.
          headers:
            Location:
              description: The URI of the newly created event.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
