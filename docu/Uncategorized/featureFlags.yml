---
openapi: 3.0.3
info:
  title: FeatureFlags
  description: >
    Provides feature flags for applications and other deployable units.

    Version 2 allows adding groups in addition to users to release and experimental
    toggles.


    Version 3 adds the /insideSas endpoint.


    Version 4 adds conditional get, GET /features adds "type"
    request parameter, GET /enabled adds "onlyEnabled" request parameter.


    Version 5 adds: PUT/DELETE: /features/{featureId}/approval; links "addApproval"
    and "deleteApproval";
    Schema "featureFlagDefinition", adds version 2, members "approvedBy", "approvedTimeStamp".

    Version 6 adds:  PATCH /features


    The typical browser use makes a single call to /enabled.
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
  version: "6"
tags:
- name: User
  description: Operations for ordinary users.
- name: Management
  description: Management operations.
- name: ManagementInsideSas
  description: Operations restricted to "inside SAS" only, but allowed for any user
    (e.g. testers/developers).
- name: AdminManagementInsideSas
  description: Operations restricted both to administrators and "inside SAS".
paths:
  /:
    get:
      tags:
      - User
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root links:
                  $ref: "#/components/examples/root_links"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root links:
                  $ref: "#/components/examples/root_links"
    head:
      tags:
      - User
      summary: Existence check for links for the API
      description: Existence check for the links to the top-level resources for the
        API.
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root links:
                  $ref: "#/components/examples/root_links"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root links:
                  $ref: "#/components/examples/root_links"
  /enabled:
    get:
      tags:
      - User
      summary: Evaluate one or more feature flags
      description: Evaluate one or more feature flags.
      operationId: getEnabledFlags
      parameters:
      - name: ids
        in: query
        description: CSV of the feature IDs to check, or all features if not specified.
        required: false
        schema:
          type: string
      - name: appIds
        in: query
        description: CSV list of application IDs to check.
        schema:
          type: string
      - name: onlyEnabled
        in: query
        description: if "true", only the features which are enabled are returned.
        schema:
          type: boolean
          default: false
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                default: no-cache, max-age=3600
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/userFeatureFlagCollection"
              examples:
                enabled and not enabled:
                  $ref: "#/components/examples/enabled"
            application/json:
              schema:
                $ref: "#/components/schemas/userFeatureFlagCollection"
              examples:
                enabled and not enabled:
                  $ref: "#/components/examples/enabled"
        "304":
          description: not modified, the browser cache is current.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                default: no-cache, max-age=3600
  "/enabled/{featureId}":
    get:
      tags:
      - User
      summary: Evaluate a single feature flag
      description: Evaluate a single feature flag.
      operationId: getEnabledFlag
      parameters:
      - name: featureId
        in: path
        description: The feature ID to check.
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
          content:
            application/vnd.sas.feature.flag+json:
              schema:
                $ref: "#/components/schemas/userFeatureFlag"
              examples:
                enabled and not enabled:
                  $ref: "#/components/examples/enabledOne"
            application/json:
              schema:
                $ref: "#/components/schemas/userFeatureFlag"
              examples:
                "enabled and not enabled":
                  $ref: "#/components/examples/enabledOne"
        "304":
          description: not modified, the browser cache is current.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
    head:
      tags:
      - User
      summary: Existence check of a single feature flag
      description: Existence check of a single feature flag.
      operationId: headersForEnabledFlag
      parameters:
      - name: featureId
        in: path
        description: The feature ID to check.
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
          content:
            application/vnd.sas.feature.flag+json:
              schema:
                $ref: "#/components/schemas/userFeatureFlag"
              examples:
                enabled and not enabled:
                  $ref: "#/components/examples/enabledOne"
            application/json:
              schema:
                $ref: "#/components/schemas/userFeatureFlag"
              examples:
                enabled and not enabled:
                  $ref: "#/components/examples/enabledOne"
        "304":
          description: not modified, the browser cache is current.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
  /insideSas:
    get:
      tags:
      - User
      summary: Return the "inside sas" analysis
      description: >
        A specialization of feature flags is to KNOW if it is running inside SAS,
        or at a customer site. This answer
        is available at this endpoint.  One use, is to enable "debugging" behavior
        only if "inside sas".

        There is a bias to false negative.  That is, it is possible although rare
        to return false when in fact at SAS.
        The reverse is not true.
      operationId: getInsideSas
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
            Cache-Control:
              description: header encouraging caching this response
              schema:
                type: string
                default: no-cache
          content:
            application/vnd.sas.inside.sas+json:
              schema:
                $ref: "#/components/schemas/insideSas"
              examples:
                inside sas true:
                  $ref: "#/components/examples/insideSas"
            application/json:
              schema:
                $ref: "#/components/schemas/insideSas"
              examples:
                inside sas true:
                  $ref: "#/components/examples/insideSas"
        "304":
          description: not modified, the browser cache is current.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
            Cache-Control:
              description: header encouraging caching this response
              schema:
                type: string
                default: no-cache
  /features:
    get:
      tags:
      - Management
      summary: Get details of all (or specified) features
      description: Get details of all features, intended to populate an administrative
        user interface. Note non-admin users can use this, but receive a reduced-detail
        response.
      operationId: getFeatures
      parameters:
      - name: ids
        in: query
        description: CSV list of feature ids to constrain to.
        required: false
        schema:
          type: string
      - name: appIds
        in: query
        description: CSV list of application ids to constrain to. These should be
          the application's ID with AppRegistry.
        schema:
          type: string
      - name: type
        in: query
        description: >
          Filter to only return features of this type. Valid value: "release", "experimental",
          "permissioning".
        required: false
        schema:
          type: string
          enum:
          - ""
          - "release"
          - "experimental"
          - "permissioning"
          default: ""
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinitionCollection"
              examples:
                get features - admin:
                  $ref: "#/components/examples/getFeaturesAdmin"
                get features - non-admin:
                  $ref: "#/components/examples/getFeaturesUser"
            application/json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinitionCollection"
              examples:
                get features - admin:
                  $ref: "#/components/examples/getFeaturesAdmin"
                get features - non-admin:
                  $ref: "#/components/examples/getFeaturesUser"
        "304":
          description: not modified, the browser cache is current.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
        "400":
          description: Bad request.
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                get features - admin:
                  $ref: "#/components/examples/getFeaturesError"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                get features - admin:
                  $ref: "#/components/examples/getFeaturesError"
    head:
      tags:
      - Management
      summary: Existence check details of all (or specified) features
      description: Existence check details of all features, intended to populate an
        administrative user interface. Note non-admin users can use this, but receive
        a reduced-detail response.
      operationId: headersForFeatures
      parameters:
      - name: ids
        in: query
        description: CSV list of feature ids to constrain to.
        required: false
        schema:
          type: string
      - name: appIds
        in: query
        description: CSV list of application ids to constrain to. These should be
          the application's ID with AppRegistry.
        schema:
          type: string
      - name: type
        in: query
        description: >
          Filter to only return features of this type. Valid value: "release", "experimental",
          "permissioning".
        required: false
        schema:
          type: string
          enum:
          - ""
          - "release"
          - "experimental"
          - "permissioning"
          default: ""
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinitionCollection"
              examples:
                get features - admin:
                  $ref: "#/components/examples/getFeaturesAdmin"
                get features - non-admin:
                  $ref: "#/components/examples/getFeaturesUser"
            application/json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinitionCollection"
              examples:
                get features - admin:
                  $ref: "#/components/examples/getFeaturesAdmin"
                get features - non-admin:
                  $ref: "#/components/examples/getFeaturesUser"
        "304":
          description: not modified, the browser cache is current.
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
        "400":
          description: Bad request.
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                get features - admin:
                  $ref: "#/components/examples/getFeaturesError"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                get features - admin:
                  $ref: "#/components/examples/getFeaturesError"
    post:
      tags:
      - Management
      summary: Create a release toggle
      description: >
        Create a release toggle.


        The expected use case is that Content-Type will be application/vnd.sas.feature.flag.definition.instant+json
        (or application/json),
        and that this is an "instant" request to create a minimally defined release
        toggle. As an additional step consistent with this use
        case, the caller will be added to the list of authorized users. As with all
        things "release toggle", this functionality is only operational within SAS.

        Note that this POST operation is primarily for "instant" feature definitions;
        consequently Content-Type "application/json"
        will assume an "instant" and not a "full" definition.

        Alternatively, if media type application/vnd.sas.feature.flag.definition+json
        is the Content-Type, then a full definition is
        expected and behavior is similar to "upload" cases (although synchronous).  We
        do not initially have use cases for this operation;
        but it is supplied as part of "standard CRUD".  This variation will be restricted
        to administrators.
        For the second case, this can be a create (status 201) or an update (status
        200).  For an update to be valid, the "revision" must be
        larger than the current revision (or status 400).
      operationId: createInstantFeatureFlag
      requestBody:
        content:
          application/vnd.sas.feature.flag.definition.instant+json:
            schema:
              $ref: "#/components/schemas/featureFlagDefinitionInstant"
            examples:
              create instant feature flag:
                $ref: "#/components/examples/createInstantFFBody"
          application/vnd.sas.feature.flag.definition+json:
            schema:
              $ref: "#/components/schemas/featureFlagDefinition"
            examples:
              create full definition:
                $ref: "#/components/examples/createFullBody"
          application/json:
            schema:
              $ref: "#/components/schemas/featureFlagDefinitionInstant"
            examples:
              create instant feature flag:
                $ref: "#/components/examples/createInstantFFBody"
        description: Required details.
        required: true
      responses:
        "200":
          description: The existing feature was updated.
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                create full update:
                  $ref: "#/components/examples/createFullResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                create full update:
                  $ref: "#/components/examples/createFullResponse"
        "201":
          description: The new feature was created.
          headers:
            Location:
              description: the URI of the created feature
              schema:
                type: string
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                create instant feature flag:
                  $ref: "#/components/examples/createFullBody"
            application/json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                create instant feature flag:
                  $ref: "#/components/examples/createFullBody"
        "400":
          description: Bad request - feature validation failure.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                creation error:
                  $ref: "#/components/examples/createFFError400"
                update error:
                  $ref: "#/components/examples/createFullError"
        "409":
          description: Bad request - conflict. This is returned if the feature flag
            already exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                conflict - already exists:
                  $ref: "#/components/examples/createInstantFFError409"
    patch:
      tags:
      - Management
      summary: Update a release toggle
      description: >
        Update a release toggle.


        For a customer facing feature flag (experimental, permissioning) if a change
        is needed using the "new revision" approach is
        problematic because site changes would be overridden; this is especially the
        case for experimental flags because the administrator's
        acknowledgment that the flag is experimental, and activation of the feature
        would be a very noticeable override.


        Only patch operations "test" and "replace" are supported, use of "test" is
        strongly recommended. Patch can modify the following fields:
        idLabel, label, labelMessageIdKey, description, descriptionMessageIdKey, defaultValue.
        (n.b. experimental cannot have
        defaultValue==true.)


        Note that unlike most operations in this service where security is determined
        by being "inside sas" or not (allowing developers
        and testers to easily "opt in"), this operation is restricted to "sasapp"...
        the intent is the patch runs as part of
        meta bootstrapping.


        Note that the test MUST either start with a "test", or contain the current
        eTag (in header If-Match).


        A note about error codes.  404 indicates the feature could not be found, 409
        (conflict) that the test precondition was not
        satisfied. (409 should happen every time except the first).  The meta bootstrap
        should ignore both of these.  400 will
        represent a genuine error the developer should address.
      operationId: patchFeatureFlag
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: "#/components/schemas/featureFlagPatch"
            examples:
              patch feature flag:
                $ref: "#/components/examples/patchBody"
              patch feature flag entire 'meta' file:
                $ref: "#/components/examples/patchBodyMetaFile"
          application/json:
            schema:
              $ref: "#/components/schemas/featureFlagPatch"
            examples:
              patch instant feature flag:
                $ref: "#/components/examples/patchBody"
        description: patch definition.
        required: true
      responses:
        "200":
          description: The existing feature was updated. The updated definition is
            returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                create full update:
                  $ref: "#/components/examples/createFullResponse"
        "400":
          description: Bad request - the text will indicated the error.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                zero requests error:
                  $ref: "#/components/examples/patch0RequestsError400"
                multiple features error:
                  $ref: "#/components/examples/patchMultipleFeaturesError"
        "409":
          description: Conflict. commonly returned and should be ignored; this indicates
            the test precondition was not met. Typically, the patch was previously
            performed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                conflict - already exists:
                  $ref: "#/components/examples/patchError409"
        "412":
          description: precondition failed. Header If-Match was supplied but is incorrect.  Remediation
            - "get" the feature to obtain "eTag"; or preferable start the patch with
            a "test".
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                conflict - already exists:
                  $ref: "#/components/examples/patchError412"
        "428":
          description: precondition failed. Header If-Match was not supplied.  Remediation
            - "get" the feature to obtain "eTag"; or preferable start the patch with
            a "test".
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                conflict - already exists:
                  $ref: "#/components/examples/patchError428"
  "/features/{featureId}":
    get:
      tags:
      - Management
      summary: Get details of a feature
      description: Get details of a feature.  Note non-admin users can use this, but
        receive a reduced-detail response.
      operationId: getFeature
      parameters:
      - name: featureId
        in: path
        description: Feature ID to return.
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the feature.
              schema:
                type: string
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                feature flag definition:
                  $ref: "#/components/examples/createFullBody"
            application/json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                feature flag definition:
                  $ref: "#/components/examples/createFullBody"
        "304":
          description: Not Modified (caller's eTag matches).
          headers:
            ETag:
              description: The entity tag for the feature.
              schema:
                type: string
        "404":
          description: Not Found.
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                feature not found:
                  $ref: "#/components/examples/featureNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                feature not found:
                  $ref: "#/components/examples/featureNotFound"
    head:
      tags:
      - Management
      summary: Existence check of a feature
      description: Existence check of a feature.  Note non-admin users can use this,
        but receive a reduced-detail response.
      operationId: headersForFeature
      parameters:
      - name: featureId
        in: path
        description: Feature ID to return.
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the feature.
              schema:
                type: string
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                feature flag definition:
                  $ref: "#/components/examples/createFullBody"
            application/json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                feature flag definition:
                  $ref: "#/components/examples/createFullBody"
        "304":
          description: Not Modified (caller's eTag matches).
          headers:
            ETag:
              description: The entity tag for the feature.
              schema:
                type: string
        "404":
          description: Not Found.
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                feature not found:
                  $ref: "#/components/examples/featureNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                feature not found:
                  $ref: "#/components/examples/featureNotFound"
    delete:
      tags:
      - Management
      summary: Delete a feature
      description: Delete a feature.
      operationId: deleteFeature
      parameters:
      - name: featureId
        in: path
        description: Feature ID to delete.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No content.
  "/features/{featureId}/defaultValue":
    put:
      tags:
      - Management
      summary: Set the associated default value
      description: For a release or experimental toggle, set the default value.
      operationId: updateDefault
      parameters:
      - name: featureId
        in: path
        description: Feature ID.
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: The new default value.
        required: true
        schema:
          type: boolean
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the feature.
              schema:
                type: string
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                default value true:
                  $ref: "#/components/examples/createFullResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                default value true:
                  $ref: "#/components/examples/createFullResponse"
        "400":
          description: Bad Request - for example missing/illegal parameter.
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                input error:
                  $ref: "#/components/examples/putDefaultValue400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                input error:
                  $ref: "#/components/examples/putDefaultValue400"
        "404":
          description: Not Found.
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/featureNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
