          description: Bad request.
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not a user:
                  $ref: "#/components/examples/addUser400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not a user:
                  $ref: "#/components/examples/addUser400"
