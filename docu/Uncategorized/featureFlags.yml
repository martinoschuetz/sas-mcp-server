    post:
      tags:
      - AdminManagementInsideSas
      summary: Add a testing scenario
      description: Add the specified testing scenario.  Note that if this scenario
        is in conflict with an existing scenario, it will be rejected with 409 (Conflict).  In
        this case, a wait loop of 5-10 minutes attempting every 30 seconds is recommended.
      operationId: addTestScenario
      requestBody:
        content:
          application/vnd.sas.feature.flag.test.scenario+json:
            schema:
              $ref: "#/components/schemas/testScenario"
            examples:
              add test scenario:
                $ref: "#/components/examples/addTestScenarioBody"
              add test scenario which caused conflict:
                $ref: "#/components/examples/addTestScenario2Body"
          application/json:
            schema:
              $ref: "#/components/schemas/testScenario"
            examples:
              add test scenario:
                $ref: "#/components/examples/addTestScenarioBody"
              add test scenario which caused conflict:
                $ref: "#/components/examples/addTestScenario2Body"
        description: The test scenario.
      responses:
        "201":
          description: The scenario was created.
          content:
            application/vnd.sas.feature.flag.test.scenario+json:
              schema:
                $ref: "#/components/schemas/testScenario"
              examples:
                successful add test scenario:
                  $ref: "#/components/examples/addTestScenarioResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/testScenario"
              examples:
                successful add test scenario:
                  $ref: "#/components/examples/addTestScenarioResponse"
        "400":
          description: Bad input.
          content:
            application/vnd.sas.feature.flag.test.scenario+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad input:
                  $ref: "#/components/examples/addTestScenario400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad input:
                  $ref: "#/components/examples/addTestScenario400"
        "409":
          description: Conflict. This scenario is in conflict with another and has
            been rejected.  Recommended  procedure is to enter a loop for 5-10 minutes,
            reattempting every 30 seconds.
          content:
            application/vnd.sas.feature.flag.test.scenario+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                conflict:
                  $ref: "#/components/examples/addTestScenario2Conflict409"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                conflict:
                  $ref: "#/components/examples/addTestScenario2Conflict409"
  "/testing/scenarios/{scenarioId}":
    get:
      tags:
      - AdminManagementInsideSas
      summary: Details of a test scenario
      description: Details of a test scenario (destination of "self" link).
      operationId: getTestScenario
      parameters:
      - name: scenarioId
        in: path
        description: The scenario ID to get details for.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok.
          content:
            application/vnd.sas.feature.flag.test.scenario+json:
              schema:
                $ref: "#/components/schemas/testScenario"
              examples:
                get test scenario:
                  $ref: "#/components/examples/getTestScenario"
            application/json:
              schema:
                $ref: "#/components/schemas/testScenario"
              examples:
                get test scenario:
                  $ref: "#/components/examples/getTestScenario"
        "404":
          description: Not found.
          content:
            application/vnd.sas.feature.flag.test.scenario+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                missing scenario:
                  $ref: "#/components/examples/getTestScenario404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                missing scenario:
                  $ref: "#/components/examples/getTestScenario404"
    head:
      tags:
      - AdminManagementInsideSas
      summary: Existence check of a test scenario
      description: Existence check of a test scenario (destination of "self" link).
      operationId: headersForTestScenario
      parameters:
      - name: scenarioId
        in: path
        description: The scenario ID to get details for.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok.
          content:
            application/vnd.sas.feature.flag.test.scenario+json:
              schema:
                $ref: "#/components/schemas/testScenario"
              examples:
                get test scenario:
                  $ref: "#/components/examples/getTestScenario"
            application/json:
              schema:
                $ref: "#/components/schemas/testScenario"
              examples:
                get test scenario:
                  $ref: "#/components/examples/getTestScenario"
        "404":
          description: Not found.
          content:
            application/vnd.sas.feature.flag.test.scenario+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                missing scenario:
                  $ref: "#/components/examples/getTestScenario404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                missing scenario:
                  $ref: "#/components/examples/getTestScenario404"
    delete:
      tags:
      - AdminManagementInsideSas
      summary: Delete a test scenario
      description: Delete a test scenario (destination of "delete" link).
      operationId: deleteTestScenario
      parameters:
      - name: scenarioId
        in: path
        description: The scenario ID to delete.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No content.
  /testing/summary:
    get:
      tags:
      - AdminManagementInsideSas
      summary: Details of all scenarios
      description: >
        Details of all scenarios (destination of "summaries" link).  This is
        suitable to place in the test log for later analysis.  The output will
        detail each active test scenario as well as the underlying defined
        features.

        NOTE: the response is 'text/plain', and OpenAPI does not easily support an
        example.
        The output is intended to be human readable, and added to the log if there
        are any
        problems.  It gives a summary of the current override(s), plus a list of ALL
        feature
        flags defined in the underlying space (these overrides will override those
        as appropriate)
      operationId: getTestScenariosSummary
      responses:
        "200":
          description: Ok.
servers:
- url: http://example.com/featureFlags
  description: Sample server URL.
components:
  requestBodies:
    featuresUploadSet:
      content:
        application/vnd.sas.feature.flag.definition.set+json:
          schema:
            $ref: "#/components/schemas/featuresUploadSet"
          examples:
            new feature flag showing delete of an obsolete flag:
              $ref: "#/components/examples/upload1"
        application/json:
          schema:
            $ref: "#/components/schemas/featuresUploadSet"
          examples:
            new feature flag showing delete of an obsolete flag:
              $ref: "#/components/examples/upload1"
      description: deletion and upload details
      required: true
  schemas:
    userFeatureFlag:
      title: User facing Feature Flag.
      description: User facing Feature Flag.
      x-sas-media-type:
        name: application/vnd.sas.feature.flag
        version: "1"
      required:
      - id
      - enabled
      properties:
        id:
          type: string
          description: The ID of this feature flag.
        enabled:
          type: boolean
          description: Is this flag enabled, or not.
        version:
          type: integer
          description: The version number of this schema. This representation is 1.
    userFeatureFlagCollection:
      title: collection of user facing feature flag
      description: Collection of user facing feature flags.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/userFeatureFlag"
    featureFlagDefinition:
      title: Admin facing Feature Flag.
      description: >
        Admin facing Feature Flag. Note that "stratgies" is required in MOST but not
        all cases.
        Required on upload.  Will be provided on ADMIN download, but omitted on NON-Admin
        download.
      x-sas-media-type:
        name: application/vnd.sas.feature.flag.definition
        version: "2"
      required:
      - id
      - description
      - issueTracking
      properties:
        id:
          type: string
          description: The ID of this feature flag.  Max length = 255.
        idLabel:
          type: string
          description: Calculated field to show in the user interface.  Inside SAS
            it will be the feature ID, outside SAS it will be blank.  This is per
            Usability to not display the feature ID to customers.
        inactive:
          type: boolean
          description: >
            Is the flag inactive (true - not subject to evaluation) or "not
            inactive" (false - subject to evaluation). Ignored on upload (default=false).

            This is a per tenant value, on download it will reflect the state for
            the caller's tenant.
        label:
          type: string
          description: Default feature label, used if labelMessageIdKey does not resolve.
            Required for experimental and permissioning toggles.  Note when "getting"
            a feature, this member's default is overridden if "labelMessageIdKey"
            resolves.  Max length = 255.
        labelMessageIdKey:
          type: string
          description: For an experimental toggle or permissioning toggle (e.g. customer
            facing), this field is required and is the full localization identifier
            for the label.  For example, "app-registry-gui-icu.feature.one.label"
            It is allowed but unnecessary to specify this field for a release toggle.
        description:
          type: string
          description: The description for this feature flag. Note when "getting"
            a feature, this default value is overridden if "descriptionMessageIdKey"
            resolves.  Max length = 1023.
        descriptionMessageIdKey:
          type: string
          description: For an experimental toggle or permissioning toggle (e.g. customer
            facing), this field is required and is the full localization identifier
            for the description.  For example, "app-registry-gui-icu.feature.one.desc"
            It is allowed but unnecessary to specify this field for a release toggle.
        type:
          type: string
          description: (Output only) What type of feature flag is this; typically
            one of "release", "experimental", or "permissioning", but if there is
            more than one strategy, then this will be a csv list of the above, for
            example "permissioning,release".
        revision:
          type: integer
          description: Positive integer (default 1) representing the 'revision' of
            this feature flag definition.  During upload operations, if the feature
            already exists the upload is normally ignored; however if the upload specifies
            a larger 'revision' than is currently installed, then the new definition
            is accepted.  This is how an existing feature flag is updated in the field.
        createdBy:
          type: string
          description: The user ID creating this feature; typically a service's internal
            ID.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the feature definition was created.
            The format is `YYYY-MM-DDThh:mm:ss.sssZ`.
        products:
          type: array
          description: An array of associated products (typically 1). On upload only
            'appRegistryId' is honored.
          items:
            $ref: "#/components/schemas/product"
        issueTracking:
          type: array
          description: Issue tracking identifier, typically one Jira ID. May be full
            url to other tracking such as defects.
          items:
            type: string
        strategies:
          type: array
          description: One or more strategy definitions
          items:
            $ref: "#/components/schemas/strategyDefinition"
        approvedBy:
          type: string
          description: (version 2, output only) an experimental toggle which has been
            approved, this will be the approving user ID.
        approvedTimeStamp:
          type: string
          format: date-time
          description: >
            (version 2, output only) an experimental toggle which has been approved,
            this will be the date/time
            of the approval. The format is `YYYY-MM-DDThh:mm:ss.sssZ`.
        links:
          type: array
          description: >
            (Output only) The Hateoas links for this feature for the current
            user. Possible link relations include "self", "activateFeature",
            "deactivateFeature", "resetFeature", "defaultTrue", "defaultFalse",
            "toggleMe", "addReleaseToggle".
            Note that "toggleMe" takes two forms.  If the user is not on the list,
            then it is a POST to add the user. If the user is on the list, then it
            is a DELETE to remove the user.


            (version 2) An experimental toggle MAY have one of the following two links:
            "addApproval", "deleteApproval".
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of this schema. This representation is 1.
    featureFlagDefinitionInstant:
      title: Minimum details to create a release toggle
      description: Minimum details to create a release toggle.
      x-sas-media-type:
        name: application/vnd.sas.feature.flag.definition.instant
        version: "1"
      required:
      - id
      - description
      - issueTracking
      properties:
        id:
          type: string
          description: The ID of this feature flag.
        description:
          type: string
          description: The description for this feature flag.
        productId:
          type: string
          description: A associated product, ideally it's AppRegistry id, e.g. "SASVisualAnalytics".
        issueTracking:
          type: string
          description: Issue tracking identifier, typically a Jira ID. May be full
            url to other tracking such as defects.
        version:
          type: integer
          description: The version number of this schema. This representation is 1.
    strategyDefinition:
      title: strategy definition
      description: Strategy definition (within a feature flag).
      required:
      - id
      properties:
        id:
          type: string
          description: The ID of this strategy.  The initially supported strategy
            is "SASReleaseToggle".
        parameters:
          type: object
          description: Map of string to string, parameters for this strategy. Properties
            the UI might wish to display include "defaultValue", "userIds", "groupIds".
    product:
      title: product
      description: An associated product.  On upload supply either 'appRegistryId',
        or if not a web application, then supply both the 'name' and 'label'.  On
        download, typically 'label' and 'appName' are supplied, localized from app
        registry.  Localization is only possible when 'appRegistryId' is supplied.
      properties:
        appRegistryId:
          type: string
          description: The product's ID as registered with app registry.
        label:
          type: string
          description: The localized left-navigation label for the application, as
            supplied by app registry.
        appName:
          type: string
          description: The application's name, typically its legal name, as supplied
            by app registry.
    featureFlagDefinitionCollection:
      title: collection of feature flag definitions
      description: Collection of feature flag definitions.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/featureFlagDefinition"
    featuresUploadSet:
      title: upload definition
      description: A collection of features flag definitions to create and delete.
      x-sas-media-type:
        name: application/vnd.sas.feature.flag.definition.set
        version: "1"
      properties:
        deleteFeatureIds:
          description: Optional array of string, each a featureId to be deleted.  This
            is a practical way to remove no longer used release toggles from customer's
            sites.
          type: array
          items:
            type: string
        features:
          description: Optional array of one or more feature definitions.
          type: array
          items:
            $ref: "#/components/schemas/featureFlagDefinition"
        version:
          type: integer
          description: The version number of this schema. This representation is 1.
    testScenario:
      title: test scenario
      description: A test scenario specifying flags to be true or false.
      x-sas-media-type:
        name: application/vnd.sas.feature.flag.test.scenario
        version: "1"
      required:
      - description
      properties:
        id:
          type: string
          description: (output only) The system assigned ID of this test scenario.
        tenantId:
          type: string
          description: >
            USE WITH CARE. This is used when it's desired to affect a tenant other
            than the caller's tenant.
            It is the unusual test which would want to do this; "tenantId" is rarely
            useful to specify.
        description:
          type: string
          description: Required description of this scenario
        trueFlagIds:
          type: array
          items:
            type: string
          description: Array of strings, each indicating a feature flag to be true.  Note,
            it is not necessary for these features to be pre-defined.
        falseFlagIds:
          type: array
          items:
            type: string
          description: Array of strings, each indicating a feature flag to be false.  Note,
            it is not necessary for these features to be pre-defined.
        allCustomerFacingTrue:
          type: boolean
          description: If true, then an analysis is done to determine the list of
            all "customer facing" feature flags currently defined; these are added
            to "trueFlagIds".  "customer facing" means permissioning and experimental
            toggles.
        allCustomerFacingFalse:
          type: boolean
          description: If true, then an analysis is done to determine the list of
            all "customer facing" feature flags currently defined; these are added
            to "falseFlagIds".  "customer facing" means permissioning and experimental
            toggles.
        testExpireSec:
          type: integer
          description: It is desirable for the test to self-delete, but after this
            period (in seconds), the test will automatically expire. Minimum 15, maximum
            7200 (2 hours). Default 300 (5 minutes).
        waitForPollingInterval:
          type: boolean
          description: For features processed in services other than the feature flags
            service, the polling interval of 60 seconds applies.  If this property
            is set to true, then successful return will be delayed by 60 seconds to
            allow the test to proceed without needing to account for this non-deterministic
            period.
        links:
          type: array
          description: >
            (output only) the Hateoas links for this test scenario. Possible
            link relations include "self", "delete", and
            "scenarios".  "scenarios" returns text/plain, a summary of all
            current scenarios and is suitable to place in the test log.  It is recommended
            follow the "delete" link at the end of testing to cleanup this scenario
            and restore
            the normal configuration.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of this schema. This representation is 1.
    insideSas:
      title: inside sas analysis result.
      description: Inside sas analysis result.
      x-sas-media-type:
        name: application/vnd.sas.inside.sas
        version: "1"
      properties:
        insideSas:
          type: boolean
          description: True iff running in a sas development/testing environment.
        version:
          type: integer
          description: The version number of this schema. This representation is 1.
    featureFlagPatch:
      title: patch request.
      description: >
        patch request, conforming to standard media type 'application/json-patch+json'.
        Note that a patch is an
        array of these elements.
      properties:
        path:
          type: string
          description: True iff running in a sas development/testing environment.
        op:
          type: string
          description: The patch operation; "test" and "replace" are supported.
        value:
          type: string
          description: >
            The value. For "test" value is optional but recommended as the "old" value.
            If the current value is
            not this then the patch is aborted with 409 (conflict).  This will be
            typical as presumably after the patch
            is done this precondition will never again be true.  For "replace" value
            is required and will be the new value.
            Be aware, "experimental" flags do not permit "defaultValue" = true.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    validation:
      title: Validation Response
      description: The response from a pre-flight validation request. For APIs which
        support validation, the client can run operations (typically on resources
        in the `/commons/validation`) with `application/vnd.sas.validation+json` as
        the requested response type (via the `Accept:` request header). The service
        will validate the request but not execute the request, and return this response
        to indicate if the request was valid at the time it was made.
      x-sas-media-type:
        name: application/vnd.sas.validation
        version: 1
      required:
      - version
      - valid
      properties:
        version:
          description: This media type's schema version number. This representation
            is version 1.
          type: integer
        valid:
          description: '`true` if and only if the validation was successful.'
          type: boolean
        error:
          $ref: "#/components/schemas/error2"
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
  examples:
    uploadValidationFailure:
      description: >
        Validation of the definition failed, for example perhaps a missing required
        member.  The error(s) will be detailed.
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 115502, "message": "Key:\
          \ 'FeaturesBootstrapRep.features[0].id' Error:Field validation for 'id'\
          \ failed on the 'required' tag", "details": ["path: /featureFlags/featureSets",
          "correlator: 45103d4a-de26-455d-96f7-dc15056e7622"]}
    addReleaseToggle404:
      description: >
        error, in this case not found.
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 115501, "message": "Feature\
          \ not found: FEATFLAGS-41-VA_Chew_Gum_Featurex.", "details": ["path: /featureFlags/features/FEATFLAGS-41-VA_Chew_Gum_Featurex/releaseToggle",
          "correlator: d51f51a2-dc4d-41ee-828b-c777dde06e1d"]}
    postGroupNotIdentityGroup:
      description: >
        this error shows trying to add a group which is not recognized.
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 115502, "message": "specified\
          \ group (unknownGroup) not valid", "details": ["path: /featureFlags/features/REPSVC-818-va_chew_gum/groups",
          "correlator: e2d8b597-4976-4273-b24d-8a72c4a45e95"]}
    getTestScenario:
      description: >
        get a specific test scenario. Likely this is never used; scenarios are short
        lived, and are returned when
        successfully created... but it's good to have full CRUD.
      value: {"links": [{"method": "GET", "rel": "self", "href": "/featureFlags/testing/scenarios/test_4",
            "uri": "/featureFlags/testing/scenarios/test_4", "type": "application/vnd.sas.feature.flag.test.scenario"},
          {"method": "DELETE", "rel": "delete", "href": "/featureFlags/testing/scenarios/test_4",
            "uri": "/featureFlags/testing/scenarios/test_4"}, {"method": "GET", "rel": "scenarios",
            "href": "/featureFlags/testing/summary", "uri": "/featureFlags/testing/summary",
            "type": "text/plain"}], "version": 1, "id": "test_4", "description": "Scenario\
          \ ID: test_4\nTenantID: \nDescription: Test 1: 'walk & talk', 'chew gum'\
          \ true\nExpire duration: 2m0s\nKey Values:\nTRUE:  VA_Chew_Gum_Feature,\
          \ VA_Walk_And_Talk\nFALSE: (none)\n", "trueFlagIds": ["VA_Walk_And_Talk",
          "VA_Chew_Gum_Feature"], "falseFlagIds": [], "allCustomerFacingTrue": false,
        "allCustomerFacingFalse": false, "testExpireSec": 120, "waitForPollingInterval": false}
    root_links:
      description: Root navigation links
      value: {"links": [{"method": "GET", "rel": "enabledBulk", "href": "/featureFlags/enabled",
            "uri": "/featureFlags/enabled", "type": "application/vnd.sas.collection",
            "itemType": "application/vnd.sas.feature.flag"}, {"method": "GET", "rel": "enabledTrueBulk",
            "href": "/featureFlags/enabled?onlyEnabled=true", "uri": "/featureFlags/enabled?onlyEnabled=true",
            "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.feature.flag"},
          {"method": "GET", "rel": "enabled", "href": "/featureFlags/enabled/{featureId}",
            "uri": "/featureFlags/enabled/{featureId}", "type": "application/vnd.sas.feature.flag"},
          {"method": "GET", "rel": "features", "href": "/featureFlags/features", "uri": "/featureFlags/features",
            "type": "application/vnd.sas.collection+json", "itemType": "application/vnd.sas.feature.flag.definition"},
          {"method": "POST", "rel": "upload", "href": "/featureFlags/featureSets",
            "uri": "/featureFlags/featureSets", "type": "application/vnd.sas.feature.flag.definition.set"},
          {"method": "GET", "rel": "insideSas", "href": "/featureFlags/insideSas",
            "uri": "/featureFlags/insideSas", "type": "application/vnd.sas.inside.sas"},
          {"method": "POST", "rel": "createInstantFeatureFlag", "href": "/featureFlags/features",
            "uri": "/featureFlags/features", "type": "application/vnd.sas.feature.flag.definition.instant",
            "responseType": "application/vnd.sas.feature.flag.definition"}], "version": 1}
    getFeaturesError:
      description: >
        and error in the user input
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 115502, "message": "Invalid\
          \ request parameter 'type'. valid values: [release experimental permissioning]",
        "details": ["path: /featureFlags/features", "correlator: cdf45595-8412-4cd7-bcce-bd6735176a33"]}
    putActiveNotExperimental:
      description: >
        the "active" endpoint on a feature is only allowed for an experimental toggle.
      value: {"version": 2, "httpStatusCode": 409, "errorCode": 115502, "message": 'This
