  "/features/{featureId}/users":
    post:
      tags:
      - Management
      summary: Add the specified user
      description: Add the specified user to the list of special users.  Default is
        "@currentUser" (meaning the current user).  A normal user can add themself;
        adding a different user is restricted to the administrator.
      operationId: addUser
      parameters:
      - name: featureId
        in: path
        description: Feature ID.
        required: true
        schema:
          type: string
