          for normal users and effects that user.  Specifying a different user's ID
          requires being admin.
        required: false
        schema:
          type: string
          enum:
          - "@currentUser"
          - a_user_id
          default: "@currentUser"
      - name: identityId
        in: query
        description: Identical to "userId" - either is accepted.
        required: false
        schema:
          type: string
          enum:
          - "@currentUser"
          - a_user_id
          default: "@currentUser"
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the feature.
              schema:
                type: string
          content:
            application/vnd.sas.feature.flag.definition+json:
              schema:
                $ref: "#/components/schemas/featureFlagDefinition"
              examples:
                add user:
                  $ref: "#/components/examples/addUser"
