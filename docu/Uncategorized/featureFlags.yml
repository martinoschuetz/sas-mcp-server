  /featureSets:
    post:
      tags:
      - Management
      summary: Upload feature definition set
      description: Primary method of "uploading" feature definitions, this will be
        used by the service "bootstrap" mechanism both to add new features and to
        delete no longer referenced features. This will be restricted to services,
        and the admin user. Note that if the feature definition exists, it normally
        will be silently ignored.  In order to update an existing definition, supply
        a definition with a larger 'revision'. Note that existing definitions can
        be deleted by filling in the 'deleteFeatureIds' list. Release toggles are
        normally not installed at customer sites, and so typically do not need to
        be deleted. Exception, if the release toggle is shipped with "defaultValue"=="true".
        A feature set is a synthetic object (there is no "get").  This will result
        in deletion/creation/update as appropriate.  After a short delay (this is
        an asynchronous object), any changes can be seen via "GET /features".
      operationId: addFeatures
      requestBody:
        $ref: "#/components/requestBodies/featuresUploadSet"
      responses:
        "200":
          description: OK. Validation has passed and the feature upload has completed.
          content:
            application/vnd.sas.feature.flag.definition.set+json:
              schema:
                $ref: "#/components/schemas/featuresUploadSet"
              examples:
                response creating a new feature flag:
                  $ref: "#/components/examples/upload1Response"
            application/json:
              schema:
                $ref: "#/components/schemas/featuresUploadSet"
              examples:
                response creating a new feature flag:
                  $ref: "#/components/examples/upload1Response"
        "202":
          description: Accepted. Validation has passed and the feature upload will
            proceed.
          content:
            application/vnd.sas.feature.flag.definition.set+json:
              schema:
                $ref: "#/components/schemas/featuresUploadSet"
              examples:
                timeout example (but validation passes), asynchronous processing:
                  $ref: "#/components/examples/upload1ResponseTimeout"
            application/json:
              schema:
                $ref: "#/components/schemas/featuresUploadSet"
              examples:
                timeout example (but validation passes), asynchronous processing:
                  $ref: "#/components/examples/upload1ResponseTimeout"
        "400":
          description: Bad Request.  Validation failure.  This will be static analysis,
            not a conflict with the current state of features.  For example, omitting
            a required parameter, or providing an invalid value of a parameter.
          content:
            application/vnd.sas.feature.flag.definition.set+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                validation failure:
                  $ref: "#/components/examples/uploadValidationFailure"
                validation failure not well formed json:
                  $ref: "#/components/examples/uploadValidationFailureNotJSON"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                validation failure:
                  $ref: "#/components/examples/uploadValidationFailure"
                validation failure not well formed json:
                  $ref: "#/components/examples/uploadValidationFailureNotJSON"
