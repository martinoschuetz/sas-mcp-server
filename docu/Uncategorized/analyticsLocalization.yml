---
openapi: 3.0.3
info:
  description: A localization API for Common Analytics Solutions
  version: "1"
  title: Analytics Localization
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: "https://support.sas.com/techsup/license/index.html"
servers:
- url: "http://example.com/analyticsLocalization"
  description: mock server
tags:
- name: Localization Context
  description: The operations for a localization context resource.
- name: Root
  description: Analytics Localization API.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the API object
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      responses:
        "200":
          description: OK
          headers: {}
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationGetRequest200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationGetRequest200Response"
  /contexts:
    get:
      tags:
      - Localization Context
      summary: Get Localization Contexts
      description: Returns a list of Localization Contexts matching the specified
        criteria.
      operationId: getLocalizationContexts
      parameters:
      - name: start
        in: query
        description: Offset of first item to retrieve (0-based). Defaults to 0
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of items to retrieve. Defaults to 30
        required: false
        schema:
          type: integer
          default: 30
          format: int32
      - name: sortBy
        in: query
        description: "Sort criteria for retrieved items. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/analyticsLocalization-v1/docs/getting-started/usage-notes#sorting)"
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: "Filter criteria for retrieved items. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/analyticsLocalization-v1/docs/getting-started/usage-notes#filtering)"
        required: false
        schema:
          type: string
      - name: Accept-Item
        in: header
        description: Requested media type for collection items.
        required: false
        schema:
          type: string
          default: application/vnd.sas.summary+json
          enum:
          - application/vnd.sas.summary+json
          - application/vnd.sas.analytics.localization.context+json
          - application/vnd.sas.analytics.localization.context.summary+json
      responses:
        "200":
          description: Success
          headers: {}
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/localizationContextCollection"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationContextsGetRequest200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/localizationContextCollection"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationContextsGetRequest200Response"
        "404":
          description: The context was not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationGetRequest404Response"
  "/contexts/{localizationContextId}":
    head:
      tags:
      - Localization Context
      summary: Check if a Localization Context by ID exists
      description: Checks for the existence of a Localization Context matching the
        specified ID without returning the body.
      operationId: headersForLocalizationContext
      parameters:
      - name: localizationContextId
        in: path
        description: The localization context ID.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Context exists
          headers:
            ETag:
              description: E-Tag for the existing context
              schema:
                type: string
            Last-Modified:
              description: The time at which the context was last updated.
              schema:
                type: string
        "404":
          description: Not Found
    get:
      tags:
      - Localization Context
      summary: Get a Localization Context by ID
      description: Returns a Localization Context matching the specified ID.
      operationId: getLocalizationContext
      parameters:
      - name: localizationContextId
        in: path
        description: The localization context ID.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
            Last-Modified:
              description: The time at which the flow was last updated.
              schema:
                type: string
          content:
            "application/vnd.sas.analytics.localization.context+json":
              schema:
                $ref: "#/components/schemas/localizationContext"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationContextsGetByIdRequest200Response"
            "application/json":
              schema:
                $ref: "#/components/schemas/localizationContext"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationContextsGetByIdRequest200Response"
        "404":
          description: Not Found
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationContextsGetByIdRequest200Response"
    put:
      tags:
      - Localization Context
      summary: Create or update a Localization Context
      description: Creates or updates a Localization Context.  Must include an explicit
        ID.
      operationId: updateLocalizationContext
      parameters:
      - name: localizationContextId
        in: path
        description: The localization context ID.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: Update the scope resource only if the resources current ETag
          header matches this value
        schema:
          type: string
      - name: parentFolderUri
        in: query
        description: "Parent folder URI which is a non-absolute URI (e.g., a URI that\
          \ does not specify a scheme)."
        required: false
        schema:
          type: string
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/localizationContext"
            examples:
              json:
                $ref: "#/components/examples/creationRequest"
          "application/vnd.sas.analytics.localization.context+json":
            schema:
              $ref: "#/components/schemas/localizationContext"
            examples:
              json:
                $ref: "#/components/examples/creationRequest"
      responses:
        "200":
          description: Success
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/localizationContext"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationContextPUTByIdRequest200Response"
            application/vnd.sas.analytics.localization.context+json:
              schema:
                $ref: "#/components/schemas/localizationContext"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationContextPUTByIdRequest200Response"
        "400":
          description: Invalid request body
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationContextPUTByIdRequest400Response"
        "412":
          description: Precondition Failed
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationContextPUTByIdRequest412Response"
        "428":
          description: Precondition Required
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationContextPUTByIdRequest428Response"
    delete:
      tags:
      - Localization Context
      summary: Delete a Localization Context
      description: Delete a Localization Context
      operationId: deleteLocalizationContext
      parameters:
      - name: localizationContextId
        in: path
        description: The localization context ID.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Success
        "404":
          description: The context was not found
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsLocalizationContextDeleteById404Response"
components:
  schemas:
    localeDetail:
      type: object
      properties:
        baseNameValues:
          type: object
          description: A set of name/value pairs for a baseName and its localized
            translation.
          additionalProperties:
            type: string
        localeName:
          type: string
          description: 'A tag for identifying the language of the set of translations
            (See IETF BCP 47 "Tags for Identifying Languages")'
          maximum: 255
      description: A set of translations for a single locale in this context
    localizationContext:
      description: A set of localized baseNames across several locales.
      type: object
      properties:
        createdBy:
          type: string
          description: userid of the user who created the resource
        creationTimeStamp:
          type: string
          format: date-time
          description: creation time of the resource
        description:
          type: string
          description: user-provided description of the resource
          maximum: 500
        id:
          type: string
          description: system-assigned ID of the resource
          maximum: 255
        links:
          type: array
          description: The links that apply to the resource
          items:
            $ref: "#/components/schemas/link"
        localeDetails:
          type: array
          description: The set of translations in all available locales
          items:
            $ref: "#/components/schemas/localeDetail"
        modifiedBy:
          type: string
          description: The userid of the user who last updated the resource
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The time of the last update of the resource
        name:
          type: string
          description: User-specified name of the resource
          maximum: 100
        revision:
          type: integer
          format: int64
          description: The revision number of this resource object.
          minimum: 0
        version:
          type: integer
          format: int32
          description: The version number of this representation schema.
          minimum: 0
    localizationContextCollection:
      title: Localization Context Collection
      description: A collection Localization Context representations
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/localizationContext"
            description: An array of `application/vnd.sas.analytics.localization.context+json`
              representations.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
