---
openapi: 3.0.3
info:
  title: Accounting Rules
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: The Accounting Rules API provides support to financial and demand planning.
  version: "1"
tags:
- name: Root
  description: The operations for the root resource.
- name: Manual Adjustment
  description: The operations for the manual adjustment resource.
- name: Scope Rule Properties
  description: The operations for the scope rule properties resource.
- name: Rule
  description: The operations for the rule resource.
- name: Partial Ownership
  description: The operations for the partial ownership resources.
- name: Manual Adjustment Workflow
  description: The operations for manual adjustment workflow (approvers, approval,
    rejection, recall).
paths:
  /:
    get:
      summary: Get the links for the API
      description: |
        Returns the links to the top-level resources for the API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/root"
              examples:
                json:
                  $ref: "#/components/examples/getAccountingRulesRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/root"
              examples:
                json:
                  $ref: "#/components/examples/getAccountingRulesRootResponse"
  /manualAdjustments/{manualAdjustmentId}:
    get:
      summary: Get a manual adjustment by manual adjustment ID
      description: |
        Returns the representation of the specified manual adjustment.
      operationId: getManualAdjustment
      tags:
      - Manual Adjustment
      parameters:
      - name: manualAdjustmentId
        in: path
        description: manual adjustment ID.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            ETag:
              description: The entity tag for the manual adjustment.
              schema:
                type: string
          content:
            application/vnd.sas.accounting.rules.manual.adjustment+json:
              schema:
                $ref: "#/components/schemas/manualAdjustment"
              examples:
                json:
                  $ref: "#/components/examples/getManualAdjustmentResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/manualAdjustment"
              examples:
                json:
                  $ref: "#/components/examples/getManualAdjustmentResponse"
        "404":
          description: No manual adjustment exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getManualAdjustmentErrorResponse404"
    head:
      summary: Get the headers for a manual adjustment
      description: |
        Returns the headers for the specified manual adjustment. Also used to determine whether a particular manual adjustment exists.
      operationId: headersForManualAdjustment
      tags:
      - Manual Adjustment
      parameters:
      - name: manualAdjustmentId
        in: path
        description: manual adjustment ID.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            ETag:
              description: The entity tag for the manual adjustment.
              schema:
                type: string
        "404":
          description: No manual adjustment exists at the requested path.
          headers:
            Content-Type:
              schema:
                type: string
            ETag:
              description: The entity tag for the error.
              schema:
                type: string
    delete:
      summary: Delete a manual adjustment
      description: |
        Delete the specified manual adjustment.
      operationId: deleteManualAdjustment
      tags:
      - Manual Adjustment
      parameters:
      - name: manualAdjustmentId
        in: path
        description: manual adjustment ID.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "204":
          description: The manual adjustment was successfully deleted.
        "404":
          description: No manual adjustment exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getManualAdjustmentErrorResponse404"
    put:
      summary: Update a manual adjustment
      description: |
        Updates the specified manual adjustment based on the representation in the request body.
      operationId: updateManualAdjustment
      tags:
      - Manual Adjustment
      parameters:
      - $ref: "#/components/parameters/ifMatch"
      - name: manualAdjustmentId
        in: path
        description: manual adjustment ID.
        required: true
        schema:
          type: string
          format: object-id
      requestBody:
        content:
          application/vnd.sas.accounting.rules.manual.adjustment+json:
            schema:
              $ref: "#/components/schemas/updateManualAdjustment"
            examples:
              json:
                $ref: "#/components/examples/putManualAdjustmentRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/updateManualAdjustment"
            examples:
              json:
                $ref: "#/components/examples/putManualAdjustmentRequest"
        description: |
          The manual adjustment representation object, with just the fields required for an update/PUT.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            ETag:
              description: The entity tag for the manual adjustment.
              schema:
                type: string
          content:
            application/vnd.sas.accounting.rules.manual.adjustment+json:
              schema:
                $ref: "#/components/schemas/manualAdjustment"
              examples:
                json:
                  $ref: "#/components/examples/putManualAdjustmentResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/manualAdjustment"
              examples:
                json:
                  $ref: "#/components/examples/putManualAdjustmentResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putManualAdjustmentErrorResponse400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putManualAdjustmentErrorResponse400"
        "404":
          description: No manual adjustment exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getManualAdjustmentErrorResponse404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getManualAdjustmentErrorResponse404"
        "412":
          description: |
            The 'If-Match' request header did not match the entity tag of the resource.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putManualAdjustmentErrorResponse412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putManualAdjustmentErrorResponse412"
        "428":
          description: |
            The request headers did not include an If-Match precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putManualAdjustmentErrorResponse428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putManualAdjustmentErrorResponse428"
    post:
      summary: Copy a manual adjustment to a target scope, analysis member IDs and
        time member IDs
      description: |
        Copies one manual adjustment to a target scope, analysis member IDs and time member IDs.  The request body object `application/vnd.sas.accounting.rules.manual.adjustment.copy.request+json`
        allows for multiple analysis and time member IDs.  Analysis and Time members IDs are treated as associative pairs.  Accordingly, must contain the same number of elements.  For each pair
        of analysis and time members IDs, a new target manual adjustment is created.
      operationId: copyManualAdjustment
      tags:
      - Manual Adjustment
      parameters:
      - name: manualAdjustmentId
        in: path
        description: manual adjustment ID.
        required: true
        schema:
          type: string
          format: object-id
      requestBody:
        content:
          application/vnd.sas.accounting.rules.manual.adjustment.copy.request+json:
            schema:
              $ref: "#/components/schemas/manualAdjustmentCopyRequest"
            examples:
              json:
                $ref: "#/components/examples/copyManualAdjustmentRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/manualAdjustmentCopyRequest"
            examples:
              json:
                $ref: "#/components/examples/copyManualAdjustmentRequest"
        description: |
          The manual adjustment copy request representation object.
        required: true
      responses:
        "201":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Location:
              description: The URI of the newly-created manual adjustment.
              schema:
                type: string
            ETag:
              description: The entity tag for the manual adjustment.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/manualAdjustmentCollection"
              examples:
                json:
                  $ref: "#/components/examples/copyManualAdjustmentResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/manualAdjustmentCollection"
              examples:
                json:
                  $ref: "#/components/examples/copyManualAdjustmentResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/scopeNotFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/scopeNotFoundErrorResponse"
  /scopes/{scopeId}/manualAdjustments:
    get:
      summary: Get a collection of manual adjustments by scope ID
      description: |
        Returns a collection of manual adjustments by scope ID. The items in the collection use the `application/vnd.sas.accounting.rules.manual.adjustment` media type.
      operationId: getManualAdjustmentsByScope
      tags:
      - Manual Adjustment
      parameters:
      - name: scopeId
        in: path
        description: Scope ID.
        required: true
        schema:
          type: string
          format: object-id
      - name: start
        in: query
        description: Offset of the first scope rule properties to return. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: |
          Positive integer (int32, greater or equal to 0). Maximum number of scope rule properties to return in this page of results. The actual number of
          returned properties may be less if the collection has been exhausted. Defaults to 2147483647.
        schema:
          type: integer
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            ETag:
              description: The entity tag for the manual adjustment.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/manualAdjustmentCollection"
              examples:
                json:
                  $ref: "#/components/examples/getManualAdjustmentCollectionResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/manualAdjustmentCollection"
              examples:
                json:
                  $ref: "#/components/examples/getManualAdjustmentCollectionResponse"
        "404":
          description: Scope ID cannot be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/scopeNotFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/scopeNotFoundErrorResponse"
    head:
      summary: Get the headers for a collection of manual adjustments by scope ID
      description: |
        Retrieve the headers and check the availability of manual adjustments by scope ID.
      operationId: headersForManualAdjustmentByScope
      tags:
      - Manual Adjustment
      parameters:
      - name: scopeId
        in: path
        description: Scope ID.
        required: true
        schema:
          type: string
          format: object-id
      - name: start
        in: query
        description: Offset of the first scope rule properties to return. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: |
          Positive integer (int32, greater or equal to 0). Maximum number of scope rule properties to return in this page of results. The actual number of
          returned properties may be less if the collection has been exhausted. Defaults to 2147483647.
        schema:
          type: integer
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            ETag:
              description: The entity tag for the manual adjustment collection
              schema:
                type: string
        "404":
          description: Scope ID cannot be found.
          headers:
            Content-Type:
              schema:
                type: string
    post:
      summary: Create a new manual adjustment
      description: |
        Create a new manual adjustment based on the representation in the request body.
      operationId: createManualAdjustment
      tags:
      - Manual Adjustment
      parameters:
      - name: scopeId
        in: path
        description: Scope ID.
        required: true
        schema:
          type: string
          format: object-id
      requestBody:
        content:
          application/vnd.sas.accounting.rules.manual.adjustment+json:
            schema:
              $ref: "#/components/schemas/createManualAdjustment"
            examples:
              json:
                $ref: "#/components/examples/createManualAdjustmentRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/createManualAdjustment"
            examples:
              json:
                $ref: "#/components/examples/createManualAdjustmentRequest"
        description: |
          The manual adjustment representation object, with just the fields required for a create/POST.
        required: true
      responses:
        "201":
          description: A manual adjustment was created.
          headers:
            Location:
              description: The URI of the newly-created manual adjustment.
              schema:
                type: string
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            ETag:
              description: The entity tag for the manual adjustment.
              schema:
                type: string
          content:
            application/vnd.sas.accounting.rules.manual.adjustment+json:
              schema:
                $ref: "#/components/schemas/manualAdjustment"
              examples:
                json:
                  $ref: "#/components/examples/createManualAdjustmentResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/manualAdjustment"
              examples:
                json:
                  $ref: "#/components/examples/createManualAdjustmentResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/createManualAdjustmentErrorResponse400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/createManualAdjustmentErrorResponse400"
        "409":
          description: If the name supplied in the body of the manual adjustment object
            already exists within the scope, time and analysis, a ConflictException
            will be returned.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/createManualAdjustmentErrorResponse409"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/createManualAdjustmentErrorResponse409"
