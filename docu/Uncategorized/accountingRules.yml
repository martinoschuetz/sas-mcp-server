    manualAdjustmentWorkflowRequest:
      title: Manual Adjustment Workflow Request
      description: The request body for assigning an approver to a manual adjustment.
      type: object
      required:
      - approverUserId
      properties:
        approverUserId:
          type: string
          description: The user ID of the approver to assign.
          example: "john.approver@company.com"
        comment:
          type: string
          description: An optional comment for the assignment.
          example: "Assigning primary approver for Q1 adjustments"
        approvalOrder:
          type: integer
          description: The order in which this approver should approve (1-based).
          example: 1
    manualAdjustmentWorkflow:
      title: Manual Adjustment Workflow
      description: Represents an approver assignment on a manual adjustment.
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the workflow assignment.
        manualAdjustmentId:
          type: string
          description: The ID of the manual adjustment this approver is assigned to.
        approverUserId:
          type: string
          description: The user ID of the assigned approver.
        requesterUserId:
          type: string
          description: The user ID of the person who requested the assignment.
        approvalStatus:
          type: string
          description: The current approval status of this approver.
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        approvalOrder:
          type: integer
          description: The order in which this approver should approve.
        comment:
          type: string
          description: A comment associated with the assignment or approval action.
        createdDateTime:
          type: string
          format: date-time
          description: The timestamp when the workflow assignment was created.
        modifiedDateTime:
          type: string
          format: date-time
          description: The timestamp when the workflow assignment was last modified.
        version:
          type: integer
          description: The version number of the resource.
        links:
          type: array
          description: The links that apply to this resource.
          items:
            $ref: "#/components/schemas/link"
    manualAdjustmentWorkflowCollection:
      title: Manual Adjustment Workflow Collection
      description: A collection of manual adjustment workflow (approver) representations.
      type: object
      properties:
        name:
          type: string
          description: The name of the collection.
        accept:
          type: string
          description: The media type of the items in the collection.
        count:
          type: integer
          description: The total number of items in the collection.
        items:
          type: array
          description: The array of approver workflow representations.
          items:
            $ref: "#/components/schemas/manualAdjustmentWorkflow"
        links:
          type: array
          description: The links that apply to this collection.
          items:
            $ref: "#/components/schemas/link"
    batchAssignApproverRequest:
      title: Batch Assign Approver Request
      description: The request body for assigning approvers to multiple manual adjustments
        in a single batch. All existing approvers on each manual adjustment are replaced.
      type: object
      required:
      - approvers
      - manualAdjustmentIds
      properties:
        approvers:
          type: array
          description: The list of approvers to assign.
          items:
            type: object
            required:
            - approverUserId
            properties:
              approverUserId:
                type: string
                description: The user ID of the approver.
                example: "john.approver@company.com"
              comment:
                type: string
                description: An optional comment for the assignment.
                example: "Primary approver for Q1"
              approvalOrder:
                type: integer
                description: The order in which this approver should approve.
                example: 1
        manualAdjustmentIds:
          type: array
          description: The IDs of the manual adjustments to assign approvers to.
          items:
            type: string
          example: ["1453", "1454", "1455"]
    sendForApprovalBatchRequest:
      title: Send For Approval Batch Request
      description: The request body for sending multiple manual adjustments for approval.
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: The IDs of the manual adjustments to send for approval.
          items:
            type: string
          example: ["1453", "1454", "1455"]
        comment:
          type: string
          description: An optional comment for the submission.
          example: "Sending Q1 manual adjustments for review"
    recallBatchRequest:
      title: Recall Batch Request
      description: The request body for recalling multiple manual adjustments from
        approval. Each recalled adjustment is moved back to DRAFT state, its approvers
        are removed, and requiresApproval is set to false.
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: The IDs of the manual adjustments to recall.
          items:
            type: string
          example: ["1453", "1454", "1455"]
        comment:
          type: string
          description: An optional comment for the recall.
          example: "Need to update line item values before approval"
        notifyApprovers:
          type: boolean
          description: Whether to notify the approvers about the recall.
          example: true
    approveBatchRequest:
      title: Approve Batch Request
      description: The request body for approving multiple manual adjustments in a
        batch. If all approvers have approved, the workflow state becomes APPROVED.
        If some are still pending, it becomes PARTIALLY_APPROVED.
      type: object
      required:
      - items
      - approverUserId
      properties:
        items:
          type: array
          description: The IDs of the manual adjustments to approve.
          items:
            type: string
          example: ["1453", "1454", "1455"]
        approverUserId:
          type: string
          description: The user ID of the approver performing the approval.
          example: "john.approver@company.com"
        comment:
          type: string
          description: An optional comment for the approval.
          example: "Reviewed and approved for Q1 closing"
    rejectBatchRequest:
      title: Reject Batch Request
      description: The request body for rejecting multiple manual adjustments in a
        batch. A single rejection moves the workflow state to REJECTED.
      type: object
      required:
      - items
      - approverUserId
      properties:
        items:
          type: array
          description: The IDs of the manual adjustments to reject.
          items:
            type: string
          example: ["1453", "1454"]
        approverUserId:
          type: string
          description: The user ID of the approver performing the rejection.
          example: "john.approver@company.com"
        comment:
          type: string
          description: An optional comment for the rejection.
          example: "Values need correction"
        reason:
          type: string
          description: The reason for rejection.
          example: "Line item amounts do not match supporting documentation"
