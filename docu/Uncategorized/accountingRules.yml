  /manualAdjustments/setPostingStatus:
    post:
      summary: Update the `posting status` of a selection of manual adjustments
      description: |
        Returns a collection of manual adjustments whose `posting status` has been updated. The items in the collection use the `application/vnd.sas.accounting.rules.manual.adjustment` media type.

        The request body `application/vnd.sas.selection` should contain a list of string manual adjustment IDs whose `posting status` is to be updated.

        The caller must include on the URI, the required `includeInPosting` boolean parameter.
      operationId: setPostingStatus
      tags:
      - Manual Adjustment
      parameters:
      - name: includeInPosting
        in: query
        required: true
        description: To include the designated manual adjustments in postings
        schema:
          type: boolean
      requestBody:
        description: The manual adjustment representation object.
        required: true
        content:
          application/vnd.sas.selection+json:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
              json:
                $ref: "#/components/examples/setPostingStatusRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
