    webhookCallbackContentType:
      title: Callback Content Type
      description: Details about the callback content type. This represents application/vnd.sas.webhook.callback.content.type
        media type (version 1).
      x-sas-media-type:
        name: application/vnd.sas.webhook.callback.content.type
        version: 1
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: Name of the callback content type.
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
    condition:
      title: Condition
      description: Condition that need to be matched for this webhook to callback.
        This doesn't represent any top-level media type.
      required:
      - callbackContentType
      - callbackContentFilter
      type: object
      properties:
        callbackContentType:
          type: string
          enum:
          - application/vnd.sas.webhook.callback.validate
          - application/vnd.sas.webhook.callback.publish
          description: Type of the callback content.
        callbackContentFilter:
          type: string
          description: Filter that should be matched on the webhook callback content.
            The string follows the same syntax as [Filtering in REST APIs](https://developer.sas.com/rest-apis/webhooks-v1/docs/getting-started/usage-notes#filtering).
    callback:
      title: Callback
      description: Callback to which webhook will be called when a specified event
        occurs. This doesn't represent any top-level media type.
      required:
      - uri
      type: object
      properties:
        uri:
          type: string
          format: uri
          description: Callback uri that will be called when a specified event occurs.
    webhook:
      title: Webhook
      description: Webhooks are "user-defined HTTP callbacks". This represents application/vnd.sas.webhook
        media type (version 1).
      x-sas-media-type:
        name: application/vnd.sas.webhook
        version: 1
      required:
      - name
      - conditions
      - callbacks
      type: object
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object
        name:
          type: string
          description: The Webhook name
        description:
          type: string
          description: The Webhook description
        createdBy:
          type: string
          description: The user who created the Webhook.
        creationTimeStamp:
          type: string
          format: date-time
          description: The date and time that the Webhook was created.
        modifiedBy:
          type: string
          description: The userId of the authenticated user who last updated the Webhook.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The date and time that the Webhook was last modified.
        active:
          type: boolean
          description: Specifies whether or not this webhook is active.
        condition:
          $ref: "#/components/schemas/condition"
        conditions:
          type: array
          description: Any condition that should be matched for the webhook to callback.
          items:
            $ref: "#/components/schemas/condition"
        callback:
          $ref: "#/components/schemas/callback"
        callbacks:
          type: array
          description: Callbacks that are called by webhook when any of the condition
            is matched.
          items:
            $ref: "#/components/schemas/callback"
        properties:
          type: object
          description: A set of properties for this webhook.
          additionalProperties:
            type: string
        links:
          type: array
          description: Zero or more links to related resources or operations.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
