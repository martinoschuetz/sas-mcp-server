              schema:
                type: string
              example: Tue, 02 Feb 2021 12:07:45 GMT
          content:
            application/vnd.sas.webhook+json:
              schema:
                $ref: "#/components/schemas/webhook"
              examples:
                validate:
                  $ref: "#/components/examples/webhookFullValidate"
                publish:
                  $ref: "#/components/examples/webhookFullPublish"
            application/json:
              schema:
                $ref: "#/components/schemas/webhook"
              examples:
                validate:
                  $ref: "#/components/examples/webhookFullValidate"
                publish:
                  $ref: "#/components/examples/webhookFullPublish"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidBody:
                  $ref: "#/components/examples/webhookInvalid"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidBody:
                  $ref: "#/components/examples/webhookInvalid"
        "404":
          description: No webhook exists at the requested path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/webhookNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/webhookNotFound"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                preConditionFailed:
                  $ref: "#/components/examples/webhookPreConditionFailed"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                preConditionFailed:
                  $ref: "#/components/examples/webhookPreConditionFailed"
        "428":
          description: The request headers did not include a `If-Match` precondition.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                preConditionRequired:
                  $ref: "#/components/examples/webhookPreConditionRequired"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                preConditionRequired:
                  $ref: "#/components/examples/webhookPreConditionRequired"
    delete:
      tags:
      - Crud
      summary: Delete a webhook
      description: Deletes the specified webhook.
      operationId: deleteWebhook
      parameters:
      - name: webhookId
        description: The unique identifier for the webhook.
        in: path
        required: true
        schema:
          type: string
        example: 3b4998e5-bac3-4a60-af24-61f63912fbf0
      responses:
        "204":
          description: The webhook was deleted.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
        "404":
          description: No webhook exists at the requested path.
          headers:
