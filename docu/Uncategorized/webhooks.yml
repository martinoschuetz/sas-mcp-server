---
openapi: 3.0.3
info:
  version: "1"
  title: Webhooks
  description: The Webhooks API is used for creating and maintaining webhooks.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  license:
    name: SAS Institute
    url: https://support.sas.com/techsup/license/index.html
servers:
- url: https://example.com/webhooks
  description: Example of base URL
externalDocs:
  description: Developer documentation
  url: https://developer.sas.com
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Crud
  description: Contains operations to create, read, update, and delete webhooks.
- name: Callbacks
  description: Contains operations related to webhook callbacks.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
  /callbackContentTypes:
    get:
      tags:
      - Callbacks
      summary: Get a collection of the webhook callback content types
      description: Returns a list of the webhook callback content types.
      operationId: getWebhookCallbackContentTypes
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/webhookCallbackContentTypeCollection"
              examples:
                all:
                  $ref: "#/components/examples/webhookCallbackContentTypes"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/webhookCallbackContentTypeCollection"
              examples:
                all:
                  $ref: "#/components/examples/webhookCallbackContentTypes"
  /webhooks:
    get:
      tags:
      - Crud
      summary: Get a collection of the webhooks
      description: Returns a list of the webhooks based on the specified pagination,
        filtering, and sorting options. The items in the list depend on the `Accept-Item`
        header.
      operationId: getWebhooks
      parameters:
      - name: Accept-Item
        description: Used for selecting the desired item representation.
        in: header
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.webhook+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.summary+json
        example: application/vnd.sas.webhook+json
      - name: start
        description: Returns the index of the first webhook.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
        example: 100
      - name: limit
        description: Returns the maximum number of webhooks.
        in: query
        schema:
          type: integer
          format: int32
          default: 20
        example: 500
      - name: filter
        in: query
        description: The criteria used for filtering the webhooks. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/webhooks-v1/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: filter-criteria
        example: contains(name, 'validate')
      - name: sortBy
        in: query
        description: The criteria used for sorting the webhooks. See [Sorting in REST
          APIs](https://developer.sas.com/rest-apis/webhooks-v1/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
        example: name:descending
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/webhookCollection"
                - $ref: "#/components/schemas/resourceSummaryCollection"
              examples:
                summary:
                  $ref: "#/components/examples/webhooksSummary"
                full:
                  $ref: "#/components/examples/webhooksFull"
            application/vnd.sas.collection+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/webhookCollection"
                - $ref: "#/components/schemas/resourceSummaryCollection"
              examples:
                summary:
                  $ref: "#/components/examples/webhooksSummary"
                full:
                  $ref: "#/components/examples/webhooksFull"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidStart:
                  $ref: "#/components/examples/webhooksInvalidStart"
                invalidLimit:
                  $ref: "#/components/examples/webhooksInvalidLimit"
                invalidSortBy:
                  $ref: "#/components/examples/webhooksInvalidSortBy"
                invalidFilter:
                  $ref: "#/components/examples/webhooksInvalidFilter"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidStart:
                  $ref: "#/components/examples/webhooksInvalidStart"
                invalidLimit:
                  $ref: "#/components/examples/webhooksInvalidLimit"
                invalidSortBy:
                  $ref: "#/components/examples/webhooksInvalidSortBy"
                invalidFilter:
                  $ref: "#/components/examples/webhooksInvalidFilter"
    post:
      tags:
      - Crud
      summary: Create a new webhook
      description: Creates a new webhook based on the representation in the request
        body.
      operationId: createWebhook
      requestBody:
        content:
          application/vnd.sas.webhook+json:
            schema:
              $ref: "#/components/schemas/webhook"
            examples:
              validate:
                $ref: "#/components/examples/webhookCreateValidate"
              publish:
                $ref: "#/components/examples/webhookCreatePublish"
          application/json:
            schema:
              $ref: "#/components/schemas/webhook"
            examples:
              validate:
                $ref: "#/components/examples/webhookCreateValidate"
              publish:
                $ref: "#/components/examples/webhookCreatePublish"
      responses:
        "201":
          description: A webhook was created.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Location:
              description: The URL of the webhook.
              schema:
                type: string
              example: /webhooks/webhooks/3b4998e5-bac3-4a60-af24-61f63912fbf0
            ETag:
              description: The entity tag for the webhook.
              schema:
                type: string
              example: '"kknyjgku"'
            Last-Modified:
              description: The timestamp when the webhook was last modified. The timestamp
                is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
              example: Tue, 02 Feb 2021 12:07:45 GMT
          content:
            application/vnd.sas.webhook+json:
              schema:
                $ref: "#/components/schemas/webhook"
              examples:
                validate:
                  $ref: "#/components/examples/webhookFullValidate"
                publish:
                  $ref: "#/components/examples/webhookFullPublish"
            application/json:
              schema:
                $ref: "#/components/schemas/webhook"
              examples:
                validate:
                  $ref: "#/components/examples/webhookFullValidate"
                publish:
                  $ref: "#/components/examples/webhookFullPublish"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidBody:
                  $ref: "#/components/examples/webhookInvalid"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidBody:
                  $ref: "#/components/examples/webhookInvalid"
  /webhooks/{webhookId}:
    get:
      tags:
      - Crud
      summary: Get a webhook
      description: Returns the representation of the specified webhook.
      operationId: getWebhook
      parameters:
      - name: webhookId
        description: The unique identifier for the webhook.
        in: path
        required: true
        schema:
          type: string
        example: 3b4998e5-bac3-4a60-af24-61f63912fbf0
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            ETag:
              description: The entity tag for the webhook.
              schema:
                type: string
              example: '"kknyjgku"'
            Last-Modified:
              description: The timestamp when the webhook was last modified. The timestamp
                is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
              example: Tue, 02 Feb 2021 12:07:45 GMT
          content:
            application/vnd.sas.webhook+json:
              schema:
                $ref: "#/components/schemas/webhook"
              examples:
                validate:
                  $ref: "#/components/examples/webhookFullValidate"
                publish:
                  $ref: "#/components/examples/webhookFullPublish"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                validate:
                  $ref: "#/components/examples/webhookSummaryValidate"
                publish:
                  $ref: "#/components/examples/webhookSummaryPublish"
            application/json:
              schema:
                $ref: "#/components/schemas/webhook"
              examples:
                validate:
                  $ref: "#/components/examples/webhookFullValidate"
                publish:
                  $ref: "#/components/examples/webhookFullPublish"
        "404":
          description: No webhook exists at the requested path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/webhookNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/webhookNotFound"
    put:
      tags:
      - Crud
      summary: Update a webhook
      description: Updates the specified webhook based on the representation in the
        request body.
      operationId: updateWebhook
      parameters:
      - name: webhookId
        description: The unique identifier for the webhook.
        in: path
        required: true
        schema:
          type: string
        example: 3b4998e5-bac3-4a60-af24-61f63912fbf0
      - name: If-Match
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the webhook.
        in: header
        required: true
        schema:
          type: string
        example: '"kknyjgku"'
      requestBody:
        content:
          application/vnd.sas.webhook+json:
            schema:
              $ref: "#/components/schemas/webhook"
            examples:
              validate:
                $ref: "#/components/examples/webhookCreateValidate"
              publish:
                $ref: "#/components/examples/webhookCreatePublish"
          application/json:
            schema:
              $ref: "#/components/schemas/webhook"
            examples:
              validate:
                $ref: "#/components/examples/webhookCreateValidate"
              publish:
                $ref: "#/components/examples/webhookCreatePublish"
        description: The representation of a webhook.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Etag:
              description: The entity tag for the webhook.
              schema:
                type: string
              example: '"kknyjgku"'
            Last-Modified:
              description: The timestamp when the webhook was last modified. The timestamp
