    post:
      summary: Create a purchase order plan using planned quantities XML file
      description: 'Create a new purchase order plan based on the planned quantities
        XML file supported in previous versions of pack optimization. The XML file
        content can be added in the request body along with additional parameters
        to create a purchase order plan.

        '
      operationId: createPurchaseOrderFromImport
      tags:
      - Purchase Order Plans
      requestBody:
        content:
          application/vnd.sas.retail.pack.optimization.purchase.order.import+xml:
            schema:
              $ref: '#/components/schemas/purchaseOrderImport'
          application/xml:
            schema:
              $ref: '#/components/schemas/purchaseOrderImport'
        description: 'This resource is based on the schema of planned quantities XML
          file which was supported in previous versions of pack optimization. Some
          additional parameters have also been added.

          '
        required: true
      responses:
        '201':
          description: The purchase order plan was created.
          headers:
            Location:
              description: The URI of the newly created plan.
              schema:
                type: string
            Etag:
              description: The entity tag for the plan.
              schema:
                type: string
          content:
            application/vnd.sas.retail.pack.optimization.purchase.order.summary+json:
              schema:
                $ref: '#/components/schemas/purchaseOrderSummary'
            application/json:
              schema:
                $ref: '#/components/schemas/purchaseOrderSummary'
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.retail.pack.optimization.purchase.order.summary+json:
              schema:
                $ref: '#/components/schemas/error2'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
        '409':
          description: Conflict. If the name supplied in the request body already
            exists, a ConflictException is returned.
          content:
