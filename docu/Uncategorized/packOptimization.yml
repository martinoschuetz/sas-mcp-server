        locked:
          type: boolean
          description: If locked, the plan cannot be modified, deleted, optimized,
            or loaded.
        packSetting:
          $ref: '#/components/schemas/packSetting'
        requestSetting:
          $ref: '#/components/schemas/requestSetting'
        version:
          type: integer
          format: int32
          description: The version number of the representation. This representation
            is version 1.
        links:
          type: array
          description: The links that apply to the resource.
          items:
            $ref: '#/components/schemas/link'
    requestSetting:
      title: Properties related to request settings.
      x-sas-media-type:
        name: application/vnd.sas.retail.pack.optimization.purchase.order.request.setting
        version: 1
      required:
      - mismatchPenaltyOver
      - mismatchPenaltyUnder
      properties:
        mismatchPenaltyOver:
          type: boolean
          description: The cost per unit that is assigned to overallocating the sizes
            in a buy or delivery to a store. It allows values for Initial penalty,
            Change per delivery, and Final penalty to be configured.
        overInitialPenalty:
          type: number
          format: double
          description: Initial penalty if the sizes in a buy or delivery to a store
            are overallocated. This setting is available only when mismatchPenaltyOver
            is true.
        overFinalPenalty:
          type: number
          format: double
          description: Final penalty if the sizes in a buy or delivery to a store
            are overallocated. This setting is available only when mismatchPenaltyOver
            is true.
        overChangePenalty:
          type: number
          format: double
          description: Incremental penalty cost for each delivery if the sizes in
            a buy or delivery to a store is overallocated. This setting is available
            only when mismatchPenaltyOver is true.
        mismatchPenaltyUnder:
          type: boolean
          description: The cost per unit that is assigned to underallocating the sizes
            in a buy or delivery to a store. It allows values for Initial penalty,
            Change per delivery, and Final penalty to be configured.
        underInitialPenalty:
          type: number
          format: double
          description: Initial penalty if the sizes in a buy or delivery to a store
            is underallocated. This setting is available only when mismatchPenaltyUnder
            is true.
        underFinalPenalty:
          type: number
          format: double
          description: Final penalty if the sizes in a buy or delivery to a store
            is underallocated. This setting is available only when mismatchPenaltyUnder
            is true.
        underChangePenalty:
          type: number
          format: double
          description: Incremental penalty cost for each delivery if the sizes in
            a buy or delivery to a store is underallocated. This setting is available
            only when mismatchPenaltyUnder is true.
        quantityUsageAsGross:
          type: boolean
          description: Whether the need is gross or net.
        allowNearMatch:
          type: boolean
          description: Whether to enable the near match of a size set in profile lookup.
        useProductAttributes:
          type: boolean
          description: Whether to use product attributes during optimization.
        minimumOrderThreshold:
          type: number
          format: double
          description: The percentage of the disaggregated quantity that determines
            the minimum value of the optimized quantity across all locations.
        maximumOrderThreshold:
          type: number
          format: double
          description: The percentage of the disaggregated quantity that determines
            the maximum value of the optimized quantity across all locations.
        version:
          type: integer
          format: int32
          description: The version number of the representation. This representation
            is version 1.
    packSetting:
      title: Properties related to pack.
      x-sas-media-type:
        name: application/vnd.sas.retail.pack.optimization.purchase.order.pack.setting
        version: 1
      properties:
        usePackSetting:
          type: string
          description: Denotes the way in which the pack setting is applied. There
            can be three values of this property- "product", "allpacks" or "buy".
        useSharedPackConfigurations:
          type: boolean
          description: Whether all system-recommended packs created for a set of products
            in the same delivery or for the same delivery type have matching inner
            ship pack configurations. The same standard sizes must exist for all style-color
            combinations. This setting is available only when you define pack settings
            on the "buy".
        recommendMultipleStylePacks:
          type: boolean
          description: Whether system-recommended packs can include more than one
            style-color combination. This setting is available only when you define
            pack settings on the "buy".
        maximumPacksTarget:
          type: string
          description: Denotes the target of maximum number of pack configurations.
            There can be three values of this property- "noMaximum", "vendor" or "vendorAndRecommended".
        maximumPacks:
          type: integer
          format: int32
          description: Denotes the maximum number of pack configurations. This setting
            is available only when the target is not "noMaximum".
        recommendPacks:
          type: boolean
          description: Whether system can recommend packs. This setting is available
            only when you define pack settings on the "buy".
        allowPriorDeliveryPacks:
          type: boolean
          description: Whether packs created in a prior delivery can be carried over
            to the current delivery. This setting is available only when recommendPacks
            is true.
        maximumPacksToRecommend:
          type: integer
          format: int32
          description: The maximum number of outer packs that the system can recommend.
            The value must be 1 or greater. This setting is available only when recommendPacks
            is true.
        allowAdditionalConfigurations:
          type: boolean
          description: Whether the system can override your specified number of recommended
            packs if it is necessary in order to cover all the size sets or color
            combinations that you request. This setting is available only when recommendPacks
            is true.
        maximumOuterSize:
          type: integer
          format: int32
          description: The maximum number of units that an outer pack can contain.
            The value must be 1 or greater and be a value greater than or equal to
            the value of the largest inner ship pack size. This setting is available
            only when recommendPacks is true.
        allowBrokenPacks:
          type: boolean
          description: Whether packs are allowed to be broken at the distribution
            center. This setting is available only when recommendPacks is true.
        outerPackDiscount:
          type: number
          format: double
          description: The percentage savings when a full outer pack is shipped instead
            of individual inner ship packs. This setting is used to compute the cost
            of shipping a full outer pack. Must be between 0.00 and 100.00. This setting
            is available only when recommendPacks is true.
        innerPackCost:
          type: number
          format: double
          description: The cost to open the pack. It is computed based on the number
            of inner ship packs in the outer pack. Must be greater than or equal to
            0. This setting is available only when recommendPacks is true.
        minimumPackOrder:
          type: integer
          format: int32
          description: The minimum quantity of selected inner ship packs that the
            system can use when recommending packs The value must be greater than
            0. This setting is available only when recommendPacks is true.
        subsettingAttributeId:
          type: integer
          format: int64
          description: The identifier of a unique product attribute that is used to
            subset sizes into packs when it is necessary to split the ordered sizes
            into multiple packs. This setting is available only when recommendPacks
            is true.
        bulkPacks:
          $ref: '#/components/schemas/bulkPackMedias'
        innerPacks:
          $ref: '#/components/schemas/innerPackMedias'
        selectedPacks:
          $ref: '#/components/schemas/limitPackMedias'
        version:
          type: integer
          format: int32
          description: The version number of the representation. This representation
            is version 1
    limitPackMedias:
      type: array
      items:
        type: object
        required:
        - vendorPackId
        properties:
          vendorPackId:
            type: string
            description: The identifier of a unique vendor pack.
          vendorPackName:
            type: string
            description: The name of the associated vendor pack.
          version:
            type: integer
            format: int32
            description: The version number of the representation. This representation
              is version 1
    innerPackMedias:
      type: array
      items:
        type: object
        required:
        - units
        properties:
          units:
            type: integer
            format: int32
            description: The number of units per inner ship pack. If both recommendMultipleStylePacks
              and useSharedPackConfigurations are true then it is the number of units
              for each style-color product in an inner ship pack.
          innerHandleCost:
            type: number
            format: double
            description: The cost of shipping an inner ship pack to a store. Must
              be greater than or equal to 0.
          version:
            type: integer
            format: int32
            description: The version number of the representation. This representation
              is version 1
    bulkPackMedias:
      type: array
      items:
        type: object
        required:
        - size
        properties:
          size:
            type: integer
            format: int64
            description: The number of inner ship packs in the outer pack. Each inner
              ship pack contains one unit.
          innerHandleCost:
            type: number
            format: double
            description: The cost of shipping an inner ship pack to a store. Must
              be greater than or equal to 0.
          outerHandleCost:
            type: number
            format: double
            description: The cost of shipping an outer pack to a store. Must be greater
              than or equal to 0.
          openingCost:
            type: number
            format: double
            description: The cost to open the bulk pack. Must be greater than or equal
              to 0.
          version:
            type: integer
            format: int32
            description: The version number of the representation. This representation
              is version 1
    purchaseOrderImport:
      title: Purchase Order Import XML Resource
      description: 'This representation is based on the planned quantities xml file
        supported in previous versions of pack optimization. Its schema is based on
        the import xml file along with some additional parameters like name, description,
        startdate, enddate, deliverymethod, seasonid and sourcetag.

        '
      x-sas-media-type:
        name: application/vnd.sas.retail.pack.optimization.purchase.order.import
        version: 1
      type: object
      xml:
        name: POImport
      required:
      - name
      - seasonname
      - prodgrp
      properties:
        name:
          type: string
          maxLength: 40
          description: The name of the plan
        description:
          type: string
          maxLength: 100
          description: The description of the plan
        startdate:
          type: string
          format: date
          description: The start date of the purchase order plan. Expected format
            is yyyy-MM-dd. Valid year range is 10 years before and 10 years after
            application date.
        enddate:
          type: string
          format: date
          description: The end date of the purchase order plan. Expected format is
            yyyy-MM-dd. Valid year range is 10 years before and 10 years after application
            date.
        overridestartdate:
          type: boolean
          description: If present and true, the minimum date in the planned quantities
            will be taken as start date for the plan.
        overrideenddate:
          type: boolean
          description: If present and true, the maximum date in the planned quantities
            will be taken as end date for the plan.
        deliverymethod:
          type: string
          description: If the value is 'locationgroup' deliveries will be created
            by location group. If the value is 'date' deliveries will be created by
            unique date. Default is 'locationgroup'.
        seasonname:
          type: string
          description: Unique name that identifies the season.
        sourcetag:
          type: string
          maxLength: 255
          description: Tag of the source.
        createbuydelivery:
          type: boolean
          description: If buys and deliveries need to be created for the purchase
            order plan.
        totalqtypctmin:
          type: number
          format: double
          xml:
            attribute: true
          description: The percentage of the disaggregated quantity that determines
            the minimum value of the optimized quantity across all locations.
        totalqtypctmax:
          type: number
          format: double
          xml:
            attribute: true
          description: The percentage of the disaggregated quantity that determines
            the maximum value of the optimized quantity across all locations.
        mismatchthresholdpct:
          type: number
          format: double
          xml:
            attribute: true
          description: The point at which a purchase order plan is flagged when the
            optimized quantities are over or under the target quantities needed across
            all sizes and locations in the purchase order plan.
        tag:
          type: string
          maxLength: 40
          xml:
            attribute: true
          description: A text field to tag purchase order plans with a label of your
            choice.
        notes:
          type: string
          maxLength: 255
          xml:
            attribute: true
          description: Notes that are associated with the purchase order plan.
        prodgrp:
          $ref: '#/components/schemas/productGroupImportArray'
        deliverytype:
          $ref: '#/components/schemas/deliverytypeImportArray'
        sizeset:
          $ref: '#/components/schemas/sizesetImportArray'
        locattrgrp:
          $ref: '#/components/schemas/locattrgrpImportArray'
        locgrp:
          $ref: '#/components/schemas/locationGroupImportArray'
        quantity:
          $ref: '#/components/schemas/quantityImportArray'
        version:
          type: integer
          format: int32
          description: The version number of the representation. This representation
            is version 1
    locattrgrpImportArray:
      type: array
      items:
        description: Contains one or more custom attributes.  Use the locattrgrp element
          with the location element to filter the scope of a location by matching
          attributes.
        type: object
        required:
        - id
        properties:
          id:
            type: string
            xml:
              attribute: true
            description: Unique identifier of the location attribute group.
          attribute:
            $ref: '#/components/schemas/attributeImportArray'
      example:
      - id: locattrgrpid1
      - id: locattrgrpid2
    attributeImportArray:
      type: array
      items:
        description: The location attribute is a custom location attribute that must
          be present in the GEOGRAPHY_ATTR_LOOKUP table.
        type: object
        required:
        - attributename
        - .
        properties:
          attributename:
            type: string
            xml:
              attribute: true
            description: This attribute name must be a custom location attribute name
              that is present in the GEOGRAPHY_ATTRIBUTES table.
            example: attributename1
          .:
            type: string
            description: A custom location attribute that must be present in the GEOGRAPHY_ATTR_LOOKUP
              table. This should be treated as inner text of attribute element in
              the xml. Cannot represent it here as Open API is not supporting it.
              The issue is being tracked <a href="https://github.com/OAI/OpenAPI-Specification/issues/630"
              rel="nofollow noreferrer">here</a> and could be addressed in future
              versions of the specification.
            example: '2000'
    sizesetImportArray:
      type: array
      items:
        description: A collection of standard sizes. You can use existing size sets
          (and their sizes), or you can specify sizes using the size element to create
          new size sets. Size sets are always global and are referenced by location
          group or location. Size sets can be referred to as a list of size sets to
          use with a list of style-color products.
        type: object
        required:
        - id
        properties:
          id:
            type: string
            xml:
              attribute: true
            description: Unique identifier of the size set.
            example: '100002'
          name:
            type: string
            xml:
              attribute: true
            description: Name of the size set.
            example: sizeset1
          description:
            type: string
            xml:
              attribute: true
            description: Description of the size set.
          size:
            type: array
            items:
              type: integer
              format: int32
              description: Specifies a standard size. If the size set does not already
                exist, then the size element is required. You must use the size element
                to specify the standard sizes to be included in the new size set.
            example:
            - 8914
            - 8422
    deliverytypeImportArray:
      type: array
      items:
        description: Specifies the delivery types.
        type: object
        required:
        - name
        - .
        properties:
          name:
            type: string
            xml:
              attribute: true
            description: The name of the delivery type.
            example: deliveryTypeName1
          .:
            type: integer
            format: int32
            description: Unique identifier of the delivery type. This should be treated
              as inner text of deliverytype element in the xml. Cannot represent it
              here as Open API is not supporting it. The issue is being tracked <a
              href="https://github.com/OAI/OpenAPI-Specification/issues/630" rel="nofollow
              noreferrer">here</a> and could be addressed in future versions of the
              specification.
            example: 2000
    locationGroupImportArray:
      type: array
      items:
        type: object
        required:
        - id
        properties:
          id:
            type: string
            maxLength: 32
            xml:
              attribute: true
            description: Unique id that identifies the location group.
          tag:
            type: string
            xml:
              attribute: true
            description: A text field to tag location group with a label of your choice.
          sizesetid:
            type: string
            xml:
              attribute: true
            description: Specifies the identification code for a size set.
          geoid:
            type: array
            items:
              type: string
            example:
            - locationid1
            - locationid2
            description: Location identifiers for existing locations.
          location:
            $ref: '#/components/schemas/locationImportArray'
          geogroup:
            $ref: '#/components/schemas/locationImportArray'
          stylecolorid:
            type: array
            items:
              type: string
            example:
            - stylecolorid1
            - stylecolorid2
            description: Specifies the identification code for a style-color combination.
          stylecolorsizesetlist:
            $ref: '#/components/schemas/stylecolorsizesetlistImportArray'
          quantity:
            $ref: '#/components/schemas/quantityImportArray'
      example:
      - id: locgrpid1
        tag: locgrptag1
      - id: locgrpid2
        tag: locgrptag2
    quantityImportArray:
      type: array
      items:
        description: Specifies the planned quantities for the specified product-group/product/
          location-group/date.
        type: object
        required:
        - date
        - .
        properties:
          date:
            type: string
            format: date
            xml:
              attribute: true
            description: Specifies when the quantities must be delivered. Expected
              format is yyyy-MM-dd. Valid year range is 10 years before and 10 years
              after application date. Format is YYYY-MM-DD.
            example: '2012-03-21'
          sequence:
            type: integer
            format: int32
            xml:
              attribute: true
            description: Ranks the deliveries in the order in which you want to optimize
              them.
          prodid:
            type: string
            xml:
              attribute: true
            description: Identifier for the product.
          typeid:
            type: string
            xml:
              attribute: true
            description: Specifies the delivery type ID, which is an integer.
          tag:
            type: string
            xml:
              attribute: true
            description: A text field to tag delivery with a label of your choice.
          locgrpid:
            type: string
            xml:
              attribute: true
            description: Unique id that identifies the location group.
          .:
            type: string
            description: The planned quantities for the specified product-group/product/
              location-group/date. This should be treated as inner text of quantity
              element in the xml. Cannot represent it here as Open API is not supporting
              it. The issue is being tracked <a href="https://github.com/OAI/OpenAPI-Specification/issues/630"
              rel="nofollow noreferrer">here</a> and could be addressed in future
              versions of the specification.
            example: '2000'
    stylecolorsizesetlistImportArray:
      type: array
      items:
        description: Specifies a list of size sets to use with a list of style-color
          products.
        type: object
        required:
        - listid
        properties:
          listid:
            type: string
            xml:
              attribute: true
            description: Unique id that identifies stylecolorsizesetlist.
          stylecolorsizeset:
            $ref: '#/components/schemas/stylecolorsizesetImportArray'
      example:
      - listid: id1
      - listid: id2
    stylecolorsizesetImportArray:
      type: array
      items:
        type: object
        description: Specifies the size set to use for a given style-color product.
        required:
        - .
        - sizesetid
        properties:
          .:
            type: string
            description: Product identifier for existing product. This should be treated
              as inner text of stylecolorsizeset element in the xml. Cannot represent
              it here as Open API is not supporting it. The issue is being tracked
              <a href="https://github.com/OAI/OpenAPI-Specification/issues/630" rel="nofollow
              noreferrer">here</a> and could be addressed in future versions of the
              specification.
            example: prodid1
          sizesetid:
            type: string
            xml:
              attribute: true
            description: Specifies the identification code for a size set.
            example: '100002'
    locationImportArray:
      type: array
      items:
        type: object
        required:
        - .
        properties:
          .:
            type: string
            description: Location identifiers for locations or group name of the location
              group. This should be treated as inner text of location or geogrp element
              in the xml. Cannot represent it here as Open API is not supporting it.
              The issue is being tracked <a href="https://github.com/OAI/OpenAPI-Specification/issues/630"
              rel="nofollow noreferrer">here</a> and could be addressed in future
              versions of the specification.
          stylecolorsizesetlistid:
            type: string
            xml:
              attribute: true
            description: Specifies a list of product-specific size sets. Specify a
              subset of style-color products for a given size set for a given location.
          attrgrpid:
            type: string
            xml:
              attribute: true
            description: Specifies the identification code for the location attribute
              group.
          sizesetid:
            type: string
            xml:
              attribute: true
            description: Specifies the identification code for a size set.
      example:
      - .: geoidgroupname1
      - .: geoidgroupname2
    productGroupImportArray:
      type: array
      items:
        type: object
        required:
        - id
        properties:
          id:
            type: string
            maxLength: 32
            xml:
              attribute: true
            description: Unique id that identifies the product group. The product
              group id becomes the buy name.
          tag:
            type: string
            xml:
              attribute: true
            description: A text field to tag buy with a label of your choice.
          prodid:
            type: array
            items:
              type: string
            example:
            - prodid1
            - prodid2
            description: Product identifiers for existing products.
          product:
            $ref: '#/components/schemas/productImportArray'
          locgrp:
            $ref: '#/components/schemas/locationGroupImportArray'
      example:
      - id: prodgrpid1
        tag: prodgrptag1
      - id: prodgrpid2
        tag: prodgrptag2
    productImportArray:
      type: array
      items:
        type: object
        properties:
          .:
            type: string
            description: Product identifiers for model products. This should be treated
              as inner text of product element in the xml. Cannot represent it here
              as Open API is not supporting it. The issue is being tracked <a href="https://github.com/OAI/OpenAPI-Specification/issues/630"
              rel="nofollow noreferrer">here</a> and could be addressed in future
              versions of the specification.
          like:
            type: string
            xml:
              attribute: true
            description: Specifies the product ID of a product that is like the new
              product for which you are specifying the planned quantity.
          parent:
            type: string
            xml:
              attribute: true
            description: Specifies the product ID of a product that is the parent
              of the new product for which you are specifying the planned quantity.
          modelname:
            type: string
            xml:
              attribute: true
            description: Specifies the product name for the model member when you
              use the product element to create a model member.
          styleattr:
            type: string
            xml:
              attribute: true
            description: Specifies the style attribute. The styleattr attribute sets
              the attribute to be used to build color profiles.
          relevantattr1:
            type: string
            xml:
              attribute: true
            description: Specifies the first relevant attribute. Relevant attributes
              are used when selecting the best profile to associate with a model member.
          relevantattrvalue1:
            type: string
            xml:
              attribute: true
            description: Specifies the value for the relevantattr1 attribute.
          relevantattr2:
            type: string
            xml:
              attribute: true
            description: Specifies the second relevant attribute. Relevant attributes
              are used when selecting the best profile to associate with a model member.
          relevantattrvalue2:
            type: string
            xml:
              attribute: true
            description: Specifies the value for the relevantattr2 attribute.
      example:
      - .: prodid1
        like: prodid3
      - .: prodid2
        like: prodid4
    prePackMedia:
      title: Create an Outer Pack
      description: 'Represents an outer pack. An outer pack is a pack that holds multiple
        inner packs in it. Each outer pack belongs to pack group that contains only
        outer packs.

        '
      x-sas-media-type:
        name: application/vnd.sas.retail.pack.optimization.outer.pack
        version: 1
      required:
      - packGroupName
      - packs
      properties:
        packGroupName:
          type: string
          maxLength: 40
          description: The name of the pack group
        packs:
          type: array
          items:
            $ref: '#/components/schemas/outerVendorPackMedia'
    outerVendorPackMedia:
      title: Vendor outer packs
      description: 'Represents the pack details and its settings.

        '
      x-sas-media-type:
        name: application/vnd.sas.retail.pack.optimization.outer.vendor.pack
        version: 1
      required:
      - packDetails
      - packSettings
      properties:
        packDetails:
          $ref: '#/components/schemas/vendorPack'
        packSettings:
          $ref: '#/components/schemas/packGeoSettingsMedia'
    packGeoSettingsMedia:
      title: Pack Geography Settings
      description: 'Represents the geography settings for a pack.

        '
      x-sas-media-type:
        name: application/vnd.sas.retail.pack.optimization.pack.geography.settings
        version: 1
      required:
      - geographyId
      - handlingCost
      - openingCost
      - numberOfUnits
      properties:
        geographyId:
          type: string
          description: Unique id that identifies the location.
        handlingCost:
          type: number
          format: double
          description: For a pack group that contains inner packs, this value specifies
            the cost of handling (shipping) an inner pack from the DC to the store,
            which occurs only if the outer pack is opened at the DC. And, For a pack
            group that contains outer packs, this value specifies the cost of handling
            (shipping) a whole outer pack from the DC to the store, which applies
            only if the outer pack is not opened at the DC.
        openingCost:
          type: number
          format: double
          description: This value specifies the cost of opening an outer pack at a
            DC so that the inner packs can be handled (shipped) separately from the
            DC to the store.
        numberOfUnits:
          type: integer
          format: int32
          description: This specifies the number of inner packs (child packs) in an
            outer pack (parent pack).
    innerPackMedia:
      title: Create an Inner Pack
      description: 'Represents an inner pack. An inner pack is a pack that holds multiple
        products in it. Inner packs is resides inside an outer pack. Each inner pack
        belongs to pack group that contains only inner packs.

