          "optimizedQuantities", "plannedQuantities", "createdDate", "updatedTimeStamp",
          "minimumOrderThreshold", "maximumOrderThreshold", "mismatchThresholdPercent",
          "mismatchShortagePercent", "mismatchOveragePercent", "notes", and "tag".
