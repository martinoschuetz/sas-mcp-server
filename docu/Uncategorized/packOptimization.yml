        pagination, filtering, and sorting options.  The item in the collection use
        the application/vnd.sas.retail.pack.optimization.purchase.order.summary+json
        type media type.

        '
      operationId: getPurchaseOrders
      tags:
      - Purchase Order Plans
      parameters:
      - name: start
        description: The index of the first purchase order plan to return. The minimum
          value is 0.
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        description: The maximum number of purchase order plans to return. The minimum
          value is 0. The maximum value is 10000.
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          default: 100
