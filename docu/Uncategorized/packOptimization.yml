          description: The name of the plan.
        description:
          type: string
          description: The description of the plan.
        startDate:
          type: string
          format: date
          description: The start date of the purchase order plan. Format is YYYY-MM-DD.
        endDate:
          type: string
          format: date
          description: The end date of the purchase order plan. Format is YYYY-MM-DD.
        status:
          type: string
          description: The status of the purchase order plan. Possible values include
            Open, Planned Quantities Imported, Disaggregating, Disaggregation Failed,
            Disaggregated, Optimizing, Optimization Failed, Optimized, Approved, and
            Submitted.
