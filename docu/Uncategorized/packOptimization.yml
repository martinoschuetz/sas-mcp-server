        totalStores:
          type: integer
          format: int32
          description: The total number of locations at the store level contained
            in this plan.
        totalBuys:
          type: integer
          format: int32
          description: The number of buys that are in the purchase order plan.
        totalDeliveries:
          type: integer
          format: int32
          description: The number of deliveries that are in the purchase order plan.
        disaggregatedQuantities:
          type: number
          format: double
          description: The total disaggregated quantity in the purchase order plan.
        optimizedQuantities:
          type: integer
          format: int32
          description: The total optimized quantity for the purchase order plan.
        plannedQuantities:
          type: integer
          format: int32
          description: The total planned quantity in the purchase order plan.
        seasonName:
          type: string
          description: The name of the season for which the purchase order plan is
            created.
        seasonYear:
          type: integer
          format: int32
          description: The year of the season for which the purchase order plan is
            created.
