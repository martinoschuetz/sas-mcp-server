openapi: 3.0.3
info:
  title: Pack Optimization
  description: 'This service enables clients to create, read, update, and delete jobs
    and orders.

    '
  version: '3'
tags:
- name: Root
  description: The API root.
- name: Purchase Order Plans
  description: The operations for the purchase order resource.
- name: Vendor Packs
  description: The operations for the vendor pack resource.
- name: Planned Quantity
  description: The operations for planned quanity.
paths:
  /:
    head:
      summary: Get the headers for the API
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      operationId: headersForRoot
      tags:
      - Root
      responses:
        '200':
          description: The request succeeded.
    get:
      summary: Get the top-level links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      tags:
      - Root
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/root'
            application/json:
              schema:
                $ref: '#/components/schemas/root'
  /plans:
