        message: "running sdaSchema: AQSM"
        durationMs: 8498
        startedAt: "2026-05-21T19:00:36.9659Z"
    manifest_status_404:
      description: Manifest job was not found.
      value:
        errorCode: 404
        message: "Request ID not found"
    service_not_available_error_404:
      description: Service not available 404 Response Example
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 1000000, "message": "Service\
