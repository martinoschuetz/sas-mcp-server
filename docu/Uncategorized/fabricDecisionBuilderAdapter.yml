      - name: itemId
        in: path
        description: Identifier of the item. The identifier is generated by Microsoft
          Fabric.
        required: true
        schema:
          type: string
        example: ad3d63a5-a03d-488d-851d-c8c997903c68
      - name: jobType
        in: path
        description: Type of job to run.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision.RunTheDecision
          - Org.SASDecisionBuilder.Decision.ScheduledJob
          example: Org.SASDecisionBuilder.Decision.RunTheDecision
      - name: jobInstanceId
        in: path
        description: Identifier of the job. The identifier is generated by Microsoft
          Fabric.
        required: true
        schema:
          type: string
        example: abbe4138-c6b5-4065-9503-98e44ae500fe
      - name: Authorization
        in: header
        description: This header has the following format - SubjectAndAppToken1.0
          subjectToken="delegated token", appToken="S2S token".
        required: true
        schema:
          type: string
        example: SubjectAndAppToken1.0 subjectToken="JWT token", appToken="JWT token"
      requestBody:
        required: false
        content:
          text/plain:
            schema:
              type: string
            example: cancel
      responses:
        "200":
          description: The job is cancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobInstanceState'
              example:
                $ref: '#/components/examples/jobStatusResponse'
        "500":
          description: An error is encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              example:
                $ref: '#/components/examples/errorResponse'
  /workspaces/{workspaceId}/items/{itemType}/{itemId}/jobTypes/{jobType}/payloads:
    post:
      tags:
      - JobPayloads
      summary: Record the parameters of a submitted execution
      description: Record the parameters of a submitted execution to facilitate re-run
        of an on-demand execution or to provide execution parameters for a scheduled
        execution. Each user can independently record execution parameters for the
        same item. The record is private to each user.
      operationId: createJobPayloadRecord
      parameters:
      - name: workspaceId
        in: path
        description: Identifier of the Microsoft Fabric workspace
        required: true
        schema:
          type: string
        example: 32c601f1-0d31-9481-bhfe-b3c3dc978bfd
      - name: itemType
        in: path
        description: Type of item.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision
        example: Org.SASDecisionBuilder.Decision
      - name: itemId
        in: path
        description: Identifier of the item. The identifier is generated by Microsoft
          Fabric.
        required: true
        schema:
          type: string
        example: ad3d63a5-a03d-488d-851d-c8c997903c68
      - name: jobType
        in: path
        description: Type of job to run.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision.RunTheDecision
          - Org.SASDecisionBuilder.Decision.ScheduledJob
          example: Org.SASDecisionBuilder.Decision.RunTheDecision
      - name: Authorization
        in: header
        description: This header has the following format - SubjectAndAppToken1.0
          subjectToken="delegated token", appToken="S2S token".
        required: true
        schema:
          type: string
        example: SubjectAndAppToken1.0 subjectToken="JWT token", appToken="JWT token"
      requestBody:
        $ref: '#/components/requestBodies/createScheduledJobPayload'
      responses:
        "201":
          description: The payload was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createScheduledJobPayload'
              example:
                destination: wbAzure
                itemId: ad3d63a5-a03d-488d-851d-c8c997903c68
                itemName: loan_decision
                itemType: Org.SASDecisionBuilder.Decision
                runType: Org.SASDecisionBuilder.Decision.RunTheDecision
                itemWorkspaceId: 32c601f1-0d31-9481-bhfe-b3c3dc978bfd
                inputLakehouseName: DecisionTables
                inputLakehouseId: 71538a96-9362-43d7-be2d-7067ce2a31ad
                inputWorkspaceId: 32c103f1-0d31-9481-bhfe-c-b3c3dc978bfd
                inputLakehouseServer: lrg4dmjfg2mf4-st6g27q2e64a2dsyvja.datawarehouse.fabric.microsoft.com
                inputTableName: ProjectLoan
                inputLakehouseRegion: East US 2
                outputLakehouseId: 64cfbe15-39dd-417b-bd63-4e3a363d004b
                outputLakehouseName: ExecutionResults
                outputTableName: ProjectLoan2024_09_02_13_56_23
                outputWorkspaceId: ac230b07a-f726-4bd7-8eff-696e1287cc5f
                outputLakehouseRegion: East US 2
                sourceJobInstanceId: abbe4138-c6b5-4065-9503-98e44ae500fe
                tenantId: f38099fe-4a85-482b-aec8-54ac8180bb7c
        "404":
          description: The payload record does not exist for you.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: '#/components/examples/commonErrorResponse'
  /workspaces/{workspaceId}/items/{itemType}/{itemId}/jobTypes/{jobType}/payloads/current:
    get:
      tags:
      - JobPayloads
      summary: Retrieve the recorded parameters of a submitted execution
      description: Retrieve the parameters of a submitted execution to facilitate
        re-run of an on-demand execution or to provide execution parameters for a
        scheduled execution. The record is private to each user.
      operationId: getJobPayloadRecord
      parameters:
      - name: workspaceId
        in: path
        description: Identifier of the Microsoft Fabric workspace
        required: true
        schema:
          type: string
        example: 32c601f1-0d31-9481-bhfe-b3c3dc978bfd
      - name: itemType
        in: path
        description: Type of item.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision
        example: Org.SASDecisionBuilder.Decision
      - name: itemId
        in: path
        description: Identifier of the item. The identifier is generated by Microsoft
          Fabric.
        required: true
        schema:
          type: string
        example: ad3d63a5-a03d-488d-851d-c8c997903c68
      - name: jobType
        in: path
        description: Type of job to run.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision.RunTheDecision
          - Org.SASDecisionBuilder.Decision.ScheduledJob
          example: Org.SASDecisionBuilder.Decision.RunTheDecision
      - name: Authorization
        in: header
        description: This header has the following format - SubjectAndAppToken1.0
          subjectToken="delegated token", appToken="S2S token".
        required: true
        schema:
          type: string
        example: SubjectAndAppToken1.0 subjectToken="JWT token", appToken="JWT token"
      responses:
        "200":
          description: The payload record was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createScheduledJobPayload'
