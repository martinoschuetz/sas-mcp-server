---
openapi: 3.0.3
info:
  title: Fabric Decision Builder Adapter
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: The Fabric Decision Builder Adapter provides an implementation of the
    Microsoft Fabric Workload and Job APIs.
  version: "1"
servers:
- url: "https://example.com/fabricDecisionBuilderAdapter"
  description: "This is an example of a base URL."
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: ViyaAccess
  description: Contains the operations for accessing other Viya services.
- name: Items
  description: Contains the operations for creating items.
- name: Jobs
  description: Contains the operations for executing decisions.
- name: OneLake
  description: Contains the operations for accessing One Lake.
- name: TenantParameters
  description: Contains the operations for mapping Azure tenant to operation parameters.
- name: JobPayloads
  description: Contains the operations for saving and retrieving parameters of submitted
    decision execution.
- name: JobHistory
  description: Contains the operations for retrieving execution history of a decision.
- name: Activities
  description: Contains the operations for Fabric activities.
- name: TrialsSupport
  description: Contains the operations for supporting trials of Decision Builder.
- name: NoteBookOperations
  description: Contains the operations for making ML model usable in a decision.
- name: Workspaces
  description: Contains the operations for accessing Microsoft Fabric workspaces.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level resource links
      description: Returns a list of links to the top-level resources that are surfaced
        through this API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              example:
                version: 1
                links:
                - method: POST
                  rel: getItem
                  href: /workspaces/32c601f1-0d31-9481-bhfe-b3c3dc978bfd/items/Org.SASDecisionBuilder.Decision/ad3d63a5-a03d-488d-851d-c8c997903c68
                  uri: /workspaces/32c601f1-0d31-9481-bhfe-b3c3dc978bfd/items/Org.SASDecisionBuilder.Decision/ad3d63a5-a03d-488d-851d-c8c997903c68
                  type: application/json
                - method: DELETE
                  rel: deleteItem
                  href: /workspaces/32c601f1-0d31-9481-bhfe-b3c3dc978bfd/items/Org.SASDecisionBuilder.Decision/ad3d63a5-a03d-488d-851d-c8c997903c68
                  uri: /workspaces/32c601f1-0d31-9481-bhfe-b3c3dc978bfd/items/Org.SASDecisionBuilder.Decision/ad3d63a5-a03d-488d-851d-c8c997903c68
        "503":
          description: Service Temporarily Unavailable
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: '#/components/examples/notFound'
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: '#/components/examples/notFound'
  /assertAccess:
    post:
      tags:
      - ViyaAccess
      summary: Get Viya bearer token
      description: Exchange possessed token for a Viya token. If the identity of the
        user does not exist in Viya, the user is first added to Viya's identity collection.
        The identity of the user is obtained from the subject token.
      operationId: createViyaAccessToken
      requestBody:
        $ref: '#/components/requestBodies/userScimRequest'
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResponse'
              example:
                $ref: '#/components/examples/tokenResponse'
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: '#/components/examples/commonErrorResponse'
  /workspaces:
    get:
      tags:
      - Workspaces
      summary: Get all workspaces with user roles
      description: Retrieve a list of all Microsoft Fabric workspaces that the authenticated
        user has access to, along with their role in each workspace.
      operationId: getWorkspaces
      parameters:
      - name: Authorization
        in: header
        description: Bearer token for authentication
        required: true
        schema:
          type: string
        example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/workspaceWithRole'
              example:
              - id: "32c601f1-0d31-9481-bhfe-b3c3dc978bfd"
                displayName: "My Admin Workspace"
                description: "Workspace where I have admin access"
                role: "Admin"
              - id: "64cfbe15-39dd-417b-bd63-4e3a363d004b"
                displayName: "Shared Workspace"
                description: "Collaborative workspace"
                role: "Contributor"
              - id: "71538a96-9362-43d7-be2d-7067ce2a31ad"
                displayName: "Read Only Workspace"
                description: "Data viewing workspace"
                role: "Viewer"
        "400":
          description: The request was invalid (missing Authorization header).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                message: "missing Authorization bearer token"
                httpStatusCode: 400
                version: 2
        "500":
          description: An internal error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                message: "Error getting obo token: (details: invalid_grant)"
                httpStatusCode: 500
                version: 2
  /workspaces/{workspaceId}/items/{itemType}:
    get:
      tags:
      - Items
      summary: Get a list of items
      description: Get a list of items contained of the specified type in the specified
        workspace
      operationId: getWorkspaceItems
      parameters:
      - name: workspaceId
        in: path
        description: Identifier of the Microsoft Fabric workspace
        required: true
        schema:
          type: string
        example: 32c601f1-0d31-9481-bhfe-b3c3dc978bfd
      - name: itemType
        in: path
        description: Type of item.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision
          - Org.SASDecisionBuilder.PythonCodeFile
          - Org.SASDecisionBuilder.RuleSet
        example: Org.SASDecisionBuilder.Decision
      - name: Authorization
        in: header
        description: This header has the following format - SubjectAndAppToken1.0
          subjectToken="delegated token", appToken="S2S token".
        required: true
        schema:
          type: string
        example: SubjectAndAppToken1.0 subjectToken="JWT token", appToken="JWT token"
      responses:
        "200":
          description: The request was successful.
          content:
            application/json:
              example: {"value": [

                 {"id": "b9eb4a71-038a-4ada-b743-d6fa3c20459c", "type": "Org.SASDecisionBuilder.Decision",
                    "displayName": "DecisionForInsertion", "description": "", "workspaceId": "8a04c4e0-af59-467a-bd54-7df7b7cffee0"},
                  {"id": "b77d0dc4-33ea-4513-9190-a81a230337e3", "type": "Org.SASDecisionBuilder.Decision",
                    "displayName": "DecisionForInsertion2", "description": "", "workspaceId": "8a04c4e0-af59-467a-bd54-7df7b7cffee0"}]}
        "400":
          description: The request was invalid (missing Authorization header).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                message: "missing Authorization bearer token"
                httpStatusCode: 400
                version: 2
        "500":
          description: An internal error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /workspaces/{workspaceId}/items/{itemType}/{itemId}:
    post:
      tags:
      - Items
      summary: Create an item
      description: Create a decision, rule set or Python code file.
      operationId: createItem
      parameters:
      - name: workspaceId
        in: path
        description: Identifier of the Microsoft Fabric workspace
        required: true
        schema:
          type: string
        example: 32c601f1-0d31-9481-bhfe-b3c3dc978bfd
      - name: itemType
        in: path
        description: Type of item to create.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision
          - Org.SASDecisionBuilder.PythonCodeFile
          - Org.SASDecisionBuilder.RuleSet
        example: Org.SASDecisionBuilder.Decision
      - name: itemId
        in: path
        description: Identifier of the item. The identifier is generated by Microsoft
          Fabric.
        required: true
        schema:
          type: string
        example: ad3d63a5-a03d-488d-851d-c8c997903c68
      - name: Authorization
        in: header
        description: This header has the following format - SubjectAndAppToken1.0
          subjectToken="delegated token", appToken="S2S token".
        required: true
        schema:
          type: string
        example: SubjectAndAppToken1.0 subjectToken="JWT token", appToken="JWT token"
      - name: skipDualStore
        in: query
        description: Skip storing the item's metadata in the item store.
        required: false
        schema:
          type: string
          enum:
          - "false"
          - "true"
          default: "false"
      requestBody:
        $ref: '#/components/requestBodies/itemPostRequest'
      responses:
        "200":
          description: The item created.
        "400":
          description: The request was invalid.
    patch:
      tags:
      - Items
      summary: Update an item
      description: Update a decision, rule set or Python code file.
      operationId: patchItem
      parameters:
      - name: workspaceId
        in: path
        description: Identifier of the Microsoft Fabric workspace
        required: true
        schema:
          type: string
        example: 32c601f1-0d31-9481-bhfe-b3c3dc978bfd
      - name: itemType
        in: path
        description: Type of item to create.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision
          - Org.SASDecisionBuilder.PythonCodeFile
          - Org.SASDecisionBuilder.RuleSet
        example: Org.SASDecisionBuilder.Decision
      - name: itemId
        in: path
        description: Identifier of the item. The identifier is generated by Microsoft
          Fabric.
        required: true
        schema:
          type: string
        example: ad3d63a5-a03d-488d-851d-c8c997903c68
      - name: Authorization
        in: header
        description: This header has the following format - SubjectAndAppToken1.0
          subjectToken="delegated token", appToken="S2S token".
        required: true
        schema:
          type: string
        example: SubjectAndAppToken1.0 subjectToken="JWT token", appToken="JWT token"
      - name: skipDualStore
        in: query
        description: Skip storing the item's metadata in the item store.
        required: false
        schema:
          type: string
          enum:
          - "false"
          - "true"
          default: "false"
      requestBody:
        $ref: '#/components/requestBodies/itemPatchRequest'
      responses:
        "200":
          description: The item created.
        "400":
          description: The request was invalid.
        "412":
          description: The provided ETag does not match the most recent version of
            the asset
    delete:
      tags:
      - Items
      summary: Delete an item
      description: Delete a decision, rule set or Python code file.
      operationId: deleteItem
      parameters:
      - name: workspaceId
        in: path
        description: Identifier of the Microsoft Fabric workspace
        required: true
        schema:
          type: string
        example: 32c601f1-0d31-9481-bhfe-b3c3dc978bfd
      - name: itemType
        in: path
        description: Type of item to create.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision
          - Org.SASDecisionBuilder.PythonCodeFile
          - Org.SASDecisionBuilder.RuleSet
        example: Org.SASDecisionBuilder.Decision
      - name: itemId
        in: path
        description: Identifier of the item. The identifier is generated by Microsoft
          Fabric.
        required: true
        schema:
          type: string
        example: ad3d63a5-a03d-488d-851d-c8c997903c68
      - name: Authorization
        in: header
        description: This header has the following format - SubjectAndAppToken1.0
          subjectToken="delegated token", appToken="S2S token".
        required: true
        schema:
          type: string
        example: SubjectAndAppToken1.0 subjectToken="JWT token", appToken="JWT token"
      responses:
        "200":
          description: The item was deleted.
        "400":
          description: The request was invalid.
  /workspaces/{workspaceId}/items/{itemType}/{itemId}/jobTypes/{jobType}/instances/{jobInstanceId}:
    get:
      tags:
      - Jobs
      summary: Get job status
      description: Get the status of a job.
      operationId: getJobStatus
      parameters:
      - name: workspaceId
        in: path
        description: Identifier of the Microsoft Fabric workspace
        required: true
        schema:
          type: string
        example: 32c601f1-0d31-9481-bhfe-b3c3dc978bfd
      - name: itemType
        in: path
        description: Type of item.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision
        example: Org.SASDecisionBuilder.Decision
      - name: itemId
        in: path
        description: Identifier of the item. The identifier is generated by Microsoft
          Fabric.
        required: true
        schema:
          type: string
        example: ad3d63a5-a03d-488d-851d-c8c997903c68
      - name: jobType
        in: path
        description: Type of job to run.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision.RunTheDecision
          - Org.SASDecisionBuilder.Decision.ScheduledJob
          example: Org.SASDecisionBuilder.Decision.RunTheDecision
      - name: jobInstanceId
        in: path
        description: Identifier of the job. The identifier is generated by Microsoft
          Fabric.
        required: true
        schema:
          type: string
        example: abbe4138-c6b5-4065-9503-98e44ae500fe
      - name: Authorization
        in: header
        description: This header has the following format - SubjectAndAppToken1.0
          subjectToken="delegated token", appToken="S2S token".
        required: true
        schema:
          type: string
        example: SubjectAndAppToken1.0 subjectToken="JWT token", appToken="JWT token"
      responses:
        "200":
          description: The status is obtained successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobInstanceState'
              example:
                $ref: '#/components/examples/jobStatusResponse'
        "500":
          description: An error is encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              example:
                $ref: '#/components/examples/errorResponse'
    post:
      tags:
      - Jobs
      summary: Run a job
      description: Run a job for a decision.
      operationId: createJob
      parameters:
      - name: workspaceId
        in: path
        description: Identifier of the Microsoft Fabric workspace
        required: true
        schema:
          type: string
        example: 32c601f1-0d31-9481-bhfe-b3c3dc978bfd
      - name: itemType
        in: path
        description: Type of item.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision
        example: Org.SASDecisionBuilder.Decision
      - name: itemId
        in: path
        description: Identifier of the item. The identifier is generated by Microsoft
          Fabric.
        required: true
        schema:
          type: string
        example: ad3d63a5-a03d-488d-851d-c8c997903c68
      - name: jobType
        in: path
        description: Type of job to run.
        required: true
        schema:
          type: string
          enum:
          - Org.SASDecisionBuilder.Decision.RunTheDecision
          - Org.SASDecisionBuilder.Decision.ScheduledJob
          example: Org.SASDecisionBuilder.Decision.RunTheDecision
      - name: jobInstanceId
        in: path
        description: Identifier of the job. The identifier is generated by Microsoft
          Fabric.
        required: true
        schema:
          type: string
        example: abbe4138-c6b5-4065-9503-98e44ae500fe
      - name: refreshTokenLeadTime
        in: query
        description: to make refresh token lead time configurable.
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: This header has the following format- SubjectAndAppToken1.0 subjectToken="delegated
          token", appToken="S2S token".
        required: true
        schema:
          type: string
        example: SubjectAndAppToken1.0 subjectToken="JWT token", appToken="JWT token"
      requestBody:
        $ref: '#/components/requestBodies/jobCreationRequest'
      responses:
        "202":
          description: The job is accepted.
        "400":
          description: The request was invalid.
  /workspaces/{workspaceId}/items/{itemType}/{itemId}/jobTypes/{jobType}/instances/{jobInstanceId}/cancel:
