    itemCreationRequest:
      title: Item creation request
      description: The essential information for creating a workload.
      properties:
        displayName:
          type: string
          description: The name of the item.
        description:
          type: string
          description: A description of the item.
    itemUpdateRequest:
      title: Item update request
      description: |
        A partial update to an existing item.

        If `updatePayload` is omitted, the underlying asset is always updated without considering ETags. When the
        `updatePayload` is specified, the appropriate ETag is provided as a precondition for the update to ensure edits
        to properties other than the name/description do not inadvertently overwrite other work.
      properties:
        displayName:
          type: string
          description: The name of the item.
        description:
          type: string
          description: A description of the item.
        updatePayload:
          type: object
          description: The update payload specific to the Decision Builder workload.
          required: ["content"]
          properties:
            content:
              type: string
              description: |
                A JSON-encoded string containing the type-specific properties to update on the asset. The schema of the
                encoded object depends on the item type.

                ### Decisions

                Updates to decisions require an `etag` and `decision`. The ETag is the most recent tag seen by the
                client to ensure it does not accidentally overwrite a change that has been made since the decision was
                originally retrieved. The `decision` property contains a partial [Decision][decision]. Any top-level
                field will overwrite the existing value, but omitted top-level fields will retain the existing value.

                ```json
                {
                  "etag": "",
                  "decision": {}
                }
                ```

                [decision]: https://developer.sas.com/rest-apis/decisions/schemas#decision

                ### Rule Sets

                Updates to rule sets require an `etag`, the `ruleSet`, and a list of `rules`. The ETag is the most
                recent tag seen by the client to ensure it does not accidentally overwrite a change that has been made
                since the rule set was originally retrieved. The `ruleSet` property contains a partial
                [Rule Set][ruleSet]. Any top-level field will overwrite the existing value, but omitted top-level fields
                will retain the existing value. The `rules` properties contains the complete list of
                [Rule objects][rule] for the rule set. The order of the rules within the `rules` property sets their
                execution order within the rule set.

                ```json
                {
                  "etag": "",
                  "ruleSet": {},
                  "rules": []
                }
                ```

                [rule]: https://developer.sas.com/rest-apis/businessRules/schemas#rule
                [ruleSet]: https://developer.sas.com/rest-apis/businessRules/schemas#rule-set

                ### Code Files

                Updates to a code file require the `fileEtag`, `file`, and `code` properties. The `fileEtag` contains
                the ETag of the file resource that stores the code file's code. This is *not* the code file's ETag, but
                rather the ETag of the file resource referenced by the code file's `fileUri` property. The `file`
                property contains a subset of the fields from a [File Resource][fileResource]; specifically, the `id`,
                `name`, `description`, and `properties` fields. These fields are used to [update the file][fileUpdate]
                that stores the code file's content. The `code` property of the update request contains the user
                defined code for the code file along with the annotation describing the variables in the code file's
                signature.

                ```json
                {
                  "fileEtag": "",
                  "file": {},
                  "code": ""
                }
                ```

                [fileResource]: https://developer.sas.com/rest-apis/files/schemas#file-resource
                [fileUpdate]: https://developer.sas.com/rest-apis/files/patchFileResourceInfo
