---
openapi: 3.0.3
info:
  version: "1"
  title: SAS Studio REST APIs
  description: This set of private APIs supports the Java-based backend resources
    for SAS Studio.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
servers:
- url: http://example.com/SASStudio
  description: mock server
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Data
  description: Contains Data-related operations.
- name: DataFlow
  description: Contains DataFlow-related operations.
- name: File
  description: Contains File-related operations.
- name: Git
  description: Contains Git-related operations.
- name: Index
  description: Contains Index-related operations.
- name: Message
  description: Contains Message-related operations.
- name: Perspective
  description: Contains Perspective-related operations.
- name: Query
  description: Contains Query-related operations.
- name: SasLibrary
  description: Contains SAS library-related operations.
- name: Search
  description: Contains Search-related operations.
- name: Session
  description: Contains Session-related operations.
- name: Share
  description: Contains Share-related operations.
- name: Snippets
  description: Contains Snippets-related operations.
- name: Spitr
  description: Contains Spitr-related operations.
- name: StudioAppData
  description: Contains StudioAppData-related operations.
- name: Submission
  description: Contains Submission-related operations.
- name: Task
  description: Contains Task-related operations.
- name: Tree
  description: Contains Tree-related operations.
- name: JobManagement
  description: Contains Job-Management-related operations.
- name: Step
  description: Contains Step-related operations.
paths:
  /:
    get:
      tags:
      - Root
      summary: Gets the API object.
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
  "/sasexec/data/{sessionId}/library":
    post:
      tags:
      - Data
      summary: Assigns a given library.
      description: Assigns a given library. Returns a Libref.
      operationId: assignLibrary
      parameters:
      - name: sessionId
        in: path
        description: The unique identifier of the session used to access the data
          service provider's backing service.
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/libraryInfoRequest"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/libref"
        "400":
          description: Bad request
  /sasexec/dataflow/computecontext:
    get:
      tags:
      - DataFlow
      summary: Gets the environment compute context id.
      description: Gets the environment compute context id. Returns a String.
      operationId: activeComputeContext
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: Bad request
  /sasexec/dataflow/transformations:
    get:
      tags:
      - DataFlow
      summary: Gets all transformations.
      description: Gets all transformations. Returns a collection of type ResourceCollection<TransformationData>.
      operationId: allTransformations
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/transformationData"
            application/json:
              schema:
                $ref: "#/components/schemas/transformationData"
        "400":
          description: Bad request
  /sasexec/dataflow/transformation:
    get:
      tags:
      - DataFlow
      summary: Requests for transformation data.
      description: Requests for transformation data given a transformation ID. Returns
        a value of type TransformationData.
      operationId: transformationData
      parameters:
      - name: transformationId
        in: query
        description: The transformation ID.
        schema:
          type: string
      - name: locale
        in: query
        description: Specifies the locale.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/transformationData"
        "400":
          description: Bad request
  /sasexec/dataflow/transformationui:
    get:
      tags:
      - DataFlow
      summary: Gets the transformation schema.
      description: Gets the transformation schema. Returns a String
      operationId: transformationSchema
      parameters:
      - name: transformationId
        in: query
        description: The transformation ID.
        schema:
          type: string
      - name: nlsUri
        in: query
        description: The NLS uri.
        required: false
        schema:
          type: string
      - name: locale
        in: query
        description: Specifies the locale.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            text/plain;charset=UTF-8:
              schema:
                type: string
        "400":
          description: Bad request
  /sasexec/dataflow/dfb:
    post:
      tags:
      - DataFlow
      summary: Generates dataflow and bindings.
      description: Generates dataflow and bindings. Returns a String
      operationId: generateDataFlowAndBindings
      parameters:
      - name: sessionId
        in: query
        description: The session id.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/dataflow"
        description: The detaflow to bind.
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: Bad request
  /sasexec/dataflow/code:
    post:
      tags:
      - DataFlow
      summary: Generates a dataflow code.
      description: Generates a dataflow code. Returns a String.
      operationId: generateDataflowCodeFromFlow
      parameters:
      - name: sessionId
        in: query
        description: The session ID.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/dataflow"
        description: The dataflow for which code is generated.
        required: true
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: Bad request
    get:
      tags:
      - DataFlow
      summary: Generates a dataflow code.
      description: Generates a dataflow code. Returns a String.
      operationId: generateDataFlowCodeFromUri
      parameters:
      - name: dataFlowUri
        in: query
        description: The dataflow uri for which code is generated.
        required: true
        schema:
          type: string
      - name: sessionId
        in: query
        description: The session ID.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: Bad request
  /sasexec/dataflow/convertCodeToFlow:
    post:
      tags:
      - DataFlow
      summary: Converts a code to flow.
      description: Converts a code to flow. Returns a value of type Submission.
      operationId: convertCodeToDataFlow
      parameters:
      - name: parentFolder
        in: query
        description: Specifies the parent folder.
        required: true
        schema:
          type: string
      - name: replace
        in: query
        description: Specifies to replace an existing flow.
        required: true
        schema:
          type: boolean
      - name: sessionId
        in: query
        description: The session id.
        required: true
        schema:
          type: string
      - name: encoding
        in: query
        description: Specifies the encoding.
        required: true
        schema:
          type: string
      - name: clientSubmissionId
        in: query
        description: Specifies the client submission id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/codeToFlowUIRequest"
        description: The request object.
        required: true
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/submission"
        "400":
          description: Bad request
  /sasexec/dataflow/execute:
    post:
      tags:
      - DataFlow
      summary: Executes the dataflow.
      description: Executes the dataflow. Returns a DataflowExecutionOperation object.
      operationId: executeDataflow
      parameters:
      - name: sessionId
        in: query
        description: The session ID.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/dataflow"
        description: The dataflow to execute.
        required: true
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dataflowExecutionOperation"
        "201":
          description: Created
        "400":
          description: Bad request
  /sasexec/dataflow/saveDataflow:
    post:
      tags:
      - DataFlow
      summary: Saves the dataflow.
      description: Saves the dataflow. Returns a SaveDataflowResponse object.
      operationId: saveDataflow
      parameters:
      - name: parentFolder
        in: query
        description: The parent folder.
        required: false
        schema:
          type: string
      - name: sessionId
        in: query
        description: The session ID.
        required: false
        schema:
          type: string
      - name: overwrite
        in: query
        description: Specifies whether or not to overwrite an existing dataflow.
        required: false
        schema:
          type: boolean
          default: false
      - name: forceUpdate
        in: query
        description: Specifies whether or not to force an update of the dataflow.
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/dataflow"
        description: The dataflow to save.
        required: true
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/saveDataflowResponse"
        "201":
          description: Created
        "400":
          description: Bad request
  /sasexec/dataflow/getSavedDataflow:
    get:
      tags:
      - DataFlow
      summary: Gets a saved dataflow.
      description: Gets a saved dataflow. Returns a Dataflow object.
      operationId: getSavedDataflow
      parameters:
      - name: dataFlowURI
        in: query
        description: The dataflow URI.
        schema:
          type: string
      - name: sessionId
        in: query
        description: The session ID.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dataflow"
        "400":
          description: Bad request
  /sasexec/dataflow/refreshTableNodeProperties:
    get:
      tags:
      - DataFlow
      summary: Refreshes the properties for a given table node.
      description: Refreshes the properties for a given table node.
      operationId: refreshTableNode
      parameters:
      - name: sessionId
        in: query
        description: The session ID.
        schema:
          type: string
      - name: tableUri
        in: query
        description: The table URI.
        schema:
          type: string
      - name: tableProps
        in: query
        description: Specifies whether or not refresh includes table properties.
        required: false
        schema:
          type: boolean
          default: false
      - name: columnProps
        in: query
        description: Specifies whether or not refresh includes column properties.
        required: false
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        description: Specifies the maximum number of table columns to refresh.
        required: false
        schema:
          type: integer
          default: 1000
      - name: start
        in: query
        description: Specifies the start column index.
        required: false
        schema:
          type: integer
          default: 0
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: Bad request
  /sasexec/dataflow/tableMetadata:
    get:
      tags:
      - DataFlow
      summary: Gets a table metadata.
      description: Gets a table metadata. Returns a Table object.
      operationId: getTableMetadata
      parameters:
      - name: tableUri
        in: query
        description: The table URI.
        schema:
          type: string
      - name: sessionId
        in: query
        description: The session ID.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/table"
        "400":
          description: Bad request
  /sasexec/dataflow/tableColumns:
    get:
      tags:
      - DataFlow
      summary: Gets the columns for a given table.
      description: Gets the columns for a given table. Returns a collection of type
        List<Column>.
      operationId: getTableColumns
      parameters:
      - name: tableUri
        in: query
        description: The table URI.
        schema:
          type: string
      - name: sessionId
        in: query
        description: The session ID.
        schema:
          type: string
      - name: limit
        in: query
        description: Specifies the maximum number of table columns to fetch.
        required: false
        schema:
          type: integer
          default: 1000
      - name: start
        in: query
        description: Specifies the start column index.
        required: false
        schema:
          type: integer
          default: 0
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/column"
        "400":
          description: Bad request
  "/sasexec/sessions/{sessionId}/workspace/filecontents":
    get:
      tags:
      - File
      summary: Gets the contents for a given file.
      description: Gets the contents for a given file.
      operationId: getFileContents
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      - name: path
        in: query
        description: The file path.
        schema:
          type: string
      - name: encoding
        in: query
        description: The file encoding.
        required: false
        schema:
          type: string
      - name: fileSpace
        in: query
        description: The name of the file space (location).
        required: false
        schema:
          type: string
          default: sascontent
      - name: maxBytes
        in: query
        description: The maximum number of bytes for file contents.
        required: false
        schema:
          type: integer
          default: -1
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "400":
          description: Bad request
  "/sasexec/sessions/{sessionId}/workspace/filerefcontents":
    get:
      tags:
      - File
      summary: Gets the contents for a given fileref.
      description: Gets the contents for a given fileref. Returns void.
      operationId: getFilerefContents
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      - name: filerefName
        in: query
        description: The fileref name.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: Bad request
  "/sasexec/sessions/{sessionId}/workspace/download":
    get:
      tags:
      - File
      summary: Downloads a file.
      description: Downloads a file.
      operationId: download
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      - name: path
        in: query
        description: The file path.
        schema:
          type: string
      - name: filename
        in: query
        description: The name of the file to be downloaded.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: Bad request
  "/sasexec/sessions/{sessionId}/workspace/createHistory":
    post:
      tags:
      - File
      summary: Adds a history.
      description: Adds a history to the ContentService.
      operationId: addHistory
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/historyRequest"
        description: The history item to be added to the ContentService.
        required: true
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: Bad request
  "/sasexec/sessions/{sessionId}/saveContentFile":
    post:
      tags:
      - File
      summary: Saves a content file.
      description: Saves a content file. Returns a value of type FilesTreeObject.
      operationId: saveContentFile
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      - name: parentUri
        in: query
        description: The file's parent uri.
        required: true
        schema:
          type: string
      - name: fileName
        in: query
        description: The file's name.
        required: true
        schema:
          type: string
      - name: encoding
        in: query
        description: The file's encoding.
        required: true
        schema:
          type: string
      - name: typeDef
        in: query
        description: The file's type definition.
        required: false
        schema:
          type: string
      - name: fileUri
        in: query
        description: The file's uri.
        required: false
        schema:
          type: string
      - name: replace
        in: query
        description: Specifies whether or not to replace an existing file.
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: string
        description: The file's contents.
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/filesTreeObject"
        "400":
          description: Bad request
  "/sasexec/sessions/{sessionId}/workspace/createFile":
    post:
      tags:
      - File
      summary: Creates a file.
      description: Creates a file.
      operationId: createFile
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      - name: filePath
        in: query
        description: The file path.
        schema:
          type: string
      - name: fileName
        in: query
        description: The name of the file.
        schema:
          type: string
      - name: encoding
        in: query
        description: The file encoding.
        required: true
        schema:
          type: string
      - name: contentType
        in: query
        description: The content type.
        required: false
        schema:
          type: string
          default: contentType
      - name: fileUri
        in: query
        description: The file URI.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: Bad request
  "/sasexec/sessions/{sessionId}/renameFile":
    put:
      tags:
      - File
      summary: Renames a file.
      description: Renames a file.
      operationId: renameFile
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/fileMoveRequest"
        description: The json data containing information about the file to be renamed.
        required: true
      responses:
        "200":
          description: The request succeeded.
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "400":
          description: Bad request
        "412":
          description: Precondition Failed
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: Precondition Required
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: "#/components/schemas/error2"
  "/sasexec/sessions/{sessionId}/moveFolder":
    put:
      tags:
      - File
      summary: Moves a folder.
      description: Moves a folder. Returns a value of type String.
      operationId: moveFolder
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/fileMoveRequest"
        description: The json data containing information about the folder to be moved,
          including new folder name and URI.
        required: true
      responses:
        "200":
          description: The request succeeded.
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "400":
          description: Bad request
        "412":
          description: Precondition Failed
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: Precondition Required
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: "#/components/schemas/error2"
  "/sasexec/sessions/{sessionId}/renameFolder":
    put:
      tags:
      - File
      summary: Renames a folder.
      description: Renames a folder. Returns a value of type String.
      operationId: renameFolder
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/fileMoveRequest"
        description: The json data containing information about the folder to be renamed,
          including new folder name and URI.
        required: true
      responses:
        "200":
          description: The request succeeded.
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "400":
          description: Bad request
        "412":
          description: Precondition Failed
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: Precondition Required
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: "#/components/schemas/error2"
  "/sasexec/sessions/{sessionId}/workspace/makeDir":
    put:
      tags:
      - File
      summary: Creates a folder or directory.
      description: Creates a folder or directory.
      operationId: createFolder
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      - name: path
        in: query
        description: The folder path.
        schema:
          type: string
      - name: name
        in: query
        description: The name of the folder to be created.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: Bad request
        "412":
          description: Precondition Failed
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: Precondition Required
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error2"
  "/sasexec/sessions/{sessionId}/workspace/upload":
    post:
      tags:
      - File
      summary: Uploads a file.
      description: Uploads a file.
      operationId: upload
      parameters:
      - name: sessionId
        in: path
        description: The session/transaction ID.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: Bad request
  "/sasexec/sessions/{sessionId}/deleteMulti":
    delete:
      tags:
      - File
      summary: Deletes multiple files and folders.
      description: Deletes multiple files and folders.
      operationId: deleteMultiple
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/multiDeleteRequest"
        description: The json data containing information about the files and folders
          to be deleted.
        required: true
      responses:
        "200":
          description: The request succeeded.
        "204":
          description: Deleted
        "400":
          description: Bad request
  "/sasexec/sessions/{sessionId}/workspace/deleteDir":
    delete:
      tags:
      - File
      summary: Deletes a folder or directory.
      description: Deletes a folder or directory.
      operationId: deleteDir
      parameters:
      - name: sessionId
        in: path
        description: The session ID.
        required: true
        schema:
          type: string
      - name: path
        in: query
        description: The folder or directory path.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
        "204":
          description: The folder or directory has been deleted.
        "400":
          description: Bad request
  "/sasexec/sessions/{sessionId}/validateName":
    post:
      tags:
      - File
