        modifiedTimeStamp:
          type: string
          format: date
          description: Returns the time stamp when the file was last modified.
        createdBy:
          type: string
          description: Returns the name of the user who created the file.
        modifiedBy:
          type: string
          description: Returns the name of the user who last modified the file.
        fileOrigin:
          type: string
          description: Returns the origin of the file.
