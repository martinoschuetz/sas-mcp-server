        metadata.
      properties:
        fileId:
          type: string
          description: Returns the id of the file to be imported into Excel.
        fileName:
          type: string
          description: Returns the
        fileSize:
          type: integer
          description: Returns the file size.
        tableNames:
          type: array
          items:
            type: string
          description: Returns a list of table names.
        fileExtension:
          type: string
          description: Returns the file name extension.
        sheetNames:
          type: array
          items:
            type: string
          description: Returns a list of Excel sheet names.
        sessionId:
          type: string
          description: Returns the session id.
    fileMetadata:
      title: FileMetadata
