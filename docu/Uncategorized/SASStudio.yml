components:
  requestBodies:
    gitRepository:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/gitRepository"
      description: A JSON object containing repository information.
      required: true
    libraryInfoRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/libraryInfoRequest"
      description: The LibraryInfoRequest object that contains methods used to retrieve
        library name, path, etc.
      required: true
    mapObject:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/mapObject"
      description: The data source attributes.
      required: true
    sasSessionCreationRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/sasSessionCreationRequest"
      description: The session creation request object of type SASSessionCreationRequest.
      required: true
    queryObject:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/queryObject"
      description: Technically, this is part of the request parameter of type HttpServletRequest.
        It is included here mainly to give an idea of the structure (properties) constituting
        the request parameter.
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://viya19w47p.sasstudio.sashq-d.openstack.sas.com/SASLogon/login
          tokenUrl: http://viya19w47p.sasstudio.sashq-d.openstack.sas.com/SASLogon/oauth/token
          scopes:
            read: Grants read access
            write: Grants write access
  schemas:
    tableEditRequest:
      title: TableEditRequest
      description: The TableEditRequest object.
      properties:
        tableRef:
          type: string
          description: Returns the table reference.
        columnEdits:
          type: array
          items:
            $ref: "#/components/schemas/columnMetadataEdit"
          description: Returns a collection of objects of type ColumnMetadataEdit.
    delimitedTableEditRequest:
      title: DelimitedTableEditRequest
      description: The DelimitedTableEditRequest object.
      properties:
        tableRef:
          type: string
          description: Returns the table reference.
        delimitedOptions:
          $ref: "#/components/schemas/delimitedOptions"
        columnMetadata:
          type: array
          items:
            $ref: "#/components/schemas/dataTableColumn"
          description: Returns a list of object of type DataTableColumn.
    dataTableColumn:
      title: DataTableColumn
      description: The DataTableColumn object.
      properties:
        name:
          type: string
          description: Returns the name of the table column.
        label:
          type: string
          description: Returns the label for the table column.
        format:
          type: string
          description: Returns the format of type DataTableColumnFormatInfo for the
            table column.
        informat:
          type: string
          description: Returns the informat of type DataTableColumnFormatInfo for
            the table column.
        length:
          type: integer
          description: Returns the value for length.
        type:
          type: string
          description: Returns the value for type.
    columnMetadataEdit:
      title: ColumnMetadataEdit
      description: The ColumnMetadataEdit object.
      properties:
        currentName:
          type: string
          description: Returns the current column name.
    excelOptions:
      title: ExcelOptions
      description: The ExcelOptions object with the options for importing an Excel
        file.
      properties:
        dbms:
          type: string
          description: Returns the DBMS engine.
        range:
          $ref: "#/components/schemas/excelRange"
        getNames:
          type: boolean
          description: Returns whether or not to get names.
        getNamesAsString:
          type: string
          description: Returns "yes' or "no" whether or not to get names.
        guessingRows:
          type: string
          description: Returns the number of guessing rows.
        renameColumns:
          type: boolean
          description: Returns whether or not to rename columns.
    excelRange:
      title: ExcelRange
      description: The ExcelRange object.
      properties:
        start:
          type: string
          description: Returns the start of the range.
        end:
          type: string
          description: Returns the end of the range.
    delimitedOptions:
      title: Options
      description: The DelimitedOptions object with the options for importing a delimited
        file.
      properties:
        delimiter:
          type: string
          description: Returns the file delimiter.
        dataRow:
          type: integer
          description: Returns the number of data rows.
        getNames:
          type: string
          description: Returns "yes' or "no" whether or not
        guessingRows:
          type: string
          description: Returns the number of guessing rows.
        renameColumns:
          type: boolean
          description: Returns whether or not to rename columns.
    fileImportResponse:
      title: FileImportResponse
