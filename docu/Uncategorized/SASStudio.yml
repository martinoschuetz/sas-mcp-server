          type: boolean
          description: This helps load the query tool from an external source like
            the libraries accordion in SAS Studio.
        migrating:
          type: boolean
          description: Set this to true when migrating from an earlier version.
        outputMode:
          type: string
          description: Describes the type of output from the query-- TABLE, VIEW,
            or REPORT.
