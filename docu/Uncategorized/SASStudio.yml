            in the WHERE clause.
        whereFormattedFilter:
          type: string
          description: Specifies the expression text including newlines to be used
            in the WHERE clause.
        useWhereAdvancedExpression:
          type: boolean
          description: Specifies whether or not you want to ignore the quick filters
            and just use the whereFilter/whereFormattedFilter for code generation.
