---
openapi: 3.0.3
info:
  title: Thumbnail Provider Contract
  description: >
    The Thumbnail Provider Contract is a contract that a Thumbnail Provider must implement
    to be used by the Thumbnails
    API.


    Note that this contract does not specify the media type "application/json". This
    contract allows for the
    implementation to be within an existing API, which might choose to overload a
    single resource with multiple
    implementations, this contract being one of them. "application/json" would map
    to an API's native type, and not
    to this contract type.
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
  version: "1"
tags:
- name: AsynchronousThumbnails
  description: The operations for requesting thumbnails, using an asynchronous job
    pattern. A Thumbnail Provider registered as implementing the "thumbnailJob" contract
    will implement these operations.
- name: SynchronousThumbnails
  description: The operations for requesting thumbnails, where the Thumbnail Provider
    synchronously (in a timely fashion) with the result. A Thumbnail Provider registered
    as implementing the "synchronous" contract will implement these operations.
paths:
  /jobs:
    post:
      summary: Create a new thumbnail job, using an asynchronous job pattern
      description: >
        Creates a new thumbnail job based on the representation in the request body.


        Note: this documentation assumes "/jobs" is the REST resource that a Thumbnail
        Provider implements. In reality,
        it can be any path; the actual path to use is part of the information that
        the Thumbnail Provider registers
        with the Thumbnails service. An implementing service might
        choose to use a different path for clarity within its own service, or to avoid
        overloading an existing resource.

        If the entire job fails either return a job object with an embedded error,
        or return an error directly.
        For example, if report images cannot access the object referenced in resourceUri,
        then a SAS error object
        with 404 status is placed in the Error member of the response job. The job
        is returned with 400 (not 404)
        status. (the job was found, it's a detail of the job which was not found).
      operationId: createJobAsynchronous
      tags:
      - AsynchronousThumbnails
      parameters:
      - name: Accept-Locale
        in: header
        required: false
        description: SAS header for specifying a "format locale" distinct from the
          user's language (Accept-Language).  Usage and syntax is similar to https://tools.ietf.org/html/rfc7231#section-5.3.5
        schema:
          type: string
      - name: wait
        in: query
        required: false
        description: This service implements "long poll", how long to wait for an
          update before returning anyway, in floating point seconds. The maximum is
          30 seconds.
        schema:
          type: number
          format: float
          default: 0.5
      requestBody:
        content:
          application/vnd.sas.thumbnails.job.request+json:
            schema:
              $ref: "#/components/schemas/thumbnailRequest"
            examples:
              typical:
                $ref: "#/components/examples/requestCreateJob"
      responses:
        "201":
          description: A (single) thumbnail job was created and has completed.
          headers:
            Location:
              description: The URL of the thumbnail job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                completed job:
                  $ref: "#/components/examples/completed_job"
        "202":
          description: A thumbnail job was accepted; the job is not yet complete.
          headers:
            Location:
              description: The URL of the thumbnail job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                running job:
                  $ref: "#/components/examples/running_job"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error job:
                  $ref: "#/components/examples/job_with_error"
  /jobs/{thumbnailJobId}:
    get:
      summary: Get a thumbnail job
      description: Returns the representation of the specified thumbnail job.
      operationId: getJob
      tags:
      - AsynchronousThumbnails
      parameters:
      - name: thumbnailJobId
        in: path
        required: true
        description: The unique identifier for the thumbnail job.
        schema:
          type: string
      - name: wait
        in: query
        required: false
        description: This service implements "long poll", how long to wait for an
          update before returning anyway, in floating point seconds. The maximum is
          30 seconds.
        schema:
          type: number
          format: float
          default: 0.5
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                completed job:
                  $ref: "#/components/examples/completed_job"
                running job:
                  $ref: "#/components/examples/running_job"
        "404":
          description: No thumbnail job exists at the requested path.
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/error_job_not_found"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/error_job_not_found"
    head:
      summary: Existence check for a thumbnail job
      description: Existence check for a thumbnail job
      operationId: headersForJob
      tags:
      - AsynchronousThumbnails
      parameters:
      - name: thumbnailJobId
        in: path
        required: true
        description: The unique identifier for the thumbnail job.
        schema:
          type: string
      - name: wait
        in: query
        required: false
        description: This service implements "long poll", how long to wait for an
          update before returning anyway, in floating point seconds. The maximum is
          30 seconds.
        schema:
          type: number
          format: float
          default: 0.5
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                completed job:
                  $ref: "#/components/examples/completed_job"
                running job:
                  $ref: "#/components/examples/running_job"
        "404":
          description: No thumbnail job exists at the requested path.
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/error_job_not_found"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/error_job_not_found"
  /thumbnails:
    post:
      summary: Return a thumbnail job
      description: >
        Return a thumbnail job based on the representation in the request body. The
        semantics here are "GET via POST".
        A persisted thumbnail job is not created, and the positive status is 200 (OK),
        not 201 (Created).


        Note: this documentation assumes "/thumbnails" is the REST resource that a
        Thumbnail Provider implements. In
        reality, it can be any path; the actual path to use is part of the information
        that the Thumbnail Provider
        registers with the Thumbnails service. An implementing
        service might choose to use a different path for clarity within its own service,
        or to avoid overloading an
        existing resource.
      operationId: getSynchronousJob
      tags:
      - SynchronousThumbnails
      parameters:
      - name: Accept-Locale
        in: header
        required: false
        description: SAS header for specifying a "format locale" distinct from the
          user's language (Accept-Language).  Usage and syntax is similar to https://tools.ietf.org/html/rfc7231#section-5.3.5
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.thumbnails.job.request+json:
            schema:
              $ref: "#/components/schemas/thumbnailRequest"
            examples:
              typical:
                $ref: "#/components/examples/requestCreateJob"
      responses:
        "200":
          description: >
            A thumbnail job is returned. The job is not persisted, and the "state"
            field in the job must be set to
            either 'completed' or 'failed'. Note, a 200 response, not 201, because
            this is "GET via POST" and hence
            follows "GET" semantics.
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                completed job:
                  $ref: "#/components/examples/completed_job_synchronous"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error job:
                  $ref: "#/components/examples/job_with_error"
servers:
- url: http://example.com/thumbnailProviderContract
  description: Sample server URL. - note... this is not a "real" service, but the
    contract a provider would follow
components:
  examples:
    requestCreateJob:
      description: Request body creating a thumbnail job for a report
      value: {"acceptItem": "image/*,text/plain,text/csv,*/*;0.8", "resourceUri": "/reports/reports/96cf6cba-23d2-449d-a225-913c86afe908",
        "resourceType": "report", "returnMultiple": false, "detailLevel": "low", "scope": "element",
        "sizingOptions": {"viewWidth": 268, "viewHeight": 151, "devicePixelRatio": 1.0,
          "maxTextCharacters": 100, "maxTableColumns": 3, "maxTableRows": 5}, "version": 1,
        "refresh": false}
    completed_job_synchronous:
      description: >
        Completed job, note the "state" member.  Note for the
        "synchronous" pattern, an object is not created and there
        is no "self" link.
      value: {"id": "d7aa...", "version": 1, "links": [{"method": "GET", "rel": "defaultThumbnailImage",
            "href": "/reportImages/defaultReportThumbnail.svg", "uri": "/reportImages/defaultReportThumbnail.svg",
            "type": "image/svg+xml"}], "state": "completed", "thumbnails": [{"state": "completed",
            "modifiedTimeStamp": "2018-02-20T20:25:33.023Z", "links": [{"method": "GET",
                "rel": "thumbnail", "href": "/reportImages/images/K1380786238B1861545288.svg",
                "uri": "/reportImages/images/K1380786238B1861545288.svg", "type": "image/svg+xml"}]}],
        "duration": 0.462, "defaultThumbnailSasThemesIconKey": "sas.icons.HC.TILEZEROSTATE"}
    completed_job:
      description: >
        Completed job, note the "state" member.  Note for each
        thumbnail (typically 1 as is the case here), the "thumbnail"
        link to retrieve the requested image.  (That image will come
        with cache control headers encouraging the browser to cache
        the image.)
      value: {"id": "d7aa...", "version": 1, "links": [{"method": "GET", "rel": "self",
            "href": "/thumbnails/jobs/d7aa...", "uri": "/thumbnails/jobs/d7aa...",
            "type": "application/vnd.sas.thumbnails.job"}, {"method": "GET", "rel": "defaultThumbnailImage",
            "href": "/reportImages/defaultReportThumbnail.svg", "uri": "/reportImages/defaultReportThumbnail.svg",
            "type": "image/svg+xml"}], "state": "completed", "thumbnails": [{"state": "completed",
            "modifiedTimeStamp": "2018-02-20T20:25:33.023Z", "links": [{"method": "GET",
                "rel": "thumbnail", "href": "/reportImages/images/K1380786238B1861545288.svg",
                "uri": "/reportImages/images/K1380786238B1861545288.svg", "type": "image/svg+xml"}]}],
        "duration": 0.462, "defaultThumbnailSasThemesIconKey": "sas.icons.HC.TILEZEROSTATE"}
    error_job_not_found:
      description: request for missing job
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 76717, "message": "Thumbnails\
          \ job not found.", "details": ["path: /thumbnails/jobs/8d089408-6bf5-4ba8-9a80-1babe76b0c0f",
          "correlator: 43486b9d-23d8-4674-8923-a37c9eb77da7"]}
    running_job:
      description: >
        Running job, note the "state" member.  Additionally, the
        "defaultThumbnailImage" link is available should showing a
        suitable placeholder be appropriate
      value: {"id": "d7aa...", "version": 1, "links": [{"method": "GET", "rel": "self",
            "href": "/thumbnails/jobs/d7aa...", "uri": "/thumbnails/jobs/d7aa...",
            "type": "application/vnd.sas.thumbnails.job"}, {"method": "GET", "rel": "defaultThumbnailImage",
            "href": "/reportImages/defaultReportThumbnail.svg", "uri": "/reportImages/defaultReportThumbnail.svg",
            "type": "image/svg+xml"}], "state": "running", "thumbnails": [], "defaultThumbnailSasThemesIconKey": "sas.icons.HC.TILEZEROSTATE"}
    job_with_error:
      description: >
        Job with an error. If the error was reported from a downstream
        thumbnail provider, as is the case here, an effort is made to
        preserve the original error text (in "message") and the original
        error code (in "details").
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 76701, "message": "report\
          \ not found", "details": ["reportUri: /reports/reports/9b5eb53e-2a7a-4b63-aff3-ca60103f462a",
          "traceId: 52e8ef1b0f8d7a6b", "Original Report Images error code: (22010).",
          "path: /thumbnails/jobs", "correlator: c3894e0a-0532-48d7-90c6-97d78e22e768"]}
  schemas:
    thumbnailRequest:
      title: Thumbnail Request
      description: A request to create a new job that creates or delivers a thumbnail.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.job.request
      required:
      - acceptItem
      - resourceUri
      properties:
        acceptItem:
          type: string
          description: >
            A media type string listing acceptable media types, possibly with quality
            values. Example:
            "image/*,text/plain;q=0.9,text/csv;q=0.8".
        resourceUri:
          type: string
          description: URI to the resource for which a thumbnail is needed.
        resourceType:
          type: string
          description: The SAS type of the resource for which a thumbnail is needed.
        detailLevel:
          type: string
          description: The expected level of detail. (default is "low")
          default: "low"
          enum:
          - low
          - high
        scope:
          type: string
          description: Whether a single element is to be represented, or the entire
            page. (default is "element")
          default: "element"
          enum:
          - element
          - page
        returnMultiple:
          type: boolean
          description: Whether a single thumbnail is to be returned (false) or multiple
            thumbnails (true). (default is false)
          default: false
        refresh:
          type: boolean
          description: Whether the freshest possible result is requested. (default
            is false)
          default: false
        sizingOptions:
          $ref: "#/components/schemas/sizingOptions"
        accessibilityOptions:
          $ref: "#/components/schemas/accessibilityOptions"
        themeId:
          type: string
          description: The client's current theme.
        pagingOptions:
          $ref: "#/components/schemas/pagingOptions"
        version:
          type: integer
          format: int32
          description: The version number of the thumbnail representation. This representation
            is version 1.
    thumbnailJob:
      title: Thumbnail Job
      description: The representation of a thumbnail job.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.job
        version: 1
      required:
      - id
      - state
      - links
      - version
      properties:
        id:
          type: string
          description: The generated id for this job.
        state:
          type: string
          description: The state of this job.
          enum:
          - pending
          - running
          - completed
          - failed
        thumbnails:
          type: array
          description: Thumbnail objects, typically 1 unless paging had been requested.
          items:
            $ref: "#/components/schemas/thumbnail"
        error:
          $ref: "#/components/schemas/error2"
        duration:
          type: number
          format: float
          description: duration, in seconds, of the job.
        defaultThumbnailSasThemesIconKey:
          type: string
          description: >
            A number of fully themed "icons" are available within SAS Clients. If
            provided, this is that representation and
            should be used in preference to the the image specified by link relation
            "defaultThumbnailImage".
        pagingState:
          $ref: "#/components/schemas/pagingState"
        links:
          type: array
          description: Link relations for this job. Expect 'self' and 'defaultThumbnailImage'.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          format: int32
          description: The version number of the thumbnail job. This representation
            is version 1.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    thumbnail:
      title: Thumbnail
      description: Information for retrieving a thumbnail.
      required:
      - state
      properties:
        state:
          type: string
          description: the state of this thumbnail
          enum:
          - pending
          - running
          - completed
          - failed
        error:
          $ref: "#/components/schemas/error2"
        modifiedTimeStamp:
          type: string
          description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format when
            the thumbnail was last modified.
          format: date-time
        links:
          type: array
          description: >
            Link relations for this thumbnail. Expect: 'thumbnail' (the thumbnail
            to pick up) and 'staleThumbnail' (an older
            thumbnail that can be picked up while a more current thumbnail is being
            prepared)
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    pagingOptions:
      title: Paging Options
      description: >
        Paging details for page-oriented requests. Note when included in a request,
        must be null
        if "returnMultiple" is false, must not be null if "returnMultiple" is true.
      type: object
      required:
      - start
      - limit
      properties:
        start:
          type: integer
          description: Start index, 0-based, of the first thumbnail to return.
        limit:
          type: integer
          description: Number of thumbnails to return in a single "page".
    pagingState:
      title: Paging State
      description: Object returned if paging had been requested
      type: object
      required:
      - start
      - limit
      - count
      properties:
        start:
          type: integer
          description: start index (0-based) of the first thumbnai.
        limit:
          type: integer
          description: number of thumbnails returned in a single "page"
        count:
          type: integer
          description: number of available thumbnails.
    sizingOptions:
      title: Sizing Options
      description: >
        Sizing options; providers should honor values suitable to the type of object
        for which they provide thumbnails, and
        clients should supply values suitable to their presentation needs.
      type: object
      properties:
        viewWidth:
          type: integer
          description: CSS Pixel image width.
        viewHeight:
          type: integer
          description: CSS Pixel image height.
        devicePixelRatio:
          type: number
          format: float
          default: 1.0
          description: device pixel ratio; some mobile devices support values greater
            than 1. (default is 1.0)
        maxTextCharacters:
          type: integer
          description: if plain text is returned, the maximum number of characters
            to return.
        maxTableColumns:
          type: integer
          description: if a table or other CSV presentation is returned, the maximum
            number of columns to return.
        maxTableRows:
          type: integer
          description: if a table or other CSV presentation is returned, the maximum
            number of rows to return.
    accessibilityOptions:
      title: Accessibility Options
      description: This object describes accessibility requests; providers are not
        required to honor this
      type: object
      properties:
        highContrast:
          type: boolean
          default: false
          description: indicates whether "high contrast" visual adjustments are desired.
            (default is false)
