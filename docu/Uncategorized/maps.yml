---
openapi: 3.0.3
info:
  version: "6"
  title: Maps
  description: >
    Returns polygonal shapes and centroids for selected identifiers in a given table,
    and manages settings for accessing geographic resources.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/maps
  description: local mock server
tags:
- name: Root
  description: The root of Maps Service.
- name: Geographic Features
  description: Retrieval of selected regions and centroids.
- name: Providers
  description: Add, Delete and Edit region map providers.
- name: Settings
  description: Query settings.
- name: Relationships
  description: Identify related resources.
- name: Catalog
  description: Resource metadata.
paths:
  /:
    get:
      operationId: root
      summary: API Root Resource
      description: API information.  Produces application/json and application/vnd.sas.api+json.
      tags:
      - Root
      responses:
        "200":
          description: Version information about the API, as well as top-level API
            entry points.
          headers:
            Content-Type:
              description: application/vnd.sas.api+json;version=1
              schema:
                $ref: "#/components/schemas/api"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/root"
    head:
      operationId: headersForRoot
      tags:
      - Root
      description: Check if maps service is available
      summary: Check if maps service is available
      responses:
        "200":
          description: OK.  Service is up and running.
          headers:
            Content-Type:
              description: application/vnd.sas.api+json;version=1
              schema:
                $ref: "#/components/schemas/api"
  /regions:
    get:
      operationId: getRegions
      summary: Return a selected list of polygons representing geographic map regions
      description: The polygons are countries or first administrative level for the
        country.  The regions returned can be generalized to a specific resolution.  This
        endpoint queries only the built-in geographic data tables included with VA,
        not custom content.
      tags:
      - Geographic Features
      parameters:
      - name: table
        in: query
        description: Name of the map table used for retrieval.
        required: true
        schema:
          type: string
      - name: idColumn
        in: query
        description: Name of column matching selected identifiers
        required: true
        schema:
          type: string
      - name: regionIds
        in: query
        description: "A |-separated list of ID values to retrieve."
        required: true
        schema:
          type: string
      - name: xRes
        in: query
        description: X resolution, in pixels, used for generalizing/reducing polygon
          complexity.
        required: true
        schema:
          type: integer
      - name: yRes
        in: query
        description: Y resolution, in pixels, used for generalizing/reducing polygon
          complexity.
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Successful response.  Schema is defined as [application/gml+xml](http://www.opengeospatial.org/standards/gml)
          headers:
            Content-Type:
              description: application/gml+xml
              schema:
                type: string
          content:
            application/gml+xml:
              schema:
                $ref: "#/components/schemas/featureCollection"
              examples:
                simplegml:
                  $ref: "#/components/examples/simplegml"
                threeUSRegions:
                  $ref: "#/components/examples/threeUSRegions"
                threeEuropeanRegions:
                  $ref: "#/components/examples/threeEuropeanRegions"
        "400":
          $ref: "#/components/responses/400MissingParameters"
        "404":
          $ref: "#/components/responses/404GenericNoMatchingIDs"
    head:
      operationId: headersForRegions
      description: Check to see if regions endpoint is responsive.
      summary: Check to see if regions endpoint is responsive
      tags:
      - Geographic Features
      parameters:
      - name: table
        in: query
        description: Name of the map table used for retrieval.
        required: true
        schema:
          type: string
      - name: idColumn
        in: query
        description: Name of column matching selected identifiers
        required: true
        schema:
          type: string
      - name: regionIds
        in: query
        description: "A |-separated list of ID values to retrieve."
        required: true
        schema:
          type: string
      - name: xRes
        in: query
        description: X resolution, in pixels, used for generalizing/reducing polygon
          complexity.
        required: true
        schema:
          type: integer
      - name: yRes
        in: query
        description: Y resolution, in pixels, used for generalizing/reducing polygon
          complexity.
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Successful response.  Schema is defined as [application/gml+xml](http://www.opengeospatial.org/standards/gml)
          headers:
            Content-Type:
              description: application/gml+xml
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/400MissingParameters"
        "404":
          $ref: "#/components/responses/404GenericNoMatchingIDs"
    post:
      operationId: getRegionsExtended
      summary: Return a selected list of polygons representing geographic map regions
      description: The regions returned can be generalized to a specific resolution.  This
        call is an extended GET operation and therefore idempotent and safe.  This
        endpoint queries only the built-in geographic data tables included with VA,
        not custom content.
      tags:
      - Geographic Features
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                table:
                  description: Name of the map table used for retrieval.
                  type: string
                idColumn:
                  description: Name of column matching selected identifiers
                  type: string
                regionIds:
                  description: "A |-separated list of ID values to retrieve."
                  type: string
                xRes:
                  description: X resolution, in pixels, used for generalizing/reducing
                    polygon complexity.
                  type: integer
                yRes:
                  description: Y resolution, in pixels, used for generalizing/reducing
                    polygon complexity.
                  type: integer
              required:
              - table
              - idColumn
              - regionIds
              - xRes
              - yRes
            examples:
              threeEuropeanRegions:
                summary: Three European Regions
                description: Three European regions (France, Germany, and Luxembourg)
                  returned from the query POST /maps/regions table=MAPSGFK.VAEUROPE&idColumn=ID&regionIds=DE%7CFR%7CLU&xRes=1280&yRes=1024
                value:
                  table: MAPSGFK.VAEUROPE
                  idColumn: ID
                  regionIds: DE,FR,LU
                  xRes: 1280
                  yRes: 1024
        required: true
      responses:
        "200":
          description: Successful response.  Schema is defined as [application/gml+xml](http://www.opengeospatial.org/standards/gml)
          content:
            application/gml+xml:
              schema:
                $ref: "#/components/schemas/featureCollection"
              examples:
                simplegml:
                  $ref: "#/components/examples/simplegml"
                threeUSRegions:
                  $ref: "#/components/examples/threeUSRegions"
                threeEuropeanRegions:
                  $ref: "#/components/examples/threeEuropeanRegions"
        "400":
          $ref: "#/components/responses/400MissingParameters"
        "404":
          $ref: "#/components/responses/404GenericNoMatchingIDs"
  /providers:
    get:
      operationId: getAllProviders
      summary: Return a list of custom region map providers (new since version 2)
      description: This endpoint will only return summary information about each map
        provider.
      tags:
      - Providers
      parameters:
      - name: start
        description: The index of the first item in this collection view, 0-based.
        in: query
        schema:
          type: integer
      - name: limit
        description: The number of items to return in each page.
        in: query
        schema:
          type: integer
      - name: filter
        in: query
        description: The criteria for filtering the items. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/maps-v2/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
          format: filter-criteria
      responses:
        "200":
          description: Returns a collection of application/vnd.sas.maps.provider.summary+json
            elements.
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/providers"
              examples:
                providerSummary:
                  $ref: "#/components/examples/providerSummary"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/providers"
              examples:
                providerSummary:
                  $ref: "#/components/examples/providerSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/providers"
              examples:
                providerSummary:
                  $ref: "#/components/examples/providerSummary"
    head:
      operationId: headersForProviders
      summary: Endpoint is available (new since version 2)
      description: The endpoint is available.  New since version 2.
      tags:
      - Providers
      parameters:
      - name: start
        description: The index of the first item in this collection view, 0-based.
        in: query
        schema:
          type: integer
      - name: limit
        description: The number of items to return in each page.
        in: query
        schema:
          type: integer
      - name: filter
        in: query
        description: The criteria for filtering the items. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/maps-v2/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
          format: filter-criteria
      responses:
        "200":
          description: OK.  Endpoint is available.
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                type: string
    post:
      operationId: createProvider
      summary: Add a new region map provider (new since version 2)
      description: Creates a relationship between this resource/endpoint and a map
        data provider -- either a table or Esri feature service.
      tags:
      - Providers
      parameters:
      - name: Esri-Token
        description: An optional authentication token for accessing Esri feature services.
        required: false
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.maps.provider+json:
            schema:
              $ref: "#/components/schemas/inputProvider"
            examples:
              postedProviderZip:
                $ref: "#/components/examples/postedProviderZip"
              postedProviderEsri:
                $ref: "#/components/examples/postedProviderEsri"
          application/json:
            schema:
              $ref: "#/components/schemas/inputProvider"
            examples:
              postedProviderZip:
                $ref: "#/components/examples/postedProviderZip"
              postedProviderEsri:
                $ref: "#/components/examples/postedProviderEsri"
        description: The provider to be created.
        required: true
      responses:
        "201":
          description: Creation successful
          headers:
            ETag:
              description: A tag that identifies this revision of the object.
              schema:
                type: string
            Location:
              description: The URI of the newly created provider.
              schema:
                type: string
          content:
            application/vnd.sas.maps.provider+json:
              schema:
                $ref: "#/components/schemas/provider"
              examples:
                postedProviderZipResponse:
                  $ref: "#/components/examples/postedProviderZipResponse"
                postedProviderEsriResponse:
                  $ref: "#/components/examples/postedProviderEsriResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/provider"
              examples:
                postedProviderZipResponse:
                  $ref: "#/components/examples/postedProviderZipResponse"
                postedProviderEsriResponse:
                  $ref: "#/components/examples/postedProviderEsriResponse"
        "400":
          description: The provider name is invalid.  Resource can not be created.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example: {"details": ["path: /maps/providers", "correlator: 01a620ea-cca3-4954-9158-44c388d05a9c"],
                "errorCode": 15108, "httpStatusCode": 400, "message": 'The body member
                  "ProviderSummaryRep.name" is missing or does not have a value.',
                "version": 2}
        "409":
          description: Already exists (name conflict)
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example: {"details": ["path: /maps/providers", "correlator: e45c71c4-0179-4163-9639-c0faec907399"],
                "errorCode": 15106, "httpStatusCode": 409, "message": 'Provider named
                  "zip" already exists.', "version": 2}
  "/providers/{providerName}":
    get:
      operationId: getProvider
      summary: Return the details of a custom region map provider (new since version
        2)
      description: This will return detailed information about this map provider,
        including the data source and any associated columns.
      tags:
      - Providers
      parameters:
      - $ref: "#/components/parameters/providerName"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: A tag that identifies this revision of the object.
              schema:
                type: string
          content:
            application/vnd.sas.maps.provider+json:
              schema:
                $ref: "#/components/schemas/provider"
              example: {"casTableUri": "/servers/cas-shared-default/caslibs/HPS/tables/boise",
                "coordinateSpace": "EPSG:4326", "createdBy": "unittest", "creationTimeStamp": "2023-07-18T17:27:13.582149Z",
                "geometryType": "polygon", "idColumn": "OBJECTID", "label": "Boise,\
                  \ Idaho shapes (CAS)", "links": [{"method": "GET", "rel": "self",
                    "href": "/maps/providers/boise", "uri": "/maps/providers/boise",
                    "type": "application/vnd.sas.maps.provider+json"}, {"method": "GET",
                    "rel": "alternate", "href": "/maps/providers/boise", "uri": "/maps/providers/boise",
                    "type": "application/vnd.sas.maps.provider.summary+json"}, {"method": "PUT",
                    "rel": "update", "href": "/maps/providers/boise", "uri": "/maps/providers/boise",
                    "type": "application/vnd.sas.maps.provider+json", "responseType": "application/vnd.sas.maps.provider+json"},
                  {"method": "DELETE", "rel": "delete", "href": "/maps/providers/boise",
                    "uri": "/maps/providers/boise"}, {"method": "POST", "rel": "confidence",
                    "href": "/maps/providers/boise/confidence", "uri": "/maps/providers/boise/confidence",
                    "type": "application/vnd.sas.maps.provider.confidence+json", "responseType": "application/vnd.sas.maps.provider.confidence+json"},
                  {"method": "GET", "rel": "up", "href": "/maps/providers", "uri": "/maps/providers",
                    "type": "application/vnd.sas.collection+json", "itemType": "application/vnd.sas.maps.provider.summary+json"},
                  {"method": "GET", "rel": "regions", "href": "/maps/providers/boise/regions",
                    "uri": "/maps/providers/boise/regions", "type": "application/gml+xml"},
                  {"method": "POST", "rel": "regionsExtended", "href": "/maps/providers/boise/regions",
                    "uri": "/maps/providers/boise/regions", "type": "application/x-www-form-urlencoded",
                    "responseType": "application/gml+xml"}, {"method": "GET", "rel": "centroids",
                    "href": "/maps/providers/boise/centroids", "uri": "/maps/providers/boise/centroids",
                    "type": "application/vnd.sas.maps.provider.centroids+json"}, {
                    "method": "POST", "rel": "centroidsExtended", "href": "/maps/providers/boise/centroids",
                    "uri": "/maps/providers/boise/centroids", "type": "application/x-www-form-urlencoded",
                    "responseType": "application/vnd.sas.maps.provider.centroids+json"},
                  {"method": "GET", "rel": "relationships", "href": "/maps/commons/relationships/providers/boise",
                    "uri": "/maps/commons/relationships/providers/boise", "type": "application/vnd.sas.collection+json",
                    "itemType": "application/vnd.sas.relationship+json"}], "modifiedBy": "unittest",
                "modifiedTimeStamp": "2023-07-18T17:27:13.582149Z", "name": "boise",
                "segmentColumn": "SEGMENT", "sequenceColumn": "SEQUENCE", "type": "casTableReference",
                "version": 3, "xColumn": "X", "yColumn": "Y"}
            application/json:
              schema:
                $ref: "#/components/schemas/provider"
              example: {"casTableUri": "/servers/cas-shared-default/caslibs/HPS/tables/boise",
                "coordinateSpace": "EPSG:4326", "createdBy": "unittest", "creationTimeStamp": "2023-07-18T17:27:13.582149Z",
                "geometryType": "polygon", "idColumn": "OBJECTID", "label": "Boise,\
                  \ Idaho shapes (CAS)", "links": [{"method": "GET", "rel": "self",
                    "href": "/maps/providers/boise", "uri": "/maps/providers/boise",
                    "type": "application/vnd.sas.maps.provider+json"}, {"method": "GET",
                    "rel": "alternate", "href": "/maps/providers/boise", "uri": "/maps/providers/boise",
                    "type": "application/vnd.sas.maps.provider.summary+json"}, {"method": "PUT",
                    "rel": "update", "href": "/maps/providers/boise", "uri": "/maps/providers/boise",
                    "type": "application/vnd.sas.maps.provider+json", "responseType": "application/vnd.sas.maps.provider+json"},
                  {"method": "DELETE", "rel": "delete", "href": "/maps/providers/boise",
                    "uri": "/maps/providers/boise"}, {"method": "POST", "rel": "confidence",
                    "href": "/maps/providers/boise/confidence", "uri": "/maps/providers/boise/confidence",
                    "type": "application/vnd.sas.maps.provider.confidence+json", "responseType": "application/vnd.sas.maps.provider.confidence+json"},
                  {"method": "GET", "rel": "up", "href": "/maps/providers", "uri": "/maps/providers",
                    "type": "application/vnd.sas.collection+json", "itemType": "application/vnd.sas.maps.provider.summary+json"},
                  {"method": "GET", "rel": "regions", "href": "/maps/providers/boise/regions",
                    "uri": "/maps/providers/boise/regions", "type": "application/gml+xml"},
                  {"method": "POST", "rel": "regionsExtended", "href": "/maps/providers/boise/regions",
                    "uri": "/maps/providers/boise/regions", "type": "application/x-www-form-urlencoded",
                    "responseType": "application/gml+xml"}, {"method": "GET", "rel": "centroids",
                    "href": "/maps/providers/boise/centroids", "uri": "/maps/providers/boise/centroids",
                    "type": "application/vnd.sas.maps.provider.centroids+json"}, {
                    "method": "POST", "rel": "centroidsExtended", "href": "/maps/providers/boise/centroids",
                    "uri": "/maps/providers/boise/centroids", "type": "application/x-www-form-urlencoded",
                    "responseType": "application/vnd.sas.maps.provider.centroids+json"},
                  {"method": "GET", "rel": "relationships", "href": "/maps/commons/relationships/providers/boise",
                    "uri": "/maps/commons/relationships/providers/boise", "type": "application/vnd.sas.collection+json",
                    "itemType": "application/vnd.sas.relationship+json"}], "modifiedBy": "unittest",
                "modifiedTimeStamp": "2023-07-18T17:27:13.582149Z", "name": "boise",
                "segmentColumn": "SEGMENT", "sequenceColumn": "SEQUENCE", "type": "casTableReference",
                "version": 3, "xColumn": "X", "yColumn": "Y"}
        "404":
          $ref: "#/components/responses/404GenericNoMatchingProvider"
    head:
      operationId: headersForProvider
      summary: Check to see if provider endpoint is responsive (new since version
        2)
      description: Check to see if provider endpoint is responsive.  New since version
        2.
      tags:
      - Providers
      parameters:
      - $ref: "#/components/parameters/providerName"
      responses:
        "200":
          description: Resource exists
          headers:
            ETag:
              description: A tag that identifies this revision of the object.
              schema:
                type: string
        "404":
          $ref: "#/components/responses/404GenericNoMatchingProvider"
    put:
      operationId: updateProvider
      summary: Update the custom region map provider (new since version 2)
      description: Makes appropfiate changes to the map provider, including the data
        source and any associated columns.
      tags:
      - Providers
      parameters:
      - $ref: "#/components/parameters/providerName"
      - name: Esri-Token
        description: An optional authentication token for accessing Esri feature services.
        required: false
        in: header
        schema:
          type: string
      - name: If-Match
        in: header
        description: The etag that was returned from a GET, POST or PUT of this report.  If
          the etag does not match, the update will fail.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.maps.provider+json:
            schema:
              $ref: "#/components/schemas/inputProvider"
            examples:
              postedProviderZip:
                $ref: "#/components/examples/postedProviderZip"
              postedProviderEsri:
                $ref: "#/components/examples/postedProviderEsri"
          application/json:
            schema:
              $ref: "#/components/schemas/inputProvider"
            examples:
              postedProviderZip:
                $ref: "#/components/examples/postedProviderZip"
              postedProviderEsri:
                $ref: "#/components/examples/postedProviderEsri"
        required: true
      responses:
        "200":
          description: Change accepted
          headers:
            ETag:
              description: A tag that identifies this revision of the object.
              schema:
                type: string
          content:
            application/vnd.sas.maps.provider+json:
              schema:
                $ref: "#/components/schemas/provider"
              examples:
                postedProviderZipResponse:
                  $ref: "#/components/examples/postedProviderZipResponse"
                postedProviderEsriResponse:
                  $ref: "#/components/examples/postedProviderEsriResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/provider"
              examples:
                postedProviderZipResponse:
                  $ref: "#/components/examples/postedProviderZipResponse"
                postedProviderEsriResponse:
                  $ref: "#/components/examples/postedProviderEsriResponse"
        "400":
          description: Bad input
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example: {"details": ["path: /maps/providers", "correlator: 01a620ea-cca3-4954-9158-44c388d05a9c"],
                "errorCode": 15108, "httpStatusCode": 400, "message": 'The body member
                  "ProviderSummaryRep.name" is missing or does not have a value.',
                "version": 2}
        "412":
          description: Precondition failed, If-Match condition not met.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example: {"details": ["path: /maps/providers/esriusstatesfips", "correlator:\
                    \ 5bdc9a1b-449d-4660-8449-77503af2e11c"], "errorCode": 15107,
                "httpStatusCode": 412, "message": 'The header field "If-Match" has
                  a value that is different from the entity tag for the resource.
                  (The specified values are "W/"644540ffe1feaf371195946a841c1c0b""
                  and ""a46becb7032bddbc7fe6a540d2ec0bf6"", respectively.)', "version": 2}
        "428":
          description: Precondition required, no If-Match condition found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example: {"details": ["path: /maps/providers/esriusstatesfips", "correlator:\
                    \ 26450784-ec54-4995-878c-950d4d3faabd"], "errorCode": 15109,
                "httpStatusCode": 428, "message": 'The header field "If-Match" is
                  missing or does not have a value.', "remediation": "Specify the\
                  \ resource's entity tag.", "version": 2}
    delete:
      operationId: deleteProvider
      summary: Remove the custom region map provider (new since version 2)
      description: Removes the resource from the server, but not any associated data
        sources.
      tags:
      - Providers
      parameters:
      - $ref: "#/components/parameters/providerName"
      responses:
        "204":
          description: OK - resource removed
  "/providers/{providerName}/regions":
    get:
      operationId: getCustomRegions
      summary: Return a selected list of polygons representing geographic map regions
        (new since version 2)
      description: The regions returned can be generalized to a specific resolution.  Valid
        for all providers having the geometryType "polygon".
      tags:
      - Geographic Features
      parameters:
      - $ref: "#/components/parameters/providerName"
      - name: regionIds
        in: query
        description: "A |-separated list of ID values to retrieve."
        required: true
        schema:
          type: string
      - name: xRes
        in: query
        description: X resolution, in pixels, used for generalizing/reducing polygon
          complexity.
        required: false
        schema:
          type: integer
      - name: yRes
        in: query
        description: Y resolution, in pixels, used for generalizing/reducing polygon
          complexity.
        required: false
        schema:
          type: integer
      - name: Esri-Token
        in: header
        description: Esri token to retrieve features, if necessary.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response.  Schema is defined [application/gml+xml](http://www.opengeospatial.org/standards/gml).
          headers:
