        content:
          application/vnd.sas.maps.provider.confidence+json:
            schema:
              $ref: "#/components/schemas/confidenceRequest"
            example:
              version: 1
              maxUnmatched: 100
              unmatchedValues: [12345, 60145, 60146]
          application/json:
            schema:
              $ref: "#/components/schemas/confidenceRequest"
            example:
              version: 1
              maxUnmatched: 100
              unmatchedValues: [12345, 60145, 60146]
        description: The values to be checked.
