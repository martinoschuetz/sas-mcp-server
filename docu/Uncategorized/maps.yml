components:
  parameters:
    providerName:
      name: providerName
      in: path
      description: The unique name for the custom region map provider.
      required: true
      schema:
        type: string
  schemas:
    error:
      $ref: "#/components/schemas/error2"
    inputProvider:
      type: object
      description: The input portion for the PUT/POST for providers.
      x-sas-media-type:
        name: application/vnd.sas.maps.provider
        version: 3
      required:
      - name
      - type
      - geometryType
      - idColumn
      properties:
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 3.
        name:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[^\/]+$'
          description: Name of the map provider.  This is used in the context path
            for region retrieval and will be encoded if necessary
        label:
          type: string
          maxLength: 1000
          description: The user-readable entry name.
        type:
          type: string
          enum:
          - esriFeatureService
          - casTableReference
          description: The type of region map provider - either CAS table or Esri
            Feature Service
        geometryType:
          type: string
          enum:
          - point
          - polygon
          - polyline
          description: The type of geometric data present in either the CAS table
            or the Esri Feature Service.  New since version 3.
        casTableUri:
          type: string
          maxLength: 500
          description: The URI of the CAS table that contains the region map data.  This
            is required if the type is casTableReference.
        coordinateSpace:
          type: string
          maxLength: 1024
          description: The coordinate space for the vertices of the region.  Default
            is "EPSG:4326".
        featureServiceUrl:
          type: string
          maxLength: 500
          format: uri
          description: REST API endpoint to the Esri Feature Service.  This is required
            if the type is esriFeatureService.
        idColumn:
          type: string
          minLength: 1
          maxLength: 256
          description: Column in the data that identifies each region.
        sequenceColumn:
          type: string
          maxLength: 32
          description: Column that identifies the proper sequence order to return
            vertices in polygons.  This is required if the type is casTableReference.
        segmentColumn:
          type: string
          maxLength: 256
          description: Column that identifies each segment of a multi-polygon set.  The
            default value is "SEGMENT".
        xColumn:
          type: string
          maxLength: 256
          description: Column representing the X-coordinate.  The default value is
            "X".
        yColumn:
          type: string
          maxLength: 256
          description: Column representing the Y-coordinate.  The default value is
            "Y".
      example:
        name: zip
        label: US Zip Code boundaries
        type: casTableReference
        geometryType: polygon
        casTableUri: /servers/default-cas-server/caslibs/myLib/tables/uszip
        idColumn: zcta
        sequenceColumn: __seq__
        xColumn: LONG
        yColumn: LAT
        coordinateSpace: EPSG:4326
    provider:
      allOf:
      - $ref: "#/components/schemas/inputProvider"
      - description: Information and settings for a custom region map provider.
        properties:
          createdBy:
            type: string
            description: The user ID that created this map provider.
          modifiedBy:
            type: string
            description: The user ID that last modified this map provider.
          creationTimeStamp:
            type: string
            format: date-time
            description: The time stamp when this map provider was created.
          modifiedTimeStamp:
            type: string
            format: date-time
            description: The time stamp when this map provider was last modified.
          links:
            type: array
            description: Zero or more links to related resources or operations. See
              the above link relations table for a description of the link types.
        example:
          version: 3
          name: zip
          label: US Zip Code boundaries
          type: casTableReference
          geometryType: polygon
          idColumn: zcta
          sequenceColumn: __seq__
          segmentColumn: SEGMENT
          xColumn: LONG
          yColumn: LAT
          casTableUri: /servers/default-cas-server/caslibs/myLib/tables/uszip
          coordinateSpace: EPSG:4326
          createdBy: admin
          creationTimeStamp: 2016-08-17T03:27:41Z
          modifiedBy: admin
          modifiedTimeStamp: 2016-08-17T03:27:41Z
          links:
          - href: /maps/providers/{providerName}
            method: GET
            rel: self
            uri: /maps/providers/{providerName}
            type: application/vnd.sas.maps.provider+json
          - href: /maps/providers/{providerName}
            method: PUT
            rel: update
            uri: /maps/providers/{providerName}
            type: application/vnd.sas.maps.provider+json
            responseType: application/vnd.sas.maps.provider+json
          - href: /maps/providers/{providerName}
            method: DELETE
            rel: delete
            uri: /maps/providers/{providerName}
    providerSummary:
      type: object
      description: The summarized version of a custom region map provider.
      x-sas-media-type:
        name: application/vnd.sas.maps.provider.summary
        version: 1
      required:
      - version
      - name
      - label
      - geometryType
      properties:
        version:
          type: integer
          format: int32
          description: This media type's schema version number.  This representation
            is version 2.
        name:
          type: string
          description: Name of the map provider.  This is used in the context path
            for region retrieval and will be encoded if necessary.
        label:
          type: string
          description: The user-readable entry name.
        geometryType:
          type: string
          enum:
          - point
          - polygon
          - polyline
          description: The type of geometric data present in either the CAS table
            or the Esri Feature Service.  New since version 3.
    attributeCollection:
      description: Represents attribute data from a geographic provider.
      x-sas-media-type:
        name: application/vnd.sas.maps.attribute.collection
        version: 1
      type: object
      properties:
        columns:
          type: array
          description: The attribute columns.
          items:
            type: object
            properties:
              name:
                type: string
              "type":
                type: string
                enum:
                - string
                - number
        rows:
          type: array
          description: The attribute rows (in column order).
          items:
            type: array
            items:
              oneOf:
              - type: string
              - type: number
    providerConfidence:
      description: Represents data matching confidence for the provider.
      x-sas-media-type:
        name: application/vnd.sas.maps.provider.confidence
        version: 1
      allOf:
      - $ref: "#/components/schemas/confidenceRequest"
      - type: object
        required:
        - version
        - unmatchedCount
        - unmatchedPercent
        properties:
          unmatchedCount:
            type: integer
            description: The total number of input values that were not matched to
              regionId values in the provider.
          unmatchedPercent:
            type: number
            format: double
            description: The percentage of input values that were not matched to regionId
              values in the provider.
        example:
          version: 1
          unmatchedPercent: 0.25
          unmatchedCount: 1
          maxUnmatched: 5
          unmatchedValues:
          - ZZ
    confidenceRequest:
      type: object
      description: Input for creating data matching confidence for the provider.
      x-sas-media-type:
        name: application/vnd.sas.maps.provider.confidence
        version: 1
      required:
      - unmatchedValues
      properties:
        version:
          type: integer
          format: int32
          description: This media type's schema version number.  This representation
            is version 1.
        maxUnmatched:
          type: integer
          format: int32
          description: The maximum number of unmatched values to return.  A negative
            number indicates to return all unmatched request values.  The default
            is 5.
        unmatchedValues:
          type: array
          items:
            oneOf:
            - type: string
            - type: number
          description: A list of input values to match to identifiers in the provider.  This
            can be numeric or text and should match the data type of the regionIds
            in the provider.  A mismatch will result in a 400 return code.
      example:
        version: 1
        unmatchedValues:
        - US
        - CA
        - MX
        - ZZ
    relationship:
      type: object
      description: A dependency of a provider.
      x-sas-media-type:
        name: application/vnd.sas.relationship
        version: 1
      required:
      - type
      - version
      - relatedResourceUri
      - resourceUri
      properties:
        version:
          type: integer
          format: int32
          description: This media type's schema version number.  This representation
            is version 1.
        type:
          type: string
          description: The type of relationship.  Currently the service only returns
            dependencies.
        resourceUri:
          type: string
          description: The URI that is using this relationship.
        relatedResourceUri:
          type: string
          description: The URI of the relationship/dependency.
      example:
        version: 1
        type: Dependent
        resourceUri: /maps/providers/myProvider
        relatedResourceUri: /casManagement/servers/myServer/caslibs/MyCASLib/tables/MYTABLE
    providers:
      type: object
      description: The list of custom region map providers returned by the /maps service.
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      properties:
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 2.
        accept:
          type: string
          description: The media type name of the items, also provided as "Content-Item-Type"
            response header.
        count:
          type: integer
          description: The number of items in the collection. May be omitted if the
            count is not known or expensive to compute.
        start:
          type: integer
          description: The index of the first item in this collection view, 0-based.
        limit:
          type: integer
          description: The number of items to return in each page.
        name:
          type: string
          description: The abstract name of the collection; what the "items" member
            represents.
        items:
          type: array
          description: The items in this page of the collection. The items in the
            list have a type as listed in the accept list of types.
          additionalProperties:
            $ref: "#/components/schemas/providerSummary"
        links:
          type: array
          description: Zero or more links to related resources or operations. See
            the above link relations table for a description of the link types.
      example:
        version: 2
        count: 3
        start: 0
        limit: 3
        name: providers
        accept: application/vnd.sas.maps.provider.summary
        items:
        - name: zip
          label: Zip Codes
          hasRegions: true
          version: 2
        - name: sales
          label: Sales Regions
          hasRegions: true
          version: 2
        - name: nycounty
          label: New York Counties
          version: 2
          hasRegions: true
        - name: stores
          label: Acme store locations
          hasRegions: false
          version: 2
        links:
        - href: http://www.example.com/maps/providers
          method: GET
          rel: self
          uri: /maps/providers
          type: application/vnd.sas.collection+json
          itemType: application/vnd.sas.maps.provider.summary+json
        - href: http://www.example.com/maps/providers
          method: POST
          rel: create
          uri: /maps/providers
          type: application/vnd.sas.maps.provider+json
          responseType: application/vnd.sas.maps.provider+json
    relationships:
      type: object
      description: The list of dependencies for a map provider.
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      properties:
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 2.
        accept:
          type: string
          description: The media type name of the items, also provided as "Content-Item-Type"
            response header.
        count:
          type: integer
          description: The number of items in the collection. May be omitted if the
            count is not known or expensive to compute.
        start:
          type: integer
          description: The index of the first item in this collection view, 0-based.
        limit:
          type: integer
          description: The number of items to return in each page.
        name:
          type: string
          description: The abstract name of the collection; what the "items" member
            represents.
        items:
          type: array
          description: The items in this page of the collection. The items in the
            list have a type as listed in the accept list of types.
          additionalProperties:
            $ref: "#/components/schemas/relationship"
        links:
          type: array
          description: Zero or more links to related resources or operations. See
            the above link relations table for a description of the link types.
      example:
        version: 2
        count: 1
        start: 0
        limit: 1
        name: relationships
        accept: application/vnd.sas.relationship
        items:
        - resourceUri: /maps/providers/myProvider
          type: Dependent
          relatedResourceUri: /casManagement/servers/myServer/caslibs/MyCASLib/tables/MYTABLE
          version: 1
        links:
        - href: http://www.example.com/maps/commons/relationships/providers/myProvider
          method: GET
          rel: self
          uri: /maps/commons/relationships/providers/myProvider
          type: application/vnd.sas.collection+json
          itemType: application/vnd.sas.relationship+json
        - href: http://www.example.com/maps/commons/relationships/providers/myProvider
          method: GET
          rel: collection
          uri: /maps/commons/relationships/providers/myProvider
          itemType: application/vnd.sas.relationship+json
          type: application/vnd.sas.collection+json
    centroid:
      description: An identifier with an associated X/Y location.  New in version
        3.
      type: object
      required:
      - centroidId
      - x
      - "y"
      properties:
        centroidId:
          oneOf:
          - type: string
          - type: number
          description: A list of identifiers representing points or centroids.  The
            value may be string or numeric.
        x:
          type: number
          format: double
          description: The horizontal coordinate for the associated identifier.
        "y":
          type: number
          format: double
          description: The vertical coordinate for the associated identifier.
    centroids:
      description: An object representing a coordinate space and a list of identifiers
        along with their geographic location.
      type: object
      x-sas-media-type:
        name: application/vnd.sas.maps.provider.centroids
        version: 1
      required:
      - coordinateSpace
      - centroids
      properties:
        version:
          type: integer
          format: int32
          description: This media type's schema version number.  This representation
            is version 1.
        coordinateSpace:
          type: string
          description: A string representing the coordinate space of the centroid
            values being returned.  This may be a pre-defined ID or a Proj.4 string.
        centroids:
          type: array
          items:
            $ref: "#/components/schemas/centroid"
          description: A list of centroids, including the identifier.
    customOSM:
      description: Defines settings for a custom OpenStreetMap server.
      type: object
      required:
      - maxResolution
      - numResolutions
      - servers
      properties:
        maxResolution:
          type: number
          format: double
          default: 156543.0339
          description: The maximum defined resolution on the server
        numResolutions:
          type: integer
          format: int32
          default: 18
          description: The number of levels of resolution defined on the server.
        servers:
          type: string
          description: A comma-separated list of URLs for requesting tiles.
    attributesMap:
      type: object
      description: The actual settings for this service
      required:
      - defaultOSMCommunicationProtocol
      - useArcGISOnlineMaps
      properties:
        defaultOSMCommunicationProtocol:
          type: string
          default: https
          description: The protocol to use to communicate with the default SAS-supplied
            OSM servers.
        localEsriServicesUrl:
          type: string
          description: The URL for the local Esri map services instance. The URL consists
            of a protocol, host, port, and path (for example, http://myserver:6080/arcgis/rest/services/).
        localEsriServicesRequiresAuthentication:
          type: boolean
          description: Specifies whether the local Esri map services URL requires
            an authentication token for access.
        localEsriServicesUrlUsesSSO:
          type: boolean
          description: Specifies whether the connection to the local Esri map service
            uses single sign-on for authentication.
        localEsriGeocodeServicesUrl:
          type: string
          description: The URL for the local Esri Geocoding service. The URL consists
            of a protocol, host, port, and path (for example, http://myserver:6080/arcgis/rest/services/myService/GeocodeServer).
        localEsriRoutingUrl:
          type: string
          description: The URL for the local Esri Routing services. The URL consists
            of a protocol, host, port, and path (for example, http://myserver:6080/arcgis/rest/services/myService/NAServer).
        localEsriGeoEnrichmentUrl:
          type: string
          description: The URL for the local Esri GeoEnrichment service. The URL consists
            of a protocol, host, port, and path (for example, http://myserver:6080/arcgis/rest/services/myService/GeoenrichmentServer).
        useArcGISOnlineMaps:
          type: boolean
          default: true
          description: Allow access to Esri's ArcGIS Online maps catalog.
        customOSM:
          $ref: "#/components/schemas/customOSM"
    settings:
      title: The settings for the Maps service
      description: Settings exposed for consumption of geographic maps
      x-sas-media-type:
        name: application/vnd.sas.attributes
        version: 1
      required:
      - version
      - links
      - attributes
      properties:
        version:
          type: integer
          format: int32
          description: Version information for this attribute list
        links:
          $ref: "#/components/schemas/links"
        attributes:
          $ref: "#/components/schemas/attributesMap"
      example:
        version: 1
        links:
        - method: GET
          rel: self
          href: /maps/commons/settings
          uri: /maps/commons/settings
        attributes:
          defaultOSMCommunicationProtocol: https
          localEsriServicesUrl: http://example.sas.com:6080/arcgis/rest/services
          localEsriGeocodeServicesUrl: http://example.sas.com:6080/arcgis/rest/services/myService/GeocodeServer
          localEsriRoutingUrl: http://example.sas.com:6080/arcgis/rest/services/myService/NAServer
          localEsriGeoEnrichmentUrl: http://example.sas.com:6080/arcgis/rest/services/myService/GeoenrichmentServer
          useArcGISOnlineMaps: true
          customOSM:
            maxResolution: 156543.0339
            numResolutions: 18
            servers: http://a.tile.myorg.com, http://b.tile.myorg.com, http://c.tile.myorg.com
    api:
      title: The root of an API
      description: A list of links to available resources.
      type: object
      required:
      - version
      - links
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      properties:
        version:
          type: integer
          format: int32
          description: This media type's schema version number.  This representation
            is version 1.
        links:
          $ref: "#/components/schemas/links"
    links:
      type: array
      items:
        $ref: "#/components/schemas/link"
      description: Zero or more links to related resources/actions
      example:
      - method: GET
        rel: self
        href: /maps
        uri: /maps
        type: application/vnd.sas.api+json
      - method: GET
        rel: regions
        href: /maps/regions
        uri: /maps/regions
        type: application/gml+xml
      - method: POST
        rel: regionsExtended
        href: /maps/regions
        uri: /maps/regions
        type: application/x-www-form-urlencoded
        responseType: application/gml+xml
      - method: GET
        rel: settings
        href: /maps/commons/settings
        uri: /maps/commons/settings
        type: application/vnd.sas.attributes+json
      - method: GET
        rel: providers
        href: /maps/providers
        uri: /maps/providers
        type: application/vnd.sas.collection+json
        itemType: application/vnd.sas.maps.provider.summary+json
      - method: POST
        rel: addProvider
        href: /maps/providers
        uri: /maps/providers
        type: application/vnd.sas.maps.provider+json
        responseType: application/vnd.sas.maps.provider+json
      - method: PUT
        rel: updateProvider
        href: /maps/providers/{providerName}
        uri: /maps/providers/{providerName}
        type: application/vnd.sas.maps.provider+json
        responseType: application/vnd.sas.maps.provider+json
      - method: DELETE
        rel: deleteProvider
        href: /maps/providers/{providerName}
        uri: /maps/providers/{providerName}
      - method: GET
        rel: customRegions
        href: /maps/providers/{providerName}/regions
        uri: /maps/providers/{providerName}/regions
        type: application/gml+xml
      - method: POST
        rel: customRegionsExtended
        href: /maps/providers/{providerName}/regions
        uri: /maps/providers/{providerName}/regions
        type: application/x-www-form-urlencoded
        responseType: application/gml+xml
      - method: GET
        rel: customCentroids
        href: /maps/providers/{providerName}/centroids
        uri: /maps/providers/{providerName}/centroids
        type: application/vnd.sas.maps.provider.centroids+json
      - method: POST
        rel: providerConfidence
        href: /maps/providers/{providerName}/confidence
        uri: /maps/providers/{providerName}/confidence
        type: application/vnd.sas.maps.provider.confidence+json
        responseTYpe: applilcation/vnd.sas.maps.provider.confidence+json
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    featureCollection:
      title: FeatureCollection
      type: object
      description: An object with information defining a set of geographic features.
      properties:
        boundedBy:
          type: object
          properties:
            "null":
              type: string
              example: unknown
          xml:
            prefix: gml
        featureMember:
          type: array
          items:
            type: object
            properties:
              sasgeom:
                type: object
                properties:
                  ID:
                    type: string
                    example: US-01
                  the_geom:
                    type: object
                    description: See http://schemas.opengis.net/gml
          xml:
            prefix: gml
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
  responses:
    "400MissingParameters":
      description: One or more arguments is invalid.
      headers:
        Content-Type:
          description: application/vnd.sas.error+json
          schema:
            type: string
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example: {"version": 2, "httpStatusCode": 400, "errorCode": 15111, "message": "Missing\
              \ required parameters.", "details": ["path: /maps", "correlator: a4fc2b49-4a63-4bd1-9009-1d404fb9d8eb"]}
    "404NoRegionMatch":
      description: No results matched the provided IDs.
      headers:
        Content-Type:
          description: application/vnd.sas.error+json
          schema:
            type: string
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example: {"version": 2, "httpStatusCode": 404, "errorCode": 15112, "message": "Error\
              \ processing map regions request: No matching identifiers found.", "details": [
              "path: /maps/providers/boise/regions", "correlator: 17a62103-173e-412a-938d-a4c6d69d034b"]}
    "404GenericNoMatchingIDs":
      description: No results matched the provided IDs.
      headers:
        Content-Type:
          description: application/vnd.sas.error+json
          schema:
            type: string
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example: {"version": 2, "httpStatusCode": 404, "errorCode": 15112, "message": "No\
              \ matching identifiers found.", "details": ["path: /maps", "correlator:\
                \ 17a62103-173e-412a-938d-a4c6d69d034b"]}
    "404GenericNoMatchingProvider":
      description: No results matched the provided IDs.
      headers:
        Content-Type:
          description: application/vnd.sas.error+json
          schema:
            type: string
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example: {"version": 2, "httpStatusCode": 404, "errorCode": 15105, "message": "No\
              \ provider matches the specified name.", "details": ["path: /maps",
              "correlator: 9528b6a1-c61b-4730-a2b2-fb7e9c1951ca"]}
    "404NoCentroidMatch":
      description: No results matched the provided IDs.
      headers:
        Content-Type:
          description: application/vnd.sas.error+json
          schema:
            type: string
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example: {"version": 2, "httpStatusCode": 404, "errorCode": 15102, "message": "No\
              \ matching identifiers found.", "details": ["path: /maps/providers/boise/centroids",
              "correlator: e8fae7a6-5276-4c09-bfc8-36538aa02361"]}
    "200ProviderCentroids":
      description: Successful response.
      headers:
        Content-Type:
          description: application/vnd.sas.maps.provider.centroids+json
          schema:
            type: string
      content:
        application/vnd.sas.maps.provider.centroids+json:
          schema:
            $ref: "#/components/schemas/centroids"
          example:
            version: 1
            coordinateSpace: EPSG:4326
            centroids:
            - centroidId: NC
              x: -76.432456
              "y": 36.09384
            - centroidId: VA
              x: -76.00236
              "y": 38.295394
            - centroidId: SC
              x: -78.200938
              "y": 35.98374
        application/json:
          schema:
            $ref: "#/components/schemas/centroids"
          example:
            version: 1
            coordinateSpace: EPSG:4326
            centroids:
            - centroidId: NC
              x: -76.432456
              "y": 36.09384
            - centroidId: VA
              x: -76.00236
              "y": 38.295394
            - centroidId: SC
              x: -78.200938
              "y": 35.98374
  examples:
    root:
      description: Example result from calling "/"
      value: {"links": [{"method": "GET", "rel": "settings", "href": "/maps/commons/settings",
            "uri": "/maps/commons/settings", "type": "application/vnd.sas.attributes+json"},
          {"method": "GET", "rel": "regions", "href": "/maps/regions", "uri": "/maps/regions",
            "type": "application/gml+xml"}, {"method": "POST", "rel": "regions", "href": "/maps/regions",
            "uri": "/maps/regions", "type": "application/x-www-form-urlencoded", "responseType": "application/gml+xml"},
