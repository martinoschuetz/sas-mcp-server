  "/providers/{providerName}/centroids/state":
    get:
      operationId: getCentroidCacheState
      summary: Return the state of a provider's centroid cache (new since version
        3)
      description: Return the state of a provider's centroid cache.  Returns loaded
        or unloaded to indicate the state.  Loaded means any centroid has been cached,
        not necessarily all centroids.  This is primarily used to validate a cache
        state change.  Not all providers cache centroids.
      tags:
      - Providers
      parameters:
      - name: providerName
        description: Name of the provider whose centroid cache state is being returned.
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The requested action was successful. The state is returned.
            Valid values are loaded and unloaded.
          headers:
            Content-Type:
              description: text/plain
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              example: loaded
    head:
      operationId: headersForCentroidCacheStateHeaders
      summary: Endpoint is available (new since version 3)
      description: The endpoint is available.  New since version 3.
      tags:
      - Providers
      parameters:
      - name: providerName
        description: Name of the provider whose centroid cache state is being returned.
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The requested action was successful. The endpoint is reachable.
          headers:
            Content-Type:
              description: text/plain
              schema:
                type: string
    put:
      operationId: updateCentroidCacheState
      summary: Clear a provider's centroid cache (new since version 3)
      description: Modifies the state of a provider's centroid cache to unloaded.
        Returns loaded or unloaded to indicate the state after the operation.
      tags:
      - Providers
      parameters:
      - name: providerName
        description: Name of the provider whose centroid cache state is being modified.
        in: path
        required: true
        schema:
          type: string
      - name: value
        description: State to which to set the cache. Valid values include loaded
          or unloaded.
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The state is returned. Valid values are loaded and unloaded.
          content:
            text/plain:
              schema:
                type: string
              example: loaded
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example: {"version": 2, "httpStatusCode": 400, "errorCode": 15111, "message": 'Invalid
                  state value.  Expecting either "loaded" or "unloaded".', "details": [
                  "path: /maps/providers/boise/centroids/state", "correlator: 4be17d74-a302-4619-ab10-97c6127f58b8"]}
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. Details are included in the response body.
