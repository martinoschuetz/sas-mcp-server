---
openapi: 3.0.3
info:
  version: "4"
  title: Job Definitions
  description: The Job Definitions API enables users to manage job definitions using
    the Create, Read, Update, and Delete operations.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/jobDefinitions
  description: The Kubernetes mock server.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Definitions
  description: Contains the operations for job definitions.
paths:
  /:
    get:
      operationId: root
      summary: Get a list of top-level resource links
      description: The API root. Returns a list of links to the top-level resources
        that are surfaced through the API.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootSampleResponse"
    head:
      operationId: headersForRoot
      summary: Check service availability
      description: Returns header information and checks the status of the Job Definitions
        service.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded. The service is available.
  /definitions:
    post:
      operationId: createJobDefinition
      summary: Create a job definition
      description: Creates a job definition.
      tags:
      - Definitions
      parameters:
      - name: parentFolderUri
        in: query
        description: The URI of the parent folder to contain the job definition.
        schema:
          type: string
      - name: accept
        in: header
        description: Accept header value for the versioned media type corresponding
          to the version to be returned.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.job.definition+json:
            schema:
              $ref: "#/components/schemas/jobDefinition"
            examples:
              json:
                $ref: "#/components/examples/createDefinitionSampleBody"
          application/json:
            schema:
              $ref: "#/components/schemas/jobDefinition"
            examples:
              json:
                $ref: "#/components/examples/createDefinitionSampleBody"
        description: The job definition to create.
      responses:
        "201":
          description: The job definition was created.
          headers:
            Last-Modified:
              description: The HTTP-date string that represents the timestamp of the
                last update to this object.
              schema:
                type: string
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
            Location:
              description: The location of the resource.
              schema:
                type: string
          content:
            application/vnd.sas.job.definition+json:
              schema:
                $ref: "#/components/schemas/jobDefinition"
              examples:
                json:
                  $ref: "#/components/examples/createDefinitionSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/jobDefinition"
              examples:
                json:
                  $ref: "#/components/examples/createDefinitionSampleResponse"
        "400":
          description: The request was invalid.
        "415":
          description: The requested media type is not supported.
    get:
      operationId: getJobDefinitions
      summary: Get a collection of job definitions
      description: Returns a list of job definitions.
      tags:
      - Definitions
      parameters:
      - name: start
        in: query
        required: false
        description: The index of the first job definition to return. The default
          value is 0.
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: The maximum number of job definitions to return. The default
          value is 10.
        schema:
          type: integer
      - name: filter
        in: query
        required: false
        description: Filters the results of the query. Direct comparisons on values
          of `code` and `properties` are not guaranteed to work on all platforms.
          Use the `contains` function instead.
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        description: Defines how the returned job definitions are sorted.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/jobDefinitionCollection"
              examples:
                json:
                  $ref: "#/components/examples/getDefinitionsSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/jobDefinitionCollection"
              examples:
                json:
                  $ref: "#/components/examples/getDefinitionsSampleResponse"
        "400":
          description: The request was invalid. An invalid filter or combination of
            request parameters was provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDefinitionsBadRequestResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDefinitionsBadRequestResponse"
  /definitions#multiPost:
    post:
      operationId: createJobDefinitions
      summary: Create job definitions
      description: Creates multiple job definitions.
      tags:
      - Definitions
      parameters:
      - name: parentFolderUri
        in: query
        description: The URI of the parent folder to contain the job definition.
        schema:
          type: string
      - name: accept
        in: header
        description: Accept header value for the versioned media type corresponding
          to the version to be returned.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/jobDefinitionCollection"
            examples:
              json:
                $ref: "#/components/examples/createDefinitionsSampleBody"
        description: The job definitions to create.
      responses:
        "200":
          description: The request succeeded. The items in the response MUST match
            1 to 1 with the items in the request. If the job definition was created
            successfully, then the item in the response will be an application/vnd.sas.job.definition
            object. If the job definition could not be created, then the corresponding
            item in the response will be an application/vnd.sas.error object.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/jobDefinitionCollection"
              examples:
                json:
                  $ref: "#/components/examples/createDefinitionsSampleResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/multiPostBadRequestResponse"
        "415":
          description: The requested media type is not supported.
  "/definitions/{definitionId}#resourceSummary":
    head:
      operationId: headersForJobDefinitionSummary
      summary: Get headers for a job definition
      description: Retrieves headers for a job definition. Can also be used to check
        if a job definition exists.
      tags:
      - Definitions
      parameters:
      - name: definitionId
        in: path
        description: The ID of the job definition.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The job definition exists.
          headers:
            Last-Modified:
              description: The HTTP-date string that represents the timestamp of the
                most recent update to this object.
              schema:
                type: string
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
        "404":
          description: No job definition exists at the requested path.
    get:
      operationId: getJobDefinitionSummary
      summary: Get the job definition summary
      description: Returns the summary representation of the job definition that is
        specified by the provided job definition ID.
      tags:
      - Definitions
      parameters:
      - name: definitionId
        in: path
        description: The ID of the job definition.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The HTTP-date string that represents the timestamp of the
                most recent update to this object.
              schema:
                type: string
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/resourceSummary"
              examples:
                json:
                  $ref: "#/components/examples/getDefinitionSummarySampleResponse"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getDefinitionResourceSummaryNotFoundResponse"
  "/definitions/{definitionId}":
    head:
      operationId: headersForJobDefinition
      summary: Get headers for a job definition
      description: Retrieves headers for a job definition. Can also be used to check
        if a job definition exists.
      tags:
      - Definitions
      parameters:
      - name: definitionId
        in: path
        description: The ID of the job definition.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The job definition exists.
          headers:
            Last-Modified:
              description: The HTTP-date string that represents the timestamp of the
                most recent update to this object.
              schema:
                type: string
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
        "404":
          description: No job definition exists at the requested path.
    get:
      operationId: getJobDefinition
      summary: Get a job definition
      description: Returns the job definition that is specified by the provided job
        definition ID.
      tags:
      - Definitions
      parameters:
      - name: definitionId
        in: path
        description: The ID of the job definition.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The HTTP-date string that represents the timestamp of the
                most recent update to this object.
              schema:
                type: string
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.job.definition+json:
              schema:
                $ref: "#/components/schemas/jobDefinition"
              examples:
                json:
                  $ref: "#/components/examples/getDefinitionSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/jobDefinition"
              examples:
                json:
                  $ref: "#/components/examples/getDefinitionSampleResponse"
        "404":
          description: No resource exists at the requested path.
    put:
      operationId: updateJobDefinition
      summary: Update a job definition
      description: Updates the job definition specified by the provided job definition
        ID.
      tags:
      - Definitions
      parameters:
      - name: definitionId
        in: path
        description: ID of the job definition to update.
        required: true
        schema:
          type: string
      - name: parentFolderUri
        in: query
        description: The URI of the parent folder that contains the job definition.
          If the job definition is in a different folder, it is moved to the specified
          parent folder.
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header of this Job Definition. Must match the current entity tag for the
          Job Definition.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: Ignored when `If-Match` is specified. The timestamp obtained
          from the most recent `Last-Modified` response header of this Job Definition.
          Must be later than or equal to the timestamp when the Job Definition was
          last modified.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.job.definition+json:
            schema:
              $ref: "#/components/schemas/jobDefinition"
            examples:
              json:
                $ref: "#/components/examples/updateDefinitionSampleBody"
          application/json:
            schema:
              $ref: "#/components/schemas/jobDefinition"
            examples:
              json:
                $ref: "#/components/examples/updateDefinitionSampleBody"
        description: description
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The HTTP-date string that represents the timestamp of the
                most recent update to this object.
              schema:
                type: string
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.job.definition+json:
              schema:
                $ref: "#/components/schemas/jobDefinition"
              examples:
                json:
                  $ref: "#/components/examples/updateDefinitionSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/jobDefinition"
              examples:
                json:
                  $ref: "#/components/examples/updateDefinitionSampleResponse"
        "400":
          description: The request was invalid.
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header was earlier than
            the resource's last modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putDefinition412Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putDefinition412Response"
        "415":
          description: The requested media type is not supported.
        "428":
          description: The request was missing a `If-Match` or `If-Unmodified-Since`
            header.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putDefinition428Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putDefinition428Response"
    delete:
      operationId: deleteJobDefinition
      summary: Delete a job definition
      description: Deletes the job definition specified by the provided job definition
        ID.
      tags:
      - Definitions
      parameters:
      - name: definitionId
        in: path
        description: The ID of the job definition.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The job definition was deleted.
        "404":
          description: No resource exists at the requested path.
components:
  schemas:
    jobDefinitionParameter:
      title: Job Definition Parameter Schema
      description: Job definition parameter.
      properties:
        name:
          type: string
          description: The name of the parameter.
          maxLength: 100
        type:
          type: string
          description: The type of the parameter (TABLE, NUMERIC, DATE, CHARACTER).
          maxLength: 20
        label:
          type: string
          description: The display value for the name of this parameter.
          maxLength: 250
        required:
          type: boolean
          description: Specifies if the parameter is required for execution.
        defaultValue:
          type: string
          description: The default value for this parameter, if one is not specified
            at execution time.
        version:
          type: integer
          description: The version number of the representation. The current version
            is 1.
    jobDefinition:
      title: Job Definition Schema
      description: The job definition.
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the job that is generated by the
            API.
        name:
          type: string
          description: The name of the job.
          maxLength: 255
        description:
          type: string
          description: The description of the job.
          maxLength: 1000
        type:
          type: string
          description: The type that determines which execution provider will run
            the job. Valid types include `Compute` (for SAS code), `casl` (for CASL
            scripts), and others installed on the deployment. The type must match
            an available execution provider, otherwise job execution will fail.
          maxLength: 250
        code:
          type: string
          description: Execution provider specific code to be executed.
        parameters:
          type: array
          description: An array of input parameters to be collected when executing
            this job definition
          items:
            $ref: "#/components/schemas/jobDefinitionParameter"
        properties:
          type: array
          description: An array of name/value pairs needed to execute a job definition
            The maximum name length is 100.
          items:
            $ref: "#/components/schemas/resourceProperty"
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job was created, in the format of YYYY-MM-DDThh:mm:ss.sssZ.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job was last modified, in the format
            of YYYY-MM-DDThh:mm:ss.sssZ.
        createdBy:
          type: string
          description: The name of the user who created the job.
        modifiedBy:
          type: string
          description: The name of the last user who modified this object.
        links:
          type: array
          description: Links that apply to this object. Includes "self", "alternate",
            "update" and "delete".
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the representation. The current version
            is 2.
    jobDefinitionCollection:
      title: Job Definition Collection
      type: object
      description: A pageable collection of job definition objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains job definition resources.
            items:
              $ref: "#/components/schemas/jobDefinition"
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header can be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            3.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    resourceSummary:
      title: Resource Summary Schema
      description: The resource summary object.
      type: object
      properties:
        name:
          type: string
          description: The name of the resource.
        id:
          type: string
          description: The ID of the resource.
        type:
          type: string
          description: The resource type.
        description:
          type: string
          description: The resource description.
        typeDefName:
          type: string
          description: The name of the TypeDef.
        iconUri:
          type: string
          description: The icon URI.
        links:
          type: array
          description: Paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version of the resource summary schema. This is version
            2.
    resourceProperty:
      title: Resource Property Schema
      type: object
      description: A simple name value pair.
      properties:
        name:
          type: string
          description: The name.
        value:
          type: string
          description: The value.
  examples:
    rootSampleResponse:
      summary: Root response
      description: Here is a sample response when using GET on the root resource.
      value: {"version": 1, "links": [{"method": "GET", "rel": "job-definitions",
            "href": "/jobDefinitions/definitions", "uri": "/jobDefinitions/definitions",
            "type": "application/vnd.sas.collection"}, {"method": "POST", "rel": "createJobDefinition",
            "href": "/jobDefinitions/definitions", "uri": "/jobDefinitions/definitions",
            "type": "application/vnd.sas.job.definition"}, {"method": "POST", "rel": "createJobDefinitions",
            "href": "/jobDefinitions/definitions", "uri": "/jobDefinitions/definitions",
            "type": "application/vnd.sas.collection"}]}
    createDefinitionSampleBody:
      summary: Body to create the job definition
      description: Sample body to create a job definition.
      value: {"version": 2, "name": "Simple PROC print", "description": "Shows the\
          \ contents of sashelp.class using PROC PRINT.", "type": "Compute", "parameters": [
          {"version": 1, "name": "_contextName", "defaultValue": "SAS Job Execution\
              \ compute context", "type": "CHARACTER", "label": "Context Name", "required": false}],
        "code": "ods html style=HTMLBlue;\nproc print data=sashelp.class; run; quit;\n\
          ods html close;"}
    createDefinitionSampleResponse:
      summary: Create job definition response
      description: This is sample response when using POST to create a job definition.
      value: {"creationTimeStamp": "2021-11-11T22:41:36.106Z", "modifiedTimeStamp": "2021-11-11T22:41:36.111Z",
        "createdBy": "user1", "modifiedBy": "user1", "version": 2, "id": "d7a112d7-b5df-4343-9161-4c264d678447",
        "name": "Simple PROC PRINT", "description": "Shows the contents of sashelp.class\
          \ using PROC PRINT.", "type": "Compute", "parameters": [{"version": 1, "name": "_contextName",
            "defaultValue": "SAS Job Execution compute context", "type": "CHARACTER",
            "label": "Context Name", "required": false}], "code": "ods html style=HTMLBlue;\n\
          proc print data=sashelp.class; run; quit;\nods html close;", "links": [
          {"method": "GET", "rel": "self", "href": "/jobDefinitions/definitions/d7a112d7-b5df-4343-9161-4c264d678447",
            "uri": "/jobDefinitions/definitions/d7a112d7-b5df-4343-9161-4c264d678447",
            "type": "application/vnd.sas.job.definition"}, {"method": "GET", "rel": "alternate",
            "href": "/jobDefinitions/definitions/d7a112d7-b5df-4343-9161-4c264d678447",
            "uri": "/jobDefinitions/definitions/d7a112d7-b5df-4343-9161-4c264d678447",
            "type": "application/vnd.sas.summary"}, {"method": "PUT", "rel": "update",
            "href": "/jobDefinitions/definitions/d7a112d7-b5df-4343-9161-4c264d678447",
            "uri": "/jobDefinitions/definitions/d7a112d7-b5df-4343-9161-4c264d678447",
            "type": "application/vnd.sas.job.definition", "responseType": "application/vnd.sas.job.definition"},
          {"method": "DELETE", "rel": "delete", "href": "/jobDefinitions/definitions/d7a112d7-b5df-4343-9161-4c264d678447",
            "uri": "/jobDefinitions/definitions/d7a112d7-b5df-4343-9161-4c264d678447"}]}
    updateDefinitionSampleBody:
