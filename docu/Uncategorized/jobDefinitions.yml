              {"version": 1, "name": "%VAR-data_explorer_submission_id", "type": "CHARACTER",
                "label": "Unique identifier by which UI tracks this job", "required": false}],
            "code": "session server;\n \n/* IF NOT doing a Replace, check if target\
              \ table exists and fail if it does */\ncheckReplace(replace, destinationCasLib,\
              \ destinationTable);\n \n/* Save CAS table to DESTINATION caslib backing\
              \ store */\nsave status=rc result=r / caslib=destinationCasLib name=destinationTable\n\
              \   table={caslib=sourceCasLib name=sourceTable} replace=replace;\n\
              checkStatus(rc, \"Error saving table\", 3);\n\n/* pull the path of the\
              \ source that was saved - to be used in load below */\ndestinationPath=dictionary(r,\
              \ \"name\");\n\n/* Unload session table from memory in destination caslib\
              \ */\ndropTableIfExists(destinationCasLib, destinationTable);\n    \n\
              /* Unload global table if exists */\ndropTableIfExists(destinationCasLib,\
              \ destinationTable);\n\n/* Load table into memory in destination caslib\
              \ */\nloadTable status=rc result=r / caslib=destinationCasLib path=destinationPath\n\
              \   casOut={caslib=destinationCasLib name=destinationTable label=destinationTableLabel}\n\
              \   promote=promote;\ncheckStatus(rc, \"Error promoting table\", 4);\n\
              \ \nfunction checkStatus(rc, logMessage, errorCode);\n   if rc.statusCode\
              \ != 0 then do;\n      print logMessage;\n      print \"UserErrorCode:\
              \ \"||errorCode;\n      exit 1;\n   end;\nend;\n \nfunction doesTableExist(casLib,\
              \ casTable);\n   tableExists result=r status=rc / caslib=casLib table=casTable;\n\
              \   tableExists = dictionary(r, \"exists\");\n   return tableExists;\n\
              end func;\n \nfunction dropTableIfExists(casLib,casTable);\n   tableExists\
              \ = doesTableExist(casLib, casTable);\n   if tableExists != 0 then do;\n\
              \      print \"Dropping table: \"||casLib||\".\"||casTable;\n      dropTable\
              \ result=r status=rc/ caslib=casLib table=casTable quiet=0;\n      checkStatus(rc,\
              \ \"Error dropping table: \"||casLib||\".\"||casTable, 5);\n   end;\n\
              end func;\n\nfunction checkReplace(replace, caslib, table);\n   if replace\
              \ == false then do;\n      exists = doesTableExist(caslib, table);\n\
              \      if (exists !=0) then do;\n         print \"Table already exists\
              \ and replace flag is set to false.\";\n         print \"UserErrorCode:\
              \ 1\";\n         exit 1;\n      end;\n  end;\nend func;\n\n\n", "links": [
