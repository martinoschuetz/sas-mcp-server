---
openapi: "3.0.3"
servers:
- url: "https://api.apiproxy.sas.com/mysas"
  description: SAS Viya Orders API URL
info:
  description: SAS Viya Orders API
  title: SAS Viya Orders
  version: "1"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
tags:
- name: Certificates
  description: Contains the operations for the certificates resource.
- name: Deployment Assets
  description: Contains the operations for the deployment assets resource.
- name: License
  description: Contains the operations for the license resource.
components:
  securitySchemes:
    ClientId:
      type: apiKey
      in: header
      name: ClientId
      description: The client ID for authentication.
    ClientSecret:
      type: apiKey
      in: header
      name: ClientSecret
      description: The client secret for authentication.
  schemas:
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
paths:
  /orders/{orderNumber}/certificates:
    head:
      operationId: headersForCertificates
      summary: Check if a certificates file exists
      description: Returns header information about a certificates file for the specified
        order.
      security:
      - ClientId: []
        ClientSecret: []
      tags:
      - Certificates
      parameters:
      - description: The order number that contains the certificates file.
        in: path
        name: orderNumber
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No certificates file exists at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    get:
      operationId: getCertificates
      summary: Get a certificates file
      description: Returns a certificates file for the specified order.
      security:
      - ClientId: []
        ClientSecret: []
      tags:
      - Certificates
      parameters:
      - description: The order number that contains the certificates file.
        in: path
        name: orderNumber
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No certificates file exists at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /orders/{orderNumber}/cadenceNames/{cadenceName}/cadenceVersions/{cadenceVersion}/deploymentAssets:
    head:
      operationId: headersForDepAssets
      summary: Check if deployment assets exist
      description: Returns the header information about deployment assets for the
        specified order, the cadence name and version.
      parameters:
      - description: The order number that contains the deployment assets.
        in: path
        name: orderNumber
        required: true
        schema:
          type: string
      - description: The name of the cadence.
        in: path
        name: cadenceName
        required: true
        schema:
          type: string
      - description: The version of the cadence.
        in: path
        name: cadenceVersion
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No deployment assets exist at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      security:
      - ClientId: []
        ClientSecret: []
      tags:
      - Deployment Assets

    get:
      operationId: getDepAssets
      summary: Get deployment assets
      description: Returns the deployment assets for the specified order, and the
        specific cadence name and version.
      security:
      - ClientId: []
        ClientSecret: []
      tags:
      - Deployment Assets
      parameters:
      - description: The order number that contains the deployment assets.
        in: path
        name: orderNumber
        required: true
        schema:
          type: string
      - description: The name of the cadence.
        in: path
        name: cadenceName
        required: true
        schema:
          type: string
      - description: The version of the cadence.
        in: path
        name: cadenceVersion
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No deployment assets exist at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /orders/{orderNumber}/cadenceNames/{cadenceName}/deploymentAssets:
    head:
      operationId: headersForDepAssetsShort
      summary: Check if deployment assets exist for the latest cadence
      description: Returns the header information about the deployment assets for
        the specified order at the latest version of the specified cadence name.
      parameters:
      - description: The order number that contains the deployment assets.
        in: path
        name: orderNumber
        required: true
        schema:
          type: string
      - description: The name of the cadence.
        in: path
        name: cadenceName
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No deployment assets exist at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
      security:
      - ClientId: []
        ClientSecret: []
      tags:
      - Deployment Assets

    get:
      operationId: getDepAssetsShort
      summary: Get deployment assets for the latest cadence
      description: Returns a list of deployment assets for the specified order at
        the latest version of the specified cadence name.
      security:
      - ClientId: []
        ClientSecret: []
      tags:
      - Deployment Assets
      parameters:
      - description: The order number that contains the deployment assets.
        in: path
        name: orderNumber
        required: true
        schema:
          type: string
      - description: The name of the cadence.
        in: path
        name: cadenceName
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No deployment assets exist at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /orders/{orderNumber}/cadenceNames/{cadenceName}/cadenceVersions/{cadenceVersion}/license:
    head:
      operationId: headersForLicense
      summary: Check if a license file exists
      description: Returns header information about a license file for the specified
        order, and the specified cadence name or version.
      security:
      - ClientId: []
        ClientSecret: []
      tags:
      - License
      parameters:
      - description: The order number that contains the license file.
        in: path
        name: orderNumber
        required: true
        schema:
          type: string
      - description: The name of the cadence.
        in: path
        name: cadenceName
        required: true
        schema:
          type: string
      - description: The version of the cadence.
        in: path
        name: cadenceVersion
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No license file exists at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    get:
      operationId: getLicense
      summary: Get a license file
      description: Returns a license file for the specified order, and the specified
        cadence name or version.
      security:
      - ClientId: []
        ClientSecret: []
      tags:
      - License
      parameters:
      - description: The order number that contains the license file.
        in: path
        name: orderNumber
        required: true
        schema:
          type: string
      - description: The name of the cadence.
        in: path
        name: cadenceName
        required: true
        schema:
          type: string
      - description: The version of the cadence.
        in: path
        name: cadenceVersion
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No license file exists at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
