---
openapi: 3.0.3
info:
  title: Natural Language Understanding
  description: This API interprets natural language text and converts it to a structured
    representation.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  license:
    name: Copyright 2018 SAS Institute Inc.
  version: "1"
servers:
- url: https://example.com/naturalLanguageUnderstanding
  description: This is an example of a base URL.
security:
- SASLogon:
  - openid
tags:
- name: Root
  description: The API root.
- name: Domains
  description: Operations related to adapting the service to a specific domain.
- name: Interpretations
  description: Operations related to interpretating natural language text.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get API resource links
      description: |
        Return a list of links to the top level resources in this API.
      operationId: root
      responses:
        "200":
          description: A collection of link objects.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                default:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                default:
                  $ref: "#/components/examples/root"
  /domains:
    get:
      tags:
      - Domains
      summary: List the available domains
      description: List the available domains.
      operationId: getDomains
      parameters:
      - name: filter
        in: query
        description: The criteria for filtering the domains. See [Filtering in REST
          APIs](http://developer.sas.com/guides/rest/filtering)
        schema:
          type: string
          format: string
      - name: start
        in: query
        description: The start index for pagination.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The limit parameter for pagination.
        schema:
          type: integer
          default: 10
      - name: sortBy
        in: query
        description: Indicates the criteria for sorting the collection. See [Sorting
          in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The domains.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/domainCollection'
              examples:
                default:
                  $ref: "#/components/examples/domain_collection"
            application/json:
              schema:
                $ref: '#/components/schemas/domainCollection'
              examples:
                default:
                  $ref: "#/components/examples/domain_collection"
      x-annotations:
      - com.sas.authorization.annotations.FilterLinks
    post:
      tags:
      - Domains
      summary: Create a new domain
      description: Create a new domain.
      operationId: createDomain
      requestBody:
        description: The domain to create.
        content:
          application/vnd.sas.cognitive.natural.language.understanding.domain.creation.request+json:
            schema:
              $ref: '#/components/schemas/domainCreationRequest'
            examples:
              default:
                $ref: "#/components/examples/domain_creation_request"
          application/json:
            schema:
              $ref: '#/components/schemas/domainCreationRequest'
            examples:
              default:
                $ref: "#/components/examples/domain_creation_request"
        required: true
      responses:
        "202":
          description: The information describing the domain.
          headers:
            Content-Type:
              description: media type of the newly created resource
              schema:
                type: string
          content:
            application/vnd.sas.cognitive.natural.language.understanding.domain+json:
              schema:
                $ref: '#/components/schemas/domain'
              examples:
                default:
                  $ref: "#/components/examples/domain"
            application/json:
              schema:
                $ref: '#/components/schemas/domain'
              examples:
                default:
                  $ref: "#/components/examples/domain"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
        "409":
          description: The supplied domain ID already exists.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_conflict"
      x-codegen-request-body-name: body
  /domains#project:
    post:
      tags:
      - Domains
      summary: Create a new domain based on a project
      description: Create a new domain based on a project.
      operationId: createDomainFromProject
      requestBody:
        description: The domain to create.
        content:
          application/vnd.sas.cognitive.natural.language.understanding.project.based.domain.creation.request+json:
            schema:
              $ref: '#/components/schemas/projectBasedDomainCreationRequest'
            examples:
              default:
                $ref: "#/components/examples/project_creation_request"
      responses:
        '202':
          description: The information describing the domain.
          content:
            application/vnd.sas.cognitive.natural.language.understanding.domain+json:
              schema:
                $ref: '#/components/schemas/domain'
              examples:
                default:
                  $ref: "#/components/examples/domain"
            application/json:
              schema:
                $ref: '#/components/schemas/domain'
              examples:
                default:
                  $ref: "#/components/examples/domain"
        '409':
          description: The supplied domain ID already exists.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_conflict"
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
  /domains/{domainId}:
    get:
      tags:
      - Domains
      summary: Get a specific domain
      description: Get a specific domain.
      operationId: getDomain
      parameters:
      - name: domainId
        in: path
        description: The ID for the domain.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The information describing the domain.
          headers:
            Content-Type:
              description: media type of the newly created resource
              schema:
                type: string
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/vnd.sas.cognitive.natural.language.understanding.domain+json:
              schema:
                $ref: '#/components/schemas/domain'
              examples:
                default:
                  $ref: "#/components/examples/domain"
            application/json:
              schema:
                $ref: '#/components/schemas/domain'
              examples:
                default:
                  $ref: "#/components/examples/domain"
        "404":
          description: The supplied domain ID was not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
    delete:
      tags:
      - Domains
      summary: Delete domain
      description: Delete a domain.
      operationId: deleteDomain
      parameters:
      - name: domainId
        in: path
        description: The ID for the domain.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The domain was successfully deleted.
        "404":
          description: The supplied domain ID was not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
        "409":
          description: The domain was either not in a completed state or is referenced
            by other resources and cannot be deleted.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_conflict"
  /domains/{domainId}/state:
    get:
      tags:
      - Domains
      summary: Get the state of a domain
      description: Get the state of a domain.
      operationId: getDomainState
      parameters:
      - name: domainId
        in: path
        description: The ID for the domain.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The information describing the domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domainState'
              examples:
                default:
                  value: "available"
            text/plain:
              schema:
                $ref: '#/components/schemas/domainState'
              examples:
                default:
                  value: "available"
        "404":
          description: The supplied domain ID was not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
    put:
      tags:
      - Domains
      summary: Modify the state of an existing domain
      description: Modify the state of an existing domain. This endpoint is used to
        cancel training or initialization of a domain.
      operationId: updateDomainState
      parameters:
      - name: domainId
        in: path
        description: The ID for the domain.
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: Indicates the value to change the state to for a domain.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The state was successfully updated.
            The response contains the updated state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domainState'
              examples:
                default:
                  value: "available"
            text/plain:
              schema:
                $ref: '#/components/schemas/domainState'
              examples:
                default:
                  value: "available"
        "400":
          description: The request was invalid. The specified state value is not a
            valid state.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
        "404":
          description: The specified domain ID does not exist.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
  /domains/{domainId}/errors:
    get:
      tags:
      - Domains
      summary: Get domain errors
      description: Get the errors that were raised during training or initialization
        of a domain, if any.
      operationId: getDomainErrors
      parameters:
      - name: domainId
        in: path
        description: The ID for the domain.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. All of the domain errors are available.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/domain_errors"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/domain_errors"
        "204":
          description: There is no content for this domain. The domain ID was found,
            and there are no errors.
        "404":
          description: The specified domain ID does not exist at the requested path.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
  /interpretations:
    get:
      tags:
      - Interpretations
      summary: Fetch interpretations
      description: Fetch a collection of interpretations with an itemType of application/vnd.sas.cognitive.natural.language.understanding.simple.interpretation
      operationId: getInterpretations
      parameters:
      - name: filter
        in: query
        description: The criteria for filtering the interpretations. See [Filtering
          in REST APIs](http://developer.sas.com/guides/rest/filtering)
        schema:
          type: string
          format: string
      - name: start
        in: query
        description: The start index for pagination.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The limit parameter for pagination.
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/simpleInterpretationCollection'
              examples:
                default:
                  $ref: "#/components/examples/simple_interpretation_collection"
            application/json:
              schema:
                $ref: '#/components/schemas/simpleInterpretationCollection'
              examples:
                default:
                  $ref: "#/components/examples/simple_interpretation_collection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
        "409":
          description: The request could not be processed because the domain state
            is not `available`.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_conflict"
    post:
      tags:
      - Interpretations
      summary: Processes the natural language query and derives structured interpretations
        from the text
      description: Processes the natural language query and derives structured interpretations
        from the text.
      operationId: createInterpretation
      requestBody:
        description: The input data to interpret.
        content:
          application/vnd.sas.cognitive.natural.language.understanding.interpretation.request+json:
            schema:
              $ref: '#/components/schemas/interpretationRequest'
            examples:
              default:
                $ref: "#/components/examples/interpretation_request"
          application/json:
            schema:
              $ref: '#/components/schemas/interpretationRequest'
            examples:
              default:
                $ref: "#/components/examples/interpretation_request"
        required: false
      responses:
        "201":
          description: Interpretation was successfully created.
          headers:
            Location:
              description: The URL of the newly created resource
              schema:
                type: string
            Content-Type:
              description: media type of the newly created resource
              schema:
                type: string
          content:
            application/vnd.sas.cognitive.natural.language.understanding.interpretation+json:
              schema:
                $ref: '#/components/schemas/simpleInterpretation'
              examples:
                default:
                  $ref: "#/components/examples/simple_interpretation"
            application/json:
              schema:
                $ref: '#/components/schemas/simpleInterpretation'
              examples:
                default:
                  $ref: "#/components/examples/simple_interpretation"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
        "404":
          description: The supplied domain ID was not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
  /interpretations#advanced:
    post:
      tags:
      - Interpretations
      summary: Processes the natural language query and derives structured interpretations
        from the text
      description: Processes the natural language query and derives structured interpretations
        from the text.
      operationId: createAdvancedInterpretation
      requestBody:
        description: The input data to interpret.
        content:
          application/vnd.sas.cognitive.natural.language.understanding.interpretation.request+json:
            schema:
              $ref: '#/components/schemas/interpretationRequest'
            examples:
              default:
                $ref: "#/components/examples/interpretation_request"
      responses:
        '201':
          description: Interpretation was successfully created.
          headers:
            Location:
              description: Location of the created interpretation.
              schema:
                type: string
          content:
            application/vnd.sas.cognitive.natural.language.understanding.advanced.interpretation+json:
              schema:
                $ref: '#/components/schemas/advancedInterpretation'
              examples:
                default:
                  $ref: "#/components/examples/advanced_interpretation"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_bad_request"
        "404":
          description: The supplied domain ID was not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
  /interpretations/{interpretationId}:
    get:
      tags:
      - Interpretations
      summary: Fetch an interpretation
      description: Fetch an interpretation.
      operationId: getSimpleInterpretation
      parameters:
      - name: interpretationId
        in: path
        description: The ID of the interpretation.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.cognitive.natural.language.understanding.simple.interpretation+json:
              schema:
                $ref: '#/components/schemas/simpleInterpretation'
              examples:
                default:
                  $ref: "#/components/examples/simple_interpretation"
            application/json:
              schema:
                $ref: '#/components/schemas/simpleInterpretation'
              examples:
                default:
                  $ref: "#/components/examples/simple_interpretation"
        "404":
          description: The supplied interpretation ID was not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
    delete:
      tags:
      - Interpretations
      summary: Delete an interpretation
      description: Delete an interpretation.
      operationId: deleteInterpretation
      parameters:
      - name: interpretationId
        in: path
        description: The ID for the interpretation.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The interpretation was successfully deleted.
        "404":
          description: The supplied interpretation ID was not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
  /interpretations/{interpretationId}#advanced:
    get:
      tags:
      - Interpretations
      summary: Fetch an advanced interpretation
      description: Fetch an advanced interpretation.
      operationId: getAdvancedInterpretation
      parameters:
      - name: interpretationId
        in: path
        description: The ID of the interpretation.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The advanced interpretation.
          content:
            application/vnd.sas.cognitive.natural.language.understanding.advanced.interpretation+json:
              schema:
                $ref: '#/components/schemas/advancedInterpretation'
              examples:
                default:
                  $ref: "#/components/examples/advanced_interpretation"
        '404':
          description: The supplied interpretation ID was not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/error_not_found"
components:
  schemas:
    baseDomainCreationRequest:
      title: Base Domain Creation Request
      description: Common definitions related to domain creation.
      required:
      - domainConfiguration
      - matcherSpecs
      - requestType
      properties:
        id:
          type: string
          description: Optional string to use as the unique identifier for the domain.
        name:
          type: string
          description: The name of the domain.
        description:
          type: string
          description: The description of the domain.
        domainConfiguration:
          type: array
          description: Domain specific configuration information.
          items:
            $ref: '#/components/schemas/domainConfiguration'
        matcherSpecs:
          type: array
          description: Domain specific matcher configuration information.
          items:
            $ref: '#/components/schemas/matcherSpec'
        requestType:
          type: string
          description: 'The method of domain creation requested. Valid values: training
            (training a new domain), registration (registering a domain with a pretrained
            model).'
          enum:
          - training
          - registration
        version:
          type: integer
          description: The version of the creation request. The current version is
            1.
    domainCreationRequest:
      title: Domain Creation Request
      description: Domain creation request using local domain resources.
      allOf:
      - $ref: '#/components/schemas/baseDomainCreationRequest'
      - type: object
        properties:
          resources:
            type: array
            description: The list of resources to use for domain creation.
            items:
              $ref: '#/components/schemas/domainResource'
    projectBasedDomainCreationRequest:
      title: Project Based Domain Creation Request
      description: Domain creation request using a project that contains the domain
        resources.
      allOf:
      - $ref: '#/components/schemas/baseDomainCreationRequest'
      - type: object
        required:
        - projectUri
        properties:
          projectUri:
            type: string
            description: The URI of the project that contains the resources needed
              for domain creation.
    domainResource:
      title: Domain Resource
      description: A domain resource.
      required:
      - resourceUri
      - resourceType
      properties:
        resourceUri:
          type: string
          description: The URI of a resource.
        resourceType:
          $ref: '#/components/schemas/resourceType'
        version:
          type: integer
          description: The version of the domain resource.The current version is 1.
    resourceType:
      title: Resource Type
      description: 'Identifies the type of resource. Valid values are: model, modelMetadata,
        trainingData.'
      type: string
      enum:
      - model
      - modelMetadata
      - trainingData
    domainConfiguration:
      title: Domain Configuration
      description: Configuration specific to a given domain
      required:
      - configuration
      properties:
        configuration:
          x-sas-include-type-info: true
          type: object
          description: Module configuration specific to a given domain.
        version:
          type: integer
          description: The version of the domain configuration.The current version
            is 1.
    matcherSpec:
      title: Matcher Specification
      description: Matcher configuration specific to a given lexeme
      required:
      - lexemeName
      - matcherConfiguration
      properties:
        lexemeName:
          type: string
          description: Domain specific name of the lexeme.
        matcherConfiguration:
          x-sas-include-type-info: true
          type: object
          description: Matcher configuration specific to a given domain.
        version:
          type: integer
          description: The version of the matcher specification. The current version
            is 1.
    domainState:
      title: Domain State
      description: 'The state of the domain. Valid values are: available, canceled,
        initializationFailed, initializing, trainingCompleted, trainingFailed, inTraining,
        pending.'
      x-sas-type: DomainState
      type: string
      enum:
      - canceled
      - pending
      - inTraining
      - trainingFailed
      - trainingCompleted
      - initializing
      - initializationFailed
      - available
    domain:
      title: Domain
      description: All of the terms, relationships, rules and language that can be
        understood by the service.
      properties:
        id:
          type: string
          description: Unique identifier for a domain.
        name:
          type: string
          description: User supplied domain tag.
        description:
          type: string
          description: User supplied domain description.
        state:
          $ref: '#/components/schemas/domainState'
        createdBy:
          type: string
          description: The user who created the interpretation.
        modifiedBy:
          type: string
          description: The user who most recently modified the domain.
        creationTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            domain was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            domain was last modified.
          format: date-time
        version:
          type: integer
          description: The version of the domain. The current version is 1.
    domainCollection:
      title: Domain Collection
      description: A collection of domains.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: The list of domains.
            items:
              $ref: '#/components/schemas/domain'
    interpretationRequest:
      title: Interpretation Request
      description: A request to translate natural language into domain specific structured
        data.
      required:
      - domainId
      - text
      properties:
        domainId:
          type: string
          description: The domain to use for interpretation.
        text:
          type: string
          description: The text to interpret.
        stringSetContext:
          type: object
          description: Contextual information used to augment the lexeme matching
            process.
          additionalProperties:
            type: array
            items:
              type: string
        version:
          type: integer
          description: The version of the interpretation request. The current version
            is 1.
    baseInterpretation:
      title: Base Interpretation
      description: Common definitions related to the tranlation of natural language
        into domain specific structured data.
      allOf:
      - $ref: '#/components/schemas/interpretationRequest'
      - type: object
        required:
        - id
        - domainId
        - createdBy
        - creationTimeStamp
        - timeToLive
        properties:
          id:
            type: string
            description: The unique identifier for a given interpretation.
          domainId:
            type: string
            description: The domain uses for interpretation.
          createdBy:
            type: string
            description: The user who created the interpretation.
          creationTimeStamp:
            type: string
            description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
              interpretation was created.
            format: date-time
          version:
            type: integer
            description: The version of the interpretation. The current version is
              1.
    simpleInterpretation:
      title: Simple Interpretation
      description: The tranlation of natural language into domain specific structured
        data. The simple Interpretation represents the most probable tranlation.
      allOf:
      - $ref: '#/components/schemas/baseInterpretation'
      - type: object
        required:
        - expressions
        properties:
          expressions:
            type: array
            description: The list of interpretion expressions.
            items:
              $ref: '#/components/schemas/interpretationExpression'
    simpleInterpretationCollection:
      title: A collection of simple interpretations.
      description: A collection of simple interpretations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: The list of simple interpretations
            items:
              $ref: '#/components/schemas/simpleInterpretation'
    advancedInterpretation:
      title: Advanced Interpretation
      description: The tranlation of natural language into domain specific structured
        data. The advanced Interpretation represents all possible tranlations.
      allOf:
      - $ref: '#/components/schemas/baseInterpretation'
      - type: object
        required:
        - interpretation
        - alternatives
        properties:
          interpretation:
            $ref: '#/components/schemas/interpretationAggregate'
          alternatives:
            type: array
            description: The list of lower scoring alternative translations by partition.
            items:
              $ref: '#/components/schemas/interpretationAggregate'
    interpretationAggregate:
      title: Interpretation Aggregate
      description: An aggregation of one or more expressed concepts across partitions.
      properties:
        partitions:
          type: array
          description: The list of partitions for this aggregation.
          items:
            $ref: '#/components/schemas/interpretationPartition'
        version:
          type: integer
          description: The version of the interpretation aggregate. The current version
            is 1.
    interpretationPartition:
      title: Interpretation Partition
      description: A partial interpretation that covers a span of natural language
        based on partitioning the natural language into sections containing expressions.
      properties:
        expressions:
          type: array
          description: The list of expressions for this partition.
          items:
            $ref: '#/components/schemas/interpretationExpression'
        version:
          type: integer
          description: The version of the interpretation partition. The current version
            is 1.
    interpretationExpression:
      title: Interpretation Expression
      description: An expression is a relationship expressed over a span of text.
      properties:
        ruleName:
          type: string
          description: Domain specific name of the rule matched in this interpretation.
        interpretationNodes:
          type: array
          description: The list of nodes that comprise this expression.
          items:
            $ref: '#/components/schemas/interpretationNode'
        version:
          type: integer
          description: The version of the interpretation expression. The current version
            is 1.
    interpretationNode:
      title: Interpretation Node
      description: An interpretation node represents an entity along with relationships
        to other entites in a given expression.
      properties:
        id:
          type: string
          description: the unique identifier of this node in the context of an interpretation
        name:
          type: string
          description: user specified identifier of this node.
        domainTerm:
          $ref: '#/components/schemas/domainTerm'
        arguments:
          type: array
          description: The list of peer node IDs that are logical arguments of this
            node.
          items:
            type: string
        version:
          type: integer
          description: The version of the interpretation node. The current version
            is 1.
    domainTerm:
      title: Domain Term
      description: A Domain Term represents a lexical item (word or phrase) that was
        detected in the text.
      required:
      - lexeme
      - matchedInputText
      - matchedDataSourceText
      - score
      type: object
      properties:
        lexeme:
          type: string
          description: The smallest unit of meaning recognized by the Natural Language
            Understanding service, consisting of one word or several words.
        matchedInputText:
          type: string
          description: Span of input text that was matched to the lexeme.
        matchedDataSourceText:
          type: string
          description: Span of datasource text that was matched to the lexeme.
        score:
          type: number
          format: double
          description: The confidence score applied to this domain term.
        matcherMetadata:
          $ref: "#/components/schemas/attributes"
        dataSourceMetadata:
          $ref: "#/components/schemas/attributes"
        version:
          type: integer
          description: The version of the domain term. The current version is 1.
    api:
