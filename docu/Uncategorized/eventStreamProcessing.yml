---
openapi: 3.0.3
info:
  title: Event Stream Processing Server
  description: The Event Stream Processing Server API provides access to a running
    ESP server that enables the user to process and analyze continuously flowing events.
  version: "3"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/eventStreamProcessing/v3
  description: This is an example of a base URL.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Global Health
  description: Retrieves the SAS Event Stream Processing server global health information.
- name: Events
  description: Retrieves the SAS Event Stream Processing event data.
- name: Windows
  description: Retrieves the SAS Event Stream Processing window information.
- name: Project Statistics
  description: Retrieves the SAS Event Stream Processing project statistics.
- name: Scoring
  description: Scores input data.
paths:
  /:
    get:
      summary: Get the SAS Event Stream Processing v3 endpoints
      description: Returns the SAS Event Stream Processing v3 endpoints.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example:
                  $ref: "#/components/examples/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example:
                  $ref: "#/components/examples/api"
  /globalHealth:
    head:
      tags:
      - Global Health
      summary: Get server performance monitoring metrics
      description: Returns information about the health of the ESP server.
      operationId: headersForGlobalHealth
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag.
              schema:
                type: string
    get:
      tags:
      - Global Health
      operationId: getGlobalHealth
      summary: Get server performance monitoring metrics
      description: Retrieves server performance monitoring metrics from an ESP server.
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/globalHealth"
              examples:
                api:
                  $ref: "#/components/examples/globalHealth"
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/globalHealth"
              examples:
                api:
                  $ref: "#/components/examples/globalHealth"
  /projectStats:
    get:
      tags:
      - Project Statistics
      summary: Get project statistics
      description: Retrieves project statistics by project name or by using a filter
        expression. For example, `/projectStats` or `/projectStats?minCpu=0&memory=true`.
      operationId: getProjectStats
      parameters:
      - name: minCpu
        in: query
        description: A numeric value that indicates the minimum CPU value to return
          in the response.
        schema:
          type: string
      - name: memory
        in: query
        description: A boolean value that you can set to true when you want to return
          the server memory usage.
        schema:
          type: boolean
      - name: filter
        in: query
        description: A fake filter.
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Sends a response only if the current resource does not match
          provided value.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/projectStats"
              examples:
                api:
                  $ref: "#/components/examples/projectStats"
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/projectStats"
              examples:
                api:
                  $ref: "#/components/examples/projectStats"
  /events:
    get:
      tags:
      - Events
      summary: Get events from the ESP server
      description: Retrieves events from the ESP server. Optionally, you can apply
        filters to the request. Either a window filter, an event filter, or both can
        be used to retrieve the desired events. Excluding either causes all resources
        of that type to be included in the result.
      operationId: getEvents
      parameters:
      - name: filter
        in: query
        description: A filter to specify the windows that you want to return events.
        schema:
          type: string
      - name: windowFilter
        in: query
        description: A filter to specify the windows that you want to return events.
        examples:
          byType:
            summary: Filters windows by type
            value: type eq 'window-aggregate'
        schema:
          type: string
      - name: eventFilter
        in: query
        description: A filter to run against events that determines whether to return
          the event.
        schema:
          type: string
      - name: sortBy
        in: query
        description: Specifies the field used to sort the results. The default sort
          direction is descending. To sort in ascending order, use `[sortfield]:ascending`.
        schema:
          type: string
      - name: start
        in: query
        description: The start value.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of items to return.
        schema:
          type: integer
      - name: If-None-Match
        in: header
        description: Not currently supported.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/events"
              examples:
                api:
                  $ref: "#/components/examples/events"
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/events"
              examples:
                api:
                  $ref: "#/components/examples/events"
  /events/{projectId}/{cqId}/{windowId}:
    head:
      tags:
      - Events
      summary: Get events from a window
      description: Returns events from a window.
      operationId: headersForGetWindowEvents
      parameters:
      - name: projectId
        in: path
        description: The project ID.
        required: true
        schema:
          type: string
      - name: cqId
        in: path
        description: The continuous query ID.
        required: true
        schema:
          type: string
      - name: windowId
        in: path
        description: The window ID.
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: A filter to run against events that determines whether to return
          the event.
        schema:
          type: string
      - name: sortBy
        in: query
        description: Specifies the field used to sort the results. The default sort
          direction is descending. To sort in ascending order, use `[sortfield]:ascending`.
        schema:
          type: string
      - name: limit
        in: query
        description: The maximum number of items to return.
        schema:
          type: integer
      - name: If-None-Match
        in: header
        description: Not currently supported.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag.
              schema:
                type: string
        "404":
          description: No event exists at the requested path.
    get:
      tags:
      - Events
      summary: Get events from a window
      description: Returns events from the window specified by `projectId`, `queryId`,
        and `windowId`. Use the `filter` parameter to select which events to return.
      operationId: getWindowEvents
      parameters:
      - name: projectId
        in: path
        description: The project ID.
        required: true
        schema:
          type: string
      - name: cqId
        in: path
        description: The continuous query ID.
        required: true
        schema:
          type: string
      - name: windowId
        in: path
        description: The window ID.
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: A filter to run against events that determines whether to return
          the event.
        examples:
          byType:
            summary: Filter by event type
            value: type eq 'ERROR'
          byTime:
            summary: Filter by timestamp
            value: timestamp ge '2026-05-01T00:00:00Z'
        schema:
          type: string
      - name: sortBy
        in: query
        description: Specifies the field used to sort the results. The default sort
          direction is descending. To sort in ascending order, use `[sortfield]:ascending`.
        schema:
          type: string
      - name: limit
        in: query
        description: The maximum number of items to return.
        schema:
          type: integer
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/windowEvents"
              examples:
                api:
                  $ref: "#/components/examples/windowEvents"
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/windowEvents"
              examples:
                api:
                  $ref: "#/components/examples/windowEvents"
        "404":
          description: No event exists at the requested path.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/jsonError"
  /windows:
    get:
      tags:
      - Windows
      operationId: getWindows
      summary: Get window information
      description: Returns window information.
      parameters:
      - name: schema
        description: A boolean that specifies whether to display the window schema.
          The default value is false.
        in: query
        schema:
          type: boolean
        required: false
      - name: count
        description: A boolean that specifies whether to display the number of events
          in the window. The default value is false.
        in: query
        schema:
          type: boolean
        required: false
      - name: start
        description: The index of the first item to display.
        in: query
        schema:
          type: integer
        required: false
      - name: limit
        description: The maximum number of items to display.
        in: query
        schema:
          type: integer
        required: false
      - name: filter
        description: Filters the results.
        in: query
        schema:
          type: string
        required: false
      - name: If-None-Match
        in: header
        description: Not currently supported.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/windows"
              examples:
                api:
                  $ref: "#/components/examples/windows"
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/windows"
              examples:
                api:
                  $ref: "#/components/examples/windows"
  /windows/{projectId}/{cqId}/{windowId}:
    head:
      tags:
      - Windows
      summary: Get a window
      description: Returns the window specified by `projectId`, `queryId`, and `windowId`
        if it exists.
      operationId: headersForGetWindow
      parameters:
      - name: projectId
        in: path
        description: The project ID.
        required: true
        schema:
          type: string
      - name: cqId
        in: path
        description: The continuous query ID.
        required: true
        schema:
          type: string
      - name: windowId
        in: path
        description: The window ID.
        required: true
        schema:
          type: string
      - name: schema
        in: query
        description: A boolean value that indicates whether to include window schema
          information in the response.
        schema:
          type: boolean
      - name: count
        in: query
        description: A boolean value that indicates whether to include the number
          of events that are contained in the window in the response.
        schema:
          type: boolean
      - name: If-None-Match
        in: header
        description: Not currently supported.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag.
              schema:
                type: string
        "404":
          description: No window exists at the requested path.
    get:
      tags:
      - Windows
      summary: Get a window
      description: Retrieves the window specified by projectId, queryId, and windowId
        if it exists.
      operationId: getWindow
      parameters:
      - name: projectId
        in: path
        description: The project ID.
        required: true
        schema:
          type: string
      - name: cqId
        in: path
        description: The continuous query ID.
        required: true
        schema:
          type: string
      - name: windowId
        in: path
        description: The window ID.
        required: true
        schema:
          type: string
      - name: schema
        in: query
        description: A boolean value that indicates whether to include window schema
          information in the response.
        schema:
          type: boolean
      - name: count
        in: query
        description: A boolean value that indicates whether to include the number
          of events that are contained in the window in the response.
        schema:
          type: boolean
      - name: If-None-Match
        in: header
        description: Not currently supported.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/windows"
              examples:
                api:
                  $ref: "#/components/examples/windows"
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/windows"
              examples:
                api:
                  $ref: "#/components/examples/windows"
        "404":
          description: No window exists at the requested path.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/jsonError"
    put:
      tags:
      - Windows
      summary: Update the state of the window specified by `projectId`, `cqId`, and
        `windowId`
      description: Updates the state of the specified window, including injecting
        events and enabling or disabling tracing. Event data is provided through the
        `eventUrl` parameter or the request body.
      operationId: updateWindowState
      parameters:
      - name: projectId
        in: path
        description: The project ID.
        required: true
        schema:
          type: string
      - name: cqId
        in: path
        description: The continuous query ID.
        required: true
        schema:
          type: string
      - name: windowId
        in: path
        description: The window ID.
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: The value that indicates the desired state. Valid values include
          `injected`, `tracingOn`, and `tracingOff`.
        required: true
        schema:
          type: string
          enum:
          - injected
          - tracingOn
          - tracingOff
      - name: eventUrl
        in: query
        description: A value that points to a URL that contains the event data. It
          is used with the injected state.
        schema:
          type: string
      - name: blocksize
        in: query
        description: A value that specifies the number of events per injection block.
          It is used with the injected state.
        schema:
          type: string
      - name: quiesce
        in: query
        description: An optional boolean value that indicates whether to quiesce the
          project before sending the response. It is used with the injected state.
        schema:
          type: boolean
      - name: dateformat
        in: query
        description: An optional date format to use when processing dates in the input
          data. It is used with the injected state.
        schema:
          type: string
      - name: If-Match
        in: header
        description: A condition that updates the response only when the current resource
          matches the provided value.
        required: false
        schema:
          type: string
      requestBody:
        description: The request body that contains CSV event data.
        content:
          application/vnd.sas.esp.summary:
            examples:
              api:
                value: |
                  i,n,1,event 1
                  i,n,2,event 2
        required: false
      responses:
        "200":
          description: The request succeeded.
          headers:
            ContentType:
              $ref: "#/components/headers/ContentType"
            ETag:
              description: The entity tag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                api:
                  $ref: "#/components/examples/responseJson"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                api:
                  $ref: "#/components/examples/responseJson"
        "404":
          description: No window exists at the requested path.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/jsonError"
        "400":
          $ref: "#/components/responses/errorResponse400"
        "412":
          $ref: "#/components/responses/errorResponse412IfMatch"
        "428":
          $ref: "#/components/responses/errorResponse428PreconditionRequired"
  /score:
    post:
      tags:
      - Scoring
      summary: Create a scoring request into the ESP server
      description: Submits event data to the ESP server, where a model processes the
        data and produces output events. Returns either a JSON array of resulting
        events or raw output data, depending on the project configuration.
      operationId: createScore
      requestBody:
        content:
          application/vnd.sas.summary+json:
            examples:
              example:
                $ref: "#/components/examples/scoreInput"
            schema:
              $ref: "#/components/schemas/scoreInput"
          application/json:
            examples:
              example:
                $ref: "#/components/examples/scoreInput"
            schema:
              $ref: "#/components/schemas/scoreInput"
      responses:
        "201":
          description: A scoring request was created.
          headers:
            ContentType:
              $ref: "#/components/headers/ContentType"
          content:
            application/vnd.sas.summary+json:
              examples:
                example:
                  $ref: "#/components/examples/scoreOutput"
              schema:
                $ref: "#/components/schemas/scoreOutput"
            application/json:
              examples:
                example:
                  $ref: "#/components/examples/scoreOutput"
              schema:
                $ref: "#/components/schemas/scoreOutput"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                example:
                  value: {"message": "Score request cannot complete, project p is\
                      \ not running.", "version": "1", "errorCode": -1, "httpStatusCode": 400}
components:
  headers:
    ContentType:
      description: The response `Content-Type` header from the service.
      schema:
        type: string
    ETag:
      description: The entity tag.
      schema:
        type: string
  schemas:
    api:
      description: The REST API.
      type: object
      properties:
        version:
          type: string
          description: Version
        links:
          description: The links in the SAS OpenApi specifications.
          type: array
          items:
            $ref: "#/components/schemas/link"
    link:
      description: Link
      type: object
      properties:
        href:
          type: string
          description: href
        uri:
          type: string
          description: uri
        rel:
          type: string
          description: rel
        method:
          type: string
          description: method
    globalHealth:
      description: Global Health
      type: object
      properties:
        version:
          type: string
          description: Version
        name:
          type: string
          description: The name of the collection.
        count:
          type: integer
          description: The number of items in the collection.
        items:
          type: array
          items:
            type: object
            properties:
              project:
                type: string
              property:
                type: string
              value:
                type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
    events:
      description: Events
      type: object
      properties:
        version:
          type: string
          description: Version
        name:
          type: string
          description: The name of the collection.
        items:
          type: array
          items:
            type: object
            properties:
              window:
                type: string
              values:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: string
    windowEvents:
      description: Events
      type: object
      properties:
        version:
          type: string
          description: Version
        name:
          type: string
          description: The name of the collection.
        items:
          type: array
          items:
            type: object
            properties:
              window:
                type: string
              values:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: string
    projectStats:
      description: Project statistics
      type: object
      properties:
        version:
          type: string
          description: Version
        name:
          type: string
          description: The name of the collection.
        items:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              project:
                type: string
              cq:
                type: string
              window:
                type: string
              cpu:
                type: number
              interval:
                type: integer
              system:
                type: integer
              virtual:
                type: integer
              resident:
                type: integer
    windows:
      description: Windows
      type: object
      properties:
        version:
          type: string
          description: Version
        name:
          type: string
          description: The name of the collection.
        count:
          type: integer
          description: The number of windows in the collection.
        items:
          type: array
          items:
            type: object
            properties:
              project:
                type: string
              contquery:
                type: string
              window:
                type: string
              type:
                type: string
              count:
                type: integer
              schema:
                type: object
                properties:
                  string:
                    type: string
                    description: The schema string.
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                        key:
                          type: boolean
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
    scoreInput:
      description: Scoring input.
      type: array
      items:
        type: object
        properties:
          inputs:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                value:
                  oneOf:
                  - type: string
                  - type: number
    scoreOutput:
      description: Scoring output.
      type: array
      items:
        type: object
        properties:
          outputs:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                value:
                  oneOf:
                  - type: string
                  - type: number
    error:
      description: Error response.
      type: object
      properties:
        message:
          type: string
          description: This is the error text.
        version:
          type: string
          description: Version
        errorCode:
          type: integer
          description: This is the error code.
        httpStatusCode:
          type: integer
          description: HTTP status code.
    response:
      description: A general response.
      type: object
      properties:
        response:
          type: object
          properties:
            message:
              type: string
              description: Response text.
    errorResponse:
      description: An error response from the API, with details, error codes, and
        embedded errors.
      properties:
        details:
          items:
            type: string
          type: array
          xml:
            wrapped: true
        errorCode:
          format: int32
          type: integer
          xml:
            attribute: true
        httpStatusCode:
          format: int32
          type: integer
          xml:
            attribute: true
        id:
          type: string
        links:
          items:
            $ref: "#/components/schemas/link"
          type: array
        message:
          type: string
        remediation:
          type: string
        statusCode:
          deprecated: true
          format: int32
          type: integer
          writeOnly: true
        targetUri:
          deprecated: true
          type: string
        version:
          format: int32
          type: integer
  examples:
    api:
      description: SAS Event Stream Processing v3 API endpoints.
      value: {"version": "1", "links": [{"href": "http://espsrv04.unx.sas.com:2222/eventStreamProcessing/globalHealth",
            "uri": "/eventStreamProcessing/globalHealth", "rel": "globalHealth", "method": "GET",
            "type": "application/vnd.sas.collection"}, {"href": "http://espsrv04.unx.sas.com:2222/eventStreamProcessing/events",
            "uri": "/eventStreamProcessing/events", "rel": "events", "method": "GET",
            "type": "application/vnd.sas.collection"}, {"href": "http://espsrv04.unx.sas.com:2222/eventStreamProcessing/windows",
            "uri": "/eventStreamProcessing/windows", "rel": "windows", "method": "GET",
            "type": "application/vnd.sas.collection"}, {"href": "http://espsrv04.unx.sas.com:2222/eventStreamProcessing/projectStats",
            "uri": "/eventStreamProcessing/projectStats", "rel": "projectStats", "method": "GET",
