            $ref: "#/components/schemas/renderingOptionsPdf"
          examples:
            json:
              $ref: "#/components/examples/renderingOptionsPdfJson"
        application/vnd.sas.report.rendering.options+xml:
          schema:
            $ref: "#/components/schemas/renderingOptionsPdf"
