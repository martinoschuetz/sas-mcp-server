            $ref: "#/components/schemas/renderingOptionsSpreadsheet"
          examples:
            json:
              $ref: "#/components/examples/renderingOptionsSpreadsheetJson"
      description: Options to customized pdf creation
      required: true
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error:
      $ref: "#/components/schemas/error2"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    attributes:
      title: Attributes
      description: Contains a set of attributes in the form of a map from string names
        to arbitrary values. The values may be strings, numbers, booleans, arrays,
        objects or null.
      x-sas-media-type:
        name: application/vnd.sas.attributes
        version: 1
      required:
      - version
      - attributes
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        description:
          type: string
          description: A description of the set of attributes.
        label:
          type: string
          description: A brief description or label for the set of attributes.
        attributes:
          type: object
          description: 'The map of attribute names to values.  The set of names is
            open, though individual services may define a closed set needed for a
            given resource in that service. The value of each attribute may be of
            types: number, string, boolean, array, or object.  Although property this
            is required, the mapping object can be empty, unless stated otherwise
            by specific documentation for resources where the application/vnd.sas.attributes
            type is used.'
          additionalProperties: true
        links:
          description: Links to associated resources and operations. APIs may provide
            links for the link relations `self', `update` (to replace the attributes),
            `patch` (to update some attributes) or others.
          type: array
          items:
            $ref: "#/components/schemas/link"
    pdf:
      type: object
      description: PDF document.
    spreadsheet:
      type: object
      description: Spreadsheet document.
    errorResponse:
      type: object
      description: Supplied in the response if applicable.
      properties:
        statusCode:
          type: integer
          description: error status code
        message:
          type: string
          description: error message
    image:
      description: Rendered image content.
      type: object
      properties:
        version:
          type: integer
          default: 3
          description: This media type's schema version number.
        imageType:
          type: string
          default: svg
          description: Requested image type
          enum: [svg, png]
        elementName:
          type: string
          description: name of the ent
        imageSize:
          type: string
          description: "{width}x{height}. Example: 120x120"
        svgImage:
          type: string
          description: content of the svg image. Supplied in the response for svg
            request.
        encodedImage:
          type: string
          description: base64 encoded image. Supplied in the response for png request.
            **(Since Version 2)**
        error:
          $ref: "#/components/schemas/errorResponse"
    renderedCollection:
      description: Information on currently stored rendered reports.
      properties:
        name:
          type: string
          description: The name of the collection "members" in the context of the
            request.
        start:
          type: integer
          description: The 0-based index of the result candidates to start returning.
        limit:
          type: integer
          description: The maximum number of results requested.
        count:
          type: integer
          description: The actual number of results returned in the collection.
        accept:
          type: string
          description: application/vnd.sas.identity.group.member application/vnd.sas.collection
        links:
          type: array
          description: Paging links that apply to this collection
          items:
            $ref: "#/components/schemas/link"
        items:
          type: array
          description: The actual results of a query
          items:
            $ref: "#/components/schemas/renderedReport"
        version:
          type: integer
          description: Collection schema version
    renderedReport:
      description: Information about a stored rendered report.
      type: object
      properties:
        version:
          type: integer
          default: 2
          description: This media type's schema version number. (Current version 2)
        id:
          type: string
          description: ID of the stored item.
        destination:
          type: string
          description: The documented format to use for Printing. Possible values=
            pdf, xlsx. **(Since Version 2)**
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
    renderingOptionsPdf:
      description: Request options for PDFs.
      type: object
      properties:
        version:
          type: integer
          default: 3
          description: This media type's schema version number. (Current version 3)
        timeZone:
          type: string
          default: none
          description: The client's time zone. If provided, value is used to calculate
            the UTC offset.
        utcOffsetInSeconds:
          type: integer
          default: 0
          description: The client's UTC offset (in seconds). If neither timeZone nor
            utcOffsetInSeconds is provided, value is calculated from current system
            time.
        destination:
          type: string
          default: pdf
          description: The documented format to use for Printing. Default=pdf.
        orientation:
          type: string
          default: landscape
          description: The page orientation - (options=landscape, portrait). Default=landscape
        paperType:
          type: string
          default: LETTER
          description: The paper type - (options=LETTER, LEGAL, A3, A4, A5, B4, B5,
            CSHEET, DSHEET, ESHEET, ENV_DL, EXECUTIVE, FOLIO, LEDGER, JPOST, CUSTOM).
            Default=LETTER
        paperHeight:
          type: string
          default: 8.5in
          description: A non-negative number optionally followed by one of the following
            units ( in , cm , mm , pt , px , em , ex ). Default=8.5in
        paperWidth:
          type: string
          default: 11in
          description: A non-negative number optionally followed by one of the following
            units ( in , cm , mm , pt , px , em , ex ). Default=11in
        marginTop:
          type: string
          default: .25in
          description: A non-negative number optionally followed by one of the following
            units ( in , cm , mm , pt , px , em , ex). Default=.25in
        marginBottom:
          type: string
          default: .25in
          description: A non-negative number optionally followed by one of the following
            units ( in , cm , mm , pt , px , em , ex). Default=.25in
        marginLeft:
          type: string
          default: .25in
          description: A non-negative number optionally followed by one of the following
            units ( in , cm , mm , pt , px , em , ex). Default=.25in
        marginRight:
          type: string
          default: .25in
          description: A non-negative number optionally followed by one of the following
            units ( in , cm , mm , pt , px , em , ex). Default=.25in
        fitOption:
          type: string
          default: none
          description: Identifies a fit option to guide the layout behavior in the
            printed report (options=none, expandClippedContentInAppendix). "expandClippedContentInAppendix"
            is used to detect when a visual's content was clipped and render a complete
            version on an oversized page at the end of the appendix.
        tableOfContentsDisplay:
          type: string
          default: thumbnails
          description: Controls the preferred display mode for the built-in PDF table
            of contents - (options=readerDefault, none, bookmarks, thumbnails). Default=thumbnails
        showPrintedTableOfContents:
          type: boolean
          default: false
          description: Indicates whether to generate a printed table of contents.
            Default=false
        showPageNumbers:
          type: boolean
          default: false
          description: Indicates whether or not page numbers should be displayed.
            Default=false
        showEmptyRowsAndColumns:
          type: boolean
          default: false
          description: Indicates whether or not empty rows and columns should be included
            to fill the allocated layout space for tables and crosstabs. Default=false
        showAppendix:
          type: boolean
          default: true
          description: Indicates whether or not the appendix should be included. Default=true
        appendixDisplay:
          type: string
          default: noComments
          description: a comma-delimited list of appendix display options – (options=comments,
            noComments, description, noDescription, displayRules, noDisplayRules,
            drillLevels, noDrillLevels, filters, noFilters, ranks, noRanks, parameters,
            noParameters, warnings, noWarnings, supplementalTables, noSupplementalTables).
            default=noComments
        showCoverPage:
          type: boolean
          default: false
          description: Indicates whether or not a cover page should be included. Default=false
        coverPageDisplay:
          type: string
          default: reportName,date,user,pages,text
          description: a comma-delimited list of cover page display options – (options=reportName,
            date, user, pages, text). This setting is ignored if 'showCoverPage=false'.
            Default=reportName,date,user,pages,text
        coverPageText:
          type: string
          default: ""
          description: Optional text to be included on the cover page. This setting
            is ignored if 'showCoverPage=false' or if 'text' is not included in the
            'coverPageDisplay'.
        coverPageDateTime:
          type: string
          default: ""
          description: Optional date/time string to be included on the cover page
            - (default=server date/time formatted as a locale-specific string - ie.
            'Month DD, YYYY HH:MM:SS AM ZZZ'). The client's timezone / UTC offset
            is taken into account if provided. This setting is ignored if 'showCoverPage=false'
            or if 'date' is not included in the 'coverPageDisplay'.
        reportElements:
          type: string
          default: ""
          description: Comma-delimited list of the sections or visual elements to
            print. Report elements will be printed one per page. Note that hidden
            sections will only be printed if explicitly included in the report elements
            list.
        shareable:
          type: boolean
          default: false
          description: Indicates whether or not the print output is intended for multiple
            users. If true, as used for distributed reports, the user information
            is removed from the cover page. Default=false
        maxPdfSize:
          type: string
          default: ""
          description: String value specifying the maximum PDF size the requester
            can except.  If the created PDF is larger then the value, the request
            will fail and throw an error (406).  Format is a number followed by an
            optional measure type (b,kb,mb).  Allowable Formats - 4194304, 4194304b,
            4096kb, 4mb. **(Since Version 3)**
        enablePdfAccessibleTags:
          type: boolean
          default: false
          description: Indicates whether or not to set enhanced PDF for accessibility
            screen readers. Default=false.  **(Since Version 3)**
    renderingOptionsImages:
      description: Request options for images.
      type: object
      properties:
        version:
          type: integer
          default: 1
          description: This media type's schema version number. (Current version 1)
        packageUri:
          type: string
          description: Link to an existing report package.
        thumbnail:
          type: boolean
          default: false
          description: Produces minimal output for visual elements in "thumbnail"
            mode, which suppresses detail information like graph text labels. Default=false
        images:
          type: array
          items:
