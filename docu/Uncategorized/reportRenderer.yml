---
openapi: 3.0.3
info:
  version: "7"
  title: Report Renderer
  description: |
    Produces a PDF or XLSX documents or SVG/PNG images from a report package.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: http://example.com/reportRenderer
  description: Sample server URL.
  x-sas-internal: true
tags:
- name: Root
  description: The root of Report Renderer Service.
- name: Reports
  description: Retrieval of selected rendered items.
- name: Images
  description: Retrieval of selected rendered items.
- name: Settings
  description: Retrieval of server settings.
- name: Spreadsheets
  description: Retrieval of selected rendered items.
- name: Text
  description: Retrieval of selected rendered items.
paths:
  /:
    get:
      summary: |
        Return a list of top level links
      operationId: root
      description: |
        Return a list of top level links.
      tags:
      - Root
      responses:
        "200":
          description: Successful response
          headers:
            Content-Type:
              description: application/vnd.sas.api+json;version=1
              schema:
                $ref: "#/components/schemas/api"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/topLevelLinks"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/topLevelLinks"
  /reports:
    get:
      summary: >
        Return a collection containing a list of Rendered Reports.
      description: >
        The returned collection will contain a list of Rendered Reports
        (application/vnd.sas.report.rendered).  The items field will contain the
        actual list.  If no matches are found the list will be empty.
      operationId: getRenderedReportCollection
      parameters:
      - name: start
        in: query
        description: Offset of the first domain to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of domains to return.  Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: Filter criteria for returned domains. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/reportRenderer-v7/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
      - name: sortBy
        in: query
        description: Sort the returned collection.  Sorting is supported by id, type,
          description and label.
        schema:
          type: string
      tags:
      - Reports
      responses:
        "200":
          description: Successful response
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json
              schema:
                $ref: "#/components/schemas/renderedCollection"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/renderedCollection"
              examples:
                json:
                  $ref: "#/components/examples/renderedCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/renderedCollection"
              examples:
                json:
                  $ref: "#/components/examples/renderedCollection"
  /images:
    post:
      summary: >
        Render a report package and return svg or png content. (Produces
        application/vnd.sas.report.rendered.images)
      description: >
        When called with the "application/vnd.sas.report.rendered.images" accept
        type, this endpoint will create the svg or png content from the provided report
        package uri for the requested images.  The success or failure status or
        each requested image will be detailed in the response.
      operationId: createImagesAndReturnImages
      tags:
      - Images
      requestBody:
        content:
          application/vnd.sas.report.rendering.options.images+json;version=1:
            schema:
              $ref: "#/components/schemas/renderingOptionsImages"
            examples:
              json:
                $ref: "#/components/examples/renderingOptionsImagesJson"
          application/vnd.sas.report.rendering.options.images+json:
            schema:
              $ref: "#/components/schemas/renderingOptionsImages"
            examples:
              json:
                $ref: "#/components/examples/renderingOptionsImagesJson"
          application/json:
            schema:
              $ref: "#/components/schemas/renderingOptionsImages"
            examples:
              json:
                $ref: "#/components/examples/renderingOptionsImagesJson"
          application/vnd.sas.report.rendering.options.images+xml;version=1:
            schema:
              $ref: "#/components/schemas/renderingOptionsImages"
            examples:
              xml:
                $ref: "#/components/examples/renderingOptionsImagesXml"
          application/vnd.sas.report.rendering.options.images+xml:
            schema:
              $ref: "#/components/schemas/renderingOptionsImages"
            examples:
              xml:
                $ref: "#/components/examples/renderingOptionsImagesXml"
          application/xml:
            schema:
              $ref: "#/components/schemas/renderingOptionsImages"
            examples:
              xml:
                $ref: "#/components/examples/renderingOptionsImagesXml"
        description: Options to customized svg or png creation
        required: true
      responses:
        "201":
          description: Successful response. SVG or PNG images returned in response
            body.
          headers:
            Content-Type:
              description: application/vnd.sas.report.rendered.images
              schema:
                type: string
            Location:
              description: Not used.  All data return in response body.
              schema:
                type: string
          content:
            application/vnd.sas.report.rendered.images+json;version=1:
              schema:
                $ref: "#/components/schemas/renderedImages"
              examples:
                json:
                  $ref: "#/components/examples/renderedImagesJson"
            application/vnd.sas.report.rendered.images+json:
              schema:
                $ref: "#/components/schemas/renderedImages"
              examples:
                json:
                  $ref: "#/components/examples/renderedImagesJson"
            application/json:
              schema:
                $ref: "#/components/schemas/renderedImages"
              examples:
                json:
                  $ref: "#/components/examples/renderedImagesJson"
            application/vnd.sas.report.rendered.images+xml;version=1:
              schema:
                $ref: "#/components/schemas/renderedImages"
              examples:
                xml:
                  $ref: "#/components/examples/renderedImagesXml"
            application/vnd.sas.report.rendered.images+xml:
              schema:
                $ref: "#/components/schemas/renderedImages"
              examples:
                xml:
                  $ref: "#/components/examples/renderedImagesXml"
            application/xml:
              schema:
                $ref: "#/components/schemas/renderedImages"
              examples:
                xml:
                  $ref: "#/components/examples/renderedImagesXml"
        "400":
          description: Bad Request
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/response4BadRequestJson"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                xml:
                  $ref: "#/components/examples/response4BadRequestXml"
        "404":
          description: Report not found
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/response4NotFoundJson"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                xml:
                  $ref: "#/components/examples/response4NotFoundXml"
  /reports#renderAsPdf:
    post:
      summary: |
        Render a report package and return pdf. (Produces application/pdf)
      description: >
        When called with the "application/pdf" accept type, this endpoint will
        create a pdf from the provided report package uri.  If successful, the
        pdf will be returned in the response body.
      operationId: createPdfAndReturnPdf
      tags:
      - Reports
      parameters:
      - name: packageUri
        in: query
        description: Report package uri
        required: true
        schema:
          type: string
      - name: filename
        in: query
        description: Filename to append to link.  (default report.pdf)
        required: false
        schema:
          type: string
          default: report.pdf
      requestBody:
        $ref: "#/components/requestBodies/renderingOptionsPdf"
      responses:
        "201":
          description: Successful response. application/pdf returned in response body.
          headers:
            Content-Disposition:
              description: Identifies the filename of the pdf.
              schema:
                type: string
            Location:
              description: Not used.  All data return in response body.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                $ref: "#/components/schemas/pdf"
              examples:
                pdf:
                  $ref: "#/components/examples/pdfResponse"
        "400":
          description: Bad Request
          content:
            "application/vnd.sas.error+json;version=2":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUri"
            "application/json":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUri"
            "application/vnd.sas.error+xml;version=2":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUriXML"
            "application/xml":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUriXML"
        "404":
          description: Report not found
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/response4NotFoundJson"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/response4NotFoundXml"
  /reports#createPdf:
    post:
      summary: |
        Render a report package. (Produces application/vnd.sas.report.rendered)
      description: >
        When called with the "application/vnd.sas.report.rendered" accept type,
        this endpoint will create a pdf from the provided report package uri.


        If successful, the pdf will be cached and a link (link relationship 'content')
        will be returned
        providing a way to later retrieve the pdf.


        "Note that the created pdf will automatically be deleted after a period of
        time, default 5 minutes".
      operationId: createPdfAndReturnLink
      tags:
      - Reports
      parameters:
      - name: packageUri
        in: query
        description: Report package uri
        required: true
        schema:
          type: string
      - name: filename
        in: query
        description: Filename to append to link.  (default report.pdf)
        required: false
        schema:
          type: string
          default: report.pdf
      requestBody:
        $ref: "#/components/requestBodies/renderingOptionsPdf"
      responses:
        "201":
          description: Successful response
          headers:
            Content-Type:
              description: Identifies response body type.
              schema:
                type: string
            Location:
              description: Uri to retrieve content.
              schema:
                type: string
          content:
            application/vnd.sas.report.rendered+json:
              schema:
                $ref: "#/components/schemas/renderedReport"
              examples:
                json:
                  $ref: "#/components/examples/renderedReportJson"
            application/vnd.sas.report.rendered+xml:
              schema:
                $ref: "#/components/schemas/renderedReport"
              examples:
                xml:
                  $ref: "#/components/examples/renderedReportXml"
            application/json:
              schema:
                $ref: "#/components/schemas/renderedReport"
              examples:
                json:
                  $ref: "#/components/examples/renderedReportJson"
            application/xml:
              schema:
                $ref: "#/components/schemas/renderedReport"
              examples:
                xml:
                  $ref: "#/components/examples/renderedReportXml"
        "400":
          description: Bad Request
          content:
            "application/vnd.sas.error+json;version=2":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUri"
            "application/json":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUri"
            "application/vnd.sas.error+xml;version=2":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUriXML"
            "application/xml":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUriXML"
        "404":
          description: Report not found
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/response4NotFoundJson"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/response4NotFoundJson"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                xml:
                  $ref: "#/components/examples/response4NotFoundXml"
            application/xml:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                xml:
                  $ref: "#/components/examples/response4NotFoundXml"
        "409":
          description: Conflict. The create request could not complete because the
            file was quarantined.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateAndReturnLinkConflict"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                xml:
                  $ref: "#/components/examples/responseCreateAndReturnLinkConflictXml"
  /spreadsheets#renderAsXlsx:
    post:
      summary: >
        Render a report package and return xlsx. (Produces
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet)
      description: >
        When called with the
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        accept type, this endpoint will create a xlsx from the provided report
        package uri.  If successful, the xlsx will be returned in the response
        body.
      operationId: createXlsxAndReturnXlsx
      tags:
      - Spreadsheets
      parameters:
      - name: packageUri
        in: query
        description: Report package uri
        required: true
        schema:
          type: string
      - name: filename
        in: query
        description: Filename to append to link.  (default report.xlsx)
        required: false
        schema:
          type: string
          default: report.xlsx
      requestBody:
        $ref: "#/components/requestBodies/vnd.sas.report.rendering.options.spreadsheet"
      responses:
        "201":
          description: Successful response. Xlsx returned in response body.
          headers:
            Content-Disposition:
              description: Identifyies the filename of the pdf.
              schema:
                type: string
            Location:
              description: Not used.  All data return in response body.
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: "#/components/schemas/spreadsheet"
              examples:
                spreadsheet:
                  $ref: "#/components/examples/spreadsheetXlsx"
        "400":
          description: Bad Request
          content:
            "application/vnd.sas.error+json;version=2":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUri"
            "application/json":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUri"
        "404":
          description: Report not found
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/response4NotFoundJson"
  /spreadsheets#createXlsx:
    post:
      summary: |
        Render a report package. (Produces application/vnd.sas.report.rendered)
      description: >
        When called with the "application/vnd.sas.report.rendered" accept type,
        this endpoint will create a xlsx from the provided report package uri.


        If successful, the xlsx will be cached and a link (link relationship 'content')
        will be returned
        providing a way to later retrieve the xlsx.


        "Note that the created xlsx will automatically be deleted after a period of
        time, default 5 minutes".
      operationId: createXlsxAndReturnLink
      tags:
      - Spreadsheets
      parameters:
      - name: packageUri
        in: query
        description: Report package uri
        required: true
        schema:
          type: string
      - name: filename
        in: query
        description: Filename to append to link.  (default report.xlsx)
        required: false
        schema:
          type: string
          default: report.xlsx
      requestBody:
        $ref: "#/components/requestBodies/vnd.sas.report.rendering.options.spreadsheet"
      responses:
        "201":
          description: Successful response
          headers:
            Content-Type:
              description: Identifies response body type.
              schema:
                type: string
            Location:
              description: Uri to retrieve content.
              schema:
                type: string
          content:
            application/vnd.sas.report.rendered+json:
              schema:
                $ref: "#/components/schemas/renderedReport"
              examples:
                json:
                  $ref: "#/components/examples/spreadsheetRenderedReport"
            application/json:
              schema:
                $ref: "#/components/schemas/renderedReport"
              examples:
                json:
                  $ref: "#/components/examples/spreadsheetRenderedReport"
        "400":
          description: Bad Request
          content:
            "application/vnd.sas.error+json;version=2":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUri"
            "application/json":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUri"
        "404":
          description: Report not found
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/response4NotFoundJson"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/response4NotFoundJson"
        "409":
          description: Conflict. The create request could not complete because the
            file was quarantined.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateAndReturnLinkConflict"
  /text:
    get:
      summary: >
        Render a report package and return the text rendering of a specified element.
      description: >
        When called with the "text/plain"
        accept type, this endpoint will render the specified report element
        from the provided report package uri as text.  If successful, the text
        representation of the report element will be returned in the response
        body.
      operationId: getReportElementText
      tags:
      - Text
      parameters:
      - name: packageUri
        in: query
        description: Report package uri
        required: true
        schema:
          type: string
          format: uri
      - name: reportElement
        in: query
        description: The report element to get the text rendering of
        required: true
        schema:
          type: string
          pattern: "^ve[0-9]*$"
      responses:
        "200":
          description: Successful response. Text returned in response body.
          headers:
            Content-Type:
              description: The content type of the returned response.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              example: North America Sales $400M
        "400":
          description: Bad Request
          content:
            "application/vnd.sas.error+json;version=2":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                missing packageUri:
                  $ref: "#/components/examples/missingPackageUri"
                missing reportElement:
                  $ref: "#/components/examples/missingReportElement"
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUri"
                invalid reportElement:
                  $ref: "#/components/examples/invalidReportElement"
            "application/json":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                missing packageUri:
                  $ref: "#/components/examples/missingPackageUri"
                missing reportElement:
                  $ref: "#/components/examples/missingReportElement"
                invalid packageUri:
                  $ref: "#/components/examples/invalidPackageUri"
                invalid reportElement:
                  $ref: "#/components/examples/invalidReportElement"
        "404":
          description: Not Found
          content:
            "application/vnd.sas.error+json;version=2":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                packageUri not found:
                  $ref: "#/components/examples/response4NotFoundJson"
                reportElement not found:
                  $ref: "#/components/examples/notFoundReportElement"
            "application/json":
              schema:
                $ref: "#/components/schemas/error"
              examples:
                packageUri not found:
                  $ref: "#/components/examples/response4NotFoundJson"
                reportElement not found:
                  $ref: "#/components/examples/notFoundReportElement"
  "/reports/{cacheId}":
    head:
      summary: Get the headers associated with the rendered report
      description: |
        Display a Rendered Reports for {cacheId}.
      operationId: headersForMetadataOnRenderedReport
      tags:
      - Reports
      parameters:
      - name: cacheId
        in: path
        description: Rendered Report ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          headers:
            Content-Type:
              description: Metadata for rendered report.
              schema:
                type: string
        "404":
          description: Report not found
          headers:
            Content-Type:
              description: Rendered report not found.
              schema:
                type: string
    get:
      summary: |
        Get metadata for a Rendered Report
      description: |
        Display a Rendered Reports for {cacheId}.
      operationId: getMetadataOnRenderedReport
      tags:
      - Reports
      parameters:
      - name: cacheId
        in: path
        description: Rendered Report ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          headers:
            Content-Type:
              description: Metadata for rendered report.
              schema:
                $ref: "#/components/schemas/renderedReport"
          content:
            application/vnd.sas.report.rendered+json:
              schema:
                $ref: "#/components/schemas/renderedReport"
              examples:
                json:
                  $ref: "#/components/examples/renderedReportJson"
            application/json:
              schema:
                $ref: "#/components/schemas/renderedReport"
              examples:
                json:
                  $ref: "#/components/examples/renderedReportJson"
        "404":
          description: Not Found
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseReportsCacheIdNotFound404"
    delete:
      summary: Delete the stored Rendered Report
      description: Delete the stored Rendered Report
      operationId: deleteRenderedReport
      tags:
      - Reports
      parameters:
      - name: cacheId
        in: path
        description: Rendered Report ID
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No content.
        "404":
          description: Not Found
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseReportsCacheIdNotFound404"
  "/reports/{cacheId}/{cachedFile}":
    head:
      summary: Get the headers associated with a rendered item
      description: |
        Get the rendered item for a previous request
      operationId: headersForRenderedReportContent
      tags:
      - Reports
      parameters:
      - in: path
        name: cacheId
        description: cacheId of the stored report
        required: true
        schema:
          type: string
          format: string
      - in: path
        name: cachedFile
        description: filename for report
        required: true
        schema:
          type: string
          format: string
      responses:
        "200":
          description: Successful response. PDF returned in response body.
          headers:
            Content-Type:
              description: PDF content
              schema:
                type: string
        "404":
          description: Report not found
          headers:
            Content-Type:
              description: Rendered report not found.
              schema:
                type: string
    get:
      summary: |
        Get a rendered item
      description: >
        Using the uri returned from a previous call get the cached renderer
        report.

        The previous call will create the link with the 'id' and 'filename' filled
        in.
      operationId: getRenderedReportContent
      tags:
      - Reports
      parameters:
      - in: path
        name: cacheId
        description: cacheId of the stored report
        required: true
        schema:
          type: string
          format: string
      - in: path
        name: cachedFile
        description: filename for report
        required: true
        schema:
          type: string
          format: string
      responses:
        "200":
          description: Successful response. PDF returned in response body.
          content:
            application/pdf:
              schema:
                $ref: "#/components/schemas/pdf"
              examples:
                pdf:
                  $ref: "#/components/examples/pdfResponse"
          headers:
            Content-Type:
              description: PDF content
              schema:
                $ref: "#/components/schemas/pdf"
        "404":
          description: Not Found
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseReportsCacheIdNotFound404"
  /commons/settings:
    get:
      summary: A list of the settings managed by the service
      description: >
        For more details on the returned settings, see the <a
        href="#Settings">/commons/settings</a> resource.
      operationId: getCommonSettings
      tags:
      - Settings
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.attributes+json;version=1:
              schema:
                $ref: "#/components/schemas/attributes"
              examples:
                json1:
                  $ref: "#/components/examples/responseGetCommonsSettings"
            application/vnd.sas.attributes+json:
              schema:
                $ref: "#/components/schemas/attributes"
              examples:
                json1:
                  $ref: "#/components/examples/responseGetCommonsSettings"
            application/json:
              schema:
                $ref: "#/components/schemas/attributes"
              examples:
                json1:
                  $ref: "#/components/examples/responseGetCommonsSettings"
          headers:
            Content-Type:
              description: A list of settings
              schema:
                $ref: "#/components/schemas/attributes"
components:
  requestBodies:
