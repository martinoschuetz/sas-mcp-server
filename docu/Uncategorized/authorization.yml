  /shares/configuration:
    get:
      summary: Get sharing configuration
      description: "Gets property values that specify how sharing is configured. Currently,\
        \ there are two properties that configure sharing: sas.authorization.share.enabled\
        \ and sas.authorization.share.reshare.enabled. The first determines whether\
        \ sharing is enabled at all in the system while the second determines whether\
        \ users are allowed to grant reshare permission on objects. There can be additional\
        \ properties in the future."
      tags:
      - Shares
      operationId: getShareConfiguration
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Last-Modified:
              description: Timestamp of when rule was last modified.
              schema:
                type: string
          content:
