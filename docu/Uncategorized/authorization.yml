  /shares:
    get:
      summary: Get shares
      description: Retrieves some or all shares, with or without paging.
      tags:
      - Shares
      operationId: getShares
      parameters:
      - description: The index number for the first share in a page.
        in: query
        name: start
        schema:
          type: integer
          default: 0
      - description: The maximum number of shares to return per page.
        in: query
        name: limit
        schema:
          type: integer
          default: 50
      - description: "Constraints on which shares to retrieve.  Here are the supported\
          \ filters and criteria: <ul> <li>sharedBy (eq, ne, startsWith, endsWith,\
          \ contains)</li> <li>sharedWith (eq, ne, startsWith, endsWith, contains)</li>\
          \ <li>resourceUri (eq, ne, startsWith, endsWith, contains)</li> <li>name\
          \ (eq, ne, startsWith, endsWith, contains)</li> <li>type (eq, ne)</li></ul>"
        in: query
        name: filter
        schema:
          type: string
          format: filter-criteria
      - description: Instructions for sorting the retrieved shares.  You can sort
          by name or description in ascending or descending order.
        in: query
        name: sortBy
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Last-Modified:
              description: Timestamp of when rule was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              examples:
                shareCollectionResponse:
                  $ref: "#/components/examples/shareCollectionResponse"
              schema:
                $ref: "#/components/schemas/savedShareCollection"
            application/json:
              examples:
                shareCollectionResponse:
                  $ref: "#/components/examples/shareCollectionResponse"
              schema:
                $ref: "#/components/schemas/savedShareCollection"
        "400":
          description: The request was invalid. Returned if any query criteria (sortBy,
            filter, limit, start) are invalid.
          content:
            application/vnd.sas.collection+json:
              examples:
                errorResponse400:
                  $ref: "#/components/examples/errorResponse400"
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/json:
              examples:
                errorResponse400:
                  $ref: "#/components/examples/errorResponse400"
              schema:
                $ref: "#/components/schemas/errorResponse"
    post:
      summary: Create a new share
      description: Creates a new share that has a system-generated ID.
      tags:
      - Shares
      operationId: createShare
      parameters:
      - name: Content-Type
        in: header
        required: false
        description: "Specifies the format of the incoming share. Supported media\
          \ types are: <ul> <li>application/json</li> <li>application/vnd.sas.authorization.share+json</li>\
          \ </ul>"
        schema:
          type: string
      - name: Accept
        in: header
        required: false
        description: "Specifies the desired format of the returned share. Supported\
          \ media types are: <ul> <li>application/json</li> <li>application/vnd.sas.authorization.share+json</li>\
          \ </ul>"
        schema:
          type: string
      - name: validateSharedWith
        in: query
        required: false
        description: "If true, the share recipient specified in the request body will\
          \ be validated."
        schema:
          type: boolean
      requestBody:
        content:
          application/vnd.sas.authorization.share+json:
            schema:
              $ref: "#/components/schemas/share"
            examples:
              shareResourceBody:
                $ref: "#/components/examples/shareResourceBody"
          application/json:
            schema:
              $ref: "#/components/schemas/share"
            examples:
              shareResourceBody:
                $ref: "#/components/examples/shareResourceBody"
        description: The properties of the new share.
        required: true
      responses:
        "201":
          description: A new share was created.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Last-Modified:
              description: Timestamp of when share was last modified.
              schema:
                type: string
            Location:
              description: Relative URI of the share's path.
              schema:
                type: string
            ETag:
              description: The entity tag for the share.
              schema:
                type: string
          content:
            application/vnd.sas.authorization.share+json:
              schema:
                $ref: "#/components/schemas/savedShare"
              examples:
                shareResourceResponse:
                  $ref: "#/components/examples/shareResourceResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/savedShare"
              examples:
                shareResourceResponse:
                  $ref: "#/components/examples/shareResourceResponse"
        "400":
          description: The request was invalid. Returned if the specified share is
            invalid.
    patch:
      summary: Patch shares
      description: >-
        Performs a set of share management actions as specified in a JSON patch.
        The actions are performed synchronously and transactionally. A resource
        collection of all created and revised shares is returned. If the patch
        is not successfully applied, changes are rolled back.

          For every action, the patch must specify an operation (add, replace, remove,
        test, or copy) and a target URI (for example, /authorization/shares/{shareId}
        or, to create a new share, /authorization/shares). Each add and replace operation
        requires a valid share representation.
      tags:
      - Shares
      operationId: patchShares
      parameters:
      - name: validateSharedWith
        in: query
        required: false
        description: "If true, the share recipient specified in the request body will\
          \ be validated."
        schema:
          type: boolean
      requestBody:
        content:
          application/json-patch+json:
            schema:
              description: Array of patch operations to apply to the existing shares.
              items:
                $ref: "#/components/schemas/sharePatchOperation"
              type: array
            examples:
              patch:
                summary: "Remove a share"
                value: [{"op": "remove", "path": "/authorization/shares/dc47a5c3-df46-4cc2-80ac-02e88540e746"}]
          application/json:
            schema:
              description: Array of patch operations to apply to the existing shares.
              items:
                $ref: "#/components/schemas/sharePatchOperation"
              type: array
            examples:
              patch:
                summary: "Remove a share"
                value: [{"op": "remove", "path": "/authorization/shares/dc47a5c3-df46-4cc2-80ac-02e88540e746"}]
        description: JSON patch describing operations to perform and identifying the
          target shares.
        required: true
      responses:
        "200":
          description: The request succeeded. Returned if the patch was applied successfully.
          content:
            application/vnd.sas.collection+json:
              examples:
                shareCollectionResponse:
                  $ref: "#/components/examples/shareCollectionResponse"
              schema:
                $ref: "#/components/schemas/savedShareCollection"
            application/json:
              examples:
                shareCollectionResponse:
                  $ref: "#/components/examples/shareCollectionResponse"
              schema:
                $ref: "#/components/schemas/savedShareCollection"
        "400":
          description: The request was invalid. Returned if the specified share patch
