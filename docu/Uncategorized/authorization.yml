---
openapi: 3.0.3
info:
  description: "Manages authorization rules and makes authorization decisions. <details>\
    \ <summary><b>Overview:</b></summary> <p>The Authorization API encapsulates all\
    \ activities that affect access to system functions and resources.</p> <p>This\
    \ is a summary of the functional scope of this API:</p> <ul> <li>This API enables\
    \ authorized users to define access by creating and managing authorization rules\
    \ and shares.</li> <li>This API enables any principal that has the Secure permission\
    \ for a particular object to create and manage authorization rules that directly\
    \ target that object.</li> <li>This API enables any principal that has the Secure\
    \ permission for a particular object to share that object. If re-sharing is enabled,\
    \ each share recipient can extend the access that they receive to other users\
    \ and groups.</li> <li>This API enforces authorization rules by making authorization\
    \ decisions. Each decision is evaluated for a specific authorization context.\
    \ The decision process is transparent to end users.</li> <li>This API enables\
    \ authorized principals to define capabilities that create a role based authorization\
    \ model.</li> <li>This API explains its authorization decisions by listing all\
    \ of the rules and shares that contribute to each decision.</li> <li>This API\
    \ does not manage access to CAS data (caslibs and tables) or CAS actions.</li>\
    \ </ul> </details> <br> <details> <summary><b>Security</b></summary> <p>The Authorization\
    \ API automatically protects any endpoints of any API that includes dependencies\
    \ on it. This dependency intercepts calls to the endpoints and builds an authorization\
    \ context, which is then sent to the Authorization API for evaluation. If the\
    \ context is granted permission to perform the request action on that endpoint,\
    \ it returns an HTTP status code of 200 and allows the request to proceed. If\
    \ the context is prohibited, it returns an HTTP status code of 403 and the request\
    \ does not continue further. This access is controlled by authorization rules\
    \ that can be created through bootstrapping, by an administrative user, or by\
    \ other methods.</p> </details> <br> <details> <summary><b>Terminology:</b></summary>\
    \ <ul> <li><b>authorization:</b> the process by which a set of principals is evaluated\
    \ against defined rules and a requested action to determine whether the user can\
    \ perform the action.</li> <li><b>authorization context:</b> information about\
    \ an authorization request (for example, a target URI, the HTTP headers and verb,\
    \ the requestor's group memberships, or the time of the request).</li> <li><b>condition:</b>\
    \ a logical Spring Expression Language (SpEL) expression that evaluates to either\
    \ true or false. A rule that includes a condition applies only when the condition\
    \ is true. For example, you can use a condition to make a rule applicable to only\
    \ to the creator of an object.</li> <li><b>container:</b> an object that logically\
    \ contains the URI of one or more member objects. In parent-child relationship\
    \ between objects, a container represents a parent.</li> <li><b>decision:</b>\
    \ a yes or no answer to an authorization request to perform a particular action.\
    \ Each authorization decision is based on a specific authorization context.</li>\
    \ <li><b>permission:</b> a specific action that a rule affects (for example read,\
    \ update, delete, create, secure, add, or remove).</li> <li><b>principal:</b>\
    \ an entity that represents an individual user or a group.</li> <li><b>rule:</b>\
    \ an action or set of actions that is either permitted or prohibited for a given\
    \ principal or set of principals. A rule can include a condition that limits the\
    \ circumstances under which the rule applies.</li> <li><b>share:</b> a simplified\
    \ abstraction of an authorization rule. Each share identifies a target object\
    \ (resource), a recipient (principal), and a level of access (type). Each share\
    \ is backed by a corresponding authorization rule. Shares can help users easily\
    \ make resources available to each other.</li> <li><b>capability:</b> an association\
    \ between a principal and a collection of authorization rules, providing the ability\
    \ to grant role based access control (RBAC) for various actions.</li> </ul> </details>\
    \ <br> <details> <summary><b>API Version</b></summary> <p>This is version 8 of\
    \ the Authorization API.</p> <p> <b>Changes since version 7</b> <ul> <li>Added\
    \ product to capability media types</li> </ul> </p> <p> <b>Changes since version\
    \ 6</b> <ul> <li>Added parameterizedLinks for bulk decisions</li> </ul> </p> <p>\
    \ <b>Changes since version 5</b> <ul> <li>Added capabilities endpoints</li> </ul>\
    \ </p> <p> <b>Changes since version 4</b> <ul> <li>Added the 'enabled' flag to\
    \ the share media type</li> </ul> </p> <p> <b>Changes since version 3</b> <ul>\
    \ <li>Added sharing endpoints</li> <li>Added media type matching flags for explanation\
    \ endpoints</li> <li>Added includeShares flag for explanation endpoints</li> </ul>\
    \ </p> </details> <br> <details> <summary><b>Error Codes</b></summary> <p> <table>\
    \ <tr> <th>HTTP Status Code</th> <th>Error Code</th> <th>Description</th> </tr>\
    \ <tr> <td>400</td> <td>12600</td> <td>The patch 'test' operation failed.</td>\
    \ </tr> <tr> <td>400</td> <td>12601</td> <td>Attempt to parse expression failed.</td>\
    \ </tr> <tr> <td>400</td> <td>12700</td> <td>Request cannot be satisfied because\
    \ sharing is disabled. </td> </tr> <tr> <td>500</td> <td>12800</td> <td>Cannot\
    \ retrieve group membership info for group. </td> </tr> <tr> <td>500</td> <td>12801</td>\
    \ <td>Cannot retrieve group membership info for user. </td> </tr> <tr> <td>404</td>\
    \ <td>12802</td> <td>Capability could not be found.</td> </tr> <tr> <td>400</td>\
    \ <td>12803</td> <td>Cannot assign principal to capability because principal is\
    \ not a group.</td> </tr> <tr> <td>400</td> <td>12804</td> <td>Request has mismatched\
    \ capability name.</td> </tr> <tr> <td>400</td> <td>12805</td> <td>Request includes\
    \ an unsupported principal type.</td> </tr> <tr> <td>500</td> <td>12806</td> <td>Unable\
    \ to convert authorization rule to capability.</td> </tr> <tr> <td>404</td> <td>12807</td>\
    \ <td>Request to remove non-existent authorization rule.</td> </tr> <tr> <td>400</td>\
    \ <td>12808</td> <td>Request to remove non-existent group.</td> </tr> <tr> <td>500</td>\
    \ <td>12809</td> <td>Request from an unrecognized user ID.</td> </tr> <tr> <td>403</td>\
    \ <td>12810</td> <td>Illegal attempt to elevate own permissions.</td> </tr> <tr>\
    \ <td>415</td> <td>12811</td> <td>The Accept Item header sprecified an unsupported\
    \ media type.</td> </tr> <tr> <td>428</td> <td>12812</td> <td>The request is missing\
    \ the If-Match header.</td> </tr> <tr> <td>428</td> <td>12813</td> <td>The ETag\
    \ is out-of-date.</td> </tr> </table> </p> </details>"
  title: Authorization
  version: "8"
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
tags:
- name: Rules
  description: Contains operations that create and manage authorization rules.
- name: Decisions
  description: Contains operations that make and explain authorization decisions.
- name: Shares
  description: Contains operations that concern shares.
- name: Capabilities
  description: Contains operations that create and manager authorization capabilities.
- name: Metadata
  description: Contains operations that provide information about this API.
paths:
  /:
    get:
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Last-Modified:
              description: Timestamp of when rule was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/api"
      summary: Get list of links that this API supports
      description: Clients should use this top-level endpoint and the appropriate
        link relationship to find the specific endpoint of interest.
      tags:
      - Metadata
  /decisions:
    post:
      summary: Obtain an authorization decision
      description: Determines whether a specified principal is authorized to perform
        a specified action in a specified context. The response is either true (the
        action is authorized) or false (the action is not authorized).
      tags:
      - Decisions
      operationId: createAuthorizationDecision
      requestBody:
        content:
          application/vnd.sas.authorization.context+json:
            schema:
              $ref: "#/components/schemas/authorizationContextPerm"
            examples:
              createDecision:
                $ref: "#/components/examples/createDecision"
          application/json:
            schema:
              $ref: "#/components/schemas/authorizationContextPerm"
            examples:
              createDecision:
                $ref: "#/components/examples/createDecision"
        description: The requested action and contextual details.
        required: true
      responses:
        "200":
          description: Always returned if the request is successful and the request's
            Accept header is application/vnd.sas.authorization.direct.decision+json.
            However, if the Accept header is application/json or application/vnd.sas.authorization.direct.decision+json,
            200 is returned only if the request is successful and the decision is
            `true`.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Location:
              description: Relative URI of the rule's path.
              schema:
                type: string
          content:
            application/vnd.sas.authorization.decision+json:
              examples:
                decisionResponse:
                  $ref: "#/components/examples/decisionResponse"
              schema:
                type: boolean
            application/vnd.sas.authorization.direct.decision+json:
              examples:
                decisionResponse:
                  $ref: "#/components/examples/decisionResponse"
              schema:
                type: boolean
            application/json:
              examples:
                decisionResponse:
                  $ref: "#/components/examples/decisionResponse"
              schema:
                type: boolean
            text/plain:
              examples:
                decisionResponse:
                  $ref: "#/components/examples/decisionResponse"
              schema:
                type: boolean
        "201":
          description: Always returned if the request is successful and the request's
            Accept header is text/plain
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Location:
              description: Relative URI of the rule's path.
              schema:
                type: string
          content:
            application/vnd.sas.authorization.decision+json:
              examples:
                decisionResponse:
                  $ref: "#/components/examples/decisionResponse"
              schema:
                type: boolean
            application/vnd.sas.authorization.direct.decision+json:
              examples:
                decisionResponse:
                  $ref: "#/components/examples/decisionResponse"
              schema:
                type: boolean
            application/json:
              examples:
                decisionResponse:
                  $ref: "#/components/examples/decisionResponse"
              schema:
                type: boolean
            text/plain:
              examples:
                decisionResponse:
                  $ref: "#/components/examples/decisionResponse"
              schema:
                type: boolean
        "400":
          description: The request was invalid. Returned if the authorization context
            is invalid.
        "403":
          description: Returned if the request's Accept header is application/vnd.sas.authorization.decision+json
            or application/json and the request was completed successfully but the
            authorization decision is `false`.
          content:
            application/vnd.sas.authorization.decision+json:
              examples:
                decisionResponseFail:
                  $ref: "#/components/examples/decisionResponseFail"
              schema:
                type: boolean
            application/vnd.sas.authorization.direct.decision+json:
              examples:
                decisionResponseFail:
                  $ref: "#/components/examples/decisionResponseFail"
              schema:
                type: boolean
            application/json:
              examples:
                decisionResponseFail:
                  $ref: "#/components/examples/decisionResponseFail"
              schema:
                type: boolean
            text/plain:
              examples:
                decisionResponseFail:
                  $ref: "#/components/examples/decisionResponseFail"
              schema:
                type: boolean
  /decisions#explanation:
    post:
      summary: Obtain authorization decisions with explanations
      description: Provides authorization information for specified principals in
        a specified context. Each explanation identifies the rules that are relevant
        to a particular authorization decision and includes details (such as parent
        containment) if applicable. By default, explanations are provided for only
        principals to whom relevant authorization rules are directly assigned.
      tags:
      - Decisions
      operationId: createExplanation
      parameters:
      - description: The ID of an additional user to include. You can specify this
          parameter multiple times.
        in: query
        name: additionalUser
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: The ID of an additional group to include. You can specify this
          parameter multiple times.
        in: query
        name: additionalGroup
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: Whether to provide explanations for system accounts (such as
          sasapp and sas.ops-agentsrv).
        in: query
        name: includeSystemAccounts
        required: false
        schema:
          type: boolean
          default: false
      - description: String to match rules' contentType against.
        in: query
        name: contentType
        required: false
        schema:
          type: string
      - description: String to match rules' acceptType against.
        in: query
        name: acceptType
        required: false
        schema:
          type: string
      - description: String to match rules' acceptItemType against.
        in: query
        name: acceptItemType
        required: false
        schema:
          type: string
      - description: Whether to include explanations for shares.
        in: query
        name: includeShares
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/vnd.sas.selection+json:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
              selection:
                summary: Select specific URIs
                value: {"type": "uri", "resources": ["/types/types"], "version": 1}
        description: The resources for which explanations are requested. Only 'uri'
          type selections (relative object URIs) are supported.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Location:
              description: Relative URI of the rule's path.
              schema:
                type: string
          content:
            application/vnd.sas.authorization.explanations+json:
              examples:
                explanationResponse:
                  $ref: "#/components/examples/explanationResponse"
              schema:
                $ref: "#/components/schemas/explanations"
        "400":
          description: The request was invalid. Returned if the format of the request
            does not match the schema for the media type used.
  /decisions#hypotheticalExplanation:
    post:
      summary: Obtain predictive authorization decisions
      description: Provides decisions and explanations that incorporate unsaved changes
        to authorization rules. A client enters an array of PATCH input that describes
        unsaved changes to authorization rules. The returned information is hypothetical
        in the sense that it reflects the effects of unsaved changes.
      tags:
      - Decisions
      operationId: createHypotheticalExplanation
      parameters:
      - description: The ID of an additional user to include. You can specify this
          parameter multiple times.
        in: query
        name: additionalUser
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: The ID of an additional group to include. You can specify this
          parameter multiple times.
        in: query
        name: additionalGroup
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: Whether to provide hypothetical explanations for system accounts
          (such as sasapp and sas.ops-agentsrv).
        in: query
        name: includeSystemAccounts
        required: false
        schema:
          type: boolean
          default: false
      - description: String to match rules' contentType against.
        in: query
        name: contentType
        required: false
        schema:
          type: string
      - description: String to match rules' acceptType against.
        in: query
        name: acceptType
        required: false
        schema:
          type: string
      - description: String to match rules' acceptItemType against.
        in: query
        name: acceptItemType
        required: false
        schema:
          type: string
      - description: Whether to include explanations for shares.
        in: query
        name: includeShares
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/vnd.sas.authorization.explanation.hypothetical+json:
            schema:
              $ref: "#/components/schemas/hypothetical"
            examples:
              simple:
                summary: "Impact of removing a rule"
                value: {"patch": [{"op": "test", "path": "/authorization/rules/00d038a0-e19c-44cf-8fd4-d35a8e112124",
                      "value": {"type": "grant", "permissions": ["create", "update"],
                        "objectUri": "/workflow/definitions", "principalType": "group",
                        "principal": "group1"}}, {"op": "remove", "path": "/authorization/rules/00d038a0-e19c-44cf-8fd4-d35a8e112124"}],
                  "uris": ["/workflow/definitions"]}
        description: A hypothetical object that consists of one or more URIs and one
          or more new rules.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Location:
              description: Relative URI of the rule's path.
              schema:
                type: string
          content:
            application/vnd.sas.authorization.explanations+json:
              examples:
                explanationResponse:
                  $ref: "#/components/examples/explanationResponse"
              schema:
                $ref: "#/components/schemas/explanations"
        "400":
          description: The request was invalid. Returned if the format of the request
            does not match the schema for the media type used.
  /decisions#bulk:
    post:
      summary: Obtain multiple authorization decisions
      description: Determines which actions a specified principal is authorized to
        perform in a specified context. Each requested action is evaluated against
        its associated permission. Granted and prohibited actions are returned in
        separate lists.
      tags:
      - Decisions
      operationId: createAuthorizationDecisions
      requestBody:
        content:
          application/vnd.sas.authorization.bulk.context+json:
            schema:
              $ref: "#/components/schemas/bulkAuthorizationContext"
            examples:
              createBulkDecisionBody:
                $ref: "#/components/examples/createBulkDecisionBody"
              createBulkParameterizedLinkDecisionBody:
                $ref: "#/components/examples/createBulkParameterizedLinkDecisionBody"
        description: "The requested actions and contextual details. Bulk information\
          \ must be included as a  map of permissions to arrays of links.  These maps\
          \ must be provided in the bulkLinks or parameterizedLinks members as appropriate\
          \ for the request.  Use of bulkLinks and parameterizedLinks in a single\
          \ request is supported.\n<p><b>Note:</b>  Each of the links provided in\
          \ the request must identify the resource by populating the uri member of\
          \ the link. The href member is not used. </p>"
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Location:
              description: Relative URI of the rule's path.
              schema:
                type: string
          content:
            application/vnd.sas.authorization.authorized.links+json:
              schema:
                $ref: "#/components/schemas/authorizedLinks"
              examples:
                createBulkDecisionResponse:
                  $ref: "#/components/examples/createBulkDecisionResponse"
                createBulkParameterizedLinkDecisionResponse:
                  $ref: "#/components/examples/createBulkParameterizedLinkDecisionResponse"
        "400":
          description: The request was invalid. Returned if no URIs are provided in
            the context to authorize.
  /rules:
    get:
      summary: Get authorization rules
      description: Retrieves some or all authorization rules, with or without paging.
      tags:
      - Rules
      operationId: getRules
      parameters:
      - description: "The index number for the first rule in a page. default: 0"
        in: query
        name: start
        schema:
          type: integer
          default: 0
      - description: The maximum number of rules to return per page.
        in: query
        name: limit
        schema:
          type: integer
          default: 50
      - description: "Constraints on which rules to retrieve.  Here are the supported\
          \ filters and criteria: <ul> <li>principal (eq, ne, startsWith, endsWith,\
          \ contains)</li> <li>type (eq, ne)</li> <li>principalType (eq, ne)</li>\
          \ <li>permissions (in)</li> <li>objectUri (eq, ne, startsWith, endsWith,\
          \ contains)</li> <li>containerUri (eq, ne, startsWith, endsWith, contains)</li>\
          \ <li>mediaType (eq, ne, startsWith, endsWith, contains)</li> <li>enabled\
          \ (eq, ne)</li></ul>"
        in: query
        name: filter
        schema:
          type: string
          format: filter-criteria
      - description: Instructions for sorting the retrieved rules.  You can sort by
          name or description in ascending or descending order.
        in: query
        name: sortBy
        schema:
          type: string
          format: sort-criteria
      - name: Accept-Item
        in: header
        required: false
        description: If provided, returns the items in the requested format. Supported
          media types are:<br> <ul> <li>application/vnd.sas.authorization.rule+json;version=1</li>
          <li>application/vnd.sas.authorization.rule+json;version=2</li> <li>application/vnd.sas.authorization.rule+json;version=3</li>
          <li>application/vnd.sas.authorization.rule+json;version=4</li> <li>application/vnd.sas.authorization.rule+json;version=5</li>
          <li>application/vnd.sas.authorization.rule+json;version=6</li> <li>application/vnd.sas.authorization.rule+json;version=7</li>
          <li>application/vnd.sas.authorization.rule+json;version=8</li> <li>application/vnd.sas.authorization.rule+json;version=9</li>
          <li>application/vnd.sas.authorization.rule+json;version=10</li> </ul>
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Last-Modified:
              description: Timestamp of when rule was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/savedAuthorizationRuleCollection"
              examples:
                getRule:
                  $ref: "#/components/examples/getRule"
            application/json:
              schema:
                $ref: "#/components/schemas/savedAuthorizationRuleCollection"
              examples:
                getRule:
                  $ref: "#/components/examples/getRule"
        "400":
          description: The request was invalid. Returned if any query criteria (sortBy,
            filter, limit, start) are invalid.
    post:
      summary: Create a new authorization rule
      description: Creates a new authorization rule that has a system-generated ID.
      tags:
      - Rules
      operationId: createRule
      parameters:
      - name: Content-Type
        in: header
        required: false
        description: Specifies the format of the incoming rule. Supported media types
          are:<br> <ul> <li>application/vnd.sas.authorization.rule+json;version=1</li>
          <li>application/vnd.sas.authorization.rule+json;version=2</li> <li>application/vnd.sas.authorization.rule+json;version=3</li>
          <li>application/vnd.sas.authorization.rule+json;version=4</li> <li>application/vnd.sas.authorization.rule+json;version=5</li>
          <li>application/vnd.sas.authorization.rule+json;version=6</li> <li>application/vnd.sas.authorization.rule+json;version=7</li>
          <li>application/vnd.sas.authorization.rule+json;version=8</li> <li>application/vnd.sas.authorization.rule+json;version=9</li>
          <li>application/vnd.sas.authorization.rule+json;version=10</li> </ul>
        schema:
          type: string
      - name: Accept
        in: header
        required: false
        description: Specifies the desired format of the returned rule. Supported
          media types are:<br> <ul> <li>application/vnd.sas.authorization.rule+json;version=1</li>
          <li>application/vnd.sas.authorization.rule+json;version=2</li> <li>application/vnd.sas.authorization.rule+json;version=3</li>
          <li>application/vnd.sas.authorization.rule+json;version=4</li> <li>application/vnd.sas.authorization.rule+json;version=5</li>
          <li>application/vnd.sas.authorization.rule+json;version=6</li> <li>application/vnd.sas.authorization.rule+json;version=7</li>
          <li>application/vnd.sas.authorization.rule+json;version=8</li> <li>application/vnd.sas.authorization.rule+json;version=9</li>
          <li>application/vnd.sas.authorization.rule+json;version=10</li> </ul>
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.authorization.rule+json:
            schema:
              $ref: "#/components/schemas/authorizationRule"
            examples:
              rule:
                summary: "Simple rule"
                value: {"type": "grant", "permissions": ["read"], "principal": "MyGroup",
                  "principalType": "group", "objectUri": "/types/types", "version": 10}
          application/vnd.sas.authorization.rule+json;version=1:
            schema:
              $ref: "#/components/schemas/authorizationRule"
            examples:
              rule:
                summary: "Simple rule"
                value: {"type": "grant", "permissions": ["read"], "principal": "MyGroup",
                  "principalType": "group", "objectUri": "/types/types", "version": 1}
