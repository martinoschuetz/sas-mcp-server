  /capabilities:
    get:
      summary: Get a summary list of capabilities
      description: Returns a summary list of capabilities defined in the system. Note
        that paging is not supported when the group parameter is used.
      tags:
      - Capabilities
      operationId: getCapabilities
      parameters:
      - name: group
        in: query
        required: false
        description: >
          Only capabilities that have been assigned directly to the specified
          group will be included. Starting the group name with ! will invert
          the query so that only capabilities that have not been assigned
          directly to the specified group will be included.
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        description: Set the sort order for the list. Supports ascending and descending
          on the name and description fields.
        schema:
          type: string
      - name: filter
        in: query
        required: false
        description: Instructions for filtering the retrieved capabilities. Supports
          filtering on the name and description fields.
        schema:
          type: string
          format: filter-criteria
      - name: start
        in: query
        required: false
        description: Set the start position for paging.
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Set the limit for paging.
        schema:
          type: integer
      - name: user
        in: query
        required: false
        description: >
          Only capabilities that are authorized for the specified user will be
          included in the response. The value "user=@currentUser" may be used to
          return only the current user's capabilites (current user will be pulled
          from the request's authorization token).
        schema:
          type: string
          enum:
          - "@currentUser"
      - name: Accept-Item
        in: header
        description: The respresentation to use for the returned capabilities.
        schema:
          type: string
          enum:
          - application/vnd.sas.authorization.capability
          - application/vnd.sas.authorization.capability;version=1
          - application/vnd.sas.authorization.capability;version=2
          - application/vnd.sas.authorization.capability.summary
          - application/vnd.sas.authorization.capability.summary;version=1
          - application/vnd.sas.authorization.capability.summary;version=2
          default: application/vnd.sas.authorization.capability.summary;version=2
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Last-Modified:
              description: Timestamp of when rule was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              examples:
                getCapabilitySummaryCollection:
                  $ref: "#/components/examples/getCapabilitySummaryCollection"
              schema:
                $ref: "#/components/schemas/capabilitySummaryCollection"
            application/json:
              examples:
                getCapabilitySummaryCollection:
                  $ref: "#/components/examples/getCapabilitySummaryCollection"
              schema:
                $ref: "#/components/schemas/capabilitySummaryCollection"
        "400":
          description: Bad request.
          content:
            application/vnd.sas.collection+json:
              examples:
                errorResponse400:
                  $ref: "#/components/examples/errorResponse400"
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/json:
              examples:
                errorResponse400:
                  $ref: "#/components/examples/errorResponse400"
              schema:
                $ref: "#/components/schemas/errorResponse"
        "404":
          description: Service is not available
          content:
            application/vnd.sas.collection+json:
              examples:
                errorResponse404:
                  $ref: "#/components/examples/errorResponse404"
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/json:
              examples:
                errorResponse404:
                  $ref: "#/components/examples/errorResponse404"
              schema:
                $ref: "#/components/schemas/errorResponse"
