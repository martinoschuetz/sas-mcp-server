              "type": "grant", "permissions": ["read", "update"], "objectUri": "/identities/**",
              "principalType": "authenticated-users", "reason": "Authenticated Users\
                \ can read identities, groups, users, members, memberships."}}, {
            "op": "remove", "path": "/authorization/rules/sourceId"}]]
