                  $ref: "#/components/examples/createRule"
        "400":
          description: The request was invalid. Returned if the specified authorization
            rule is invalid.
    patch:
      summary: Patch authorization rules
      description: >-
        Performs a set of rule management actions as specified in a JSON patch.
        The actions are performed synchronously and transactionally. A resource
        collection of all created and revised rules is returned. If the patch is
        not successfully applied, changes are rolled back.

          For every action, the patch must specify an operation (add, replace, remove,
        test, or copy) and a target URI (for example, /authorization/rules/{ruleId}
        or, to create a new rule, /authorization/rules). Each add and replace operation
        requires a valid rule representation. Each copy operation requires a 'from'
        URI that identifies the original rule.

          You cannot save duplicate rules, so a patch that includes a copy operation
        must also include an operation that modifies or deletes either the original
        rule or the new rule.

          You can combine operations to migrate existing rules. For example, you might
        copy a rule, then update the new rule (using the 'replace' operation), and
        then delete the original rule.

          New rules that do not yet have known rule IDs are added to a zero-indexed
        ordered list. To reference such rules, use the substitution token @CREATED#@
        (where '#' is the index of the target rule).
      tags:
      - Rules
      operationId: patchRules
      requestBody:
        content:
          application/json-patch:
            schema:
              description: Array of patch operations to apply to the existing rules.
              items:
                $ref: "#/components/schemas/rulePatchOperation"
              type: array
            examples:
              patch:
                summary: "Simple patch"
                value: [{"op": "test", "path": "/authorization/rules/00d038a0-e19c-44cf-8fd4-d35a8e112124",
                    "value": {"type": "grant", "permissions": ["create", "update"],
                      "objectUri": "/workflow/definitions", "principalType": "group",
                      "principal": "group1"}}, {"op": "remove", "path": "/authorization/rules/00d038a0-e19c-44cf-8fd4-d35a8e112124"}]
          application/json:
            schema:
              description: Array of patch operations to apply to the existing rules.
              items:
                $ref: "#/components/schemas/rulePatchOperation"
              type: array
            examples:
              patch:
                summary: "Simple patch"
                value: [{"op": "test", "path": "/authorization/rules/00d038a0-e19c-44cf-8fd4-d35a8e112124",
                    "value": {"type": "grant", "permissions": ["create", "update"],
                      "objectUri": "/workflow/definitions", "principalType": "group",
                      "principal": "group1"}}, {"op": "remove", "path": "/authorization/rules/00d038a0-e19c-44cf-8fd4-d35a8e112124"}]
        description: JSON patch describing operations to perform and identifying the
          target rules.
        required: true
      responses:
        "200":
          description: The request succeeded. Returned if the patch was applied successfully.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/ruleJob"
              examples:
                patchRules:
                  $ref: "#/components/examples/patchRules"
                migrateRule:
                  $ref: "#/components/examples/migrateRule"
            application/json:
              schema:
                $ref: "#/components/schemas/ruleJob"
              examples:
                patchRules:
                  $ref: "#/components/examples/patchRules"
                migrateRule:
                  $ref: "#/components/examples/migrateRule"
        "400":
          description: The request was invalid. Returned if the specified rule patch
            is invalid.
          content:
            application/vnd.sas.collection+json:
              examples:
                errorResponse400:
                  $ref: "#/components/examples/errorResponse400"
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/json:
              examples:
                errorResponse400:
                  $ref: "#/components/examples/errorResponse400"
              schema:
                $ref: "#/components/schemas/errorResponse"
        "422":
          description: Returned if the patch request is syntactically valid but would
            result in a resource state that is inconsistent or invalid.
          content:
            application/vnd.sas.collection+json:
              examples:
                errorResponse422:
                  $ref: "#/components/examples/errorResponse422"
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/json:
              examples:
                errorResponse422:
                  $ref: "#/components/examples/errorResponse422"
              schema:
                $ref: "#/components/schemas/errorResponse"
        "412":
          description: Precondition failed
          content:
            application/vnd.sas.collection+json:
              examples:
                errorResponse412:
                  $ref: "#/components/examples/errorResponse412"
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/json:
              examples:
                errorResponse412:
                  $ref: "#/components/examples/errorResponse412"
              schema:
                $ref: "#/components/schemas/errorResponse"
        "428":
          description: Precondition required
          content:
            application/vnd.sas.collection+json:
              examples:
                errorResponse428:
                  $ref: "#/components/examples/errorResponse428"
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/json:
              examples:
                errorResponse428:
                  $ref: "#/components/examples/errorResponse428"
              schema:
                $ref: "#/components/schemas/errorResponse"
