        schema:
          type: integer
      - name: start
        description: The index in the results to begin from
        in: query
        required: false
        schema:
          type: integer
      - name: capabilityName
        description: The name of the cpapbility to find groups for
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            Last-Modified:
              description: Timestamp of when rule was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              examples:
                getPrincipalCollection:
                  $ref: "#/components/examples/getPrincipalCollection"
              schema:
                $ref: "#/components/schemas/principalCollection"
            application/json:
              examples:
                getPrincipalCollection:
                  $ref: "#/components/examples/getPrincipalCollection"
              schema:
                $ref: "#/components/schemas/principalCollection"
        "404":
          description: No capability with the specified name has been found
          content:
            application/vnd.sas.authorization.capability+json:
              examples:
                errorResponse404:
                  $ref: "#/components/examples/errorResponse404"
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/json:
              examples:
                errorResponse404:
                  $ref: "#/components/examples/errorResponse404"
              schema:
                $ref: "#/components/schemas/errorResponse"
    post:
      summary: Assign a capability to a group
      description: Assign the specified capability to a group principal
      tags:
      - Capabilities
      operationId: addCapabilityToGroup
      parameters:
      - name: capabilityName
        in: path
        required: true
        description: The name of the capability
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/principal"
            examples:
              principal:
                summary: "Simple group principal"
                value: {"name": "exampleGroup", "type": "group", "version": 1}
        description: The group to assign the capability to
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: The URL of the created capability.
              schema:
                type: string
        "400":
          description: The principal represenation in the request body is invalid
          content:
            application/json:
              examples:
                errorResponse400:
                  $ref: "#/components/examples/errorResponse400"
              schema:
                $ref: "#/components/schemas/errorResponse"
        "403":
          description: Forbidden. The user does not have the required sas.capability.assign.group
            capability.
          content:
            application/json:
              examples:
                errorResponse403:
                  $ref: "#/components/examples/errorResponse403"
              schema:
                $ref: "#/components/schemas/errorResponse"
        "404":
          description: No capability with the specified name has been found
          content:
            application/vnd.sas.authorization.capability+json:
              examples:
                errorResponse404:
                  $ref: "#/components/examples/errorResponse404"
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/json:
              examples:
                errorResponse404:
                  $ref: "#/components/examples/errorResponse404"
              schema:
                $ref: "#/components/schemas/errorResponse"
  "/capabilities/{capabilityName}/groups/{groupId}":
    delete:
      summary: Unassign the capability from a group
      description: Remove the group from the list of groups authorized to access this
        capability.
      tags:
      - Capabilities
      operationId: deleteCapabilityFromGroup
      parameters:
      - name: capabilityName
        in: path
        required: true
        description: The name of the capability
        schema:
          type: string
      - name: groupId
        in: path
        required: true
        description: The ID of the group
        schema:
          type: string
      responses:
        "204":
          description: Capability succesfully unassigned, no content returned
        "403":
          description: Forbidden. The user does not have the required sas.capability.assign.group
            capability.
          content:
            application/vnd.sas.authorization.capability+json:
              examples:
                errorResponse403:
                  $ref: "#/components/examples/errorResponse403"
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/json:
              examples:
                errorResponse403:
                  $ref: "#/components/examples/errorResponse403"
              schema:
                $ref: "#/components/schemas/errorResponse"
        "404":
          description: No capability with the specified name has been found
          content:
            application/vnd.sas.authorization.capability+json:
              examples:
                errorResponse404:
                  $ref: "#/components/examples/errorResponse404"
              schema:
                $ref: "#/components/schemas/errorResponse"
            application/json:
              examples:
                errorResponse404:
                  $ref: "#/components/examples/errorResponse404"
              schema:
                $ref: "#/components/schemas/errorResponse"
servers:
- url: http://example.com/authorization
  description: This is an example base URL.
components:
  schemas:
    errorResponse:
      type: object
      title: Error
      description: The representation of an error.
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The error message.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred
          items:
            $ref: "#/components/schemas/errorResponse"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    baseCollection:
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    link:
      title: Link
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method to invoke this endpoint.
        rel:
          type: string
          description: The relationship of this URL to the object.
        uri:
          type: string
          description: The relative URI of the REST endpoint.
        href:
          type: string
          description: The full URL of the REST endpoint.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type consumed/produced.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    parameterizedLink:
      title: ParameterizedLink
      description: A link to a related operation or resource with a map of parameter
        names to values for use in authorization evaluations.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method to invoke this endpoint.
        rel:
          type: string
          description: The relationship of this URL to the object.
        uri:
          type: string
          description: The relative URI of the REST endpoint.
        href:
          type: string
          description: The full URL of the REST endpoint.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type consumed/produced.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
        parameters:
          type: object
          description: Map of parameter names to values.
    api:
      description: Representation of the API
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
        links:
          type: array
          description: The API's top-level links.
          items:
            $ref: "#/components/schemas/link"
    selection:
      title: Selection
      description: Identifies a set of resources.
      required:
      - version
      - resources
      properties:
        version:
          description: The schema version number of this media type. This representation
            is version 1.
          type: integer
        template:
          description: A URI template in which the {id} parameter can be replaced
            with a value from the \"resources\" array in order to yield the URI of
            the identified resource.
          type: string
          format: uri
        type:
          description: Specifies whether the resources array contains IDs, URIs, or
            both. \n<dl>\n<dt>\"id\"</dt><dd>the array contains resource identifiers
            only. This is the default if \"type\" is omitted.</dd>\n<dt>\"uri\"</dt><dd>the
            array contains resource URIs</dd>\n<dt>\"mixed\"</dt><dd>the array contains
            a mixture of identifiers and URIs.</dd>\n</dl>
          type: string
          enum:
          - id
          - uri
          - mixed
        resources:
          description: An array of resource IDs or URIs
          type: array
          items:
            type: string
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
    validation:
      title: Validation Response
      description: The response from a pre-flight validation request. For APIs which
        support validation, the client can run operations (typically on resources
        in the `/commons/validation`) with `application/vnd.sas.validation+json` as
        the requested response type (via the `Accept:` request header). The service
        will validate the request but not execute the request, and return this response
        to indicate if the request was valid at the time it was made.
      required:
      - version
      - valid
      properties:
        version:
          description: This media type's schema version number. This representation
            is version 1.
          type: integer
        valid:
          description: true if and only if the validation was successful.
          type: boolean
        error:
          $ref: "#/components/schemas/errorResponse"
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
    shareProperties:
      title: Share Properties
      description: property values that specify how sharing is configured. sas.authorization.share.enabled
        determines whether sharing is enabled at all in the system while sas.authorization.share.reshare.enabled
        determines whether users are allowed to grant reshare permission on objects.
      properties:
        sas.authorization.share.enabled:
          description: Whether sharing is enabled at all in the system
          type: boolean
        sas.authorization.share.reshare.enabled:
          description: Whether users are allowed to grant reshare permission on objects
          type: boolean
    authorizationRule:
      title: Authorization Rule
      type: object
      description: An authorization rule that does not have a known ID. The rule has
        not been saved or the ID is unavailable for some other reason. Compare with
        SavedAuthorizationRule.
      properties:
        condition:
          description: A Spring Expression Language (SpEL) expression that limits
            the applicability of the rule. The rule applies only in authorization
            contexts in which the expression evaluates to 'true'.
          type: string
        containerUri:
          description: A relative URI that represents the container aspect of a container
            object, such as a folder. Rules that target a container URI affect access
            that the container conveys to its child members.
          type: string
        expirationTimeStamp:
          description: The date and time at which the rule expires. Expired rules
            should be disregarded and deleted.
          format: date-time
          type: string
        filter:
          description: Filter criteria for the rule's target object (or objects).
            This property is not currently in use.
          type: string
        contentType:
          description: Media type of the object that is handled by an endpoint. If
            set, rules will only apply to endpoints that consume resources of this
            type. Most rules do not specify a content type.
          type: string
        acceptType:
          description: Media type of the object returned by an endpoint. If set, rules
            will only apply to endpoints that produce resources of this type. Most
            rules do not specify an accept type.
          type: string
        acceptItemType:
          description: Media type of object in a resource collection that is returned
            by an endpoint. If set, rules will only apply to endpoints that produce
            a resource collection containing resources of this type. Most rules do
            not specify an accept item type.
          type: string
        objectUri:
          description: A relative URI or ANT-path pattern that represents a resource
            or set of resources. Most rules target an object URI.
          type: string
        permissions:
          description: "The specific actions that the rule affects (for example: read,\
            \ update, delete, create, secure, add, or remove)."
          items:
            description: A type of access.
            enum:
            - add
            - create
            - delete
            - read
            - remove
            - secure
            - update
            type: string
          type: array
        principal:
          description: Specifies the ID of a user or group to which the rule applies.
            Use this property in conjunction with the principalType property.
          type: string
        principalType:
          description: The type of principal or construct to which the rule applies.
          enum:
          - user
          - group
          - authenticatedUsers
          - everyone
          - guest
          type: string
        reason:
          description: Information that a client can display to end users for diagnostic
            purposes. For example, a prohibit rule’s reason could be displayed to
            an end user as part of an 'access denied' message.
          type: string
        type:
          description: Indicates whether the rule blocks (prohibit) or attempts to
            provide (grant) access to the specified principal.
          enum:
          - grant
          - prohibit
          type: string
        version:
          description: The version of the rule representation. The current representation
            version is 8.
          format: int32
          type: integer
        description:
          description: Information that documents the rule for administrative purposes.
          type: string
        enabled:
          description: Indicates whether the rule is enabled.
          type: boolean
          default: true
        matchParams:
          description: Indicates whether the rule applies to only those requests whose
            query parameters exactly match the rule target.
          type: boolean
          default: false
        links:
          $ref: "#/components/schemas/links"
      required:
      - objectUri
      - permissions
      - principal
      - principalType
      - type
    identifiableAuthorizationRule:
      allOf:
      - $ref: "#/components/schemas/authorizationRule"
      - properties:
          ruleId:
            description: The unique identifier for the rule.
            type: string
      title: Identifiable Authorization Rule
      description: Any authorization rule that can be referenced by a unique identifier.
        This can be a savedAuthorizationRule or an unsaved authorization rule that
        has a client-specified identifier.
    savedAuthorizationRule:
      allOf:
      - $ref: "#/components/schemas/identifiableAuthorizationRule"
      - properties:
          createdBy:
            type: string
            description: The ID of the user who created the rule.
          creationTimeStamp:
            format: date-time
            type: string
            description: The date and time at which the rule was created.
          modifiedBy:
            type: string
            description: The ID of the last user to modify the rule.
          modifiedTimeStamp:
            format: date-time
            type: string
            description: The date and time at which the rule was last modified.
      title: Saved Authorization Rule
      description: An authorization rule that has a known rule ID and has been persisted.
    savedAuthorizationRuleCollection:
      title: Resource Collection of Authorization Rules
      description: A collection of saved authorization rules.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/savedAuthorizationRule"
        description: The array of application/vnd.sas.authorization.rule+json representations.
    principal:
      title: Principal
      description: A specific user or group.
      type: object
      properties:
        name:
          description: The ID of the user or group. If the principalType refers to
            a construct, no value is specified for t his property.
          type: string
        type:
          description: The type of the principal, or a construct.
          enum:
          - user
          - group
          type: string
        version:
          format: int32
          type: integer
          description: The principal media type version. The version described here
            is version 1.
    principalCollection:
      title: Resource Collection of Principals
      description: A collection of principals (users and/or groups).
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/principal"
        description: The array of principal representations.
    authorizationContext:
      title: Authorization Context
      description: Contextual information about an action that a principal is attempting.
        Represented by media type application/vnd.sas.authorization.context+json.
      properties:
        request:
          $ref: "#/components/schemas/authorizationContextRequest"
        principals:
          description: The set of principals representing the actor performing the
            action.
          type: array
          items:
            $ref: "#/components/schemas/principal"
        permission:
          description: A type of access.
          enum:
          - add
          - create
          - delete
          - read
          - remove
          - secure
          - update
          type: string
        parameters:
          description: A map of keys to objects that represent the parameters and
            return object of a method being invoked. This can be null or empty.
          type: object
        matchParams:
          description: Whether the authorization service should strictly match query
            parameters in this context against a rule.
          type: boolean
          default: false
        eachNamed:
          description: "Map of parameter names to a new name that should be used in\
            \ rule condition evaluation for collections. For example, if a parameter\
            \ being used for evaluation is a collection named 'items', then eachNamed\
            \ can map 'items' to 'item' so that item in the collection can be evaluated\
            \ independently against a rule that references the '#item' variable. "
          type: object
        version:
          format: int32
          type: integer
          description: The authorization context's media type version. The version
            described here is version 1.
    authorizationContextPerm:
      title: Authorization Context Permission Required
      description: An authorization context where the permission field is required
      required:
      - permission
      allOf:
      - $ref: "#/components/schemas/authorizationContext"
    bulkAuthorizationContext:
      title: Bulk Authorization Context
      description: "Contextual information about an action that a principal is attempting,\
        \ including one or more links that should be authorized against a supplied\
        \ permission. Represented by media type application/vnd.sas.authorization.bulk.context+json.\n\
        <p><b>Note:</b>  Use of either bulkLinks or parameterizedLinks is required.\
        \ Use of both is allowed. </p>"
      properties:
        bulkLinks:
          $ref: "#/components/schemas/permissionsToLinks"
        parameterizedLinks:
          $ref: "#/components/schemas/parameterizedLinks"
      allOf:
      - $ref: "#/components/schemas/authorizationContext"
    permissionsToLinks:
      title: Permissions to Links
      description: A map of permissions to link arrays. The keys of this map are the
        permissions that the link values are authorized for.
      type: object
      properties:
        add:
          description: An array of links that should be authorized against the add
            permission.
          type: array
          items:
            $ref: "#/components/schemas/link"
        create:
          description: An array of links that should be authorized against the create
            permission.
          type: array
          items:
            $ref: "#/components/schemas/link"
        delete:
          description: An array of links that should be authorized against the delete
            permission.
          type: array
          items:
            $ref: "#/components/schemas/link"
        read:
          description: An array of links that should be authorized against the read
            permission.
          type: array
          items:
            $ref: "#/components/schemas/link"
        remove:
          description: An array of links that should be authorized against the remove
            permission.
          type: array
          items:
            $ref: "#/components/schemas/link"
        secure:
          description: An array of links that should be authorized against the secure
            permission.
          type: array
          items:
            $ref: "#/components/schemas/link"
        update:
          description: An array of links that should be authorized against the update
            permission.
          type: array
          items:
            $ref: "#/components/schemas/link"
    parameterizedLinks:
      title: Permissions to Parameterized Links
      description: A map of permissions to parameterized link arrays. The keys of
        this map are the permissions that the link values are authorized for.  During
        authorization of the link the parameters will be added to the list of parameters
        supplied on the context.  The parameters are used in authorization conditional
        expressions.  If there is a conflict the parameters specified for the link
        will override.
      type: object
      properties:
        add:
          description: An array of links that should be authorized against the add
            permission.
          type: array
          items:
            $ref: "#/components/schemas/parameterizedLink"
        create:
          description: An array of links that should be authorized against the create
            permission.
          type: array
          items:
            $ref: "#/components/schemas/parameterizedLink"
        delete:
          description: An array of links that should be authorized against the delete
            permission.
          type: array
          items:
            $ref: "#/components/schemas/parameterizedLink"
        read:
          description: An array of links that should be authorized against the read
            permission.
          type: array
          items:
            $ref: "#/components/schemas/parameterizedLink"
        remove:
          description: An array of links that should be authorized against the remove
            permission.
          type: array
          items:
            $ref: "#/components/schemas/parameterizedLink"
        secure:
          description: An array of links that should be authorized against the secure
            permission.
          type: array
          items:
            $ref: "#/components/schemas/parameterizedLink"
        update:
          description: An array of links that should be authorized against the update
            permission.
          type: array
          items:
            $ref: "#/components/schemas/parameterizedLink"
    authorizationContextRequest:
      title: Authorization Context Request
      description: A description of the HTTP request that is associated with an authorization
        request.
      type: object
      properties:
        uri:
          description: The relative URI of the request, excluding any query parameters.
          type: string
        method:
          description: The HTTP method that is used by the caller.
          type: string
        queryString:
          description: The query string portion of the caller request, if any.
          type: string
        parameters:
          description: The request parameters map.
          type: object
        locale:
          description: The preferred locale that the client accepts content in.
          type: string
        headers:
          description: A map of HTTP header names to their values.
          type: object
        contentLength:
          description: The length, in bytes, of the request body.
          format: int32
          type: integer
        contentType:
          description: The MIME type of the body of the request.
          type: string
        protocol:
          description: The protocol of the request.
          type: string
        serverName:
          description: The name of the server to which the request was sent.
          type: string
        serverPort:
          description: The port number of the server to which the request was sent.
          format: int32
          type: integer
        serverIp:
          description: The IP address of the server to which the request was sent.
          type: string
        remoteHost:
          description: The fully qualified name of the client (or the last proxy)
            that sent the request.
          type: string
        remoteIp:
          description: The IP address of the client (or the last proxy) that sent
            the request.
          type: string
        requestDate:
          description: The date on which the request was sent, represented as the
            number of milliseconds since January 1, 1970 GMT.
          format: int32
          type: integer
        timeStamp:
          description: The date on which the request was sent, represented as a W3C/ISO
            8601 compliant timestamp string using yyyy-MM-dd'T'HH:mm:ss.SSSZ format.
          type: string
    explanations:
      title: Explanations
      description: A map of relative URI keys to an array of Explanation values. Each
        explanation in each array explains authorization decisions for one principal.
      type: object
      properties:
        version:
          description: The version of the explanation representation. The current
            representation version is 1.
          format: int32
          type: integer
        explanations:
          type: array
          items:
            $ref: "#/components/schemas/explanation"
    explanation:
      title: Explanation
      description: An explanation of access for one principal.
      example: "{'principal': {'name': 'test-user', 'type': 'user'}, 'read': {...\
        \ read explanation ...}, 'update': {... update explanation ...}, 'so on, for\
        \ each permission...':{...}}"
      properties:
        principal:
          $ref: "#/components/schemas/principal"
        add:
          $ref: "#/components/schemas/permissionExplanation"
        create:
          $ref: "#/components/schemas/permissionExplanation"
        delete:
          $ref: "#/components/schemas/permissionExplanation"
        read:
          $ref: "#/components/schemas/permissionExplanation"
        remove:
          $ref: "#/components/schemas/permissionExplanation"
        secure:
          $ref: "#/components/schemas/permissionExplanation"
        update:
          $ref: "#/components/schemas/permissionExplanation"
    individualExplanation:
      title: Individual Explanation
      description: An explanation of access for one principal and permission.
      properties:
        result:
          description: The ultimate access result for the defined principal and permission.
            A result of 'conditional' means that access might be either granted or
            denied, depending on the impact of request-time circumstances on evaluation
            of relevant conditions.
          type: string
          enum:
          - grant
          - prohibit
          - conditional
        grantFactor:
          $ref: "#/components/schemas/factor"
        prohibitFactor:
          $ref: "#/components/schemas/factor"
    permissionExplanation:
      title: Permission Explanation
      description: An explanation of access for one principal and permission. Includes
        explanations for permissions conveyed by containing objects.
      type: object
      allOf:
      - $ref: "#/components/schemas/individualExplanation"
      - properties:
          conveyedExplanation:
            $ref: "#/components/schemas/individualExplanation"
    factor:
      title: Factor
      description: Information about the source or cause of the result. Includes a
        list of applicable rules, indication of whether any of those rules has a condition,
        and whether the result is direct (a rule directly targets the defined object
        and is directly assigned to the defined principal).
      type: object
      properties:
        direct:
          type: boolean
          description: Indicates whether the result comes from a rule that targets
            the defined object directly (via objectUri) and is directly assigned to
            the defined principal. If false, the result comes from another source,
            such as inheritance a parent object), membership (a parent group), or
            the absence of applicable rules.
        condition:
          type: string
          description: The condition that affects access, if any.
        contributingRules:
          description: An array of links that indicate which rules contributed to
            this factor. If empty or null, then no explicit rules contributed and
            the result comes from the inherit semantics of the system (for example,
            prohibit is implicit if there is no relevant grant rule).
          type: array
          items:
            $ref: "#/components/schemas/link"
    ruleJob:
      title: Rule Job
      description: Instructions for a set of actions to be performed asynchronously.
        Consists of a state that describes how the overall asynchronous job is performing
        and a set of actions to perform on defined rules.
      properties:
        state:
          description: Defines the current state of an action.
          enum:
          - pending
          - running
          - completed
          - completedWithErrors
          - failed
          type: string
        actions:
          description: A set of actions to be performed on defined rules. These can
            be create, update, or delete actions. Actions are performed in their arrayed
            order.
          type: array
          items:
            $ref: "#/components/schemas/ruleAction"
        links:
          $ref: "#/components/schemas/links"
    ruleAction:
      title: Rule Action
      description: Describes an action to be performed asynchronously on a rule.
      required:
      - rule
      - type
      properties:
        rule:
          $ref: "#/components/schemas/authorizationRule"
        type:
          description: The type of action to be performed on a rule
          enum:
          - create
          - update
          - delete
          type: string
        status:
          description: Defines the current state of an action.
          enum:
          - pending
          - running
          - completed
          - completedWithErrors
          - failed
          type: string
    rulePatchOperation:
      title: Rule Patch Operation
      description: An operation to be performed on the defined rule.
      required:
      - op
      - path
      properties:
        value:
          $ref: "#/components/schemas/authorizationRule"
        op:
          description: The type of operation to perform on the defined rule.
          enum:
          - add
          - replace
          - remove
          - test
          - copy
          type: string
        path:
          description: The URI of the rule.
          type: string
    links:
      type: array
      items:
        $ref: "#/components/schemas/link"
      title: Links
      description: Zero or more links that are to related resources and actions.
    localizedValueCollection:
      title: Resource Collection of Localized Values
      description: A collection of localized values.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/localizedValue"
        description: The array of localizedValue representations.
    localizedValue:
      title: Localized Value
      description: "A name-value pair of the form (value: localizedValue)."
      properties:
        value:
          type: string
          description: The original, unlocalized value.
        localizedValue:
          type: string
          description: The corresponding localized value.
    authorizedLinks:
      title: Authorized Links
      description: The result of a bulk authorization request. For each type of link
        in the request (bulkLinks, parameterizedLinks) two arrays containing the granted
        and prohibited links will be returned.
      properties:
        grantedLinks:
          description: An array of link objects that are granted based on the permission
            requested.
          items:
            $ref: "#/components/schemas/link"
          type: array
        prohibitedLinks:
          description: An array of link objects that are prohibited based on the permission
            requested.
          items:
            $ref: "#/components/schemas/link"
          type: array
        grantedParameterizedLinks:
          description: An array of parameterizedLink objects that are granted based
            on the permission requested.
          items:
            $ref: "#/components/schemas/parameterizedLink"
          type: array
        prohibitedParameterizedLinks:
          description: An array of parameterizedLink objects that are prohibited based
            on the permission requested.
          items:
            $ref: "#/components/schemas/parameterizedLink"
          type: array
        version:
          description: The version of the authorized links format that is being referenced.
          format: int32
          type: integer
    hypothetical:
      title: Hypothetical
      description: An authorization explanation, using new additional rules that aren't
        yet persisted in the service
      properties:
        version:
          description: The version of the resource selection format that is being
            referenced.
          format: int32
          type: integer
        patch:
          description: An array of patch operations to apply to the existing rules.
          items:
            $ref: "#/components/schemas/rulePatchOperation"
          type: array
        uris:
          description: The URIs for which to create the explanations.
          items:
            description: A string that represents an object URI.
            type: string
          type: array
    share:
      title: Share
      description: A share that does not have a known ID or sharedBy value. The share
        has not been saved or the ID is unavailable for some other reason. Compare
        with SavedShare.
      type: object
      properties:
        sharedWith:
          description: The principal name of the share recipient.
          type: string
        resourceUri:
          description: A relative URI that represents a resource. All shares must
            target a resource URI.
          type: string
        name:
          description: The user-friendly name of the shared resource.
          type: string
        sharedWithType:
          description: The type of principal to which the share applies.
          enum:
          - user
          - group
          - authenticatedUsers
          - everyone
          - guest
          type: string
        type:
          description: The level of access that the share provides.
          enum:
          - read
          - readEdit
          - readShare
          - readEditShare
          type: string
        enabled:
          description: Flag indicating whether the current share is in effect or not.
          type: boolean
          default: true
        version:
          description: The version of the share representation. The current representation
            version is 2.
          format: int32
          type: integer
        links:
          $ref: "#/components/schemas/links"
      required:
      - type
      - sharedWith
      - sharedWithType
      - resourceUri
    savedShare:
      allOf:
      - $ref: "#/components/schemas/share"
      - properties:
          id:
            description: The unique identifier for the share.
            type: string
          createdBy:
            type: string
            description: The ID of the user who created the share.
          creationTimeStamp:
            format: date-time
            type: string
            description: The date and time at which the share was created.
          modifiedBy:
            type: string
            description: The ID of the last user to modify the share.
          modifiedTimeStamp:
            format: date-time
            type: string
            description: The date and time at which the share was last modified.
      title: Saved Share
      description: Any share that can be referenced by a unique identifier and has
        been persisted.
    savedShareCollection:
      title: Resource Collection of Shares
      description: A collection of saved shares.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/savedShare"
            description: The array of application/vnd.sas.authorization.rule+json
              representations.
    sharePatchOperation:
      title: Share Patch Operation
      description: An operation to be performed on the defined share.
      required:
      - op
      - path
      properties:
        value:
          $ref: "#/components/schemas/share"
        op:
          description: The type of operation to perform on the defined share.
          enum:
          - add
          - replace
          - remove
          type: string
        path:
          description: The URI of the share.
          type: string
    capabilitySummaryCollection:
      title: Capability summary collection
      description: A collection of capability summaries
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/capabilitySummary"
            description: Array containing capability summaries.
    capability:
      title: Capability
      description: Capabilties provide an abstraction layer on top of authorization
        rules, providing the ability to associate users and groups with specific application
        capabilities, and perform license checks to ensure users are authorized to
        access various areas of the software
      x-sas-type: Capability
      x-sas-media-type:
        name: application/vnd.sas.authorization.capability
        version: 1
      required:
      - name
      - description
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this capability.
        name:
          type: string
          description: The full stop separated name for this capability e.g. sas.document.edit
        description:
          type: string
          description: The description of the capability
        product:
          type: string
          description: The product associated with the capability
        principals:
          type: array
          description: List of groups that have been granted the capability
          items:
            $ref: "#/components/schemas/principal"
        version:
          type: integer
          description: The schema version for the capability.
          format: int32
        links:
          type: array
          description: Zero or more link objects relevant to the capability.
          items:
            $ref: "#/components/schemas/link"
    capabilitySummary:
      title: Capability Summary
      description: A summary object of the capability
      x-sas-type: Capability
      x-sas-media-type:
        name: application/vnd.sas.authorization.capability.summary
        version: 1
      required:
      - name
      - description
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this capability.
        name:
          type: string
          description: The full stop separated name for this capability e.g. sas.document.edit
        description:
          type: string
          description: The description of the capability
        product:
          type: string
          description: The product associated with the capability.
        version:
          type: integer
          description: The schema version for the capability.
          format: int32
        links:
          type: array
          description: Zero or more link objects relevant to the capability.
          items:
            $ref: "#/components/schemas/link"
  examples:
    api:
      summary: A summary of the list of links that this API supports
      description: A summary of top-level endpoint and the appropriate link relationship
        to find the specific endpoint of interest
      value: {"version": 1, "links": [{"method": "POST", "rel": "authorize", "href": "/authorization/decisions",
            "uri": "/authorization/decisions", "type": "application/vnd.sas.authorization.context",
            "responseType": "application/vnd.sas.authorization.decision"}, {"method": "POST",
            "rel": "createDirectAuthorizationDecision", "href": "/authorization/decisions",
            "uri": "/authorization/decisions", "type": "application/vnd.sas.authorization.context",
            "responseType": "application/vnd.sas.authorization.direct.decision+json"},
          {"method": "POST", "rel": "createTextAuthorizationDecision", "href": "/authorization/decisions",
            "uri": "/authorization/decisions", "type": "application/vnd.sas.authorization.context",
            "responseType": "text/plain"}, {"method": "GET", "rel": "rules", "href": "/authorization/rules",
            "uri": "/authorization/rules", "type": "application/vnd.sas.collection",
            "itemType": "application/vnd.sas.authorization.rule"}, {"method": "POST",
            "rel": "createRule", "href": "/authorization/rules", "uri": "/authorization/rules",
            "type": "application/vnd.sas.authorization.rule", "responseType": "application/vnd.sas.authorization.rule"},
          {"method": "GET", "rel": "rule", "href": "/authorization/rules/{ruleId}",
            "uri": "/authorization/rules/{ruleId}", "type": "application/vnd.sas.authorization.rule"},
          {"method": "PUT", "rel": "createOrUpdateRule", "href": "/authorization/rules/{ruleId}",
            "uri": "/authorization/rules/{ruleId}", "type": "application/vnd.sas.authorization.rule",
            "responseType": "application/vnd.sas.authorization.rule"}, {"method": "DELETE",
            "rel": "deleteRule", "href": "/authorization/rules/{ruleId}", "uri": "/authorization/rules/{ruleId}"},
          {"method": "PATCH", "rel": "patchRules", "href": "/authorization/rules",
            "uri": "/authorization/rules", "type": "application/json-patch+json",
            "responseType": "application/vnd.sas.collection", "responseItemType": "application/vnd.sas.authorization.rule"},
          {"method": "POST", "rel": "createDecisionExplanation", "href": "/authorization/decisions",
            "uri": "/authorization/decisions", "type": "application/vnd.sas.uriarray;\
              \ version=1", "responseType": "application/vnd.sas.authorization.explanations;version=1"},
          {"method": "POST", "rel": "authorizeLinks", "href": "/authorization/decisions",
            "uri": "/authorization/decisions", "type": "application/vnd.sas.authorization.bulk.context",
            "responseType": "application/vnd.sas.authorization.authorized.links"},
          {"method": "POST", "rel": "createBulkDecision", "href": "/authorization/bulkDecision",
            "uri": "/authorization/bulkDecision", "type": "application/vnd.sas.authorization.context",
            "responseType": "application/vnd.sas.authorization.links"}, {"method": "GET",
            "rel": "localizedTypes", "href": "/authorization/localizations/types",
            "uri": "/authorization/localizations/types", "responseType": "application/vnd.sas.collection"},
          {"method": "GET", "rel": "localizedPermissions", "href": "/authorization/localizations/permissions",
            "uri": "/authorization/localizations/permissions", "responseType": "application/vnd.sas.collection"},
          {"method": "GET", "rel": "localizedPrincipalTypes", "href": "/authorization/localizations/principalTypes",
            "uri": "/authorization/localizations/principalTypes", "responseType": "application/vnd.sas.collection"},
          {"method": "POST", "rel": "conditionValidation", "href": "/authorization/conditionValidation",
            "uri": "/authorization/conditionValidation", "responseType": "application/vnd.sas.validation"},
          {"method": "POST", "rel": "validateCondition", "href": "/authorization/commons/validations/conditions",
            "uri": "/authorization/commons/validations/conditions", "responseType": "application/vnd.sas.error"},
          {"method": "POST", "rel": "validate", "href": "/authorization/commons/validations/rules",
            "uri": "/authorization/commons/validations/rules", "responseType": "application/vnd.sas.error"},
          {"method": "PUT", "rel": "validateUpdate", "href": "/authorization/commons/validations/rules/{ruleId}",
            "uri": "/authorization/commons/validations/rules/{ruleId}", "responseType": "application/vnd.sas.error"},
          {"method": "DELETE", "rel": "validateDelete", "href": "/authorization/commons/validations/rules/{ruleId}",
            "uri": "/authorization/commons/validations/rules/{ruleId}", "responseType": "application/vnd.sas.error"},
          {"method": "POST", "rel": "createRuleJob", "href": "/authorization/rules/jobs",
            "uri": "/authorization/rules/jobs", "responseType": "application/vnd.sas.authorization.rule.job"},
          {"method": "GET", "rel": "ruleJobs", "href": "/authorization/rules/jobs/{jobId}",
            "uri": "/authorization/rules/jobs/{jobId}", "type": "application/vnd.sas.authorization.rule.job"},
          {"method": "GET", "rel": "ruleJobState", "href": "/authorization/rules/jobs/{jobId}/state",
            "uri": "/authorization/rules/jobs/{jobId}/state", "type": "application/vnd.sas.authorization.rule.job"},
          {"method": "GET", "rel": "shares", "href": "/authorization/shares/", "uri": "/authorization/shares/",
            "responseType": "application/vnd.sas.collection", "responseItemType": "application/vnd.sas.authorization.share"},
          {"method": "GET", "rel": "share", "href": "/authorization/shares/{shareId}",
            "uri": "/authorization/shares/{shareId}", "responseType": "application/vnd.sas.authorization.share"},
          {"method": "POST", "rel": "createShare", "href": "/authorization/shares",
            "uri": "/authorization/shares", "type": "application/vnd.sas.authorization.share",
            "responseType": "application/vnd.sas.authorization.share"}, {"method": "PUT",
            "rel": "updateShare", "href": "/authorization/shares/{shareId}", "uri": "/authorization/shares/{shareId}",
            "type": "application/vnd.sas.authorization.share", "responseType": "application/vnd.sas.authorization.share"},
          {"method": "DELETE", "rel": "deleteShare", "href": "/authorization/shares/{shareId}",
            "uri": "/authorization/shares/{shareId}"}, {"method": "PATCH", "rel": "patchShares",
            "href": "/authorization/shares", "uri": "/authorization/shares", "type": "application/json-patch+json",
            "responseType": "application/vnd.sas.collection", "responseItemType": "application/vnd.sas.authorization.share"},
          {"method": "GET", "rel": "shareConfiguration", "href": "/authorization/shares/configuration",
            "uri": "/authorization/shares/configuration", "responseType": "application/vnd.sas.properties+json"},
          {"method": "GET", "rel": "getCapabilities", "href": "/authorization/capabilities",
            "uri": "/authorization/capabilities", "type": "application/vnd.sas.authorization.capability",
            "responseType": "application/vnd.sas.collection", "responseItemType": "application/vnd.sas.authorization.capability"},
          {"method": "GET", "rel": "getCapabilities", "href": "/authorization/capabilities",
            "uri": "/authorization/capabilities", "type": "application/vnd.sas.authorization.capability.summary",
            "responseType": "application/vnd.sas.collection", "responseItemType": "application/vnd.sas.authorization.capability.summary"},
          {"method": "POST", "rel": "createCapability", "href": "/authorization/capabilities",
            "uri": "/authorization/capabilities", "responseType": "application/vnd.sas.authorization.capability"},
          {"method": "DELETE", "rel": "deleteGroupCapabilities", "href": "/authorization/capabilities",
            "uri": "/authorization/capabilities"}, {"method": "GET", "rel": "getCapability",
            "href": "/authorization/capabilities/{capabilityName}", "uri": "/authorization/capabilities/{capabilityName}",
            "type": "application/vnd.sas.authorization.capability.summary", "responseType": "application/vnd.sas.authorization.capability.summary"},
          {"method": "PATCH", "rel": "patchCapability", "href": "/authorization/capabilities/{capabilityName}",
            "uri": "/authorization/capabilities/{capabilityName}", "type": "application/vnd.sas.authorization.capability",
            "responseType": "application/vnd.sas.authorization.capability"}, {"method": "GET",
            "rel": "getGroupsForCapability", "href": "/authorization/capabilities/{capabilityName}/groups",
            "uri": "/authorization/capabilities/{capabilityName}/groups", "type": "application/vnd.sas.authorization.capability",
            "responseType": "application/vnd.sas.collection"}, {"method": "POST",
            "rel": "addCapabilityToGroup", "href": "/authorization/capabilities/{capabilityName}/groups",
            "uri": "/authorization/capabilities/{capabilityName}/groups"}, {"method": "DELETE",
            "rel": "deleteCapabilityFromGroup", "href": "/authorization/capabilities/{capabilityName}/groups/{groupId}",
            "uri": "/authorization/capabilities/{capabilityName}/groups/{groupId}"}]}
    createRule:
      summary: Create an Authorization Rule
      description: An example of creating an authorization rule
      value: {"type": "grant", "permissions": ["read"], "principalType": "authenticatedUsers",
        "objectUri": "/preferences/", "description": "Allow access to a service root.",
        "matchParams": false, "enabled": true, "principal": "testprincipal"}
    getRule:
      summary: Get an Authorization Rule by ID
      description: "<p>An example of using a known ID to obtain individual authorization\
        \ rules.</p> <p>To add pagination to the request, modify the request like\
        \ this: <ul><li>GET /authorization/rules?start=0&limit=20</li></ul></p>"
      value: {"type": "grant", "permissions": ["read"], "principal": "testprincipal",
        "principalType": "authenticatedUsers", "objectUri": "/preferences/", "description": "Allow\
          \ access to a service root.", "matchParams": false, "version": 10, "links": [
          {"method": "GET", "rel": "self", "href": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac",
            "uri": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac", "type": "application/vnd.sas.authorization.rule"},
          {"method": "PUT", "rel": "update", "href": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac",
            "uri": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac", "type": "application/vnd.sas.authorization.rule",
            "responseType": "application/vnd.sas.authorization.rule"}, {"method": "DELETE",
            "rel": "delete", "href": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac",
            "uri": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac"}],
        "id": "3288b305-981f-4b8d-b440-0911eabc3fac", "modifiedTimestamp": "2016-08-27T04:09:42.150Z",
        "createdTimestamp": "2016-08-27T04:09:42.150Z", "createdBy": "sas.preferences",
        "modifiedBy": "sas.preferences", "enabled": true}
    updateRule:
      summary: Update an Authorization Rule
      description: An example of using a known ID to update individual authorization
        rules.
      value: {"type": "prohibit", "permissions": ["read"], "principalType": "authenticatedUsers",
        "objectUri": "/preferences/", "description": "Allow access to a service root.",
        "matchParams": false, "version": 10, "links": [{"method": "GET", "rel": "self",
            "href": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac", "uri": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac",
            "type": "application/vnd.sas.authorization.rule"}, {"method": "PUT", "rel": "update",
            "href": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac", "uri": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac",
            "type": "application/vnd.sas.authorization.rule", "responseType": "application/vnd.sas.authorization.rule"},
          {"method": "DELETE", "rel": "delete", "href": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac",
            "uri": "/authorization/rules/3288b305-981f-4b8d-b440-0911eabc3fac"}],
        "id": "3288b305-981f-4b8d-b440-0911eabc3fac", "modifiedTimestamp": "2016-08-27T04:09:42.150Z",
        "createdTimestamp": "2016-08-27T04:09:42.150Z", "createdBy": "sas.preferences",
        "modifiedBy": "sas.preferences", "enabled": true}
    patchRules:
      summary: Patch a Collection of Rules Using a Condition
      description: "<p>An example of using a condition to set permissions and the\
        \ objectUri for a defined rule.</p> <p>The key data in this example are the\
        \ following</p> <ul> <li>The condition is named 'test'.</li> <li>The condition\
        \ indicates the existing rule must have type=grant, permissions=[read,update],\
        \ objectUri=/identities/**, and principalType=authenticated-users.</li> </ul>\
        \ <p>If all of these values match, the patch is applied and the following\
        \ is set:</p> <ul> <li>The permissions are set to Read, Update, Delete, and\
        \ Secure.</li> <li>The objectUri is set to '/identities/*'.</li> </ul> <p>If\
        \ any of these values do not match, the patch is not applied.</p>"
      value: [[{"op": "test", "path": "/authorization/rules/e7ae0810-a47d-11e7-abc4-cec278b6b50a",
            "value": {"type": "grant", "permissions": ["read", "update"], "objectUri": "/identities/**",
              "principalType": "authenticated-users"}}, {"op": "add", "path": "/authorization/rules/e7ae0810-a47d-11e7-abc4-cec278b6b50a",
            "value": {"permissions": ["read", "update, delete, secure"], "objectUri": "/identities/*"}}]]
    migrateRule:
      summary: Migrate Existing Rules with a PATCH Request
      description: "<p>An example of using a combination of defined JSON patch operations\
        \ to migrate existing rules.</p> <ul> <li>The `copy` operation copies the\
        \ existing rule and any changes that might have been applied to it.</li> <li>The\
        \ `add` or `replace` operation updates the target rule.</li> <li>The `remove`\
        \ operation must delete either the original rule or the new rule.</li> <ul>\
        \ <p>To target a rule that does not have a known ID, use the simple token\
        \ substitution system that this API provides. In a single patch, each new\
        \ rule that is created by an `add` or `copy` operation is added to a zero-indexed,\
        \ ordered list.</p> <p>Note: An `add` operation can be either a create or\
        \ an update, depending on whether a rule with the given ID already exists.\
        \ A rule that is updated is not added to the list of created rules.</p> <p>If\
        \ you know the order in which rules are created within a patch, you can reference\
        \ any such rule by its index. Use the token @CREATED#@, where '#' is the index\
        \ of the rule that you are targeting.</p> <p>This example assumes that a rule\
        \ already exists with ID = 'sourceId' and modifies the rule before removing\
        \ the source rule.</p>"
