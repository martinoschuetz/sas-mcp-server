          description: The data type of this option.
        default:
          type: object
          description: The default value of this option.
        enum:
          type: array
          description: The possible values of this option if applicable.
          items:
            type: object
        pattern:
          type: string
          description: The regular expression format for values of this option.
        presentationAttributes:
          type: object
          description: The display or UI properties to apply to this object, like
            readOnly, password.
          additionalProperties: {}
    connectorTargetDescriptiveAttributes:
      title: Connector Target Descriptive Attributes
