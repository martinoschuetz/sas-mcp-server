    customOption:
      title: customOption
      description: An option applied manually by the user.
      type: object
      required:
      - name
      - value
      properties:
        methods:
          type: array
          description: |
            The connection methods this option applies to, default=ALL. Example values include:
            - ALL
            - engine
            - connector
            - engineORC
            - enginePARQUET
          items:
            type: string
            description: a connection method name this option applies to.
        name:
          type: string
          description: the name of the option.
          maxLength: 255
        value:
          type: string
          description: the option value as string
        type:
          type: string
          description: |
            The type of the option, default=string. Possible values include:
            - string, User provided string value that is quoted.
            - enum, SAS System defined value that usually has NO spaces or special characters.
            - boolean, SAS System boolean as true/false value
            - integer, Integer value is a whole number, not a fractional number, that can be positive, negative, or zero
            - double, Double or float value such as 3.14159.  Examples are numbers with decimal points. It can represent fractional as well as whole values and can contain up to 15 digits in total, including those before and after the decimal point.
            - null, Key only field, using a boolean value for enablement.
    documentationLink:
