  schemas:
    connection:
      title: Connection
      description: A connection is the information necessary to make a connection
        to a data store.
      type: object
      required:
      - id
      - name
      - connectorTargetId
      - connectorTypeId
      properties:
        id:
          type: string
          description: The unique data source identifier.
          maxLength: 36
        name:
          type: string
          description: The non-unique name of the data connection.
          maxLength: 8
        connectorTargetId:
          type: string
          description: The unique data connector identifier for the target.
          maxLength: 36
        connectorTypeId:
          type: string
          description: The unique data connector identifier for the type.
          maxLength: 36
        description:
          type: string
          description: A brief description of the connection.
          maxLength: 1000
        label:
          type: string
          description: A display name of the connection.
          maxLength: 255
        references:
          type: array
          description: An array that contains references for connection.
          items:
            $ref: "#/components/schemas/connectionReference"
        createdBy:
          type: string
          description: The user who created this connection.
        modifiedBy:
          type: string
          description: The last user to modify this connection.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for the connection creation.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for the last connection modification.
        options:
          type: object
          description: The user-set for this connection.
          additionalProperties: {}
        properties:
          type: object
          description: The configuration properties for this connection.
          additionalProperties: {}
        methodContextResources:
          type: object
          description: The resources to manage with this connection. This is a mapping
            of method name resources, where resources map context/server to library
            name/libref.
          additionalProperties: {}
        accessControls:
          type: object
          description: >
            The list of access control permissions that control which security principal
            has access to the connection and the list of allowed operations.
            Security principal can be a user, group or authenticated users. Each security
            principal can be granted or denied one of more of these permissions: read,
            create, update, delete, secure etc.
            For each principal in the list, one authorization rule for all the grants
            and another for all the denys.
            See [Authorization service REST API documentation](https://developer.sas.com/rest-apis/authorization)
            for information related to authorization rules, principles, permissions
            etc.
          additionalProperties:
            $ref: "#/components/schemas/connectionPermission"
        customOptions:
          type: array
          description: The custom options for this connection.
          items:
            $ref: "#/components/schemas/customOption"
        version:
          type: integer
          description: The source schema version.
        links:
          type: array
          description: The paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
    connectionSummary:
      title: Summary
      description: A summary version of the connection.
      type: object
      properties:
        id:
          type: string
          description: The unique data source identifier.
          maxLength: 36
        name:
          type: string
          description: The non-unique name of the data connection.
          maxLength: 255
        description:
          type: string
          description: A brief description of the connection.
          maxLength: 1000
        type:
          type: string
          description: The name registered in types registry.
        typeDefName:
          type: string
          description: The name registered in types registry.
        iconURI:
          type: string
          description: A display icon.
        createdBy:
          type: string
          description: The user who created this connection.
        modifiedBy:
          type: string
          description: The last user to modify this connection.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for the connection creation.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for the last connection modification.
        version:
          type: integer
          description: The source schema version.
        links:
          type: array
          description: The paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
    connectionReference:
      title: Connection Reference
      description: A reference is a relationship between a connection and any object
        that is created from or derived from the connection metadata.
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The unique data source identifier.
          maxLength: 36
        method:
          type: string
          description: The name of the connection method.
          maxLength: 255
        uri:
          type: string
          description: The uri to the object managed/referenced from this connection.
          maxLength: 1000
        location:
          type: string
          description: The compute context name or cas server name related to this
            reference.
          maxLength: 500
    connectionPermission:
      title: Connection permission
      description: A connection permission.
      type: object
      properties:
        name:
          type: string
          description: The identity of the principal.
          maxLength: 255
        label:
          type: string
          description: The user presentable name for the principal.
          maxLength: 255
        type:
          type: string
          description: The type of principal, user/group.
          maxLength: 64
        permissions:
          type: object
          additionalProperties:
            type: string
    connectionCollection:
      title: Connection Collection
      type: object
      description: A pageable collection of connection resources.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: The array that contains connection resources.
            items:
              $ref: "#/components/schemas/connection"
    connectionSummaryCollection:
      title: Connection Collection
      type: object
      description: A pageable collection of connection resources.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: The array that contains connection resources.
            items:
              $ref: "#/components/schemas/connectionSummary"
    connectionRequest:
      title: Connection Request
      description: A connection to data connection.
      type: object
      required:
      - name
      - connectorTargetId
      - connectorTypeId
      properties:
        name:
          type: string
          description: The non-unique name of the data connection.
          maxLength: 8
        connectorTargetId:
          type: string
          description: The unique data connector identifier for the target.
          maxLength: 36
        connectorTypeId:
          type: string
          description: The unique data connector identifier for the type.
          maxLength: 36
        description:
          type: string
          description: A brief description of the connection.
          maxLength: 1000
        label:
          type: string
          description: A display name of the connection.
          maxLength: 255
        options:
          type: object
          description: The attributes for this connection.
          additionalProperties: {}
        properties:
          type: object
          description: The configuration properties for this connection.
          additionalProperties: {}
        methodContextResources:
          type: object
          description: The resources to manage with this connection. This is a mapping
            of method name resources, where resources map context/server to library
            name/libref.
          additionalProperties: {}
        customOptions:
          type: array
          description: The custom options for this connection.
          items:
            $ref: "#/components/schemas/customOption"
        version:
          type: integer
          description: The source schema version.
    connectionReferenceRequest:
      title: Connection reference Request
      description: A connection reference data.
      type: object
      required:
      - method
      - uri
      properties:
        method:
          type: string
          description: The name of the connection method.
          maxLength: 255
        uri:
          type: string
          description: The uri to the object managed/referenced from this connection.
          maxLength: 1000
        location:
          type: string
          description: The compute context name or cas server name related to this
            reference.
          maxLength: 500
    connectionJobRequest:
      title: Connection Job Request
      description: A job to test, connect, or delete a library from a connection.
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
          description: The non-unique name of the data connection.
          maxLength: 255
        type:
          type: string
          description: The type of connection job this is. Valid values are test,
            connect, delete.
          maxLength: 32
        parameters:
          type: object
          description: The parameters for this connection. Valid parameters keys are;
            envResourceURIs, connection, and connectionURI.
          additionalProperties:
            $ref: "#/components/schemas/connectionJobParameters"
    connectionJobParameters:
      title: Connection job parameters
      description: Parameters for metadata to take actions.
      properties:
        envResourceURIs:
          type: array
          description: Is a string [] with dataSourcesURI for each datasource.
          items:
            type: string
            description: A dataSourcesURI for each datasource such as compute context
              or CAS server with the query parameter for the session identity.
        connection:
          type: object
          description: Is a connection object inline/embedded.  Note for "connect"
            or "delete" connection job types the connection.id must be present and
            valid, for the "test" connection job type the connection.id can be omitted.
          additionalProperties:
            $ref: "#/components/schemas/connection"
        connectionURI:
          type: string
          description: Is a string value with the URI to the connection object, such
            as /dataConnections/connections/07747fe7-6be3-4785-b664-181a90b79fc2.  The
            connectionURI is not used if "connection" parameter is specified.
    connectorTargetCollection:
      title: Connector Target Collection
      type: object
      description: A pageable collection of connector target resources.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/connectorTarget"
            description: The array that contains connector target resources.
    connectionUri:
      title: Connection URI
      type: string
      description: >-
        The connection URI.

        example:  /dataConnections/connections/44bb0cc8-b1b7-4409-9067-ae8552f3444f.
    connectorTarget:
      title: Connector Target
      description: A connector target for a data source to connection.
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: The unique connector target identifier.
          maxLength: 36
        name:
          type: string
          description: The non-unique name of the connector target.
          maxLength: 255
        connectorTypeId:
          type: string
          description: The unique data connector type identifier for the related type.
          maxLength: 36
        connectorType:
          type: string
          description: The name for the connector type.
          maxLength: 255
        iconName:
          type: string
          description: The name to use to lookup the icon for this target.
          maxLength: 255
        isEnabled:
          type: boolean
          description: Is this target enabled for use in connections.
        isHidden:
