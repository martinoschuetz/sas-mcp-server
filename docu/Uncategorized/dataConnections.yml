            $ref: "#/components/schemas/link"
    connectorType:
      title: Connector Type
      description: A connector type for a data source to connection.
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: The unique data source identifier.
          maxLength: 36
        name:
