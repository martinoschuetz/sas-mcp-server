        name:
          type: string
          description: The name of the connection method.
          maxLength: 255
        type:
          type: string
          description: The type of connection method.
        runtime:
          type: array
          description: Defines the execution environments supported for this method.
          items:
            type: string
        isEnabled:
          type: boolean
          description: Defines the presentation title for the doc URL.
        documentationLabel:
          type: string
          description: The presentation title for the doc URL.
        documentationLocation:
          type: string
          description: The URL for the documentation for this connection method.
    engineOption:
      title: Engine Option
      description: The option definition.
      type: object
      properties:
        title:
          type: string
          description: The label or pretty name for this option.
        description:
          type: string
          description: The long description of this option and usage.
        type:
