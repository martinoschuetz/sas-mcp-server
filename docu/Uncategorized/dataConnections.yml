---
openapi: "3.0.3"
info:
  version: "1"
  title: Data Connections
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: "The Data Connections API is to allow the discovery and persistence\
    \ of Connections to data."
tags:
- name: Connections
  description: Contains data source operations for the connections resource.
- name: Connector Types
  description: Contains operations for connector types resource.
- name: Connector Targets
  description: Contains operations for the connector targets resource.
- name: Connection Jobs
  description: Contains job operations for the connections resource.
- name: Code
  description: Contains operations for generating code.
- name: Root
  description: Contains operations for the root resource of the Data Connections.
paths:
  /:
    get:
      operationId: root
      summary: Get a collection of top-level links
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectionRootAPI"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectionRootAPI"
  /connections:
    get:
      operationId: getConnections
      summary: Get a collection of Connections
      description: Returns a list of connections.
      tags:
      - Connections
      parameters:
      - $ref: "#/components/parameters/StartParam"
      - $ref: "#/components/parameters/LimitParam"
      - name: filter
        in: query
        description: |
          Filter criteria for returned connections. The fields that can be used as filter criteria are:
          - id
          - name
          - description
          - label
          - connectorTargetId
          - connectorTypeId
          - references.id
          - references.method
          - references.uri
          - references.location
          - createdBy
          - creationTimeStamp
          - modifiedBy
          - modifiedTimeStamp

          The supported functions are:
          - and
          - or
          - not
          - eq
          - lt
          - le
          - gt
          - ge
          - contains
          - startsWith
          - endsWith
          - isNull

          Note: A dot(.) notation is used to filter based on fields of a nested object field like 'references'.
          Some sample queries:
          - Search by name starting with:
          /dataConnections/connections?filter=startsWith(name, 'cas')
          - Search by name:
          /dataConnections/connections?filter=eq(name, 'cas')
          - Search by uri:
          /dataConnections/connections?filter=eq(reference.uri, '/dataSources/providers/Compute/sourceDefinitions/13938722-6c21-4396-8608-17680a461829')
          - Search by reference location:
          /dataConnections/connections?filter=eq(reference.location, 'SAS Studio compute context')
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: |
          Sort the order of connections. The list of sortable fields are:
          - id
          - name
          - description
          - label
          - connectorTargetId
          - connectorTypeId
          - createdBy
          - creationTimeStamp
          - modifiedBy
          - modifiedTimeStamp

          Following are the examples usages of SortBy parameter:
          - Sort ascending by name:
          /dataConnections/connections?sortBy=name:ascending
          - Sort descending by label:
          /dataConnections/connections?sortBy=label:descending
          - Sort descending by creationTimeStamp:
          /dataConnections/connections?sortBy=creationTimeStamp:descending
          - Sort ascending by references.location:
          /dataConnections/connections?sortBy=references.location:ascending
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. Any connections are returned in a resource
            collection.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/connectionCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectionCollection"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/connectionSummaryCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectionSummaryCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/connectionCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectionCollection"
        "400":
          description: |
            The request was invalid. Invalid requests occur in the following scenarios:
            - A negative start value is provided.
            - A negative limit value is provided.
            - An unsupported field is specified in the sortBy parameter.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
    post:
      operationId: createConnection
      summary: Create a connection
      description: |
        Returns a newly created connection. There are 2 options for creating a connection.
        - Based on connection media-type.
        - Based on source definition uri. If a connection for the given source definition uri already exists, then it is returned instead of creating a new one.
      tags:
      - Connections
      requestBody:
        content:
          application/vnd.sas.data.connection+json:
            schema:
              $ref: "#/components/schemas/connectionRequest"
            examples:
              schemaval:
                $ref: "#/components/examples/connectionRequest"
          application/vnd.sas.data.connection.reference+json:
            schema:
              $ref: "#/components/schemas/connectionReferenceRequest"
            examples:
              schemaval:
                $ref: "#/components/examples/connectionReferenceRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/connectionRequest"
            examples:
              schemaval:
                $ref: "#/components/examples/connectionRequest"
        description: |
          The connection creation request.
          - Use "application/vnd.sas.data.connection+json" or "application/json" Content-Type to create connection based on connection resource.
          - Use plain/text Content-Type to create connection based on a source definition uri. You can only use one source definition uri.
        required: true
      responses:
        "201":
          description: A connection was created.
          headers:
            Location:
              description: The URI of the newly created connection.
              schema:
                type: string
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this object.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.connection+json:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connection"
            application/json:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: A source definition with URI not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  /connections/{connectionId}:
    get:
      operationId: getConnection
      summary: Get a connection
      description: Get a connection.
      tags:
      - Connections
      parameters:
      - $ref: "#/components/parameters/ConnectionIDParam"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.data.connection+json:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connection"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/connectionSummary"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectionSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connection"
        "404":
          description: No connection exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
    put:
      operationId: updateConnection
      summary: Update a Connection
      description: Updates an existing connection through a full replacement of the
        resource. The ID field might not be modified by this operation.
      tags:
      - Connections
      parameters:
      - $ref: "#/components/parameters/ConnectionIDParam"
      - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        content:
          application/vnd.sas.data.connection+json:
            schema:
              $ref: "#/components/schemas/connection"
            examples:
              schemaval:
                $ref: "#/components/examples/connection"
          application/json:
            schema:
              $ref: "#/components/schemas/connection"
            examples:
              schemaval:
                $ref: "#/components/examples/connection"
        description: The connection to update.
        required: true
      responses:
        "200":
          description: The request succeeded. The connection updated successfully.
          headers:
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this connection.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.connection+json:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connection"
            application/json:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connection"
        "400":
          description: The request was invalid. One example of this occurring is when
            connection ID in the request does not match the ID in the path of the
            URL.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: No connection exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
        "412":
          description: The ETag provided does not match the current version of the
            object or the last modified date does not match.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error412"
        "428":
          description: The ETag was not provided when updating an existing type.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error428"
    delete:
      operationId: deleteConnection
      summary: Delete a connection
      description: Delete a connection.
      tags:
      - Connections
      parameters:
      - $ref: "#/components/parameters/ConnectionIDParam"
      responses:
        "204":
          description: The connection was deleted.
        "404":
          description: |
            No connection exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  /connectionJobs:
    post:
      operationId: createConnectionJob
      summary: Create a connection job
      description: Returns a new connection jobs
      tags:
      - Connection Jobs
      requestBody:
        content:
          application/vnd.sas.data.connection.job+json:
            schema:
              $ref: "#/components/schemas/connectionJobRequest"
            examples:
              schemaval:
                $ref: "#/components/examples/connectionJobRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/connectionJobRequest"
            examples:
              schemaval:
                $ref: "#/components/examples/connectionJobRequest"
        description: The connection job creation request. The only required field
          is type.
        required: true
      responses:
        "201":
          description: A connection job was created.
          headers:
            Location:
              description: The URI of the newly created job execution.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this job object.
              schema:
                type: string
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                schemaval:
                  $ref: "#/components/examples/job"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                schemaval:
                  $ref: "#/components/examples/job"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
  /connectorTypes:
    get:
      operationId: getConnectorTypes
      summary: Get a collection of connector types
      description: Returns a list of connector types defined in this API.
      tags:
      - Connector Types
      parameters:
      - $ref: "#/components/parameters/StartParam"
      - $ref: "#/components/parameters/LimitParam"
      - name: filter
        in: query
        description: |
          Filter criteria for returned connector types. The fields that can be used as filter criteria are:
          - id
          - name
          - description
          - label
          - iconName
          - sasName
          - defaultConnectorTargetId

          The supported functions are:
          - and
          - or
          - not
          - eq
          - lt
          - le
          - gt
          - ge
          - contains
          - startsWith
          - endsWith
          - isNull

          Some sample queries:
          - Search by name starting with:
          /dataConnections/connectorTypes?filter=startsWith(name, 'mongodb')
          - Search by name:
          /dataConnections/connectorTypes?filter=eq(name, 'mongodb')
          - Search by multiple name values:
          /dataConnections/connectorTypes?filter=in(name, 'mongodb', 'hadoop', 'postgresql')
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: |
          Sort the order of connector types. By default the connector types are sorted by name.
          The list of sortable fields are:
          - id
          - name
          - description
          - label
          - iconName
          - sasName
          - defaultConnectorTargetId

          Following are the examples usages of SortBy parameter:
          - Sort ascending by name:
          /dataConnections/connectorTypes?sortBy=name:ascending
          - Sort descending by label:
          /dataConnections/connectorTypes?sortBy=label:descending
          - Sort descending by creationTimeStamp:
          /dataConnections/connectorTypes?sortBy=creationTimeStamp:descending
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. Any connector types are returned in
            a resource collection.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/connectorTypeCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectorTypeCollection"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/connectorTypeSummaryCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectorTypeSummaryCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/connectorTypeCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectorTypeCollection"
        "400":
          description: |
            The request was invalid. Invalid requests occur in the following scenarios:
            - A negative start value is provided.
            - A negative limit value is provided.
            - An unsupported field is specified in the sortBy parameter.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
  /connectorTypes/{connectorTypeId}:
    get:
      operationId: getConnectorType
      summary: Get a connector type
      description: Returns a connector type.
      tags:
      - Connector Types
      parameters:
      - $ref: "#/components/parameters/ConnectorTypeIDParam"
      - $ref: "#/components/parameters/ComputeSessionIDParam"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.data.connector.type+json:
              schema:
                $ref: "#/components/schemas/connectorType"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectorType"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/connectorTypeSummary"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectorTypeSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/connectorType"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectorType"
        "404":
          description: No provider exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  /connectorTargets:
    get:
      operationId: getConnectorTargets
      summary: Get a collection of connector targets
      description: Returns a list of connector targets defined in this API.
      tags:
      - Connector Targets
      parameters:
      - $ref: "#/components/parameters/StartParam"
      - $ref: "#/components/parameters/LimitParam"
      - name: filter
        in: query
        description: |
          Filter criteria for returned connector targets. The fields that can be used as filter criteria are:
          - id
          - name
          - description
          - label
          - connectorType
          - connectorTypeId
          - iconName
          - documentation

          The supported functions are:
          - and
          - or
          - not
          - eq
          - lt
          - le
          - gt
          - ge
          - contains
          - startsWith
          - endsWith
          - isNull

          Some sample queries:
          - Search by name starting with:
          /dataConnections/connectorTargets?filter=startsWith(name, 'Postgres')
          - Search by name:
          /dataConnections/connectorTargets?filter=eq(name, 'PostgreSQL')
          - Search by multiple connector target names:
          /dataConnections/connectorTargets?filter=in(name, 'Post', 'postgres', 'PostgreSQL')
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: |
          Sort the order of connector targets.
          The list of sortable fields are:
          - id
          - name
          - description
          - label
          - connectorType
          - connectorTypeId
          - iconName
          - documentation

          Following are the examples usages of SortBy parameter:
          - Sort ascending by name:
          /dataConnections/connectorTargets?sortBy=name:ascending
          - Sort descending by name:
          /dataConnections/connectorTargets?sortBy=name:descending
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. Any connector targets are returned in
            a resource collection.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/connectorTargetCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectorTargetCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/connectorTargetCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectorTargetCollection"
        "400":
          description: |
            The request was invalid. Invalid requests occur in the following scenarios:
            - A negative start value is provided.
            - A negative limit value is provided.
            - An unsupported field is specified in the sortBy parameter.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
  /connectorTargets/{connectorTargetId}:
    get:
      operationId: getConnectorTarget
      summary: Get a connector target
      description: Returns a connector target.
      tags:
      - Connector Targets
      parameters:
      - $ref: "#/components/parameters/ConnectorTargetIDParam"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.data.connector.target.summary+json:
              schema:
                $ref: "#/components/schemas/connectorTargetSummary"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectorTargetSummary"
            application/vnd.sas.data.connector.target+json:
              schema:
                $ref: "#/components/schemas/connectorTarget"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectorTarget"
            application/json:
              schema:
                $ref: "#/components/schemas/connectorTarget"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectorTarget"
        "404":
          description: No connector target exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  /code:
    post:
      operationId: generateCode
      summary: Generate code
      description: Returns generated code for a runtime or a collection of generated
        code for more than one connection runtime.
      tags:
      - Code
      parameters:
      - $ref: "#/components/parameters/GenerateCodeAcceptHeader"
      - $ref: "#/components/parameters/CodeGenerationMethodParam"
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/connectionUri"
            examples:
              schemaval:
                $ref: "#/components/examples/connectionUri"
          application/vnd.sas.data.connection+json:
            schema:
              $ref: "#/components/schemas/connectionRequest"
            examples:
              schemaval:
                $ref: "#/components/examples/connectionCodeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/connectionRequest"
            examples:
              schemaval:
                $ref: "#/components/examples/connectionCodeRequest"
        description: |
          Generate code for connection runtime. Example: SAS code to create a library.
          - Use "application/vnd.sas.data.connection+json" or "application/json" Content-Type to create connection based on connection resource.
        required: true
      responses:
        "200":
          description: Code generation was successful.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/connectionCodeCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/connectionCodeCollection"
            text/vnd.sas.source.sas:
              schema:
                type: string
              examples:
                schemaval:
                  $ref: "#/components/examples/connectionSASCode"
            text/vnd.sas.source.casl:
              schema:
                type: string
              examples:
                schemaval:
                  $ref: "#/components/examples/connectionCASLCode"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
