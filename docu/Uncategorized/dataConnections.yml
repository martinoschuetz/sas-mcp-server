        sasName:
          type: string
          description: An internal name of the type of connection.
          maxLength: 255
        optionMappings:
          $ref: "#/components/schemas/connectionOptions"
        defaultConnectorTargetId:
          type: string
          description: The unique identity of the default target for this connector
            type.
          maxLength: 36
        methods:
          type: array
          description: The set of ways the system can use to connect to the data source.
          items:
            $ref: "#/components/schemas/methods"
        links:
          type: array
          description: The paging links that apply to this object.
          items:
