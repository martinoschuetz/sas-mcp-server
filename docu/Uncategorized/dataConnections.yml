        storageLocation:
          type: boolean
          description: Defines whether or not the connector target is a storage location.
        variant:
          type: object
          properties:
            parent:
              type: object
              description: If this connector target is a subvariant, the parent.
            isDefault:
              type: boolean
              description: Defines whether the connector target is a default.
            isDerivative:
              type: boolean
              description: Defines whether the connector target is a derivative.
            isVariant:
              type: boolean
              description: Defines whether the connector target is a variant.
    connectionCode:
