  /scenarioSets/export:
    post:
      summary: Export Scenario Sets
      description: Export selected scenario sets to a file returned to the client
        or to a server side resource.  The request body is a list of scenario set
        id's. <p/> By default, the selected scenario sets will be exported to a server
        resource as described by the locationType, location, and fileName query parameters.  When
        exporting to a folder, the file extension is used to determine if the exported
        file is text/csv or an excel workbook. <p/> The selected scenario sets may
        instead be returned as either a text/csv file or an excel workbook.  When
        exporting in excel, the scenarios that are members of the sets are also exported
        on a separate tab from the scenario sets, in one of three table representations
        (described in the <a href="#section/Table-Formats">Table Formats</a> section).
      operationId: exportScenarioSets
      tags:
      - ScenarioSets
      parameters:
      - name: Accept
        in: header
        description: Select the desired result representation.  For exporting to a
          server location, select one of the json options; for streaming the scenario
          set to the client, select one of the document options (text/csv or excel).
        schema:
          type: string
          enum:
          - application/vnd.sas.risk.scenario.export.report+json
          - application/json
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - text/csv
      - name: baselineId
        in: query
        required: false
        schema:
          type: string
        description: The ID of a value-based scenario that is optionally used when
          exporting sets containing shocks.  The indicated scenario defines a baseline
          that can be used to compute the value of shocks which are expressed as absolute
          or relative changes.
      - name: includeScenarioHistory
        in: query
        required: false
        schema:
          type: boolean
        description: when true, include any scenario specific historical data that
          was imported into this service with the sets' members.  Historical data
          is any value in a scenario that occurs before the scenario's asOfDate.  When
          false, only values associated with dates after the scenario's asOfDate will
          be included.  Note that this option defaults to "true".
      - name: includeMarketData
        in: query
        required: false
        schema:
          type: boolean
        description: when true, include historical information from the risk-market-data
          service for each variable in the sets' members, exported on a row where
          the scenario name and version are empty.  By default, only the most recent
          historical value for each variable will be included.
      - name: marketDataStart
        in: query
        required: false
        schema:
          type: string
          format: date
        description: only used when includeMarketData is true, ignored otherwise.
          The date of the beginning of exported historical data from the risk-market-data
          service. When this parameter is omitted, then only the most recent historical
          value for each variable will be incuded.
      - $ref: "#/components/parameters/locationType"
      - $ref: "#/components/parameters/location"
      - $ref: "#/components/parameters/fileName"
      - name: dateBasedFormat
        in: query
        schema:
          type: boolean
        description: When true, the sets' members will be written in Date Based format;
