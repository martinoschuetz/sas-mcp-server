  "/scenarioSets/@item":
    get:
      summary: Look up a scenario set by unique query filter
      description: Returns the scenario set described by the query.  A filter must
        be specified that uniquely describes only one item in the collection.  By
        default, the json representation is returned, but text/csv or excel may be
        requested via the 'Accept' header.
      operationId: getScenarioSetByFilter
      tags:
      - ScenarioSet
      parameters:
      - $ref: "#/components/parameters/filter"
      - name: Accept
        in: header
        required: false
        description: The desired scenario set representation.  The default is 'application/vnd.sas.risk.scenario.set+json'.
        schema:
          type: string
          enum:
          - application/vnd.sas.risk.scenario.set+json
          - application/json
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/vnd.sas.risk.scenario.set+csv
          - text/csv
      - name: includeScenarioHistory
        in: query
        required: false
        schema:
          type: boolean
        description: only used when returning excel, ignored otherwise.  When true,
          include any scenario specific historical data that was imported into this
          service with the set's members. The history data will be included on the
          'Scenarios' tab unless all the scenarios share the exact same history, in
          which case it will appear on a separate tab.  Historical data is any value
          in a scenario that occurs before the scenario's asOfDate.  When false, only
          values associated with dates after the scenario's asOfDate will be included.
          Note that this option defaults to "true".
      - name: includeMarketData
        in: query
        required: false
        schema:
          type: boolean
        description: only used when returning excel, ignored otherwise.  When true,
          include historical information from the risk-market-data service for each
          variable in the set's member' scenarios, exported on a row of the 'Scenarios'
          tab where the scenario name and version are empty.  By default, only the
          most recent historical value for each variable will be included.
      - name: marketDataStart
        in: query
        required: false
        schema:
          type: string
          format: date
        description: only used when returning excel, and includeMarketData is true;
          otherwise ignored.  The date of the beginning of exported historical data
          from the risk-market-data service. When this parameter is omitted, then
          only the most recent historical value for each variable will be included.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the scenario set was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.risk.scenario.set+json:
              schema:
                $ref: "#/components/schemas/scenarioSet"
              example:
                $ref: "#/components/examples/scenarioSet/value"
            application/json:
              schema:
                $ref: "#/components/schemas/scenarioSet"
              example:
                $ref: "#/components/examples/scenarioSet/value"
            text/csv:
              example:
                $ref: "#/components/examples/scenarioSetReport/value"
            application/vnd.sas.risk.scenario.set+csv:
              example:
                $ref: "#/components/examples/scenarioSetReport/value"
        "400":
          description: No valid filter describing a unique resource was included in
            the request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
        "404":
          description: No qualifying scenario set exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
