  /scenarios/{scenarioId}:
    parameters:
    - name: scenarioId
      in: path
      schema:
        type: string
      required: true
      description: The unique identifier for the scenario.
    get:
      summary: Get a scenario
      description: Returns the scenario with the specified id.  By default, the summary
        representation is returned, but the fully specified scenario, a scenario in
        fixed format, or one of three CSV representations (described in the <a href="#section/Table-Formats">Table
        Formats</a> section) may be requested via the 'Accept' header.
      operationId: getScenario
      tags:
      - Scenario
      parameters:
      - name: Accept
        in: header
        description: Select the desired item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.risk.scenario.summary+json
          - application/vnd.sas.risk.scenario+json
          - application/vnd.sas.risk.scenario.fixed+json
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - text/csv
      - name: asOfDate
        in: query
        schema:
          type: string
          format: date
        description: only used when returning fixed format, text/csv, or excel; ignored
          otherwise.  When given, provides the start date from which interval based
          horizon dates will be computed.
      - name: dateBasedFormat
        in: query
        schema:
          type: boolean
        description: only used when returning text/csv or excel, ignored otherwise.  When
          true, the scenario will be written in Date Based format; when false or omitted,
          the scenario will be written in Expanded format.  This option is deprecated,
          being replaced with the tableFormat option that allows for more supported
          formats.  It will be honored until at least 2025.09.
      - name: tableFormat
        in: query
        schema:
          type: string
          enum:
          - COMBINED
          - DATEBASED
          - EXPANDED
        description: only used when returning text/csv or excel, ignored otherwise.  The
          name of the format used to return the scenario table.  Defaults to Expanded.
      - name: fileName
        in: query
        schema:
          type: string
        description: only used when returning text/csv or excel, ignored otherwise.  The
          name of the file returned to the client.  If a file extension is included,
          it must be appropriate for the requested media type, either .csv or .xslx.
      - name: includeScenarioHistory
        in: query
        required: false
        schema:
          type: boolean
        description: only used when returning text/csv or excel, ignored otherwise.  When
          true, include any scenario-specific historical data that was imported in
          this service.  Historical data is any value in a scenario that occurs before
          the scenario's asOfDate.  When false, only values associated with dates
          after the scenario's asOfDate will be included. Note that this option defaults
          to "true".
      - name: includeMarketData
        in: query
        required: false
        schema:
          type: boolean
        description: only used when returning text/csv, ignored otherwise.  When tableFormat=COMBINED,
          this is always true; this defaults to false for other values of tableFormat.  When
          true, include historical information from the risk-market-data service for
          each variable in the scenario, exported on a rows where the scenario name
          and version are empty.  By default, only the most recent historical value
          for each variable will be included.
      - name: marketDataStart
        in: query
        required: false
        schema:
          type: string
          format: date
        description: only used when returning text/csv or excel, and includeMarketData
          is true; ignored otherwise.  The date of the beginning of exported historical
          data from the risk-market-data service.  When this parameter is omitted,
          then only the most recent historical value for each variable will be incuded.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the scenario was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.risk.scenario.summary+json:
              schema:
                $ref: "#/components/schemas/scenarioSummaryV1"
              example:
                $ref: "#/components/examples/scenarioSummary/value"
            application/vnd.sas.risk.scenario+json:
              schema:
                $ref: "#/components/schemas/scenario"
              example:
                $ref: "#/components/examples/scenario/value"
            application/vnd.sas.risk.scenario.fixed+json:
              schema:
                $ref: "#/components/schemas/scenario"
              example:
                $ref: "#/components/examples/scenario/value"
            application/json:
              schema:
                $ref: "#/components/schemas/scenarioSummaryV1"
              example:
                $ref: "#/components/examples/scenarioSummary/value"
            "text/csv;tableformat=datebased":
              schema:
                $ref: "#/components/schemas/dateBasedFormat"
              example:
                $ref: "#/components/examples/dateBasedFormat/value"
            "text/csv;tableformat=combined":
              schema:
                $ref: "#/components/schemas/combinedFormat"
              example:
                $ref: "#/components/examples/combinedFormat/value"
            "text/csv;tableformat=expanded":
              schema:
                $ref: "#/components/schemas/expandedFormat"
              example:
                $ref: "#/components/examples/expandedFormat/value"
            text/csv:
              schema:
                $ref: "#/components/schemas/expandedFormat"
              example:
                $ref: "#/components/examples/expandedFormat/value"
        "404":
          description: No scenario exists at the requested path, or the scenario is
            not a member of any scenario sets.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
    put:
      summary: Update a scenario
      description: Updates the scenario with the specified id to the representation
        in the request body.
      operationId: updateScenario
      tags:
      - Scenario
      parameters:
      - name: If-Unmodified-Since
        in: header
        required: true
        schema:
          type: string
        description: The timestamp obtained from the most recent `Last-Modified` response
          header. Must match the timestamp when the scenario was last modified.
      requestBody:
        description: The scenario to be updated
        required: false
        content:
          application/vnd.sas.risk.scenario+json:
            schema:
              $ref: "#/components/schemas/updateScenario"
            example:
              $ref: "#/components/examples/updateScenario/value"
          application/json:
            schema:
              $ref: "#/components/schemas/updateScenario"
            example:
              $ref: "#/components/examples/updateScenario/value"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the scenario was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.risk.scenario+json:
              schema:
                $ref: "#/components/schemas/scenario"
              example:
                $ref: "#/components/examples/scenario/value"
            application/json:
              schema:
                $ref: "#/components/schemas/scenario"
              example:
                $ref: "#/components/examples/scenario/value"
        "400":
          description: No scenario exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
        "404":
          description: No scenario exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
        "409":
          description: The item has been locked and cannot be modified.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
        "412":
          description: "The `If-Unmodified-Since` request header did not match the\
            \ resource's last modified timestamp."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
        "428":
          description: The request headers did not include an `If-Unmodified-Since`
            precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
    delete:
      summary: Delete a scenario
      description: Deletes the specified scenario.  Delete will fail if the scenario
        is locked.
      operationId: deleteScenario
      tags:
      - Scenario
      responses:
        "204":
          description: The request succeeded; nothing to return
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
        "409":
          description: The item has been locked and cannot be modified.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
