---
openapi: 3.0.3
info:
  title: Risk Scenarios
  description: The Risk Scenarios API manages a shared set of scenarios (value-based
    scenarios and shock objects), scenario sets and shock sets for all Risk Management
    solutions.
  version: "7"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: "https://example.com/riskScenarios"
  description: an example server for experimentation
tags:
- name: Scenario
  description: The operations for a scenario resource.
- name: Scenarios
  description: The operations for the scenarios resource.
- name: ScenarioSet
  description: The operations for a scenario set resource.
- name: ScenarioSets
  description: The operations for the scenario sets resource.
- name: ScenarioContext
  description: ScenarioContext implementation.
- name: Utility
  description: Utility operations.
- name: Root
  description: The operations for the root resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type of the response; "application/vnd.sas.api+json"
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              example:
                $ref: "#/components/examples/rootLinks/value"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              example:
                $ref: "#/components/examples/rootLinks/value"
  /scenarios:
    get:
      summary: Get scenarios
      description: Returns a collection of scenarios based on the specified filtering
        options. By default, the collection is returned as an 'application/vnd.sas.collection'
        object whose items of are type `application/vnd.sas.risk.scenario.summary`.
        The 'Accept-Item' header may be passed to request alternative representations
        of the collection's items; the supported options are 'application/vnd.sas.risk.scenario'
        and 'application/vnd.sas.risk.scenario.fixed'. <p> The requested scenarios
        may also be returned in one of two CSV representations (described in the <a
        href="#section/Table-Formats">Table Formats</a> section) by specifying 'text/csv'
        in the 'Accept' header. <p/> Basic filter syntax is supported on all simple
        properties a scenario.
      operationId: getScenarios
      tags:
      - Scenarios
      parameters:
      - name: Accept
        in: header
        description: Select the desired collection representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/json
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - text/csv
      - name: Accept-Item
        in: header
        description: Select the desired item representation, when the Accept header
          value is application/json or application/vnd.sas.collection+json
        schema:
          type: string
          enum:
          - application/vnd.sas.risk.scenario.summary+json
          - application/vnd.sas.risk.scenario.fixed+json
          - application/vnd.sas.risk.scenario+json
      - $ref: "#/components/parameters/pagingStart"
      - $ref: "#/components/parameters/pagingLimit"
      - $ref: "#/components/parameters/filter"
      - name: fileName
        in: query
        schema:
          type: string
        required: false
        description: only used when returning text/csv or excel, ignored otherwise.  The
          name of the file to which scenarios will be written and streamed to the
          client.  If a file extension is included, it must be appropriate for the
          requested media type -- either .csv or .xlsx.
      - name: dateBasedFormat
        in: query
        schema:
          type: boolean
        description: only used when returning text/csv or excel, ignored otherwise.  When
          true, the scenarios will be written in Date Based format; when false or
          omitted, the scenarios will be written in Expanded format.  This option
          is deprecated, being replaced with the tableFormat option that allows for
          more supported formats.  It will be honored until at least 2025.09.
      - name: tableFormat
        in: query
        schema:
          type: string
          enum:
          - COMBINED
          - DATEBASED
          - EXPANDED
        description: only used when returning text/csv or excel, ignored otherwise.  The
          name of the format used to return the scenario table.  Defaults to Expanded.
      - name: fields
        in: query
        description: very limited support for projections of the full application/vnd.sas.risk.scenario
          representation.  The value 'periods' is the only supported value for this
          parameter, and all fields from application/vnd.sas.risk.scenario.summary
          will always be included.
        schema:
          type: string
      - name: asOfDate
        in: query
        schema:
          type: string
          format: date
        description: only used when returning fixed format, ignored otherwise.  When
          given, provides the start date from which interval based horizon dates will
          be computed
      - name: includeScenarioHistory
        in: query
        required: false
        schema:
          type: boolean
        description: only used when returning text/csv or excel, ignored otherwise.  When
          true, include any scenario-specific historical data that was imported into
          this service.  Historical data is any value in a scenario that occurs before
          the scenario's asOfDate.  When false, only values associated with dates
          after the scenario's asOfDate will be included. Note that this option defaults
          to "true".
      - name: includeMarketData
        in: query
        required: false
        schema:
          type: boolean
        description: only used when returning text/csv, ignored otherwise.  When tableFormat=COMBINED,
          this is always true; this defaults to false for other values of tableFormat.  When
          true, include historical information from the risk-market-data service for
          each variable in the scenario, exported on a row where the scenario name
          and version are empty.  By default, only the most recent historical value
          for each variable will be included.
      - name: marketDataStart
        in: query
        required: false
        schema:
          type: string
          format: date
        description: only used when returning text/csv or excel, and includeMarketData
          is true; otherwise ignored.  The date of the beginning of exported historical
          data from the risk-market-data service.  When this parameter is omitted,
          then only the most recent historical value for each variable will be included.
      - name: searchString
        in: query
        schema:
          type: string
        description: when fully or partially matching this string in any tags of this
          scenario or its attributes (name, description, createdBy, modifiedBy, etc.),
          it will be included in the results.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type of the response; depending on the Accept
                header, will be either "application/vnd.sas.collection+json" or "text/csv"
              schema:
                type: string
            Content-Item:
              description: When Accept="application/vnd.sas.collection+json", will
                match the Accept-Item header.  When Accept="application/json" or when
                no Accept-Item header is given, will be "application/vnd.sas.risk.scenario.summary+json"
              schema:
                type: string
            Content-Disposition:
              description: When Accept="text/csv", the attachment will include the
                generated name of the CSV file
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/scenarioSummaryCollection"
              examples:
                application/vnd.sas.risk.scenario.summary+json:
                  $ref: "#/components/examples/scenarioSummaryCollection"
                application/vnd.sas.risk.scenario+json:
                  $ref: "#/components/examples/scenarioCollection"
                application/vnd.sas.risk.scenario.fixed+json:
                  $ref: "#/components/examples/scenarioCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/scenarioSummaryCollection"
              example:
                $ref: "#/components/examples/scenarioSummaryCollection/value"
            "text/csv;tableformat=datebased":
              schema:
                $ref: "#/components/schemas/dateBasedFormat"
              example:
                $ref: "#/components/examples/dateBasedFormat/value"
            "text/csv;tableformat=combined":
              schema:
                $ref: "#/components/schemas/combinedFormat"
              example:
                $ref: "#/components/examples/combinedFormat/value"
            "text/csv;tableformat=expanded":
              schema:
                $ref: "#/components/schemas/expandedFormat"
              example:
                $ref: "#/components/examples/expandedFormat/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
    post:
      summary: Create a scenario
      description: Creates a new scenario based on the representation in the request
        body.
      operationId: createScenario
      tags:
      - Scenario
      parameters:
      - name: deepCopy
        in: query
        required: false
        schema:
          type: boolean
        description: whether the underlying scenarios/shocks in the set should be
          copied or not.
      requestBody:
        description: The scenario to be created.
        required: true
        content:
          application/vnd.sas.risk.scenario:
            schema:
              $ref: "#/components/schemas/createScenario"
            example:
              $ref: "#/components/examples/createScenario/value"
          application/json:
            schema:
              $ref: "#/components/schemas/createScenario"
            example:
              $ref: "#/components/examples/createScenario/value"
      responses:
        "201":
          description: Returned when one scenario was created.
          headers:
            Location:
              description: the URI of the newly created scenarios
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the scenario was last created.
              schema:
                type: string
          content:
            application/vnd.sas.risk.scenario:
              schema:
                $ref: "#/components/schemas/scenario"
              example:
                $ref: "#/components/examples/scenario/value"
            application/json:
              schema:
                $ref: "#/components/schemas/scenario"
              example:
                $ref: "#/components/examples/scenario/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
    patch:
      summary: Delete scenarios
      description: Deletes multiple scenarios (only the patch Remove operation is
        supported).
      operationId: patchDeleteMultipleScenarios
      tags:
      - Scenarios
      requestBody:
        description: A json-patch with one or more remove operations
        required: true
        content:
          application/json-patch:
            schema:
              $ref: "#/components/schemas/jsonPatch"
            example:
              $ref: "#/components/examples/jsonPatch/value"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/scenarioSummaryCollection"
              example:
                $ref: "#/components/examples/scenarioSummaryCollection/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
        "409":
          description: A locked scenario was to be deleted.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
  "/scenarios#import":
    post:
      summary: Import Scenarios/Shocks/Scenario Sets/Shock Sets
      description: Creates or updates one or more scenarios, shocks, scenario sets
        and/or shock sets, based on the representation in the request body or from
        a server side resource. Scenarios and sets that already exist in the system
        by name and scenarioVersion (or as of date) will be updated in place, if the
        user is authorized to do so. <p/> When uploading via multipart/form-data or
        importing from a server location, the document must be a CSV file, and Excel
        workbook, a SAS dataset from a SAS 9.4 installation with extension .sas7bdat,
        or a CAS table from a SAS Viya installation with the extension .sashdat. <p/>
        If the input file is a CSV file representing a scenario/shock set, the members
        in the set must exist in the database.  The file name will be the default
        scenario/shock set to be created or updated. <p/> If the input file is an
        Excel workbook, each tab could contain scenarios/shocks/scenario set/shock
        set.  If a scenario/shock set tab is present, all its member scenarios/shocks
        must be present in the file unless there are no scenario/shock tabs in the
        file, in which case, they must exist in the database. <p/> The supported formats
        for tables of all forms are listed in the <a href="#section/Table-Formats">Table
        Formats</a> section.
      operationId: importScenarios
      tags:
      - Scenarios
      parameters:
      - name: Content-Type
        in: header
        required: false
        description: Describes the posted request body.  Omit this header to import
          from a server side location via the locationType, location, and fileName
          properties
        schema:
          type: string
          enum:
          - multipart/form-data
          - application/vnd.sas.collection+json
          - application/json
      - name: Content-Item
        in: header
        required: false
        description: When Content-Type="application/vnd.sas.collection+json", must
          be "application/vnd.sas.risk.scenario+json"
        schema:
          type: string
      - name: asOfDate
        in: query
        schema:
          type: string
          format: date
        description: only used when importing via multipart/form-data or from server
          resources, otherwise ignored.  When given, provides the asOfDate to be assigned
          to scenarios in the uploaded document that do not have the property assigned,
          as it is not included in all input formats.
      - name: tableFormat
        in: query
        schema:
          type: string
          enum:
          - BANKING
          - COMBINED
          - DATEBASED
          - EXPANDED
        description: The name of the format used to read the imported resource.  If
          omitted, the service will deduce the format from the columns of the resource
          -- Expanded format if the ScenarioName, Variable, ChangeType, and ChangeValue
          columns are all present, otherwise Combined format. BANKING format is deprecated
          in 2024.12 and replaced by COMBINED format. BANKING format will be removed
          in a future release.
      - $ref: "#/components/parameters/dataSourceId"
      - $ref: "#/components/parameters/locationType"
      - $ref: "#/components/parameters/location"
      - $ref: "#/components/parameters/fileName"
      requestBody:
        description: The scenarios to be created or updated, if being uploaded or
          posted and not being read from a server resource.  Should be empty when
          Content-Type=application/json and the locationType, location, and fileName
          parameters are given.
        required: false
        content:
          application/vnd.sas.collection:
            schema:
              $ref: "#/components/schemas/importScenariosCollection"
            example:
              $ref: "#/components/examples/importScenariosCollection/value"
          application/json:
            schema:
              $ref: "#/components/schemas/importScenarios"
            example:
              $ref: "#/components/examples/importScenarios/value"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadScenarios"
            example:
              $ref: "#/components/examples/uploadScenarios/value"
      responses:
        "200":
          description: All of the scenarios were imported or updated.
          content:
            application/vnd.sas.risk.scenario.creation.report+json:
              schema:
                $ref: "#/components/schemas/scenarioCreationReport"
              example:
                $ref: "#/components/examples/scenarioCreationReport/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
        "409":
          description: A locked scenario was to be updated.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
  /scenarios/export:
    post:
      summary: Export Scenarios
      description: Export selected scenarios to a file returned to the client or to
        a server side resource.  The request body may contain a collection of scenarios
        or a list of id's.  The 'Content-Type' header must be passed to indicate which
        form is being used, and if it is a collection of scenarios, the 'Content-Item'
        header must be passed as well. <p/> By default, the selected scenarios will
        be exported to a server resource as described by the locationType, location,
        and fileName query parameters. When exporting to a folder, the file extension
        is used to determine if the exported file is text/csv or an excel workbook.
        <p/> The selected scenarios may instead be returned as either a text/csv file
        or an excel workbook in one of three table representations (described in the
        <a href="#section/Table-Formats">Table Formats</a> section) by specifying
        'text/csv' or application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        in the 'Accept' header.
      operationId: exportScenarios
      tags:
      - Scenarios
      parameters:
      - name: Accept
        in: header
        description: Select the desired collection representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.risk.scenario.export.report+json
          - application/json
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - text/csv
      - name: Content-Type
        in: header
        required: true
        description: Describes the posted request body.  The selected scenarios are
          either a collection of scenarios or a list of scenario ID's.
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/json
      - name: Content-Item
        in: header
        required: false
        description: When Content-Type="application/vnd.sas.collection+json", must
          be "application/vnd.sas.risk.scenario+json"
        schema:
          type: string
      - name: baselineId
        in: query
        required: false
        schema:
          type: string
        description: The ID of a value-based scenario that is optionally used when
          exporting shocks.  The indicated scenario defines a baseline that can be
          used to compute the value of shocks which are expressed as absolute or relative
          changes.
      - name: includeScenarioHistory
        in: query
        required: false
        schema:
          type: boolean
        description: when true, include any scenario-specific historical data that
          was imported into this service.  Historical data is any value in a scenario
          that occurs before the scenario's asOfDate.  When false, only values associated
          with dates after the scenario's asOfDate will be included.  Note that this
          option defaults to "true".
      - name: includeMarketData
        in: query
        required: false
        schema:
          type: boolean
        description: When tableFormat=COMBINED, this must always be true; this defaults
          to false for other values of tableFormat.  When true, include historical
          information from the risk-market-data service for each variable in the scenario,
          exported on rows where the scenario name and version are empty.  By default,
          only the most recent historical value for each variable will be included.
      - name: marketDataStart
        in: query
        required: false
        schema:
          type: string
          format: date
        description: only used when includeMarketData is true, ignored otherwise.
          The date of the beginning of exported historical data from the risk-market-data
          service.  When this parameter is omitted, then only the most recent historical
          value for each variable will be included.
      - $ref: "#/components/parameters/locationType"
      - $ref: "#/components/parameters/location"
      - $ref: "#/components/parameters/fileName"
      - name: dateBasedFormat
        in: query
        schema:
          type: boolean
        description: When true, the scenarios will be written in Date Based format;
          when false or omitted, the scenarios will be written in Expanded format.  This
          option is deprecated, being replaced with the tableFormat option that allows
          for more supported formats.  It will be honored until at least 2025.09.
      - name: tableFormat
        in: query
        schema:
          type: string
          enum:
          - COMBINED
          - DATEBASED
          - EXPANDED
        description: The name of the format used to return the scenario table. Defaults
          to Expanded.
      requestBody:
        description: A collection of scenarios or scenario id's to be exported.  When
          requesting a text/csv file to be returned, only scenario id's may be specified;
          when exporting to a server resource, scenarios or scenario id's may be passed.
        required: true
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/scenarioCollection"
            example:
              $ref: "#/components/examples/scenarioCollection/value"
          application/json:
            schema:
              $ref: "#/components/schemas/idList"
            example:
              $ref: "#/components/examples/idList/value"
      responses:
        "200":
          description: The scenarios were exported successfully.
          content:
            application/vnd.sas.risk.scenario.export.report+json:
              schema:
                $ref: "#/components/schemas/scenarioExportReport"
              example:
                $ref: "#/components/examples/scenarioExportReport/value"
            application/json:
              schema:
                $ref: "#/components/schemas/scenarioExportReport"
              example:
                $ref: "#/components/examples/scenarioExportReport/value"
            "text/csv;tableformat=datebased":
              schema:
                $ref: "#/components/schemas/dateBasedFormat"
              example:
                $ref: "#/components/examples/dateBasedFormat/value"
            "text/csv;tableformat=combined":
              schema:
                $ref: "#/components/schemas/combinedFormat"
              example:
                $ref: "#/components/examples/combinedFormat/value"
            "text/csv;tableformat=expanded":
              schema:
                $ref: "#/components/schemas/expandedFormat"
              example:
                $ref: "#/components/examples/expandedFormat/value"
            text/csv:
              schema:
                $ref: "#/components/schemas/expandedFormat"
              example:
                $ref: "#/components/examples/expandedFormat/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
  /scenarios/report:
    post:
      summary: Report Scenarios/Shocks/Scenario Sets/Shock Sets
      description: Reports the contents of a given resource, ie, what would be included
        if the resource were to be imported via the <a href="#operation/importScenarios">Import
        Scenarios</a> operation. <p/> When uploading via multipart/form-data or importing
        from a server location, the document must be a CSV file, and Excel workbook,
        a SAS dataset from a SAS 9.4 installation with extension .sas7bdat, or a CAS
        table from a SAS Viya installation with the extension .sashdat. <p/> If the
        input file is a CSV file representing a scenario/shock set, the members in
        the set must exist in the database.  The file name will be the default scenario/shock
        set to be created or updated. <p/> If the input file is an Excel workbook,
        each tab could contain scenarios/shocks/scenario set/shock set.  If a scenario/shock
        set tab is present, all its member scenarios/shocks must be present in the
        file unless there are no scenario/shock tabs in the file, in which case, they
        must exist in the database. <p/> The as of date for scenario set will be set
        using its member scenarios. All member scenarios of a set must have the same
        as of date. <p/> The supported formats for tables of all forms are listed
        in the <a href="#section/Table-Formats">Table Formats</a> section.
      operationId: reportScenarios
      tags:
      - Scenarios
      parameters:
      - name: Content-Type
        in: header
        required: false
        description: Describes the posted request body.  Omit this header to import
          from a server side location via the locationType, location, and fileName
          properties
        schema:
          type: string
          enum:
          - multipart/form-data
          - application/vnd.sas.collection+json
          - application/json
      - name: asOfDate
        in: query
        schema:
          type: string
          format: date
        description: only used when importing via multipart/form-data or from server
          resources, otherwise ignored.  When given, provides the asOfDate to be assigned
          to scenarios in the uploaded document that do not have the property assigned,
          as it is not included in all input formats.
      - name: tableFormat
        in: query
        schema:
          type: string
          enum:
          - BANKING
          - COMBINED
          - DATEBASED
          - EXPANDED
        description: The name of the format used to read the imported resource.  If
          omitted, the service will deduce the format from the columns of the resource
          -- Expanded format if the ScenarioName, Variable, ChangeType, and ChangeValue
          columns are all present, otherwise Combined format. BANKING format is deprecated
          in 2024.12 and replaced by COMBINED format. BANKING format will be removed
          in a future release.
      - $ref: "#/components/parameters/dataSourceId"
      - $ref: "#/components/parameters/locationType"
      - $ref: "#/components/parameters/location"
      - $ref: "#/components/parameters/fileName"
      requestBody:
        description: The scenarios to be reported, if being uploaded or posted and
          not being read from a server resource.  Should be empty when Content-Type=application/json
          and the locationType, location, and fileName parameters are given.
        required: false
        content:
          application/vnd.sas.collection:
            schema:
              $ref: "#/components/schemas/importScenariosCollection"
            example:
              $ref: "#/components/examples/importScenariosCollection/value"
          application/json:
            schema:
              $ref: "#/components/schemas/importScenarios"
            example:
              $ref: "#/components/examples/importScenarios/value"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadScenarios"
            example:
              $ref: "#/components/examples/uploadScenarios/value"
      responses:
        "200":
          description: All of the scenarios or sets are valid and could be imported.
          content:
            application/vnd.sas.risk.scenario.import.report+json:
              schema:
                $ref: "#/components/schemas/scenarioImportReport"
              example:
                $ref: "#/components/examples/scenarioImportReport/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
        "409":
          description: A locked scenario was to be updated.
          content:
            application/vnd.sas.error+json:
