  /util/intervals/{intervalType}:
    get:
      summary: Compute intervals
      description: Computes dates from a given interval type, a starting date, and
        set of interval values
      operationId: computeIntervals
      tags:
      - Utility
      parameters:
      - name: intervalType
        in: path
        schema:
          type: string
        required: true
        description: a [SAS Interval name](http://support.sas.com/documentation/cdl/en/lefunctionsref/67960/HTML/default/viewer.htm#p0syn64amroombn14vrdzksh459w.htm)
          for which dates will be computed.
      - name: asOfDate
        in: query
        schema:
          type: string
          format: date
        description: Provides the start date from which interval based horizon dates
          will be computed
      - name: start
        in: query
        schema:
          type: integer
          format: int32
          default: 1
        description: First interval to compute
      - name: end
        in: query
        schema:
          type: integer
          format: int32
          default: 10
        description: Last interval to compute
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 10
        description: Number of intervals to compute if end is not specified
      - name: alignment
        in: query
        schema:
          type: string
          enum: [S, B, M, E]
          default: S
        description: code used to compute horizon dates from the runDate. One of 'S'|'B'|'M'|'E',
          indicating 'SAME','BEGINNING','MIDDLE','END'.  If the asOfDate is 2020-01-08
          and we're computing MONTH intervals, the code determines which day of the
          resulting month is returned.  For a 1 month computation, the results would
          be 2020-02-08, 2020-02-01, 2020-02-15, or 2020-02-28 respectively.
      responses:
        "200":
          description: The request succeeded.  An ordered list of dates is returned,
            corresponding to the intervals requested
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/dateCollection"
              example:
                $ref: "#/components/examples/dateCollection/value"
            application/json:
              schema:
                $ref: "#/components/schemas/dateCollection"
              example:
                $ref: "#/components/examples/dateCollection/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error/value"
components:
  parameters:
    dataSourceId:
      name: dataSourceId
      description: ID of a riskEnvironment that contains information used to interpret
        the scenario.  The environment must define a Link with the rel 'scenarioContext'
        that returns an object of type 'application/vnd.sas.risk.scenario.context'.
      in: query
      schema:
        type: string
    filter:
      name: filter
      in: query
      description: "The criteria for filtering the items in a collection. See [SAS\
        \ REST APIs&colon; Filtering](https://developer.sas.com/rest-apis/riskScenarios-v7/docs/getting-started/usage-notes#filtering)."
      schema:
        type: string
    sortBy:
      name: sortBy
      in: query
      description: Comma-separated sort criteria, where each criterion is `field[:ascending|descending]`.
      schema:
        type: string
    locationType:
      name: locationType
      in: query
      schema:
        type: string
        enum:
        - LIBNAME
        - FOLDER
      required: true
      description: The type of server location from which scenarios will be read.
    location:
      name: location
      in: query
      schema:
        type: string
      required: true
      description: the server location to|from which scenarios will be written|read.  Varies
        based on locationType.  When LIBNAME, the name of the cas library containing
        the table to be written|read.  When FOLDER, the display path of a SAS Drive
        folder containing the document to be written|read.
    fileName:
      name: fileName
      in: query
      schema:
        type: string
      required: true
      description: name of the File or Table from which scenarios will be written|read
    pagingStart:
      name: start
      in: query
      description: "pagination parameter, what is the starting index."
      schema:
        type: integer
        format: int32
        default: 0
    pagingLimit:
      name: limit
      in: query
      description: "pagination parameter, how many items to return."
      schema:
        type: integer
        format: int32
        default: 20
  schemas:
    combinedFormat:
      title: Combined Format
      description: A simplified table format for scenarios, allowing only date based
        horizons and value perturbations.  In addition, a classifier column is used
        to reduce the number variables for cases where a set of values are manipulated
        across a set of reporting areas.  For example, if there are a set of common
        economic statistics reported across the 50 US States, this format reduces
        the number of variables by removing the state component of the variable name.
      properties:
        Scenario_Name:
          type: string
          description: the name of a scenario within the table.  If omitted, then
            the table is read as a single scenario, whose name is the external name
            of the table (for example, the file name of the file that contains the
            table.
        Classifier:
          type: string
          description: The first string column whose name is not a known scenario
            property will be the classifier column; the actual name of the column
            can be anything.  The value of the classifier is appended to each of the
            variable columns to form the variable names in the scenario.
        Date:
          type: string
          format: date
          description: The date of a horizon within the scenario.
        Variables (1-n):
          type: number
          format: float
          description: The actual column names will be the root names of the variables
            in the scenario with the value of the classifier column appended. the
            value in the body of the table will be the final value of the variable
            for the horizon described in the Date column.
    createScenario:
      title: Create a scenario
      description: The representation used to create a new scenario.
      required:
      - periods
      allOf:
      - $ref: "#/components/schemas/scenarioSummary"
      - type: object
        properties:
          classificationName:
            description: a system-maintained property, set when importing scenarios
              in combined format; the name of the classification column from the input
              file.
          periods:
            description: a non-empty ordered list of periods
            type: array
            items:
              $ref: "#/components/schemas/period"
          stresses:
            description: an ordered list of stresses describing the risk factors and
              their perturbations by period.  One of stresses | variableStresses |
              temporalVariableShocks is required.
            type: array
            items:
              $ref: "#/components/schemas/riskFactorStress"
          variableStresses:
            description: an ordered list of variableStresses describing the instrument
              variables perturbations across all periods.  One of stresses | variableStresses
              | temporalVariableShocks is required.
            type: array
            items:
              $ref: "#/components/schemas/variableStress"
          temporalVariableShocks:
            description: an ordered list of temporalVariableShocks describing the
              risk factor variables with a single shock value applied across all periods
              per the cap, floor and fading specifications.  One of stresses | variableStresses
              | temporalVariableShocks is required.
            type: array
            items:
              $ref: "#/components/schemas/temporalVariableShock"
          scenarioHistory:
            description: Scenario-specific historical information, to be used in place
              of any global history data when evaluating a scenario.
            allOf:
            - $ref: "#/components/schemas/historyBlock"
    createScenarioV1:
      title: Create a scenario
      description: The representation used to create a new scenario.
      required:
      - periods
      allOf:
      - $ref: "#/components/schemas/createScenario"
      - type: object
        properties:
          version:
            type: integer
            format: int32
            description: The version number of the scenario representation. This representation
              is version 1.
    createScenarioV2:
      title: Create a scenario
      description: The representation used to create a new scenario.
      required:
      - periods
      allOf:
      - $ref: "#/components/schemas/createScenario"
      - type: object
        properties:
          factorStresses:
            description: an ordered list of objects describing the pages of a scenario.  Each
              page has a unique name, an optional list of stresses, and an optional
              history block, though at least one of the two structures must be present.
            type: array
            items:
              $ref: "#/components/schemas/scenarioPage"
          version:
            type: integer
            format: int32
            description: The version number of the scenario representation. This representation
              is version 2.
    createScenarioSet:
      title: Create a Scenario Set or Shock Set
      description: A representation needed to create a Scenario Set or Shock Set
      required:
      - name
      - asOfDate
      - scenarios
      properties:
        name:
          type: string
          description: The name of the scenario set or shock set.
        description:
          type: string
        asOfDate:
          type: string
          format: date
          description: The 'as-of-date' associated with this object in the ISO format
            (e.g. 2020-03-31)
        alignment:
          type: string
          description: The date alignment for asOfDate. Allowed values begin, end,
            middle, same.
        riskShiftType:
          type: string
          description: How the tenors not in the risk set should be handled
        applyTime:
          type: string
          description: When to apply the scenario or shock set
        regulationId:
          type: string
          description: For scenario set created per regulation such as IRRBB.
        customAttributes:
          type: object
          additionalProperties:
            type: string
          description: User defined name/string value pairs as custom attributes
        shockSet:
          type: boolean
          description: Indication of whether this object is a 'shock set' object.  Shock
            sets are composed of shock objects.  Scenario sets are composed of value-based
            scenarios.
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/scenarioSetMember"
          description: The IDs and weights of value-based scenarios when this is a
            scenario set object or IDs and weights of shock objects when this is a
            shock set object.
        version:
          type: integer
          format: int32
          description: The version number of the scenario set representation. This
            representation is version 2.
        links:
          description: The links that apply to this object.
          type: array
          items:
            $ref: "#/components/schemas/link"
    dateBasedFormat:
      title: Date Based Format
      description: A simplified table format for scenarios, allowing only date based
        horizons and value perturbations.
      properties:
        Scenario_Name:
          type: string
          description: the name of a scenario within the table.  If omitted, then
            the table is read as a single scenario, whose name is the external name
            of the table (for example, the file name of the file that contains the
            table.
        Date:
          type: string
          format: date
          description: The date of a horizon within the scenario.
        Variables (1-n):
          type: number
          format: float
          description: The actual column names will be the names of the variables
            that the scenario modifies; the value in the body of the table will be
            the final value of the variable for the horizon described in the Date
            column.
    dateCollection:
      description: An ordered collection of dates
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            description: The array of dates.
            type: array
            items:
              type: string
              format: date
    utilityConfig:
      description: The current effective upload limits.
      type: object
      properties:
        maxFileSize:
          type: string
          description: Effective configured maximum file upload size string (for example,
            `150MB`).
        maxFileSizeBytes:
          type: integer
          format: int64
          description: Byte value parsed from `maxFileSize`; not independently configured.
        maxRequestSize:
          type: string
          description: Effective configured maximum request size string (for example,
            `150MB`).
        maxRequestSizeBytes:
          type: integer
          format: int64
          description: Byte value parsed from `maxRequestSize`; not independently
            configured.
      required:
      - maxFileSize
      - maxFileSizeBytes
      - maxRequestSize
      - maxRequestSizeBytes
    expandedFormat:
      title: Expanded Format
      description: The default table format for scenarios, based on SAS High-Performance
        Risk's (Scenario Analysis Data Set)[https://go.documentation.sas.com/?cdcId=riskcdc&cdcVersion=6.12&docsetId=riskds&docsetTarget=p1i2siid8wnissn1t8h3j7q5y8bk.htm&locale=en#n177jr1afjfv6an13hvkf7tohyeu]
        format.  Each row of this format describes a single variable perturbation;
        the columns represent properties of the scenario or the specific variable
        or horizon of the perturbation.
      properties:
        Scenario_ID:
          type: string
        Scenario_Name:
          type: string
        Label:
          type: string
        Scenario_Version:
          type: string
        Variable_Name:
          type: string
          description: alias - "\_name\_".
        Horizon:
          type: integer
        Interval:
          type: string
        Date:
          type: string
          format: date
        Change_Type:
          type: string
          enum:
          - VALUE
          - ABS
          - REL
          - ABS_TM
          - REL_TM
          - STD
          description: alias - "\_type\_"
        Change_Value:
          type: number
          format: float
          description: alias - "\_value\_"
        Change_Value_Char:
          type: string
          description: alias - "\_char_value\_"
        Rule_Type:
          type: string
          description: alias - "\_rule_type\_"
          enum:
          - INSTID
          - INSTTYPE
          - FILTER
        Rule_Value:
          type: string
          description: alias - "\_rule_value\_"
        Longlabel:
          type: string
        Datasource_Name:
          type: string
        Datasource_Id:
          type: string
        As_Of_Date:
          type: string
          format: date
          description: alias - "history_date"
        Change_Order:
          type: integer
        Fade_In_Start:
          type: integer
        Fade_In_End:
          type: integer
        Fade_Out_Start:
          type: integer
        Fade_Out_End:
          type: integer
        Cap:
          type: number
          format: float
        Floor:
          type: number
          format: float
        Shock_Type:
          type: string
        Shock_Direction:
          type: string
          enum:
          - Up
          - Down
          - Mixed
    idList:
      title: Scenario ID List
      description: A list of scenario ids
      properties:
        items:
          description: A list of scenario ids
          type: array
          items:
            type: string
    historyBlock:
      title: A set of historical risk factor data
      description: A block of historical risk factor data for a scenario.
      properties:
        dates:
          type: array
          items:
            type: string
            format: date
        variableValues:
          type: array
          items:
            $ref: "#/components/schemas/historyData"
    historyData:
      title: A set of historical data for a risk factor
      description: Historical values of a named risk factor.  The number of values
        must be the same as the number of dates in the dates array, though empty values
        are allowed.
      properties:
        variable:
          description: the name of a risk factor
          type: string
        values:
          description: the list of historical values
          type: array
          items:
            type: number
            format: double
    importScenarios:
      description: An array of scenarios to be created/updated
      type: array
      items:
        $ref: "#/components/schemas/createScenario"
    importScenariosCollection:
      description: A collection of scenarios to be created/updated
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.risk.scenario` representations.
            type: array
            items:
              $ref: "#/components/schemas/createScenario"
    importScenarioSetsCollection:
      description: A collection of scenario sets to be created/updated
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.risk.scenario.set` representations.
            type: array
            items:
              $ref: "#/components/schemas/createScenarioSet"
    jsonPatch:
      description: A [JSON Patch](https://tools.ietf.org/html/rfc6902) resource.
      type: array
      items:
        description: A JSON Remove Operation.
        type: object
        properties:
          op:
            type: string
            description: The operation.
            enum:
            - remove
          path:
            type: string
            description: The path to the ID of the object to remove.
    period:
      title: Period (or Horizon)
      description: A day in the future where predictions are made about risk factor
        values, or a fixed date in the past with historical information.
      properties:
        date:
          type: string
          format: date
          description: when horizon is negative, a specific date that defines the
            period.  May be present when horizon is not negative, in cases where the
            system has computed the date from the horizon, periodType and a context
            date (typically either the scenario's asOfDateDate or the dataSource's
            runDate) but is not definitive in such cases.
        periodType:
          type: string
          description: The interval size of the scenario's horizons.  Must be either
            'IMPLICIT' or a [SAS Interval](http://support.sas.com/documentation/cdl/en/lefunctionsref/67960/HTML/default/viewer.htm#p0syn64amroombn14vrdzksh459w.htm).  This
            value must be the same across all periods, but for date-based scenarios
            (ie, those whose periods have a negative horizon), this value may be derived
            heuristically and is not definitive
        horizon:
          type: integer
          description: negative if the scenario is based on fixed dates, non-negative
            otherwise. When not negative, the horizon designates how many intervals
            of 'periodType' into the future the period defines, relative to the scenario's
            historyDate or the dataSource's runDate
    scenario:
      title: Scenario
      description: The representation of a scenario.
      allOf:
      - $ref: "#/components/schemas/updateScenario"
      - type: object
        properties:
          createdBy:
            type: string
            description: The id of the user who created the scenario.
          createdByName:
            type: string
            description: The name of the user who created the scenario.
          creationTimeStamp:
            type: string
            description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
              scenario was created.
            format: date-time
          modifiedBy:
            type: string
            description: The id of the user who most recently modified the scenario.
          modifiedByName:
            type: string
            description: The name of the user who most recently modified the scenario.
          modifiedTimeStamp:
            type: string
            description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
              scenario was last modified.
            format: date-time
    scenarioCreationReport:
      title: Scenario Creation Report
      description: A report on the effects of importing a set of scenarios.
      properties:
        scenarios:
          description: A list of scenarios that were either added or updated as part
            of an operation.
          type: array
          items:
            $ref: "#/components/schemas/scenarioSummary"
        scenarioSets:
          description: A list of scenario sets that were either added or updated as
            part of an operation.
          type: array
          items:
            $ref: "#/components/schemas/scenarioSet"
        scenarioSet:
          type: object
          properties:
            id:
              type: string
              description: The unique ID of the scenario set or shock set within the
                deployment.
            name:
              type: string
              description: The name of the scenario set or shock set.
            description:
              type: string
              description: The description of the scenario set.
            asOfDate:
              type: string
              format: date
              description: The 'as-of-date' associated with this object in the ISO
                format (e.g. 2020-03-31)
            shockSet:
              type: boolean
              description: Indication of whether this object is a 'shock set' object.  Shock
                sets are composed of shock objects.  Scenario sets are composed of
                value-based scenarios.
            scenarios:
              type: array
              items:
                $ref: "#/components/schemas/scenarioSetMember"
              description: The IDs and weights of value-based scenarios when this
                is a scenario set object or IDs and weights of shock objects when
                this is a shock set object.
            createdBy:
              type: string
              description: The id of the user who created the scenario.
            creationTimeStamp:
              type: string
              format: date-time
              description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when
                the scenario was created.
            modifiedBy:
              type: string
              description: The id of the user who most recently modified the scenario.
            modifiedTimeStamp:
              type: string
              format: date-time
              description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when
                the scenario was last modified.
        version:
          type: integer
          format: int32
          description: This representation is version 1.
        links:
          description: The links that apply to this object.
          type: array
          items:
            $ref: "#/components/schemas/link"
    scenarioCollection:
      title: Scenario Collection
      description: A collection of scenarios
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.risk.scenario` representations.
            type: array
            items:
              $ref: "#/components/schemas/scenario"
    scenarioExportReport:
      title: Scenario Export Report
      description: A report of scenarios that have been exported to a location in
        SASDrive or to a CAS server.
      properties:
        locationType:
          type: string
          description: either 'FOLDER' or 'LIBNAME', indicating a folder path in SASDrive
            or a CAS library
        location:
          type: string
          description: The location to which scenarios were exported.  When locationType
            = 'FOLDER', this will be the SASDrive path to the folder.   When locationType
            = 'LIBNAME', the this will be the name of the CAS library.
        fileName:
          type: string
          description: The name of the file or table to which scenarios were exported.
        statusMesasge:
          type: string
          description: A mesasge describing the outcome of the export.
        scenariosExported:
          description: The scenarios that were exported.
          type: array
          items:
            $ref: "#/components/schemas/scenario"
        scenariosFailed:
          description: The scenarios that could not be exported, if any.
          type: array
          items:
            $ref: "#/components/schemas/scenario"
    scenarioImportReport:
      title: Scenario Import Report
      description: A report on the effects of importing a set of scenarios/shocks/scenario
        sets/shock sets. The report includes 4 lists of scenarios/shocks/scenario
        sets/shock sets to be created or updated; See details below.
      properties:
        scenariosToAdd:
          type: array
          items:
            $ref: "#/components/schemas/scenario"
        scenariosToUpdate:
          type: array
          items:
            $ref: "#/components/schemas/scenario"
        scenarioSetsToAdd:
          type: array
          items:
            $ref: "#/components/schemas/scenarioSet"
        scenarioSetsToUpdate:
          type: array
          items:
            $ref: "#/components/schemas/scenarioSet"
    scenarioPage:
      title: A page of risk factor data
      description: "A named page of risk factor perturbations and/or historical data\
        \ within a scenario. A risk factor may only appear on one page within a scenario;\
        \ its future perturbations and its historical data must appear on the same\
        \ page.  Additionally, the use of reference key values is also restricted\
        \ such that risk factors that share the same reference mapping must be listed\
        \ on the same page.\nFor this version 8 of the service an version 2 of the\
        \ scenario media type, a page will not include full stresses in either the\
        \ stresses or history blocks; it will contain only risk factor names and reference\
        \ mapping information.  The perturbations will be found in the stresses and\
        \ scenarioHistory blocks, maintaining backward compatability with version\
        \ 1 of the media type and previous versions of the service."
      properties:
        name:
          type: string
          description: The name of the scenario page.  Each page of a scenario must
            have a unique name, and the value '_DEFAULT_PAGE_' is reserved for system
            use.  The name must be fewer than 32 characters.
        stresses:
          description: the risk factor names and reference mapping information from
            the stresses block for the risk factors assigned to this page.
          type: array
          items:
            $ref: "#/components/schemas/riskFactorStress"
        history:
          description: Scenario-specific historical information, to be used in place
            of any global history data when evaluating a scenario.
          allOf:
          - $ref: "#/components/schemas/historyBlock"
    scenarioSet:
      title: Value-based scenario set or shock set
      description: A managed set of value-based scenarios or shock objects.
      allOf:
      - $ref: "#/components/schemas/updateScenarioSet"
      - type: object
        properties:
          createdBy:
            type: string
            description: The id of the user who created the scenario.
          creationTimeStamp:
            type: string
            description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
              scenario was created.
            format: date-time
          modifiedBy:
            type: string
            description: The id of the user who most recently modified the scenario.
          modifiedTimeStamp:
            type: string
            description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
              scenario was last modified.
            format: date-time
          stressTypes:
            type: array
            items:
              enum:
              - INSTANTANEOUS_RISK_FACTOR_STRESS
              - INSTANTANEOUS_VARIABLE_STRESS
              - TEMPORAL_SHOCK
            description: All scenarios in the set have these stress types.
          horizonTypesOfRiskFactorStresses:
            type: string
            enum:
            - DATE_BASED
            - INTERVAL_BASED
            - MIXED
            description: The horizon types of scenarios in the set. The value 0 means
              this property is not calculated.
          riskShiftType:
            type: string
            enum:
            - applyZeroShock
            - excludeFromShifts
            - applyVolatilitiesAndCorrelations
            description: how to handle non-stressed risk factors.
          applyTime:
            type: string
            enum:
            - onRawData
            - afterSmoothing
            description: when to apply the scenrio or shock set.
          regulationId:
            type: string
            description: The optional regulation ID that the shock set was created
              for
          sameHorizon:
            type: boolean
            description: When true, all scenarios in the set have same horizons.
          version:
            type: integer
            format: int32
            description: The version number of the scenario set representation. This
              representation is version 1.
          links:
            description: The links that apply to this object.
            type: array
            items:
              $ref: "#/components/schemas/link"
    scenarioSetMember:
      title: Member of a scenario set
      description: A member of a scenario set
      properties:
        scenarioId:
          type: string
          description: The unique identifier of the member scenario.
        weight:
          type: number
          format: float
          description: An optional weighting factor for the member scenario.
    irrbbShockSetInput:
      title: The input to creating an IRRBB shock set
      description: The wrapper object for creating IRRBB shock set inputs.
      properties:
        regId:
          type: string
          description: regulation id
        curveNames:
          type: array
          items:
            type: string
        shockSet:
          $ref: "#/components/schemas/scenarioSet"
    scenarioSummary:
      title: Scenario Summary
      description: The summary representation of a scenario.
      properties:
        name:
          type: string
          description: The name of the scenario.  This field is generally used in
            code and server side procedures, and was at one time restricted to unquoted
            SAS names.  One of name or label is required, and if only one is specified,
            the other will be set to the same value.
        label:
          type: string
          description: An alternate name for the scenario, typically friendlier for
            use than the name.  One of name or label is required, and if only one
            is specified, the other will be set to the same value.
        scenarioVersion:
          type: string
          description: A qualifier applied to the scenario's name and/or label.  The
            combinations of name & scenarioVersion and label & scenarioVersion are
            each unique.
        description:
          type: string
          description: The description of the scenario.
        periodType:
          type: string
          description: The interval size of the scenario's horizons.  Must be either
            'IMPLICIT' or a [SAS Interval](http://support.sas.com/documentation/cdl/en/lefunctionsref/67960/HTML/default/viewer.htm#p0syn64amroombn14vrdzksh459w.htm).
            This value must be the same across all periods, but for date-based scenarios
            (ie, those whose periods have horizon < 0), this value may be derived
            heuristically and is not definitive.
        asOfDate:
          type: string
          format: date
          description: The current date for a scenario.  Note that when a risk-environment
            is used as a data source, it's runDate will override the scenario's asOfDateDate.
        alignment:
          type: string
          description: The date alignment for asOfDate. Allowed values begin, end,
            middle, same.
        dataSourceName:
          type: string
          description: Name of a resource that contains information used to interpret
            the scenario.
        dataSourceId:
          type: string
          description: ID of a resource that contains information used to interpret
            the scenario.
        filename:
          type: string
          description: The name of a file to which this scenario has been exported.  This
            field is assigned as needed by the service.
        deprecated:
          type: boolean
          description: Indicates that a scenario is no longer to be used
        reason:
          type: string
          description: the reason for the last modification of the scenario
        shock:
          type: boolean
          description: Indicates whether this scenario is a shock object or a value-based
            scenario.
        shockDirection:
          type: string
          description: For shock objects, the direction of the shock (UP, DOWN or
            MIXED)
        stressTypes:
          type: array
          items:
            type: string
          description: an array of values that indicate which of the types of stresses
            are contained within this scenario.  Valid values are TEMPORAL_SHOCK,
            INSTANTANEOUS_RISK_FACTOR_STRESS, INSTANTANEOUS_VARIABLE_STRESS.
        historyId:
          type: integer
          format: int32
          description: "An ID within the service that uniquely identifies the history\
            \ data for this scenario. Scenarios that have exactly the same history\
            \ data have the same historyId.\nAs of version 8 of this service, with\
            \ the introduction of scenario pages and v2 of the scenario media type,\
            \ this field is deprecated, and will be removed in v3 of the scenario\
            \ media type.  This field will only be populated if scenario pages are\
            \ not in use; it will be omitted or will carry -1 if multiple pages are\
            \ in use (as each scenario page can have its own history block and historyId)."
        firstHistoryDate:
          type: string
          format: date
          description: If the scenario has historical information, the oldest date
            in the history
        lastHistoryDate:
          type: string
          format: date
          description: If the scenario has historical information, the most recent
            date in the history
        customAttributes:
          type: object
          additionalProperties:
            type: string
          description: User defined name/string value pairs as custom attributes
        version:
          type: integer
          format: int32
          description: The version number of the scenario representation. This representation
            is version 1.
        links:
          description: The links that apply to the scenario.
          type: array
          items:
            $ref: "#/components/schemas/link"
    scenarioSummaryV1:
      title: Scenario Summary Version 1
      description: The v1 summary representation of a scenario.
      allOf:
      - $ref: "#/components/schemas/scenarioSummary"
      - type: object
        properties:
          version:
            type: integer
            format: int32
            description: The version number of the scenario summary representation.
              This representation is version 1.
    scenarioSetCollection:
      title: Scenario Set Collection
      description: A collection of scenario sets
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.risk.scenario.set` representations.
            type: array
            items:
              $ref: "#/components/schemas/scenarioSet"
    scenarioSummaryCollection:
      description: A collection of scenario summaries
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.risk.scenario.summary`
              representations.
            type: array
            items:
              $ref: "#/components/schemas/scenarioSummaryV1"
    scenarioContext:
      title: Scenario Context
      description: Information required for the evaluation of risk scenarios.
      required:
      - runDate
      properties:
        name:
          type: string
          description: name of the scenario context
        label:
          type: string
          description: human readable label of the scenario context
        runDate:
          type: string
          format: date
          description: date to be used to interpret scenario horizons and variable
            history
        alignment:
          type: string
          enum:
          - S
          - B
          - M
          - E
          description: code used to compute horizon dates from the runDate.  One of
            'S'|'B'|'M'|'E', indicating 'SAME','BEGINNING','MIDDLE','END'.  Default
            is 'S'.  If the runDate is 2020-01-08 and we're computing month intervals,
            the code determines which day of the resulting month is returned.  For
            a 1 month computation, the results would be 2020-02-08, 2020-02-01, 2020-02-15,
            and 2020-02-28 respectively.
    riskFactorStress:
      title: Risk Factor Stress
      description: a risk factor variable and its perturbations for each period
      properties:
        variable:
          type: string
          description: The name of the risk factor being shocked.
        perturbType:
          type: string
          enum:
          - value
          - abs
          - rel
          - abs_time
          - rel_time
          - std
          description: A code that controls how the numeric perturbations are interpreted.  'value'
            indicates that each perturbation's value is the number provided in the
            perturbations list; all others indicate functions that are applied to
            the number in the perturbation list and evaluated in the context of the
            scenario's baseline and market state data provided by the dataSource
        cap:
          type: number
          format: double
          description: The optional maximum value to allow the shocked value to take
            on.
        floor:
          type: number
          format: double
          description: The optional minimum value to allow the shocked value to take
            on.
        perturbations:
          description: A list of perturbation values.  Thie size of this list must
            be the same as the size of the periods list, but empty values are allowed
            in the list.
          type: array
          items:
            type: number
            format: double
        rootVariable:
          type: string
          description: When the scenario was imported from combined format, the original
            name of the variable that was shocked in the input file.  The variable
            name in this structure was synthesized from the root variable and the
            classification value.
        referenceKey:
          type: string
          description: When the scenario was imported from combined format, the value
            that was originally stored in the classification column for this variable.
    temporalVariableShock:
      title: Temporal Variable Shock
      description: A risk factor variable, a perturbation, and a specification of
        how the perturbation is to be applied across all horizons.
      properties:
        variable:
          type: string
          description: The name of the risk factor variable being shocked.
        perturbType:
          type: string
          description: A code that controls how the perturbations are interpreted.  Must
            be one of 'val'|'abs'|'rel'.  'val' indicates that perturbation value
            is given directly in the changeValue; all others indicate functions that
            are applied to the changeValue and evaluated in the context of the shock's
            baseline.
        changeValue:
          type: number
          format: double
          description: A shock value to be applied to the risk factor variable
        fadeInStart:
          type: integer
          format: int32
          description: The optional horizon number of when to start fading in changeValue.
        fadeInEnd:
          type: integer
          format: int32
          description: The optional horizon number of when the complete changeValue
            has been applied (faded-in).
        fadeOutStart:
          type: integer
          format: int32
          description: The optional horizon number of when to start fading out changeValue.
        fadeOutEnd:
          type: integer
          format: int32
          description: The optional horizon number of when the changeValue has been
            completely faded-out.
        cap:
          type: number
          format: double
          description: The optional maximum value to allow the shocked value to take
            on.
        floor:
          type: number
          format: double
          description: The optional minimum value to allow the shocked value to take
            on.
    updateScenario:
      title: Update Scenario
      description: The representation used to update a scenario.
      required:
      - id
      - periods
      allOf:
      - $ref: "#/components/schemas/createScenario"
      - type: object
        properties:
          id:
            type: string
            description: The unique identifier for the scenario.
          readOnly:
            type: boolean
            description: when true, indicates that the scenario may not be modified
              by any user or process.  Controlled by the lock/unlock operations.
    updateScenarioV1:
      title: Update Scenario
      description: The representation used to update a scenario.
      required:
      - id
