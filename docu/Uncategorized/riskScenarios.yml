      summary: Get Scenario Context
      description: Returns a default Scenario Context for use when interpreting scenarios.
        <p/> The scenario context is a set of information or links to information
        that is necessary to interpret scenarios.  This information includes the definitions,
        the market state, and historical information about any variables that may
        be included, the asOfDate and horizon alignment. <p/> This service provides
        a default scenario context by referencing the risk-market and risk-portfolios
        services.
      operationId: getScenarioContext
      tags:
