            type: boolean
            description: when true, indicates that the scenario may not be modified
              by any user or process.  Controlled by the lock/unlock operations.
          version:
            type: integer
            format: int32
            description: The version number of the scenario representation. This representation
              is version 2.
    updateScenarioSet:
      title: Update a scenario set or shock set
      description: A representation needed to update a scenario set or shock set
      required:
      - id
      allOf:
      - $ref: "#/components/schemas/createScenarioSet"
      - type: object
        properties:
          id:
            type: string
            description: The unique ID of the scenario set or shock set within the
              deployment.
    uploadScenarios:
      title: Upload Scenarios
      description: The multipart/form-data carrying a supported import document
      properties:
        file:
          title: uploaded file
          type: object
          description: the uploaded file containing one or more scenarios
    variableStress:
      title: Variable Stress
      description: An instrument variable, a perturbation, and a description of how
        the perturbation is to be applied to portfolio information provided by the
        data source.
      properties:
        variable:
          type: string
          description: The name of the instrument variable being shocked.
        perturbType:
          type: string
          description: A code that controls how the perturbations are interpreted.  Must
            be one of 'val'|'abs'|'rel'.  'val' indicates that perturbation value
            is given directly in the changeValue; all others indicate functions that
            are applied to the changeValue and evaluated in the context of the scenario's
            baseline and portfolio data provided by the dataSource.  Note that for
            instrumentVariables that are not numeric types, only 'val' is meaningful
            although this cannot be enforced by the service.
        changeValue:
          type: string
          description: A shock value for the instrument variable.
        ruleType:
          type: string
          description: A code that controls how the perturbation is applied to the
            portofilio. Must be one of 'instid'|'insttype'|'filter'.  'instid' describes
            a specific financial instrument in the portfolio.  'insttype' describes
            a type of financial instrument in the portfolio.  'filter' describes a
            portfolio filter supplied by the data source
        ruleValue:
          type: string
          description: Name associated with the ruleType field that indicates how
            the perturbation is applied to the portfolio
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
