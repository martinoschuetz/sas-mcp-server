---
openapi: 3.0.3
info:
  description: The Visual Investigator GenAI MCP API provides a proxy to the VI MCP
    server, enabling standalone REST-API-based interactions with a VI deployment through
    standardized MCP interfaces. The API supports both Server-Sent Events (SSE) streaming
    and JSON-RPC communication patterns.
  version: "1"
  title: Visual Investigator GenAI MCP
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: https://support.sas.com/techsup/license/index.html
tags:
- name: Mcp
  description: Contains the operations for the MCP proxy.
paths:
  /mcp:
    get:
      x-sas-internal: true
      tags:
      - Mcp
      summary: Open an SSE stream to the MCP server
      description: Opens a Server-Sent Events (SSE) stream for receiving messages
        from the MCP server.
      operationId: getMcpStream
      responses:
        "200":
          description: SSE stream successfully opened.
          headers:
            Content-Type:
              schema:
                type: string
                enum: [text/event-stream]
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream
        "401":
          description: Unauthorized request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    post:
      x-sas-internal: true
      tags:
      - Mcp
      summary: Send a JSON-RPC message to the MCP server
      description: Sends a JSON-RPC request, notification, or response to the MCP
        server. The server may respond with either a single JSON response or open
        an SSE stream.
      operationId: createMcpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC message (request, notification, or response)
          application/vnd.sas.api+json:
            schema:
              type: object
              description: JSON-RPC message (request, notification, or response)
      responses:
        "200":
          description: JSON response returned.
          content:
            application/json:
              schema:
                type: object
                description: JSON-RPC response
            application/vnd.sas.api+json:
              schema:
                type: object
                description: JSON-RPC response
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream with JSON-RPC responses
        "202":
          description: Accepted (for notifications and responses).
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "401":
          description: Unauthorized request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
servers:
- url: http://example.com/svi-gen-ai
  description: This is an example base URL.
components:
  schemas:
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
