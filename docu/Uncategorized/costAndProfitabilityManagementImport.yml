---
openapi: 3.0.3
info:
  version: "1"
  title: Cost And Profitability Management Import
  description: >
    The Cost and Profitability Management Import Service provides functionality
    to import models from the different data sources like xml/zip or Database etc.
    <br><br> Features of this API include: <ul> <li>Read model data from the given
    data source and  populate into the application.</li> </ul>
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/costAndProfitabilityManagementImport
  description: Kubernetes mock server
tags:
- name: Root
  x-sas-internal: true
  description: The operations for the root resource.
- name: Import
  description: The import operation.
- name: Status
  x-sas-internal: true
  description: The status of import operation.
- name: Database
  description: Database Connection.
paths:
  /:
    get:
      x-sas-internal: true
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      responses:
        "200":
          description: OK
          content:
            "application/vnd.sas.api+json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/root200response"
            "application/json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/root200response"
          headers:
            Content-Type:
              required: true
              description: The content type.
              schema:
                type: string
            Last-Modified:
              required: true
              description: The last modified date and time of the API.
              schema:
                type: string
  "/import":
    post:
      summary: Import a model
      description: "Import models from the different data sources like xml/zip or\
        \ Database. Read the model data from the given data source and populate into\
        \ the application."
      tags:
      - Import
      operationId: createImport
      requestBody:
        content:
          application/vnd.sas.cost.and.profitability.management.import+json:
            schema:
              $ref: "#/components/schemas/importModel"
            examples:
              importFromXml:
                $ref: "#/components/examples/postImportRequest"
              importFromDatabase:
                $ref: "#/components/examples/postImportDBRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/api"
            examples:
              default:
                $ref: "#/components/examples/application_json"
        description: Request body to import a model.
        required: true
      responses:
        "201":
          description: Import operation summary generated successfully.
          headers:
            Location:
              description: The URI of the newly imported model.
              schema:
                type: string
            Etag:
              description: Used as caching key for future requests.
              schema:
                type: string
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.cost.and.profitability.management.model.operations+json:
              schema:
                $ref: "#/components/schemas/importOperation"
              examples:
                default:
                  $ref: "#/components/examples/postImportResponse201"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/application_json"
        "400":
          description: Bad Request. The request is not properly formed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/postImportResponse400"
          headers:
            Content-Type:
              description: Type of error object
              schema:
                type: string
            Location:
              description: The URI of the newly imported model.
              schema:
                type: string
  "/validation/dataSource":
    post:
      summary: Test the database connection
      description: "Tests the database connection whether it is successful or not\
        \ based on the provided database connection details"
      tags:
      - Database
      operationId: createDatabaseConnection
      requestBody:
        content:
          application/vnd.sas.cost.and.profitability.management.import.database.connection+json:
            schema:
              $ref: "#/components/schemas/databaseConnectionDetails"
            examples:
              default:
                $ref: "#/components/examples/dbConnectionPostRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/api"
            examples:
              default:
                $ref: "#/components/examples/application_json"
        description: Request body to test database connection.
        required: true
      responses:
        "200":
          description: The database connection is successful.
          headers:
            Location:
              description: The URI of the database connection.
              schema:
                type: string
            Etag:
              description: Used as caching key for future requests.
              schema:
                type: string
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.cost.and.profitability.management.import.database.connection+json:
              schema:
                $ref: "#/components/schemas/connectionSucceded"
              examples:
                default:
                  $ref: "#/components/examples/dbConnectionResponse200"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/application_json"
        "400":
          description: Bad Request. The request is not properly formed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/dbConnectionResponse400"
          headers:
            Content-Type:
              description: Type of error object
              schema:
                type: string
            Location:
              description: The URI of the database connection.
              schema:
                type: string
        "404":
          description: Requested resource does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/dbConnectionResponse404"
          headers:
            Content-Type:
              description: Type of the error object.
              schema:
                type: string
            Location:
              description: The URI of the database connection.
              schema:
                type: string
  "/status":
    get:
      x-sas-internal: true
      tags:
      - Status
      summary: Get status of import microservice
      description: Get status of import microservice.
      operationId: getImportStatus
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            "application/vnd.sas.content.import+json":
              schema:
                $ref: "#/components/schemas/importStatus"
              examples:
                default:
                  $ref: "#/components/examples/importStatus200"
            "application/json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/application_json"
        "404":
          description: Import service not found at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/importStatus404"
          headers:
            Content-Type:
              description: Type of error object
              schema:
                type: string
components:
  schemas:
    importModel:
      title: Representation Used in Requests to Import a Model
      description: Representation used in requests to Import a model.
      required:
      - name
      - reference
      - importType
      properties:
        name:
          type: string
          title: Name of a Model
          description: The name of a model.
          example: "ParcelExpress"
        reference:
          type: string
          title: Reference of a Model
          description: The reference of a model.
          example: "pe"
        fileName:
          type: string
          title: Name of a File
          description: Name of the file that needs to be imported.
          example: "ParcelExpress.xml"
        importType:
          type: string
          title: Type of import operation
          description: Type of import operation.
          example: "xml"
        databaseConnectionDetails:
          $ref: "#/components/schemas/databaseConnectionDetails"
    databaseConnectionDetails:
      title: Representation Used in Requests to Import a Model from external database
      description: Representation used in requests to Import a model from external
        database.
      required:
      - host
      - port
      - authorizationDomainId
      - databaseName
      - databaseType
      properties:
        host:
          type: string
          title: Host name of the database
          description: Host name of the database.
          example: "cpm-viya-m1-m1.retail.sashq-d.openstack.sas.com"
        port:
          type: integer
          title: Port number for the database
          description: Port number for the database.
          example: 28523
        authorizationDomainId:
          type: string
          title: ID of authorization domain
          description: ID of authorization domain where the credentails of the database
            are stored.
          example: "ExternalPostgresAuth"
        databaseName:
          type: string
          title: Name of the database
          description: Name of the database.
          example: "ParcelExpressDB"
        databaseType:
          type: string
          title: Type of the database
          description: Type of the database.
          example: "postgres"
        advancedParameters:
          $ref: "#/components/schemas/advancedParameters"
    advancedParameters:
      title: Advanced parameters
      description: This is an object of advanced parameters with key value pair which
        are required based on the database.
      properties:
        property:
          title: advanced parameters
          type: string
          description: The name and value of the assignment property.
          example: value
    importOperation:
      title: importOperation
      description: "Import operation starts importing a model and operation summary\
        \ is generated for reference."
      required:
      - creationTimeStamp
      - createdBy
      - modifiedTimeStamp
      - version
      - operationId
      - modelReference
      - modelName
      - operationType
      - operationStatus
      - startTime
      - endTime
      - links
      properties:
        creationTimeStamp:
          type: string
          format: date-time
          description: Date and time at which the model was imported.
        createdBy:
          type: string
          description: The user who imported the model.
          example: "admin"
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Date and time at which the model was modified.
        version:
          type: integer
          description: This represents the version (1).
          example: 1
        operationId:
          title: Unique ID of the Operation
          type: string
          description: The system assigned unique ID for the operation.
          example: "1a00b3ac-5542-488e-866c-281babc7c7fa"
        modelReference:
          title: Reference of the Model
          type: string
          description: The reference of the model. This must be unique.
          example: "pe"
        modelName:
          title: Name of the Model
          type: string
          description: The name of the model. This must be unique.
          example: "pe"
        operationType:
          title: Type of Operation
          type: string
          description: Type of operation .
          example: "Import"
        operationStatus:
          title: Status of Operation
          type: string
          description: Status of operation.
          example: "Running"
        startTime:
          title: Start Time of the Import
          type: string
          description: Start time of the import.
          example: "2022-09-16T10:29:29.273297948"
        endTime:
          title: End Time of the Import
          type: string
          description: End time of the import.
          example: "2022-09-16T10:29:29.273297948Z"
        links:
          type: array
          description: Paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
    importStatus:
      title: importStatus
      x-sas-internal: true
      description: "Import status whether it is running or not."
      properties:
        message:
          type: string
          description: Message describing the import status.
          example: "Import service is running."
    connectionSucceded:
      title: Database connection
      description: This is response after database connection is successful.
      required:
      - message
      properties:
        message:
          type: string
          description: message returned after database connection is successful.
          example: "The database connection is successful."
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
  examples:
    dbConnectionResponse200:
      value: {"message": "The database connection is successful."}
      description: Example of response after database connection is successful.
    application_json:
      value: {"version": 1, "links": [{"method": "POST", "rel": "import", "href": "/costAndProfitabilityManagementImport/import",
            "uri": "/costAndProfitabilityManagementImport/import", "type": "application/vnd.sas.cost.and.profitability.management.import",
            "itemType": "application/vnd.sas.cost.and.profitability.management.import"}]}
      description: Example of response displayed when we select content type application/json.
    importStatus404:
      value: {"version": 2, "httpStatusCode": 404, "message": "There is no handler\
          \ defined for the path \"/costAndProfitabilityManagementImport/statu\".",
        "details": ["path: /costAndProfitabilityManagementImport/statu", "correlator:\
            \ c3027381-8165-404a-bd15-eca03ff8e6de"]}
      description: Example of 404 error for import status.
    postImportResponse201:
      value: {"creationTimeStamp": "2022-09-16T10:29:29.282589Z", "createdBy": "sasboot",
        "modifiedTimeStamp": "2022-09-16T10:29:29.28259Z", "version": 1, "operationId": "7211a8fd-35aa-11ed-a685-ba684a89115c",
        "modelReference": "pe", "modelName": "pe", "operationType": "Import", "operationStatus": "Running",
        "startTime": "2022-09-16T10:29:29.273297948Z", "endTime": "0001-01-01T00:00:00Z",
        "links": [{"method": "GET", "rel": "self", "href": "/costAndProfitabilityManagementModels/operations/7211a8fd-35aa-11ed-a685-ba684a89115c",
            "uri": "/costAndProfitabilityManagementModels/operations/7211a8fd-35aa-11ed-a685-ba684a89115c",
            "type": "application/vnd.sas.cost.and.profitability.management.model.operations"}]}
      description: Example of response for import operation.
    dbConnectionPostRequest:
      value: {"host": "cpm-viya-m1-m1.retail.sashq-d.openstack.sas.com", "port": 28523,
        "authorizationDomainId": "ExternalPostgresAuth", "databaseName": "IMPDB",
        "databaseType": "POSTGRES", "advancedParameters": {"sslmode": "require"}}
      description: Example of request body for testing database connection.
    postImportRequest:
      value: {"name": "ParcelExpress", "reference": "pe", "importType": "xml", "fileName": "ParcelExpress.xml"}
      description: Example of request body for importing model from xml.
    postImportResponse400:
      value: {"version": 2, "httpStatusCode": 400, "message": "Bad Request", "details": [
          "invalid character '\"' after object key:value pair", "path: /costAndProfitabilityManagementImport/import",
          "correlator: 916240dc-189a-4e42-afc3-dd0399a9b19b"]}
      description: Example of 400 bad request error for import operation.
    importStatus200:
      value: "Import service is running.."
      description: Example of import status.
    dbConnectionResponse404:
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 12302, "message": "The\
          \ credential for the user \"cpstest\" in the domain \"ExternalPostgresAuthD\"\
          \ does not exist.", "details": ["traceId: 75a6b19b344815a4", "path: /credentials/domains/ExternalPostgresAuthD/secrets",
          "path: /costAndProfitabilityManagementImport/validation/dataSource", "correlator:\
            \ 0270c6ca-4038-4cf1-b98c-13def79329bd"]}
      description: Example of error response after database connection is unsuccessful.
    postImportDBRequest:
      value: {"name": "parcelExpress", "reference": "PE", "importType": "Database",
        "databaseConnectionDetails": {"host": "cpm-viya-m1-m1.retail.sashq-d.openstack.sas.com",
          "port": 28523, "authorizationDomainId": "ExternalPostgresAuth", "databaseName": "IMPDB",
          "databaseType": "POSTGRES", "advancedParameters": {"sslmode": "require"}}}
      description: Example of request body for importing model from database.
    dbConnectionResponse400:
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 130017, "message": "The\
          \ specified database type is invalid. Enter a valid database type.", "details": [
          "path: /costAndProfitabilityManagementImport/validation/dataSource", "correlator:\
            \ 37e3d0be-853b-47a9-9647-f8a1aa1a3787"]}
      description: Example of error response after database connection is unsuccessful.
    root200response:
      value: {"version": 1, "links": [{"method": "POST", "rel": "importModel", "href": "/costAndProfitabilityManagementImport/import",
            "uri": "/costAndProfitabilityManagementImport/import", "type": "application/vnd.sas.content.cost.and.profitability.management.import"},
          {"method": "GET", "rel": "status", "href": "/costAndProfitabilityManagementImport/status",
            "uri": "/costAndProfitabilityManagementImport/status", "type": "application/vnd.sas.content.import"}]}
      description: Example of response with status code 200 from root API.
