              schema:
                type: string
                format: date-time
        "404":
          description: No score analysis exists at the requested path.
    delete:
      tags:
      - Analyses
      summary: Delete a score analysis
      description: Deletes the specified score analysis.
      operationId: deleteScoreAnalysis
      parameters:
      - name: executionId
        description: The unique identifier for the score execution.
        in: path
        required: true
        schema:
          type: string
      - name: analysisId
        description: The unique identifier for the score analysis.
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The score analysis was deleted.
        "404":
          description: No score analysis exists at the requested path.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
  "/executions/{executionId}/analyses/{analysisId}/state":
    get:
      tags:
      - Analyses
      summary: Get a score analysis state
      description: Returns the state of the specified score analysis.
      operationId: getScoreAnalysisState
      parameters:
      - name: executionId
        description: The unique identifier for the score execution.
        in: path
        required: true
        schema:
          type: string
      - name: analysisId
        description: The unique identifier for the score analysis.
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  $ref: "#/components/examples/state"
        "404":
          description: No score execution exists at the requested path.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
servers:
- url: https://example.com/scoreExecution
  description: This is an example of a base URL.
components:
  headers:
    Sas-Service-Response-Flag:
      description: Indicates whether the response is coming from a SAS service.
      schema:
        type: boolean
      example: true
  examples:
    badRequest:
      value:
        httpStatusCode: 400
        version: 2
      description: Bad request.
    notFound:
      value:
        httpStatusCode: 404
        version: 2
      description: Not found.
    root:
      value:
        version: 1
        links:
        - method: GET
          rel: scoreExecutions
          href: /scoreExecution/executions
          uri: /scoreExecution/executions
          type: application/vnd.sas.collection
        - method: POST
          rel: createScoreExecution
          href: /scoreExecution/executions
