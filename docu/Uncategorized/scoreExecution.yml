          type: string
      - name: analysisId
        description: The unique identifier for the score analysis.
        in: path
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Need to set this to application/vnd.sas.summary+json to get summary
          of score analysis.
        required: true
        schema:
          type: string
          format: media-type
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the score analysis.
              schema:
                type: string
            Last-Modified:
              description: The timestamp when the score analysis was last modified.
