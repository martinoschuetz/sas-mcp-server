---
openapi: 3.0.3
info:
  version: "2"
  title: Score Execution
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: >
    The Score Execution API is used to produce a score by executing the mapped
    code generated by score objects using the score definition.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Executions
  description: Contains the operations to create, read, and delete score executions.
- name: Analyses
  description: Contains the operations to create, read, and delete analyses.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: root
      description: Get a list of top level links.
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              example:
                $ref: "#/components/examples/root/value"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              example:
                $ref: "#/components/examples/root/value"
        "404":
          description: Service is not available
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
    head:
      tags:
      - Root
      summary: Get the headers for the APIs
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
  /executions:
    get:
      tags:
      - Executions
      summary: Get a list of the score executions
      description: Returns a list of the score executions based on the specified pagination,
        filtering, and sorting options. The items in the list depend on the `Accept-Item`
        header.
      operationId: getScoreExecutions
      parameters:
      - name: Accept-Item
        description: Used for selecting the desired item representation.
        in: header
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.score.execution+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.summary+json
      - name: start
        description: The index of the first score execution to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of score executions to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      - name: filter
        description: The criteria for filtering the score executions. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/scoreExecution-v2/docs/getting-started/usage-notes#filtering).
        in: query
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        description: The criteria for sorting the score executions. See [Sorting in
          REST APIs](https://developer.sas.com/rest-apis/scoreExecution-v2/docs/getting-started/usage-notes#sorting).
        in: query
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/scoreExecutionCollection"
              example:
                $ref: "#/components/examples/scoreExecutionCollection/value"
            application/json:
              schema:
                $ref: "#/components/schemas/scoreExecutionCollection"
              example:
                $ref: "#/components/examples/scoreExecutionCollection/value"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequest/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequest/value"
    post:
      tags:
      - Executions
      summary: Create a new score execution
      description: Creates a new score execution based on the representation in the
        request body.
      operationId: createScore
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/scoreExecutionRequest"
            example:
              $ref: "#/components/examples/scoreExecutionRequest/value"
          application/vnd.sas.score.execution.request+json:
            schema:
              $ref: "#/components/schemas/scoreExecutionRequest"
            example:
              $ref: "#/components/examples/scoreExecutionRequest/value"
        description: The representation of a score execution request.
        required: true
      responses:
        "201":
          description: A score execution was created.
          headers:
            Location:
              description: The URL of the score execution.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the score execution.
              schema:
                type: string
            Last-Modified:
              description: The timestamp when the score execution was last modified.
                The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.score.execution+json:
              schema:
                $ref: "#/components/schemas/scoreExecution"
              example:
                $ref: "#/components/examples/scoreExecution/value"
            application/json:
              schema:
                $ref: "#/components/schemas/scoreExecution"
              example:
                $ref: "#/components/examples/scoreExecution/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.score.execution+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequest/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequest/value"
  "/executions/{executionId}#summary":
    get:
      tags:
      - Executions
      summary: Get a score execution
      description: Returns the summary representation of the specified score execution.
      operationId: getScoreExecutionSummary
      parameters:
      - name: executionId
        description: The unique identifier for the score execution.
        in: path
        required: true
        schema:
          type: string
      - name: Accept
        description: Need to set this to application/vnd.sas.summary+json to get a
          summary of the score execution.
        in: header
        required: true
        schema:
          type: string
          format: media-type
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the score execution.
              schema:
                type: string
            Last-Modified:
              description: The timestamp when the score execution was last modified.
                The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/resourceSummary"
              example:
                $ref: "#/components/examples/scoreExecutionSummary/value"
            application/json:
              schema:
                $ref: "#/components/schemas/resourceSummary"
              example:
                $ref: "#/components/examples/scoreExecutionSummary/value"
        "404":
          description: No score execution exists at the requested path.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
  "/executions/{executionId}":
    get:
      tags:
      - Executions
      summary: Get a score execution
      description: Returns the representation of the specified score execution.
      operationId: getScoreExecution
      parameters:
      - name: executionId
        description: The unique identifier for the score execution.
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the score execution.
              schema:
                type: string
            Last-Modified:
              description: The timestamp when the score execution was last modified.
                The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.score.execution+json:
              schema:
                $ref: "#/components/schemas/scoreExecution"
              example:
                $ref: "#/components/examples/scoreExecutionFull/value"
            application/json:
              schema:
                $ref: "#/components/schemas/scoreExecution"
              example:
                $ref: "#/components/examples/scoreExecutionFull/value"
        "404":
          description: No score execution exists at the requested path.
          content:
            application/vnd.sas.score.execution+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
    head:
      tags:
      - Executions
      summary: Get the headers for a score execution
      description: Returns the headers for the specified score execution. Also used
        to determine whether a particular score execution exists.
      operationId: headersForScoreExecution
      parameters:
      - name: executionId
        description: The unique identifier for the score execution.
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the score execution.
              schema:
                type: string
            Last-Modified:
              description: The timestamp when the score execution was last modified.
                The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
                format: date-time
    delete:
      tags:
      - Executions
      summary: Delete a score execution
      description: Deletes the specified score execution.
      operationId: deleteScoreExecution
      parameters:
      - name: executionId
        description: The unique identifier for the score execution.
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The score execution was deleted.
        "404":
          description: No score execution exists at the requested path.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
  "/executions/{executionId}/state":
    get:
      tags:
      - Executions
      summary: Get a score execution state
      description: Returns the state of the specified score execution.
      operationId: getScoreExecutionState
      parameters:
      - name: executionId
        description: The unique identifier for the score execution.
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  $ref: "#/components/examples/state"
        "404":
          description: No score execution exists at the requested path.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
  "/executions/{executionId}/analysisCode":
    post:
      tags:
      - Executions
      summary: Generate analysis code
      description: Generate analysis code for an analysis type from a score execution
        by forwarding the analysis code to the score object.
      operationId: getScoreAnalysisCode
      parameters:
      - name: executionId
        description: The unique identifier for the score execution.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.score.analysis.code.generation.request+json:
            schema:
              $ref: "#/components/schemas/analysisCodeGenerationRequest"
            example:
              $ref: "#/components/examples/scoreAnalysisCodeRequest/value"
          application/json:
            schema:
              $ref: "#/components/schemas/analysisCodeGenerationRequest"
            example:
              $ref: "#/components/examples/scoreAnalysisCodeRequest/value"
        description: The representation of an analysis code generation request.
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.score.analysis.code+json:
              schema:
                $ref: "#/components/schemas/analysisCode"
              example:
                $ref: "#/components/examples/scoreAnalysisCode/value"
            application/json:
              schema:
                $ref: "#/components/schemas/analysisCode"
              example:
                $ref: "#/components/examples/scoreAnalysisCode/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.score.analysis.code+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequest/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequest/value"
        "404":
          description: No score execution exists at the requested path.
          content:
            application/vnd.sas.score.analysis.code+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/notFound/value"
  "/executions/{executionId}/analyses":
    get:
      tags:
      - Analyses
      summary: Get a list of score analyses
      description: Returns a list of score analyses based on the specified pagination,
        filtering, and sorting options. The items in the list depend on the `Accept-Item`
        header.
      operationId: getScoreAnalyses
      parameters:
      - name: executionId
        description: The unique identifier for the score execution.
        in: path
        required: true
        schema:
          type: string
      - name: Accept-Item
        in: header
        description: Used for selecting desired item representation.
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.score.analysis+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.summary+json
      - name: start
        description: The index of the first score analysis to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of score analyses to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      - name: filter
        description: The criteria for filtering the score analyses. See [Filtering
          in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        in: query
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        description: The criteria for sorting the score analyses. See [Sorting in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        in: query
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/scoreAnalysisCollection"
              example:
                $ref: "#/components/examples/scoreAnalysisCollectionEx/value"
            application/json:
              schema:
                $ref: "#/components/schemas/scoreAnalysisCollection"
              example:
                $ref: "#/components/examples/scoreAnalysisCollectionEx/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequest/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequest/value"
    post:
      tags:
      - Analyses
      summary: Create a new score analysis
      description: Creates a new score analysis based on the representation in the
        request body.
      operationId: createAnalysis
      parameters:
      - name: executionId
        description: The unique identifier for the score execution.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/scoreAnalysisRequest"
            example:
              $ref: "#/components/examples/scoreAnalysisCodeRequest/value"
          application/vnd.sas.score.analysis.request+json:
            schema:
              $ref: "#/components/schemas/scoreAnalysisRequest"
            example:
              $ref: "#/components/examples/scoreAnalysisCodeRequest/value"
        description: The representation of a score analysis request.
        required: true
      responses:
        "201":
          description: A score analysis was created.
          headers:
            Location:
              description: The URL of the score analysis.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the score analysis.
              schema:
                type: string
            Last-Modified:
              description: The timestamp when the score analysis was last modified.
                The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.score.analysis+json:
              schema:
                $ref: "#/components/schemas/scoreAnalysis"
              example:
                $ref: "#/components/examples/scoreAnalysis/value"
            application/json:
              schema:
                $ref: "#/components/schemas/scoreAnalysis"
              example:
                $ref: "#/components/examples/scoreAnalysis/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.score.analysis+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequest/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/badRequest/value"
  "/executions/{executionId}/analyses/{analysisId}#summary":
    get:
      tags:
      - Analyses
      summary: Get a score analysis
      description: Returns the summary representation of the specified score analysis.
      operationId: getScoreAnalysisSummary
      parameters:
      - name: executionId
