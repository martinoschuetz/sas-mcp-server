---
openapi: 3.0.3
info:
  description: Forecasting Exploration Service
  version: "3"
  title: Forecasting Exploration
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: https://support.sas.com/techsup/license/index.html
tags:
- name: TimeSeriesPlotExploration
  description: The operations for time series plot.
- name: EnvelopePlotExploration
  description: The operations for envelope plot.
- name: ForecastPlotExploration
  description: The operations for forecast plot.
- name: ByGroups
  description: The operations for BY groups.
- name: RootController
  description: The operations for forecasting exploration root resource.
- name: SofExploration
  description: The operations for statistics of fit.
- name: OutTableColumns
  description: The operations for output table columns.
- name: TableSizeEstimate
  description: The operations for output table size estimate.
paths:
  /:
    get:
      tags:
      - RootController
      summary: Get the API object
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/rootResp"
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/rootResp"
          headers: {}
  /byGroups:
    post:
      tags:
      - ByGroups
      summary: Retrieve filtered byGroups from attributes index table
      description: Retrieve filtered byGroups from attributes index table.
      operationId: createFilteredByGroups
      parameters:
      - name: Accept-Item
        in: header
        description: "optional Accept-Item header value application/vnd.sas.analytics.forecasting.by.group.tree+json"
        required: false
        schema:
          type: string
          default: application/vnd.sas.analytics.forecasting.by.group
      - name: inCaslib
        in: query
        description: "Caslib where table exists "
        required: false
        schema:
          type: string
      - name: indexTableName
        in: query
        description: "Index table name "
        required: false
        schema:
          type: string
      - name: attributesTableName
        in: query
        description: "Attributes table name "
        required: false
        schema:
          type: string
      - name: byVariableNames
        in: query
        description: "BY variable names "
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: level
        in: query
        description: By Group Level
        required: false
        schema:
          type: string
          default: "@lowest"
      - name: start
        in: query
        description: Offset of first forecasting byGroup to retrieve (0-based). Defaults
          to 0
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of forecasting byGroup to retrieve. Defaults to
          30
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      - name: sortBy
        in: query
        description: "Sort criteria for the retrieved byGroups (see https://developer.sas.com/rest-apis/forecastingExploration-v3/docs/getting-started/usage-notes#sorting)\
          \ For example:'location:ascending' "
        required: false
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              type: string
            examples:
              example-1:
                value: 'and(matchAny("*"))'
        description: "Attributes based query String to specify the set of BY groups "
      responses:
        "200":
          description: Results were returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/byGroupCollection"
              examples:
                default:
                  $ref: "#/components/examples/byGroupResp"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/byGroupCollection"
              examples:
                default:
                  $ref: "#/components/examples/byGroupResp"
        "400":
          description: Request contains invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/byGroupBadReqErrorResp"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/byGroupBadReqErrorResp"
  /envelopePlot:
    post:
      tags:
      - EnvelopePlotExploration
      summary: Retrieve envelope plot for analysis variable based on a set of time
        series
      description: Retrieve envelope plot for analysis variable based on a set of
        time series.
      operationId: createEnvelopePlot
      parameters:
      - name: inCaslib
        in: query
        description: "Caslib name "
        required: false
        schema:
          type: string
      - name: inTableName
        in: query
        description: "Time Series table name "
        required: false
        schema:
          type: string
      - name: attributesTableName
        in: query
        description: "Attributes table name "
        required: false
        schema:
          type: string
      - name: casServer
        in: query
        description: CAS server name
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/envelopePlotAnalysisRequest"
            examples:
              json:
                $ref: "#/components/examples/envPlotRequest"
          application/vnd.sas.analytics.forecasting.envelope.plot.request+json:
            schema:
              $ref: "#/components/schemas/envelopePlotAnalysisRequest"
            examples:
              json:
                $ref: "#/components/examples/envPlotRequest"
        description: "Envelope plot analysis request "
      responses:
        "200":
          description: Results were returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/envPlot"
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/envPlot"
        "400":
          description: Request contains invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/envPlotBadReqErrorResp"
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/envPlotBadReqErrorResp"
  /timeSeriesPlot:
    post:
      tags:
      - TimeSeriesPlotExploration
      summary: Retrieve time series plot for analysis variable
      description: Retrieve time series plot for analysis variable.
      operationId: createTimeSeriesPlot
      parameters:
      - name: inCaslib
        in: query
        description: "Caslib tables "
        required: false
        schema:
          type: string
      - name: inTableName
        in: query
        description: "Time series table name "
        required: false
        schema:
          type: string
      - name: casServer
        in: query
        description: CAS Server Name
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/timeSeriesPlotAnalysisRequest"
            examples:
              json:
                $ref: "#/components/examples/tsPlotRequest"
          application/vnd.sas.analytics.forecasting.time.series.plot.request+json:
            schema:
              $ref: "#/components/schemas/timeSeriesPlotAnalysisRequest"
            examples:
              json:
                $ref: "#/components/examples/tsPlotRequest"
        description: "time series plot analysis request "
      responses:
        "200":
          description: Results were returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/timeseriesPlot"
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/timeseriesPlot"
        "400":
          description: Request contains invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/timeseriesPlotBadReqErrorResp"
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/timeseriesPlotBadReqErrorResp"
  /forecastPlot:
    post:
      tags:
      - ForecastPlotExploration
      summary: Retrieve forecast plot
      description: Retrieve forecast plot for specified forecast data.
      operationId: createForecastPlot
      parameters:
      - name: inTableName
        in: query
        description: Forecast table name
        required: false
        schema:
          type: string
      - name: hierarchyEnabled
        in: query
        description: hierarchy enabled
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/vnd.sas.analytics.forecasting.forecast.plot.request+json:
            schema:
              $ref: "#/components/schemas/forecastPlotAnalysisRequest"
            examples:
              json:
                $ref: "#/components/examples/fsPlotRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/forecastPlotAnalysisRequest"
            examples:
              json:
                $ref: "#/components/examples/fsPlotRequest"
        description: Forecast plot analysis request
        required: true
      responses:
        "200":
          description: Results were returned successfully
          content:
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/forecastPlot"
            application/json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/forecastPlot"
        "400":
          description: Request contains invalid data
          content:
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/forecastPlotBadReqErrorResp"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/forecastPlotBadReqErrorResp"
  /fitStatistics:
    post:
      tags:
      - SofExploration
      summary: Retrieve fit statistics table
      description: Retrieve statistics of fit table for a specified time series.
      operationId: createSofPlot
      parameters:
      - name: inTableName
        in: query
        description: Forecast table name
        required: false
        schema:
          type: string
      - name: selectionStat
        in: query
        description: Selection statistic name
        required: false
        schema:
          type: string
      - name: hierarchyEnabled
        in: query
        description: hierarchy enabled
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/vnd.sas.analytics.forecasting.sof.table.request+json:
            schema:
              $ref: "#/components/schemas/sofTableRequest"
            examples:
              json:
                $ref: "#/components/examples/sofTableRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/sofTableRequest"
            examples:
              json:
                $ref: "#/components/examples/sofTableRequest"
        description: Statistics of fit table request
        required: true
      responses:
        "200":
          description: Results were returned successfully
          content:
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/fitStats"
            application/json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/fitStats"
        "400":
          description: Request contains invalid data
          content:
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/fitStatsBadReqErrorResp"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/fitStatsBadReqErrorResp"
  /components/{componentId}/outTables/{srcTable}/columns:
    head:
      tags:
      - OutTableColumns
      summary: Check the availability of columns for output tables
      description: Retrieve the headers and check the availability of columns for
        output tables.
      operationId: headersForOutTableColumns
      parameters:
      - name: componentId
        in: path
        description: Unique ID associated with the component.
        required: true
        schema:
          type: string
      - name: srcTable
        in: path
        description: Unique name associated with the table whose columns are being
          requested.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of columns to retrieve. Default is 10.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
    get:
      tags:
      - OutTableColumns
      summary: Get columns for output tables
      description: Get columns for specified output tables.
      operationId: getOutTableColumns
      parameters:
      - name: componentId
        in: path
        description: Unique ID associated with the component.
        required: true
        schema:
          type: string
      - name: srcTable
        in: path
        description: Unique name associated with the table whose columns are being
          requested.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of columns to retrieve. Default is 10.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: Columns for the specified output table were returned successfully
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/outColumnCollection"
              examples:
                default:
                  $ref: "#/components/examples/outColumns"
            application/json:
              schema:
                $ref: "#/components/schemas/outColumnCollection"
              examples:
                default:
                  $ref: "#/components/examples/outColumns"
  /components/{componentId}/outTables/{srcTable}/sizeEstimate:
    post:
      tags:
      - TableSizeEstimate
      summary: Retrieve information about table size
      description: Retrieve information about number of rows in a table and also the
        table size in bytes.
      operationId: createTableSizeEstimate
      parameters:
      - name: componentId
        in: path
        description: Unique ID associated with the component.
        required: true
        schema:
          type: string
      - name: srcTable
        in: path
        description: Unique name associated with the table whose size information
          is being requested.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/tableEstimatedSizeRequest"
            examples:
              json:
                $ref: "#/components/examples/sizeEstRequest"
          application/vnd.sas.analytics.forecasting.table.estimated.size.request+json:
            schema:
              $ref: "#/components/schemas/tableEstimatedSizeRequest"
            examples:
              json:
                $ref: "#/components/examples/sizeEstRequest"
        description: "Table size estimate request"
      responses:
        "200":
          description: Results were returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tableEstimatedSize"
              examples:
                default:
                  $ref: "#/components/examples/sizeEstimateResp"
            application/vnd.sas.analytics.forecasting.table.estimated.size+json:
              schema:
                $ref: "#/components/schemas/tableEstimatedSize"
              examples:
                default:
                  $ref: "#/components/examples/sizeEstimateResp"
        "400":
          description: Request contains invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/sizeEstBadReqErrorResp"
            application/vnd.sas.analytics.forecasting.table.estimated.size+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/sizeEstBadReqErrorResp"
servers:
- url: http://example.com/forecastingExploration
  description: Kubernetes mock server
components:
  schemas:
    byVariableKeyValuePair:
      type: object
      properties:
        name:
          type: string
          description: BY variable name. Name could be used to look up related Variable
            definition for this BY variable.
        numberValue:
          type: number
          description: numeric type BY variable value.
        stringValue:
          type: string
          description: char type BY variable value
      title: ByVariableKeyValuePair
      description: Representation of a BY variable key value pair. Either numberValue
        or stringValue would be set depending on BY variable type.
    byGroup:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: ByGroup name
        values:
          type: array
          description: List of BY variable key value pairs.
          items:
            $ref: "#/components/schemas/byVariableKeyValuePair"
      description: Representation of a byGroup.
    timeSeriesPlotAnalysisRequest:
      type: object
      required:
      - byGroupNames
      - dataDefinitionId
      - variableName
      properties:
        byGroupNames:
          type: array
          items:
            type: string
          description: list of BY group names
        dataDefinitionId:
          type: string
          description: identifier for data definition
        variableName:
          type: string
          description: name of analysis variable
      description: Request to analyze time series data with time series plot.
    envelopePlotAnalysisRequest:
      type: object
      required:
      - variableName
      - dataDefinitionId
      properties:
        selectedByGroupNames:
          type: array
          items:
            type: string
          description: List of selected BY group names
        filter:
          $ref: "#/components/schemas/filterSpecification"
        variableName:
          type: string
          description: name of analysis variable
        dataDefinitionId:
          type: string
          description: identifier for data definition
      description: Request to analyze time series data with envelope plot.
    forecastPlotAnalysisRequest:
      type: object
      required:
      - byGroupNames
      - dataDefinitionId
      properties:
        byGroupNames:
          type: array
          items:
            type: string
          description: list of BY group names
        dataDefinitionId:
          type: string
          description: identifier for data definition
      description: Request to analyze forecast data with forecast plot.
    sofTableRequest:
      type: object
      required:
      - byGroupNames
      - dataDefinitionId
      properties:
        byGroupNames:
          type: array
          items:
            type: string
          description: list of BY group names
        dataDefinitionId:
          type: string
          description: identifier for data definition
      description: Request to retrieve statistics of fit for a given time series.
    byGroupCollection:
      title: ByGroup collection
      description: A collection of BY groups.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The array of `application/vnd.sas.analytics.forecasting.by.group`
              representations.
            items:
              $ref: "#/components/schemas/byGroup"
    filterSpecification:
      type: object
      required:
      - dataSourceId
      properties:
        attributesCaslib:
          type: string
          description: Name of the library that contains the time series attributes
            table.
        attributesTable:
          type: string
          description: Name of the tables contains the time series attributes.
        createdBy:
          type: string
          description: userid of the user who created the resource
        creationTimeStamp:
          description: The formatted time stamp when the job was created, in yyyy-mm-ddThh:mm:ssZ
            format
          type: string
          format: date-time
        modifiedTimeStamp:
          description: The formatted time stamp when the resource was last modified,
            in yyyy-mm-ddThh:mm:ssZ format
          type: string
          format: date-time
        modifiedBy:
          type: string
          description: The userid of the user who last updated the resource
        dataSourceId:
          type: string
          description: Data specification identifier.
        description:
          type: string
          description: Description of the filter
        fieldCombiningOperator:
          type: string
          description: Operator to combine different categories in the query, valid
            values are "AND" and "OR".  The default is "AND"
          enum:
          - AND
          - OR
        id:
          type: string
          description: Id of the filter
        keyNames:
          type: array
          description: List of variables used to identify time series.
          items:
            type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
        name:
          type: string
          description: Name of the filter
        query:
          type: object
          description: Map is a query that defines the filter.  Individual entries
            are combined using the fieldCombiningOperator.  It is a map of (String,
            Array of filterValue)
          additionalProperties:
            $ref: "#/components/schemas/filterQuery"
        version:
          type: integer
          format: int32
          description: The version number of this representation. This representation
            is version 1.
      title: filterSpecification
      description: Specification of a filter based on time series attributes table.
        Media type is application/vnd.sas.forecasting.filters.result.spec+json
    filterValue:
      type: object
      required:
      - operator
      - value
      properties:
        operator:
          type: string
          description: Operator to be used for filtering operation
          enum:
          - EQ
          - NE
          - LT
          - LE
          - GT
          - GE
          - BETWEEN
          - IN
          - NOT_IN
          - IS_MISSING
          - IS_NOT_MISSING
        value:
          type: object
          description: Value to be matched for filtering operation
      title: filterValue
      description: Representation of a value that needs to be filtered.  This is not
        a top level model
    filterQuery:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/filterValue"
      description: Filter query is a map of variable name to the values being filtered,
        all the elements of the map are combined using the combining operator.
    casColumn:
      type: object
      title: casColumn
      description: Representation of a cas table columns.
      properties:
        version:
          type: integer
          description: Version of the object representation.
        name:
          type: string
          description: Name of the column.
        label:
          type: string
          description: Display label for the column.
        type:
          type: string
          description: Type of the column data.
        rawlength:
          type: integer
          description: Raw length of the column data.
        formattedLength:
          type: integer
          description: Formatted length of the column data.
        format:
          type: string
          description: Format to be applied on the data in the column.
        numberFormatLength:
          type: integer
          description: Length of the number format.
        numberFormatDecimals:
          type: integer
          description: Decimal places in the numbers to be formatter.
        indexed:
          type: boolean
          description: Whether the column is indexed or not.
        index:
          type: integer
          description: Index for the column.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
    outColumn:
      type: object
      title: outColumn
      description: Representation of a CAS table column.
      properties:
        casColumn:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/casColumn"
          description: CAS table column.
        required:
          type: boolean
          description: Whether the column is required to save in the CAS table.
    outColumnCollection:
      type: object
      title: outColumnCollection
      description: Representation of a collection of OutColumn.
      properties:
        version:
          type: integer
          description: The version of the representation.
        accept:
          type: string
          description: The space-separated list of link types of the items.
        count:
          type: integer
          description: The number of items in the collection.
        start:
          type: integer
          description: The index of the first item in the collection.
        limit:
          type: integer
          description: The number of items to return in each page.
        items:
          type: array
          items:
            $ref: "#/components/schemas/outColumn"
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
    tableEstimatedSizeRequest:
      type: object
      properties:
        targetColumns:
          type: array
          items:
            type: string
          description: list of the columns to be included in the output table
        filter:
          type: string
          description: filter specification to filter rows of table
      description: Request to retrieve table size estimates.
    tableEstimatedSize:
      type: object
      required:
      - numberOfRows
      - size
      properties:
        numberOfRows:
          type: number
          description: The number of rows in the table.
        size:
          type: number
          description: The size of the CAS table in bytes.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
      description: The response contains the number of rows in the output table. It
        also contains the size of table in bytes and associated links if any.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
