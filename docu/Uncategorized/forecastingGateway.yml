ecret will need to be updated.","mysas.apps.dialog.regenerateSecret.button.label":"Regenerate","mysas.apps.dialog.regenerateSecret.success.title":"Secret Regenerated","mysas.apps.dialog.newSecret.label":"New Secret","mysas.applications.signIn.required.msg":"Sign in to view and manage your applications","mysas.applications.created.msg":"Application {name} created successfully!","mysas.applications.keysAdded.msg":"New keys added to {name} successfully!","mysas.applications.secret.created.msg":"Your new secret is shown below. Copy and store it securely - it will not be shown again after you leave this page.","mysas.applications.revoked.msg":"Secret revoked successfully!","mysas.applications.secret.created.warning.msg":"This is the only time the secret will be shown. Make sure to copy and store it securely.","mysas.applications.deleted.success.msg":"Application deleted successfully!","mysas.applications.apiKeysTable.aria":"API Keys Table","javaPage.summary.title":"Java APIs for using SAS Viya CAS actions","javaPage.header.title":"Integrate SAS with Java","javaPage.header.desc":"\u003cp\u003eThe SAS Java Client is an interface for SAS Cloud Analytic Services (CAS) which is the centerpiece of the SAS Viya framework.\u003c/p\u003e\u003cp\u003eThis package allows you to:\u003c/p\u003e\u003cul\u003e\u003cli\u003ewrite Java programs that load data into memory\u003c/li\u003e\u003cli\u003einvoke CAS actions to transform, summarize, model and score the data\u003c/li\u003e\u003cli\u003eJava classes are provided that correspond to each CAS action\u003c/li\u003e\u003c/ul\u003e","javaPage.header.image.desc":"Java Image","javaPage.apiDoc.link.label":"APIs","javaPage.apiDoc.link.desc":"Java API Reference Documentation","javaPage.userDoc.link.label":"User Documentation","javaPage.userDoc.link.desc":"SAS and Java Integration","javaPage.downloads.link.desc":"SAS Java Client Interface","luaPage.summary.title":"Explore libraries for SAS and Lua integration","luaPage.header.title":"Integrate SAS with Lua","luaPage.header.desc":"\u003cp\u003eThe SAS Scripting Wrapper for Analytics Transfer (SWAT) package for Lua is a Lua interface to SAS Cloud Analytic Services (CAS) which is the centerpiece of the SAS Viya framework.\u003c/p\u003e\u003cp\u003eThis package allows you to:\u003c/p\u003e\u003cul\u003e\u003cli\u003eretain the ease-of-use of Lua on the client side to further post process CAS result tables\u003c/li\u003e\u003cli\u003eload data into memory and apply CAS actions\u003c/li\u003e\u003cli\u003etransform, summarize, model and score the data\u003c/li\u003e\u003c/ul\u003e","luaPage.header.image.desc":"Lua Image","luaPage.doc.link.desc":"SAS and Lua Integration Documentation","luaPage.downloads.link.desc":"Downloads for SAS Lua Client Interface","rPage.summary.title":"Explore libraries for SAS and R integration","rPage.header.title":"Integrate SAS with R","rPage.header.desc":"\u003cp\u003eCombine R language functions with SAS through various code libraries.\u003c/p\u003e\u003cp\u003eThese packages allow you to:\u003c/p\u003e\u003cul\u003e\u003cli\u003eLoad, import, and profile data using an integrated development environment (IDE) or REST APIs.\u003c/li\u003e\u003cli\u003eCleanse, prepare, and transform your data.\u003c/li\u003e\u003cli\u003eUse functions to manage and provide governance for data assets and their relationships.\u003c/li\u003e\u003c/ul\u003e","rPage.header.image.desc":"R Image","rPage.rSwat.section.title":"R SWAT","rPage.rSwat.section.desc":"The SAS Scripting Wrapper for Analytics Transfer (SWAT) package is the R client to SAS Cloud Analytic Services (CAS). It allows users to execute CAS actions and process the results all from R.","rPage.rSwat.getStarted.title":"Get Started with R SWAT","rPage.rSwat.github.link.desc":"R SWAT GitHub Repository","rPage.rSwat.documents.link.desc":"Get Started with R SWAT","rPage.rSwat.examples.link.desc":"See how to use R SWAT","rPage.rSasctl.section.title":"R-sasctl","rPage.rSasctl.section.desc":"r-sasctl provides tools for easy access of SAS Viya APIs from an R perspective, facilitating model management.","rPage.rSasctl.getStarted.title":"Get Started with R-sasctl","rPage.rSasctl.github.link.desc":"R-sasctl GitHub Repository","rPage.rSasctl.documents.link.desc":"Get Started with R-sasctl","rPage.rSasctl.examples.link.desc":"See how to use R-sasctl","rPage.sasIml.section.title":"SAS/IML software and R","rPage.sasIml.section.desc":"Interactive matrix language (IML) is a programming language for statistical computations, focusing on algorithms using matrices and vectors. SAS/IML configures the SAS system so that you can call functions such as transferring data to R, calling R functions from PROC IML, and writing the results from R to several SAS data structures, all in the R language.","rPage.sasIml.getStarted.title":"Get Started with SAS/IML and R","rPage.sasIml.documents.link.desc":"Get Started with SAS/IML and R","rPage.blog.section.title":"R Posts on SAS Blogs","pythonPage.header.title":"Integrate SAS with Python","pythonPage.header.desc":"\u003cp\u003eSAS integrates with Python through various code libraries and tools that allow open source developers to unite the Python language with the analytic power of SAS. Which package to use depends on your role, goal, system environment and so on.\u003c/p\u003e\u003cp\u003eThese libraries allows you to:\u003c/p\u003e\u003cul\u003e\u003cli\u003eLoad, import and profile data using an integrated development environment (IDE) or REST APIs.\u003c/li\u003e\u003cli\u003eCleanse, prepare and transform your data.\u003c/li\u003e\u003cli\u003eUse functions to manage and provide governance for data assets and their relationships.\u003c/li\u003e\u003c/ul\u003e","pythonPage.header.image.desc":"Python Image","pythonPage.summary.title":"Explore libraries for SAS and Python integration","pythonPage.swat.section.title":"Python SAS Scripting Wrapper for Analytics Transfer (SWAT)","pythonPage.swat.section.desc":"The SAS SWAT package allows users to execute CAS actions and process the results all from Python. Load and analyze data sets, execute workflows and actions, and use many Pandas features.","pythonPage.swat.getStarted.title":"Get Started with Python SWAT","pythonPage.swat.github.link.desc":"Python SWAT GitHub Repository","pythonPage.swat.documents.link.desc":"Get Started with Python SWAT","pythonPage.swat.examples.link.desc":"See how to use Python SWAT","pythonPage.saspy.section.title":"SASPy","pythonPage.saspy.section.desc":"The SASPy package provides interfaces between Python and SAS. This package enables a Python developer to create mixed Python/SAS workflows to leverage the powers of both SAS and Python.","pythonPage.saspy.getStarted.title":"Get Started with SASPy","pythonPage.saspy.github.link.desc":"SASPy GitHub Repository","pythonPage.saspy.documents.link.desc":"Get Started with SASPy","pythonPage.saspy.examples.link.desc":"See how to use SASPy","pythonPage.sasctl.section.title":"Python sasctl","pythonPage.sasctl.section.desc":"A user-friendly REST client for SAS Viya. The sasctl package is a SAS Viya REST client that enables easy communication between the SAS Viya platform and a Python runtime. It facilitates full model management lifecycle (build, register, publish, score)","pythonPage.sasctl.getStarted.title":"Get Started with Python sasctl","pythonPage.sasctl.github.link.desc":"Python sasctl GitHub Repository","pythonPage.sasctl.documents.link.desc":"Get Started with sasctl","pythonPage.sasctl.examples.link.desc":"See how to use Python sasctl","pythonPage.dlpy.section.title":"SAS Viya Deep Learning API for Python (DLPy)","pythonPage.dlpy.section.desc":"DLPy is a high-level Python library for the SAS Deep learning features available in SAS Viya. DLPy is designed to provide an efficient way to apply deep learning methods to image, text, and audio data.","pythonPage.dlpy.getStarted.title":"Get Started with SASDLPy","pythonPage.dlpy.github.link.desc":"SASDLPy GitHub Repository","pythonPage.dlpy.documents.link.desc":"Get Started with SASDLPy","pythonPage.dlpy.examples.link.desc":"See how to use Python SASDLPy","pythonPage.pyviyatools.section.title":"Python tools for SAS Viya (pyviyatools)","pythonPage.pyviyatools.section.desc":"The pyviyatools are a set of SAS Viya command-line (CLI) tools that call the SAS Viya REST APIs from Python.","pythonPage.pyviyatools.getStarted.title":"Get Started with Python tools for SAS Viya","pythonPage.pyviyatools.github.link.desc":"Python tools for SAS Viya GitHub Repository","pythonPage.pyviyatools.documents.link.desc":"Get Started with pyviyatools","pythonPage.pyviyatools.examples.link.desc":"See how to use pyviyatools","pythonPage.sasoptpy.section.title":"SAS Optimization Python Interface (sasoptpy)","pythonPage.sasoptpy.section.desc":"The sasoptpy package enables developers to quickly formulate and solve mathematical optimization problems by using native Python data structures.","pythonPage.sasoptpy.getStarted.title":"Get Started with sasoptpy","pythonPage.sasoptpy.github.link.desc":"sasoptpy GitHub Repository","pythonPage.sasoptpy.documents.link.desc":"Get Started with sasoptpy","pythonPage.sasoptpy.examples.link.desc":"See how to use sasoptpy","pythonPage.cvpy.section.title":"SAS Viya Computer Vision API for Python (CVPy)","pythonPage.cvpy.section.desc":"SAS Viya Computer Vision API for Python (CVPy) is a Python package that makes SAS image analytics accessible to Python users by providing APIs to assist with the processing, analyzing, and visualization of images.","pythonPage.cvpy.getStarted.title":"Get Started with CVPy","pythonPage.cvpy.github.link.desc":"CVPy GitHub Repository","pythonPage.cvpy.documents.link.desc":"Get Started with CVPy","pythonPage.cvpy.examples.link.desc":"See how to use CVPy","pythonPage.blog.section.title":"Python Posts on SAS Blogs","vsCodePage.summary.title":"Install the SAS extension for Visual Studio Code","vsCodePage.howToVideos.link.label":"How-to Videos","vsCodePage.header.image.desc":"SAS Extension for VS Code Image","vsCodePage.title.video1":"SAS VS Code Extension | Overview","vsCodePage.desc.video1":"Learn the basics of the tool: write code, connect to SAS, run code, file management, etc.","vsCodePage.link.video1":"https://www.youtube.com/watch?v=TZSBr3RdQBA","vsCodePage.title.video2":"SAS VS Code Extension | Version 1.0 Update","vsCodePage.desc.video2":"Learn how to generate SAS, SQL, and Python Notebooks.","vsCodePage.link.video2":"https://www.youtube.com/watch?v=6nXnZYNeJGU\u0026t=311s","vsCodePage.title.video3":"SAS VS Code Extension | Versions 1.1 and 1.2 Update","vsCodePage.desc.video3":"Learn about the improved data viewer, SAS system and autoexec options, and how to download tables and libraries.","vsCodePage.link.video3":"https://www.youtube.com/watch?v=IIRZDr9qnjI","vsCodePage.title.video4":"SAS VS Code Extension | Versions 1.3 - 1.5 Update","vsCodePage.desc.video4":"In this video, learn about native language support, converting Notebooks to Flows, and new Settings options.","vsCodePage.link.video4":"https://www.youtube.com/watch?v=Exh_twmoLgg","vsCodePage.title.video5":"SAS VS Code Extension | Versions 1.6 Update","vsCodePage.desc.video5":"In this video, learn about the IOM connection to SAS 9. downloading results, and code collapsing enhancements.","vsCodePage.link.video5":"https://www.youtube.com/watch?v=zoNSxKTwnzQ","vsCodePage.title.video6":"SAS VS Code Extension | Version 1.7 and 1.8 Update","vsCodePage.desc.video6":"Format code via context menu, new languages, and more developer features.","vsCodePage.link.video6":"https://www.youtube.com/watch?v=1Ep9yz0Qu3k","vsCodePage.header.desc":"The SAS VS Code extension is lightweight, runs anywhere, and allows you to integrate SAS and other languages. The tool also offers the ability to connect directly to SAS Viya and SAS 9 and run code. \u003cp\u003e\u003cul\u003e\u003cli\u003eSAS syntax highlighting and help, code completion, and code snippets\u003c/li\u003e\u003cli\u003eProfile configuration for connecting to SAS and running code\u003c/li\u003e\u003cli\u003eSupport for SAS Viya and SAS 9 connections\u003c/li\u003e\u003cli\u003eAccess to SAS Content and Libraries\u003c/li\u003e\u003cli\u003eCreate Notebooks for SAS, SQL, Python and other languages\u003c/li\u003e\u003c/ul\u003e\u003c/p\u003e","vsCodePage.github.link.desc":"SAS Extension for VS Code","vsCodePage.vsMarket.link.label":"SAS Viya Copilot","vsCodePage.vsMarket.link.desc":"SAS Viya Copilot Extension for VS Code on the Visual Studio Marketplace","vsCodePage.sasViyaCopilot.link.label":"SAS.com","vsCodePage.sasViyaCopilot.link.desc":"Learn more about SAS Viya Copilot","casPage.summary.title":"Learn how to use CAS actions to load data, transform data, compute statistics, perform analytics and create output","casPage.header.image.desc":"CAS Action Image","casPage.api.section.title":"CAS REST API","casPage.api.section.desc":"Explore the capabilities of SAS Cloud Analytic Services (CAS) REST APIs","casPage.actions.section.title":"CAS Actions and Action Sets","casPage.actions.section.desc":"Load and transform data, compute statistics, perform analytics and create output","casPage.guide.section.desc":"Learn more about key CAS concepts, operations, data management and security","casPage.blog.section.header":"CAS Actions Posts on SAS Blogs","viyaPage.summary.title":"Learn how to run SAS code on the SAS Viya platform","viyaPage.header.desc":"Access the capabilities of SAS Viya through Cloud Analytic Services (CAS) actions for data access and analytics, run directly from SAS applications. \u003cp\u003eSAS Viya provides several ways to access services and analytics through SAS procedures. CASL is a language specification used by SAS and other clients to interact with CAS.\u003c/p\u003e \u003cp\u003e SAS Viya provides a variety of interfaces for running CAS actions, including from a SAS session, Python, R, Lua, and via REST using the CAS REST APIs.\u003c/p\u003e","viyaPage.header.image.desc":"SAS Viya Image","viyaPage.viyaDoc.link.label":"SAS Viya Documentation","viyaPage.viyaDoc.link.desc":"SAS Viya Programming Documentation","viyaPage.caslDoc.link.label":"CASL Documentation","viyaPage.github.link.label":"SAS Viya Programming on GitHub","viyaPage.blog.section.header":"SAS Viya Posts on SAS Blogs","casPage.header.desc":"The Cloud Analytic Services (CAS) REST APIs are for data scientists, programmers and administrators, who need to interact with CAS directly and know about CAS actions. There are API operations for executing CAS actions, managing the CAS sessions, monitoring the system and inspecting the CAS grid. \u003cp\u003eSAS Viya uses CAS to perform tasks. The smallest unit of work for the CAS server is a CAS action. CAS actions can load data, transform data, compute statistics, perform analytics and create output. Each action is configured by specifying a set of input parameters. Running a CAS action in the CAS server processes the action's parameters and the data and creates an action result.\u003c/p\u003e","casPage.guide.section.title":"CAS User's Guide","viyaPage.caslDoc.link.desc":"CASL Programmer's Guide","sdksPage.desc":"SAS provides a set of software development kits (SDK) that help developers embed insights and content from SAS Viya into custom dashboards, portals, and web pages. \u003cp\u003e Use the frameworks and groups of code libraries within the SDKs to build software and applications. Developers can use the SDKs to embed elements within custom web pages and web apps that allow end users to navigate, preview, and open content in SAS Viya.\u003c/p\u003e","sdksPage.header.image.desc":"SDK Image","sdksPage.visualInvestigator.section.desc":"The SAS Visual Investigator API provides a set of components and service methods that enable developers to create customized solutions within the application.","sdksPage.mobileInvestigator.section.title":"Mobile Investigator","sdksPage.mobileInvestigator.section.desc":"The SAS Mobile Investigator API pr