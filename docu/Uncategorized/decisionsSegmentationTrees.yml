openapi: 3.0.3
paths:
    /:
        get:
            description: Returns a list of top-level resource links for this API.
            operationId: root
            responses:
                "200":
                    content:
                        application/json:
                            examples:
                                root:
                                    $ref: "#/components/examples/root"
                            schema:
                                $ref: "#/components/schemas/api"
                        application/vnd.sas.api+json:
                            examples:
                                root:
                                    $ref: "#/components/examples/root"
                            schema:
                                $ref: "#/components/schemas/api"
                    description: The request succeeded. A collection of link objects was returned.
                    headers:
                        Sas-Service-Response-Flag:
                            $ref: '#/components/headers/Sas-Service-Response-Flag'
            summary: Get a list of top-level links
            tags:
                - Root
    /segmentationTrees:
        get:
            description: Returns a resource collection of all segmentation trees.
            operationId: getSegmentationTrees
            parameters:
                - description: The criteria for filtering the segmentation trees. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters). <br> Properties that support filtering are <ul> <li>createdBy</li> <li>modifiedBy</li> <li>creationTimeStamp</li> <li>modifiedTimeStamp</li> <li>id</li> <li>name</li> <li>description</li> <li>majorRevision</li> <li>minorRevision</li> <li>signature.name</li> <li>signature.description</li> <li>signature.dataType</li> <li>signature.length</li> <li>signature.direction</li> </ul>
                  example: gt(modifiedTimeStamp, '2021-05-03T15:38:45.654Z')
                  in: query
                  name: filter
                  schema:
                    format: filter-criteria
                    type: string
                - description: The criteria for sorting the segmentation trees. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting). <br> Properties that support sorting are <ul> <li>createdBy</li> <li>modifiedBy</li> <li>creationTimeStamp</li> <li>modifiedTimeStamp</li> <li>id</li> <li>name</li> <li>description</li> <li>majorRevision</li> <li>minorRevision</li> </ul>
                  example: modifiedTimeStamp:descending
                  in: query
                  name: sortBy
                  schema:
                    default: creationTimeStamp:descending
                    format: sort-criteria
                    type: string
                - description: The starting index of the first item in a page. The index is 0-based.
                  example: 100
                  in: query
                  name: start
                  schema:
                    default: 0
                    type: integer
                - description: The maximum number of items to return in this page of results. The actual number of returned items might be less if the collection has been exhausted.
                  example: 500
                  in: query
                  name: limit
                  schema:
                    default: 10
                    type: integer
                - description: The folder where the target segmentation trees are located.
                  example: /folders/folders/@public
                  in: query
                  name: parentFolderUri
                  required: false
                  schema:
                    format: /folders/folders/{parentFolderId}
                    type: string
                - description: Used for selecting desired item representation.
                  example: application/vnd.sas.decision.segmentation.tree+json
                  in: header
                  name: Accept-Item
                  schema:
                    default: application/vnd.sas.summary+json
                    enum:
                        - application/vnd.sas.decision.segmentation.tree+json
                        - application/vnd.sas.summary+json
                        - application/vnd.sas.dcm.summary+json
                    format: media-type
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            examples:
                                application/vnd.sas.dcm.summary+json:
                                    $ref: "#/components/examples/revisionSummaryOfSegmentationTrees"
                                application/vnd.sas.decision.segmentation.tree+json:
                                    $ref: "#/components/examples/fullDetailsOfSegmentationTrees"
                                application/vnd.sas.summary+json:
                                    $ref: "#/components/examples/resourceSummaryOfSegmentationTrees"
                            schema:
                                anyOf:
                                    - $ref: '#/components/schemas/resourceSummaryCollection'
                                    - $ref: '#/components/schemas/segmentationTreeCollection'
                                    - $ref: '#/components/schemas/revisionSummaryCollection'
                        application/vnd.sas.collection+json:
                            examples:
                                application/vnd.sas.dcm.summary+json:
                                    $ref: "#/components/examples/revisionSummaryOfSegmentationTrees"
                                application/vnd.sas.decision.segmentation.tree+json:
                                    $ref: "#/components/examples/fullDetailsOfSegmentationTrees"
                                application/vnd.sas.summary+json:
                                    $ref: "#/components/examples/resourceSummaryOfSegmentationTrees"
                            schema:
                                anyOf:
                                    - $ref: '#/components/schemas/resourceSummaryCollection'
                                    - $ref: '#/components/schemas/segmentationTreeCollection'
                                    - $ref: '#/components/schemas/revisionSummaryCollection'
                    description: The request succeeded.
                    headers:
                        Sas-Service-Response-Flag:
                            $ref: '#/components/headers/Sas-Service-Response-Flag'
                "400":
                    content:
                        application/vnd.sas.error+json:
                            examples:
                                default:
                                    $ref: "#/components/examples/badRequest"
                            schema:
                                $ref: "#/components/schemas/error2"
                    description: The request was invalid.
                    headers:
                        Sas-Service-Response-Flag:
                            $ref: '#/components/headers/Sas-Service-Response-Flag'
                "406":
                    content:
                        application/vnd.sas.error+json:
                            examples:
                                default:
                                    $ref: "#/components/examples/notAcceptable"
                            schema:
                                $ref: "#/components/schemas/error2"
                    description: The request was not acceptable. An invalid media type was specified for the `Accept-Item` header value.
                    headers:
                        Sas-Service-Response-Flag:
                            $ref: '#/components/headers/Sas-Service-Response-Flag'
            summary: Get a list of all segmentation trees
            tags:
                - SegmentationTrees
        post:
            description: Creates a new segmentation tree based on the provided content.
            operationId: createSegmentationTree
            parameters:
                - description: Folder in which the new segmentation tree is placed.
                  example: /folders/folders/@public
                  in: query
                  name: parentFolderUri
                  required: false
                  schema:
                    format: /folders/folders/{parentFolderId}
                    type: string
                - description: This value specifies the URI of the segmentation tree revision from which the new segmentation tree is being created. This property enables you to trace the lineage of a segmentation tree.
                  example: /decisions/segmentationTrees/ef613bb5-d855-4227-97ac-9e9bfefe3e4a/revisions/ba14828c-b4b6-4a3a-9246-f51dd16ffcba
                  in: query
                  name: fromRevisionUri
                  schema:
                    format: /decisions/segmentationTrees/{segmentationTreeId}/revisions/{revisionId}
                    type: string
            requestBody:
                content:
                    application/json:
                        examples:
                            With a Boolean Expression Node:
                                $ref: "#/components/examples/createOrUpdateSegmentationTreeWithBooleanExpressionNode"
                            With a Code Assignment Outcome:
                                $ref: "#/components/examples/createOrUpdateSegmentationTreeWithCodeAssignmentOutcomeAction"
                            With a Matrix Node:
                                $ref: "#/components/examples/createOrUpdateSegmentationTreeWithMatrixNode"
                            With a Variable Assignment Outcome:
                                $ref: "#/components/examples/createOrUpdateSegmentationTreeWithVariableAssignmentOutcomeAction"
                            With a Variable Node:
                                $ref: "#/components/examples/createOrUpdateSegmentationTreeWithVariableNode"
                        schema:
                            $ref: "#/components/schemas/segmentationTree"
                    application/vnd.sas.decision.segmentation.tree+json:
                        examples:
                            With a Boolean Expression Node:
                                $ref: "#/components/examples/createOrUpdateSegmentationTreeWithBooleanExpressionNode"
                            With a Code Assignment Outcome:
                                $ref: "#/components/examples/createOrUpdateSegmentationTreeWithCodeAssignmentOutcomeAction"
                            With a Matrix Node:
                                $ref: "#/components/examples/createOrUpdateSegmentationTreeWithMatrixNode"
                            With a Variable Assignment Outcome:
                                $ref: "#/components/examples/createOrUpdateSegmentationTreeWithVariableAssignmentOutcomeAction"
                            With a Variable Node:
                                $ref: "#/components/examples/createOrUpdateSegmentationTreeWithVariableNode"
                        schema:
                            $ref: "#/components/schemas/segmentationTree"
                description: Segmentation tree details to create a segmentation tree.
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            examples:
                                default:
                                    $ref: "#/components/examples/fullDetailsOfSegmentationTree"
                            schema:
                                $ref: "#/components/schemas/segmentationTree"
                        application/vnd.sas.decision.segmentation.tree+json:
                            examples:
                                default:
                                    $ref: "#/components/examples/fullDetailsOfSegmentationTree"
                            schema:
                                $ref: "#/components/schemas/segmentationTree"
                    description: The segmentation tree was created.
                    headers:
                        ETag:
                            description: The entity tag for the segmentation tree.
                            example: '"kknyjgku"'
                            schema:
                                type: string
                        Last-Modified:
                            example: Thu, 06 May 2021 21:37:00 GMT
                            schema:
                                type: string
                        Location:
                            example: /decisions/segmentationTrees/094078e7-278a-4719-a704-6e5e65af29ee
                            schema:
                                type: string
                        Sas-Service-Response-Flag:
                            $ref: '#/components/headers/Sas-Service-Response-Flag'
                "400":
                    content:
                        application/vnd.sas.error+json:
                            examples:
                                default:
                                    $ref: "#/components/examples/badRequest"
                            schema:
                                $ref: "#/components/schemas/error2"
                    description: The request was invalid.
                    headers:
                        Sas-Service-Response-Flag:
                            $ref: '#/components/headers/Sas-Service-Response-Flag'
            summary: Create a segmentation tree
            tags:
                - SegmentationTrees
    /segmentationTrees/{segmentationTreeId}:
        delete:
            description: Deletes the specified segmentation tree.
            operationId: deleteSegmentationTree
            parameters:
                - description: Identifier for the segmentation tree.
                  example: 094078e7-278a-4719-a704-6e5e65af29ee
                  in: path
                  name: segmentationTreeId
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: The segmentation tree was deleted.
                    headers:
                        Sas-Service-Response-Flag:
                            $ref: '#/components/headers/Sas-Service-Response-Flag'
            summary: Delete a segmentation tree
            tags:
                - SegmentationTrees
        get:
            description: Retrieves the contents of a segmentation tree.
            operationId: getSegmentationTree
            parameters:
                - description: Identifier for the segmentation tree.
                  example: 094078e7-278a-4719-a704-6e5e65af29ee
                  in: path
                  name: segmentationTreeId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            examples:
                                default:
                                    $ref: "#/components/examples/fullDetailsOfSegmentationTree"
                            schema:
                                $ref: "#/components/schemas/segmentationTree"
                        application/vnd.sas.dcm.summary+json:
                            examples:
                                default:
                                    $ref: "#/components/examples/revisionSummaryOfSegmentationTree"
                            schema:
                                $ref: "#/components/schemas/revisionSummary"
                        application/vnd.sas.decision.segmentation.tree+json:
                            examples:
                                default:
                                    $ref: "#/components/examples/fullDetailsOfSegmentationTree"
                            schema:
                                $ref: "#/components/schemas/segmentationTree"
                        application/vnd.sas.summary+json:
                            examples:
                                default:
                                    $ref: "#/components/examples/resourceSummaryOfSegmentationTree"
                            schema:
                                $ref: "#/components/schemas/summary"
                    description: The request succeeded.
                    headers:
                        ETag:
                            description: The entity tag for the segmentation tree.
                            example: '"kknyjgku"'
                            schema:
                                type: string
                        Last-Modified:
                            example: Thu, 06 May 2021 21:37:00 GMT
                            schema:
                                type: string
                        Sas-Service-Response-Flag:
                            $ref: '#/components/headers/Sas-Service-Response-Flag'
                "404":
                    content:
                        application/vnd.sas.error+json:
                            examples:
                                default:
                                    $ref: "#/components/examples/notFound"
