            properties:
                links:
                    description: The API's top-level links.
                    items:
                        $ref: "#/components/schemas/link"
                    type: array
                version:
                    description: The version number of the API representation. This is version 1.
                    minimum: 1
                    type: integer
            required:
                - version
                - links
            title: API
            x-sas-media-type:
                name: application/vnd.sas.api
                version: 1
        baseCollection2:
            description: This is a base schema used to define paginated collections of resources. This base schema is extended by other schemas in APIs by adding an 'items' array property. These extensions define the application/vnd.sas.collection media type (version 2)
            properties:
                accept:
                    description: A space-delimited list of media types from which an `Accept` header may be constructed.
                    type: string
                count:
                    description: If populated indicates the number of items in the collection.
                    format: int64
                    type: integer
                limit:
                    description: The number of items that were requested for the collection.
                    type: integer
                links:
                    description: The links that apply to the collection.
                    items:
                        $ref: "#/components/schemas/link"
                    type: array
                name:
                    description: The name of the collection.
                    type: string
                start:
                    description: The zero-based index of the first item in the collection.
                    format: int64
                    type: integer
                version:
                    description: The version number of the collection representation. This representation is version 2.
                    type: integer
            title: Base Collection
        booleanExpression:
            description: Named boolean expression which evaluates to a boolean value.
            properties:
                description:
                    description: The description for this boolean expression.
                    maxLength: 1000
                    type: string
                expression:
                    description: Code which evaluates to a boolean value.
                    maxLength: 1000
                    type: string
                name:
                    description: Name of the boolean expression. Unique within a segmentation tree.
                    type: string
            required:
                - name
                - expression
            title: Segmentation Tree Boolean Expression
            type: object
        booleanExpressionNode:
            description: Node with a boolean expression.
            properties:
                booleanExpressionName:
                    description: Name of the boolean expression. Should exist in the segmentation tree signature.
                    maxLength: 100
                    type: string
                id:
                    description: The ID for the segmentation tree node.
                    readOnly: true
                    type: string
                label:
                    description: The label for the segmentation tree node.
                    maxLength: 100
                    type: string
                type:
                    description: Type of node being referenced within the segmentation tree.
                    enum:
                        - booleanExpression
                    format: enumeration
                    type: string
                valueNodes:
                    description: List of value nodes. Value of the value node should be either true or false.
                    items:
                        $ref: "#/components/schemas/valueNode"
                    type: array
            required:
                - type
                - booleanExpressionName
            title: Segmentation Tree Boolean Expression Node
            type: object
        codeAssignmentOutcomeAction:
            description: Outcome action in which a specified code is executed to assign values to variables.
            properties:
                codeFileName:
                    description: Name of the code file. Should exist in the segmentation tree.
                    maxLength: 100
                    type: string
                type:
                    description: Type of outcome action being referenced within the segmentation tree outcome.
                    enum:
                        - codeAssignment
                    format: enumeration
                    type: string
            required:
                - type
                - codeFileName
            title: Segmentation Tree Code Assignment Outcome Action
            type: object
        decisionStepCode:
            description: Contains the structure of code that is needed to generate the decision code.
            properties:
                code:
                    description: The code of the object used in the decision step.
                    type: string
                createdBy:
                    description: The user who created the object used in decision step.
                    type: string
                creationTimeStamp:
                    description: The date and time that the object used in the decision step was created.
                    format: date-time
                    type: string
                description:
                    description: The description of the object used in decision step.
                    type: string
                id:
                    description: The system-assigned unique ID for this object.
                    type: string
                links:
                    description: Zero or more links to related resources or operations.
                    items:
                        $ref: "#/components/schemas/link"
                    type: array
                modifiedBy:
                    description: The user ID of the authenticated user who last updated the object used in the decision step.
                    type: string
                modifiedTimeStamp:
                    description: The date and time that the object used in the decision step was last modified.
                    format: date-time
                    type: string
                name:
                    description: The name of the object used in decision step.
                    type: string
                signature:
                    description: Signature variables of the object used in the decision step.
                    items:
                        $ref: "#/components/schemas/decisionStepCodeSignatureTerm"
                    type: array
                type:
                    description: The object type of the object used in the decision step.
                    type: string
                version:
                    description: This media type's schema version number. This representation is version 1.
                    type: integer
            title: Decision Step Code
        decisionStepCodeSignatureTerm:
            description: Terms that are a part of the signature for the object that is used in a decision step.
            properties:
                dataGridExtension:
                    description: Metadata information about data grid columns.
                    items:
                        $ref: "#/components/schemas/decisionStepCodeSignatureTermDataGridExtension"
                    type: array
                dataType:
                    description: Data type of the term.
                    enum:
                        - string
                        - decimal
                        - integer
                        - dataGrid
                        - date
                        - datetime
                        - unknown
                    type: string
                direction:
                    description: Direction of the term.
                    type: string
                length:
                    description: Length of the term.
                    type: integer
                name:
                    description: The name of the object used in a decision step.
                    type: string
            required:
                - name
                - dataType
                - direction
            title: Decision Step Code Signature Term
        decisionStepCodeSignatureTermDataGridExtension:
            description: Decision Step Code Signature Term DataGrid Extension is used to store the column information of a DataGrid variable.
            properties:
                autoPopulate:
                    description: |
                        When this flag value is set to true, the code that is generated by the application calls the appropriate data function to create the new column that you added to the metadata at runtime.
                    type: boolean
                dataType:
                    description: Data type of the dataGrid column.
                    enum:
                        - string
                        - decimal
                        - integer
                        - date
                        - datetime
                    format: enumeration
                    type: string
                length:
                    description: Length of the value in the dataGrid column. Valid for dataType string.
                    type: integer
                name:
                    description: Name of the dataGrid column.
                    type: string
            required:
                - name
                - dataType
            title: Decision Step Code Signature Term DataGrid Extension
        error2:
            description: The representation of an error.
            properties:
                details:
                    description: Messages that provide additional details about the cause of the error.
                    items:
                        type: string
                    type: array
                errorCode:
                    description: The numeric ID for the error.
                    type: integer
                errors:
                    description: Any additional errors that occurred.
                    items:
                        $ref: "#/components/schemas/error2"
                    type: array
                httpStatusCode:
                    description: The HTTP status code for the error.
                    type: integer
                id:
                    description: The string ID for the error.
                    type: string
                links:
                    description: The links that apply to the error.
                    items:
                        $ref: "#/components/schemas/link"
                    type: array
                message:
                    description: The message for the error.
                    type: string
                remediation:
                    description: A message that describes how to resolve the error.
                    type: string
                version:
                    description: The version number of the error representation. This representation is version 2.
                    type: integer
            required:
                - httpStatusCode
                - version
            title: Error
            type: object
            x-sas-media-type:
                name: application/vnd.sas.error
                version: 2
        internalCodeFile:
            description: Code file which is internal to the segmentation tree
            properties:
                code:
                    description: Code that needs to be executed to assign values to variables.
                    maxLength: 1000
                    type: string
                description:
                    description: The description for this code file.
                    maxLength: 1000
                    type: string
                name:
                    description: Name of the code file. Unique within a segmentation tree.
                    maxLength: 100
                    type: string
                type:
                    description: Type of code file used in the segmentation tree.
                    enum:
                        - internal
                    format: enumeration
                    type: string
            required:
                - type
                - name
                - code
            title: Segmentation Tree Internal Code File
            type: object
        link:
            description: A link to a related operation or resource.
            properties:
                href:
                    description: The URL for the link.
                    type: string
                itemType:
                    description: If this is a link to a container, `itemType` is the media type or link type for the items in the container.
                    type: string
                method:
                    description: The HTTP method for the link.
                    type: string
                rel:
                    description: The relationship of the link to the resource.
                    type: string
                responseItemType:
                    description: The media type or link type of the items in the response body for a `PUT`, `POST`, or `PATCH` operation.
                    type: string
                responseType:
                    description: The media type or link type of the response body for a `PUT`, `POST`, or `PATCH` operation.
                    type: string
                title:
                    description: The title for the link.
                    type: string
                type:
                    description: The media type or link type for the link.
                    type: string
                uri:
                    description: The relative URI for the link.
                    type: string
            required:
                - rel
            title: Link
            type: object
        matrix:
            description: Two dimensional array with down and across variable values with their intersection outcomes.
            properties:
                acrossVariableName:
                    description: Name of the across variable. Should exist in the segmentation tree signature.
                    type: integer
                acrossVariableValues:
                    description: Values for the across variable. Should be unique.
                    items:
                        anyOf:
                            - type: integer
                            - type: number
                            - type: boolean
                            - type: string
                    minLength: 1
                    type: array
                description:
                    description: The description for this matrix.
                    maxLength: 1000
                    type: string
                downVariableName:
                    description: Name of the down variable. Should exist in the segmentation tree signature.
                    type: string
                downVariableValues:
                    description: Values for the down variable. Should be unique.
                    items:
                        anyOf:
                            - type: integer
                            - type: number
                            - type: boolean
                            - type: string
                    minLength: 1
                    type: array
                name:
                    description: Name of the matrix. Unique within a segmentation tree.
                    maxLength: 100
                    type: string
                outcomes:
                    description: Outcomes of this matrix. Rows should match number of down variable values and columns in each row should match number of across variable values.
                    items:
                        items:
                            anyOf:
                                - type: integer
                                - type: number
                                - type: boolean
                                - type: string
                        type: array
                    minLength: 1
                    type: array
            required:
                - name
                - downVariableName
                - downVariableValues
                - acrossVariableName
                - acrossVariableValues
                - outcomes
            title: Segmentation Tree Matrix
            type: object
        matrixNode:
