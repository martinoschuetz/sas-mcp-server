        revisionSummaryCollection:
            allOf:
                - $ref: "#/components/schemas/baseCollection2"
                - properties:
                    items:
                        description: Array consisting of one page of the objects as summary resources.
                        items:
                            $ref: "#/components/schemas/revisionSummary"
                        type: array
                  required:
                    - items
                  type: object
            description: One page of the webhook as revision summary representations, with optional links to first, prev, next, and last page of the list.
            title: Revision Summary Collection
            type: object
        segmentationTree:
            description: The representation of a segmentation tree.
            properties:
                booleanExpressions:
                    description: Boolean Expressions associated with this segmentation tree.
                    items:
                        $ref: "#/components/schemas/booleanExpression"
                    type: array
                checkout:
                    description: A flag that indicates whether the segmentation tree is a user's working copy of another segmentation tree.
                    readOnly: true
                    type: boolean
                codeFiles:
                    anyOf:
                        - $ref: "#/components/schemas/internalCodeFile"
                    description: Code files associated with this segmentation tree.
                    type: object
                copyTimeStamp:
                    description: The time stamp when the segmentation tree revision was copied.
                    format: date-time
                    readOnly: true
                    type: string
                createdBy:
                    description: The user ID who created the segmentation tree.
                    readOnly: true
                    type: string
                creationTimeStamp:
                    description: The timestamp when the segmentation tree was created.
                    format: date-time
                    readOnly: true
                    type: string
                description:
                    description: The description for the segmentation tree.
                    maxLength: 1000
                    type: string
                folderType:
                    description: Indicates the type of folder where the segmentation tree is located.
                    readOnly: true
                    type: string
                id:
                    description: The string ID for the segmentation tree.
                    readOnly: true
                    type: string
                links:
                    description: Links to related resources or operations.
                    items:
                        $ref: "#/components/schemas/link"
                    readOnly: true
                    type: array
                locked:
                    description: Flag that indicates whether the content being viewed is locked or editable.
                    readOnly: true
                    type: boolean
                majorRevision:
                    description: Major version number of the revision being viewed of the segmentation tree. This value is assigned by the service, the user has only control of whether the major number or minor number is incremented when creating a new revision.
                    readOnly: true
                    type: integer
                matrices:
                    description: Matrices associated with this segmentation tree.
                    items:
                        $ref: "#/components/schemas/matrix"
                    type: array
                minorRevision:
                    description: Minor version number of the current revision of the segmentation tree. This value is assigned by the service, the user has only control of whether the major number or minor number is incremented when creating a new revision.
                    readOnly: true
                    type: integer
                modifiedBy:
                    description: The user ID who modified the segmentation tree.
                    readOnly: true
                    type: string
                modifiedTimeStamp:
                    description: The timestamp when the segmentation tree properties was modified.
                    format: date-time
                    readOnly: true
                    type: string
                name:
                    description: The name for the segmentation tree.
                    maxLength: 100
                    type: string
                node:
                    anyOf:
                        - $ref: "#/components/schemas/variableNode"
                        - $ref: "#/components/schemas/booleanExpressionNode"
                        - $ref: "#/components/schemas/matrixNode"
                    description: Root node associated with this segmentation tree.
                outcomes:
                    description: Outcomes associated with this segmentation tree.
                    items:
                        $ref: "#/components/schemas/outcome"
                    type: array
                signature:
                    description: The set of terms local to this segmentation tree with input and output behavior.
                    items:
                        $ref: "#/components/schemas/signatureTerm"
                    type: array
                sourceRevisionUri:
                    description: The URI of the segmentation tree revision this segmentation tree is being created from.
                    readOnly: true
                    type: string
                version:
                    description: The version number of the domain representation. This representation is version 1.
                    readOnly: true
                    type: integer
            required:
                - name
            title: Segmentation Tree
            type: object
        segmentationTreeCollection:
            allOf:
                - $ref: "#/components/schemas/baseCollection2"
                - properties:
                    items:
                        description: Array consisting of one page of SegmentationTree resources.
                        items:
                            $ref: "#/components/schemas/segmentationTree"
                        type: array
                  required:
                    - items
                  type: object
            description: A paginated list of segmentation tree representations, with optional links to first, prev, next, and last page of the collection.
            title: SegmentationTree Collection
        signatureTerm:
            description: Represents a term that is used within a segmentation tree.
            properties:
                dataType:
                    description: The type of data that the term is intended to be used with.
                    enum:
                        - string
                        - decimal
                        - integer
                        - boolean
                        - date
                        - datetime
                    format: enumeration
                    type: string
                description:
                    description: Description of the term
                    maxLength: 1000
                    type: string
                direction:
                    description: |
                        Declaration of how the data is to be used during execution. It indicates if the data should be used as input, output, both input and output, or none if the term is only for internal usage.
                    enum:
                        - input
                        - output
                        - inOut
                        - none
                    format: enumeration
                    type: string
                length:
                    description: Suggested length for use when generating code.
                    type: integer
                name:
                    description: Name of the term that can be referenced. Term names must be unique within a segmentation tree.
                    maxLength: 100
                    type: string
                valueListId:
                    description: Value list id for different values and ranges that are used for comparing with the variable.
                    maxLength: 36
                    type: string
            required:
                - name
                - dataType
                - direction
            title: Segmentation Tree Signature Term
            type: object
        summary:
            description: The summarized representation of a resource. Often used in collection responses when more specific details aren't needed.
            properties:
                createdBy:
                    description: The user who created the resource.
                    type: string
                creationTimeStamp:
                    description: The timestamp in YYYY-MM-DDThh:mm:ss.sssZ format when the resource was created.
                    format: date-time
                    type: string
                description:
                    description: The description of the resource.
                    type: string
                iconUri:
                    description: (version 2) The URI of an icon assigned to this resource, overrides default icons for the type.
                    type: string
                id:
                    description: The unique identifier for the resource.
                    type: string
                links:
                    description: The links that apply to the resource.
                    items:
                        $ref: "#/components/schemas/link"
                    type: array
                modifiedBy:
                    description: The user who most recently modified the resource.
                    type: string
                modifiedTimeStamp:
                    description: The timestamp in YYYY-MM-DDThh:mm:ss.sssZ format when the resource was last modified.
                    format: date-time
                    type: string
                name:
                    description: The name of the resource.
                    type: string
                type:
                    description: The type of the resource.
                    type: string
                typeDefName:
                    description: (version 2) The name of the type definition that describes the contents of this resource.
                    type: string
                version:
                    description: The version number of the resource. This representation is version 2.
                    type: integer
            required:
                - id
                - links
                - version
            title: Resource Summary
            type: object
            x-sas-media-type:
                name: application/vnd.sas.summary
                version: 2
        valueNode:
            description: Node with a value.
            properties:
                id:
                    description: The ID for the segmentation tree node.
                    readOnly: true
                    type: string
                label:
                    description: The label for the segmentation tree node.
                    maxLength: 100
                    type: string
                next:
                    anyOf:
                        - $ref: "#/components/schemas/variableNode"
                        - $ref: "#/components/schemas/booleanExpressionNode"
                        - $ref: "#/components/schemas/matrixNode"
                    description: Next node expression in the tree.
                    type: object
                outcomeName:
                    description: Name of the outcome. Should exist in segmnetation tree outcomes.
                    maxLength: 100
                    type: string
                value:
                    anyOf:
                        - type: integer
                        - type: number
                        - type: boolean
                        - type: string
                    description: Value to which variable is compared with.
            required:
                - value
            title: Segmentation Tree Value Node
            type: object
        variableAssignmentOutcomeAction:
            description: Outcome action in which a variable is assigned a value
            properties:
                type:
                    description: Type of outcome action being referenced within the segmentation tree outcome.
                    enum:
                        - variableAssignment
                    format: enumeration
                    type: string
                value:
                    anyOf:
                        - type: integer
                        - type: number
                        - type: boolean
                        - type: string
                    description: |
                        Value that needs to be assigned to the specified variable. It has to be of type string if the valueType is variable.
                valueType:
                    description: Type of the value.
                    enum:
                        - static
                        - variable
                    format: enumeration
                    type: string
                variableName:
                    description: Name of the variable for which a value need to be assigned. Should exist in the segmentation tree signature.
                    maxLength: 100
                    type: string
            required:
                - type
                - variableName
            title: Segmentation Tree Variable Assignment Outcome Action
            type: object
        variableNode:
            description: Node with a variable.
            properties:
                id:
                    description: The ID for the segmentation tree node.
                    readOnly: true
                    type: string
                label:
                    description: The label for the segmentation tree node.
                    maxLength: 100
                    type: string
                type:
                    description: Type of node being referenced within the segmentation tree.
                    enum:
                        - variable
                    format: enumeration
                    type: string
                valueListId:
                    description: Id of a value list. Value nodes should be based in the values inside this value list. If not provided variable's value list will be used.
                    maxLength: 36
                    type: string
                valueNodes:
                    description: List of value nodes. Should be unique.
                    items:
                        $ref: "#/components/schemas/valueNode"
                    type: array
                variableName:
                    description: Name of the variable. Should exist in the segmentation tree signature.
                    maxLength: 100
                    type: string
            required:
                - type
                - variableName
            title: Segmentation Tree Variable Node
            type: object
