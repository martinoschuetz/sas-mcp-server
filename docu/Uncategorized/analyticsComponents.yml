      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/templateGroup"
            description: An array of Template Group representations.
    transfer:
      # Override the transfer object so we can set content property type to be string instead of object
      # $ref: 'http://swagger.na.sas.com/reference/schema/application/vnd.sas.transfer.object/v1/transferObject.yaml'
      title: Transfer Object
      description: Content providers implementing the Transfer Object Provider contract
        use this media type to store information about the content to be transferred.
      x-sas-media-type:
        name: application/vnd.sas.transfer.object
        version: 1
      properties:
        id:
          type: string
          format: object-id
          description: unique identifier of the object
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        summary:
          $ref: "#/components/schemas/summary"
        content:
          type: string
          description: optional. Choose this or fileServiceContent. This is the content
            object that must be serialized in a format that is valid for internet
            transmission. This includes valid encoding formats like Base64 or data
            structures like JSON. This is provided by the content provider and the
            transfer service expects no visibility into or understanding of this value.
        fileServiceContent:
          type: string
          description: optional. Choose this or content. This holds the URI of a file
            service object that contains the transferable object.
        connectors:
          type: array
          description: a list of associations or references to other external objects
            to be recreated on import
          items:
            $ref: "#/components/schemas/transferObjectConnector"
        substitutions:
          type: object
          description: map with keys of parameter and value. Used to replace the value
