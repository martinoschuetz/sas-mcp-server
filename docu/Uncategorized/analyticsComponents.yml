    jobDefn:
      $ref: "#/components/schemas/jobDefinition"
    jsonPatch:
      description: A JSON representation of a patch
      type: array
      items:
        description: one JSON Patch operation
        allOf:
        - description: Members common to all operations
          type: object
          required:
          - op
          - path
          properties:
            path:
              "$ref": "#/components/schemas/jsonPointer"
        - "$ref": "#/components/schemas/oneOperation"
    jsonPointer:
      description: defines a reference location in the target.
      type: string
      pattern: "^(/[^/~]*(~[01][^/~]*)*)*$"
    add:
      description: add operation. Value can be any JSON value.
      properties:
        op:
          type: string
          enum:
          - add
      required:
      - value
    remove:
      description: remove operation. Only a path is specified.
      properties:
        op:
          type: string
          enum:
          - remove
    replace:
      description: replace operation. Value can be any JSON value.
      properties:
        op:
          type: string
          enum:
          - replace
      required:
      - value
    move:
      description: move operation. "from" is a JSON Pointer.
      properties:
        op:
          type: string
          enum:
          - move
        from:
          "$ref": "#/components/schemas/jsonPointer"
      required:
      - from
    copy:
      description: copy operation. "from" is a JSON Pointer.
      properties:
        op:
          type: string
          enum:
          - copy
        from:
          "$ref": "#/components/schemas/jsonPointer"
      required:
      - from
    test:
      description: test operation. Value can be any JSON value.
      properties:
        op:
          type: string
          enum:
          - test
      required:
      - value
    oneOperation:
      description: one operation. Options are "add", "remove", "replace", "move",
        "copy" and "test"
      oneOf:
      - "$ref": "#/components/schemas/add"
      - "$ref": "#/components/schemas/remove"
      - "$ref": "#/components/schemas/replace"
      - "$ref": "#/components/schemas/move"
      - "$ref": "#/components/schemas/copy"
      - "$ref": "#/components/schemas/test"
    queryParameters:
      title: Analytics Query Parameters
      description: "This Analytics Query Parameters Resource has fields to set 'start',\
        \ 'limit', 'filter' and 'sortBy' query parameters. It is used as the Query\
        \ Parameters Request Body for POST requests."
      type: object
      properties:
        start:
          description: starting point of the result set. default value = 0
          type: integer
        limit:
          description: maximum number of items in the result set. default value =
            30
          type: integer
        filter:
          description: "filter query string. eg. and(eq(state, 'running'), in(id,\
            \ 'id1', 'id2'))"
          type: string
        sortBy:
          description: "sort by string. eg. 'id:ascending'"
          type: string
    sasSummary:
      $ref: "#/components/schemas/summary"
    templateGroup:
