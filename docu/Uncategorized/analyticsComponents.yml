---
openapi: 3.0.3
info:
  version: "8"
  title: Advanced Analytics Components
  description: The Advanced Analytics Components API is used to manage components
    and templates.
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: "https://support.sas.com/techsup/license/index.html"
tags:
- name: Root Controller
  description: The root controller includes all operations that operate at the root
    of the analyticsComponent path.
- name: Analytics Components Controller
  description: The Analytics Components Controller includes all operations that act
    on a component or collection of components.
- name: Component Template Controller
  description: The Component Template Controller includes all operations that act
    on a component template or collection of component templates.
servers:
- url: "http://example.com/analyticsComponents"
  description: example.com mock server
paths:
  /:
    get:
      tags:
      - Root Controller
      summary: Get the API object
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      parameters:
      - name: Accept
        in: header
        description: Requested response media type.
        required: true
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.api+json
          - application/json
          default: application/vnd.sas.api+json
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/vnd.sas.api+json
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/sasApi"
              examples:
                default:
                  $ref: "#/components/examples/RootGet200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/sasApi"
              examples:
                default:
                  $ref: "#/components/examples/RootGet200Response"
  /components:
    get:
      tags:
      - Analytics Components Controller
      summary: Retrieve Analytics Components
      description: The response will contain a list of ResourceSummary representations
        unless an Accept-Item header is specified that includes AnalyticsComponent
        objects.
      operationId: getComponents
      parameters:
      - name: start
        in: query
        description: Offset of first component template to retrieve (0-based). Defaults
          to 0
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of component templates to retrieve. Defaults to
          20
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortBy
        in: query
        description: Sort criteria for retrieved component templates
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: Filter criteria for retrieved component templates
        required: false
        schema:
          type: string
      - name: unlocalized
        in: query
        description: Disables localization in the response when this query parameter
          is present.
        required: false
        allowEmptyValue: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Requested response media type.
        required: true
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.collection+json
          - application/json
          default: application/vnd.sas.collection+json
      - name: Accept-Item
        in: header
        description: Requested response item media type.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.component.summary+json
          - application/vnd.sas.analytics.component+json
          - application/vnd.sas.summary+json
          - application/json
          default: application/vnd.sas.analytics.component+json
      responses:
        "200":
          $ref: "#/components/responses/componentCollection"
    post:
      tags:
      - Analytics Components Controller
      summary: Create Analytics Components (POST)
      description: Create an analytics component resource.
      operationId: createComponent
      parameters:
      - name: Content-Type
        in: header
        description: Media type for the collection of resources.
        required: true
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.component+json
          - application/vnd.sas.analytics.component.template+json
          - application/json
          default: application/vnd.sas.analytics.component+json
      - name: Accept
        in: header
        description: Accept
        required: true
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.collection+json
          - application/json
          default: application/vnd.sas.collection+json
      - name: Accept-Item
        in: header
        description: Requested response item media type.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.component.summary+json
          - application/vnd.sas.analytics.component+json
          - application/vnd.sas.summary+json
          - application/json
          default: application/vnd.sas.analytics.component+json
      requestBody:
        $ref: "#/components/requestBodies/createComponent"
      responses:
        "201":
          $ref: "#/components/responses/componentCreated"
        "400":
          $ref: "#/components/responses/componentCreateFailed"
  /components#batchCreateOrUpdate:
    post:
      tags:
      - Analytics Components Controller
      summary: Create or Update Analytics Components (POST)
      description: Create or update multiple analytics component resources.
      operationId: createMultipleComponents
      parameters:
      - name: Content-Type
        in: header
        description: Media type for the collection of resources.
        required: true
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
      - name: Accept
        in: header
        description: Accept
        required: true
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.collection+json
          - application/json
          default: application/vnd.sas.collection+json
      - name: Accept-Item
        in: header
        description: Requested media type for items in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.component.summary+json
          - application/vnd.sas.analytics.component+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.analytics.component.summary+json
      - name: onConflict
        in: query
        description: How to handle conflicts when a component already exists. If set
          to `update`, existing items will be updated. If set to `ignore`, existing
          items in the collection will not be updated and an error code of `409 Conflict`
          will be inserted into the response body collection.
        required: false
        schema:
          type: string
          enum:
          - update
          - ignore
          default: ignore
      requestBody:
        $ref: "#/components/requestBodies/batchComponentCreateOrUpdate"
      responses:
        "200":
          $ref: "#/components/responses/batchCreateOrUpdate"
        "201":
          $ref: "#/components/responses/batchCreateOrUpdate"
        "400":
          $ref: "#/components/responses/batchCreateOrUpdateFailed"
  /components#postToGet:
    post:
      tags:
      - Analytics Components Controller
      summary: Retrieve Analytics Components (POST)
      description: "This operation does not create resources, it is a way of creating\
        \ large queries needed by certain consumers."
      operationId: postComponentsToFind
      parameters:
      - name: Accept
        in: header
        description: Accept
        required: true
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.collection+json
          - application/json
          default: application/vnd.sas.collection+json
      - name: Accept-Item
        in: header
        description: Accept-Item
        required: true
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.analytics.component.summary+json
          - application/vnd.sas.analytics.component+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.analytics.component.summary+json
      requestBody:
        $ref: "#/components/requestBodies/queryParameters"
      responses:
        "200":
          $ref: "#/components/responses/componentsQuery"
        "400":
          $ref: "#/components/responses/componentsQueryFailed"
  "/components/{componentId}":
    get:
      tags:
      - Analytics Components Controller
      summary: Retrieve an Analytics Component
      description: Find an Analytics Component resource that corresponds to the specified
        component id. If the component's job definition is requested in the Accept
        header, the response will contain the job definition for the component.
      operationId: getComponent
      parameters:
      - name: componentId
        in: path
        description: id
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Accept
        required: true
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.analytics.component.summary+json
          - application/vnd.sas.analytics.component+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.job.definition+json
          - application/vnd.sas.transfer.object+json
          - application/json
          default: application/vnd.sas.analytics.component+json
      - name: validate
        in: query
        description: "Indicates whether to validate the retrieved component. If a\
          \ summary is requested, validation is never done and this parameter is ignored"
        required: false
        schema:
          type: boolean
          default: true
      - name: unlocalized
        in: query
        description: Disables localization in the response when this query parameter
          is present.
        required: false
        allowEmptyValue: true
        schema:
          type: string
      responses:
        "200":
          $ref: "#/components/responses/componentRetrieved"
        "403":
          description: Either no component exists at the requested path or the user
            is not authorized to access it.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentGet403Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentGet403Response"
        "404":
          description: No component exists at the requested path (when requested by
            an administrator).
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentGet404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentGet404Response"
    head:
      tags:
      - Analytics Components Controller
      summary: Check for existence of Analytics Component for the id
      description: Make sure that Analytics Component resource that corresponds to
        the specified component id exists.
      operationId: headersForComponent
      parameters:
      - name: componentId
        in: path
        description: id
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Accept
        required: true
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.analytics.component.summary+json
          - application/vnd.sas.analytics.component+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.job.definition+json
          - application/vnd.sas.transfer.object+json
          - application/json
          default: application/vnd.sas.analytics.component+json
      - name: validate
        in: query
        description: "Indicates whether to validate the retrieved component. If a\
          \ summary is requested, validation is never done and this parameter is ignored"
        required: false
        schema:
          type: boolean
          default: true
      - name: unlocalized
        in: query
        description: Disables localization in the response when this query parameter
          is present.
        required: false
        allowEmptyValue: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Identifies a specific component version.
              schema:
                type: string
            Last-Modified:
              description: Indicates the date and time the component was last modified.
              schema:
                type: string
        "403":
          description: Either no component exists at the requested path or the user
            is not authorized to access it.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentHead403Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentHead403Response"
        "404":
          description: No component exists at the requested path (when requested by
            an administrator).
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentHead404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentHead404Response"
    put:
      tags:
      - Analytics Components Controller
      summary: Update an Analytics Component
      description: "Update an existing Analytics Component with the content passed\
        \ in the body of the request. A successful response body will contain the\
        \ fully-populated resource with the revision incremented. The state field\
        \ will be set to `modified` if the component properties, execution provider,\
        \ or code template are modified, unless a service user includes a preserveState\
        \ query parameter with a value of true which will preserve the original state\
        \ of the component. Otherwise the state field will remain unchanged from the\
        \ currently persisted state of the component regardless of what was provided\
        \ in the component representation sent to this endpoint. The /state endpoint\
        \ is the only valid way to set the state of a component directly. If the service\
        \ determines that the component's state should be set to `modified`, all nested\
        \ segments and components (inward) and container segments and components (outward)\
        \ will have the `modified` state automatically propagated to them. (The service\
        \ checks for a segmentation plan associated with the component and updates\
        \ the segmentation plan's segments. The service also propagates the state\
        \ outward to container segments and components if the component's pipeline\
        \ is associated with a segment.)"
      operationId: updateComponent
      parameters:
      - in: header
        name: If-Match
        description: Update the scope resource only if the resources current ETag
          header matches this value
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: id
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Media type for the component body.
        required: true
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.component+json
          - application/json
          default: application/vnd.sas.analytics.component+json
      - name: Accept
        in: header
        description: Accept
        required: true
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.analytics.component+json
          - application/json
          default: application/vnd.sas.analytics.component+json
      - name: preserveState
        in: query
        description: Set preserveState to `true` to update the component without setting
          the state to modified. This parameter is only honored for service users.
        required: false
        schema:
          type: string
          format: boolean
      requestBody:
        $ref: "#/components/requestBodies/updateComponent"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Identifies a specific component version.
              schema:
                type: string
            Last-Modified:
              description: Indicates the date and time the component was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.component+json:
              schema:
                $ref: "#/components/schemas/component"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPut200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/component"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPut200Response"
        "400":
          description: Bad Input
          content:
            application/vnd.sas.analytics.component+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPut400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPut400Response"
        "412":
          description: Precondition Failed
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPut412Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPut412Response"
        "428":
          description: Precondition Required
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPut428Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPut428Response"
    delete:
      tags:
      - Analytics Components Controller
      summary: Delete an Analytics Component
      description: Delete an existing Analytics Component resource that corresponds
        to the specified component id.
      operationId: deleteComponent
      parameters:
      - name: componentId
        in: path
        description: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Success
        "403":
          description: Either no component exists at the requested path or the user
            is not authorized to access it.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentDelete403Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentDelete403Response"
        "404":
          description: No component exists at the requested path (when requested by
            an administrator).
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentDelete404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentDelete404Response"
    patch:
      tags:
      - Analytics Components Controller
      summary: Update parts of an Analytics Component
      description: "Update parts of an existing Analytics Component with the content\
        \ passed in the body of the request. A successful response body will contain\
        \ the fully-populated resource with the revision incremented. The state field\
        \ will be set to MODIFIED if the component properties, execution provider,\
        \ or code template are modified,otherwise the state field will remain unchanged\
        \ from the currently persisted state of the component regardless of what was\
        \ provided in the component representation sent to this endpoint. The /state\
        \ endpoint is the only valid way to set the state of a component directly."
      operationId: patchComponent
      parameters:
      - in: header
        name: If-Match
        description: Update the scope resource only if the resources current ETag
          header matches this value
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: id
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Media type for the component body.
        required: true
        schema:
          type: string
          enum:
          - application/json-patch+json
          default: application/json-patch+json
      - name: Accept
        in: header
        description: Accept
        required: true
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.analytics.component+json
          - application/json
          default: application/vnd.sas.analytics.component+json
      requestBody:
        $ref: "#/components/requestBodies/jsonPatch"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Identifies a specific component version.
              schema:
                type: string
            Last-Modified:
              description: Indicates the date and time the component was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.component+json:
              schema:
                $ref: "#/components/schemas/component"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPatch200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/component"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPatch200Response"
        "400":
          description: Bad Input
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPatch400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPatch400Response"
        "412":
          description: Precondition Failed
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPatch412Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPatch412Response"
        "428":
          description: Precondition Required
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPatch428Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                default:
                  $ref: "#/components/examples/ComponentPatch428Response"
  "/components/{componentId}#transfer":
    put:
      tags:
      - Analytics Components Controller
      summary: Create or update a component from a transfer object
      description: "Update a component to match the content of the provided transfer\
        \ object. If the component does not exist, it is created. This is not a conditional\
        \ PUT request. This endpoint is meant for use via the transfer microservice.\
        \ See [Transfer API](/apis/transfer/v2/swagger.yaml) for usage."
      operationId: updateComponentFromTransfer
      parameters:
      - name: componentId
        in: path
        description: The unique identifier for the component.
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Media type for the component body.
        required: true
        schema:
          type: string
          enum:
          - application/vnd.sas.transfer.object+json
          default: application/vnd.sas.transfer.object+json
      - name: Accept
        in: header
        description: Accept
        required: true
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.transfer.object+json
          default: application/vnd.sas.transfer.object+json
      requestBody:
        $ref: "#/components/requestBodies/componentTransferObject"
      responses:
        "200":
          description: An existing component was updated.
          headers:
            ETag:
              description: Identifies a specific component version.
              schema:
                type: string
            Last-Modified:
              description: Indicates the date and time the component was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/sasSummary"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTransferPut200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/sasSummary"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTransferPut200Response"
        "201":
          description: The component was created.
          headers:
            Location:
              description: The URL of the component.
              schema:
                type: string
                format: uri
            ETag:
              description: Identifies a specific component version.
              schema:
                type: string
            Last-Modified:
              description: Indicates the date and time the component was created.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/sasSummary"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTransferPut201Response"
            application/json:
              schema:
                $ref: "#/components/schemas/sasSummary"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTransferPut201Response"
        "400":
          description: The component could not be created because the request was
            invalid.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTransferPut400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/ComponentTransferPut400Response"
  "/components/{componentId}/state":
    put:
      tags:
      - Analytics Components Controller
      summary: Update the state of an Analytics Component
      description: Update the state of an existing Analytics Component with the state
        passed in 'value' request parameter. If setting the state to `modified`, all
        nested segments and components (inward) and container segments and components
        (outward) will have the `modified` state automatically propagated to them.
        (The service checks for a segmentation plan associated with the component
        and updates the segmentation plan's segments. The service also propagates
        the state outward to container segments and components if the component's
        pipeline is associated with a segment.) This endpoint is the only valid way
        to explicitly set the state of a component and is intended only for internal
        use.
      operationId: updateComponentState
      parameters:
      - name: componentId
        in: path
        description: The component id.
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: The new state of the component.
        required: true
        schema:
