---
openapi: 3.0.3
info:
  version: "1"
  title: SAS Fraud Decisioning For Applications
  description: The SAS Fraud Decisioing for Applications REST API provides a means
    to provide applications for processing. The API also supports the retrieval of
    the application status. <details> <summary><b>Overview</b></summary> This API
    provides operations to submit applications and retrieve their statuses. </details>
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: https://developer.sas.com
servers:
- url: http://example.com/applicationFraud
  description: This is an example base URL.
tags:
- name: Root
  description: Get a list of top-level links from the sas-application-fraud services.
- name: Application Fraud
  description: The operations for submitting an application and retrieving application
    status.
paths:
  /:
    get:
      tags:
      - Root
      summary: Retrieve the sas-application-fraud service's top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced by
        this API.
      responses:
        "200":
          description: A 200 response is returned by the sas-application-fraud service
            if the GET request to retrieve the top-level links for the sas-application-fraud
            service is successful.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/apiResource"
              examples:
                json:
                  $ref: "#/components/examples/root-response-200"
            application/json:
              schema:
                $ref: "#/components/schemas/apiResource"
              examples:
                json:
                  $ref: "#/components/examples/root-response-200"
  /application:
    post:
      tags:
      - Application Fraud
      summary: Post an Application for Fraud Detection
      operationId: createApplication
      description: When this POST request is submitted to the sas-application-fraud
        service, a new application is submitted for fraud detection.
      requestBody:
        description: The body of this POST request contains the details of the application
          to be submitted for fraud detection.
        content:
          application/vnd.sas.detection.message.Application Input+json:
            schema:
              $ref: "#/components/schemas/applicationInputRequest"
            examples:
              default:
                $ref: "#/components/examples/post-application-request"
          application/json:
            schema:
              $ref: "#/components/schemas/applicationInputRequest"
            examples:
              default:
                $ref: "#/components/examples/post-application-request"
      responses:
        "201":
          headers:
            Content-Type:
              schema:
                type: string
          description: A 201 response is returned by the sas-application-fraud service
            if the POST request to submit an application is successful.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/applicationInputResponse"
              examples:
                default:
                  $ref: "#/components/examples/application-input-201"
            application/json:
              schema:
                $ref: "#/components/schemas/applicationInputResponse"
              examples:
                default:
                  $ref: "#/components/examples/application-input-201"
        "400":
          description: A 400 response is returned by the sas-alerts-transaction service
            when the submitted POST request is identified as being invalid. For example,
            the request might contain invalid data or the structure of the request's
            body is invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/applicationInputResponse"
              examples:
                default:
                  $ref: "#/components/examples/application-input-400"
            application/json:
              schema:
                $ref: "#/components/schemas/applicationInputResponse"
              examples:
                default:
                  $ref: "#/components/examples/application-input-400"
  /application/{applicationId}:
    get:
      tags:
      - Application Fraud
      summary: Retrieve the status of an application that is submitted
      operationId: getApplicationStatus
      description: When this GET request is submitted to the sas-application-fraud
        service, the status of an application is returned.
      parameters:
      - name: applicationId
        in: path
        description: The applicationId GET request parameter is used to specify the
          ID of the application for which we are trying to retrieve the status.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: A 200 response is returned by the sas-application-fraud service
            if the GET request was successful and the status of the application was
            returned.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/applicationStatusResponse"
              examples:
                default:
                  $ref: "#/components/examples/application-status-200"
            application/json:
              schema:
                $ref: "#/components/schemas/applicationStatusResponse"
              examples:
                default:
                  $ref: "#/components/examples/application-status-200"
        "400":
          description: A 400 response is returned by the sas-application-fraud service
            if the GET request failed and the application with provided ID was not
            found.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/applicationStatusResponse"
              examples:
                default:
                  $ref: "#/components/examples/application-status-400"
            application/json:
              schema:
                $ref: "#/components/schemas/applicationStatusResponse"
              examples:
                default:
                  $ref: "#/components/examples/application-status-400"
