    applicationInputResponse:
      title: Application Input Response
      description: The list of fields returned in the response of Application Fraud
        POST API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      properties:
        message:
          type: object
          required:
          - solutionResponse
          properties:
            solutionResponse:
              type: object
              properties:
                responseType:
                  type: string
                  description: Solution response type
                  maxLength: 2
                  minLength: 0
                  enum:
                  - CA
                  - CP
                  - CV
                  - CW
                  - CT
                  - DP
                  - CH
                  - CK
                  - DE
                  - AT
                  - BP
                  - PT
                  - ST
                  - FP
                  - PP
                  - NM
                responseDtTm:
                  type: string
                  description: Response date and time
                compositeModelScore:
                  type: integer
                  description: Composite score of all models processed
                compositeModelScoreExplanation:
                  type: string
                  description: Composite score explanation of all models processed
                  maxLength: 100
                compositeRuleScore:
                  type: integer
                  description: Composite score of all rules processed
                compositeRuleScoreExplanation:
                  type: string
                  description: Composite score explanation of all rules processed
                  maxLength: 100
                outcome:
                  type: string
                  description: Outcome recommendation
                  maxLength: 100
                outcomeEntity:
                  type: string
                  description: Outcome entity identifier
                  maxLength: 100
                outcomeName:
                  type: string
                  description: Outcome name
                  maxLength: 100
                outcomeDescription:
                  type: string
                  description: Outcome description
                  maxLength: 100
            solutionError:
              type: object
              properties:
                statusCode:
                  type: string
                  description: Response status code
                  maxLength: 3
                statusDesc:
                  type: string
                  description: Response status description
                  maxLength: 100
    applicationStatusResponse:
      title: Application Status Response
      description: The list of fields received in the response after fetching the
        status of an application.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      properties:
        applicationStatus:
          type: string
        message:
          type: string
  examples:
    root-response-200:
      summary: Application Fraud API root response
      description: This is an example of a 200 response to a GET request that is generated
        when a list of the top-level links for the sas-application-fraud service is
        successfully returned.
      value: |
        {
          "version": 1,
          "links":
            [
              {
                "method": "POST",
                "rel": "Create Application",
                "href": "/applicationFraud/application",
                "uri": "/applicationFraud/application",
                "type": "application/vnd.sas.detection.message.Application Input+json",
                "responseType": "application/json",
              },
              {
                "method": "GET",
                "rel": "Get Application Status",
                "href": "/applicationFraud/application/{applicationId}",
                "uri": "/applicationFraud/application/{applicationId}",
                "type": "application/json",
                "itemType": "application/json",
              },
            ],
        }
