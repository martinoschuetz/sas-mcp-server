---
openapi: 3.0.3
info:
  version: "3"
  title: Notifications
  description: >
    The Notifications API is used to store, retrieve, and manipulate
    <b>system</b> and <b>application</b> notifications.
    <details>
    <summary><b>Overview</b></summary>
    The notifications API provides the following capabilities:
    <ul>
    <li>provides a common notification event model</li>
    <li>stores events as notifications</li>
    <li>allows recipients to subscribe to notifications on a variety of channels</li>
    <li>allows clients to retrieve and manipulate notifications</li>
    </ul>
    </p>In general, when applications and system services detect noteworthy conditions
    that may be of interest to others,
    they create notification events and publish them.  These `events` are watched
    by background
    processing within the notifications API.  Based on specific criteria, the background
    processor decide
    if they are recognized as "notifiable events".  If so, they become `notifications`,
    and the notifications API
    handles them appropriately by either sending them to specific users, or by saving
    notification
    records in the database so that client applications can find them and show them
    later to recipient users.
    </details>
    <br>
    <details>
    <summary><b>Event Types</b></summary>
    In general, when applications and system services detect noteworthy conditions
    that may be of interest to others,
    they create notification events and publish them.  These `events` are watched
    by background
    processing within the notifications API.  Based on specific criteria, the background
    processor decides
    if they are recognized as "notifiable events".  If so, they become `notifications`,
    and the notifications
    API handles them appropriately by either sending them to specific users, or by
    saving notification
    records in the database so that client applications can find them and show them
    later to recipient users.
    </p>
    How a notification event or simply notification is handled by the background processing
    is determined by
    the type of payload that is received.  There are two basic types of payloads:
    <ul>
    <li><b>directed</b><br>
    A **directed** type of notification payload is self-contained.  That is, all recipient
    information as
    well as their preferred way of receiving notification messages is all contained
    within the payload of the
    event.  Thus, recipients in this scenario cannot opt out of receiving these types
    of notifications since
    subscriptions are not involved.
    </li>
    <li><b>subscription</b><br>
    A **subscription** notification payload type does not include the recipient information
    in the payload.
    Instead, recipients must subscribe or opt in
    for these notifications.  If they do not subscribe by creating an active subscription
    with matching criteria,
    they will not receive these types of notifications.
    </li>
    </ul>
    </p>
    Details about the supported types of notification payloads and how notification
    events are published can
    be found in the "notifications-event" project documentation.
    </details>
    <br>
    <details>
    <summary><b>Notifications</b></summary>
    Clients do not create notification events directly using notifications REST API.  The
    REST API is
    for manipulating notifications that have been saved in the database; it lets you
    retrieve them, update them,
    or delete them after they have been stored as persistent records by the notifications
    API background
    processing.
    </p>
    When a notification event is processed by the background processor, its payload
    is deserialized into a
    notification object.  If the media-type of this payload is not recognized an error
    will be logged and no
    further processing will take place; otherwise, processing continues.  Ultimately,
    depending on the reception
    channels that are chosen either by the sender for directed type payloads or by
    the recipient in the case of
    subscription type payloads, notifications are delivered to recipients and/or saved
    to the database.  The
    following is a list of supported channels:
    <ul>
    <li>store (notification is saved to database)</li>
    <li>mail  (notification is delivered to recipients as a mail message)</li>
    <li>sms   (notification is delivered to recipients as a text message)</li>
    </ul>
    </details>
    <br>
    <details>
    <summary><b>Subscriptions</b></summary>
    Typically, notification event producers will publish events with a "fire and forget"
    model.  That is, they
    will publish events without any knowledge of who may be interested in them.  This
    type of scheme requires
    recipients to subscribe to these type of notifications.
    </p>
    A subscription can be created by a recipient or on behalf of a recipient to describe
    the type and category of
    notification that they are interested in as well as how they would like to be
    notified by choosing appropriate
    channels.  Thus, incoming notifications will be matched against configured subscriptions
    to determine which
    recipients will be notified.  The matching criteria consists of the type and category
    of the notification as
    well as optional conditional constraints.  These optional conditions follow the
    same filtering syntax as the
    SAS REST APIs and any field in the notification can be used in formulating a valid
    subscription filtering
    condition. Subscriptions can be enabled and disabled as needed.
    <p>
    </details>

    <br>
    <details>
    <summary><b>Lifecycle</b></summary>
    If a client is only sending **directed** notification events, no subscriptions
    are necessary.
    A directed notification guarantees that only the intended recipient(s) receive
    the event.  In this case
    all pertinent recipient information is included in the notification payload that
    is sent.
    However, if a client is sending notification events to **subscribed** recipients,
    then those recipients must first create subscriptions for the notification types
    that they wish to receive.
    </p>
    When a client sends a notification event to the notification exchange, the Notification
    service consumes
    it by first validating it and then propagating it to the appropriate channels
    for processing.
    The notification will ultimately be sent as mail, sms, and/or saved to a back-end
    repository depending on the
    channels a recipient has configured.  Saved notifications can be viewed and/or
    manipulated using the
    notifications REST API.  Examples of viewing and marking these notifications as
    read is shown above.
    </p>
    A *subscribed* recipient can also disable his/her subscriptions so that they do
    not receive
    these types of notifications until they are re-enabled.  This scenario is also
    described above.
    </p>
    </details>
    <br>
    <details>
    <summary><b>Security</b></summary>
    <ul>
    <li><p>Notifications</br>Any client that can publish an event
    to the SAS notification exchange will cause notifications to be delivered
    to recipients on various configured channels.
    </p>
    The intended recipient and/or any administrator are the only identities that are
    allowed to view a specific notification.
    </p>
    The intended recipient and/or any administrator are the only identities that are
    allowed to modify saved notifications.
    </li></p>
    <li><p>Subscriptions</br>
    Any authenticated user can create a subscription for himself/herself.  Administrators
    can create subscriptions for anyone.
    </p>
    The creator of the subscription and/or any administrator are the only identities
    that are allowed to modify a specific subscription.  This includes updating, patching
    and deleting subscriptions.
    </p>
    Initially, there will be no sharing of subscriptions between users.
    </li>
    </ul>
    </p>
    </details>
    <br>

    <details>
    <summary><b>Terminology</b></summary>
    <ul>
    <li><b>notification message</b> A message that is delivered to one or more recipients
    by the notifications API.  This message
    is derived from the incoming notification event payload.
    The notifications API presents these messages to recipients based on the channel(s)
    that they have elected to receive them.
    Note: The <b>store</b> channel saves the entire payload to back-end storage, not
    just the message.
    </li>
    <li><b>notification type</b> The notification payload type. Types are not currently
    validated.
    They are a string assigned at the application level and are used in defining a
    subscription for subscription-based channels.
    </li>
    <li><b>notification category</b> Refers to a specific classification of notifications.  Category
    is
    used in defining a subscription for subscription-based channels. Currently, valid
    categories are:
    <ul>
    <li><b>system</b><br>A system notification infers that some type of system monitoring
    software has detected a noteworthy condition that someone should be notified about.
    </li>
    <li><b>application</b><br>An application notification would represent something
    that occurred within a SAS solution such as a report being modified.
    </li>
    </ul>
    </li>
    <li><b>delivery type</b> The type of delivery. There are basically two ways senders
    can deliver notification events to the notifications service:
    <ul>
    <li><b>subscription</b><br>Subscription(s) must already be registered for an event.  The
    subscription will contain all the necessary information to propagate notifications
    to the appropriate channels.
    </li>
    <li><b>directed</b><br>All processing instructions, including the intended recipients
    as well as the their preferred reception channels, are included within the notification
    event payload itself.
    </li>
    </ul>
    </li>
    <li><b>channel</b> Refers to how notification messages are delivered to recipients
    and/or saved to storage.  Valid channels are:
    <ul>
    <li><b>store</b><br>The store channel refers to a storage-backed channel in which
    recipients can view and manipulate notifications via a REST API.
    </li>
    <li><b>mail</b><br>Notifications are delivered via electronic mail directly to
    the recipient(s).
    </li>
    <li><b>sms</b><br>Notifications are delivered via text messaging service directly
    to the recipient(s).
    </li>
    </ul>
    </li>
    <li><b>source</b> Refers to the specific origination of a notification event.  This
    can be an application or system service.
    </li>
    <li><b>recipient</b> Refers to an individual that receives a notification message
    and is expected to act on this information in some way.
    </li>

    </ul>
    </details>
    <br>
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
tags:
- name: Root
  description: The API root.
- name: Subscriptions
  description: Operations on subscription resources.
- name: Notifications
  description: Operations on notification resources.
paths:
  /:
    get:
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getNotificationsRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getNotificationsRootResponse"
    head:
      summary: Get the headers for the API
      description: Returns the headers for the API.  Also, used to determine whether
        the service is available.
      operationId: headersForRoot
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
  /notifications:
    get:
      summary: Get a collection of notifications
      description: Returns a collection of notifications based on the specified pagination,
        filtering, and sorting options.  The the media type of the returned items
        in the collection is `application/vnd.sas.notification.summary+json`. Filtering
        on message attribute is not supported.
      operationId: getNotifications
      tags:
      - Notifications
      parameters:
      - name: start
        description: The index of the first notification to return.  Defaults to 0.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of notifications to return.  Defaults to 20
          and maximum is 1000.
        in: query
        schema:
          type: integer
          format: int32
      - name: filter
        description: The criteria for filtering the notifications. See [Filtering
          in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        in: query
        schema:
          type: string
          format: string
      - name: sortBy
        description: The criteria for sorting the notifications.  See [Sorting in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        in: query
        schema:
          type: string
          format: sort-criteria
      - name: Accept-Item
        description: If provided, this is an alternative media-type to use for items
          within the returned collection.  If the media-type is not one that the service
          can provide, a 406 response will be returned.
        in: header
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/notificationCollection"
              examples:
                json:
                  $ref: "#/components/examples/getNotificationsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/notificationCollection"
              examples:
                json:
                  $ref: "#/components/examples/getNotificationsResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notifications400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notifications400Response"
    patch:
      summary: Patch a collection of notifications
      description: Patch a collection of notifications using JsonPatch methodology.
        All referenced resources must exist for the PATCH to be applied.
      operationId: patchNotifications
      tags:
      - Notifications
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: "#/components/schemas/jsonPatchCollection"
            examples:
              json:
                $ref: "#/components/examples/patchNotificationsBody"
          application/json:
            schema:
              $ref: "#/components/schemas/jsonPatchCollection"
            examples:
              json:
                $ref: "#/components/examples/patchNotificationsBody"
        description: A jsonPatch object describing the notifications to be patched.
        required: true
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/patchNotifications400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/patchNotifications400Response"
    post:
      summary: Create a notification
      description: Create a notification.
      operationId: createNotification
      tags:
      - Notifications
      requestBody:
        content:
          application/vnd.sas.notification+json:
            schema:
              $ref: "#/components/schemas/notification"
            examples:
              createNotificationBody:
                $ref: "#/components/examples/createNotificationBody"
          application/json:
            schema:
              $ref: "#/components/schemas/notification"
            examples:
              createNotificationBody:
                $ref: "#/components/examples/createNotificationBody"
        description: A notification representation.
        required: true
      responses:
        "202":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/createNotificationResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/createNotificationResponse"
        "400":
          description: The request was invalid.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/postNotification400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/postNotification400Response"
  "/notifications/{notificationId}":
    head:
      summary: Check if a notification exists
      description: Returns whether or not a notification with the specified id exists.
      operationId: headersForNotification
      tags:
      - Notifications
      parameters:
      - name: notificationId
        description: The notification id.
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the notification.
              schema:
                type: string
        "404":
          description: A notification does not exist at the specified path.
          headers:
            Content-Type:
              schema:
                type: string
    get:
      summary: Get a notification
      description: Get an existing notification.
      operationId: getNotification
      tags:
      - Notifications
      parameters:
      - name: notificationId
        description: The id of the notification to retrieve.
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the notification.
              schema:
                type: string
          content:
            application/vnd.sas.notification+json:
              schema:
                $ref: "#/components/schemas/notification"
              examples:
                json:
                  $ref: "#/components/examples/getNotificationResponse"
            application/vnd.sas.notification.summary+json:
              schema:
                $ref: "#/components/schemas/notificationSummary"
              examples:
                json:
                  $ref: "#/components/examples/getNotificationSummaryResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/notificationSummary"
              examples:
                json:
                  $ref: "#/components/examples/getNotificationSummaryResponse"
        "404":
          description: A notification does not exist at the specified path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notification404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notification404Response"
    delete:
      summary: Delete a notification
      description: Delete an existing notification.
      operationId: deleteNotification
      tags:
      - Notifications
      parameters:
      - name: notificationId
        description: The id of the notification to delete.
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The request succeeded.
        "404":
          description: A notification does not exist at the specified path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notification404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notification404Response"
  "/notifications/{notificationId}/readState":
    get:
      summary: Get the read state
      description: Get the read state.  A value of true signifies that the notification
        has been acknowledged by the recipient.
      operationId: getNotificationReadState
      tags:
      - Notifications
      parameters:
      - name: notificationId
        description: The id of the notification to retrieve the read state.
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the notification.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: boolean
              example: false
            application/json:
              schema:
                $ref: "#/components/schemas/readState"
              examples:
                getReadStateResponse:
                  $ref: "#/components/examples/getReadStateResponse"
        "404":
          description: A notification does not exist at the specified path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notification404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notification404Response"
    put:
      summary: Mark a notification as having been read
      description: Mark a notification as having been read or acknowledged by the
        recipient.
      operationId: updateNotificationReadState
      tags:
      - Notifications
      parameters:
      - name: notificationId
        description: The id of the notification to mark.
        in: path
        required: true
        schema:
          type: string
      - name: value
        description: The value of the read state.
        in: query
        schema:
          type: boolean
          default: true
      - name: If-Match
        description: The ETag that was returned from a GET or PUT for this notification.
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for this notification.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: boolean
              example: false
            application/json:
              schema:
                $ref: "#/components/schemas/readState"
              examples:
                putReadStateResponse:
                  $ref: "#/components/examples/putReadStateResponse"
        "400":
          description: The request was invalid.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putNotificationReadState400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putNotificationReadState400Response"
        "404":
          description: A notification does not exist at the specified path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notification404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notification404Response"
        "412":
          description: The provided ETag does not match the current version of this
            notification.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putNotificationReadState412Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putNotificationReadState412Response"
        "428":
          description: The request did not include a required If-Match header for
            updating this notification.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putNotificationReadState428Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putNotificationReadState428Response"
  /subscriptions:
    get:
      summary: Get a collection of notification subscriptions
      description: Returns a collection of notification subscriptions based on the
        specified pagination, filtering, and sorting options.  The the media type
        of the returned items in the collection is `application/vnd.sas.notification.subscription+json`.
      operationId: getSubscriptions
      tags:
      - Subscriptions
      parameters:
      - name: start
        description: The index of the first subscription to return.  Defaults to 0.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of subscriptions to return.  Defaults to 30.
        in: query
        schema:
          type: integer
          format: int32
      - name: filter
        description: The criteria for filtering the subscriptions. See [Filtering
          in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        in: query
        schema:
          type: string
          format: string
      - name: sortBy
        description: The criteria for sorting the subscriptions.  See [Sorting in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        in: query
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/subscriptionCollection"
              examples:
                json:
                  $ref: "#/components/examples/getSubscriptionsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/subscriptionCollection"
              examples:
                json:
                  $ref: "#/components/examples/getSubscriptionsResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getSubscriptions400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getSubscriptions400Response"
    post:
      summary: Create a notification subscription
      description: Create a new notification subscription.
      operationId: createSubscription
      tags:
      - Subscriptions
      requestBody:
        content:
          application/vnd.sas.notification.subscription+json:
            schema:
              $ref: "#/components/schemas/createSubscription"
            examples:
              sendSubscriptionBody:
                $ref: "#/components/examples/createSubscriptionBody"
          application/json:
            schema:
              $ref: "#/components/schemas/createSubscription"
            examples:
              sendSubscriptionBody:
                $ref: "#/components/examples/createSubscriptionBody"
        description: A subscription representation.
        required: true
      responses:
        "201":
          description: The request succeeded.
          headers:
            Location:
              description: The URI of the newly created subscription.
              schema:
                type: string
                format: uri
            Etag:
              description: The entity tag that identities the newly created subscription.
              schema:
                type: string
          content:
            application/vnd.sas.notification.subscription+json:
              schema:
                $ref: "#/components/schemas/subscription"
              examples:
                json:
                  $ref: "#/components/examples/createSubscriptionResponse"
            application/json:
