        this type of event could send notification events when disk space is critically
        low or when memory usage threshold is met.  Additionally, a subscriber may
        want to ignore this notification unless it has been sent at an 'alert' level.  A
        subscriber can condition on the incoming notification itself to accomplish
        this filtering.
