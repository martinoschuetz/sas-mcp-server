- url: http://example.com/notifications
  description: local mock server
components:
  requestBodies:
    updateSubscription:
      content:
        application/vnd.sas.notification.subscription+json:
          schema:
            $ref: "#/components/schemas/updateSubscription"
          examples:
            json:
              $ref: "#/components/examples/patchSubscriptionBody"
        application/json:
          schema:
            $ref: "#/components/schemas/updateSubscription"
          examples:
            json:
              $ref: "#/components/examples/patchSubscriptionBody"
      description: A subscription representation.
      required: true
  schemas:
    notification:
      title: Notification
      description: Notification representation.
      required:
      - level
      - subject
      - message
      properties:
        version:
          type: integer
          description: This media type's schema version number.  This representation
            is version 3.
        id:
          type: string
          description: System-assigned unique ID for this notification.
        type:
          type: string
          description: The type of notification. A type is application-specific and
            is not validated.
          readOnly: true
        category:
          type: string
          description: The category of notification such as 'system' or 'application'.
          readOnly: true
        source:
          type: string
          description: The origination of the published notification.
          readOnly: true
        level:
          type: string
          description: The level of notification such as 'info', 'warn', or 'alert'.
          readOnly: true
        recipientId:
          type: string
          description: The id of the recipient whom the notification was intended.
          readOnly: true
        read:
          type: boolean
          description: Specifies whether or not the notification has been acknowledged
            by the recipient.
        subject:
          type: string
          description: The subject associated with the notification.
          readOnly: true
        message:
          type: string
          description: A message associated with the notification.
          readOnly: true
        userId:
          type: string
          description: The id of the user that was associated with the publishing
            of the notification.
          readOnly: true
        subscriptionName:
          type: string
          description: The name of the subscription that triggered the notification
            if applicable.
          readOnly: true
        creationTimeStamp:
          type: string
          format: date-time
          description: The date and time the notification event was triggered.
          readOnly: true
        publishTimeStamp:
          type: string
          format: date-time
          description: The date and time the notification was published.
          readOnly: true
        properties:
          type: object
          description: Properties map associated with this notification.
          readOnly: true
        detailsVersion:
          type: integer
          description: Version of the included details that is associated with this
            notification.
          readOnly: true
        detailsType:
          type: string
          description: Type (media-type) of the included details that is associated
            with this notification.
        details:
          type: string
          description: Application specific details associated with this notification.
        appId:
          type: string
          description: Specifies the application name (as registered in the app registry)
            as string where the interaction took place.
        interactive:
          type: boolean
          description: Specifies whether this is interactive notication.
        objects:
          type: string
          description: Involves primary objects involved in interactivity.
        links:
          type: array
          description: Links that apply to this object.  Includes 'self', 'alternate',
            'delete', 'read', 'markRead', 'markUnread', 'subscription', 'up'.
          items:
            $ref: "#/components/schemas/link"
    notificationSummary:
      title: Notification Summary
      description: Notification summary representation.
      required:
      - type
      - category
      - level
      - subject
      - read
      - message
      properties:
        version:
          type: integer
          description: This media type's schema version number.  This representation
            is version 2.
        id:
          type: string
          description: System-assigned unique ID for this notification.
        type:
          type: string
          description: The type of notification.  A type is application-specific and
            is not validated.
          readOnly: true
        category:
          type: string
          description: The category of notification such as 'system' or 'application'.
          readOnly: true
        source:
          type: string
          description: The origination of the published notification.
          readOnly: true
        level:
          type: string
          description: The level of notification such as 'info', 'warn', or 'alert'.
          readOnly: true
        recipientId:
          type: string
          description: The id of the recipient whom the notification was intended.
          readOnly: true
        read:
          type: boolean
          description: Specifies whether or not the notification has been acknowledged
            by the recipient.
        subject:
          type: string
          description: The subject associated with the notification.
          readOnly: true
        message:
          type: string
          description: A message associated with the notification.
          readOnly: true
        userId:
          type: string
          description: The id of the user that was associated with the publishing
            of the notification.
          readOnly: true
        subscriptionName:
          type: string
          description: The name of the subscription that triggered the notification
            if applicable.
          readOnly: true
        creationTimeStamp:
          type: string
          format: date-time
          description: The date and time the notification event was triggered.
          readOnly: true
        publishTimeStamp:
          type: string
          format: date-time
          description: The date and time the notification was published.
          readOnly: true
        links:
          type: array
          description: Links that apply to this object.  Includes 'self', 'delete',
            'read', 'markRead', 'markUnread', 'subscription', 'up'.
          items:
            $ref: "#/components/schemas/link"
    readState:
      title: Notification read state
      description: The read state of a notification.
      properties:
        readState:
          type: boolean
          description: The read state of a notification. True if has been read. Otherwise
            false.
    activeState:
      title: Subscription active state
      description: The active state of a subscription.
      properties:
        activeState:
          type: boolean
          description: The read state of a subscription. To disable a subscription,
            set active state to false. To enable a subscription, set active state
            to true.
    notificationCollection:
      title: Notification Collection
      description: A collection of notifications.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The array of 'application/vnd.sas.notification.summary' representations.
            items:
              $ref: "#/components/schemas/notificationSummary"
    createSubscription:
      title: Create Notification Subscription
      description: Members available during create and update operations.
      required:
      - name
      - subscriberId
      - subscriberType
      - notificationType
      - notificationCategory
      - channels
      properties:
        version:
          type: integer
          description: This media type's schema version number.  This representation
            is version 2.
        name:
          type: string
          description: The name of the subscription.
        notificationType:
          type: string
          description: The type of notification that this subscription is subscribing
            to.
        notificationCategory:
          type: string
          description: The category of notification that this subscription is subscribing
            to.
        channels:
          type: array
          description: The applicable channels where the incoming notification is
            sent such as 'store', 'mail', and/or 'sms'.
          items:
            type: string
        subscriberId:
          type: string
          description: The subscriber identity that is associated with this subscription.
        subscriberType:
          type: string
          description: The type of subscriber identified by subscriberId. Valid types
            are 'user' and 'group'.
        active:
          type: boolean
          description: Specifies whether or not this subscription is active.
        conditions:
          type: string
          description: Optional conditions that must be met before the subscription
            will be applied. The string follows the same syntax as  [Filtering in
            REST APIs](https://developer.sas.com/apis/rest/Topics/#filters) and any
            field in the notification enity can be used in formulating a valid subscription
            filtering condition.
    updateSubscription:
      title: Update Notification Subscription
      description: Members available during update operation.
      allOf:
      - $ref: "#/components/schemas/createSubscription"
      - type: object
        properties:
          id:
            type: string
            description: System-assigned unique ID for this notification subscription
              object.
    subscription:
      title: Notification Subscription
      description: The represenation of a notification subscription.
      allOf:
      - $ref: "#/components/schemas/updateSubscription"
      - type: object
        properties:
          creationTimeStamp:
            type: string
            format: date-time
            description: Timestamp of notification subscription creation.
            readOnly: true
          modifiedTimeStamp:
            type: string
            format: date-time
            description: Timestamp of last notification subscription modification.
            readOnly: true
          createdBy:
            type: string
            description: The id of the user who created the notification subscription.
            readOnly: true
          modifiedBy:
            type: string
            description: The id of the last user who modified the notification subscription.
            readOnly: true
          links:
            type: array
            description: Links that apply to this object.  Includes 'self', 'update',
              'patch', 'delete', 'active', 'disable', 'enable', 'up'.
            items:
              $ref: "#/components/schemas/link"
    subscriptionCollection:
      title: Notification Subscription Collection
      description: A collection of notification subscriptions.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The array of 'application/vnd.sas.notification.subscription'
              representations.
            items:
              $ref: "#/components/schemas/subscription"
    jsonPatch:
      title: A JsonPatch object.
      description: A JsonPatch object containing the path of the item to patch.
      required:
      - op
      - path
      properties:
        op:
          type: string
          description: Operation name. Supported operations include 'remove'.
        path:
          type: string
          description: The id of resource to patch.
    jsonPatchCollection:
      title: JsonPatch collection
      description: A collection of resources to patch.
      type: array
      items:
        $ref: "#/components/schemas/jsonPatch"
    jsonPatchSubscription:
      title: A JsonPatch object for subscription.
      description: A JsonPatch object containing the path of the item to patch.
      required:
      - op
      - path
      properties:
        op:
          type: string
          description: Operation name. Supported operations include 'remove', 'replace'
            and 'add'.
        path:
          type: string
          description: The id of resource to patch.
    jsonPatchSubscriptionCollection:
      title: JsonPatch collection
      description: A collection of resources to patch.
      type: array
      items:
        $ref: "#/components/schemas/jsonPatchSubscription"
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
        # prettier-ignore
      - httpStatusCode
        # prettier-ignore
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
