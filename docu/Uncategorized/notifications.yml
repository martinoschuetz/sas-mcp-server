      summary: Response to PUT to update the active state of a subcription.
      description: Here is a sample response when using PUT to disable a subscription
        so that the subscriber will no longer receive notifications.
      value: {"activeState": false}
    enableSubscriptionResponse:
      summary: Response to PUT to update the active state of a subcription.
      description: Here is a sample response when using PUT to re-enable a subscription
        that had been disabled.
      value: {"activeState": true}
    patchSubscriptionBody:
      summary: Body to update a subscription
      description: Sample body used to update a subscription via PATCH. This example
        add additional notification channels.
      value: {"id": "d283b799-fc5e-4458-a675-99cbf4e06c44", "name": "system threshold",
        "notificationType": "threshold", "notificationCategory": "system", "subscriberId": "recipient-id",
        "subscriberType": "user", "channels": ["mail", "sms", "store"]}
    createNotificationBody:
      summary: Body to create a notification
      description: Sample body used to create a notification via POST.
      value: {"level": "alert", "message": "This is notification from your Systems\
          \ Administrator. Your system will be restarted at 5pm.", "subject": "System\
          \ Outage Notice"}
