---
components:
  schemas:
    chatHistory:
      description: Schema for specifying chat history.
      properties:
        content:
          description: The chat history content string. For example, this could be
            a response from the RAG system or a user request.
          title: Content
          type: string
        type:
          anyOf:
          - $ref: '#/components/schemas/requestType'
          - $ref: '#/components/schemas/responseType'
          description: The type to indecate whether the content was from the server
            or the client.
          title: Type
      required:
      - type
      - content
      title: chatHistory
      type: object
    codeRequestContext:
      description: The schema used to specify context for the code module.
      properties:
        command:
          default: explain_code
          description: Command type that defines how the system thinks. Accepted values
            are add_comments, explain_code, or generate_code.
          enum:
          - add_comments
          - explain_code
          - generate_code
          nullable: true
          title: Command
          type: string
        documentScoreThreshold:
          default: -1.0
          description: Specifies the document score threshold for the retrieved documents.
            Documents below this threshold will not be given to the LLM.
          nullable: true
          title: Documentscorethreshold
          type: number
        filters:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          default: pgmsascdc
          description: Documentation filter(s) for retrieved documentation. Accepts
            CDC ids (e.g. 'pgmsascdc') or product titles.
          title: Filters
        metaContext:
          description: 'Specifies metacontext for RAG server to include when searching
            for relevant docs. By specifying `metaContext` you are opting in to retrieval
            query engineering. Note, `metaContext` may not exceed 1000 tokens. '
          nullable: true
          title: Metacontext
          type: string
        metadata:
          description: String representation of SAS metadata in the current session.
          title: Metadata
          type: string
        n:
          default: 1
          description: Specifies the number of generations to return from the LLM.
          nullable: true
          title: N
          type: integer
        numDocs:
          default: 10
          description: Specifies the number of documents to retrieve and use in constructing
            the LLM prompt.
          nullable: true
          title: Numdocs
          type: integer
        temperature:
          default: 0.7
          description: Specifies the temperature
          nullable: true
          title: Temperature
          type: number
        type:
          default: code
          description: Specifies the type of RAG module to use.
          enum:
          - code
          title: Type
          type: string
      required:
      - metadata
      title: codeRequestContext
      type: object
    codeResponseMetadata:
      description: Schema for code-related metadata returned by the RAG server.
      properties:
        generations:
          default: []
          description: If the client specifies n > 1, this field holds the extra content
            strings beyond the first.
          items:
            type: string
          nullable: true
          title: Generations
          type: array
      title: codeResponseMetadata
      type: object
    copilotRequest:
      description: Schema for specifying a request to the RAG server.
      properties:
        chatHistory:
          default: []
          description: 'The history of messages. By specifying `chatHistory` you are
            opting in to retrieval query engineering. Important: the RAG server expects
            chat history to read from oldest to newest. '
          items:
            $ref: '#/components/schemas/chatHistory'
          title: Chathistory
          type: array
        message:
          discriminator:
            mapping:
              userRequest: '#/components/schemas/userRequest'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/userRequest'
          title: Message
      required:
      - message
      title: copilotRequest
      type: object
    copilotResponse:
      description: Schema for a response returned by the RAG server.
      properties:
        complete:
          default: true
          description: Whether or not the copilot is done responding
          title: Complete
          type: boolean
        content:
          description: The text from the RAG system.
          title: Content
          type: string
        metadata:
          anyOf:
          - $ref: '#/components/schemas/docResponseMetadata'
          - $ref: '#/components/schemas/codeResponseMetadata'
          description: Any metadata included in the response.
          nullable: true
          title: Metadata
        promptCard:
          description: The prompt card to display
          nullable: true
          title: Promptcard
          type: string
        type:
          default: copilotResponse
          enum:
          - copilotResponse
          title: Type
          type: string
      required:
      - content
      title: copilotResponse
      type: object
    docRequestContext:
      description: The schema used to specify context for the doc module.
      properties:
        documentScoreThreshold:
          default: -1.0
          description: Specifies the document score threshold for the retrieved documents.
            Documents below this threshold will not be given to the LLM.
          nullable: true
          title: Documentscorethreshold
          type: number
        filters:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          description: 'Documentation filter(s) for retrieved documentation specified
            as a string or list. It is highly encouraged that clients utilize CDC/product
            ids (ex. ''capcdc'') as opposed to product titles (ex. ''SAS Model Studio'').
            However, both CDC ids and titles are supported. '
          title: Filters
        includeDocs:
          default: false
          description: Specifies whether to include `retrieved_document_chunks` in
            the response metadata.
          nullable: true
          title: Includedocs
          type: boolean
        metaContext:
          description: 'Specifies metacontext for RAG server to include when searching
            for relevant docs. By specifying `metaContext` you are opting in to retrieval
            query engineering. Note, `metaContext` may not exceed 1000 tokens. '
          nullable: true
          title: Metacontext
          type: string
        numDocs:
          default: 10
          description: Specifies the number of documents to use when crafting the
            LLM response.
          nullable: true
          title: Numdocs
          type: integer
        type:
          enum:
          - doc
          title: Type
          type: string
      required:
      - type
      - filters
      title: docRequestContext
      type: object
    docResponseMetadata:
      description: Schema for returning RAG documentation metadata.
      properties:
        retrievedDocumentChunks:
          default: []
          description: If the client specifies to include docs, this field holds the
            retrieved document chunks.
          items:
            $ref: '#/components/schemas/documentChunk'
          nullable: true
          title: Retrieveddocumentchunks
          type: array
      title: docResponseMetadata
      type: object
    documentChunk:
      description: Schema for a retrieved documentation chunk returned in response
        metadata.
      properties:
        chunk:
          description: The chunk's content.
          title: Chunk
          type: string
        chunkId:
          description: The chunk id in the search index.
          format: uuid
          title: Chunkid
          type: string
        isUsed:
          description: Boolean value from the LLM tells whether or not this chunk
            was used in answering the query.
          title: Isused
          type: boolean
        productIds:
          description: The product ids that this chunk relates to, but only including
            those in the user request.
          items:
            type: string
          title: Productids
          type: array
        productTitles:
          description: The product titles that this chunk relates to, but only including
            those in the user request.
          items:
            type: string
          title: Producttitles
          type: array
        searchScore:
          description: The relevance score assigned to this chunk based on the user
            query.
          title: Searchscore
          type: number
        sourceUrl:
          description: The source URL to find the chunk content in the SAS documentation.
          title: Sourceurl
          type: string
        title:
          description: The title of the file that this chunk is derrived from.
          title: Title
          type: string
      required:
      - chunkId
      - productTitles
      - productIds
      - sourceUrl
      - title
      - chunk
      - searchScore
      - isUsed
      title: documentChunk
      type: object
    requestType:
      description: Schema for request type values sent to the RAG server.
      enum:
      - userRequest
      title: RequestType
      type: string
    responseType:
      description: Schema for response type values returned by the RAG server.
      enum:
      - copilotResponse
      title: ResponseType
      type: string
    userRequest:
      description: Schema for specifying a user request to the RAG server.
      properties:
        content:
          description: The request content that will be used to search the RAG system.
          title: Content
          type: string
        context:
          discriminator:
            mapping:
              code: '#/components/schemas/codeRequestContext'
              doc: '#/components/schemas/docRequestContext'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/docRequestContext'
          - $ref: '#/components/schemas/codeRequestContext'
          title: Context
        type:
          default: userRequest
          description: The request type.
          enum:
          - userRequest
          title: Type
          type: string
      required:
      - content
      - context
      title: userRequest
      type: object
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
info:
  contact:
    email: devex@sas.com
    name: SAS Developers
    url: https://developer.sas.com
  description: API for submitting retrieval-augmented generation completion requests
    and receiving responses from the SAS RAG server GEM.
  title: SAS RAG GEM
  version: '1'
openapi: 3.0.3
paths:
  /copilots/ragServer/v1:
    head:
      description: Determine if the service is available.
      operationId: headersForRoot
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: The request succeeded. The service is available.
      summary: Head Check
      tags:
      - Root
  /copilots/ragServer/v1/completion:
    post:
      description: Endpoint to query the RAG GEM to answer questions using SAS Viya
        documentation, code, and other supported context sources.
      operationId: createRagQuery
      parameters:
      - description: The application where the user prompt is being sent from.
        in: header
        name: sas-application-name
        required: false
        schema:
          description: The application where the user prompt is being sent from.
          nullable: true
          title: Sas Application Name
          type: string
      - description: ID of the chat session.
        in: header
        name: sas-chat-id
        required: false
        schema:
          description: ID of the chat session.
          nullable: true
          title: Sas Chat Id
          type: string
      - description: The unique ID of the message.
        in: header
        name: sas-message-id
        required: false
        schema:
          description: The unique ID of the message.
          nullable: true
          title: Sas Message Id
          type: string
      - description: The type of message that is being sent.
        in: header
        name: sas-message-type
        required: false
        schema:
          description: The type of message that is being sent.
          nullable: true
          title: Sas Message Type
          type: string
      - description: The platform key.
        in: header
        name: sas-platform-key
        required: false
        schema:
          description: The platform key.
          nullable: true
          title: Sas Platform Key
          type: string
      - description: Unique identifier for customer deployment.
        in: header
        name: sas-site-number
        required: false
        schema:
          description: Unique identifier for customer deployment.
          nullable: true
          title: Sas Site Number
          type: string
      - description: 'Version of the Viya application that the user prompt is being
          sent from. '
        in: header
        name: sas-application-version
        required: false
        schema:
          description: 'Version of the Viya application that the user prompt is being
            sent from. '
          nullable: true
          title: Sas Application Version
          type: string
      - description: The name of the copilot.
        in: header
        name: sas-copilot-name
        required: false
        schema:
          description: The name of the copilot.
          nullable: true
          title: Sas Copilot Name
          type: string
      - description: The secret order id.
        in: header
        name: sas-order-secret-id
        required: false
        schema:
          description: The secret order id.
          nullable: true
          title: Sas Order Secret Id
          type: string
      - description: SAS proxy version.
        in: header
        name: sas-proxy-version
        required: false
        schema:
          default: v2
          description: SAS proxy version.
          enum:
          - v2
          title: Sas Proxy Version
          type: string
      requestBody:
        content:
          application/json:
            examples:
              defaultRequest:
                summary: Example completion request.
                value:
                  chatHistory:
                  - content: What is SAS Viya?
                    type: userRequest
                  - content: SAS Viya is ...
                    type: copilotResponse
                  message:
                    content: What is the imputation node in SAS Model Studio?
                    context:
                      documentScoreThreshold: -1.0
                      filters:
                      - capcdc
                      includeDocs: false
                      numDocs: 10
                      type: doc
                    type: userRequest
            schema:
              $ref: '#/components/schemas/copilotRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                successfulResponse:
                  summary: Example response from the RAG system.
                  value:
                    complete: true
                    content: In SAS Model Studio, the imputation node ...
                    metadata:
                      retrievedDocumentChunks: []
                    type: copilotResponse
              schema:
                $ref: '#/components/schemas/copilotResponse'
          description: Successful RAG response.
          headers:
            Content-Type:
              schema:
                type: string
        '400':
          content:
            application/vnd.sas.error+json:
              examples:
                invalidRequestBody:
                  summary: Example invalid request body error.
                  value:
                    details:
                    - 'body -> message: Field required'
                    httpStatusCode: 400
                    message: Invalid request body.
                    version: 2
              schema:
                $ref: "#/components/schemas/error2"
          description: Invalid request body.
        '422':
          content:
            application/vnd.sas.error+json:
              examples:
                validationError:
                  summary: Example validation error.
                  value:
                    details:
                    - A validation error occurred while processing the request.
                    httpStatusCode: 422
                    message: Validation error.
                    version: 2
              schema:
                $ref: "#/components/schemas/error2"
          description: Validation error.
        '500':
          content:
            application/vnd.sas.error+json:
              examples:
                internalServerError:
                  summary: Example internal server error.
                  value:
                    details: []
                    httpStatusCode: 500
                    message: Internal Server Error
                    version: 2
              schema:
                $ref: "#/components/schemas/error2"
          description: Internal Server Error.
      summary: Rag Query
      tags:
      - Completion
servers:
- description: The URL to a target host.
  url: https://example.com
tags:
- description: Contains the operations for the root resource of the SAS Rag Server
    GEM.
  name: Root
- description: Endpoints related to RAG query completions.
  name: Completion
