                      progressStatus: PROCESSING
            application/vnd.sas.clinical.actionstatus.summary:
              schema:
                $ref: "#/components/schemas/actionStatus/properties/summary"
              examples:
                actionStatusCompleted:
                  summary: Get completed action status summary
                  description: Returns a representation of a completed action status
                    summary
                  value:
                    version: 1
                    id: 409d83bf-1acc-4e1c-adac-6bca6b7e8996
                    action: Enable Versioning
                    nodeId: sas-health-clinical-acceleration-d9fb7c645-s7jw2
                    message: 1 of 1 item processed successfully.
                    detailMessage: Processed 1 item.  1 successfully, 0 with warnings
                      and 0 with errors.
                    startTimeStamp: 2023-09-05T17:46:16.101000Z
                    endTimeStamp: 2023-09-05T17:46:17.383000Z
                    lastUpdatedTimeStamp: 2023-09-05T17:46:17.383000Z
                    percentComplete: 100
                    stoppable: true
                    progressStatus: COMPLETED
                    completionStatus: INFO
            application/json:
              schema:
                $ref: "#/paths/~1actionstatus~1%7BactionStatusId%7D/get/responses/200/content/application~1vnd.sas.clinical.action.status/schema"
              examples:
                actionStatusCompleted:
                  $ref: "#/paths/~1actionstatus~1%7BactionStatusId%7D/get/responses/200/content/application~1vnd.sas.clinical.action.status/examples/actionStatusCompleted"
                actionStatusProcessing:
                  $ref: "#/paths/~1actionstatus~1%7BactionStatusId%7D/get/responses/200/content/application~1vnd.sas.clinical.action.status/examples/actionStatusProcessing"
        "404":
          description: The request did not find the specified action status.
    head:
      tags:
      - Action Status
      operationId: headersForActionStatus
      summary: Determine whether the specified action status exists
      description: Checks whether the specified action status exists.
      parameters:
      - name: Accept
        in: header
        description: >
          The requested representation of the action status. Media type
          'application/vnd.sas.clinical.action.status+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.clinical.action.status+json
          - application/vnd.sas.clinical.action.status.summary+json
          - application/json
      - name: actionStatusId
        in: path
        description: The unique identifier for the action status entry.
        required: true
        schema:
          type: string
        example: d6eefec9-dcc2-4574-8af8-69897038d9c5
      responses:
        "200":
          description: The request succeeded - the action status exists.
        "404":
          description: The request did not find the specified action status.
    patch:
      tags:
      - Action Status
      summary: Update the action status by performing the specified action
      description: Updates the action status by performing the specified action.
      operationId: patchActionStatus
      parameters:
      - name: actionStatusId
        in: path
        description: The unique identifier for the action status entry.
        required: true
        schema:
          type: string
        example: 409d83bf-1acc-4e1c-adac-6bca6b7e8996
      - name: action
        in: query
        required: true
        description: The update action to perform on the action status.
        example: STOP
        schema:
          type: string
          enum:
          - STOP
      responses:
        "200":
          description: OK - the action status was updated by performing the specified
            action.
          content:
            application/vnd.sas.clinical.action.status:
              schema:
                $ref: "#/paths/~1actionstatus~1%7BactionStatusId%7D/get/responses/200/content/application~1vnd.sas.clinical.action.status/schema"
              examples:
                actionStatusCompleted:
                  $ref: "#/paths/~1actionstatus~1%7BactionStatusId%7D/get/responses/200/content/application~1vnd.sas.clinical.action.status/examples/actionStatusCompleted"
                actionStatusProcessing:
                  $ref: "#/paths/~1actionstatus~1%7BactionStatusId%7D/get/responses/200/content/application~1vnd.sas.clinical.action.status/examples/actionStatusProcessing"
            application/json:
              schema:
                $ref: "#/paths/~1actionstatus~1%7BactionStatusId%7D/get/responses/200/content/application~1vnd.sas.clinical.action.status/schema"
              examples:
                actionStatusCompleted:
                  $ref: "#/paths/~1actionstatus~1%7BactionStatusId%7D/get/responses/200/content/application~1vnd.sas.clinical.action.status/examples/actionStatusCompleted"
                actionStatusProcessing:
                  $ref: "#/paths/~1actionstatus~1%7BactionStatusId%7D/get/responses/200/content/application~1vnd.sas.clinical.action.status/examples/actionStatusProcessing"
        "400":
          description: Bad request - the specified action is not valid.
        "404":
          description: Not found - the action status could not be found.
    delete:
      tags:
      - Action Status
      summary: Delete an action status
      description: >
        Deletes an action status.  This action removes the action status item
        and details.
      operationId: deleteActionStatus
      parameters:
      - name: actionStatusId
        in: path
        description: The unique identifier for the action status entry.
        required: true
        schema:
          type: string
        example: d6eefec9-dcc2-4574-8af8-69897038d9c5
      responses:
        "204":
          description: The action status was deleted.
  /actionstatus/status:
    get:
      tags:
      - Action Status
      summary: Get the count of action status entries that are not read by the user
      description: >
        Returns a count of action status entries that have been updated since
        they were last read by the current user. When this is not zero, action
        status entries can be retrieved to show the updates since they were last
        read.
      operationId: getActionStatusPollingStatus
      responses:
        "200":
          description: The request succeeded and the count of unread action status
            entries is returned.
          content:
            application/json:
              schema:
                type: integer
              examples:
                getActionStatusReadResponse:
                  summary: Get action status read count.
                  description: Returns the count of unread action status entries.
                  value: 1
  /internal/actionstatus:
    post:
      tags:
      - Internal Action Status
      operationId: createActionStatus
      summary: Create an action status
      description: Creates an action status for tracking the status of clinical actions.
      requestBody:
        required: true
        description: The specification for creating an action status.
        content:
          application/vnd.sas.clinical.action.status.create:
            schema:
              title: Action Status Create
              description: Action status creation information.
              properties:
                version:
                  description: The version of the representation. This is version
                    1.
                  type: number
                id:
                  description: The unique identifier of the action status.
                  type: string
                clientId:
                  description: The client ID that is associated with the action. Represents
                    the application and session from which the action was initiated.
                  type: string
                action:
                  description: The name of the action.
                  type: string
                stoppable:
                  description: Specifies whether the action can be stopped when it
                    is being processed.
                  type: boolean
                nodeId:
                  description: The unique identifier of the service pod that initiated
                    the action.
                  type: string
            examples:
              actionStatusCreate:
                summary: Action status create representation
                value:
                  version: 1
                  id: 2dff288e-04dc-43c2-a369-fe91418ab6da
                  clientId: f27fac9b-c950-4dff-83bf-92c89a2fb166
                  action: Delete workspace item
                  stoppable: true
                  nodeId: sas-clinical-workspaces-9555b56d6-rwkmw
          application/json:
            schema:
              $ref: "#/paths/~1internal~1actionstatus/post/requestBody/content/application~1vnd.sas.clinical.action.status.create/schema"
            examples:
              actionStatusCreate:
                $ref: "#/paths/~1internal~1actionstatus/post/requestBody/content/application~1vnd.sas.clinical.action.status.create/examples/actionStatusCreate"
      responses:
        "201":
          description: The request succeeded and the action status was created.
          content:
            application/vnd.sas.clinical.actionstatus.summary:
              schema:
                $ref: "#/components/schemas/actionStatus/properties/summary"
              examples:
                actionStatusCreated:
                  summary: Created action status summary
                  description: The summary of a newly created action status.
                  value:
                    version: 1
                    id: 2dff288e-04dc-43c2-a369-fe91418ab6da
                    clientId: f27fac9b-c950-4dff-83bf-92c89a2fb166
                    action: Delete workspace item
                    nodeId: sas-clinical-workspaces-9555b56d6-rwkmw
                    percentComplete: 0
                    stoppable: true
                    progressStatus: QUEUED
            application/json:
              schema:
                $ref: "#/components/schemas/actionStatus/properties/summary"
              examples:
                actionStatusCreated:
                  $ref: "#/paths/~1internal~1actionstatus/post/responses/201/content/application~1vnd.sas.clinical.actionstatus.summary/examples/actionStatusCreated"
  "/internal/actionstatus/{actionStatusId}":
    patch:
      tags:
      - Internal Action Status
      operationId: internalUpdateActionStatus
      summary: Update an action status
      description: Updates an action status.
      parameters:
      - name: actionStatusId
        in: path
        description: The unique identifier of the action status.
        required: true
        schema:
          type: string
        example: d6eefec9-dcc2-4574-8af8-69897038d9c5
      - name: action
        in: query
        required: true
        description: The update action to perform on the action status.
        example: UPDATE
        schema:
          type: string
          enum:
          - UPDATE
          - RESET_QUEUED
      requestBody:
        required: true
        description: >
          The action status update specification. This value varies based on the
          type of update and the 'action' request parameter value.
        content:
          application/vnd.sas.clinical.action.status.detail.reset:
            schema:
              title: Action Status Detail Reset
              description: The specification for updating queued action status details.
              properties:
                version:
                  description: The version of the representation. This is version
                    1.
                  type: number
                message:
                  description: The message to set on all queued action details.
                  type: string
                progressStatus:
                  description: The progress status to set on all queued action status
                    details.
                  type: string
                  enum:
                  - QUEUED
                  - PROCESSING
                  - STOPPED
                  - STOPPING
                  - COMPLETED
                  - TERMINATED
            examples:
              detailReset:
                summary: Action status detail reset representation
                value:
                  version: 1
                  message: Action was stopped.
                  progressStatus: STOPPED
          application/json:
            schema:
              oneOf:
              - $ref: "#/paths/~1internal~1actionstatus~1%7BactionStatusId%7D/patch/requestBody/content/application~1vnd.sas.clinical.action.status.detail.reset/schema"
              - type: object
                additionalProperties:
                  type: string
                examples:
                  ActionStatusSummary:
                    value:
                      message: 1 of 1 item processed successfully.
                      detailMessage: Processed 1 item.  1 successfully, 0 with warnings
                        and 0 with errors.
                      startTimeStamp: 2023-09-05T17:46:16.101000Z
                      endTimeStamp: 2023-09-05T17:46:17.383000Z
                      lastUpdatedTimeStamp: 2023-09-05T17:46:17.383000Z
                      percentComplete: 100
                      progressStatus: COMPLETED
                      completionStatus: INFO
      responses:
        "200":
          description: The request succeeded and the action status was updated.
          content:
            application/vnd.sas.clinical.actionstatus.summary:
              schema:
                $ref: "#/components/schemas/actionStatus/properties/summary"
              examples:
                actionStatusCreated:
                  summary: Action status summary
                  value:
                    version: 1
                    id: 409d83bf-1acc-4e1c-adac-6bca6b7e8996
                    action: Enable Versioning
                    nodeId: sas-health-clinical-acceleration-d9fb7c645-s7jw2
