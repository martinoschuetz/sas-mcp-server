components:
  schemas:
    deployment:
      title: Deployment
      type: object
      description: Schema for a deployment.
      properties:
        deploymentId:
          type: string
          description: Deployment ID.
          example: "EastProd"
        deploymentName:
          type: string
          description: Deployment name.
          example: "East Regional Production"
        customerId:
          type: string
          description: Customer ID.
          example: Sample Corp.
        deploymentDescription:
          type: string
          description: Describes the deployment.
          example: "Production deployment for the Eastern region."
    bodyPostDeployment:
      title: Deployment creation body
      type: object
      description: Schema for a deployment.
      required: [deploymentName, customerId]
      properties:
        deploymentName:
          type: string
          description: Deployment name.
          example: "East Regional Production"
        customerId:
          type: string
          description: Customer ID.
          example: Sample Corp.
        deploymentDescription:
          type: string
          description: Describes the deployment.
          example: "Production deployment for the Eastern region."
    deploymentCollection:
      title: Deployments collection
      description: A collection of deployments.
      allOf:
      - $ref: "#/components/schemas/collection2"
      - type: object
        properties:
          items:
            type: array
            description: "The list of deployments."
            items:
              $ref: "#/components/schemas/deployment"
    bodyPatchDeployment:
      title: Deployment update body
      type: object
      description: Schema for a deployment.
      properties:
        customerId:
          type: string
          description: Customer ID.
          example: Sample Corp.
        deploymentDescription:
          type: string
          description: Describes the deployment.
          example: "Production deployment for the Eastern region."
    attribute:
      title: Attribute
      type: object
      description: An attribute.
      properties:
        attributeId:
          type: string
          description: Attribute ID (UUID, server-generated).
        attributeName:
          type: string
          description: Attribute Name
        attributeType:
          type: string
          description: Attribute Type
        attributeParameters:
          type: string
          description: Attribute Parameters - Reserved for future use
        attributeFormat:
          type: string
          description: Attribute Format - Reserved for future use
        attributeDescription:
          type: string
          description: Attribute Description
    bodyPostAttribute:
      title: Attribute creation body
      type: object
      description: An attribute.
      required: [attributeName, attributeType, attributeDescription]
      properties:
        attributeName:
          type: string
          description: Attribute Name
        attributeType:
          type: string
          description: Attribute Type
        attributeParameters:
          type: string
          description: Attribute Parameters - Reserved for future use
        attributeFormat:
          type: string
          description: Attribute Format - Reserved for future use
        attributeDescription:
          type: string
          description: Attribute Description
    bodyPatchAttribute:
      title: Attribute update body
      type: object
      description: A patch body for an attribute.
      properties:
        attributeName:
          type: string
          description: Attribute Name
        attributeType:
          type: string
          description: Attribute Type
        attributeParameters:
          type: string
          description: Attribute Parameters - Reserved for future use
        attributeFormat:
          type: string
          description: Attribute Format - Reserved for future use
        attributeDescription:
          type: string
          description: Attribute Description
    attributeValuePair:
      title: Attribute/value pair
      type: object
      description: Attribute/value pair
      properties:
        attributeId:
          type: string
          description: Attribute ID (UUID)
        attributeValue:
          type: string
          description: Attribute Value
    bodyPutAttributeValuePair:
      title: Attribute/value pair creation body
      type: object
      description: Attribute/value pair
      required: [attributeId, attributeValue]
      properties:
        attributeId:
          type: string
          description: Attribute ID (UUID)
        attributeValue:
          type: string
          description: Attribute Value
    bodyPatchAttributeValuePair:
      title: Attribute/value pair update body
      type: object
      description: Patch body for attribute/value pair
      properties:
        attributeValue:
          type: string
          description: Attribute Value
    attributeCollection:
      title: Attribute collection
      type: object
      description: A collection of attributes.
      allOf:
      - $ref: "#/components/schemas/collection2"
      - type: object
        properties:
          items:
            type: array
            description: "The list of attributes"
            items:
              $ref: "#/components/schemas/attribute"
    attributeValuePairCollection:
      title: Attribute/value pair collection
      type: object
      description: A collection of attributes.
      allOf:
      - $ref: "#/components/schemas/collection2"
      - type: object
        properties:
          items:
            type: array
            description: "The list of attributes."
            items:
              $ref: "#/components/schemas/attributeValuePair"
    project:
      title: Project definition
      type: object
      description: A project definition.
      properties:
        projectId:
          type: string
          description: Project ID (UUID, server-generated).
        projectName:
          type: string
          description: Project name.
        projectType:
          type: string
          description: The type of project definition - TAB (static) or FLT (dynamic).
        projectDescription:
          type: string
          description: Description of the project definition.
        filterId:
          type: string
          description: The ID of the filter to apply, if applicable.
    bodyPostProject:
      title: Project creation body
      type: object
      description: A body for project creation.
      required: [projectName, projectType]
      properties:
        projectName:
          type: string
          description: Project name.
        projectType:
          type: string
          description: The type of project definition - TAB (static) or FLT (dynamic).
        projectDescription:
          type: string
          description: Description of the project definition.
        filterId:
          type: string
          description: The ID of the filter to apply, if applicable.
