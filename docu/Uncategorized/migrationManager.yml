      title: Tag update body
      type: object
      description: A body for tag update.
      properties:
        tagName:
          type: string
          description: Updated tag name.
    bodyPostTagItems:
      title: Tag items association body
      type: object
      description: A body for associating items to a tag.
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, tagId]
            properties:
              itemId:
                type: string
              tagId:
                type: string
    bodyPostItemTags:
      title: Item tags association body
      type: object
      description: A body for associating tags to an item.
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, tagId]
            properties:
