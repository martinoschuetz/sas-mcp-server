      - $ref: "#/components/schemas/collection2"
      - type: object
        properties:
          items:
            type: array
            description: "The list of project definitions."
            items:
              $ref: "#/components/schemas/projectItem"
    projectScript:
      title: Project script
      type: object
      description: A map of generated project scripts, keyed by script name.
      additionalProperties:
        type: object
        description: A project script representation object.
        properties:
          projectTarget:
            type: string
            description: The target format for the project script.
          machine:
            type: string
            description: The name of the machine the script items belong to.
          items:
            type: array
            description: The items in the project script.
            items:
              type: string
              description: An item in the project script.
    projectScriptSummary:
      title: Project script
      type: object
      description: A project script representation object
      properties:
        projectId:
          type: string
          description: Project ID (UUID).
        projectName:
          type: string
          description: The target format for the project script.
        scriptCount:
          type: integer
          description: The number of items.
        projectItemCount:
          type: integer
          description: The number of items.
        scriptableItemCount:
          type: integer
          description: The number of items.
    filter:
      title: Filter
      type: object
      description: A filter definition.
      properties:
        filterId:
          type: string
          description: Filter ID (UUID, server-generated).
        filterName:
          type: string
          description: Filter name.
        filterValue:
          type: string
          description: Definition of the filter.
        filterCategory:
          type: string
          description: Filter category code.
        filterGroup:
          type: string
          description: Filter group name.
        filterDescription:
          type: string
          description: Description of the filter.
        caseSensitive:
          type: boolean
          description: Whether text filtering should be case-sensitive.
    bodyPostFilter:
      title: Filter creation body
      type: object
      description: A body for filter creation.
      required: [filterName, filterValue]
      properties:
        filterName:
          type: string
          description: Filter name.
        filterValue:
          type: string
          description: Definition of the filter.
        filterCategory:
          type: string
          description: Filter category code.
        filterGroup:
          type: string
          description: Filter group name.
        filterDescription:
          type: string
          description: Description of the filter.
        caseSensitive:
          type: boolean
          description: Whether text filtering should be case-sensitive.
    bodyPatchFilter:
