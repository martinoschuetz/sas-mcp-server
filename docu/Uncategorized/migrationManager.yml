    advancedFilterModel:
      title: Advanced filter model
      type: object
      description: >-
        A recursive advanced filter model. A "join" filter groups nested
        conditions with an "AND"/"OR" operator; a column filter references a
        single column via colId and applies an operator to an optional value.
      properties:
        filterType:
          type: string
          description: >-
            The kind of filter. Use "join" to combine conditions, or a column
            filter type such as "text", "number", "date", "dateTime", "boolean"
            or "object".
        type:
          type: string
          description: >-
            For join filters, the conjunction ("AND" or "OR"). For column
            filters, the operator (for example "equals", "contains",
            "startsWith", "greaterThan", "blank").
        colId:
          type: string
          description: The column identifier the filter applies to (column filters
            only).
        filter:
          type: string
          description: The value to compare against (column filters only).
        conditions:
          type: array
          description: The nested conditions of a join filter.
          items:
            $ref: "#/components/schemas/advancedFilterModel"
