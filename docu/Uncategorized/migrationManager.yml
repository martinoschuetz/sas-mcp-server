          type: string
          description: The unique identifier of the item.
        tagId:
          type: string
          description: The unique identifier of the tag.
    itemTagCollection:
      title: Item-tag association collection
      type: object
      description: A collection of item-tag associations.
      allOf:
      - $ref: "#/components/schemas/collection2"
      - type: object
        properties:
          items:
            type: array
            description: "The list of item-tag associations."
            items:
              type: object
              properties:
                itemId:
                  type: string
                tagId:
                  type: string
