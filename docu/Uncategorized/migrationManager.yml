      items:
        type: object
        required: [itemId, httpStatusCode]
        properties:
          itemId:
            type: string
          httpStatusCode:
            type: integer
          message:
            type: string
    itemTagAssociationCollection:
      title: Item tag association collection
      type: array
      description: Per-tag status records for item association operations.
      items:
        type: object
        required: [tagId, httpStatusCode]
        properties:
          tagId:
            type: string
          tagName:
            type: string
