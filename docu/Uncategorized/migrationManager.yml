      allOf:
      - $ref: "#/components/schemas/collection2"
      - type: object
        properties:
          items:
            type: array
            description: "The list of project definitions."
            items:
              $ref: "#/components/schemas/project"
    itemProjectCollection:
      title: Item project item collection
      type: object
      description: A collection of projects containing the item.
      allOf:
      - $ref: "#/components/schemas/collection2"
      - type: object
        properties:
          items:
            type: array
