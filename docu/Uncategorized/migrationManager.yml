      properties:
        projectId:
          type: string
          description: Project ID (UUID).
        itemId:
          type: string
          description: The id of the item.
    projectItemId:
      title: Project item id
      type: object
      description: A project item id.
      properties:
        itemId:
          type: string
          description: The id of the item.
    bodyPatchProject:
      title: Project update body
      type: object
      description: Updatable fields for a project definition.
      properties:
        projectName:
          type: string
          description: Project name.
        projectDescription:
          type: string
          description: Description of the project definition.
        filterId:
          type: string
          description: The ID of the filter to apply, if applicable.
    bodyPatchItem:
