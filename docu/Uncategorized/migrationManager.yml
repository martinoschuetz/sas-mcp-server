---
openapi: 3.0.3
info:
  title: SAS Migration Manager
  version: "3"
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: "https://developer.sas.com"
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  license:
    name: SAS
    url: "http://www.sas.com"
  description: |-
    The SAS Migration Manager API interacts with SAS Content Assessment to migrate applicable content from a SAS 9 system to SAS Viya 4.

    The SAS Migration Manager API accesses information about SAS objects and their statuses in the migration process.

    The SAS Migration Manager API provides the following functions:

    1. Uploads content from the SAS 9 system captured by SAS Content Assessment.
    2. Retreives content based on a filter.
    3. Generates project files for use with SAS Content Assessment to perform additional migration actions.
    4. Provides the ability to record migration status changes on items identified by SAS Content Assessment.
servers:
- url: "http://example.com/migrationManager"
  description: Kubernetes mock server.
paths:
  /:
    head:
      operationId: headersForRoot
      summary: Confirms service is running
      description: Confirms service is running.
      security:
      - OAuth2: [admin]
      tags:
      - Root
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/err400BadRequest"
        "401":
          $ref: "#/components/responses/err401NotAuthorized"
    get:
      operationId: root
      summary: Gets the version
      description: Returns the version of the SAS Migration Manager API.
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/exRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/exRootResponse"
        "400":
          $ref: "#/components/responses/err400BadRequest"
        "401":
          $ref: "#/components/responses/err401NotAuthorized"
      tags:
      - Root
