components:
  schemas:
    summary:
      title: summary object.
      description: The set of properties that all media types contain.
      discriminator:
        propertyName: type
      required:
      - name
      properties:
        id:
          type: string
          description: The identifier of the object which is unique and generated.
        name:
          type: string
          description: The object name.
        description:
          type: string
          description: A short description of the object as defined by the creator
            of the resource.
        version:
          type: integer
          description: The version of the schema.
        creationTimeStamp:
          type: string
          format: date-time
          description: Timestamp of when the object was created. This is generated
            by the service.
        createdBy:
          type: string
          description: Username that created the object. This is generated by the
            service.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Timestamp of when the object was last modified. This is generated
            by the service.
        modifiedBy:
          type: string
          description: Username that last modified the object. This is generated by
            the service.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: List of links related to the object. These are generated by
            the service.
    jobResourceCollection:
      description: A collection of job representations.
      example:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/job"
            description: The array of application/vnd.sas.schedule.job representations.
    job:
      description: A job that has been saved in a deployment and can be added to a
        flow definition.
      example:
      - $ref: "#/components/schemas/summary"
      - type: object
        properties:
          jobRequestUri:
            type: string
            description: URI to the application/vnd.sas.job.execution.job.request
              object for use in the Job action.
          commandLine:
            type: string
            description: Command Line for the Job Action. These are server based command
              suitable to send to a grid provider.
          priority:
            type: string
            description: Priority for the Job action. Defined values are - none, top,
              high, normal, medium, low.
          runAs:
            type: string
            description: Username to run the Job action under (default is who scheduled
              the flow the job is contained).
          schedulerProperties:
            type: string
            description: Scheduler specific resources needed by the Job action. This
              is a single string that is in a scheduler specific format which is passed
              as an opaque object. Example, "propName1=value;propName2=value".
    flowResourceCollection:
      title: file Resource Collection.
      description: A collection of file representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/flow"
            description: The array of application/vnd.sas.schedule.flow representations.
    flow:
      title: job flow
      description: A group of job actions and/or sub-flows with their dependencies
        and the triggers for when to execute the flow.
      allOf:
      - $ref: "#/components/schemas/summary"
      - type: object
        properties:
          schedulerId:
            type: string
            description: The identity for the scheduler associated to this Flow.
          triggerType:
            type: string
            format: enumeration
            enum:
            - event
            - runNow
            - manual
            description: triggerType for the Flow.
          triggers:
            type: array
            items:
              $ref: "#/components/schemas/triggerEvent"
            description: List of triggers associated to this Flow.
          triggerCondition:
            type: string
            description: Indicates whether 'any' trigger can start a flow execution
              or 'all' triggers must be true to start flow.
          jobs:
            type: array
            items:
              type: string
            description: list of URIs to jobs and sub-flows contained in the Flow.
          dependencies:
            type: array
            items:
              $ref: "#/components/schemas/jobDependency"
            description: List of job dependencies within the Flow for traditional
              style scheduler.
          definitionId:
            type: string
            description: Definition identifier for the Flow supplied by the scheduler
              once scheduled. Determined by the service.
          triggerId:
            type: string
            description: Trigger identifier for the Flow supplied by the scheduler
              once scheduled. Determined by the service. For some schedulers only
              the definitionId is provided.
          submitted:
            type: boolean
            description: The submitted status for the Flow. Determined by the service.
              True is the flow is scheduled and false if the Flow is not scheduled.
          scheduleId:
            type: integer
            description: The identifier to last instance of the Flow execution supplied
              by the scheduler. Determined by the service.
          scheduledBy:
            type: string
            description: The user that scheduled the Flow to the scheduler. Determined
              by the service.
          flowProperties:
            type: object
            description: map<string, string> with zero or more name, value pairs (map<name,
              value>), maximum name length = 100.
            additionalProperties:
              type: string
          defaultJobProperties:
            type: object
            description: map<string, string> with zero or more name, value pairs (map<name,
              value>), maximum name length = 100.
            additionalProperties:
              type: string
    triggerEvent:
      description: An event that signals when a new instance of a scheduled flow should
        execute.
      type: object
      properties:
        name:
          type: string
          description: The display name for the trigger event. Generated by the service.
        active:
          type: boolean
          description: If true then this trigger event actively participating as the
            trigger for the flow. Otherwise it is ignored.
        type:
          type: string
          format: enumeration
          enum:
          - timeevent
          - fileevent
          description: The type of trigger event, either 'timeEvent' or 'fileEvent'.
        event:
          type: object
          description: The event which is either timeEvent or fileEvent.
    jobDependency:
      description: The set of events that must be met for a job or sub-flow to execute
        within an instance of a flow.
      type: object
      properties:
        target:
          type: string
          description: The name of the job action or sub-flow to associate the dependency.
        event:
          $ref: "#/components/schemas/jobDependencyEvent"
    jobDependencyEvent:
      title: Job or sub-flow dependency event.
      discriminator:
        propertyName: type
      description: The dependency event for a job or sub-flow which can be one of
        a gate, jobEvent, timeEvent, or fileEvent.
    historyResourceCollection:
      title: history Resource Collection.
      description: A collection of history representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/history"
            description: The array of application/vnd.sas.schedule.flow.history representations.
    history:
      title: history of an instance.
      description: The information about an instance of execution.
      allOf:
      - $ref: "#/components/schemas/summary"
      - type: object
        properties:
          flowInstanceId:
            type: string
            description: An identifier of the flow instance.  This is the field used
              in Flow for scheduleId.
          startedTimeStamp:
            type: string
            description: The time when the flow instance started. The format is "yyyy-mm-ddThh:mm:ss[.SSS]Z".
          completedTimeStamp:
            type: string
            description: The time when the flow instance completed. The format is
              "yyyy-mm-ddThh:mm:ss[.SSS]Z".
          state:
            type: string
            description: The State  of the flow instance. The possible values - completed,
              failed, running, pending,canceled, suspended, unknown.
          exitCode:
            type: integer
            description: The exit code of the flow instance based on scheduler defined
              flow completion criteria. A zero means done or completed successfully.
          flowName:
            type: string
            description: The scheduler defined flow name provided by the scheduler
              for finding the flow definition.
          schedulerFlowName:
            type: string
            description: The scheduler defined flow name provided by the scheduler
              for finding the latest instance of the flowName.
    state:
      description: This state of an object
      properties:
        state:
          type: string
          description: The State  of the flow instance. The possible values - completed,
            failed, running, pending,canceled, suspended, unknown.
    instanceResourceCollection:
      title: instance Resource Collection.
      description: A collection of instance representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/instance"
            description: The array of application/vnd.sas.schedule.flow.instance representations.
    instance:
      title: instance of an item with a flow.
      description: The information about an item within an instance of execution.
      allOf:
      - $ref: "#/components/schemas/summary"
      - type: object
        properties:
          instanceId:
            type: string
            description: An identifier of the flow instance.  This is the field used
              in Flow for scheduleId.
          flowDefinitionId:
            type: string
            description: An identifier of the flow definition on the scheduler.
          startedTimeStamp:
            type: string
            description: The time when the flow instance started. The format is "yyyy-mm-ddThh:mm:ss[.SSS]Z".
          completedTimeStamp:
            type: string
            description: The time when the flow instance completed. The format is
              "yyyy-mm-ddThh:mm:ss[.SSS]Z".
          state:
            type: string
            description: The State  of the flow instance. The possible values - completed,
              failed, running, pending, canceled, suspended, unknown.
          exitCode:
            type: integer
            description: The exit code of the flow instance based on scheduler defined
              flow completion criteria. A zero means done or completed successfully.
          itemName:
            type: string
            description: The name of the associated item.
          parentInstanceId:
            type: string
            description: An identifier of the parent instance to this given instance.
          schedulerFlowName:
            type: string
            description: The scheduler defined flow name to this given instance.
          schedulerId:
            type: string
            description: The identifier to the scheduler.
    schedulerResourceCollection:
      title: scheduler Resource Collection.
      description: A collection of scheduler representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/scheduler"
            description: The array of application/vnd.sas.schedule.scheduler representations.
    schedulerType:
      title: The type of a scheduler.
      description: Provides the type of the scheduler and a displayable string for
        that type of scheduler.
      type: object
      properties:
        types:
          type: object
          description: The list of type objects of supported schedulers. The type
            object has 'name' and 'label' fields.
    scheduler:
      description: A server that runs jobs in a scheduled flow.
      allOf:
      - $ref: "#/components/schemas/summary"
      - type: object
        properties:
          type:
            type: string
            description: The type of scheduler. Valid values are - sasjfs, platformProcessManager.
          host:
            type: string
            description: The machine identifier where the scheduler is located.
          port:
            type: string
            description: The socket port number that the scheduler listens on.
          protocol:
            type: string
            description: The connection protocol for communicating to the scheduler.
              Valid values are - https, http. If null or empty http is assumed.
          domain:
            type: string
            description: The authentication domain associated to the scheduler.
          queues:
            type: string
            description: The list of queue names separated by a semi-colon associated
              to the scheduler.
          context:
            type: string
            description: The launcher context to use for job submission. Used when
              type is set to sasjfs.
          softwareVersion:
            type: string
            description: Version of the scheduler software, release number.
          capabilities:
            $ref: "#/components/schemas/capabilities"
          configuration:
            $ref: "#/components/schemas/configuration"
    capabilities:
      description: The set of capabilities that can vary from types of schedulers
        or versions of a scheduler.
      type: object
      properties:
        subordinateFlows:
          type: boolean
          description: Whether or not the scheduler supports a flow used like a job
            within a flow.
        dependencyType:
          type: string
          format: enumeration
          enum:
          - predecessor
          - successor
          description: An identifiable string representation the type of dependencies
            supported.  Valid values include <ul><li>predecessor - Use dependencies
            of jobEvent, timeEvent, or fileEvent being satisfied before job execution.</li><li>successor
            - Use dependency of jobSuccessor to determine what job to execute next.</li></ul>
        timeEvents:
          type: boolean
          description: Whether or not the scheduler supports time events as dependency.
        fileEvents:
          type: boolean
          description: Whether or not the scheduler supports file events as dependency.
        advancedFileEvents:
          type: boolean
          description: Whether or not the scheduler supports file more advanced file
            events (age, created) beyond exist, not exist, and size.
        fileEventsAsTriggers:
          type: boolean
          description: Whether or not the scheduler supports file events as triggers.
        multipleTriggers:
          type: boolean
          description: Whether or not the scheduler supports multiple events as triggers.
        flowCompletionCriteria:
          type: boolean
          description: Whether or not the scheduler supports setting specific criteria
            for determining flow completion. Criteria could include when to consider
            the flow is finished executing (when any items fails, when a specific
            set of items have completed, etc), what to do with remaining jobs once
            the flow is determined to have finished (complete any work in progress
            and stop the flow, continue running the flow, etc), and how to calculate
            the exit code (sum of the exit codes for all items, the last finished
            item).
        emailNotifications:
          type: boolean
          description: Whether or not the schedule supports email notification.
        queues:
          type: boolean
          description: Whether or not the scheduler has queues available for selection.
        jobDefaultEmailNotifications:
          type: boolean
          description: Whether or not the scheduler supports setting a default email
            notification for all the jobs in a flow.
        jobDefaultPriorities:
          type: boolean
          description: Whether or not the scheduler supports setting a default priority
            for all the jobs in a flow.
        jobDefaultEnvironmentVariables:
          type: boolean
          description: Whether or not the scheduler supports setting a default value
            for environment variables for all the jobs in a flow.
        exclusiveExecutions:
          type: boolean
          description: Whether or not the scheduler supports exclusive execution for
            flows where only one instance of the flow runs at any given time. Multiple
            instances of the same flow cannot run simultaneously.
        timeZones:
          type: boolean
          description: Whether or not the scheduler supports explicit setting of the
            time zone to a given time event.
    configuration:
      discriminator:
        propertyName: type
      description: One of sasJobFlowSchedulerConfiguration or platformProcessManagerConfiguration.
    transferObject:
      title: Transfer Object
      type: object
      description: Information about a transfer object.
      properties:
        version:
          type: integer
          description: The version number of the transfer object.
        id:
          type: string
          description: The unique transfer object identifier.
        summary:
          type: object
          description: The details of the job request.
        content:
          type: object
          description: The encoded data of the transfer object.
        connectors:
          type: array
          description: Items that are associated with the transfer object.
          items:
            type: object
    api:
      description: Information about the api object.
      properties:
        version:
          type: integer
          description: "The version number of the API representation. This is version\
            \ 1."
        links:
          type: array
          description: The API's top-level links.
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      description: A link to a related operation or resource.
      properties:
        method:
          type: string
          description: The HTTP method to invoke this endpoint.
        rel:
          type: string
          description: The relationship of this URL to the object.
        uri:
          type: string
          description: The relative URI of the REST endpoint.
        href:
          type: string
          description: The full URL of the REST endpoint.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type consumed/produced.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    baseCollection:
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    errorResponse:
      title: "Error"
      description: "The representation of an error."
      type: object
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The error message.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred
          items:
            $ref: "#/components/schemas/errorResponse"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
