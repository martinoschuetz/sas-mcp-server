openapi: 3.0.3
info:
  version: "2"
  title: Job Flow Scheduling
  description: The jobFlowScheduling Service REST API is used to schedule flows to
    be executed according a time schedule or other pre-defined conditions being satisfied.
    <br><br><b>Terminology:</b> <table> <tr><td>dependency        <td>the set of events
    that must be met for a job or sub-flow to execute within an instance of a flow.
    <tr><td>job action        <td>a job that has been saved in a deployment and can
    be added to a flow definition. The job can only execute in the context of a flow
    execution. <tr><td>event             <td>a condition that has happened which the
    scheduler must act upon <tr><td>time event        <td>an event based on a point
    in time. The time event can be recurring in nature (i.e. every day at noon) when
    used as a trigger. <tr><td>skip count        <td>The increment used as part of
    a time event, such as every hour (skip count is 1) or every other Monday (skip
    count is 2); see [wikipedia:skip counting](http://en.wikipedia.org/wiki/skip_counting
    "wikipedia:skip counting"). <tr><td>file event        <td>an event based on a
    file in the file system of the scheduler. <tr><td>job event         <td>an event
    based on the execution (exit code) of a job or sub-flow. <tr><td>gate              <td>a
    group of events used as a job dependency, that conditionally all must be true
    (AND) or at least one must be true (OR). Complex dependencies would have a gate
    being an input to another gate. <tr><td>subordinate-flow  <td>another name for
    sub-flow. <tr><td>sub-flow          <td>a job flow acting like a job in a parent
    flow. <tr><td>trigger           <td>an event that signals when a new instance
    of a scheduled flow should execute. <tr><td>job flow          <td>a group of job
    actions and/or sub-flows with their dependencies and the triggers for when to
    execute the flow. <tr><td>scheduling server <td>a server that runs jobs in a scheduled
    flow. The scheduling server determines whether the schedule criteria and dependencies
    have been met before a job is executed. </table>
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
