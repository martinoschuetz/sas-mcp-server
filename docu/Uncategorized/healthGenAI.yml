---
openapi: 3.0.3
info:
  title: Health Gen AI
  version: "1"
  description: The Health Gen AI API provides endpoints for managing the SAS Health
    Copilot application.
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  x-logo:
    url: ""
servers:
- url: "example.com/healthGenAI"
  description: Local mock server
tags:
- name: Root
  description: Operations for the root resource.
- name: Conversations
  description: Operations for managing conversations with LLM APIs.
- name: Jobs
  description: Operations for managing asynchronous jobs.
- name: Prompts
  description: Operations for managing example prompts.
- name: Previews
  description: Operations for managing preview data.
paths:
  /:
    get:
      operationId: root
      summary: Get the links for the API
      description: Returns a list of links to the top-level operations surfaced through
        this API.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded and the list of links is returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
  /conversations:
    get:
      operationId: getConversations
      summary: Get a collection of conversations
      description: "Returns a collection of conversations with standard paging, filtering,\
        \ and sorting options."
      tags:
      - Conversations
      parameters:
      - $ref: "#/components/parameters/start"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/sortBy"
      - $ref: "#/components/parameters/ifNoneMatch"
      - $ref: "#/components/parameters/search"
      responses:
        "200":
          description: The request succeeded and a collection of conversations is
            returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/conversationCollection"
              examples:
                conversationCollection:
                  $ref: "#/components/examples/conversationCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/conversationCollection"
              examples:
                conversationCollection:
                  $ref: "#/components/examples/conversationCollection"
        "404":
          $ref: "#/components/responses/404"
    head:
      operationId: headersForConversations
      summary: Get headers for retrieving a collection of conversations
      description: HEAD for retrieving a collection of conversations.
      tags:
      - Conversations
      parameters:
      - $ref: "#/components/parameters/start"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/sortBy"
      - $ref: "#/components/parameters/ifNoneMatch"
      - $ref: "#/components/parameters/search"
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
    post:
      operationId: createConversation
      summary: Create a conversation
      description: Creates a conversation.
      tags:
      - Conversations
      requestBody:
        $ref: "#/components/requestBodies/conversationPostRequest"
      responses:
        "201":
          description: The request succeeded and the created conversation is returned.
          headers:
            Location:
              schema:
                type: string
              description: The URI for the newly created conversation.
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/vnd.sas.genai.conversation+json:
              schema:
                $ref: "#/components/schemas/conversation"
              examples:
                conversation:
                  $ref: "#/components/examples/conversation"
            application/json:
              schema:
                $ref: "#/components/schemas/conversation"
              examples:
                conversation:
                  $ref: "#/components/examples/conversation"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
  /conversations/{conversationId}:
    parameters:
    - $ref: "#/components/parameters/conversationId"
    get:
      operationId: getConversation
      summary: Get a conversation
      description: Retrieves the specified conversation.
      tags:
      - Conversations
      responses:
        "200":
          description: The request succeeded and the specified conversation is returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/vnd.sas.genai.conversation+json:
              schema:
                $ref: "#/components/schemas/conversation"
              examples:
                conversation:
                  $ref: "#/components/examples/conversation"
            application/json:
              schema:
                $ref: "#/components/schemas/conversation"
              examples:
                conversation:
                  $ref: "#/components/examples/conversation"
        "404":
          $ref: "#/components/responses/404"
    head:
      operationId: headersForConversation
      summary: Get headers for a conversation
      description: Retrieves headers for the specified conversation. Can also be used
        to check if a conversation exists
      tags:
      - Conversations
      responses:
        "200":
          description: The request succeeded and specified conversation headers are
            returned with no content.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "404":
          $ref: "#/components/responses/404"
    patch:
      operationId: patchConversation
      summary: Partially update a conversation
      description: Updates parts of the specified conversation.
      tags:
      - Conversations
      requestBody:
        required: true
        content:
          application/vnd.sas.genai.conversation+json:
            schema:
              $ref: "#/components/schemas/conversationPatchRequest"
            examples:
              conversationRequestNameChange:
                $ref: "#/components/examples/conversationRequestNameChange"
              conversationRequestFavoriteChange:
                $ref: "#/components/examples/conversationRequestFavoriteChange"
              conversationRequestNewMessage:
                $ref: "#/components/examples/conversationRequestNewMessage"
          application/json:
            schema:
              $ref: "#/components/schemas/conversationPatchRequest"
            examples:
              conversationRequestNameChange:
                $ref: "#/components/examples/conversationRequestNameChange"
              conversationRequestFavoriteChange:
                $ref: "#/components/examples/conversationRequestFavoriteChange"
              conversationRequestNewMessage:
                $ref: "#/components/examples/conversationRequestNewMessage"
      responses:
        "200":
          description: The request succeeded and the conversation was updated.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/vnd.sas.genai.conversation+json:
              schema:
                $ref: "#/components/schemas/conversation"
              examples:
                conversation:
                  $ref: "#/components/examples/conversation"
            application/json:
              schema:
                $ref: "#/components/schemas/conversation"
              examples:
                conversation:
                  $ref: "#/components/examples/conversation"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "412":
          $ref: "#/components/responses/412"
        "428":
          $ref: "#/components/responses/428"
  /jobs:
    post:
      operationId: createJob
      summary: Create a job
      description: Creates a job.
      tags:
      - Jobs
      requestBody:
        $ref: "#/components/requestBodies/jobRequest"
      responses:
        "201":
          description: The job has finished executing.
          headers:
            Location:
              schema:
                type: string
                description: The URI for the job.
          content:
            application/vnd.sas.genai.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                completed:
                  $ref: "#/components/examples/completedJob"
                failed:
                  $ref: "#/components/examples/failedJob"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                completed:
                  $ref: "#/components/examples/completedJob"
                failed:
                  $ref: "#/components/examples/failedJob"
        "202":
          description: The job is running.
          headers:
            Location:
              schema:
                type: string
                description: The URI for the job.
          content:
            application/vnd.sas.genai.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                runningJob:
                  $ref: "#/components/examples/runningJob"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                runningJob:
                  $ref: "#/components/examples/runningJob"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
  /jobs/{jobId}:
    parameters:
    - $ref: "#/components/parameters/jobId"
    get:
      operationId: getJob
      summary: Get a job
      description: Retrieves the specified job.
      tags:
      - Jobs
      responses:
        "200":
          description: The request succeeded and the specified job is returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/vnd.sas.genai.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                running:
                  $ref: "#/components/examples/runningJob"
                completed:
                  $ref: "#/components/examples/completedJob"
                failed:
                  $ref: "#/components/examples/failedJob"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                running:
                  $ref: "#/components/examples/runningJob"
                completed:
                  $ref: "#/components/examples/completedJob"
                failed:
                  $ref: "#/components/examples/failedJob"
        "404":
          $ref: "#/components/responses/404"
    head:
      operationId: headersForJob
      summary: Get headers for a job
      description: Retrieves the headers for the specified job. Can also be used to
        check if a job exists.
      tags:
      - Jobs
      responses:
        "200":
          description: The request succeeded and the specified job headers are returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "404":
          $ref: "#/components/responses/404"
    post:
      operationId: createCancelledJob
      summary: Cancel a job
      description: Cancels the specified job.
      tags:
      - Jobs
      parameters:
      - name: action
        in: query
        required: true
        description: The action to perform on the specified job.
        schema:
          type: string
          enum:
          - cancel
      requestBody:
        $ref: "#/components/requestBodies/empty"
      responses:
        "201":
          description: The request succeeded and the canceled job is returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/vnd.sas.genai.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                canceled:
                  $ref: "#/components/examples/canceledJob"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                canceled:
                  $ref: "#/components/examples/canceledJob"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
  /prompts:
    get:
      operationId: getPrompts
      summary: Get a collection of prompts
      description: Returns a collection of prompts with standard paging, filtering,
        and sorting options.
      tags:
      - Prompts
      parameters:
      - $ref: "#/components/parameters/start"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/sortBy"
      - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The request succeeded and a collection of prompts is returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/promptCollection"
              examples:
                promptCollection:
                  $ref: "#/components/examples/promptCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/promptCollection"
              examples:
                promptCollection:
                  $ref: "#/components/examples/promptCollection"
        "404":
          $ref: "#/components/responses/404"
    head:
      operationId: headersForPrompts
      summary: Get headers for retrieving a collection of prompts
      description: HEAD for retrieving a collection of prompts.
      tags:
      - Prompts
      parameters:
      - $ref: "#/components/parameters/start"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/sortBy"
      - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
    post:
      operationId: createPrompt
      summary: Create a prompt
      description: Creates a prompt.
      tags:
      - Prompts
      requestBody:
        $ref: "#/components/requestBodies/promptRequest"
      responses:
        "201":
          description: The request succeeded and the created prompt is returned.
          headers:
            Location:
              schema:
                type: string
              description: The URI for the new prompt.
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/vnd.sas.genai.prompt+json:
              schema:
                $ref: "#/components/schemas/prompt"
              examples:
                prompt:
                  $ref: "#/components/examples/prompt"
            application/json:
              schema:
                $ref: "#/components/schemas/prompt"
              examples:
                prompt:
                  $ref: "#/components/examples/prompt"
        "400":
          $ref: "#/components/responses/400"
  /prompts/{promptId}:
    parameters:
    - $ref: "#/components/parameters/promptId"
    put:
      operationId: updatePrompt
      summary: Update a prompt resource
      description: Updates the specified prompt resource.
      tags:
      - Prompts
      requestBody:
        $ref: "#/components/requestBodies/promptRequest"
      responses:
        "200":
          description: The request succeeded and the updated prompt is returned.
          headers:
            Location:
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/vnd.sas.genai.prompt+json:
              schema:
                $ref: "#/components/schemas/prompt"
              examples:
                prompt:
                  $ref: "#/components/examples/prompt"
            application/json:
              schema:
                $ref: "#/components/schemas/prompt"
              examples:
                prompt:
                  $ref: "#/components/examples/prompt"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "412":
          $ref: "#/components/responses/412"
        "428":
          $ref: "#/components/responses/428"
    delete:
      summary: Delete a prompt
      description: Delete a prompt by its unique ID.
      operationId: deletePrompt
      tags:
      - Prompts
      responses:
        "204":
          description: No Content
  /previews/{previewId}:
    parameters:
    - $ref: "#/components/parameters/previewId"
    get:
      operationId: getPreviewData
      summary: Get a data preview resource
      description: Retrieves the specified data preview resource.
      tags:
      - Previews
      responses:
        "200":
          description: The request succeeded and the data preview resource is returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.genai.preview+json:
              schema:
                $ref: "#/components/schemas/preview"
              examples:
                preview:
                  $ref: "#/components/examples/preview"
            application/json:
              schema:
                $ref: "#/components/schemas/preview"
              examples:
                preview:
                  $ref: "#/components/examples/preview"
        "404":
          $ref: "#/components/responses/404"
    head:
      operationId: headersForPreviewData
      summary: Get headers for a data preview resource
      description: Retrieves headers for the specified data preview resource.
      tags:
      - Previews
      responses:
        "200":
          description: The request succeeded and the headers are returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
  /previews/{previewId}/columns:
    parameters:
    - $ref: "#/components/parameters/previewId"
    get:
      operationId: getPreviewDataColumns
      summary: Get a collection of columns
      description: Returns a collection of preview data columns with standard paging
        options.
      tags:
      - Previews
      parameters:
      - $ref: "#/components/parameters/start"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: The request succeeded and a collection of columns is returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/previewColumnCollection"
              examples:
                previewColumnCollection:
                  $ref: "#/components/examples/previewColumnCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/previewColumnCollection"
              examples:
                previewColumnCollection:
                  $ref: "#/components/examples/previewColumnCollection"
        "404":
          $ref: "#/components/responses/404"
    head:
      operationId: headersForPreviewDataColumns
      summary: Get headers for a collection of columns
      description: Returns headers a collection of preview data columns with standard
        paging options.
      tags:
      - Previews
      parameters:
      - $ref: "#/components/parameters/start"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: The request succeeded and headers are returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
  /previews/{previewId}/rows:
    parameters:
    - $ref: "#/components/parameters/previewId"
    get:
      operationId: getPreviewDataRows
      summary: Get a collection of rows
      description: Returns a collection of preview data rows with standard paging
        options.
      tags:
      - Previews
      parameters:
      - $ref: "#/components/parameters/start"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: The request succeeded and a collection of rows is returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/previewRowCollection"
              examples:
                previewRowCollection:
                  $ref: "#/components/examples/previewRowCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/previewRowCollection"
              examples:
                previewRowCollection:
                  $ref: "#/components/examples/previewRowCollection"
        "404":
          $ref: "#/components/responses/404"
    head:
      operationId: headersForPreviewDataRows
      summary: Get headers for a collection of rows
      description: Returns headers for a collection of preview data rows with standard
        paging options.
      tags:
      - Previews
      parameters:
      - $ref: "#/components/parameters/start"
      - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: The request succeeded and headers are returned.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
components:
  schemas:
    conversation:
      title: Conversation
      description: Conversation.
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        required:
        - id
        - name
        properties:
          id:
            title: Conversation ID
            description: The ID of this conversation.
            type: string
            example: 629b4cff-168f-4272-bb7e-decd154f2ec6
          name:
            title: Conversation Name
            description: The name of this conversation.
            type: string
            example: Patient Cohort
          favorite:
            title: Favorite Conversation
            description: Indicates if this conversation is a favorite.
            type: string
            enum:
            - saved
            - unsaved
            example: saved
          messages:
            title: Conversation Messages
            description: The messages of this conversation.
            type: array
            items:
              $ref: "#/components/schemas/message"
          links:
            title: Conversation Links
            description: The links that apply to this object.
            items:
              $ref: "#/components/schemas/link"
    conversationSummary:
      title: Conversation Summary
      description: Summary of a conversation.
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        required:
        - id
        - name
        properties:
          id:
            title: Conversation ID
            description: The ID of this conversation.
            type: string
            example: 629b4cff-168f-4272-bb7e-decd154f2ec6
          name:
            title: Conversation Name
            description: The name of this conversation.
            type: string
            example: Patient Cohort
          favorite:
            title: Favorite Conversation
            description: Indicates if this conversation is a favorite.
            type: string
            enum:
            - saved
            - unsaved
            example: saved
          links:
            title: Conversation Links
            description: The links that apply to this object.
            items:
              $ref: "#/components/schemas/link"
    conversationCollection:
      title: Collection of Conversations
      description: One page of conversation representations, with optional links to
        the first, previous, next, and last page of the list.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            description: An array of conversation objects.
            type: array
            items:
              $ref: "#/components/schemas/conversationSummary"
    conversationPostRequest:
      title: Conversation Post Request
      description: Conversation Request.
      allOf:
      - type: object
        properties:
          message:
            title: New Message
            description: A new message for the conversation.
            type: string
            example: Show me all of my patients with diabetes
          connectionId:
            title: Connection ID
            description: The ID of the database connection to use for the conversation.
            type: string
            example: 123e4567-e89b-12d3-a456-426614174000
    conversationPatchRequest:
      title: Conversation Request
      description: Conversation Patch Request.
      allOf:
      - type: object
        properties:
          name:
            title: Conversation Name
            description: The name of this conversation.
            type: string
            example: Patient Cohort
          favorite:
            title: Favorite Conversation
            description: Indicates if this conversation is a favorite.
            type: string
            enum:
            - saved
            - unsaved
            example: saved
          message:
            title: New Message
            description: A new message for the conversation.
            type: string
            example: Show me all of my patients with diabetes
          connectionId:
            title: Connection ID
            description: The ID of the database connection to use for the conversation.
            type: string
            example: 123e4567-e89b-12d3-a456-426614174000
    job:
      title: Job
      description: Job
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        required:
        - id
        - state
        - type
        properties:
          id:
            title: Job ID
            description: The ID of this job.
            type: string
            example: 9e7e224c-681d-4ab5-a20a-7d274e5837f6
          type:
            title: Job Type
            description: The type of this job.
            type: string
            enum:
            - createDataPreview
            - createDataView
            example: createDataView
          connectionId:
            title: Connection ID
            description: The ID of the connection used for this job.
            type: string
            example: 6478e236-d7f2-4649-8c85-d6da43558711
          code:
            title: Code
            description: The code used for this job.
            type: string
            example: SELECT COUNT(*) FROM HLS_PATIENT
          state:
            title: Job State
            description: The current state of this job.
            type: string
            enum:
            - running
            - completed
            - failed
            - canceled
            example: completed
          results:
            $ref: "#/components/schemas/jobResults"
          links:
            title: Job Links
            description: The links that apply to this object.
            items:
              $ref: "#/components/schemas/link"
    jobRequest:
      title: Job Request
