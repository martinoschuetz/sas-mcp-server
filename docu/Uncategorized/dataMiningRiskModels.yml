  /projects/{projectId}/pipelines/{pipelineId}/components/{componentId}/variables#groupingNode:
    get:
      x-sas-internal: true
      tags:
      - Interactive Grouping Nodes
      summary: Retrieve the variable information for the grouping node
      description: Retrieve the variable information for the component. If no session
        ID is provided, the variables are retrieved from the results of the previous
        run. If a session ID is supplied, the variables are retrieved from the corresponding
        edit session.
      operationId: getGroupingNodeVariableSummaries
      parameters:
      - name: projectId
        in: path
        description: The project ID.
        required: true
        schema:
          type: string
      - name: pipelineId
        in: path
        description: The pipeline ID.
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: The component ID.
        required: true
        schema:
          type: string
      - name: action
        in: query
        description: The action to perform for the component variables.
        required: true
        schema:
          type: string
          enum:
          - ign_editor
          default: ign_editor
      - name: sessionId
        in: query
        description: The ID of the edit session if active.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the response.
              schema:
                type: string
          content:
            application/vnd.sas.risk.credit.scoring.grouping.variables.summaries+json:
              schema:
                $ref: "#/components/schemas/groupingNodeVariableSummaryList"
              examples:
                json:
                  $ref: "#/components/examples/getVariableSummariesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/groupingNodeVariableSummaryList"
              examples:
                json:
                  $ref: "#/components/examples/getVariableSummariesResponse"
        "404":
          description: Either the project, pipeline, or component does not exist at
            the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/componentForSummaryVariablesNotFoundResponse"
            application/vnd.sas.risk.credit.scoring.grouping.variables.summaries+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/componentForSummaryVariablesNotFoundResponse"
