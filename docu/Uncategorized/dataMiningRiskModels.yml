              schema:
                type: string
          content:
            application/vnd.sas.risk.credit.scoring.grouping.variables.details+json:
              schema:
                $ref: "#/components/schemas/groupingNodeVariablesDetailList"
              examples:
                json:
                  $ref: "#/components/examples/saveChangesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/groupingNodeVariablesDetailList"
              examples:
                json:
                  $ref: "#/components/examples/saveChangesResponse"
        "400":
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.risk.credit.scoring.grouping.variables.details+json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The specified project, pipeline, component, or variable(s)
            could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/componentForSummaryVariablesNotFoundResponse"
            application/vnd.sas.risk.credit.scoring.grouping.variables.details+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/componentForSummaryVariablesNotFoundResponse"
