  /projects/{projectId}/pipelines/{pipelineId}/components/{componentId}/variables/{variableId}#groupingNodeBinMerge:
    put:
      x-sas-internal: true
      tags:
      - Interactive Grouping Nodes
      summary: Merge a range of bins for a grouping node
      description: For a grouping node and a given variable, merge a range of bins,
        potentially across multiple groups. These changes are valid for the lifetime
        of the edit session.  To persist the changes permanently a user must invoke
        the POST of relation saveGroupingNodeChanges on the grouping node. If the
        merge crosses multiple groups, the subsequent bins and groups are reordered
        so that their groups remain contiguous and no groups are left empty.  The
        resulting bin has the lower bound of the first bin, the upper bound of the
        last and resides in the group of the first bin.
      operationId: updateGroupingNodeMergeBins
      parameters:
      - name: action
        in: query
        description: The action to perform for the component variables.
        required: true
        schema:
          type: string
          enum:
          - ign_editor
          default: ign_editor
      - name: projectId
        in: path
        description: The project ID.
        required: true
        schema:
          type: string
      - name: pipelineId
        in: path
        description: The pipeline ID.
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: The component ID.
        required: true
        schema:
          type: string
      - name: variableId
        in: path
        description: The variable ID.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag that was returned from a GET, POST, or PUT for
          this resource.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.risk.credit.scoring.grouping.variable.bins.merge+json:
            schema:
              $ref: "#/components/schemas/groupingNodeMergeBins"
            examples:
              json:
                $ref: "#/components/examples/mergeBinsRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/groupingNodeMergeBins"
            examples:
              json:
                $ref: "#/components/examples/mergeBinsRequest"
        description: The information needed to merge the required bins.
        required: true
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              description: The entity tag for the response.
              schema:
                type: string
          content:
            application/vnd.sas.risk.credit.scoring.grouping.variable.details+json:
              schema:
                $ref: "#/components/schemas/groupingNodeVariableDetails"
              examples:
                json:
                  $ref: "#/components/examples/mergeBinsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/groupingNodeVariableDetails"
              examples:
                json:
                  $ref: "#/components/examples/mergeBinsResponse"
        "400":
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.risk.credit.scoring.grouping.variable.details+json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: The specified project, pipeline, component, variable, group
            or bins could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/componentForVariableDetailsNotFoundResponse"
            application/vnd.sas.risk.credit.scoring.grouping.variable.details+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/componentForVariableDetailsNotFoundResponse"
  /projects/{projectId}/pipelines/{pipelineId}/components/{componentId}/variables/{variableId}#groupingNodeBinMove:
    put:
      x-sas-internal: true
      tags:
      - Interactive Grouping Nodes
      summary: Move the requested bins to a specific group
      description: "Moving a bin also causes all bins between the bin and destination\
        \ group to move as well. These changes are valid for the lifetime of the edit\
        \ session.  To persist the changes permanently a user must invoke the POST\
        \ of relation saveGroupingNodeChanges on the grouping node. If such an action\
        \ results in empty groups, then those groups are removed an all bins above\
        \ are reordered such that the groups are continuous.  Example: If a bin in\
        \ group 5 moves to group 2, all the bins in group 3 and 4 also move to group\
        \ 2.  Bins in group 6 then move down into group 3."
      operationId: updateGroupingNodeMoveBins
      parameters:
      - name: action
        in: query
        description: The action to perform for the component variables.
        required: true
        schema:
          type: string
          enum:
          - ign_editor
          default: ign_editor
      - name: projectId
        in: path
        description: The project ID.
        required: true
        schema:
          type: string
      - name: pipelineId
        in: path
        description: The pipeline ID.
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: The component ID.
        required: true
        schema:
          type: string
      - name: variableId
        in: path
        description: The variable ID.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag that was returned from a GET, POST, or PUT for
          this resource.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.risk.credit.scoring.grouping.variable.bins.move+json:
            schema:
              $ref: "#/components/schemas/groupingNodeMoveBins"
            examples:
              json:
                $ref: "#/components/examples/moveBinsRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/groupingNodeMoveBins"
            examples:
              json:
                $ref: "#/components/examples/moveBinsRequest"
        description: The information needed to move the required bins.
        required: true
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              description: The entity tag for the response.
              schema:
                type: string
          content:
            application/vnd.sas.risk.credit.scoring.grouping.variable.details+json:
              schema:
                $ref: "#/components/schemas/groupingNodeVariableDetails"
              examples:
                json:
                  $ref: "#/components/examples/moveBinsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/groupingNodeVariableDetails"
