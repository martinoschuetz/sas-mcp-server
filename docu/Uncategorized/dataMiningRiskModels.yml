        in: path
        description: The project ID.
        required: true
        schema:
          type: string
      - name: pipelineId
        in: path
        description: The pipeline ID.
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: The component ID.
        required: true
        schema:
          type: string
      - name: action
        in: query
        description: The action to perform for the component variables.
        required: true
        schema:
          type: string
          enum:
          - ign_editor
          default: ign_editor
      - name: If-Match
        in: header
        description: The entity tag that was returned from a GET, POST, or PUT for
          this resource.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.risk.credit.scoring.grouping.variables.details+json:
            schema:
              $ref: "#/components/schemas/groupingNodeVariablesDetailList"
            examples:
              json:
                $ref: "#/components/examples/saveChangesRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/groupingNodeVariablesDetailList"
            examples:
              json:
                $ref: "#/components/examples/saveChangesRequest"
        description: The detail information for the variables with changes to be saved
