- url: http://example.com/dataMiningRiskModels
  description: Example base url.
components:
  schemas:
    groupingNodeAdvancedConstraint:
      x-sas-internal: true
      title: Grouping Node Variable Advanced Constraints
      description: A representation of the advanced constraints for a variable of
        a grouping node.
      properties:
        variableId:
          type: string
          description: The ID of the variable.
        variableName:
          type: string
          description: The name of the variable.
        variableDescription:
          type: string
          description: The variable description.
        level:
          type: string
          enum:
          - unary
          - binary
          - ordinal
          - nominal
          - interval
          description: The user-specified variable measurement level.
        monotonicitySourceType:
          type: string
          enum:
          - USER
          - COMPONENT
          - NONE
          description: Indicates from where to pull the monotonicityEnabled value.
        monotonicityEnabled:
          type: boolean
          description: Specifies whether a monotonic distribution of weight of evidence
            should be applied, if option enabled.
        minimumGroupCountSourceType:
          type: string
          enum:
          - USER
          - COMPONENT
