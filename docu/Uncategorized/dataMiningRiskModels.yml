          description: The name of the job.
        description:
          type: string
          description: The description of the job.
        creationTimeStamp:
          description: The timestamp for when the job was created, in the format of
            `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        modifiedTimeStamp:
          description: The timestamp for when the job was last modified, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        createdBy:
          description: The ID of the user that created or submitted the job.
          type: string
        modifiedBy:
          description: The ID of the user that last modified the job.
          type: string
        jobDefinitionUri:
          type: string
          description: The URI of the job definition that is to be executed.
        jobDefinition:
          type: object
          description: The definition of the job that is to be executed.
        expiresAfter:
          type: string
          description: The duration of time (in <a href="https://www.w3.org/TR/xmlschema-2/#duration"
            target="_blank">W3C XML duration format</a>) after the completion of the
            job when the job should be deleted by the Job Execution service.
        arguments:
          type: object
          description: The values of the arguments described in the job definition.
        properties:
          type: object
          description: The value of properties in the format of (map<string, string>)
            that contains name value pairs (map<name, value>). The maximum name value
            length is 100.
          additionalProperties:
            type: string
        links:
          type: array
          description: The links that are associated with the job.
          items:
            $ref: "#/components/schemas/link"
    dataRow:
      title: Data Row
      description: A row of data.
      required:
      - dataMap
      - rowNumber
      properties:
        dataMap:
          type: object
          description: 'Map of parameter name to associated value.'
        header:
          type: string
          description: 'Optional title. May be localized.'
        rowNumber:
          type: integer
          format: int32
          description: 'The index of this row in the collection.'
    parameter:
      title: Parameter
      description: Metadata describing a particular variable.
      required:
      - parameter
      - type
      - values
      properties:
        label:
          type: string
          description: 'The display name. May be localized.'
        length:
          type: integer
          format: int32
          description: 'The maximum width among this parameter''s values.'
        order:
          type: integer
          format: int32
          description: 'The index of this parameter in the collection.'
        parameter:
          type: string
          description: 'The parameter name. Should not be localized.'
        preformatted:
          type: boolean
          description: 'Indicates whether this parameter''s values have already been
            formatted.'
        type:
          type: string
          description: 'The data type of this parameter''s values.'
          enum:
          - undefined
          - num
          - char
          - report
        values:
          type: array
          description: 'Keys used to associate this parameter with values in the rows
            of data.'
          items:
            type: string
