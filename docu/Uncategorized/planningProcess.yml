openapi: 3.0.3
info:
  description: >-
    The Planning Process Service REST API has predefined components. Using the
    component you can create the process flow.
    Components should not be called separately, It should be called with a process
    flow.
     Multiple type of flow can be created using the components 
     1. Time-Based Seeding Flow
     2. Time-Based Referencing Flow
     3. Plan-Based Seeding Flow
     4. Plan-Based Referencing Flow
     5. ETL Flow
     6. Adding Member Flow
     7. Publish Analytics Flow
  version: "5"
  title: Planning Process
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  license:
    name: Term of Use
    url: https://www.sas.com/en_us/legal/copyright.html
