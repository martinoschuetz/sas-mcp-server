---
openapi: 3.0.3
info:
  description: |-
    The text-analytics-execution API is a mid-tier API for SAS Visual Text Analytics (VTA). The main purpose of this API is to provide VTA application related capabilities such as VTA component execution, interaction with CAS by executing CAS action calls, and handling execution of various jobs, etc.
  version: '1'
  title: Text Analytics Execution
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
tags:
- name: Root
  description: Root.
- name: Project
  description: Project.
- name: JobExecution
  description: Job Execution.
- name: Components
  description: Components.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      operationId: root
      description: Returns the links to the top-level resources for the API.
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                example-1:
                  value:
                    version: 1
                    links:
                    - method: GET
                      rel: self
                      href: /textAnalyticsExecution
                      uri: /textAnalyticsExecution
                      type: application/vnd.sas.api
                    - method: POST
                      rel: run
                      href: /textAnalyticsExecution/jobs
                      uri: /textAnalyticsExecution/jobs
                      type: application/vnd.sas.job.execution.job
                      responseType: application/vnd.sas.job.execution.job
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                example-1:
                  value:
                    version: 1
                    links:
                    - method: GET
                      rel: self
                      href: /textAnalyticsExecution
                      uri: /textAnalyticsExecution
                      type: application/vnd.sas.api
                    - method: POST
                      rel: run
                      href: /textAnalyticsExecution/jobs
                      uri: /textAnalyticsExecution/jobs
                      type: application/vnd.sas.job.execution.job
                      responseType: application/vnd.sas.job.execution.job
