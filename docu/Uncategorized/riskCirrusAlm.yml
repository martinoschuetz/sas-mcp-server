---
openapi: 3.0.3
info:
  version: '1'
  title: Risk Cirrus ALM
  description: >
    SAS Risk Cirrus ALM handles the execution of Asset and Liability Management analysis
    runs
    via the KRM backend.
  termsOfService: 'https://www.sas.com/en_us/legal/copyright.html'
  contact:
    name: 'SAS Developers'
    email: 'devex@sas.com'
    url: 'https://developer.sas.com'
servers:
- url: http://example.com/riskCirrusAlm
  description: Sample server URL.
tags:
- name: Root Links
  description: Root Links.
- name: Output Table Metadata
  description: Metadata about all output tables within KRM.
- name: Runs
  description: An object that ties together a Cirrus Analysis Run and its associated
    KRM job and run.
- name: Distinct Values
  description: Distinct values and their descriptions from selected KRM tables.
- name: Codes
  description: Global codes within the KRM system.
- name: User Codes
  description: User defined codes within the KRM system.
- name: Reporting Period Sets
  description: A reporting period set is an object that defines a set of contiguous
    reporting periods (in time).
- name: Reports
  description: A runnable report (script) associated with an analysis run for providing
    report data.
paths:
  /:
    get:
      tags:
      - Root Links
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example:
                  $ref: '#/components/examples/getALMRootResponse'
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example:
                  $ref: '#/components/examples/getALMRootResponse'
  /runs:
    post:
      tags:
      - Runs
      summary: Create a KRM run (called from scripts within our product)
      operationId: createRun
      description: |
        Create a KRM run in the system (from an Analysis Run that the user started).
        This endpoint is considered a private endpoint as users are expected to call the endpoint for creating
        AnalysisRun objects and not use this endpoint.  This endpoint exists mainly so that one part of our product
        (code in SAS scripts) can call into our mid-tier to kick off an KRM run.
      requestBody:
        content:
          application/vnd.sas.risk.alm.run+json:
            schema:
              $ref: '#/components/schemas/run'
            examples:
              example:
                $ref: '#/components/examples/createRunBody'
          application/json:
            schema:
              $ref: '#/components/schemas/run'
            examples:
              example:
                $ref: '#/components/examples/createRunBody'
        description: The run definition to be created.
        required: true
      responses:
        '201':
          description: Run created successfully.
          headers:
            Location:
              description: The URI of the newly created run.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.alm.run+json:
              schema:
                $ref: '#/components/schemas/run'
              examples:
                example:
                  $ref: '#/components/examples/runBodyResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/run'
              examples:
                example:
                  $ref: '#/components/examples/runBodyResponse'
        '400':
          description: |
            Bad Request.

            The request is not properly formed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/badCreateRunErrorResponse'
  /getOutputTableMetas:
    get:
      tags:
      - Output Table Metadata
      summary: Get metadata for output tables
      operationId: getOutputTableMetas
      description: |
        Get a list of metadata objects for the KRM output tables

        Returned items will be of media type application/vnd.sas.risk.alm.output.table.meta+json
      responses:
        '200':
          description: The request succeeded and matching output table metas are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/outputTableMeta'
              examples:
                example:
                  $ref: '#/components/examples/outputMetasResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/outputTableMeta'
              examples:
                example:
                  $ref: '#/components/examples/outputMetasResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
  /distinct:
    get:
      tags:
      - Distinct Values
      summary: Get distinct values
      operationId: getDistinct
      description: |
        Get distinct values for a KRM table/column combination
      parameters:
      - name: start
        in: query
        description: (Currently not supported but in-plan).  0-based Offset of first
          to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: (Currently not supported but in-plan).  Maximum number to return.  Defaults
          to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: '(Currently not supported but in-plan).  Filter criteria for
          returned types. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).'
        schema:
          type: string
          format: filter-criteria
      - name: column
        in: query
        description: The column name to be used to query in the table given in the
          URL
        example: /riskCirrusAlm/distinct/TABLE_PORT?column=PORT_TABLE
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/codes'
              examples:
                example:
                  $ref: '#/components/examples/distinctResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/codes'
              examples:
                example:
                  $ref: '#/components/examples/distinctResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        '500':
          description: |
            Internal Server Error.

            This can happen when the KRM server is not accessible, or when the table or the selected column does not exist.
          content:
            'application/vnd.sas.error+json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/distinctErrorResponse'
            'application/json':
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/distinctErrorResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
  /krmCodes:
    get:
      tags:
      - Codes
      summary: Global Codes
      operationId: getGlobalCodes
      description: |
        Get codes from KRM's CODE_GLB table
      parameters:
      - name: start
        in: query
        description: (Currently not supported but in-plan).  0-based Offset of first
          to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: (Currently not supported but in-plan).  Maximum number to return.  Defaults
          to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: '(Currently not supported but in-plan).  Filter criteria for
          returned types. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).'
        schema:
          type: string
          format: filter-criteria
      responses:
        '200':
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/codes'
              examples:
                example:
                  $ref: '#/components/examples/globalCodesResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/codes'
              examples:
                example:
                  $ref: '#/components/examples/globalCodesResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
  /krmUserCodes:
    get:
      tags:
      - User Codes
      summary: Get user codes
      operationId: getUserCodes
      description: |
        Get codes from KRM's CODE_USER table
      responses:
        '200':
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/codes'
              examples:
                example:
                  $ref: '#/components/examples/userCodesResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/codes'
              examples:
                example:
                  $ref: '#/components/examples/userCodesResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
  /reportingPeriodSets:
    post:
      tags:
      - Reporting Period Sets
      summary: Create reporting period set
      operationId: createReportingPeriodSet
      description: |
        Creates a Reporting Period Set object in KRM's tables
      requestBody:
        content:
          application/vnd.sas.risk.alm.reporting.period.set+json:
            schema:
              $ref: '#/components/schemas/reportingPeriodSet'
            examples:
              example:
                $ref: '#/components/examples/reportingPeriodSetBody'
          application/json:
            schema:
              $ref: '#/components/schemas/reportingPeriodSet'
            examples:
              example:
                $ref: '#/components/examples/reportingPeriodSetBody'
      responses:
        '201':
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.risk.alm.reporting.period.set+json:
              schema:
                $ref: '#/components/schemas/reportingPeriodSet'
              examples:
                example:
                  $ref: '#/components/examples/reportingPeriodSetBody'
            application/json:
              schema:
                $ref: '#/components/schemas/reportingPeriodSet'
              examples:
                example:
                  $ref: '#/components/examples/reportingPeriodSetBody'
          headers:
            Location:
              description: The URI of the newly created reporting period set.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
        '400':
          description: Reporting period set not valid.
    get:
      tags:
      - Reporting Period Sets
      summary: Get reporting period sets
      operationId: getReportingPeriodSets
      description: |
        Get a list of Reporting Period Sets defined in KRM's tables
      parameters:
      - name: start
        in: query
        description: 0-based Offset of first to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number to return.  Defaults to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: Filter criteria for returned types. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      responses:
        '200':
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/reportingPeriodSet'
              examples:
                example:
                  $ref: '#/components/examples/reportingPeriodSetsCollectionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/reportingPeriodSet'
              examples:
                example:
                  $ref: '#/components/examples/reportingPeriodSetsCollectionResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
  /reportingPeriodSets/{name}:
    head:
      tags:
      - Reporting Period Sets
      summary: Check existence of reporting period set
      operationId: headersForReportingPeriodSet
      parameters:
      - name: name
        required: true
        in: path
        schema:
          type: string
        description: The name of the reporting period set
        example: /riskCirrusAlm/reportingPeriodSets/May2025
      description: |
        Returns an HTTP response code indicating the existence of the given reporting period set.
      responses:
        '200':
          description: Exists.
          headers:
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
        '404':
          description: Reporting period set not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/reportingPeriodSetNotFound'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/reportingPeriodSetNotFound'
    get:
      tags:
      - Reporting Period Sets
      summary: Get single reporting period set
      operationId: getReportingPeriodSet
      parameters:
      - name: name
        required: true
        in: path
        schema:
          type: string
        description: The name of the reporting period set
        example: /riskCirrusAlm/reportingPeriodSets/May2025
      description: |
        Get a single Reporting Period Set
      responses:
        '200':
          description: The request succeeded and matching value is returned.
          content:
            application/vnd.sas.risk.alm.reporting.period.set+json:
              schema:
                $ref: '#/components/schemas/reportingPeriodSet'
              examples:
                example:
                  $ref: '#/components/examples/reportingPeriodSetBody'
            application/json:
              schema:
                $ref: '#/components/schemas/reportingPeriodSet'
              examples:
                example:
                  $ref: '#/components/examples/reportingPeriodSetBody'
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        '404':
          description: Reporting period set not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/reportingPeriodSetNotFound'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/reportingPeriodSetNotFound'
    put:
      tags:
      - Reporting Period Sets
      summary: Update reporting period set
      operationId: updateReportingPeriodSet
      description: |
        Update a Reporting Period Set object in KRM's tables
      requestBody:
        content:
          application/vnd.sas.risk.alm.reporting.period.set+json:
            schema:
              $ref: '#/components/schemas/reportingPeriodSet'
            examples:
              example:
                $ref: '#/components/examples/reportingPeriodSetBody'
          application/json:
            schema:
              $ref: '#/components/schemas/reportingPeriodSet'
            examples:
              example:
                $ref: '#/components/examples/reportingPeriodSetBody'
      parameters:
      - name: name
        required: true
        in: path
        schema:
          type: string
        description: The name of the reporting period set
        example: /riskCirrusAlm/reportingPeriodSets/May2025
      - in: header
        name: If-Match
        description: |
          The value of the ETag that was returned from a GET or previous PUT of this object.

          This MUST match exactly the current value of the etag of the object.
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.risk.alm.reporting.period.set+json:
              schema:
                $ref: '#/components/schemas/reportingPeriodSet'
              examples:
                example:
                  $ref: '#/components/examples/reportingPeriodSetBody'
            application/json:
              schema:
                $ref: '#/components/schemas/reportingPeriodSet'
              examples:
                example:
                  $ref: '#/components/examples/reportingPeriodSetBody'
          headers:
            ETag:
              description: A tag that identifies this revision of this code repository.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
        '400':
          description: Reporting period set not valid.
          content:
            application/vnd.sas.risk.alm.reporting.period.set+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/badReportingPeriodSetBody'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                example:
                  $ref: '#/components/examples/reportingPeriodSetBody'
        '404':
          description: Reporting period set not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/reportingPeriodSetNotFound'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/reportingPeriodSetNotFound'
        '412':
          description: The If-Match condition check did not pass.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/preConditionFailedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/preConditionFailedResponse'
        '428':
          description: Pre-Condition failed. If-Match header was not provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/IfMatchHeaderNotProvidedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                json:
                  $ref: '#/components/examples/IfMatchHeaderNotProvidedResponse'
    delete:
      tags:
      - Reporting Period Sets
      summary: Delete reporting period set
      operationId: deleteReportingPeriodSet
      parameters:
      - name: name
        required: true
        in: path
        schema:
          type: string
        description: The name of the reporting period set
        example: /riskCirrusAlm/reportingPeriodSets/May2025
      description: |
        Deletes the reporting period set with the given name in the url.
      responses:
        '204':
          description: Successful deletion of the reporting period set.
        '404':
          description: Reporting period set not found.
  /reports:
    get:
      tags:
      - Reports
      summary: Get selectable reports
      operationId: getSelectableReports
      parameters:
      - name: calcType
        in: query
        description: The calculation type of the analysis that you want the selectable
          reports for.
        example: /riskCirrusAlm/reports?calcType=3&riskMethod=2
        schema:
          type: string
      - name: riskMethod
        in: query
        description: The risk method of the analysis that you want the selectable
          reports for.
        example: /riskCirrusAlm/reports?calcType=3&riskMethod=2
        schema:
          type: string
      - name: start
        in: query
        description: (Currently not supported but in-plan).  0-based Offset of first
          to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: (Currently not supported but in-plan).  Maximum number to return.  Defaults
          to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: '(Currently not supported but in-plan).  Filter criteria for
          returned types. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).'
        schema:
          type: string
          format: filter-criteria
      description: |
        Get a list of reports that are selectable for the given calcType and riskMethod values
      responses:
        '200':
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/selectableReport'
              examples:
                json:
                  $ref: '#/components/examples/selectableReportsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/selectableReport'
              examples:
                json:
                  $ref: '#/components/examples/selectableReportsResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
components:
  schemas:
    run:
      title: Run
      description: The ALM Run definition.  This object exists to tie together the
        Cirrus analysis run object and the KRM job & KRM run objects that are run
        on the behalf of the analysis run.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
        analysisId:
          type: string
          title: Run identifier.
          description: |
            The identifier of the analysis run object that this run wraps.

            This is a system assigned identifier of the analysis run object.
          example: 16372757e-011d-454d-905b-eb10b4a9e5a9
          readOnly: true
        krmJobStatusCode:
          type: string
          title: The status code from running the KRM job for the analysis run.
          description: |
            A single character status code that represents the current status of the KRM job that was run for the analysis run.

            Valid values are:
             - S: Submitted
             - A: Accepted
             - R: Rejected
             - P: Processing
             - C: Completed
             - T: Terminate
             - ?: Unknown

            .
          example: C
          readOnly: true
        keepKrmRun:
          type: boolean
          title: Keep KRM Run and Outputs
          description: |
            Flag to indicate if the KRM Run and its outputs should be kept after is finishes executing.

            When not specified, defaults to false.
          example: true
        portTable:
          type: string
          title: The portfolio table name to use in the KRM job
          description: This name must be one that is returned by /distinct/TABLE_PORT?column=PORT_TABLE.
          example: PORT_BOND_FIXED
          readOnly: false
        calculationType:
          type: integer
          title: Calculation Type
          description: See KRM doc.
          example: 1
        currentDate:
          type: string
          title: Current Date
          description: See KRM doc.
          example: "2021-11-08T00:00:00Z"
        marketDate:
          type: string
          title: Market Date
          description: See KRM doc.
          example: "2021-11-08T00:00:00Z"
        valuationDate:
          type: string
          title: Valuation Date
          description: See KRM doc.
          example: "2021-11-08T00:00:00Z"
        riskMethod:
          type: integer
          title: Risk Method
          description: See KRM doc.
          example: 1
        simMethod:
          type: integer
          title: Sim Method
          description: See KRM doc.
          example: 1
        productSet:
          type: string
          title: Product Set
          description: See KRM doc.
          example: x
        baseCurrency:
          type: string
          title: Base Currency
          description: See KRM doc.
          example: USD
        runStatus:
          type: integer
          title: Run Status
          description: See KRM doc, defaults to 0 when not specified.
          example: 0
        outputId:
          type: string
          title: Output ID
          description: See KRM doc.
          example: x
        curDt2:
          type: string
          description: See KRM doc.
          example: "2021-11-08T00:00:00Z"
        compVarMethod:
          type: integer
          description: See KRM doc.
          example: 0
        regCalcId:
          type: string
          description: See KRM doc.
          example: x
        dfltIssuerFlag:
          type: integer
          description: See KRM doc.
          example: 1
        riskShiftTermU:
          type: string
          description: See KRM doc.
          example: "Y"
        histSkip:
          type: integer
          description: See KRM doc.
          example: 1
        distRunFlag:
          type: integer
          description: See KRM doc.
          example: 1
        riskMeasure:
          type: integer
          description: See KRM doc.
          example: 0
        riskShiftTerm:
          type: integer
          description: See KRM doc.
          example: 1
        fcstPhFlag:
          type: integer
          description: See KRM doc.
          example: 1
        cutSetId:
          type: string
          description: See KRM doc.
          example: x
        dfltRefFlag:
          type: integer
          description: See KRM doc.
          example: 0
        negRtFlag:
          type: integer
          description: See KRM doc.
          example: 1
        rptSetId:
          type: string
          description: See KRM doc.
          example: x
        srcRunId:
          type: string
          description: See KRM doc.
          example: x
        fcstMastId:
          type: string
          description: See KRM doc.
          example: x
        histDataTermU:
          type: string
          description: See KRM doc.
          example: "Y"
        collatId:
          type: string
          description: See KRM doc.
          example: x
        divId:
          type: string
          description: See KRM doc.
          example: x
        ycFlag:
          type: integer
          description: See KRM doc.
          example: 1
        rebalSetId:
          type: string
          description: See KRM doc.
          example: x
        crHorizonTermU:
          type: string
          description: See KRM doc.
          example: x
        fcstTypeId:
          type: string
          description: See KRM doc.
          example: x
        baseCalcFlag:
          type: integer
          description: See KRM doc.
          example: 0
        ycSetId:
          type: string
          description: See KRM doc.
          example: x
        tpMastId:
          type: string
          description: See KRM doc.
          example: x
        varMvFlag:
          type: integer
          description: See KRM doc.
          example: 0
