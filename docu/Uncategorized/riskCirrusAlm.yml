        detailLevelDescriptions:
          type: array
          items:
            type: string
          description: The ordered detailed descriptions associated with the detail
            values
          example: ["Base case only", "Base case + scenarios"]
    reportingPeriodSet:
      title: Reporting Period Set
      description: An ordered, contiguous set of reporting periods
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
        key:
          type: string
          description: The unique (amongst objects of this type in this deployment),
            user-managed ID for this reporting set
          example: month_30_yr
        description:
          type: string
          description: A description of this reporting period set object
          example: The monthly periods for 30 years
        reportSetFlag:
          type: integer
          description: Gives how the periods are defined.  Valid values are 1, 2,
            3.   1=date-based, 2=term-based, 3=irrbb.
          example: 1
        dateBasedReportingPeriods:
          type: array
          items:
            $ref: '#/components/schemas/dateBasedReportingPeriod'
          description: An ordered set of date-based reporting periods that make up
            the core of this object.  reportSetFlag must be 1 if these are included.
        termBasedReportingPeriods:
          type: array
          items:
            $ref: '#/components/schemas/termBasedReportingPeriod'
          description: An ordered set of term-based reporting periods that make up
            the core of this object.  reportSetFlag must be 2 if these are included.
    dateBasedReportingPeriod:
      title: Date-Based Reporting Period
      description: A reporting period that is date-based
      type: object
      properties:
        label:
          type: string
          description: The label for the period.  This will typically be shown in
            reports that use this reporting period.
        startDate:
          type: string
          description: The date which starts this reporting period (inclusive).
        endDate:
          type: string
          description: The date which ends this reporting period (inclusive).
    termBasedReportingPeriod:
      title: Term-Based Reporting Period
      description: A reporting period that is term-based
      type: object
      properties:
        label:
          type: string
          description: The label for the period.  This will typically be shown in
            reports that use this reporting period.
        endTerm:
          type: integer
          description: A value indicating how many endTermUnits this period is for
            (must be >= 1).
        endTermUnit:
          type: string
          description: A value indicating the unit of days this period is for (one
            of D W M Q S Y - for day, week, month, quarter, semiannual, and year).
    link:
