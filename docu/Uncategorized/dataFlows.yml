    put:
      tags:
      - StepCategories
      summary: Update a step category
      description: Updates the step category with the provided step category ID. The
        ETag provided by the If-Match header is verified before the update occurs.
        If a step category ID is supplied in the request body, it must match the step
        category ID provided in the path parameter. If the user is a SAS Admin user
        and the step category with the provided ID does not exist and no specific
        ETag is provided, a new step category is created with the provided step category
        ID. Name, description, metadataVersion, etc. are saved from the request, and
        modifiedBy and modifiedTimeStamp are set by the service.
      operationId: updateStepCategory
      parameters:
      - name: categoryId
        in: path
        description: The ID of the step category.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the step category.
        schema:
          type: string
      requestBody:
        content:
