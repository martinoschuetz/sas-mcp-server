      summary: Update a data flow
      description: Updates the data flow with the provided data flow ID. The ETag
        provided by the If-Match header is verified before the update occurs. If a
        data flow ID is supplied in the request body, it must match the data flow
        ID provided in the parameter. To update dataflows, users need to have authorized
        access to the folders where the data flows reside. If the user is a SAS Admin
        user and the data flow with the provided data flow ID does not exist and no
        specific ETag is provided, a new data flow is created with the provided data
        flow ID. Name, description, connections, parameters, properties, and nodes
        are saved from the request, and modifiedBy and modifedTimeStamp are set by
        the service.
