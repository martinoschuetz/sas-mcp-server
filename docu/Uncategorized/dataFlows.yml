      parameters:
      - name: dataFlowId
        in: path
        description: The ID of the data flow.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the data flow.
        schema:
          type: string
      - name: keepTransferAttributes
        in: query
        description: if true, keep the attributes previously set by transfer import
          if any (like "__dfTransferFetchFromURIFailed"); if false, remove those attributes
          during update. Default is false.
        required: false
        schema:
