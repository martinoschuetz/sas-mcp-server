    hashingCalculateColumn:
      title: hashingCalculateColumn
      description: Transforms a message into a digest in hexadecimal representation.
        "outColumn" is not needed when used as an argument to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
