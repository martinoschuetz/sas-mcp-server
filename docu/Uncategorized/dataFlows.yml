  /flowToCatalogMetadataArchive:
    post:
      tags:
      - Catalog
      operationId: covertFlowToCatalogMetadataArchive
      summary: Convert a dataflow to a catalog metadata archive
      description: |
        Given a data flow, converts the data flow to a catalog metadata archive and optionally posts it to catalog service.
          The data flow is assumed to have an id. If it has no id, then one must be provided via the parameters. You can
          either specify the id parameter, or you can specify a combination of filename and context which will be used to create an id.
          If you specify createInstance then the created catalog metadata archive will be posted to catalog service.
      parameters:
      - name: createInstance
        in: query
        description: if true, post the created catalog metadata archive to catalog
          service
        required: false
        schema:
          type: boolean
          default: false
      - name: dataFlowId
        in: query
        description: the dataflow id to create the catalog metadata archive for, if
          supplied, filename and context are ignored
        required: false
        schema:
          type: string
      - name: filename
        in: query
        description: filename path to use when creating an id for dataflows in file
          system
        required: false
        schema:
          type: string
      - name: context
        in: query
        description: context to use when creating an id for dataflows in file system
        required: false
        schema:
          type: string
      requestBody:
        description: data flow to convert to a catalog metadata archive
        content:
          application/vnd.sas.data.flow+json:
            schema:
              $ref: "#/components/schemas/dataFlow"
