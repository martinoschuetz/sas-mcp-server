          type: string
          description: Computes expression and assigns to outColumn
          enum:
          - expression
        expressionText:
          type: string
      required:
      - outColumn
      - operation
      - expressionText
    loadTableStep:
      title: LoadTableStep
      description: Load data into a table.
      type: object
      properties:
        inTable:
          $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/parameterReference"
        loadTechnique:
          type: string
          enum:
          - insert
          - update
          - upsert
          description: Indicates the load technique. "insert" means insert new rows
            into the target table. "update" means update existing rows in the target
            table. "upsert" means update existing rows in the target table and insert
            new rows into the target table. Default is "insert".
        insertMethod:
          type: string
          enum:
          - procSqlInsert
          - procAppend
          description: Indicates the method to insert new rows into the target table
            when Load technique "insert" is selected. "procSqlInsert" means use the
            SQL procedure to insert new rows into the target table. "procAppend" means
            use the APPEND procedure to insert new rows into the target table.
        upsertMethod:
          type: string
          enum:
          - procSqlInsertUpdate
          - procAppendInsertProcSqlUpdate
          - procAppend
          - procSqlExplicit
          description: Indicates the method to insert new rows and update existing
            rows in the target table when Load technique "upsert" is selected. "procSqlInsertUpdate"
            means use the SQL procedure to insert new rows and update existing rows
            in the target table. "procSqlInsertUpdate" is the default upsertMethod
            when no other default methods apply. "procAppendInsertProcSqlUpdate" means
            use the APPEND procedure to insert new rows and use the SQL procedure
            to update existing rows in the target table. "procAppend" means use the
            APPEND procedure to insert new rows and update existing rows in the target
            table. "procAppend" is the default upsert method when available for the
            target table data source. "procSqlExplicit" means use explicit SQL pass
            through to insert new rows and update existing rows in the target table
            and when available is the default.
        appendForce:
          type: boolean
          description: Valid when insertMethod or upsertMethod value selected is "procAppend".
            If true then add FORCE option to the APPEND procedure. Default is false.
        appendNowarn:
          type: boolean
          description: Valid when appendForce is set to true. If true then add NOWARN
            option to the APPEND procedure. Default is false.
        allowCreate:
          type: boolean
          description: Valid when load technique is "insert" or "upsert". If true
            and target table does not exist it is created. Default is true.
        preprocessAction:
          type: string
          enum:
          - noAction
          - truncate
          - delete
          - replace
          description: Indicates the preprocessing action to perform on the target
            table when load technique is "insert". "noAction" means perform no preprocssing.
            "truncate" means truncate target table. "delete" means delete all rows
            from the target table. "replace" means drop and replace the target table.
            Default is "noAction".
        indexRecreateAction:
          type: string
          enum:
          - noAction
          - beforeLoad
          - afterLoad
          description: Indicates the index recreate action to perform on the target
            table. "beforeLoad" means recreate the indexes on the target table before
            loading data. "afterLoad" means recreate the indexes on the target table
            after loading data. Note, indexes are dropped from the target table prior
            to loading data regardless of the indexRecreateAction setting. Default
            is "afterLoad".
        asyncIndex:
          type: boolean
          description: Valid when indexRecreateAction is "beforeLoad" or "afterLoad".
            If true then recreate indexes asynchronously. If false then recreate indexes
            synchronously. Default is false.
        keyColumns:
          type: array
          description: Array of columns that uniquely identifies matching rows between
            a source table and target table. Populate if loadTechnique is "update"
            or "upsert".
          items:
            $ref: "#/components/schemas/columnReference"
        outputTableArguments:
          $ref: "#/components/schemas/outputTableArguments"
      required:
      - inTable
      - outTable
    deleteRowsStep:
      title: DeleteRowsStep
      description: Delete rows in a table.
      type: object
      properties:
        inTables:
          title: Input Tables for WHERE clause
          description: Optional auxiliary tables used in the WHERE clause (e.g., for
            joins or subqueries). Not required for simple filters on the target table.
          type: array
          minItems: 0
          items:
            $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/parameterReference"
        deleteTechnique:
          type: string
          enum:
          - delete
          - truncate
          - where
          description: Indicates the delete technique. "delete" means all rows are
            deleted via "DELETE FROM". "truncate" means all rows are deleted via "TRUNCATE
            TABLE". "where" means specific rows are deleted via a WHERE clause, optionally
            using inTables.
        truncateOptions:
          type: string
          description: Options specific to the TRUNCATE TABLE statement. Only applicable
            when deleteTechnique is "truncate".
        whereFormattedFilter:
          type: string
          description: >-
            A SQL WHERE expression as a plain string (without the WHERE keyword).
            Supports multi-line input.
            Each line will be trimmed of whitespace and empty lines will be ignored.
            Used only when deleteTechnique is "where".
            When explicitSqlSource is false (default), the expression must use SAS
            SQL syntax
            (e.g., date literals like '01JAN2024'd, name literals like "col name"n).
            When explicitSqlSource is true, the expression must use the target database's
            native SQL syntax (e.g., Oracle DATE '2024-01-01', SingleStore backtick-quoted
            identifiers).
        whereQuickFilters:
          type: array
          description: >-
            An array of structured filter conditions created via the UI dialog.
            Each item specifies operator, column, value(s), and logical operator.
            Used only when deleteTechnique is "where".
            Ignored if whereFormattedFilter is also present.
          items:
            $ref: "#/components/schemas/queryQuickFilter"
        allowCreate:
          type: boolean
          description: Default is true. If true and the target table does not exist,
            it is created.
        procSqlOptions:
          type: string
          description: General Proc SQL options applied to the statement. Valid for
            all delete techniques.
        explicitSqlSource:
          type: boolean
          description: >-
            Use explicit SQL pass-through for WHERE and DELETE techniques, defaults
            to false.
            When true, explicit pass-through SQL is generated (supported for Oracle,
            Teradata,
            Snowflake, SQL Server/Synapse, and SingleStore engines only).
            When false (default), implicit SAS PROC SQL is generated.
            For CAS and SAS/BASE engines, this value is always treated as false.
            Not applicable for deleteTechnique "truncate".
        outputTableArguments:
          $ref: "#/components/schemas/outputTableArguments"
      required:
      - outTable
    mergeTableStep:
      title: MergeTableStep
      description: Insert rows and update existing rows in a target table by using
        matching rows from the source table based on one or more key columns.
      type: object
      properties:
        inTable:
          $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/parameterReference"
        isUserWrittenCode:
          type: boolean
          description: true if user writes their own code for mergeTableStep
        userWrittenCode:
          type: string
          description: Substitute this user writen code for mergeTableStep when isUserWrittenCode
            is true
        keyColumns:
          type: object
          description: May consist of an expression or an array of columns that uniquely
            identifies matching rows between a source table and target table.
          properties:
            matchColumns:
              type: array
              items:
                $ref: "#/components/schemas/columnDefinitionReference"
            isExpression:
              type: boolean
              description: true if ON clause is an expression
            expressionText:
              type: string
              description: expression to use for ON clause when isExpression is true
        updateRows:
          type: array
          description: Columns to be updated mapped to another column data or expression.
          items:
            type: object
            description: targetColumn is left hand side of equation. Right hand side
              can be a single column or an expression. If it is a single column then
              the only entry in impactedColumns property (array) is the source column.
              In case of an expression, there could be multiple columns on the right
              side of the equation. In such an event impactedColumns property in columnDefinitionReference
              contains list of all columns on the right side of the equation.
            properties:
              targetColumn:
                $ref: "#/components/schemas/columnDefinitionReference"
              isCalculated:
                type: boolean
                description: true if target column is to be updated with an expression
              expressionText:
                type: string
                description: expression to use for column when isCalculated is true
        insertRows:
          type: array
          description: Columns to insert values into are mapped to another column
            data or expression.
          items:
            type: object
            description: insertIntoColumn is left hand side of equation. Right hand
              side can be a single column or an expression. If it is a single column
              then the only entry in impactedColumns property (array) is the source
              column. In case of an expression, there could be multiple columns on
              the right side of the equation. In such an event impactedColumns property
              in columnDefinitionReference contains list of all columns on the right
              side of the equation.
            properties:
              targetColumn:
                $ref: "#/components/schemas/columnDefinitionReference"
              isCalculated:
                type: boolean
                description: true if insert into column is to be updated with an expression
              expressionText:
                type: string
                description: expression to use to insert value to insertIntoColumn
                  when isCalculated is true
      required:
      - inTable
      - outTable
    implementSCDStep:
      title: ImplementSCDStep
      description: Implement Slowly Changing Dimensions (SCD) type 1 and type 2 management
        techniques to load data into a dimension table. At least one management technique
        (SCD type 1 or type 2) must be defined.
      type: object
      properties:
        inTable:
          $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/parameterReference"
        businessKeyColumns:
          type: array
          description: Array of columns that uniquely identifies each row in an entity.
          items:
            $ref: "#/components/schemas/columnDefinitionReference"
        type1Columns:
          type: array
          description: Array of columns that are tracked for SCD type 1 changes.
          items:
            $ref: "#/components/schemas/columnDefinitionReference"
        type2:
          type: object
          description: The following properties are related to SCD type 2 management
            technique.
          properties:
            type2Columns:
              type: array
              description: Array of columns that are tracked for SCD type 2 changes.
              items:
                $ref: "#/components/schemas/columnDefinitionReference"
            beginDate:
              type: object
              description: Column to map to begin date for SCD Type 2 change tracking.
                Required for SCD type 2 change tracking method.
              items:
                type: object
                description: The begin date information used for SCD type 2 change
                  tracking.
                properties:
                  beginDateColumn:
                    $ref: "#/components/schemas/columnDefinitionReference"
                  beginDateExpression:
                    type: string
                    description: The expression that defines the change begin date.
                      The default expression is database specific.
                required:
                - beginDateColumn
            endDate:
              type: object
              description: Column to map to end date for SCD type 2 change tracking.
                Required for SCD type 2 change tracking method.
              items:
                type: object
                description: The end date information used for SCD type 2 change tracking.
                properties:
                  endDateColumn:
                    $ref: "#/components/schemas/columnDefinitionReference"
                  endDateExpression:
                    type: string
                    description: The expression that defines the change end date.
                      The default expression is database specific.
                  futureDateExpression:
                    type: string
                    description: The expression that defines the future date. The
                      default expression is database specific.
                required:
                - endDateColumn
            currentRecordFlag:
              type: object
              description: Column to map to the current record flag for SCD type 2
                change tracking. Required for SCD type 2 change tracking method.
              items:
                type: object
                description: The current record flag information used for SCD Type
                  2 change tracking.
                properties:
                  currentRecordFlagColumn:
                    $ref: "#/components/schemas/columnDefinitionReference"
                  currentRecordFlagExpression:
                    type: string
                    description: The expression that defines the current record flag
                      value. The default value is 'Y' for character type column and
                      '1' for numeric type column.
                  notCurrentRecordFlagExpression:
                    type: string
                    description: The expression that defines the not current record
                      flag value. The default value is 'N' for character type column
                      and '0' for numeric type column.
                required:
                - currentRecordFlagColumn
            surrogateKeyColumn:
              type: object
              description: The column that contains system generated values used to
                uniquely identify rows in a dimension table. Required for SCD type
                2 change tracking method.
              items:
                $ref: "#/components/schemas/columnDefinitionReference"
            generateRetainedSurrogateKey:
              type: boolean
              description: If true, generate a surrogate key value that is retained
                within a given business key or keys. Default is false.
        insertColumns:
          type: array
          description: Array of columns that are to be inserted into the target table
            to form new rows and type 2 rows.
          items:
            $ref: "#/components/schemas/columnDefinitionReference"
        isUserWrittenCode:
          type: boolean
          description: True if user writes their own code for implementSCDStep.
        userWrittenCode:
          type: string
          description: Substitute this user writen code for implementSCDStep when
            isUserWrittenCode is true
      required:
      - inTable
      - outTable
      - businessKeyColumns
      - insertColumns
    sqlSetOperator:
      title: SqlSetOperator
      description: SQL set operator to use with SQL set operation
      type: object
      properties:
        operator:
          type: string
          description: SQL set operator
          enum:
          - union
          - union all
          - outer union
          - except
          - except all
          - intersect
          - intersect all
        useCorresponding:
          type: boolean
          description: If true, use corresponding option to combine columns by column
            name instead of column position
        useDataStep:
          type: boolean
          description: If true and operator 'outer union' is selected and useCorresponding
            is true then generate data step code.
      required:
      - operator
    sqlSetOperatorQuery:
      title: SqlSetOperatorQuery
      description: SQL set operator query to use with SQL set operation
      type: object
      properties:
        selectDistinct:
          type: boolean
          description: Remove duplicate rows, default is false.
        selectStar:
          type: boolean
          description: If true select all columns (*), default is false.
        selectedColumns:
          type: array
          description: Required if selectStar property is false.
          items:
            $ref: "#/components/schemas/querySelectedColumn"
        queryTable:
          type: object
          items:
            $ref: "#/components/schemas/queryTable"
        whereFormattedFilter:
          type: string
          description: A hand coded where filter.
      required:
      - queryTable
    unionRowsStep:
      title: UnionRowsStep
      description: Combine multiple queries into a single result set using SQL set
        operators.
      type: object
      properties:
        sessionId:
          type: string
          description: CAS session id to use when using fedSQL to CAS.
        sqlSetOperatorQueries:
          type: array
          description: Array of SQL set operator queries. A minimum of two queries
            is required.
          items:
            $ref: "#/components/schemas/sqlSetOperatorQuery"
        sqlSetOperators:
          type: array
          description: Array of SQL set operators. A minimum of one operator is required.
          items:
            $ref: "#/components/schemas/sqlSetOperator"
        outputTable:
          $ref: "#/components/schemas/portReference"
      required:
      - sqlSetOperatorQueries
      - sqlSetOperators
      - outputTable
    lookupStep:
      title: LookupStep
      description: The Lookup step efficiently joins data from a source table with
        one or more lookup tables. Matching Keys - The step matches foreign keys in
        the source table to corresponding primary keys in the lookup table. This establishes
        a relationship between a source table and lookup table. Extracting Values
        - Based on the matches, user selected columns are extracted from the lookup
        table(s). Creating the Output - The Lookup step combines user selected columns
        from both the source and lookup tables to form a new output table. The Output
        table is deleted if it exists.
      type: object
      properties:
        inTable:
          $ref: "#/components/schemas/portReference"
        lookupTables:
          title: LookupTables
          description: Tables to lookup column information from
          type: array
          items:
            $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/portReference"
        errorTable:
          $ref: "#/components/schemas/portReference"
        exceptionTable:
          $ref: "#/components/schemas/portReference"
        sourceToLookupMap:
          type: array
          description: One array element per lookup table. A lookup table contains
            primary keys and data columns. Primary Keys - These columns establish
            the link with matching foreign keys in the source table. Data Columns
            - These hold the specific values user wants to extract and include in
            the final output table.
          items:
            type: object
            description: consists of lookup table and foreign key, primary key relationships.
              One array element per lookup table.
            properties:
              keyColumns:
                type: array
                description: one or more foreign key and primary key column mappings
                properties:
                  foreignKeyColumn:
                    $ref: "#/components/schemas/columnModelReference"
                  primaryKeyColumn:
                    $ref: "#/components/schemas/columnModelReference"
              lookupExceptions:
                type: array
                description: error and exception handling. Condition, Action, Action
                  Option, Action Value.
                items:
                  type: object
                  properties:
                    condition:
                      type: integer
                      description: specifies condition which has the following meaning.
                        1 - Lookup table missing 2 - Lookup table contains no records
                        3 - Lookup value missing
                      enum:
                      - 1
                      - 2
                      - 3
                    action:
                      type: integer
                      description: specifies action which has the following meaning.
                        1 - Abort process 2 - Add row to error table 3 - Add row to
                        exception table 4 - Set target column value 5 - Set target
                        column value to missing 6 - Skip the record
                      enum:
                      - 1
                      - 2
                      - 3
                      - 4
                      - 5
                      - 6
                    optionValue:
                      type: string
                      description: consists of a value or an expression for given
                        condition and action.
                    optionTargetColumn:
                      $ref: "#/components/schemas/columnDefinitionReference"
              whereFormattedFilter:
                type: string
                description: a hand coded where filter
        outputColumns:
          type: array
          description: This array defines the columns included in the output table.
            Columns can be selected from both the source and lookup tables.
          items:
            $ref: "#/components/schemas/columnDefinitionReference"
        createErrorTable:
          type: boolean
          description: Create error table, default is false.
        errorTableColumns:
          type: array
          description: This array defines the columns to include in the error table.
            Error table columns are selected columns from the source table. A minimum
            of one source column must be selected from the source table. The default
            source columns selected are all source table columns.
          items:
            $ref: "#/components/schemas/columnDefinitionReference"
        createExceptionTable:
          type: boolean
          description: Create exception table, default is false.
        exceptionTableColumns:
          type: array
          description: This array defines the columns included in the exception table.
            Columns are strings to be used in the SAS macro execution. primary key
            column names are first selected followed by expressions %nrstr("&&_flw_lt&i._lib_table."
            as _flw_lookup_table length = 41) 'Lookup table missing' as _flw_exception_condition
            length = 32 'Add row to exception table' as _flw_exception_action length
            = 32;
          items:
            $ref: "#/components/schemas/columnDefinitionReference"
        limitErrors:
          type: boolean
          description: Limit the number of errors in the error and exception tables,
            default is false.
        errorLimit:
          type: integer
          description: Number of errors to limit in the error and exception tables,
            default is 10.
        errorLimitAction:
          type: integer
          description: Specifies the error limit action. 1 - Abort the flow 2 - Ignore
            all remaining errors
          enum:
          - 1
          - 2
        matchNullKeys:
          type: boolean
          description: If true, null values in the source table foreign key columns
            are matched with null values in the primary key columns of the lookup
            tables. Default is true.
      required:
      - inTable
      - lookupTables
      - outTable
      - outputColumns
    summaryTablesStep:
      title: SummaryTables
      description: Display descriptive statistics in tabular format, using some or
        all of the variables in a data set.
      type: object
      properties:
        analysisVars:
          type: array
          description: array of variables for the analysis
          items:
            $ref: "#/components/schemas/columnReference"
        classVars:
          type: array
          description: array of character or discrete numeric variables to use to
            divide the input data into categories or subgroups
          items:
            $ref: "#/components/schemas/classColumn"
        pages:
          type: array
          description: array of variables for which a separate summary table is generated
            for each of their distinct value
          items:
            $ref: "#/components/schemas/columnReference"
        weight:
          type: object
          description: Specifies variable to use to calculate the weighted means,
            variances, and sums
        frequency:
          type: object
          description: Specifies the variable that contains the frequency count for
            each row in the table. Each role is assumed to represent n observations,
            where n is the value of the frequency count for that row.
        title:
          type: string
          description: title text for the results, macro variables are allowed
        footnote:
          type: string
          description: footnote text for the results, macro variables are allowed
        columnDimensions:
          type: array
          description: Array of character or discrete numeric variables to use that
            make up the columns to divide the input data into categories or subgroups
          items:
            $ref: "#/components/schemas/summaryTablesDimension"
        rowDimensions:
          type: array
          description: Array of character or discrete numeric variables to use that
            make up the rows to divide the input data into categories or subgroups
          items:
            $ref: "#/components/schemas/summaryTablesDimension"
        inTable:
          $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/portReference"
      required:
      - inTable
      - columnDimensions
    classColumn:
      title: classColumn
      description: Column with additional classification variable properties for summary
        table
      type: object
      properties:
        inColumn:
          type: object
          description: character or numeric column to be used as class variables for
            summary table
        sortBy:
          type: string
          description: specifies the order to group the levels of the class variables
            in the output
          enum:
          - data
          - formatted
          - unformatted
          - freq
        useDescendingOrder:
          type: boolean
          description: specifies to sort the class variable values in descending order
            when true and in ascending order when false
        excludeMissingVal:
          type: boolean
          description: excludes missing values as valid class variable levels when
            true, includes missing values as valid class variable levels when false
        restrictLevelsToFormatValues:
          type: boolean
          description: when true, excludes from tables and output data sets all combinations
            of class variables that are not found in the preloaded range of user-defined
            formats.
        usePreloadFormat:
          type: boolean
          description: when true, specifies that all formats are preloaded for the
            class variables
        enableMultiLabelFormats:
          type: boolean
          description: when true, enables to use the format label or labels for a
            given range or overlapping ranges to create subgroup combinations when
            a multilabel format is assigned to a class variable
        headingFormat:
          type: string
          description: a format to be used with the class variable, the formatted
            values are used as the category's headings
      required:
      - inColumn
    summaryTablesDimension:
      title: summaryTablesDimension
      description: Defines the content and appearance of a dimension (the columns,
        rows, or pages in the summary table) by specifying class variables, analysis
        variables, the universal class variable ALL, or statistics keywords. The properties
        inColumn, statistics, and useClassVarAll are mutually exclusive. When inColumn
        is specified, then the analysis or class variable defined in inColumn will
        be used. When inColumn is not specified, and statistics is specified, then
        the statistics will be used. When inColumn and statistics are not specified,
        and the useClassVarAll is specified, then the useClassVarAll will be used.
      type: object
      properties:
        inColumn:
          type: object
          description: analysis variable or class variable to be used as this dimension
            for summary table
        statistics:
          type: string
          description: statistics keyword to be used as this dimension for summary
            table
        useClassVarAll:
          type: boolean
          description: true if using the universal class variable ALL for this dimension
            for summary table
        headingProperties:
          type: object
          description: a set of options for individual column or row headings, including
            custom label, format, and font setting
        childrenDimensions:
          type: array
          description: array of other variables that this dimension use to divide
            data further into more categories or subgroups
          items:
            $ref: "#/components/schemas/summaryTablesDimension"
    headingProperties:
      title: a set of options for individual column or row headings, including label,
        format, and font setting
      description: a set of options for individual column or row headings, including
        label, format, and font setting, currently supporting only label in the initial
        release
      type: object
      properties:
        label:
          type: string
          description: a label for the row or column heading
    executeRuleDefinitionsStep:
      title: ExecuteRuleDefinitions
      description: Execute business rules defined in the Data Quality Monitoring service.
      type: object
      properties:
        inTable:
          $ref: "#/components/schemas/portReference"
        detailsTable:
          $ref: "#/components/schemas/portReference"
        summaryTable:
          $ref: "#/components/schemas/portReference"
        execEnv:
          type: string
          enum:
          - 14f7ac7e-37d8-4744-b4c7-5544bc52a19d
          - 347963d3-d196-464e-9865-199c195b0820
          description: Specifies the uuid for the execution domain. The domains are
            defined in the DQM service, and there are currently two domains defined
            (SAS and Great Expectations). The default value is 14f7ac7e-37d8-4744-b4c7-5544bc52a19d,
            which corresponds to the SAS domain.
        rules:
          type: array
          description: array of rule definitions to execute
          items:
            type: object
            description: selected rule definitions from DQM service with mapped input
              columns and output column names
            properties:
              draft:
                type: boolean
                description: true if the rule definition is in draft state, false
                  if it is published
              id:
                type: string
                description: the uuid for the rule definition
              name:
                type: string
                description: rule definition name
              outputColumnName:
                type: string
                description: the name of the output column for the rule definition
              parameters:
                type: array
                description: array of parameters for the rule definition
                items:
                  type: object
                  description: selected parameters for the rule definition with mapped
                    input columns and values for other parameters
                  properties:
                    fieldId:
                      type: string
                      description: the uuid for the corresponding parameter field
                        in the rule template
                    id:
                      type: string
                      description: the uuid for the parameter
                    inputColumn:
                      type: object
                      description: specifies the variable to use to execute the rule
                    value:
                      type: string
                      description: the value for the parameter when the parameter
                        is not mapped to an input column
                    version:
                      type: integer
                      description: the version number for the parameter
              revisionId:
                type: string
                description: the uuid for the rule definition revision
              revisionNumber:
                type: integer
                description: the revision number for the rule definition
              revisionUri:
                type: string
                description: the uri for the rule definition revision
              template:
                type: object
                description: the rule template associated with the rule definition
                properties:
                  createdBy:
                    type: string
                    description: the creator for the rule template
                  creationTimeStamp:
                    type: string
                    description: the creation timestamp for the rule template
                  draft:
                    type: boolean
                    description: true if the rule template is in draft state, false
                      if it is published
                  fields:
                    type: array
                    description: array of fields for the rule template
                    items:
                      type: object
                      description: the field definition for the rule template
                      properties:
                        argumentTypeId:
                          type: string
                          description: the uuid for the argument type for the field
                        context:
                          type: string
                          description: the context for the field
                        id:
                          type: string
                          description: the uuid for the field
                        name:
                          type: string
                          description: the name for the field
                        properties:
                          type: object
                          description: the properties for the field
                        required:
                          type: boolean
                          description: true if the field is required, false if it
                            is optional
                        version:
                          type: integer
                          description: the version number for the field
                  id:
                    type: string
                    description: the uuid for the rule template
                  implementations:
                    type: array
                    description: array of implementations for the rule template
                    items:
                      type: object
                      description: the implementation for the rule template in a specific
                        execution domain
                      properties:
                        domainId:
                          type: string
                          description: the uuid for the execution domain
                        expression:
                          type: string
                          description: the code for this implementation
                        id:
                          type: string
                          description: the uuid for this implementation
                        version:
                          type: integer
                          description: the version number for this implementation
                  mode:
                    type: string
                    description: the mode for the rule template
                  modifiedBy:
                    type: string
                    description: the last modifier for the rule template
                  modifiedTimeStamp:
                    type: string
                    description: the last modified timestamp for the rule template
                  name:
                    type: string
                    description: the name for the rule template
                  revisionId:
                    type: string
                    description: the uuid for the rule template revision
                  revisionNumber:
                    type: integer
                    description: the revision number for the rule template
                  revisionUri:
                    type: string
                    description: the uri for the rule template revision
                  version:
                    type: integer
                    description: the version number for the rule template
              templateRevisionUri:
                type: string
                description: the uri for the rule template revision
              version:
                type: string
                description: the selected version for the rule definition
        detailsTableColumnOption:
          type: string
          enum:
          - selectAll
          - selectMapped
          - selectSpecific
          description: Specifies how to include the variables from the input table
            into the details table, default is all.
        detailsTableColumns:
          type: array
          description: array of variables from input table to include in details table
          items:
            $ref: "#/components/schemas/columnReference"
      required:
      - inTable
      - detailsTable
      - summaryTable
      - rules
    compareDataStep:
      title: CompareData
      description: Compare the contents of two SAS data sets, selected variables in
        different data sets, or variables within the same data set.
      type: object
      properties:
        baseTable:
          $ref: "#/components/schemas/portReference"
        compareTable:
          $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/portReference"
        outStatsTable:
          $ref: "#/components/schemas/portReference"
        isCompareSameDataset:
          type: boolean
          description: Indicates whether the comparison dataset is the same as the
            base dataset, default is false.
        isMatchDataByID:
          type: boolean
          description: Indicates whether data will be compared by ID variable. The
            default is false, which indicates data will be compared by observation
            variable.
        isCompareAll:
          type: boolean
          description: Indicates whether data will be compared across all variables,
            default is false. When set to false, data will be compared across a subset
            of selected variables.
        baseVars:
          type: array
          description: array of variables from base table
          items:
            $ref: "#/components/schemas/columnReference"
        compVars:
          type: array
          description: array of variables from comparison table
          items:
            $ref: "#/components/schemas/columnReference"
        idVars:
          type: array
          description: array of variables to use in ID statement, must be present
            in base and comparison table
          properties:
            ascending:
              type: boolean
              description: sort ascending on this column if true, else sort descending,
                the default is false.
            baseColumn:
              $ref: "#/components/schemas/columnReference"
            compareColumn:
              $ref: "#/components/schemas/columnReference"
        isEqualityCriterionChecked:
          type: boolean
          description: use non-default comparison criterion, default is true.
        criterion:
          type: number
          description: specifies the criterion for judging the equality of numeric
            values, default is 0.00001.
        useNoMissBase:
          type: boolean
          description: judges a missing value in the base data set equal to any value,
            default is false.
        useNoMissComp:
          type: boolean
          description: judges a missing value in the comparison data set equal to
            any value, default is false.
        equalityMethod:
          type: string
          enum:
          - absolute
          - exact
          - percent
          - relative
          description: Specifies the method for judging the equality of numeric values,
            default is exact.
        createOutputTable:
          type: boolean
          description: create output table, default is true.
        useOutBase:
          type: boolean
          description: writes an observation to the output data set for each observation
            in the base data set, default is true.
        useOutComp:
          type: boolean
          description: writes an observation to the output data set for each observation
            in the comparison data set, default is true.
        useOutDif:
          type: boolean
          description: writes an observation to the output data set for each pair
            of matching observations, default is true.
        useOutPercent:
          type: boolean
          description: writes an observation to the output data set for each pair
            of matching observations, default is false.
        useOutNoEqual:
          type: boolean
          description: suppresses the writing of an observation to the output data
            set when all values in the observation are judged equal, default is true.
        createOutputStatsTable:
          type: boolean
          description: create output statistics table, default is false.
        maxPrint:
          type: integer
          description: maximum number of observations to print, default is 50.
      required:
      - baseTable
    metadataArchive:
      type: object
      description: MetadataArchive is the collection of metadata information related
        to objects within a service or system. This allows for sharing a graph of
        related objects or entities, how they are related, and how to classify or
        organize them.
      properties:
        anchor:
          $ref: '#/components/schemas/anchor'
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/classification'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/entity'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/relationship'
        version:
          type: integer
      required:
      - anchor
    anchor:
      type: object
      description: Anchor provides the information about the object which will manage
        the entities, relationships, and classifications within the metadata archive.
        This typically is the root or base object such as a report which models the
        internal objects such as report sections or report dataItems within the set
        of report metadata.
      properties:
        uri:
          type: string
          description: URI for the service object used to access this entity within
            the service object API
        instanceId:
          type: string
          description: Catalog instance identity of the entity
    instance:
      type: object
      description: Instance is the abstract metadata structure for any instance of
        an entity, classification, or relationship.
      properties:
        anchor:
          $ref: '#/components/schemas/anchor'
        attributes:
          type: object
          additionalProperties: true
          description: Attributes from the catalog defined from the type definition
        definitionId:
          type: string
        description:
          type: string
          maxLength: 1000
        instanceId:
          type: string
        name:
          type: string
          maxLength: 1000
        label:
          type: string
          maxLength: 255
        type:
          type: string
        version:
          type: integer
    entity:
      description: Entity is the information about a entity instance, and any classifications
        that apply to this entity.
      allOf:
      - $ref: '#/components/schemas/instance'
      - type: object
        properties:
          uri:
            type: string
            description: URI of the service object for this entity
          classifications:
            type: array
            items:
              type: string
            description: Names of the classifications to apply to this entity
    classification:
      description: Classification is information about a classification instance,
        and any entities that it applies to.
      allOf:
      - $ref: '#/components/schemas/instance'
      - type: object
        properties:
          entities:
            type: array
            items:
              type: string
            description: URIs of the entities to apply this classification to
    relationship:
      description: Relationship defines the metadata and relationship endpoints relating
        two entities.
      allOf:
      - $ref: '#/components/schemas/instance'
      - type: object
        properties:
          endpoint1Id:
            type: string
          endpoint1Uri:
            type: string
          endpoint2Id:
            type: string
          endpoint2Uri:
            type: string
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
