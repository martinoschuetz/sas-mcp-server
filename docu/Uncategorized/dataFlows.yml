servers:
- url: http://example.com/dataFlows
  description: mock server
components:
  schemas:
    trackedResource:
      type: object
      description: Provides common attributes around tracking who and when objects
        were created and modified to representation objects.
      properties:
        createdBy:
          type: string
          example: etladm
          description: The user ID who created this resource
        modifiedBy:
          type: string
          example: etladm
          description: The last user ID to modify this resource
        creationTimeStamp:
          type: string
          example: 2023-02-02T14:05:50.631000Z
          description: The formatted time stamp when the resource was created, in
            yyyy-mm-ddThh:mm:ssZ format
        modifiedTimeStamp:
          type: string
          example: 2023-02-02T14:05:50.631000Z
          description: The formatted time stamp when the resource was modified, in
            yyyy-mm-ddThh:mm:ssZ format
    dataFlowSummary:
      title: Data Flow Summary
      type: object
      description: summary representation of a data flow.
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          id:
            type: string
            example: 17023033-9295-486a-bd03-55ca308a7673
            description: The unique identifier of this data flow.
          version:
            type: integer
            example: 1
            description: This media type's schema version number. This representation
              is version 1.
          name:
            type: string
            example: Flow.flw
            description: The name of this data flow.
          description:
            type: string
            example: Description of the flow
            description: The description of this data flow.
          properties:
            type: object
            description: Map of user provided properties.
            items:
              type: object
          links:
            type: array
            description: Zero or more links to related resources or operations
            items:
              $ref: "#/components/schemas/link"
    dataFlow:
      title: DataFlow
      description: describes the complete details of a data flow.
      type: object
      allOf:
      - $ref: "#/components/schemas/dataFlowSummary"
      - type: object
        properties:
          sourceVersion:
            description: An optional version that can be specified to indicate which
              version of the product created the flow.
            type: integer
          nodes:
            description: Map of nodes within the data flow, the key is the id of the
              node
            type: object
            additionalProperties:
              $ref: "#/components/schemas/node"
          stickyNotes:
            description: Array of sticky notes on a dataflow
            type: array
            additionalProperties:
              $ref: "#/components/schemas/note"
            items: {}
          statusHandling:
            description: Array of statuses that include conditions, actions, and action
              options
            type: array
            items:
              $ref: "#/components/schemas/status"
          parameters:
            description: Map of parameters within the data flow, the key is the id
              of the parameter
            type: object
            additionalProperties:
              $ref: "#/components/schemas/parameter"
          connections:
            description: List of connections between nodes
            type: array
            items:
              $ref: "#/components/schemas/connection"
          extendedProperties:
            type: object
            description: Map of extended user provided properties. These extended
              properties have no limit on the length of the value.
    indexableDataFlow:
      title: Indexable DataFlow
      description: indexable data flow.
      type: object
      allOf:
      - $ref: "#/components/schemas/indexableData"
    dataFlowCollection:
      title: DataFlow Collection
      description: A collection of data flow representations.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/dataFlowSummary"
            description: Array containing data flow resources.
    port:
      title: Port
      type: object
      description: describes an input or output of a node in a data flow.  A port
        can have one or more indexes within it depending on the step definition.  If
        a port can have only one, the index for that port will always be 0.
      properties:
        node:
          type: string
          maxLength: 36
          description: id of the node that this port represents
        portName:
          type: string
          maxLength: 250
          description: name of the port, for a table node the input port is always
            "inTable" and the output port is always "outTable".  For a step node,
            the ports are defined by the step in the data flow service.
        index:
          type: integer
          minimum: 0
          description: index of the port with the given name.
    connection:
      title: Connection
      type: object
      description: describes a connection from a source port to a target port, connecting
        nodes in a data flow
      properties:
        sourcePort:
          $ref: "#/components/schemas/port"
        targetPort:
          $ref: "#/components/schemas/port"
    note:
      title: Note
      type: object
      description: Base note type for node notes and sticky notes
      properties:
        properties:
          type: object
          description: Map of properties to store more information about the note,
            for example if the editor is expanded. These properties have 100 characters
            limit for the length of the key and 10240 characters limit on the length
            of the value.
        id:
          type: string
          maxLength: 36
          description: The unique identifier of this note.  The id is provided by
            the user, and must be unique among the notes within the data flow.
        name:
          type: string
          maxLength: 250
          description: The name of this note
        description:
          type: string
          description: The description of the notes i.e. the notes
    status:
      title: Status
      type: object
      description: Base status type for flow and step level status handling
      properties:
        condition:
          type: string
          description: The condition to be met. The "flowStatus" condition is valid
            for flow level status handling only.
          enum:
          - flowStatus
          - error
        action:
          type: string
          description: The action to be taken. The "sendToTable" action is only valid
            when the condition is "flowStatus".
          enum:
          - sendToTable
          - abortProcess
        actionOptions:
          type: array
          items:
            type: object
            description: A map of action options for the action represented as key-value
              pairs <K, V>. "sendToTable" action required key-value pairs - <"libraryName",
              string value of library to send the status> example, "WORK" <"tableName",
              string value of name of the table to send the status> example, "STATUS"
              "abortProcess" action required action options - <"returnCode", integer
              value of the return code to be passed to the abort> example 3).
    node:
      title: Node
      type: object
      description: base type for all nodes in a data flow
      properties:
        nodeType:
          type: string
          description: Specifes the type of node
          example: step
          enum:
          - step
          - table
          - file
          - outputFile
          - outputTable
          - dataFlow
        id:
          type: string
          example: id-1651087424164-557
          description: The unique identifier of this node.  The id is provided by
            the user, and must be unique among the nodes within the data flow.
        version:
          type: integer
          example: 1
          description: This media type's schema version number. This representation
            is version 1.
        name:
          type: string
          example: SAS Program.sas
          description: The name of this node.
        description:
          type: string
          example: Description of SAS Program
          description: The description of this node.
        note:
          $ref: "#/components/schemas/note"
        priority:
          type: integer
          example: 0
          description: Hint used to suggest order of execution. For two nodes at a
            given level in the flow, a lower value for the priority number on one
            node will indicate that it should execute before the other node. Depending
            on the node dependencies in the flow, this may or may not be honored.
        properties:
          type: object
          description: Map of properties to store more information about the node,
            for example to store migration error messages. These properties have 100
            characters limit for the length of the key and 10240 characters limit
            on the length of the value.
      required:
      - nodeType
    tableNode:
      title: TableNode
      description: describes a table node in the data flow.  The TableNode exposes
        one output port named "outTable".
      type: object
      allOf:
      - $ref: "#/components/schemas/node"
      - type: object
        properties:
          nodeType:
            type: string
            description: The type of this node.  This is always `table` for a table
              node
          tableReference:
            $ref: "#/components/schemas/parameterReference"
    outputTableNode:
      title: OutputTableNode
      description: describes an output table node in the data flow.  The OutputTableNode
        exposes one input port named "inTable" and one output port named "outTable".
      type: object
      allOf:
      - $ref: "#/components/schemas/node"
      - type: object
        properties:
          nodeType:
            type: string
            description: The type of this node.  This is always `outputTable` for
              an outpout table node
          tableReference:
            $ref: "#/components/schemas/parameterReference"
          outputTableArguments:
            $ref: "#/components/schemas/outputTableArguments"
    fileNode:
      title: FileNode
      description: describes a file node in the data flow.  This node represents an
        input file. The FileNode exposes one output port named "outTable".
      type: object
      allOf:
      - $ref: "#/components/schemas/node"
      - type: object
        properties:
          nodeType:
            type: string
            description: The type of this node.  This is always `file` for a file
              node
          fileReference:
            $ref: "#/components/schemas/parameterReference"
    outputFileNode:
      title: outputFileNode
      description: describes a file node in the data flow.  This node represents an
        output file. The FileNode exposes one input port named "inTable".
      type: object
      allOf:
      - $ref: "#/components/schemas/node"
      - type: object
        properties:
          nodeType:
            type: string
            description: The type of this node.  This is always `outputFile` for an
              outputFile node
          fileReference:
            $ref: "#/components/schemas/parameterReference"
    parameterReference:
      title: ParameterReference
      description: Reference to a parameter value declared in the parameters section
      type: object
      properties:
        referenceType:
          type: string
          description: type of parameter reference - either "file" or "table"
          enum:
          - table
          - file
        parameterId:
          type: string
          description: id of the parameter that this is being referred to
    outputTableArguments:
      title: OutputTableArguments
      description: The table options arguments for the output table, to be used in
        OutputTableNode or in steps that have embedded output tables, like LoadTableStep.
      type: object
      properties:
        advancedOptions:
          type: array
          description: A list of advanced table options for the output table to be
            set as data set options.
          items:
            type: string
        arguments:
          type: object
          description: Map of additional arguments related the an output table. An
            argument map entry with key "outputType" indicates what type of output
            is desired. The value of "outputType" key is a map containing key-value
            pairs of the type of output desired. By default, the output type is table.
            The output type map with "isView" as key and value true indicates a view
            is the desired output. An argument map entry with table type key, one
            of "sas", "cas", "oracle", "teradata", or "other", indicates output table
            options for that table type. The value of each table type key is a map
            containing key-value pairs of table options valid for the table type.
            The outputTableArguments used in OutputTableNode supports "cas" and "other"
            table types. For "cas" table type used in OutputTableNode, the valid table
            options map key-value pairs <K, V> are <"promote", true/false>, <"replaceWithPromote",
            true/false>, <"persist", true/false>, <"replaceWithPersist", true/false>
            where promote is to indicate whether or not to promote the output table
            into a global in-memory CAS table, and persist is to indicate whether
            or not to create a permanent copy of the in-memory CAS table. For "other"
            table type used in OutputTableNode, the valid table option map key-value
            pairs <K, V> is <"replace", true/false>. The outputTableArguments used
            in LoadTableStep supports "oracle" and "teradata". For "oracle" and "teradata"
            table types used in LoadTableStep, the the valid table options map key-value
            pairs <K, V> are <"useDefault", true/false>, <"bulkLoad", true/false>,
            <"commitAllRows", true/false>, <"numRowsPerCommit", integer>, where useDefault
            is to use the default settings of the chosen load technique, having useDefault
            true ignores the other settings here. The bulkLoad is to indicate whether
            to load the table in bulk, only processed when useDefault is false. Having
            bulkLoad true ignores the commitAllRows and numRowsPerCommit settings.
            The commitAllRows is to indidcate to commit all rows in a single transaction,
            only processed when useDefault is false and bulkLoad is false. When commitAllRows
            is true, numRowsPerCommit setting is ignored. The numRowsPerCommit is
            to indicate to commit every number of rows (integer greater than 0), only
            processed when useDefault is false, bulkLoad is false, and commitAllRows
            is false.
    portMapping:
      title: portMapping
      description: abstract type to map output table definitions of a step to an output
        port of the node.
      properties:
        portName:
          type: string
          maxLength: 250
          description: name of the output port to map the table schema to
        portIndex:
          minimum: 0
          type: integer
          description: integer of the output port to map the table schema to
    portToTableStructureMapping:
      title: portToTableStructureMapping
      description: portMapping that maps an actual table schema to an output port
        (as opposed to a reference)
      type: object
      allOf:
      - $ref: "#/components/schemas/portMapping"
      - type: object
        properties:
          tableStructure:
            $ref: "#/components/schemas/dataFlowTableStructure"
    stepNode:
      title: StepNode
      description: describes a step node in the data flow.
      type: object
      allOf:
      - $ref: "#/components/schemas/node"
      - type: object
        properties:
          nodeType:
            type: string
            description: The type of this node.  This is always `step` for a step
              node
          stepUri:
            type: string
            description: (DEPRECATED use stepReference instead) URI of the step to
              be executed by this node.  This is a URI into the data flows microservice
          stepReference:
            $ref: "#/components/schemas/externalReference"
          arguments:
            type: object
            description: Map of user arguments to be used in this step.
          portMappings:
            type: array
            description: list of mappings from output table schemas created by this
              step to their associated output ports, these are needed when the associated
              step is defined to refine the table schema.
            items: {}
          outputParameterBindings:
            type: array
            description: bind output parameters from the step to parameters on the
              flow so that their values can be used in the flow.
            items:
              $ref: "#/components/schemas/outputParameterBinding"
          excludeFromRun:
            type: boolean
            example: false
            description: Indicates whether this node should be excluded from the run.
              If true, the node will not be executed when the data flow is run and
              the input to this node will be passed in as the input to the next connected
              active node(s).
          preamble:
            type: string
            example: proc print data=sashelp.class;
            description: Indicates custom code to be ran before a step's generated
              code.
          postamble:
            type: string
            example: proc print data=sashelp.class;
            description: Indicates custom code to be ran after a step's generated
              code.
          derivedColumns:
            type: array
            description: Custom user-provided lineage for output columns produced
              by this step node. Each entry describes an output column definition
              along with the input columns it was derived from, allowing consumers
              to trace column-level data lineage through the step without executing
              it.
            items:
              $ref: "#/components/schemas/columnDefinitionReference"
    dataFlowNode:
      title: DataFlowNode
      description: describes a node in the data flow that consists of another flow
        (a subflow).
      type: object
      allOf:
      - $ref: "#/components/schemas/node"
      - type: object
        properties:
          nodeType:
            type: string
            description: The type of this node.  This is always `dataFlow` for a data
              flow node
          dataFlowAndBindings:
            $ref: "#/components/schemas/dataFlowAndBindings"
          outputParameterBindings:
            type: array
            description: bind output parameters from the child dataflow to parameters
              on the main dataflow so that their values can be used in the main flow.
            items:
              $ref: "#/components/schemas/outputParameterBinding"
          arguments:
            type: object
            description: Arguments specify values which will be propagated to the
              subflow in its execution bindings. These arguments will be resolved,
              so they may contain parameters that are provided in the outer flow.
              Each argument consists of a name and a value
          controlMapping:
            description: This is used to specify control table mappings which are
              used for looping over a subflow. The key is the target parameter in
              the subflow, the value is the column name in the control table. Every
              iteration of the loop will assign the value from the current row of
              the control table to the parameter.
          excludeFromRun:
            type: boolean
            example: false
            description: Indicates whether this node should be excluded from the run.
              If true, the node will not be executed when the data flow is run and
              the input to this node will be passed in as the input to the next connected
              active node(s).
          preamble:
            type: string
            example: proc print data=sashelp.class;
            description: Indicates custom code to be ran before generated subflow
              code.
          postamble:
            type: string
            example: proc print data=sashelp.class;
            description: Indicates custom code to be ran after generated subflow code.
    parameter:
      title: Parameter
      description: base type for all parameters to the data flow
      properties:
        id:
          type: string
          description: user provided id of the parameter, must be unique within the
            data flow
        name:
          type: string
          description: name of the parameter
        parameterType:
          type: string
          description: |
            Type of parameter
          enum:
          - table
          - tableStructure
          - file
        parameterUsage:
          type: string
          description: determines what the parameter is used for
          enum:
          - INPUT
          - OUTPUT
        defaultValue:
          type: object
          description: default value of this parameter if it isn't provided at runtime
      required:
      - name
      - parameterType
    columnDefinition:
      title: ColumnDefinition
      description: describes a column in the data flow.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        name:
          type: string
          description: The name of this column.
        type:
          type: string
          description: The type of this column.
        length:
          type: integer
          description: The length of this column.
    fixedWidthColumnDefinition:
      title: FixedWidthColumnDefinition
      description: describes a fixed width column in the data flow.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        name:
          type: string
          description: The name of this column.
        type:
          type: string
          description: The type of this column.
        rawLength:
          type: integer
          description: The length of this column.
        format:
          type: object
          description: A layout specification for how a column should be printed or
            displayed
          properties:
            name:
              type: string
              description: The name of the format for the column
            length:
              type: integer
              description: The length of the format
            decimals:
              type: integer
              description: The number of decimals the format should have
        informat:
          type: object
          description: A specification for how raw data should be read
          properties:
            name:
              type: string
              description: The name of the informat for the column
            length:
              type: integer
              description: The length of the informat
            decimals:
              type: integer
              description: The number of decimals the informat should have
        attributes:
          type: object
          properties:
            start:
              type: integer
              description: The start index for the fixed width column
            end:
              type: integer
              description: The end index for the fixed width column
    fixedWidthColumnDefinitionReference:
      title: FixedWidthColumnDefinitionReference
      description: |
        describes a reference to a fixed width column schema within a step node.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        referenceType:
          type: string
          description: this is always equal to "columnDefinition"
        outputPort:
          type: integer
          description: The port on which this column is going out on in the step.
        columnDefinition:
          $ref: "#/components/schemas/fixedWidthColumnDefinition"
    columnReference:
      title: ColumnReference
      description: describes a reference to a column within a step node.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        referenceType:
          type: string
          description: this is always equal to "column"
        inputPort:
          type: integer
          description: The port on which this column is coming into this step.
        columnName:
          type: string
          description: The name of the column being referenced.
    columnDefinitionReference:
      title: ColumnDefinitionReference
      description: >
        describes a reference to a column schema within a step node.  This is
        generally used to describe an output column.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        referenceType:
          type: string
          description: this is always equal to "columnDefinition"
        outputPort:
          type: integer
          description: The port on which this column is going out on in the step.
        columnDefinition:
          $ref: "#/components/schemas/columnDefinition"
    columnModelReference:
      title: ColumnModelReference
      description: >
        describes a reference to a column definition. This is generally used to
        describe a column when generating code for a Data Flow Snippet where
        there are no ports to reference.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        referenceType:
          type: string
          description: this is always equal to "columnModel"
        alias:
          type: string
          description: if the column is being renamed, this is its new name
        impactedColumns:
          type: array
          description: array of columns which this column depends on (eg for calculated
            column)
          items:
            $ref: "#/components/schemas/columnDefinition"
        columnDefinition:
          $ref: "#/components/schemas/columnDefinition"
    portReference:
      title: PortReference
      description: >
        describes an reference to an input port or an output port, which is
        generally a table.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        referenceType:
          type: string
          enum:
          - inputPort
          - outputPort
          description: Type of reference.
        portName:
          type: string
          maxLength: 250
          description: The name of the port.
        portIndex:
          type: integer
          minimum: 0
          description: The index of the port.
    inputPortReference:
      title: InputPortReference
      description: describes a reference to an input port
      type: object
      allOf:
      - $ref: "#/components/schemas/portReference"
      - type: object
        properties:
          referenceType:
            type: string
            description: The type of port reference. This value must be set to "inputPort".
    outputPortReference:
      title: outputPortReference
      description: describes a reference to an output port
      type: object
      allOf:
      - $ref: "#/components/schemas/portReference"
      - type: object
        properties:
          referenceType:
            type: string
            description: The type of port reference. This value must be set to "outputPort".
          arguments:
            type: object
            description: The additional information for the output port reference
            allOf:
            - $ref: "#/components/schemas/outputPortRefArguments"
    outputPortRefArguments:
      title: outputPortRefArguments
      description: argument describing more information on the output port reference
      type: object
      properties:
        outputType:
          type: object
          description: describing the type of output expected on the output port reference
          allOf:
          - $ref: "#/components/schemas/outputTypeForOutputPortRef"
    outputTypeForOutputPortRef:
      title: outputTypeForOutputPortRef
      description: describing the type of the preferred expected output
      properties:
        preferViewForNoTableNode:
          type: boolean
          description: to create a view as the output in lieu of a temporary table
            as the output, when the output port is not connected to an output table
            node
    fileParameter:
      title: FileParameter
      description: parameter to the flow representing a file.  these will be reference
        by file nodes.
      type: object
      allOf:
      - $ref: "#/components/schemas/parameter"
    fileArgument:
      title: FileArgument
      description: is an argument describing a file when executing a data flow.
      type: object
      properties:
        value:
          $ref: "#/components/schemas/file"
      required:
      - value
    file:
      title: File
      description: file
      type: object
      properties:
        fileType:
          type: string
          description: file extension
          maxLength: 100
        sourceType:
          type: string
          description: where to look for the file
          maxLength: 100
          enum:
          - filesService
          - filesServicePath
          - localFile
        value:
          type: string
          description: value of where to find file, depending on the sourceType, this
            will either be a path (local, filesServicePath) or a uri (filesService)
        arguments:
          type: object
          description: list of arguments to be used for future
          properties:
            delimiter:
              description: the single delimiting character that separates each column
                value in the input data records (for delimited files).
              type: string
            encoding:
              description: Specifies the encoding to use for reading the file.
              type: string
            dataType:
              description: the data type of the file
              type: string
              enum:
              - XLS
              - XLSX
              - DLM
              - CSV
              - FixedWidth
            hasColumnHeaders:
              description: If true then column names are generated from data values
                in the first row of the file
              type: boolean
      required:
      - sourceType
      - value
    tableArgument:
      title: TableArgument
      description: is an argument describing a table when executing a data flow.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        argumentType:
          type: string
          maxLength: 100
          description: The type of this argument.  This is always "table" for a table
            argument
        value:
          $ref: "#/components/schemas/dataFlowTable"
    tableStructureArgument:
      title: TableStructureArgument
      description: is an argument describing a table and its columns when executing
        a data flow.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        argumentType:
          type: string
          maxLength: 100
          description: The type of this argument.  This is always "tableStructure"
            for a table argument
        value:
          $ref: "#/components/schemas/dataFlowTableStructure"
    stringArgument:
      title: StringArgument
      description: is an argument describing a string parameter when executing a data
        flow.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        argumentType:
          type: string
          maxLength: 100
          description: The type of this argument. This is always "string" for a string
            argument.
        value:
          type: string
          description: The value of the string argument.
    dataFlowTable:
      title: DataFlowTable
      description: is a container for holding an "application/vnd.sas.data.table"
        and its "application/vnd.sas.data.source".
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        table:
          type: object
          description: The table of type "application/vnd.sas.data.table".
        source:
          type: object
          description: The data source of type "application/vnd.sas.data.source".
    dataFlowTableStructure:
      title: DataFlowTableStructure
      description: is a container for holding an "application/vnd.sas.data.table",
        its "application/vnd.sas.data.source", and its "application/vnd.sas.data.column.summary"
        collection.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        table:
          type: object
          description: The table of type "application/vnd.sas.data.table".
        source:
          type: object
          description: The data source of type "application/vnd.sas.data.source".
        columns:
          type: array
          description: array of "application/vnd.sas.data.column.summary"
          items:
            type: object
    executionBindings:
      title: ExecutionBindings
      description: collection of runtime arguments to feed to a data flow to run it
      type: object
      properties:
        environmentId:
          type: string
          maxLength: 100
          description: identity of the environment
        sessionId:
          type: string
          maxLength: 100
          description: environment specific id of the session to run the data flow
            in
        contextId:
          type: string
          maxLength: 100
          description: environment specific id of the context to run the data flow
            in
        dataflowPlace:
          type: string
          maxLength: 100
          description: the place where the dataflow is saved on, either in "sascontent"
            for SAS Content or "sasserver" for File System
          enum:
          - sascontent
          - sasserver
        dataflowLocation:
          type: string
          maxLength: 100
          description: the full absolute path where the dataflow is saved on, in correspondence
            of the value in dataflowPlace
        tempTablePrefix:
          type: string
          maxLength: 100
          description: prefix to use when creating temporary tables for this run,
            if it is longer than three characters, it will be ignored
        sources:
          type: array
          description: a list of data sources of type "application/vnd.sas.data.source",
            which are available at the time the flow is executed, it can be used to
            help determine source information based on the user's preference for where
            temporary tables should be located, or what a default source is.
          items:
            type: object
        arguments:
          type: object
          description: map of parameter id to value (TableStructureArgument, TableArgument,
            FileArgument, TableStructureUriArgument, TableUriArgument, StringArgument)
        interactive:
          type: boolean
          description: if true, the data flow is being run in an interactive environment
    externalReference:
      title: ExternalReference
      description: specifies a reference to an entity which exists elsewhere.
      type: object
      properties:
        type:
          type: string
          example: uri
          maxLength: 100
          description: specifies the type of reference. 'content' - reference to a
            folder path in sas content. 'uri' - reference to a dataflow uri. 'filesystem'
            - path to a file.
        path:
          type: string
          example: /dataFlows/dataFlows/73515871-f990-4b05-a034-322751ca9428
    outputParameterBinding:
      title: OutputParameterBinding
      description: this is for binding a value produced by a step node or subflow
        node to a parameter in the enclosing flow. For example, a flow that has P
        as one of its output parameters might have a node N on it that sets a macro
        variable MV to some value. If there is an OutputParameterBinding on node N
        with a ParameterID of P and a Source of MV then it will allow us to generate
        code that sets P's output value to MV. In the case of a subflow node, Source
        would be referring to the parameter name of a parameter on the subflow
      properties:
        parameterId:
          type: string
          description: this is the identifier of the parameter we are binding to
        source:
          type: string
          description: this is the name of the value to be bound to the parameter.
            In the case of a regular node this will be a macro variable name. In the
            case of an embedded flow it will be the name of the output parameter of
            the embedded flow
    dataFlowAndBindings:
      title: DataFlowAndBindings
      description: combination of data flow and executing bindings, used to run a
        data flow. The dataFlow and dataFlowReference members are mutually exclusive.
        Only one or the other should be provided.
      type: object
      properties:
        dataFlow:
          $ref: "#/components/schemas/dataFlow"
        executionBindings:
          $ref: "#/components/schemas/executionBindings"
        dataFlowReference:
          $ref: "#/components/schemas/externalReference"
    codeSnippetAndBindings:
      title: CodeSnippetAndBindings
      description: combination of code snippet and executing bindings, used to run
        a snippet of code
      type: object
      properties:
        dataFlow:
          $ref: "#/components/schemas/dataFlowSnippet"
        executionBindings:
          $ref: "#/components/schemas/executionBindings"
    singleStepSnippetAndBindings:
      title: SingleStepAndBindings
      description: combination of reference to a single step and executing bindings,
        used to run a single step
      type: object
      properties:
        step:
          $ref: "#/components/schemas/dataFlowStepAndArguments"
        executionBindings:
          $ref: "#/components/schemas/executionBindings"
    dataFlowJobSummary:
      title: DataFlowJobSummary
      description: summary representation of a data flow job
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          id:
            type: string
            description: system generated id of the job
          state:
            type: string
            description: current state of the job (pending, running, canceled, timedOut,
              completed, failed)
          error:
            $ref: "#/components/schemas/error2"
          links:
            type: array
            description: Zero or more links to related resources or operations
            items:
              $ref: "#/components/schemas/link"
    dataFlowLineage:
      title: DataFlowLineage
      description: Represents the column-level lineage for a data flow
      type: object
      properties:
        nodes:
          description: Map of nodes and their lineage details, keyed by node ID
          type: object
          additionalProperties:
            $ref: "#/components/schemas/dataFlowLineageNode"
    dataFlowLineageNode:
      title: DataFlowLineageNode
      description: Represents a single node in a data flow lineage
      type: object
      properties:
        id:
          type: string
          description: The node ID
        lineage:
          $ref: "#/components/schemas/lineageDetails"
        child:
          $ref: "#/components/schemas/dataFlowLineage"
    lineageDetails:
      title: LineageDetails
      description: Column-level lineage information for a node
      type: object
      properties:
        outputColumns:
          description: Output columns produced by this node and their source dependencies
          type: array
          items:
            $ref: "#/components/schemas/lineageColumn"
        inputColumns:
          description: Input columns used by this node
          type: array
          items:
            $ref: "#/components/schemas/lineageColumn"
    lineageColumn:
      title: LineageColumn
      description: Defines a column and its lineage
      type: object
      properties:
        column:
          $ref: "#/components/schemas/lineageColumnReference"
        sourceColumns:
          description: Source columns this column depends on
          type: array
          items:
            $ref: "#/components/schemas/lineageColumnReference"
        origin:
          type: string
          description: Where this column comes from (e.g. calculated, filter, passthrough)
        expression:
          type: string
          description: Optional expression for how this column was derived
    lineageColumnReference:
      title: LineageColumnReference
      description: Reference to a column with port information for lineage
      type: object
      properties:
        port:
          type: string
          description: The port name
        portIndex:
          type: integer
          description: The port index
        columnName:
          type: string
          description: The column name
    dataFlowJob:
      title: DataFlowJob
      description: information about a completed or currently running data flow job.
        Either dataFlow or codeSnippet will be populated
      allOf:
      - $ref: "#/components/schemas/dataFlowJobSummary"
      - type: object
        properties:
          dataFlow:
            $ref: "#/components/schemas/dataFlow"
          codeSnippet:
            $ref: "#/components/schemas/dataFlowSnippet"
          executionBindings:
            $ref: "#/components/schemas/executionBindings"
          actions:
            type: array
            description: Zero or more actions containing details about the data flow
              job
            items:
              $ref: "#/components/schemas/actionStatus"
    dataFlowSnippet:
      title: DataFlowSnippet
      description: Representation of arguments needed to generate a dataflow code
        snippet.  A dataflow code snippet represents a portion of a step that a step
        chooses to expose for partial code generation.  An example of this is the
        FilterNode will expose a "filter" snippet to generate a filter without having
        to construct a data flow. Step member is optional and is reserved for future
        usage. Please use stepUri to specify the step.
      type: object
      properties:
        stepUri:
          type: string
          description: URI of the step to generate the snippet from.
        step:
          $ref: "#/components/schemas/step"
        snippetName:
          type: string
          maxLength: 250
          description: Name of the code snippet to be generated. filter     - use
            this to generate a filter code snippet from steps that have filtering
            functionality, such as Filter Rows and Branch Rows steps. expression -
            use this to generate an expression code snippet from steps that handle
            expressions, such as Calculate Column step.
          enum:
          - filter
          - expression
        arguments:
          type: object
          description: Map of user arguments to be used to generate the snippet code.  References
            to columns should use a ColumnModelReference instead of the ColumnReference,
            to pass in a column definition. filterSnippet - use this type object to
            generate code snippets when using "filter" as snippetName. all the variants
            of calculateColumn - use one of the variants of calculateColumn object
            type to generate code snippets when using "expression" as snippetName;
            calculateColumn's "outColumn" property is not needed for expression snippet.
          anyOf:
          - $ref: "#/components/schemas/filterSnippet"
          - $ref: "#/components/schemas/simpleCalculateColumn"
          - $ref: "#/components/schemas/dqSchemeApplyCalculateColumn"
          - $ref: "#/components/schemas/putInputCalculateColumn"
          - $ref: "#/components/schemas/kcompressCalculateColumn"
          - $ref: "#/components/schemas/ksubstrCalculateColumn"
          - $ref: "#/components/schemas/kscanCalculateColumn"
          - $ref: "#/components/schemas/dqCaseCalculateColumn"
          - $ref: "#/components/schemas/dqGenderCalculateColumn"
          - $ref: "#/components/schemas/dqMatchCalculateColumn"
          - $ref: "#/components/schemas/dqIdentifyCalculateColumn"
          - $ref: "#/components/schemas/dqStandardizeCalculateColumn"
          - $ref: "#/components/schemas/dqParseCalculateColumn"
          - $ref: "#/components/schemas/dqParseTokenGetCalculateColumn"
          - $ref: "#/components/schemas/dqExtractCalculateColumn"
          - $ref: "#/components/schemas/dqExtTokenGetCalculateColumn"
          - $ref: "#/components/schemas/hashingCalculateColumn"
          - $ref: "#/components/schemas/hashing_hmacCalculateColumn"
          - $ref: "#/components/schemas/expressionCalculateColumn"
          - $ref: "#/components/schemas/portReference"
          - $ref: "#/components/schemas/quickFilter"
    dataFlowStepAndArguments:
      title: DataFlowStepAndArguments
      description: Representation of arguments needed to generate code from a single
        step. It is either a step, or a reference to a step. The arguments are self
        contained and should not have references to any other entities.
      type: object
      properties:
        stepUri:
          type: string
          description: URI of the step to generate the snippet from. If not specified
            then the step member will be used.
        step:
          $ref: "#/components/schemas/step"
        arguments:
          type: object
          description: Map of user arguments to be used to generate the code. References
            to columns should use a ColumnModelReference instead of the ColumnReference,
            to pass in a column definition.
        note:
          $ref: "#/components/schemas/note"
        properties:
          type: object
          description: Map of properties to store more information about the node,
            for example to store migration error messages. These properties have 100
            characters limit for the length of the key and 10240 characters limit
            on the length of the value.
    codegenResponse:
      title: CodegenResponse
      description: Response for a request to generate code.
      type: object
      properties:
        code:
          type: string
          description: code that was generated
    codeConversionRequest:
      title: CodeConversionRequest
      description: collection of runtime arguments to feed to a code conversion job
        to run it
      type: object
      properties:
        code:
          type: string
          description: sas code that will be converted to a data flow
        sessionId:
          type: string
          description: environment specific id of the session to run the code conversion
            job in
        expandMacros:
          type: boolean
          description: If true, expands macro invocations into separate Program steps.
        parentFolderUri:
          type: string
          description: If specified, will create the flow in a folder with this uri
        memberName:
          type: string
          description: Should be specified when parentFolderUri is specified. This
            is the name of the folder item to create.
        saveToCompute:
          type: boolean
          description: If true, the flow will be saved to the compute server rather
            than content.
    codeConversionJobSummary:
      title: CodeConversionJobSummary
      description: summary representation of a code conversion job
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          id:
            type: string
            description: system generated id of the job
          state:
            type: string
            description: current state of the job (pending, running, canceled, timedOut,
              completed, failed)
          error:
            $ref: "#/components/schemas/error2"
          links:
            type: array
            description: Zero or more links to related resources or operations
            items:
              $ref: "#/components/schemas/link"
    codeConversionJob:
      title: CodeConversionJob
      description: information about a completed or currently running code conversion
        job
      allOf:
      - $ref: "#/components/schemas/codeConversionJobSummary"
      - type: object
        properties:
          generatedDataFlow:
            $ref: "#/components/schemas/dataFlow"
          scaProcCode:
            type: string
            description: The sca proc code that was used to create the sca proc report
              on the user-submitted code
    tableAndSource:
      title: TableAndSource
      description: Combines a table and source together.
      type: object
      properties:
        table:
          type: object
          description: The table of type "application/vnd.sas.data.table".
        source:
          type: object
          description: The data source of type "application/vnd.sas.data.source".
    outputPortAndTable:
      title: OutputPortAndTable
      description: output table and source associated with a port
      type: object
      properties:
        port:
          $ref: "#/components/schemas/port"
        table:
          $ref: "#/components/schemas/tableAndSource"
    actionStatus:
      title: ActionStatus
      description: One or more nodes in the submitted flow may be combined into an
        action during code generation. For example, a filter node and a sort node
        could be combined into a single query action.
      type: object
      properties:
        nodes:
          type: string
          description: A pipe (|) delimeted list of node id's. This is the string
            used during code generation to indicate the beginning and end of an action.
        expectedOutput:
          type: array
          items:
            $ref: "#/components/schemas/outputPortAndTable"
          description: The expected output data that an action is expected to generate.
        subStatus:
          type: array
          items:
            $ref: "#/components/schemas/actionStatus"
          description: If this action is a subflow, subStatus will contain an array
            consisting of the nodes in the subflow
    excelFileImportOptions:
      title: ExcelImportOptions
      description: Excel-specific options for importing an external Excel file.
      type: object
      properties:
        dbms:
          description: the SAS parsing engine to use, e.g. "xlsx"
          type: string
          enum:
          - xls
          - xlsx
        sheets:
          description: the details of the Excel sheets including name, output table
            name and source, and range
          type: array
          properties:
            items:
              type: object
              properties:
                name:
                  description: sheet name
                  type: string
                range:
                  description: the cell range to be read from the Excel sheet, e.g.
                    "C1:F20"
                  type: object
                  properties:
                    start:
                      description: the first half of the range, e.g. "C1"
                      type: string
                    end:
                      description: the second half of the range, e.g. "F20"
                      type: string
                outputTable:
                  $ref: "#/components/schemas/outputPortReference"
              required:
              - name
              - range
              - outputTable
          items: {}
      required:
      - dbms
      - sheets
    delimitedFileImportOptions:
      title: DelimitedImportOptions
      description: Delimited-specific options for importing an external delimited
        file.
      type: object
      properties:
        delimiter:
          description: (DEPRECATED - now part of the file object) the single delimiting
            character that separates each column value in the input data records.
          type: string
        delimiterSensitive:
          description: If true then DSD INFILE option is added. When data values are
            enclosed in quotation marks the DSD option treats delimiters within the
            value as character data, treats consecutive delimiters as a missing value
            and removes quotation marks from character values.
          type: boolean
        getNames:
          description: (DEPRECATED - now part of the file object as hasColumnHeaders)
            If true then column names are generated from data values in the first
            row of the external delimited file.
          type: boolean
        firstObs:
          description: Specifies the row number from which to start reading in data.
          type: integer
        lastObs:
          description: Specifies the last row from which to read in data.
          type: integer
        missingRecordOption:
          enum:
          - flowover
          - missover
          description: Specifies whether the data read should jump to the next record
            if it doesn't find values for all variables (flowover) or whether to set
            all empty vars to missing when reading a short line (missover)
          type: string
        outColumns:
          $ref: "#/components/schemas/columnDefinitionReference"
      required:
      - firstObs
      - outColumns
    fixedWidthFileImportOptions:
      title: FixedWidthImportOptions
      description: Fixed Width-specific options for importing an external fixed width
        file.
      type: object
      properties:
        firstObs:
          description: Specifies the row number from which to start reading in data.
          type: integer
        lastObs:
          description: Specifies the last row from which to read in data.
          type: integer
        pad:
          description: Specifies whether to pad each line of the record to the given
            record length.
          type: boolean
        outColumns:
          type: array
          items:
            $ref: "#/components/schemas/fixedWidthColumnDefinitionReference"
        missingRecordOption:
          enum:
          - flowover
          - truncover
          description: Specifies whether the data read should jump to the next record
            if it doesn't find values for all variables (flowover) or whether to stop
            reading when the end of the line is reached and allow partial column values
            (truncover)
          type: string
      required:
      - firstObs
      - outColumns
    fileImportStep:
      title: FileImportStep
      description: Imports a given Excel, Delimited, or Fixed Width file, from a Compute-addressable
        location (or similar), into a single/multiple table(s), based on the specified
        file.
      type: object
      properties:
        inFile:
          $ref: "#/components/schemas/fileParameter"
        renameColumns:
          description: If True the columns will be renamed in order to comply with
            the restrictions of the runtime and will become case insensitive. If False
            then column names with special characters will be allowed and they will
            be case sensitive.
          type: boolean
        fileType:
          description: (DEPRECATED - now part of the file object as 'dataType') The
            type of the file to be imported.
          type: string
          enum:
          - Excel
          - Delimited
          - FixedWidth
        encoding:
          description: Specifies the encoding to use for reading the external file.
          type: string
        excelFileImportOptions:
          $ref: "#/components/schemas/excelFileImportOptions"
        delimitedFileImportOptions:
          $ref: "#/components/schemas/delimitedFileImportOptions"
        fixedWidthFileImportOptions:
          $ref: "#/components/schemas/fixedWidthFileImportOptions"
      required:
      - inFile
      - fileType
    transferObject:
      title: Transfer Object
      description: The transfer object that represents a resource.
      properties:
        id:
          type: string
          format: object-id
          description: The unique identifier of the object.
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        summary:
          $ref: "#/components/schemas/summary"
        \content:
          type: object
          description: Optional. Choose this or fileServiceContent. This is the content
            object that must be serialized in a format that is valid for internet
            transmission. This includes valid encoding formats like Base64 or data
            structures like JSON. This is provided by the content provider and the
            transfer service expects no visibility into or understanding of this value.
        fileServiceContent:
          type: string
          description: Optional. Choose this or content. This holds the URI of a file
            service object that contains the transferrable object.
        connectors:
          type: array
          description: A list of associations or references to other external objects
            to be recreated on import.
          items:
            $ref: "#/components/schemas/transferObjectConnector"
        substitutions:
          type: object
          description: Map with keys of parameter and value. Used to replace the value
            of parameter with the value of value.
          additionalProperties:
            type: string
        links:
          type: array
          description: Paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
    transferObjectConnector:
      title: Transfer Object Connector
      description: An association or reference to another external object to be recreated
        on import.
      properties:
        id:
          type: string
          format: object-id
          description: The unique identifier of the object.
        name:
          type: string
          description: The name of the related object.
        version:
          type: integer
          description: The transfer object connector version.
        uri:
          type: string
          description: The URI of the related object.
        contentType:
          type: string
          description: The media type of the related object.
        type:
          type: string
          description: The type of connection. This can be any value that the creator
            of the connection wants but should be used to determine what to do to
            reconstitute the relationship.
        hints:
          type: object
          description: Hints that can be used to help find the object to connect to
            in the target system.
          items:
            type: string
    tableArg:
      title: Output port table argument reference
      description: Allows designating one of the steps arguments as a table argument.
      properties:
        name:
          type: string
          description: The name of the argument in the step node
        required:
          type: boolean
          description: If true, then the argument is required to be specified in the
            step node. Otherwise it's optional
    columnDelta:
      title: Column Delta
      description: The column changes to a port as it is processed by a step.
      properties:
        keepColumnArguments:
          type: array
          description: Reference to one or more arguments that specify which columns
            should be passed through, if this is set there should be no input ports
            in the automaticMapping field
          items:
            type: string
        removeColumnArguments:
          type: array
          description: Reference to one or more arguments that specify which columns
            should be dropped, if this is set, then at least one input port is required
            in the automaticMapping field.
          items:
            type: string
        updateColumnArguments:
          type: array
          description: Reference to one or more arguments that specify calculated
            columns which are added to the output
          items:
            type: string
        automaticMapping:
          type: array
          description: Zero or more automatic mappings for this columnDelta, all columns
            in the ports in this mapping will be carried to the output port, except
            those indicated in the removeColumnArguments
          items:
            $ref: "#/components/schemas/columnDeltaMapping"
    columnDeltaMapping:
      title: Column Delta Mapping
      description: Allows all columns from an input port to be automatically mapped
        to an output port
      properties:
        inputPort:
          description: Name of the input port for which columns will be automatically
            mapped to this output port
          type: string
    ctmTaskXml:
      title: Common Task Model (CTM) XML Document of a task.
      description: Common Task Model (CTM) XML Document of a task.
      properties:
        task:
          type: object
          properties:
            schemaVersion:
              type: number
              format: float
              xml:
                attribute: true
            registration:
              type: object
              properties:
                name:
                  type: string
                  properties:
                    nlsKey:
                      type: string
                      xml:
                        attribute: true
                description:
                  type: string
                  properties:
                    nlsKey:
                      type: string
                      xml:
                        attribute: true
                guid:
                  type: string
                procedures:
                  type: string
                version:
                  type: string
                links:
                  type: array
                  description: Zero or more links to related resources or operations
                  items:
                    type: string
                    xml:
                      name: Link
                    properties:
                      href:
                        type: string
                        xml:
                          attribute: true
                      nlsKey:
                        type: string
                        xml:
                          attribute: true
            metadata:
              type: object
              properties:
                dataSources:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        xml:
                          attribute: true
                      where:
                        type: string
                        xml:
                          attribute: true
                      roles:
                        type: array
                        items:
                          type: string
                          properties:
                            name:
                              type: string
                              xml:
                                attribute: true
                            type:
                              type: string
                              xml:
                                attribute: true
                            minVars:
                              type: integer
                              xml:
                                attribute: true
                            maxVars:
                              type: integer
                              xml:
                                attribute: true
                            exclude:
                              type: string
                              xml:
                                attribute: true
                            order:
                              type: boolean
                              xml:
                                attribute: true
                            indent:
                              type: integer
                              xml:
                                attribute: true
                            nlsKey:
                              type: string
                              xml:
                                attribute: true
                options:
                  type: array
                  items:
                    type: string
                    properties:
                      name:
                        type: string
                        xml:
                          attribute: true
                      inputType:
                        type: string
                        xml:
                          attribute: true
                      defaultValue:
                        type: string
                        xml:
                          attribute: true
                      indent:
                        type: integer
                        xml:
                          attribute: true
                      nlsKey:
                        type: string
                        xml:
                          attribute: true
            ui:
              type: object
              properties:
                container:
                  type: array
                  properties:
                    option:
                      type: string
                      xml:
                        attribute: true
                    group:
                      type: object
                      properties:
                        option:
                          type: string
                          xml:
                            attribute: true
                        open:
                          type: boolean
                          xml:
                            attribute: true
                        dataItem:
                          type: object
                          properties:
                            data:
                              type: string
                              xml:
                                attribute: true
                        roleItem:
                          type: object
                          properties:
                            role:
                              type: string
                              xml:
                                attribute: true
                        optionChoice:
                          type: array
                          items:
                            type: object
                            properties:
                              option:
                                type: string
                                xml:
                                  attribute: true
                        optionItem:
                          type: object
                          properties:
                            option:
                              type: string
                              xml:
                                attribute: true
                  items: {}
            dependencies:
              type: array
              items:
                type: object
                properties:
                  condition:
                    type: string
                    xml:
                      attribute: true
                  target:
                    type: object
                    properties:
                      option:
                        type: string
                        xml:
                          attribute: true
                      conditionResult:
                        type: boolean
                        xml:
                          attribute: true
                      action:
                        type: string
                        xml:
                          attribute: true
    stepCollection:
      title: Step Collection
      description: A collection of step representations.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/stepSummary"
            description: Array containing step resources.
    step:
      title: Step
      description: describes the complete details of a step.
      type: object
      allOf:
      - $ref: "#/components/schemas/stepSummary"
      - type: object
        properties:
          flowMetadata:
            $ref: "#/components/schemas/flowMetadata"
          templates:
            description: Map of code templates for the step, the key is id of the
              target platform.
            type: object
          ui:
            type: string
            description: The User Interface of the step
          localUi:
            type: string
            description: The read-only User Interface that has been localized in the
              current locale
    stepSummary:
      title: Step Summary
      type: object
      description: summary representation of a step.
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - type: object
        properties:
          id:
            type: string
            maxLength: 36
            example: id-1698265944252-525
            description: The unique identifier of this step.
          name:
            type: string
            maxLength: 250
            example: File
            description: The name of this step.
          displayName:
            type: string
            maxLength: 250
            example: File
            description: The displayable name or localization ID for this step.
          localDisplayName:
            type: string
            maxLength: 250
            example: File
            description: If this step is a SAS provided step, this will contain the
              localized display name for this step, otherwise it will contain the
              displayName.
          description:
            type: string
            maxLength: 1000
            example: The File step description.
            description: The description of this step.
          localDescription:
            type: string
            maxLength: 1000
            example: The File step description.
            description: If this step is a SAS provided step, this will contain the
              localized description for this step, otherwise it will contain the description.
          properties:
            type: object
            description: Map of this steps's properties.
          links:
            type: array
            description: Zero or more links to related resources or operations
            items:
              $ref: "#/components/schemas/link"
          version:
            type: integer
            example: 1
            description: This media type's version number. This representation is
              version 1.
          metadataVersion:
            type: number
            format: float
            example: 1.0
            description: The step content's version number. A revision number used
              to denote when the step content changes.
          type:
            type: string
            example: code
            description: The type of this step. Acceptable values are "code". Default
              value is set to "code".
          categoryId:
            type: string
            description: Optional ID of the step category to which this step belongs
            maxLength: 36
          bundleName:
            type: string
            description: Localization bundle name
            maxLength: 100
          iconClass:
            type: string
            description: Icon name
            maxLength: 100
          hidden:
            type: boolean
            description: Whether or not a step is hidden. Hidden steps are not returned
              by default in step listing
    stepCategory:
      title: Step Category
      description: allows organizing steps into categories.
      type: object
      properties:
        id:
          type: string
          maxLength: 36
          description: The unique identifier of this step category.
        name:
          type: string
          maxLength: 250
          description: The name of this step category.
        displayName:
          type: string
          maxLength: 250
          description: The displayable name or localization ID for this step category.
        localDisplayName:
          type: string
          maxLength: 250
          description: If this step category is a SAS provided step category, this
            will contain the localized display name for this step, otherwise it will
            contain the displayName.
        parentId:
          type: string
          maxLength: 36
          description: if present, indicates the parent step category of this step
            category
        collation:
          type: integer
          description: used for sorting the list of step categories as returned.
        visible:
          type: boolean
          description: an indicator that may be used to determine if a step category
            is shown.
        metadataVersion:
          type: number
          format: float
          description: The step category content's version number. A revision number
            used to denote when the step category content changes.
        version:
          type: integer
          description: This media type's version number. This representation is version
            1.
    stepCategoryCollection:
      title: Step Category Collection
      description: A collection of step categories.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/stepCategory"
            description: Array containing step category resources.
    flowMetadata:
      title: Flow Metadata
      description: describes the details of how a step participates in a flow.
      type: object
      properties:
        significantArgs:
          $ref: "#/components/schemas/significantArguments"
        inputPorts:
          type: array
          description: Zero or more input ports to this step.
          items:
            $ref: "#/components/schemas/stepPort"
        outputPorts:
          type: array
          description: Zero or more output ports from this step.
          items:
            $ref: "#/components/schemas/stepOutputPort"
    significantArguments:
      title: Significant Arguments
      type: object
      description: a collection of significant items expected to be in the arguments
      properties:
        column:
          type: array
          description: a collection of qualified argument names related to columns
            for the step
          items:
            $ref: "#/components/schemas/significantArgument"
    significantArgument:
      title: Significant Argument
      type: object
      description: a qualified name of an argument that is significant
      properties:
        value:
          type: string
          maxLength: 1024
    stepPort:
      title: Step Port
      description: data input into a step.
      properties:
        name:
          type: string
          maxLength: 250
          description: The name of the step port.
        displayName:
          type: string
          maxLength: 250
          description: The displayable name or localization ID for this port.
        localDisplayName:
          type: string
          maxLength: 250
          description: If this step is a SAS provided step, this will contain the
            localized display name for this port, otherwise it will contain the displayName.
        description:
          type: string
          maxLength: 100
          description: The description of the step port.
        localDescription:
          type: string
          maxLength: 1000
          description: If this step is a SAS provided step, this will contain the
            localized description for this port, otherwise it will contain the description.
        minEntries:
          type: integer
          description: The minimum entries for this step port.
        maxEntries:
          type: integer
          description: The maximum entries for this step port.
        defaultEntries:
          type: integer
          description: The default entries for this step port.
        type:
          type: string
          description: The type of this step port. Must be either "file" or "table".
        readOnly:
          type: boolean
          description: Used by the UI to determine if connections can be made.
        hidden:
          type: boolean
          description: Used by the UI to determine visibility.
    stepOutputPort:
      title: Step Output Port
      description: data output from a step.
      allOf:
      - $ref: "#/components/schemas/stepPort"
      - type: object
        properties:
          requiresStructure:
            type: boolean
            description: step connected to this port must supply table structure
          columnDelta:
            $ref: "#/components/schemas/columnDelta"
          supportsView:
            type: boolean
            description: whether the output port supports view as the output
          viewTypes:
            type: array
            description: A list of view types supported when supportsView is true.
              The list item used must be "SQLVIEW" for Procsql view, "SASDSV" for
              SAS Data Step view
            items:
              type: string
              maxLength: 250
    programNodeStep:
      title: ProgramNodeStep
      description: The SAS program step allows the developer to insert a SAS code
        block to be run in the SAS Compute Server.  Additionaly it provides the ability
        to reference a file which contains a SAS code block to be run in the SAS Compute
        Server.  This step can consume 0 to any number of tables and produce 0 to
        any number of tables.  This step requires the developer to define the full
        structure of the output tables.  Input and outpout ports can have macro variables
        assigned to them in the variables argument.
      type: object
      properties:
        codeOptions:
          type: object
          properties:
            code:
              description: The code to be executed
              type: string
            contentType:
              description: Set to value of 'reference' (without the quotes) to execute
                the referenced file. When set to 'reference', then inFile property
                is required and the code property is ignored. When set to anything
                other then 'reference', or this property is not set at all, then the
                code property is required and the inFile property is ignored.
              type: string
            inFile:
              $ref: "#/components/schemas/fileParameter"
            variables:
              description: Array of macro variables to be defined in the code.  Each
                entry will be a map that will result in a macro variable declaration
                using %let <name>=<value>.  The value in the map can be a port reference
                type, for example an
              type: array
              properties:
                items:
                  type: object
                  properties:
                    name:
                      description: name of macro variable
                      type: string
                    value:
                      description: value of the macro variable.  This can be a number,
                        string or portReference
                      type: object
                  required:
                  - name
                  - value
              items: {}
      required:
      - codeOptions
    pythonNodeStep:
      title: PythonNodeStep
      description: The Python program step allows the developer to insert a Python
        code block to be run in the SAS Compute Server.  This step can consume 0 to
        any number of tables and produce 0 to any number of tables.  This step requires
        the developer to define the full structure of the output tables.  Input and
        output ports can have macro variables assigned to them in the variables argument.
      type: object
      properties:
        codeOptions:
          type: object
          properties:
            code:
              description: The code to be executed
              type: string
            variables:
              description: Array of macro variables to be defined in the code.  Each
                entry will be a map that will result in a macro variable declaration
                using %let <name>=<value>.  The value in the map can be a port reference
                type, for example an
              type: array
              properties:
                items:
                  type: object
                  properties:
                    name:
                      description: name of macro variable
                      type: string
                    value:
                      description: value of the macro variable.  This can be a number,
                        string or portReference
                      type: object
                  required:
                  - name
                  - value
              items: {}
          required:
          - code
      required:
      - codeOptions
    rNodeStep:
      title: RNodeStep
      description: The R program step allows the developer to insert an R code block
        to be run in the SAS Compute Server.  This step can consume 0 to any number
        of tables and produce 0 to any number of tables.  This step requires the developer
        to define the full structure of the output tables.  Input and output ports
        can have macro variables assigned to them in the variables argument.
      type: object
      properties:
        codeOptions:
          type: object
          properties:
            code:
              description: The code to be executed
              type: string
            variables:
              description: Array of macro variables to be defined in the code.  Each
                entry will be a map that will result in a macro variable declaration
                using %let <name>=<value>.  The value in the map can be a port reference
                type, for example an
              type: array
              properties:
                items:
                  type: object
                  properties:
                    name:
                      description: name of macro variable
                      type: string
                    value:
                      description: value of the macro variable.  This can be a number,
                        string or portReference
                      type: object
                  required:
                  - name
                  - value
              items: {}
          required:
          - code
      required:
      - codeOptions
    queryStep:
      title: QueryStep
      description: The Query step allows the user to model a query or join and generate
        the correct code.  The user must specify either queryTables, queryJoins, or
        joinFormattedFilter.
      type: object
      properties:
        fedSQL:
          type: boolean
          description: generate proc fedsql instead of proc sql, defaults to false
        sessionId:
          type: string
          description: CAS session id to use when using fedSQL to CAS
        selectDistinct:
          type: boolean
          description: eliminate duplicate rows, defaults to false
        useOutObs:
          type: boolean
          description: use the the outObs parameter, defaults to false
        outObs:
          type: integer
          description: if useOutObs is true, this is the value for the outObs parameter
        useInObs:
          type: boolean
          description: use the the inObs parameter, defaults to false
        inObs:
          type: integer
          description: if useInObs is true, this is the value for the inObs parameter
        explicitSqlSource:
          type: boolean
          description: use explicit pass through for the source tables, defaults to
            false
        dataSetOptions:
          type: string
          description: data set options to use when creating the output table
        outputMode:
          type: string
          enum:
          - Table
          - Report
          description: defaults to Table
        outputTable:
          $ref: "#/components/schemas/portReference"
        queryJoins:
          $ref: "#/components/schemas/queryJoins"
        queryTables:
          $ref: "#/components/schemas/queryTables"
        joinFormattedFilter:
          type: string
          description: a hand coded join string
        selectedColumns:
          type: array
          items:
            $ref: "#/components/schemas/querySelectedColumn"
        whereFormattedFilter:
          type: string
          description: a hand coded where filter
        whereQuickFilters:
          type: array
          items:
            $ref: "#/components/schemas/queryQuickFilter"
        havingFormattedFilter:
          type: string
          description: a hand coded having filter
        havingQuickFilters:
          type: array
          items:
            $ref: "#/components/schemas/queryQuickFilter"
        orderByColumns:
          type: array
          items:
            $ref: "#/components/schemas/orderByColumn"
        groupByColumns:
          type: array
          items:
            $ref: "#/components/schemas/groupByColumn"
      required:
      - outputTable
      - selectedColumns
    byColumn:
      title: ByColumn
      description: common properties for order by and query by columns
      type: object
      properties:
        tableAlias:
          type: string
          description: alias fot the table that contains this column
        isCalculated:
          type: boolean
          description: true if this column is an expression
        inColumn:
          $ref: "#/components/schemas/columnReference"
        expressionText:
          type: string
          description: expression to use for column when isCalculated is true
        calculatedColumnName:
          type: string
          description: name of the calculated column as used in the selected columns
            list, if omitted, use the expressionText
    orderByColumn:
      title: OrderByColumn
      description: column definition to be sorted by
      allOf:
      - $ref: "#/components/schemas/byColumn"
      - type: object
        properties:
          sortDirection:
            type: string
            enum:
            - ascending
            - descending
    groupByColumn:
      title: GroupByColumn
      description: column definition to be grouped by
      allOf:
      - $ref: "#/components/schemas/byColumn"
    queryQuickFilter:
      title: query filter
      description: query filter
      type: object
      properties:
        tableAlias:
          type: string
          description: alias of the table containing the column to filter on
        matchCase:
          type: boolean
          description: match case when filtering
        quoteStrings:
          type: boolean
          description: quote strings when filtering
        inColumn:
          $ref: "#/components/schemas/columnReference"
        value:
          type: array
          description: array of values to compare the column value to in the filter.
          items:
            type: string
        operator:
          type: string
          description: operator to use to filter on
          enum:
          - equal
          - notequal
          - lessthan
          - lessthanequal
          - greaterthan
          - greaterthanequal
          - contains
          - notcontains
          - matches
          - notmatches
          - soundslike
          - notsoundslike
          - inlist
          - notinlist
          - between
          - notbetween
          - missing
          - notmissing
        logicalOperator:
          type: string
          enum:
          - AND
          - OR
          description: logical operator to combine with the next filter
        useRaw:
          type: boolean
          description: if true don't use formatted values for comparison (use the
            raw values), if false, use formatted values for comparison which results
            in matched-case text comparison, thus matchCase setting is ignored and
            defaulted to true, the formatted values for comparison needs to be used
            with caution, since text comparison may not be appropriate for date or
            numeric data
        isCalculated:
          type: boolean
          description: if true, use the values in calculatedColumn to filter with
            instead of inColumn
        calculatedColumn:
          type: object
          description: if isCalculated is true
          properties:
            calculatedColumnName:
              type: string
              description: name of the calculated column as used in the selected columns
                list, if omitted, use the expression below
            expressionText:
              type: string
              description: expression to use for filtering
            type:
              type: string
              enum:
              - character
              - numeric
              description: type of column produced by the expressionText
    queryTable:
      title: QueryTable
      description: a table as represented in a query step
      type: object
      properties:
        table:
          $ref: "#/components/schemas/portReference"
        alias:
          type: string
          description: table alias to use for this table
      required:
      - table
      - alias
    queryTables:
      title: QueryTables
      description: A description of the tables to query
      type: array
      items:
        $ref: "#/components/schemas/queryTable"
    queryJoins:
      title: QueryJoins
      description: A description of the tables and join conditions to perform
      type: object
      properties:
        leftTable:
          $ref: "#/components/schemas/queryTable"
        joins:
          type: array
          items:
            type: object
            properties:
              joinType:
                type: string
                enum:
                - inner join
                - left join
                - right join
                - full join
              rightTable:
                $ref: "#/components/schemas/queryTable"
              condition:
                type: object
                properties:
                  leftAlias:
                    type: string
                    description: optional alias for left column.  if empty, use left
                      table alias above.
                  leftColumn:
                    properties:
                      tableAlias:
                        type: string
                      inColumn:
                        $ref: "#/components/schemas/columnReference"
                  rightColumn:
                    $ref: "#/components/schemas/columnReference"
                  operator:
                    type: string
                    enum:
                    - +
                    - <>
                    - ">"
                    - <
                    - ">="
                    - <=
    querySelectedColumn:
      title: QuerySelectedColumn
      description: Column in a query to show up in the output table
      type: object
      properties:
        aggregate:
          type: string
        tableAlias:
          type: string
        isCalculated:
          type: boolean
          description: if true populate the calculatedColumn field and expressionText
        isModified:
          type: boolean
          description: if true populate the modifiedColumn field
        inColumn:
          $ref: "#/components/schemas/columnReference"
        modifiedColumn:
          type: object
        calculatedColumn:
          type: object
        expressionText:
          type: string
    selectedColumn:
      title: SelectedColumn
      description: Column in an input table to show up in the output table
      type: object
      properties:
        inColumn:
          $ref: "#/components/schemas/columnReference"
        isModified:
          type: boolean
        modifiedColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
      required:
      - isModified
    fileExportStep:
      title: FileExportStep
      description: Exports a table that is produced by a Data Flow into an Excel,
        Delimited, or Fixed Width file.
      type: object
      properties:
        inTable:
          $ref: "#/components/schemas/portReference"
        outFile:
          $ref: "#/components/schemas/portReference"
        createColumnMetadataFile:
          description: True if we wish to create a column metadata file describing
            the output table. The file will be created alongside the file's path with
            the suffix '_columnmetadata.csv'.
          type: boolean
      required:
      - inTable
      - outFile
    sortStep:
      title: SortStep
      description: Sorts data on one or more columns from the input table and produces
        a sorted output table.
      type: object
      properties:
        sortColumns:
          type: array
          description: array of columns on which to sort
          properties:
            ascending:
              type: boolean
              description: sort ascending on this column if true, else sort descending.  default
                is false.
            inColumn:
              $ref: "#/components/schemas/columnReference"
          required:
          - inColumn
          items: {}
        inTable:
          $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/portReference"
        duplicateRowBehavior:
          type: string
          enum:
          - leave
          - deleteDuplicateRows
          - deleteDuplicateSortColumns
          description: indicates the behavior to use for duplicate rows.  "deleteDuplicateRows"
            means remove identical rows, "deleteDuplicateSortColumns" means remove
            rows with duplicated sort columns, and "leave" means do nothing with duplicates.  default
            is "leave".
        maintainOrder:
          type: boolean
          description: if true, maintain the order of the original input rows within
            the sorted group, default is to take the session default
        forceRedundant:
          type: boolean
          description: if true, sorts and replaces an indexed data set, default is
            to take the session default
        useTags:
          type: boolean
          description: if true, uses tags to sort and doesn't create a full copy of
            the data on sort, default is to take the session default
      required:
      - sortColumns
      - inTable
      - outTable
    quickFilter:
      title: quickFilter
      description: filter
      type: object
      properties:
        matchCase:
          type: boolean
          description: match case when filtering
        quoteStrings:
          type: boolean
          description: quote strings when filtering
        inColumn:
          type: object
          description: column definition to apply the filter on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        value:
          type: array
          description: array of values to compare the column value to in the filter.
          items:
            type: string
        operator:
          type: string
          description: operator to use when filtering
          enum:
          - equal
          - notequal
          - lessthan
          - lessthanequal
          - greaterthan
          - greaterthanequal
          - contains
          - notcontains
          - matches
          - notmatches
          - soundslike
          - notsoundslike
          - inlist
          - notinlist
          - between
          - notbetween
          - missing
          - notmissing
        logicalOperator:
          type: string
          enum:
          - AND
          - OR
          description: logical operator to combine with the next filter
        useRaw:
          type: boolean
          description: if true don't use formatted values for comparison (use the
            raw values), if false, use formatted values for comparison which results
            in matched-case text comparison, thus matchCase setting is ignored and
            defaulted to true, the formatted values for comparison needs to be used
            with caution, since text comparison may not be appropriate for date or
            numeric data
    branchRowsStep:
      title: BranchRowsStep
      description: Splits a table based on a list of filters.  This step supports
        the filter snippet.
      type: object
      properties:
        inTable:
          $ref: "#/components/schemas/portReference"
        filters:
          type: array
          description: array of filter objects containing a filter and an output table
          items:
            type: object
            properties:
              formattedFilter:
                type: string
                description: fully formatted filter, specifiy either this or a quickFilter
              quickFilters:
                type: array
                items:
                  $ref: "#/components/schemas/quickFilter"
              outTable:
                $ref: "#/components/schemas/portReference"
            required:
            - outTable
        nonMatchingRows:
          $ref: "#/components/schemas/portReference"
      required:
      - inTable
      - filters
    filterStep:
      title: FilterStep
      description: Filters rows in a table based on a filter. The filter step supports
        the "filter" data flow snippet.
      type: object
      properties:
        inTable:
          $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/portReference"
        formattedFilter:
          type: string
          description: fully formatted filter, specifiy either this or a quickFilter
        quickFilters:
          type: array
          items:
            $ref: "#/components/schemas/quickFilter"
      required:
      - inTable
      - outTable
    filterSnippet:
      title: FilterSnippet
      description: Generates a code snippet from an array of quick filters.
      type: object
      properties:
        excludeFilter:
          type: boolean
          description: boolean indicating whether this filter is intended to use as
            an exclusion filter, meaning the rows that match the filter are removed
            from the output table as opposed to included in the output table.  Default
            is false.
        quickFilters:
          type: array
          items:
            $ref: "#/components/schemas/quickFilter"
      required:
      - quickFilters
    insertStep:
      title: InsertStep
      description: Inserts rows into a table.
      type: object
      properties:
        inTable:
          $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/portReference"
        truncate:
          type: boolean
          description: if true, truncates target table
        allowCreate:
          type: boolean
          description: if true, and target table does not exist, it is created
      required:
      - inTable
      - outTable
    manageColumnsStep:
      title: ManageColumnsStep
      description: Manage columns in a table.
      type: object
      properties:
        inTable:
          $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/portReference"
        selectedColumns:
          type: array
          description: selectedColumn can be either inColumn, modifiedColumn or calculatedColumn
          items:
            $ref: "#/components/schemas/querySelectedColumn"
      required:
      - inTable
      - outTable
      - selectedColumns
    decisionStep:
      title: DecisionStep
      description: Execute a decision flow.
      type: object
      properties:
        decisionURI:
          description: URI of the decision.
          type: string
        modelPublishURI:
          description: URI of the modelPublish object.
          type: string
        inTable:
          $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/portReference"
        casOptions:
          type: object
          description: options specific to CAS. If present, CAS execution will occur
          properties:
            sessionId:
              type: string
              description: CAS Session ID
            modelName:
              type: string
              description: Name of published model to execute.
            modelTable:
              type: string
              description: Table in which the model exists
            modelCasLib:
              type: string
              description: CAS Library where the model table exists
        mappedColumns:
          type: array
          description: allows mapping incoming columns to decision flow variables.
            only required if they don't map up.
          items:
            type: object
            properties:
              variableName:
                type: string
                description: name expected by decision flow
              mappingValue:
                type: string
                description: name of incoming column
      required:
      - inTable
      - outTable
      - casOptions
    calculateColumnsStep:
      title: CalculateColumnsStep
      description: Calculate columns to modify existing columns or add new columns
      type: object
      properties:
        inTable:
          $ref: "#/components/schemas/portReference"
        outTable:
          $ref: "#/components/schemas/portReference"
        calculateColumns:
          type: array
          description: provides information to build an expression to calculate column
          items:
            type: object
            enum:
            - $ref: "#/components/schemas/simpleCalculateColumn"
            - $ref: "#/components/schemas/dqSchemeApplyCalculateColumn"
            - $ref: "#/components/schemas/putInputCalculateColumn"
            - $ref: "#/components/schemas/kcompressCalculateColumn"
            - $ref: "#/components/schemas/ksubstrCalculateColumn"
            - $ref: "#/components/schemas/kscanCalculateColumn"
            - $ref: "#/components/schemas/dqCaseCalculateColumn"
            - $ref: "#/components/schemas/dqGenderCalculateColumn"
            - $ref: "#/components/schemas/dqMatchCalculateColumn"
            - $ref: "#/components/schemas/dqIdentifyCalculateColumn"
            - $ref: "#/components/schemas/dqStandardizeCalculateColumn"
            - $ref: "#/components/schemas/dqParseCalculateColumn"
            - $ref: "#/components/schemas/dqParseTokenGetCalculateColumn"
            - $ref: "#/components/schemas/dqExtractCalculateColumn"
            - $ref: "#/components/schemas/dqExtTokenGetCalculateColumn"
            - $ref: "#/components/schemas/hashingCalculateColumn"
            - $ref: "#/components/schemas/hashing_hmacCalculateColumn"
            - $ref: "#/components/schemas/expressionCalculateColumn"
      required:
      - inTable
      - outTable
      - calculateColumns
    simpleCalculateColumn:
      title: SimpleCalculateColumn
      description: Used for calculate columns where a function requires single column
        input and produces single column output. "outColumn" is not needed when used
        as an argument to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Name of the operation to perform. upcase   - converts all lowercase
            single-width English alphabet letters in selected column to uppercase
            letters, and outputs to selected output column. lowcase  - converts all
            uppercase single-width English alphabet letters in selected column to
            lowercase letters, and outputs to selected output column. propcase - converts
            all uppercase letters to lowercase letters. It then converts to uppercase
            the first character of a word that is preceded by a blank, forward slash,
            hyphen, open parenthesis, period, or tab. Result is output to selected
            output column. left     - moves leading blanks in selected column values
            to the the end. Result is output to selected output column. right    -
            moves trailing blanks in selected column values to the the beginning.
            Result is output to selected output column. day      - produces an integer
            from 1 to 31 based on the date value in selected column that represents
            the day of the month. Result is output to selected output column. month    -
            produces an integer from 1 to 12 based on the date value in selected column
            that represents the month of the year. Result is output to selected output
            column. qtr      - produces a value of 1,2,3, or 4 based on the date value
            in selected column that represents the quarter of the year. Result is
            output to selected output column. year     - produces a four-digit value
            based on the date in selected column that represents the year. Result
            is output to selected output column. timepart - extracts a time value
            from a SAS datetime value. Result is output to selected output column.
            datepart - extracts the date from a SAS datetime value. Result is output
            to selected output column.
          enum:
          - upcase
          - lowcase
          - propcase
          - left
          - right
          - day
          - month
          - qtr
          - year
          - timepart
          - datepart
      required:
      - inColumn
      - outColumn
      - operation
    putInputCalculateColumn:
      title: PutInputCalculateColumn
      description: put and input function. "outColumn" is not needed when used as
        an argument to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Name of the operation to perform. put - Returns a value using
            a specified format. input - Returns the value that is produced when SAS
            converts value in input column by using the specified informat.
          enum:
          - put
          - input
        format:
          type: string
          description: format value to be applied by the operation on the column conversion
      required:
      - inColumn
      - outColumn
      - operation
      - format
    kcompressCalculateColumn:
      title: kcompressCalculateColumn
      description: kcompress function. "outColumn" is not needed when used as an argument
        to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Removes specified characters from a character expression.
          enum:
          - kcompress
        characters-to-remove:
          type: string
          description: specifies the character or characters that KCOMPRESS removes
            from the character. If characters-to-remove is omitted or empty, KCOMPRESS
            removes all blanks.
        modifier:
          type: string
          description: specifies a character constant in which each non-blank character
            modifies the action of the KCOMPRESS function.
      required:
      - inColumn
      - outColumn
      - operation
    ksubstrCalculateColumn:
      title: ksubstrCalculateColumn
      description: ksubstr function. "outColumn" is not needed when used as an argument
        to dataFlowSnippet.
      properties:
        inColumn:
          type: object
          description: column definition to apply the operation on. Use columnReference
            object type by default. Only use columnModelReference object type for
            an argument to dataFlowSnippet.
          enum:
          - $ref: "#/components/schemas/columnReference"
          - $ref: "#/components/schemas/columnModelReference"
        outColumn:
          $ref: "#/components/schemas/columnDefinitionReference"
        operation:
          type: string
          description: Extracts a substring from input column.
          enum:
          - ksubstr
        start:
          type: integer
          description: specifies beginning character position within column consisting
            of string to start substring extraction from
        length:
          type: integer
          description: specifies the length of the substring to extract. If this parameter
