  /dataFlows:
    get:
      tags:
      - DataFlows
      summary: Get a list of data flows
      description: Returns a list of data flows. Standard paging, filtering, and sorting
        options are supported. The returned collection items are of type application/vnd.sas.data.flow.summary
        unless an alternative is specified with the Accept-Item header.
      operationId: getDataFlows
      parameters:
      - name: Accept-Item
        in: header
        description: Desired item representation. Default is application/vnd.sas.data.flow.summary+json
          which, compare to application/vnd.sas.data.flow+json is an abbreviated representation
          of the data flow.
        schema:
          type: string
          enum:
          - application/vnd.sas.data.flow.summary+json
          - application/vnd.sas.data.flow+json
          - application/vnd.sas.search.indexable.data+json
          - application/vnd.sas.summary+json
      - name: start
        in: query
        description: The index of the first data flows to return. The default value
          is 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of data flows to return. The default value
          is 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: The criteria for filtering the data flows. Can filter by name,
          id, creationTimeStamp, modifiedTimeStamp, modifiedBy, and createdBy. See
          [Filtering in REST APIs](https://developer.sas.com/rest-apis/dataFlows-v2/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the data flows. See [Sorting in REST
          APIs](https://developer.sas.com/rest-apis/dataFlows-v2/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/vnd.sas.collection+json
                - application/json
