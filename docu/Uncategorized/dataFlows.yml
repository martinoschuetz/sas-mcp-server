  /stepCategories:
    get:
      tags:
      - StepCategories
      summary: Get a list of step categories
      description: Returns a list of step categories. Standard paging, filtering,
        and sorting options are supported. The returned collection items are of type
        application/vnd.sas.data.flow.step.category unless an alternative is specified
        with the Accept-Item header.
      operationId: getStepCategories
      parameters:
      - name: Accept-Item
        in: header
        description: Desired item representation. Default is application/vnd.sas.data.flow.step.category+json.
        schema:
          type: string
          enum:
          - application/vnd.sas.data.flow.step.category+json
      - name: start
        in: query
        description: The index of the first step category to return. The default value
          is 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of step categories to return. The default
          value is 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: The criteria for filtering the step categories. Can filter by
          name, id, creationTimeStamp, modifiedTimeStamp, modifiedBy, and createdBy.
          See [Filtering in REST APIs](https://developer.sas.com/rest-apis/dataFlows-v2/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the step categories. The default sort
          order for step categories is the collation ID. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/dataFlows-v2/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/vnd.sas.collection+json
                - application/json
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/stepCategoryCollection"
              examples:
                Step Category Collection:
                  $ref: "#/components/examples/stepCategoryCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/stepCategoryCollection"
              examples:
                Step Category Collection:
                  $ref: "#/components/examples/stepCategoryCollection"
    post:
      tags:
      - StepCategories
      summary: Create a step category
      description: Creates a new step category. The returned object is of type application/vnd.sas.data.flow.step.category
        by default.
      operationId: createStepCategory
      requestBody:
        content:
          application/vnd.sas.data.flow.step.category+json:
            schema:
              $ref: "#/components/schemas/stepCategory"
            examples:
              Step Category Request Body:
                summary: Step Category Request Body
                description: Step Category Request Body
                value:
                  collation: 50000
                  displayName: My Step Category Display Name
                  isVisible: true
                  localDisplayName: My Step Category Local Display Name
                  metadataVersion: 1
                  name: My Step Category
                  version: 1
          application/json:
            schema:
              $ref: "#/components/schemas/stepCategory"
            examples:
              Step Category Request Body:
                $ref: "#/paths/~1stepCategories/post/requestBody/content/application~1vnd.sas.data.flow.step.category%2Bjson/examples/Step%20Category%20Request%20Body"
        required: true
      responses:
        "201":
          description: A resource was created. The step category was created.
          headers:
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the step category was last modified.
              schema:
                type: string
            Location:
              description: The URL of the step category.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.data.flow.step.category+json:
              schema:
                $ref: "#/components/schemas/stepCategory"
              examples:
                Step Category:
                  $ref: "#/components/examples/stepCategory"
            application/json:
              schema:
                $ref: "#/components/schemas/stepCategory"
              examples:
                Step Category:
                  $ref: "#/components/examples/stepCategory"
        "400":
          description: The step category could not be created because the request
            was invalid.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Step Category 400:
                  summary: Step Category 400
                  description: Step Category 400
                  value:
                    version: 2
                    httpStatusCode: 400
                    errorCode: 3000
                    message: 'Error during conversion of text to object: unexpected
                      EOF'
                    details:
                    - 'path: /dataFlows/stepCategories'
                    - 'correlator: 893d4679-2465-41c1-a02e-2483bf12354e'
