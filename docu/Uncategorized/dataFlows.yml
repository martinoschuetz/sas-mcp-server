    post:
      tags:
      - DataFlows
      summary: Create a data flow
      description: Creates a new data flow. Only the user definition of the name,
        description, connections, parameters, properties, and nodes are supported.
        Supports creation of data flows in specific folders using the parentFolderUri
        query parameter. The returned object is of type application/vnd.sas.data.flow
        by default. If a failure occurs during an overwrite scenario the data flow
        folder member may be named _.tmp for an unsuccessful request.
      operationId: createDataFlow
      parameters:
      - name: parentFolderUri
        in: query
        description: The uri of the parent folder to contain the data flow. The default
          is empty (no folder) and is not required. Permissions to add a member to
          the folder at the given URI are required.
        schema:
          type: string
      - name: overwrite
        in: query
        description: Flag to indicate if an overwrite should occur if a data flow
          has a member with the same name in the referenced folder. The default is
          false and is not required. Permissions to add a new data flow member and
          delete of the data flow member are required.
        schema:
          type: boolean
      - name: name
        in: query
        required: false
        description: Optional name to give the flow
        schema:
          type: string
