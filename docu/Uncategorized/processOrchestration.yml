        description: |
          The filter criteria for the returned flow run summaries. Here are the supported fields: `id`, `name`, `flowID`, 
          `createdAt`, `createdBy`, `modifiedAt` and `modifiedBy`. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/processOrchestration-v1/docs/getting-started/usage-notes#filtering).'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: 'The sort returned types. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/processOrchestration-v1/docs/getting-started/usage-notes#sorting).'
        schema:
