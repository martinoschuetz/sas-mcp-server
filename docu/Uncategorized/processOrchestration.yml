        '400':
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInvalidFlowRunIDResponse"
        '403':
          description: Unauthorized access to a flow run.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorUnauthorizedAccessToFlowRunResponse"
        '404':
          description: Not Found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorFlowRunNotFoundResponse"
        '500':
          description: Internal Server Error
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInternalServerResponse"
    delete:
      tags:
      - Flow Runs
      summary: Delete a flow run by ID
      description: Deletes a specific flow run identified by the provided {runID}.
      operationId: deleteFlowRun
      responses:
        '204':
          description: No content
        '400':
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInvalidFlowIDResponse"
        '409':
          description: A flow run is still running.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/deleteErrorRunningFlowRunResponse"
        '500':
