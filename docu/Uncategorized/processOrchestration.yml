          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInternalServerResponse"
  /flowRuns/{runID}/tasks/{taskID}/logs:
    parameters:
    - name: runID
      schema:
        type: string
      in: path
      required: true
      description: A flow run ID with a 36-character UUID v4 string.
    - name: taskID
      schema:
        type: string
      in: path
      required: true
      description: A task ID with a 36-character UUID v4 string.
    get:
      tags:
      - Tasks
      summary: Get task logs
      description: Gets the task log for a specific flow run identified by the provided
        {runID} and a specific task identified by the provided {taskID}.
      operationId: getTaskLog
      parameters:
      - name: rank
        in: query
        description: The partitioned rank. The valid value must be greater than zero.
          The starting value is 1.
        schema:
          type: integer
      responses:
        '200':
          description: Succeeded in returning the task log.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              examples:
                json:
                  $ref: "#/components/examples/getTaskLogResponse"
        '400':
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInvalidFlowRunIDResponse"
        '403':
          description: Unauthorized access to a flow run.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorUnauthorizedAccessToFlowRunResponse"
        '404':
          description: Not Found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorTaskLogNotFoundResponse"
        '500':
          description: Internal Server Error
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInternalServerResponse"
  /flowRuns/{runID}/tasks/{taskID}/inputs/{inputName}:
    parameters:
    - name: runID
      schema:
        type: string
      in: path
      required: true
      description: A flow run ID with a 36-character UUID v4 string.
    - name: taskID
      schema:
        type: string
      in: path
      required: true
      description: A task ID with a 36-character UUID v4 string.
    - name: inputName
      schema:
        type: string
      in: path
      required: true
      description: the task input name
    get:
      tags:
      - Inputs and Outputs
      summary: Get task inputs
      description: |
        Gets the task inputs for a specific flow run identified by the provided {runID}, a specific task identified by the provided {taskID}, 
        and a specified input identified by the provided {inputName}.
      operationId: getInput
      parameters:
      - name: rank
        in: query
        description: The partitioned rank. The valid value must be greater than zero.
          The default is 1.
        schema:
          type: integer
      responses:
        '200':
          description: Succeeded in returning the task inputs.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.process.orchestration.io+json:
              schema:
                $ref: '#/components/schemas/taskInputParameter'
              examples:
                json:
                  $ref: "#/components/examples/getTaskIOResponse"
            application/json:
              schema:
                $ref: '#/components/schemas/taskInputParameter'
              examples:
                json:
                  $ref: "#/components/examples/getTaskIOResponse"
        '400':
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInvalidIONameResponse"
        '403':
