            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorTaskIONotFoundResponse"
        '500':
          description: Internal Server Error
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInternalServerResponse"
  /flowRuns/{runID}/tasks/{taskID}/outputs/{outputName}:
    parameters:
    - name: runID
      schema:
        type: string
      in: path
      required: true
      description: A flow run ID with a 36-character UUID v4 string.
    - name: taskID
      schema:
        type: string
      in: path
