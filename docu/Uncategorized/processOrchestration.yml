---
openapi: 3.0.3
info:
  version: '1'
  title: Process Orchestration
  description: |
    Process orchestration is a tool that coordinates the various moving parts of a business process, including people, systems, and devices. It enables end-to-end automation by tying together different business processes, both automated and manual.
  termsOfService: 'https://www.sas.com/en_us/legal/copyright.html'
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: 'https://developer.sas.com'
tags:
- name: Root
  description: The operations for the root resource.
- name: Flows
  description: The operations for the flows resource.
- name: Flow Runs
  description: The operations for the flow runs resource.
- name: Tasks
  description: The operations for the tasks resource.
- name: Namespace Callback Registration
  description: The operations for the namespace callback registration resource.
paths:
  /flows:
    get:
      tags:
      - Flows
      summary: Get a collection of flow summaries
      operationId: getFlows
      description: |
        Gets a collection of flow summaries.  The return can be filtered, sorted, and paged according to the 
        specifications in the SAS REST API Standards document.  The default sort order is `name` in ascending and 
        `namespace` in ascending.  Alternative sort orders can be by `id`, `createdBy`, `modifiedBy`, `createdAt`, or 
        `modifiedAt`. It is also possible to filter on any of these fields using the functions `eq`, `gt`, `ge`, `lt`, 
        `le` or `contains`.
      parameters:
      - name: start
        in: query
        description: The zero-based offset of the first type to return.  The default
          is zero.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of types to return.  The default is 100.
        schema:
          type: integer
      - name: filter
        in: query
        description: |
          The filter criteria for the returned flow summaries. Here are the supported fields: `id`, `name`, `namespace`, 
          `createdBy`, `modifiedBy`, `createdAt` and `modifiedAt`. See 
          [Filtering in REST APIs](https://developer.sas.com/rest-apis/processOrchestration-v1/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: 'The sort returned types. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/processOrchestration-v1/docs/getting-started/usage-notes#sorting).'
        schema:
          type: string
          format: sort-criteria
      responses:
        '200':
          description: Succeeded in returning a collection of flow summaries.
          headers: {}
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/flowSummaryCollection'
              examples:
                json:
                  $ref: "#/components/examples/getFlowSummaryResponse"
            application/json:
              schema:
                $ref: '#/components/schemas/flowSummaryCollection'
              examples:
                json:
                  $ref: "#/components/examples/getFlowSummaryResponse"
        '400':
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorBadRequestResponse"
        '500':
          description: Internal Server Error
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInternalServerResponse"
    post:
      tags:
      - Flows
      summary: Create a Flow
      operationId: createFlow
      parameters:
      - name: parentFolderUri
        schema:
          type: string
        in: query
        required: false
        description: |
          If the query parameter parentFolderUri is set, PO will add the flow resource as a member in 
          the specified SAS folder. The SAS folder must already exist. The value of parentFolderUri is the identifier 
          of a specific folder or one of the delegate strings @myFolder, @appDataFolder, @myHistory, @myFavorites, 
          or @public. The value should start with the prefix `/folders/folders/`.
      responses:
        '201':
          description: Succeeded in creating a flow.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.process.orchestration.flow+json:
              schema:
                $ref: '#/components/schemas/flowResponse'
              examples:
                json:
                  $ref: "#/components/examples/getFlowResponse"
            application/json:
              schema:
                $ref: '#/components/schemas/flowResponse'
              examples:
                json:
                  $ref: "#/components/examples/getFlowResponse"
        '400':
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInvalidFlowRequestResponse"
        '500':
          description: Internal Server Error
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInternalServerResponse"
      description: |
        The request body is a process orchestration flow JSON.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/flowRequest'
            examples:
              json:
                $ref: "#/components/examples/createFlowRequest"
          application/vnd.sas.process.orchestration.flow+json:
            schema:
              $ref: '#/components/schemas/flowRequest'
            examples:
              json:
                $ref: "#/components/examples/createFlowRequest"
        description: A process orchestration flow JSON request body.
    put:
      tags:
      - Flows
      summary: Update a Flow
      operationId: updateFlow
      responses:
        '201':
          description: Succeeded in updating a flow.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.process.orchestration.flow+json:
              schema:
                $ref: '#/components/schemas/versionlessFlowResponse'
              examples:
                json:
                  $ref: "#/components/examples/updateVersionlessFlowResponse"
            application/json:
              schema:
                $ref: '#/components/schemas/versionlessFlowResponse'
              examples:
                json:
                  $ref: "#/components/examples/updateVersionlessFlowResponse"
        '400':
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/updateErrorInvalidFlowRequestResponse"
        '500':
          description: Internal Server Error
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInternalServerResponse"
      description: |
        The request body is a versionless flow JSON.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/versionlessFlowRequest'
            examples:
              json:
                $ref: "#/components/examples/updateVersionlessFlowRequest"
          application/vnd.sas.process.orchestration.flow+json:
            schema:
              $ref: '#/components/schemas/versionlessFlowRequest'
            examples:
              json:
                $ref: "#/components/examples/updateVersionlessFlowRequest"
        description: A process orchestration flow JSON request body.
  '/flows/{flowID}':
    parameters:
    - schema:
        type: string
      name: flowID
      in: path
      required: true
      description: A flow ID with a 36-character UUID v4 string.
    get:
      summary: Get a flow by ID
      tags:
      - Flows
      responses:
        '200':
          description: Succeeded in returning a flow.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.process.orchestration.flow+json:
              schema:
                $ref: '#/components/schemas/flowResponse'
              examples:
                json:
                  $ref: "#/components/examples/getFlowResponse"
            application/json:
              schema:
                $ref: '#/components/schemas/flowResponse'
              examples:
                json:
                  $ref: "#/components/examples/getFlowResponse"
        '400':
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInvalidFlowIDResponse"
        '404':
          description: Not Found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorFlowNotFoundResponse"
        '500':
          description: Internal Server Error
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInternalServerResponse"
      operationId: getFlow
      description: 'Get details for a specific flow identified by the provided {flowID}.'
    delete:
      summary: Delete a flow by ID
      operationId: deleteFlow
      description: Delete a specific flow identified by the provided {flowID}.
      tags:
      - Flows
      responses:
        '204':
          description: No content
        '400':
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInvalidFlowIDResponse"
        '409':
          description: A flow run is still running.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/deleteErrorRunningFlowResponse"
        '500':
          description: Internal Server Error
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInternalServerResponse"
  '/flows/{flowID}/runs':
    parameters:
    - schema:
        type: string
      name: flowID
      in: path
      required: true
      description: A flow ID with a 36-character UUID v4 string.
    post:
      summary: Trigger a flow run
      tags:
      - Flow Runs
      operationId: createFlowRun
      description: >
        Triggers a flow run. The request body can be empty. In this case, the Process
        Orchestration API server automatically generates the name of the flow  run
        and uses the default parameters. The request body can be a Process Orchestration
        flow run JSON structure as well. Users can  override the flow run's name and
        the flow run's parameters.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/flowRunRequest'
            examples:
              json:
                $ref: "#/components/examples/triggerFlowRunRequest"
          application/vnd.sas.process.orchestration.flow.run+json:
            schema:
              $ref: '#/components/schemas/flowRunRequest'
            examples:
              json:
                $ref: "#/components/examples/triggerFlowRunRequest"
      responses:
        '200':
          description: Succeeded in triggering a flow run.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.process.orchestration.flow.run+json:
              schema:
                $ref: '#/components/schemas/flowRunDetailResponse'
              examples:
                json:
                  $ref: "#/components/examples/returnFlowRunDetailResponse"
            application/json:
              schema:
                $ref: '#/components/schemas/flowRunDetailResponse'
              examples:
                json:
                  $ref: "#/components/examples/returnFlowRunDetailResponse"
        '400':
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/triggerErrorInvalidFlowRunRequestResponse"
        '500':
          description: Internal Server Error
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInternalServerResponse"
        '503':
          description: Service Unavailable
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorDAGFileNotReadyResponse"
