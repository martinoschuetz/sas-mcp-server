        schema:
          type: integer
      responses:
        '200':
          description: Succeeded in returning the task outputs.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.process.orchestration.io+json:
              schema:
                $ref: '#/components/schemas/taskOutputParameter'
              examples:
                json:
                  $ref: "#/components/examples/getTaskIOResponse"
            application/json:
              schema:
                $ref: '#/components/schemas/taskOutputParameter'
              examples:
                json:
                  $ref: "#/components/examples/getTaskIOResponse"
        '400':
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInvalidIONameResponse"
        '403':
          description: Unauthorized access to a task input/output.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorUnauthorizedAccessToIOResponse"
        '404':
          description: Not Found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorTaskIONotFoundResponse"
        '500':
          description: Internal Server Error
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/getErrorInternalServerResponse"
  '/namespaces':
    post:
      summary: Create namespace callback registration
      tags:
      - Namespace Callback Registration
      operationId: createNamespace
      description: >
        This REST endpoint requires a SAS administrator account.

        It is an idempotent call. If the `ID` is provided in the request body and
        the `ID` already exists in Process Orchestration database,  it returns a `201`
        status code and the callback entry from the database. The `ID` serves as an
        idempotency key.
      requestBody:
        content:
          application/json:
            schema:
