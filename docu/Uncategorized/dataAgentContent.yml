---
openapi: 3.0.3
info:
  version: "9"
  title: Data Agent Content
  description: >
    The Data Agent Content API provides a way for users to interact with the
    SAS Data Agent. It discovers the Data Agent servers as well as data sources,
    catalogs, schemas, tables, rows and columns accessed through the Data Agent.
    The Data Agent servers can be registered and de-registered with the API.
    It also provides an ability of submitting SQL jobs for an execution.
    The DQL jobs that return a result set can be traversed in a stateful and
    stateless manner.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
servers:
- url: https://example.com/dataAgentContent
  description: Example of dataAgentContent base URL.
tags:
- name: Root
  description: The API root.
- name: Servers
  description: SAS Data Agent Servers.
- name: Data Sources
  description: Data Source Names.
- name: Catalogs
  description: Catalogs.
- name: Schemas
  description: Schemas.
- name: Tables
  description: Tables.
- name: Columns
  description: Table's Columns.
- name: Rows
  description: Table's Rows.
- name: RowSet
  description: Table's RowSet.
- name: Jobs
  description: Jobs Submitted to a Data Source.
- name: Sessions
  description: Preserved Sessions.
paths:
  /:
    get:
      operationId: root
      summary: API root information
      description: Returns information about this API and the top level entry points.
      tags:
      - Root
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
    head:
      operationId: headersForRoot
      summary: Check if the service is available
      description: Returns whether or not the Data Agent Content service is running.
      tags:
      - Root
      responses:
        "200":
          description: OK. Service is running and available
  /servers:
    get:
      operationId: getServers
      summary: Get SAS Data Agents
      description: Returns a collection of available SAS Data Agents. Standard paging,
        filtering and sorting options are provided. The members of this collection
        use application/vnd.sas.data.agent.server+json, application/vnd.sas.data.agent.server+json;version=1
        or application/vnd.sas.data.agent.server+json;version=2 media types representation.
        The latest version 2 is returned by default.
      tags:
      - Servers
      parameters:
      - name: start
        in: query
        description: The starting index of the first server instance in a page. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of servers to return in this page of results.
          The actual number of returned servers may be less if the collection has
          been exhausted. Defaults to 30.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned servers. See the [Filtering in\
          \ REST APIs](https://developer.sas.com/apis/rest/Topics/#filters) for more\
          \ information on the format of the filter. The supported functions are:\
          \ and, or, not, eq, ne, lt, le, gt, ge, contains, startsWith, endsWith.\
          \ Filtering can be performed on all the fields. For example, in order to\
          \ filter servers by name use the following filter=eq(name%2C%20%27DataAgent_HR%27)."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "Sort criteria. The sort criteria supports all the fields in\
          \ either ascending or descending order.  See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)\
          \ for more information on the format of the sort keys. Examples: \\n - Sort\
          \ by name in a descending order: /dataAgentContent/servers/DataAgent_HR/servers?sortBy=name:descending."
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/serverCollection"
              examples:
                servers:
                  $ref: "#/components/examples/getServerCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/serverCollection"
              examples:
                servers:
                  $ref: "#/components/examples/getServerCollection"
        "400":
          description: >
            An Invalid filter or combination of request parameters was provided:
              - 27611 - Invalid start parameter '' value. It must be greater than
            or equal to zero
              - 27612 - Invalid limit parameter '' value. It must be greater than
            or equal to zero.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorInvalidParameter"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorInvalidParameter"
    head:
      operationId: headersForServers
      summary: Check if there are Data Agents registered
      description: Returns whether or not there are Data Agents available.
      tags:
      - Servers
      parameters:
      - name: start
        in: query
        description: The starting index of the first server instance in a page. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of servers to return in this page of results.
          The actual number of returned servers may be less if the collection has
          been exhausted. Defaults to 30.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned servers. See the [Filtering in\
          \ REST APIs](https://developer.sas.com/apis/rest/Topics/#filters) for more\
          \ information on the format of the filter. The supported functions are:\
          \ and, or, not, eq, ne, lt, le, gt, ge, contains, startsWith, endsWith.\
          \ Filtering can be performed on all the fields. For example, in order to\
          \ filter servers by name use the following filter=eq(name%2C%20%27DataAgent_HR%27)."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "Sort criteria. The sort criteria supports all the fields in\
          \ either ascending or descending order.  See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)\
          \ for more information on the format of the sort keys. Examples: \\n - Sort\
          \ by name in a descending order: /dataAgentContent/servers/DataAgent_HR/servers?sortBy=name:descending."
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK. Servers exist.
        "400":
          description: >
            An Invalid filter or combination of request parameters was provided:
              - 27611 - Invalid start parameter '' value. It must be greater than
            or equal to zero
              - 27612 - Invalid limit parameter '' value. It must be greater than
            or equal to zero.
    post:
      operationId: createServer
      summary: Create a new SAS Data Agent definition
      description: Create a new server. If id field is omitted it will be auto-generated.
      tags:
      - Servers
      parameters:
      - name: registerOauthClient
        in: query
        description: If true, the OAuth client will be automatically registered for
          the created server. As a part of registration the OAuthClient group and
          authorization rules will be defined. If false, the OAuth client won't be
          registered. Defaults to true.
        schema:
          type: boolean
          default: true
      - name: createGroups
        in: query
        description: If true, the default Data Agent groups, Data Agent Administrators
          and Data Agent Power Users, will be automatically created if they do not
          already exist. Defaults to true.
        schema:
          type: boolean
          default: true
      requestBody:
        $ref: "#/components/requestBodies/createServerRequest"
      responses:
        "201":
          description: New server created
          headers:
            Location:
              description: The location of a newly created server resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/createOrUpdateServerResponse"
            application/vnd.sas.data.agent.server+json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/createOrUpdateServerResponse"
            application/vnd.sas.data.agent.server+json;version=2:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/createOrUpdateServerResponse"
            application/vnd.sas.data.agent.server+json;version=1:
              schema:
                $ref: "#/components/schemas/serverVersionOne"
              examples:
                server:
                  $ref: "#/components/examples/createServerResponseVersionOne"
        "400":
          description: Bad Request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorInvalidRequestOnServers"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorInvalidRequestOnServers"
        "409":
          description: Conflict. The server with the same name already exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorConflictOnServers"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorConflictOnServers"
  /servers/{serverId}:
    get:
      operationId: getServer
      summary: Get SAS Data Agent
      description: Returns information about a single Data Agent based on the unique
        id provided.
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      tags:
      - Servers
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.data.agent.server+json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/getServerResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/getServerResponse"
            application/vnd.sas.data.agent.server+json;version=2:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/getServerResponse"
            application/vnd.sas.data.agent.server+json;version=1:
              schema:
                $ref: "#/components/schemas/serverVersionOne"
              examples:
                server:
                  $ref: "#/components/examples/getServerResponseVersionOne"
        "404":
          description: |
            Data Agent does not exist:
              - 27600 - A server with id '' was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
    head:
      operationId: headersForServer
      summary: Check if Data Agent exists
      description: Returns whether or not a Data Agent with the specified id exists.
      tags:
      - Servers
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK. Server exists.
        "404":
          description: Server does not exist
    patch:
      operationId: patchServer
      summary: Update Server Oauth Client information
      description: Updates server's oauthClientSecret for the existing oauth client.
        Other fields are not updatable in this version of the API. If the server doesn't
        have an oauth client associated, it will return an error. If the server already
        has an oauth client, the existing client secret will be updated with the provided
        oauthClientSecret value.
      tags:
      - Servers
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/patchServerRequest"
      responses:
        "200":
          description: |
            A server updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/createOrUpdateServerResponse"
            application/vnd.sas.data.agent.server+json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/createOrUpdateServerResponse"
            application/vnd.sas.data.agent.server+json;version=2:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/createOrUpdateServerResponse"
            application/vnd.sas.data.agent.server+json;version=1:
              schema:
                $ref: "#/components/schemas/serverVersionOne"
              examples:
                server:
                  $ref: "#/components/examples/createServerResponseVersionOne"
        "400":
          description: |
            Bad Request.
            - 27660 Update on the field '' is not supported.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorUpdateOnFieldNotSupported"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorUpdateOnFieldNotSupported"
        "404":
          description: |
            Server not found.
            - 27700 A Data Agent with id '' was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
    delete:
      operationId: deleteServer
      summary: Delete SAS Data Agent definition
      description: Deletes the server definition with the provided id.
      tags:
      - Servers
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      - name: deregisterOauthClient
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: If true, the OAuth client associated with the server will be
          automatically deregistered. As a part of deregistration the OAuthClient
          group and authorization rules will be removed. Defaults to true.
      responses:
        "204":
          description: Server is deleted
        "404":
          description: |
            Server not found
  /servers/{serverId}/dataSources:
    get:
      operationId: getDataSources
      summary: Get Data Sources
      description: Returns a collection of data sources (data services and DSNs) defined
        in the SAS Data Agent. Standard paging, filtering and sorting options are
        provided. The members of this collection use application/vnd.sas.data.agent.data.source+json
        media type.
      tags:
      - Data Sources
      parameters:
      - name: serverId
        in: path
        description: The id of the Data Agent
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first data source in a page. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of data sources to return in this page of results.
          The actual number of returned data sources may be less if the collection
          has been exhausted. Defaults to 30.
        schema:
          type: integer
      - name: filter
        in: query
        description: >-
          Filter criteria for returned data sources. See the [Filtering in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#filters) for
          more information on the format of the filter. The supported
          functions are: and, or, not, eq, ne, lt, le, gt, ge, contains,
          startsWith, endsWith. Filtering can be performed on all the fields.
          Examples:
           - Get dataSources with isDataSercice=false and name that starts with 'and(eq(isDataService,
          false), startsWith(name, "BASE"))'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: >-
          Sort returned data sources. The sort criteria supports all the
          fields in either ascending or descending order.  See [Sorting in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting) for
          more information on the format of the sort keys. Examples:
           - Sort by name in an ascending order: /dataAgentContent/servers/DataAgent_HR/dataSources?sortBy=name:ascending
           - Sort by id in a descending order: /dataAgentContent/servers/DataAgent_HR/dataSources?sortBy=id:descending
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/dataSourceCollection"
              examples:
                dataSources:
                  $ref: "#/components/examples/getDataSourceCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/dataSourceCollection"
              examples:
                dataSources:
                  $ref: "#/components/examples/getDataSourceCollection"
        "400":
          description: >
            Bad Request:
              - 27625 - A request resulted in the Data Agent error. Message ''. SQLState
            ''. Error code ''.
              - 27626 - A request resulted in the service error ''.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerBadConnection"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerBadConnection"
        "404":
          description: |
            Data Agent not found:
              - 27600 - A Server with id '' was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
    head:
      operationId: headersForDataSources
      summary: Check if data sources are available
      description: Returns whether or not data sources for the specified server are
        available.
      tags:
      - Data Sources
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first data source in a page. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of data sources to return in this page of results.
          The actual number of returned data sources may be less if the collection
          has been exhausted. Defaults to 30.
        schema:
          type: integer
      - name: filter
        in: query
        description: >-
          Filter criteria for returned data sources. See the [Filtering in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#filters) for
          more information on the format of the filter. The supported
          functions are: and, or, not, eq, ne, lt, le, gt, ge, contains,
          startsWith, endsWith. Filtering can be performed on all the fields.
          Examples:
           - Get dataSources with isDataSercice=false and name that starts with 'and(eq(isDataService,
          false), startsWith(name, "BASE"))'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: >-
          Sort returned data sources. The sort criteria supports all the
          fields in either ascending or descending order.  See [Sorting in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting) for
          more information on the format of the sort keys. Examples:
           - Sort by name in an ascending order: /dataAgentContent/servers/DataAgent_HR/dataSources?sortBy=name:ascending
           - Sort by id in a descending order: /dataAgentContent/servers/DataAgent_HR/dataSources?sortBy=id:descending
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK. Data sources available.
        "404":
          description: Data sources not found.
  /servers/{serverId}/dataSources/{dataSourceId}:
    get:
      operationId: getDataSource
      summary: Get Data Source
      description: Returns information about a single data source (data service or
        DSN) based on the provided id.
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      - name: dataSourceId
        in: path
        description: The data source id
        required: true
        schema:
          type: string
      tags:
      - Data Sources
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.data.agent.data.source+json:
              schema:
                $ref: "#/components/schemas/dataSource"
              examples:
                dataSource:
                  $ref: "#/components/examples/getDataSourceResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/dataSource"
              examples:
                dataSource:
                  $ref: "#/components/examples/getDataSourceResponse"
        "400":
          description: |
            Bad Request:
              - 27625 - A request resulted in the Server error.
            Message ''. SQLState ''. Error code ''.
              - 27626 - A request resulted in the service error ''.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerBadConnection"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerBadConnection"
        "404":
          description: |
            Data Source does not exist:
              - 27601 - The data source with name '' was not found.
              - 27600 - A Server with id '' was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorDataSourceNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorDataSourceNotFound"
    head:
      operationId: headersForDataSource
      summary: Check if a Data Source Name exists
      description: Returns whether or not a data source with the specified id exists.
      tags:
      - Data Sources
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      - name: dataSourceId
        in: path
        description: The dataSource id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK. Data source exists.
        "404":
          description: Data source does not exist
  /servers/{serverId}/dataSources/{dataSourceId}/catalogs:
    get:
      operationId: getCatalogs
      summary: Get Catalogs
      description: Returns a collection of catalogs. Standard paging, filtering and
        sorting options are provided. The members of this collection use application/vnd.sas.data.agent.catalog+json
        media type.
      tags:
      - Catalogs
      parameters:
      - name: serverId
        in: path
        description: The id of the Data Agent
        required: true
        schema:
          type: string
      - name: dataSourceId
        in: path
        description: The data source id
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first catalog in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of catalogs to return in this page of results.
          The actual number of returned catalogs may be less if the collection has
          been exhausted. Defaults to 30.
        schema:
          type: integer
      - name: filter
        in: query
        description: >
          Filter criteria for returned catalogs. See the [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters) for more
          information on the format of the filter. The supported functions
          are: and, or, not, eq, ne, lt, le, gt, ge, contains, startsWith,
          endsWith. Filtering can be performed on all the fields. Examples:
           - Get catalogs with name starting with and driver set to 'and(startsWith(name,
          "LD"), eq(driver, "BASE"))'
           - Get catalogs with name not containing 'not(contains(name, "BASE"))'
           - Get catalogs with driver not equals to 'ne(driver, "BASE")'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: >
          Sort returned catalogs. The sort criteria supports all the fields in
          either ascending or descending order.  See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting) for more
          information on the format of the sort keys. Examples:
           - Sort by name in an ascending order: /dataAgentContent/servers/DataAgent_HR/dataSources/BASE/catalogs?sortBy=name:ascending
           - Sort by driver in a descending order: /dataAgentContent/servers/DataAgent_HR/dataSources/BASE/catalogs?sortBy=driver:descending
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
