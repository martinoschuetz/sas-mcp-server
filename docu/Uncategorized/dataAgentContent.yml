  /servers/{serverId}/dataSources/{dataSourceId}/jobs:
    post:
      operationId: createJob
      summary: Submit a job for execution using a specified dataSourceId and serverId
      description: Submits a job for execution after establishing a connection with
        the specified dataSourceId and serverId. Runs a job in an asynchronous thread
        and returns the job results if the job is completed within the wait timeline
        that is controlled by the ?wait query parameter; otherwise returns the job
        and links to check the job's status and results. If ?wait is set to 0 returns
        the job immediately with the links to check the job's status and results.
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      - name: dataSourceId
        in: path
        description: The data source id
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first row in a page. Defaults to 0.
          Applies to the rows within a result set that was produced by running a DQL
          query.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Maximum number of rows to return in this page of results. The
          actual number of returned rows may be less if the collection has been exhausted.
          Defaults to 10. Applies to the rows within a result set that was produced
          by running a DQL query.
        schema:
          type: integer
          default: 10
      - name: sortBy
        in: query
        description: >
          Sort returned rows of data. See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting) for more
          information on the format of the sort keys. Rows sorted by any valid
          column name. Applies to the rows
          within a result set that was produced by running a DQL query.
        schema:
          type: string
      - name: includeColumnMetadata
        in: query
        description: Controls whether to include the column metadata. Default to true.
        schema:
          type: boolean
          default: true
      - name: columnDetail
        in: query
        description: The columnDetail options listed below yield the following in
          the columns member - summary as an application/vnd.sas.data.column.summary
          - detail - application/vnd.sas.data.column - names - the column name as
          a string. Defaults to names if includeColumnMetadata=true.
        schema:
          type: string
          default: "names"
      - name: wait
        in: query
        description: >
          Controls how long to wait for the job to be completed before returning anyway.
          Executes a job in an asynchronous thread and returns results if the time
          to wait hasn't exceeded. However, if it takes longer to execute than the
          time
          defined returns immediately with the links to check the job and its status.
          Defaults to 300 sec (or 5 min). If set to 0 will return immediately and
          provide the links
          to check the job results and status.
        schema:
          type: number
          default: 300
      - name: preserveSession
        in: query
        description: Controls whether to preserve a session in memory for the stateful
          result set traversal. This applies to the job that includes a DQL query
          which produces a result set only. The connection, statement and result set
          will remain open until the result set has been fetched in full, this parameter
          is set to false or session times out. Defaults to false.
        schema:
          type: boolean
          default: false
      - name: fetchSize
        in: query
        description: Applies to the row array size of results to fetch from a data
          source at a time.
        schema:
          type: number
          default: 100
      tags:
      - Jobs
      requestBody:
        $ref: "#/components/requestBodies/createJobRequest"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.data.agent.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                jobDdlResponse:
                  $ref: "#/components/examples/createSQLDDLJobResponse"
                jobDmlResponse:
                  $ref: "#/components/examples/createSQLDMLJobResponse"
                jobDqlResponse:
                  $ref: "#/components/examples/createSQLDQLJobResponse"
                paramJobResponse:
                  $ref: "#/components/examples/createParameterizedQueryJobResponse"
                jobDqlWithPreserveSessionResponse:
                  $ref: "#/components/examples/createSQLDQLJobWithPreserveSessionResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                jobDdlResponse:
                  $ref: "#/components/examples/createSQLDDLJobResponse"
                jobDmlResponse:
                  $ref: "#/components/examples/createSQLDMLJobResponse"
                jobDqlResponse:
                  $ref: "#/components/examples/createSQLDQLJobResponse"
                paramJobResponse:
                  $ref: "#/components/examples/createParameterizedQueryJobResponse"
                jobDqlWithPreserveSessionResponse:
                  $ref: "#/components/examples/createSQLDQLJobWithPreserveSessionResponse"
        "201":
          description: Created
          headers:
            Location:
              description: The location of a newly created job resource.
              schema:
                type: string
          content:
            application/vnd.sas.data.agent.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                jobDdlWithWaitResponse:
                  $ref: "#/components/examples/createSQLDDLWithWaitJobResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                jobDdlWithWaitResponse:
                  $ref: "#/components/examples/createSQLDDLWithWaitJobResponse"
        "400":
          description: |
            Bad Request:
              - 27619 - Invalid order value was specified in the sortBy parameter ""!
              - 27621 - An invalid includeColumnMetadata value "" found. The valid values are: 'true' and 'false'.
              - 27625 - A request resulted in the Server error.
            Message ''. SQLState ''. Error code ''.
              - 27626 - A request resulted in the service error ''.
              - 27632 - An error occurred during SQL statement execution: "".
              - 27633 - Parameters count mismatch in a parameterized query. Expected "", but found "" parameters in the body.
              - 27634 - Parameter type "" in "" is not supported.
              - 27635 - The requested job type "" is not supported.
              - 27636 - Batch processing is not supported.
              - 27724 - The required fields "" are missing in the body of the request.
              - 27639 - Failed to get a job with jobId="{0}" in the jobExecution service due to "{1}".
              - 27640 - The job with jobId="" in the jobExecution service was not successfully updated due to "".
              - 27643 - An invalid wait value "" specified.
              - 27644 - Unable to create a job using the jobExecution service due to "".
              - 27646 - An invalid preserveSession value "" found. The valid values are: 'true' and 'false'.
              - 27648 - An invalid fetchSize value "{0}" found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerBadConnection"
                sqlJobError:
                  $ref: "#/components/examples/sqlJobExecutionError"
            application/json:
