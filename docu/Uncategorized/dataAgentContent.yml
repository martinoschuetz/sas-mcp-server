        in: query
        description: The columnDetail options listed below yield the following in
          the columns member - summary as an application/vnd.sas.data.column.summary
          - detail - application/vnd.sas.data.column - names - the column name as
          a string. Defaults to names if includeColumnMetadata=true.
        schema:
          type: string
          default: "names"
      - name: preserveSession
        in: query
        description: Controls whether to preserve a session in memory for the stateful
          result set traversal. This applies to the job that includes a DQL query
          that produces a result set only. The connection, statement and result set
          will remain open until the result set has been fetched in full, this parameter
          is set to false or session times out. Defaults to true.
        schema:
          type: boolean
          default: true
      - name: fetchSize
        in: query
        description: Applies to the row array size of results to fetch from a data
          source at a time.
        schema:
          type: number
          default: 100
      tags:
      - Sessions
      responses:
        "200":
          description: OK. Session results exist.
        "400":
          description: Bad Request.
        "404":
          description: Server not found.
components:
  requestBodies:
    createServerRequest:
      description: The server media type including the attributes.
      content:
        application/vnd.sas.data.agent.server+json:
          schema:
            $ref: "#/components/schemas/server"
          examples:
            serverRequest:
              $ref: "#/components/examples/createServerRequest"
        application/vnd.sas.data.agent.server+json;version=2:
          schema:
            $ref: "#/components/schemas/server"
          examples:
            serverRequest:
              $ref: "#/components/examples/createServerRequest"
        application/vnd.sas.data.agent.server+json;version=1:
          schema:
            $ref: "#/components/schemas/serverVersionOne"
          examples:
            serverRequest:
              $ref: "#/components/examples/createServerRequestVersionOne"
        application/json:
          schema:
            $ref: "#/components/schemas/server"
          examples:
            serverRequest:
              $ref: "#/components/examples/createServerRequest"
      required: true
    createJobRequest:
      description: The job request media type.
      content:
        application/vnd.sas.data.agent.job.request+json:
          schema:
            $ref: "#/components/schemas/jobRequest"
          examples:
            submitDdlStatementRequest:
              $ref: "#/components/examples/createSQLDDLJobRequest"
            submitDmlStatementRequest:
              $ref: "#/components/examples/createSQLDMLJobRequest"
            submitDqlStatementRequest:
              $ref: "#/components/examples/createSQLDQLJobRequest"
            submitParameterizedStatementRequest:
              $ref: "#/components/examples/createParameterizedQueryJobRequest"
            submitDqlStatementWithPreserveSessionRequest:
              $ref: "#/components/examples/createSQLDQLJobWithPreserveSessionRequest"
        application/json:
          schema:
            $ref: "#/components/schemas/jobRequest"
          examples:
            submitDdlStatementRequest:
              $ref: "#/components/examples/createSQLDDLJobRequest"
            submitDmlStatementRequest:
              $ref: "#/components/examples/createSQLDMLJobRequest"
            submitDqlStatementRequest:
              $ref: "#/components/examples/createSQLDQLJobRequest"
            submitParameterizedStatementRequest:
              $ref: "#/components/examples/createParameterizedQueryJobRequest"
            submitDqlStatementWithPreserveSessionRequest:
              $ref: "#/components/examples/createSQLDQLJobWithPreserveSessionRequest"
      required: true
    patchServerRequest:
      description: The server media type including the oauthClientSecret option that
        can be updated.
      content:
        application/vnd.sas.data.agent.server+json:
          schema:
            $ref: "#/components/schemas/server"
          examples:
            serverRequest:
              $ref: "#/components/examples/patchServerRequest"
        application/vnd.sas.data.agent.server+json;version=2:
          schema:
            $ref: "#/components/schemas/server"
          examples:
            serverRequest:
              $ref: "#/components/examples/patchServerRequest"
        application/json:
          schema:
            $ref: "#/components/schemas/server"
          examples:
            serverRequest:
              $ref: "#/components/examples/patchServerRequest"
      required: true
  schemas:
    serverVersionOne:
      type: object
      description: Information about a SAS Data Agent.
      required:
      - name
      - host
      - port
      properties:
        id:
          type: string
          maxLength: 100
          description: |
            The server id
        name:
          type: string
          maxLength: 100
          description: |
            The name of the server
        host:
          type: string
          maxLength: 300
          description: |
            The machine host name on which the server is running
        port:
          type: integer
          maximum: 65535
          description: |
            The port value the server is listening to
        attributes:
          type: object
          description: >
            A generic attributes object containing the server connection options.
          properties:
            ssl:
              type: boolean
              description: |
                Indicates whether to use SSL to connect to the server. Default is true.
            contextRoot:
              type: string
              description: |
                The context root of the server.
            proxy:
              type: object
              description: >
                Optional proxy server configuration properties.
              properties:
                host:
                  type: string
                  description: |
                    The proxy server host name or IP address.
                port:
                  type: integer
                  description: |
                    The proxy server port number.
                domain:
                  type: string
                  description: |
                    The domain used for authentication to connect to the proxy server.
                    The credentials for domain are resolved by calling the credentials service.
                scheme:
                  type: string
                  description: |
                    The http scheme to use for proxy connection. Defaults to http.
                  enum:
                  - http
                  - https
          additionalProperties:
            type: object
            description: >
              Additional properties that are not explicitly defined in the schema.
              These properties can be used to provide custom connection options
              specific to the underlying driver.
        version:
          type: integer
          description: server schema version
        links:
          type: array
          description: Paging links that apply to this object
          items:
            $ref: "#/components/schemas/link"
    server:
      type: object
      description: Information about a SAS Data Agent.
      allOf:
      - $ref: "#/components/schemas/serverVersionOne"
      - type: object
        properties:
          oauthClientId:
            type: string
            description: |
              The OAuth client id to connect to the server. The service will create OAuth Client group and define authorization rules of OAuth client registration.
            maxLength: 100
          oauthClientSecret:
            type: string
            description: |
              The OAuth client secret to connect to the server. The service will create OAuth Client group and define authorization rules as a part of OAuth client registration. This field is omitted from the response body.
            maxLength: 200
    serverCollection:
      title: The Server Collection
      description: A pageable collection of server objects
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              oneOf:
              - $ref: "#/components/schemas/server"
              - $ref: "#/components/schemas/serverVersionOne"
            description: The array of `application/vnd.sas.data.agent.server+json`
              or 'application/vnd.sas.data.agent.server+json;version=1' or `application/vnd.sas.data.agent.server+json;version=2`
              representations.
    dataSource:
      type: object
      description: Information about a data source
      properties:
        id:
          type: string
          description: |
            The data source identifier
        name:
          type: string
          description: |
            The name of the data source
        isDataService:
          type: boolean
          description: >
            Defines if a data source is a data service or a data source name
            (DSN). Returns true if the data source is a data service.
        version:
          type: integer
          description: data source schema version
        links:
          type: array
          description: Links to related resources and/or operations
          items:
            $ref: "#/components/schemas/link"
    dataSourceCollection:
      title: The Data Source Collection
      description: A pageable collection of data source objects
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/dataSource"
            description: The array of `application/vnd.sas.data.agent.data.source+json`
              representations.
    catalog:
      type: object
      description: Information about a catalog
      properties:
        name:
          type: string
          description: |
            The name of the catalog
        description:
          type: string
          description: |
            A brief description about the catalog
        driver:
          type: string
          description: |
            The driver name
        version:
          type: integer
          description: Catalog schema version
        links:
          type: array
          description: Zero or more links to related resources and/or operations,
            including paging links.
          items:
            $ref: "#/components/schemas/link"
    catalogCollection:
      title: The Catalog Collection
      description: A pageable collection of catalog objects
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/catalog"
            description: The array of `application/vnd.sas.data.agent.catalog+json`
              representations.
    schema:
      type: object
      description: Information about a schema
      properties:
        name:
          type: string
          description: |
            The name of the schema
        version:
          type: integer
          description: schema version
        links:
          type: array
          description: Links to related resources and/or operations, including paging.
          items:
            $ref: "#/components/schemas/link"
    schemaCollection:
      title: The Schema Collection
      description: A pageable collection of schema objects
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/schema"
            description: The array of `application/vnd.sas.data.agent.schema+json`
              representations.
    table:
      type: object
      description: Information about a table
      properties:
        name:
          type: string
          description: |
            The name of the table
        type:
          type: string
          description: |
            The type of this table. Can be Table, View or System.
        nativeCatalog:
          type: string
          description: >
            The native data store's catalog; null if not applicable to the data
            source.
        remarks:
          type: string
          description: |
            Explanatory comment on the table.
        version:
          type: integer
          description: table schema version
        links:
          type: array
          description: Links to related resources and/or operations.
          items:
            $ref: "#/components/schemas/link"
    tableCollection:
      title: The Table Collection
      description: A pageable collection of table objects
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/table"
            description: The array of `application/vnd.sas.data.agent.table+json`
              representations.
    column:
      type: object
      description: Information about a column
      properties:
        name:
          type: string
          description: |
            The unique name of the column
        index:
          type: integer
          description: |
            The column's 1-based index
        type:
          type: string
          description: |
            The type of the column
        size:
          type: integer
          description: >
            If DATA_TYPE is CHAR or VARCHAR, this column contains the maximum
            length of the column in characters. For datetime data types, this is
            the total number of characters required to display the value when it
            is converted to characters. For numeric data types, this is either
            the total number of digits or the total number of bits allowed in
            the column, according to the NUM_PREC_RADIX column. For interval
            data types, this is the number of characters in the character
            representation of the interval literal.
        bufferLength:
          type: integer
          description: >
            The length in bytes of data transferred. For numeric data, this size
            might be different from the size of the data stored on the data
            source. This value might be different from COLUMN_SIZE column for
            character data.
        decimalDigits:
          type: string
          description: >
            The total number of significant digits to the right of the decimal
            point. If DATA_TYPE is TIME and TIMESTAMP, this column contains the
            number of digits in the fractional seconds component. For the other
            data types, this is the decimal digits of the column on the data
            source. For interval data types that contain a time component, this
            column contains the number of digits to the right of the decimal
            point (fractional seconds). For interval data types that do not
            contain a time component, this column is 0. Null is returned for
            data types where DECIMAL_DIGITS is not applicable.
        radix:
          type: string
          description: >
            For numeric data types, either 10 or 2 is returned. If the value
            returned is 10, the values in COLUMN_SIZE and DECIMAL_DIGITS contain
            the number of decimal digits allowed for the column. For example, a
            DECIMAL(12,5) column would return 10 for NUM_PREC_RADIX, 12 for
            COLUMN_SIZE, and 5 for DECIMAL_DIGITS; a FLOAT column could return
            10 for NUM_PREC_RADIX, 15 for COLUMN_SIZE, and null for
            DECIMAL_DIGITS. If the value returned is 2, the values in
            COLUMN_SIZE and DECIMAL_DIGITS give the number of bits allowed in
            the column. For example, a FLOAT column could return 2 for RADIX, 53
            for COLUMN_SIZE, and null for DECIMAL_DIGITS. Null is returned for
            data types where NUM_PREC_RADIX is not applicable.
        definition:
          type: string
          description: >
            The default value of the column. The value in this column should be
            interpreted as a string if it is enclosed in quotation marks. If
            null was specified as the default value, then this column is the
            word NULL, not enclosed in quotation marks. If the default value
            cannot be represented without truncation, then this column contains
            TRUNCATED, not enclosed in quotation marks. If no default value is
            specified, then this column is null. The value of COLUMN_DEF can be
            used in generating a new column definition, except when it contains
            the value TRUNCATED.
        remarks:
          type: string
          description: >
            A description of the column. For a FedSQL view, the value in the
            REMARKS column is FedSQL.VIEW.
        sqlDataType:
          type: integer
          description: >
            Data type, as it appears in the TKTS_DESC_TYPE record field. This
            can be a SAS FedSQL data type or a remote table driver-specific data
            type. This column is the same as the DATA_TYPE column, with the
            exception of datetime and interval data types. This column returns
            the nonconcise data type (such as DATETIME or INTERVAL), rather than
            the concise data type (such as DATE or YEAR_TO_MONTH) for datetime
            and interval data types. If this column returns DATETIME or
            INTERVAL, the specific data type can be determined from the
            TKTS_DATETIME_SUB column. For information about driver-specific TKTS
            data types, see the remote table driver's documentation.
        sqlDateTimeSubtype:
          type: string
          description: >
            The subtype code for datetime and interval data types. For other
            data types, this column returns a null.
        characterOctetLength:
          type: string
          description: >
            The maximum length in bytes of a character or binary data type
            column. For all other data types, this column returns a null.
        nullable:
          type: integer
          description: >
            TKTS_NO_NULLS if the column will not accept null values. TKTS
            _NULLABLE if the column accepts null values. TKTS_NULLABLE_UNKNOWN
            if it is not known whether the column accepts null values. The value
            returned for this column is different from the value returned for
            the IS_NULLABLE column. The NULLABLE column indicates with certainty
            that a column can accept null values, but cannot indicate with
            certainty that a column does not accept null values. The IS_NULLABLE
            column indicates with certainty that a column cannot accept null
            values, but cannot indicate with certainty that a column accepts
            null values.
        isNullable:
          type: string
          description: >
            NO if the column does not include nulls. YES if the column could
            include nulls. This column returns a zero-length string if
            nullability is unknown. ISO rules are followed to determine
            nullability. An ISO SQL-compliant DBMS cannot return an empty
            string. The value returned for this column is different from the
            value returned for the NULLABLE column.
        version:
          type: integer
          description: column schema version
        links:
          type: array
          description: Links to related resources and/or operations, including paging.
          items:
            $ref: "#/components/schemas/link"
    columnSummary:
      type: object
      description: Summary information about a column
      properties:
        name:
          type: string
          description: |
            The unique name of the column
        index:
          type: integer
          description: |
            The column's 1-based index
        type:
          type: string
          description: |
            The type of the column
        size:
          type: integer
          description: >
            If DATA_TYPE is CHAR or VARCHAR, this column contains the maximum
            length of the column in characters. For datetime data types, this is
            the total number of characters required to display the value when it
            is converted to characters. For numeric data types, this is either
            the total number of digits or the total number of bits allowed in
            the column, according to the NUM_PREC_RADIX column. For interval
            data types, this is the number of characters in the character
            representation of the interval literal.
        bufferLength:
          type: integer
          description: >
            The length in bytes of data transferred. For numeric data, this size
            might be different from the size of the data stored on the data
            source. This value might be different from COLUMN_SIZE column for
            character data.
        version:
          type: integer
          description: column schema version
        links:
          type: array
          description: Links to related resources and/or operations, including paging.
          items:
            $ref: "#/components/schemas/link"
    columnCollection:
      title: The Column Collection
      description: A pageable collection of column objects
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/column"
            description: The array of `application/vnd.sas.data.agent.column+json`
              representations.
    columnSummaryCollection:
      title: The Column Summary Collection
      description: A pageable collection of column summary objects
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/columnSummary"
            description: The array of `application/vnd.sas.data.agent.column.summary+json`
              representations.
    row:
      type: object
      description: Representation of a row object
      properties:
        cells:
          type: array
          description: >
            The cells for this row. Can be number, integer, null, boolean or
            string
          items: {}
        version:
          type: integer
          description: row schema version
        links:
          type: array
          description: Links that apply to this resource
          items:
            $ref: "#/components/schemas/link"
    rowCollection:
      title: The Row Collection
      description: A pageable collection of row resources
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/row"
            description: The array of `application/vnd.sas.data.row+json` representations.
    rowSet:
      type: object
      description: A paginated collection of rows, and their cell's corresponding
        columns
      properties:
        columnDetail:
          type: string
          description: >
            The level of detail of the columns array member. This value is set
            by the columnDetail query parameter, and defaults to summary when
            none is provided.
          enum:
          - summary
          - detail
          - names
        start:
          type: integer
          description: The 0-based index of the rows candidates to start returning.
        limit:
          type: integer
          description: The maximum number of rows requested.
        count:
          type: integer
          description: The actual number of rows returned in the collection.
        columnCount:
          type: integer
          description: The number of columns in the collection. May be omitted if
            the count is not known
        columnStart:
          type: integer
          description: The index of the first column in the columns member, 0-based.
            Defaults to 0. Will be omitted if the includeColumns query parameter is
            set.
        columnLimit:
          type: integer
          description: The number of columns to return in each page. Defaults to 25.
            Will be omitted if the includeColumns query parameter is set.
        links:
          type: array
          description: Paging links that apply to this object
          items:
            $ref: "#/components/schemas/link"
        rows:
          type: array
          description: The results of this query as an array containing arrays of
            heterogeneous data
          items:
            type: array
            items: {}
        columns:
          type: array
          description: >
            The rows' corresponding columns. The type of items in this array is
            determined by the columnDetail query parameter's value which can be
            one of the following:  <ul>  <li>summary - The default if none is
            specified. Will contain application/vnd.sas.data.column.summary
            objects. <li>detail - Will contain application/vnd.sas.data.column
            objects. <li>names - Will contain the column names as JSON
            strings.  </ul>
          items:
            type: string
        version:
          type: integer
          description: Collection schema version
    jobRequest:
      title: Job Request Schema
      description: The job request.
      type: object
      required:
      - code
      properties:
        name:
          type: string
          description: The name of the job request. Persisted with the asynchronous
            execution.
          maxLength: 100
        type:
          type: string
          description: The job type whether it's SQL or DS2 or any other supported
            type in the future. The supported type is sql.
          maxLength: 10
        code:
          type: string
          description: Execution SQL statement code to be executed.
        arguments:
          type: array
          description: The parameter values defined for a parameterized query as an
            array of objects which could be a number, a boolean or a string. The arguments
            are required for the parameterized statement. The batch processing with
            submission of an array of arrays is not supported yet.
          items: {}
          maxLength: 100
        version:
          type: integer
          description: The version number of the representation. The current version
            is 1.
        links:
          type: array
          description: Links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
    job:
      title: Execution Job Response Schema
      description: The execution job response.
      properties:
        id:
          type: string
          description: The unique identifier that is generated by the API for the
            job that is persisted and is executed asynchronously.
        name:
          type: string
          description: The name of the job request. Persisted with the asynchronous
            execution.
        type:
          type: string
          description: The job type whether it's SQL or DS2 or any other supported
            type in the future. The supported type is sql.
        state:
          type: string
          description: The current state of the job. Applies to the asynchronous job
            only.
          enum:
          - pending
          - running
          - canceled
          - completed
          - failed
          - timedOut
        result:
          $ref: "#/components/schemas/result"
        error:
          $ref: "#/components/schemas/error2"
        links:
          type: array
          description: Links that apply to this object. Includes "self", "up" and
            paging links for responses that contain a non-empty result set.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the representation. The current version
            is 1.
    result:
      title: Result
      type: object
      description: The result produced by running the job.
      properties:
        status:
          type: string
          description: The status of the job.
          enum:
          - error
          - noData
          - needData
          - executing
          - success
          - successWithInfo
          - invalidHandle
        returnCode:
          type: integer
          description: The return code from the execution. 0 indicates success.
        submittedCode:
          type: string
          description: The SQL statement(s) or DS2 code that was submitted for execution.
            If there were multiple statements submitted they are separated by the
            semicolon.
        arguments:
          type: array
          description: The values of the arguments as an array of objects that were
            used to run a job with. This applies to the parameterized query.
          items: {}
        updateCount:
          type: integer
          description: The count of the number of rows that got updated after this
            job execution.
        resultSet:
          $ref: "#/components/schemas/resultSet"
    resultSet:
      title: Result Set
      type: object
      description: A paginated collection of rows in a result set returned from a
        DQL statement execution.
      properties:
        start:
          type: integer
          description: The 0-based index of the rows candidates to start returning.
        limit:
          type: integer
          description: The maximum number of rows requested. Defaults to 10.
        count:
          type: integer
          description: The actual number of rows returned in the collection.
        columnCount:
          type: integer
          description: The number of columns in the collection. Can be omitted if
            the count is not known.
        columnDetail:
          type: string
          description: >
            The level of detail of the columns array member. This value is set by
            the columnDetail query parameter, and defaults to names when none is provided.
          enum:
          - summary
          - detail
          - names
        rows:
          type: array
          description: The results of this query as an array containing arrays of
            heterogeneous data.
          items:
            type: array
            items: {}
        columns:
          type: array
          description: >
            The rows' corresponding columns. The type of items in this array is determined
            by the columnDetail query parameter's value, which can be one of the following:
            <ul>
            <li>summary - The default if no value is specified. Contains application/vnd.sas.data.column.summary
            objects.</li>
            <li>detail - Contains application/vnd.sas.data.column objects.</li>
            <li>names - Contains the column names as JSON strings.</li>
            </ul>
          items: {}
        links:
          type: array
          description: Paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the representation. The current version
            is 1.
    session:
      title: Session
      type: object
      description: A Data Agent's session that is normally preserved for the stateful
        result set traversal. It includes the session, connection and statement handle
        IDs.
      properties:
        id:
          type: string
          description: The session ID.
        status:
          type: string
          description: The connection status.
        isClosed:
          type: boolean
          description: Returns whether the connection is closed.
        links:
          type: array
          description: Links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
