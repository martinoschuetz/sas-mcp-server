              description: The entity tag for the report theme.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the report theme was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.theme.report.complete+json:
              schema:
                $ref: "#/components/schemas/reportTheme"
              examples:
                json:
                  $ref: "#/components/examples/reportThemeResp"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/postThemes400"
        "403":
          description: The user did not have the necessary permissions. User must
            be a member of the Application Administrators custom group.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/themes403"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. A theme with the name, or id in conjunction
            with useProvidedId=true, provided already exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/themes409"
  /themes#importPackage:
    post:
      summary: Import to create new themes using a theme package
      description: Creates new themes from the theme package. This can only be invoked
        by authorized users. The content must be 95Mb or less.
      operationId: importPackage
      tags:
      - Theme Package
      parameters:
      - name: replaceDups
        in: query
        required: false
        description: If there are existing themes that have the same names as themes
          in the package, replace the existing themes with the content in the package
          if this value is true. Otherwise create a new theme for any duplicates.
        schema:
          type: boolean
      - name: ext
        in: query
        required: true
        description: The file extension for the content to be imported. Acceptable
          values are "td" and "tdf".
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.theme.package:
            schema:
              $ref: "#/components/schemas/themePackage"
            examples:
              sampleFile:
                summary: A sample file
                externalValue: './examples/themePackage.zip'
        description: The theme(s) to be imported.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/themeCollection"
              examples:
                json:
                  $ref: "#/components/examples/import200"
        "400":
          description: The request was invalid. This occurs when the theme package
            does not contain valid content or if the content is greater than 95Mb.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/import400"
        "403":
          description: The user did not have the necessary permissions. User must
            be a member of the Application Administrators custom group.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/themes403"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. One or more of the themes in the package
            has the same name as an existing theme. The IDs of the conflicting themes
            are provided via the X-Error-Theme-Name-Conflict response header.
          headers:
            X-Error-Theme-Name-Conflict:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    message:
                      type: array
              description: ID(s) of the conflicting themes in the format {\"message\":\"[abcd1234,
                wxyz1234]\"}
  /themes#createFromTransfer:
    post:
      summary: Import to create a new theme using transfer object
      description: Creates a new theme from the transfer object. Other than the old
        theme ID, all other theme properties are preserved.
      operationId: createFromTransfer
      tags:
      - Transfer
      requestBody:
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              createFromTransfer:
                $ref: "#/components/examples/transferObjRequest"
        description: The theme to be imported.
        required: true
      responses:
        "201":
          description: The theme was imported.
          headers:
            Location:
              description: The URL of the application theme.
              schema:
                type: string
                format: uri
            Etag:
              description: The entity tag for the theme.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the theme was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/resourceSummary"
              examples:
                json:
                  $ref: "#/components/examples/createFromTransferObj201"
            application/json:
              schema:
                $ref: "#/components/schemas/resourceSummary"
              examples:
                json:
                  $ref: "#/components/examples/createFromTransferObj201"
        "400":
          description: The request was invalid. This occurs when the transfer object
            does not contain valid content or the theme uri does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/themes400"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. A theme with the name provided already
            exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/transfer409"
  "/themes/{themeId}#applicationTheme":
    get:
      summary: Get an application theme
      description: Returns the representation of the specified application theme.
      operationId: getApplicationTheme
      tags:
      - Themes
      parameters:
      - $ref: "#/components/parameters/themeId"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: The entity tag for the theme.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the theme was last modified.
              schema:
                type: string
            Cache-Control:
              description: This value is "no-cache".
              schema:
                type: string
          content:
            application/vnd.sas.theme.application+json:
              schema:
                $ref: "#/components/schemas/themeSummary"
              examples:
                json:
                  $ref: "#/components/examples/getAppThemeShort"
            application/vnd.sas.theme.application.complete+json:
              schema:
                $ref: "#/components/schemas/theme"
              examples:
                json:
                  $ref: "#/components/examples/getAppThemeFull"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/resourceSummary"
              examples:
                json:
                  $ref: "#/components/examples/resourceSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/resourceSummary"
              examples:
                json:
                  $ref: "#/components/examples/resourceSummary"
        "404":
          description: No theme exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/theme404"
        "406":
          description: An invalid media type was specified for the Accept header value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/theme406"
    head:
      summary: Get the headers for an application theme
      description: Returns the headers for an application theme. Also used to determine
        whether a particular application theme exists.
      tags:
      - Themes
      operationId: headersForApplicationTheme
      parameters:
      - $ref: "#/components/parameters/themeId"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: The entity tag for the theme.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the theme was last modified.
              schema:
                type: string
            Cache-Control:
              description: This value is "no-cache".
              schema:
                type: string
        "404":
          description: No theme exists at the requested path.
        "406":
          description: An invalid media type was specified for the Accept header value.
    put:
      summary: Update an application theme
      description: Updates the specified application theme based on the representation
        in the request body. Only authorized users can invoke this method.
      tags:
      - Themes
      operationId: updateApplicationTheme
      parameters:
      - $ref: "#/components/parameters/themeId"
      requestBody:
        content:
          application/vnd.sas.theme.application.complete+json:
            schema:
              $ref: "#/components/schemas/updateApplicationTheme"
            examples:
              updateApplicationTheme:
                $ref: "#/components/examples/updateAppThemeRequest"
        description: The representation of an application theme.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: The entity tag for the theme.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the theme was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.theme.application.complete+json:
              schema:
                $ref: "#/components/schemas/theme"
              examples:
                json:
                  $ref: "#/components/examples/applicationThemeResp"
            application/json:
              schema:
                $ref: "#/components/schemas/theme"
              examples:
                json:
                  $ref: "#/components/examples/applicationThemeResp"
        "400":
          description: "The request falls into one of the following categories: No\
            \ data was provided; the ID in the request does not match the ID in URL;\
            \ the request data contains an empty theme name; changing a system theme\
            \ is prohibited."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/updateTheme400"
        "403":
          description: The user did not have the necessary permissions. User must
            be a member of the Application Administrators custom group.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/themes403"
        "404":
          description: No theme exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/theme404"
        "406":
          description: An invalid media type was specified for the Accept header value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/updateTheme406"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. A theme with the name provided already
            exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/themes409"
