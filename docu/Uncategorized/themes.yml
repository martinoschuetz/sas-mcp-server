      tags:
      - Themes
      operationId: updateReportTheme
      parameters:
      - $ref: "#/components/parameters/themeId"
      requestBody:
        content:
          application/vnd.sas.theme.report.complete+json:
            schema:
              $ref: "#/components/schemas/updateReportTheme"
            examples:
              updateReportTheme:
                $ref: "#/components/examples/updateRepThemeRequest"
        description: The representation of an report theme.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: The entity tag for the theme.
