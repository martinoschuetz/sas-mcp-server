  /publishJobs:
    post:
      operationId: createPublishJob
      summary: Submit a publish job request
      description: Submits a request to publish a theme to make it available to all
        applications within the deployment. If the theme has not changed since it
        was last published, it will not be republished. If the user POSTs, immediately
        changes the theme, and POSTs again, the initial job will be canceled. The
        request body is empty. Since 4 - added for asynchronous publishing.
      tags:
      - Theme Publish Job
      parameters:
      - name: themeId
        in: query
        required: true
        description: The ID for the theme to be published
        schema:
          type: string
      responses:
        "200":
          description: Theme was not modified since it was last published.
          headers:
            Location:
              description: The URI of the published theme if it has already been published
                and not modified.
              schema:
                type: string
                format: uri
        "202":
          description: Theme publish request was accepted.
          headers:
            Location:
              description: The URI of the job if theme is not already published.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.theme.publish.job+json:
              schema:
                $ref: "#/components/schemas/publishJob"
              examples:
                json:
                  $ref: "#/components/examples/postPublishJob202"
            application/json:
              schema:
                $ref: "#/components/schemas/publishJob"
              examples:
                json:
                  $ref: "#/components/examples/postPublishJob202"
        "400":
          description: A theme identifier must be specified to submit a publish theme
            job.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/postPublishJob400"
        "404":
          description: The theme was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/postPublishJob400"
    get:
      summary: Get a list of publish jobs
      description: Returns a collection of publish jobs based on the specified pagination,
        filtering, and sorting options.
      operationId: getPublishJobs
      tags:
      - Theme Publish Job
      parameters:
      - name: start
        description: The 0-based index of the first job to return.
        in: query
        schema:
          type: integer
          default: 0
      - name: limit
        description: The maximum number of jobs to be returned in this page of results.
          The actual number of returned jobs might be less if the collection has been
          exhausted.
        in: query
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the returned jobs. A sample query
          is - Filter by job ID - /themes/publishJobs?filter=eq(publishJob.id, 'ec0292d8-884d-47c4-860c-52a774e55786')
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Defines how the returned jobs are sorted. The default sort order
          is descending on the creation time stamp field. Some sample sorts - Sort
          ascending by ID - /themes/publishJobs?sortBy=id:ascending Sort descending
          by ID - /themes/publishJobs?sortBy=id:descending
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/publishJobCollection"
              examples:
                json:
                  $ref: "#/components/examples/getPublishJobs"
            application/json:
              schema:
                $ref: "#/components/schemas/publishJobCollection"
              examples:
                json:
                  $ref: "#/components/examples/getPublishJobs"
  "/publishJobs/{jobId}":
    get:
      summary: Get a publish job
      description: Return a particular publish job representation.
      operationId: getPublishJob
      tags:
      - Theme Publish Job
      parameters:
      - name: jobId
        in: path
        description: The ID of the job.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: The entity tag for the job.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                of when the job was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.theme.publish.job+json:
              schema:
                $ref: "#/components/schemas/publishJob"
              examples:
                json:
                  $ref: "#/components/examples/getPublishJob200"
            application/json:
              schema:
                $ref: "#/components/schemas/publishJob"
              examples:
                json:
                  $ref: "#/components/examples/getPublishJob200"
        "404":
          description: No job exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/publishJob404"
    head:
      summary: Get the headers for a publish job
      description: Returns the headers for a publish job representation. Also used
        to determine whether a particular publish job exists.
      tags:
      - Theme Publish Job
      operationId: headersForPublishJob
      parameters:
      - name: jobId
        in: path
        required: true
        description: The ID of the job.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: The entity tag for the job.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                of when the job was last modified.
              schema:
                type: string
        "404":
          description: No job exists at the requested path.
    delete:
      operationId: deletePublishJob
      summary: Delete a publish job
      description: Deletes the given publish job. Only authorized users can invoke
        this request.
      tags:
      - Theme Publish Job
      parameters:
      - name: jobId
        in: path
        description: The ID of the job.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The job was deleted.
        "403":
          description: The user did not have the necessary permissions. User must
            be a member of the Application Administrators custom group.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/themes403"
        "404":
          description: No job exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/publishJob404"
  "/publishJobs/{jobId}/state":
    get:
      summary: Get the state of the job
      description: "Gets the state of the job: pending, running, canceled, completed,\
        \ or failed."
      operationId: getPublishJobState
      tags:
      - Theme Publish Job
      parameters:
      - name: jobId
        in: path
        description: The ID of the job.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              example: "running"
        "404":
          description: No job exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/publishJob404"
    head:
      operationId: headersForPublishJobState
      summary: Get the headers for the state of the publish job
      description: Get the headers for the state of the current publish job.
      tags:
      - Theme Publish Job
      parameters:
      - name: jobId
        in: path
        description: The ID of the job.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: No job exists at the requested path.
          headers:
            Content-Type:
              schema:
                $ref: '#/components/schemas/error'
    put:
      operationId: updatePublishJobState
      summary: Set the state of the publish job
      description: Sets the state of the current publish job. The new state must be
        set as the value query parameter, and the only acceptable value is "canceled".
        Only authorized users can invoke this request.
      tags:
      - Theme Publish Job
      parameters:
      - name: jobId
        in: path
        description: The ID of the job.
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: The value of the state.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: The request was invalid. An invalid request occurs in the following
            scenarios -An invalid state value was provided; The state was not specified
            in the value query parameter.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/publishJobState400"
        "403":
          description: The user did not have the necessary permissions. User must
            be a member of the Application Administrators custom group.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/themes403"
        "404":
          description: No job exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/publishJob404"
        "405":
          description: The job has already completed and can no longer be updated.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/publishJobState405"
  "/publishedThemes/{themeId}":
    delete:
      operationId: unpublishTheme
      summary: Unpublish a theme
      description: Remove a theme from the set of published themes. This prevents
        it from appearing in Settings UI or from being set as a default theme for
        the deployment. Only authorized users can invoke this request.
      tags:
      - Themes
      parameters:
      - $ref: "#/components/parameters/themeId"
      responses:
        "204":
          description: Theme was successfully unpublished.
        "403":
          description: The user did not have the necessary permissions. User must
            be a member of the Application Administrators custom group. Or unpublish
            was attempted on a system or default theme.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/themes403"
        "404":
          description: No theme exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/theme404"
servers:
- url: http://example.com/themes
  description: Sample server URL.
components:
  parameters:
    themeId:
      name: themeId
      in: path
      required: true
      description: The unique identifier for the theme.
      schema:
        type: string
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error:
      $ref: "#/components/schemas/error2"
    transferObject:
      title: Transfer Object
      description: Content providers implementing the Transfer Object Provider contract
        use this media type to store information about the content to be transfered.
      x-sas-media-type:
        name: application/vnd.sas.transfer.object
        version: 1
      properties:
        id:
          type: string
          format: object-id
          description: unique identifier of the object
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        summary:
          $ref: "#/components/schemas/summary"
        content:
          type: object
          description: optional. Choose this or fileServiceContent. This is the content
            object that must be serialized in a format that is valid for internet
            transmission. This includes valid encoding formats like Base64 or data
            structures like JSON. This is provided by the content provider and the
            transfer service expects no visibility into or understanding of this value.
        fileServiceContent:
          type: string
          description: optional. Choose this or content. This holds the URI of a file
            service object that contains the transferrable object.
        connectors:
          type: array
          description: a list of associations or references to other external objects
            to be recreated on import
          items:
            $ref: "#/components/schemas/transferObjectConnector"
        substitutions:
          type: object
          description: map with keys of parameter and value. Used to replace the value
            of parameter with the value of value
        links:
          type: array
          description: Paging links that apply to this object
          items:
            $ref: "#/components/schemas/link"
    resourceSummary:
      $ref: "#/components/schemas/summary"
    themeSummary:
      title: Theme Summary
      description: The summary representation of a theme.
      properties:
        id:
          type: string
          description: The unique identifier for the theme.
          maxLength: 128
        name:
          type: string
          description: The theme's display name.
          maxLength: 100
        rootUrl:
          type: string
          description: The system-generated theme root URL (null for system themes
            or if theme is not published).
        links:
          description: The links that apply to the theme.
          type: array
          items:
            $ref: "#/components/schemas/link"
    reportThemeSummary:
      title: Report Theme Summary
      description: The summary representation of a report theme.
      allOf:
      - $ref: "#/components/schemas/themeSummary"
      - type: object
        properties:
          version:
            type: integer
            format: int32
            description: The version number of the theme representation. This representation
              is version 3.
