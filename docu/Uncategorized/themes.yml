---
openapi: 3.0.3
info:
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  title: Themes
  description: This API manages a repository of theme resources.
  version: "7"
tags:
- name: Themes
  description: The operations for the themes resource.
- name: Theme Publish Job
  description: The operations for a theme publish job.
- name: Theme Package
  description: The operations for importing and exporting themes.
- name: Transfer
  description: The operations for the transfer resource.
- name: Root
  description: The operations for the root resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootLinks"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootLinks"
  /themes:
    get:
      summary: Get a collection of themes
      description: Returns a collection of themes based on the specified pagination,
        filtering, and sorting options. If the 'Accept-Item' header is missing the
        themes will be returned in complete resource format; otherwise, if it has
        a value of 'application/vnd.sas.theme.report+json' or 'application/vnd.sas.theme.application+json'
        the themes will be returned in the minimal theme format.
      operationId: getThemes
      tags:
      - Themes
      parameters:
      - name: Accept-Item
        description: Select the desired item representation. If not present then items
          of application/vnd.sas.theme.report.complete+json or application/vnd.sas.theme.application.complete+json
          type(s) are returned; otherwise if it has a value of 'application/vnd.sas.theme.report+json'
          or 'application/vnd.sas.theme.application+json' then items of application/vnd.sas.theme.application+json
          and application/vnd.sas.theme.report+json type are returned.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.theme.application.complete+json
          - application/vnd.sas.theme.report.complete+json
          - application/vnd.sas.theme.application+json
          - application/vnd.sas.theme.report+json
      - name: Accept-Language
        description: This is an optional header.  If present the locale it represents
          will be used in the processing, especially in sorting and filtering.
        in: header
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: Filter collection to only include themes of the specified type
        schema:
          type: string
      - name: published
        in: query
        required: false
        description: Filter collection to only include published themes
        schema:
          type: boolean
      - name: frameworkVersion
        in: query
        required: false
        description: Filter rootUrls on UI framework version (ex. 3.0.0, 3.1.0, etc.).
          rootUrls will only contain the specified version. Note this is deprecated
          from Version 2. This parameter has no effect.
        schema:
          type: string
      - name: start
        description: The index of the first theme to return.
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        description: The maximum number of themes to return.
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 500
      - name: filter
        in: query
        description: The criteria for filtering the themes. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/themes-v5/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        required: false
        description: The criteria for sorting the themes. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/themes-v5/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/themeCollection"
              examples:
                getThemes:
                  $ref: "#/components/examples/getThemes"
            application/json:
              schema:
                $ref: "#/components/schemas/themeCollection"
              examples:
                getThemes:
                  $ref: "#/components/examples/getThemes"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                getThemes:
                  $ref: "#/components/examples/getThemes400"
        "406":
          description: The request was not acceptable. An invalid media type was specified
            for the Accept-Item header value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                getThemes:
                  $ref: "#/components/examples/getThemes406"
  /themes#exportPackage:
    get:
      summary: Get themes in package format for export
      description: This gets all themes specified via the "ids" query parameter and
        returns them in a package format. Mainly intended for use by the Theme Designer
        application.
      operationId: getExportPackage
      tags:
      - Theme Package
      parameters:
      - name: ids
        in: query
        required: true
        description: Comma-separated list of theme ids to include in export package.
          A minimum 1 and a maximum of 10 must be specified.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. Returns the themes as a theme package.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.theme.package:
              schema:
                $ref: "#/components/schemas/themePackage"
              examples:
                sampleFile:
                  summary: A sample file
                  externalValue: './examples/themePackage.zip'
        "400":
          description: The request was invalid. This occurs when the 'ids' parameter
            does not meet the requirements.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/export400"
  /themes#createApplicationTheme:
    post:
      summary: Create a new application theme
      description: Creates a new application theme based on the representation in
        the request body. This can only be invoked by authorized users. Note application/json
        is not supported as a Content-Type value due to ambiguity - content could
        be either a report theme, an application theme, or a transfer object. application/json
        is also not supported as an Accept value due to ambiguity between a single
        theme response or a collection of themes.
      operationId: createApplicationTheme
      tags:
      - Themes
      parameters:
      - name: useProvidedId
        in: query
        required: false
        description: If true, specifies to preserve the theme's id as specified in
          the id field; otherwise a new identifier is allocated. This is intended
          for migration use cases. If true and id is not supplied, this value is ignored.
          If false and id is supplied in the body, the id is ignored.
        schema:
          type: boolean
      requestBody:
        content:
          application/vnd.sas.theme.application.complete+json:
            schema:
              $ref: "#/components/schemas/createApplicationTheme"
            examples:
              createApplicationTheme:
                $ref: "#/components/examples/createAppThemeRequest"
        description: The representation of an application theme.
        required: true
      responses:
        "201":
          description: An application theme was created.
          headers:
            Location:
              description: The URL of the application theme.
              schema:
                type: string
                format: uri
            Etag:
              description: The entity tag for the application theme.
              schema:
                type: string
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the application theme was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.theme.application.complete+json:
              schema:
                $ref: "#/components/schemas/theme"
              examples:
                json:
                  $ref: "#/components/examples/applicationThemeResp"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/postThemes400"
        "403":
          description: The user did not have the necessary permissions. User must
            be a member of the Application Administrators custom group.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/themes403"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. A theme with the name, or id in conjunction
            with useProvidedId=true, provided already exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/themes409"
  /themes#createReportTheme:
    post:
      summary: Create a new report theme
      description: Creates a new report theme based on the representation in the request
        body. This can only be invoked by authorized users. Note application/json
        is not supported as a Content-Type value due to ambiguity - content could
