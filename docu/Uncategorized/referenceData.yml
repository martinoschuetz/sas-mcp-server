        "404":
          description: No domain exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    put:
      tags:
      - Reference Data
      operationId: updateReferenceDataDomainContent
      summary: Update reference data domain or value list content
      description: 'Updates the content of a domain or value. The label of the content
        can always be changed. The status of a production version cannot be changed
        back to "candidate" or "developing". The `majorNumber` and `minorNumber` cannot
        be changed. If the status is to be changed to "production", the domain content
        must have one or more entries. Otherwise, you get an error.


        When the status of the content is changed to production, the entries in the
        version are published to two location types. The first type is all the Micro
        Analytic Score service publish destinations defined in the deployment. The
        second type is all the Cloud Analytic Services servers available to the deployment.
        To each Micro Analytic Score destination, a public module containing a DS2
        package is published. The package is named using the packageName field of
        the domain. In the package, the domain content is shown as a hash table. The
        find method of the package can be used to search the hash table to look up
        a value in the domain content using a key. On each Cloud Analytic Services
        server, a format is created in a global formats library to realize the domain
        content. The name for the format is the formatName field of the domain. If
        publishing the entries to either location fails, the status of the domain
        version is not changed to "production".


        The asynchronous parameter changes only the behavior of the endpoint when
        the status of a domain content is to be changed to production. In that scenario,
        the content status change becomes a two-stage process. The first stage is
        to change the status to activating while the publish to the various destinations
        are initiated. After the publish initiation, the endpoint changes the activationStatus
        of the content to running and then returns. The second stage of changing the
        status of the domain content to production is achieved when the statuses of
        the publishes are obtained and resolved to total success. When you issue a
        GET operation on the domain content or the contents collection of the domain,  if
        all the publishes have finished, the status for the content shows "production",
        if all publishes have finished successfully. The content status remains in
        "activating" and the activationStatus showing "failed" if at least one publish
        failed. If a publish is still running, the activationStatus continues to show
        "running".


        The `currentContents` endpoint does not show the content as production until
        the result of the asynchronous publish is known and all publishes are successful.


        Note that publish to Micro Analytic Score service destinations can be disabled
        via SAS Environment Manager.  This can be accomplished by enabling property
        "lookupDisableMasPublish" under category "sas.referencedata.publish".  If
        "lookupDisableMasPublish" is enabled, then "lookupStaticBinding" under category
        "sas.businessrules" should also be enabled.'
      parameters:
      - name: domainId
        in: path
        description: The identifier of a reference data domain or value list.
        required: true
        schema:
          type: string
      - name: contentId
        in: path
        description: The identifier of a reference data domain or value list content.
        required: true
        schema:
          type: string
      - name: asynchronous
        in: query
        description: Indicate whether the domain production publish is asynchronous
          or synchronous. If true, the production publish is asynchronous. The default
          is false.
        required: false
        schema:
          type: boolean
      - name: If-Match
        in: header
        description: The ETag value that was returned from a GET, POST, or PATCH of
          the domain entry collection. If the ETag value does not match the etag value
          of the resource, the update fails.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.data.reference.domain.content+json:
            schema:
              $ref: "#/components/schemas/domainContent"
            examples:
              default:
                $ref: "#/components/examples/updateReferenceDataDomainContent"
          application/vnd.sas.data.reference.value.list.content+json:
            schema:
              $ref: "#/components/schemas/valueListContent"
            examples:
              default:
                $ref: "#/components/examples/updateReferenceDataValueListContent"
          application/json:
            schema:
              $ref: "#/components/schemas/domainContent"
            examples:
              default:
                $ref: "#/components/examples/updateReferenceDataDomainContent"
        description: The content representation. Use only the label and status member.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Location:
              description: The URI of this domain content.
              schema:
                type: string
            ETag:
              description: A tag that identifies this domain content.
              schema:
                type: string
          content:
            application/vnd.sas.data.reference.domain.content+json:
              schema:
                $ref: "#/components/schemas/domainContent"
              examples:
                default:
                  $ref: "#/components/examples/updatedDomainContent"
            application/vnd.sas.data.reference.value.list.content+json:
              schema:
                $ref: "#/components/schemas/valueListContent"
              examples:
                default:
                  $ref: "#/components/examples/updatedValueListContent"
            application/json:
              schema:
                $ref: "#/components/schemas/domainContent"
              examples:
                default:
                  $ref: "#/components/examples/updatedDomainContent"
        "202":
          description: The request is accepted.
          headers:
            ETag:
              description: A tag that identifies this domain or value list content.
              schema:
                type: string
          content:
            application/vnd.sas.data.reference.domain.content+json:
              schema:
                $ref: "#/components/schemas/domainContent"
              examples:
                defaut:
                  $ref: "#/components/examples/updatedDomainContent"
            application/vnd.sas.data.reference.value.list.content+json:
              schema:
                $ref: "#/components/schemas/valueListContent"
              examples:
                defaut:
                  $ref: "#/components/examples/updatedValueListContent"
            application/json:
              schema:
                $ref: "#/components/schemas/domainContent"
              examples:
                default:
                  $ref: "#/components/examples/updatedDomainContent"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No domain or value list content exists at the requested path.
            Resource is not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
