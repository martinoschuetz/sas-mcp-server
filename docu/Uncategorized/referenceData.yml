                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
  "/domains/{domainId}/contents/{contentId}/entries":
    get:
      tags:
      - Reference Data
      operationId: getReferenceDataDomainEntries
      summary: Get the entries for the content of a reference data domain or value
        list
      description: "There are two media types that can be used with the Accept header\
        \ of the request. The first one is application/vnd.sas.collection. This causes\
        \ a page of entries in the domain content to be returned. The second one is\
        \ text/csv. The text/csv follows the RFC 4180 format. This causes all the\
        \ entries in the domain content to be returned because the response content\
        \ paging is not supported. Use the paging support parameters `start` and `limit`\
        \ when accepting text/csv. The response content is associated with the domain\
        \ type. The entry of value list is different with a domain."
      parameters:
      - name: domainId
        in: path
        description: The identifier of a reference data domain or value list.
        required: true
        schema:
          type: string
      - name: contentId
        in: path
        description: The identifier of a reference data domain or value list content.
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first item on a page. The index is
          0-based. The default index is 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of items to return on this page. The actual
          number of returned items might be less if there are no more items in the
          collection. The default is 10.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The sort criteria for the returned entries. The default sort
          order is key:ascending.
        schema:
          type: string
          format: sort-criteria
      - name: filter
        in: query
        description: The filter criteria for the returned entries.
        schema:
          type: string
          format: filter-criteria
      - name: Accept
        in: header
        description: Choose the representation of the returned entries.
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - text/csv
          default: application/vnd.sas.collection+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies this domain entry collection.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/domainEntryCollection"
              examples:
                default:
                  $ref: "#/components/examples/fullLookUpEntriesCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/valueListEntryCollection"
              examples:
                default:
                  $ref: "#/components/examples/fullValueListEntriesCollection"
            text/csv:
              schema:
                type: string
              example: |
                key,value
                A,1
                b,2

                or

                key,value,disable,order
                A,1,false,1
                b,2,true,2
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    post:
      tags:
      - Reference Data
      operationId: createReferenceDataDomainEntries
      summary: Create or replace reference for data domain entries
      description: 'If the containing domain content has the status of "production",
        the creation or replacement of entries is not allowed. There are two media
        types that can be used with the Content-Type header of the request. The first
        one is application/vnd.sas.collection. The second one is text/csv. text/csv
        follows the RFC 4180 format.


        The same media types can also be used with the Accept header of the request.
        However, the Content-Type and Accept combination of application/vnd.sas.collection
        and text/csv is not valid. When the Accept media type is application/vnd.sas.collection,
        the first page of the sorted entries, by ascending keys, is returned. When
        the Accept media type is text/csv, all the entries sorted in ascending keys
        are returned.'
      parameters:
      - name: domainId
        in: path
        description: The identifier of a reference data domain.
        required: true
        schema:
          type: string
      - name: contentId
        in: path
        description: The identifier of a reference data domain content.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The ETag value that was returned from a GET, POST, or PATCH of
          the domain entry collection. This is not required when creating domain entries
          but required when replacing domain entries. If the etag is required but
          the value does not match the ETag value of the resource, the replacement
          of domain entries fails.
        schema:
          type: string
      - name: Accept
        in: header
        description: Choose the representation of the returned entries.
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - text/csv
          default: application/vnd.sas.collection+json
      requestBody:
        content:
          application/vnd.sas.collection+json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/domainEntry"
            example:
            - key: A
              value: "1"
            - key: B
              value: "2"
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/domainEntry"
            example:
            - key: A
              value: "1"
            - key: B
              value: "2"
          text/csv:
            schema:
              type: string
            example: |
              A,1
              B,2
        description: The collection holding the entries.
        required: true
      responses:
        "200":
          description: The entries were replaced.
          headers:
            Location:
              description: The URI of the domain entry collection.
              schema:
                type: string
            ETag:
              description: A tag that identifies this domain entry collection.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/domainEntryCollection"
              examples:
                default:
                  $ref: "#/components/examples/fullLookUpEntriesCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/domainEntryCollection"
              examples:
                default:
                  $ref: "#/components/examples/fullLookUpEntriesCollection"
            text/csv:
              schema:
                type: string
              example: |
                key,value
                A,1
                b,2
        "201":
          description: The entries were created.
          headers:
            Location:
              description: The URI of the new domain entry collection.
              schema:
                type: string
            ETag:
              description: A tag that identifies this domain entry collection.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/domainEntryCollection"
              examples:
                default:
                  $ref: "#/components/examples/fullLookUpEntriesCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/domainEntryCollection"
              examples:
                default:
                  $ref: "#/components/examples/fullLookUpEntriesCollection"
            text/csv:
              schema:
                type: string
              example: |
                key,value
                A,1
                B,2
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path. Resource is not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    patch:
      tags:
      - Reference Data
      operationId: patchReferenceDataDomainEntries
      summary: Update the reference data entries
      description: 'Updates the domain entries by using an array of add, replace,
        or delete JSON Patch operations. See https://tools.ietf.org/html/rfc6902 for
        more information about the JSON Patch.


        First, a JSON document of a certain format is used to represent the entries.
        These operations are then applied to that document. The resulting document
        represents what future entries should look like. The specification of the
        operations is relative to this document format.


        Each JSON Patch operation contains an `op`, a `path`, and an optional `value`
        member. The operation member names `op`, `path`, and `value` are to be in
        lowercase only. The `op` values that can be used are "add", "replace", and
        "remove". They are in lowercase.


        The `path` has the form /entry-key or /entry-key/field-name-of-the-entry-representation-object.
        Each tilde that appears in the entry-key must be escaped as ~0. Each forward
        slash character that appears in the entry-key must be escaped as ~1.


        The `value` member is required for add and replace. To add an entry, the path
        member provides the value of the key and the value member provides values
        for the other fields of the representation object of the entry. The replace
        operation provides a new value for any non-key field of the representation
        object. The remove operation deletes an entry based on the key.


        One or more fields can be changed. The key of the entry cannot be changed.
        If the containing domain content has the status of "production", the entries
        cannot be changed. The first page of the sorted entries, by ascending key,
        is returned.'
      parameters:
      - name: domainId
        in: path
        description: The identifier of a reference data domain.
        required: true
        schema:
          type: string
      - name: contentId
        in: path
        description: The identifier of a reference data domain content.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The ETag value that was returned from a GET, POST, or PATCH of
          the domain entry collection. If the ETag value does not match the etag value
          of the resource, the update fails.
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/entriesPatch"
            example:
            - op: remove
              path: "/A"
            - op: add
              path: "/A"
              value: Urgent
            - op: replace
              path: "/B"
              value: Critical
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/entriesPatch"
            example:
            - op: remove
              path: "/A"
            - op: add
              path: "/A"
              value: Urgent
            - op: replace
              path: "/B"
              value: Critical
        description: A JSON document of the JSON Patch operations.
      responses:
        "200":
          description: The entries are successfully patched.
          headers:
            ETag:
              description: A tag that identifies this domain entry collection.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/domainEntryCollection"
              examples:
                default:
                  $ref: "#/components/examples/fullLookUpEntriesCollectionPatched"
            application/json:
              schema:
                $ref: "#/components/schemas/domainEntryCollection"
              examples:
                default:
                  $ref: "#/components/examples/fullLookUpEntriesCollectionPatched"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "412":
          description: The ETag value used in the If-Match header did not match the
            resource's last modified timestamp. The resource has changed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        "422":
          description: A request in the patch document asks for an invalid operation.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/unprocessableEntity"
        "428":
          description: The `If-Match` request header did not match the resource's
            entity tag.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
    delete:
