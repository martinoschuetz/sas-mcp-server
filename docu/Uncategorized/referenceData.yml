      - Reference Data
      operationId: deleteReferenceDataDomainContent
      summary: Delete reference data domain or value list content
      description: Deletes the content of a reference data domain or value list.
      parameters:
      - name: domainId
        in: path
        description: The identifier for a reference data domain or value list.
        required: true
        schema:
          type: string
      - name: contentId
        in: path
        description: The identifier for a reference data domain or value list content.
        required: true
        schema:
          type: string
      - name: deleteProductionContent
        in: query
        description: If the value is true, a domain with content in "production" status
          can be deleted. If the value is false or if this parameter is not used,
          a domain with content in "production" status cannot be deleted.
        schema:
          type: string
      responses:
        "204":
