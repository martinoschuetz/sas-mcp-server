servers:
- url: http://example.com/referenceData
  description: This is an example of a base URL.
components:
  headers:
    Sas-Service-Response-Flag:
      description: Indicates whether the response is coming from a SAS service.
      schema:
        type: boolean
      example: true
  requestBodies:
    globalVariable:
      content:
        application/vnd.sas.data.reference.global.variable+json:
          schema:
            $ref: "#/components/schemas/globalVariable"
          examples:
            default:
              $ref: "#/components/examples/createGlobalVariable"
        application/json:
          schema:
            $ref: "#/components/schemas/globalVariable"
          examples:
            default:
              $ref: "#/components/examples/createGlobalVariable"
      description: The global variable representation. Only the name, type and value
        are required.
      required: true
  schemas:
    currentContentsPatch:
      title: Current Contents Patch
      description: The properties of an execution environment patch operation.
      properties:
        op:
          type: string
          description: The operation to carry out.
        from:
          type: string
          description: The source of the copy.
        path:
          type: string
          description: The target of the copy.
    domainCollection:
      title: Domain Collection
      description: A collection of the domain representation.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/domain"
    domain:
      title: Domain
      description: The properties of a domain.
      properties:
        id:
          title: Domain
          type: string
          readOnly: true
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: The name of the domain.
        codeName:
          type: string
          description: The system-assigned encoded version of the name that uses only
            certain characters from the English alphabet and the Arabic numerals.
        formatName:
          type: string
          description: This is the name of a Cloud Analytic Service format when this
            domain is published to the Cloud Analytic Service.
        packageName:
          type: string
          description: This is the name of a DS2 package when this domain is published
            to the Micro Analytic Score service.
        domainType:
          type: string
          description: The type of the domain.The value is "lookup".
        description:
          type: string
          description: The description about the domain.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when this domain is created. This field is a derived
            field and not required for PUT and POST.
        modifiedTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when this domain is last modified. This field is
            a derived field and not required for PUT and POST.
        createdBy:
          type: string
          readOnly: true
          description: ID of the user who created this domain. This field is a derived
            field and not required for PUT and POST.
        modifiedBy:
          type: string
          readOnly: true
          description: ID of the user who last modified this domain. This field is
            a derived field and not required for PUT and POST.
        checkout:
          type: boolean
          description: Flag that indicates this domain is a working copy of another
            domain.
        folderType:
          type: string
          description: Indicates the type of folder where the domain is housed.
        links:
          type: array
          readOnly: true
          description: Zero or more link objects.
          items:
            $ref: "#/components/schemas/link"
    valueList:
      title: Value List
      description: The properties of a value list.
      properties:
        id:
          title: Value List
          type: string
          readOnly: true
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: The name of the value list.
        domainType:
          type: string
          description: The type of the value list. The value is "valueList".
        description:
          type: string
          description: The description about the value list.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when this domain is created. This field is a derived
            field and not required for PUT and POST.
        modifiedTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when this domain is last modified. This field is
            a derived field and not required for PUT and POST.
        createdBy:
          type: string
          readOnly: true
          description: ID of the user who created this domain. This field is a derived
            field and not required for PUT and POST.
        modifiedBy:
          type: string
          readOnly: true
          description: ID of the user who last modified this domain. This field is
            a derived field and not required for PUT and POST.
        checkout:
          type: boolean
          description: Flag that indicates this value list is a working copy of another
            value list.
        folderType:
          type: string
          description: Indicates the type of folder where the value list is housed.
        properties:
          type: object
          description: A set of properties for this value list.
          additionalProperties:
            type: string
        links:
          type: array
          readOnly: true
          description: Zero or more link objects.
          items:
            $ref: "#/components/schemas/link"
    summaryDomainCollection:
      title: Domain Summary Collection
      description: A collection of the domain summary representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/summary"
    dcmResourceSummaryDomainCollection:
      title: Domain DCM Resource Summary Collection
      description: A collection of the domain DCM resource summary representations.
      allOf:
      - $ref: "#/components/schemas/revisionSummary"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/summary"
    searchDomainCollection:
      title: Domain Search Collection
      description: A collection of the domain search representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/indexableData"
    domainContentCollection:
      title: Domain Current Collection
      description: A collection of domain content representation.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/domainContent"
    domainContent:
      title: Domain Content
      description: The properties of a domain content.
      properties:
        id:
          title: Domain Content
          type: string
          readOnly: true
          description: The system-assigned unique ID for this object.
        label:
          type: string
          description: A text string appropriate for this instance of the domain.
        majorNumber:
          type: integer
          description: The major version number.
        minorNumber:
          type: integer
          description: The minor version number.
        status:
          type: string
          description: The status of this instance of the domain. The choices are
            "developing", "candidate", "activating" and "production". However, "activating"
            is only a system assignable value.
        standing:
          type: string
          description: The system assigned value for this instance of the domain.
            The system assigned values are "inactive", "legacy", "current", or "future".
            This value compares one instance to another.
        activationStatus:
          type: string
          description: Indicates whether the domain content is being activated, is
            activated, or has failed to be activated.
        activationError:
          type: string
          description: When this field is present, the content has failed to be activated
            to one or more destination. This field carries error message for each
            of the failed destination.
        keyLabel:
          type: string
          description: The labels to be applied to the keys.
        valueLabel:
          type: string
          description: The labels to be applied to the values.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp of when this domain was created. This field is
            a derived field and not required for PUT and POST.
        modifiedTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp of when this domain is last modified. This field
            is a derived field and not required for PUT and POST.
