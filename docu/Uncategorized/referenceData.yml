              $ref: "#/components/schemas/domainContentFull"
            examples:
              default:
                $ref: "#/components/examples/createReferenceDataDomainContentsWithEntries"
          application/vnd.sas.data.reference.value.list.content.full+json:
            schema:
              $ref: "#/components/schemas/valueListContentFull"
            examples:
              default:
                $ref: "#/components/examples/createReferenceDataValueListContentsWithEntries"
          application/json:
            schema:
              $ref: "#/components/schemas/domainContentFull"
            examples:
              default:
                $ref: "#/components/examples/createReferenceDataDomainContentsWithEntries"
        description: The full version of the domain or value list content. Use only
          label, status, majorNumber, minorNumber, and entries.
        required: true
      responses:
        "201":
          description: A new domain or value list content was created.
          headers:
            Location:
              description: The URI of this domain or value list content.
              schema:
                type: string
            ETag:
              description: A tag that identifies this domain or value list content.
