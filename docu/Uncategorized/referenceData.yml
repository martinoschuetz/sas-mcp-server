      - name: globalVariableId
        in: path
        description: The identifier of a global variable.
        required: true
        schema:
          type: string
      - name: revisionType
        in: query
        required: false
        description: Valid values are `major` or `minor`. This value determines how
          the server generates the `major` and `minor` numbers. If a `major` number
          is provided, the next available major version number is started. For example,
          if the global variable has revisions 1.0, 1.1, 1.2, 2.0, and 2.1, creating
          a new major revision results in 3.0. If a `minor` number is provided, then
          the next available minor revision number is reserved based on the existing
          revisions. For example, if the existing revisions have `major` and `minor`
          numbers of 1.1, 1.2, 1.3, 2.1, 2.2, and a user requests a new minor revision,
          then 2.3 is assigned. This parameter defaults to `minor` if not supplied.
