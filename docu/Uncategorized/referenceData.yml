                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No domain exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  "/domains/{domainId}/dependencies":
    get:
      operationId: getReferenceDataDomainDependencies
      summary: Get direct dependencies of a reference data domain or value list
      description: Returns the representation of the transfer dependencies of a reference
        data domain or value list.
      tags:
      - Reference Data
      parameters:
      - name: domainId
        description: The unique identifier for the reference data domain or value
          list.
        in: path
        required: true
        schema:
          type: string
        example: da85cd3c-7c7a-437c-acac-eca2819c9a6d
      - name: Accept
        in: header
        description: Used for selecting desired representation.
        schema:
          type: string
          format: media-type
          enum:
          - application/json
          - application/vnd.sas.transfer.dependencies+json
          default: application/json
          example: application/vnd.sas.transfer.dependencies+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.transfer.dependencies+json:
              schema:
                $ref: "#/components/schemas/directReferenceDataDomainDependentObjects"
              examples:
                default:
                  $ref: "#/components/examples/directReferenceDataDomainDependentObjects"
            application/json:
              schema:
                $ref: "#/components/schemas/directReferenceDataDomainDependentObjects"
              examples:
                default:
                  $ref: "#/components/examples/directReferenceDataDomainDependentObjects"
        "404":
          description: No reference data domain or value list exists at the requested
            path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  "/domains/{domainId}/contents":
    get:
      tags:
      - Reference Data
      operationId: getReferenceDataDomainContents
      summary: Get all contents of a reference data domain or value list
      description: "Returns a collection of information about each content. For each\
        \ domain content in the collection, when the `activationStatus` of the content\
        \ is `running`, the endpoint takes an additional step to query the results\
        \ of the asynchronous publishes of the content. The `activationStatus` field\
        \ of the content continues to show `running` if the asynchronous publishes\
        \ have not all completed.\n\nIf all have completed, and if one publish has\
        \ failed, the status field shows `activating`, the `activationStatus` field\
        \ shows `failed` and the activationError field shows the cause of the failure.\
        \ If all publishes have succeeded, the status field shows `production`, the\
        \ activationStatus field shows `active`, and the `activationError` field is\
        \ cleared of any text that might have been there before."
      parameters:
      - name: domainId
        in: path
        description: The identifier for a specific domain or value list.
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first item on a page. The index is
          0-based. The default index is 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of items to return on this page. The actual
          number of returned items might be less if there are no more items in the
          collection. The default is 10.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sorting criteria for the returned contents. The default sort
          order is creationTimeStamp:ascending.
        schema:
          type: string
          format: sort-criteria
      - name: filter
        in: query
        description: The filter criteria for the returned contents.
        schema:
          type: string
          format: filter-criteria
      - name: Accept-Item
        description: Used for selecting desired item representation.
        in: header
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.data.reference.domain+json
          - application/vnd.sas.data.reference.value.list+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.dcm.summary+json
          default: application/vnd.sas.summary+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies this domain content collection.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/domainContentCollection"
              examples:
                default:
                  $ref: "#/components/examples/contentsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/domainContentCollection"
              examples:
                default:
                  $ref: "#/components/examples/contentsCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No domain content collection exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    post:
      tags:
      - Reference Data
      operationId: createReferenceDataDomainContent
      summary: Create new reference data domain or value list content
      description: 'The status is used to determine the standing of this content among
        the collection of contents. If the status is "production", the standing is
        current. The standing of the current production version is changed to "legacy".
        For other status values, the standing of the version is "future". When the
        standing of the version is "future", the status is changed to "inactive".
        In a collection there is at most, one current and one future version at any
        time.


        The major and minor numbers are optional. Here is how the major and minor
        numbers are used: <ul> <li>If both of them are omitted, the server assigns
        the major number to one and the minor number to zero.</li> <li>If the major
        is specified and the minor is not, the minor number is assigned to zero if
        there is an increment in the major number. Otherwise, the minor number is
        incremented by one. You cannot use a major number that is lower than the current
        major number.</li> <li>If the major number is omitted and the minor is specified,
        the major number is incremented by one. If both are specified, both are accepted
        only if the combination of the major and minor numbers is not lower than the
        current combination.</li> </ul>

        The key and value labels are optional.'
      parameters:
      - name: domainId
        in: path
        description: The identifier for a specific domain or value list.
        required: true
        schema:
          type: string
      - name: fromRevisionUri
        in: query
        description: This value specifies the URI of the domain or value list content
          that the new domain or value list content is being created from. This property
          allows for the lineage of a domain or value list to be traced. The valid
          format for this parameter is '/referenceData/domains/${domainId}/contents/${contentId}'.
          The value of the fromRevisionUri is recorded in the sourceDomainRevisionUri
          member of the content.
        required: false
        schema:
          type: string
      - name: inheritContentEntriesUri
        in: query
        description: When this parameter is used, the new content is created with
          entries. This URI identifies the domain or value list content from which
          the new domain or value list content will inherit entries. The valid format
          for this parameter is '/referenceData/domains/${domainId}/contents/${contentId}'.
          An empty value is treated as if the parameter is not used. If this parameter
          is used together with the `fromRevisionUri` parameter, their values must
          be identical. Unlike the `fromRevisionUri` parameter, the value of the `inheritContentEntriesUri`
          is not recorded in the content.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.data.reference.domain.content+json:
            schema:
              $ref: "#/components/schemas/domainContent"
            examples:
              default:
                $ref: "#/components/examples/createReferenceDataDomainContents"
