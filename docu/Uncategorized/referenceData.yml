  "/domains/{domainId}/contents#full":
    post:
      tags:
      - Reference Data
      operationId: createReferenceDataDomainContentWithEntries
      summary: Create new reference data domain or value list content with entries
      description: 'The status is used to determine the standing of this content among
        the collection of contents. If the status is "production", the standing is
        current. The standing of the current production version is changed to "legacy".
        For other status values, the standing of the version is future. When the standing
        of the version is "future", the status is changed to "inactive". In a collection
        there is at most, one current and one future version at any time.


        The major and minor numbers are optional. Here is how the major and minor
        numbers are used: <ul> <li>If both of them are omitted, the server assigns
        the major number to one and the minor number to zero.</li> <li>If the major
        number is specified and the minor number is not, the minor number is assigned
        to zero if the major number is incremented. Otherwise, the minor number is
        incremented by one. You cannot use a major number that is less than the current
        major number.</li> <li>If the major number is omitted and the minor is specified,
        the major number is incremented by one. If both are specified, they are accepted
        only if the combination of the major and minor numbers is not less than the
        current combination.</li> </ul>

        The key and value labels are optional.'
      parameters:
      - name: domainId
        in: path
        description: The identifier for a specific domain or value list.
        required: true
        schema:
          type: string
      - name: fromRevisionUri
        in: query
        description: This value specifies the URI of the domain or value list content
          that the new domain or value list content is being created from. This property
          enables the lineage of a domain to be traced. The valid format for this
          parameter is '/referenceData/domains/${domainId}/contents/${contentId}'.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.data.reference.domain.content.full+json:
