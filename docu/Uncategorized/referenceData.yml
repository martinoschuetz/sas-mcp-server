  "/domains/{domainId}/contents/{contentId}":
    get:
      tags:
      - Reference Data
      operationId: getReferenceDataDomainContent
      summary: Get domain or value list content
      description: 'Only information describing the content is returned. The associated
        reference data entries are not returned. The creation user ID and timestamp
        of the domain content cannot be changed. The user ID and modification timestamp
        changes when information about the content changes or when a child resource
        of the version changes.


        When the `activationStatus` of the content is "running", the endpoint takes
        an additional step to query the results of the asynchronous publishes. The
        `activationStatus` continues to show "running" if the asynchronous publishes
        have not all completed. If all have completed, and if one publish has failed,
        the status field shows "activating", the activationStatus field shows "failed"
        and  the activationError field shows the cause of the failure. If all publishes
        have succeeded, the status field show "production", the activationStatus field
        shows "active" and the activationError field is cleared of any text that might
        be there before.'
      parameters:
      - name: domainId
        in: path
        description: The identifier for a reference data domain or value list.
        required: true
        schema:
          type: string
      - name: contentId
        in: path
        description: The identifier for a reference data domain or value list content.
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Selects the desired item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.data.reference.domain+json
          - application/vnd.sas.data.reference.value.list+json
          - application/vnd.sas.dcm.summary+json
          default: application/vnd.sas.data.reference.domain+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Location:
              description: The URI of this domain or value list content.
              schema:
                type: string
            ETag:
              description: A tag that identifies this domain or value list content.
              schema:
                type: string
          content:
            application/vnd.sas.data.reference.domain.content+json:
              schema:
                $ref: "#/components/schemas/domainContent"
              examples:
                default:
                  $ref: "#/components/examples/completeDomainContent"
            application/vnd.sas.data.reference.value.list.content+json:
              schema:
                $ref: "#/components/schemas/valueListContent"
              examples:
                default:
                  $ref: "#/components/examples/completeValueListContent"
            application/json:
              schema:
                $ref: "#/components/schemas/domainContent"
              examples:
                default:
                  $ref: "#/components/examples/completeDomainContent"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No domain or value list content exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
