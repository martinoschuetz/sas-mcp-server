  "/domains/{domainId}/currentContents":
    get:
      tags:
      - Reference Data
      operationId: getReferenceDataDomainCurrentContents
      summary: Get list of domain contents with "production" status
      description: Returns a list of the domain contents that have had the "production"
        status. For each domain content, show the begin time and end time when the
        "production" status was ongoing, unless no domain version ever had the "production"
        status. There is always one domain version whose "production" status end time
        is not set. This means that the production status is still current.
      parameters:
      - name: domainId
        in: path
        description: The identifier of a reference data domain.
        required: true
        schema:
          type: string
      - name: scope
        in: query
        description: Choose `current` to see which domain content is the current content.
          Choose `all` to see the timeline of which domain content was the current
          content. The default is `current`.'
        schema:
          type: string
          enum:
          - current
          - all
      - name: asOf
        in: query
        description: Restricts the results to the current contents. This parameter
          can be used only when the scope parameter equals `all`.
        schema:
          type: string
          format: date-time
      - name: start
        in: query
        description: The starting index of the first item on a page. The index is
          0-based. The default index is 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of items to return on this page. The actual
          number of returned items might be less if there are no more items in the
          collection. The default is 10.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The sorting criteria for the returned content history. The default
          sort order is `commencedTimeStamp:ascending` when the scope parameter equals
          `all`. When the scope parameter equals `current`, there is no need to use
          the `sortBy` parameter in conjunction since at most, one item is returned.
        schema:
          type: string
          format: sort-criteria
      - name: filter
        in: query
        description: The filter criteria for the returned content history. When the
          scope parameter equals `current`, a filter expression is added. Since there
          is at most only one item returned, any additional filter expressions alters
          the desired result.
        schema:
          type: string
          format: filter-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies this collection.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/domainCurrentContentsCollection"
              examples:
                default:
                  $ref: "#/components/examples/fullDomainCurrentContentsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/domainCurrentContentsCollection"
              examples:
                default:
                  $ref: "#/components/examples/fullDomainCurrentContentsCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path. A collection for
            the reference data domain was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    patch:
      tags:
      - Reference Data
      operationId: patchReferenceDataDomainCurrentContents
      summary: Copy domain current content to execution environment
      description: 'The copy is done using the JSON Patch operation. See https://tools.ietf.org/html/rfc6902
        for more information about the JSON Patch.


        The "copy" JSON Patch operation consists of the `op`, `from`, and `path` members.
        The member names are to be in lowercase only. The `op` value is "copy". The
        from value is `/@current`. The path value is `/@current/environments/cas`
        or `/@current/environments/mas`. If the domain has a non-expired current content,
        its representation is `returned`.'
      parameters:
      - name: domainId
        in: path
        description: The identifier of a reference data domain.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The ETag value that was returned from a GET of the current contents.
          If the ETag value does not match the resource ETag value, the patch fails.
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/currentContentsPatch"
            example:
            - op: copy
              from: /@current
              path: /@current/environments/mas
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/currentContentsPatch"
            example:
            - op: copy
              from: /@current
              path: /@current/environments/mas
        description: A JSON document of the JSON Patch operations.
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies this collection.
              schema:
                type: string
          content:
            application/vnd.sas.data.reference.domain.content.history+json:
              schema:
                $ref: "#/components/schemas/domainContentHistory"
              examples:
                default:
                  $ref: "#/components/examples/updatedDomainCurrentContents"
            application/json:
              schema:
                $ref: "#/components/schemas/domainContentHistory"
              examples:
                default:
                  $ref: "#/components/examples/updatedDomainCurrentContents"
        "400":
          description: The request was invalid. The domain does not have current content.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path. Current content for
            the domain was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "412":
          description: The ETag value used in the If-Match header did not match the
            resource's ETag value. The resource has changed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        "422":
          description: A request in the patch document asks for invalid operation.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/unprocessableEntity"
        "428":
          description: The request headers did not include an `If-Match` precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
  /domainEntries:
    get:
      tags:
      - Reference Data
      operationId: getReferenceDataDomainEntriesFromAllDomains
      summary: Get entries in latest domain content for all reference data domains
        or value lists
      description: Returns all the entries as CSV. A header is not returned by default.
        It can be requested by adding the `header=present` option to the text/csv
        media type. The order of the columns is domain name, domain description, path
        of the folder that contains the domain, key, value, whether the entry is disabled,
        the sequence and the domain type. A query parameter can be used to select
        domains that are members of a folder hierarchy.
      parameters:
      - name: folderPath
        in: query
        description: A complete path or the prefix of a folder path. This value is
          used to select those reference data domains where the parameter value is
          either a prefix of the parent folder or matches the parent folder paths
          of those domains.
        schema:
          type: string
      - name: Accept
        in: header
        description: In addition to text/csv, also include application/json in the
          Accept header to prevent the true operation error from being masked by the
          HTTP status 406 error. The two media types are separated by a comma.
        schema:
          type: string
          enum:
          - text/csv, application/json
      responses:
        "200":
          description: The request succeeded. The export was successful.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
              example: |
                lookup_nm,description,folder_path,name,value,disabled,entity_sq_no,type_nm
                lookup_10k,"10,000 key/value pairs",/Public/lookup_tables,K00009936,V00009936,,,lookup
                lookup_10k,"10,000 key/value pairs",/Public/lookup_tables,K00009937,V00009937,,,lookup
                lookup_10k,"10,000 key/value pairs",/Public/lookup_tables,K00009938,V00009938,,,lookup
                Lookup_table_1,,/Users/siduser/My Folder,A,1,,,lookup
                Lookup_table_1,,/Users/siduser/My Folder,B,2,,,lookup
                Value_List,test,/Users/sasdemo/My Folder,100,equal to 100,false,3,valueList
                Value_List,test,/Users/sasdemo/My Folder,v<100,less than 100,false,2,valueList
                Value_List,test,/Users/sasdemo/My Folder,v>100,greater than 100,false,1,valueList
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "406":
          description: The media type is incompatible. This is usually the case when
            there is an error, but the error response media type is not compatible
            with the text/csv media type. The REST client or browser returns this
            status error instead.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notAcceptable"
    post:
      tags:
      - Reference Data
      operationId: createReferenceDataDomainEntriesForMultipleDomains
      summary: Bulk import domain entries
      description: 'The input is CSV with a header row that specifies the order of
        these columns: <ul> <li>lookup_nm</li> <li>description</li> <li>folder_path</li>
        <li>name</li> <li>value</li> </ul>

        or

        <ul> <li>lookup_nm</li> <li>description</li> <li>folder_path</li> <li>name</li>
        <li>value</li> <li>disabled</li> <li>entity_sq_no</li> <li>type_nm</li> </ul>


        On each row in the lookup_nm column, the name of a reference data domain is
        specified. The description column is the description of the domain. In the
        folder_path column, the containing folder of the domain is specified. A valid
        folder value: <ul> <li>begins with the / character</li> <li>has no consecutive
        / characters</li> <li> does not end in the / character</li> </ul>


        The name column holds a key of the domain entry. The value column holds a
        value of the domain entry. Only the description column can be blank.

        Labels cannot be applied to the key and value from this operation. The updateReferenceDataDomainContent
        operation can be used instead to add the labels.

        The disabled column is used by the value list. It is a boolean value, which
        indicates whether the entry is disabled.

        The entity_sq_no is used only by the value list. It points out the order of
        the entry within the entries of the value list.

        The type_nm is the type name of the object. It could be "lookup" or "valueList".

        The bulk import creates the domain or value list in the supplied folder if
        an identically named domain or value list does not already exist. If the domain
        or value list already exists, then the entries in the latest domain or value
        list content are deleted and the entries from the input CSV are added. If
        the latest domain or value list content has the "production" status, the "delete"
        and "add" operations cannot be done.  Each domain or value list in a folder
        has a unique name. However, the same domain or value list name can be used
        in another folder.


        The input CSV is processed in the order it is received. All contiguous rows
        with the same domain name and folder path are considered one section. Those
        rows are processed according to the description above. It is possible to have
        the same domain name and folder path appearing in non-consecutive sections.
        In that case, the subsequent section is considered a replacement of the domain
        entries from the previous section. The service tries to process as many rows
        as possible.


        The output is a multipart/mixed response body. The boundary string of each
        part is identified in the Content-Type response header. There are three parts
        in this response. <ol> <li>The first part is for the accepted CSV (header
        Content-ID: Accepted-CSV). Each row that was successfully imported is included
        here. As soon as a domain is processed, the successful rows are streamed back.</li>
        <li>The second part is for the rejected CSV (header Content-ID:Rejected-CSV).
        Each CSV row that failed processing is identified here. It is in CSV format
        with the following column order: record number in the entire CSV input, lookup_nm,
        description, folder_path, name, value, and error message.</li> <li>The third
        part is for global issues (header Content-ID: Global-Issue). It is in CSV
        format with the following column order: lookup_nm and error message. The message
        conveys the error at the domain level that prevents any CSV importing. An
        example would be the lack of permissions to create the containing folder.
        If this error applies to the entire input, the lookup_nm column has an asterisk.
        If this error applies to only a domain, then the domain is identified in the
        lookup_nm column.</li> </ol>'
      parameters:
      - name: Accept
        in: header
        required: true
        description: In addition to multipart/mixed, also include application/json
          in the Accept header to prevent the true operation error from being masked
          by the HTTP status 406 error. The media types are separated by a comma.
        schema:
          type: string
          enum:
          - multipart/mixed, application/json
      - name: If-Unmodified-Since
        in: header
        required: false
        description: Checks to see whether the existing domains identified in the
          CSV have not been modified since the time specified in the value. If this
          is not true, the update is not performed.
        schema:
          type: string
      requestBody:
        content:
          text/csv:
            schema:
              type: string
            example: |
              lookup_nm,description,folder_path,name,value
              Cars_Lookup_8185538845,Terminology lookup,/Users/lockeduser/My Folder,Cylinders
              Cars_Lookup_8185538845,Terminology lookup,/Users/lockeduser/My Folder,DriveTrain
              Cars_Lookup_8185538845,Terminology lookup,/Users/lockeduser/My Folder,EngineSize
              Cars_Lookup_8185538845,Terminology lookup,/Users/lockeduser/My Folder,HorsePower
              lookup_10k,"10,000 key/value pairs",/Public/lookup_tables,K00009936,V00009936
              lookup_10k,"10,000 key/value pairs",/Public/lookup_tables,K00009937,V00009937
              lookup_10k,"10,000 key/value pairs",/Public/lookup_tables,K00009938,V00009938
              sd2,demo,/Users/siduser/My Folder/feb,coconut,brown
              sd2,demo,/Users/siduser/My Folder/feb,lemon,yellow
              sd2,demo,/Users/siduser/My Folder/feb,lime,green

              or

              lookup_nm,description,folder_path,name,value,disabled,entity_sq_no,type_nm
              Cars_Lookup_8185538845,Terminology lookup,/Users/lockeduser/My Folder,Cylinders,,,lookup
              Cars_Lookup_8185538845,Terminology lookup,/Users/lockeduser/My Folder,DriveTrain,,,lookup
              Cars_Lookup_8185538845,Terminology lookup,/Users/lockeduser/My Folder,EngineSize,,,lookup
              Cars_Lookup_8185538845,Terminology lookup,/Users/lockeduser/My Folder,HorsePower,,,lookup
              lookup_10k,"10,000 key/value pairs",/Public/lookup_tables,K00009936,V00009936,,,lookup
              lookup_10k,"10,000 key/value pairs",/Public/lookup_tables,K00009937,V00009937,,,lookup
              lookup_10k,"10,000 key/value pairs",/Public/lookup_tables,K00009938,V00009938,,,lookup
              sd2,demo,/Users/siduser/My Folder/feb,coconut,brown,,,lookup
              sd2,demo,/Users/siduser/My Folder/feb,lemon,yellow,,,lookup
              sd2,demo,/Users/siduser/My Folder/feb,lime,green,,,lookup
              Value_List,test,/Users/sasdemo/My Folder,100,equal to 100,false,3,valueList
              Value_List,test,/Users/sasdemo/My Folder,v<100,less than 100,false,2,valueList
              Value_List,test,/Users/sasdemo/My Folder,v>100,greater than 100,false,1,valueList
        description: The CSV that contains a header row.
        required: true
      responses:
        "200":
          description: The request succeeded. One or more entries were created or
            updated. Check the response for any error.
          headers:
            Location:
              description: The URI for retrieving the domains that were created or
                modified.
              schema:
                type: string
          content:
            multipart/mixed:
              schema:
                type: string
              example: ' --_001_002_003_004_005_006_007_008_009_010_011_012_ Content-Type:
                text/csv; charset="utf-8" Content-ID: Accepted-CSV


                --_001_002_003_004_005_006_007_008_009_010_011_012_ Content-Type:
                text/csv; charset="utf-8" Content-ID: Rejected-CSV

                1,Cars_Lookup_8185538845,Terminology lookup,/Public,Cylinders,There
                are 4 columns in this record, but there should be 5 or 7 columns.
                2,Cars_Lookup_8185538845,Terminology lookup,/Public,DriveTrain,There
                are 4 columns in this record, but there should be 5 or 7 columns.

                --_001_002_003_004_005_006_007_008_009_010_011_012_ Content-Type:
                text/csv; charset="utf-8" Content-ID: Global-Issue --_001_002_003_004_005_006_007_008_009_010_011_012_--'
        "400":
          description: The request was invalid. No entry was imported.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path. The URI was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "406":
          description: The media type is incompatible. Occurs when there is an error
            but the error response media type is not compatible with the multipart/mixed
            media type. The REST client or browser returns this status error instead.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        "412":
          description: The `If-Unmodified-Since` request header did not match the
            resource's last modified timestamp. The resources have changed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
  /globalVariables:
