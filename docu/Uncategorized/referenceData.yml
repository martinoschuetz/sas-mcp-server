---
openapi: 3.0.3
info:
  version: "13"
  title: Reference Data
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: The Reference Data API supports the life cycle of reference data.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Reference Data
  description: Contains operations to create, read, update, and delete reference data.
- name: Global Variables
  description: Contains operations to create, read, update, and delete global variables.
paths:
  /:
    get:
      tags:
      - Root
      operationId: root
      summary: Get a list of top-level resource links
      description: Returns a list of links to the top-level resources in this API.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
  /domains:
    get:
      tags:
      - Reference Data
      operationId: getReferenceDataDomains
      summary: Get all reference data domains or value lists
      description: Returns a collection of information about each domain or value
        list.
      parameters:
      - name: start
        in: query
        description: The starting index of the first item on a page. The index is
          0-based. The default index is 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of items to return on this page. The actual
          number of returned items might be less if there are no more items in the
          collection. The default is 10.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Criteria used for sorting the reference data domains. The default
          sort order is creationTimeStamp:ascending.
        schema:
          type: string
          format: sort-criteria
      - name: filter
        in: query
        description: The filter criteria for the returned domains.
        schema:
          type: string
          format: filter-criteria
      - name: parentFolderUri
        in: query
        description: The folder where the target domains are located.
        required: false
        schema:
          type: string
      - name: Accept-Item
        in: header
        description: Select the desired item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.data.reference.domain+json
          - application/vnd.sas.data.reference.value.list+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.dcm.summary+json
          default: application/vnd.sas.summary+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.collection+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/domainCollection"
                - $ref: "#/components/schemas/summaryDomainCollection"
                - $ref: "#/components/schemas/dcmResourceSummaryDomainCollection"
              examples:
                application/vnd.sas.summary+json:
                  $ref: "#/components/examples/summaryDomainsCollection"
                application/vnd.sas.reference.data.domain+json:
                  $ref: "#/components/examples/fullDomainsCollection"
                application/vnd.sas.reference.data.value.list+json:
                  $ref: "#/components/examples/fullValueListsCollection"
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/domainCollection"
                - $ref: "#/components/schemas/summaryDomainCollection"
              examples:
                application/vnd.sas.summary+json:
                  $ref: "#/components/examples/summaryDomainsCollection"
                application/vnd.sas.reference.data.domain+json:
                  $ref: "#/components/examples/fullDomainsCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    post:
      tags:
      - Reference Data
      operationId: createReferenceDataDomains
      summary: Create a new reference data domain or value list
      description: The domain or value list is created after a successful post. The
        child contents collection is empty. All domain or value list names must be
        unique. Domain or value lists in the same folder must have unique names. Domain
        or value lists not in any folder must also have unique names.
      parameters:
      - name: parentFolderUri
        in: query
        description: Adds the domain or value list as a member of a folder.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.data.reference.domain:
            schema:
              $ref: "#/components/schemas/domain"
            examples:
              default:
                $ref: "#/components/examples/createReferenceDataDomains"
          application/vnd.sas.data.reference.value.list:
            schema:
              $ref: "#/components/schemas/valueList"
            examples:
              default:
                $ref: "#/components/examples/createReferenceDataValueList"
          application/json:
            schema:
              $ref: "#/components/schemas/domain"
            examples:
              default:
                $ref: "#/components/examples/createReferenceDataDomains"
        description: The domain representation. Use only the name, description, and
          domainType.
        required: true
      responses:
        "201":
          description: A new domain or value list was created.
          headers:
            Location:
              description: The URI of the new domain or value list.
              schema:
                type: string
            ETag:
              description: A tag that identifies this domain or value list.
              schema:
                type: string
          content:
            application/vnd.sas.data.reference.domain+json:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                default:
                  $ref: "#/components/examples/fullDomain"
            application/vnd.sas.data.reference.value.list+json:
              schema:
                $ref: "#/components/schemas/valueList"
              examples:
                default:
                  $ref: "#/components/examples/fullValueList"
            application/json:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                default:
                  $ref: "#/components/examples/fullDomain"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /domains#search:
    get:
      tags:
      - Reference Data
      operationId: getSearchIndexReferenceDataDomains
      summary: Get all reference data domains
      description: Returns a collection of information about each domain.
      parameters:
      - name: start
        in: query
        description: The starting index of the first item on a page. The index is
          0-based. The default index is 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of items to return on this page. The actual
          number of returned items might be less if there are no more items in the
          collection. The default is 10.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The sorting criteria for the returned reference data domains.
          The default sort order is creationTimeStamp:ascending.
        schema:
          type: string
          format: sort-criteria
      - name: filter
        in: query
        description: The filter criteria for the returned domains.
        schema:
          type: string
          format: filter-criteria
      - name: Accept-Item
        in: header
        description: Selects the desired item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.search.indexable.data+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/searchDomainCollection"
              examples:
                default:
                  $ref: "#/components/examples/searchDomainsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/domainCollection"
              examples:
                default:
                  $ref: "#/components/examples/searchDomainsCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No collections were found for this domain.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  "/domains/{domainId}":
    get:
      tags:
      - Reference Data
      operationId: getReferenceDataDomain
      summary: Get a reference data domain or value list
      description: Returns information about the domain or value list. The creation
        user ID and time stamp of the domain cannot be changed. The user ID and modification
        time stamp changes when information about the domain or value list changes
        or when a child resource of the domain or value list changes.
      parameters:
      - name: domainId
        in: path
        description: The identifier of a domain or value list.
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Selects the desired item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.data.reference.domain+json
          - application/vnd.sas.data.reference.value.list+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.dcm.summary+json
          default: application/vnd.sas.data.reference.domain+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies this domain or value list.
              schema:
                type: string
          content:
            application/vnd.sas.data.reference.domain:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                default:
                  $ref: "#/components/examples/fullDomain"
            application/vnd.sas.data.reference.value.list:
              schema:
                $ref: "#/components/schemas/valueList"
              examples:
                default:
                  $ref: "#/components/examples/createReferenceDataValueList"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/summaryDomain"
            application/vnd.sas.dcm.summary+json:
              schema:
                $ref: "#/components/schemas/revisionSummary"
              examples:
                default:
                  $ref: "#/components/examples/dcmDomainSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                default:
                  $ref: "#/components/examples/fullDomain"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    put:
      tags:
      - Reference Data
      operationId: updateReferenceDataDomain
      summary: Update a reference data domain or value list
      description: Updates the information of a domain or value list. Only the description
        and the properties can be changed.
      parameters:
      - name: domainId
        in: path
        description: The identifier for a domain or value list.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The ETag value that was returned from a GET, POST, or PATCH of
          the domain or value list entry collection. If the ETag value does not match
          the etag value of the resource, the update fails.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.data.reference.domain:
            schema:
              $ref: "#/components/schemas/domain"
            examples:
              default:
                $ref: "#/components/examples/createReferenceDataDomains"
          application/vnd.sas.data.reference.value.list:
            schema:
              $ref: "#/components/schemas/valueList"
            examples:
              default:
                $ref: "#/components/examples/createReferenceDataValueList"
          application/json:
            schema:
              $ref: "#/components/schemas/domain"
            examples:
              default:
                $ref: "#/components/examples/createReferenceDataDomains"
        description: The domain representation. Use only the description member.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies this domain or value list.
              schema:
                type: string
          content:
            application/vnd.sas.data.reference.domain+json:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                default:
                  $ref: "#/components/examples/fullDomain"
            application/vnd.sas.data.reference.value.list+json:
              schema:
                $ref: "#/components/schemas/valueList"
              examples:
                default:
                  $ref: "#/components/examples/fullValueList"
            application/json:
              schema:
                $ref: "#/components/schemas/domain"
              examples:
                default:
                  $ref: "#/components/examples/fullDomain"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag. The resource has changed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        "428":
          description: The `If-Match` request header did not match the resource's
            entity tag. The 'If-Match' header was not sent.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
    delete:
      tags:
      - Reference Data
      operationId: deleteReferenceDataDomain
      summary: Delete a domain or value list
      description: Deletes a domain or value list.
      parameters:
      - name: domainId
        in: path
        description: The identifier for a domain or value list.
        required: true
        schema:
          type: string
      - name: deleteProductionContent
        in: query
        description: If the value is true, a domain with content in `production` status
          can be deleted. If the value is false, a domain with content in `production`
          status cannot be deleted.
        schema:
          type: string
      responses:
        "204":
          description: The domain or value list was deleted.
        "400":
          description: The request was invalid.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
