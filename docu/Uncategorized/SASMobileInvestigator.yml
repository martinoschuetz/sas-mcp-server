---
openapi: 3.0.3
info:
  title: Mobile Investigator
  version: "6"
  description: The SAS Mobile Investigator REST API was created to support the functions
    of the SAS Mobile Investigator application on SAS Viya 4.
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
tags:
- name: About
  description: Application information related.
- name: Attachments
  description: Object attachment related.
- name: Cache
  description: Metadata cache related.
- name: Configuration
  description: Application configuration related.
- name: Controls
  description: Control related.
- name: Files
  description: File related.
- name: Homepage
  description: Homepage related.
- name: Identities
  description: Identities related.
- name: Image
  description: Image related.
- name: Locks
  description: Object lock related.
- name: Objects
  description: Object related.
- name: Offline
  description: Offline related.
- name: Properties
  description: Application properties related.
- name: ReferenceData
  description: Reference data related.
- name: Relationships
  description: Relationships related.
- name: Resources
  description: Application resources related.
- name: Resolved
  description: Resolved object related.
- name: Root
  description: API root.
- name: Search
  description: Object search related.
- name: Status
  description: Microservice status related.
- name: Themes
  description: Theme related.
- name: User
  description: Current user related.
- name: Users
  description: Users related.
- name: Workflow
  description: Workflow related.
- name: RecentlyViewed
  description: Recently viewed object related.
- name: ServerFeatures
  description: Server features related.
- name: SolutionMessages
  description: Solution message related.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              description: The media type for the response (application/vnd.sas.api+json).
              schema:
                type: string
          content:
            application/vnd.sas.api+json;version=1:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/rootResponse_200"
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/rootResponse_200"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default.:
                  $ref: "#/components/examples/rootResponse_200"
  /about:
    get:
      tags:
      - About
      summary: About information
      description: Get server about information.
      operationId: getAbout
      responses:
        "200":
          description: Successful retrieval.
          headers:
            Content-Type:
              description: The media type for the response (application/vnd.sas.investigation.mobile.about+json).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/aboutResponse"
              examples:
                default:
                  $ref: "#/components/examples/aboutResponse_200"
            application/vnd.sas.investigation.mobile.about+json;version=1:
              schema:
                $ref: "#/components/schemas/aboutResponse"
              examples:
                default:
                  $ref: "#/components/examples/aboutResponse_200"
            application/vnd.sas.investigation.mobile.about+json:
              schema:
                $ref: "#/components/schemas/aboutResponse"
              examples:
                default:
                  $ref: "#/components/examples/aboutResponse_200"
  /cache:
    put:
      tags:
      - Cache
      summary: Reload cache
      description: Release internal cache entries.
      operationId: updateCache
      responses:
        "204":
          description: Successful reload.
        "400":
          description: Unable to reload cache.
          headers:
            Content-Type:
              description: The media type for the response (application/json).
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
  /commons/validations/objects/{docType}/children/{childDocType}/images/validateMobileImageUpload:
    post:
      tags:
      - Objects
      summary: Validate a child image upload
      description: Validate a child image upload as much as possible.
      operationId: createValidateChildMobileImageUpload
      parameters:
      - name: docType
        in: path
        description: docType
        required: true
        schema:
          type: string
      - name: childDocType
        in: path
        description: childDocType
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/imageFileRepresentation"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.validation+json:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                default:
                  $ref: "#/components/examples/validateResponse_200"
            application/vnd.sas.investigation.mobile.image.add.validation+json:
              schema:
                $ref: "#/components/schemas/validationResponse"
              examples:
                default:
                  $ref: "#/components/examples/validateResponse_200"
            application/json:
              schema:
                $ref: "#/components/schemas/validationResponse"
              examples:
                default:
                  $ref: "#/components/examples/validateResponse_200"
            application/vnd.sas.investigation.mobile.image.add.validation+json;version=1:
              schema:
                $ref: "#/components/schemas/validationResponse"
              examples:
                default:
                  $ref: "#/components/examples/validateResponse_200"
          headers:
            Content-Type:
              description: The media type for the response (application/json).
              schema:
                type: string
            Location:
              schema:
                type: string
        "400":
          description: Validation error.
          content:
            application/vnd.sas.validation+json:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                default:
                  $ref: "#/components/examples/validateUploadResponse_400"
            application/vnd.sas.investigation.mobile.image.add.validation+json;version=1:
              schema:
                $ref: "#/components/schemas/validationResponse"
              examples:
                default:
                  $ref: "#/components/examples/validateUploadResponse_400"
        "406":
          description: Accept media type not acceptable.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/validateUploadResponse_406"
  /commons/validations/objects/{docType}/images/validateMobileImageUpload:
    post:
      tags:
