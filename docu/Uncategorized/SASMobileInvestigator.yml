            Content-Type:
              description: The media type for the response (application/json).
              schema:
                type: string
  "/controls/{controlId}/directive":
    get:
      tags:
      - Controls
      summary: Get directive
      description: Get the javascript for a given control.
      operationId: getDirective
      parameters:
      - name: controlId
        in: path
        description: controlId
        required: true
        schema:
          type: integer
          format: int64
      - name: version
        in: query
        description: The presence of this version query parameter results in a high
          max-age caching header. Useful when the control version in the database
          is used.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Successful retrieval.
          content:
            text/javascript:
              schema:
                type: string
          headers:
            Content-Type:
              description: The media type for the response (application/javascript).
              schema:
                type: string
        "404":
          description: Control not found.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/controlTemplateResponse_404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/controlTemplateResponse_404"
    head:
      tags:
      - Controls
      summary: Get directive
      description: Get the javascript for a given control.
      operationId: headersForDirective
      parameters:
      - name: controlId
        in: path
        description: controlId
        required: true
        schema:
          type: integer
          format: int64
      - name: version
        in: query
        description: The presence of this version query parameter results in a high
          max-age caching header. Useful when the control version in the database
          is used.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Successful retrieval.
          headers:
            Content-Type:
              description: The media type for the response (application/javascript).
              schema:
                type: string
        "404":
          description: Control not found.
  "/controls/{controlId}/template":
    get:
      tags:
      - Controls
      summary: Get template
      description: Get the html template for a given control.
      operationId: getTemplate
      parameters:
      - name: controlId
        in: path
        description: controlId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Successful retrieval
          content:
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          headers:
            Content-Type:
              description: The media type for the response (text/html).
              schema:
                type: string
        "404":
          description: Control not found
