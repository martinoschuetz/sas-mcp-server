            examples:
              default:
                $ref: "#/components/examples/validateFileUploadRequest"
          application/vnd.sas.investigation.mobile.file.attach.request+json;version=1:
            schema:
              $ref: "#/components/schemas/attachFileRepresentation"
            examples:
              default:
                $ref: "#/components/examples/validateFileUploadRequest"
        description: Representation.
        required: true
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.validation+json:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                default:
                  $ref: "#/components/examples/validateResponse_200"
            application/vnd.sas.investigation.mobile.object.attachment.add.validation+json:
