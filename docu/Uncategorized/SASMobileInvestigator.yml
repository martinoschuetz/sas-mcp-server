components:
  requestBodies:
    relateObjectRepresentation:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/relateObjectRepresentation"
          examples:
            default:
              $ref: "#/components/examples/relateObjectRepresentation"
        application/vnd.sas.investigation.mobile.relate.object.request+json;version=1:
          schema:
            $ref: "#/components/schemas/relateObjectRepresentation"
          examples:
            default:
              $ref: "#/components/examples/relateObjectRepresentation"
        application/vnd.sas.investigation.mobile.relate.object.request+json:
          schema:
            $ref: "#/components/schemas/relateObjectRepresentation"
          examples:
            default:
              $ref: "#/components/examples/relateObjectRepresentation"
      description: representation.
      required: true
    jsonPatch:
      content:
        application/json-patch:
          schema:
            $ref: "#/components/schemas/jsonPatch"
          examples:
            default:
              $ref: "#/components/examples/objectPatchRequest"
      description: patch
      required: true
    imageFileRepresentation:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/imageFileRepresentation"
          examples:
            default:
              $ref: "#/components/examples/validateFileUploadRequest"
        application/vnd.sas.investigation.mobile.image.add.request+json;version=1:
          schema:
            $ref: "#/components/schemas/imageFileRepresentation"
          examples:
            default:
              $ref: "#/components/examples/validateFileUploadRequest"
        application/vnd.sas.investigation.mobile.image.add.request+json:
          schema:
            $ref: "#/components/schemas/imageFileRepresentation"
          examples:
            default:
              $ref: "#/components/examples/validateFileUploadRequest"
      description: representation.
      required: true
  schemas:
    count:
      type: object
      description: The count response.
      properties:
        value:
          type: integer
          format: int64
          xml:
            name: value
            attribute: false
            wrapped: false
        version:
          type: integer
          description: The version number of this schema. This representation is version
            1.
          format: int32
          xml:
            name: version
            attribute: false
            wrapped: false
      title: Count
    emailAddress:
      type: object
      description: Email address.
      properties:
        customType:
          type: string
        type:
          type: string
          enum:
          - home
          - mobile
          - work
          - custom
          - other
          - sms
        value:
          type: string
      title: EmailAddress
    inputStream:
      type: object
      description: The file input stream.
      title: InputStream
    jsonPatch:
      type: object
      description: The json patch object.
      title: JsonPatch
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    phoneNumber:
      type: object
      description: The phone number.
      properties:
        customType:
          type: string
          description: The phone number custom type.
        type:
          type: string
          description: The phone number type.
          enum:
          - home
          - mobile
          - work
          - homeFax
          - workFax
          - pager
          - custom
          - other
        value:
          type: string
          description: The phone number value.
      title: PhoneNumber
    resourceCollectionRelatedObjects:
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      description: A standard collection or list of related objects.
      properties:
        name:
          type: string
