              examples:
                default:
                  $ref: "#/components/examples/validateResponse_200"
            application/vnd.sas.investigation.mobile.object.attachment.add.validation+json:
              schema:
                $ref: "#/components/schemas/validationResponse"
              examples:
                default:
                  $ref: "#/components/examples/validateResponse_200"
            application/json:
              schema:
                $ref: "#/components/schemas/validationResponse"
              examples:
                default:
                  $ref: "#/components/examples/validateResponse_200"
            application/vnd.sas.investigation.mobile.object.attachment.add.validation+json;version=1:
              schema:
                $ref: "#/components/schemas/validationResponse"
              examples:
                default:
                  $ref: "#/components/examples/validateResponse_200"
          headers:
            Content-Type:
              description: The media type for the response (application/json).
