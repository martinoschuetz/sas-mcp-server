          type: integer
          format: int64
      responses:
        "200":
          description: Successful retrieval.
          headers:
            Content-Type:
              description: The media type for the response (application/html).
              schema:
                type: string
        "404":
          description: Control not found
  /files/deletions:
    post:
      tags:
      - Files
      summary: Delete detached files
      description: Delete detached files.
      operationId: deleteDetachedFilesRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
              default:
                $ref: "#/components/examples/fileSelectionRequest"
          application/vnd.sas.selection+json:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
              default:
                $ref: "#/components/examples/fileSelectionRequest"
          application/vnd.sas.selection+json;version=1:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
              default:
                $ref: "#/components/examples/fileSelectionRequest"
        description: selection
        required: true
      responses:
        "204":
          description: Files successfully detached.
        "400":
          description: Invalid resource selection.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/deletionsResponse_400"
  "/files/{fileId}":
    delete:
      tags:
      - Files
      summary: Delete a detached file
      description: Delete detached file.
      operationId: deleteDetachedFile
      parameters:
      - name: fileId
        in: path
        description: fileId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successfully detached file.
  /identities:
    post:
      tags:
      - Identities
      summary: Search identities
      description: Search identities.
      operationId: createIdentitiesSearch
      parameters:
      - name: Accept-Item
        in: header
        description: Select the desired item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.investigation.mobile.identity+json;version=1
          - application/vnd.sas.investigation.mobile.identity+json
      - name: start
        in: query
        description: start.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: limit.
        required: false
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/vnd.sas.investigation.mobile.search.identities.request;version=1:
            schema:
              $ref: "#/components/schemas/searchIdentitiesRepresentation"
            examples:
              default:
                $ref: "#/components/examples/identitiesSearchRequest"
          application/vnd.sas.investigation.mobile.search.identities.request:
            schema:
              $ref: "#/components/schemas/searchIdentitiesRepresentation"
            examples:
              default:
                $ref: "#/components/examples/identitiesSearchRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/searchIdentitiesRepresentation"
            examples:
              default:
                $ref: "#/components/examples/identitiesSearchRequest"
        description: Representation.
        required: true
      responses:
        "201":
          description: Successful retrieval
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/smiResourceCollectionIdentities"
              examples:
                default:
                  $ref: "#/components/examples/identitiesSearchResponse_200"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/smiResourceCollectionIdentities"
              examples:
                default:
                  $ref: "#/components/examples/identitiesSearchResponse_200"
            application/json:
              schema:
                $ref: "#/components/schemas/smiResourceCollectionIdentities"
              examples:
                default:
                  $ref: "#/components/examples/identitiesSearchResponse_200"
        "400":
          description: Invalid search identities representation.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/identitiesSearchResponse_400"
  "/images/{imageKey}":
    get:
      tags:
      - Image
      summary: Get the image associated with the given key
      description: Get the image associated with the given key as a byte array.
      operationId: getImage
      parameters:
      - name: imageKey
        in: path
        description: imageKey
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful retrieval.
          content:
            image/png:
              schema:
                type: string
                format: byte
            image/svg+xml:
              schema:
                type: string
                format: byte
          headers:
            Content-Type:
              description: The media type for the response.
              schema:
                type: string
        "404":
          description: Key not found
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/imagesKeyResponse_404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/imagesKeyResponse_404"
    head:
      tags:
      - Image
      summary: Get the image associated with the given key
      description: Get the image associated with the given key as a byte array.
      operationId: headersForGetImage
      parameters:
