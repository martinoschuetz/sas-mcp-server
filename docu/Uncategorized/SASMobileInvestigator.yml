              schema:
                $ref: "#/components/schemas/smiMapConfiguration"
              examples:
                default:
                  $ref: "#/components/examples/configurationMapResponse_200"
          headers:
            Content-Type:
              description: The media type for the response (application/json).
              schema:
                type: string
  /controls:
    get:
      tags:
      - Controls
      summary: Get the mobile controls
      description: Get mobile controls.
      operationId: getMobileControls
      responses:
        "200":
          description: Successful retrieval
          content:
            application/vnd.sas.investigation.mobile.controls+json;version=1:
              schema:
                $ref: "#/components/schemas/controlsResponse"
              examples:
                default:
