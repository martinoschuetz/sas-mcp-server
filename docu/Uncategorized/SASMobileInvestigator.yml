  /configuration/map:
    get:
      tags:
      - Configuration
      summary: Get map configuration
      description: Get map configuration.
      operationId: getMapConfiguration
      responses:
        "200":
          description: Successful retrieval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/smiMapConfiguration"
              examples:
                default:
                  $ref: "#/components/examples/configurationMapResponse_200"
            application/vnd.sas.investigation.mobile.configuration.map+json;version=1:
              schema:
                $ref: "#/components/schemas/smiMapConfiguration"
              examples:
                default:
