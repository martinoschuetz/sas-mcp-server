          application/vnd.sas.risk.pipeline.cash.flow.leg+json:
            schema:
              $ref: "#/components/schemas/cashFlowLeg"
          application/json:
            schema:
              $ref: "#/components/schemas/cashFlowLeg"
        required: true
      responses:
        "201":
          description: "Created"
          headers:
            ETag:
              description: "A tag that identifies this revision of the cash flow leg."
              style: "simple"
              schema:
                type: "string"
            Location:
              description: "The URL for the new cash flow leg."
              style: "simple"
              schema:
                type: "string"
          content:
            application/vnd.sas.risk.pipeline.cash.flow.leg+json:
              schema:
                $ref: "#/components/schemas/cashFlowLeg"
            application/json:
              schema:
                $ref: "#/components/schemas/cashFlowLeg"
        "400":
          description: "The request contains invalid values."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "409":
          description: "A cash flow leg with the specified name already exists."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /cashFlowLegs/@batch/deletions:
