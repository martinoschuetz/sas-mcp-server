---
openapi: "3.0.3"
info:
  title: "Risk Pipeline"
  description: "A risk pipeline is a structured workflow that enables you to build\
    \ repeatable and customizable risk analyses."
  contact:
    name: "SAS Developers"
    url: "https://developer.sas.com"
    email: "devex@sas.com"
  version: "27"
servers:
- url: "http://example.com/riskPipeline"
  description: "This is an example base URL."
tags:
- name: "Cash Flow Bucket Scheme"
  description: "Contains operations for cash flow bucket schemes."
- name: "Cash Flow Leg"
  description: "Contains operations for cash flow legs."
- name: "Data ⚠"
  description: "Contains operations for the input data (private)."
  x-sas-internal: "true"
- name: "Export and Import"
  description: "Contains the operations for exporting and importing objects."
- name: "Function Set"
  description: "Contains operations for function sets."
- name: "Git Synchronization ⚠"
  description: "Contains the operations for synchronization of the objects with Git\
    \ repository (private)."
  x-sas-internal: "true"
- name: "Internal Operations ⚠"
  description: "Contains internal operations API (private)."
  x-sas-internal: "true"
- name: "Model"
  description: "Contains operations for models."
- name: "Model Group"
  description: "Contains operations for model groups."
- name: "Model Import ⚠"
  description: "Contains operations to retrieve and import candidate models from an\
    \ external environment (private)."
  x-sas-internal: "true"
- name: "Nodes ⚠"
  description: "Node registry (private)."
  x-sas-internal: "true"
- name: "Output Variable"
  description: "Contains operations for output variables."
- name: "Permissions"
  description: "Contains operations for object permissions."
- name: "Program"
  description: "Contains operations for programs."
- name: "Project"
  description: "Contains operations for projects."
- name: "Risk Method"
  description: "Contains operations for risk methods."
- name: "Risk Method Map"
  description: "Contains operations for risk method maps."
- name: "Risk Pipeline"
  description: "Contains operations for risk pipelines."
- name: "Risk Pipeline (Auxiliary) ⚠"
  description: "Contains auxiliary operations for risk pipelines (private)."
  x-sas-internal: "true"
- name: "Root"
  description: "Contains operations for root links."
- name: "Time Grid"
  description: "Contains operations for time grids."
- name: "Type ⚠"
  description: "Contains operations for the common types (private)."
  x-sas-internal: "true"
paths:
  /:
    get:
      tags:
      - "Root"
      summary: "Get root links"
      description: "Returns the root links for a project."
      operationId: "root"
      parameters:
      - name: "project.id"
        in: "query"
        description: "The ID of the project. If neither the ID nor the name is specified,\
          \ the default project will be used."
        schema:
          type: "string"
      - name: "project.name"
        in: "query"
        description: "The name of the project. If neither the ID nor the name is specified,\
          \ the default project will be used."
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          headers:
            Cache-Control:
              description: "no-cache"
              style: "simple"
              schema:
                type: "string"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
  /bucketSchemes:
    get:
      tags:
      - "Cash Flow Bucket Scheme"
      summary: "Get bucket schemes"
      description: "Returns the cash flow bucket schemes that are included in a project."
      operationId: "getBucketSchemes"
      parameters:
      - name: "project.id"
        in: "query"
        description: "The ID of the project. If neither the ID nor the name is specified,\
          \ the default project will be used."
        schema:
          type: "string"
      - name: "project.name"
        in: "query"
        description: "The name of the project. If neither the ID nor the name is specified,\
          \ the default project will be used."
        schema:
          type: "string"
      - name: "filter"
        in: "query"
        description: "The filter criteria."
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          headers:
            Cache-Control:
              description: "no-cache"
              style: "simple"
              schema:
                type: "string"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/resourceCollectionBucketScheme"
            application/json:
              schema:
                $ref: "#/components/schemas/resourceCollectionBucketScheme"
          links:
            self:
              operationId: "getBucketSchemes"
            create:
              operationId: "createBucketScheme"
              requestBody: "$response.body#/items/1"
            batchDelete:
              operationId: "deleteBucketSchemes"
              requestBody: "#/components/schemas/resourceSelection"
        "400":
          description: "The filter criteria is invalid."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    post:
      tags:
      - "Cash Flow Bucket Scheme"
      summary: "Create bucket scheme"
      description: "Creates a cash flow bucket scheme."
      operationId: "createBucketScheme"
      requestBody:
        description: "The cash flow bucket scheme to create."
        content:
          application/vnd.sas.risk.pipeline.bucket.scheme+json:
            schema:
              $ref: "#/components/schemas/bucketScheme"
          application/json:
            schema:
              $ref: "#/components/schemas/bucketScheme"
        required: true
      responses:
        "201":
          description: "Created"
          headers:
            ETag:
              description: "A tag that identifies this revision of the cash flow bucket\
                \ scheme."
              style: "simple"
              schema:
                type: "string"
            Location:
              description: "The URL for the new cash flow bucket scheme."
              style: "simple"
              schema:
                type: "string"
          content:
            application/vnd.sas.risk.pipeline.bucket.scheme+json:
              schema:
                $ref: "#/components/schemas/bucketScheme"
            application/json:
              schema:
                $ref: "#/components/schemas/bucketScheme"
        "400":
          description: "The request contains invalid values."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "409":
          description: "A cash flow bucket scheme with the specified name already\
            \ exists."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /bucketSchemes/@batch/deletions:
    post:
      tags:
      - "Cash Flow Bucket Scheme"
      summary: "Delete bucket schemes ⚠"
      description: "Deletes one or more cash flow bucket schemes (private)."
      operationId: "deleteBucketSchemes"
      requestBody:
        description: "The cash flow bucket schemes to delete."
        content:
          application/vnd.sas.selection+json:
            schema:
              $ref: "#/components/schemas/resourceSelection"
          application/json:
            schema:
              $ref: "#/components/schemas/resourceSelection"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/resourceSelectionResponse"
        "400":
          description: "The selection is invalid."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "409":
          description: "The cash flow bucket scheme cannot be deleted because it is\
            \ currently in use."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
      x-sas-internal: "true"
  /bucketSchemes/{bucketSchemeId}:
    get:
      tags:
      - "Cash Flow Bucket Scheme"
      summary: "Get bucket scheme"
      description: "Returns the specified cash flow bucket scheme."
      operationId: "getBucketScheme"
      parameters:
      - name: "bucketSchemeId"
        in: "path"
        description: "The ID or the @item wildcard. For the @item wildcard, you must\
          \ provide the filter criteria."
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          headers:
            ETag:
              description: "A tag that identifies this revision of the cash flow bucket\
                \ scheme."
              style: "simple"
              schema:
                type: "string"
            Location:
              description: "The URL for the cash flow bucket scheme."
              style: "simple"
              schema:
                type: "string"
          content:
            application/vnd.sas.risk.pipeline.bucket.scheme+json:
              schema:
                $ref: "#/components/schemas/bucketScheme"
            application/json:
              schema:
                $ref: "#/components/schemas/bucketScheme"
    put:
      tags:
      - "Cash Flow Bucket Scheme"
      summary: "Update bucket scheme"
      description: "Updates the specified cash flow bucket scheme."
      operationId: "updateBucketScheme"
      parameters:
      - name: "bucketSchemeId"
        in: "path"
        description: "The ID of the cash flow bucket scheme."
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        description: "A tag that identifies this revision of the cash flow bucket\
          \ scheme."
        required: true
        schema:
          type: "string"
      requestBody:
        description: "The cash flow bucket scheme to update."
        content:
          application/vnd.sas.risk.pipeline.bucket.scheme+json:
            schema:
              $ref: "#/components/schemas/bucketScheme"
          application/json:
            schema:
              $ref: "#/components/schemas/bucketScheme"
        required: true
      responses:
        "200":
          description: "OK"
          headers:
            ETag:
              description: "A tag that identifies this revision of the cash flow bucket\
                \ scheme."
              style: "simple"
              schema:
                type: "string"
          content:
            application/vnd.sas.risk.pipeline.bucket.scheme+json:
              schema:
                $ref: "#/components/schemas/bucketScheme"
            application/json:
              schema:
                $ref: "#/components/schemas/bucketScheme"
        "400":
          description: "The request contains invalid values."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "409":
          description: "A cash flow bucket scheme with the specified name already\
            \ exists."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "412":
          description: "The request failed because a newer version of the cash flow\
            \ bucket scheme exists."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: "The If-Match parameter is required."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      tags:
      - "Cash Flow Bucket Scheme"
      summary: "Delete bucket scheme"
      description: "Deletes the specified cash flow bucket scheme."
      operationId: "deleteBucketScheme"
      parameters:
      - name: "bucketSchemeId"
        in: "path"
        description: "The ID or the @item wildcard. For the @item wildcard, you must\
          \ provide the filter criteria."
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "OK"
        "409":
          description: "The cash flow bucket scheme cannot be deleted because it is\
            \ currently in use."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /cashFlowLegs:
