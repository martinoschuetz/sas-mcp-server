        properties:
          parentName:
            type: "string"
            description: "The name of the variable whose value depends on the values\
              \ of other variables."
          binDefinition:
            type: "string"
            description: "The bins used to group the values of the bin variable. The\
              \ value can be a fixed string (for example, New York) or a range of\
              \ numbers that is expressed using interval notation (for example, (30,\
              \ 40])"
    boundedType:
      type: "string"
      description: "Indicates whether the value of the output variable is bounded\
        \ by zero. For more information, see \"SAS Risk Engine: Using the User Interface\"\
        ."
      enum:
