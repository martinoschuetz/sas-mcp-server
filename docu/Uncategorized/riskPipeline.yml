  /currencies:
    get:
      tags:
      - "Data ⚠"
      summary: "Get currencies ⚠"
      description: "Returns the currencies that are defined in SAS Risk Engine (private)."
      operationId: "getCurrencies"
      responses:
        "200":
          description: "OK"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/resourceCollectionRiskCurrency"
            application/json:
              schema:
                $ref: "#/components/schemas/resourceCollectionRiskCurrency"
      x-sas-internal: "true"
  /data/loadData:
    post:
      tags:
      - "Data ⚠"
      summary: "Load values from CSV file ⚠"
      description: "Loads the values from rows in CSV file and returns the values\
        \ from the 1st column (private)."
      operationId: "loadData"
      requestBody:
        description: "The CSV file to load values from."
        content:
          multipart/form-data:
            schema:
              required:
              - "file"
              type: "object"
              properties:
                file:
                  type: "string"
                  format: "binary"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/resourceCollectionString"
            application/json:
              schema:
                $ref: "#/components/schemas/resourceCollectionString"
        "400":
          description: "The CSV file is invalid."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
      x-sas-internal: "true"
