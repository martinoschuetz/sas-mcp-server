        schema:
          type: "string"
      - name: "filter"
        in: "query"
        description: "The filter criteria."
        schema:
          type: "string"
      - name: "scope"
        in: "query"
        description: "The scope of the cash flow leg. Supported values: \"riskMethod\"\
          , \"modelGroup\", \"cashFlowOutput\", \"outputVariable\"."
        x-sas-internal: "true"
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          headers:
            Cache-Control:
              description: "no-cache"
              style: "simple"
              schema:
                type: "string"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/resourceCollectionCashFlowLeg"
            application/json:
              schema:
                $ref: "#/components/schemas/resourceCollectionCashFlowLeg"
          links:
            self:
              operationId: "getCashFlowLegs"
            create:
              operationId: "createCashFlowLeg"
