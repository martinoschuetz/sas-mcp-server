      description: Example JSON-RPC request to discover available tools from the MCP
        server
      value:
        jsonrpc: "2.0"
        id: 2
        method: "tools/list"
    postMCPRequestToolsCall:
      description: Example JSON-RPC request to call a tool on the MCP server
      value:
        jsonrpc: "2.0"
        id: 3
        method: "tools/call"
        params:
        toolName: "exampleTool"
        arguments:
          example_key: "example_value"
    postMCPResponse:
      description: Example JSON-RPC response from the MCP server
      value:
        jsonrpc: "2.0"
        id: 1
        result:
          protocolVersion: "2025-11-25"
          capabilities:
            tools: {}
          serverInfo:
            name: "mcp-server"
            version: "1.0.0"
    postMCPResponseToolsList:
      description: Example JSON-RPC response from the MCP server listing available
        tools
      value:
        jsonrpc: "2.0"
        id: 2
        result:
          tools:
          - name: "example_tool"
            description: "Description of the example tool"
            inputSchema:
              type: "object"
              properties:
                example_param1:
                  type: "string"
                  description: "Description of the first parameter"
                example_param2:
                  type: "string"
                  description: "Description of the second parameter"
              required: ["example_param1"]
    postMCPResponseToolsCall:
      description: Example JSON-RPC response from tools/call request
      value:
        jsonrpc: "2.0"
        id: 3
        result:
          content:
          - type: "text"
            text: "Example tool execution result with relevant output data"
          isError: false
    postMCPSSEResponse:
      description: Example of Server-Sent Events stream with JSON-RPC Responses
      value: |
        event: message
        data: {"jsonrpc": "2.0", "id": 1, "result": {"protocolVersion": "2025-11-25", "capabilities": {"tools": {}}, "serverInfo": {"name": "mcp-server", "version": "1.0.0"}}}
    postMCP400Response:
      description: Example error response when the request is malformed, the session
        ID is missing, or the protocol version is unsupported
      value:
        httpStatusCode: 400
        message: "The request could not be processed due to invalid input."
        details:
        - "Invalid JSON-RPC request format or missing required fields."
    postMCP404Response:
      description: Example error response when the session ID provided in POST /mcp
