      value:
        httpStatusCode: 404
        message: "No session was found with the provided MCP-Session-Id."
        details:
        - "The session may have expired or been terminated. Send a new initialize\
          \ request without a session ID to start a new session."
    deleteMCP400Response:
      description: Example error response when the MCP-Session-Id header is missing
        or malformed
      value:
        httpStatusCode: 400
        message: "The request could not be processed due to a missing or invalid MCP-Session-Id\
          \ header."
        details:
        - "The MCP-Session-Id header is required to identify the session to terminate."
    deleteMCP404Response:
      description: Example error response when the specified MCP session is not found
      value:
        httpStatusCode: 404
        message: "No session was found with the provided MCP-Session-Id."
        details:
        - "The session may have already been terminated or the session ID is incorrect."
    deleteMCP405Response:
      description: Example error response when the server does not allow clients to
