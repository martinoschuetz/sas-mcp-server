  "/projects/{projectId}/state":
    head:
      tags:
      - AutomationProjects
      summary: Get headers for current state of an automation project
      description: Get headers for the request that gets the current state of an automation
        project
      operationId: headersForAutomationProjectState
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: filter
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
            ETag:
              schema:
                type: string
        "400":
          description: One or more parameters were invalid.
          headers:
            Content-Type:
              schema:
                type: string
            ETag:
              schema:
                type: string
        "404":
          description: No project with the provided ID was found.
          headers:
            Content-Type:
              schema:
                type: string
            ETag:
              schema:
                type: string
    get:
      tags:
      - AutomationProjects
      summary: Get current state of an automation project
      description: >
        Automation project state can be one of these enum values.

        - pending: indicates that the underlying analytics project was created but
        has
          not been run yet.
        - preparing: gathering resources to process the pipeline.
        - waiting: indicates that the underlying analytics project metadata was updated.
        - ready: indicates that the underlying analytics project is preparing and
        ready
          to submit CASL code.
        - modeling: indicates that models are being composed and compared on CASL
          server.
        - constructingPipeline: indicates that pipelines are being built on CASL server.
        - runningPipeline: indicates that pipelines are being run on CASL server.
        - quiescing: indicates that the user request to quiesce the project modeling
        has
          been received.
        - quiesced: indicates that project modeling is being stopped in response to
        the
          user's quiescing request.
        - completed: indicates that the underlying analytics project has run to
          completion without errors.
        - canceled: indicates that the underlying analytics project run was canceled
        by
          user.
        - failed: indicates that the underlying analytics project has encountered
        errors
          during pipeline run and has stopped.
        - oversampling: the oversampling technique is being applied.
        - retraining: the project is being retrained.
      operationId: getAutomationProjectState
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: filter
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/automationProjectState"
              example: completed
        "400":
          description: One or more parameters were invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                invalidFilter:
                  $ref: "#/components/examples/invalidFilterError"
        "404":
          description: No project with the provided ID was found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/notFoundError"
    put:
      tags:
      - AutomationProjects
      summary: Update state of the specified automation project
      description: Update state of the automation project with the ID from the path.
        The automation project state is considered a single piece of information and
        operations on state are atomic. State update is completely controlled by the
        state machine based on current state and intended state.
      operationId: updateAutomationProjectState
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: Intended automation project state.
        required: true
        schema:
          $ref: "#/components/schemas/automationProjectState"
      responses:
        "202":
          description: The state of automation project was updated.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/automationProjectState"
              example: completed
        "400":
          description: One or more parameters were invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
        "404":
