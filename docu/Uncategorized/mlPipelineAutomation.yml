---
openapi: 3.0.3
info:
  description: The Machine Learning Pipeline Automation (MLPA) API enables CRUD operations
    on automation projects, which automates VDMML project creation, pipeline building
    and training, and the production of champion models.
  version: "7"
  title: Machine Learning Pipeline Automation
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: https://support.sas.com/techsup/license/index.html
tags:
- name: AutomationProjects
  description: Contains the operations for working with machine learning pipeline
    automation.
- name: AutomationProjectShares
  description: Contains the operations for managing project shares and collaboration.
- name: AutomationAlgorithms
  description: Contains the operations for working with machine learning pipeline
    automation algorithms.
- name: PipelineTemplates
  description: Contains the operations for managing machine learning pipeline templates.
- name: Root
  description: Contains the operations for the root resource.
- name: Model Context Protocol
  description: Contains the operations for model context protocol.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a collection of all currently usable links
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getMLPipelineAutomationRootResponse"
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getMLPipelineAutomationRootResponse"
  /algorithms:
    get:
      tags:
      - AutomationAlgorithms
      summary: Return all supervised learning algorithms
      description: >
        The `consider`, `exclude`, `forceInclude`, and `algorithms` settings are used
        to specify the supervised learning algorithm that is used during automatic
        pipeline generation. Each algorithm has a default setting that determines
        its
        behavior when none of the settings are specified. To view these defaults you
        can request a list of algorithms from the `/algorithms` endpoint.
      operationId: getAlgorithms
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/algorithmCollection"
              examples:
                json:
                  $ref: "#/components/examples/getAlgorithms"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/algorithmCollection"
              examples:
                json:
                  $ref: "#/components/examples/getAlgorithms"
  /mcp:
    get:
      x-sas-internal: true
      tags:
      - Model Context Protocol
      summary: Returns an SSE stream to the MCP server
      description: >
        Returns a Server-Sent Events (SSE) stream on the single MCP endpoint, allowing
        the server to send JSON-RPC requests and notifications to the client without
        the client first sending data via POST. Part of the MCP Streamable HTTP transport
        (protocol version 2025-11-25).

        To resume a broken stream, include the `Last-Event-ID` header set to the ID
        of the last event received. The server may replay missed messages from that
        point.

        If the server does not offer an SSE stream it returns HTTP 405 Method Not
        Allowed.
      operationId: getModelContextProtocolStream
      parameters:
      - name: MCP-Session-Id
        in: header
        description: >
          The session ID returned by the server during initialization. The session
          ID must
          be included in all requests after the initialize exchange.
        required: false
        schema:
          type: string
      - name: MCP-Protocol-Version
        in: header
        description: >
          The MCP protocol version negotiated during initialization
          (for example, `2025-11-25`).
        required: false
        schema:
          type: string
          example: "2025-11-25"
      - name: Last-Event-ID
        in: header
        description: >
          The ID of the last SSE event received by the client. When provided, the
          server may replay events that occurred after that event ID, resuming the
          stream without message loss.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: SSE stream successfully opened.
          headers:
            Content-Type:
              schema:
                type: string
                enum: [text/event-stream]
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream
              examples:
                sse:
                  $ref: "#/components/examples/getMCPStreamResponse"
        "400":
          description: Bad request. The session ID header is missing or the request
            is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/getMCP400Response"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/getMCP400Response"
        "404":
          description: No session with the provided session ID was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/getMCP404Response"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/getMCP404Response"
        "405":
          description: Method not allowed. The server does not offer an SSE stream
            at this endpoint.
    post:
      x-sas-internal: true
      tags:
      - Model Context Protocol
      summary: Send a JSON-RPC message to the MCP server
      description: >
        Sends a JSON-RPC request, notification, or response to the single MCP endpoint.
        Part of the MCP Streamable HTTP transport (protocol version 2025-11-25).

        - For JSON-RPC *requests*, the server responds with either
          `Content-Type: application/json` (single response) or
          `Content-Type: text/event-stream` (SSE stream). Clients must support both.
        - For JSON-RPC *notifications* and *responses*, the server returns HTTP 202
        Accepted
          with no body if accepted, or an HTTP error status if it cannot accept the
        input.

        On the initial `initialize` request, the server may return an `MCP-Session-Id`
        response header. Clients must include this header on all subsequent requests.
      operationId: createModelContextProtocolMessage
      parameters:
      - name: MCP-Session-Id
        in: header
        description: >
          The session ID returned by the server during initialization. The session
          ID  must be included on all requests after the initialize exchange. Servers
          that
          require a session ID should respond with HTTP 400 to requests that omit
          this
          header (other than the initialization request).
        required: false
        schema:
          type: string
      - name: MCP-Protocol-Version
        in: header
        description: >
          The MCP protocol version negotiated during initialization
          (for example, `2025-11-25`). The version must be included
          on all requests after the initialize exchange.
        required: false
        schema:
          type: string
          example: "2025-11-25"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC message (request, notification, or response)
            examples:
              initialize:
                $ref: "#/components/examples/postMCPRequest"
              toolsList:
                $ref: "#/components/examples/postMCPRequestToolsList"
              toolsCall:
                $ref: "#/components/examples/postMCPRequestToolsCall"
      responses:
        "200":
          description: >
            JSON-RPC response returned. For the `initialize` request, the response
            includes the `MCP-Session-Id` header if the server uses session management.
          headers:
            MCP-Session-Id:
              description: >
                Session ID assigned by the server during initialization. Clients must
                include this value in the `MCP-Session-Id` header on all subsequent
                requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: JSON-RPC response
              examples:
                initializeResponse:
                  $ref: "#/components/examples/postMCPResponse"
                toolsListResponse:
                  $ref: "#/components/examples/postMCPResponseToolsList"
                toolsCallResponse:
                  $ref: "#/components/examples/postMCPResponseToolsCall"
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream with JSON-RPC responses
              examples:
                sseResponse:
                  $ref: "#/components/examples/postMCPSSEResponse"
        "202":
          description: Accepted (for notifications and responses).
        "400":
          description: Bad request. The request body is malformed, the session ID
            is missing, or the protocol version is unsupported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/postMCP400Response"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/postMCP400Response"
        "404":
          description: No session with the provided session ID was found. The client
            must start a new session by sending a new initialize request without a
            session ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/postMCP404Response"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/postMCP404Response"
    delete:
      x-sas-internal: true
      tags:
      - Model Context Protocol
      summary: Terminate an MCP session
      description: >
        Explicitly terminates an MCP session. Clients that no longer need a session
        (for example, because the user is leaving the client application) should send
        this request with the `MCP-Session-Id` header to allow the server to free
        any resources associated with the session.

        The server may respond with HTTP 405 Method Not Allowed if it does not
        permit clients to explicitly terminate sessions.
      operationId: deleteModelContextProtocolStream
      parameters:
      - name: MCP-Session-Id
        in: header
        description: >
          The session ID returned by the server during initialization in the
          `MCP-Session-Id` response header. Must be included to identify the
          session to terminate.
        required: true
        schema:
          type: string
      - name: MCP-Protocol-Version
        in: header
        description: >
          The MCP protocol version negotiated during initialization
          (for example, `2025-11-25`).
        required: false
        schema:
          type: string
          example: "2025-11-25"
      responses:
        "204":
          description: Session successfully terminated. No content is returned.
        "400":
          description: Bad request. The session ID header is missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/deleteMCP400Response"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/deleteMCP400Response"
        "404":
          description: No session with the provided session ID was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/deleteMCP404Response"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/deleteMCP404Response"
        "405":
          description: Method not allowed. The server does not permit clients to explicitly
            terminate sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                methodNotAllowed:
                  $ref: "#/components/examples/deleteMCP405Response"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                methodNotAllowed:
                  $ref: "#/components/examples/deleteMCP405Response"
  /projects:
    get:
      tags:
      - AutomationProjects
      summary: Return all automation projects
      description: The endpoint to get all available automation projects.
      operationId: getAutomationProjects
      parameters:
      - name: start
        in: query
        description: start
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: sortBy
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: filter
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mlPipelineAutomationProjectCollection"
              examples:
                json:
                  $ref: "#/components/examples/getProjects"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/mlPipelineAutomationProjectCollection"
              examples:
                json:
                  $ref: "#/components/examples/getProjects"
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                invalidFilter:
                  $ref: "#/components/examples/invalidFilterError"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                invalidFilter:
                  $ref: "#/components/examples/invalidFilterError"
    post:
      tags:
      - AutomationProjects
      summary: Create an automation project
      description: >
        A user begins using the service by creating an automation project.
        The Machine Learning Pipeline Automation API uses the following attributes:
        user-supplied project name, data table URI and target variable, and other
        attributes. The service creates an underlying analytics (VDMML) project,
        executes multiple steps of pre-processing, builds a data analysis pipeline,
        and
        runs the pipeline to completion. The entire process is fully automated without
        further user intervention.

        The request body is structured in three sections.

        - Key information of the automation project
          - Automation project ID (automatically created by the service, read-only)
          - Name of the project (a random string is appended to ensure uniqueness)
          - Description of the project
          - Project type (only "predictive" type is supported)
          - Data table URI
          - Project state
          - The pipeline build method (either "automatic" or "template")
        - Automation project settings, grouped under "settings"
          - A properties bag through which a user can pass arbitrary key-value pairs,
            regardless if they are used. The properties currently used are as follows.
            - applyGlobalMetadata (a flag to indicate whether to apply global metadata
              during project creation. Default is set to true.)
            - autoRun (a flag to indicate whether to automatically start pipeline
        run
              at the time of project creation. Default is set to true.)
            - numberOfModels (a positive integer to indicate maximum number of top
              models to return. Default is set to 5)
            - consider (a list of machine learning algorithms specified by ID to
              consider in addition when generating the pipeline)
            - exclude (a list of machine learning algorithms specified by ID to
              exclude from consideration when generating a pipeline)
            - forceInclude (a list of machine learning algorithms specified by ID
        to
              force into the generated pipeline)
            - algorithms (a list of machine learning algorithms used to inform
              pipeline generation)
            - subsampleCount (number of training observations to sample for
              pipeline generation)
            - subsamplePercent (percent of training observations to sample for
              pipeline generation)
            - subsampleSeed (seed to use when subsampling training data during pipeline
        generation)

        - Analytics project attributes, grouped under "analyticsProjectAttributes"

          - Analytics project ID (automatically created by the service, read-only)
          - Target variable
          - Target level (a string to indicate target level. The accepted values are
            listed below.)
            - binary: Binary target level
            - interval: Interval target level
            - nominal: Nominal target level
          - Target event level
          - classSelectionStatistic (a string to indicate class selection statistic,
            dependent upon the type of target variable. For 'BINARY' and 'NOMINAL'
            target variable types, the accepted values are listed below, where the
            default is set to 'ks'. The 'ORDINAL' target variable type is not
            supported.)
            - ase: Average squared error
            - c: Area under curve (C statistic)
            - capturedResponse: Captured response
            - cumulativeCapturedResponse: Cumulative captured response
            - cumulativeLift: Cumulative lift
            - f1: F1 score
            - fdr: False discovery rate
            - fpr: False positive rate
            - gain: Gain
            - gini: Gini
            - ks: Kolmogorov-Smirnov statistic
            - lift: Lift
            - misclassificationEvent: Misclassification (Event)
            - mce: Misclassification (MCE)
            - mcll: Multiclass log loss
            - ks2: ROC separation
            - rase: Root average squared error
            - misclassificationRateCutoff: Misclassification at cutoff
          - intervalSelectionStatistic (a string to indicate interval selection
            statistic, dependent upon the type of target variable. For 'INTERVAL'
            target variable types, the accepted values are listed below, where the
            default is set to 'ase'. This field is ignored for all other types, like
            'BINARY', 'NOMINAL', or 'ORDINAL'.)
            - ase: Average squared error
            - rase: Root average squared error
            - rmae: Root mean absolute error
            - rmsle: Root mean squared logarithmic error
          - Partition enabled flag
          - Offset variable
          - Exposure variable
      operationId: createAutomationProject
      parameters:
      - name: Accept-Language
        in: header
        description: Used to set the project locale.
        required: false
        schema:
          type: string
          default: "en"
      requestBody:
        $ref: "#/components/requestBodies/mlPipelineAutomationProject"
      responses:
        "202":
          description: The request is accepted.
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.ml.pipeline.automation.project+json:
              schema:
                $ref: "#/components/schemas/mlPipelineAutomationProject"
              examples:
                json:
                  $ref: "#/components/examples/postProject"
            application/json:
              schema:
                $ref: "#/components/schemas/mlPipelineAutomationProject"
              examples:
                json:
                  $ref: "#/components/examples/postProject"
        "400":
          description: One or more parameters were invalid.
          content:
            application/vnd.sas.analytics.ml.pipeline.automation.project+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                badData:
                  $ref: "#/components/examples/invalidDataTableError"
                requiredArguments:
                  $ref: "#/components/examples/requiredArgumentsError"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                badData:
                  $ref: "#/components/examples/invalidDataTableError"
                requiredArguments:
                  $ref: "#/components/examples/requiredArgumentsError"
  "/projects/{projectId}":
    head:
      tags:
      - AutomationProjects
      summary: Get headers for an automation project
      description: The endpoint to get headers for a specific automation project specified
        by an ID.
      operationId: headersForAutomationProject
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
        "400":
          description: One or more parameters were invalid.
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
        "404":
          description: No project with the provided ID was found.
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
    get:
      tags:
      - AutomationProjects
      summary: Get an automation project
      description: The endpoint to get a specific automation project specified by
        an ID.
      operationId: getAutomationProject
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.ml.pipeline.automation.project+json:
              schema:
                $ref: "#/components/schemas/mlPipelineAutomationProject"
              examples:
                json:
                  $ref: "#/components/examples/getProject"
            application/json:
              schema:
                $ref: "#/components/schemas/mlPipelineAutomationProject"
              examples:
                json:
                  $ref: "#/components/examples/getProject"
        "400":
          description: One or more parameters were invalid.
          content:
            application/vnd.sas.analytics.ml.pipeline.automation.project+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                invalidFilter:
                  $ref: "#/components/examples/invalidFilterError"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                invalidFilter:
                  $ref: "#/components/examples/invalidFilterError"
        "404":
          description: No project with the provided ID was found.
          content:
            application/vnd.sas.analytics.ml.pipeline.automation.project+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/notFoundError"
                projectNotFound:
                  $ref: "#/components/examples/projectNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/notFoundError"
                projectNotFound:
                  $ref: "#/components/examples/projectNotFound"
    put:
      tags:
      - AutomationProjects
      summary: Update the specified automation project
      description: >
        In some cases, the user could select the wrong data set or target variables
        accidentally when creating an automation project. The project might fail to
        run
        or the result might not be what the user intended. The ability to update an
        automation project comes to rescue in those cases, where the user can update
        the
        project's attributes and settings with the following request and rerun the
        project.

        This API is solely used for updating a project’s parameters. There is a separate
        endpoint for updating the state of a project(for example, stopping or
        restarting a project run).

        This API does not support PATCH operation to update the automation project
        with changes
        only. According to standard, the user must enter the full project info in
        this
        PUT request, whether or not the parameters are to be changed.

        List of parameters that can be updated.

        - name
        - description
        - dataTableUri
        - settings
        - analyticsProjectAttributes (all analytics attributes can be changed, except
          analytics project ID)

        List of parameters that cannot be updated. Any changes are ignored.

        - id
        - type
        - analyticsProjectId
        - common fields associated with all revision tracking resources
          - creationTimestamp
          - modifiedTimestamp
          - createdBy
          - modifiedBy
          - version

        List of parameters that cannot be updated. Any changes cause 4xx error responses
        to be sent back to the client.

        - state (error code 400)
        - revision (error code 412)
      operationId: updateAutomationProject
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: If-Match
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: Used to set the project locale
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/mlPipelineAutomationProject"
      responses:
        "200":
          description: The automation project was updated.
          headers:
            ETag:
              description: E-Tag for response.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.ml.pipeline.automation.project+json:
              schema:
                $ref: "#/components/schemas/mlPipelineAutomationProject"
              examples:
                json:
                  $ref: "#/components/examples/getProject"
            application/json:
              schema:
                $ref: "#/components/schemas/mlPipelineAutomationProject"
              examples:
                json:
                  $ref: "#/components/examples/getProject"
        "400":
          description: One or more parameters were invalid.
          content:
            application/vnd.sas.analytics.ml.pipeline.automation.project+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                updateStateError:
                  $ref: "#/components/examples/updateProjectStateError"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/badRequestError"
                updateStateError:
                  $ref: "#/components/examples/updateProjectStateError"
        "404":
          description: No automation project with the provided entity ID was found.
          content:
            application/vnd.sas.analytics.ml.pipeline.automation.project+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/notFoundError"
        "412":
          description: The value supplied in the If-Match header did not match the
            expected value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                generic:
                  $ref: "#/components/examples/preconditionFailedError"
            application/json:
              schema:
