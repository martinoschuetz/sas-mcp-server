      description: Example of a Server-Sent Events stream from the MCP server
      value: |
        event: message
        data: {"jsonrpc": "2.0", "id": 1, "result": {"capabilities": {}}}
    getMCP400Response:
      description: Example error response when the GET /mcp request is malformed or
