---
openapi: 3.0.3
info:
  version: "7"
  title: Launcher
  description: |
    The Launcher API provides functionality for
    launching processes on Kubernetes, SAS Workload Orchestrator, or directly.
  termsOfService: 'https://www.sas.com/en_us/legal/copyright.html'
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
tags:
- name: Root
  description: Contains information for the root resource of the Launcher API.
- name: Contexts
  description: Contains information that is required to launch a process.
- name: Options Set Mappings
  description: Options Set Mapping provides the linkage between a Launcher Context
    and a Launcher Options Set. This linkage is resolved at process launch time based
    on the client application and end user identity that is associated with the request.
    If an Options Set Mapping exists for that client application and end user, then
    the Launcher Service uses the associated Options Set to apply configuration and
    policy that is specific to the associated client application and end user when
    launching the process.
- name: Options Sets
  description: Contains information specific to a launcher context, client application,
    and the user that is needed to launch a process. The Options Set can be used to
    augment a launcher context at launch time. Options Sets can be applied automatically
    when a process is launched. To enable the Options Set to be automatically applied,
    an Options Set Mapping must be specified. This mapping provides the link between
    a launcher context and a launcher Options Set.
- name: Processes
  description: Contains information about a launched process.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the Launcher API
      description: Get the Launcher API.
      operationId: root
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getLauncherRootExample"
            application/json:
