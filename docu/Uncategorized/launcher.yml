    contextDeploymentProperties:
      type: object
      title: Context Deployment Properties
      description: Deployment related properties for the context object.
      properties:
        id:
          description: Deployment ID.
          type: string
        installBasePath:
          description: Deployment installation base path.
          type: string
        configBasePath:
          description: Deployment configuration base path.
          type: string
        configInstanceId:
          description: Deployment configuration instance ID.
          type: string
      example:
        id: viya
        installBasePath: /opt/sas
        configBasePath: /opt/sas
        configInstanceId: default
    contextKubernetesProperties:
      type: object
      title: Context Kubernetes Properties.
      description: Kubernetes related properties for the context object.
      properties:
        jobPodTemplateName:
          description: The name of the Kubernetes PodTemplate resource. Default value
            is sas-launcher-job-config.
          type: string
        jobPodTemplateNamespace:
          description: The namespace of the Kubernetes PodTemplate resource. Default
            value is the namespace of the launcher-service pod.
          type: string
        jobNamePrefix:
          description: The desired prefix of the Kubernetes jobs/pods that are created
            on Kubernetes. Default value is sas-launcher-.
          type: string
        cpuLimit:
          description: The maximum amount of CPU that the launched pod is allowed
            to use.
          type: string
        cpuRequest:
          description: The amount of CPU that the launched pod requests from Kubernetes.
          type: string
        memoryLimit:
          description: The maximum amount of memory that the launched pod is allowed
            to use.
          type: string
        memoryRequest:
          description: The amount of memory that the launched pod requests from Kubernetes.
          type: string
        workloadOrchestrator:
          $ref: "#/components/schemas/contextWorkloadOrchestratorProperties"
        volumes:
          type: array
          description: Kubernetes volumes related to this context.
          items:
            $ref: "#/components/schemas/contextVolume"
        resources:
          $ref: "#/components/schemas/contextKubernetesResources"
      example:
        jobPodTemplateName: sas-launcher-job-config
        jobPodTemplateNamespace: default
        jobNamePrefix: sas-launcher-
        cpuLimit: 500m
        cpuRequest: 250m
        memoryLimit: 2Gi
        memoryRequest: 500M
        workloadOrchestrator:
          queue: default
        volumes:
        - name: example-configmap
          type: configmap
          path: /opt/sas/viya/scripts
        resources:
          limits:
            nvidia.com/gpu: "1"
            ephemeral-storage: 10Gi
          requests:
            nvidia.com/gpu: "1"
            ephemeral-storage: 5Gi
    contextWorkloadOrchestratorProperties:
      type: object
      title: Context Workload Orchestrator Properties
      description: SAS Workload Orchestrator related properties for the context object.
      properties:
        queue:
          description: The name of the queue in SAS Workload Orchestrator.
          type: string
      example:
        queue: default
    contextKubernetesResources:
      type: object
      title: Context Kubernetes Resources
      description: >-
        Kubernetes resource requirements for the launched pod. Use this field to specify
        extended or custom resource requests and limits (e.g., nvidia.com/gpu, ephemeral-storage).
      properties:
        limits:
          type: object
          description: >-
            Resource limits for the launched pod. Each key is a valid Kubernetes resource
            name
            (e.g., nvidia.com/gpu, ephemeral-storage) and the value is a Kubernetes
            quantity string.
          additionalProperties:
            type: string
          example:
            nvidia.com/gpu: "1"
            ephemeral-storage: 10Gi
        requests:
          type: object
          description: >-
            Resource requests for the launched pod. Each key is a valid Kubernetes
            resource name
            (e.g., nvidia.com/gpu, ephemeral-storage) and the value is a Kubernetes
            quantity string.
          additionalProperties:
            type: string
          example:
            nvidia.com/gpu: "1"
            ephemeral-storage: 5Gi
      example:
        limits:
          nvidia.com/gpu: "1"
          ephemeral-storage: 10Gi
        requests:
          nvidia.com/gpu: "1"
          ephemeral-storage: 5Gi
    contextVolume:
