        launchType: grid
        environment:
          ENV_VAR_1: ENV_VAR_1_VALUE
          ENV_VAR_2: ENV_VAR_2_VALUE
          ENV_VAR_3: ENV_VAR_3_VALUE
        portRange:
          first: 8000
          last: 12000
        sas:
          options: -memsize 0
        grid:
          provider: platform
          serverHost: myhost.example.com
