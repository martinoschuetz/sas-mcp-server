          id: viya
          installBasePath: /opt/sas
          configBasePath: /opt/sas
          configInstanceId: default
        optionsSetMappingIds:
        - 44bb9d57-df54-4514-a08a-dea11b5b2069
        - 45bb9d57-df54-4514-a08a-dea11b5b2069
        - 46bb9d57-df54-4514-a08a-dea11b5b2069
        commandAllowlist:
        - /bin/sleep
        - /bin/echo
        processLimit: 50
