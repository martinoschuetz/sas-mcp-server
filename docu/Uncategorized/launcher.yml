      description: Contains the information that is necessary for a process to be
        launched.
      required:
      - contextId
      - command
      properties:
        name:
          description: The process name.
          type: string
        description:
          description: The process description.
          type: string
        command:
          description: The command to run.
          type: string
        domainId:
          description: The ID of the domain that is used for authentication. If not
            specified, the domain ID defaults to the Consul property. The domain must
            adhere to the same schema as the 'password' type domain.
          type: string
        restartable:
          description: Determines if a Kubernetes job must restart if a failure occurs.
