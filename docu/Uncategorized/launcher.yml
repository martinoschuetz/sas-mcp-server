    get:
      tags:
      - Processes
      summary: Get process state
      description: Gets the state of a process.
      operationId: getProcessState
      parameters:
      - $ref: "#/components/parameters/ProcessId.Path.Required"
      - $ref: "#/components/parameters/Filter.Query.Optional"
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                enum: [pending, running, completed, failed, canceled, serverError,
                  unknown]
              example: running
        "404":
          $ref: "#/components/responses/notFoundErrorResponse"
    put:
      tags:
      - Processes
      summary: Cancel a running process
      description: Cancels a running process.
      operationId: updateProcess
      parameters:
      - $ref: "#/components/parameters/ProcessId.Path.Required"
      - $ref: "#/components/parameters/CancelProcess.Query.Required"
      responses:
        "200":
          description: Process is successfully canceled.
          content:
            text/plain:
              schema:
                type: string
              example: canceled
        "400":
          $ref: '#/components/responses/processStateValueMissingInvalidResponse'
        "404":
          $ref: '#/components/responses/processNotFoundResponse'
        "409":
          $ref: '#/components/responses/processNotCancelable'
