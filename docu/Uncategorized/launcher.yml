    process:
      type: object
      title: Process
      description: A process contains information about a launched process.
      properties:
        version:
          description: The media type's schema version number.
          type: integer
        id:
          description: Unique identifier of this process.
          type: string
          format: object-id
        name:
          description: The process name.
          type: string
        description:
          description: The process description.
          type: string
