    optionsSetMapping:
      type: object
      title: Options Set Mapping
      description: Options Set mapping enables the launcher service to automatically
        apply an Options Set based on the application ID, user identity, and launcher
        context that are found in the launch request.
      required:
      - name
      - clientId
      - identity
      anyOf:
      - required: [contextId, contextName]
      - required: [optionsSetId, optionsSetName]
      properties:
        version:
          description: The media type's schema version number.
          type: integer
        id:
          description: Unique identifier of this Options Set mapping.
          type: string
          format: object-id
        name:
          description: Options Set mapping name.
          type: string
        description:
          description: Options Set mapping description.
          type: string
        links:
          type: array
          description: Links related to this resource.
          items:
            $ref: "#/components/schemas/link"
        contextId:
          description: Context ID.
          type: string
        contextName:
          description: Context name.
          type: string
        clientId:
          description: Client ID.
          type: string
        identity:
          $ref: "#/components/schemas/identity"
        optionsSetId:
          description: Options Set ID.
          type: string
        optionsSetName:
          description: Options Set name.
          type: string
        priority:
          description: A non-negative integer value that is used to select an Options
            Set mapping, when multiple Options Set mappings are available on a launch
            request. The Options Set mapping with the highest priority is selected.
            The default priority is 0.
          type: integer
      example:
        version: 1
        id: 12bb9d57-df54-4514-a08a-dea11b5b2069
        name: Options Set Mapping Name
        description: Options Set mapping description.
        contextId: 12bb9d57-df54-4514-a08a-dea11b5b2069
        contextName: Context Name
        clientId: sasgsub
        identity:
          name: username
          type: user
        optionsSetId: 24bb9d57-df54-4514-a08a-dea11b5b2069
        optionsSetName: Options Set Name
        priority: 0
