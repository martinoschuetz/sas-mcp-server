            $ref: "#/components/schemas/link"
        command:
          description: The process command.
          type: string
        uuid:
          description: Universally unique ID of the process.
          type: string
        luid:
          description: Locally unique ID of the process.
          type: string
        state:
          description: Current state of the process.
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - launchError
          - serverError
          - unknown
          default: unknown
        host:
          description: Host where the process is running.
          type: string
        uri:
          description: URI where the process is running.
          type: string
        port:
          description: Port on which the process is listening on.
          type: integer
        serverHost:
          description: The host of the launcher server that was used to launch this
            process.
          type: string
        serverPort:
          description: The port of the launcher server that was used to launch this
            process.
          type: integer
        serverProperties:
          description: The properties that are passed to the launcher server when
            this process was launched.
          type: object
        domainId:
          description: The ID of the domain that the process uses for authentication.
          type: string
        restartable:
          description: Determines if a Kubernetes job must restart if a failure occurs.
            If set to true, the job backoff limit is used to determine the number
            of restarts.
          type: boolean
        launchType:
          description: The process launch type.
          type: string
          enum:
          - direct
          - grid
          - kubernetes
          default: direct
        exitCode:
          description: The exit code of this process.
          type: integer
        contextId:
          description: The ID of the context used to launch this process.
          type: string
        optionsSetId:
          description: The ID of the Options Set used to launch this process.
          type: string
        environment:
          description: Environment variables that are available to this process.
          type: object
        portRange:
          $ref: "#/components/schemas/portRange"
        submitTime:
          description: The time when the process was submitted for launch.
          type: string
        startTime:
          description: The time when the process was started.
          type: string
        endTime:
          description: The time when the process ended.
          type: string
      example:
        version: 3
        id: 12bb9d57-df54-4514-a08a-dea11b5b2069
        name: Process Name
        description: Process description.
        command: /opt/sas/viya/home/SASFoundation/sas -memsize 0
        uuid: "12345"
        luid: "12345"
        state: completed
        uri: https://processhost.example.com
        host: processhost.example.com
        port: 9000
        serverHost: launcherhost.example.com
        serverPort: 8080
        serverProperties:
          grid.init.serverPort: "8080"
          grid.init.options: queue=normal
          grid.job.resources: SASApp SASApp
          grid.job.hostList: host1.example.com,host2.example.com,host3.example.com
          grid.job.options: queue=normal queue=normal
          grid.init.provider: Platform
          grid.job.armCorrelator: value
          grid.job.restartable: "false"
          grid.init.serverHost: myhost.example.com
          grid.job.batchJob: "false"
          grid.job.jobName: Grid Job Name
        domainId: CustomDomain
        restartable: false
        launchType: grid
        exitCode: 0
        contextId: 24bb9d57-df54-4514-a08a-dea11b5b2069
        optionsSetId: 36bb9d57-df54-4514-a08a-dea11b5b2069
        environment:
          ENV_VAR_1: ENV_VAR_1_VALUE
          ENV_VAR_2: ENV_VAR_2_VALUE
          ENV_VAR_3: ENV_VAR_3_VALUE
          SAS_LAUNCHER_PROCESS_ID: 48bb9d57-df54-4514-a08a-dea11b5b2069
          SAS_LAUNCHER_PROCESS_PORT_RANGE_FIRST: 8000
          SAS_LAUNCHER_PROCESS_PORT_RANGE_LAST: 12000
          SASOPTIONS: -memsize 0 -memsize 0 -memsize 0
        portRange:
          first: 8000
          last: 12000
        submitTime: 2016-01-01T00:00:00Z
        startTime: 2016-01-01T00:00:10Z
        endTime: 2016-01-01T00:00:50Z
