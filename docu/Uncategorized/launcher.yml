          type: boolean
        contextId:
          description: Context ID.
          type: string
        environment:
          description: Environment variables.
          type: object
        sas:
          $ref: "#/components/schemas/launchRequestSasProperties"
        grid:
          $ref: "#/components/schemas/launchRequestGridProperties"
        kubernetes:
          $ref: "#/components/schemas/launchRequestKubernetesProperties"
