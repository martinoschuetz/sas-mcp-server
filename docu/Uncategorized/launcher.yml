components:
  headers:
    ETag:
      description: A tag that identifies the revision of the resource.
      schema:
        type: string
      example: W/"1655120228210222000"
    Last-Modified:
      description: The last `modifiedTimeStamp` of the resource.
      schema:
        type: string
      example: Tue, 14 Jun 2022 15:00:46 GMT
    Location:
      description: Actual location of the resource.
      schema:
        type: string
  responses:
    optionsSetBadRequest:
      description: Correct the errors and retry the request.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: "\"null\" is not a valid value for the member \"name\". Reason:\
              \ Invalid Options Set name: null"
            details:
            - 'traceId: 5ce5a2ec348aa471'
    uri400Response:
      description: The URI value is invalid.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: "\"\"<>^`{\" is not a valid URI."
            details:
            - 'path: /launcher/processes/70bfbc81-6b24-4256-bea3-1b6b89a933a9/state'
            - 'traceId: 5ce5a2ec348aa471'
    portRange400Response:
      description: The port range is invalid.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: "999999 is not a valid port. Valid port range: [0, 65535]."
            details:
            - 'path: /launcher/processes/70bfbc81-6b24-4256-bea3-1b6b89a933a9/state'
            - 'traceId: a53e94e62c0ab8ff'
    processNotCancelable:
      description: The specified process cannot be canceled.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 409
            message: Process with ID \"ProcessId{id='70bfbc81-6b24-4256-bea3-1b6b89a933a9'}\"
              has a state of \"completed\" and cannot be canceled.
            details:
            - 'path: /launcher/processes/70bfbc81-6b24-4256-bea3-1b6b89a933a9/state'
            - 'traceId: 937e0fcb96b06b67'
    processNotFoundResponse:
      description: The specified process is not found.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 404
            message: Process with ID \"ProcessId{id='28a33553-9a7e-4ba3-9e78-a516c3463f8b'}\"
              is not found.
            details:
            - 'path: /launcher/processes/28a33553-9a7e-4ba3-9e78-a516c3463f8b/state'
            - 'traceId: b995a8490cc8ba21'
    processStateValueMissingInvalidResponse:
      description: The specified state value is missing or is not valid. See the returned
        error response for more information.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          example:
            version: 2
            httpStatusCode: 400
            message: The query parameter "value" has a value that is not valid. (The
              specified value is "killed".)
            details:
            - 'path: /launcher/processes/70bfbc81-6b24-4256-bea3-1b6b89a933a9/state'
            - 'traceId: 03901755fb3e4ace'
