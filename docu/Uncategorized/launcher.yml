      parameters:
      - $ref: "#/components/parameters/ProcessId.Path.Required"
      - $ref: "#/components/parameters/If.None.Match"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/vnd.sas.launcher.process+json:
              schema:
                $ref: "#/components/schemas/process"
              examples:
                process:
                  $ref: "#/components/examples/process"
            application/vnd.sas.summary+json:
