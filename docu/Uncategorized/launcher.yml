      summary: Get a process
      description: Gets a process. Setting the Accept header to either application/vnd.sas.launcher.process+json
        or application/json produces a full process object, whereas setting the Accept
        header to application/vnd.sas.summary+json returns a summary process object
        that contains ID, name, and the description.
