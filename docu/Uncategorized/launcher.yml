          $ref: "#/components/schemas/portRange"
        sas:
          $ref: "#/components/schemas/contextSasProperties"
        grid:
          $ref: "#/components/schemas/contextGridProperties"
        deployment:
          $ref: "#/components/schemas/contextDeploymentProperties"
        kubernetes:
          $ref: "#/components/schemas/contextKubernetesProperties"
      example:
        version: 1
        id: 12bb9d57-df54-4514-a08a-dea11b5b2069
        name: Launch Context Name
