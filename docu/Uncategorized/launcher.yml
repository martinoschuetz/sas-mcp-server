    context:
      type: object
      title: Context
      description: Contains information that is needed for a process to be launched.
      required:
      - launchType
      - name
      properties:
        version:
          description: The media type's schema version number.
          type: integer
        id:
          description: Unique identifier of this context.
          type: string
          format: object-id
        name:
          description: The context name.
          type: string
        description:
          description: The context description.
          type: string
        links:
          type: array
          description: Links related to this resource.
          items:
            $ref: "#/components/schemas/link"
        launchType:
          description: The launch type that is used to launch processes from this
            context.
          type: string
          enum:
          - direct
          - grid
          - kubernetes
          default: direct
        environment:
          description: Environment variables that can be defined when running the
            command.
          type: object
        optionsSetMappingIds:
          description: List of Options Set mappings that reference this context.
          type: array
          items:
            type: string
        commandAllowlist:
          description: List of valid commands that this context can launch. If the
            list is empty, then all commands are treated as valid.
          type: array
          items:
            type: string
        processLimit:
          description: Number of concurrent processes that can be run per context.
          type: integer
