---
openapi: 3.0.3
info:
  title: Analytics Events
  description: An event API for analytics applications.  For SAS Advanced Analytics
    Internal use ONLY.
  version: "2"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
tags:
- name: Streams
  description: The operations for the stream resource.
- name: Filters
  description: The operations for the filter resource.
- name: Root
  description: The operations for the root resource.
- name: Events
  description: The operations for sending Auxiliary Events.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                getRootResponse:
                  value: '{"version":1,"links":[{"method":"GET","rel":"self","href":"/analyticsEvents","uri":"/analyticsEvents","type":"application/vnd.sas.api+json;version=1;charset=UTF-8"},{"method":"GET","rel":"streams","href":"/analyticsEvents/streams","uri":"/analyticsEvents/streams","type":"application/vnd.sas.collection","itemType":"application/vnd.sas.summary"},{"method":"POST","rel":"createStream","href":"/analyticsEvents/streams","uri":"/analyticsEvents/streams","type":"application/vnd.sas.analytics.event.stream","responseType":"application/vnd.sas.analytics.event.stream"},{"method":"POST","rel":"publishEvent","href":"/analyticsEvents/events","uri":"/analyticsEvents/events","type":"application/vnd.sas.analytics.event.auxiliary.event","responseType":"application/vnd.sas.analytics.event.auxiliary.event"}]}'
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                getRootResponse2:
                  value: '{"version":1,"links":[{"method":"GET","rel":"self","href":"/analyticsEvents","uri":"/analyticsEvents","type":"application/vnd.sas.api+json;version=1;charset=UTF-8"},{"method":"GET","rel":"streams","href":"/analyticsEvents/streams","uri":"/analyticsEvents/streams","type":"application/vnd.sas.collection","itemType":"application/vnd.sas.summary"},{"method":"POST","rel":"createStream","href":"/analyticsEvents/streams","uri":"/analyticsEvents/streams","type":"application/vnd.sas.analytics.event.stream","responseType":"application/vnd.sas.analytics.event.stream"},{"method":"POST","rel":"publishEvent","href":"/analyticsEvents/events","uri":"/analyticsEvents/events","type":"application/vnd.sas.analytics.event.auxiliary.event","responseType":"application/vnd.sas.analytics.event.auxiliary.event"}]}'
  /events:
    post:
      tags:
      - Events
      summary: Send an Auxiliary Event
      description: "Sends an event that can be caught by a matching filter.  Most\
        \ events are sent by mid-tier operations, but these events are sourced through\
        \ an API client (typically the ModelStudio UI)."
      operationId: createAuxEvent
      requestBody:
        content:
          application/vnd.sas.analytics.event.auxiliary.event+json:
            schema:
              $ref: "#/components/schemas/event"
            examples:
              sentEvent:
                value: '{"EventID":"eventIdValue", "ResourceURI":"resourceIdValue",
                  "UpURI":"upUriValue", "CallURI":"callUriValue", "AuthorizedAsURI":"authorizedAsValue",
                  "Type":"typeValue", "ServiceName":"serviceNameValue", "Action":"actionValue",
                  "ActionState":"actionStateValue", "SSESessionID":"sseSessionIdValue",
                  "UserID":"userIdValue", "Headers":{ "header1":"header1Value" },
                  "Body":{ "body1":"body1Value"}, "Version":1 }'
          application/json:
            schema:
              $ref: "#/components/schemas/event"
            examples:
              sentEvent:
                value: '{"EventID":"eventIdValue", "ResourceURI":"resourceIdValue",
                  "UpURI":"upUriValue", "CallURI":"callUriValue", "AuthorizedAsURI":"authorizedAsValue",
                  "Type":"typeValue", "ServiceName":"serviceNameValue", "Action":"actionValue",
                  "ActionState":"actionStateValue", "SSESessionID":"sseSessionIdValue",
                  "UserID":"userIdValue", "Headers":{ "header1":"header1Value" },
                  "Body":{ "body1":"body1Value"}, "Version":1 }'
        description: The representation of the event.
        required: true
      responses:
        "201":
          description: An event was sent.
          headers:
            Content-Type:
              description: media type of the newly created resource
              schema:
                type: string
          content:
            application/vnd.sas.analytics.event.auxiliary.event+json:
              schema:
                $ref: "#/components/schemas/event"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsPostEventsSuccessfulResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/event"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsPostEventsSuccessfulResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.analytics.event.auxiliary.event+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsPostEventsBadRequestResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsPostEventsBadRequestResponse"
  /streams:
    get:
      tags:
      - Streams
      summary: Get a collection of streams
      description: "Returns a collection of Analytics Streams based on the specified\
        \ pagination, filtering, and sorting options."
      operationId: getStreams
      parameters:
      - name: start
        description: The index of the first stream to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of streams to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        description: "The criteria for filtering the streams. See [Filtering in REST\
          \ APIs](https://developer.sas.com/rest-apis/analyticsEvents-v2/docs/getting-started/usage-notes#filtering)."
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: "The criteria for sorting the streams. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/analyticsEvents-v1/docs/getting-started/usage-notes#sorting)."
        schema:
          type: string
          format: sort-criteria
      - name: Accept-Item
        in: header
        description: Requested media type for stream collection items.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.event.stream+json
          default: application/vnd.sas.analytics.event.stream+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: media type of the returned resource
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/streamCollection"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsStreamsGetSuccessfulResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/streamCollection"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsStreamsGetSuccessfulResponse"
    head:
      tags:
      - Streams
      summary: Check the existence of streams
      description: "Performs a check for the existence of Analytics Streams based\
        \ on the specified pagination, filtering, and sorting options, returning only\
        \ headers without the body."
      operationId: headersForCheckingStreamsExistence
      parameters:
      - name: start
        description: The index of the first stream to check for existence.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of streams to check for existence.
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        description: "The criteria for filtering the streams. See [Filtering in REST\
          \ APIs](https://developer.sas.com/rest-apis/analyticsEvents-v2/docs/getting-started/usage-notes#filtering)."
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: "The criteria for sorting the streams. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/analyticsEvents-v2/docs/getting-started/usage-notes#sorting)."
        schema:
          type: string
          format: sort-criteria
      - name: Accept-Item
        in: header
        description: Requested media type for stream collection items.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.event.stream+json
          default: application/vnd.sas.analytics.event.stream+json
      responses:
        "200":
          description: The request succeeded; streams exist within the specified criteria.
          headers:
            Content-Type:
              description: media type of the returned resource is indicated in this
                header
              schema:
                type: string
    post:
      tags:
      - Streams
      summary: Create a new stream
      description: Creates a new Analytics Stream.
      operationId: createStream
      responses:
        "201":
          description: A stream was created.
          headers:
            Location:
              description: The URL of the newly created resource.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.analytics.event.stream+json:
              schema:
                $ref: "#/components/schemas/stream"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsStreamsPostSuccessfulResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/stream"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsStreamsPostSuccessfulResponse"
  "/streams/{streamId}":
    get:
      tags:
      - Streams
      summary: Get a stream by ID
      description: |
        Returns an Analytics Stream matching the specified ID. Specify an `Accept` header of `text/event-stream` to listen for Server-Sent Events (SSE) on a stream.
      operationId: getStream
      parameters:
      - name: streamId
        in: path
        description: The ID of the stream.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              description: The content type of the stream.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.stream+json:
              schema:
                $ref: "#/components/schemas/stream"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsGetStreamByIdSuccessfulResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/stream"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsGetStreamByIdSuccessfulResponse"
            text/event-stream:
              schema:
                type: string
              examples:
                ReceiveOneEvent:
                  value: 'data:{"eventId":"12c53738-23f5-417f-bb57-ae6970b2e159","resourceUri":"/analyticsEvents/","callUri":"/analyticsEvents/events","type":"resource","serviceName":"analyticsEvents","action":"create","actionState":"SUCCESS","sseSessionId":"sseSessionValue","userId":"emduser1","headers":{"AuxiliaryEventSpec":"true","X-B3-SpanId":"5cac5cddefe71046","X-B3-TraceId":"5cac5cddefe71046","sas-administrative-action":"false","sas-event-action":"create","sas-event-action-state":"SUCCESS","sas-event-address":"sas.application","sas-trace-id":"5cac5cddefe71046"},"body":{"SomeBody":"true"},"version":1}'
        "404":
          description: The stream was not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsGetStreamByIdNotFoundResponse"
    head:
      tags:
      - Streams
      summary: Check stream existence by ID
      description: |
        Checks for the existence of an Analytics Stream matching the specified ID and retrieves headers with metadata about the stream without returning the stream itself. This can be used to verify the stream's existence, check the content type, or get other metadata without downloading the stream data.
      operationId: headersForCheckingStreamExistence
      parameters:
      - name: streamId
        in: path
        description: The ID of the stream.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Stream exists. Metadata about the stream is provided in the
            response headers without the actual stream content.
          headers:
            Content-Type:
              description: The content type of the stream.
              schema:
                type: string
        "404":
          description: The stream was not found.
    delete:
      tags:
      - Streams
      summary: Delete a stream
      description: Delete an Analytics Stream.
      operationId: deleteStream
      parameters:
      - name: streamId
        in: path
        description: The stream id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Success
        "404":
          description: Stream not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsDeleteStreamByIdNotFoundResponse"
  "/streams/{streamId}/filters":
    get:
      tags:
      - Filters
      summary: Get a collection of filters
      description: "Returns a collection of Analytics Stream Filters based on the\
        \ specified pagination, filtering, and sorting options."
      operationId: getFilters
      parameters:
      - name: streamId
        description: The ID of the stream.
        in: path
        schema:
          type: string
        required: true
      - name: start
        description: The index of the first resource to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of resources to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        description: "The criteria for filtering the resources. See [Filtering in\
          \ REST APIs](https://developer.sas.com/rest-apis/analyticsEvents-v2/docs/getting-started/usage-notes#filtering)."
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: "The criteria for sorting the streams. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/analyticsEvents-v2/docs/getting-started/usage-notes#sorting)."
        schema:
          type: string
          format: sort-criteria
      - name: Accept-Item
        in: header
        description: Requested media type for the collection items.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.event.stream.filter+json
          default: application/vnd.sas.analytics.event.stream.filter+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/filterCollection"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsGetFiltersByStreamIdSuccessfulResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/filterCollection"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsGetFiltersByStreamIdSuccessfulResponse"
    head:
      tags:
      - Filters
      summary: Get metadata about a collection of filters
      description: "Retrieves metadata for a collection of Analytics Stream Filters\
        \ based on the specified pagination, filtering, and sorting options, without\
        \ returning the actual data."
      operationId: headersForCheckingFiltersMetadata
      parameters:
      - name: streamId
        description: The ID of the stream.
        in: path
        schema:
          type: string
        required: true
      - name: start
        description: The index of the first resource for which metadata is returned.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of resource metadata entries to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        description: "The criteria for filtering the resources for which metadata\
          \ is returned. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/analyticsEvents-v2/docs/getting-started/usage-notes#filtering)."
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: "The criteria for sorting the streams for which metadata is returned.\
          \ See [Sorting in REST APIs](https://developer.sas.com/rest-apis/analyticsEvents-v1/docs/getting-started/usage-notes#sorting)."
        schema:
          type: string
          format: sort-criteria
      - name: Accept-Item
        in: header
        description: Requested media type for the collection items metadata.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.event.stream.filter+json
          default: application/vnd.sas.analytics.event.stream.filter+json
      responses:
        "200":
          description: The request for metadata succeeded.
          headers:
            Content-Type:
              description: Media type of the resource metadata
              schema:
                type: string
    post:
      tags:
      - Filters
      summary: Create a new filter
      description: Creates a new Analytics Stream Filter.
      operationId: createFilter
      parameters:
      - name: streamId
        description: The ID of the stream.
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/vnd.sas.analytics.stream.filter+json:
            schema:
              $ref: "#/components/schemas/filter"
            examples:
              Default:
                $ref: "#/components/examples/AnalyticsEventsPostFiltersByStreamIdRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/filter"
            examples:
              Default:
                $ref: "#/components/examples/AnalyticsEventsPostFiltersByStreamIdRequest"
        description: The representation of a filter.
        required: true
      responses:
        "201":
          description: A stream was created.
          headers:
            Location:
              description: The URL of the newly created resource.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.analytics.stream.filter+json:
              schema:
                $ref: "#/components/schemas/filter"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsPostFiltersByStreamIdRequestSuccessfulResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/filter"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsPostFiltersByStreamIdRequestSuccessfulResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsPostFiltersByStreamIdRequestBadRequestResponse"
  "/streams/{streamId}/filters/{filterId}":
    get:
      tags:
      - Filters
      summary: Get a filter by ID
      description: Returns an Analytics Stream Filter matching the specified ID.
      operationId: getFilter
      parameters:
      - name: streamId
        description: The ID of the stream.
        in: path
        schema:
          type: string
        required: true
      - name: filterId
        in: path
        description: filterId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success
          headers:
            Content-Type:
              description: Media type of the resource metadata
              schema:
                type: string
          content:
            application/vnd.sas.analytics.event.stream.filter+json:
              schema:
                $ref: "#/components/schemas/filter"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsGetFiltersByStreamIdFilterIdSuccessfulResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/filter"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsGetFiltersByStreamIdFilterIdSuccessfulResponse"
        "404":
          description: The filter was not found
          headers:
            Content-Type:
              description: Media type of the resource metadata
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsGetFiltersByStreamIdFilterIdNotFoundResponse"
    head:
      tags:
      - Filters
      summary: Get metadata of a filter by ID
      description: Retrieves metadata about an Analytics Stream Filter matching the
        specified ID, without returning the filter itself.
      operationId: headersForCheckingFiltersMetadataOfStream
      parameters:
      - name: streamId
        description: The ID of the stream.
        in: path
        schema:
          type: string
        required: true
      - name: filterId
        in: path
        description: The unique identifier for the filter.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success. The filter exists, and its metadata is returned in
            the headers.
          headers:
            Content-Type:
              description: Media type of the resource metadata
              schema:
                type: string
        "404":
          description: The filter was not found.
          headers:
            Content-Type:
              description: Media type of the resource metadata
              schema:
                type: string
    delete:
      tags:
      - Filters
      summary: Delete a filter
      description: Delete an Analytics Stream Filter.
      operationId: deleteFilter
      parameters:
      - name: streamId
        description: The ID of the stream.
        in: path
        schema:
          type: string
        required: true
      - name: filterId
        in: path
        description: The filter id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Success
        "404":
          description: The filter was not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsDeleteFiltersByStreamIdFilterIdNotFoundResponse"
  "/streams/{streamId}/state":
    put:
      tags:
      - Streams
      summary: Change the state of a stream
      description: Change the streams current state.
      operationId: updateStreamState
      parameters:
      - name: streamId
        description: The ID of the stream.
        in: path
        schema:
          type: string
        required: true
      - name: value
        in: query
        description: "When placed in 'frozen' state, the stream no longer receives\
          \ new events until placed back into 'running'."
        required: true
        schema:
          type: string
          enum:
          - running
          - frozen
      responses:
        "200":
          description: Success
          content:
            application/vnd.sas.analytics.event.stream+json:
              schema:
                $ref: "#/components/schemas/stream"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsPutStreamByIdChangeStateSuccessfulResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/stream"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsPutStreamByIdChangeStateSuccessfulResponse"
        "400":
          description: Bad Input
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsPutStreamByIdChangeStateBadRequestResponse"
        "404":
          description: Not Found
          content:
            application/vnd.sas.analytics.stream+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsEventsPutStreamByIdChangeStateNotFoundResponse"
servers:
- url: "http://example.com/analyticsEvents"
  description: kubernetes mock server
components:
  schemas:
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    stream:
      title: Stream Resource
      description: The representation of an Analytics Stream
      properties:
        id:
          type: string
          description: A unique identifier for the stream.
        queueName:
          type: string
          description: The name of the queue associated with this stream.
        createdBy:
          type: string
          description: The user who created this resource.
        creationTimeStamp:
          type: string
          format: date-time
          description: The time this resource was created.
        lastAccessedTimestamp:
          type: string
          format: date-time
          description: The last time this stream was opened by a client.
        links:
          type: array
          description: The links that apply to the resource
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          format: int32
          description: The version number of this representation schema.
    streamCollection:
      title: Stream Collection
      description: A collection of Analytics Streams
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
