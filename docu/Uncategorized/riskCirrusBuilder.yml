            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-replay-customizations-400-error-response"
        "404":
          description: The request failed. No solution with the given id was found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-get-404-error-response"
        "500":
          description: |
            An internal server error was encountered.

            This could occur if the supplied credentials to communicate with the remote Git repository are invalid or the Git command failed to execute successfully.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-500-error-response"
            application/json:
              schema:
