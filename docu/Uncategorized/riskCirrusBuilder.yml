              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-get-404-error-response"
        "412":
          description: The If-Match condition check did not pass.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-etag-different-412-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
