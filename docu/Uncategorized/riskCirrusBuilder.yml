                  $ref: "#/components/examples/library-file-get-404-error-response"
    head:
      tags:
      - Libraries
      summary: Check the specific library file
      operationId: headersForLibraryFile
      description: |
        Checks the existence of the file with the specified filePath out of the library with libraryId.
      parameters:
      - $ref: "#/components/parameters/libraryIdParameter"
      - $ref: "#/components/parameters/filePathParameter"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Length:
              schema:
                type: integer
              description: The length of the library file asked for.
              example: 100
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/javascript:
              schema:
                type: string
              examples: {}
        "400":
          description: The request failed. Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples: {}
        "404":
          description: The request failed. No library or file with the specified identifiers
            were found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/library-file-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/library-file-get-404-error-response"
  "/importSolution/{repositoryId}/{branch}":
    post:
      tags:
      - Import
      summary: Import a solution and its associated libraries
      operationId: importSolution
      description: |
        Imports a solution defined in the ZIP file into the system.

        If the uploaded zip file has multiple zips for importing the libraries, the uploaded zip file is un-zipped into a temporary file and the import of libraries is performed before importing the solution.

        The operation is atomic in nature.

        A Solution with a specified short name will be set an an active solution if it's the first solution with such short name during import.

        The ActiveCommit timestamp will be set to the LatestCommit timestamp as well.
      parameters:
      - $ref: "#/components/parameters/repositoryIdParameter"
      - $ref: "#/components/parameters/branchParameter"
      - schema:
          type: string
        in: query
        name: comment
        description: Optional commit comment to use when pushing changes to remote
          Git repository.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                solutionZipFile:
                  type: string
                  description: The zip file containing the solution to import.
                  format: binary
            examples: {}
      responses:
        "201":
          description: The import operation completed successfully and the solution
            and libraries (if specified) are imported.
          content:
            application/vnd.sas.risk.cb.import.summary+json:
              schema:
                $ref: "#/components/schemas/importSummaryArray"
              examples:
                default:
                  $ref: "#/components/examples/import-solution-201-create-response"
            application/json:
              schema:
                $ref: "#/components/schemas/importSummaryArray"
              examples:
                default:
                  $ref: "#/components/examples/import-solution-201-create-response"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/import-solution-400-error-response"
        "404":
          description: Repository with key not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                repositoryNotFound:
                  $ref: "#/components/examples/user-respository-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                repositoryNotFound:
                  $ref: "#/components/examples/user-respository-get-404-error-response"
    parameters:
    - name: repositoryId
      in: path
      description: This is the identifier of an existing user repository.
      required: true
      schema:
        type: string
      example: da95ba6e-09a1-4441-a76e-77e48d182f30
    - name: branch
      in: path
      description: This is the solution branch for importing the solution into.
      required: true
      schema:
        type: string
      example: solution_branch
  /importLibrary:
    post:
      tags:
      - Import
      summary: Import user-defined libraries
      operationId: importLibrary
      description: Imports a user defined Library defined in the ZIP file into the
        system.
      responses:
        "201":
          description: The import operation completed successfully and libraries are
            imported.
          content:
            application/vnd.sas.risk.cb.import.summary+json:
              schema:
                $ref: "#/components/schemas/importSummary"
              examples:
                default:
                  $ref: "#/components/examples/import-library-201-create-response"
            application/json:
              schema:
                $ref: "#/components/schemas/importSummary"
              examples:
                default:
                  $ref: "#/components/examples/import-library-201-create-response"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/import-library-400-error-response"
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                libraryZipFile:
                  type: string
                  description: The zip file containing the libraries to import.
                  format: binary
            examples: {}
components:
  parameters:
    solutionIdParameter:
      name: solutionId
      in: path
      description: This is the identifier of an existing solution.
      required: true
      schema:
        type: string
      example: da95ba6e-09a1-4441-a76e-77e48d182f30
    repositoryIdParameter:
      name: repositoryId
      in: path
      description: This is the identifier of an existing user repository.
      required: true
      schema:
        type: string
      example: da95ba6e-09a1-4441-a76e-77e48d182f30
    branchParameter:
      name: branch
      in: path
      description: This is the solution branch name in a remote Git repository.
      required: true
      schema:
        type: string
      example: solution_branch
    libraryIdParameter:
      name: libraryId
      in: path
      description: This is the identifier of an existing user defined library.
      required: true
      schema:
        type: string
      example: e3d692a1-2d0b-4cd5-91b0-d9fdd36c6063
    filePathParameter:
      name: filePath
      in: path
      description: This is the path of a file in a user defined library.
      required: true
      schema:
        type: string
      example: index.js
    commitHashParameter:
      name: commitHash
      in: path
      description: The commit hash of a solution from the solution history.
      required: true
      schema:
        type: string
      example: 09c45ca6f870b75077a350b75b12bfcf4d2ca446
    localeParameter:
      name: locale
      in: path
      description: The locale of the UI artifacts of the solution.
      required: true
      schema:
        type: string
      example: en
    acceptEncoding:
      name: Accept-Encoding
      in: header
      description: The encoding of the responses.
      required: false
      schema:
        type: string
      example: gzip
  schemas:
    patchRequest:
      title: PatchRequest
      type: array
      description: Repository information to change.
      items:
        $ref: "#/components/schemas/patchDocument"
    patchDocument:
      title: PatchDocument
      description: A JSONPatch document as defined by RFC 6902
      required:
      - op
      - path
      - value
      properties:
        op:
          type: string
          description: The operation to be performed
          enum:
          - add
          - remove
          - replace
        path:
          type: string
          description: A JSON-Pointer
        value:
          type: string
          description: The value to be used within the operations.
    userRepository:
      title: UserRepository
      description: The user repository definition
      x-examples:
        createUserRepository:
          name: test_user_repository
          description: This is a user repository for testing.
          url: "https://github.com/testUser/remote_repository.git"
          user: testUser
          token: e0219e321f796d83e9264549ba077c03f452dd94
        updateUserRepository:
          name: changed name
          description: This is a user repository for testing changed.
          url: "https://github.com/testUser/remote_repository.git"
          user: testUser1
          token: e0219e321f116d83e9264549ba077c03f452dd94
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
        key:
          type: string
          title: User repository identifier.
          description: |
            The unique identifier of the user repository to be used during GET, DELETE and PUT requests.

            This is a system assigned identifier.
          example: 16372757e-011d-454d-905b-eb10b4a9e5a9
          readOnly: true
        name:
          title: User repository name.
          type: string
          description: |
            The user repository name.

            This must be unique.

            The name cannot contain special characters and spaces.

            This name will be used as SAS_DOMAIN_ID when adding the credentials provided to the credentials service.

            The users' local Git repository for a solution will be created using the name provided.
          example: test_user_repository
        description:
          title: User repository description.
          type: string
          description: The user repository description.
          example: This is a user repository for testing.
        url:
          title: The URL of the remote Git repository to store the solution artifacts.
          type: string
          description: |
            The URL of the remote Git repository against which the Git commands will be executed to store the solution artifacts.
          example: "https://github.com/testUser/remote_repository.git"
        user:
          title: The user name to used to connect to the remote Git repository.
          type: string
          description: |
            The user name to used to connect to the remote Git repository.

            The user will be used to authenticate the connection to the remote Git repository.
          example: testUser
        token:
          type: string
          title: The token to be used to authenticate the given user.
          description: |
            The token to be used to authenticate the given user.

            The token and user name will be used to authenticate the connection to the remote Git repository.

            The token is the administrator provided token for the particular user on the specific remote repository.

            The token is required on create / update requests, but will never be returned in any responses.
          example: e0219e321f796d83e9264549ba077c03f452dd94
          writeOnly: true
        credType:
          type: string
          title: The connection type.
          description: |
            The connection protocol type to be used to connect to the remote Git repository.

            The connection type will be "https" or "http". The connection protocol type is determined from the provided URL of the remote Git repository.
          example: https
          readOnly: true
        createdBy:
          type: string
          description: Username of the entity that created this user repository
          example: testUser
          readOnly: true
        modifiedBy:
          type: string
          description: Username of the entity that last modified this user repository
          example: testUser
          readOnly: true
        creationTimeStamp:
          type: string
          description: Date and time stamp of when this entity was created.
          format: date-time
          example: "2021-11-08T18:40:21.674894Z"
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: Date and time stamp of when this entity was last modified.
          format: date-time
          example: "2021-11-08T18:40:21.674894Z"
          readOnly: true
        links:
          type: array
          description: Paging links that apply to this user repository
          items:
            $ref: "#/components/schemas/link"
          readOnly: true
        providerType:
          type: string
          description: |
            The remote GIT repository provider type.

            The providerType is not a required property on a request and if not provided, it will be tried to be determined from the repository URL.

            Based on the providerType, the {base64 token} for the git remote command operation execution will be generated.
          example: github
          enum:
          - gitlab
          - github
          - bitbucket
          - azure
        repositorySource:
          type: string
          description: |
            The remote repository source Type.

            The repository source identifies the source type of the user defined repository.

            *Note*:
              If the repository source type is 'git', the user, token, url are required properties to be provided in the request.
              else, the properties are not required if the repository source type is 'database'.

            If the repository source type is 'database' the solution UI artifacts and the solution commit histories are
            stored in the database referencing the solution for which they are required for.
          example: git
          enum:
          - database
          - git
      required:
      - name
      - repositorySource
    userRepositories:
      title: UserRepositories
      description: This is a collection of user repository objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        readOnly: true
        properties:
          items:
            type: array
            description: The actual results of a query
            items:
              $ref: "#/components/schemas/userRepository"
    solutionSummary:
      title: SolutionSummary
      description: The solution summary object definition
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
        name:
          title: Solution name.
          type: string
          description: The solution name.
          example: test_solution_name
        description:
          title: Solution description.
          type: string
          description: The solution description.
