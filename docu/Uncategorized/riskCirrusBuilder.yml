            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-etag-missing-428-error-response"
        "500":
          description: |
            Internal Server Error.

            This can happen
              - If the remote Git connection is not valid.

              - The patch body contains reference to a path that is not present and the patch operation is replace.

                For example, 'path': '/description, and the user repository does not have a 'description' set.
