          type: string
          enum:
          - success
          - failed
          - ignored
          - successWithWarnings
          title: Import Status.
          description: The status of the import for the import type.
          example: success
          readOnly: true
        error:
          type: object
          title: The error during import.
          description: |
            The JSON representation of the error encountered during the import operation.
          example: {}
          readOnly: true
