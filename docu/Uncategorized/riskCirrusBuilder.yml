  "/solutions/{solutionId}/history":
    get:
      tags:
      - Solutions
      summary: Get the history of a specific solution
      operationId: getSolutionHistory
      description: |
        Get the history of a specific solution definition by id.

        This will return a collection of the change history made to the entire solution definition.

        *Note*: If the repository source of the solution is *'database'* the commit history will be paged.
        Therefore, the paging parameters
        - start
        - limit

        will be honored and the response will be reflect the specified parameter values.

        *Note*: If the repository source of the solution is *'git'* the commit history cannot be paged
        because of git limitations. Therefore, only the paging parameter
        - limit

        will be honored and the response will be reflect the specified parameter value.

        In this case, the response times will vary greatly.
        100 -> 1.79 secs;
        1000 -> 5.40 secs;
        10000 -> ~40 secs
      parameters:
      - $ref: "#/components/parameters/solutionIdParameter"
      - name: limit
        in: query
        description: |-
          Maximum number of history items to return.

          If the repository source of the solution is *'git'* the default is 100.

          If the repository source of the solution is *'database'* the default is 20.
        schema:
          type: integer
      - name: start
        in: query
        description: |-
          Start at a specific item to return history. Defaults to 0.

          *Note*: If the repository source of the solution is *'git'* this parameter will not be used.
        schema:
          type: integer
      responses:
        "200":
          description: The request succeeded and matching solution's history is returned.
          headers:
            ETag:
              description: A tag that identifies this revision of this solution.
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
              description: The timestamp this solution was last modified.
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/histories"
              examples:
                git:
                  $ref: "#/components/examples/solution-history-git-source-get-200-response"
                database:
                  $ref: "#/components/examples/solution-history-database-source-get-200-response"
            application/json:
              schema:
                $ref: "#/components/schemas/histories"
              examples:
                git:
                  $ref: "#/components/examples/solution-history-git-source-get-200-response"
                database:
                  $ref: "#/components/examples/solution-history-database-source-get-200-response"
        "400":
          description: The request failed. Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples: {}
        "404":
          description: The request failed. No solution with the given id was found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-get-404-error-response"
        "500":
          description: |
            Internal server error.

            This can happen if the remote Git connection is not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-500-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-500-error-response"
  "/solutions/{solutionId}/replayCustomizations":
    post:
      tags:
      - Solutions
      summary: Apply local changes from source solution and a specific commit hash
      operationId: replayCustomizations
      description: |
        Apply local changes from source solution and a specific commit hash.

        The target solution's UI artifacts will be updated using the source solution's UI artifacts
        based off of the initial commit (stored in the database) and the desired commit hash provided
        in the request. The difference as a json-patch is generated and applied on top of The
        target solution's UI artifacts to yield an updated solution UI with the local changes
        applied.

        The json-patch document is navigated and the 'path' of all 'replace' operations will be verified against
        the target solution's UI artifacts. If the 'path' does not exist, the operation details will be added
        to an 'invalid' operations list and presented to the user in the response for any further action.

        The replay customizations operation will only handle all json-patch operations that will be successful.
      parameters:
      - $ref: "#/components/parameters/solutionIdParameter"
      requestBody:
        content:
          application/vnd.sas.risk.cb.solution.replay.customizations:
            schema:
              $ref: "#/components/schemas/replayCustomizationsRequest"
            examples:
              default:
                $ref: "#/components/examples/solution-replay-customizations-request-body"
          application/json:
            schema:
              $ref: "#/components/schemas/replayCustomizationsRequest"
            examples:
              default:
                $ref: "#/components/examples/solution-replay-customizations-request-body"
        description: The definition or the apply local changes representation of the
          source solution.
        required: true
      responses:
        "200":
          description: Local changes applied successfully on to target solution.
          content:
            application/vnd.sas.risk.cb.solution.replay.customizations.response+json:
              schema:
                $ref: "#/components/schemas/replayCustomizationsResponse"
              examples:
                success:
                  $ref: "#/components/examples/solution-replay-customizations-200-success--response"
                successWithWarnings:
                  $ref: "#/components/examples/solution-replay-customizations-200-success-with-warnings-response"
            application/json:
              schema:
                $ref: "#/components/schemas/replayCustomizationsResponse"
              examples:
                success:
                  $ref: "#/components/examples/solution-replay-customizations-200-success--response"
                successWithWarnings:
                  $ref: "#/components/examples/solution-replay-customizations-200-success-with-warnings-response"
        "400":
          description: |
            Bad Request.

            The request is not properly formed.

            This can happen if the body is missing required fields or
            - if the short names of the target and source solutions do not match
            - if the source solution's specified commit hash is not found in the GIT repository.
            - if the source solution does not have any changes from the time it was createdBy.
            - if the local changes collide with the target solution's UI artifacts.
            - if the desired source solution's commit is not found on the solution branch on the remote GIT repository.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
