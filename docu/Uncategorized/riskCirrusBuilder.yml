          description: |
            Not Found.

            - No solution with the given id was found.
            - This can happen if the solution's specified commit hash is not found in the GIT repository.
  "/solutions/{solutionId}/ui/{commitHash}/{locale}":
    get:
      tags:
      - Solutions
      summary: Get the solution UI artifacts for the specified solution as of a specific
        commit for a specific locale.
      operationId: getSolutionUiArtifacts
      description: |
        Get the solution UI artifacts for the specified solution as of a specific commit for a specific locale.

        This will return the ui artifacts for a solution as of the commit.
        If specified locale is:
          - "en": Only this locale will be returned in the response
          - anything other: If the locale is present, the specified locale and "en" will be returned.
          - if the locale does not exist, only "en" will be returned.

        If all the locales for a solution are required, the locale parameter should be set to "*".

        If the request header "Accept-Encoding" is "gzip", "compress", the response will be gzipped thereby,
        reducing the size of the responses.

        The size for non-gzip response would be ~5.2mb vs a gzip response of ~780kb
      parameters:
      - $ref: "#/components/parameters/solutionIdParameter"
      - $ref: "#/components/parameters/commitHashParameter"
      - $ref: "#/components/parameters/localeParameter"
      - $ref: "#/components/parameters/acceptEncoding"
      responses:
        "200":
          description: |
            The UI artifacts of the solution for the specified commit with only the specified locale are returned
            successfully.
          content:
            application/vnd.sas.risk.cb.solution.ui.artifacts+json:
              schema:
                $ref: "#/components/schemas/getSolutionUiArtifactsResponse"
              examples:
                default:
                  $ref: "#/components/examples/solution-ui-artifacts-en-response"
                otherLocale:
                  $ref: "#/components/examples/solution-ui-artifacts-es-response"
                nonExistentLocale:
                  $ref: "#/components/examples/solution-ui-artifacts-en-response"
            application/json:
              schema:
                $ref: "#/components/schemas/getSolutionUiArtifactsResponse"
              examples:
                default:
                  $ref: "#/components/examples/solution-ui-artifacts-en-response"
                otherLocale:
                  $ref: "#/components/examples/solution-ui-artifacts-es-response"
                nonExistentLocale:
                  $ref: "#/components/examples/solution-ui-artifacts-en-response"
          headers:
            Cache-control:
              description: |
                The cache-control header indicating the successful response should be cached
                in the browser cache.
              schema:
                type: string
                description: |
                  The duration for which the response will be cached before being removed.
                example: "max-age=31536000"
            Accept-Ranges:
              description: |
                Used by the server to advertise its support for range requests, allowing clients
                to request part or several parts of a resource. The value of this header indicates
                the unit that can be used to define a range.
              schema:
                type: string
                example: bytes
        "400":
          description: |
            Bad Request.

            This can happen if the solution's specified commit hash is not found in the GIT or DB repository.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-db-400-error-response"
                commitNotFound:
                  $ref: "#/components/examples/solution-get-commit-parameter-400-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-db-400-error-response"
                commitNotFound:
                  $ref: "#/components/examples/solution-get-commit-parameter-400-error-response"
        "404":
          description: The request failed. No solution with the given id was found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-get-404-error-response"
        "500":
          description: |
            An internal server error was encountered.

            This could occur if the supplied credentials to communicate with the remote Git repository are invalid or the Git command failed to execute successfully.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-500-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-500-error-response"
  /libraries:
    get:
      tags:
      - Libraries
      summary: Get a list of user defined JavaScript interaction libraries
      operationId: getAllLibraries
      description: |
        Get a list of user defined JavaScript interaction libraries.

        The libraries returned can be filtered, sorted, and paged.

        The default sort order will be the library ID.

        Alternative sort orders may be by name, version, user, modifiedBy, createdBy.

        It is also possible to filter on any of these fields, using the functions eq, gt, ge, lt, le, or contains.

        Returned items will be of media type application/vnd.sas.risk.cb.library.
      parameters:
      - name: start
        in: query
        description: 0-based Offset of first type to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of types to return.  Defaults to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned types. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/riskCirrusBuilder-v1/docs/getting-started/usage-notes#filtering)."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "Sort returned types. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/riskCirrusBuilder-v1/docs/getting-started/usage-notes#sorting)."
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded and matching user defined/specified libraries
            are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/libraries"
              examples:
                default:
                  $ref: "#/components/examples/libraries-get-collection-200-response"
            application/json:
              schema:
                $ref: "#/components/schemas/libraries"
              examples:
                default:
                  $ref: "#/components/examples/libraries-get-collection-200-response"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/libraries-collection-get-400-error-response"
  "/libraries/{libraryId}":
    get:
      tags:
      - Libraries
      summary: Get a specific library
      operationId: getLibrary
      description: |
        Get a specific library definition by id.

        This will return the library definition.
      parameters:
      - $ref: "#/components/parameters/libraryIdParameter"
      responses:
        "200":
          description: The request succeeded and matching library is returned.
          headers:
            ETag:
              description: A tag that identifies this revision of this library.
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
              description: The timestamp this library was last modified.
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.library+json:
              schema:
                $ref: "#/components/schemas/library"
              examples:
                default:
                  $ref: "#/components/examples/library-get-200-ok-response"
            application/json:
              schema:
                $ref: "#/components/schemas/library"
              examples:
                default:
                  $ref: "#/components/examples/library-get-200-ok-response"
        "400":
          description: The request failed. Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples: {}
        "404":
          description: The request failed. No library with the given id was found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/library-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/library-get-404-error-response"
    head:
      tags:
      - Libraries
      summary: Check existence of a specific library
      operationId: headersForGetLibrary
      description: |
        Check the existence of a specific library definition by id.
      parameters:
      - $ref: "#/components/parameters/libraryIdParameter"
      responses:
        "200":
          description: The request succeeded and matching library exists.
          headers:
            ETag:
              description: A tag that identifies this revision of this library.
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
              description: The timestamp this library was last modified.
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.library+json:
              schema:
                $ref: "#/components/schemas/library"
              examples: {}
            application/json:
              schema:
                $ref: "#/components/schemas/library"
              examples: {}
        "400":
          description: The request failed. Bad request.
        "404":
          description: The request failed. No library with the given id was found.
    delete:
      tags:
      - Libraries
      summary: Delete a specific library
      operationId: deleteLibrary
      description: Delete the Library.
      parameters:
      - $ref: "#/components/parameters/libraryIdParameter"
      responses:
        "204":
          description: Library definition deleted successfully.
        "400":
          description: |
            Bad Request.

            The request is not properly formed.

            This can happen if the body is missing required fields or if the library is referenced by solutions.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples: {}
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples: {}
        "404":
          description: The request failed. No library with the given id was found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/library-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/library-get-404-error-response"
  "/libraries/{libraryId}/files/{filePath}":
