            The contents of the uploaded zip file are scanned for determining the import type operation to performed.

            The following files will be looked at for determining the import type.
              1. "ui/application/application.json": the import type will be "solution".
              2. "lib/" folder: the import type will be "library".
          example: solution
          readOnly: true
        name:
          type: string
          title: The name of the solution or the library.
          description: |
            The solution or the library name that is imported.

            This will be determined by the import type.
          example: test_solution_name
          readOnly: true
        shortName:
          type: string
          title: The short name of the solution
          description: |
            The solution short name defined in the application.json in the uploaded zip during import.
          example: TEST_SOLUTION_SHORT_NAME
          readOnly: true
        solutionVersion:
          type: string
          title: The solution version.
          description: |
            The latest version of the solution imported.
          example: "2024.04"
          readOnly: true
        solutionSemanticVersion:
          type: string
          title: The solution semantic version.
          description: |
            The latest semantic version of the solution imported. It's of the form "major"."minor"."patch"
          example: "1.20.3"
        libraryId:
          type: string
          title: The library id.
          description: The short name of library - used as identifier.
          example: testLib
          readOnly: true
        libraryVersion:
          type: string
          title: The library version.
          description: The pretty long name of the library.
          example: Test Library
          readOnly: true
