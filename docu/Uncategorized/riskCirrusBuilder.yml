---
openapi: 3.0.3
info:
  version: "2"
  title: Risk Cirrus Builder
  description: |
    SAS Risk Cirrus Builder is a cloud-native risk management solution
    ecosystem that provides low-code/no-code solution editing in the cloud.

    It is built on and fully integrated with the SAS Viya platform.
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: "http://example.com/riskCirrusBuilder"
  description: This is an example mock server.
tags:
- name: Root Links
  description: Root links.
- name: User Repositories
  description: Remote repositories where solution artifacts are stored.
- name: Solutions
  description: UI artifacts representing solutions.
- name: Libraries
  description: Libraries of code that can be used by solutions.
- name: Import
  description: Importing already built solutions and/or libraries.
paths:
  /:
    get:
      tags:
      - Root Links
      description: Get a list of top-level links for the service.
      summary: Get a list of top-level links for the service
      operationId: root
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/root"
  /userRepositories:
    get:
      tags:
      - User Repositories
      summary: Get a list of user repositories
      operationId: getUserRepositories
      description: |
        Get a list of user repositories.

        The user repositories returned can be filtered, sorted, and paged.

        The default sort order will be the user repository ID.

        Alternative sort orders may be by name, description, host, user, modifiedBy, createdBy.

        It is also possible to filter on any of these fields, using the functions eq, gt, ge, lt, le, or contains.

        Returned items will be of media type application/vnd.sas.risk.cb.user.repository.
      parameters:
      - name: start
        in: query
        description: 0-based Offset of first type to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of types to return.  Defaults to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned types. See [Filtering in REST APIs](\t\
          https://developer.sas.com/rest-apis/riskCirrusBuilder-v1/docs/getting-started/usage-notes#filtering)."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "Sort returned types. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/riskCirrusBuilder-v1/docs/getting-started/usage-notes#sorting)."
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded and matching user repositories are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/userRepositories"
              examples:
                default:
                  $ref: "#/components/examples/user-repositories-collection"
            application/json:
              schema:
                $ref: "#/components/schemas/userRepositories"
              examples:
                default:
                  $ref: "#/components/examples/user-repositories-collection"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-repositories-get-400-error-response"
    post:
      tags:
      - User Repositories
      summary: Create a user repository
      operationId: createUserRepository
      description: |
        Create a user repository in the system for storing solution artifacts.

        The Git remote repository connection validations are executed when performing this operation if the repository source is 'git'.
      requestBody:
        content:
          application/vnd.sas.risk.cb.user.repository+json:
            schema:
              $ref: "#/components/schemas/userRepository"
            examples:
              default:
                $ref: "#/components/examples/user-repository-create-request-body-database"
              git:
                $ref: "#/components/examples/user-repository-create-request-body"
          application/json:
            schema:
              $ref: "#/components/schemas/userRepository"
            examples:
              default:
                $ref: "#/components/examples/user-repository-create-request-body-database"
              git:
                $ref: "#/components/examples/user-repository-create-request-body"
        description: The user repository definition to be created.
        required: true
      responses:
        "201":
          description: User repository definition created successfully.
          headers:
            Location:
              description: The URI of the newly created user repository.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.cb.user.repository+json:
              schema:
                $ref: "#/components/schemas/userRepository"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-create-success-response"
            application/json:
              schema:
                $ref: "#/components/schemas/userRepository"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-create-success-response"
                database:
                  $ref: "#/components/examples/user-repository-create-success-response-database"
        "400":
          description: |
            Bad Request.

            The request is not properly formed.

            This can happen if the type name in the path does not match the type name in the body or if the body is missing required fields.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-400-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-400-error-response"
        "500":
          description: |
            Internal Server Error.

            This can happen if the remote Git connection is not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-500-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-500-error-response"
  "/userRepositories/{repositoryId}":
    get:
      tags:
      - User Repositories
      summary: Get a specific user repository
      operationId: getUserRepository
      description: Get a specific user repository definition using existing identifier.
      parameters:
      - name: repositoryId
        in: path
        description: This is the identifier of the existing user repository.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded and matching user repository is returned.
          headers:
            ETag:
              description: A tag that identifies this revision of this user repository.
              schema:
                type: string
            Last-Modified:
              description: The last modified date.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.cb.user.repository+json:
              schema:
                $ref: "#/components/schemas/userRepository"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-200-response"
                database:
                  $ref: "#/components/examples/user-repository-200-response-database"
            application/json:
              schema:
                $ref: "#/components/schemas/userRepository"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-200-response-database"
                git:
                  $ref: "#/components/examples/user-repository-200-response"
        "404":
          description: The request failed. No user repository with the given id was
            found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-respository-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-respository-get-404-error-response"
    head:
      tags:
      - User Repositories
      summary: Check if the given user repository exists
      operationId: headersForGetUserRepository
      description: Check the existence of the specific user repository definition
        using existing identifier.
      parameters:
      - name: repositoryId
        in: path
        description: This is the identifier of the existing user repository.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded and matching user repository is returned.
          headers:
            ETag:
              description: A tag that identifies this revision of this user repository.
              schema:
                type: string
            Last-Modified:
              description: The last modified date.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.cb.user.repository+json:
              schema:
                $ref: "#/components/schemas/userRepository"
              examples: {}
            application/json:
              schema:
                $ref: "#/components/schemas/userRepository"
              examples: {}
        "404":
          description: The request failed. No user repository with the given id was
            found.
    delete:
      tags:
      - User Repositories
      summary: Delete a specific user repository
      operationId: deleteUserRepository
      parameters:
      - $ref: "#/components/parameters/repositoryIdParameter"
      description: |
        Delete a user repository in the system.

        The user repository cannot be deleted if it is referenced by a solution.

        Deleting the definition of the remote repository will not delete the actual Git repository, just the definition of that repository in the system.
      responses:
        "204":
          description: User repository definition deleted successfully.
        "400":
          description: "Bad Request.  The request is not properly formed. This can\
            \ happen if the body is missing required fields, or if the user repository\
            \ is referenced by one or more solutions."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples: {}
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples: {}
        "404":
          description: The request failed. No user repository with the given id was
            found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-respository-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-respository-get-404-error-response"
    patch:
      tags:
      - User Repositories
      summary: Update via a patch operation a specific user repository
      operationId: patchUserRepository
      parameters:
      - $ref: "#/components/parameters/repositoryIdParameter"
      - in: header
        name: If-Match
        description: |
          The value of the ETag that was returned from a GET or previous PUT of this user repository.

          This MUST match exactly the current value of the etag of the user repository.

          The Git remote repository connection validations are executed when performing this operation.
        schema:
          type: string
      description: |
        A patch representation of the user repository to be updated is provided.

        This will be compared with the existing user repository definition and the required changes applied.

        The patch follows the RFC 3309 standards for patching an object.
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: "#/components/schemas/patchRequest"
            examples:
              example:
                value:
                - op: replace
                  path: /name
                  value: newName
          application/json:
            schema:
              $ref: "#/components/schemas/patchRequest"
            examples:
              example:
                value:
                - op: replace
                  path: /name
                  value: newName
        description: The information of the specific user repository to be patch updated.
        required: true
      responses:
        "200":
          description: User Repository definition updated successfully.
          headers:
            ETag:
              description: A tag that identifies this revision of this user repository.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.cb.user.repository+json:
              schema:
                $ref: "#/components/schemas/userRepository"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-200-response"
            application/json:
              schema:
                $ref: "#/components/schemas/userRepository"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-200-response"
        "400":
          description: |
            Bad Request.

            The request is not properly formed.

            This can happen if the body is missing required fields or if user repository is in use by solutions.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples: {}
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples: {}
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "404":
          description: The request failed. No user repository with the given id was
            found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-respository-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-respository-get-404-error-response"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "412":
          description: The If-Match condition check did not pass.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-etag-different-412-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-etag-different-412-error-response"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "428":
          description: Pre-Condition failed. If-Match header was not provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-etag-missing-428-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-etag-missing-428-error-response"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "500":
          description: |
            Internal Server Error.

            This can happen if
              - The remote Git connection is not valid.
              - The patch body contains reference to a path that is not present and the patch operation is replace.

                For example ''path'': ''/description and the existing user repository does not have a value for ''description''.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-500-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-500-error-response"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
  "/userRepositories/{repositoryId}/validate":
    post:
      tags:
      - User Repositories
      summary: Validate connection to the underlying Git repository using the stored
        information for a given user repository
      operationId: validateUserRepository
      parameters:
      - $ref: "#/components/parameters/repositoryIdParameter"
      description: Validate the connection to the remote Git repository for the specified
        user repository using the credentials supplied when defining the specified
        user repository.
      responses:
        "200":
          description: |
            The connection to the remote Git repository is valid.
            Note, the connection is also considered valid if the repository is publically readable regardless of the supplied user.
          content:
            application/vnd.sas.validation+json:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-validate-200-response"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "400":
          description: Bad request. The connection to the remote Git repository is
            not valid.
          content:
            application/vnd.sas.validation+json:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                default:
                  $ref: "#/components/examples/user-repository-validate-400-error-response"
  /solutions:
    get:
      tags:
      - Solutions
      summary: Get a list of solutions
      operationId: getSolutions
      description: |
        Get a list of solutions.

        The solutions returned can be filtered, sorted, and paged. The default sort order will be the solutions ID.

        Alternative sort orders may be by name, description, branch, path, modifiedBy, createdBy.

        It is also possible to filter on any of these fields, using the functions eq, gt, ge, lt, le, or contains.

        Returned items will be of media type application/vnd.sas.risk.cb.solution.summary.
      parameters:
      - name: start
        in: query
        description: 0-based Offset of first type to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of types to return.  Defaults to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned types. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/riskCirrusBuilder-v1/docs/getting-started/usage-notes#filtering)."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "Sort returned types. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/riskCirrusBuilder-v1/docs/getting-started/usage-notes#sorting)."
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded and matching user repositories are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/solutions"
              examples:
                default:
                  $ref: "#/components/examples/solution-summary-collection-get-response"
            application/json:
              schema:
                $ref: "#/components/schemas/solutions"
              examples:
                default:
                  $ref: "#/components/examples/solution-summary-collection-get-response"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solutions-get-400-error-response"
  "/solutions/{solutionId}":
    get:
      tags:
      - Solutions
      summary: Get a specific solution
      operationId: getSolution
      description: |
        Get a specific solution definition by id.

        This will return the entire solution definition including the pages, scripts and schema definitions used.
      parameters:
      - $ref: "#/components/parameters/solutionIdParameter"
      - name: commit
        in: query
        description: The optional commit hash of the solution to retrieve.  If not
          supplied, the latest commit will be returned.
        schema:
          type: string
          example: "118bc2cf22d4752e190949588e924f7beb44283c"
      responses:
        "200":
          description: The request succeeded and matching solution is returned.
          headers:
            ETag:
              description: A tag that identifies this revision of this solution.
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
              description: The timestamp this solution was last modified.
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.cb.solution+json:
              schema:
                $ref: "#/components/schemas/solution"
              examples:
                default:
                  $ref: "#/components/examples/solution-detail-get-200-response"
            application/json:
              schema:
                $ref: "#/components/schemas/solution"
              examples:
                default:
                  $ref: "#/components/examples/solution-detail-get-200-response"
            application/vnd.sas.risk.cb.solution.gz+json:
              schema:
                $ref: "#/components/schemas/solutionGZipResponse"
              examples:
                default:
                  $ref: "#/components/examples/solution-zipped-detail-get-200-response"
            application/vnd.sas.risk.cb.solution.summary+json:
              schema:
                $ref: "#/components/schemas/solutionSummaryResponse"
              examples:
                default:
                  $ref: "#/components/examples/solution-summary-get-200-response"
        "400":
          description: The request failed. Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                commitNotFound:
                  $ref: "#/components/examples/solution-get-commit-parameter-400-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                commitNotFound:
                  $ref: "#/components/examples/solution-get-commit-parameter-400-error-response"
        "404":
          description: The request failed. No solution with the given id was found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-get-404-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-get-404-error-response"
        "500":
          description: |
            Internal server error.

            This can happen if the remote Git connection is not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-500-error-response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/solution-500-error-response"
    head:
      tags:
      - Solutions
      summary: Check existence of the specific solution
      operationId: headersForGetSolution
      description: |
        Check if the solution exists given the solution identifier.
      parameters:
      - $ref: "#/components/parameters/solutionIdParameter"
      responses:
        "200":
          description: The request succeeded indicating the solution given an solution
            identifier exists.
          headers:
            ETag:
              description: A tag that identifies this revision of this solution.
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
              description: The timestamp this solution was last modified.
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.cb.solution+json:
              schema:
                $ref: "#/components/schemas/solution"
              examples: {}
            application/json:
              schema:
                $ref: "#/components/schemas/solution"
              examples: {}
            application/vnd.sas.risk.cb.solution.gz+json:
              schema:
                $ref: "#/components/schemas/solutionGZipResponse"
              examples: {}
        "400":
          description: The request failed. Bad request.
        "404":
          description: The request failed. No solution with the given id was found.
    patch:
      tags:
      - Solutions
      summary: Patch update a specific solution
      operationId: patchSolution
      description: |
        A patch representation of the solution to be updated is provided.
        This will be compared with the existing solution definition and the required changes applied.
        The patch follows the RFC 3309 standards for patching an object.
        The patch operation will also update the solution metadata in the system either directly by a patch operation
        or indirectly via the "/ui/application/application". Only the description, name, isActive and activeCommit
        metadata fields of a solution are allowed to be updated via a patch operation. All the other fields (metadata)
        are read only. If a solution is being set isActive via a patch, the 'activeCommit' needs to be specified.
        A solution isActive only for a specific 'activeCommit' hash. Changing the name metadata will also update
        /ui/application/application/displayName and changing the description metadata will also update the
        /ui/application/application/description field (and vice versa).

        The patch operation should be used to patch the UI artifacts of a solution.
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: "#/components/schemas/patchRequest"
            examples:
              database:
                value:
                - op: "replace"
                  path: "/isActive"
                  value: "true"
                - op: "add"
                  path: "/activeCommit"
                  value: "30b55666-3ead-42ac-aabf-426f0079511d"
              git:
                value:
                - op: "replace"
                  path: "/isActive"
                  value: "true"
                - op: "add"
                  path: "/activeCommit"
                  value: "245ac8ed3c234c540e546313840122a313e3a7ed"
          application/json:
            schema:
              $ref: "#/components/schemas/patchRequest"
            examples:
              database:
                value:
                - op: "replace"
                  path: "/isActive"
                  value: "true"
                - op: "add"
                  path: "/activeCommit"
                  value: "30b55666-3ead-42ac-aabf-426f0079511d"
              git:
                value:
                - op: "replace"
                  path: "/isActive"
                  value: "true"
                - op: "add"
                  path: "/activeCommit"
                  value: "245ac8ed3c234c540e546313840122a313e3a7ed"
        description: The definition or the patch representation of the solution to
          be updated.
        required: true
      parameters:
      - $ref: "#/components/parameters/solutionIdParameter"
      - name: If-Match
        in: header
        description: A tag that identifies the revision of this solution.
        schema:
          type: string
        required: true
      responses:
        "200":
          description: Solution definition patch updated successfully.
          headers:
            ETag:
              description: A tag that identifies this revision of this solution.
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
              description: The last timestamp this solution was last modified.
          content:
            application/vnd.sas.risk.cb.solution+json:
              schema:
                $ref: "#/components/schemas/solution"
              examples:
                default:
                  $ref: "#/components/examples/solution-detail-get-200-response"
            application/json:
              schema:
                $ref: "#/components/schemas/solution"
              examples:
                default:
                  $ref: "#/components/examples/solution-detail-get-200-response"
        "400":
          description: |
            Bad Request.

            The request is not properly formed.

            This can happen if the body is missing required fields or if

            - any other fields other than description, isActive and activeCommit are updated.
            - the solution is set as isActive and no activeCommit hash is provided
            - the specified activeCommit hash is not present in the solution history for that solution branch in the remote GIT repository.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
