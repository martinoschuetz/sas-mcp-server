      summary: Delete Archival Job
      description: Deletes the specified analysis data archival job.  If this job
        is specific to an archival action, the job delete will also delete the archive
        object.  The same rules apply to an archive job delete as do an archive delete.  If
        this archival job delete is associated with an archival restore job then that
        job cannot be currently in use by the analysis data instance.
      operationId: deleteAnalysisDataArchivalJob
      parameters:
      - name: analysisId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data.
      - name: jobKey
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the archive data object.
      responses:
        "204":
          description: The request succeeded; nothing to return
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
