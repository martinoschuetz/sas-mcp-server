---
openapi: 3.0.3
info:
  version: "3"
  title: Risk Data
  description: |-
    The Risk Data API provides storage for analysis data instances described in
    the Risk Cirrus Objects API.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
servers:
- url: http://example.com/riskData
  description: Sample server URL.
tags:
- name: Root
  description: Operations for the root links.
- name: Data
  description: Operations for analysis data instances.
- name: Data Archival
  description: Operations for data archival actions such as archive and restore for
    an analysis data instance.
- name: Data Definition
  description: Operations for data definitions.
- name: ReportMart
  description: Operations for report marts.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootLinks"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootLinks"
  /objects:
    post:
      tags:
      - Data
      summary: Create analysis data
      description: >
        Stores an analysis data set and optionally creates the data definition,
        analysis data instance, and associated data security rules in
        Cirrus Objects service.

        - Associated Object Identification. For existing definitions, analysis data
        instances,
          and security rules, the request should include one of the following -- the
        object's key,
          its objectID and sourceSystemCode properties, or its schemaName and
          schemaVersion custom properties (if appropriate).  If none of those
          are specified, then this request will create a new object in the
          Cirrus Objects service with the posted information and information
          gathered from the analysis data

        - Asynchronous Processing. The import of the data is performed
          asynchronously.  There are two options for asynchronous processing.
          - Job Execution Job.  When a application/vnd.sas.job.execution.job+json
            response is requested, a JES job will immediately be created and returned
        in the response.
            The entire processing of the import including the creation of the Cirrus
        objects,
            the import of the data, and the population of the Report Mart will be
        performed
            within the JES job processing.  The JES job can be monitored for completion
        and
            information regarding the import can be found in the log of the JES job.
          - Compute Job.  When a application/vnd.sas.business.objects.analysis.data.instance+json
            response is requested, the creation of the Cirrus objects will take place
            immediately prior to the response return. The data will be imported asynchronously
        via a
            SAS compute job which can be found via the 'importJob' link in the response.
        It can
            also be located in the 'importJobId' found in the customFields of the
        analysis data instance. The
            population of the Report Mart and table counts will also be performed
        asynchronously after
            the completion of the Compute job with any errors only writing to the
        pod log.
            There is no mechanism to monitor the Report Mart
            population using this response type.  It is important to note that even
        if the importJob is
            completed the Report Mart data load may still be in progress.

        - Synchronous Processing. If the request specifies a query parameter platformType=CAS
        the
          data will be imported synchronously.  When this option is used, the response
        will include the metadata
          of the created analysis data instance but will not include the import job
        information as the import job
          is not used in this scenario.

        - Input Data Options. The data to be imported can be provided in one of
        two ways:
          - The data may be included in the body of a multipart/form-data request
          - The data may be stored in a location indicated in the location query parameters.
            This data must be accessible from CAS, SPRE or SAS Folders. The locationType
        query
            parameter indicates the type of location being provided (Libref, Path,
        or Folder).
            The location query parameter provides the actual location of the data.
        The Filename
            query parameter provides the name of the file containing the data.

        - Session Usage. The CAS session, compute session, or compute context name
          query parameters can be used to specify the session or context in which
        the data
          will be imported.  If none of these parameters are provided, the system
        will
          create a temporary session to process the import in the default compute
        context configured
          for the Risk Data service.
      operationId: createAnalysisData
      parameters:
      - $ref: "#/components/parameters/locationTypeRead"
      - $ref: "#/components/parameters/locationRead"
      - $ref: "#/components/parameters/platformType"
      - $ref: "#/components/parameters/fileNameRead"
      - $ref: "#/components/parameters/casSessionId"
      - $ref: "#/components/parameters/computeSessionId"
      - $ref: "#/components/parameters/computeContextName"
      - name: updateReportMart
        in: query
        schema:
          type: boolean
        required: false
        description: If the data definition for the imported data defines a report
          mart, this parameter determines if the newly created analysis data will
          be registered as a member of the report mart. When true, the report will
          be updated to include the new data being imported. If the data definition
          is not a report mart, this parameter must not be used. The default is false.
      requestBody:
        description: The analysis data to be imported (when uploading text/csv, otherwise
          the data will be found at the location described by the query parameters)
          along with Cirrus metadata, ie, information about the data definition, analysis
          data, and associated data security rules.
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadData"
            examples:
              sample1:
                $ref: "#/components/examples/uploadDataEx1"
              sample2:
                $ref: "#/components/examples/uploadDataEx2"
              sample3:
                $ref: "#/components/examples/uploadData"
          application/vnd.sas.business.objects.analysis.data.instance+json:
            schema:
              $ref: "#/components/schemas/analysisData"
            examples:
              sample1:
                $ref: "#/components/examples/analysisDataEx1"
              sample2:
                $ref: "#/components/examples/analysisDataEx2"
              sample3:
                $ref: "#/components/examples/analysisData"
          application/json:
            schema:
              $ref: "#/components/schemas/analysisData"
            examples:
              sample1:
                $ref: "#/components/examples/analysisData"
              sample2:
                $ref: "#/components/examples/analysisDataEx1"
              sample3:
                $ref: "#/components/examples/analysisDataEx2"
      responses:
        "201":
          description: The request has been accepted, and the import process finished.
          headers:
            Content-Type:
              description: application/vnd.sas.business.objects.analysis.data.instance
              schema:
                type: string
            Location:
              description: The metadata used to import the data
              schema:
                type: string
          content:
            application/vnd.sas.business.objects.analysis.data.instance+json:
              schema:
                $ref: "#/components/schemas/analysisData"
              examples:
                json:
                  $ref: "#/components/examples/analysisDataResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/analysisData"
              examples:
                json:
                  $ref: "#/components/examples/analysisDataResponse"
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                importJobInitiated:
                  $ref: "#/components/examples/importJobInitiated"
                importJobSuccess:
                  $ref: "#/components/examples/importJobSuccess"
                importJobFailed:
                  $ref: "#/components/examples/importJobFailed"
                uploadJobInitiated:
                  $ref: "#/components/examples/uploadJobInitiated"
                uploadJobSuccess:
                  $ref: "#/components/examples/uploadJobSuccess"
                uploadJobFailed:
                  $ref: "#/components/examples/uploadJobFailed"
        "202":
          description: The request has been accepted, and the import process started.
          headers:
            Content-Type:
              description: application/vnd.sas.business.objects.analysis.data.instance
              schema:
                type: string
          content:
            application/vnd.sas.business.objects.analysis.data.instance+json:
              schema:
                $ref: "#/components/schemas/analysisData"
              examples:
                json:
                  $ref: "#/components/examples/analysisData"
            application/json:
              schema:
                $ref: "#/components/schemas/analysisData"
              examples:
                json:
                  $ref: "#/components/examples/analysisData"
        "400":
          description: An error has occurred
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
  /objects/{analysisId}:
    get:
      tags:
      - Data
      summary: Get information about analysis data
      description: Returns the data definition, analysis data instance and their data
        security rules from Cirrus Objects associated with the data stored under the
        given analysis ID.  The import of the data need not be complete; this function
        will check the status of the job and the existence of the data table and adjust
        the links appropriately.  It is an error to call this endpoint for an analysis
        data instance that was not previously imported.  If the analysis data has
        been archived the analysis data object contains links associated with associated
        archival runs.  When the analysis data object is in an archived state no modifications
        can be made to the object, the data for the analysis data object cannot be
        displayed, nor can the object be deleted.
      operationId: getAnalysisData
      parameters:
      - name: analysisId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: application/vnd.sas.business.objects.analysis.data.instance
              schema:
                type: string
            Location:
              description: The metadata used to import the data
              schema:
                type: string
          content:
            application/vnd.sas.business.objects.analysis.data.instance+json:
              schema:
                $ref: "#/components/schemas/analysisData"
              examples:
                json:
                  $ref: "#/components/examples/analysisDataResponse"
                importComplete:
                  $ref: "#/components/examples/analysisDataResponseImportComplete"
                archived:
                  $ref: "#/components/examples/analysisDataResponseArchived"
                restored:
                  $ref: "#/components/examples/analysisDataResponseRestored"
            application/json:
              schema:
                $ref: "#/components/schemas/analysisData"
              examples:
                json:
                  $ref: "#/components/examples/analysisDataResponse"
        "400":
          description: An error has occurred
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
    delete:
      tags:
      - Data
      summary: Delete analysis data
      description: Removes the imported data and the associated analysis data instance
        from Cirrus Objects service.
      operationId: deleteAnalysisData
      parameters:
      - name: analysisId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data.
      responses:
        "204":
          description: The request succeeded; nothing to return
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "409":
          description: An analysis data instance in an archived state cannot be deleted.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
  /objects/{analysisId}/archives:
    get:
      tags:
      - Data Archival
      summary: Get Listing of Archives for the analysis data
      description: Returns the listing of the archive objects applicable to this analysis
        data instance.  This service supports [paging](https://developer.sas.com/rest-apis/riskData-v2/docs/getting-started/usage-notes#pagination),
        [filtering](https://developer.sas.com/rest-apis/riskData-v2/docs/getting-started/usage-notes#filtering),
        and [sorting](https://developer.sas.com/rest-apis/riskData-v2/docs/getting-started/usage-notes#sorting).
      operationId: getAnalysisDataArchives
      parameters:
      - name: analysisId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data instance.
      - $ref: "#/components/parameters/pagingStart"
      - $ref: "#/components/parameters/pagingLimit"
      - $ref: "#/components/parameters/sortBy"
      - $ref: "#/components/parameters/filter"
      responses:
        "200":
          description: Ok
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analysisDataArchiveCollection"
              examples:
                json:
                  $ref: "#/components/examples/analysisDataArchiveCollection"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/analysisDataArchiveCollection"
              examples:
                json:
                  $ref: "#/components/examples/analysisDataArchiveCollection"
        "400":
          description: An error has occurred.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
    post:
      tags:
      - Data Archival
      summary: Create Archive from analysis data
      description: >
        Produces and invokes an analysis data archive job from the request.
        The archive job will create an archive object and write out to an
        external file the contents of the analysis data table associated with
        the analysis data instance.  If the deleteData flag is specified in the
        request the archive job will remove the analysis data records associated
        with this analysis data instance.  By default, the media type returned by
        the call is the archive job media type
        application/vnd.sas.business.objects.analysis.data.instance.archival.job+json
        however an accept media type of application/vnd.sas.job.execution.job
        can also be specified.

        The archive job returned contains a state field that can be monitored
        for completion and an associated log.  Restoring an archive can be done
        using the "restore" link from this archive job or in the links on the
        produced archive object.   Upon completion, the information regarding
        the produced archive will be included as part of the archive job object.

        Currently the supported archive destination must be a directory path
        reachable from the SPRE platform.  The filename of the archive is auto
        generated and will appear in the resulting archive.  The format of the
        generated archive is parquet.
      operationId: createAnalysisDataArchive
      parameters:
      - name: analysisId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data.
      requestBody:
        content:
          application/vnd.sas.business.objects.analysis.data.instance.archive.request:
            schema:
              $ref: "#/components/schemas/analysisDataArchiveRequest"
            examples:
              json:
                $ref: "#/components/examples/analysisDataArchiveRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/analysisDataArchiveRequest"
            examples:
              json:
                $ref: "#/components/examples/analysisDataArchiveRequest"
      responses:
        "202":
          description: The analysis data archive job was created. The analysis data
            archival has begun.
          headers:
            Location:
              description: For an accept type of application/vnd.sas.business.objects.analysis.data.instance
                .archival.job the location will be the URI of the archive job. For
                an accept type of application/vnd.sas.job.execution.job the location
                will return the URI to the corresponding job execution job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.business.objects.analysis.data.instance.archival.job+json:
              schema:
                $ref: "#/components/schemas/analysisDataArchiveRestoreJob"
              examples:
                archiveJob:
                  $ref: "#/components/examples/analysisDataArchiveRestoreJobRestore"
                restoreJob:
                  $ref: "#/components/examples/analysisDataArchiveRestoreJobArchive"
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                jesArchiveJob:
                  $ref: "#/components/examples/analysisDataArchiveJESJob"
                jesRestoreJob:
                  $ref: "#/components/examples/analysisDataRestoreJESJob"
            application/json:
              schema:
                $ref: "#/components/schemas/analysisDataArchiveRestoreJob"
              examples:
                archiveJob:
                  $ref: "#/components/examples/analysisDataArchiveRestoreJobRestore"
                restoreJob:
                  $ref: "#/components/examples/analysisDataArchiveRestoreJobArchive"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "403":
          description: User has no access to analysis data or is not permitted to
            archive the analysis data
        "404":
          description: No content was found for the specified identifier.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
  /objects/{analysisId}/archives/{archiveKey}:
    get:
      tags:
      - Data Archival
      summary: Get Archive Details
      description: Get an archive object applicable to this analysis data. The archive
        object describes where and when the data for this analysis data object was
        archived.
      operationId: getAnalysisDataArchive
      parameters:
      - name: analysisId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data.
      - name: archiveKey
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the archive data object.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: application/vnd.sas.business.objects.analysis.data.instance.archive
              schema:
                type: string
            Location:
              description: The archive information of the analysis data instance.
              schema:
                type: string
          content:
            application/vnd.sas.business.objects.analysis.data.instance.archive:
              schema:
                $ref: "#/components/schemas/analysisDataArchive"
              examples:
                json:
                  $ref: "#/components/examples/analysisDataArchive"
            application/json:
              schema:
                $ref: "#/components/schemas/analysisDataArchive"
              examples:
                json:
                  $ref: "#/components/examples/analysisDataArchive"
        "400":
          description: An error has occurred.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "404":
          description: No content was found for the specified identifier.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
    delete:
      tags:
      - Data Archival
      summary: Delete Archive
      description: The archive object will be deleted.  This action does not delete
        the associated external file which was produced by the archive.  This delete
        will remove the archive and the associated archive job.  The archive cannot
        be deleted if the associated analysis data instance is in an archived state
        and references this archive object. A delete is also rejected if the archive
        is referenced by an archival restore job which is in use by the analysis data
        instance If an archive with associated archival restore jobs is to be deleted
        the option deleteResources=true must be supplied in the query parameters.
        The deleteResource will delete the archive object, the archive job and any
        associated restore jobs.
      operationId: deleteAnalysisDataArchive
      parameters:
      - name: analysisId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data.
      - name: archiveKey
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the archive data object.
      responses:
        "204":
          description: The request succeeded; nothing to return
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
    post:
      tags:
      - Data Archival
      summary: Restore analysis data from an Archive
      description: Produces and invokes a restore archival job.  The restore archival
        job will read the external archive file and insert the contents into the analysis
        data table associated with the analysis data instance. The restore archival
        job can be monitored for run status to monitor for completion. The request
        will return by default the restore archival job media type, application/vnd.sas.business.objects
        .analysis.data.instance.restore.request, however an accept type of application/vnd.sas.job.execution.job
        can also be specified.  If the analysis data table associated with the analysis
        data instance contains data the restore will fail unless the dataConflictStrategy
        field of the request is set to fullTableReplace.  If an analysis data instance
        has been archived and restored multiple times the restore can take place against
        an archive prior to the latest archive however the request must set the allowPreviousArchiveRestore
        to true.
      operationId: createAnalysisDataRestoreArchivalJob
      parameters:
      - name: analysisId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data.
      - name: archiveKey
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data archive.
      requestBody:
        content:
          application/vnd.sas.business.objects.analysis.data.instance.restore.request:
            schema:
              $ref: "#/components/schemas/analysisDataRestoreRequest"
            examples:
              json:
                $ref: "#/components/examples/analysisDataRestoreRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/analysisDataRestoreRequest"
            examples:
              json:
                $ref: "#/components/examples/analysisDataRestoreRequest"
      responses:
        "201":
          description: The analysis data restore archival job was created. The analysis
            data restore has begun.
          headers:
            Location:
              description: For an accept type of application/vnd.sas.business.objects.analysis.data.instance
                .archival.job the location will be the URI of the archive job. For
                an accept type of application/vnd.sas.job.execution.job the location
                will return the URI to the corresponding job execution job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.business.objects.analysis.data.instance.archival.job+json:
              schema:
                $ref: "#/components/schemas/analysisDataArchiveRestoreJob"
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
            application/json:
              schema:
                $ref: "#/components/schemas/analysisDataArchiveRestoreJob"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "403":
          description: User has no access to analysis data or is not permitted to
            restore the analysis data
        "404":
          description: No content was found for the specified identifier.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "409":
          description: The analysis data instance must be in an archived state.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "415":
          description: Unsupported Media Type.
        "500":
          description: Server Error
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
  /objects/{analysisId}/archivalJobs:
    get:
      tags:
      - Data Archival
      summary: Get Listing of Archival Jobs for the analysis data
      description: Returns the listing of the archival jobs applicable to this analysis
        data instance.  This service supports [paging](https://developer.sas.com/rest-apis/riskData-v2/docs/getting-started/usage-notes#pagination),
        [filtering](https://developer.sas.com/rest-apis/riskData-v2/docs/getting-started/usage-notes#filtering),
        and [sorting](https://developer.sas.com/rest-apis/riskData-v2/docs/getting-started/usage-notes#sorting).
      operationId: getAnalysisDataArchivalJobs
      parameters:
      - name: analysisId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data.
      - $ref: "#/components/parameters/pagingStart"
      - $ref: "#/components/parameters/pagingLimit"
      - $ref: "#/components/parameters/sortBy"
      - $ref: "#/components/parameters/filter"
      responses:
        "200":
          description: Ok
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analysisDataArchiveRestoreJobCollection"
              examples:
                json:
                  $ref: "#/components/examples/analysisDataArchiveRestoreJobCollection"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/analysisDataArchiveRestoreJobCollection"
              examples:
                json:
                  $ref: "#/components/examples/analysisDataArchiveRestoreJobCollection"
        "400":
          description: An error has occurred.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
  /objects/{analysisId}/archivalJobs/{jobKey}:
    get:
      tags:
      - Data Archival
      summary: Get Archival Job
      description: Returns the details for this archival job.  An archival job is
        used to invoke either a restore or archive of the analysis data table associated
        with an analysis data instance. The archival job will contain the state of
        the job, the archive which the job used and the log file describing the archival
        job progress.
