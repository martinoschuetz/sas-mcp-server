      summary: Export analysis data
      description: Exports the analysis data table to a given location.  The request
        type will determine if the export is done synchronous or asynchronous via
        the Job Execution Service.
      operationId: exportData
      parameters:
      - name: Accept
        in: header
        required: false
        description: Specifies the desired export action and returned information.
          If no value is provided the default behavior will be synchronous and the
          returned object will be application/vnd.sas.business.objects.analysis.data.export.report+json.
          If the media-type application/vnd.sas.job.execution.job+json is indicated
          then the export will be performed in an asynchronous manner via the Job
          Execution Service.  In such a case the Job Execution Service object will
          be returned.
        schema:
          type: string
          enum:
          - application/vnd.sas.business.objects.analysis.data.export.report+json
          - application/json
          - application/vnd.sas.job.execution.job+json
      - name: analysisId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data.
      - $ref: "#/components/parameters/dataMapKey"
      - $ref: "#/components/parameters/locationTypeWrite"
      - $ref: "#/components/parameters/locationWrite"
      - $ref: "#/components/parameters/platformType"
      - $ref: "#/components/parameters/fileNameWrite"
      - $ref: "#/components/parameters/scope"
      - $ref: "#/components/parameters/save"
      - $ref: "#/components/parameters/replace"
      - $ref: "#/components/parameters/casSessionId"
      - $ref: "#/components/parameters/computeSessionId"
      - $ref: "#/components/parameters/computeContextName"
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/exportSortBy"
      - $ref: "#/components/parameters/fields"
      - $ref: "#/components/parameters/exportFormat"
      - $ref: "#/components/parameters/useOriginalColumns"
      responses:
        "200":
          description: The request succeeded. The data has been exported and a report
            is returned describing the location.
          headers:
            Content-Type:
              description: Return type based on the requested Content-Type. Defaults
                to application/vnd.sas.business.objects.analysis.data.export.report+json
              schema:
                type: string
          content:
            application/vnd.sas.business.objects.analysis.data.export.report+json:
              schema:
                $ref: "#/components/schemas/exportReport"
              examples:
                json:
                  $ref: "#/components/examples/exportReport"
            application/json:
              schema:
                $ref: "#/components/schemas/exportReport"
              examples:
                json:
                  $ref: "#/components/examples/exportReport"
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                exportJobInitiated:
                  $ref: "#/components/examples/exportJobInitiated"
                exportJobSuccess:
                  $ref: "#/components/examples/exportJobSuccess"
                exportJobFailed:
                  $ref: "#/components/examples/exportJobFailed"
        "400":
          description: An error has occurred.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "404":
          description: No content was found for the specified identifier.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "409":
          description: The data cannot be retrieved when an analysis data instance
            is in an archived state.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
  /objects/export:
    post:
      tags:
      - Data
      summary: Export analysis data in bulk
      description: "Allows the user to specify multiple analysis data tables to be\
        \ exported in a single request. Each item in the request body specifies the\
        \ unique identifier for the analysis data and the export location. The fields\
        \ allowed in the item contents are the same as those query parameters supported\
        \ by the single export endpoint GET /objects/{analysisId}/export.  The response\
        \ media type will determine if the export is done synchronous or asynchronous\
        \ via the Job Execution Service.\n\nIn event that simple validation of any\
        \ item in the request body fails, no exports will be attempted and a 400 error\
        \ will be returned.  If the response media type specified is a application/vnd.sas.business.objects.analysis.data.export.bulk.report+json,\
        \ then the response body will be the collection of items which failed (not\
        \ the entire list).  If the response media type specified is application/vnd.sas.job.execution.job+json,\
        \ then the object returned will be a vnd.sas.error and the details will contain\
        \ the list of items which failed validation.\n\nUpon successful validation\
        \ the export request will be processed. When the response media type is application/vnd.sas.business.objects.analysis.data.export.bulk.report+json,\
        \ the response body will contain all attempted exports with details on success\
        \ or failure of each.  Even in event of failures the response type at this\
        \ point will be 200.\n\nIf an option is supplied as a query parameter that\
        \ option will be applied as a default to all items in the request body. For\
        \ example, if the query parameter \"locationType=libname\" is supplied, then\
        \ all exports in the request body which do not have locationType set will\
        \ use \"libname\" as the locationType.  If an item in the request body has\
        \ a value for a field that is also supplied as a query parameter, the value\
        \ in the request body will take precedence over the query parameter value\
        \ for that item.\n\nIn the event that a default CAS or Compute session is\
        \ not supplied via the query parameters a single session will be created and\
        \ all exports will be performed sequentially in that session.  If no default\
        \ sessions is specified and the query parameter \"concurrentSessions\" is\
        \ specified, the API will create up to the specified number of sessions and\
        \ distribute the exports across those sessions to be performed in parallel.\
        \ The API will attempt to reuse sessions when possible, so the number of sessions\
        \ created will not necessarily equal the number specified in this parameter."
      operationId: exportBulkData
      parameters:
      - name: Accept
        in: header
        required: false
        description: Specifies the desired export action and returned information.
          If no value is provided the default behavior will be synchronous and the
          returned object will be application/vnd.sas.business.objects.analysis.data.export.bulk.report+json.
          If the media-type application/vnd.sas.job.execution.job+json is indicated
          then the export will be performed in an asynchronous manner via the Job
          Execution Service.  In such a case the Job Execution Service object will
          be returned.  Upon completion of the job the results of the export can be
          pulled from the job results field "collectionResult".
        schema:
          type: string
          enum:
          - application/vnd.sas.business.objects.analysis.data.export.bulk.report+json
          - application/json
          - application/vnd.sas.job.execution.job+json
      - name: analysisDataKey
        in: query
        schema:
          type: string
        required: false
        description: The unique identifier for the analysis data object.
      - $ref: "#/components/parameters/dataMapKey"
      - $ref: "#/components/parameters/locationTypeWriteOptional"
      - $ref: "#/components/parameters/locationWriteOptional"
      - $ref: "#/components/parameters/platformTypeBulkActions"
      - $ref: "#/components/parameters/scope"
      - $ref: "#/components/parameters/save"
      - $ref: "#/components/parameters/replace"
      - $ref: "#/components/parameters/casSessionId"
      - $ref: "#/components/parameters/computeSessionId"
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/exportSortBy"
      - $ref: "#/components/parameters/fields"
      - $ref: "#/components/parameters/exportFormat"
      - $ref: "#/components/parameters/useOriginalColumns"
      - $ref: "#/components/parameters/concurrentSessions"
      - name: includeCounts
        in: query
        schema:
          type: boolean
        required: false
        description: Includes within the response of each item the number of records
          exported and the number of associated columns.  This option is only supported
          for platformType CAS and will be ignored for other platform types.
      requestBody:
        description: The listing of items to be exported. The contents identify the
          analysis data to be exported and the location to which it should be exported.  The
          allowed fields in the item contents are the same as the query parameters
          for the single export endpoint GET /objects/{analysisId}/export.
        required: true
        content:
          application/vnd.sas.business.objects.analysis.data.export.bulk.request+json:
            schema:
              $ref: "#/components/schemas/exportBulkRequest"
            examples:
              json:
                $ref: "#/components/examples/exportBulkRequestExample"
          application/json:
            schema:
              $ref: "#/components/schemas/exportBulkRequest"
            examples:
              json:
                $ref: "#/components/examples/exportBulkRequestExample"
      responses:
        "200":
          description: The request succeeded. The data has been exported and a report
            is returned describing the location.
          headers:
            Content-Type:
              description: Return type based on the requested Content-Type. Defaults
                to application/vnd.sas.business.objects.analysis.data.export.bulk.report+json
                . The example for the vnd.sas.job.execution is what the job will look
                like when it has completed running.
              schema:
                type: string
          content:
            application/vnd.sas.business.objects.analysis.data.export.bulk.report+json:
              schema:
                $ref: "#/components/schemas/exportBulkResult"
              examples:
                json:
                  $ref: "#/components/examples/exportBulkResultExampleWithError"
            application/json:
              schema:
                $ref: "#/components/schemas/exportBulkResult"
              examples:
                json:
                  $ref: "#/components/examples/exportBulkResultExampleWithError"
        "202":
          description: The request to export the analysis data in bulk was accepted
            and a JES job was created to process the request.  The JES job results
            will contain a field of "collectionResult" which will contain the export
            report for the action.
          headers:
            Location:
              description: The URI of the create Job Execution Service job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/exportBulkJobWithError"
        "400":
          description: An error has occurred.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
            application/vnd.sas.business.objects.analysis.data.export.bulk.report+json:
              schema:
                $ref: "#/components/schemas/exportBulkResult"
              examples:
                json:
                  $ref: "#/components/examples/exportBulkResultExampleWithError"
