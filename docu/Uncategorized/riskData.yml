  /reportMart/{definitionId}:
    get:
      tags:
      - ReportMart
      summary: Get Report Mart
      description: Returns metadata about a report mart in json form.
      operationId: getReportMart
      parameters:
      - name: definitionId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the report mart.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: application/vnd.sas.business.objects.report.mart
              schema:
                type: string
            Location:
              description: The data definition and current contents of the report
                mart
              schema:
                type: string
          content:
            application/vnd.sas.business.objects.analysis.data.instance+json:
              schema:
                $ref: "#/components/schemas/reportMart"
              examples:
                json:
                  $ref: "#/components/examples/reportMart"
            application/json:
              schema:
                $ref: "#/components/schemas/reportMart"
              examples:
                json:
                  $ref: "#/components/examples/reportMart"
        "400":
          description: An error has occurred
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
    patch:
      tags:
      - ReportMart
      summary: Update Report Mart
      description: Updates the contents of a report mart, adding or removing analysis
        data instances.
      operationId: patchReportMart
      parameters:
      - name: definitionId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the report mart.
      - name: If-Unmodified-Since
        in: header
        schema:
          type: string
        description: The timestamp obtained from the most recent `Last-Modified` response
          header. Must match the timestamp when the report mart was last modified.
      - name: If-Match
        in: header
        schema:
          type: string
        description: The value obtained from the most recent `Etag` response header.
          Must match the value when the report mart was last modified.
      requestBody:
        content:
          application/json-patch:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/reportMartPatch"
            examples:
              json:
                $ref: "#/components/examples/reportMartPatch"
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/reportMartPatch"
            examples:
              json:
                $ref: "#/components/examples/reportMartPatch"
        description: A JSON document of the JSON Patch operations.
      responses:
        "200":
          description: The entries are successfully patched.
          headers:
            ETag:
              description: A tag that identifies the report mart.
              schema:
                type: string
          content:
            application/vnd.sas.business.objects.analysis.data.instance+json:
              schema:
                $ref: "#/components/schemas/reportMart"
              examples:
                json:
                  $ref: "#/components/examples/reportMart"
            application/json:
              schema:
                $ref: "#/components/schemas/reportMart"
              examples:
                json:
                  $ref: "#/components/examples/reportMart"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "412":
          description: The etag value used in the If-Match header did not match the
            resource's last modified timestamp. The resource has changed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "409":
          description: The data cannot be retrieved when an analysis data instance
            is in an archived state.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "428":
          description: The `If-Match` request header did not match the resource's
            entity tag.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
