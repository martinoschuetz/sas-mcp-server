      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              type: string
              description: Distinct values.
    csvData:
      title: Analysis data contents as csv
      description: Data from an imported analysis data table in csv format.  The specific
        columns are determined by the Cirrus data definition of the analysis data.
    dataCollection:
      title: Analysis data contents as collection
      description: Contents of an analysis data as a collection.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              type: object
              description: Each item represents a row of data
    dataRowSet:
      title: Analysis data contents as row set JSON
      description: Contents of an analysis data
      properties:
        count:
          type: integer
          description: The total number of rows in the data.
        columnCount:
          type: integer
          description: The number of columns in the data.
        columns:
          type: array
          description: Metadata about the columns of the data.
          items:
            type: object
        rows:
          type: array
          description: An array of objects containing arrays of heterogeneous data
            from the table associated with the analysis data.
          items:
            type: object
            properties:
              version:
                type: integer
                format: int32
                description: The version number of the row representation. This representation
                  is version 2.
              cells:
                description: An array of mixed types of data from one row of the analysis
                  data table.
                type: array
                items: {}
        version:
          type: integer
          format: int32
          description: The version number of the row set representation. This representation
            is version 2.
    deleteDataReport:
      title: Analysis data contents delete report
      description: Information about delete records of analysis data
      properties:
        analysisDataKey:
          type: string
          description: The unique identifier for the analysis data.
        analysisDataNm:
          type: string
          description: The name for the analysis data.
        analysisDataSSC:
          type: string
          description: The analysis Source System Code.
        analysisDataCreatedInTag:
          type: string
          description: Solution CreatedIn tag for the analysis data.
        rowsBeforeDelete:
          type: integer
          format: int64
          description: Number of rows before delete operation performed.
        rowsImpacted:
          type: integer
          format: int64
          description: Number of rows deleted.
        rowsAfterDelete:
          type: integer
          format: int64
          description: Number of rows remaining after delete operation.
        deletedDataBy:
          type: string
          description: User performed the operation
        filterApplied:
          type: string
          description: Filter SQL expression.
        version:
          type: integer
          format: int32
          description: The version number of the representation. This representation
            is version 1.
    appendDataReport:
      title: Analysis data contents append report
      description: Information about appending records of analysis data
      properties:
        analysisDataKey:
          type: string
          description: The unique identifier for the analysis data.
        analysisDataNm:
          type: string
          description: The name for the analysis data.
        analysisDataSSC:
          type: string
          description: The analysis Source System Code.
        analysisDataCreatedInTag:
          type: string
          description: Solution CreatedIn tag for the analysis data.
        appendDataBy:
          type: string
          description: User performed the operation
        appendJobID:
          type: string
          description: SAS Job Execution Service Job ID.
        appendJobURI:
