    exportReport:
      title: Analysis data contents export report
      description: Information about an export of analysis data
      allOf:
      - $ref: "#/components/schemas/sessionInfo"
      - $ref: "#/components/schemas/dataLocationWrite"
      properties:
        analysisDataKey:
          type: string
          description: The unique identifier for the analysis data.
        exportedBy:
          type: string
          description: the id of the user that requested the export
        exportTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the export was performed
        version:
          type: integer
          format: int32
          description: The version number of the representation. This representation
            is version 2.
    exportBulkItem:
      title: Analysis data contents export bulk item
      description: The common fields of an item in the bulk export request and an
        item in the bulk export response.
      type: object
      allOf:
      - $ref: "#/components/schemas/sessionInfo"
      - $ref: "#/components/schemas/dataLocationWrite"
      properties:
        analysisDataKey:
          type: string
          description: The unique identifier for the analysis data.
        dataMapKey:
          type: string
          description: The unique identifier for the data map.
        fields:
          type: string
          description: A comma-separated list of names of fields to be included in
            a response.  If omitted, all available fields will be included.
        filter:
          type: string
          description: The criteria for filtering the items in a collection. See [SAS
            REST APIs&colon; Filtering](https://developer.sas.com/rest-apis/riskData-v1/docs/getting-started/usage-notes#filtering).
        sortBy:
          type: string
          description: The criteria for sorting the items in a collection. See [SAS
            REST APIs&colon; Sorting](https://developer.sas.com/rest-apis/riskData-v1/docs/getting-started/usage-notes#sorting).
        scope:
          type: string
          enum:
          - GLOBAL
          - SESSION
          description: When GLOBAL, a CAS table created by the export process will
            be promoted to global scope, making it visible to all users and processes.  When
            SESSION, a CAS table created will be constrained to the session that creates
            the table.  The default is SESSION except when exporting to a directory
            or folder.  When exporting to a library, the default is GLOBAL unless
            a sessionID is specified in which case the default is SESSION.
        save:
          type: boolean
          description: When true, a CAS table created by the export process will be
            saved to its caslib's permanent storage as well as remaining loaded into
            memory. allowing the table to survive server restarts.
        replace:
          type: boolean
          description: When true, existing resources will be overwritten by an export
            request if there a file or table with the given name already exists.  When
            false, an error will result if a resource with the given name already
            exists.  The default is false.
        useOriginalColumns:
          type: boolean
          description: A true value indicates that the columns returned should only
            be those that were present at the time the analysis data object was created.
            New columns can be added to the analysis data table post creation via
            a column schema revision of the associated data definition. Such a change
            will be applied to the analysis data table ensuring the columns in the
            table match the data definition columns. To see the original columns of
            the analysis data object, set this parameter to true.  The default is
            false.
        schemaRevision:
          type: string
          description: The column schema revision number to use as the max revision
            for the returned columns. If not specified, the current revision is used.  The
            value of 'latest' can also be used to indicate the columns currently recognized
            as part of the data definition. The value of 'original' can be used to
            indicate the columns that were part of the data definition when it was
            first processed. The default value is 'latest'.
        format:
          type: boolean
          description: Specifies whether to apply the SAS formats to the data in the
            cells. Please note that this option is not supported for a location which
            refers to a CAS location.
    exportBulkResultItem:
      title: Analysis data contents export bulk result item
      description: The item contents in the bulk export response.
      type: object
      allOf:
      - $ref: "#/components/schemas/exportBulkItem"
      properties:
        itemIndex:
          type: integer
          format: int32
          description: The index of the item in the bulk export response.  It is the
            location of the item in the array of items provided in the bulk export
            request.
        exportTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the bulk export was performed for this item.
        rowCount:
          type: integer
          format: int64
          description: The number of rows exported for this item.  Query parameter
            includeCounts must be set for this to populate.
        columnCount:
          type: integer
          format: int64
          description: The number of columns exported for this item.  Query parameter
            includeCounts must be set for this to populate.
        state:
          type: string
          description: The state of the export for this item.
          enum:
          - completed
          - failed
        error:
          $ref: "#/components/schemas/error2"
    exportBulkRequest:
      title: Analysis data contents bulk export request
      description: A bulk export request containing an array of items to be exported.  Each
        item contains the details of what to export and how to export it.
      type: object
      properties:
        items:
          type: array
          description: The array of items to be exported.  Each item contains the
            details of what to export and how to export it.
          items:
            $ref: "#/components/schemas/exportBulkItem"
    exportBulkResult:
      title: Analysis data contents bulk export response
      description: A bulk export response containing an array of results for each
        item in the bulk export request.  Each result contains the details about the
        result of an attempt to export a specific item.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/exportBulkResultItem"
          errorCount:
            type: integer
            format: int32
            description: The number of items in the bulk export request that resulted
              in an error during export.
          exportedBy:
            type: string
            description: the id of the user that requested the bulk export
          exportTimeStamp:
            type: string
            format: ISO-8601
            description: the date and time the bulk export was performed
    reportMart:
      title: Report Mart object
      description: The data definition and list of analysis data instances that are
        currently registered in the report mart
      type: object
      properties:
        dataDefinition:
          $ref: "#/components/schemas/dataDefinition"
        analysisData:
          description: The list of the current members of the report mart.
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: This is key of analysis data instance. Optional if objectId
                  is provided.
              objectId:
                type: string
                description: Analysis data objectId. sourceSystemCd and objectId make
                  unique combination.
              sourceSystemCd:
                type: string
                description: Source system code
              name:
                type: string
                description: Analysis data name
              createdInTag:
                type: string
                description: The solution that was used to create this analysis data
                  instance.
              sharedWithTags:
                description: An array of string values containing solutions that this
                  analysis data instance should be shared with.
              customFields:
                type: object
                properties:
                  indexList:
                    type: string
                    description: Comma seperated list of indexes you want to add to
                      dataset(Overrides defaultIndexList:). Columns within index is
                      expected to be space separated. Example two indexes - "col1
                      col2,col3"
                  strategyType:
                    type: string
                    description: Following are the values you can use - BYVARS - Partition
                      count is detected from distinct combination  of columns set
                      with partitionFlag(in dataDefinition.customFields.columnInfo
                      array) to true. ROWS - Partition count is detected based on
                      number of rows. If this is set we also need value for parameter
                      rowsPerPartition. FIXED - Partition count is detected based
                      on parameter partitionCount value. NONE - No partition required.
                  rowsPerPartition:
                    type: integer
                    description: Number of rows per partition. Required only when
                      strategyType is set to ROWS.
                  partitionCount:
                    type: integer
                    description: Number of fixed partitions. Required only when strategyType
                      is set to FIXED.
        createdBy:
          type: string
          description: the userid of the creator of a report mart.
        creationTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the report mart was created.
        modifiedBy:
          type: string
          description: the userid of the last user to update a report mart.
        modifiedTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the report mart was last updated.
        mediaTypeVersion:
          type: integer
          format: int32
          description: The version number of the row set representation. This representation
            is version 1.
        links:
          type: array
          description: The links that apply to the report mart.
          items:
            $ref: "#/components/schemas/link"
    reportMartPatch:
      title: Report Mart patch
      description: A collection of patch operations to update the members of a report
        mart.
      properties:
        op:
          type: string
          description: The operation to carry out; only add and remove are supported.
        path:
          type: string
          description: the json path to the object to add or remove.  For an add operation,
            this must be '/analysisData/'.  For a remove operation, this must be the
            path to remove, which will be '/analysisData/[key]' where key is the key
            of the analysis data instance to be removed from the report mart.
        value:
          type: string
          description: The item to add to the report mart (not used for a remove operation).
            This will be the key of the analysis data instance to add to the report
            mart.
    uploadData:
      title: Analysis data upload request
      description: A multipart form containing analysis data and associated Cirrus
        metadata
      properties:
        file:
          title: Uploaded data in text/csv form
          type: string
          description: One file is required, which must be a text/csv file containing
            the data to be stored by the request.  The Cirrus metatdata can optionally
            be posted as a json file containing a single application/vnd.sas.business.objects.analysis.data.instance+json
            object, in which case, the other properties of the form are not used.
        dataDefinition:
          title: A Cirrus data definition object.
          type: object
          description: A reference (by key, objectId/sourceSystemCd, or schemaName/schemaVersion)
            to an existing Cirrus data definition or a new data definition to be created.
        dataDefinitionRules:
          title: A Cirrus data security rules object.
          type: object
          description: A reference (by key or objectId/sourceSystemCd) to an existing
            Cirrus security rules object or a new object to be created.  This property
            is only supported when a new data definition is being created; it is an
            error to use it otherwise.
        analysisData:
          title: A Cirrus analysis data object.
          type: object
          description: A reference (by key or objectId/sourceSystemCd) to an existing
            Cirrus analysis data instance or a new instance to be created.  If this
            property is omitted, then an analysis data instance with default values
            will be created.
        analysisDataRules:
          title: A Cirrus data security rules object.
          type: object
          description: A reference (by key or objectId/sourceSystemCd) to an existing
            Cirrus security rules object or a new object to be created.  This property
            is only supported when a new analysis data instance is being created;
            it is an error to use it otherwise.
    summarizeData:
      title: Analysis data summarization request
      type: array
      description: Each item in the payload request provides aggregation details for
        individual variables/column or expressions.
      items:
        type: object
        properties:
          variableName:
            type: string
            description: The name of the column from the data definition.
          expression:
            type: string
            description: The expression would be enclosed within the aggregationMethod.
              Allowed functions in the expression include distinct, coalesce, greatest,
              and least. Words in the expression must correspond to columns in the
              data definition, and semicolons are prohibited.
          aggregationMethod:
            type: string
            description: Aggregation method(e.g., 'sum', 'avg', 'min', etc.) you want
              to apply
          targetVariableName:
            type: string
            description: The result variable contains the summarized values.
        required:
        - aggregationMethod
        - targetVariableName
    summarizeAnalysisData:
      title: Analysis data summarization and filter request
      description: controls the aggregation of the requested data, allows for filters
        both before and after the grouping of data for summarization purposes
      properties:
        preAggregationFilter:
          type: string
          description: Filter to apply before aggregation. It is like SQL where clause
            without where statement.  The ability to include a subquery is supported.  If
            the subquery references an analysis data table such as  'type in (select
            types from analysis_data_table_here)' the caller does not need to know
            the physical table name.  Instead, an alias syntax is available for the
            caller to use in the subquery.  The alias is used in conjunction with
            an analysis data object key.  The summarization method will resolve the
            alias to the corresponding data table for that analysis data object and
            replace the alias with the correct table name before executing the subquery.
            The alias syntax is  <ANALYSIS_DATAkey='uuid_of_analysis_data_instance'/>.  The
            structure of the previous subquery would be 'type in (select types from
            <ANALYSIS_DATAkey='uuid_of_analysis_data_instance'/> )'. The alias can
            be used in the preAggregationFilter and postAggregationFilter for the
            summarization actions.
          example: "type > 'SUV' and cylinder > 4"
        items:
          type: array
          description: Array of items describing aggregation payload.
          items:
            type: object
            properties:
              varName:
                type: string
                description: Column name from analysis data table imported. Some special
                  fields supported from Cirrus analysis data object are \_rdSrcInstID\_
                  (key), key, objectId, description, name, createdInTag, sharedWithTag,
                  createdBy and modifiedBy. Aliases are not supported for these special
                  fields, and they must have a varScope set to "GROUP_BY".
                example: "msrp"
              varScope:
                type: string
                description: The supported aggregate functions are MEAN, MIN, MAX,
                  SUM, WSUM, COUNT, DCOUNT, STDDEV, and VARIANCE. To group by specific
                  columns, set to "GROUP_BY".
                example: "SUM"
              weightVar:
                type: string
                description: Column name from analysis data table imported, var will
                  be multiplied as a weight during aggregation. It will translate
                  like SUM(msrp*engine_size).
                example: "engine_size"
              alias:
                type: string
                description: Alias name for aggregated column. It will translate like
                  "SUM(msrp*engine_size) as total_msrp".
                example: "total_msrp"
        postAggregationFilter:
          type: string
          description: Filter to apply after aggregation. It is like SQL Having clause.
            The ability to include a subquery is supported.  If the subquery references
            an analysis data table such as  'type in (select types from analysis_data_table_here)'
            the caller does not need to know the physical table name.  Instead, an
            alias syntax is available for the caller to use in the subquery.  The
            alias is used in conjunction with an analysis data object key.  The summarization
            method will resolve the alias to the corresponding data table for that
            analysis data object and replace the alias with the correct table name
            before executing the subquery. The alias syntax is  <ANALYSIS_DATAkey='uuid_of_analysis_data_instance'/>.  The
            structure of the previous subquery would be 'type in (select types from
            <ANALYSIS_DATAkey='uuid_of_analysis_data_instance'/> )'. The alias can
            be used in the preAggregationFilter and postAggregationFilter for the
            summarization actions.
          example: "total_msrp > 10000.0"
    summarizeJsonCollection:
      title: Analysis data summarization result collection
      description: Information about summarize JSON collection results.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              type: object
              description: Each item represents an aggregate result derived from a
                'group by' operation.
    columnInformation:
      title: Column information
      description: The attributes of a column as defined in the Data Definition cirrus
        object.
      type: object
      properties:
        name:
          type: string
          description: Name of the column.
        label:
          type: string
          description: Label of the column.
        type:
          type: string
          description: The column data type.  The type field contains values of the
            basic SAS Data Types. These values are varchar, number, int, date, datetime,
            time, boolean .   There are additional values which are treated as aliases
            to the basic SAS types.
        size:
          type: integer
        format:
          type: string
          description: A SAS format. Risk Data passes the format onto CAS and Data
            Step.  Validation of the format is done by CAS and Data Step at the time
            an action is executed.
        informat:
          type: string
        uiKey:
          type: string
        primaryKeyFlag:
          type: boolean
          description: Denotes the column is included in the primary keys.
        partitionFlag:
          type: boolean
          description: Denotes the column is included in data partitioning.
        mandatoryFlag:
          type: boolean
          description: The column must exist in the input data source at the time
            of the Analysis Data object via an import action.  The mandatoryFlag allows
            the import to be used with input data which does not contain all the columns
            in the Data Definition.  For an import action, columns with a mandatoryFlag
            set to false do not need to exist in the input data source.
        filterable:
          type: boolean
        measureFlag:
          type: boolean
        exposureFlag:
          type: boolean
        attributable:
          type: boolean
        segmentationFlag:
          type: boolean
        projectionFlag:
          type: boolean
        classification:
          type: boolean
        configReadOnly:
          type: string
        allocation:
          type: boolean
        schemaRevision:
          type: integer
          description: The column schema revision number when this column was added
            to the data definition. This field is only populated for columns that
            were added after the initial creation of the data definition.
    columnSchemaRevisionSummary:
      title: Data Definition Column Schema Revision Summary
      description: The data definition column schema revision attributes.  The summary
        does not contain the list of columns impacted by this revision.  The columnSchemaRevisionDetails
        contains that information.
      type: object
      properties:
        schemaRevision:
          type: integer
          description: The revision number for this column schema revision.
        revisionType:
          type: string
          description: The type of the column schema revision.
          enum:
          - ADD_COLUMNS
          - REVERT_COLUMNS
        creationTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the column schema revision was created
        jobID:
          type: string
          description: The associated job ID for the column schema revision action
            if the revision was executed using the job execution media type.
        reverted:
          type: boolean
          description: Indicates that this column schema revision has been reverted.
        associatedSchemaRevision:
          type: integer
          description: If the column schema revision is of type REVERT_COLUMNS this
            field will contain the schemaRevision of the corresponding revision of
            type ADD_COLUMNS.
    columnSchemaRevisionDetails:
      title: Data Definition Column Schema Revision Details
      description: The data definition column schema revision attributes and a list
        of the columns impacted by this revision.
      allOf:
      - $ref: "#/components/schemas/columnSchemaRevisionSummary"
      - type: object
      properties:
        columnInfo:
          type: array
          description: The list of columns impacted by this column schema revision.
          items:
            $ref: "#/components/schemas/columnInformation"
    columnSchemaRevisionCreateRequest:
      title: Data Definition Column Schema Revision Create Request
      description: The request object to add columns to a data definition via a column
        schema revision.
      type: object
      properties:
        columnInfo:
          type: array
          description: The list of columns impacted by this column schema revision.
          items:
            $ref: "#/components/schemas/columnInformation"
    columnSchemaRevisionRevertRequest:
      title: Data Definition Column Schema Revision Revert Request
      description: The request object to revert an existing column schema revision.
      type: object
      properties:
        revertSchemaRevision:
          type: integer
          description: The column schema revision number to revert.
    columnInformationCollection:
      # This collection is used by both the dataDefinition and analysisData end points
      title: Column information collection
      description: A collection of column information objects. If the action which
        produces the collection specifies the media type application/vnd.sas.business.objects.data.definition.column.collection+json
        and is related to a specific data definition column schema revision, then
        the revision field will be populated with information about that column schema
        revision.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/columnInformation"
          revision:
            $ref: "#/components/schemas/columnSchemaRevisionSummary"
    dataLocationWrite:
      title: Data Location
      description: The location where data is to be written.
      type: object
      properties:
        platformType:
          type: string
          description: Indicates the platform, CAS or SPRE, where a library or file
            system directory resides. If this is not provided, a lookup will be done
            first against the CAS platform and then against the SPRE platform. The
            acceptable values are  SPRE, CAS or sasFolder for a single export. For
            bulk export the acceptable values are SPRE and CAS.
          enum:
          - SPRE
          - CAS
          - SASFOLDER
        locationType:
          type: string
          description: The type of server location to which the data will be written
            or has been written. For bulk export only the values of DIRECTORY and
            LIBNAME are supported.
          enum:
          - DIRECTORY
          - LIBNAME
          - FOLDER
        location:
          type: string
          description: The server location to which data will be written or has been
            written.  Interpretation of this parameter varies based on the value of
            locationType.  When locationType is DIRECTORY, the value must contain
            the file system path on the server where the data will be written.  When
            locationType is LIBNAME, the value must contain the name of the library
            in which the data will be written. When locationType is FOLDER, the value
            must contain the display path or ID of a folder.
        fileName:
          type: string
          description: name of the File or Table to which data will be written or
            has been written. When writing to a library, the extension should be omitted;
            when writing to a directory or folder, an extension should be included.
            When writing to a folder, the supported file types are comma separated
            value (.csv) files, zipped comma separated value files (.csv.zip) and
            gzip comma separated value (.csv.gz). When writing to a SPRE directory,
            the supported file types are SAS datasets ( .sas7bdat), comma separated
            value files (.csv), zipped comma separated value files (.csv.zip) and
            gzip comma separated value (.csv.gz).
    sessionInfo:
      title: Session Information
      description: Information regarding the CAS and Compute sessions used for an
        action.
      type: object
      properties:
        sessionId:
          type: string
          description: The CAS session ID used for the action.
        serverName:
          type: string
          description: The name of the CAS server used for the action, when it is
            necessary to specify a non-default server.
        computeSessionID:
          type: string
          description: The Compute session ID used for the action.  For input the
            tag computeSessionId is also honored.
        computeContextName:
          type: string
          description: The name of the Compute context used to create the Compute
            session for the action, when it is necessary to specify a Compute session
            via the context rather than by supplying an existing Compute session ID.
    dataDefinition:
      title: Data Definition
      description: A Cirrus data definition object.
      type: object
      properties:
        key:
          type: string
          description: UUID of the data definitions instance.  If the data definition
            instance already exists and is to be used as part of an action to create
            an analysis data instance, then either this field must be populated with
            the existing key or the objectId and sourceSystemCode fields must be populated.
        objectId:
          type: string
          description: ObjectId of the data definitions instance. If none is provided
            at creation time, one will be generated.
        name:
          type: string
          description: The name of the data definition instance we want to create.
        sourceSystemCd:
          type: string
          description: Source System Code.
        createdInTag:
          type: string
          description: the solution that was used to create this data definition.
        sharedWithTags:
          description: An array of string values containing solutions that this data
            definition should be shared with.
          type: array
          items:
            type: string
        customFields:
          type: object
          properties:
            schemaName:
              type: string
              description: This is the Schema Name for the associate data definition.
            schemaVersion:
              type: string
              description: This is the Schema Version for the associate data definition.
            defaultIndexList:
              type: string
              description: Comma separated list of indexes you want to add to dataset.
                Columns within index is expected to be space separated. Example two
                indexes - "col1 col2,col3"
            allowDataAppend:
              type: boolean
              description: Indicates a user can, via Risk Data, appended data to analysis
                data associated with this data definition.
            allowDataDelete:
              type: boolean
              description: Indicates a user can, via Risk Data, delete data from the
                analysis data associated with this data definition.
            allowColumnSchemaRevision:
              type: boolean
              description: Indicates a user can, via Risk Data, add columns to the
                data definition and the analysis data associated with this data definition.  It
                also controls if a column schema revision may be reverted for this
                data definition and the analysis data.
            martLibraryNm:
              type: string
              description: The CAS library to be used to write the Report Mart table.
            martTableNm:
              type: string
              description: The CAS table name to be used to write the Report Mart
                table.
            dbSchemaNm:
              type: string
              description: Only populated when a solution uses a different database
                schema than the default to store the analysis data.  Usage of such
                is refered to as a custom database schema. Different behavior is implemented
                in some end points if this value is set to something other than blank
                or the Risk Data default database schema.
            columnInfo:
              type: array
              description: This is an array for describing the data definition columns.
                Attributes of the column info can be used to designate the primaryKey,
                partition by variables(BYVARS), mandatory variables, etc.
              items:
                $ref: "#/components/schemas/columnInformation"
            columnSchemaRevisionInfo:
              properties:
                revisions:
                  type: array
                  description: A list of the column schema revisions for this data
                    definition.
                  items:
                    $ref: "#/components/schemas/columnSchemaRevisionSummary"
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    job:
      title: Job
      description: The execution job.
      x-sas-media-type:
        name: application/vnd.sas.job.execution.job
        version: 1
      required:
      - id
      properties:
        version:
          type: number
          description: The version number of the representation. The current version
            is 2.
        id:
          type: string
          description: The unique identifier that is generated by the API.
        state:
          type: string
          description: 'The current state of the job. Valid values: pending, running,
            canceled, completed, failed, timedOut'
        results:
          type: object
          description: The output results of the job execution (map of String, String).
        error:
          $ref: "#/components/schemas/error2"
        jobRequest:
          $ref: "#/components/schemas/request"
        heartbeatInterval:
          type: integer
          format: int32
          description: The interval in seconds that the `heartbeatTimeStamp` should
            be updated by the provider or the job times out. The value for the `heatbeatInterval`
            is 0 when there is no heartbeat.
        heartbeatTimeStamp:
          description: The timestamp for when the last heartbeat was received, in
            the format of `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        creationTimeStamp:
          description: The timestamp for when the job was created, in the format of
            `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        modifiedTimeStamp:
          description: The timestamp for when the job was last modified, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        endTimeStamp:
          description: The timestamp for when the state of the job changed to completed
            or failed, in the format of `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        expirationTimeStamp:
          description: The timestamp for when the job expires and will be deleted
            by the Job Execution service, in the format of `YYYY-MM-DDThh:mm:ss.sssZ`.
            This is set by the service after the job has completed based on the value
            of the `expiresAfter` member of the job request.
          type: string
        createdBy:
          description: The ID of the user that created or submitted the job.
          type: string
        modifiedBy:
          description: The ID of the user that last modified the job.
          type: string
        links:
          type: array
          description: The links that are associated with the job.
          items:
            $ref: "#/components/schemas/link"
    request:
      title: Job Request
      description: The job request.
      x-sas-media-type:
        name: application/vnd.sas.job.execution.job.request
        version: 1
      required:
      - id
      type: object
      properties:
        version:
          type: integer
          description: The version number of the representation. The current version
            is 2.
        id:
          type: string
          description: The unique identifier for the job.
        name:
          type: string
          description: The name of the job.
        description:
          type: string
          description: The description of the job.
        creationTimeStamp:
          description: The timestamp for when the job was created, in the format of
            `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        modifiedTimeStamp:
          description: The timestamp for when the job was last modified, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        createdBy:
          description: The ID of the user that created or submitted the job.
          type: string
        modifiedBy:
          description: The ID of the user that last modified the job.
          type: string
        jobDefinitionUri:
          type: string
          description: The URI of the job definition that is to be executed.
        jobDefinition:
          type: object
          description: The definition of the job that is to be executed.
        expiresAfter:
          type: string
          description: The duration of time (in <a href="https://www.w3.org/TR/xmlschema-2/#duration"
            target="_blank">W3C XML duration format</a>) after the completion of the
            job when the job should be deleted by the Job Execution service.
        arguments:
          type: object
          description: The values of the arguments described in the job definition.
        properties:
          type: object
          description: The value of properties in the format of (map<string, string>)
            that contains name value pairs (map<name, value>). The maximum name value
            length is 100.
          additionalProperties:
            type: string
        links:
          type: array
          description: The links that are associated with the job.
          items:
            $ref: "#/components/schemas/link"
