  /objects/register:
    post:
      tags:
      - Data
      summary: Register a physical table as analysis data
      description: Registers a physical table in an alternate data schema, creating
        an analysis data instance. Information to find an existing data definition
        must be provided as part of the payload. The information to find the data
        definition can be the key, the objectId or the schemaName and schemaVersion.
        The alternate data schema will be determined by the value in the data definition.
        The physical table name is specified in the analysis data customField "physicalTableNm".
        The physical table cannot be used as the physical table entry in any other
        analysis data instance linked to the specified data definition. All columns
        specified in the data definition must exist in the physical table provided.
      operationId: registerData
      parameters:
      - name: updateReportMart
        in: query
        schema:
          type: boolean
        required: false
        description: If the data definition for the imported data defines a report
          mart, this parameter determines if the newly created analysis data will
          be registered as a member of the report mart. When true, the report will
          be updated in the background to include the new data being registered. If
          the data definition is not a report mart, this parameter must not be used.
          The default is false.
      requestBody:
        required: true
        content:
          application/vnd.sas.business.objects.analysis.data.instance+json:
            schema:
              $ref: "#/components/schemas/analysisData"
            examples:
              sample1:
                $ref: "#/components/examples/analysisDataEx1"
              sample2:
                $ref: "#/components/examples/analysisDataEx2"
              sample3:
                $ref: "#/components/examples/analysisData"
          application/json:
            schema:
              $ref: "#/components/schemas/analysisData"
            examples:
              sample1:
                $ref: "#/components/examples/analysisData"
              sample2:
                $ref: "#/components/examples/analysisDataEx1"
              sample3:
                $ref: "#/components/examples/analysisDataEx2"
      responses:
        "200":
          description: The request succeeded. The table registered successfully.
          content:
            application/vnd.sas.business.objects.analysis.data.instance+json:
              schema:
                $ref: "#/components/schemas/analysisData"
              examples:
                json:
                  $ref: "#/components/examples/analysisDataResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/analysisData"
              examples:
