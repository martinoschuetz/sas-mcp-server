                  $ref: "#/components/examples/analysisDataResponse"
        "400":
          description: Invalid request or table already registered.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
