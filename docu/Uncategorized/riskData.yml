components:
  parameters:
    fields:
      name: fields
      in: query
      schema:
        type: string
      description: A comma-separated list of names of fields to be included in a response.  If
        omitted, all available fields will be included.
    filter:
      name: filter
      in: query
      schema:
        type: string
      description: The criteria for filtering the items in a collection. See [SAS
        REST APIs&colon; Filtering](https://developer.sas.com/rest-apis/riskData-v1/docs/getting-started/usage-notes#filtering).
    pagingStart:
      name: start
      in: query
      schema:
        type: integer
        format: int32
        default: 0
      description: pagination parameter, what is the starting index.
    pagingLimit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        default: 100
      description: pagination parameter, how many items to return.
    sortBy:
      name: sortBy
      in: query
      schema:
        type: string
      description: The criteria for sorting the items in a collection. See [SAS REST
        APIs&colon; Sorting](https://developer.sas.com/rest-apis/riskData-v1/docs/getting-started/usage-notes#sorting).
    locationTypeRead:
      name: locationType
      in: query
      schema:
        type: string
        enum:
        - DIRECTORY
        - LIBNAME
        - FOLDER
      description: The type of server location from which data will be read.
    locationTypeWrite:
      name: locationType
      in: query
      schema:
        type: string
        enum:
        - DIRECTORY
        - LIBNAME
        - FOLDER
      required: true
      description: The type of server location from which data will be written.
    locationTypeWriteOptional:
      name: locationType
      in: query
      schema:
        type: string
        enum:
        - DIRECTORY
        - LIBNAME
        - FOLDER
      description: The type of server location from which data will be written.  The
        location of FOLDER is not supported for bulk action end points.
    locationRead:
      name: location
      in: query
      schema:
        type: string
      description: The server location from which data will be read.  Interpretation
        of this parameter varies based on the value of locationType.  When locationType
        is DIRECTORY, the value must contain the file system path on the server where
        the data is located.  When locationType is LIBNAME, the value must contain
        the name of the library in which the data may be found. When locationType
        is FOLDER, the value must contain the display path or ID of a folder.
    locationWrite:
      name: location
      in: query
      schema:
        type: string
      required: true
      description: The server location to which data will be written.  Interpretation
        of this parameter varies based on the value of locationType.  When locationType
        is DIRECTORY, the value must contain the file system path on the server where
        the data will be written.  When locationType is LIBNAME, the value must contain
        the name of the library in which the data will be written. When locationType
        is FOLDER, the value must contain the display path or ID of a folder.
    locationWriteOptional:
      name: location
      in: query
      schema:
        type: string
      description: The server location to which data will be written.  Interpretation
        of this parameter varies based on the value of locationType.  When locationType
        is DIRECTORY, the value must contain the file system path on the server where
        the data will be written.  When locationType is LIBNAME, the value must contain
        the name of the library in which the data will be written. When locationType
        is FOLDER, the value must contain the display path or ID of a folder.
    platformType:
      name: platformType
      in: query
      schema:
        type: string
        enum:
        - SPRE
        - CAS
        - SASFOLDER
      description: Indicates the platform, CAS or SPRE, where a library or file system
        directory resides. If this is not provided, a lookup will be done first against
        the CAS platform and then against the SPRE platform. The acceptable values
        are  SPRE, CAS or sasFolder.
    platformTypeBulkActions:
      name: platformType
      in: query
      schema:
        type: string
        enum:
        - SPRE
        - CAS
      required: true
      description: Indicates the platform, CAS or SPRE, where a library or file system
        directory resides. If this is not provided, a lookup will be done first against
        the CAS platform and then against the SPRE platform. The acceptable values
        are  SPRE or CAS.
    fileNameRead:
      name: fileName
      in: query
      schema:
        type: string
      description: The name of the file or table from which data will be read.
    fileNameWrite:
      name: fileName
      in: query
      schema:
        type: string
      required: true
      description: name of the File or Table to which data will be exported. When
        writing to a library, the extension should be omitted; when writing to a directory
        or folder, an extension should be included. When writing to a folder, the
        supported file types are comma separated value (.csv) files, zipped comma
        separated value files (.csv.zip) and gzip comma separated value (.csv.gz).
        When writing to a SPRE directory, the supported file types are SAS datasets
        ( .sas7bdat), comma separated value files (.csv), zipped comma separated value
        files (.csv.zip) and gzip comma separated value (.csv.gz).
    computeSessionId:
      name: computeSessionId
      in: query
      schema:
        type: string
      description: The ID of an existing Compute session, to which the process will
        connect.  This allows the service to access the libraries defined in an existing
        Compute session.
    computeContextName:
      name: computeContextName
      in: query
      schema:
        type: string
      description: The Compute context name which will be used to create a Compute
        session if one is required.
    casSessionId:
      name: sessionId
      in: query
      schema:
        type: string
      description: The ID of an existing CAS session, to which the process will connect.  This
        allows the service to access session based CAS libraries.
    useOriginalColumns:
      name: useOriginalColumns
      in: query
      schema:
        type: boolean
      description: A true value indicates that the columns returned should only be
        those that were present at the time the analysis data object was created.
        New columns can be added to the analysis data table post creation via a column
        schema revision of the associated data definition. Such a change will be applied
        to the analysis data table ensuring the columns in the table match the data
        definition columns. To see the original columns of the analysis data object,
        set this parameter to true.  The default is false.
    replace:
      name: replace
      in: query
      schema:
        type: boolean
      required: false
      description: When true, existing resources will be overwritten by an export
        request if there a file or table with the given name already exists.  When
        false, an error will result if a resource with the given name already exists.  The
        default is false.
    scope:
      name: scope
      in: query
      schema:
        type: string
        enum:
        - GLOBAL
        - SESSION
      required: false
      description: When GLOBAL, a CAS table created by the export process will be
        promoted to global scope, making it visible to all users and processes.  When
        SESSION, a CAS table created will be constrained to the session that creates
        the table.  The default is SESSION except when exporting to a directory or
        folder.  When exporting to a library, the default is GLOBAL unless a sessionID
        is specified in which case the default is SESSION.
    save:
      name: save
      in: query
      schema:
        type: boolean
      required: false
      description: When true, a CAS table created by the export process will be saved
        to its caslib's permanent storage as well as remaining loaded into memory.
        allowing the table to survive server restarts.
    dataMapKey:
      name: dataMapKey
      in: query
      schema:
        type: string
      required: false
      description: The unique identifier for the data map.
    exportFormat:
      name: format
      in: query
      schema:
        type: boolean
      required: false
      description: Specifies whether to apply the SAS formats to the data in the cells.
        Please note that this option is not supported for a location which refers
        to a CAS location.
    exportSortBy:
      name: sortBy
      in: query
      schema:
        type: string
      description: The criteria for sorting the items in a collection. See [SAS REST
        APIs&colon; Sorting](https://developer.sas.com/rest-apis/riskData-v1/docs/getting-started/usage-notes#sorting).
        Please note that sorting export data is not supported for a location which
        refers to a CAS location.
    concurrentSessions:
      name: concurrentSessions
      in: query
      schema:
        type: integer
      description: The number of concurrent sessions to use for a bulk action end
        point.  If the platformType is CAS then this is the number of concurrent CAS
        sessions to use.  If the platformType is SPRE then this is the number of concurrent
        Compute sessions to use. The bulk actions are multi-threaded based on session.  If
        no default session is specified in the query parameters of a request then
        Risk Data will create a new session. If the concurrentSessions parameter is
        specified Risk Data will create the specified number of sessions and use them
        in a round-robin fashion for the bulk action.  The maximum number of sessions
        that a user can specify is part of the service configuration.  If a user provides
        sessions within the bulk action payload and concurrent sessions is specified
        as well then new sessions will be created to fill the difference between the
        number of sessions provided in the payload and the number specified in the
        concurrentSessions parameter. The concurrentSessions option will be ignored
        if all items in the payload are already allocated to a session via the payload
        content or a default session is provided in the query parameters.
  schemas:
    analysisData:
      title: Analysis data
      description: Cirrus metadata associated with data to be stored
      type: object
      properties:
        dataDefinition:
          $ref: "#/components/schemas/dataDefinition"
        dataDefinitionRules:
          description: A Cirrus data security rules object associated with the data
            definition
          type: object
          properties:
            key:
              type: string
              description: UUID of the data security rules instance. This is optional
                - key or objectId & sourceSystemCode.
            objectId:
              type: string
              description: ObjectId of the data security rules instance. This is also
                optional like key.
            name:
              type: string
              description: The name of the data security rules instance we want to
                create.
            sourceSystemCd:
              type: string
              description: Source System Code.
            createdInTag:
              type: string
              description: the solution that was used to create this set of security
                rules.
            sharedWithTags:
              description: An array of string values containing solutions that this
                set of security rules should be shared with.
              type: array
              items:
                type: string
            customFields:
              type: object
              properties:
                securityRules:
                  type: array
                  description: list of rules
                  items:
                    type: object
                    properties:
                      groups:
                        type: array
                        description: a list of authorization groups for the rule
                        items:
                          type: string
                      scopes:
                        type: array
                        description: a list of maps containing properties of records
                          used to grant access to users in the associated list of
                          groups.
                        items:
                          type: object
        analysisData:
          description: A Cirrus analysis data instance object.
          type: object
          properties:
            name:
              type: string
              description: Analysis data name
            objectId:
              type: string
              description: Analysis data objectId. sourceSystemCd and objectId make
                unique combination.
            key:
              type: string
              description: This is key of analysis data instance. Optional if objectId
                is provided.
            sourceSystemCd:
              type: string
              description: Source System Code.
            createdInTag:
              type: string
              description: the solution that was used to create this analysis data
                instance.
            sharedWithTags:
              description: An array of string values containing solutions that this
                analysis data instance should be shared with.
            customFields:
              type: object
              properties:
                indexList:
                  type: string
                  description: Comma seperated list of indexes you want to add to
                    dataset (overrides defaultIndexList:). Columns within index is
                    expected to be space separated. Example two indexes - "col1 col2,col3"
                strategyType:
                  type: string
                  description: Following are the values you can use - BYVARS - Partition
                    count is detected from distinct combination  of columns set with
                    partitionFlag(in dataDefinition.customFields.columnInfo array)
                    to true. ROWS - Partition count is detected based on number of
                    rows. If this is set we also need value for parameter rowsPerPartition.
                    FIXED - Partition count is detected based on parameter partitionCount
                    value. NONE - No partition required.
                rowsPerPartition:
                  type: integer
                  description: Number of rows per partition. Required only when strategyType
                    is set to ROWS.
                partitionCount:
                  type: integer
                  description: Number of fixed partitions. Required only when strategyType
                    is set to FIXED.
                creationSchemaRevision:
                  type: integer
                  description: This is the latest column schema revision of the data
                    definition at the time the analysis data instance was created.
                rowCount:
                  type: number
                  description: The number of rows in the stored analysis data.
                columnCount:
                  type: number
                  description: The number of columns in the data definition associated
                    with the analysis data.
        analysisDataRules:
          description: A Cirrus data security rules object associated with the analysis
            data instance
          type: object
          properties:
            key:
              type: string
              description: UUID of the data security rules instance. This is optional
                - key or objectId & sourceSystemCode.
            objectId:
              type: string
              description: objectId of the data security rules instance. This is also
                optional like key.
            name:
              type: string
              description: The name of the data security rules instance we want to
                create.
            sourceSystemCd:
              type: string
              description: Source System Code.
            createdInTag:
              type: string
              description: the solution that was used to create this set of security
                rules.
            sharedWithTags:
              description: An array of string values containing solutions that this
                set of security rules should be shared with.
            customFields:
              type: object
              properties:
                securityRules:
                  type: array
                  description: list of rules
                  items:
                    type: object
                    properties:
                      groups:
                        type: array
                        description: a list of authorization groups for the rule
                        items:
                          type: string
                      scopes:
                        type: array
                        description: a list of maps containing properties of records
                          used to grant access to users in the associated list of
                          groups.
                        items:
                          type: object
        analysisDataArchive:
          $ref: "#/components/schemas/analysisDataArchive"
    analysisDataArchive:
      title: Analysis data archive object
      description: The archive object for the analysis data instance.  The archive
        object contains information about the archive including location, columns
        and observation count.
      type: object
      properties:
        key:
          type: string
          description: UUID of the archive instance.
        name:
          type: string
          description: The name of the archive object.
        objectId:
          type: string
          description: The objectId of the archive object.
        description:
          type: string
          description: The description of the archive object.
        sourceSystemCode:
          type: string
          description: Source System Code.
        createdBy:
          type: string
          description: the userid of the creator of a report mart.
        creationTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the report mart was created.
        modifiedBy:
          type: string
          description: the userid of the last user to update a report mart.
        modifiedTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the report mart was last updated.
        endTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the archive action finished.
        dataLocation:
          description: The location where the data has been archived.
          type: object
          properties:
            location:
              type: string
              description: The location where the data has been archived.
            locationType:
              type: string
              description: The location type were the data has been archived.
              enum:
              - libname
              - directory
              - sasFolder
            platformType:
              type: string
              description: The platform where the data location resides.
              enum:
              - spre
              - cas
              - sasFolder
            fileName:
              type: string
              description: The fileName where the data has archived.
        fileSize:
          type: number
          format: int64
          description: The size of the archived file.
        analysisDataKey:
          type: string
          description: UUID of the analysis data instance associated with the archive
            object.
        sourceSchemaName:
          type: string
          description: The database schema associated with the analysis data instance
            at the time the archive took place.
        sourceTableName:
          type: string
          description: The database physical table associated with the analysis data
            instance at the time the archive took place.
        rowCount:
          type: number
          description: The number of observations in the archive file.
        columnCount:
          type: number
          description: The number of columns that were in the physical table associated
            with the analysis data instance at the time the archive took place.
        columnInfo:
          type: array
          description: The column information from the physical table associated with
            the analysis data instance at the time the archive took place.
          items:
            $ref: "#/components/schemas/columnInformation"
        links:
          type: array
          description: Links available for this resource
          items:
            $ref: "#/components/schemas/link"
    analysisDataArchiveCollection:
      title: Analysis data archive object collection
      description: A collection of analysis data archive objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The array of `application/vnd.sas.business.objects.analysis.data.instance.archive`
              representations.
            items:
              $ref: "#/components/schemas/analysisDataArchive"
    analysisDataArchiveRequest:
      title: Analysis data archive request
      description: The archive request object to be used when invoking an archival
        of the data for the analysis data instance.
      type: object
      properties:
        name:
          type: string
          description: The name to be used for the archive object and archival job.
        objectId:
          type: string
          description: The objectId to be used for the archive object and archival
            job.
        deleteData:
          type: boolean
          description: Delete data indicates that the data within the analysis data
            table should be deleted upon completion of the archive activity.
        dataLocation:
          description: The location to be used for storing the archived data.
          type: object
          properties:
            location:
              type: string
              description: The location where the archive file should be created.  At
                this time, only an absolute path is allowed.
    analysisDataRestoreRequest:
      title: Analysis data archive restore request
      description: The restore request object to be used when invoking a restore of
        data from an archived file into the physical table associated with the analysis
        data instance.
      type: object
      properties:
        allowPreviousArchiveRestore:
          type: boolean
          description: Controls if a restore can be done against an archive object
            that is not the latest archive object for this analysis data instance.
        dataConflictStrategy:
          description: Controls what should happen if a restore is requested and the
            physical table for the analysis data instance still contains data. The
            default is reject.
          type: string
          enum:
          - fullTableReplace
          - reject
    analysisDataArchiveRestoreJob:
      title: Analysis data archival job object
      description: An archival job for either an archive or restore action against
        an analysis data instance.  When such an action is requested an archival job
        is created.  The job can be monitored for state. The job also contains the
        request which invoked the job, the archive object associated with the request.
      type: object
      properties:
        key:
          type: string
          description: UUID of the archival job object.
        name:
          type: string
          description: The name of the archival job object.
        objectId:
          type: string
          description: The objectId of the archival job object.
        description:
          type: string
          description: The description of the archival job object.
        sourceSystemCode:
          type: string
          description: Source System Code.
        createdBy:
          type: string
          description: the userid of the creator of the archival job object.
        creationTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the archival job object was created.
        modifiedBy:
          type: string
          description: the userid of the last user to update tje archival job object.
        modifiedTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the archival job object was last updated.
        endTimeStamp:
          type: string
          format: ISO-8601
          description: the date and time the archival job object finished.
        jobType:
          type: string
          description: The type of the archival job.
          enum:
          - archive
          - restore
        state:
          type: string
          description: The run state of the archival job.  This is to be used to determine
            if the archival job has completed or failed.
          enum:
          - pending
          - running
          - completed
          - timedOut
          - failed
        error:
          $ref: "#/components/schemas/error2"
        hadWarning:
          type: boolean
          description: A warning occurred during the running of the job.
        archiveInformation:
          $ref: "#/components/schemas/analysisDataArchive"
        archiveRequest:
          $ref: "#/components/schemas/analysisDataArchiveRequest"
        restoreRequest:
          $ref: "#/components/schemas/analysisDataRestoreRequest"
        links:
          type: array
          description: Links available for this resource
          items:
            $ref: "#/components/schemas/link"
    analysisDataArchiveRestoreJobCollection:
      title: Analysis data archival job object collection
      description: A collection of analysis data archival job objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The array of `application/vnd.sas.business.objects.analysis.data.instance.archival.job`
              representations.
            items:
              $ref: "#/components/schemas/analysisDataArchiveRestoreJob"
    columnValuesCollectionJson:
      title: Analysis data distinct column values as collection
      description: Information about distinct column value collection
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
