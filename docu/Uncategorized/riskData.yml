      summary: Get Analysis Data Columns
      description: Returns the columns associated with this analysis data. By default
        the columns returned are those that reflect the columns in the associated
        data definition at this moment.  If a column schema revision has happened
        since the analysis data was loaded the columns at the time of the original
        analysis data import can be seen by providing an input parameter of useOriginalColumns=true.  The
        column schema revision against which the analysis data was originally imported
        is available via the analysis data objects customFields item keyed with the
        value 'creationSchemaRevision'.  If a column was added after the data definition
        was first processed then that column will have a property of creationSchemaRevision
        set to the schema revision at which the column was added.
