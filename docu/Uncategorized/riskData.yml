  /dataDefinitions/{definitionId}/columnSchemaRevisions:
    post:
      tags:
      - Data Definition
      summary: Create Column Schema Revision ( Add Columns and Revert Columns)
      description: >
        A columns schema revision contains information regarding the manipulation
        of columns in a data definition.
        There are two types of column schema revisions which are a column addition
        and a column revert.
        The post request determines which type of revision is being requested based
        on the content of the request payload
        and media type. A new column schema revision object is created for each successful
        request and the column schema number
        is incremented by one.  The column schema revision ability is controled by
        the customField allowColumnSchemaRevision
        in the data definition.

        - Add Columns.  The media type of application/vnd.sas.business.objects.data.definition.schema.revision.create.request
          indicates that the request is to add new columns to the data definition.

          The combination of payload and input data query parameters is determined
        by the database schema defined for the data definition.
          The new columns cannot be designated as: primary keys, partitions, indexes,
        or mandatoryFields.

          - Risk Data Default Database Schema.  If the customField dbSchemaNm is not
        populated in the data definition
            the Risk Data default data retention mechanism is used. In such a case
        the new columns can be specified in the request payload, supplied via the
        column attributes of input data
            or a combination of both. The standard Risk Data query parameters for
        location, locationType and filename are used to specify
            the location of the input structure data. Note that the column structure
        is used from the input data, the actual data is not loaded.

            Both the request payload and input data query parameters are optional
        but at least one must be provided.  If input data is supplied
            and the payload contains column names then only those columns named in
        the payload will be added from the input data.  If only
            the input data is supplied then all columns in the input data that do
        not already exist in the data definition will be added.
            If only the payload is supplied then the new columns will be added based
        on the column attributes in the payload. In such a case
            the column attributes must contain a name and enough attributes to define
        the column. This can be the type and length or the sqlType.

          - Custom Database Schema.  If the customField dbSchemaNm is then a custom
        database is being used to store the analysis data.
            In such a case the administrator of that database is responsible for maintaining
        the structure of the analysis data tables.
            The new columns must be added to the associated analysis data tables prior
        to the request and the column attributes in the payload
            must be compatible with the underlying analysis data tables. The input
        data query parameters location, locationType and filename
            are not used in this case and should not be provided.  No modifications
        are made to the analysis data tables as part of the request.

        - Revert Columns.  The media type of application/vnd.sas.business.objects.data.definition.schema.revision.revert.request
          indicates that the request is to revert previously added columns in the
        data definition.

          The column revision to revert must be contained in the payload.  A revert
        will create a new column schema revision entry. The
          column revert request does not delete the specified column schema revision.  The
        specified column schema revision is marked
          as reverted and is no longer applicable for use. If the customField dbSchemaNm
        is not populated in the data definition then the columns
          will be removed from data definition object and the analysis data tables.  If
        the customField dbSchemaNm is populated
          then the columns will be removed from the data definition object but no
        changes will be made to the analysis data tables.
          The following conditions apply to a column revert request:
          - No analysis data objects can refer to the column schema revision to be
        reverted. The customField creationSchemaRevision in
            the analysis data object identifies the column schema revision used to
        create that analysis data object.  If any analysis data
            object refers to the column schema revision to be reverted then the request
        will be rejected.
          - Only a column schema revision of the type ADD_COLUMNS can be reverted.
          - A column schema revision that has already been reverted cannot be reverted
        again.
          - A column schema revision can only be reverted if it is the latest revision
        in the data definition.  If an ADD_COLUMNS column
            revision is followed by another column schema revision then it cannot
        be reverted.

        - Synchronous vs Asynchronous Processing. The processing of a column schema
        revision request can be specified as either
          synchronous or asynchronous by the media type specified in the Accept header
        of the request. The default is asynchronously.

          - Asynchronous Job Execution Job.  When a application/vnd.sas.job.execution.job+json
            response is requested, a JES job will immediately be created and returned
        in the response.
            The entire processing of the column addition or revert is done in the
        JES Job including the creation of the revision object,
            update of Cirrus objects, alteration of the analysis data tables and if
        applicable, updating
            the Report Mart.  The JES job can be monitored for completion and
            information regarding the action can be found in the log of the JES job.  Processing
        asynchronous has
            the advantages of
            - not tying up the REST API client connection and allowing for longer
        processing times.
            - providing a mechanism to monitor the entire process including the Report
        Mart population.
            - retrieving action log messages from a source other than the pod log.
          - Synchronous.  When a application/vnd.sas.business.objects.data.definition.schema.revision+json
            response is requested, with the exception of the Report Mart update all
        the actions required for
            the column additions or revert will take place synchronously within the
        REST API call.  This includes the creation of the
            revision object, update of Cirrus objects and alteration of the analysis
        data tables.  The
            response will not be returned until all these actions are completed.  The
        Report Mart update
            will be performed asynchronously after the response is returned.  Any
        errors that occur during
            the Report Mart population will only be found in the pod log.  There is
        no mechanism to monitor
            the Report Mart population using this response type.
      operationId: createColumnSchemaRevision
      parameters:
      - name: definitionId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the data definition.
      requestBody:
        content:
          application/vnd.sas.business.objects.data.definition.schema.revision.create.request:
            schema:
              $ref: "#/components/schemas/columnSchemaRevisionCreateRequest"
            examples:
              jsonWithInputData:
                $ref: "#/components/examples/columnSchemaRevisionCreateRequestWithInputData"
              jsonNoInputData:
                $ref: "#/components/examples/columnSchemaRevisionCreateRequestFull"
          application/vnd.sas.business.objects.data.definition.schema.revision.revert.request:
            schema:
              $ref: "#/components/schemas/columnSchemaRevisionRevertRequest"
            examples:
              json:
                $ref: "#/components/examples/columnSchemaRevisionRevertRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/columnSchemaRevisionCreateRequest"
            examples:
              jsonWithInputData:
                $ref: "#/components/examples/columnSchemaRevisionCreateRequestWithInputData"
              jsonNoInputData:
                $ref: "#/components/examples/columnSchemaRevisionCreateRequestFull"
      responses:
        "201":
          description: Valid for a response media type of application/vnd.sas.business.objects.data.definition.schema.revision+json.
            The request to add or revert columns was accepted and a new column schema
            revision was created.  The columns have been added to or removed from
            the data definition.  Corresponding changes, if applicable, have been
            applied to the analysis data tables.  The Report Mart population, if applicable,
            is being processed asynchronously and may be completed after the return
            of the request.
          headers:
            Location:
              description: The URI of the created column schema revision.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.business.objects.data.definition.schema.revision+json:
              schema:
                $ref: "#/components/schemas/columnSchemaRevisionDetails"
              examples:
                json:
                  $ref: "#/components/examples/columnSchemaRevisionDetails"
        "202":
          description: >
            The request to add or revert columns was accepted and
            a JES job was created to process the request.  The JES job is
            responsible for creating the new column schema revision, adding or removing
            the columns
            in the data definition and, if applicable, altering the columns in the
            associated analysis data tables.
            The Report Mart population, if applicable, is processed as part of the
            JES job and
            job completion is not indicated until the Report Mart population is completed.

            The arguments map within the JES Job jobRequest will contain information
            regarding the requested action.
              - revisionType : ADD_COLUMNS or REVERT_COLUMNS
              - dataDefinitionKey : the unique identifier of the data definition

            Upon successful completion of the job, the job results map will contain
            the json fields that
            comprise the Data Definition Column Schema Revision Summary.  Such as:
              - revisionType: ADD_COLUMNS or REVERT_COLUMNS
              - revisionNumber: the new column schema revision number
              - associatedSchemaRevision: if this is a REVERT_COLUMNS this field will
            contain the column schema revision number of
                the ADD_COLUMNS revision that was reverted.
              - creationTimeStamp: the timestamp of when the revision was created
              - revisionURL: the URL of the new column schema revision
              - dataDefinitionKey : the unique identifier of the data definition
          headers:
            Location:
              description: The URI of the create Job Execution Service job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/columnSchemaRevisionRequestJob"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/columnSchemaRevisionRequestJob"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "403":
          description: User has no access to data definition or is not permitted to
            create an column schema revision.
        "404":
          description: No content was found for the specified identifier.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
  /dataDefinitions/{definitionId}/columnSchemaRevisions/{revisionNumber}:
