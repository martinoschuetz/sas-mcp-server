  /objects/{analysisId}/export/summarize:
    post:
      tags:
      - Data
      summary: Export a summarized analysis data table to a given location
      description: Exports a summarized analysis data table to a given location.  The
        request type will determine if the export is done synchronous or asynchronous
        via the Job Execution Service.
      operationId: exportSummary
      parameters:
      - name: Accept
        in: header
        required: false
        description: Specifies the desired export action and returned information.
          If no value is provided the default behavior will be synchronous and the
          returned object will be application/vnd.sas.business.objects.analysis.data.export.report+json.
          If the media-type application/vnd.sas.job.execution.job+json is specified
          then the export will be performed in an asynchronous manner via the Job
          Execution Service.  In such a case the Job Execution Service object will
          be returned.
        schema:
          type: string
          enum:
          - application/vnd.sas.business.objects.analysis.data.export.report+json
          - application/vnd.sas.job.execution.job+json
          - application/json
      - name: analysisId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the analysis data.
      - $ref: "#/components/parameters/locationTypeWrite"
      - $ref: "#/components/parameters/locationWrite"
      - $ref: "#/components/parameters/platformType"
      - $ref: "#/components/parameters/fileNameWrite"
      - name: replace
        in: query
        schema:
          type: boolean
        required: false
        description: When true, existing resources will be overwritten by an export
          request if there a file or table with the given name already exists.  When
          false, an error will result if a resource with the given name already exists.  The
          default is false.
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - GLOBAL
          - SESSION
        required: false
        description: When GLOBAL, a CAS table created by the export process will be
          promoted to global scope, making it visible to all users and processes.  When
          SESSION, a CAS table created will be constrained to the session that creates
          the table.  The default is SESSION except when exporting to a directory
          or folder.  When exporting to a library, the default is GLOBAL unless a
          sessionID is specified in which case the default is SESSION.
      - name: save
        in: query
        schema:
          type: boolean
        required: false
        description: When true, a CAS table created by the export process will be
          saved to its caslib's permanent storage as well as remaining loaded into
          memory. allowing the table to survive server restarts.
      - $ref: "#/components/parameters/casSessionId"
      - $ref: "#/components/parameters/computeSessionId"
      - $ref: "#/components/parameters/computeContextName"
      - $ref: "#/components/parameters/filter"
      - name: sortBy
        in: query
        schema:
          type: string
        description: The criteria for sorting the items in a collection. See [SAS
          REST APIs&colon; Sorting](https://developer.sas.com/rest-apis/riskData-v1/docs/getting-started/usage-notes#sorting).
          Please note that sorting export data is not supported for a location which
          refers to a CAS location.
      - $ref: "#/components/parameters/useOriginalColumns"
      requestBody:
        description: The payload comprises of array of aggregation metadata for API
          to perform aggregation.
        required: true
        content:
          application/vnd.sas.business.objects.analysis.data.export.summarize.request+json:
            schema:
              $ref: "#/components/schemas/summarizeAnalysisData"
            examples:
              json:
                $ref: "#/components/examples/summarizeAnalysisDataInput"
          application/json:
            schema:
              $ref: "#/components/schemas/summarizeAnalysisData"
            examples:
              json:
                $ref: "#/components/examples/summarizeAnalysisDataInput"
      responses:
        "200":
          description: The request succeeded. The data has been exported and a report
            is returned describing the location.
          headers:
            Content-Type:
              description: Return type based on the requested Content-Type. Defaults
                to application/vnd.sas.business.objects.analysis.data.export.report+json
              schema:
                type: string
          content:
            application/vnd.sas.business.objects.analysis.data.export.report+json:
              schema:
                $ref: "#/components/schemas/exportReport"
              examples:
                json:
                  $ref: "#/components/examples/exportReport"
            application/json:
              schema:
                $ref: "#/components/schemas/exportReport"
              examples:
                json:
                  $ref: "#/components/examples/exportReport"
        "202":
          description: The export summary job was created and the export process has
            begun
          headers:
            Location:
              description: the URI to the job that is exporting the requested summary.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
        "400":
          description: An error has occurred.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "404":
          description: No content was found for the specified identifier.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
        "409":
          description: The data cannot be retrieved when an analysis data instance
            is in an archived state.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error"
