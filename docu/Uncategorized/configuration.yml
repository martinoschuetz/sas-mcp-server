components:
  parameters:
    definitionNameQueryParam:
      name: definitionName
      in: query
      description: |
        Return only objects for the given definitionName.
      required: false
      schema:
        type: string
    mediaTypeQueryParam:
      name: mediaType
      in: query
      description: |
        Return only objects for the given mediaType.  Always takes precedence
        over definitionName.
      required: false
      schema:
        type: string
    serviceQueryParam:
      name: service
      in: query
      description: |
        Return only objects for the given service.
      required: false
      schema:
        type: string
    nameQueryParam:
      name: name
      in: query
      description: |
        Return only objects with the given name.
      required: false
      schema:
        type: string
    definitionVersionQueryParam:
      name: definitionVersion
      in: query
      description: |
        Return only objects with the given version.
      required: false
      schema:
        type: integer
    isDefaultQueryParam:
      name: isDefault
      in: query
      description: |
        Filter by whether the configuration is marked as default.
      required: false
      schema:
        type: boolean
    isGlobalConfigQueryParam:
      name: isGlobalConfig
      in: query
      description: |
        Filter by whether the configuration is global (applies to all services).
      required: false
      schema:
        type: boolean
    hasBeenModifiedQueryParam:
      name: hasBeenModified
      in: query
      description: |
        Filter by whether the configuration has been modified since creation.
      required: false
      schema:
        type: boolean
    forceQueryParam:
      name: force
      in: query
      description: >
        When true, process all configurations in this request without regard to
        existing sitedefaults
        and without regard to the isDefault flag on any existing configurations.

        WARNING: This can result in temporary instability and inconsistency if
        the incoming configurations are from an earlier Viya release or cadence
        and have metadata.isDefault = true. The incoming (old) configurations will
        temporarily overwrite any existing non-default configuration OR any
        existing configuration with the current default values. After the
        next restart of the affected service, the current default values will
        be restored again.
      required: false
      schema:
        type: boolean
        default: false
  requestBodies:
    collection2:
      content:
        application/vnd.sas.collection+json;version=2:
          schema:
            $ref: "#/components/schemas/collection2"
        application/json:
          schema:
            $ref: "#/components/schemas/collection2"
      description: A collection of Configuration objects.
      required: true
  schemas:
    api:
      type: object
      description: The links array member contains links to the top-level resources
        in the API.
      required:
      - version
      properties:
        version:
          type: integer
          description: |
            This media type's schema version number. This representation is
            version 1.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: |
            Zero or more link objects. See the above link relations table for a
            description of the link types.
    collection2:
      type: object
      description: Holds a collection of items with associated metadata.
      required:
      - version
      properties:
        version:
          type: integer
          description: |
            This media type's schema version number. This representation is
            version 2.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: |
            Zero or more link objects. See the above link relations table for a
            description of the link types.
        accept:
          type: string
          description: >
            A space-separated list of link types of the items in this
            collection.

            (Omit the +json or +xml format).
        count:
          type: integer
          description: >
            The number of items in the collection. May be omitted if the count
            is not known.
        start:
          type: integer
          description: The index of the first item in this collection view, 0-based.
        limit:
          type: integer
          description: The number of items to return in each page
        name:
          type: string
          description: >
            The abstract name of the collection; what the "items" member
            represents.  Note - The value SHOULD be something other than "items".
            That is, do not use "items".
    collectionRequest:
      type: object
      description: >
        Holds a collection of items for a request. The code will always default the
        collection version to 2.
      properties:
        version:
          type: integer
          description: |
            This media type's schema version number. This representation is
            version 2.
        name:
          type: string
          description: >
            The abstract name of the collection; what the "items" member
            represents.  Note - The value SHOULD be something other than "items".
            That is, do not use "items".
    configurationCollection:
      description: |
        A collection of Configuration objects.
      allOf:
      - $ref: "#/components/schemas/collection2"
      - type: object
        properties:
          items:
            type: array
            description: |
              An array of Configuration objects.
            items:
              $ref: "#/components/schemas/configuration"
    configurationRequestCollectionRequest:
      description: |
        A collection of Configuration request objects.
      allOf:
      - $ref: "#/components/schemas/collectionRequest"
      - type: object
        properties:
          items:
            type: array
            description: |
              An array of Configuration request objects.
            items:
              $ref: "#/components/schemas/configurationRequest"
    definitionCollection:
      description: |
        A collection of Definition objects.
      allOf:
      - $ref: "#/components/schemas/collection2"
      - type: object
        properties:
          items:
            type: array
            description: |
              An array of Definition objects.
            items:
              $ref: "#/components/schemas/definition"
    definitionRequestCollectionRequest:
      description: |
        A collection of Definition request objects.
        New versions of a DefinitionRequest must follow specific rules. A new version:

        * Must provide reasonable defaults for any new properties

        * Must NOT remove any properties

        * Must NOT change the semantic meaning of any existing properties

        * Must NOT change any of the metadata about the Definition.

        * The following changes ARE allowed in a new definitionVersion:

          * Modifying the label, description, or externalRestartRequired fields of the Definition itself

          * A one-time change to toggle addressByTenant from false to true (which will
        automatically also apply to all older definitionVersions)

          * Changing the services list to add additional services (Note that there may be special
        migration considerations for any existing configurations and this change also effectively
        applies to all older definitionVersions)

          * Changing the services list to empty, which means the definition is
        now global and could apply to any and all services (also affects older definitionVersions)

          * Adding new definition properties or sub-properties as long as they
        have either required = false or a valid defaultValue to substitute if
        the value was unspecified. If 'allowUserProperties' is true, then any
        newly added properties must be of type 'string'.

          * Modifying the label, description, or defaultValue of existing
        properties or sub-properties

        * Any changes to a property's defaultValue will not necessarily be applied
        when updating an existing deployment (depending on if a new default
        configuration is being bootstrapped and if a customer has already modified
        ANY property value in that default configuration)


        If any of these can not be followed then a new Definition must be
        created instead of versioning an existing Definition.


        By following these rules the server can freely translate any version of
        a config into any other version of that same config. Configs with new
        versions created by new clients are available to old clients and vice versa.
        The values persisted inside of the config are distinct from the version
        of the representation used by each client.


        Versions are just views projected onto the underlying config. Note that
        if a new client creates a config as a new version and then an old client
        replaces that config with a PUT or POST using the old version, then any new
        properties introduced by the new version will be unchanged.
      allOf:
      - $ref: "#/components/schemas/collectionRequest"
      - type: object
        properties:
          items:
            type: array
            description: |
              An array of Definition request objects.
            items:
              $ref: "#/components/schemas/definitionRequest"
    factCollection:
      description: |
        A collection of Fact objects.
      allOf:
      - $ref: "#/components/schemas/collection2"
      - type: object
        properties:
          items:
            type: array
            description: |
              An array of Fact objects.
            items:
              $ref: "#/components/schemas/fact"
    factRequestCollectionRequest:
      description: |
        A collection of Fact request objects.
      allOf:
      - $ref: "#/components/schemas/collectionRequest"
      - type: object
        properties:
          items:
            type: array
            description: |
              An array of Fact request objects.
            items:
              $ref: "#/components/schemas/factRequest"
    link:
      type: object
      description: A link to another resource.
      required:
      - rel
      - method
      properties:
        rel:
          type: string
          description: |
            The link relation: a mnemonic string which indicates the meaning of
            this link. Use standard IANA link relations where appropriate; SAS
            custom link relations must be lowerCamelCase identifiers. This is
            not a user-visible (UI) string.
        method:
          type: string
          description: >
            The HTTP method, one of GET, HEAD, PUT, POST, PATCH, DELETE
            (although we typically do not list HEAD links in link collections.)
        uri:
          type: string
          description: |
            The URI of the target resource,relative to the root of the API. Must
            start with /. One of uri or href is required.
        href:
          type: string
          description: |
            The full URL. Must start with /. One of uri or href is required.
        title:
          type: string
          description: |
            The human-readable title of this link.
        type:
          type: string
          description: |
            The primary link type. Required except for DELETE links.
        itemType:
          type: string
          description: |
            Optional; used if the link type is a collection.
        responseType:
          type: string
          description: |
            Optional; used if response content type is not the
            same as the request content type.
        responseItemType:
          type: string
          description: |
            Optional; used if the items in the response
            body is not the same as the item type of the request body.
    definitionProperty:
      type: object
      description: |
        Specifies the details of an individual property.


        Most of these fields are NOT allowed to change,
        even in a new definitionVersion.
        The fields that may be changed in a new definitionVersion are
        description, label, and defaultValue.


        If a property is of type map, then the description, label,
        and defaultValue of sub-properties may also be changed.
        New sub-properties may be added to a map, as long as the new
        sub-property has required = false or specifies a valid
        defaultValue that could be used when that sub-property is
        unspecified.


        The API will also allow without error an incoming definitionVersion
        that is NOT a new definitionVersion that only has attempted
        modifications to the description, label, and defaultValue
        fields. However, such changes will be ignored in any
        system doing an update, so this approach should only be
        used early in a development cycle, when all system deployments
        are new and the definitionVersion has NEVER shipped to customers.
        This behavior is subject to change and may eventually result in
        bootstrapping errors for recently created definitionVersions,
        so the best practice is to always copy / paste a new copy
        of your definition and increment the definitionVersion on
        the new copy, but still preserve and bootstrap any old
        definitionVersion(s) that have shipped to customers.
      required:
      - name
      properties:
        name:
          type: string
          description: The name of this property.
        description:
          type: string
          description: (default "").  The description of this property.
        label:
          type: string
          description: |
            (default "").  The label to display for properties of this name.
        required:
          type: boolean
          description: |
            (default false).  When true, configurations must specify this
            property.
          default: false
        type:
          type: string
          description: |
            (default "string").  The type of this property.  Valid
            types - string, integer, decimal, boolean, uri, map, text.

            Properties of type "text" are allowed to include embedded new-line characters, while properties
            of type "string" and "uri" cannot include line-breaks or new-lines.
            Currently no additional validation is done on type "uri", but it can be a useful marker type.

            Only properties of type "map" are allowed to contain sub-properties (which could be
            recursive, but multi-level maps of sub-maps are discouraged for usage complexity and potential confusion).
        list:
          type: boolean
          description: |
            (DEPRECATED).  Must be false in API v3+.
          default: false
        defaultValue:
          type: object
          description: |
            (default null).  The default value of this property.
          default: ""
        values:
          type: array
          items:
            oneOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
            - type: object
          description: |
            (default null).  When set, this is a list of possible values.  These
            can be rendered as a drop-down box.  When 'allowUserValue' is false
            this is the exhaustive list of allowed values.  The Configuration
            Service will fail any Configuration object with a different value.
            When 'allowUserValue' is true these are suggestions and other values
            will be allowed.
        valuesSource:
          type: string
          description: |
            (default 'definition').  Can be set to one of the following:
            'definition', 'facts'.  When set to 'definition', the 'values' field in this
            property object is expected to contain the list of possible values.
            Setting this to 'facts' is experimental and not fully supported.
        allowUserProperties:
          type: boolean
          description: |
            (optional, default false) When true, properties are not limited to
            the ones defined in this type. UI should allow the input of
            additional name/value pairs. Validation of these additional pairs is
            delegated to the services. When this is true the type of this
            property MUST be a map and all sub-properties MUST be of type string
            and allowUserValue must be true. This ensures the ability to version
            this Definition.
          default: false
        allowUserValue:
          type: boolean
          description: |
            (default true). Only valid when 'values' is non-null.  When
            false, only the values in 'values' are allowed.  When true, any other
            value may be used and 'values' may be rendered as a combo box.
          default: true
        addressByName:
          type: boolean
          description: |
            (optional, default false).  When true, individual sub-properties are
            addressable by name.  This property's type must be 'map' and there must be
            a required 'name' sub-property of type 'string'.  Name property values
            used for indexing must not contain spaces or special characters
            such as '%', '#', '/', or '\\'.
            The 'addressByName' feature should be considered experimental when
            applied to property sub-maps and is not recommended. It is fully supported when applied
            to the top level of a definition.
          default: false
        properties:
          type: array
          items:
            $ref: "#/components/schemas/definitionProperty"
          description: |
            (optional, default null).  When present, defines a potentially
            recursive list of sub-properties.  Only valid when type is 'map'.
            Not representable in OpenAPI.
    definitionRequest:
      description: >
        New versions of a DefinitionRequest must follow specific rules. A new version:

        * Must provide reasonable defaults for any new properties

        * Must NOT remove any properties

        * Must NOT change the semantic meaning of any existing properties

        * Must NOT change any of the metadata about the Definition.

        * The following changes ARE allowed in a new definitionVersion:

          * Modifying the label, description, or externalRestartRequired fields of
        the Definition itself

          * A one-time change to toggle addressByTenant from false to true (which
        will
        automatically also apply to all older definitionVersions)

          * Changing the services list to add additional services (Note that there
        may be special
        migration considerations for any existing configurations and this change also
        effectively
        applies to all older definitionVersions)

          * Changing the services list to empty, which means the definition is
        now global and could apply to any and all services (also affects older definitionVersions)

          * Adding new definition properties or sub-properties as long as they
        have either required = false or a valid defaultValue to substitute if
        the value was unspecified. If 'allowUserProperties' is true, then any
        newly added properties must be of type 'string'.

          * Modifying the label, description, or defaultValue of existing
        properties or sub-properties

        * Any changes to a property's defaultValue will not necessarily be applied
        when updating an existing deployment (depending on if a new default
        configuration is being bootstrapped and if a customer has already modified
        ANY property value in that default configuration)


        If any of these can not be followed then a new Definition must be
        created instead of versioning an existing Definition.


        By following these rules the server can freely translate any version of
        a config into any other version of that same config. Configs with new
        versions created by new clients are available to old clients and vice versa.
        The values persisted inside of the config are distinct from the version
        of the representation used by each client.


        Versions are just views projected onto the underlying config. Note that
        if a new client creates a config as a new version and then an old client
        replaces that config with a PUT or POST using the old version, then any new
        properties introduced by the new version will be unchanged.
      required:
      - version
      - definitionVersion
      - name
      - properties
      properties:
        version:
          type: integer
          description: |
            Version information for this definition meta-data format (must be 1).
          default: 1
        definitionVersion:
          type: integer
          description: The version of this Definition (becomes the media-type version).
          default: 1
        name:
          type: string
          description: |
            The name of this Definition.  Must contain only lowercase
            alphabetic characters or periods.
        label:
          type: string
          description: |
            (default null). The label to display for this type.
        description:
          type: string
          description: |
            (default "").  The description of the type.
        allowUserProperties:
          type: boolean
          description: >
            (default false).  When true, properties are not limited to
            the ones defined in this type.  UI should allow the input of
            additional name/value pairs.  Validation of these additional pairs is
            delegated to the services.  When this is true, all properties MUST
            be of type string and have 'allowUserValue' set to true. This ensures
            the ability to version this Definition.
          default: false
        addressByName:
          type: boolean
          description: |
            (default false).  When true, individual configs will be addressable
            by name. When addressByName is false there will only
            ever be one, unnamed, config of this definition type for any service.
            When true, there must be a required 'name' property of type 'string'.
            Name property values used for indexing must not contain spaces or
            special characters such as '%', '#', '/', or '\\'.
          default: false
        addressByTenant:
          type: boolean
          description: |
            (optional, default false).  When true, Configurations are assigned
            to a specific tenant or to an 'alltenants' default tenant.


            Configuration values in the 'alltenants' default tenant can only
            be directly viewed or modified while in the provider tenant.
            Customer tenants can create an override Configuration at any time.
            If a specific tenant does not have an override Configuration, then
            the values in the 'alltenants' default tenant will be applied.


            When 'addressByTenant' is false, the Definition and any Configurations
            are always only viewable or modifiable while in the provider tenant.
            The values automatically apply to all customer tenants and cannot
            be overridden or changed by a tenant.


            Configuration values for Definitions with 'addressByTenant' set to true
            cannot be Spring property injected via @Value. A @ConfigurationProperties
            bean can be used as a proxy in conjunction with the tenant-config-props
            library as long as the class and fields are not static or final.
            The bean and its values should always be accessed with get methods
            that can be proxied, and never directly by referencing private
            instance fields or other local or statically cached values.
          default: false
        externalRestartRequired:
          type: boolean
          description: |
            (optional, default false).   When true, changes to Configurations
            for this Definition will not be honored until the associated
            services are restarted via some external mechanism (script, manual
            restart, etc). This is primarily a documentation flag for
            notification via the UI. The actual refresh implementation is
            not affected by this flag.
          default: false
        services:
          type: array
          items:
            type: string
          description: |
            (default null).  When present, only the services in the
            list will ever see configs of this Definition type.  When null,
            this Definition type will be considered Global and all services
            will be able to create and see configuration instances of this
            Definition type.  This value for 'services' in the definition is the
            default that will be used for the 'services' property in a Config if
            there is no explicit value for 'services' in the incoming API
            request with that Config.
        properties:
          type: array
          items:
            $ref: "#/components/schemas/definitionProperty"
    definition:
      description: >
        New versions of a Definition must follow specific rules. A new version:

        * Must provide reasonable defaults for any new properties

        * Must NOT remove any properties

        * Must NOT change the semantic meaning of any existing properties

        * Must NOT change any of the metadata about the Definition.

        * The following changes ARE allowed in a new definitionVersion:

          * Modifying the label, description, or externalRestartRequired fields of
        the Definition itself

          * A one-time change to toggle addressByTenant from false to true (which
        will
        automatically also apply to all older definitionVersions)

          * Changing the services list to add additional services (Note that there
        may be special
        migration considerations for any existing configurations and this change also
        effectively
        applies to all older definitionVersions)

          * Changing the services list to empty, which means the definition is
        now global and could apply to any and all services (also affects older definitionVersions)

          * Adding new definition properties or sub-properties as long as they
        have either required = false or a valid defaultValue to substitute if
        the value was unspecified. If 'allowUserProperties' is true, then any
        newly added properties must be of type 'string'.

          * Modifying the label, description, or defaultValue of existing
        properties or sub-properties

        * Any changes to a property's defaultValue will not necessarily be applied
        when updating an existing deployment (depending on if a new default
        configuration is being bootstrapped and if a customer has already modified
        ANY property value in that default configuration)


        If any of these can not be followed then a new Definition must be
        created instead of versioning an existing Definition.


        By following these rules the server can freely translate any version of
        a config into any other version of that same config. Configs with new
        versions created by new clients are available to old clients and vice versa.
        The values persisted inside of the config are distinct from the version
        of the representation used by each client.


        Versions are just views projected onto the underlying config. Note that
        if a new client creates a config as a new version and then an old client
        replaces that config with a PUT or POST using the old version, then any new
        properties introduced by the new version will be unchanged.
      required:
      - version
      - definitionVersion
      - name
      - properties
      allOf:
      - $ref: "#/components/schemas/definitionRequest"
      - type: object
        properties:
          links:
            type: array
            items:
              $ref: "#/components/schemas/link"
            description: |
              A list of vnd.sas.link objects as per Link representation.
          id:
            type: string
            description: |
              The unique, server provided, opaque id of the Definition.
          createdBy:
            type: string
            description: The id of the user who created this Definition.
          modifiedBy:
            type: string
            description: The id of the user who last modified this Definition.
          creationTimeStamp:
            type: string
            format: date-time
            description: The timestamp when this Definition was created.
          modifiedTimeStamp:
            type: string
            format: date-time
            description: The timestamp when this Definition was last modified.
    configurationRequestMetadata:
      type: object
      description: Information that identifies this configuration request.
      required:
      - mediaType
      properties:
        isDefault:
          type: boolean
          description: |
            (default false).  When true, only create this config if one does not
            already exist with an isDefault value of false.  When addressByName
            is true, the 'name' property is used to detect existence. Can be used on GET to
            determine if this was a default value or an explicitly set value.


            Should be set to true by most bootstrapping tools or automation scripts.
            Should be set to false when a configuration is being updated by a
            customer via the UI, CLI, or script, if the values are to be
            preserved and not overwritten again by bootstrapping defaults.
          default: false
        services:
          type: array
          items:
            type: string
          description: |
            (default null).  When set, this Config is visible to the
            listed service names only. Any service names not also listed in the Definition
            'services' list will be ignored.


            If a Definition does not have a Global (empty) 'services' list, then
            an empty incoming 'services' list on a Config will be automatically
            converted to including all of the service names in the 'services' list
            of the Definition, at the time the Config is created.


            If a Definition does have a Global (empty) 'services' list, then a
            Config with an empty 'services' list is considered to be Global and will
            be visible and applicable to all services.
            If the Definition is Global, but the Config lists specific services,
            then only those services will see the values in this Config. Other
            services will see the values from the Global config (if there is one).
        tenant:
          type: string
          description: |
            (optional, default null) When set, this Config applies to the listed
            tenant only. Only valid if the associated Definition has
            addressByTenant=true.


            When 'tenant' is empty and the associated Definition has
            addressByTenant=false, this is considered a system configuration.
            It can only be viewed or modified by the provider tenant.
            It applies to all tenants and cannot be overridden.


            When 'tenant' is empty and the associated Definition has
            addressByTenant=true, this is considered an 'alltenants'
            default configuration. It can also only be viewed or
            modified by the provider tenant. It applies to any
            tenant that does not have an override configuration
            for this same definition, services, and addressableName
            (if applicable). Any tenant may create an override
            configuration, or in some cases a separate default
            configuration for each tenant may be bootstrapped by
            some services.
        mediaType:
          type: string
          description: >
            (default null). Required when this Configuration is part of
            a collection.  Identifies the Definition that defines this
            Configuration.  Always of the form:


            application/vnd.sas.configuration.config.{definitionName}+json;version={definitionVersion}
          default: application/vnd.sas.configuration.config.{definitionName}+json;version={definitionVersion}
    configurationMetadata:
      type: object
      description: Information that identifies this configuration and history.
      allOf:
      - $ref: "#/components/schemas/configurationRequestMetadata"
      - type: object
        properties:
          createdBy:
            type: string
            description: The id of the user who created this Configuration.
          modifiedBy:
            type: string
            description: The id of the user who last modified this Configuration.
          creationTimeStamp:
            type: string
            format: date-time
            description: The timestamp when this Configuration was created.
          modifiedTimeStamp:
            type: string
            format: date-time
            description: The timestamp when this Configuration was last modified.
    configurationProperties:
      description: |
        This has arbitrary properties and values based on an associated definition.
      properties:
        stringPropertyOneDefinedByTheAssociatedDefinition:
          type: string
          description: >
            OpenAPI3 cannot express the additional properties that can be added
            to objects of this type.
        booleanPropertyTwoDefinedByTheAssociatedDefinition:
          type: boolean
          description: >
            OpenAPI3 cannot express the additional properties that can be added
            to objects of this type.
        mapPropertyNineNineNineDefinedByTheAssociatedDefinition:
          type: object
          description: >
            OpenAPI3 cannot express the additional properties that can be added
            to objects of this type.
    configurationRequest:
      description: |
        This type is the actual instance of a config request. It is POSTed by an admin
        person or process. When bootstrapping a default configuration, often only the
        metadata.mediaType and metadata.services are specified (with metadata.isDefault = true
        as provided by the bootstrapping library).

        Any properties that are omitted that have defaultValues defined in the definitionVersion that
        matches the ";version=X" suffix of the metadata.mediaType will automatically receive
        the default values from that definitionVersion.

        Ensure that the metadata.mediaType version that gets bootstrapped matches the highest
        definitionVersion (assuming that is the desired definitionVersion), otherwise
        older default values from an older matching definitionVersion might be used.

        Any properties that are specified in the configuration request will take precedence
        over default values from the definition. However values from sitedefaults will
        still take precedence over configuration request values IF the
        metadata.isDefault = true flag is present. If metadata.isDefault = false
        then sitedefaults will be ignored.
      required:
      - metadata
      allOf:
      - $ref: "#/components/schemas/configurationProperties"
      - type: object
        properties:
          version:
            type: integer
            description: |
              Version information for this configuration meta-data format (if specified must be 1).
            default: 1
          id:
            type: string
            description: The unique, server provided, opaque id of the Config (only
              used in a PUT or PATCH by ID request).
          metadata:
            $ref: "#/components/schemas/configurationRequestMetadata"
    configuration:
      description: |
        This type is the actual instance of a config. It is read by the services.
      required:
      - version
      allOf:
      - $ref: "#/components/schemas/configurationProperties"
      - type: object
        properties:
          version:
            type: integer
            description: |
              Version information for this configuration meta-data format (must be 1).
            default: 1
          links:
            type: array
            items:
              $ref: "#/components/schemas/link"
            description: |
              A list of vnd.sas.link objects as per Link representation.
          id:
            type: string
            description: The unique, server provided, opaque id of the Config.
          metadata:
            $ref: "#/components/schemas/configurationMetadata"
    factRequest:
      description: |
        This type of request is used to express something about a service that can be used
        by other services in the deployment. It is not displayed to admin
        processes or people so it need not carry all the display related
        metadata. It is POSTed by services and read by services. Importantly,
        data reported as a fact must not be something that changes in response
        to a refresh from the Configuration Service. There is no way to
        guarantee the order in which services will refresh. Services that
        process the refresh event before the fact is updated will get the old
        value. There may not be another refresh event for a long time. Data that
        is static to the service or changes in response to something other than
        a refresh event is appropriate to be a fact.
      required:
      - version
      - service
      - name
      - value
      properties:
        version:
          type: integer
          description: |
            Version information for this fact meta-data format (must be 1).
          default: 1
        service:
          type: string
          description: The service providing this fact.
        name:
          type: string
          description: The name of the fact.
        value:
          type: string
          description: The value of this fact.
    fact:
      description: |
        This type is used to express something about a service that can be used
        by other services in the deployment. It is not displayed to admin
        processes or people so it need not carry all the display related
        metadata. It is POSTed by services and read by services. Importantly,
        data reported as a fact must not be something that changes in response
        to a refresh from the Configuration Service. There is no way to
        guarantee the order in which services will refresh. Services that
        process the refresh event before the fact is updated will get the old
        value. There may not be another refresh event for a long time. Data that
        is static to the service or changes in response to something other than
        a refresh event is appropriate to be a fact.
      required:
      - version
      - service
      - name
      - value
      type: object
      properties:
        version:
          type: integer
          description: |
            Version information for this fact.
          default: 1
        service:
          type: string
          description: The service for this fact.
        name:
          type: string
          description: The name of the fact.
        value:
          type: string
          description: The value of this fact.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: |
            A list of vnd.sas.link objects as per Link representation.
        id:
          type: string
          description: The unique, server provided, opaque id of the Fact.
        createdBy:
          type: string
          description: The id of the user who created this Fact.
        modifiedBy:
          type: string
          description: The id of the user who last modified this Fact.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp when this Fact was created.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp when this Fact was last modified.
    error2:
      type: object
      description: A standard error object.
      required:
      - version
      properties:
        version:
          type: integer
          description: |
            Version information for this error format (integer, value 2).
          default: 2
        id:
          type: string
          description: |
            Optional error identifier string.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: |
            A list of vnd.sas.link objects as per Link representation.
        errorCode:
          type: integer
          format: int64
          description: |
            The system error code for reference (64-bit integer), often used for
            correlation with back-end service error message identifiers.
            Services should reserve a range in error code ranges and list
            specific error codes in error codes.
        httpStatusCode:
          type: integer
          description: |
            The HTTP status code error number (integer), 1xx, 2xx, 3xx, 4xx, or
            5xx values.
        message:
          type: string
          description: |
            The back end system error message string. The message should be
            localized as per the Accept-Language of the request.
        details:
          type: array
          items:
            type: string
          description: |
            Detailed information specific to this error; a list of strings. If
            appropriate, these strings should be localized as per the
            Accept-Language of the request.
        remediation:
          type: array
          items:
            type: string
          description: |
            Recommended actions to resolve the error; a list of strings. The
            remediation string should be localized as per the Accept-Language of
            the request.
        errors:
          type: array
          items:
            type: string
          description: |
            An array of nested error objects.
