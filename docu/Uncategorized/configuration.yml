    delete:
      tags:
      - Configurations
      summary: |
        Delete the {configurationId} Configuration.
      description: Deletes the specified configuration.
      operationId: deleteConfiguration
      parameters:
      - name: configurationId
        required: true
        in: path
        description: The id of the Configuration.
        schema:
          type: string
      responses:
        "204":
          description: |
            Success.  No content.
        "404":
          description: "{configurationId} not found. (No content returned)"
  /facts:
    get:
      tags:
      - Facts
      summary: |
