      - Configurations
      summary: Create a new Configuration
      description: |
        This endpoint allows a caller to create a new Configuration object.
        The Configuration will be validated against its associated Definition.

        IMPORTANT: The Content-Type must either be a valid versioned media
        type that is associated with an existing version of a definition,
        or the base (wildcard) "application/vnd.sas.configuration.config+json",
        where the metadata.mediaType in the request body specifies the definition
        and version. A Content-Type of application/json will never trigger this
        postConfigurations#single operation. Instead, such a request will route
        to the postConfigurations operation, where the request body will be treated
        as application/vnd.sas.collection+json.

        IMPORTANT: Refer to the description of the metadata.isDefault field for
        the effective behavior when the incoming request has metadata.isDefault = true
        and there is a matching existing Configuration with metadata.isDefault = false,
        then the current request will be ignored, as designed, and a 204 Unchanged
        status returned.

        Customer modifications to configurations that are intended to be
        persistent and NOT reverted back to defaults should always explicitly
        set metadata.isDefault = false (which happens automatically when using
        the SAS Environment Manager UI, but must be properly managed in the
        JSON body when using the CLI or direct REST calls).

        Any existing singleton
        Configurations (addressByName and list in the associated Definition are false)
        will be overwritten by a new Configuration for that Definition.  Any
        existing addressByName Configurations (addressByName in the associated
        Definition is true) will be overwritten by a new Configuration for
        that Definition if they have the same name.  In all other cases, the
        new Configuration will be created.

        Note that the media type produced
        by this endpoint can depend on the definition that the configuration
        was created for.  For example, if a definition is created with
        name=test and definitionVersion=2, then a configuration object created
        for that definition will be produced with media type
        application/vnd.sas.configuration.config.test+json;version=2.

