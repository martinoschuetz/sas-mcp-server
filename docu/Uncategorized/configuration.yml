                type: string
          content:
            application/vnd.sas.configuration.fact+json;version=1:
              schema:
                $ref: "#/components/schemas/fact"
              examples:
                fact:
                  $ref: "#/components/examples/postFactSingleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/fact"
              examples:
                fact:
                  $ref: "#/components/examples/postFactSingleResponse"
        "201":
          description: |
            The newly created Fact object.
          headers:
            Last-Modified:
              description: |
                The ISO8601 timestamp representing the last time this
                Fact was updated.
              schema:
                type: string
            Etag:
              description: |
                A tag that identifies this revision of this Fact.
              schema:
                type: string
            Location:
              description: The URI of the new resource.
              schema:
                type: string
          content:
            application/vnd.sas.configuration.fact+json;version=1:
              schema:
                $ref: "#/components/schemas/fact"
              examples:
                fact:
                  $ref: "#/components/examples/postFactSingleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/fact"
              examples:
                fact:
                  $ref: "#/components/examples/postFactSingleResponse"
        "204":
          description: |
            Success.  No content. The resource already existed and was
