                facts:
                  $ref: "#/components/examples/getFactsResponse"
    post:
      tags:
      - Facts
      summary: Create several new Facts
      description: |
        This endpoint allows a caller (in the provider tenant only) to create
        new Fact objects.  A Fact describes something static about a Service
        that can be injected into another Service via Spring Property Injection.
        Facts should be considered part of a Service's public API.  New Fact values will
        replace any existing fact value for the same service.  The items in
        the provided collection must be
        application/vnd.sas.configuration.fact+json;version=1 objects.
        This operation no longer supports requests or responses of transfer objects
        (application/vnd.sas.transfer.object+json;version=1).
        This operation no longer supports suppressing the response body by using
        application/vnd.sas.empty.
      operationId: createFacts
