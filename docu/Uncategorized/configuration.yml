          application/json:
            schema:
              $ref: "#/components/schemas/factRequestCollectionRequest"
            examples:
              singleFact:
                $ref: "#/components/examples/postFactsRequest"
        description: A collection of Fact objects.
        required: true
      responses:
        "200":
          description: |
            Some resources were modified or created, while others
            may have been unchanged.  All are returned as a
            collection of Fact objects.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/factCollection"
              examples:
                facts:
                  $ref: "#/components/examples/postFactsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/factCollection"
              examples:
                facts:
                  $ref: "#/components/examples/postFactsResponse"
        "201":
          description: |
            All resources were newly created and returned as a
            collection of created Fact objects.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/factCollection"
              examples:
                facts:
                  $ref: "#/components/examples/postFactsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/factCollection"
              examples:
                facts:
                  $ref: "#/components/examples/postFactsResponse"
        "204":
          description: |
            Success.  No content. All resources already existed and are
            unchanged by this request.
        "400":
          description: |
            Bad Request.  Details will be in the returned error object.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/genericBadRequestResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/genericBadRequestResponse"
  /facts#single:
    post:
      tags:
      - Facts
      summary: Create a new Fact
      description: |
        This endpoint allows a caller (in the provider tenant only) to create a
        new Fact object.  A Fact describes something static about a Service that
        can be injected into another Service via Spring Property Injection.
        Facts should be considered part of a Service's public API.  A new Fact value will
        replace any existing fact value for the same service.
        This operation no longer supports suppressing the response body by using
        application/vnd.sas.empty.
      operationId: createFact
      requestBody:
        content:
          application/vnd.sas.configuration.fact+json;version=1:
            schema:
              $ref: "#/components/schemas/factRequest"
            examples:
              fact:
                $ref: "#/components/examples/postFactSingleRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/factRequest"
            examples:
              fact:
                $ref: "#/components/examples/postFactSingleRequest"
        description: A single Fact object.
        required: true
      responses:
        "200":
          description: |
            A modified Fact object.
          headers:
            Last-Modified:
