---
openapi: 3.0.3
info:
  title: SAS Configuration
  description: Manages changes to the configuration of services.
  version: "7"
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
externalDocs:
  description: Developer documentation
  url: https://developer.sas.com
servers:
- url: http://example.com/configuration
  description: This is an example base URL.
tags:
- name: Definitions
  description: Configuration definitions.
- name: Configurations
  description: Configuration instances.
- name: Facts
  description: Service facts.
- name: Current
  description: Current configuration names and values.
- name: Root
  description: The operations for the root resource.
- name: Deprecated
  description: Operations that have been deprecated and will be removed in a future
    release.
paths:
  /:
    get:
      tags:
      - Root
      summary: |
        Root endpoint.
      description: |
        Get links representing the entry endpoints of this service.
      operationId: root
      responses:
        "200":
          description: An api object.
          content:
            application/vnd.sas.api+json;version=1:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/getRootResponse"
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/getRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/getRootResponse"
  /definitions:
    get:
      tags:
      - Definitions
      summary: |
        Get a collection of Definitions.
      description: |
        The items in the returned collection will be
        application/vnd.sas.configuration.definition+json;version=1 objects.

        A non-provider tenant will only see definitions that have addressByTenant=true.

        Transfer objects are no longer supported by this operation.
      operationId: getDefinitions
      parameters:
      - $ref: "#/components/parameters/nameQueryParam"
      - $ref: "#/components/parameters/definitionVersionQueryParam"
      responses:
        "200":
          description: A collection of Definition objects.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                definition:
                  $ref: "#/components/examples/postDefinitionsFullResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                definition:
                  $ref: "#/components/examples/postDefinitionsFullResponse"
    post:
      tags:
      - Definitions
      summary: Create several new Definitions
      description: |
        This endpoint allows a caller (in the provider tenant only) to create Definitions of Configurations.
        These Definitions will be used to generate a UI for creating
        Configuration instances.

        It is an error to attempt to change an
        existing version of a Definition but exact duplicates or changes in
        only fields such as label, description, defaultValue, and externalRestartRequired
        will be ignored.

        Refer to the definition and definitionProperty schema model for additional
        information about what is allowed to change in a new definitionVersion.

        The items in the provided collection must be
        application/vnd.sas.configuration.definition+json;version=1 objects.

        This operation no longer supports requests or responses of transfer objects
        (application/vnd.sas.transfer.object+json;version=1).
        This operation no longer supports suppressing the response body by using
        application/vnd.sas.empty.
      operationId: createDefinitions
      requestBody:
        content:
          application/vnd.sas.collection+json;version=2:
            schema:
              $ref: "#/components/schemas/definitionRequestCollectionRequest"
            examples:
              fullDefinition:
                $ref: "#/components/examples/postDefinitionsFullRequest"
              multipleDefinitionVersions:
                $ref: "#/components/examples/postDefinitionsMultipleDefinitionVersionsRequest"
              multipleServicesDefinition:
                $ref: "#/components/examples/postDefinitionsMultipleServicesRequest"
              addressByNameDefinition:
                $ref: "#/components/examples/postDefinitionsAddressByNameRequest"
              allowUserPropertiesDefinition:
                $ref: "#/components/examples/postDefinitionsAllowUserPropertiesRequest"
              global:
                $ref: "#/components/examples/postDefinitionsGlobalRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/definitionRequestCollectionRequest"
            examples:
              fullDefinition:
                $ref: "#/components/examples/postDefinitionsFullRequest"
              multipleDefinitionVersions:
                $ref: "#/components/examples/postDefinitionsMultipleDefinitionVersionsRequest"
              multipleServicesDefinition:
                $ref: "#/components/examples/postDefinitionsMultipleServicesRequest"
              addressByNameDefinition:
                $ref: "#/components/examples/postDefinitionsAddressByNameRequest"
              allowUserPropertiesDefinition:
                $ref: "#/components/examples/postDefinitionsAllowUserPropertiesRequest"
              globalDefinition:
                $ref: "#/components/examples/postDefinitionsGlobalRequest"
        description: A collection of Definition objects.
        required: true
      responses:
        "200":
          description: |
            Some resources were modified or created, while others
            may have been unchanged.  All are returned as a
            collection of Definition objects.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                fullDefinition:
                  $ref: "#/components/examples/postDefinitionsFullResponse"
                multipleDefinitionVersions:
                  $ref: "#/components/examples/postDefinitionsMultipleDefinitionVersionsResponse"
                multipleServicesDefinition:
                  $ref: "#/components/examples/postDefinitionsMultipleServicesResponse"
                addressByNameDefinition:
                  $ref: "#/components/examples/postDefinitionsAddressByNameResponse"
                allowUserPropertiesDefinition:
                  $ref: "#/components/examples/postDefinitionsAllowUserPropertiesResponse"
                globalDefinition:
                  $ref: "#/components/examples/postDefinitionsGlobalResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                fullDefinition:
                  $ref: "#/components/examples/postDefinitionsFullResponse"
                multipleDefinitionVersions:
                  $ref: "#/components/examples/postDefinitionsMultipleDefinitionVersionsResponse"
                multipleServicesDefinition:
                  $ref: "#/components/examples/postDefinitionsMultipleServicesResponse"
                addressByNameDefinition:
                  $ref: "#/components/examples/postDefinitionsAddressByNameResponse"
                allowUserPropertiesDefinition:
                  $ref: "#/components/examples/postDefinitionsAllowUserPropertiesResponse"
                globalDefinition:
                  $ref: "#/components/examples/postDefinitionsGlobalResponse"
        "201":
          description: |
            All resources were newly created and returned as a
            collection of created Definition objects.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                fullDefinition:
                  $ref: "#/components/examples/postDefinitionsFullResponse"
                multipleDefinitionVersions:
                  $ref: "#/components/examples/postDefinitionsMultipleDefinitionVersionsResponse"
                multipleServicesDefinition:
                  $ref: "#/components/examples/postDefinitionsMultipleServicesResponse"
                addressByNameDefinition:
                  $ref: "#/components/examples/postDefinitionsAddressByNameResponse"
                allowUserPropertiesDefinition:
                  $ref: "#/components/examples/postDefinitionsAllowUserPropertiesResponse"
                globalDefinition:
                  $ref: "#/components/examples/postDefinitionsGlobalResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/definitionCollection"
              examples:
                fullDefinition:
                  $ref: "#/components/examples/postDefinitionsFullResponse"
                multipleDefinitionVersions:
                  $ref: "#/components/examples/postDefinitionsMultipleDefinitionVersionsResponse"
                multipleServicesDefinition:
                  $ref: "#/components/examples/postDefinitionsMultipleServicesResponse"
                addressByNameDefinition:
                  $ref: "#/components/examples/postDefinitionsAddressByNameResponse"
                allowUserPropertiesDefinition:
                  $ref: "#/components/examples/postDefinitionsAllowUserPropertiesResponse"
                globalDefinition:
                  $ref: "#/components/examples/postDefinitionsGlobalResponse"
        "204":
          description: |
            Success.  No content. All resources already existed and are
            unchanged by this request.
        "400":
          description: |
            Bad Request.  Details will be in the returned error object.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/genericBadRequestResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/genericBadRequestResponse"
  /definitions#single:
    post:
      tags:
      - Definitions
      summary: Create a new Definition
      description: |
        This endpoint allows a caller (in the provider tenant only) to create a Definition of
        a Configuration.  This Definition will be used to generate a UI for
        creating Configuration instances.

        It is an error to attempt to change
        an existing Definition but exact duplicates will be ignored.

        This operation no longer supports suppressing the response body by using
        application/vnd.sas.empty.
      operationId: createDefinition
      requestBody:
        content:
          application/vnd.sas.configuration.definition+json;version=1:
            schema:
              $ref: "#/components/schemas/definitionRequest"
            examples:
              singleDefinition:
                $ref: "#/components/examples/postDefinitionsSingleRequest"
        description: A single Definition object.
        required: true
      responses:
        "200":
          description: |
            The modified Definition object.
          headers:
            Last-Modified:
              description: |
                The ISO8601 timestamp representing the last time this
                Definition was updated.
              schema:
                type: string
            Etag:
              description: |
                A tag that identifies this revision of this Definition.
              schema:
                type: string
            Location:
              description: The URI of the modified resource.
              schema:
                type: string
          content:
            application/vnd.sas.configuration.definition+json;version=1:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                singleDefinition:
                  $ref: "#/components/examples/postDefinitionsSingleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                singleDefinition:
                  $ref: "#/components/examples/postDefinitionsSingleResponse"
        "201":
          description: |
            The newly created Definition object.
          headers:
            Last-Modified:
              description: |
                The ISO8601 timestamp representing the last time this
                Definition was updated.
              schema:
                type: string
            Etag:
              description: |
                A tag that identifies this revision of this Definition.
              schema:
                type: string
            Location:
              description: The URI of the new resource.
              schema:
                type: string
          content:
            application/vnd.sas.configuration.definition+json;version=1:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                singleDefinition:
                  $ref: "#/components/examples/postDefinitionsSingleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                singleDefinition:
                  $ref: "#/components/examples/postDefinitionsSingleResponse"
        "204":
          description: |
            Success.  No content. The resource already existed and was
            unchanged by this request.
        "400":
          description: |
            Bad Request.  Details will be in the returned error object.
          content:
            application/vnd.sas.configuration.definition+json;version=1:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/genericBadRequestResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/genericBadRequestResponse"
  "/definitions/{definitionId}":
    head:
      tags:
      - Definitions
      summary: Get the headers and status for the {definitionId} Definition
      description: Returns the headers for the specified definition. Also used to
        determine whether a particular definition exists.
      operationId: headersForDefinition
      parameters:
      - name: definitionId
        required: true
        in: path
        description: The id of the Definition.
        schema:
          type: string
      responses:
        "200":
          description: OK.
          headers:
            Last-Modified:
              description: |
                The ISO8601 timestamp representing the last time this
                Definition was updated.
              schema:
                type: string
            Etag:
              description: |
                A tag that identifies this revision of this Definition.
              schema:
                type: string
        "404":
          description: "{definitionId} not found."
    get:
      tags:
      - Definitions
      summary: Get the {definitionId} Definition
      description: |
        Returns the representation of the specified definition.

        A non-provider tenant can only retrieve a definition that
        has addressByTenant = true.
      operationId: getDefinition
      parameters:
      - name: definitionId
        required: true
        in: path
        description: The id of the Definition.
        schema:
          type: string
      responses:
        "200":
          description: The {definitionId} Definition object.
          headers:
            Last-Modified:
              description: |
                The ISO8601 timestamp representing the last time this
                Definition was updated.
              schema:
                type: string
            Etag:
              description: |
                A tag that identifies this revision of this Definition.
              schema:
                type: string
          content:
            application/vnd.sas.configuration.definition+json;version=1:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                definitionById:
                  $ref: "#/components/examples/postDefinitionsSingleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/definition"
              examples:
                definitionById:
                  $ref: "#/components/examples/postDefinitionsSingleResponse"
        "404":
          description: "{definitionId} not found."
          content:
            application/vnd.sas.configuration.definition+json;version=1:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/genericNotFoundResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                notFound:
                  $ref: "#/components/examples/genericNotFoundResponse"
  /configurations:
    get:
      tags:
      - Configurations
      summary: |
        Get a collection of Configurations.
      description: |
        The items in the returned collection will be configuration objects
        with types determined by the corresponding definition for each object.

        This operation no longer supports the tenantScope query parameter.
      operationId: getConfigurations
      parameters:
      - name: Accept-Item
        in: header
        description: |
          Item type inside the collection.  Multiple, space delimited, values
          allowed.

          If the Accept-Item value is the literal string "latest" or
          "application/json" then all objects will be converted to their latest
          representation based on the matching definition with the highest definitionVersion.

          If the Accept-Item header is omitted or includes the value "*/*" or
          "application/vnd.sas.configuration.config+json", then any object without
          another matching Accept-Item media-type for a requested definitionVersion
          will return a representation based on how that configuration object
          was originally created (even if that is no longer the latest definitionVersion).

          Note that the media type produced by this endpoint for the items inside the
          collection depends on the definition that the configuration was
          created for.  For example, if a definition is created with name=test
          and definitionVersion=2, then a configuration object created for
          that definition will be produced with media type
          application/vnd.sas.configuration.config.test+json;version=2.
        schema:
          type: string
          default: application/vnd.sas.configuration.config.{definitionName}+json;version={definitionVersion}
      - $ref: "#/components/parameters/serviceQueryParam"
      - $ref: "#/components/parameters/definitionNameQueryParam"
      - $ref: "#/components/parameters/isDefaultQueryParam"
      - $ref: "#/components/parameters/isGlobalConfigQueryParam"
      - $ref: "#/components/parameters/hasBeenModifiedQueryParam"
      responses:
        "200":
          description: A collection of Config objects.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
                fullConfiguration:
                  $ref: "#/components/examples/postConfigurationsFullResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
                fullConfiguration:
                  $ref: "#/components/examples/postConfigurationsFullResponse"
        "400":
          description: |
            Bad Request. Invalid query parameter values. Details will be in the returned error object.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/genericBadRequestResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/genericBadRequestResponse"
    post:
      tags:
      - Configurations
      summary: Create several new Configurations
      description: |
        This endpoint allows a caller to create new Configuration objects.
        The Configuration objects will be validated against their associated
        Definitions.

        IMPORTANT: The same rules for overwriting when POSTing a single
        Configuration apply to POSTing a collection (refer to the
        metadata.isDefault field).

        Bootstrapping of default configurations should always be using
        metadata.isDefault = true (which happens automatically for Java
        services using the configuration-bootstrap library, or Golang services
        using the sonder bootstrap-tool).

        Customer modifications to configurations that are intended to be
        persistent and NOT reverted back to defaults should always explicitly
        set metadata.isDefault = false (which happens automatically when using
        the SAS Environment Manager UI, but must be properly managed in the
        JSON body when using the CLI or direct REST calls).

        The items in the returned collection will be in the  same representation
        as they are in the request.

        This operation no longer supports suppressing the response body by using
        application/vnd.sas.empty.
      operationId: createConfigurations
      parameters:
      - $ref: "#/components/parameters/forceQueryParam"
      requestBody:
        content:
          application/vnd.sas.collection+json;version=2:
            schema:
              $ref: "#/components/schemas/configurationRequestCollectionRequest"
            examples:
              fullConfiguration:
                $ref: "#/components/examples/postConfigurationsFullRequest"
              minimalConfiguration:
                $ref: "#/components/examples/postConfigurationsMinimalRequest"
              loggingLevelConfiguration:
                $ref: "#/components/examples/postConfigurationsLoggingLevelRequest"
              multipleConfigurations:
                $ref: "#/components/examples/postConfigurationsMultipleRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/configurationRequestCollectionRequest"
            examples:
              fullConfiguration:
                $ref: "#/components/examples/postConfigurationsFullRequest"
              minimalConfiguration:
                $ref: "#/components/examples/postConfigurationsMinimalRequest"
              loggingLevelConfiguration:
                $ref: "#/components/examples/postConfigurationsLoggingLevelRequest"
              multipleConfigurations:
                $ref: "#/components/examples/postConfigurationsMultipleRequest"
        description: A collection of Configuration request objects.
        required: true
      responses:
        "200":
          description: |
            Some resources were modified or created, while others
            may have been unchanged.  All are returned as a
            collection of Configuration objects.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
                fullConfiguration:
                  $ref: "#/components/examples/postConfigurationsFullResponse"
                minimalConfiguration:
                  $ref: "#/components/examples/postConfigurationsMinimalResponse"
                loggingLevelConfiguration:
                  $ref: "#/components/examples/postConfigurationsLoggingLevelResponse"
                multipleConfigurations:
                  $ref: "#/components/examples/postConfigurationsMultipleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
                fullConfiguration:
                  $ref: "#/components/examples/postConfigurationsFullResponse"
                minimalConfiguration:
                  $ref: "#/components/examples/postConfigurationsMinimalResponse"
                loggingLevelConfiguration:
                  $ref: "#/components/examples/postConfigurationsLoggingLevelResponse"
                multipleConfigurations:
                  $ref: "#/components/examples/postConfigurationsMultipleResponse"
        "201":
          description: |
            All resources were newly created and returned as a
            collection of created Configuration objects.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
                fullConfiguration:
                  $ref: "#/components/examples/postConfigurationsFullResponse"
                minimalConfiguration:
                  $ref: "#/components/examples/postConfigurationsMinimalResponse"
                loggingLevelConfiguration:
                  $ref: "#/components/examples/postConfigurationsLoggingLevelResponse"
                multipleConfigurations:
                  $ref: "#/components/examples/postConfigurationsMultipleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
                fullConfiguration:
                  $ref: "#/components/examples/postConfigurationsFullResponse"
                minimalConfiguration:
                  $ref: "#/components/examples/postConfigurationsMinimalResponse"
                loggingLevelConfiguration:
                  $ref: "#/components/examples/postConfigurationsLoggingLevelResponse"
                multipleConfigurations:
                  $ref: "#/components/examples/postConfigurationsMultipleResponse"
        "204":
          description: |
            Success.  No content. All resources already existed and are
            unchanged by this request. Either the values were an
            exact match AND/OR the existing resource(s) had the flag
            metadata.isDefault=false and the corresponding incoming
            resource(s) had the flag metadata.isDefault=true (which
            triggers the expected desired behavior to ignore the
            incoming defaults and leave unchanged the existing
            non-default resources).
        "400":
          description: |
            Bad Request.  Details will be in the returned error object.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/genericBadRequestResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                badRequest:
                  $ref: "#/components/examples/genericBadRequestResponse"
    patch:
      tags:
      - Configurations
      summary: Update or create a collection of Configurations
      description: |
        This operation allows a caller to create or modify Configuration objects.
        The body of the request must be a SAS collection containing one or more
        Configuration patch items.

        # Partial Property Patching

        This type of patch specifies a set of (non-metadata) configuration properties
        to be updated if an existing Configuration is found. Each Configuration
        patch item must contain enough metadata to uniquely identify the target.

        If no existing Configuration is found, then a new Configuration will be
        created using the remaining default values from the definition.

        If the existing Configuration has metadata.isDefault=false, and the incoming
        patch item has metadata.isDefault=true, then the incoming patch item will
        be skipped.

        Otherwise, the properties specified in the incoming patch item will replace
        the corresponding properties in the target Configuration. Other existing
        properties will be unchanged.

        Customer modifications to configurations that are intended to be
        persistent and NOT reverted back to defaults should always explicitly
        set metadata.isDefault = false (which happens automatically when using
        the SAS Environment Manager UI, but must be properly managed in the
        JSON body when using the CLI or direct REST calls).

        # Service Patching with a Single Definition Name

        This type of patch allows callers to expand a list of services in an existing
        Configuration when they provide the corresponding definition name and version
        in metadata.mediaType. This type of patch must not specify any (non-metadata)
        configuration properties.

        If metadata.services is omitted, the incoming request will act as if it has
        all of the possible services from the corresponding definition version. If
        an existing Configuration is found and it has a smaller subset of the effective
        incoming services list, then the existing Configuration will be modified to
        match the incoming service list. Other existing configuration properties
        will be unchanged.

        If the existing Configuration has metadata.isDefault=false, and the incoming
        patch item has metadata.isDefault=true, the service expansion will still occur.

        # Service Patching with a Wildcard Definition Name

        This type of patch allows callers to expand a list of services in multiple
        existing configurations where each target Configuration contains a proper
        subset of the specified list of services in the patch item. This type of
        patch item must include the full list of services in metadata.services.
        The patch item must specify "application/vnd.sas.configuration.config+json"
        for its metadata.mediaType (with no version suffix). The patch item must
        not specify any (non-metadata) configuration properties.

        This request is processed by scanning all existing configurations that
        contain at least one of the incoming service names. Each candidate
        Configuration will be evaluated to see if its existing list of services
        is a proper subset of the incoming list of services (no extra existing
        services). If so, the existing Configuration will be modified to match
        the full list of incoming services.

        If the existing Configuration has metadata.isDefault=false, and the incoming
        patch item has metadata.isDefault=true, the service expansion will still occur.
      operationId: patchConfigurations
      requestBody:
        content:
          application/vnd.sas.collection+json;version=2:
            schema:
              $ref: "#/components/schemas/configurationRequestCollectionRequest"
            examples:
              partialPropertyPatch:
                $ref: "#/components/examples/patchConfigurationsPartialPropertyRequest"
              servicePatchWithSingleDefinitionName:
                $ref: "#/components/examples/patchConfigurationsServiceWithSingleDefinitionNameRequest"
              servicePatchWithWildcardDefinitionName:
                $ref: "#/components/examples/patchConfigurationsServiceWithWildcardDefinitionNameRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/configurationRequestCollectionRequest"
            examples:
              partialPropertyPatch:
                $ref: "#/components/examples/patchConfigurationsPartialPropertyRequest"
              servicePatchWithSingleDefinitionName:
                $ref: "#/components/examples/patchConfigurationsServiceWithSingleDefinitionNameRequest"
              servicePatchWithWildcardDefinitionName:
                $ref: "#/components/examples/patchConfigurationsServiceWithWildcardDefinitionNameRequest"
        description: A collection of Configuration request objects.
        required: true
      responses:
        "200":
          description: |
            Some resources were modified or created, while others
            may have been unchanged.  All are returned as a
            collection of Configuration objects.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
                partialPropertyPatch:
                  $ref: "#/components/examples/patchConfigurationsPartialPropertyResponse"
                servicePatchWithSingleDefinitionName:
                  $ref: "#/components/examples/patchConfigurationsServiceWithSingleDefinitionNameResponse"
                servicePatchWithWildcardDefinitionName:
                  $ref: "#/components/examples/patchConfigurationsServiceWithWildcardDefinitionNameResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
                partialPropertyPatch:
                  $ref: "#/components/examples/patchConfigurationsPartialPropertyResponse"
                servicePatchWithSingleDefinitionName:
                  $ref: "#/components/examples/patchConfigurationsServiceWithSingleDefinitionNameResponse"
                servicePatchWithWildcardDefinitionName:
                  $ref: "#/components/examples/patchConfigurationsServiceWithWildcardDefinitionNameResponse"
        "201":
          description: |
            All resources were newly created and returned as a
            collection of created Configuration objects.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
                partialPropertyPatch:
                  $ref: "#/components/examples/patchConfigurationsPartialPropertyResponse"
                servicePatchWithSingleDefinitionName:
                  $ref: "#/components/examples/patchConfigurationsServiceWithSingleDefinitionNameResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
