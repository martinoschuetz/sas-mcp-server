components:
  schemas:
    run:
      title: Run
      description: The KRM Run definition.  This object exists to tie together the
        Cirrus analysis run object and the KRM job & KRM run objects that are run
        on the behalf of the analysis run.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
        analysisDataId:
          type: string
          title: Portfolio data identifer
          description: Key of the portfolio analysis data to be used for the run.
          example: c20ee7f9-8a33-4416-8189-fb90ec9bb18d
        analysisId:
          type: string
          title: Run identifier.
          description: |
            The identifier of the analysis run object that this run wraps.

            This is a system assigned identifier of the analysis run object.
          example: 16372757e-011d-454d-905b-eb10b4a9e5a9
        reports:
          type: array
          title: Post-execution reports
          description: Post-execution report scripts for this run
          items:
            type: object
            properties:
              label:
                type: string
              value:
                type: string
          example:
          - label: "report1"
            value: "850cb033-bdfa-4a0e-b615-9f9a2d5a48c5"
        krmJobStatusCode:
          type: string
          title: The status code from running the KRM job for the analysis run.
          description: |
            A single character status code that represents the current status of the KRM job that was run for the analysis run.

            Valid values are:
             - S: Submitted
             - A: Accepted
             - R: Rejected
             - P: Processing
             - C: Completed
             - T: Terminate
             - ?: Unknown

            .
          example: C
          readOnly: true
        keepKrmRun:
          type: boolean
          title: Keep KRM Run and Outputs
          description: |
            Flag to indicate if the KRM Run and its outputs should be kept after is finishes executing.

            When not specified, defaults to false.
          example: true
        discardKrmADOOutputTables:
          type: boolean
          title: Discard KRM Analysis Data Object tables
          description: |
            Flag to indicate if the KRM output tables should be discarded.  If this is set to true,
            the KRM output tables will not be persisted as Cirrus analysis data objects.

            When not specified, defaults to false.
          example: true
        calculationType:
          type: integer
          title: Calculation Type
          description: See KRM doc.
          example: 1
        currentDate:
          type: string
          title: Current Date
          description: See KRM doc.
          example: "2021-11-08T00:00:00Z"
        marketDate:
          type: string
          title: Market Date
          description: See KRM doc.
          example: "2021-11-08T00:00:00Z"
        valuationDate:
          type: string
          title: Valuation Date
          description: See KRM doc.
          example: "2021-11-08T00:00:00Z"
        riskMethod:
          type: integer
          title: Risk Method
          description: See KRM doc.
          example: 1
        simMethod:
          type: integer
          title: Sim Method
          description: See KRM doc.
          example: 1
        productSet:
          type: string
          title: Product Set
          description: See KRM doc.
          example: x
        baseCurrency:
          type: string
          title: Base Currency
          description: See KRM doc.
          example: USD
        runStatus:
          type: integer
