    calibrationRun:
      title: Calibration Run
      description: The KRM Calibration Run definition.  This object exists to tie
        together the Cirrus analysis run object and the KRM job & KRM run objects
        that are run on the behalf of the analysis run.
      type: object
      properties:
        analysisDataId:
          type: string
          title: Portfolio data identifer
          description: Key of the portfolio analysis data to be used for the run.
          example: ""
        analysisId:
          type: string
          title: Run identifier.
          description: |
            The identifier of the analysis run object that this run wraps.
            This is a system assigned identifier of the analysis run object.
          example: 1253efe2-1a31-429c-bff2-1831476956ec
        sessionId:
          type: string
          title: KRM session identifier.
          description: The KRM session ID for the calibration run
          example: run00001
        description:
          type: string
          description: The KRM calibration run description
          example: Calibration run
        sessionType:
          type: integer
          title: Session Type
          description: See KRM doc.
          example: 3
        calcId:
          type: string
          title: Calculation identifier.
          description: See KRM doc.
          example: YC_Y01
        fltrId:
          type: string
          description: See KRM doc.
          example: x
        ycFltrId:
          type: string
          description: See KRM doc.
          example: x
        msgErrorFlag:
          type: integer
          description: See KRM doc.
          example: 1
        msgWarnFlag:
          type: integer
          description: See KRM doc.
          example: 1
        msgInfoFlag:
          type: integer
          description: See KRM doc.
          example: 1
        msgDiagFlag:
          type: integer
          description: See KRM doc.
          example: 1
        msgSqlFlag:
          type: integer
          description: See KRM doc.
          example: 0
        curDt:
          type: string
          description: See KRM doc.
          example: 2024-08-19T14:48:51.615500Z
    code:
      title: Code
      description: A descriptive code (i.e. a code value and a description).
      type: object
      properties:
        code:
          type: string
          description: The value of the code.
          example: USD
        description:
          type: string
          description: The description of the code.
          example: US Dollars
        typeId:
          type: string
          description: The KRM type ID of the code.
          example: PSI
    codes:
      title: Codes
      description: This is a collection of code objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        readOnly: true
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/code"
    selectableReport:
      title: Report
      description: A selectable report referring to a script that can be run that
        acts as a report.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
        key:
          type: string
          description: The key value of the script object that can be run as a report
            for the given calcType and riskMethod values.
          example: 91480245-ec66-47ca-bb2e-d8f36d4c10ef
        name:
          type: string
          description: The name of the script.
          example: Forecast report
    outputTableMeta:
      title: KRM Output Table Metadata
      description: Some metadata about a KRM output table
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
        tableName:
          type: string
          description: The name of the output table.
          example: CF_OUT
        tableType:
          type: string
          description: A type or category that this output table.
          example: Multi-Period Output
        detailLevelValues:
          type: array
          items:
            type: integer
          description: The ordered values associated with the detail descriptions
          example: [1, 2]
        detailLevelDescriptions:
          type: array
          items:
            type: string
          description: The ordered detailed descriptions associated with the detail
            values
          example: ["Base case only", "Base case + scenarios"]
    reportingPeriodSet:
      title: Reporting Period Set
      description: An ordered, contiguous set of reporting periods
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          example: 1
        key:
          type: string
          description: The unique (amongst objects of this type in this deployment),
            user-managed ID for this reporting set
          example: month_30_yr
        description:
          type: string
          description: A description of this reporting period set object
          example: The monthly periods for 30 years
        reportSetFlag:
          type: integer
          description: Gives how the periods are defined.  Valid values are 1, 2,
            3.   1=date-based, 2=term-based, 3=irrbb.
          example: 1
        dateBasedReportingPeriods:
          type: array
          items:
            $ref: "#/components/schemas/dateBasedReportingPeriod"
          description: An ordered set of date-based reporting periods that make up
            the core of this object.  reportSetFlag must be 1 if these are included.
        termBasedReportingPeriods:
          type: array
          items:
            $ref: "#/components/schemas/termBasedReportingPeriod"
          description: An ordered set of term-based reporting periods that make up
            the core of this object.  reportSetFlag must be 2 if these are included.
    dateBasedReportingPeriod:
      title: Date-Based Reporting Period
      description: A reporting period that is date-based
      type: object
      properties:
        label:
          type: string
          description: The label for the period.  This will typically be shown in
            reports that use this reporting period.
        startDate:
          type: string
          description: The date which starts this reporting period (inclusive).
        endDate:
          type: string
          description: The date which ends this reporting period (inclusive).
    termBasedReportingPeriod:
      title: Term-Based Reporting Period
      description: A reporting period that is term-based
      type: object
      properties:
        label:
          type: string
          description: The label for the period.  This will typically be shown in
            reports that use this reporting period.
        endTerm:
          type: integer
          description: A value indicating how many endTermUnits this period is for
            (must be >= 1).
        endTermUnit:
          type: string
          description: A value indicating the unit of days this period is for (one
            of D W M Q S Y - for day, week, month, quarter, semiannual, and year).
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    errorResponse:
      title: Error
      description: The representation of an error.
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The error message.
        id:
          type: string
          description: The string ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred
          items:
            $ref: "#/components/schemas/errorResponse"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    marketDates:
      title: Market Data Date
      description: Table name and latest market data date in the table.
      type: object
      properties:
        tableName:
          type: string
          description: The name of the market data table.
          example: FX_DATA
        maxDate:
          type: string
          description: The latest market-data date in the table in YYYY-MM-DD format.
          example: 2022-12-31
    marketDataDates:
      title: Market Data Dates
      description: This is a collection of market-data date objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        readOnly: true
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/marketDates"
    runProgress:
      title: Run Progress
      description: Describes the progress of a run
      type: object
      properties:
        analysisRunName:
          type: string
          description: The name of the analysis run associated with the krm run.
          example: my_run
        currentStep:
          type: string
          description: The id of the step the run is executing in.
          example: startedProcessingContractualRecords
        cycleName:
          type: string
          description: The cycle use for the run
          example: my_cycle
        endedExecution:
          type: string
          description: The timestamp for when the run ended
          example: 2024-01-22T16:48:18.417232Z
        executionBy:
          type: string
          description: The user who ran the analysis run
          example: yo-mama
        runId:
          type: string
          description: The KRM run ID for the analysis run
          example: run00005
        runTime:
          type: string
          description: The duration of how long this run executed or has executed
            (in hours, minutes and seconds)
          example: 0:02:28
        startedCreatingComputeSession:
          type: string
          description: The timestamp for when the run started creating a compute session
          example: 2024-01-22T16:48:18.417232Z
        startedCreatingRawOutputTables:
          type: string
          description: The timestamp for when the run started creating the raw output
            tables
          example: 2024-01-22T16:48:18.417232Z
        startedExecution:
          type: string
          description: The timestamp for when the run started
          example: 2024-01-22T16:48:18.417232Z
        startedGeneratingReports:
          type: string
          description: The timestamp for when the run started creating reports
          example: 2024-01-22T16:48:18.417232Z
        startedLoadingData:
          type: string
          description: The timestamp for when the run started loading data
          example: 2024-01-22T16:48:18.417232Z
        startedPreparingEnvironment:
          type: string
          description: The timestamp for when the run started preparing the environment
            to run
          example: 2024-01-22T16:48:18.417232Z
        startedProcessingContractualRecords:
          type: string
          description: The timestamp for when the run started processing contractual
            records
          example: 2024-01-22T16:48:18.417232Z
        startedProcessingStressScenarios:
          type: string
          description: The timestamp for when the run started processing stress scenarios
          example: 2024-01-22T16:48:18.417232Z
        startedReporting:
          type: string
          description: The timestamp for when the run started the reporting process
            - this includes the steps leading up to creating reports
          example: 2024-01-22T16:48:18.417232Z
        status:
          type: object
          description: The overall status of the run.
          properties:
            type:
              type: string
              description: The status value
            label:
              type: string
              description: The label version of the status value
    runProgressCollection:
      title: Run Progress Collection
      description: This is a collection of run progress objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        readOnly: true
        properties:
          items:
            type: array
            description: The array of run progresses.
            items:
              $ref: "#/components/schemas/runProgress"
    runProgressMeta:
      title: Run Progress Metadata
      description: The schema of the output of the GET /riskCirrusKrm/runProgressMeta
        endpoint
      type: object
      properties:
        table:
          type: object
          description: Options describing the table the UI can show with this info
          properties:
            columnOptions:
              type: object
              description: Describes the default column options for the columns in
                the table (used unless overridden by each column)
              properties:
                visible:
                  type: boolean
                  description: Whether the column is visible or not
                defaultVisible:
                  type: boolean
                  description: Whether it is default visible or not
                sizeColumnsToFit:
                  type: boolean
                  description: Whether all columns should be sized to fit within the
                    visible area or not
                areLabelsLocalized:
                  type: boolean
                  description: Whether labels are localized in the UI or not
                wrapHeaderText:
                  type: boolean
                  description: Whether columns headers should wrap text or not
            cellOptions:
              type: object
              description: Cell options that are table wide unless overridden by each
                cell
              properties:
                readonly:
                  type: boolean
                  description: Whether the cells are read only
                cellType:
                  type: string
                  description: The data type within the cells
                  example: string
        columns:
          type: array
          description: An array of column info describing the columns the UI can show
            with this info
          items:
            type: object
            description: The array of columns in the table shown by the UI
            properties:
              options:
                type: object
                description: options for an individual cell
                properties:
                  id:
                    type: string
                    description: the column's id
                    example: string
                  label:
                    type: string
                    description: the column's label
                    example: string
                  width:
                    type: string
                    description: the column's width
                    example: string
                  columnType:
                    type: string
                    description: the column's type
                    example: string
                  filterable:
                    type: boolean
                    description: whether the column is filterable
                    example: true
              cellOptions:
                type: object
                description: options describing a data cell
                properties:
                  cellType:
                    type: string
                    description: the data cell's data type
                    example: string
                  readonly:
                    type: boolean
                    description: whether the data cell is read only
                  wrapText:
                    type: boolean
                    description: whether text wrap's in the data cell
    engineNodeStatsCollection:
      title: Engine Node Stats Collection
      description: This is a collection of engine node stats objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        readOnly: true
        properties:
          items:
            type: array
            description: The array of engine node stats objects.
            items:
              $ref: "#/components/schemas/engineNodeStats"
    engineNodeStats:
      title: Engine Node Stats
      description: Provides statistics for a node that is running a KRM engine
      type: object
      properties:
        cpuCoresCapacityCount:
          type: integer
          description: The number of CPU cores within this server node
          example: 16
        cpuUsage:
          type: number
          description: A number between 0.0 and 1.0 giving the approximate portion
            of the CPU (all cores) that is being used at the time this endpoint is
            called.
          example: 0.14489125244875067
        engineJobsRunningCount:
          type: integer
          description: The number of engine jobs running on this node
          example: 1
        memoryCapacity:
          type: integer
          description: The memory capacity for this node, given in GiB.
          example: 31
        memoryUsage:
          type: number
          description: A number between 0.0 and 1.0 giving the approximate portion
            of the memory that is being used at the time this endpoint is called.
          example: 0.4685213745736423
        nodeConditions:
          type: string
          description: A comma-delimited list of true node conditions (false node
            conditions are not returned).
          example: "Ready"
        nodePodCount:
          type: integer
          description: The number of pods running on this node - across all namespaces.  This
            value shows how many pods the engine node is being consumed by - and generally
            how much competition the KRMD pod on the node has for the node's resources.
          example: 51
        serverName:
          type: string
          description: A name for the server node.  This name is meant for a visual
            presentation only and not to be used programatically.
          example: server1
    engineNodeStatsMetaCollection:
      title: Engine Node Stats Collection
      description: This is a collection of engine node stats objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        readOnly: true
        properties:
          items:
            type: array
            description: The array of engine node stats objects.
            items:
              $ref: "#/components/schemas/engineNodeStatsMeta"
    engineNodeStatsMeta:
      title: Engine Node Stats Metadata
      description: The schema of the output of the GET /riskCirrusKrm/engineNodeStatsMeta
        endpoint
      type: object
      properties:
        table:
          type: object
          description: Options describing the table the UI can show with this info
          properties:
            columnOptions:
              type: object
              description: Describes the default column options for the columns in
                the table (used unless overridden by each column)
              properties:
                visible:
                  type: boolean
                  description: Whether the column is visible or not
                defaultVisible:
                  type: boolean
                  description: Whether it is default visible or not
                sizeColumnsToFit:
                  type: boolean
                  description: Whether all columns should be sized to fit within the
                    visible area or not
                areLabelsLocalized:
                  type: boolean
                  description: Whether labels are localized in the UI or not
                wrapHeaderText:
                  type: boolean
                  description: Whether columns headers should wrap text or not
            cellOptions:
              type: object
              description: Cell options that are table wide unless overridden by each
                cell
              properties:
                readonly:
                  type: boolean
                  description: Whether the cells are read only
                cellType:
                  type: string
                  description: The data type within the cells
                  example: string
        columns:
          type: array
          description: An array of column info describing the columns the UI can show
            with this info
          items:
            type: object
            description: The array of columns in the table shown by the UI
            properties:
              options:
                type: object
                description: options for an individual cell
                properties:
                  id:
                    type: string
                    description: the column's id
                    example: string
                  label:
                    type: string
                    description: the column's label
                    example: string
                  width:
                    type: string
                    description: the column's width
                    example: string
                  columnType:
                    type: string
                    description: the column's type
                    example: string
                  filterable:
                    type: boolean
                    description: whether the column is filterable
                    example: true
              cellOptions:
                type: object
                description: options describing a data cell
                properties:
                  cellType:
                    type: string
                    description: the data cell's data type
                    example: string
                  readonly:
                    type: boolean
                    description: whether the data cell is read only
                  wrapText:
                    type: boolean
                    description: whether text wrap's in the data cell
    errorInfo:
      title: Run Error Information
      description: Describes error information from a run
      type: object
      properties:
        version:
          type: integer
          description: API version of this object
          example: 1
        hasErrorMessages:
          type: boolean
          description: Indicates whether the given run had error messages produced
            from KRM
          example: true
    krmSchema:
      title: KRM Schema
      description: Describes a KRM Schema
      type: object
      properties:
        engineSchemaName:
          type: string
          description: The name of the schema which currently is restricted to 20
            lowercase characters (a-z).
          example: danschema
        sourceEngineSchemaName:
          type: string
          description: The name of the schema to copy (if any)
          example: riskcirruskrm
        description:
          type: string
          description: A description of the schema - many times used in the UI.
          example: Dan's schema
        creationTimeStamp:
          type: string
          description: Date and time stamp of when this schema was created.
          format: date-time
          example: "2021-11-08T18:40:21.674894Z"
          readOnly: true
        createdBy:
          type: string
          description: Username of the entity that created this schema.
          example: testuser
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: Date and time stamp of when this schema was last modified.
          format: date-time
          example: "2021-11-08T18:40:21.674894Z"
          readOnly: true
        modifiedBy:
          type: string
          description: Username of the entity that last modified this schema.
          example: testuser
          readOnly: true
    krmSchemasCollection:
      title: KRM Schemas Collection
      description: This is a collection of KRM Schema objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        readOnly: true
        properties:
          items:
            type: array
            description: The array of KRM Schemas.
            items:
              $ref: "#/components/schemas/krmSchema"
    krmLock:
      title: KRM Lock
      description: Describes a KRM Lock
      type: object
      properties:
        engineSchema:
          type: string
          description: The name of the schema which currently is restricted to 20
            lowercase characters (a-z).
          example: danschema
        analysisId:
          type: string
          title: Run identifier.
          description: |
            The identifier of the analysis run object that would like to obtain the KRM lock.

            This is a system assigned identifier of the analysis run object.
          example: 16372757e-011d-454d-905b-eb10b4a9e5a9
        exclusive:
          type: boolean
          title: obtain exclusive lock
          description: |
            Flag to indicate whether to obtain an exclusive lock or a shared lock.
          example: true
    tpPortfolioNames:
      title: Portfolio Names
      description: Specifies a port table name
      type: object
      properties:
        portTable:
          type: string
          description: The name of the port table.
          example: PORT_IRRBB
    tpPortfolioNamesCollection:
      title: Portfolio Names Collection
      description: This is a collection of Portfolio names objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        readOnly: true
        properties:
          items:
            type: array
            description: The array of Portfolio Names.
            items:
              $ref: "#/components/schemas/tpPortfolioNames"
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
