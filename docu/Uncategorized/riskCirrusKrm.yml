---
openapi: 3.0.3
info:
  version: "1"
  title: Risk Cirrus KRM
  description: >
    SAS Risk Cirrus KRM handles the execution of analysis runs
    via the KRM backend.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
servers:
- url: http://example.com/riskCirrusKrm
  description: Sample server URL.
tags:
- name: Root Links
  description: Root Links.
- name: Output Table Metadata
  description: Metadata about all output tables within KRM.
- name: Runs
  description: An object that ties together a Cirrus Analysis Run and its associated
    KRM job and run.
- name: Distinct Values
  description: Distinct values and their descriptions from selected KRM tables.
- name: Codes
  description: Global codes within the KRM system.
- name: User Codes
  description: User defined codes within the KRM system.
- name: Reporting Period Sets
  description: A reporting period set is an object that defines a set of contiguous
    reporting periods (in time).
- name: Reports
  description: A runnable report (script) associated with an analysis run for providing
    report data.
- name: Market Data Dates
  description: Latest data dates from KRM market tables.
- name: Calibration Runs
  description: An object that ties together a Cirrus Analysis Run and its associated
    KRM calibration run.
- name: Calibration Session Ids
  description: List of calibration sessions that are available.
- name: Analysis Runs
  description: Information about analysis runs and their associated KRM runs.
- name: Database Library
  description: An object that gives access to the KRM database.
- name: Locks
  description: An object that deals with locks when executing a KRM run.
- name: Schemas
  description: An object that deals with the KRM schemas that are available.
- name: Portfolios
  description: An object that deals with KRM portfolios.
paths:
  /:
    get:
      tags:
      - Root Links
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example:
                  $ref: "#/components/examples/getKRMRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example:
                  $ref: "#/components/examples/getKRMRootResponse"
  /runs:
    post:
      tags:
      - Runs
      summary: Create a KRM run (called from scripts within our product)
      operationId: createRun
      description: Create a KRM run in the system (from an Analysis Run that the user
        started). This endpoint is considered a private endpoint as users are expected
        to call the endpoint for creating AnalysisRun objects and not use this endpoint.  This
        endpoint exists mainly so that one part of our product (code in SAS scripts)
        can call into our mid-tier to kick off an KRM run.
      requestBody:
        content:
          application/vnd.sas.risk.krm.run+json:
            schema:
              $ref: "#/components/schemas/run"
            examples:
              example:
                $ref: "#/components/examples/createRunBody"
          application/json:
            schema:
              $ref: "#/components/schemas/run"
            examples:
              example:
                $ref: "#/components/examples/createRunBody"
        description: The run definition to be created.
        required: true
      responses:
        "201":
          description: Run created successfully.
          headers:
            Location:
              description: The URI of the newly created run.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.krm.run+json:
              schema:
                $ref: "#/components/schemas/run"
              examples:
                example:
                  $ref: "#/components/examples/runBodyResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/run"
              examples:
                example:
                  $ref: "#/components/examples/runBodyResponse"
        "400":
          description: |
            Bad Request.

            The request is not properly formed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                example:
                  $ref: "#/components/examples/badCreateRunErrorResponse"
        "403":
          description: Not authorized to create the KRM run.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                example:
                  $ref: "#/components/examples/forbiddenErrorResponse"
        "409":
          description: Received an analysisId that already has a KRM run created.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                example:
                  $ref: "#/components/examples/conflictRunErrorResponse"
  /krmCalibrationRuns:
    post:
      tags:
      - Calibration Runs
      summary: Create a KRM batch/session run (called from scripts within our product)
      operationId: createCalibrationRun
      description: Create a KRM batch/session run in the system (from an Analysis
        Run that the user started). This endpoint is considered a private endpoint
        as users are expected to call the endpoint for creating AnalysisRun objects
        and not use this endpoint.  This endpoint exists mainly so that one part of
        our product (code in SAS scripts) can call into our mid-tier to kick off an
        KRM batch/session run.
      requestBody:
        content:
          application/vnd.sas.risk.krm.run+json:
            schema:
              $ref: "#/components/schemas/calibrationRun"
            examples:
              example:
                $ref: "#/components/examples/createCalibrationRunBody"
          application/json:
            schema:
              $ref: "#/components/schemas/calibrationRun"
            examples:
              example:
                $ref: "#/components/examples/createRunBody"
        description: The run definition to be created.
        required: true
      responses:
        "201":
          description: Calibration Run created successfully.
          headers:
            Location:
              description: The URI of the newly created run.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
          content:
            application/vnd.sas.risk.krm.run+json:
              schema:
                $ref: "#/components/schemas/calibrationRun"
              examples:
                example:
                  $ref: "#/components/examples/calibrationRunBodyResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/calibrationRun"
              examples:
                example:
                  $ref: "#/components/examples/calibrationRunBodyResponse"
        "400":
          description: |
            Bad Request.
            The request is not properly formed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                example:
                  $ref: "#/components/examples/badCreateCalibrationRunErrorResponse"
        "409":
          description: Received an analysisId that already has a KRM run created.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                example:
                  $ref: "#/components/examples/conflictCalibrationRunErrorResponse"
  /krmSessionIds:
    get:
      tags:
      - Calibration Session Ids
      summary: Get calibration session ids
      operationId: getKrmSessionIds
      description: Get a list of KRM calibration session ids. Returned items will
        be of media type application/vnd.sas.risk.krm.calibration.run+json.
      responses:
        "200":
          description: The request succeeded and list of session Ids are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/calibrationRun"
              examples:
                example:
                  $ref: "#/components/examples/krmSessionIdsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/calibrationRun"
              examples:
                example:
                  $ref: "#/components/examples/krmSessionIdsResponse"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
  /analysisRuns/{analysisRunId}:
    delete:
      tags:
      - Analysis Runs
      summary: Delete associated analysis run and data for the given analysis run
        id
      operationId: deleteKrmRunDataForAnalysisRun
      parameters:
      - name: analysisRunId
        required: true
        in: path
        schema:
          type: string
        description: The Analysis Run ID (UUID) whose associated KRM run and data
          will be deleted.
        example: /riskCirrusKrm/analysisRuns/dc3f3852-e7a2-4b89-bfc4-6347caa26e6d
      - name: onlyDeleteOutputTables
        in: query
        description: Only delete the data in the output tables.
        schema:
          type: string
        example: /riskCirrusKrm/analysisRuns/dc3f3852-e7a2-4b89-bfc4-6347caa26e6d?onlyDeleteOutputTables=true
      description: The endpoint serves to delete KRM data such as portfolio, output
        tables, and the KRM run associated with an Analysis Run ID. The endpoint is
        considered private, triggered by the cascade delete action of a Cirrus Cycle
        or Analysis Run.
      responses:
        "204":
          description: Successful deletion of associated KRM run and data.
  /analysisRuns/{analysisRunId}/errorInfo:
    get:
      tags:
      - Analysis Runs
      summary: Get KRM error info for a run
      operationId: getErrorInfoForAnalysisRun
      parameters:
      - name: analysisRunId
        required: true
        in: path
        schema:
          type: string
        description: Error information for the given Analysis Run ID (UUID) is returned
        example: /riskCirrusKrm/analysisRuns/27440f7d-9745-43df-a02e-c7fb61e370dc/errorInfo
      description: Returns error information about a KRM run given the analysis run
        id (uuid).
      responses:
        "200":
          description: Successful retrieval of error info for a run
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/errorInfo"
              examples:
                example:
                  $ref: "#/components/examples/errorInfoResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorInfo"
              examples:
                example:
                  $ref: "#/components/examples/errorInfoResponse"
        "404":
          description: analysis run w/ given ID was not found
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                example:
                  $ref: "#/components/examples/errorInfoErrorResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                example:
                  $ref: "#/components/examples/errorInfoErrorResponse"
  /krmCodes/{typeId}:
    get:
      tags:
      - Codes
      summary: Global Codes
      operationId: getGlobalCodes
      description: Get codes from KRM's CODE_GLB table.
      parameters:
      - name: typeId
        in: path
        description: Get codes from KRM's CODE_GLB table with this typeId
        required: true
        schema:
          type: string
        example: /riskCirrusKrm/krmCodes/VMT
      - name: code
        in: query
        description: Filter results by code value.
        schema:
          type: string
        example: /riskCirrusKrm/krmCodes/095?code=3
      - name: start
        in: query
        description: (Currently not supported but in-plan).  0-based Offset of first
          to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: (Currently not supported but in-plan).  Maximum number to return.  Defaults
          to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: "(Currently not supported but in-plan).  Filter criteria for\
          \ returned types. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters)."
        schema:
          type: string
          format: filter-criteria
      - name: engineSchema
        in: query
        required: false
        description: "The engine schema from which the information is queried."
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/codes"
              examples:
                example:
                  $ref: "#/components/examples/globalCodesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/codes"
              examples:
                example:
                  $ref: "#/components/examples/globalCodesResponse"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
  /krmUserCodes/{typeId}:
    get:
      tags:
      - User Codes
      summary: Get user codes
      operationId: getUserCodes
      description: Get codes from KRM's CODE_USER table.
      parameters:
      - name: typeId
        in: path
        description: Get codes from KRM's CODE_USER table with this typeId
        required: true
        schema:
          type: string
        example: /riskCirrusKrm/krmUserCodes/CUR
      - name: code
        in: query
        description: Filter results by code value.
        schema:
          type: string
        example: /riskCirrusKrm/krmUserCodes/CUR?code=1
      - name: engineSchema
        in: query
        required: false
        description: "The engine schema from which the information is queried."
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/codes"
              examples:
                example:
                  $ref: "#/components/examples/userCodesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/codes"
              examples:
                example:
                  $ref: "#/components/examples/userCodesResponse"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
  /distinct/{table}:
    get:
      tags:
      - Distinct Values
      summary: Get distinct values
      operationId: getDistinct
      description: Get distinct values for a KRM table/column combination.
      parameters:
      - name: start
        in: query
        description: (Currently not supported but in-plan).  0-based Offset of first
          to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: (Currently not supported but in-plan).  Maximum number to return.  Defaults
          to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: "(Currently not supported but in-plan).  Filter criteria for\
          \ returned types. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters)."
        schema:
          type: string
          format: filter-criteria
      - name: table
        in: path
        description: The table name to be used to query
        example: /riskCirrusKrm/distinct/TABLE_PORT?column=PORT_TABLE
        schema:
          type: string
        required: true
      - name: column
        in: query
        description: The column name to be used to query in the table given in the
          URL
        example: /riskCirrusKrm/distinct/TABLE_PORT?column=PORT_TABLE
        schema:
          type: string
        required: true
      - name: descriptionColumn
        in: query
        description: The column name to be used for obtaining the description of the
          returned row
        example: /riskCirrusKrm/distinct/RUN_PARAM?column=RUN_ID&descriptionColumn=DESCRIPTION
        schema:
          type: string
      - name: baseDate
        in: query
        description: (This parameter is only available for /distinct/YC_DATA?column=DATA_DT
          and could change in the future) This parameter must be supplied with weeksPrior
          to specify a filter window for yield curve data dates.
        example: /riskCirrusKrm/distinct/YC_DATA?column=DATA_DT&baseDate=2023-02-28T00:00:00Z&weeksPrior=5
        schema:
          type: string
      - name: weeksPrior
        in: query
        description: (This parameter is only available for /distinct/YC_DATA?column=DATA_DT
          and could change in the future) This parameter must be supplied with baseDate
          to specify a filter window for yield curve data dates.
        example: /riskCirrusKrm/distinct/YC_DATA?column=DATA_DT&baseDate=2023-02-28T00:00:00Z&weeksPrior=5
        schema:
          type: string
      - name: engineSchema
        in: query
        required: false
        description: "The engine schema from which the information is queried."
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/codes"
              examples:
                example:
                  $ref: "#/components/examples/distinctResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/codes"
              examples:
                example:
                  $ref: "#/components/examples/distinctResponse"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "400":
          description: When the table or the selected column does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                example:
                  $ref: "#/components/examples/distinctErrorResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                example:
                  $ref: "#/components/examples/distinctErrorResponse"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
  /reportingPeriodSets:
    post:
      tags:
      - Reporting Period Sets
      summary: Create reporting period set
      operationId: createReportingPeriodSet
      description: Creates a reporting period set object in KRM's tables.
      parameters:
      - name: engineSchema
        in: query
        required: false
        description: "The engine schema from which the information is queried."
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.risk.krm.reporting.period.set+json:
            schema:
              $ref: "#/components/schemas/reportingPeriodSet"
            examples:
              example:
                $ref: "#/components/examples/reportingPeriodSetBody"
          application/json:
            schema:
              $ref: "#/components/schemas/reportingPeriodSet"
            examples:
              example:
                $ref: "#/components/examples/reportingPeriodSetBody"
      responses:
        "201":
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.risk.krm.reporting.period.set+json:
              schema:
                $ref: "#/components/schemas/reportingPeriodSet"
              examples:
                example:
                  $ref: "#/components/examples/reportingPeriodSetBody"
            application/json:
              schema:
                $ref: "#/components/schemas/reportingPeriodSet"
              examples:
                example:
                  $ref: "#/components/examples/reportingPeriodSetBody"
          headers:
            Location:
              description: The URI of the newly created reporting period set.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "400":
          description: Reporting period set not valid.
    get:
      tags:
      - Reporting Period Sets
      summary: Get reporting period sets
      operationId: getReportingPeriodSets
      description: Get a list of reporting period sets defined in KRM's tables.
      parameters:
      - name: start
        in: query
        description: 0-based Offset of first to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number to return.  Defaults to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: Filter criteria for returned types. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: engineSchema
        in: query
        required: false
        description: "The engine schema from which the information is queried."
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/reportingPeriodSet"
              examples:
                example:
                  $ref: "#/components/examples/reportingPeriodSetsCollectionResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/reportingPeriodSet"
              examples:
                example:
                  $ref: "#/components/examples/reportingPeriodSetsCollectionResponse"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
  /reportingPeriodSets/{name}:
    head:
      tags:
      - Reporting Period Sets
      summary: Check existence of reporting period set
      operationId: headersForReportingPeriodSet
      parameters:
      - name: name
        required: true
        in: path
        schema:
          type: string
        description: The name of the reporting period set
        example: /riskCirrusKrm/reportingPeriodSets/May2025
      - name: engineSchema
        in: query
        required: false
        description: "The engine schema from which the information is queried."
        schema:
          type: string
      description: Returns an HTTP response code indicating the existence of the given
        reporting period set.
      responses:
        "200":
          description: Exists.
          headers:
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
        "404":
          description: Reporting period set not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/reportingPeriodSetNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/reportingPeriodSetNotFound"
    get:
      tags:
      - Reporting Period Sets
      summary: Get single reporting period set
      operationId: getReportingPeriodSet
      parameters:
      - name: name
        required: true
        in: path
        schema:
          type: string
        description: The name of the reporting period set
        example: /riskCirrusKrm/reportingPeriodSets/May2025
      - name: engineSchema
        in: query
        required: false
        description: "The engine schema from which the information is queried."
        schema:
          type: string
      description: Get a single reporting period set.
      responses:
        "200":
          description: The request succeeded and matching value is returned.
          content:
            application/vnd.sas.risk.krm.reporting.period.set+json:
              schema:
                $ref: "#/components/schemas/reportingPeriodSet"
              examples:
                example:
                  $ref: "#/components/examples/reportingPeriodSetBody"
            application/json:
              schema:
                $ref: "#/components/schemas/reportingPeriodSet"
              examples:
                example:
                  $ref: "#/components/examples/reportingPeriodSetBody"
          headers:
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "404":
          description: Reporting period set not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/reportingPeriodSetNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/reportingPeriodSetNotFound"
    put:
      tags:
      - Reporting Period Sets
      summary: Update reporting period set
      operationId: updateReportingPeriodSet
      description: Update a reporting period set object in KRM's tables.
      requestBody:
        content:
          application/vnd.sas.risk.krm.reporting.period.set+json:
            schema:
              $ref: "#/components/schemas/reportingPeriodSet"
            examples:
              example:
                $ref: "#/components/examples/reportingPeriodSetBody"
          application/json:
            schema:
              $ref: "#/components/schemas/reportingPeriodSet"
            examples:
              example:
                $ref: "#/components/examples/reportingPeriodSetBody"
      parameters:
      - name: name
        required: true
        in: path
        schema:
          type: string
        description: The name of the reporting period set
        example: /riskCirrusKrm/reportingPeriodSets/May2025
      - in: header
        name: If-Match
        description: |
          The value of the ETag that was returned from a GET or previous PUT of this object.

          This MUST match exactly the current value of the etag of the object.
        schema:
          type: string
      - name: engineSchema
        in: query
        required: false
        description: "The engine schema from which the information is queried."
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded and matching values are returned.
          content:
            application/vnd.sas.risk.krm.reporting.period.set+json:
              schema:
                $ref: "#/components/schemas/reportingPeriodSet"
              examples:
                example:
                  $ref: "#/components/examples/reportingPeriodSetBody"
            application/json:
              schema:
                $ref: "#/components/schemas/reportingPeriodSet"
              examples:
                example:
                  $ref: "#/components/examples/reportingPeriodSetBody"
          headers:
            ETag:
              description: A tag that identifies this revision of this code repository.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
              description: The response content type.
        "400":
          description: Reporting period set not valid.
          content:
            application/vnd.sas.risk.krm.reporting.period.set+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                example:
                  $ref: "#/components/examples/badReportingPeriodSetBody"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                example:
                  $ref: "#/components/examples/reportingPeriodSetBody"
        "404":
          description: Reporting period set not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/reportingPeriodSetNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/reportingPeriodSetNotFound"
        "412":
          description: The If-Match condition check did not pass.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/preConditionFailedResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/preConditionFailedResponse"
        "428":
          description: Pre-Condition failed. If-Match header was not provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/IfMatchHeaderNotProvidedResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/IfMatchHeaderNotProvidedResponse"
    delete:
      tags:
