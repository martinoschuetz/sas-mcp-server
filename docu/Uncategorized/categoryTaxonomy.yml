  "/taxonomies/{taxonomyId}/categories/{categoryId}/children":
    get:
      summary: Gets the summary of category children
      operationId: getCategoryChildren
      description: Gets the summary of children for a specific category.  The included
        children will not contain their value elements, as this may be a very large
        attribute.  A get on the child is required to have that attribute included.
      tags:
      - Categories
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: The ID of the category taxonomy that contains the category.
        schema:
          type: string
      - name: categoryId
        in: path
        required: true
        description: The ID of the category to be retrieved.
        schema:
          type: string
      - name: start
        in: query
        description: |
          The index of the first category child to return.
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: >
          The maximum number of category children to return.
           The  actual number of returned children could be less if the collection
          has been exhausted. The default is 20.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortBy
        in: query
        description: >
          Sort returned child categories for specified parent category in a
          taxonomy. The sort criteria support the following fields in either
          ascending or descending order (id, name, autoGenerated,
          validationNeeded, hasInvalidChild, createdBy, parentId,
          originalName, taxonomyId, value, modifiedBy, modifiedTimeStamp, and
          creationTimeStamp). The default is "creationTimeStamp". See [sorting
          collections](https://developer.sas.com/apis/rest/Topics/#sorting).
