---
openapi: 3.0.3
info:
  title: Category Taxonomy
  description: >
    The category taxonomy api enables a user to create a taxonomy and also
    categories within a specified taxonomy. A category taxonomy is the
    hierarchical representation of categories that contains boolean rules. A
    category identifies a group of documents that share a common characteristic.
    This api allows a user to create such taxonomy and categories. <br> <br>
    For example, if we have documents related to news articles, we might want to
    organize them into different categories such as Business, Politics and
    Sports. Again, Sports can be sub-categorized into Tennis and Basketball
    categories. A user can create such a hierarchy and also add rules for each
    category. An example of a rule for `Tennis` is: `(AND, "sports", (MINOC_2,
    "tennis"))`. This rule states that only if `sports` is mentioned in the
    document along with `tennis` mentioned at least twice then categorize that
    document as belonging to category named as `Tennis`. We support a wide range
    of operators to develop such rules. More details on the rule syntax can be
    found in user guide.  <br><br> Once the user has created the categories in a
    category taxonomy, he/she can retrieve the configuration of such a taxonomy
    or a category belonging to a taxonomy. The configuration is in the format
    `Category ID:category_id\n num:category_name:category_value` where
    `category_id` is the ID of the category, `category_name` is the name of the
    category and `category_value` is the rule value of the category.
    category-validate uses taxonomy configuration internally to validate all the
    categories defined in a taxonomy and category configuration to validate the
    rule value of the specified category. A category-compile job uses the
    configuration value to generate the binary model which can be used to score
    the documents using the `categorization` scoring api. Once the user has
    scored the documents or piece of text for a category taxonomy, he/she can
    also view the documents for matching category. User can also validate the
    rule values of a category using a category-validate job. <br> <br> Other
    apis which interacts with this api: <ul><li>Documents REST
    API</li></ul>

    **Note that HEAD is supported for every GET request documented in the API.
    Simply change the HTTP verb from GET to HEAD, leaving other parameters the
    same.**
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  version: "5"
tags:
- name: Root
  description: The operations for the root resource.
- name: Jobs
  description: The operations for the jobs.
- name: Taxonomies
  description: The operations for the taxonomies resource.
- name: Categories
  description: The operations for the categories resource within a taxonomy.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      operationId: root
      description: |
        Returns the links to the top-level resources for the API.
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "404":
          description: Service is not available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
    head:
      tags:
      - Root
      operationId: headersForRoot
      summary: Get the headers for the API
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      responses:
        "200":
          description: OK.
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "404":
          description: Service is not available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
  /jobs:
    post:
      tags:
      - Jobs
      x-sas-attributes:
        since: "2"
      summary: Submits a new job
      description: Perform all tasks necessary for various job types.
      operationId: createJob
      requestBody:
        content:
          application/vnd.sas.job.execution.job+json:
            schema:
              $ref: "#/components/schemas/job"
            example:
              $ref: "#/components/examples/postJobRequest/value"
          application/json:
            schema:
              $ref: "#/components/schemas/job"
            example:
              $ref: "#/components/examples/postJobRequest/value"
        description: >
          The job execution job submitted to run various tasks such as importing
          categories and/or getting the configuration for the specified
          taxonomy.<br/>


          The job can be one of four types: import-categories, category-validate,
          category-compile, or category-configuration-job.


          A job submitted to run one of four types of tasks, as specified by the type
          property of the job definition.


          Import categories. Job type is import-categories. Job arguments are passed
          via a file containing the categories to be imported in json format.

          Once the job status is completed and successful, we return the job results
          again in different file location.

          This file contains the actual message for each of the imported categories
          along with the http status code.  <br/>


          Validate categories. Job type is category-validate. Job arguments are passed
          via a file containing the categories to be validated in json format.

          Once the job status is completed successfully, we return the job results
          again in a different file location.

          This file contains the actual state of validation and any errors associated
          with validation for the categories. <br/>


          Compile categories. Job type is category-compile. Job arguments are passed
          via a file containing the categories to be validated in json format.

          Once the job status is completed successfully, we send an http status code
          200 and don't return anything. <br/>


          Get the configuration for a taxonomy. Job-type is category-configuration-job.
          Job arguments are passed via a file containing the ID of the category taxonomy
          in json format.

          Once the job status is completed successfully, we return the job results
          again in different file location.

          This file contains the actual configuration of all the categories existing
          in the specified taxonomy.
        required: true
      responses:
        "202":
          description: The job was accepted.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the job was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the job.
              schema:
                type: string
            Location:
              description: The URL of the job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              example:
                $ref: "#/components/examples/postJobResponse/value"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              example:
                $ref: "#/components/examples/postJobResponse/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error2/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error2/value"
  /taxonomies:
    get:
      summary: Get a collection of taxonomies
      description: Returns a collection of taxonomies based on the specified pagination
        option. The items in the collection use the `application/vnd.sas.text.category.taxonomy`
        media type.
      operationId: getTaxonomies
      tags:
      - Taxonomies
      parameters:
      - name: start
        in: query
        description: |
          The index of the first taxonomy to return. The default is 0.
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: |
          The maximum number of taxonomies to return.
          The actual number of

          returned taxonomies could be less if the collection has been
          exhausted. The default is 20.
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortBy
        in: query
        description: >
          Sort returned taxonomies. The sort criteria support the following
          fields in either ascending or descending order (id, name,
          description, createdBy, modifiedBy, modifiedTimeStamp  and
          creationTimeStamp). The default is "creationTimeStamp". See [sorting
          collections](https://developer.sas.com/apis/rest/Topics/#sorting).
        required: false
        schema:
          type: string
          format: sort-criteria
          default: creationTimeStamp
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/taxonomiesCollection"
              example:
                $ref: "#/components/examples/getTaxonomiesResponse/value"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomiesCollection"
              example:
                $ref: "#/components/examples/getTaxonomiesResponse/value"
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error2/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                $ref: "#/components/examples/error2/value"
    post:
      summary: Create a new taxonomy
      operationId: createTaxonomy
      description: Creates a new taxonomy based on the representation in the request
        body. The name of the new taxonomy must be set by the user within the request
        body. The name currently does not need to be unique.
      requestBody:
        content:
          application/vnd.sas.text.category.taxonomy+json:
            schema:
              $ref: "#/components/schemas/createTaxonomy"
            example:
              $ref: "#/components/examples/createTaxonomyRequest/value"
          application/json:
            schema:
              $ref: "#/components/schemas/createTaxonomy"
            example:
              $ref: "#/components/examples/createTaxonomyRequest/value"
        description: The representation of a taxonomy.
        required: true
      tags:
      - Taxonomies
      responses:
        "201":
          description: A taxonomy was created.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the taxonomy was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the taxonomy.
              schema:
                type: string
            Location:
              description: The URL of the taxonomy.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.text.category.taxonomy+json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              example:
                $ref: "#/components/examples/getTaxonomyResponse/value"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              example:
                $ref: "#/components/examples/getTaxonomyResponse/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.text.category.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error2/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error2/value"
  /taxonomies#duplicateTaxonomy:
    post:
      summary: Creates a copy of a taxonomy, including all of the categories
      operationId: createDuplicateTaxonomy
      description: Creates and returns a new taxonomy.  This endpoint also creates
        copies of all of the categories.
      tags:
      - Taxonomies
      parameters:
      - name: from
        in: query
        required: true
        description: The ID of the category taxonomy to copy.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.text.category.taxonomy+json:
            schema:
              $ref: "#/components/schemas/createTaxonomy"
            example:
              $ref: "#/components/examples/createTaxonomyRequest/value"
          application/json:
            schema:
              $ref: "#/components/schemas/createTaxonomy"
            example:
              $ref: "#/components/examples/createTaxonomyRequest/value"
        description: The representation of a taxonomy.
      responses:
        "201":
          description: The taxonomy was created.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the taxonomy was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the duplicated taxonomy.
              schema:
                type: string
            Location:
              description: The URL of the duplicated taxonomy.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.text.category.taxonomy+json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              example:
                $ref: "#/components/examples/getTaxonomyResponse/value"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              example:
                $ref: "#/components/examples/getTaxonomyResponse/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.text.category.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error2/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error2/value"
        "404":
          description: A taxonomy with the given ID could not be found.
          content:
            application/vnd.sas.text.category.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
  "/taxonomies/{taxonomyId}":
    get:
      summary: Get a taxonomy
      operationId: getTaxonomy
      description: Returns the representation of the specified taxonomy.
      tags:
      - Taxonomies
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: The unique identifier for the category taxonomy.
        schema:
          type: string
      responses:
        "200":
          description: OK. Taxonomy was returned.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the taxonomy was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the taxonomy.
              schema:
                type: string
          content:
            application/vnd.sas.text.category.taxonomy+json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              example:
                $ref: "#/components/examples/getTaxonomyResponse/value"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              example:
                $ref: "#/components/examples/getTaxonomyResponse/value"
    delete:
      summary: Delete a taxonomy
      operationId: deleteTaxonomy
      description: Deletes the specified taxonomy. This also deletes all the categories
        contained in the taxonomy if deleted from the taxonomy.
      tags:
      - Taxonomies
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: The ID of the category taxonomy to be deleted.
        schema:
          type: string
      responses:
        "204":
          description: The taxonomy was deleted.
    patch:
      summary: Patch a taxonomy
      operationId: patchTaxonomy
      description: "Patches the specified taxonomy based on the partial representation\
        \ in the request body. The requested body is a JSON or taxonomy media type."
      tags:
      - Taxonomies
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: The unique identifier for the  taxonomy.
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the taxonomy.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: >
          The time stamp obtained from the most recent `Last-Modified`
          response header. Ignored when `If-Match` is specified.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.text.category.taxonomy+json:
            schema:
              $ref: "#/components/schemas/updateTaxonomy"
            example:
              $ref: "#/components/examples/createTaxonomyRequest/value"
          application/json:
            schema:
              $ref: "#/components/schemas/updateTaxonomy"
            example:
              $ref: "#/components/examples/createTaxonomyRequest/value"
        description: |
          The partial representation of a taxonomy.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the taxonomy was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the taxonomy.
              schema:
                type: string
          content:
            application/vnd.sas.text.category.taxonomy+json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              example:
                $ref: "#/components/examples/getTaxonomyResponse/value"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomy"
              example:
                $ref: "#/components/examples/getTaxonomyResponse/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.text.category.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error2/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error2/value"
        "404":
          description: No taxonomy exists at the requested path.
          content:
            application/vnd.sas.text.category.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
        "412":
          description: >
            "The `If-Match` request header did not match the resource's entity
            tag, or the `If-Unmodified-Since` request header did not match the
            resource's last modified timestamp."
          content:
            application/vnd.sas.text.category.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error4/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error4/value"
        "428":
          description: The request headers did not include a `If-Match` or `If-Unmodified-Since`
            precondition.
          content:
            application/vnd.sas.text.category.taxonomy+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error3/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error3/value"
  "/taxonomies/{taxonomyId}/configuration":
    get:
      tags:
      - Taxonomies
      summary: Get the taxonomy configuration
      operationId: getTaxonomyConfiguration
      description: >
        Gets a configuration for all categories within a specific taxonomy. The
        taxonomy configuration is the collection of the rules for all the
        categories in a specific format. category-validate service uses this
        configuration to validate the rule syntax of all categories defined in
        the taxonomy. category-validate service uses this configuration to
        generate the binary model for scoring the documents. The configuration
        for a category will be in the format: `Category ID: category_id
         num:category_name:category_value`. The taxonomy configuration will be the
        configuration for all the categories specified in the taxonomy separated by
        new line.
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: |
          The ID of the taxonomy.
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Returns configuration with sorted name of categories in specified
          taxonomy.
        schema:
          type: string
          default: false
      responses:
        "200":
          description: |
            OK. The configuration for a taxonomy was returned.
          content:
            application/vnd.sas.text.category.taxonomy.configuration+json:
              schema:
                $ref: "#/components/schemas/taxonomyConfiguration"
              example:
                $ref: "#/components/examples/getTaxonomyConfigResponse/value"
            application/vnd.sas.text.category.taxonomy.configuration:
              schema:
                $ref: "#/components/schemas/taxonomyConfiguration"
              example:
                $ref: "#/components/examples/getTaxonomyConfigResponse/value"
            application/json:
              schema:
                $ref: "#/components/schemas/taxonomyConfiguration"
              example:
                $ref: "#/components/examples/getTaxonomyConfigResponse/value"
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "404":
          description: |
            A taxonomy with the given ID could not be found.
          content:
            application/vnd.sas.text.category.taxonomy.configuration+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
            application/vnd.sas.text.category.taxonomy.configuration:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
  "/taxonomies/{taxonomyId}/categories":
    get:
      summary: Get a collection of categories belonging to a taxonomy
      operationId: getCategories
      description: Returns a collection of categories within the specified taxonomy
        based on the specified pagination. The items in the collection use the `application/vnd.sas.text.category`
        media type.
      tags:
      - Categories
      parameters:
      - name: start
        in: query
        description: >
          The index of the first category to return belonging to the specified
          taxonomy.
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: >
          The maximum number of categories to return.  The actual number of
          returned categories could be less if the collection has been
          exhausted. The default is 20.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortBy
        in: query
        description: >
          Sort returned categories in specified taxonomy. The sort criteria
          support the following fields in either ascending or descending order
          (id, name, autoGenerated, validationNeeded, hasInvalidChild,
          createdBy, parentId, value, taxonomyId, modifiedBy, originalName,
          modifiedTimeStamp, and creationTimeStamp). The default is
          "creationTimeStamp". See [sorting
          collections](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
          default: creationTimeStamp
      - name: taxonomyId
        in: path
        required: true
        description: The ID of the category taxonomy for which the contained categories
          will be listed.
        schema:
          type: string
      - name: name
        in: query
        required: false
        description: A category name by which to filter the results.
        schema:
          type: string
      - name: parentId
        in: query
        required: false
        description: A parent ID by which to filter the results.
        schema:
          type: string
      - name: topLevelOnly
        in: query
        required: false
        description: Only get top level categories
        schema:
          type: boolean
          default: true
      - name: originalName
        in: query
        required: false
        description: The original category name by which to filter the results.
        schema:
          type: boolean
      - name: autoGenerated
        in: query
        required: false
        description: Filter the results based on whether or not the category was autogenerated.
        schema:
          type: boolean
      - name: includeValue
        in: query
        required: false
        description: If set to FALSE, all categories returned will have an empty value
          field. If set to TRUE, all categories returned will have their correct value
          field.
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/categoriesCollection"
              example:
                $ref: "#/components/examples/getCategoriesResponse/value"
            application/json:
              schema:
                $ref: "#/components/schemas/categoriesCollection"
              example:
                $ref: "#/components/examples/getCategoriesResponse/value"
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "404":
          description: The taxonomy does not exist.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/notFoundError/value"
    post:
      summary: Create a new category
