      operationId: getCategoryConfiguration
      description: >
        Gets a configuration for the category of the specified taxonomy. The
        configuration for a category will be in the format: `Category
        ID:category_id\n num:category_name:category_value` which can be used to
        create a binary model to match the text/documents to the defined
        category.
