  "/taxonomies/{taxonomyId}/categories#duplicateCategory":
    post:
      summary: Duplicate a category
      operationId: createDuplicateCategory
      description: >
        Enables a user to duplicate a category and its children. The target
        destination can be

        inside or outside of the original taxonomy.
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: The ID of the taxonomy that contains the category which needs
          to be duplicated.
        schema:
          type: string
      - name: from
        in: query
        required: true
        description: The ID of the category to copy.
        schema:
          type: string
      - name: newTaxonomyId
        in: query
        description: If duplicating directly under a taxonomy, this is the ID of that
          taxonomy.  Note that this value should not be set if duplicating to a new
          parent category, as the taxonomy of the parent will be inherited.
        schema:
          type: string
      - name: newParentId
        in: query
        description: The new parent category ID.  Note - if this value is set, the
          newTaxonomyId should not be set, as the taxonomy will be inferred from the
          new parent.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.text.category+json:
            schema:
              $ref: "#/components/schemas/duplicateCategory"
            example:
              $ref: "#/components/examples/getCategoryResponse/value"
          application/json:
            schema:
              $ref: "#/components/schemas/duplicateCategory"
            example:
              $ref: "#/components/examples/getCategoryResponse/value"
        description: Request body containing the name of the duplicated category.
          If we don't specify the body, a unique name will be generated for the duplicated
          category which will be unique to the parent of the duplicated category.
      tags:
      - Categories
      responses:
        "201":
          description: The category was successfully duplicated, returns the category.
          headers:
            Last-Modified:
              description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the category was last modified.
              schema:
                type: string
                format: date-time
            ETag:
              description: The entity tag for the duplicated category.
              schema:
                type: string
            Location:
              description: The URL of the duplicated category.
              schema:
                type: string
          content:
            application/vnd.sas.text.category+json:
              schema:
                $ref: "#/components/schemas/category"
              example:
                $ref: "#/components/examples/getCategoryResponse/value"
            application/json:
              schema:
                $ref: "#/components/schemas/category"
              example:
                $ref: "#/components/examples/getCategoryResponse/value"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.text.category+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error2/value"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                $ref: "#/components/examples/error2/value"
