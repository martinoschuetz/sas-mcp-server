---
openapi: 3.0.3
info:
  description: An API to manage the data mining warehouse.  The Data Mining Warehouse
    provides a REST API to retrieve data mining records.  The records are generated
    by data mining operations.
  version: "1"
  title: Data Mining Warehouse
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: https://support.sas.com/techsup/license/index.html
tags:
- name: Warehouse
  description: An API for retrieving data mining records.
- name: ColumnName
  description: Contains the operations for managing column names.
- name: GlobalVariableMetadata
  description: Contains the operations for managing the global variable metadata.
- name: VariableMetadata
  description: Contains the operations for managing a data mining project's variable
    metadata.
- name: Projects
  description: Contains the operations for managing resources associated with projects.
- name: Components
  description: Contains the operations for managing resources associated with components.
paths:
  /:
    get:
      tags:
      - Warehouse
      summary: Get the API object
      description: The API object.
      operationId: root
      responses:
        "200":
          description: The API was retrieved.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningWarehouseRootResponse"
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getDataMiningWarehouseRootResponse"
  /warehouseRecords/{resourceId}:
    head:
      tags:
      - Warehouse
      summary: Data mining records corresponding to the specified id
      description: Get headers for the data mining warehouse records for a project
        or a component.
      operationId: headersForWarehouseRecords
      parameters:
      - name: resourceId
        in: path
        description: resourceId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The data mining warehouse records were found.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
        "404":
          description: The data mining warehouse records were not found.
    get:
      tags:
      - Warehouse
      summary: Data mining records corresponding to the specified id
      description: Get the data mining warehouse records for a project or a component.
      operationId: getWarehouseRecords
      parameters:
      - name: resourceId
        in: path
        description: resourceId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The data mining warehouse records were found.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/warehouseRecords"
              examples:
                json:
                  $ref: "#/components/examples/getWarehouseRecordsCollection"
            application/vnd.sas.analytics.data.mining.warehouse.records+json:
              schema:
                $ref: "#/components/schemas/warehouseRecords"
              examples:
                json:
                  $ref: "#/components/examples/getWarehouseRecordsCollection"
        "404":
          description: The data mining warehouse records were not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getInvalidWarehouseRecordsCollection"
            application/vnd.sas.analytics.data.mining.warehouse.records+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getInvalidWarehouseRecordsCollection"
