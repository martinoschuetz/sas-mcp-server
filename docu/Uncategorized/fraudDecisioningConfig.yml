    api:
      description: Return a list of API Links
      value: {"version": 1, "links": [{"method": "GET", "rel": "getAPI", "href": "/fraudDecisioningConfig",
            "uri": "/fraudDecisioningConfig", "responseType": "application/vnd.sas.api+json"},
          {"method": "GET", "rel": "getStatus", "href": "/fraudDecisioningConfig/status",
