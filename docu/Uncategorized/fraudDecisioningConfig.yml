          {"id": "b8278e3b-920b-49a4-83e9-4c76d9266d0c", "name": "Fraud Decisioning\
              \ Demographic", "type": "variable_set_by_sas", "state": "Deployed",
            "revision": 2, "creationTimeStamp": "2023-05-28T02:36:58.10382Z", "createdBy": "sas.fraudDecisioningConfig",
            "modifiedTimeStamp": "2023-05-28T02:37:05.025055Z", "modifiedBy": "sas.fraudDecisioningConfig"},
          {"id": "190d3861-7958-48c5-9683-2ecab49f0f98", "name": "Fraud Decisioning\
