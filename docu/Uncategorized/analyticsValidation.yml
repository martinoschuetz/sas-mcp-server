---
openapi: 3.0.3
info:
  title: Analytics Validation
  description: A validation API for analytics applications
  version: "3"
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: "http://example.com/analyticsValidation"
  description: kubernetes mock server
tags:
- name: Root
  description: The operations for the root resource.
- name: ValidationModels
  description: The operations for the validation model resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers: {}
          content:
            "application/vnd.sas.api+json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetRequest200Response"
            "application/json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetRequest200Response"
    head:
      tags:
      - Root
      summary: Get the headers for the API
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
  /models:
    get:
      tags:
      - ValidationModels
      summary: Get a collection of validation models
      description: Returns a collection of models based on the specified pagination,
        filtering, and sorting options. The media type of the items in the collection
        is controlled using the Accept-Item header.
      operationId: getModels
      parameters:
      - name: start
        description: 0-based Offset of first model to return.  Defaults to 0.
        in: query
        schema:
          type: integer
          default: 0
      - name: limit
        description: The maximum number of models to return. Defaults to 30.
        in: query
        schema:
          type: integer
          default: 30
      - name: filter
        in: query
        description: "The criteria for filtering the models. See [Filtering in REST\
          \ APIs](https://developer.sas.com/rest-apis/analyticsValidation-v3/docs/getting-started/usage-notes#filtering)."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "The criteria for sorting the models. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/analyticsValidation-v3/docs/getting-started/usage-notes#sorting)."
        schema:
          type: string
          format: sort-criteria
      - name: unlocalized
        in: query
        description: Disables localization in the response when this query parameter
          is present.
        required: false
        allowEmptyValue: true
        schema:
          type: string
      - name: Accept-Item
        in: header
        description: Requested media type for model collection items.
        required: false
        schema:
          type: string
          enum:
          - "application/vnd.sas.validation.model.summary+json"
          - "application/vnd.sas.summary+json"
          - "application/vnd.sas.validation.model+json"
          default: "application/vnd.sas.analytics.validation.model.summary+json"
      responses:
        "200":
          description: The request succeeded.
          content:
            "application/vnd.sas.collection+json":
              schema:
                $ref: "#/components/schemas/validationModelCollection"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetValidationModelsRequest200Response"
            "application/json":
              schema:
                $ref: "#/components/schemas/validationModelCollection"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetValidationModelsRequest200Response"
          headers: {}
    post:
      tags:
      - ValidationModels
      summary: Create a new validation model
      description: Creates a new validation model based on the representation in the
        request body.
      operationId: createModel
      requestBody:
        content:
          "application/vnd.sas.analytics.validation.model+json":
            schema:
              $ref: "#/components/schemas/createValidationModel"
            examples:
              json:
                $ref: "#/components/examples/creationRequest"
          "application/vnd.sas.analytics.validation.model+xml":
            schema:
              $ref: "#/components/schemas/createValidationModel"
            examples:
              json:
                $ref: "#/components/examples/validationModelXMLPostRequestBody"
          "application/json":
            schema:
              $ref: "#/components/schemas/createValidationModel"
            examples:
              json:
                $ref: "#/components/examples/creationRequest"
        description: The representation of a validation model.
        required: true
      responses:
        "201":
          description: A model was created.
          headers:
            Location:
              description: The URL of the model.
              schema:
                type: string
                format: uri
            ETag:
              description: A tag that identifies the revision of the model.
              schema:
                type: string
          content:
            "application/vnd.sas.analytics.validation.model+json":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPostValidationModelRequest201Response"
            "application/vnd.sas.analytics.validation.model+xml":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                Default:
                  $ref: "#/components/examples/validationModelXMLPostResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPostValidationModelRequest201Response"
        "400":
          description: The request was invalid.
          content:
            "application/vnd.sas.analytics.validation.model+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPostValidationModelRequest400Response"
            "application/vnd.sas.analytics.validation.model+xml":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                xml:
                  $ref: "#/components/examples/validationModelXMLBadRequestResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPostValidationModelRequest400Response"
  "/models/{validationModelId}":
    get:
      tags:
      - ValidationModels
      summary: Get a validation model
      description: Returns the requested representation of the specified model.
      operationId: getModel
      parameters:
      - name: validationModelId
        in: path
        description: The unique identifier for the model.
        required: true
        schema:
          type: string
      - name: unlocalized
        in: query
        description: Disables localization in the response when this query parameter
          is present.
        required: false
        allowEmptyValue: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of the model.
              schema:
                type: string
            "Last-Modified":
              description: The time at which the model was last updated.
              schema:
                type: string
          content:
            "application/vnd.sas.analytics.validation.model+json":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetValidationModelbyIdRequest200Response"
            "application/vnd.sas.analytics.validation.model+xml":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                Default:
                  $ref: "#/components/examples/validationModelXMLGetResponse"
            "application/vnd.sas.analytics.validation.model.summary+json":
              schema:
                $ref: "#/components/schemas/validationModelSummary"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetValidationModelbyIdRequest200ValidationModelSummaryResponse"
            "application/vnd.sas.summary+json":
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetValidationModelbyIdRequest200SasSummaryResponse"
            "application/vnd.sas.transfer.object+json":
              schema:
                # Override the transfer object so we can set content property type to be string instead of object
                # $ref: 'http://swagger.na.sas.com/reference/schema/application/vnd.sas.transfer.object/v1/transferObject.yaml'
                title: Transfer Object
                description: Content providers implementing the Transfer Object Provider
                  contract use this media type to store information about the content
                  to be transferred.
                x-sas-media-type:
                  name: application/vnd.sas.transfer.object
                  version: 1
                properties:
                  id:
                    type: string
                    format: object-id
                    description: unique identifier of the object
                  version:
                    type: integer
                    description: This media type's schema version number. This representation
                      is version 1.
                  summary:
                    $ref: "#/components/schemas/summary"
                  content:
                    type: string
                    description: optional. Choose this or fileServiceContent. This
                      is the content object that must be serialized in a format that
                      is valid for internet transmission. This includes valid encoding
                      formats like Base64 or data structures like JSON. This is provided
                      by the content provider and the transfer service expects no
                      visibility into or understanding of this value.
                  fileServiceContent:
                    type: string
                    description: optional. Choose this or content. This holds the
                      URI of a file service object that contains the transferable
                      object.
                  connectors:
                    type: array
                    description: a list of associations or references to other external
                      objects to be recreated on import
                    items:
                      $ref: "#/components/schemas/transferObjectConnector"
                  substitutions:
                    type: object
                    description: map with keys of parameter and value. Used to replace
                      the value of parameter with the value of value
                  links:
                    type: array
                    description: Paging links that apply to this object
                    items:
                      $ref: "#/components/schemas/link"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetValidationModelbyIdRequest200TransferObjectResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                json:
                  $ref: "#/components/examples/modelResponse"
        "403":
          description: Either no model exists at the requested path or the user is
            not authorized to access it.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetValidationModelbyIdRequest403Response"
        "404":
          description: No model exists at the requested path (when requested by an
            administrator).
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetValidationModelbyIdRequest404Response"
    head:
      tags:
      - ValidationModels
      summary: Get headers a validation model
      description: Returns the headers that would be returned on a GET of the specified
        model.
      operationId: headersForModel
      parameters:
      - name: validationModelId
        in: path
        description: The unique identifier for the model.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of the model.
              schema:
                type: string
            "Last-Modified":
              description: The time at which the model was last updated.
              schema:
                type: string
        "403":
          description: Either no model exists at the requested path or the user is
            not authorized to access it.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetValidationModelbyIdRequest403Response"
        "404":
          description: No model exists at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationGetValidationModelbyIdRequest404Response"
    put:
      tags:
      - ValidationModels
      summary: Update or create a validation model
      description: This operation updates an existing model. It also can be used to
        create a new model with a specific id; however, POST is the recommended creation
        method for all users. The request body must contain an id that matches the
        {validationModelId} path element.
      operationId: updateModel
      parameters:
      - name: validationModelId
        in: path
        description: The unique identifier for the model.
        required: true
        schema:
          type: string
      - in: header
        name: If-Match
        description: Update the scope resource only if the resource's current ETag
          header matches this value.
        schema:
          type: string
      - in: header
        name: If-Unmodified-Since
        description: Update the scope resource only if the resource has not been modified
          since the given time.
        schema:
          type: string
      - name: parentFolderUri
        in: query
        description: The relative URI of the parent folder where the validation model
          will be created. If specified, the validation model is created in this folder.
        required: false
        schema:
          type: string
      requestBody:
        content:
          "application/vnd.sas.analytics.validation.model+json":
            schema:
              $ref: "#/components/schemas/updateValidationModel"
            examples:
              Default:
                $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequestBody"
          "application/vnd.sas.analytics.validation.model+xml":
            schema:
              $ref: "#/components/schemas/updateValidationModelXml"
            examples:
              Default:
                $ref: "#/components/examples/validationModelXMLPutRequestBody"
          "application/json":
            schema:
              $ref: "#/components/schemas/updateValidationModel"
            examples:
              Default:
                $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequestBody"
        description: The representation of a model.
        required: true
      responses:
        "200":
          description: An existing model was updated.
          headers:
            ETag:
              description: A tag that identifies the revision of the updated model.
              schema:
                type: string
          content:
            "application/vnd.sas.analytics.validation.model+json":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                json:
                  $ref: "#/components/examples/modelResponse"
            "application/vnd.sas.analytics.validation.model+xml":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                Default:
                  $ref: "#/components/examples/validationModelXMLPut200Response"
            "application/json":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest200Response"
        "201":
          description: A new model was created.
          headers:
            ETag:
              description: A tag that identifies the revision of the created model.
              schema:
                type: string
            Location:
              description: The URL of the validation model.
              schema:
                type: string
                format: uri
          content:
            "application/vnd.sas.analytics.validation.model+json":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest201Response"
            "application/vnd.sas.analytics.validation.model+xml":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                Default:
                  $ref: "#/components/examples/validationModelXMLPut201Response"
            "application/json":
              schema:
                $ref: "#/components/schemas/validationModel"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest201Response"
        "400":
          description: The request is invalid.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest400Response"
        "403":
          description: Either no model exists at the requested path or the user is
            not authorized to access it.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest403Response"
        "412":
          description: Precondition Failed. The If-Match header or the If-Unmodified-Since
            header has not been satisfied.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest412Response"
        "428":
          description: Precondition Required. An If-Match or If-Unmodified-Since is
            required and neither was specified.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest428Response"
    delete:
      tags:
      - ValidationModels
      summary: Delete a validation model
      description: Deletes the specified model.
      operationId: deleteTemplate
      parameters:
      - name: validationModelId
        in: path
        description: The unique identifier for the model.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The model was deleted.
        "403":
          description: Either no model exists at the requested path or the user is
            not authorized to access it.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationDeleteValidationModelbyIdRequest403Response"
        "404":
          description: No model exists at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationDeleteValidationModelbyIdRequest404Response"
  "/models/{validationModelId}#transfer":
    put:
      tags:
      - ValidationModels
      summary: Create or update a validation model from a transfer object
      description: Updates a validation model to match the content of the provided
        transfer object. If the validation model does not exist, it is created. This
        is not a conditional PUT request. This endpoint is meant for use via the transfer
        microservice.
      operationId: updateModelFromTransfer
      parameters:
      - name: validationModelId
        in: path
        description: The unique identifier for the validation model.
        required: true
        schema:
          type: string
      requestBody:
        content:
          "application/vnd.sas.transfer.object+json":
            schema:
              # Override the transfer object so we can set content property type to be string instead of object
              # $ref: 'http://swagger.na.sas.com/reference/schema/application/vnd.sas.transfer.object/v1/transferObject.yaml'
              title: Transfer Object
              description: Content providers implementing the Transfer Object Provider
                contract use this media type to store information about the content
                to be transferred.
              x-sas-media-type:
                name: application/vnd.sas.transfer.object
                version: 1
              properties:
                id:
                  type: string
                  format: object-id
                  description: unique identifier of the object
                version:
                  type: integer
                  description: This media type's schema version number. This representation
                    is version 1.
                summary:
                  $ref: "#/components/schemas/summary"
                content:
                  type: string
                  description: optional. Choose this or fileServiceContent. This is
                    the content object that must be serialized in a format that is
                    valid for internet transmission. This includes valid encoding
                    formats like Base64 or data structures like JSON. This is provided
                    by the content provider and the transfer service expects no visibility
                    into or understanding of this value.
                fileServiceContent:
                  type: string
                  description: optional. Choose this or content. This holds the URI
                    of a file service object that contains the transferable object.
                connectors:
                  type: array
                  description: a list of associations or references to other external
                    objects to be recreated on import
                  items:
                    $ref: "#/components/schemas/transferObjectConnector"
                substitutions:
                  type: object
                  description: map with keys of parameter and value. Used to replace
                    the value of parameter with the value of value
                links:
                  type: array
                  description: Paging links that apply to this object
                  items:
                    $ref: "#/components/schemas/link"
            examples:
              Default:
                $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdTransferObjectRequestBody"
        description: The transfer object containing the validation model.
        required: true
      responses:
        "200":
          description: An existing validation model was updated.
          headers: {}
          content:
            "application/vnd.sas.summary+json":
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest200SasSummaryResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest200SasSummaryResponse"
        "201":
          description: A validation model was created.
          headers:
            Location:
              description: The URL of the validation model.
              schema:
                type: string
                format: uri
          content:
            "application/vnd.sas.summary+json":
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest201SasSummaryResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest201SasSummaryResponse"
        "400":
          description: The validation model could not be created because the request
            was invalid.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPutValidationModelbyIdRequest400TransferObjectResponse"
  "/models/{validationModelId}/validationResults":
    post:
      tags:
      - ValidationModels
      summary: Validate properties
      description: Validates the given property map against a validation model. Any
        constraint violations are returned in an as part of an error array in the
        response, but they do not cause this request to fail with an error status.
        As part of the validation, the given property map is used to evaluate all
        expressions in the validation model. Those expression values are also returned,
        as part of the validation model in the response. The returned validation response
        is not a persistent resource and does not have a location.
      operationId: createValidationResults
      parameters:
      - name: validationModelId
        in: path
        description: The unique identifier for the model.
        required: true
        schema:
          type: string
      requestBody:
        content:
          "application/vnd.sas.analytics.validation.request+json":
            schema:
              $ref: "#/components/schemas/validationRequest"
            examples:
              json:
                $ref: "#/components/examples/validationRequest"
          "application/json":
            schema:
              $ref: "#/components/schemas/validationRequest"
            examples:
              json:
                $ref: "#/components/examples/validationRequest"
        description: Validation request
        required: true
      responses:
        "201":
          description: Success
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            "application/vnd.sas.analytics.validation.response+json":
              schema:
                $ref: "#/components/schemas/validationResponse"
              examples:
                json:
                  $ref: "#/components/examples/validationResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/validationResponse"
              examples:
                json:
                  $ref: "#/components/examples/validationResponse"
        "400":
          description: Validation could not complete due to an invalid request.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPostValidationModelRequest400Response"
        "403":
          description: Either no model exists at the requested path or the user is
            not authorized to access it.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPostValidationModelRequest400Response"
        "404":
          description: No model exists at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPostValidationModelRequest400Response"
  /overrideCache/invalidations:
    post:
      tags:
      - ValidationModels
      summary: Invalidate constraint override cache
      description: Invalidates entries in the constraint override cache based on the
        representation in the request body.
      operationId: createCacheInvalidation
      requestBody:
        content:
          "application/vnd.sas.analytics.override.cache.invalidation+json":
            schema:
              $ref: "#/components/schemas/cacheInvalidationRequest"
            examples:
              json:
                $ref: "#/components/examples/cacheInvalidationRequest"
          "application/json":
            schema:
              $ref: "#/components/schemas/cacheInvalidationRequest"
            examples:
              json:
                $ref: "#/components/examples/cacheInvalidationRequest"
        description: Parameters controlling the cache entry or entries to be invalidated.
        required: true
      responses:
        "204":
          description: Cache invalidation was successful.
        "400":
          description: The request was invalid.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsValidationPostCacheInvalidationRequest400Response"
components:
  schemas:
    createValidationModel:
      title: Create Validation Model
      description: The representation used to create a new model.
      properties:
        name:
          type: string
          description: The model name.
        description:
          type: string
          description: The model description.
        links:
          description: The links that apply to the model.
          type: array
          items:
            $ref: "#/components/schemas/link"
        items:
          type: array
