    AnalyticsValidationPutValidationModelbyIdRequest201Response:
      description: Analytics Validation PUT Validation Model by id request - successful
        response.
      value:
        createdBy: '{creator}'
        creationTimeStamp: '2024-03-28T08:40:38.272632Z'
        description: Fits a Bayesian additive regression trees (BART) model for an
          interval target.
        eTag: '{e-tag}'
        id: '{vm-id}'
        items:
        - id: '{vm-item-id}'
          array: false
          enabledWhen: train==true
          enabledWhenValue: true
          clientProperties:
            properties:
            - name: organizationalGroup
              value: 'true'
          itemType: group
          style: nested
          items:
          - id: '{vm-item-property-id}'
            name: nTrees
            displayName: Number of trees
            description: Specifies the number of trees in the sum-of-trees model.
            array: false
            enabledWhen: ''
            enabledWhenValue: true
            clientProperties:
              properties: []
            itemType: property
            items:
            type: integer
            required: true
            selector: false
            constraints:
            - type: range
              enabledWhen: ''
              enabledWhenValue: true
              min: '1'
              max: '1000'
              includeMin: true
              includeMax: true
              choices:
          - id: '{vm-item-id}'
            displayName: Tree-splitting Options
            array: false
            enabledWhen: ''
            enabledWhenValue: true
            clientProperties:
              properties:
              - name: initialState
                value: collapsed
            itemType: group
            style: nested
            items:
            - id: '{vm-item-property-id}'
              name: minLeafSize
              displayName: Minimum leaf size
              description: Specifies the smallest number of training observations
                that a leaf can have.
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties: []
              itemType: property
              items:
              type: integer
              required: true
              selector: false
              constraints:
              - type: range
                enabledWhen: ''
                enabledWhenValue: true
                min: '1'
                includeMin: true
                includeMax: true
                choices:
            - id: '{vm-item-property-id}'
              name: missingValues
              displayName: Missing values
              description: Specifies how a splitting rule handles an observation with
                missing values. "Use in search" indicates that missing values are
                treated as their own level for both nominal and interval inputs. "Use
                as machine largest" indicates that missing values are used as their
                own level for nominal inputs and as the largest machine value for
                interval inputs. "Use as machine smallest" indicates that missing
                values are used as their own level for nominal inputs and as the smallest
                machine value for interval inputs. "Ignore" indicates that missing
                values are not included in the model.
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties: []
              itemType: property
              items:
              type: string
              required: true
              selector: false
              constraints:
              - type: choicelist
                enabledWhen: ''
                enabledWhenValue: true
                includeMin:
                includeMax:
                choices:
                - value: USEINSEARCH
                  displayValue: Use in search
                - value: MACBIG
                  displayValue: Use as machine largest
                - value: MACSMALL
                  displayValue: Use as machine smallest
                - value: NONE
                  displayValue: Ignore
            - id: '{vm-item-property-id}'
              name: intervalBins
              displayName: Number of interval bins
              description: Specifies the number of bins in which to bin the interval
                inputs.
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties: []
              itemType: property
              items:
              type: integer
              required: true
              selector: false
              constraints:
              - type: range
                enabledWhen: ''
                enabledWhenValue: true
                min: '2'
                max: '500'
                includeMin: true
                includeMax: true
                choices:
            - id: '{vm-item-property-id}'
              name: intBinMethod
              displayName: Interval bin method
              description: Specifies the method to use to bin the interval inputs.
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties: []
              itemType: property
              items:
              type: string
              required: true
              selector: false
              constraints:
              - type: choicelist
                enabledWhen: ''
                enabledWhenValue: true
                includeMin:
                includeMax:
                choices:
                - value: BUCKET
                  displayValue: Bucket
                - value: QUANTILE
                  displayValue: Quantile
            required:
            selector: false
            constraints:
          - id: '{vm-item-id}'
            displayName: MCMC Options
            array: false
            enabledWhen: ''
            enabledWhenValue: true
            clientProperties:
              properties:
              - name: initialState
                value: collapsed
            itemType: group
            style: nested
            items:
            - id: '{vm-item-property-id}'
              name: nDistChains
              displayName: Number of Markov chains
              description: Specifies the number of separate Markov chains to run in
                parallel. The fit of a BART model depends on the number of chains
                that you run. The number cannot exceed the number of worker nodes,
                and the default value is equal to the number of workers. To use the
                default value, leave the value as blank. Any value that you specify
                for this option is ignored if you are in single-machine mode.
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties: []
              itemType: property
              items:
              type: integer
              required: false
              selector: false
              constraints:
              - type: range
                enabledWhen: ''
                enabledWhenValue: true
                min: '1'
                includeMin: true
                includeMax: true
                choices:
            - id: '{vm-item-property-id}'
              name: nIters
              displayName: Number of iterations
              description: Specifies the number of MCMC iterations per chain in the
                main simulation loop. This number excludes the burn-in iterations.
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties: []
              itemType: property
              items:
              type: integer
              required: true
              selector: false
              constraints:
              - type: range
                enabledWhen: ''
                enabledWhenValue: true
                min: '1'
                includeMin: true
                includeMax: true
                choices:
            - id: '{vm-item-property-id}'
              name: burninIters
              displayName: Number of burn-in iterations
              description: Specifies the number of initial "burn-in" iterations per
                chain to discard before samples are saved for prediction and posterior
                statistics.
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties: []
              itemType: property
              items:
              type: integer
              required: true
              selector: false
              constraints:
              - type: range
                enabledWhen: ''
                enabledWhenValue: true
                min: '1'
                includeMin: true
                includeMax: true
                choices:
            - id: '{vm-item-property-id}'
              name: thinRate
              displayName: Thinning rate
              description: Specifies the thinning rate for the simulation. For a thinning
                rate value of k, the simulation keeps every kth sample per chain for
                prediction and posterior statistics, and then discards the rest of
                the samples. Thinning is a strategy that can reduce autocorrelation
                among posterior samples at the cost of discarding a potentially large
                number of samples.
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties: []
              itemType: property
              items:
              type: integer
              required: true
              selector: false
              constraints:
              - type: range
                enabledWhen: ''
                enabledWhenValue: true
                min: '1'
                includeMin: true
                includeMax: true
                choices:
            - id: '{vm-item-property-id}'
              name: maxTime
              displayName: Maximum time (seconds)
              description: Specifies the maximum time (in seconds) to use to train
                the model. A value of 0 indicates that no maximum time is set.
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties: []
              itemType: property
              items:
              type: double
              required: true
              selector: false
              constraints:
              - type: range
                enabledWhen: ''
                enabledWhenValue: true
                min: '0'
                includeMin: true
                includeMax: true
                choices:
            - id: '{vm-item-property-id}'
              name: randomSeed
              displayName: Seed
              description: Specifies the initial random number seed for model building.
                The random sampling depends on how the data are distributed across
                machines and threads. Specifying the same seed across multiple runs
                might yield different results for each run.
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties: []
              itemType: property
              items:
              type: integer
              required: true
              selector: false
              constraints:
              - type: range
                enabledWhen: ''
                enabledWhenValue: true
                min: '0'
                max: '2147483647'
                includeMin: true
                includeMax: true
                choices:
            required:
            selector: false
            constraints:
          - id: '{vm-item-property-id}'
            name: exactPctlLift
            displayName: Use the exact percentile method for lift calculations
            description: Specifies whether to use the exact percentile method for
              calculating lift and related assessment measures.  When unchecked, the
              iterative method is used.  Note that the exact method should be used
              if there are convergence errors using the iterative method.
            array: false
            enabledWhen: ''
            enabledWhenValue: true
            clientProperties:
              properties: []
            itemType: property
            items:
            type: boolean
            required: true
            selector: false
            constraints: []
          required:
          selector: false
          constraints:
        - id: '{vm-item-id}'
          displayName: Post-training Properties
          description: Changing these properties will not retrain the model.
          array: false
          enabledWhen: ''
          enabledWhenValue: true
          clientProperties:
            properties:
            - name: organizationalGroup
              value: 'true'
          itemType: group
          style: nested
          items:
          - id: '{vm-item-id}'
            displayName: Model Interpretability
            array: false
            enabledWhen: ''
            enabledWhenValue: true
            clientProperties:
              properties: []
            itemType: group
            style: nested
            items:
            - id: '{vm-item-id}'
              displayName: Global Interpretability
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties:
                - name: initialState
                  value: collapsed
              itemType: group
              style: nested
              items:
              - id: '{vm-item-property-id}'
                name: performVI
                displayName: Variable importance
                description: Specifies whether to display a table of relative importance
                  values for the input variables. The values are calculated using
                  a one-level decision tree for each input to predict the predicted
                  value as a global surrogate model. For tree-based supervised learning
                  models, the variable importance table from the actual model is displayed
                  as well.
                array: false
                enabledWhen: ''
                enabledWhenValue: true
                clientProperties:
                  properties: []
                itemType: property
                items:
                type: boolean
                required: true
                selector: false
                constraints: []
              - id: '{vm-item-property-id}'
                name: pdPlots
                displayName: PD plots
                description: Specifies whether to display Partial Dependency (PD)
                  plots that show the relationship between model inputs and their
                  predictions.
                array: false
                enabledWhen: ''
                enabledWhenValue: true
                clientProperties:
                  properties: []
                itemType: property
                items:
                type: boolean
                required: true
                selector: false
                constraints: []
              required:
              selector: false
              constraints:
            - id: '{vm-item-id}'
              displayName: Local Interpretability
              array: false
              enabledWhen: ''
              enabledWhenValue: true
              clientProperties:
                properties:
                - name: initialState
                  value: collapsed
              itemType: group
              style: nested
              items:
              - id: '{vm-item-property-id}'
                name: icePlots
                displayName: ICE plots
                description: Specifies whether to display Individual Conditional Expectation
                  (ICE) plots. ICE plots can help reveal interesting subgroups and
                  interactions between model variables.
                array: false
                enabledWhen: ''
                enabledWhenValue: true
                clientProperties:
                  properties: []
                itemType: property
                items:
                type: boolean
                required: true
                selector: false
                constraints: []
              - id: '{vm-item-property-id}'
                name: performLime
                displayName: LIME
                description: Specifies whether to use the Locally Interpretable Model-Agnostic
                  Explanation (LIME) method to explain the model predictions.
                array: false
                enabledWhen: ''
                enabledWhenValue: true
                clientProperties:
                  properties: []
                itemType: property
                items:
                type: boolean
                required: true
                selector: false
                constraints: []
              - id: '{vm-item-property-id}'
                name: performKernelShap
                displayName: HyperSHAP
                description: Specifies whether to use the Shapley Explainer (HyperSHAP)
                  method to explain the model predictions.
                array: false
                enabledWhen: ''
                enabledWhenValue: true
                clientProperties:
                  properties: []
                itemType: property
                items:
                type: boolean
                required: true
                selector: false
                constraints: []
              - id: '{vm-item-property-id}'
                name: maxNumShapVars
                displayName: Maximum number of HyperSHAP variables
                description: Specifies the maximum number of HyperSHAP variables to
                  plot.
                array: false
                enabledWhen: performKernelShap==true
                enabledWhenValue: true
                clientProperties:
                  properties:
                  - name: hideWhenDisabled
                    value: 'true'
                itemType: property
                items:
                type: integer
                required: true
                selector: false
                constraints:
                - type: range
                  enabledWhen: ''
                  enabledWhenValue: true
                  min: '0'
                  max: '100'
                  includeMin: false
                  includeMax: true
                  choices:
              - id: '{vm-item-property-id}'
                name: specifyRows
                displayName: Specify instances to explain
                description: Specifies the individual observations to provide explanation.
                  The "Random" observations option provides explanations for five
                  randomly selected observations.  The "Specify up to 5" observations
                  option enables you to provide IDs for the specific observations
                  in the data. The IDs should be unique values of the variable that
                  has the role "Key" in the metadata.  If no variable is assigned
