---
openapi: 3.0.3
info:
  title: Tenant Orchestration
  description: |
    The Tenant Orchestration API Manages data relating to tenants and multi-tenant services.
    Service state related to tenant transitions is aggregated by this API at the tenant level.
  version: "1"
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: https://developer.sas.com
servers:
- url: https://example.com/tenantOrchestration/v1
  description: Example server for development and testing.
tags:
- name: Root
  description: API root operations.
- name: Tenants
  description: Operations related to tenants.
paths:
  /:
    get:
      operationId: root
      summary: API root resource
      description: Returns basic API information.
      tags:
      - Root
      responses:
        "200":
          description: API root
          headers:
            Cache-Control:
              description: Caching policies for the response.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Welcome to the Tenant Orchestration API."
  /tenants:
    get:
      operationId: getTenants
      summary: List tenants
      description: Returns a list of current tenants, with optional filtering and
        pagination.
      tags:
      - Tenants
      parameters:
      - name: filter
        in: query
        description: Optional filter expression for advanced filtering. This is in
          addition to the explicit scalar attribute filters.
        schema:
          type: string
      - name: shortName
        in: query
        description: Filter tenants by short name.
        schema:
          type: string
          pattern: "^[a-z][0-9a-z-]{1,38}[0-9a-z]$"
      - name: desiredState
        in: query
        description: Filter tenants by desired state.
        schema:
          type: string
      - name: currentState
        in: query
        description: Filter tenants by current state.
        schema:
          type: string
      - name: start
        in: query
        description: Zero-based index of the first item to return (pagination).
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        description: Maximum number of items to return (pagination).
        schema:
          type: integer
          minimum: 1
          default: 10
      - name: sortBy
        in: query
        description: >-
          Sort the collection by the specified field and direction. The format
          is `field:direction` where direction is `ascending` or `descending`.
          Sortable fields: `shortName`, `desiredState`, `dataPlaneIngress`,
          `currentState`.
        schema:
          type: string
          default: "shortName:ascending"
        example: "shortName:ascending"
      - name: If-None-Match
        in: header
        description: Return the resource only if the ETag does not match.
        required: false
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        description: Return the resource only if it has been modified since the specified
          date/time.
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: List of tenants
          headers:
            Cache-Control:
              description: Caching policies for the response.
              schema:
                type: string
