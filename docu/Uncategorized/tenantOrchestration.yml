  /tenants/{tenantId}:
    parameters:
    - name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: Unique identifier for the tenant (UUID).
    get:
      operationId: getTenant
      summary: Get tenant
      description: Retrieves the specified tenant, including desired and current state.
      tags:
      - Tenants
      responses:
        "200":
          description: Tenant details
          headers:
            ETag:
              description: The current entity tag for the resource.
              schema:
                type: string
            Last-Modified:
              description: The date and time the resource was last modified.
              schema:
                type: string
                format: date-time
            Cache-Control:
              description: Caching policies for the response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tenant"
              example:
                id: "b344ae2b-fd43-4627-8f6a-2c98707ebc01"
                shortName: "tenant1"
                desiredState: "active"
                currentState: "active"
                stateDetails:
                  sas-logon-app:
                    state: "onboarded"
                  sas-configuration:
                    state: "onboarded"
                  sas-file-store:
                    state: "onboarded"
        "404":
