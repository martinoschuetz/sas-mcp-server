    put:
      operationId: updateTenantStateTransitionStepState
      summary: Update the state of a specific step
      description: |
        Updates the state of a specific step within a state transition. Used by step executors
        to report step progress to the Tenant Orchestration service, which then persists
        the update to the database.

        TransitionStep records are pre-created as pending by TenantOrch at transition
        start, including steps for known extended tenant jobs. This endpoint updates an
        existing step record; it does not create a new step.

        Valid state transitions are:
        - pending → running
        - running → success
        - running → failed

        When transitioning to failed, the failureDetails field is required.

        Callers should call GET on this sub-resource before PUT in retry scenarios
        to avoid overwriting a terminal state (success or failed) that was already recorded.

        At least one precondition header (If-Match or If-Unmodified-Since) must be specified.
        Failure to specify a precondition will yield a 428 response.
        If the precondition does not match, a 412 response will be returned.
      tags:
      - Tenants
      parameters:
      - name: tenantId
        in: path
        required: true
        description: The id of the tenant.
        schema:
          type: string
          format: uuid
      - name: transitionId
        in: path
        required: true
        description: The id of the state transition.
        schema:
          type: string
          format: uuid
      - name: stepId
        in: path
        required: true
        description: The id of the step transition.
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        description: ETag value for conditional update. Required if If-Unmodified-Since
          is not provided.
        required: false
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: Timestamp value for conditional update. Required if If-Match
          is not provided.
        required: false
        schema:
          type: string
          format: date-time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/stateTransitionStepUpdate"
            examples:
              markRunning:
                summary: Mark step as running
                value:
                  state: "running"
              markSuccess:
                summary: Mark step as completed successfully
                value:
                  state: "success"
              markFailed:
                summary: Mark step as failed with details
                value:
                  state: "failed"
                  failureDetails: "Pod failed to start: ImagePullBackOff on container\
                    \ sas-logon-app"
      responses:
        "200":
          description: Step state updated successfully. Returns the updated step state.
          headers:
            ETag:
              description: The current entity tag for the resource.
              schema:
                type: string
            Last-Modified:
              description: The date and time the resource was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tenantStepState"
              example:
                state: "running"
        "400":
          description: Bad request. The state transition is invalid (e.g., success
            → running) or failureDetails is missing for a failed transition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                version: "2"
                httpStatusCode: 400
                errorCode: 190401
                message: "Invalid state transition: success → running. failureDetails\
                  \ is required when state is 'failed'."
                details:
                  path: "/tenantOrchestration/v1/tenants/{tenantId}/stateTransitions/{transitionId}/steps/{stepId}/state"
                  correlator: "eb04d084-6908-41eb-8d8b-9ae4cdbcbc55"
        "404":
          description: Tenant, state transition, or step not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                version: "2"
                httpStatusCode: 404
                errorCode: 190309
                message: "Step not found."
                details:
                  path: "/tenantOrchestration/v1/tenants/{tenantId}/stateTransitions/{transitionId}/steps/{stepId}/state"
                  correlator: "eb04d084-6908-41eb-8d8b-9ae4cdbcbc55"
        "409":
          description: Conflict. The step is already in a terminal state (success
            or failed) and cannot be updated.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                version: "2"
                httpStatusCode: 409
                errorCode: 190410
                message: "Step is already in terminal state 'success' and cannot be\
                  \ updated."
                details:
                  path: "/tenantOrchestration/v1/tenants/{tenantId}/stateTransitions/{transitionId}/steps/{stepId}/state"
                  correlator: "eb04d084-6908-41eb-8d8b-9ae4cdbcbc55"
        "428":
          description: Precondition Required. At least one precondition header (If-Match
            or If-Unmodified-Since) must be specified.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                version: "2"
                httpStatusCode: 428
                errorCode: 190428
                message: "Precondition header required for updating step state."
                details:
                  path: "/tenantOrchestration/v1/tenants/{tenantId}/stateTransitions/{transitionId}/steps/{stepId}/state"
                  correlator: "eb04d084-6908-41eb-8d8b-9ae4cdbcbc55"
        "412":
