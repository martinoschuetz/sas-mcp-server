components:
  schemas:
    error:
      description: Standard error response envelope used by all error responses.
      type: object
      required:
      - version
      - httpStatusCode
      - errorCode
      - message
      properties:
        version:
          type: string
          description: Version of the error envelope format.
        httpStatusCode:
          type: integer
          description: HTTP status code.
        errorCode:
          type: integer
          description: Application-specific error code.
        message:
          type: string
          description: Human-readable error description.
        details:
          type: object
          description: Additional contextual details, such as `path` and `correlator`.
    serviceState:
      description: Represents the state of a service for a tenant.
      type: object
      required:
      - state
      properties:
        state:
          type: string
          description: Current state of the service for this tenant.
          enum: [onboarding, onboarded, onboardingFailed, offboarding, offboarded,
            offboardingFailed]
        failureDetails:
          type: string
          description: Details about failure states, if applicable.
    tenant:
      description: Represents a tenant in the system.
      x-state-transitions:
        onboarding: [onboarded, onboardingFailed]
        onboarded: [activating, offboarding]
        onboardingFailed: [onboarding, offboarding]
        activating: [active, activatingFailed]
        active: [suspending]
        activatingFailed: [activating, offboarding]
        suspending: [suspended, suspendingFailed]
        suspended: [activating, offboarding]
        suspendingFailed: [suspending, offboarding]
        offboarding: [offboarded, offboardingFailed]
        offboarded: [onboarding]
        offboardingFailed: [offboarding]
      type: object
      required:
      - id
      - shortName
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: System generated UUID
        shortName:
          type: string
          pattern: "^[a-z][0-9a-z-]{1,38}[0-9a-z]$"
          description: Short, human readable name
        desiredState:
          type: string
          description: |
            Desired state of the tenant (optional).
            Allowed transitions are restricted by the current state. See x-state-transitions for details.
          enum: [onboarded, active, suspended, offboarded]
        dataPlaneIngress:
          type: string
          description: |
            Host name for ingress in the tenant's data plane. Must be a valid DNS subdomain (RFC 1123),
            e.g., the host of the ingress resource.
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$"
          minLength: 3
          maxLength: 253
          example: tenant1-ingress.example.com
        currentState:
          type: string
          description: |
            Current state of the tenant (optional).
            Allowed transitions are restricted by the previous state. See x-state-transitions for details.
          enum: [onboarding, onboarded, onboardingFailed, activating, active, activatingFailed,
            suspending, suspended, suspendingFailed, offboarding, offboarded, offboardingFailed]
        stateDetails:
          type: object
          description: Map of service names to their current state details for this
            tenant.
          additionalProperties:
            $ref: "#/components/schemas/serviceState"
    tenantCreateOrUpdate:
      description: Schema for creating or updating a tenant.
      type: object
      properties:
        shortName:
          type: string
          pattern: "^[a-z][0-9a-z-]{1,38}[0-9a-z]$"
          description: Short, human readable name (required for creation, read-only
            for updates)
        desiredState:
          type: string
          description: Desired state of the tenant (optional)
          enum: [onboarded, active, suspended, offboarded]
        dataPlaneIngress:
          type: string
          description: |
            Host name for ingress in the tenant's data plane.
            Must be a valid DNS subdomain (RFC 1123),
            e.g., the host of the ingress resource.
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$"
          minLength: 3
          maxLength: 253
        administratorEmails:
          type: array
          description: List of administrator email addresses for the tenant.
          items:
            type: string
            format: email
        tenantDataId:
          type: string
          description: |
            Optional tenant export package identifier. When provided for onboarding requests,
            Tenant Orchestration executes an Import Tenant step after Initialize Tenant
            and before Rolling Restart of Service X steps.
    tenantCollection:
      description: Schema for a paginated collection of tenants.
      type: object
      properties:
        items:
          type: array
          description: The list of tenants returned in this page.
          items:
            $ref: "#/components/schemas/tenant"
        count:
          type: integer
          description: Total number of tenants in the collection (if known).
        links:
          type: array
          description: Hypermedia pagination links.
          items:
            $ref: "#/components/schemas/collectionLink"
    collectionLink:
      description: Schema for a hypermedia pagination link.
      type: object
      required:
      - rel
      - href
      properties:
        rel:
          type: string
          description: The relation of the link (first, prev, next, last).
          enum: [first, prev, next, last]
        href:
          type: string
          format: uri-reference
          description: The URI for the link.
    stateTransition:
      description: Represents a single tenant state transition event.
      type: object
      required:
      - id
      - targetState
      - triggeredAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this state transition event.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        sourceState:
          type: string
          description: The previous state of the tenant. Null for initial creation.
          nullable: true
          enum: [null, onboarded, onboardingFailed, active, activatingFailed, suspended,
            suspendingFailed, offboarded, offboardingFailed]
        targetState:
          type: string
          description: The requested steady target state for this transition attempt.
          enum: [onboarded, active, suspended, offboarded]
        resultingState:
          type: string
          description: The final resulting state after completion. Matches the target
            state on success, or the failed variant on failure.
          nullable: true
          enum: [onboarded, onboardingFailed, active, activatingFailed, suspended,
            suspendingFailed, offboarded, offboardingFailed]
        triggeredAt:
          type: string
          format: date-time
          description: The timestamp when this transition attempt was triggered.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: The timestamp when this transition attempt completed.
        triggeredBy:
          type: string
          description: The user or system component that triggered this transition
            attempt.
        details:
          type: string
          description: Additional details about the transition attempt, such as initiation
            context, success confirmation, or failure reasons.
        tenantJobName:
          type: string
          description: Name of the k8s tenant job associated with this transition
            attempt, if one exists.
          nullable: true
    stateTransitionCollection:
      description: Schema for a paginated collection of state transitions.
      type: object
      properties:
        items:
          type: array
          description: The list of state transitions returned in this page.
          items:
            $ref: "#/components/schemas/stateTransition"
        count:
          type: integer
          description: Total number of state transitions for this tenant.
        links:
          type: array
          description: Hypermedia pagination links.
          items:
            $ref: "#/components/schemas/collectionLink"
    tenantStep:
      description: Represents a single step executed as part of a tenant state transition.
      type: object
      required:
      - id
      - name
      - state
      - creationTimestamp
      - modifiedTimestamp
      - stateTransitionId
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this step.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        name:
          type: string
          description: Human-readable name of the step (e.g., 'Initialize Tenant',
            'Import Tenant', 'Rolling Restart of Service X', 'Tenant Content Loading
            for Service X').
        description:
          type: string
          description: Optional detailed description of what this step does.
          nullable: true
        state:
          type: string
          description: Current state of the step execution.
          enum: [pending, running, success, failed]
        failureDetails:
          type: string
          description: Error or failure information if state is 'failed'. Null otherwise.
          nullable: true
        creationTimestamp:
          type: string
          format: date-time
          description: Timestamp when this step was created.
        modifiedTimestamp:
          type: string
          format: date-time
          description: Timestamp when this step was last modified.
        serviceId:
          type: string
          format: uuid
          description: UUID of the service this step applies to. Null for tenant-level
            steps.
          nullable: true
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        jobName:
          type: string
          description: Name of the k8s job associated with this step, if one exists.
          nullable: true
        stateTransitionId:
          type: string
          format: uuid
          description: UUID of the state transition that initiated this step. Links
            to the transition that triggered the work.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    stateTransitionStepCollection:
      description: Schema for a paginated collection of tenant steps.
      type: object
      properties:
        items:
          type: array
          description: The list of steps returned in this page.
          items:
            $ref: "#/components/schemas/tenantStep"
        count:
          type: integer
          description: Total number of steps for this tenant (across all pages).
        links:
          type: array
          description: Hypermedia pagination links.
          items:
            $ref: "#/components/schemas/collectionLink"
    tenantStepState:
      description: Lightweight representation of the current state of a pre-created
        transition step. Used for idempotency checks and state reporting.
      type: object
      required:
      - state
      properties:
        state:
          type: string
          description: Current execution state of the step.
          enum: [pending, running, success, failed]
        failureDetails:
          type: string
          description: Error or failure information if state is 'failed'. Null otherwise.
          nullable: true
    stateTransitionStepUpdate:
      description: Request body for updating the state of an existing pre-created
        transition step. Used by step executors to report step progress to the Tenant
        Orchestration service.
      type: object
      required:
      - state
      properties:
        state:
          type: string
          description: |
            The new state for the step. Valid transitions are:
            - pending → running
            - running → success
            - running → failed
          enum: [running, success, failed]
        failureDetails:
          type: string
          description: Required when state is 'failed'. Human-readable description
            of what went wrong.
          nullable: true
