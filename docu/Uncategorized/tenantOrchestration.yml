            Cache-Control:
              description: Caching policies for the response.
              schema:
                type: string
    put:
      operationId: updateOrCreateTenant
      summary: Create or update tenant
      description: |
        Creates a new tenant or updates an existing tenant.
        For creating a new tenant, the shortName field, and the administratorEmails must be provided
        and the desiredState field must have a value of onboarded.
        If tenantDataId is provided for an onboarding request, an Import Tenant
        step is executed after Initialize Tenant and before any Rolling Restart of Service X steps.
        For updating an existing tenant, the administratorEmails cannot be provided.
        Only mutable fields can be updated, immutable fields include: id, shortname, creationTimestamp, and createdBy.
        When updating, least one precondition header ("If-Match" or "If-Unmodified-Since") must be specified.
        Failure to specify a precondition when updating an existing resource will yield a 428 response.
        If the precondition does not match, a 412 response will be returned.
      tags:
      - Tenants
      parameters:
      - name: If-Match
        in: header
        description: ETag value. Required if tenant already exists and If-Unmodified-Since
          is not provided.
        required: false
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: Timestamp value. Required if tenant already exists and If-Match
          is not provided.
        required: false
        schema:
          type: string
          format: date-time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/tenantCreateOrUpdate"
            examples:
              createTenant:
                summary: Create a new tenant
                description: Example of creating a new tenant with required fields
                value:
                  shortName: "acme-corp"
                  desiredState: "onboarded"
                  administratorEmails: ["user1@example.com", "user2@example.com"]
              createTenantWithImport:
                summary: Create and onboard a tenant from a tenant export package
                description: Example of creating a new tenant and triggering the import
                  step
                value:
                  shortName: "acme-corp"
                  desiredState: "onboarded"
                  tenantDataId: "a8b6f6f9-0a1e-4f1a-9b6a-4ea08f8e2d1c"
                  administratorEmails: ["user1@example.com", "user2@example.com"]
              updateTenant:
                summary: Update an existing tenant
                description: Example of updating an existing tenant
                value:
                  desiredState: "active"
                  properties:
                    environment: "production"
                    billingAccount: "BA-789012"
      responses:
        "201":
          description: Tenant created successfully
          headers:
            ETag:
              description: The current entity tag for the resource.
              schema:
                type: string
            Last-Modified:
              description: The date and time the resource was created.
              schema:
                type: string
                format: date-time
            Location:
              description: The URI of the created resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tenant"
              example:
                id: "b344ae2b-fd43-4627-8f6a-2c98707ebc01"
                shortName: "acme-corp"
                desiredState: "onboarded"
                currentState: "onboarding"
                stateDetails:
                  sas-logon-app:
                    state: "onboarding"
                  sas-configuration:
                    state: "onboarding"
                  sas-file-store:
                    state: "onboarding"
        "200":
          description: Tenant updated successfully
          headers:
            ETag:
              description: The current entity tag for the resource.
              schema:
                type: string
            Last-Modified:
              description: The date and time the resource was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tenant"
              example:
                id: "b344ae2b-fd43-4627-8f6a-2c98707ebc01"
                shortName: "tenant1"
                desiredState: "active"
                currentState: "active"
                stateDetails:
                  sas-logon-app:
                    state: "onboarded"
                  sas-configuration:
                    state: "onboarded"
                  sas-file-store:
                    state: "onboarded"
        "400":
          description: Bad request. The request body or parameters are invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                version: "2"
                httpStatusCode: 400
                errorCode: 190400
                message: "Invalid request body."
                details:
                  path: "/tenantOrchestration/v1/tenants/{tenantId}"
                  correlator: "eb04d084-6908-41eb-8d8b-9ae4cdbcbc55"
        "428":
          description: Precondition Required. At least one precondition header (If-Match
            or If-Unmodified-Since) must be specified when updating an existing tenant.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                version: "2"
                httpStatusCode: 428
                errorCode: 190428
                message: "Precondition header required for updating existing tenant."
                details:
                  path: "/tenantOrchestration/v1/tenants/{tenantId}"
                  correlator: "eb04d084-6908-41eb-8d8b-9ae4cdbcbc55"
        "412":
          description: Precondition Failed. The precondition header(s) did not match
            the server's state.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                version: "2"
                httpStatusCode: 412
                errorCode: 190412
