---
openapi: 3.0.3
info:
  version: "7"
  title: Report Templates
  description: Creates, reads, updates, and deletes report template resources such
    as `data views`, `objects`, `snippets`, `queries`, `pages`, and `insights` and
    updates their contents.  The simple term `resource` or `report resource` may be
    used to represent any of the report template resources instead of the more specific
    `report data view`, `report object`, `report snippet`, `report query`, `report
    page` or `report insight`.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: "SAS Developers"
    url: "https://developer.sas.com"
    email: "devex@sas.com"
servers:
- url: "http://example.com/reportTemplates"
  description: The report templates API server.
tags:
- name: Root
  description: The API list of links.
- name: PrimaryResources
  description: The operations for report template primary resources such as data views,
    objects, snippets, queries, pages, and insights.
- name: ContentResources
  description: The operations for the contents of report template primary resources.
- name: Transfer
  x-sas-internal: true
  description: The operations for the transfer object resource.
- name: Relationship
  x-sas-internal: true
  description: The operations for the relationship resource.
paths:
  /:
    head:
      summary: Get header information for the service
      description: Retrieves header information for the service. It can also be used
        to verify that the service is available.
      operationId: headersForRoot
      tags:
      - Root
      responses:
        "200":
          description: Service is running.
          headers:
            Content-Type:
              description: The content type of the response, `application/vnd.sas.api+json`.
              schema:
                type: string
        "404":
          description: Service is not available.
    get:
      summary: Get a collection of top-level links
      description: Returns a collection of links to the top-level collections surfaced
        through this API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: Top-level links.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/reportTemplatesApi"
            application/json:
              schema:
                $ref: "#/components/schemas/reportTemplatesApi"
        "404":
          description: Service is not available.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportTemplatesServiceNotFound"
  /dataViews#dataViews:
