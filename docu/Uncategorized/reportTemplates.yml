      operationId: headersForGetReportDataView
      tags:
      - PrimaryResources
      parameters:
      - $ref: "#/components/parameters/DataViewId"
      - $ref: "#/components/parameters/IfNoneMatch"
      - $ref: "#/components/parameters/IfModifiedSince"
