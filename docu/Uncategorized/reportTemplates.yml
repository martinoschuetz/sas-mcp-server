  /dataViews:
    post:
      summary: Create report data view
      description: Create a new report data view and optionally add it to a folder
        as a child.
      operationId: createReportDataView
      tags:
      - PrimaryResources
      parameters:
      - $ref: "#/components/parameters/ParentFolderUri"
      requestBody:
        $ref: "#/components/requestBodies/NewReportDataView"
      responses:
        "201":
          description: New report data view created.  Use the `updateContent` link
            in the new report data view to store the report content. `ETag` header
            is returned. See [`Conditional Operations`](https://developer.sas.com/rest-apis/reportTemplates-v7/docs/getting-started/usage-notes#conditional-operations).
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/vnd.sas.report.data.view+json:
              schema:
                $ref: "#/components/schemas/reportDataView"
            application/json:
              schema:
                $ref: "#/components/schemas/reportDataView"
        "400":
          description: Bad Request.  The input report data view is not valid, the
            `parentFolderUri` is not a valid folder URI, or is not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Bad request error
                  value:
                    errorCode": 10736
                    message: "An error occurred. The resource could not be added as\
                      \ a folder member because the specified folder URI cannot be\
                      \ found."
                    details:
                    - "traceId: 03b5f0c710eca2d6"
                    - "path: /reportTemplates/dataViews"
                    version: 2
                    httpStatusCode: 400
        "409":
          description: Conflict. Report data view with the same name is already a
            member of the folder.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Conflict error
                  value:
                    errorCode: 75010
                    message: "An error occurred. A conflict occurred when adding the\
                      \ resource as a member to the folder."
                    details:
                    - "traceId: 23307dd5dead24fc"
                    - "path: /reportTemplates/dataViews"
                    version: 2
                    httpStatusCode: 409
