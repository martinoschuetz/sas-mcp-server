components:
  # HEADERS =====================================================================
  headers:
    Location:
      description: The URI of the newly created resource.
      schema:
        type: string
    ETag:
      description: A tag that identifies this revision of the resource.
      schema:
        type: string
    Last-Modified:
      description: The last `modifiedTimeStamp` of the resource.
      schema:
        type: string
    Content-Language:
      description: This header represents the locale of the result. It may not be
        present if there is issue during localization, in which case the result is
        what is persisted.
      schema:
        type: string
  parameters:
    AcceptLanguage:
      in: header
      name: Accept-Language
      description: Optional header.  If present, the locale it represents is used
        in processing, sorting, and filtering.
      required: false
      schema:
        type: string
    Start:
      in: query
      name: start
      description: 0-based offset of the first item to return.
      required: false
      schema:
        type: integer
        default: 0
    Limit:
      in: query
      name: limit
      description: Maximum number of items to return.
      required: false
      schema:
        type: integer
        default: 20
    Filter:
      in: query
      name: filter
      description: The criteria for filtering. Attributes that can be used are `id`,
        `name`, `description`, `shared`, `createdBy`, `creationTimeStamp`, `modifiedBy`,
        and `modifiedTimeStamp`. See [`Filtering in REST APIs`](https://developer.sas.com/rest-apis/reportTemplates-v7/docs/getting-started/usage-notes#filtering).
      required: false
      schema:
        type: string
        format: filter-criteria
    SortBy:
      in: query
      name: sortBy
      description: The criteria for sorting. Attributes that can be used are `id`,
        `name`, `description`, `shared`, `createdBy`, `creationTimeStamp`, `modifiedBy`,
        and `modifiedTimeStamp`. See [`Sorting in REST APIs`](https://developer.sas.com/rest-apis/reportTemplates-v7/docs/getting-started/usage-notes#sorting).
      required: false
      schema:
        type: string
        format: filter-criteria
    IfNoneMatch:
      in: header
