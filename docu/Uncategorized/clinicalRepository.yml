        required by any user who will be electronically signing files within the
        repository.  The signature key creation (if successful) returns a QR
        code (Quick  Response Code), which represents the user's signature key
        registration.  This QR code can then be scanned by any  supporting
        mobile authenticator application that supports TOTP key generation
        (Time-based One-Time Password), such  as Microsoft Authenticator or
        Google Authenticator.  After registering, the user can use the PIN codes
        that are generated by the application to provide authentication when
        electronically signing files in the repository. <p>Because only one
        signature key is supported per user, this replaces the current signature
        key if one exists.
