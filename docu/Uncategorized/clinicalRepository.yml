                workspaceFile:
                  $ref: "#/components/examples/workspaceFile"
        "400":
          description: Bad Request
        "404":
          description: Not found - the parent folder could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
