      summary: Download workspace item content
      description: >
        Downloads one or more workspace items as defined by the paths specified
        in the request body. Paths can be to files or folders. If a single
        path is specified and it is to a file, that file is downloaded as a
        stream on the response. If it is a single path and it is to a folder or
        if multiple paths are provided, the items are downloaded to a ZIP file and
