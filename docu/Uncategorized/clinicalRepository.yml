    put:
      tags:
      - Workspace
      summary: Upload workspace content
      description: >
        Uploads a single file to create a new file or updates the content of an
        existing file. You can also upload and expand a ZIP file to a folder.
        <p> Optionally, an action status ID can be provided to monitor the
        completion status. To get the action status ID, first call
        [batchUpdate](#operationId:batchUpdate) with the action UPLOAD or
        UPLOAD_EXPAND, which returns the action status ID on the request header.
      operationId: updateOrCreateWorkspaceItemContent
      parameters:
      - $ref: '#/components/parameters/workspacePathParameter'
      - name: expand
        in: query
        schema:
          type: boolean
        required: false
        description: >
          Determines whether the ZIP file on the request should be expanded when it
          is uploaded to the workspace folder. This parameter is ignored if
          the path is to a file.
        example: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                filename:
                  description: The name of the file. Clients must specify the name
                    of the file as form data in the request body.
                  type: string
                file:
                  description: The actual file content. The content must be listed
                    in the format of standard form data in the request body. Only
                    one file is permitted in a multipart request.
                  type: string
                  format: binary
            examples:
              file:
                value:
                  filename: test_file.txt
                  file: file content to upload.
      responses:
        "200":
          description: Content was created or updated successfully.
          content:
            application/vnd.sas.clinical.workspace.item:
              schema:
                $ref: "#/components/schemas/workspaceItem"
              examples:
