        in: "query"
        required: true
        description: >
          The action to perform on the clinical workflows. Supported actions:
          * ASSIGN_ACTUAL_OWNER: Assigns one or more clinical tasks. The request body
          is a mapping of clinical task IDs to userTaskUpdateAssignments.
          * CLAIM: Claims one or more clinical tasks. The request body is a list of
          workflowItemDescriptors.
          Only clinical tasks with status UNASSIGNED can be claimed.
          * START: Starts one or more clinical tasks. The request body is a list of
          workflowItemDescriptors.
