          type: string
        label:
          description: The label of the associated prompt.
          type: string
        name:
          description: The name of the variable.
          type: string
        type:
          description: The type of clinical workflow variable. Supported variable
            types include String, DateTime, Boolean, Decimal, and Integer.
          type: string
        value:
          description: The value of the variable. If an override has not been specified
            then this is the default value from the clinical workflow definition.
          type: string
        selectionOptions:
          description: The map of selection options for a clinical workflow variable
            with specified value choices.
          type: object
        required:
          description: Indicates whether the clinical workflow variable is required
            to activate the clinical workflow.
          type: boolean
