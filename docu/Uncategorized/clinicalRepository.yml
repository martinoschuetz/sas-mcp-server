          type: number
        summary:
          title: Action Status Summary
          description: Action status summary information.
          type: object
          properties:
            version:
              description: The version of the representation. This is version 1.
              type: number
            id:
              description: The unique identifier of the action status.
              type: string
            clientId:
              description: The client ID that is associated with the action. Represents
                the application and session from which the action was initiated.
              type: string
            message:
              description: Status message
              type: string
            detailMessage:
              description: Detailed status message.
              type: string
            startTimeStamp:
              description: Start time for the action on this item.
              type: string
            endTimeStamp:
              description: End time for the action on this item.
              type: string
            percentComplete:
              description: Percentage message.
              type: integer
            progressStatus:
              description: Describes the progress of an individual action.
              type: string
              enum:
              - QUEUED
              - PROCESSING
              - STOPPING
              - STOPPED
              - COMPLETED
              - TERMINATED
            completionStatus:
              description: Describes the completion status of the action.
              type: string
              enum:
              - INFO
              - WARN
              - ERROR
            stoppable:
              description: Specifies whether the batch action can be stopped when
                it is being processed.
              type: boolean
        details:
          description: Additional information about the action status.
          type: array
          items:
            title: Action Status Detail
            description: The action status detail.
            properties:
              id:
                description: Unique ID for the action status detail.
                type: string
              itemIdentifier:
                description: Unique identifier for the item on which status is reported.
                  Could be a UUID, path, or a uniquely identifying attribute of the
                  item.
                type: string
              itemName:
                description: The name of the individual item on which the status is
                  reported. This value is never empty or null.
                type: string
              itemLocation:
                description: >
                  The location of the individual item on which the status is
                  reported. This is the parent path of the item IF a path is
                  being used as the item identifier. This field can be null. In
                  conjunction with item name that is used to construct the path
                  of item that is unique for that item type.
                type: string
              message:
                description: Status message
                type: string
              startTimeStamp:
                description: Start time for the action on this item.
                type: string
              endTimeStamp:
                description: End time for the action on this item.
