---
openapi: 3.0.3
info:
  version: "3"
  title: SAS Clinical Acceleration Repository
  description: >
    The SAS Clinical Acceleration Repository API provides the necessary endpoints
    for managing the clinical repository.
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: https://example.com/clinicalRepository
  description: kubernetes mock server
tags:
- name: Root
  description: The operations for the root resource.
- name: Action Status
  x-sas-internal: true
  description: The operations for getting the status of actions performed by the current
    user.
- name: Audit
  description: The operations for audit history.
- name: Authorizations
  x-sas-internal: true
  description: The operations for determining authorization decisions.
- name: Repository
  description: The operations for repository management.
- name: Messages
  x-sas-internal: true
  description: The operations for application messaging.
- name: Types
  description: The operations for types.
- name: Utilization
  x-sas-internal: true
  description: The operations for resource utilization.
- name: Membership
  description: The operations for managing context membership.
- name: Roles
  description: The operations for managing roles.
- name: Groups
  description: The operations for managing groups.
- name: Users
  x-sas-internal: true
  description: The operations for managing users.
- name: Recycle Bin
  x-sas-internal: true
  description: The operations for the recycle bin.
- name: Workspace
  description: The operations for managing the current user workspace.
- name: Clinical Workflow
  description: The operations for managing clinical workflows.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
              description: Describes the representation of the collection response.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/apiResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/apiResponse"
        "404":
          description: The service is not available.
    head:
      tags:
      - Root
      summary: Get the headers for the API
      description: >
        Returns the headers for the API. Also determines whether the service
        provided by the API is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The service is running.
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: The service is not available.
  /actionstatus:
    get:
      x-sas-internal: true
      tags:
      - Action Status
      summary: Get the collection of action status summaries
      description: Returns a collection of action status summaries for the current
        user.
      operationId: getActionStatusSummaries
      parameters:
      - name: currentOnly
        in: query
        description: The type of action status entries to request. Defaults to ALL
          if no value is specified. When set to true, returns only the action status
          entries that are currently in progress.
        required: false
        schema:
          type: boolean
      - name: clientId
        in: query
        description: The client ID associated with the action status. Defaults to
          not specified. When set, returns only the action status entries that match
          the specified clientId.
        required: false
        schema:
          type: string
      - name: read
        in: query
        description: Determines whether the get request should mark the action status
          as being read. When set to true, marks all of the returned action status
          entries as being read.
        required: false
        schema:
          type: boolean
        example: true
      responses:
        "200":
          description: The request succeeded and matching action status entries are
            returned.
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/actionStatusSummaryCollection"
              examples:
                json:
                  $ref: "#/components/schemas/actionStatusSummaryCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/actionStatusSummaryCollection"
              examples:
                json:
                  $ref: "#/components/schemas/actionStatusSummaryCollection/example"
    post:
      x-sas-internal: true
      tags:
      - Action Status
      summary: Perform a batch delete of action status entries of the current user
        specified by IDs
      description: >
        Updates action status entries that are associated with the current user
        by deleting a subset specified by IDs. This action removes the entries
        corresponding to the IDs that are specified on a best-effort basis. When
        IDs are not specified, all action status entries for the user are
        deleted. Entries that are in progress are ignored.
      operationId: deleteActionStatuses
      requestBody:
        $ref: "#/components/requestBodies/idsRequestBody"
      responses:
        "200":
          description: Some or all of the items were deleted. If all of the specified
            items were deleted successfully, an empty list is returned. If any of
            the specified items were not deleted,  error entries for each of these
            items are included in the collection response.
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/actionStatusDeleteResponseErrorCollection"
              examples:
                json:
                  $ref: "#/components/schemas/actionStatusDeleteResponseErrorCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/actionStatusDeleteResponseErrorCollection"
              examples:
                json:
                  $ref: "#/components/schemas/actionStatusDeleteResponseErrorCollection/example"
        "400":
          description: None of the specified action status IDs were deleted by this
            request.
    delete:
      x-sas-internal: true
      tags:
      - Action Status
      summary: Delete all action status entries
      description: Deletes all action status entries for the current user.
      operationId: deleteAll
      responses:
        "204":
          description: Action status entries were deleted.
  "/actionstatus/{actionStatusId}":
    get:
      x-sas-internal: true
      tags:
      - Action Status
      operationId: getActionStatus
      summary: Get the specified action status
      description: Returns the specified action status entry.
      parameters:
      - name: Accept
        in: header
        description: >
          The requested representation of the action status. Media type
          'application/vnd.sas.clinical.action.status+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.clinical.action.status+json
          - application/vnd.sas.clinical.action.status.summary+json
          - application/json
      - name: actionStatusId
        in: path
        description: The unique identifier for the action status entry.
        required: true
        schema:
          type: string
        example: d6eefec9-dcc2-4574-8af8-69897038d9c5
      responses:
        "200":
          description: The request succeeded and a matching action status with summary
            and details is returned.
          content:
            application/vnd.sas.clinical.action.status+json:
              schema:
                $ref: "#/components/schemas/actionStatus"
              examples:
                json:
                  $ref: "#/components/schemas/actionStatus/example"
            application/vnd.sas.clinical.action.status.summary+json:
              schema:
                $ref: "#/components/schemas/actionStatusSummary"
              examples:
                json:
                  $ref: "#/components/schemas/actionStatusSummary/example"
            application/json:
              schema:
                $ref: "#/components/schemas/actionStatus"
              examples:
                json:
                  $ref: "#/components/schemas/actionStatus/example"
        "404":
          description: The request did not find the specified action status.
    head:
      x-sas-internal: true
      tags:
      - Action Status
      operationId: headersForActionStatus
      summary: Determine whether the specified action status exists
      description: Checks whether the specified action status exists.
      parameters:
      - name: Accept
        in: header
        description: >
          The requested representation of the action status. Media type
          'application/vnd.sas.clinical.action.status+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.clinical.action.status+json
          - application/vnd.sas.clinical.action.status.summary+json
          - application/json
      - name: actionStatusId
        in: path
        description: The unique identifier for the action status entry.
        required: true
        schema:
          type: string
        example: d6eefec9-dcc2-4574-8af8-69897038d9c5
      responses:
        "200":
          description: The request succeeded - the action status exists.
        "404":
          description: The request did not find the specified action status.
    patch:
      x-sas-internal: true
      tags:
      - Action Status
      summary: Update the action status by performing the specified action
      description: Updates the action status by performing the specified action.
      operationId: patchActionStatus
      parameters:
      - name: actionStatusId
        in: path
        description: The unique identifier for the action status entry.
        required: true
        schema:
          type: string
        example: d6eefec9-dcc2-4574-8af8-69897038d9c5
      - name: action
        in: query
        required: true
        description: The update action to perform on the action status.
        example: STOP
        schema:
          type: string
          enum:
          - STOP
      responses:
        "200":
          description: OK - the action status was updated by performing the specified
            action.
          content:
            application/vnd.sas.clinical.action.status+json:
              schema:
                $ref: "#/components/schemas/actionStatus"
              examples:
                json:
                  $ref: "#/components/schemas/actionStatus/example"
            application/json:
              schema:
                $ref: "#/components/schemas/actionStatus"
              examples:
                json:
                  $ref: "#/components/schemas/actionStatus/example"
        "400":
          description: Bad request - the specified action is not valid.
        "404":
          description: Not found - the action status could not be found.
    delete:
      x-sas-internal: true
      tags:
      - Action Status
      summary: Delete an action status
      description: >
        Deletes an action status.  This action removes the action status item
        and details.
      operationId: deleteActionStatus
      parameters:
      - name: actionStatusId
        in: path
        description: The unique identifier for the action status entry.
        required: true
        schema:
          type: string
        example: d6eefec9-dcc2-4574-8af8-69897038d9c5
      responses:
        "204":
          description: The action status was deleted.
  /actionstatus/status:
    x-sas-internal: true
    get:
      x-sas-internal: true
      tags:
      - Action Status
      summary: Get the count of action status entries that are not read by the user
      description: >
        Returns a count of action status entries that have been updated since
        they were last read by the current user. When this is not zero, action
        status entries can be retrieved to show the updates since they were last
        read.
      operationId: getActionStatusPollingStatus
      responses:
        "200":
          description: The request succeeded and the count of unread action status
            entries is returned.
          content:
            application/json:
              schema:
                type: integer
              examples:
                getActionStatusReadResponse:
                  summary: Get action status read count.
                  description: Returns the count of unread action status entries.
                  value: 1
  /audit/entries:
    get:
      tags:
      - Audit
      summary: Get the collection of audit entries
      description: >
        Returns a collection of audit entries. The default sort is
        timestamp:ascending:primary. Requires administrative privileges.
      operationId: getAuditEntries
      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/auditFilterParam"
      - $ref: "#/components/parameters/auditSortByParam"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/auditEntryCollection"
              examples:
                json:
                  $ref: "#/components/schemas/auditEntryCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/auditEntryCollection"
              examples:
                json:
                  $ref: "#/components/schemas/auditEntryCollection/example"
  "/audit/entries/{entryId}":
    get:
      tags:
      - Audit
      summary: Get the specified audit entry
      description: |
        Returns the specified audit entry. Requires administrative privileges.
      operationId: getAuditEntry
      parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the audit entry.
        example: d6eefec9-dcc2-4574-8af8-69897038d9c5
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.clinical.audit.entry:
              schema:
                $ref: "#/components/schemas/auditEntry"
              examples:
                json:
                  $ref: "#/components/schemas/auditEntry/example"
            application/json:
              schema:
                $ref: "#/components/schemas/auditEntry"
              examples:
                json:
                  $ref: "#/components/schemas/auditEntry/example"
        "404":
          description: The request did not find the specified audit entry.
    head:
      tags:
      - Audit
      summary: Determines whether the specified audit entry exists
      description: >
        Checks whether the specified audit entry exists. Requires administrative
        privileges.
      operationId: headersForAuditEntry
      parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the audit entry.
        example: d6eefec9-dcc2-4574-8af8-69897038d9c5
      responses:
        "200":
          description: The request succeeded; the audit entry exists.
        "404":
          description: The request did not find the specified audit entry.
  /audit/actions:
    get:
      tags:
      - Audit
      summary: Get the collection of audit actions
      description: >
        Returns a collection of audit actions. The default sort is
        action:ascending:primary. Requires administrative privileges. This
        collection supports only basic filtering. In addition, only a single
        sort is supported, and sort strength is ignored.
      operationId: getAuditActions
      parameters:
      - name: typeIdFilter
        in: query
        description: >
          Filter criteria for the action type ID. Audit Actions supports basic
          filtering only. See [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
        example: folder
      - name: actionFilter
        in: query
        description: >
          Filter criteria for the action name. Audit Actions supports basic
          filtering only. See [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
        example: deleted
      - name: displayNameFilter
        in: query
        description: >
          Filter criteria for the action display name. Audit Actions supports
          basic filtering only. See [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
        example: Deleted
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/auditActionSortByParam"
      responses:
        "200":
          description: OK.
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/auditActionCollection"
              examples:
                json:
                  $ref: "#/components/schemas/auditActionCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/auditActionCollection"
              examples:
                json:
                  $ref: "#/components/schemas/auditActionCollection/example"
  "/authorizations/{itemId}/permissions":
    get:
      x-sas-internal: true
      tags:
      - Authorizations
      summary: Get a list of granted permissions for the current user and repository
        item
      description: >
        Returns a list of granted permissions for the current user and
        repository item.  This authorization check evaluates all memberships,
        groups and weighted permission assignments.
        <p><b>Authorization:</b>  Requires read permission on the repository
        item.
      operationId: getPermissionAuthorizations
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - name: current
        in: query
        schema:
          type: boolean
        required: false
        description: True (default) if checking current permissions; false if checking
          default permissions (the repository item must be a context or folder).
      - name: permissionIds
        in: query
        schema:
          type: string
        required: false
        description: Comma-delimited list of permission identifiers for checking authorizations.  Permission
          identifiers are READ, WRITE, DELETE, ADMIN.  If none are provided, then
          all permissions are checked.
        example: READ, WRITE
      responses:
        "200":
          description: OK - the granted permission identifiers are returned.
          content:
            application/json:
              example: '["READ", "WRITE"]'
        "404":
          description: >
            Not found - the specified permissions have not been granted to this
            user, or the repository item or user doesn't exist.
    head:
      x-sas-internal: true
      tags:
      - Authorizations
      summary: Determine whether the current user has been granted permissions on
        the specified repository item
      description: >
        Determine whether the current user has been granted permissions for the
        specified repository item.  This authorization check evaluates all
        memberships, groups and weighted permission
        assignments.  <p><b>Authorization:</b>  Requires read permission on the
        repository item.
      operationId: headersForPermissionAuthorizations
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - name: current
        in: query
        schema:
          type: boolean
        required: false
        description: True (default) if checking current permissions; false if checking
          default permissions (repository item must be a context or folder).
      - name: permissionIds
        in: query
        schema:
          type: string
        required: false
        description: Comma-delimited list of permission identifiers for checking authorizations.  Permission
          identifiers are READ, WRITE, DELETE, ADMIN.  If none are provided, then
          all permissions are checked.
        example: READ, WRITE
      responses:
        "200":
          description: OK - all permissions specified have been granted.
        "404":
          description: >
            Not found - the specified permissions have not been granted to this
            user, or the repository item or user doesn't exist.
  "/authorizations/{itemId}/permissions/{permissionId}":
    head:
      x-sas-internal: true
      tags:
      - Authorizations
      summary: Determines whether the current user has been granted a specific permission
        on the repository item
      description: >
        Determines whether the current user has been granted a specific
        permission for the repository item.  This authorization check evaluates
        all memberships, groups and weighted permission
        assignments.  <p><b>Authorization:</b>  Requires read permission on the
        repository item.
      operationId: headersForPermissionAuthorization
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - name: permissionId
        in: path
        schema:
          type: string
        required: true
        description: The permission identifier to check.
        example: read
      - name: current
        in: query
        schema:
          type: boolean
        required: false
        description: True (default) if checking current permission; false if checking
          default permission (the repository item must be a context or folder).
      responses:
        "200":
          description: OK - the permission is granted to the user.
        "404":
          description: >
            Not found - the specified permission has not been granted to this
            user, or the repository item or user doesn't exist.
  "/authorizations/{itemId}/privileges":
    get:
      x-sas-internal: true
      tags:
      - Authorizations
      summary: Get a list of granted privileges for the current user and repository
        item
      description: >
        Returns a list of granted privileges for the current user and repository
        item.  This authorization check evaluates all individual and group
        membership role assignments.  <p>The available privileges are: <ul>
          <li>PRIVILEGE_ACL_PROPAGATION</li>
          <li>PRIVILEGE_ENABLE_VERSIONING</li>
          <li>PRIVILEGE_MANAGE_LOCKS</li>
          <li>PRIVILEGE_MANAGE_MEMBERSHIP</li>
          <li>PRIVILEGE_MANAGE_ROLES</li>
          <li>PRIVILEGE_MANAGE_STATE</li>
          <li>PRIVILEGE_MANAGE_VERSIONING</li>
          <li>PRIVILEGE_PERMANENTLY_DELETE</li>
          <li>PRIVILEGE_RESTORE</li>
          <li>PRIVILEGE_SIGN_FILE</li>
          <li>PRIVILEGE_CREATE_CLINICAL_WORKFLOWS</li>
          <li>PRIVILEGE_MANAGE_CLINICAL_WORKFLOWS</li>
          <li>PRIVILEGE_ADMINISTER_CLINICAL_WORKFLOWS</li>
        </ul> <p><b>Authorization:</b>  Requires read permission on the repository
        item.
      operationId: getPrivilegeAuthorizations
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - name: privilegeIds
        in: query
        schema:
          type: string
        required: false
        description: Comma-delimited list of privilege identifiers for checking authorizations.  If
          none are provided, then all privileges are checked.
        example: PRIVILEGE_MANAGE_LOCKS, PRIVILEGE_MANAGE_MEMBERSHIP
      responses:
        "200":
          description: OK - the granted privilege identifiers are returned.
          content:
            application/json:
              example: '["PRIVILEGE_MANAGE_LOCKS", "PRIVILEGE_MANAGE_MEMBERSHIP"]'
        "404":
          description: >
            Not found - the specified privileges have not been granted to this
            user, or the repository item or user doesn't exist.
    head:
      x-sas-internal: true
      tags:
      - Authorizations
      summary: Determine whether the current user has been granted privileges on the
        repository item
      description: >
        Determines whether the current user has been granted privileges for the
        repository item.  This authorization check evaluates all individual and
        group membership role assignments.  <p><b>Authorization:</b>  Requires
        read permission on the repository item.
      operationId: headersForPrivilegeAuthorizations
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - name: privilegeIds
        in: query
        schema:
          type: string
        required: false
        description: Comma-delimited list of privilege identifiers for checking authorizations.  If
          none are provided, then all privileges are checked.
        example: PRIVILEGE_MANAGE_LOCKS, PRIVILEGE_MANAGE_MEMBERSHIP
      responses:
        "200":
          description: OK - all specified privileges have been granted.
        "404":
          description: >
            Not found - the specified privileges have not been granted to this
            user, or the repository item or user doesn't exist.
  "/authorizations/{itemId}/privileges/{privilegeId}":
    head:
      x-sas-internal: true
      tags:
      - Authorizations
      summary: Determine whether the current user has been granted a privilege on
        the specified repository item
      description: >
        Determine whether the current user has been granted a privilege for the
        specified repository item.  This authorization check evaluates all
        individual and group membership role
        assignments.  <p><b>Authorization:</b>  Requires read permission on the
        repository item.
      operationId: headersForPrivilegeAuthorization
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - name: privilegeId
        in: path
        schema:
          type: string
        required: true
        description: The privilege identifier to check.
        example: PRIVILEGE_MANAGE_LOCKS
      responses:
        "200":
          description: OK - the privilege is granted to the user.
        "404":
          description: >
            Not found - the specified privilege has not been granted to this
            user, or the repository item or user doesn't exist.
  /repository/files:
    get:
      x-sas-internal: true
      tags:
      - Repository
      summary: Get the collection of repository files that match the specified filter
        and content search
      description: >
        Returns the collection of repository files that match the specified
        filter and content search. <p><b>Authorization:</b>  Requires read
        permission on all files to be returned.
      operationId: getRepositoryFiles
      parameters:
      - $ref: '#/components/parameters/repositoryFileFilterParam'
      - $ref: '#/components/parameters/repositoryFileSortByParam'
      - name: limit
        in: query
        schema:
          type: integer
        required: false
        description: The maximum number of files to return. Defaults to 1000.  The
          maximum value supported is 1000.
        example: 1000
      - name: text
        in: query
        schema:
          type: string
        required: true
        description: The terms to search for in file content.
        example: coffee tea
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.clinical.limited.collection:
              schema:
                $ref: "#/components/schemas/repositoryFileLimitedCollection"
              examples:
                json:
                  $ref: "#/components/schemas/repositoryFileLimitedCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/repositoryFileLimitedCollection"
              examples:
                json:
                  $ref: "#/components/schemas/repositoryFileLimitedCollection/example"
  /repository/files/content:
    get:
      tags:
      - Repository
      summary: Download repository content by filter as a ZIP file
      description: >
        Downloads repository content that satisfies the filter as a ZIP file and
        returns the stream on the response body.         <p><b>Authorization:</b>  Requires
        read permission on all files
        and containers to be included in the ZIP file.
      operationId: getContentsByFilter
      parameters:
      - $ref: "#/components/parameters/filterParam"
      responses:
        "200":
          description: Content downloaded.
        "400":
          description: Bad request. Invalid filter.
    post:
      tags:
      - Repository
      summary: Download repository content by search as a zip file
      description: >
        Downloads repository content as a ZIP file based on search criteria,
        including filter or file content search text, and returns the stream on
        the response body.        <p> Optionally, an action status ID can be
        provided to monitor the completion status.  To get the action status ID,
        first call [batchUpdate](#operationId:batchUpdate) with the action
        DOWNLOAD_BY_FILTER, which returns the action status ID on the request
        header.  <p><b>Authorization:</b>  Requires read permission on all files
        and containers to be included in the ZIP file.
      operationId: getContentsBySearch
      requestBody:
        description: |
          The repository search specification for download.
        content:
          application/vnd.sas.clinical.search:
            schema:
              $ref: "#/components/schemas/contentSearchByBody"
            examples:
              json:
                $ref: "#/components/schemas/contentSearchByBody/example"
          application/json:
            schema:
              $ref: "#/components/schemas/contentSearchByBody"
            examples:
              json:
                $ref: "#/components/schemas/contentSearchByBody/example"
      responses:
        "200":
          description: Content downloaded.
        "400":
          description: Bad request. Invalid filter or file content search text.
  /repository/items:
    get:
      tags:
      - Repository
      summary: Get the collection of repository items including contexts, folders
        and files
      description: >
        Returns the collection of repository items by query.
        <p><b>Authorization:</b>  Requires read permission on all items that are
        returned.
      operationId: getRepositoryItems
      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - name: filter
        in: query
        description: >
          Filter criteria for items. The following fields are not supported in
          filter criteria: children, contentType,  and digest. See [Filtering
          in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
          example: eq(name,'reports')
      - name: sortBy
        in: query
        description: >
          Sorts the returned items. The following fields are not supported for
          sort: children, contentType, and digest. See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
          example: name:ascending:primary
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.clinical.limited.collection:
              schema:
                $ref: "#/components/schemas/repositoryItemLimitedCollection"
              examples:
                json:
                  $ref: "#/components/schemas/repositoryItemLimitedCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/repositoryItemLimitedCollection"
              examples:
                json:
                  $ref: "#/components/schemas/repositoryItemLimitedCollection/example"
  /repository/items/batch:
    post:
      x-sas-internal: true
      tags:
      - Repository
      summary: Asynchronously update one or more repository items
      description: |
        Begins a repository batch action based on the specified action.
      operationId: batchUpdate
      parameters:
      - name: clientId
        in: query
        schema:
          type: string
        required: false
        description: The ID of the client that is calling the method. Enables the
          user to track the action status.
      - name: action
        in: query
        required: true
        description: The repository action to perform on the repository items.
        schema:
          type: string
          enum:
          - ENABLE_VERSIONING
          - DISABLE_VERSIONING
          - UPDATE_VERSION_LIMITS
          - DELETE
          - DELETE_BY_FILTER
          - DELETE_CONTEXTS
          - SIGN
          - SIGN_BY_FILTER
          - COPY
          - MOVE
          - STATE
          - LOCK
          - UNLOCK
          - LOCK_BY_SEARCH
          - UNLOCK_BY_SEARCH
          - DOWNLOAD
          - DOWNLOAD_BY_FILTER
          - DOWNLOAD_VERSIONS
          - UPLOAD
          - UPLOAD_EXPAND
      requestBody:
        required: true
        description: >
          The repository update specification. This value varies based on the
          type of update and the 'action' request parameter value.
        content:
          application/vnd.sas.clinical.enable.versioning:
            schema:
              $ref: '#/components/schemas/enableVersioning'
            examples:
              json:
                $ref: '#/components/schemas/enableVersioning/example'
          application/vnd.sas.clinical.disable.versioning:
            schema:
              $ref: '#/components/schemas/disableVersioning'
            examples:
              json:
                $ref: '#/components/schemas/disableVersioning/example'
          application/vnd.sas.clinical.signature.parameters.paths:
            schema:
              $ref: '#/components/schemas/signatureParametersByPaths'
            examples:
              json:
                $ref: '#/components/schemas/signatureParametersByPaths/example'
          application/vnd.sas.clinical.signature.parameters.filter:
            schema:
              $ref: '#/components/schemas/signatureParametersByFilter'
            examples:
              json:
                $ref: '#/components/schemas/signatureParametersByFilter/example'
          application/vnd.sas.clinical.move.copy:
            schema:
              $ref: '#/components/schemas/moveCopy'
            examples:
              json:
                $ref: '#/components/schemas/moveCopy/example'
          application/vnd.sas.clinical.version.limits:
            schema:
              $ref: '#/components/schemas/versionLimits'
            examples:
              json:
                $ref: '#/components/schemas/versionLimits/example'
          application/vnd.sas.clinical.state:
            schema:
              $ref: '#/components/schemas/setState'
            examples:
              json:
                $ref: '#/components/schemas/setState/example'
          application/vnd.sas.clinical.download.versions:
            schema:
              $ref: '#/components/schemas/downloadVersions'
            examples:
              json:
                $ref: '#/components/schemas/downloadVersions/example'
          application/vnd.sas.clinical.filter:
            schema:
              $ref: '#/components/schemas/clinicalFilter'
            examples:
              json:
                $ref: '#/components/schemas/clinicalFilter/example'
          application/vnd.sas.clinical.search:
            schema:
              $ref: "#/components/schemas/contentSearchByBody"
            examples:
              json:
                $ref: "#/components/schemas/contentSearchByBody/example"
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/enableVersioning"
              - $ref: "#/components/schemas/disableVersioning"
              - $ref: "#/components/schemas/signatureParametersByPaths"
              - $ref: "#/components/schemas/signatureParametersByFilter"
              - $ref: "#/components/schemas/moveCopy"
              - $ref: "#/components/schemas/versionLimits"
              - $ref: "#/components/schemas/setState"
              - $ref: "#/components/schemas/clinicalFilter"
              - $ref: "#/components/schemas/contentSearchByBody"
              - type: array
                example:
                - /testBatchDelete-Top/testBatchDelete-Item2
                - /testBatchDelete-Top/testBatchDelete-Folder
      responses:
        "202":
          description: >
            The request was accepted. See the Location header for a link to
            status information.
          headers:
            Location:
              schema:
                type: string
              description: The link to determine the status of the operation that
                was initiated with this request.
  "/repository/items/{itemId}":
    get:
      tags:
      - Repository
      summary: Get the specified repository item
      description: >
        Returns the specified repository item.
        <p><b>Authorization:</b>  Requires read permission.
      operationId: getRepositoryItem
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      responses:
        "200":
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/Etag'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
          content:
            application/vnd.sas.clinical.repository.item:
              schema:
                $ref: "#/components/schemas/repositoryItem"
              examples:
                repositoryContext:
                  $ref: "#/components/examples/repositoryContext"
                repositoryFolder:
                  $ref: "#/components/examples/repositoryFolder"
                repositoryFile:
                  $ref: "#/components/examples/repositoryFile"
            application/json:
              schema:
                $ref: "#/components/schemas/repositoryItem"
              examples:
                repositoryContext:
                  $ref: "#/components/examples/repositoryContext"
                repositoryFolder:
                  $ref: "#/components/examples/repositoryFolder"
                repositoryFile:
                  $ref: "#/components/examples/repositoryFile"
        "404":
          description: Not found - the repository item could not be found.
    head:
      tags:
      - Repository
      summary: Determine whether the specified repository item exists
      description: >
        Checks whether the specified repository item exists.
        <p><b>Authorization:</b>  Requires read permission.
      operationId: headersForRepositoryItem
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      responses:
        "200":
          description: OK - the repository item exists.
          headers:
            ETag:
              $ref: '#/components/headers/Etag'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
        "404":
          description: Not found - the repository item could not be found.
    patch:
      tags:
      - Repository
      summary: Update the attributes of a repository item
      description: >
        Updates the editable attributes of this repository
        item.  <p><b>Authorization:</b>  Requires read and write permissions.
      operationId: patchRepositoryItem
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - $ref: '#/components/parameters/ifMatchHeader'
      requestBody:
        required: true
        description: The attributes on the repository item to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/repositoryItemPatchRequestBody'
            examples:
              json:
                $ref: '#/components/schemas/repositoryItemPatchRequestBody/example'
      responses:
        "200":
          description: OK - the repository item was updated.
          headers:
            ETag:
              $ref: '#/components/headers/Etag'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
          content:
            application/vnd.sas.clinical.repository.item:
              schema:
                $ref: "#/components/schemas/repositoryItem"
              examples:
                json:
                  $ref: "#/components/schemas/repositoryItem/example"
            application/json:
              schema:
                $ref: "#/components/schemas/repositoryItem"
              examples:
                json:
                  $ref: "#/components/schemas/repositoryItem/example"
        "400":
          description: Bad Request
        "404":
          description: Not found - the repository item could not be found.
        "412":
          description: The ETag provided does not match the current resource.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/preConditionFailedResponse'
        "428":
          description: The request headers did not include a `If-Match` precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: '#/components/examples/noIfMatchHeader'
    delete:
      tags:
      - Repository
      summary: Delete a repository item
      description: >
        Deletes a repository item.  By default, the item is moved to the recycle
        bin. If the permanent parameter value is set to true, the item is
        permanently deleted.  <p> Note: Contexts are always permanently deleted
        so the permanent parameter is ignored if the item is a
        context.   <p><b>Authorization:</b>  Requires read and write permission
        on the parent  container as well as read and delete permission on the
        item.
      operationId: deleteRepositoryItem
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - name: permanent
        in: query
        schema:
          type: boolean
        required: false
        description: >
          Determines whether the deletion should be permanent or
          logical.  Permanent deletion is unrecoverable; logical deletion
          moves the deleted item to the recycle bin where it can either be
          recovered or permanently deleted later.
      responses:
        "204":
          description: The repository item was deleted.
  "/repository/items/{itemId}/children":
    get:
      tags:
      - Repository
      summary: Get the children of the specified repository item
      description: >
        Returns the children of the specified repository item.
        <p><b>Authorization:</b>  Requires read permission on the parent and
        children.
      operationId: getRepositoryChildrenByParent
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - name: recurse
        in: query
        schema:
          type: boolean
        required: false
        description: When true, items are returned for the specified itemId and all
          subfolders. Default is false.
      - name: includeSynchronizationInfo
        in: query
        schema:
          type: boolean
        required: false
        description: >
          Whether to include synchronization information for files that are returned.
          Default is false.
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/repositoryItemFilterParam"
      - $ref: "#/components/parameters/repositoryItemSortByParam"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/repositoryChildrenCollection"
              examples:
                json:
                  $ref: "#/components/schemas/repositoryChildrenCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/repositoryChildrenCollection"
              examples:
                json:
                  $ref: "#/components/schemas/repositoryChildrenCollection/example"
        "404":
          description: Not found - the repository parent item could not be found.
    head:
      tags:
      - Repository
      summary: Determine whether the specified repository item has children
      description: >
        Checks whether the specified repository item has children.
        <p><b>Authorization:</b>  Requires read permission on the parent and
        children.
      operationId: headersForChildren
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - name: recurse
        in: query
        schema:
          type: boolean
        required: false
        description: When true, items are returned for the specified itemId and all
          subfolders. Default is false.
      - name: includeSynchronizationInfo
        in: query
        schema:
          type: boolean
        required: false
        description: >
          Whether to include synchronization information for files that are returned.
          Default is false.
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/repositoryItemFilterParam"
      - $ref: "#/components/parameters/repositoryItemSortByParam"
      responses:
        "200":
          description: OK - the repository item has children.
        "404":
          description: Not found - the repository item does not have children.
    post:
      tags:
      - Repository
      summary: Create a new repository container
      description: |
        Create a new repository context or folder.
      operationId: createRepositoryItem
      parameters:
      - name: itemId
        in: path
        schema:
          type: string
        required: true
        description: The unique identifier for the repository location in which to
          create the item.
        example: d6eefec9-dcc2-4574-8af8-69897038d9c5
      - name: name
        in: query
        description: |
          The name of the new item to be created.
        required: true
        schema:
          type: string
        example: MyProject
      - name: type
        in: query
        description: |
          The primary type of the new item to be created.
        required: true
        schema:
          type: string
          enum:
          - CONTEXT
          - FOLDER
      - name: typeId
        in: query
        description: >
          The type identifier of the context to be created.  This parameter is
          required when a context is being created. For folder primary types
          this parameter will be ignored.
        required: false
        schema:
          type: string
        example: project
      - name: owner
        in: query
        description: >
          The owner to set for the newly created context.  By default, the
          default permission's owner is used to  set the new owner. However,
          this behavior can be overwritten by explicitly setting the owner
          with this parameter. This can be set only for contexts, this
          parameter is ignored when creating folders.
        required: false
        schema:
          type: string
        example: sastest
      - name: description
        in: query
        description: |
          The description for the newly created item.
        required: false
        schema:
          type: string
        example: Project for ad hoc reporting.
      responses:
        "201":
          description: Created - the repository item was created successfully.
          headers:
            ETag:
              $ref: '#/components/headers/Etag'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
          content:
            application/vnd.sas.clinical.repository.container:
              schema:
                $ref: "#/components/schemas/repositoryContainer"
              examples:
                json:
                  $ref: "#/components/schemas/repositoryContainer/example"
            application/json:
              schema:
                $ref: "#/components/schemas/repositoryContainer"
              examples:
                json:
                  $ref: "#/components/schemas/repositoryContainer/example"
        "400":
          description: Bad Request
        "404":
          description: A repository item with the specified identifier could not be
            found.
        "409":
          description: A repository item with the same name already exists at the
            specified location.
  "/repository/items/{itemId}/children/batch":
    post:
      x-sas-internal: true
      tags:
      - Repository
      summary: Asynchronously update the children of the repository item
      description: >
        Asynchronously updates the children of the repository item.
        <p><b>Authorization:</b>  Requires read permission on the parent and any
        children included in the update. Additional permissions might be
        required and are specific to each action.
      operationId: batchUpdateChildren
      parameters:
      - name: itemId
        in: path
        schema:
          type: string
        required: true
        description: The unique identifier of the parent container.
        example: d6eefec9-dcc2-4574-8af8-69897038d9c5
      - name: clientId
        in: query
        schema:
          type: string
        required: false
        description: The client ID that is associated with the action status.
      - name: action
        in: query
        required: true
        description: The update action to perform on the child items for the specified
          parent.
        schema:
          type: string
          enum:
          - COPY_BY_FILTER
          - DISABLE_VERSIONING_BY_FILTER
          - ENABLE_VERSIONING_BY_FILTER
          - LOCK_BY_FILTER
          - MOVE_BY_FILTER
          - UNLOCK_BY_FILTER
          - UPDATE_VERSION_LIMITS_BY_FILTER
      requestBody:
        required: false
        description: >
          The update specification. This value varies based on the type of
          update and the 'action' request parameter value.
        content:
          application/vnd.sas.clinical.enable.versioning.filter:
            schema:
              $ref: '#/components/schemas/enableVersioningByFilter'
            examples:
              json:
                $ref: "#/components/schemas/enableVersioningByFilter/example"
          application/vnd.sas.clinical.disable.versioning.filter:
            schema:
              $ref: '#/components/schemas/disableVersioningByFilter'
            examples:
              json:
                $ref: "#/components/schemas/disableVersioningByFilter/example"
          application/vnd.sas.clinical.move.copy.filter:
            schema:
              $ref: '#/components/schemas/moveCopyByFilter'
            examples:
              json:
                $ref: "#/components/schemas/moveCopyByFilter/example"
          application/vnd.sas.clinical.version.limits.filter:
            schema:
              $ref: '#/components/schemas/versionLimitsByFilter'
            examples:
              json:
                $ref: "#/components/schemas/versionLimitsByFilter/example"
          text/plain:
            schema:
              description: >
                The filter to retrieve the repository items to update. This
                applies only when the 'action' request parameter is
                'LOCK_BY_FILTER' or 'UNLOCK_BY_FILTER'.
              example: eq(name,'item-to-update.txt')
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/enableVersioningByFilter'
              - $ref: '#/components/schemas/disableVersioningByFilter'
              - $ref: '#/components/schemas/moveCopyByFilter'
              - $ref: '#/components/schemas/versionLimitsByFilter'
              - additionalProperties:
                  type: string
                  example: eq(name,'item-to-update.txt')
      responses:
        "202":
          description: >
            The request was accepted. See the Location header for a link to
            status information.
          headers:
            Location:
              schema:
                type: string
              description: The link to determine the status of the operation that
                was initiated with this request.
  "/repository/items/{itemId}/childTypes":
    get:
      x-sas-internal: true
      tags:
      - Repository
      summary: Get the types of children for the specified repository item
      description: >
        Returns the types of children for the specified repository item.  This
        summary of counts includes all children recursively.
      operationId: getRepositoryChildTypes
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.clinical.repository.child.types:
              schema:
                $ref: '#/components/schemas/repositoryChildTypes'
              examples:
                json:
                  $ref: '#/components/schemas/repositoryChildTypes/example'
            application/json:
              schema:
                $ref: '#/components/schemas/repositoryChildTypes'
              examples:
                json:
                  $ref: '#/components/schemas/repositoryChildTypes/example'
        "404":
          description: Not found - the repository item could not be found.
  "/repository/items/{itemId}/content":
    post:
      tags:
      - Repository
      summary: Download repository content
      description: >
        Downloads repository content and returns the stream on the response
        body.        <p> If the itemId is for a file, the latest file content is
        downloaded by default. To download the content of a specific version,
        see
        [getRepositoryFileContentByIdAndVersion](#operationId:getRepositoryFileContentByIdAndVersion)
        operation. <p> If the itemId is for a container, the container and all
        of its children are downloaded to a ZIP file.  Multiple items in the
        container can be downloaded to a ZIP file by providing the item names on
        the request body.      
         <p>
         Optionally, an action status ID can be provided to monitor the completion
        status. 
         To get the action status ID, first call [batchUpdate](#operationId:batchUpdate)
        with the action DOWNLOAD, which returns the action status ID on the request
        header.  <p><b>Authorization:</b>  Requires read permission on the file for
        file downloads.
        Requires read permission on the container and children for container downloads.
      operationId: getRepositoryItemContent
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - name: actionStatusId
        in: query
        description: >
          The action status ID if monitoring the completion status. The action
          status ID is obtained by calling batchUpdate with the action
          DOWNLOAD.
        required: false
        schema:
          type: string
        example: z31efec9-dcc2-4574-8af8-69897038d9c6
      requestBody:
        required: false
        description: >
          A collection of strings that includes the names of items in the
          container specified to download to a ZIP file. File and container
          names can be specified. The request body is ignored, if the itemId for
          to a file.
        content:
          application/json:
            schema:
              type: array
            example:
            - file1.sas
            - file2.txt
            - folder1
      responses:
        "200":
          description: Content downloaded.
        "404":
          description: Not found - the repository item could not be found.
    put:
      tags:
      - Repository
      summary: Upload repository content
      description: >
        Uploads a single file to create a new file or updates the content of an
        existing file. You can also upload and expand a ZIP file to a container.
           <p>
        If the itemId is for a file, the content of the file is updated. If the file
        is versioned, a new version is added. Otherwise, the content is overwritten.

         <p>
        If the itemId is for a container, a single file can be uploaded or uploaded
        and expanded if the upload file is a ZIP file.     
         <p>
        When uploading a file to a container, if a name is not provided, the API will
        attempt to use the name of the file on the multipart request.  If a file does
        not exist with that name, the file is created. By default, the file is created
        unversioned.   Optionally, version information can be specified to create
        the file as versioned. If a file with that name exists,  a new version is
        added if the file is versioned; otherwise, the content is overwritten. When
        upload and expanding, the same rules apply to files and any folders that do
        not exist are created.

        <p>
         Optionally, an action status ID can be provided to monitor the completion
        status. 
              To get the action status ID, first call [batchUpdate](#operationId:batchUpdate)
        with the action UPLOAD or UPLOAD_EXPAND, which returns the action status ID
        on the request header.
        <p><b>Authorization:</b>  Requires write permission on any upload locations.
        If versioning is specified, the Enable Versioning and/or Manage Versioning
        privilege is required when creating files.
      operationId: putRepositoryItemContent
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - name: name
        in: query
        description: |
          The name of the file to be created or updated.
        schema:
          type: string
        example: testFile.txt
      - name: fileVersion
        in: query
        description: >
          The version specification for creating a version of the file. This
          parameter is not required,  so unless a version parameter value is
          provided, the file is created un-versioned. The valid values
          for  version are MAJOR, MINOR, or a specific version such as 2.3. If
          MAJOR, the file is created as versioned with  initial version 1.0.
          Similarly, MINOR creates a versioned file with version 0.1. If the
          file exists and is  versioned, new versions are MINOR versions by
          default. To specify a version other than MAJOR or MINOR, a
          value  can be specified between 0.1 and 99999.99999. If a context or
          folder is being created, this parameter is ignored.
        required: false
        schema:
          type: string
        example: MAJOR
      - name: enableVersioningOnNewFiles
        in: query
        schema:
          type: boolean
        required: false
        description: >
          Applies to upload and expand (when expand parameter value is true) only.  If
          true, new files are created as  versioned. If a fileVersion is specified,
          it versions according to that specification, otherwise it uses  a major
          (1.0) version. If a file with that name exists, a new version is added if
          the file is versioned;  otherwise, the content is overwritten. The default
          is false.
      - name: comment
        in: query
        description: >
          The file version comment for this newly created repository file.  If
          a context or folder is being created this  parameter will be
          ignored.
        required: false
        schema:
          type: string
        example: Final report version.
      - name: expand
        in: query
        schema:
          type: boolean
        required: false
        description: >
          Determines if the ZIP file on the request should be expanded when it
          is uploaded to the repository container. This parameter is ignored
          if the itemId is for a file.
        example: true
      - name: actionStatusId
