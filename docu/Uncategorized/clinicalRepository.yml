  /workspaces/@currentUser/files:
    post:
      tags:
      - Workspace
      summary: Update the file with the specified path
      description: Update the file with the specified path.
      operationId: updateFile
      parameters:
      - name: path
        in: query
        required: true
        description: |
          The full path of the workspace file.
        schema:
          type: string
        example: /Org/project/programs/report.sas
      - name: action
        in: query
        required: true
        description: >
          The update action to perform on the file. Supported actions:

          * CHECK_OUT: Check out a repository file and copy it to the workspace. If
          the file exists in the workspace its

          content is overwritten. Any parent contexts and folders that do not currently
          exist in the workspace are

          created in the workspace as folders.

          * CHECK_OUT_WITHOUT_COPY: Check out a repository file and do not copy the
          file or its parent containers to the

          workspace.

          * UNDO_CHECKOUT: Undo the check-out of a file that is currently checked
          out. Users can only undo check-out on

          files they have checked out. The workspace content of the file is not affected
          by undo check-out.

          * CHECK_IN: Check in a file that currently exists in the repository and
          is checked out or check in a new file

          that exists in the workspace but does not yet exist in the repository. Checking
          in a file results in the

          file being created or updated in the repository and any missing parent folders
          are created in the repository.

          The optional version and file comments are applied if they are specified.

          * COPY_LATEST_VERSION: Copy the content of a file in the repository to the
          workspace. For versioned files, the

          content of the most recent version of the file is copied to the workspace.
          Existing workspace files are

          overwritten if the content of the file does not already match that of the
          most recent version of the file

          in the repository.

          * COPY_VERSION: Copy the content of a file in the repository to the workspace.
          For versioned files, by default the

          content of the latest version of the file is copied to the workspace. The
          optional parameter "fileVersion" can

          be specified to copy the content of an earlier version of the file. Existing
          workspace files are overwritten

          if the content of the file does not already match that of the specified
          file version in the repository, or 

          the latest version when no version is specified.
        schema:
          type: string
          enum:
          - CHECK_OUT
          - CHECK_OUT_WITHOUT_COPY
          - UNDO_CHECKOUT
          - CHECK_IN
          - COPY_LATEST_VERSION
      - name: fileVersion
        in: query
        description: >
          The optional version specification for checking in a version of the
          file or copying a version of the file to the workspace. This
          parameter is not required, so for check in, unless a version
          parameter value is provided, new files are created un-versioned. For
          the CHECK_IN action, the valid values for version are MAJOR, MINOR,
          or a specific version such as 2.3. If the value is MAJOR, new files are
          created
          as versioned with initial version 1.0. Similarly, if the value is MINOR,
          a
          versioned file is created with version 0.1. If the file exists and is
          versioned, new versions are MINOR versions by default. To specify a
          version other than MAJOR or MINOR, you can specify a value between
          0.1 and 99999.99999. For COPY_VERSION, the specific file version you
          want to copy to the workspace can be specified; otherwise, the
          content of the most recent version is copied. This parameter is
          applicable only when the action is CHECK_IN and COPY_VERSION.
        required: false
        schema:
          type: string
        example: MAJOR
      - name: comment
        in: query
        description: >
          The optional file version comment for the file. This is  applicable only
          when the action is CHECK_IN.
        required: false
        schema:
          type: string
        example: Final report version.
      responses:
        "200":
          description: OK - the file was updated successfully.
          content:
            application/vnd.sas.clinical.workspace.file:
              schema:
                $ref: '#/components/schemas/workspaceFile'
              examples:
                workspaceFile:
                  $ref: "#/components/examples/workspaceFile"
            application/json:
              schema:
                $ref: '#/components/schemas/workspaceFile'
              examples:
                workspaceFile:
                  $ref: "#/components/examples/workspaceFile"
