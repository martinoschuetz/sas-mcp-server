---
openapi: 3.0.3
info:
  version: "3"
  title: Report Distribution
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
  description: "The Report Distribution API  is used to construct distribution requests,\
    \ which are descriptions of a set of reports to be emailed to recipients; the\
    \ email contains links and optionally a report in PDF format. Tasks performed\
    \ by the distribution API include the following. <ul><li>Managing distribution\
    \ requests <li>Scheduling or updating the scheduling of a distribution request\
    \ in the Scheduler API <li>Running the report job to produce email with links\
    \ and optional printed output attachments. </ul> <p>This API schedules distribution\
    \ requests in the Scheduler API in order to assist the Visual Analytics client.\
    \ The reports produced are customized to the recipients, showing only the data\
    \ that the recipient is allowed to see. <br><br> All GET operations have a corresponding\
    \ HEAD which is identical in all respects except a response body is not returned.\
    \ <p>Generic error responses:<ul> <li>401 - The user is not authenticated (returns\
    \ vnd.sas.error) <li>403 - The user is not authorized (returns vnd.sas.error)\
    \ </ul> End of description."
tags:
- name: Root
  description: The API root.
- name: Distribution
  description: The endpoints controlling the distribution of the report.
- name: DistributionRequest
  description: The endpoints managing the report distribution requests.
- name: Scheduler
  description: The endpoints managing the scheduling of the distribution requests
    in the Scheduler Service.
- name: Subscription
  description: The endpoints managing which distribution requests are subscribed to
    by the current user.
- name: Job Execution
  description: The endpoint required by the Job Execution Provider contract.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get API resource links
      description: Return a list of links to the top level resources in this API.
      operationId: root
      responses:
        "200":
          description: A collection of link objects.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            "application/vnd.sas.api+json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root links:
                  $ref: "#/components/examples/rootLinks"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root links:
                  $ref: "#/components/examples/rootLinks"
        "404":
          description: Service is not available.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
  "/distributions/{distributionRequestId}":
    post:
      tags:
      - Distribution
      summary: Execute a report distribution
      description: The request that is run. The distribution request should already
        be created. Verifies the distribution request, runs each report based on the
        recipients' security profiles, produces a PDF copy of the report and links
        to the live report, and emails that information to the recipients.
      operationId: distribute
      parameters:
      - name: distributionRequestId
        in: path
        required: true
        description: Distribution request to be run
        schema:
          type: string
      responses:
        "201":
          description: Distribution has been run.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.results+json:
              schema:
                $ref: "#/components/schemas/distributionResults"
              examples:
                distribution request body:
                  $ref: "#/components/examples/distributionResultsObject"
            application/json:
              schema:
                $ref: "#/components/schemas/distributionResults"
              examples:
                distribution request body:
                  $ref: "#/components/examples/distributionResultsObject"
        "400":
          description: Bad request.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.results+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
        "404":
          description: Distribution request was not found.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.results+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
  /distributionRequests:
    post:
      tags:
      - DistributionRequest
      summary: Create a report distribution request
      description: Verifies the format and contents of the distribution request, validates
        report permissions, and persists the request to a database.
      operationId: createDistributionRequest
      requestBody:
        $ref: "#/components/requestBodies/distributionRequestBody"
      responses:
        "201":
          description: Distribution request has been created.
          headers:
            Location:
              description: The location (URL) of the new distribution request.
              schema:
                type: string
            ETag:
              description: The entity tag which conveys the modification state of
                the new distribution request.
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.request+json:
              schema:
                $ref: "#/components/schemas/distributionRequest"
              examples:
                distribution request response:
                  $ref: "#/components/examples/distributionRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/distributionRequest"
              examples:
                distribution request response:
                  $ref: "#/components/examples/distributionRequest"
        "400":
          description: Bad request.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.request+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
    get:
      tags:
      - DistributionRequest
      summary: Get a list of report distribution requests
      description: Gets a list of distribution requests subject to any filtering.
      operationId: getDistributionRequests
      parameters:
      - name: Accept-Item
        description: >
          This is an optional header. If it has the value of
          'application/vnd.sas.summary+json', then items of
          application/vnd.sas.summary are returned with
          **distributionRequest** as the value for `type`; if it is absent or
          has the value of
          'application/vnd.sas.report.distribution.request+json', then items
          of application/vnd.sas.report.distribution.request are returned.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.report.distribution.request+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.report.distribution.request+json
      - name: start
        in: query
        description: The starting index of the first distribution request in a page.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: >
          Maximum number of distribution requests to return in this page of
          results. The actual number of returned distribution requests may be
          less if the collection has been exhausted.
        schema:
          type: integer
          default: 50
      - name: filter
        in: query
        description: >
          Filter criteria for returned distribution requests. See
          https://developer.sas.com/rest-apis/reportDistribution-v3/docs/getting-started/usage-notes#filtering
          for more
          information on the format of the filter. <br>Any attribute of the
          distribution request can be used to filter the results.
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: >
          Sort returned collection of distribution requests.  The sort
          criteria supports the following fields in either ascending or
          descending order (name, type).  See
          https://developer.sas.com/rest-apis/reportDistribution-v3/docs/getting-started/usage-notes#sorting
          for more
          information on the format of the sort keys.
        schema:
          type: string
      - name: reportUri
        in: query
        description: >
          Return only distribution requests containing the report with the
          specified URI.
        schema:
          type: string
          format: relative URI
      responses:
        "200":
          description: List of distribution requests have been returned. May be empty.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/requestCollection"
              examples:
                distribution request collection:
                  $ref: "#/components/examples/distributionRequestCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/requestCollection"
              examples:
                distribution request collection:
                  $ref: "#/components/examples/distributionRequestCollection"
  "/distributionRequests/{distributionRequestId}":
    get:
      tags:
      - DistributionRequest
      summary: Get a report distribution request
      description: Get the distribution request for viewing and editing.
      operationId: getDistributionRequest
      parameters:
      - name: Accept
        description: >
          This is an optional header. If it has the value of
          'application/vnd.sas.summary+json', then the distribution request is
          returned as application/vnd.sas.summary with **distributionRequest**
          as the value for `type`; if it is absent or has the value of
          'application/vnd.sas.report.distribution.request+json', then the
          distribution request is returned as
          application/vnd.sas.report.distribution.request.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.report.distribution.request+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.report.distribution.request+json
      - name: distributionRequestId
        in: path
        required: true
        description: Distribution request to get
        schema:
          type: string
      responses:
        "200":
          description: Retrieved distribution request.
          headers:
            ETag:
              description: The entity tag which conveys the modification state of
                the returned distribution request.
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.request+json:
              schema:
                $ref: "#/components/schemas/distributionRequest"
              examples:
                distribution request response:
                  $ref: "#/components/examples/distributionRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/distributionRequest"
              examples:
                distribution request response:
                  $ref: "#/components/examples/distributionRequest"
        "404":
          description: Distribution request could not be retrieved
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.request+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
    put:
      tags:
      - DistributionRequest
      summary: Update a report distribution request
      description: Update the distribution request (report permission validation is
        enforced).
      operationId: updateDistributionRequest
      parameters:
      - name: distributionRequestId
        in: path
        required: true
        description: Distribution request to update
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: value of the Etag of the distribution request to be updated
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/distributionRequestBody"
      responses:
        "200":
          description: Updated distribution request.
          headers:
            ETag:
              description: The entity tag which conveys the modification state of
                the updated distribution request.
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.request+json:
              schema:
                $ref: "#/components/schemas/distributionRequest"
              examples:
                distribution request response:
                  $ref: "#/components/examples/distributionRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/distributionRequest"
              examples:
                distribution request response:
                  $ref: "#/components/examples/distributionRequest"
        "400":
          $ref: "#/components/responses/badRequestError"
        "404":
          description: Could not find distribute request to update it.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.request+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
        "412":
          description: Pre-condition failed. The If-Match value does not match, so
            the PUT is not updating the current version of the distribution request.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.request+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
        "428":
          description: Pre-condition required. An If-Match header with the Etag value
            of the retrieved job is required.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.request+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
    delete:
      tags:
      - DistributionRequest
      summary: Delete a report distribution request
      description: Delete the distribution request. Report permission validation is
        enforced before deletion. If there are jobs or job requests in the Scheduler
        service associated with this distribution request, they are also deleted.
      operationId: deleteDistributionRequest
      parameters:
      - name: distributionRequestId
        in: path
        required: true
        description: Id of distribution request to delete
        schema:
          type: string
      responses:
        "204":
          description: Distribution request was deleted
        "400":
          description: Report not found.
          headers:
            Content-Type:
              schema:
                type: string
              example: "application/vnd.sas.error+json;version=2"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                reportNotFound:
                  $ref: "#/components/examples/badRequestReportError400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                reportNotFound:
                  $ref: "#/components/examples/badRequestReportError400"
        "404":
          description: Distribution request was not found
  "/distributionRequests/{distributionRequestId}#transfer":
    get:
      tags:
      - DistributionRequest
      summary: Get a report distribution request in a transfer object
      description: Get the distribution request in a transfer object.
      operationId: getDistributionRequestTransfer
      parameters:
      - name: distributionRequestId
        in: path
        required: true
        description: Distribution request to get
        schema:
          type: string
      responses:
        "200":
          description: Retrieved distribution request in transfer object form
          headers:
            ETag:
              description: The entity tag which conveys the modification state of
                the returned distribution request.
              schema:
                type: string
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/transferObject"
              examples:
                transfer object:
                  $ref: "#/components/examples/transferObject"
            application/json:
              schema:
                $ref: "#/components/schemas/transferObject"
              examples:
                transfer object:
                  $ref: "#/components/examples/transferObject"
        "404":
          description: Distribution request could not be retrieved
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
    put:
      tags:
      - DistributionRequest
      summary: Update a report distribution request from the transfer object
      description: Create or update the distribution request from the transfer object.
        Note that in v3 of the API for Viya 4.0, the return type has been changed
        to match the Transfer Object Provider contract.  The return object is expected
        to be a Resource Summary, not another transfer object.  This is done whether
        creating or updating from the transfer object. Report permission validation
        is enforced.
      operationId: updateDistributionRequestTransfer
      parameters:
      - name: distributionRequestId
        in: path
        required: true
        description: Distribution request to update
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              transfer object:
                $ref: "#/components/examples/transferObject"
          application/json:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              transfer object:
                $ref: "#/components/examples/transferObject"
        description: Transfer object
        required: true
      responses:
        "200":
          description: Updated distribution request, returned as a summary object
            that has a "self" link to the full distribution request object.
          headers:
            ETag:
              description: The entity tag which conveys the modification state of
                the updated distribution request.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                distribution request body:
                  $ref: "#/components/examples/summaryObject"
            application/json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                distribution request body:
                  $ref: "#/components/examples/summaryObject"
        "201":
          description: Created distribution request, returned as a summary object
            that has a "self" link to the full distribution request object.
          headers:
            ETag:
              description: The entity tag which conveys the modification state of
                the created distribution request.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                distribution request body:
                  $ref: "#/components/examples/summaryObject"
            application/json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                distribution request body:
                  $ref: "#/components/examples/summaryObject"
        "400":
          $ref: "#/components/responses/badRequestError"
        "412":
          description: Pre-condition failed. The If-Match value does not match, so
            the PUT is not updating the current version of the distribution request.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
        "428":
          description: Pre-condition required. An If-Match header with the Etag value
            of the retrieved job is required.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
  /scheduler:
    post:
      tags:
      - Scheduler
      summary: Create and schedule a job with a report distribution request
      description: Creates a job that refers to a report distribution request and
        adds it to the Scheduler service. Report permission validation is enforced.
      operationId: scheduleDistributionRequest
      parameters:
      - name: distributionRequestId
        in: query
        required: true
        description: Id of distribution request to be scheduled.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.schedule.trigger+json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/trigger"
            examples:
              trigger object:
                $ref: "#/components/examples/triggerObject"
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/trigger"
            examples:
              trigger object:
                $ref: "#/components/examples/triggerObject"
        description: Triggers associated with the scheduled job. If the array is empty,
          e.g. JSON "[]", or if the body of the request is not supplied (of zero length),
          an immediate trigger is added, which indicates that the distribution should
          be run right away.
      responses:
        "201":
          description: Job has been created and scheduled.
          headers:
            Location:
              description: The location (URL) of the new scheduled job in the Scheduler
                service.
              schema:
                type: string
            ETag:
              description: The entity tag which conveys the modification state of
                the new scheduled job.
              schema:
                type: string
          content:
            application/vnd.sas.schedule.job+json:
              schema:
                $ref: "#/components/schemas/scheduleJob"
              examples:
                scheduleJob object:
                  $ref: "#/components/examples/scheduleJobObject"
            application/json:
              schema:
                $ref: "#/components/schemas/scheduleJob"
              examples:
                scheduleJob object:
                  $ref: "#/components/examples/scheduleJobObject"
        "400":
          description: The scheduler service reported an invalid value in the trigger.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.schedule.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
  "/scheduler/{jobId}/distributionRequest":
    get:
      tags:
      - Scheduler
      summary: Get a report distribution request in a scheduled job
      description: Get the distribution request for viewing and editing.
      operationId: getScheduledDistributionRequest
      parameters:
      - name: jobId
        in: path
        required: true
        description: Id of the job that contains the distribution request
        schema:
          type: string
      responses:
        "200":
          description: Retrieved distribution request.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.request+json:
              schema:
                $ref: "#/components/schemas/distributionRequest"
              examples:
                distribution request object:
                  $ref: "#/components/examples/distributionRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/distributionRequest"
              examples:
                distribution request object:
                  $ref: "#/components/examples/distributionRequest"
        "404":
          description: Distribution request could not be retrieved
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.report.distribution.request+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
  "/scheduler/{jobId}/triggers":
    get:
      tags:
      - Scheduler
      summary: Get the triggers in a scheduled job
      description: Get the triggers for viewing and editing.
      operationId: getScheduledDistributionRequestTriggers
      parameters:
      - name: jobId
        in: path
        required: true
        description: Id of the job that contains the triggers
        schema:
          type: string
      responses:
        "200":
          description: Retrieved triggers
          headers:
            ETag:
              description: The entity tag which conveys the modification state of
                the job containing the returned triggers.
              schema:
                type: string
          content:
            application/vnd.sas.schedule.trigger+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/trigger"
              examples:
                trigger object:
                  $ref: "#/components/examples/triggerObject"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/trigger"
              examples:
                trigger object:
                  $ref: "#/components/examples/triggerObject"
        "404":
          description: Triggers could not be retrieved
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.schedule.trigger+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
  "/scheduler/{jobId}":
    put:
      tags:
      - Scheduler
      summary: Update the trigger event, name, and/or description of a scheduled distribution
        request
      description: Update the distribution request.
      operationId: updateScheduledDistributionRequest
      parameters:
      - name: jobId
        in: path
        required: true
        description: Scheduled job to update
        schema:
          type: string
      - name: name
        in: query
        required: false
        description: Name for the distribution request and its job
        schema:
          type: string
      - name: description
        in: query
        required: false
        description: Description for the distribution request and its job
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: value of the Etag of the job to be updated
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.schedule.trigger+json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/trigger"
            examples:
              trigger object:
                $ref: "#/components/examples/triggerObject"
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/trigger"
            examples:
              trigger object:
                $ref: "#/components/examples/triggerObject"
        description: New trigger values for the job
      responses:
        "200":
          description: Updated triggers in the job.
          headers:
            ETag:
              description: The entity tag which conveys the modification state of
                the updated job.
              schema:
                type: string
          content:
            application/vnd.sas.schedule.trigger+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/trigger"
              examples:
                trigger object:
                  $ref: "#/components/examples/triggerObject"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/trigger"
              examples:
                trigger object:
                  $ref: "#/components/examples/triggerObject"
        "400":
          description: The scheduler service reported an invalid value in one of the
            triggers.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.schedule.trigger+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
        "404":
          description: The job to be updated could not be found.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.schedule.trigger+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
        "412":
          description: Pre-condition failed. The If-Match header value does not match,
            so the PUT is not updating the most current version of the job.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.schedule.trigger+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
        "428":
          description: Pre-condition required. An If-Match header with the Etag value
            of the retrieved job is required.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.schedule.trigger+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
    delete:
      tags:
      - Scheduler
      summary: Delete the schedule from a report distribution request
      description: Delete the Scheduler service job associated with the distribution
        request. If there are job requests in the Scheduler service associated with
        this job, they are also deleted.
      operationId: deleteScheduleForDistributionRequest
      parameters:
      - name: jobId
        in: path
        required: true
        description: Id of scheduler job to delete
        schema:
          type: string
      responses:
        "204":
          description: Scheduler job was deleted
        "404":
          description: Scheduler job was not found
          headers:
            Content-Type:
              schema:
                type: string
  /subscriptions:
    get:
      tags:
      - Subscription
      summary: Get a list of distribution request subscriptions
      description: Gets a list of distribution requests that the current user is either
        subscribed to or not.
      operationId: getDistributionRequestSubscriptions
      parameters:
      - name: state
        in: query
        required: true
        description: >
          The subscription state of the distribution request in terms of the
          current user.
        schema:
          type: string
          enum:
          - subscribed
          - unsubscribed
      - name: start
        in: query
        description: The starting index of the first distribution request in a page.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: >
          Maximum number of distribution requests to return in this page of
          results. The actual number of returned distribution requests may be
          less if the collection has been exhausted.
        schema:
          type: integer
          default: 50
      - name: filter
        in: query
        description: >
          Filter criteria for returned distribution requests. See
          https://developer.sas.com/rest-apis/reportDistribution-v3/docs/getting-started/usage-notes#filtering
          for more
          information on the format of the filter. <br>Any attribute of the
          distribution request can be used to filter the results.
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: >
          Sort returned collection of distribution requests.  The sort
          criteria supports the following fields in either ascending or
          descending order (name, type).  See
          https://developer.sas.com/rest-apis/reportDistribution-v3/docs/getting-started/usage-notes#sorting
          for more
          information on the format of the sort keys.
        schema:
          type: string
      responses:
        "200":
          description: List of distribution requests have been returned. May be empty.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/requestCollection"
              examples:
                distribution request collection:
                  $ref: "#/components/examples/distributionRequestCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/requestCollection"
              examples:
                distribution request collection:
                  $ref: "#/components/examples/distributionRequestCollection"
        "400":
          description: An incorrect value for state has been used.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
  "/subscriptions/{distributionRequestId}/state":
    put:
      tags:
      - Subscription
      summary: Subscribe or unsubscribe
      description: Subscribe or unsubscribe the current user for a distribution request.
        Report permission validation is enforced.
      operationId: updateSubscriptionState
      parameters:
      - name: distributionRequestId
        in: path
        required: true
        description: The id of the distribution request to subscribe to or unsubscribe
          from.
        schema:
          type: string
      - name: value
        in: query
        required: true
        description: |
          The desired state of subscription for that distribution request.
        schema:
          type: string
          enum:
          - subscribed
          - unsubscribed
      responses:
        "200":
          description: Returned plain text with the value subscribed or unsubscribed.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
                enum:
                - subscribed
                - unsubscribed
              examples:
                subscribe response:
                  $ref: "#/components/examples/subscriptionState"
        "400":
          description: The current user cannot be unsubscribed because he is included
            by a group.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
        "404":
          description: User or distribution not found.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError404"
  /jobs:
    post:
      tags:
      - Job Execution
      summary: Submit an execution job
      description: Submit a job that has been created by the Job Execution API.
      operationId: submitJob
      requestBody:
        content:
          application/vnd.sas.job.execution.job+json:
            schema:
              $ref: "#/components/schemas/job"
            examples:
              job object:
                $ref: "#/components/examples/jobObject"
          application/json:
            schema:
              $ref: "#/components/schemas/job"
            examples:
              job object:
                $ref: "#/components/examples/jobObject"
        description: Job that has been created by the Job Execution API to be executed
          by the provider.
        required: true
      responses:
        "201":
          description: The job execution was started.
          headers:
            Location:
              description: The URL of the job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                job object:
                  $ref: "#/components/examples/jobObject"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                job object:
                  $ref: "#/components/examples/jobObject"
        "400":
          $ref: "#/components/responses/badRequestError"
servers:
- url: http://example.com/reportDistribution
  description: Sample server URL.
components:
  responses:
    badRequestError:
      description: Bad request. The response object will contain an error code and
        further information.
      headers:
        Content-Type:
          schema:
            type: string
      content:
        application/vnd.sas.report.distribution.request+json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            bad request response:
              $ref: "#/components/examples/badRequestError400"
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            bad request response:
              $ref: "#/components/examples/badRequestError400"
        application/json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            bad request response:
              $ref: "#/components/examples/badRequestError400"
  schemas:
    distributionRequest:
      type: object
      title: Distribution request.
      description: A collection of information needed to generate reports with the
        recipients' view of the data and email PDF copies of those reports to the
        recipients.
      x-sas-media-type:
        name: application/vnd.sas.report.distribution.request
        version: 1
      required:
      - name
      - reportRequests
      properties:
        id:
          type: string
          description: unique identifier for the distribution request.
        name:
          type: string
          description: name of the distribution request.
        description:
          type: string
          description: description for the distribution request.
        reportRequests:
          type: array
          description: an array of report requests for the distribution to run.
          items:
            $ref: "#/components/schemas/reportRequest"
        recipients:
          type: array
          description: an array of URIs identifying users or groups in the identities
            service. No recipients are required when creating a distribution request,
            because of subscribing or unsubscribing, but at least one valid recipient
            is required to run a distribution.
          items:
            type: string
        subject:
          type: string
          description: Text that appears in the subject of the email. A default subject
            is included if a value for this attribute is not provided.
        body:
          type: string
          description: Text that appears in the body of the email along with generated
            information about the reports attached to the email.
        includePdf:
          type: boolean
          default: true
          description: If true or not defined, attach a PDF version of the report
            or reports to the email sent to the recipient; otherwise, send an email
            that contains links to the report or reports.
        includeScreenplay:
          type: boolean
          default: false
          description: If true, get a screenplay, which is text that describes something
            about the report, and include in the body of the email sent to the recipient.
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 2.
    reportRequest:
      title: Report request
      description: report with an optional report transform
      required:
      - reportUri
      properties:
        id:
          type: string
          description: unique identifier for the report request.
        reportUri:
          type: string
          description: reference to a report in the Reports service.
        operation:
          type: string
          description: the type of report transform to be applied to the report, represented
            by the endpoint of the Report Transforms service. This is required if
            `transform` is not null.
        transform:
          type: string
          description: content of a report transform to be applied to the report.
            May be null. Validation and application of the report transform is handled
            by the Report Transforms service; this service treats it as a black box.
    distributionResults:
      title: Distribution results
      description: information returned when a report distribution is run
      properties:
        version:
          type: integer
          description: version of this media type.
        resultSummary:
          type: string
          description: a description of which recipients received reports and reasons
            given if the reports were not received.
    requestCollection:
      title: Report Distribution Request Collection
      description: A collection of distribution request representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The array of `application/vnd.sas.report.distribution.request`
              representations.
            items:
              $ref: "#/components/schemas/distributionRequest"
    scheduleJob:
      title: job
      description: Scheduled job (from the Scheduler service).  The Scheduler service
        validates the fields in the Job.
      required:
      - id
      - name
      - request
      - triggers
      properties:
        version:
          type: integer
          description: Job schema version
          default: 1
        id:
          type: string
          description: Unique identifier for a particular job
        name:
          type: string
          description: Name assigned to the job
        description:
          type: string
          description: An informative description of the job
        group:
          type: string
          description: A term by which jobs can be organized.
        runAs:
          type: string
          description: Username to run the job under
        request:
          $ref: "#/components/schemas/request"
        triggers:
          title: triggers
          description: Array of triggers for scheduled request (from the Scheduler
            service)
          type: array
          items:
            $ref: "#/components/schemas/trigger"
    request:
      title: Job Request
      description: A job request.
      x-sas-media-type:
        name: application/vnd.sas.job.execution.job.request
        version: 3
      required:
      - id
      type: object
      properties:
        version:
          type: integer
          description: The version number of the representation. The current version
            is 3.
        id:
          type: string
          description: The unique identifier for the job request. This is only required
            for a persisted job request.
        name:
          type: string
          description: The name of the job request.
        description:
          type: string
          description: The description of the job request.
        creationTimeStamp:
          description: The timestamp for when the job request was created, in the
            format of `YYYY-MM-DDThh:mm:ss.sssZ`.  This is set only on a persisted
            job request.
          type: string
        modifiedTimeStamp:
          description: The timestamp for when the job request was last modified, in
            the format of `YYYY-MM-DDThh:mm:ss.sssZ`.  This is set only on a persisted
            job request.
          type: string
        createdBy:
          description: The ID of the user that created the job request.  This is set
            only on a persisted job request.
          type: string
        modifiedBy:
          description: The ID of the user that last modified the job request.  This
            is set only on a persisted job request.
          type: string
        jobDefinitionUri:
          type: string
          description: The URI of the job definition that is to be executed.  Either
            the `jobDefinitionUri` or the `jobDefinition` property must be set in
            a job request submitted to Job Execution service for execution.
        jobDefinition:
          $ref: "#/components/schemas/jobDefinition"
        expiresAfter:
          type: string
          description: The duration of time (in <a href="https://www.w3.org/TR/xmlschema-2/#duration"
            target="_blank">W3C XML duration format</a>) after the completion of the
            job when the job should be deleted by the Job Execution service. If a
            value is specified for this property, it overrides any value specified
            by the provider's `/commons/settings` endpoint for the job request.<p>For
            a job request that is embedded in the `application/vnd.sas.job.execution.job`
            media type, if a value is not already set for the `expiresAfter` property,
            the value is set by the Job Execution service to the provider's value,
            if one exists.
        arguments:
          type: object
          description: The values of the arguments in the format map<string, string>
            that contains name value pairs (map<name, value>). Values can be supplied
            for parameters not defined in the job definition. The maximum name length
            is 100.<p>Hibernate does not persist a map entry with a null value. Therefore,
            a persisted Job Request will not contain any such entries.<p>For a job
            request that is embedded in the 'application/vnd.sas.job.execution.job'
            media type, this value is set by the Job Execution service and contains
            the complete set of arguments that are to be used in the execution by
            the provider. Arguments that already exist in the original job request
            are left unchanged. If there are arguments in the job definition that
            do not exist in the original job request arguments map, those arguments
            and any default values, including null values, are added to the arguments
            map. However, since the Job object is persisted before being sent to the
            provider, no entries for such null-value arguments in the Job are sent
            to the provider (because of the Hibernate behavior of not persisting map/collection
            entries with null values). The Job Execution service also guarantees that
            any required argument has an associated non-null value.
        properties:
          type: object
          description: The value of properties in the format of (map<string, string>)
            that contains name value pairs (map<name, value>). The maximum name length
            is 100.
          additionalProperties:
            type: string
        createdByApplication:
          type: string
          description: The application that created the job request. The value is
            typically from the spring.application.name property. The value is used
            as the "creator" in the routing key of the Job State Change events, and
            if it is not present in the job request the value "jobExecution" is used.
            Valid characters are [a-zA-Z0-9] and the hyphen. The maximum length is
            64.
        links:
          type: array
          description: The links that are associated with the job request.
          items:
            $ref: "#/components/schemas/link"
    trigger:
      type: object
      title: trigger
      description: Trigger attribute of the scheduled job (from the Scheduler service).
        The Scheduler service validates the fields in the Trigger.
      required:
      - name
      - type
      properties:
        id:
          type: string
          description: unique identifier for a particular trigger
        type:
          type: string
          description: Specify type of trigger as a String.
          enum:
          - immediate
          - simple
          - cron
          - timeEvent
          default: immediate
        name:
          type: string
          description: An identifier used in retrieving this trigger
        group:
          type: string
          description: An identifier used in retrieving this trigger
        applicationId:
          type: string
          description: An identifier used to describe the application that created
            the trigger
        start:
          type: string
          format: date-time
          description: A representation of the time when the scheduler will run the
            job. This time string expects a format based on the common form of ISO-8601,
            YYYY-MM-DDTHH:MM:SS.SSSZ, which is year-month-day letter 'T' hour:minute:second
            and fractions. Used by `simple` and `cron` types.
        end:
          type: string
          format: date-time
          description: A representation of the time when the scheduler will stop scheduling
            the job. This time string expects a format based on the common form of
            ISO-8601, YYYY-MM-DDTHH:MM:SS.SSSZ, which is year-month-day letter 'T'
            hour:minute:second and fractions. Used by `simple` and `cron` types.
        repeat:
          type: integer
          description: Set the number of times to repeat the job, given other constraints.
            "-1" is special, meaning run the job forever. Used by `simple` and `cron`
            types.
          default: 1
        interval:
          type: array
          description: Set the spacing between repetition of the job. May be a single
            non-negative integer referring to the number of interval units for all
            interval units except `weekDay` or a list of weekdays for the interval
            unit of `weekDay`. Used by `simple` and `cron` types.
          items:
            type: string
        intervalUnit:
          type: string
          description: Set the time unit for the spacing between job executions. Used
            by `simple` and `cron` types.
          enum:
          - second
          - minute
          - hour
          - day
          - week
          - weekday
          - month
          - year
          default: day
        day:
          type: string
          description: Set the day of the week to run the job, given other constraints.
            Used by `simple` and `cron` types.
          enum:
          - sunday
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          default: monday
        cron:
          type: string
          description: Specify a "cron expression" as a String. A cron expression
            is a string comprised of 6 or 7 fields separated by white space. For details
            on the values of the fields, see http://www.quartz-scheduler.org/documentation/quartz-1.x/tutorials/crontrigger.
            Required for `cron` type.
        active:
          type: boolean
          description: designates if the associated job will be run based on the definition
            of this trigger
          default: true
        timeEvent:
          $ref: "#/components/schemas/timeEvent"
    timeEvent:
      type: object
      description: Collection of fields used for the `timeEvent` type. Required for
        `timeEvent` type. The Scheduler service validates the fields in the time event.
      required:
      - hours
      - minutes
      - recurrence
      properties:
        recurrence:
          $ref: "#/components/schemas/recurrence"
        hours:
          type: string
          description: comma-separated list of hours for a time event trigger. Values
            should be between 0 and 23, inclusive.
        minutes:
          type: string
          description: comma-separated list of minutes for a time event trigger. Values
            should be between 0 and 59, inclusive.
        timezone:
          type: string
          description: timezone used to interpret hours:minutes for time event trigger
          default: GMT
        maxOccurrence:
          type: string
          description: number of times to run the time event trigger. The default
            of -1 means no maximum
          default: "-1"
    recurrence:
      description: How often the time event should occur.  The Scheduler service validates
        the fields in the Recurrence.
      type: object
      required:
      - type
      properties:
        "type":
          description: recurrenceType for the recurrence
          type: string
          enum:
          - minutely
          - hourly
          - daily
          - weekly
          - monthly
          - yearly
          - datelist
        startDate:
          type: string
          description: The date to start this recurrence specified as yyyy-mm-dd.
            Required for all recurrence types except `dateList`.
          default:
        endDate:
          type: string
          description: The date to end this recurrence specified as yyyy-mm-dd. Used
            by all recurrence types except `dateList`.
          default:
        skipCount:
          type: integer
          description: The number of interval units to skip, defaults to 1 meaning
            no skip. Used by all recurrence types except `dateList`.
          default: 1
        daysOfWeek:
          type: array
          items:
            type: string
            enum:
            - "sunday"
            - "monday"
            - "tuesday"
            - "wednesday"
            - "thursday"
            - "friday"
            - "saturday"
          description: a list of weekdays. Required for weekly recurrence type. Used
            by `monthly` and `yearly` recurrence types in conjunction with `occurrence`
            but should contain only one weekday for these types.
          default:
        occurrence:
          type: string
          description: Ordinal value representing a specific week instance. Used by
            `monthly` and `yearly` recurrence types in conjunction with `daysOfWeek`.
          enum:
          - first
          - second
          - third
          - fourth
          - last
          default:
        dayOfMonth:
          type: string
          description: The specific numerical value for a day. Range is from 1 to
            32. 32 is a special value meaning the last day of the month, no matter
            how many days the month has. If a day is specified but does not exist,
            the job is skipped. Used by `monthly` and `yearly` recurrence types as
            an alternative to `occurrence` and `daysOfWeek`.
          default: No default
        monthOfYear:
          type: string
          description: The month to run the job. Required for `yearly` recurrence
            type.
          enum:
          - january
          - february
          - march
          - april
          - may
          - june
          - july
          - august
          - september
          - october
          - november
          - december
          default: No default
        dates:
          description: a list of dates using format yyyy-mm-dd. Required for the `dateList`
            recurrence type.
          type: array
          items:
            type: string
            default:
        expression:
          type: string
          description: A scheduler specific opaque field.  Not currently used by this
            scheduler
          default:
