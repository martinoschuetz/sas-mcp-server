---
openapi: 3.0.3
info:
  version: "4"
  title: Templates
  description: >
    This API provides the ability to store templates, retrieve templates,
    and to produce customize templates by applying merge variables.<p>
    </details>
    <br>
    <details>
    <summary><b>Overview</b></summary>
    The Templates API provides supports formatting variable content
    based on pre-defined and custom templates. The template API also provides
    create, read, update, and delete actions on all templates.
    </p>
    This API is usable by any service/solution which requires templates for replaceable
    fields, with locale and asset type support for email and asset operation as
    modeled by a REST endpoint.  To specify merge variables and their respective values
    to be rendered, use common format vnd.sas.properties in request body.
    </p>
    It is now possible to create a template which contains multiple parts
    including the original template text.  The Subject of the template can be
    specified in the same template.  Any part of the template can be related,
    such as Headers and Footers too.
    </p>
    Dependent microservices include:
    <ul>
    <li>Authentication</li>
    <li>Authorization</li>
    <li>Identities</li>
    </ul>
    </details>
    <br>
    <details>
    <summary><b>Security</b></summary>
    <ul>
    <li><p>Authorization</br>Users of the API may obtain different information based
    on their Authorization.  Users that hold the
    SAS Administrators group are allowed access to all templates. A User that is just
    an authenticated user is allowed read and write access to templates they have
    created.
    </p>
    The Authorization API automatically
    protects any endpoints of any API that includes dependencies on it.
    This dependency intercepts calls to the endpoints and builds an
    authorization context, which is then sent to the Authorization API for evaluation.
    If the context
    is granted permission to perform the request action on that endpoint, it returns
    an HTTP status
    code of 200 and allows the request to proceed. If the context is prohibited, it
    returns an HTTP status
    code of 403 and the request does not continue further.
    This access is controlled by authorization rules that can be created through bootstrapping,
    by an administrative user, or by other methods.</p>
    </p>
    Authorization rules for templates:
    <ul>
    <li>An authenticated user can create a template.</li>
    <li>An authenticated user can read, edit, delete templates created by the same
    user.</li>
    <li>An authenticated user can generate templates from template definitions, provided
    template is
    created by the same user.</li>
    <li>An authenticated user can have full control over the template created by other
    users,
    provide the user belongs to the <b>SASAdministrators</b> custom group.</li>
    </ul>
    </li>
    <li><p>Authentication</br> Consumers of the API must be authenticated through
    standard mechanisms which ultimately provide a valid Oauth2 token on any Requests
    to the API.  A User can be an authenticated user via a client logon
    or another microservice acting on its own behalf.
    </li></ul></p></p>
    </details>
    <br>
    <details>
    <summary><b>Locale</b></summary>
    It is possible and useful to create a template and then use this template to create
    a corresponding templates for multiple locales.
    The same notification messages template used for system error alerting, could
    be
    devised in multiple languages, and sent to the user based on preferred locale
    or other locale specific setting.
    </details>
    <br>
    <details>
    <summary><b>Terminology</b></summary>
    <ul>
    <li><b>template:</b>
    Contains the text structure and shaping elements, and the
    merge variables. Supports the generation of structured text output such as web
    pages, source code, emails and newsletters.
    </li>
    <li><b>merge field:</b>
    A placeholder that you insert in a template. When merge variables are applied
    to the
    template, the resulting template content contains the values specified by the
    merge variables.  An example of merge field is $reportNumber$ specified in the
    text field of template.
    </li>
    <li><b>merge variable:</b>
    A variable object that contains a mapping of a merge
    field to a specific value. For example, given the merge field $CITY$, a merge
    variable might contain "name": "CITY", "value": "San Francisco".
    </li>
    <li><b>textParts</b>
    Contains the template text, additional parts of the template possibly including
    subject, header, footer.
    </li>
    </ul>
    </details>
    <br>
    <details>
    <summary><b>Error Codes</b></summary>
    <p>
    <table>
    <tr>
    <th>HTTP Status Code</th>
    <th>Error Code</th>
    <th>Description</th>
    </tr>
    <tr>
    <td>412</td>
    <td>1013</td>
    <td>The If-Match request header did not match the resources entity tag, or the
    If-Unmodified-Since request header did not match the resources last modified timestamp.</td>
    </tr>
    <tr>
    <td>404</td>
    <td>78301</td>
    <td>Template could not be found.</td>
    </tr>
    <tr>
    <td>400</td>
    <td>78302</td>
    <td>Error parsing the template. Confirm reserved word is not included in text
    field.</td>
    </tr>
    <tr>
    <td>400</td>
    <td>78303</td>
    <td>No template name included in body, ignoring update request.</td>
    </tr>
    <tr>
    <td>400</td>
    <td>78304</td>
    <td>Template could not be created.</td>
    </tr>
    <tr>
    <td>400</td>
    <td>78305</td>
    <td>Template could not be updated.</td>
    </tr>
    <td>409</td>
    <td>78307</td>
    <td>Template could not be created, this template already exists.</td>
    </tr>
    <tr>
    <td>400</td>
    <td>78308</td>
    <td>Template could not be rendered.</td>
    </tr>
    <tr>
    <td>400</td>
    <td>78309</td>
    <td>Template Text could not be converted to or from JSON.</td>
    </tr>
    </table>
    </details>
    </p>
    termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: https://developer.sas.com
servers:
- url: http://example.com/templates
  description: kubernetes mock server
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Template
  description: Contains the operations for the template resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns links to the top-level collections surfaced through this
        API. These top-level links include templates.
      operationId: root
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                rootSampleResponse:
                  $ref: "#/components/examples/rootSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                rootSampleResponse:
                  $ref: "#/components/examples/rootSampleResponse"
  /templates:
    get:
      tags:
      - Template
      summary: Get a list of Templates
      description: Returns a list of templates.  Standard paging, filtering, and sorting
        options are provided.
      operationId: getTemplates
      parameters:
      - name: start
        in: query
        description: 0-based Offset of first template to return.  Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of templates to return.  Defaults to 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned templates. See [Filtering in REST\
          \ APIs](https://developer.sas.com/rest-apis/templates-v4/docs/getting-started/usage-notes#filtering).\
          \ <br>Any member of the Template object can be used to filter the results:\
          \ id, name, description, createdBy, modifiedBy, properties, type, text,\
          \ locale. Date fields currently cannot be used to filter results. <br>Sample\
          \ queries<br> <ul> <li>Get templates by name: /templates?filter=contains(name,\
          \ 'Sample')</li> <li>Get templates by locale: /templates?filter=contains(locale,\
          \ 'Sample-Locale')</li> </ul>\n"
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort returned templates.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: Templates
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/templateCollection"
              examples:
                collectionSampleResponse:
                  $ref: "#/components/examples/collectionSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/templateCollection"
              examples:
                collectionSampleResponse:
                  $ref: "#/components/examples/collectionSampleResponse"
        "400":
          description: An Invalid filter or combination of request parameters was
            provided.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                collectionErrResp:
                  $ref: "#/components/examples/templatesCollectionErrResp"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                collectionErrResp:
                  $ref: "#/components/examples/templatesCollectionErrResp"
    post:
      tags:
      - Template
      summary: Create a new template
      description: Creates a new template
      operationId: createTemplate
      requestBody:
        content:
          application/vnd.sas.template+json:
            schema:
              $ref: "#/components/schemas/template"
            examples:
              templateSampleBody:
                $ref: "#/components/examples/templateSampleBody"
              templateTextPartsSampleBody:
                $ref: "#/components/examples/templateTextPartsSampleBody"
          application/json:
            schema:
              $ref: "#/components/schemas/template"
            examples:
              templateSampleBody:
                $ref: "#/components/examples/templateSampleBody"
              templateTextPartsSampleBody:
                $ref: "#/components/examples/templateTextPartsSampleBody"
        description: application/vnd.sas.template+json
        required: true
      responses:
        "201":
          description: New template created
          headers:
            Location:
              description: The URI of the newly created template.
              schema:
                type: string
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this template.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/templateRep"
              examples:
                createTemplateResponse:
                  $ref: "#/components/examples/createSampleResponse"
                createTextPartsTemplateResponse:
                  $ref: "#/components/examples/createTextPartsSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/templateRep"
              examples:
                createTemplateResponse:
                  $ref: "#/components/examples/createSampleResponse"
                createTextPartsTemplateResponse:
                  $ref: "#/components/examples/createTextPartsSampleResponse"
        "400":
          description: Bad request (the request is not well formed).
          content:
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatesBadRequestErrorResponse:
                  $ref: "#/components/examples/templatesBadRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatesBadRequestErrorResponse:
                  $ref: "#/components/examples/templatesBadRequestErrorResponse"
        "409":
          description: Conflict, the template already exists.
          content:
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatesDuplicatesErrorResponse:
                  $ref: "#/components/examples/templatesDuplicatesErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatesDuplicatesErrorResponse:
                  $ref: "#/components/examples/templatesDuplicatesErrorResponse"
    patch:
      tags:
      - Template
      summary: Patch template using template bootstrapper
      description: Patch operation works with template bootstrapper to load patch
        file.  The patch file has instructions to check for existence of template,
        existence of template with certain field values, and then add, update or delete
        these templates. The patch file can specify add, delete, replace a template.  The
        template when adding can also specify a unique ID to use.
      operationId: patchTemplate
      parameters:
      - name: If-Match
        in: header
        description: The ETag that was returned from a GET, POST, or PUT of this template.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the lastModified date of the template. If the template
          has been updated since this time, the update fails.
        schema:
          type: string
      requestBody:
        content:
          application/json-patch:
            schema:
              $ref: "#/components/schemas/jsonPatchCollection"
            examples:
              patchAddSampleBody:
                $ref: "#/components/examples/patchSampleBody"
          application/json:
            schema:
              $ref: "#/components/schemas/jsonPatchCollection"
            examples:
              patchAddSampleBody:
                $ref: "#/components/examples/patchSampleBody"
        description: List of patch transactions to create, replace and remove
        required: true
      responses:
        "200":
          description: Template successful patched.
        "400":
          description: Badly formatted patch file, or request in patch file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatesBadPatchRequestErrorResponse:
                  $ref: "#/components/examples/templatesBadPatchRequestErrorResponse"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resource's last modified timestamp.
          content:
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatePreConditionFailedErrorResponse:
                  $ref: "#/components/examples/templatePreConditionFailedErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatePreConditionFailedErrorResponse:
                  $ref: "#/components/examples/templatePreConditionFailedErrorResponse"
  /templates/{templateId}:
    get:
      tags:
      - Template
      summary: Get template information for specified template
      description: Returns the specified template.
      operationId: getTemplate
      parameters:
      - name: templateId
        in: path
        description: Template Id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Returns the template
          headers:
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this folder.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/templateRep"
              examples:
                templateSampleResponse:
                  $ref: "#/components/examples/getTemplateSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/templateRep"
              examples:
                templateSampleResponse:
                  $ref: "#/components/examples/getTemplateSampleResponse"
        "404":
          description: Template does not exist
          content:
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templateNotfoundErrorResponse:
                  $ref: "#/components/examples/templateNotfoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templateNotfoundErrorResponse:
                  $ref: "#/components/examples/templateNotfoundErrorResponse"
    delete:
      tags:
      - Template
      summary: Delete template
      description: The specified template is deleted.
      operationId: deleteTemplate
      parameters:
      - name: templateId
        in: path
        description: Template Id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Template is deleted
        "404":
          description: Template does not exist
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templateNotfoundErrorResponse:
                  $ref: "#/components/examples/templateNotfoundErrorResponse"
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templateNotfoundErrorResponse:
                  $ref: "#/components/examples/templateNotfoundErrorResponse"
    put:
      tags:
      - Template
      summary: Update template details
      description: Updates an existing template.
      operationId: updateTemplate
      parameters:
      - name: templateId
        in: path
        description: Template Id
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The ETag that was returned from a GET, POST, or PUT of this template.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the lastModified date of the template. If the template
          has been updated since this time, the update fails.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.template+json:
            schema:
              $ref: "#/components/schemas/template"
            examples:
              updateSampleBody:
                $ref: "#/components/examples/updateSampleBody"
          application/json:
            schema:
              $ref: "#/components/schemas/template"
            examples:
              updateSampleBody:
                $ref: "#/components/examples/updateSampleBody"
        description: application/vnd.sas.template+json
        required: true
      responses:
        "200":
          description: Template Updated
          headers:
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this folder.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/template"
              examples:
                updateSampleResponse:
                  $ref: "#/components/examples/updateSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/template"
              examples:
                updateSampleResponse:
                  $ref: "#/components/examples/updateSampleResponse"
        "400":
          description: Bad request (the request is not well formed).
          content:
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatesBadRequestErrorResponse:
                  $ref: "#/components/examples/templatesBadRequestErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatesBadRequestErrorResponse:
                  $ref: "#/components/examples/templatesBadRequestErrorResponse"
        "404":
          description: Template does not exist
          content:
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templateNotfoundErrorResponse:
                  $ref: "#/components/examples/templateNotfoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templateNotfoundErrorResponse:
                  $ref: "#/components/examples/templateNotfoundErrorResponse"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resource's last modified timestamp.
          content:
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatePreConditionFailedErrorResponse:
                  $ref: "#/components/examples/templatePreConditionFailedErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatePreConditionFailedErrorResponse:
                  $ref: "#/components/examples/templatePreConditionFailedErrorResponse"
  /rendering/{templateName}:
    post:
      tags:
      - Template
      summary: Render template
      description: Render template. Uses the template name along with the Accept and
        Accept-Language Request headers to find the unique template definition. Use
        vnd.sas.properties body to pass merged variables to apply to the template
        and result will be an html, or text document. The returned document would
        be merged/created and produce a html or text document.
      operationId: renderTemplate
      parameters:
      - name: templateName
        in: path
        description: Template name
        required: true
        schema:
          type: string
          format: templateName
      - in: header
        name: Accept
        description: Indicates which content types, expressed as MIME types, the client
          is able to understand
        schema:
          type: string
      - in: header
        name: Accept-Language
        description: Language the template is requested for
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.properties+json:
            schema:
              $ref: "#/components/schemas/properties"
            examples:
              renderSampleBody:
                $ref: "#/components/examples/renderSampleBody"
              renderFrenchSampleBody:
                $ref: "#/components/examples/renderFrenchSampleBody"
          application/json:
            schema:
              $ref: "#/components/schemas/properties"
            examples:
              renderSampleBody:
                $ref: "#/components/examples/renderSampleBody"
              renderFrenchSampleBody:
                $ref: "#/components/examples/renderFrenchSampleBody"
        description: List of keys and values for replacement
        required: true
      responses:
        "200":
          description: Template successful in merging variables, and template is rendered.
          content:
            text/html:
              schema:
                type: string
              examples:
                renderSampleResponse:
                  $ref: "#/components/examples/renderSampleResponse"
                renderFrenchSampleResponse:
                  $ref: "#/components/examples/renderFrenchSampleResponse"
            text/plain:
              schema:
                type: string
              examples:
                renderSampleResponse:
                  $ref: "#/components/examples/renderSampleResponse"
                renderFrenchSampleResponse:
                  $ref: "#/components/examples/renderFrenchSampleResponse"
        "400":
          description: Badly formatted variables, or request.
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatesBadRequestErrorResponse:
                  $ref: "#/components/examples/templatesBadRequestErrorResponse"
            text/plain:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatesBadRequestErrorResponse:
                  $ref: "#/components/examples/templatesBadRequestErrorResponse"
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templateNotfoundErrorResponse:
                  $ref: "#/components/examples/templateNotfoundErrorResponse"
        "404":
          description: Template does not exist
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templateNotfoundErrorResponse:
                  $ref: "#/components/examples/templateNotfoundErrorResponse"
            text/plain:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templateNotfoundErrorResponse:
                  $ref: "#/components/examples/templateNotfoundErrorResponse"
            application/vnd.sas.template+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templateNotfoundErrorResponse:
                  $ref: "#/components/examples/templateNotfoundErrorResponse"
  /renderingParts/{templateName}:
    post:
      tags:
      - Template
      summary: Render template using templateName, formatType parameter and Accept-Language
        request header to find unique template definition
      description: Render template using templateName, formatType parameter and Accept-Language
        request header to find unique template definition. The template is referenced
        by templateName, formatType and Accept-Language request header. Accept header
        is optional and if specified use application/vnd.sas.template.rendered+json.
        Use vnd.sas.properties body to pass merged variables to apply to the template
        and result will be an application/vnd.sas.template.rendered+json body with
        text properties document. The returned document would be merged/created and
        produce a application/vnd.sas.template.rendered+json document.
      operationId: renderParts
      parameters:
      - name: templateName
        in: path
        description: Template name
        required: true
        schema:
          type: string
          format: templateName
      - name: formatType
        in: query
        description: Template type
        required: true
        schema:
          type: string
          format: templateType
          enum:
          - TEXT
          - HTML
          - SMS
      - in: header
        name: Accept-Language
        description: Language the template is requested for
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.properties+json:
            schema:
              $ref: "#/components/schemas/properties"
            examples:
              renderSampleBody:
                $ref: "#/components/examples/renderSampleBody"
          application/vnd.sas.properties:
            schema:
              $ref: "#/components/schemas/properties"
            examples:
              renderSampleBody:
                $ref: "#/components/examples/renderSampleBody"
          application/json:
            schema:
              $ref: "#/components/schemas/properties"
            examples:
              renderSampleBody:
                $ref: "#/components/examples/renderSampleBody"
        description: List of keys and values for replacement
        required: true
      responses:
        "200":
          description: Template successful in merging variables, and template is rendered.
          content:
            application/vnd.sas.template.rendered+json:
              schema:
                type: string
              examples:
                renderSampleResponse:
                  $ref: "#/components/examples/renderSampleResponse"
        "400":
          description: Badly formatted variables, or request.
          content:
            application/vnd.sas.template.rendered+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templatesBadRequestErrorResponse:
                  $ref: "#/components/examples/templatesBadRequestErrorResponse"
        "404":
          description: Template does not exist
          content:
            application/vnd.sas.template.rendered+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                templateNotfoundErrorResponse:
                  $ref: "#/components/examples/templateNotfoundErrorResponse"
components:
  schemas:
    template:
      title: Template Schema
      description: The template
      properties:
        id:
          type: string
          description: Template id. This field is assigned exclusively by the template
