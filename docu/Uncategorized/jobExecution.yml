      description: Submits jobs using the job-request URIs specified in the body resource
        selection. The request body identifies the job requests to submit. The selection
        type must be URI and the resources must be an array of URIs that identify
        the job requests. The items in the response MUST match 1-to-1 with the items
        in the request. If the job is submitted successfully, the corresponding item
        in the response is an application/vnd.sas.job.execution.job object. If the
        job submission failed, the corresponding item in the response is an application/vnd.sas.error
        object.
