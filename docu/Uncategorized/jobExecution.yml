      summary: Get list of jobs associated with a job request
      description: Returns a collection of application/vnd.sas.job.execution.job resources
        that were submitted using the specified job request. Standard paging, filtering,
        and sorting options are specified in the Query Parameters section.
      tags:
      - JobRequests
      parameters:
