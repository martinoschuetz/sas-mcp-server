          Job and used as the submitter portion of the job state change event routing
          key. Only characters in the set [a-zA-Z0-9] and hyphen are valid with a
          maximum of 64 characters.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.selection+json:
