components:
  schemas:
    jobDefinitionParameter:
      title: Job Definition Parameter Schema
      description: Job definition parameter.
      properties:
        name:
          type: string
          description: The name of the parameter.
          maxLength: 100
        type:
          type: string
          description: The type of the parameter (TABLE, NUMERIC, DATE, CHARACTER).
          maxLength: 20
        label:
          type: string
          description: The display value for the name of this parameter.
          maxLength: 250
        required:
          type: boolean
          description: Specifies if the parameter is required for execution.
        defaultValue:
          type: string
          description: The default value for this parameter, if one is not specified
            at execution time.
        version:
          type: integer
          description: The version number of the representation. The current version
            is 1.
    jobDefinition:
      title: Job Definition Schema
      description: The job definition.
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the job that is generated by the
            API.
        name:
          type: string
          description: The name of the job.
          maxLength: 255
        description:
          type: string
          description: The description of the job.
          maxLength: 1000
        type:
          type: string
          description: The type of job. This property determines the execution provider
            that executes this job.
          maxLength: 250
        code:
          type: string
          description: Execution-provider-specific code to be executed.
        parameters:
          type: array
          description: An array of input parameters to be collected when executing
            this job definition
          items:
            $ref: "#/components/schemas/jobDefinitionParameter"
        properties:
          type: array
          description: An array of name-value pairs required to execute a job definition
            The maximum name length is 100.
          items:
            $ref: "#/components/schemas/resourceProperty"
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job was created. It uses the format
            `YYYY-MM-DDThh:mm:ss.sssZ`.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job was last modified. It uses the format
            `YYYY-MM-DDThh:mm:ss.sssZ`.
        createdBy:
          type: string
          description: The name of the user who created the job.
        modifiedBy:
          type: string
          description: The name of the last user who modified this object.
        links:
          type: array
          description: Links that apply to this object. Includes "self" and "alternate".
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the representation. The current version
            is 2.
    jobRequest:
      title: Job Request Schema
      description: The job request represents a request to execute a job based on
        a job definition. It specifies the arguments and properties needed for execution.
        For more information about arguments for the Compute provider, see <a href="https://documentation.sas.com/?cdcId=sasadmincdc&cdcVersion=default&docsetId=caljobs&docsetTarget=request-definition.htm#p0kr6cf7jvr9z1n1ge5wlb9jt4gr">Compute
        Provider Arguments for Use with Job Requests</a>.
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the job request. This is only required
            for a persisted job request.
        name:
          type: string
          description: The name of the job request. If empty, the name of the job
            definition will be used for a job request that is embedded in the 'application/vnd.sas.job.execution.job'
            media type.
        description:
          type: string
          description: The description of the job request.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job request was created. It uses the
            format `YYYY-MM-DDThh:mm:ss.sssZ`. This is set only on a persisted job
            request.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job request was last modified. It uses
            the format `YYYY-MM-DDThh:mm:ss.sssZ`. This is set only on a persisted
            job request.
        createdBy:
          type: string
          description: The name of the user who created the job request. This is set
            only on a persisted job request.
        modifiedBy:
          type: string
          description: The name of the last user who modified this object. This is
            set only on a persisted job request
        jobDefinitionUri:
          type: string
          description: The URI of the job definition that is to be executed. Either
            the jobDefinitionUri or the jobDefinition property must be set in a job
            request submitted to Job Execution service for execution.
        jobDefinition:
          $ref: "#/components/schemas/jobDefinition"
        expiresAfter:
          type: string
          description: The duration of time (in W3C XML duration format) after the
            completion of the job when the job must be deleted by the Job Execution
            service. If a value is specified for this property, it overrides any value
            specified by the provider's /commons/settings endpoint for the job request.  For
            a job request that is embedded in the `application/vnd.sas.job.execution.job`
            media type, if a value is not already set for the "expiresAfter" property,
            the value is set by the Job Execution Service to either the provider's
            value or the global "expiresAfter" value in sas.job.execution configuration,
            if one exists.
        arguments:
          type: object
          description: The values of the arguments are name-value pairs specified
            as a map of string keys and values. Values can be supplied for parameters
            not defined in the job definition. The maximum name length is 100. <p>
            Hibernate does not persist a map entry with a null value. Therefore, a
            persisted Job Request does not contain such entries. <p> For a job request
            that is embedded in the 'application/vnd.sas.job.execution.job' media
            type, this value is set by the Job Execution service and contains the
            complete set of arguments to use in the execution by the provider. Arguments
            that already exist in the original job request are left unchanged. If
            there are arguments in the job definition that do not exist in the original
            job request arguments map, those arguments and any default values, including
            null values, are added to the arguments map. However, because the Job
            object is persisted before being sent to the provider, no entries for
            such null-value arguments in the Job are sent to the provider (because
            of the Hibernate behavior of not persisting map/collection entries with
            null values). The Job Execution service also guarantees that any required
            argument has an associated non-null value.
          additionalProperties:
            type: string
        properties:
          type: array
          description: The value of properties are name-value pairs specified as a
            map of string keys and values. The maximum name length is 100.
          items:
            $ref: "#/components/schemas/resourceProperty"
        createdByApplication:
          type: string
          description: The application that created the job request. The value is
            typically from the `spring.application.name` property. The value is used
            as the "creator" in the routing key of the Job State Change events, and
            if it is not present in the job request the value "jobExecution" is used.
            Valid characters are [a-zA-Z0-9] and the hyphen.
          maxLength: 64
        links:
          type: array
          description: Links that apply to this object. Includes "self", "alternate",
            "export", "delete", "update", "import", "up", "jobs" and "submitJob".
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the representation. The current version
            is 3.
    job:
      title: Execution Job Schema
      description: The execution job.
      properties:
        id:
          type: string
          description: The unique identifier that is generated by the API.
        state:
          type: string
          description: The current state of the job.
          enum:
          - pending
          - running
          - canceled
          - completed
          - failed
          - timedOut
        stateDetails:
          type: string
          description: Details that supplement the "state" by providing a hint that
            additional information is available. It is a hint and not the actual information.
            The purpose of this field is for providers to provide a hint, where applicable,
            about the state set and for that hint to be used by components which convey
            state information to clients. It must be set in conjunction with "state".
        results:
          type: object
          description: The output of the job execution as a map of string keys and
            values.
          additionalProperties:
            type: string
        error:
          $ref: "#/components/schemas/error2"
        jobRequest:
          $ref: "#/components/schemas/jobRequest"
        heartbeatInterval:
          type: integer
          format: int32
          description: The interval in seconds that the heartbeatTimeStamp is updated
            by the provider before the job times out. This is 0 if there is no heartbeat.
        heartbeatTimeStamp:
          type: string
          format: date-time
          description: The timestamp identifying when the last heartbeat was received.
            It uses the format `YYYY-MM-DDThh:mm:ss.sssZ`.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp identifying when the job was created. It uses
            the format `YYYY-MM-DDThh:mm:ss.sssZ`.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp identifying when the job was last modified. It
            uses the format `YYYY-MM-DDThh:mm:ss.sssZ`.
        endTimeStamp:
          type: string
          format: date-time
          description: The timestamp identifying when the job state changed to completed
            or failed. It uses the format `YYYY-MM-DDThh:mm:ss.sssZ`.
        elapsedTime:
          type: number
          description: If the job has ended, the value is the difference between the
            endTimeStamp and the creationTimeStamp. If the job has not ended, the
            value is the difference between the time that this representation was
            created and the creationTimeStamp. The units are in milliseconds. A value
            of -1 is returned if a value is not set for the creationTimeStamp.
        logLocation:
          type: string
          description: The URI for the log, if one exists. The provider might provide
            additional information.
        expirationTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the job expired and is deleted by the Job
            Execution service. It uses the format `YYYY-MM-DDThh:mm:ss.sssZ`. This
            is set by the service after the job has completed based on the value of
            the `expiresAfter` member of the job request.
        createdBy:
          type: string
          description: The name of the user who created or submitted the job.
        modifiedBy:
          type: string
          description: The name of the last user who modified this object.
        submittedByApplication:
          type: string
          description: Value of the query parameter "submitter" on the `POST` endpoints
            to submit a job. If the query parameter is not present, the createdByApplication
            value from the embedded JobRequest is used. The createdByApplication value
            in the embedded JobRequest that is used is the same as what was in the
            submitted job request if one was present. If it is not present, the value
            "jobExecution" is used. The submittedByApplication value is used as the
            "submitter" in the routing routing key of Job State Change events. Only
            characters in the set [a-zA-Z0-9] and hyphen are valid for submitter.
          maxLength: 64
        links:
          type: array
          description: Links that apply to this object. Includes "self", "state",
            "update", "delete", "updateState", "updateHeartbeatTimeStamp", "jobRequest"
            and "log".
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the representation. The current version
            is 4.
    jobRequestCollection:
      title: Job Request Collection
      type: object
      description: A page-able collection of job-request resources.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array containing job-request resources.
            items:
              $ref: "#/components/schemas/jobRequest"
    jobCollection:
      title: Job Collection
      type: object
      description: A page-able collection of job objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains job resources.
            items:
              $ref: "#/components/schemas/job"
    resourceProperty:
      title: Resource Property
      type: object
      description: A simple name-value pair.
      properties:
        name:
          type: string
          description: The name.
        value:
          type: string
          description: The value.
    providerSummary:
      title: Provider Summary
      type: object
      description: Summary information about a provider.
      properties:
        id:
          type: string
          description: The unique provider identifier.
        version:
          type: integer
          description: The version of the provider schema.
        links:
          type: array
          description: The links that apply to this resource.
          items:
            $ref: "#/components/schemas/link"
    provider:
      title: Provider
      type: object
      description: Summary information about a provider.
      properties:
        id:
          type: string
          description: The unique provider identifier.
        version:
          type: integer
          description: The version of the provider schema.
        heartbeatInterval:
          type: integer
          format: int32
          description: The interval (in seconds) that the heartbeatTimeStamp is updated
            by the provider before the job times out. This is 0 if there is no heartbeat.
        expiresAfter:
          type: string
          description: 'The duration of time (in <a href="https://www.w3.org/TR/xmlschema-2/#duration"
            target="_blank">W3C XML duration format</a>) after the job is complete
            when the job must be deleted by the job execution API. For example, to
            indicate that the job expires after 30 days, write: `P30D`.'
        links:
          type: array
          description: The links that apply to this resource.
          items:
            $ref: "#/components/schemas/link"
    providerSummaryCollection:
      type: object
      description: A page-able collection of provider resources.
      title: Provider Summary Collection
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array containing provider resources.
            items:
              $ref: "#/components/schemas/providerSummary"
    jobSubmitCollection:
      title: Collection of Job Objects and Possible Error Objects
      description: A collection of job or error objects. When submitting multiple
        jobs, the items in the response MUST match 1-to-1 with the items in the request.
        The corresponding item is either a job object or an error object.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Job objects and error objects.
            items:
              $ref: "#/components/schemas/jobOrError"
    jobOrError:
      title: Job or Error Object
      description: A job object or error object.
      oneOf:
      - $ref: "#/components/schemas/job"
      - $ref: "#/components/schemas/error2"
    updateJobsStateCollection:
      title: Collection of Resource Summary and Possible Error Objects
      description: A collection of resource summary or error objects. When updating
        the state of multiple jobs, the items in the response MUST match 1-to-1 with
        the items in the request. The corresponding item is either a resource summary
        object or an error object.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Resource summary objects and error objects.
            items:
              $ref: "#/components/schemas/resourceSummaryOrError"
    resourceSummaryOrError:
      title: Resource Summary or Error Object
      description: A resource summary object or error object.
      oneOf:
      - $ref: "#/components/schemas/resourceSummary"
      - $ref: "#/components/schemas/error2"
    resourceSummary:
      title: Resource Summary Schema
      description: The resource summary object.
      type: object
      properties:
        name:
          type: string
          description: The name of the resource.
        id:
          type: string
          description: The ID of the resource.
        type:
          type: string
          description: The resource type.
        description:
          type: string
          description: The resource description.
        typeDefName:
          type: string
          description: The name of the TypeDef.
        iconUri:
          type: string
          description: The icon URI.
        links:
          type: array
          description: Paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version of the resource summary schema. This is version
            2.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the `application/vnd.sas.collection`
        media type (version 2).
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated, indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header can be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    resourceSelection:
      title: Resource Selection
      type: object
      description: The representation of a selection of zero or more resources.
      required:
      - version
      - resources
      x-sas-media-type:
        name: application/vnd.sas.selection+json
        version: 1
      properties:
        name:
          type: string
          description: The ID of the selection.
        type:
          type: string
          description: Specifies whether the resources array contains IDs, URIs, or
            both. If \"id\", the array contains resource identifiers only. This is
            the default if \"type\" is omitted. If \"uri\", the array contains resource
            URIs.  If \"mixed\", the array contains a mixture of identifiers and URIs.
          enum:
          - id
          - uri
          - mixed
        template:
          type: string
          description: A URI template in which the {id} parameter can be replaced
            with a value from the \"resources\" array in order to yield the URI of
            the identified resource.
          format: uri
        resources:
          type: array
          description: The selected resources as an array of resource IDs or URIs.
          items:
            type: string
        links:
          type: array
          description: The links that apply to the selection.
          items:
            $ref: "#/components/schemas/link"
        version:
          description: The schema version number of this media type. This representation
            is version 1.
          type: integer
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            3.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
  examples:
    rootSampleResponse:
      summary: Root response
      description: This is an example response when using `GET` on the root resource.
      value: {"version": 1, "links": [{"method": "GET", "rel": "jobs", "href": "/jobExecution/jobs",
            "uri": "/jobExecution/jobs", "type": "application/vnd.sas.collection",
            "itemType": "application/vnd.sas.job.execution.job", "responseItemType": "application/vnd.sas.job.execution.job"},
          {"method": "POST", "rel": "create", "href": "/jobExecution/jobs", "uri": "/jobExecution/jobs",
            "type": "application/vnd.sas.job.execution.job.request", "responseType": "application/vnd.sas.job.execution.job"},
          {"method": "GET", "rel": "jobRequests", "href": "/jobExecution/jobRequests",
            "uri": "/jobExecution/jobRequests", "type": "application/vnd.sas.collection",
            "itemType": "application/vnd.sas.job.execution.job.request"}]}
    updateJobRequestSampleBody:
      summary: Body to update an existing Job Request
      description: This is an example body to update a job request.
      value: {"id": "{{JOBREQID}}", "name": "sashelp.class distribution", "description": "ods\
          \ output with age 14 cutoff", "jobDefinitionUri": "/jobDefinitions/definitions/dabd2a63-ae2f-4559-b110-ad989ff642a5",
        "arguments": {"AGE": "14"}}
    updateJobRequestSampleResponse:
      summary: Update Job Request response
      description: This is an example response when using `PUT` to update a job request.
      value: {"creationTimeStamp": "2018-03-12T19:37:28.318Z", "modifiedTimeStamp": "2018-03-12T19:51:07.178Z",
        "createdBy": "user1", "modifiedBy": "user1", "version": 3, "id": "f9c52f58-9639-45ae-b24c-23cfff0b2f5b",
        "name": "sashelp.class distribution", "description": "ods output with age\
          \ 14 cutoff", "jobDefinitionUri": "/jobDefinitions/definitions/dabd2a63-ae2f-4559-b110-ad989ff642a5",
        "arguments": {"_contextName": "SAS Job Execution compute context", "AGE": "14"},
        "properties": [], "links": [{"method": "GET", "rel": "self", "href": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b",
            "uri": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b",
            "type": "application/vnd.sas.job.execution.job.request"}, {"method": "GET",
            "rel": "export", "href": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b",
            "uri": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b",
            "type": "application/vnd.sas.transfer.object"}, {"method": "DELETE", "rel": "delete",
            "href": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b",
            "uri": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b"},
          {"method": "PUT", "rel": "update", "href": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b",
            "uri": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b",
            "type": "application/vnd.sas.job.execution.job.request"}, {"method": "PUT",
            "rel": "import", "href": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b",
            "uri": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b",
            "type": "application/vnd.sas.transfer.object", "responseType": "application/vnd.sas.summary"},
          {"method": "GET", "rel": "up", "href": "/jobExecution/jobRequests", "uri": "/jobExecution/jobRequests",
            "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.job.execution.job.request"},
          {"method": "GET", "rel": "jobs", "href": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b/jobs",
            "uri": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b/jobs",
            "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.job.execution.job"},
          {"method": "POST", "rel": "submitJob", "href": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b/jobs",
            "uri": "/jobExecution/jobRequests/f9c52f58-9639-45ae-b24c-23cfff0b2f5b/jobs",
            "responseType": "application/vnd.sas.job.execution.job"}]}
    createJobRequestEmbeddedSampleBody:
      summary: Body to create a Job Request with an embedded Job Definition
      description: This is an example body to create a job request using an embedded
        Job Definition.
      value: {"name": "PROC PRINT", "description": "ods output", "jobDefinition": {
          "version": 1, "name": "Simple PROC PRINT", "type": "Compute", "parameters": [
            {"version": 1, "name": "_contextName", "defaultValue": "SAS Job Execution\
                \ compute context", "type": "CHARACTER", "label": "Context Name",
              "required": false}], "code": "ods html style=HTMLBlue;\nproc print data=sashelp.class;\
            \ run; quit;\nods html close;"}}
    createJobRequestSampleBody:
      summary: Body to create a Job Request
      description: This is an example body to create a job request.
      value: {"name": "sashelp class distribution", "description": "ods output with\
          \ age 14 cutoff", "jobDefinitionUri": "/jobDefinitions/definitions/dabd2a63-ae2f-4559-b110-ad989ff642a5",
        "arguments": {"AGE": "14"}, "createdByApplication": "jobrequestui"}
    createJobRequestSampleResponse:
      summary: Create job request response
      description: This is an example response when using `POST` to create a job request.
