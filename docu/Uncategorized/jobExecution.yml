          \ <ul> <li>Sort ascending by name: /jobExecution/jobRequests?sortBy=name:ascending</li>\
          \ <li>Sort descending by name: /jobExecution/jobRequests?sortBy=name:descending</li>\
          \ </ul> The default sort is by name in ascending order."
