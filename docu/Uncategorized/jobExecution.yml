        schema:
          type: string
      - name: start
        in: query
        description: The zero-based index of the first job to return. The default
          is 0 (zero).
        schema:
          type: integer
      - name: limit
        in: query
        description: Represents the maximum number of jobs to return in this page
          of results. The actual number of returned jobs might be less if the collection
          has been exhausted. The default is 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned jobs. The following queries are\
          \ examples: <ul> <li>Filter by name: /jobExecution/jobRequests/{jobRequestId}/jobs?filter=startsWith(name,'myJob')</li>\
          \ <li>Filter by createdBy: /jobExecution/jobRequests/{jobRequestId}/jobs?filter=eq(createdBy,\
          \ 'myUserId')</li> </ul> Direct comparisons on values of `results` and `jobRequest.properties`\
          \ are not guaranteed to work across all platforms. Use the `contains` function\
          \ instead."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "Specifies how to sort the returned jobs. The default sort order\
          \ is descending on the creationTimeStamp field. The following sorts are\
          \ examples: <ul> <li>Sort ascending by ID: /jobExecution/jobRequests/{jobRequestId}/jobs?sortBy=id:ascending</li>\
          \ <li>Sort descending by ID: /jobExecution/jobRequests/{jobRequestId}/jobs?sortBy=id:descending</li>\
          \ </ul>"
        schema:
          type: string
          format: sort-criteria
      - name: Delegate-Domain
        in: header
        description: >
          The name of a credential domain of type OAuth2.0. The credential secret
          is retrieved to impersonate a group-managed service account
