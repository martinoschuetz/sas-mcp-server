---
openapi: 3.0.3
info:
  version: "7"
  title: Job Execution
  description: The Job Execution API is used to execute and manage asynchronous jobs
    across environments.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/jobExecution
  description: Kubernetes mock server
tags:
- name: Root
  description: Contains the root of the Job Execution API.
- name: Jobs
  description: Contains the operations for the Jobs resource.
- name: JobRequests
  description: Contains the operations for the Job Requests resource.
- name: Providers
  description: Contains the operations for the Providers resource.
paths:
  /:
    get:
      operationId: root
      summary: Get a collection of top-level links
      description: Returns a collection of links to the top-level collections surfaced
        through this API.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootSampleResponse"
    head:
      operationId: headersForRoot
      summary: Check API availability
      description: Returns the header information that the corresponding GET returns.
        Clients can use this to determine whether the API is running.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded. The API is running and available.
  /jobs:
    post:
      operationId: createJob
      summary: Submit a job request
      description: Submits a job request.
      tags:
      - Jobs
      parameters:
      - name: annotationUri
        in: query
        required: false
        description: Adds the created job as a member of the specified annotation.
        schema:
          type: string
      - name: submitter
        in: query
        required: false
        description: Persisted in the submittedByApplication member of the created
          Job and used as the submitter portion of the job state change event routing
          key.  Only the characters in the set [a-zA-Z0-9] and hyphens are valid with
          a maximum of 64 characters.
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          The name of a credential domain of type OAuth2.0. The credential secret
          is retrieved to impersonate a group-managed service account
          for the current request.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.job.execution.job.request+json:
            schema:
              $ref: "#/components/schemas/jobRequest"
            examples:
              json:
                $ref: "#/components/examples/submitJobSampleBody"
          application/json:
            schema:
              $ref: "#/components/schemas/jobRequest"
            examples:
              json:
                $ref: "#/components/examples/submitJobSampleBody"
        description: The job request that describes the job to be executed.
        required: true
      responses:
        "201":
          description: The job was created.
          headers:
            ETag:
              description: The entity tag for the job.
              schema:
                type: string
            Last-Modified:
              description: The timestamp that indicates when the job was last modified.
                It uses the format in `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
            Location:
              description: The URL location of the newly created job.
              schema:
                type: string
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/submitJobSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/submitJobSampleResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/submitJobRequest400Response"
        "415":
          description: The requested media type is not supported.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/submitJobRequest415Response"
    get:
      operationId: getJobs
      summary: Get a list of jobs
      description: Returns a collection of job resources. Standard paging, filtering,
        and sorting options are specified in the Query Parameters section.
      tags:
      - Jobs
      parameters:
      - name: start
        in: query
        description: The zero-based index of the first job to return. The default
          is 0 (zero).
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of jobs to return in this page of results.
          The actual number of returned jobs might be less if the collection has been
          exhausted. The default is 10. If a large number is specified, it is recommended
          to combine a filter with the query to improve performance.
        schema:
          type: integer
      - name: filter
        in: query
        description: "The criteria used to filter the returned jobs. The following\
          \ queries are examples: <ul> <li>Filter by name: /jobExecution/jobs?filter=startsWith(id,\
          \ 'myJob')</li> <li>Filter by job request ID: /jobExecution/jobs?filter=eq(jobRequest.id,\
          \ 'ec0292d8-884d-47c4-860c-52a774e55786')</li> </ul> Direct comparisons\
          \ on values of `results` and `jobRequest.properties` are not guaranteed\
          \ to work across all platforms. Use the `contains` function instead."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "Defines how the returned jobs are sorted. The default sort order\
          \ is descending on the creation timestamp field. The following sorts are\
          \ examples: <ul> <li>Sort ascending by ID: /jobExecution/jobs?sortBy=id:ascending</li>\
          \ <li>Sort descending by ID: /jobExecution/jobs?sortBy=id:descending</li>\
          \ </ul>"
        schema:
          type: string
          format: sort-criteria
      - name: Delegate-Domain
        in: header
        description: >
          The name of a credential domain of type OAuth2.0. The credential secret
          is retrieved to impersonate a group-managed service account
          for the current request.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/jobCollection"
              examples:
                json:
                  $ref: "#/components/examples/getJobsSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/jobCollection"
              examples:
                json:
                  $ref: "#/components/examples/getJobsSampleResponse"
        "400":
          description: The request was invalid. An invalid filter or combination of
            request parameters was provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getJobs400Response"
  /jobs#withQuery:
    post:
      x-sas-since: "2"
      operationId: getJobsWithQuery
      summary: Get all jobs
      description: Returns all jobs by using a filter in the body of the request.
        This is intended for large filters that are too long to be used as a query
        parameter. Standard paging, filtering, and sorting options are specified in
        the Query Parameters and Request Body sections.
      tags:
      - Jobs
      parameters:
      - name: start
        in: query
        description: The zero-based index of the first job to return. The default
          is 0 (zero).
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of jobs to return in this page of results.
          The actual number of returned jobs might be less if the collection has been
          exhausted. The default is 10.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: "Defines how the returned jobs are sorted. The default sort order\
          \ is descending on the creation timestamp field. The following sorts are\
          \ examples: <ul> <li>Sort ascending by ID: /jobExecution/jobs?sortBy=id:ascending</li>\
          \ <li>Sort descending by ID: /jobExecution/jobs?sortBy=id:descending</li>\
          \ </ul>"
        schema:
          type: string
          format: sort-criteria
      - name: Delegate-Domain
        in: header
        description: >
          The name of a credential domain of type OAuth2.0. The credential secret
          is retrieved to impersonate a group-managed service account
          for the current request.
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              type: string
            example: "eq(name, 'jobName')"
        description: "The criteria for filtering the returned jobs. See the [Filtering\
          \ section](https://developer.sas.com/rest-apis/jobExecution-v7/docs/getting-started/usage-notes#filtering)\
          \ for more information about how to construct a request. The following request\
          \ bodies are examples: <ul> <li>Filter by name: startsWith(name, 'myJob')</li>\
          \ <li>Filter by createdBy: eq(createdBy,'myUserId')</li> </ul> Direct comparisons\
          \ on values of `results` and `jobRequest.properties` are not guaranteed\
          \ to work across all platforms. Use the `contains` function instead."
      responses:
        "200":
          description: The request succeeded. The jobs (if any) are returned in a
            resource collection.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/jobCollection"
              examples:
                json:
                  $ref: "#/components/examples/getJobsSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/jobCollection"
              examples:
                json:
                  $ref: "#/components/examples/getJobsSampleResponse"
        "400":
          description: >
            The request was invalid. An invalid request occurs in the following
            scenarios: <ul> <li>A negative start value is provided.</li> <li>A
            negative limit value is provided.</li> <li>An unsupported field is
            specified in the sortBy parameter.</li> </ul>
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getJobs400Response"
  /jobs/@selection/state:
    put:
      operationId: updateJobsState
      summary: Update the state of multiple jobs
      description: Updates the state of multiple jobs. The new state must be set as
        the value-query parameter. The request body identifies the jobs to update.
        The selection type must be URI and the resources are an array of URIs that
        identify the jobs. The items in the response MUST match 1-to-1 with the items
        in the request. If the update is successful, the item in the response is an
        application/vnd.sas.summary object. If the update failed for a particular
        job, the corresponding item in the response is an application/vnd.sas.error
        object.
      tags:
      - Jobs
      parameters:
      - name: value
        in: query
        description: The value of the state.
        required: false
        x-sas-since: "2"
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.selection+json:
            schema:
              $ref: "#/components/schemas/resourceSelection"
            examples:
              json:
                $ref: "#/components/examples/stateResourceSelectionSampleBody"
        description: The resource-selection URIs that identify the jobs whose states
          must be updated.
      responses:
        "200":
          description: The request succeeded. The items in the response MUST match
            1-to-1 with the items in the request. If the update is successful, the
            item in the response is an application/vnd.sas.summary object. If the
            update failed for a particular job, the corresponding item in the response
            is an application/vnd.sas.error object.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/updateJobsStateCollection"
              examples:
                json:
                  $ref: "#/components/examples/updateJobsStateSampleResponse"
        "400":
          description: >
            The request was invalid. An invalid request occurs in the following
            scenarios: <ul> <li>An invalid state value was provided (error code
            31506).</li> <li>The state was not specified in the value-query
            parameter or in the body of the request (error code 31505). </li>
            <li>An empty or missing body.</li><li>An invalid resource-selection
            type in the body. The supported type is URI.<li>
            </ul>
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/stateResourceSelection400Response"
  "/jobs/{jobId}":
    get:
      operationId: getJob
      summary: Get a job
      description: Returns information about one job based on its unique ID. After
        the job execution has completed, various execution artifacts can be obtained
        from the `results` member of the returned job (application/vnd.sas.job.execution.job).
        The items returned in the `results` map are provider specific. A log, if available,
        can be obtained from the `logLocation` member of the job.
      tags:
      - Jobs
      parameters:
      - name: jobId
        in: path
        description: The ID of job.
        required: true
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          The name of a credential domain of type OAuth2.0. The credential secret
          is retrieved to impersonate a group-managed service account
          for the current request.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the job.
              schema:
                type: string
            Last-Modified:
              description: The timestamp for the job request that indicates when it
                was last modified. It uses the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/getJobSampleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/getJobSampleResponse"
        "404":
          description: No job exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/getJob404Response"
    head:
      operationId: headersForJob
      summary: Check job availability
      description: Returns the headers for the job that the corresponding `GET` returns.
        Clients can use this operation to determine whether the job exists.
      tags:
      - Jobs
      parameters:
      - name: jobId
        in: path
        description: The ID of the job.
        required: true
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          The name of a credential domain of type OAuth2.0. The credential secret
          is retrieved to impersonate a group-managed service account
          for the current request.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the job.
              schema:
                type: string
            Last-Modified:
              description: The timestamp for the job request that indicates when it
                was last modified. It uses the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
        "404":
          description: No job exists at the requested path.
    put:
      operationId: updateJob
      summary: Update or replace an existing job
      description: "Updates or replaces the specified job. <b>Note</b>: Only execution\
        \ providers can use this operation."
      tags:
      - Jobs
      parameters:
      - name: jobId
        in: path
        description: The ID of the job.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header of this job. It must match the current entity tag for the job.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: Ignored when `If-Match` is specified. The timestamp obtained
          from the most recent `Last-Modified` response header of this job. It must
          be later than or equal to the timestamp when the job was last modified.
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          The name of a credential domain of type OAuth2.0. The credential secret
          is retrieved to impersonate a group-managed service account
          for the current request.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.job.execution.job+json:
            schema:
              $ref: "#/components/schemas/job"
            examples:
              json:
                $ref: "#/components/examples/putJobSampleBody"
          application/json:
            schema:
              $ref: "#/components/schemas/job"
            examples:
              json:
                $ref: "#/components/examples/putJobSampleBody"
        description: The new job values.
        required: true
      responses:
        "200":
          description: The request succeeded. The job updated successfully.
          headers:
            ETag:
              description: The entity tag for the job.
              schema:
                type: string
            Last-Modified:
              description: The timestamp for the job request that indicates when it
                was last modified. It uses the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/putJobResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/putJobResponse"
        "400":
          description: The request was invalid. This occurs when the user provides
            an ID in the request that does not match the ID in the path of the URL.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob400Response"
        "404":
          description: No job exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob404Response"
        "405":
          description: The request could not be completed due to a conflict with the
            current state of the resource. The job has already completed and can no
            longer be updated (error code 31501).
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob405Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob405Response"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag or the `If-Unmodified-Since` request header was earlier than
            the resource's last modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob412Response"
            application/vndjson:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob412Response"
        "415":
          description: The requested media type is not supported.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob415Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob415Response"
        "428":
          description: The request was missing a `If-Match` or `If-Unmodified-Since`
            header.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob428Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/putJob428Response"
    delete:
      operationId: deleteJob
      summary: Delete a job
      description: Deletes the job, if the job is no longer required. If the Job Request
        (application/vnd.sas.job.execution.job.request) is submitted without an "expiresAfter"
        setting, or a global or provider-specific "expiresAfter" property is not set,
        it is the client's responsibility to delete the job from the system when it
        is no longer needed. If the job's logLocation is present, a delete request
        is issued to the log as well. The only exception is if the log is stored in
        files service and its parentUri points to a resource other than this job.
      tags:
      - Jobs
      parameters:
      - name: jobId
        in: path
        description: The ID of the job.
        required: true
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          The name of a credential domain of type OAuth2.0. The credential secret
          is retrieved to impersonate a group-managed service account
          for the current request.
        schema:
          type: string
      responses:
        "204":
          description: The job was deleted.
        "404":
          description: No job exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/deleteJob404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/deleteJob404Response"
  "/jobs/{jobId}/logForEV":
    get:
      x-sas-internal: true
      operationId: getJobLogForEV
      summary: Get a text version of the job log
      description: Returns a text version of the job log. Typically, logs are stored
        in the Files service and in such a case the `logLocation` member in a Job
        contains the Files service URI of the log file.  The purpose of this endpoint
        is to convert logs from the Compute Service stored in JSON format to text
        format and for the endpoint to stream the text file back to the browser.  Specifically,
        the File resource must have a contentType of "application/vnd.sas.collection+json"
        and the actual content must be syntactically correct JSON.  For conversion
        code to succeed, the `items` member of the collection must contain an array
        with each "item" having a `type` member and a `line` member.  If conversion
        is not successful, the endpoint redirects to the content location of the File
        service URI.
      tags:
      - Jobs
      parameters:
      - name: jobId
        in: path
        description: The ID of job.
        required: true
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          The name of a credential domain of type OAuth2.0. The credential secret
          is retrieved to impersonate a group-managed service account
          for the current request.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded and the file is streamed back.
          content:
            text/plain:
              schema:
                type: string
              example: "NOTE: Cloud Analytic Services dropped table AUDIT from caslib\
                \ SystemData.  NOTE: Cloud Analytic Services dropped table audit_2992476099\
                \ from caslib SystemData."
        "302":
          description: Redirect the client to the Files service URI appended with
            /content.  The "Location" header is set to the redirected URI.
        "404":
          description: No job exists at the requested path, the `logLocation` member
            of Job was empty or the Files service URI in logLocation could not be
            accessed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/logForEV404Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/logForEV404Response"
    head:
      x-sas-internal: true
      operationId: headersForJobLogForEV
      summary: Check whether a text version of the job log is streamed directly or
        via a redirect
      description: Returns the headers for the endpoint that the corresponding `GET`
        returns. Clients can use this to determine whether a text version of the job
        log is streamed directly or via a redirect.
      tags:
      - Jobs
      parameters:
      - name: jobId
        in: path
        description: The ID of job.
        required: true
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          The name of a credential domain of type OAuth2.0. The credential secret
          is retrieved to impersonate a group-managed service account
          for the current request.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
        "302":
          description: Redirect the client to the Files service URI appended with
            /content.  The "Location" header is set to the redirected URI.
        "404":
          description: No job exists at the requested path, the `logLocation` member
            of Job was empty or the Files service URI in logLocation could not be
            accessed.
  "/jobs/{jobId}/state":
    get:
      operationId: getJobState
      summary: Get the state of the job
      description: "Returns the following states: pending, running, canceled, completed,\
        \ or failed."
      tags:
      - Jobs
      parameters:
      - name: jobId
