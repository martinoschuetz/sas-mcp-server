base or file column, including its name, data type, and size."},{"id":"/schemas/connection","title":"connection","description":"The connection object captures the connection information to a data source, which might be of the type 'file', 'database', 'az_file', 'az_blob', or 'sftp'."},{"id":"/schemas/connectionRequest","title":"connectionRequest","description":"The connection object captures the connection information to a data source, which might be of the type 'file', 'database', 'az_file', 'az_blob', or 'sftp'."},{"id":"/schemas/connectionSummary","title":"connectionSummary","description":"Connection summary"},{"id":"/schemas/dqSpec","title":"Data Quality Specification","description":"A Data Quality specification defines the quality checks for a table within a defined connection. The three types of data quality checks are lookup checks, uniqueness checks, and row-level checks."},{"id":"/schemas/dqSpecResponse","title":"Data Quality Specification","description":"A Data Quality specification defines the quality checks for a table within a defined connection. There are three types of data quality checks: lookup checks; uniqueness checks; and row-level checks."},{"id":"/schemas/dataMapSource","title":"dataMapSource","description":"Defines a source file or table specification that is used in a Data Mapper specification."},{"id":"/schemas/dataMapSourceToTargetMap","title":"dataMapSourceToTargetMap","description":"Contains the source-to-target mapping specification for one target column.  The source column can be a column name or an expression."},{"id":"/schemas/dataMapSpec","title":"dataMapSpec","description":"A Data Mapper specification defines source-to-target data mappings for one target table.  A data map can have one or more source files and tables that are used to map data to the target table. The Data Mapper specification is used to generate code to execute an ETL job within SAS Viya.\n"},{"id":"/schemas/dataMapSpecResponse","title":"dataMapSpec","description":"A Data Mapper specification defines source-to-target data mappings for one target table.  A data map can have one or more source files and tables that are used to map data to the target table. The Data Mapper specification is used to generate code to execute an ETL job within SAS Viya.\n"},{"id":"/schemas/dataMapSpecSummary","title":"dataMapSpecSummary","description":"Contains a summary of the properties for a data ingestion data map."},{"id":"/schemas/dqCheckLookupItem","title":"dqCheckLookupItem","description":"The lookup item."},{"id":"/schemas/dqCheckRowLevelItem","title":"dqCheckRowLevelItem","description":"The row-level item."},{"id":"/schemas/dqChecks","title":"dqChecks","description":"Contains three key-value pairs. One pair is for a lookup item. The second pair is for a uniqueness item. The third pair is for a row-level item."},{"id":"/schemas/dqCheckUniquenessItem","title":"dqCheckUniquenessItem","description":"The uniqueness item."},{"id":"/schemas/dqSpecSummary","title":"dqSpecSummary","description":"Contains a summary of the properties of a Data Quality specification."},{"id":"/schemas/entityResolutionSpec","title":"entityResolutionSpecification","description":""},{"id":"/schemas/entityResolutionSpecRequest","title":"entityResolutionSpecificationRequest","description":"Contains the universally unique identifier for a reference specification to clone."},{"id":"/schemas/entityResolutionSpecSummary","title":"entityResolutionSpecSummary","description":"Contains a summary of the properties of an Entity Resolution specification."},{"id":"/schemas/errorResponse","title":"Error","description":"The representation of an error."},{"id":"/schemas/file","title":"file","description":"The list item (when listing files of a file data connection)."},{"id":"/schemas/filepecSummary","title":"filepecSummary","description":"A source file specification, which defines the format of a delimited text file to be used as input to the Data Mapper process."},{"id":"/schemas/fileSpec","title":"filespec","description":"A source file specification, which defines the format of a delimited text file to be used as input to the Data Mapper process."},{"id":"/schemas/fileSpecRequest","title":"fileSpecRequest","description":"A source file specification that defines the format of a delimited text file to be used as input to the Data Mapper process."},{"id":"/schemas/fileWatcherJob","title":"fileWatcherJob","description":"The response of a File Watcher job."},{"id":"/schemas/fileWatcherSpec","title":"fileWatcherSpec","description":"A File Watcher specification that defines the parameters for transferring files from a source location to the landing area. A Data Mapper connection item is used to store credentials for accessing the source location. The source path can be set in the File Watcher specification or in the host-name string within the Data Mapper connection item (for certain connection types)."},{"id":"/schemas/fileWatcherSpecRequest","title":"fileWatcherSpecRequest","description":"A File Watcher specification that defines the parameters for transferring files from a source location to the landing area. A Data Mapper connection item is used to store credentials for accessing the source location. The source path can be set in the File Watcher specification or in the host-name string within the Data Mapper connection item (for certain connection types)."},{"id":"/schemas/fileWatcherState","title":"fileWatcherState","description":"The state of the File Watcher Process."},{"id":"/schemas/jobExecutionRequest","title":"jobExecutionRequest","description":"This Job object that is used in submitting a job specification execution request."},{"id":"/schemas/jobExecutionSummary","title":"jobExecutionSummary","description":"This summary object contains attributes of a job execution."},{"id":"/schemas/jobLog","title":"jobLog","description":"Provides the job execution log component."},{"id":"/schemas/jobExecution","title":"jobResource","description":"This summary object that contains the attributes of a job execution."},{"id":"/schemas/jobSpecPatchRequest","title":"jobSpecPatchRequest","description":"The object that is used to request an update to a job specification."},{"id":"/schemas/jobSpecRequest","title":"jobSpecRequest","description":"The job specification object that is used to request the creation of a job specification."},{"id":"/schemas/jobSpec","title":"jobSpecResource","description":"The Job Specification object maps that generate SAS code for a SAS Viya job definition."},{"id":"/schemas/jobSpecSummary","title":"jobSpecResource","description":"A summary representation of a Job Specification object."},{"id":"/schemas/link","title":"link","description":"The link object."},{"id":"/schemas/logLine","title":"logLine","description":"Provides an individual line from a log or listing resource."},{"id":"/schemas/rtengVi","title":"rtengVi","description":"The RTENG VI Batch Solution Factory JSON configuration object."},{"id":"/schemas/rtengViResolvedEntityObject","title":"rtengViResolvedEntityObject","description":""},{"id":"/schemas/rtengViSourceEntityObject","title":"rtengViSourceEntityObject","description":""},{"id":"/schemas/table","title":"table","description":"A summary list of tables from the database."},{"id":"/schemas/tablespec","title":"tablespec","description":"A table specification, which defines the metadata for a database table to be used as a source or target in the Data Mapper process. It includes the table name and all the associated columns."},{"id":"/schemas/tablespecRequest","title":"tablespecRequest","description":"A table specification, which defines the metadata for a database table to be used as a source or target in the Data Mapper process. It includes the table name and all the associated columns."},{"id":"/schemas/tablespecSummary","title":"tablespecSummary","description":"A table specification, which defines the metadata for a database table to be used as a source or target in the Data Mapper process. It includes the table name and all the associated columns."},{"id":"/schemas/validation","title":"validation","description":""},{"id":"/schemas/validationWithDelay","title":"validationWithDelay","description":""},{"id":"/schemas/validationWithError","title":"validationWithError","description":""}],"api":{"id":6345,"apiName":"dataQualityHfwa","categoryId":592,"isDeleted":false,"createdAt":"2024-10-08T13:25:38.029Z","updatedAt":"2026-07-31T17:41:59.305Z","api_category":{"id":592,"name":"data_quality_program_integrity_healthcare","displayName":"Data Quality for Program Integrity Healthcare","displayNamePropertyString":"RestApiCategories.dataQualityProgramIntegrityHealthcare.label","iconName":"DataDefinition","descriptionPropertyString":"RestApiCategories.dataQualityProgramIntegrityHealthcare.desc","isDeleted":false,"createdAt":"2025-12-18T22:27:17.977Z","updatedAt":"2026-07-31T17:40:35.909Z"},"versions":[{"id":12696,"version":1,"apiPK":6345,"apiId":"dataQualityHfwa-v1","title":"Healthcare Fraud Waste and Abuse","description":"_This API is for internal use only._\n    \nThis Healthcare Fraud Waste and Abuse API provides the basic CRUD actions for the SAS Data Quality for Program Integrity Healthcare application. The main capabilities of this API are data ingestion, job execution, data quality, entity resolution, analytics data preparation, and analytics modeling and reporting.  Data ingestion, including job execution, are the only capabilities that are available in the current release of this API.\n\nData ingestion includes the following components:\n\n* The File Watcher Process polls an SFTP server or other file landing zone for the existence of new data and the movement of those files to the application file stores.\n\n* The Data Mapper enables you to define the processes to extract, transform, and load (ETL) data from files and other tables to the application staging area.  Data Mapper contains the operations to create connections to file and database sources, extract metadata from file locations and database schemas, create and maintain file format specifications and table metadata that is used for source and target mapping, and create ETL specifications for loading target tables from source specifications.  The Data Mapper ETL specifications are used to create ETL jobs in SAS code that can then be executed via the job execution engine.\n\nThe job execution functionality submits jobs to SAS Viya's job execution engine, monitors execution status, and logs results.\n\nA UI front end enables the user to perform all the data ingestion activities.","isDeleted":false,"cadences":[{"id":742,"cadenceId":2,"apiVersionId":12696,"isDeleted":false,"published":false,"contacts":[{"name":"Grace Liao","role":"SUPPORT","email":"grace.liao@sas.com"},{"name":"Robert L. Anderson II","role":"TESTING_MANAGER","email":"robert.anderson@sas.com"},{"name":"Tom Rinehart","role":"DEVELOPMENT_MANAGER","email":"tom.rinehart@sas.com"}],"usedByProducts":["SAS Data Quality for Program Integrity Healthcare"],"cadence":{"id":2,"name":"2024.09","isDeleted":false,"createdAt":"2024-10-11T17:37:39.579Z","updatedAt":"2024-10-11T17:37:39.579Z"}},{"id":6148,"cadenceId":29,"apiVersionId":12696,"isDeleted":false,"published":false,"contacts":[{"name":"Grace Liao","role":"SUPPORT","email":"grace.liao@sas.com"},{"name":"Randy Stubbs","role":"TESTING_MANAGER","email":"randy.stubbs@sas.com"},{"name":"Tom Rinehart","role":"DEVELOPMENT_MANAGER","email":"tom.rinehart@sas.com"}],"usedByProducts":["SAS Data Quality for Program Integrity Healthcare"],"cadence":{"id":29,"name":"2026.04","isDeleted":false,"createdAt":"2026-04-23T15:36:42.969Z","updatedAt":"2026-04-23T15:36:42.969Z"}},{"id":4586,"cadenceId":22,"apiVersionId":12696,"isDeleted":false,"published":false,"contacts":[{"name":"Grace Liao","role":"SUPPORT","email":"grace.liao@sas.com"},{"name":"Randy Stubbs","role":"TESTING_MANAGER","email":"randy.stubbs@sas.com"},{"name":"Tom Rinehart","role":"DEVELOPMENT_MANAGER",