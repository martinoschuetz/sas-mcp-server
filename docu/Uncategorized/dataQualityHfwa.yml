l">Terms of Use</a><span class="ml-4" aria-hidden="true">/</span></div><div><a class="text-link" target="_blank" href="https://support.sas.com/en/technical-support/services-policies/general-support.html#outside-scope">Statement of Support</a></div></div><div class="flex flex-wrap items-center gap-x-1"><a class="w-fit" target="_blank" href="https://www.sas.com/en_us/legal/copyright.html">© 2026 SAS Institute Inc. All Rights Reserved.</a><span class="text-muted text-sm">Last updated on<!-- --> <time dateTime="2026-07-31T17:43:59.315Z" class="text-muted text-sm">Jul 31, 2026, 5:43 PM UTC</time></span></div></footer></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"apiId":"dataQualityHfwa-v1","published":false,"spec":"{\"openapi\":\"3.0.3\",\"tags\":[{\"name\":\"Root\",\"description\":\"Contains the operations for the Root resource.\"},{\"name\":\"Data Ingestion\",\"description\":\"Contains the operations for using the File Watcher Process and Data Mapper components to ingest data.\"},{\"name\":\"Data Quality\",\"description\":\"Contains the operations for working with Data Quality specifications.\"},{\"name\":\"Jobs\",\"description\":\"Contains the operations for working with job specifications and job executions.\"},{\"name\":\"Entity Resolution\",\"description\":\"Contains the operations for working with Entity Resolution specifications.\"}],\"x-stoplight\":{\"id\":\"6xcv61olohau8\"},\"info\":{\"title\":\"Healthcare Fraud Waste and Abuse\",\"version\":\"1\",\"contact\":{\"name\":\"SAS Developers\",\"email\":\"devex@sas.com\",\"url\":\"https://developer.sas.com\"},\"termsOfService\":\"https://www.sas.com/en_us/legal/copyright.html\",\"license\":{\"name\":\"SAS\",\"url\":\"https://www.sas.com\"},\"description\":\"_This API is for internal use only._\\n    \\nThis Healthcare Fraud Waste and Abuse API provides the basic CRUD actions for the SAS Data Quality for Program Integrity Healthcare application. The main capabilities of this API are data ingestion, job execution, data quality, entity resolution, analytics data preparation, and analytics modeling and reporting.  Data ingestion, including job execution, are the only capabilities that are available in the current release of this API.\\n\\nData ingestion includes the following components:\\n\\n* The File Watcher Process polls an SFTP server or other file landing zone for the existence of new data and the movement of those files to the application file stores.\\n\\n* The Data Mapper enables you to define the processes to extract, transform, and load (ETL) data from files and other tables to the application staging area.  Data Mapper contains the operations to create connections to file and database sources, extract metadata from file locations and database schemas, create and maintain file format specifications and table metadata that is used for source and target mapping, and create ETL specifications for loading target tables from source specifications.  The Data Mapper ETL specifications are used to create ETL jobs in SAS code that can then be executed via the job execution engine.\\n\\nThe job execution functionality submits jobs to SAS Viya's job execution engine, monitors execution status, and logs results.\\n\\nA UI front end enables the user to perform all the data ingestion activities.\"},\"servers\":[{\"url\":\"https://example.sas.com/dataQualityHfwa\"}],\"paths\":{\"/\":{\"get\":{\"summary\":\"Get a list of top-level links\",\"operationId\":\"getLinks\",\"description\":\"Returns a list of links to the top-level collections that are surfaced through this API.\",\"responses\":{\"200\":{\"description\":\"The request succeeded.\",\"headers\":{\"Content-Type\":{\"schema\":{\"type\":\"string\"}}},\"content\":{\"application/vnd.sas.api+json\":{\"schema\":{\"$ref\":\"#/components/schemas/api\"},\"examples\":{\"json\":{\"$ref\":\"#/components/examples/getRootResponse\"}}},\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/api\"},\"examples\":{\"json\":{\"$ref\":\"#/components/examples/getRootResponse\"}}}}},\"400\":{\"$ref\":\"#/components/responses/badRequestResponse\"},\"404\":{\"$ref\":\"#/components/responses/notFoundResponse\"}},\"tags\":[\"Root\"]}},\"/dataIngestion/fileWatcher/state\":{\"get\":{\"summary\":\"Get the state of the File Watcher Process\",\"responses\":{\"200\":{\"description\":\"The request succeeded.\",\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/fileWatcherState\"},\"examples\":{\"File Watcher Process state running\":{\"$ref\":\"#/components/examples/fileWatcherStateExampleRunning\"},\"File Watcher Process state paused\":{\"$ref\":\"#/components/examples/fileWatcherStateExamplePaused\"}}},\"application/vnd.sas.hfwa.filewatcher.state+json\":{\"schema\":{\"$ref\":\"#/components/schemas/fileWatcherState\"},\"examples\":{\"File Watcher Process state running\":{\"$ref\":\"#/components/examples/fileWatcherStateExampleRunning\"},\"File Watcher Process state paused\":{\"$ref\":\"#/components/examples/fileWatcherStateExamplePaused\"}}}},\"headers\":{\"Content-Type\":{\"schema\":{\"type\":\"string\"},\"description\":\"Content Type\"}}},\"403\":{\"$ref\":\"#/components/responses/forbidden\"},\"500\":{\"$ref\":\"#/components/responses/internalServerError\"}},\"operationId\":\"getFilewatcherState\",\"description\":\"Gets the state of the File Watcher Process. This includes the state of the scheduler and the number and listing of the File Watcher specifications that are scheduled to run.\",\"tags\":[\"Data Ingestion\"],\"parameters\":[]},\"put\":{\"summary\":\"Change the state of the File Watcher Process\",\"operationId\":\"updateFileWatcherState\",\"responses\":{\"200\":{\"description\":\"The request succeeded.\",\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/fileWatcherState\"},\"examples\":{\"File Watcher Process state running\":{\"$ref\":\"#/components/examples/fileWatcherStateExampleRunning\"},\"File Watcher Process state paused\":{\"$ref\":\"#/components/examples/fileWatcherStateExamplePaused\"}}},\"application/vnd.sas.hfwa.filewatcher.state+json\":{\"schema\":{\"$ref\":\"#/components/schemas/fileWatcherState\"},\"examples\":{\"File Watcher Process state running\":{\"$ref\":\"#/components/examples/fileWatcherStateExampleRunning\"},\"File Watcher Process state paused\":{\"$ref\":\"#/components/examples/fileWatcherStateExamplePaused\"}}}}},\"400\":{\"$ref\":\"#/components/responses/badRequestResponse\"},\"403\":{\"$ref\":\"#/components/responses/forbidden\"},\"500\":{\"$ref\":\"#/components/responses/internalServerError\"}},\"description\":\"Starts or stops the File Watcher Process. The URL must contain a query parameter (for example, `/dataIngestion/fileWatcher/state?value=running` OR  `/dataIngestion/fileWatcher/state?value=paused`). There must be at least one enabled File Watcher specification defined for the File Watcher Process to start successfully.\",\"tags\":[\"Data Ingestion\"],\"parameters\":[{\"schema\":{\"type\":\"string\"},\"in\":\"query\",\"name\":\"value\",\"description\":\"The query parameter to change the state of the File Watcher Process. Valid values are \\\"value=running\\\" to start the File Watcher Process and \\\"value=paused\\\" to stop the File Watcher Process.\"}]},\"parameters\":[]},\"/dataIngestion/fileWatcher/specs\":{\"get\":{\"summary\":\"Get a collection of File Watcher specifications\",\"tags\":[\"Data Ingestion\"],\"responses\":{\"200\":{\"description\":\"The request succeeded.\",\"content\":{\"application/json\":{\"schema\":{\"allOf\":[{\"$ref\":\"#/components/schemas/baseCollection\"},{\"type\":\"object\",\"properties\":{\"items\":{\"type\":\"array\",\"items\":{\"$ref\":\"#/components/schemas/fileWatcherSpec\"}}}}]},\"examples\":{\"Example 1\":{\"summary\":\"An OK success response\",\"description\":\"A sample response when a request to get a collection of File Watcher specifications is successful.\",\"value\":{\"version\":1,\"accept\":