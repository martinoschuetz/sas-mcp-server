servers:
- url: "http://example.com/termsManagement"
  description: This is a sample base URL.
components:
  parameters:
    filter:
      name: filter
      in: query
      x-sas-attributes:
        since: "2"
      description: >
        Filter criteria for returned items. See
        [`?filter=`](https://developer.sas.com/guides/rest/filtering) query
        parameter.


        The valid filter fields are the first-level fields in each item.


        The supported functions are and, or, not eq, eq, contains, startsWith, endsWith,
        in.


        Some sample queries:


        | Example                       | Sample Query Parameters                                     |

        | ------------------------------| ------------------------------------------------------------|

        | Search by value starting with | filter=startsWith(name, 'pa')                               |

        | Search by name                | filter=eq(name, 'pa')                                       |

        | Search for multiple items     | filter=in(value,'pa','ap')                                  |
      example: in(value,'wine')
      schema:
        type: string
        format: filter-criteria
    indexTableInfo:
      name: indexTableInfo
      in: query
      required: false
      x-sas-attributes:
        since: "2"
      description: >
        The information about the index table. The format is
        casLibName~fs~indexTableName

        where, the casLibName is the name of CAS library where the index table exists
        and

        indexTableName is the name of the index table. The index table is a CAS table
        used to support

        the search through term documents. The 'search' query parameter can only be
        used when the value of this

        parameter is defined.
      example: caslib~fs~index
      schema:
        type: string
    searchTerms:
      name: search
      in: query
      required: false
      x-sas-attributes:
        since: "2"
      description: >
        Defines the keywords separated by space that will be used in searching
        the term documents.

        Term documents are matching documents to the specified term.

        The returned term list will be populated based on term documents that matches
        the specified search criteria.

        The numberOfDocuments and numTerms properties of a term will be affected as
        well.


        The following characters are reserved for special meaning (note, those characters
        are non-searchable):


        | Characters | Details about reserved characters |

        |---------------------------------------------------------------|--------------------------------------------------------------------------------|

        | + | Will not match any term document that does not have this keyword. The
        '+' must follow the keyword. |

        | - | Matches any term document that does not have this keyword. The '-' must
        follow the keyword. |

        | * | Wildcard character that matches any character within a word. |

        | " | Denotes a phrase that must be matched in exact sequence." |

        | +() | Used to group different keywords together. This notation will enforce
        to match term documents containing at least one of those grouped keywords.
        |


        Some sample search parameters:


        | Sample Search Parameter   | Details about the search parameter |

        |---------------------------------------------------------------|--------------------------------------------------------------------------------|

        | wine                      | term documents matching wine keyword |

        | +wine fruit               | term documents containing 'wine' but can have
        'fruit' keyword as well </li> |

        | -wine fruit               | term documents not containing 'wine' but should
        contain 'fruit'    |

        | wine \"smoked meat\"      | term documents either containing 'wine' or 'smoked
        meat' keywords  |

        | +(wine wines) fruit       | term documents should contain at least 'wine'
        or 'wines' also they can have 'fruit' keyword |

        | +(wine wines) +fruit      | term documents should contain at least 'wine'
        or 'wines' but also contain 'fruit' keyword |

        | +(wine wines) +fruit prime| term documents should contain at least 'wine'
        or 'wines' but also contain 'fruit' keyword and can have 'prime' keyword|
      example: +wine +fruit
      schema:
        type: string
    searchTerm:
      name: search
      in: query
      required: false
      x-sas-attributes:
        since: "2"
      description: >
        Defines the keywords separated by space that will be used in searching
        the term documents.

        Term documents are matching documents to the specified term.

        If there are any term documents matching to the specified search criteria,
        then the term information will

        be returned. Otherwise, a 404 http error will be returned to the user as there
        were no documents found that

        belong to the specified term. The numberOfDocuments and numberOfTerms properties
        of the specified term will

        be updated as well based on the search criteria.


        The following characters are reserved for special meaning (note, those characters
        are non-searchable):


        | Characters | Details about reserved characters |

        |---------------------------------------------------------------|--------------------------------------------------------------------------------|

        | + | Will not match any term document that does not have this keyword. The
        '+' must follow the keyword. |

        | - | Matches any term document that does not have this keyword. The '-' must
        follow the keyword. |

        | * | Wildcard character that matches any character within a word. |

        | " | Denotes a phrase that must be matched in exact sequence." |

        | +() | Used to group different keywords together. This notation will enforce
        to match term documents containing at least one of those grouped keywords.
        |


        Some sample search parameters:


        | Sample Search Parameter   | Details about the search parameter |

        |---------------------------------------------------------------|--------------------------------------------------------------------------------|

        | wine                      | term documents matching wine keyword |

        | +wine fruit               | term documents containing 'wine' but can have
        'fruit' keyword as well </li> |

        | -wine fruit               | term documents not containing 'wine' but should
        contain 'fruit'    |

        | wine \"smoked meat\"      | term documents either containing 'wine' or 'smoked
        meat' keywords  |

        | +(wine wines) fruit       | term documents should contain at least 'wine'
        or 'wines' also they can have 'fruit' keyword |

        | +(wine wines) +fruit      | term documents should contain at least 'wine'
        or 'wines' but also contain 'fruit' keyword |

        | +(wine wines) +fruit prime| term documents should contain at least 'wine'
        or 'wines' but also contain 'fruit' keyword and can have 'prime' keyword|
      example: +wine +fruit
      schema:
        type: string
  schemas:
    updateTerms:
      title: Update Terms
      type: object
      description: An array containing the terms which needs to be updated.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/updateTerm"
    updateTerm:
      title: Update a Term
      description: A term which needs to be updated.
      x-sas-media-type: application/vnd.sas.text.terms.table.terms
      properties:
        version:
          type: integer
          description: The version of the object
        id:
          type: string
          description: The ID of the term
        keep:
          type: boolean
          description: The keep status of the term. True means it is kept for analysis.
            False means it is dropped.
      required:
      - id
      - keep
    updateTermsResponseCollection:
      title: Update Terms Response Collection
      description: An array containing the response of term updates which is one to
        one mapping to the items in the request.
      x-sas-media-type: application/vnd.sas.collection+json;version=1
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/updateTermResponse"
    updateTermResponse:
      title: Update Term Response
      description: Update term response.
      x-sas-media-type: application/json
      properties:
        id:
          type: string
          description: The ID of the term
        httpStatusCode:
          type: integer
          description: The http status code
        message:
          type: string
          description: message representing success or error for the update operation
    termMapGraph:
