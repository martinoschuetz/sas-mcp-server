        within a term table specified by tableId. Based on the user specified value
        for parent terms in `termValues` query parameter, the service will return
        all the queried parent terms and their child terms. The `terms` field of the
        the parent term will contain its child terms. In the current release, the
        sorting and paging capability is not supported.
      tags:
      - Term Tables
