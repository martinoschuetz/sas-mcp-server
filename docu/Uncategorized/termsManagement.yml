            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTerms400ErrorResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTerms400ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTerms400ErrorResponse"
        "404":
          description: |
            A table with the specified ID does not exist.
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTerms404ErrorResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
