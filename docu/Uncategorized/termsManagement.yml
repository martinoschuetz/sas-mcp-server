---
openapi: 3.0.3
info:
  version: "5"
  title: Terms Management
  description: >
    The termsManagement Rest API service enables users to explore and manage
    terms within a specified terms table. A terms table is generated as a result
    of running the parse node within a text analytics pipeline. Once the parse
    node is run, this service can be used to view the different terms inside the
    term table. Some examples of exploration actions are: retrieving information
    about term(s), retrieving child terms of a term, retrieving matched
    documents, retrieving a term map and retrieving similar terms for a given
    term. An example of management action is to change the keep/drop status for
    a given term. This status change of a term is then used later in the text
    analysis. <br>
                                                                    Other services
    which interact with this service:
                                                                    <ul><li>Topic
    Management REST API</li><li>Documents REST API</li></ul>
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
tags:
- name: Root
  description: The API root.
- name: Term Tables
  description: Operations performed on term tables.
- name: Topic Terms
  description: Operations performed on topic terms.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get API resource links
      description: >
        Returns a list of links to the top-level collections surfaced through
        this API.  HEAD is also supported and will return status and headers
        only.
      operationId: root
      responses:
        "200":
          description: A collection of link objects.
          headers:
            Last-Modified:
              description: The ISO8601 date string that represents the timestamp of
                the last update to this object.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
  "/termTables/{tableId}/terms":
    parameters:
    - name: tableId
      in: path
      description: The name of the term table
      required: true
      schema:
        type: string
    get:
      summary: Get a collection of terms within a specified term table
      operationId: getTerms
      description: >
        Returns a collection of parent terms within a term table specified by
        tableId. In order to get the children of a parent term, see the end
        point for children.

        The following link relations (`rel`) are provided in the **links** collection
        in the response:

        * self - link to the terms of a `term table` itself

        * up - link to get the root node

        * update - link to update multiple terms within the `term table`
      tags:
      - Term Tables
      parameters:
      - name: serverId
        in: query
        required: true
        description: The ID of the server from which to fetch the term tables
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: The name of the CAS library from which to fetch the term tables
        schema:
          type: string
      - name: keep
        in: query
        description: >
          The flag that can be set to get kept or dropped terms. Default is
          TRUE. If set to FALSE, only dropped terms within a table would be
          returned. Otherwise, only kept terms within a table would be
          returned
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first column in a page (default is
          0)
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of columns to return in results (default is 100)
        schema:
          type: integer
      - name: sortBy
        in: query
        description: >
          Sort-returned terms. The sort criteria support the following fields
          in either ascending or descending order (id, value, role, attribute,
          frequency, numberOfDocuments, keep, parentId, weight). See [sorting
          collections](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
          default: frequency:descending
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/indexTableInfo"
      - $ref: "#/components/parameters/searchTerms"
      responses:
        "200":
          description: OK.
          headers:
            Last-Modified:
              description: The ISO8601 date string that represents the timestamp of
                the last update to the terms in the specified term table.
              schema:
                type: string
                format: date-time
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/termsCollection"
              examples:
                api:
                  $ref: "#/components/examples/getTermsResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/termsCollection"
              examples:
                api:
                  $ref: "#/components/examples/getTermsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/termsCollection"
              examples:
                api:
                  $ref: "#/components/examples/getTermsResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTerms400ErrorResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTerms400ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTerms400ErrorResponse"
        "404":
          description: |
            A table with the specified ID does not exist.
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTerms404ErrorResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTerms404ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTerms404ErrorResponse"
    patch:
      summary: Update the properties of existing terms in a specified table
      operationId: patchTerms
      description: >
        Updates the properties of existing terms in a specified table. Only the
        "keep" property can be updated for a term, which means that a  user can
        change the keep status of the term and thereby affect the textual
        analysis.
      tags:
      - Term Tables
      parameters:
      - name: serverId
        in: query
        required: true
        description: The ID of the server from which to fetch the term tables
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: The name of the CAS library from which to fetch the term tables
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: >
          The time stamp obtained from the most recent `Last-Modified`
          response header. Ignored when `If-Match` is specified.
        schema:
          type: string
          format: date-time
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateTerms"
            examples:
              api:
                $ref: "#/components/examples/patchTermsRequestSampleBody"
        description: The list of terms to be updated
        required: true
      responses:
        "200":
          description: OK. One or more term updates succeeded.
          headers:
            Last-Modified:
              description: The ISO8601 date string that represents the timestamp of
                the last update to the terms in the specified term table.
              schema:
                type: string
                format: date-time
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/updateTermsResponseCollection"
              examples:
                api:
                  $ref: "#/components/examples/patchTermsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/updateTermsResponseCollection"
              examples:
                api:
                  $ref: "#/components/examples/patchTermsResponse"
        "400":
          description: >
            None of the updates was successful or the input JSON string is
            invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/patchTerms400ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/patchTerms400ErrorResponse"
        "404":
          description: |
            Table with the specified ID does not exist.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/patchTerms404ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/patchTerms404ErrorResponse"
        "412":
          description: >
            Either the 'If-Match' request header did not match the resource's
            entity tag (ETag), or the 'If-Unmodified-Since' request header did
            not match the resource's last modified date.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/patchTerms412ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/patchTerms412ErrorResponse"
        "422":
          description: >
            All the terms in request body are not parent terms. Only a parent
            term can be updated.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/patchTerms422ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/patchTerms422ErrorResponse"
        "428":
          description: >
            The request headers did not include 'If-Match' or
            'If-Unmodified-Since'.
  "/termTables/{tableId}/terms/{termId}":
    parameters:
    - name: tableId
      in: path
      description: The name of the term table
      required: true
      schema:
        type: string
    - name: termId
      in: path
      description: The ID of the term within a term table
      required: true
      schema:
        type: string
    - name: serverId
      in: query
      required: true
      description: The ID of the server from which to fetch the term tables
      schema:
        type: string
    - name: casLibName
      in: query
      required: true
      description: The name of the CAS library from which to fetch the term tables
      schema:
        type: string
    - $ref: "#/components/parameters/indexTableInfo"
    - $ref: "#/components/parameters/searchTerm"
    get:
      summary: Get information about the specified term within a term table
      operationId: getTermId
      description: >
        Returns information about the term, specified by termId within a
        specific term table.

        The following link relations (`rel`) are provided in the **links** collection
        in the response:

        * self - link to specified term of a `term table` itself.

        * up - link to get the terms of a `term table`.

        * update - link to update the specified term within the `term table`

        * documents – link to get the documents for the specified term within `term
        table`.

        * children – link to get the child terms for the specified term within `term
        table`.

        * similarTerms – link to get the similar terms of the specified term within
        `term table`.

        * termMap – link to get the terms map of the specified term within `term table`.
      tags:
      - Term Tables
      responses:
        "200":
          description: OK.
          headers:
            Last-Modified:
              description: The ISO8601 date string that represents the timestamp of
                the last update to this term.
              schema:
                type: string
                format: date-time
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/termId"
              examples:
                api:
                  $ref: "#/components/examples/getTermResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/termId"
              examples:
                api:
                  $ref: "#/components/examples/getTermResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTerm400ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTerm400ErrorResponse"
        "404":
          description: |
            A term with the specified termId does not exist in the term table.
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTerm404ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getTerm404ErrorResponse"
  "/termTables/{tableId}/terms#getChildTermsForParentTerms":
    parameters:
    - name: tableId
      in: path
      description: The name of the term table
      required: true
      schema:
        type: string
    get:
      summary: Get a collection of parent terms along with their child terms based
        on the queried parent terms list
      operationId: getChildTermsForParentTerms
      description: Returns a collection of parent terms along with their child terms
        within a term table specified by tableId. Based on the user specified parent
        terms in `termIds` query parameter, the service will return all the queried
        parent terms and their child terms. The `terms` field of the the parent term
        will contain its child terms. In the current release, the sorting and paging
        capability is not supported.
      tags:
      - Term Tables
      parameters:
      - name: serverId
        in: query
        required: true
        description: The ID of the server from which to fetch the term tables
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: The name of the CAS library from which to fetch the term tables
        schema:
          type: string
      - name: termIds
        in: query
        required: true
        description: The comma separated string containing the parent term IDs for
          which user requires the child terms.
        schema:
          type: integer
      responses:
        "200":
          description: OK.
          headers:
            Last-Modified:
              description: The ISO8601 date string that represents the timestamp of
                the last update to this object.
              schema:
                type: string
                format: date-time
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/childTermsForParentTermCollection"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTermsResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/childTermsForParentTermCollection"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTermsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/childTermsForParentTermCollection"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTermsResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTerms400ErrorResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTerms400ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTerms400ErrorResponse"
        "404":
          description: |
            A table with the specified ID does not exist.
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTerms404ErrorResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTerms404ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsForParentTerms404ErrorResponse"
