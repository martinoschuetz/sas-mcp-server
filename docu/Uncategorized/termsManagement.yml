                  $ref: "#/components/examples/getChildTermsForParentTerms404ErrorResponse"
  "/termTables/{tableId}/terms/{termId}/children":
    get:
      summary: Get a collection of child terms for a parent term
      operationId: getTermsChildren
      description: >-
        Returns a collection of child terms for a parent term, which is
        specified by termId.

        The following link relations (`rel`) are provided in the **links** collection
        in the response:

        * self - link to the child terms of a specified term of a `term table` itself.

        * up - link to get the terms `term table` object.

        * first – link to get the first item meeting the specified criteria within
        `term table`.

        * last – link to get the last item meeting the specified criteria within `term
        table`.

        * next – link to get the next item meeting the specified criteria within `term
        table`.
      tags:
      - Term Tables
      parameters:
      - name: tableId
        in: path
        description: The name of the term table
        required: true
        schema:
          type: string
      - name: termId
        in: path
        description: The ID of the parent term
        required: true
        schema:
          type: string
      - name: serverId
        in: query
        required: true
        description: The ID of the server from which to fetch the term tables
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: The name of the CAS library from which to fetch the term tables
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first column in a page (default is
          0)
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of columns to return in results (default is 100)
        schema:
          type: integer
      - name: sortBy
        in: query
        description: >
          Sort-returned tables. The sort criteria support the following fields
          in either ascending or descending order (id, value, role, attribute,
          frequency, numberOfDocuments, keep, parentId, weight). See [sorting
          collections](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
          default: frequency:descending
      - $ref: "#/components/parameters/indexTableInfo"
      - $ref: "#/components/parameters/searchTerms"
      responses:
        "200":
          description: OK.
          headers:
            Last-Modified:
              description: The ISO8601 date string that represents the timestamp of
                the last update to the child terms object.
              schema:
                type: string
                format: date-time
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/childTermsCollection"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/childTermsCollection"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/childTermsCollection"
              examples:
                api:
                  $ref: "#/components/examples/getChildTermsResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTerms400ErrorResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTerms400ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTerms400ErrorResponse"
        "404":
          description: >
            A table with the specified ID or a parent term with the specified ID
            does not exist.
          content:
            application/vnd.sas.text.terms.table.terms+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTerms404ErrorResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTerms404ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getChildTerms404ErrorResponse"
  "/termTables/{tableId}/terms/{termId}/similarTerms":
    get:
