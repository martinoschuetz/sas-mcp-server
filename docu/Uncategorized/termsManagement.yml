        in: query
        required: true
        description: The name of the CAS library from which to fetch the term tables
        schema:
          type: string
      - name: termValues
        in: query
        required: true
        description: The comma separated string containing the value for parent terms
          for which user requires the child terms.
        example: wine,fruit,quality
        schema:
          type: string
      responses:
        "200":
          description: OK.
          headers:
