                  $ref: '#/components/examples/getCodeSetsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/medicalCodeSetCollection'
              examples:
                default:
                  $ref: '#/components/examples/getCodeSetsResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The media type of the response body
        '404':
          description: Service is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
