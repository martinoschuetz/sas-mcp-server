      responses:
        '200':
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: '#/components/examples/getMedicalCodeSetsRootResponse'
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: '#/components/examples/getMedicalCodeSetsRootResponse'
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
        '404':
          description: Service is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
  /codeSets:
