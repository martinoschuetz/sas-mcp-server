  /codeSets/{codeSetId}:
    get:
      summary: Get a single code set
      description: Get the details of a specific code set
      operationId: getCodeSet
      tags:
      - Code Sets
      parameters:
      - name: codeSetId
        in: path
        required: true
        description: The id of the code set to retrieve
        schema:
          type: integer
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/vnd.sas.medical.codeset+json:
              schema:
                $ref: '#/components/schemas/medicalCodeSet'
              examples:
                default:
                  $ref: '#/components/examples/ICD10CMcodeSet'
            application/json:
              schema:
                $ref: '#/components/schemas/medicalCodeSet'
              examples:
                default:
                  $ref: '#/components/examples/ICD10CMcodeSet'
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
        '404':
          description: Service is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
    head:
      summary: Get headers for a single code set
      description: HEAD for getting a specific code set by id
      operationId: headersForGetCodeSet
      tags:
      - Code Sets
      parameters:
      - name: codeSetId
        in: path
        required: true
        description: The id of the code set to retrieve
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
  /codes:
    post:
      summary: Get medical codes matching a query
      description: Returns all the medical codes matching a query. It does not paginate.
        All codes are turned at once. Uses "Get via POST" to prevent too-long URIs.
      tags:
      - Codes
      operationId: getCodesViaPost
      requestBody:
        required: true
        content:
          application/vnd.sas.medical.codes.request+json:
            schema:
              $ref: '#/components/schemas/medicalCodesViaPostRequest'
            examples:
              Payload:
                $ref: '#/components/examples/medicalCodesViaPostRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/medicalCodesViaPostRequest'
            examples:
              Payload:
                $ref: '#/components/examples/medicalCodesViaPostRequest'
      responses:
        '200':
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/medicalCodeCollection'
              examples:
                default:
                  $ref: '#/components/examples/getCodesViaPostResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/medicalCodeCollection'
              examples:
                default:
                  $ref: '#/components/examples/getCodesViaPostResponse'
          headers:
            Content-Type:
              schema:
                type: string
              description: The media type of the response body
  /codes/{codeId}/ancestors:
    get:
      summary: Get list of ancestors for a single code
      operationId: getCodeAncestors
      description: Get hierarchy list of ancestors for a single code
      tags:
      - Codes
      parameters:
      - name: codeId
        in: path
        required: true
        description: The id of the code to retrieve the ancestors
        schema:
          type: string
      - $ref: '#/components/parameters/invalidParam'
      - $ref: '#/components/parameters/retiredParam'
      responses:
        '200':
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/medicalCodeCollection'
              examples:
                default:
                  $ref: '#/components/examples/getCodeAncestorsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/medicalCodeCollection'
              examples:
                default:
                  $ref: '#/components/examples/getCodeAncestorsResponse'
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
        '404':
          description: Service is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
    head:
      summary: Get headers for list of ancestors for a single code
      description: HEAD for getting list of ancestors for a single code
      operationId: headersForGetCodeAncestors
      tags:
      - Codes
      parameters:
      - name: codeId
        in: path
        required: true
        description: The id of the code to retrieve the ancestors
        schema:
          type: string
      - $ref: '#/components/parameters/invalidParam'
      - $ref: '#/components/parameters/retiredParam'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
        '404':
          description: Service is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
  /codes/{codeId}/topAncestor:
    get:
      summary: Get top ancestor for a single code
      operationId: getTopAncestor
      description: Given the codeId reterive the details of top ancestor
      tags:
      - Codes
      parameters:
      - name: codeId
        in: path
        required: true
        description: The id of the code to retrieve top ancestor
        schema:
          type: string
      - $ref: '#/components/parameters/invalidParam'
      - $ref: '#/components/parameters/retiredParam'
      responses:
        '200':
          description: OK
          content:
            application/vnd.sas.medical.code+json:
              schema:
                $ref: '#/components/schemas/medicalCode'
              examples:
                default:
                  $ref: '#/components/examples/getTopAncestorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/medicalCode'
              examples:
                default:
                  $ref: '#/components/examples/getTopAncestorResponse'
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
        '404':
          description: Service is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
    head:
      summary: Get headers for top ancestor for a single code
      description: HEAD for getting top ancestor for a single code
      operationId: headersForGetTopAncestors
      tags:
      - Codes
      parameters:
      - name: codeId
        in: path
        required: true
        description: The id of the code to retrieve the top ancestor
        schema:
          type: string
      - $ref: '#/components/parameters/invalidParam'
      - $ref: '#/components/parameters/retiredParam'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
        '404':
          description: Service is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
  /codes/{codeId}/children:
    get:
      summary: Get list of children for a single code
      operationId: getCodeChildren
      description: Given the codeId reterive its children
      tags:
      - Codes
      parameters:
      - name: codeId
        in: path
        required: true
        description: The id of the code to retrieve children
        schema:
          type: string
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/childrenCollection'
              examples:
                default:
                  $ref: '#/components/examples/getCodeChildrenResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/childrenCollection'
              examples:
                default:
                  $ref: '#/components/examples/getCodeChildrenResponse'
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
        '404':
          description: Service is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
    head:
      summary: Get headers for list of children for a single code
      description: HEAD for getting list of children for a single code
      operationId: headersForGetCodeChildren
      tags:
      - Codes
      parameters:
      - name: codeId
        in: path
        required: true
        description: The id of the code to retrieve children
        schema:
          type: string
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
        '404':
          description: Service is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: '#/components/examples/notFound'
components:
  parameters:
    startParam:
      name: start
      in: query
      description: Offset of the first return. The default value is 0.
      schema:
        type: integer
      example: 0
    limitParam:
      name: limit
      in: query
      description: Maximum number of return. Defaults to 200.
      schema:
        type: integer
      example: 100
    invalidParam:
      name: invalid
      in: query
      description: The medical code properities invalid. The default values is false
      schema:
        type: boolean
      example: false
    retiredParam:
      name: retired
      in: query
      description: The medical code properities retired. The default values is false
      schema:
        type: boolean
      example: false
    filterParam:
      name: filter
      description: The criteria for filtering. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
      in: query
      schema:
        type: string
        format: filter-criteria
      example: eq(description, 'Diabetes')
  schemas:
    medicalCode:
      description: Schema of a medical code
      title: medicalCode
      type: object
      properties:
        id:
          type: string
          description: The id of this code.
          example: 342ac342yz
        value:
          type: string
          description: The value of this code.
          example: "22.32"
        description:
          type: string
          description: The name of this code
          example: Diabetes
        codeSetId:
          type: number
          description: The codeset id from medical codeset
          example: 1
        codeType:
          type: string
          description: The type of this code
          example: DX
        vocabulary:
          type: string
          description: The vocabulary of this code
          example: ICD10CM
        quality:
          type: string
          description: The quality of this code
          example: medium
        retired:
          type: boolean
          description: The retired boolean value of this code
          example: false
        valid:
          type: boolean
          description: The valid boolean value of this code
          example: false
        properties:
          type: array
          items:
            $ref: '#/components/schemas/medicalCodeProperty'
    medicalCodeProperty:
      title: medicalCodeProperty
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
      description: Schema and example of a medical code property
    medicalCodeCollection:
      title: medicalCodeCollection
      description: Schema of a collection of medical codes
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/medicalCode'
    medicalCodeSet:
      title: medicalCodeSet
      description: Schema of a medical code set
      type: object
      properties:
        id:
          type: number
        codeType:
          type: string
        vocabulary:
          type: string
    medicalCodeSetCollection:
      title: medicalCodeSetCollection
      description: Schema of a collection of code sets
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/medicalCodeSet'
    children:
      description: Schema of Children
      title: Children
      type: object
      properties:
        id:
          type: string
          description: The id of this code.
          example: 342ac342yz
        value:
          type: string
          description: The value of this code.
          example: "22.32"
        description:
          type: string
          description: The name of this code
          example: Diabetes
        codeSetId:
          type: number
          description: The codeset id from medical codeset
          example: 1
        codeType:
          type: string
          description: The type of this code
          example: DX
        vocabulary:
          type: string
          description: The vocabulary of this code
          example: ICD10CM
        retired:
          type: boolean
          description: The retired boolean value of this code
          example: false
        valid:
          type: boolean
          description: The valid boolean value of this code
          example: false
        childCount:
          type: number
          description: count of children of a single code
          example: 1
        links:
          type: array
          title: Children Link
          description: The links that apply to the children.
          items:
            $ref: "#/components/schemas/link"
    childrenCollection:
      title: childrenCollection
      description: collection of children
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          codes:
            type: array
            items:
              $ref: '#/components/schemas/children'
    medicalCodesViaPostRequest:
      description: Schema of the criteria used to search for codes
      type: object
      properties:
        # 'start' and 'limit' properties are not present because the matching codes are returned all at once. Pagination is not involved.
        filter:
          type: string
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
  examples:
    getMedicalCodeSetsRootResponse:
      summary: Links to the Medical Code Sets APIs resources.
      description: Array of links to discover the resources available in the Medical
        Code Sets APIs.
      value:
        version: 1
        links:
        - method: GET
          rel: codeSets
          href: /codeSets
          uri: /codeSets
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.medical.codeset
        - method: GET
          rel: codeSet
          href: /codeSet/{codeSetId}
          uri: /codeSet/{codeSetId}
          type: application/vnd.sas.medical.codeset
        - method: HEAD
          rel: checkCodeSet
          href: /codeSet/{codeSetId}
          uri: /codeSet/{codeSetId}
          type: application/json
        - method: POST
          rel: codeSearch
          href: /codes
          uri: /codes
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.medical.code
        - method: GET
          rel: ancestors
          href: /codes/{codeId}/ancestors
          uri: /codes/{codeId}/ancestors
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.medical.code
        - method: GET
          rel: topAncestor
          href: /codes/{codeId}/topAncestor
          uri: /codes/{codeId}/topAncestor
          type: application/vnd.sas.medical.code
        - method: GET
          rel: children
          href: /codes/{codeId}/children
          uri: /codes/{codeId}/children
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.children
    getCodeSetsResponse:
      summary: Array of code sets
      description: Array of code sets available for code search
      value:
        version: 2
        accept: application/vnd.sas.medical.codeset
        count: 1
        name: codeSetCollection
        items:
        - id: 3
          codeType: DX
          vocabulary: ICD10CM
    NDCCode:
      summary: Bla
      description: Bla
      value:
        id: 10185d3f-0176-f528-c29d-25a5ac62000a
        value: '63187095930'
        description: FLUTICASONE PROPIONATE topical cream .5 mg/g FLUTICASONE PROPIONATE;
          30 g in 1 TUBE (63187-959-30)
        codeSetId: 7
        codeType: RX
        vocabulary: NDC
        quality: Low
        retired: false
        valid: true
        properties:
        - id: 380e28b9-0130-d271-9637-804c0a01027f
          name: Pharmacological Class
