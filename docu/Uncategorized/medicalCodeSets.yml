---
openapi: 3.0.3
info:
  title: Medical Code Sets
  version: '1'
  description: |
    The Medical Code Sets API provides basic read and search features of medical codes.

    Medical codes are grouped into code sets.

    Imagine a data analyst who, given records of medical claims, would like to know how frequently Fluticasone Propionate in its different forms and dosages have been prescribed in the past ten years to caucasian men with ages between 45 and 60 that have been diagnosed with sinusitis. The claims contain prescription codes like 63187095930 (that is one of the codes associated to Fluticasone Propionate) from the standard NDC (National Drug Code) code set. The analyst needs to search for such codes in the claims but he/she may not remember which NDC codes relate to Fluticasone Propionate, thefore the analyst may use the Medical Code Sets APIs to search within the NDC code set for the codes that relate to Fluticasone Propionate.

    The main resources managed by this API are the medical code and the medical code set. 

    A medical code, at the minimum, is defined by an id (unique within a code set) a value (unique within a code set) a description and the code set id the code belongs to. The id is used for internal purposes only, the value (e.g. 63187095930) is used by an analyst to search in the medical claims. The description (e.g. FLUTICASONE PROPIONATE topical cream .5 mg/g FLUTICASONE PROPIONATE; 30 g in 1 TUBE (63187-959-30)) is useful to the human reader to know what that code represents.

    A medical code set, is defined by an id (e.g. "1") (unique among all the code sets) a vocabulary (e.g. "NDC") and a codeType (e.g. "RX" where RX stands for prescriptions).
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
servers:
- url: 'http://mock-medicalCodeSets.apifirst.unx.sas.com/medicalCodeSets'
  description: kubernetes mock server
- url: example.com/medicalCodeSets
  description: local mock server
tags:
- description: Contains the operations for the root resource.
  name: Root
- description: Operations for retrieving medical code sets.
  name: Code Sets
- description: Operations for retrieving medical codes.
  name: Codes
paths:
