---
openapi: 3.0.3
info:
  version: "1"
  title: SAS Risk AI
  description: >
    SAS Risk AI APIs support AI-powered interactions for risk analysis workflows.
    Clients authenticate with a Bearer token; the API also forwards:
      Authorization (Bearer token)
      X-Sas-Authorization (same token)
      X-Sas-User-Id (resolved user id)
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
tags:
- name: Risk AI
  description: Operations for the SAS Risk AI API.
servers:
- url: https://example.com/riskAi
  description: SAS Risk AI
paths:
  /:
    get:
      operationId: root
      summary: Get API root information
      description: Returns basic information about the Risk AI API.
      tags:
      - Risk AI
      security:
      - bearerAuth: []
      responses:
        "200":
          description: API information returned successfully.
          headers:
            Last-Modified:
              description: Last modification date of the API.
              schema:
                type: string
                format: date-time
            ETag:
              description: Entity tag for the API root.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/apiInfo"
              example:
                name: SAS Risk AI
                version: "1"
                links: []
            application/json:
              schema:
                $ref: "#/components/schemas/apiInfo"
              example:
                name: SAS Risk AI
                version: "1"
                links: []
        "403":
          $ref: "#/components/responses/403"
  /v1/tasks:
    get:
      operationId: getTaskList
      summary: Get Task List
      description: |
        Returns all available tasks in an extensible wrapper format.

        **Default Behavior:**
        - Returns all tasks excluding any hidden ones.
        - Hidden tasks are controlled by the `SAS_ATOM_HIDDEN_TASK_TAGS` environment variable.

        **Tag Filtering:**
        - `?tags=alm,production` returns tasks matching ANY of the specified tags (OR logic).
        - Hidden tasks are always excluded regardless of tag filters.

        **Example Requests:**
        ```
        GET /v1/tasks                        # All visible tasks
        GET /v1/tasks?tags=alm               # Tasks tagged 'alm'
        GET /v1/tasks?tags=production,core   # Tasks tagged 'production' OR 'core'
        ```
      tags:
      - Risk AI
      security:
      - bearerAuth: []
      parameters:
      - name: tags
        in: query
        required: false
        description: >
          Comma-separated list of tags to filter tasks (OR logic).
          Example: "production,alm" returns tasks tagged with production OR alm.
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: Tasks returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/taskListResponse"
              examples:
                allTasks:
                  $ref: "#/components/examples/TaskListResponseExample"
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
        "422":
          $ref: "#/components/responses/422"
        default:
          $ref: "#/components/responses/defaultResponse"
  /v1/performTask:
    post:
      operationId: createTaskExecution
      summary: Perform Task
      description: |
        Performs a task and returns the result synchronously as JSON.
      tags:
      - Risk AI
      security:
      - bearerAuth: []
      requestBody:
        description: Task input payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/inputRequestPayload"
            examples:
              textInput:
                $ref: "#/components/examples/InputRequestPayloadExample"
      responses:
        "200":
          description: Task performed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/outputResponsePayload"
              examples:
                syncResponse:
                  $ref: "#/components/examples/OutputResponseSyncExample"
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
        "422":
          $ref: "#/components/responses/422"
        default:
          $ref: "#/components/responses/defaultResponse"
  /v1/session/{sessionId}:
    delete:
      operationId: deleteChatSession
      summary: Delete Chat Session
      description: |
        Deletes a chat session by its UUID.

        Returns `204` on success, `404` if the session does not exist,
        or `500` on an internal error.
      tags:
      - Risk AI
      security:
      - bearerAuth: []
      parameters:
      - name: sessionId
        in: path
        required: true
        description: UUID of the session to delete.
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Session deleted successfully.
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
        "404":
          description: Session not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                version: 2
                httpStatusCode: 404
                message: Not Found
                details:
                - "The specified session_id does not exist."
        "422":
          $ref: "#/components/responses/422"
        default:
          $ref: "#/components/responses/defaultResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token (JWT) issued by SAS Logon.
  schemas:
    error:
      $ref: "#/components/schemas/error2"
    apiInfo:
      type: object
      description: API information
      properties:
        name:
          type: string
          example: SAS Risk AI
        version:
          type: string
          example: "1"
        links:
          type: array
          items:
            type: object
    textContentBlock:
      type: object
      description: A plain-text content block.
      required:
      - text
      properties:
        type:
          type: string
          enum:
          - text
          default: text
        text:
          type: string
          description: The text content.
    structuredContentBlock:
      type: object
      description: A structured (JSON) content block.
      required:
      - data
      properties:
        type:
          type: string
          enum:
          - structured
          default: structured
        data:
          type: object
          additionalProperties: true
          description: Arbitrary structured data payload.
    uiContentBlock:
      type: object
      description: A UI component descriptor for client-side rendering.
      required:
      - component
      properties:
        type:
          type: string
          enum:
          - ui
          default: ui
        component:
          type: string
          description: >
            Name of the UI component to render on the client
            (e.g. 'StockChart', 'DateSelector', 'ConfirmationDialog').
          example: StockChart
        props:
          type: object
          additionalProperties: true
          description: Properties passed directly to the UI component.
    inputRequestPayload:
      type: object
      description: Payload sent by the client to initiate a task or continue a conversation.
      properties:
        sessionId:
          type: string
          nullable: true
          description: >
            Session identifier. Omit (or pass null) to start a new session;
            provide an existing ID to continue a conversation.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        taskId:
          type: string
          nullable: true
          description: Identifier of the task to execute (from GET /v1/tasks).
          example: alm_run_task
        content:
          type: array
          minItems: 1
          description: >
            Ordered sequence of input content blocks used to build the message
            sent to the LLM. Currently only textContentBlock is supported.
          items:
            oneOf:
            - $ref: "#/components/schemas/textContentBlock"
            discriminator:
              propertyName: type
              mapping:
                text: "#/components/schemas/textContentBlock"
    outputResponsePayload:
      type: object
      description: Payload returned by the server containing the response content
        and metadata.
      properties:
        content:
          type: array
          description: >
            Ordered sequence of content blocks for the UI to render.
            May contain text, structured data, or UI component descriptors.
          items:
            oneOf:
            - $ref: "#/components/schemas/textContentBlock"
            - $ref: "#/components/schemas/structuredContentBlock"
            - $ref: "#/components/schemas/uiContentBlock"
            discriminator:
              propertyName: type
              mapping:
                text: "#/components/schemas/textContentBlock"
                structured: "#/components/schemas/structuredContentBlock"
                ui: "#/components/schemas/uiContentBlock"
        sessionId:
          type: string
          nullable: true
          description: Session identifier. Echo of the request sessionId (or newly
            created).
    taskConfigBase:
      type: object
      description: Metadata for a single task available in the system.
      required:
      - taskId
      - taskName
      - taskLabel
      - tags
      properties:
        taskId:
          type: string
          description: Unique identifier for the task.
          example: alm_run_task
        taskName:
          type: string
          description: Display name of the task.
          example: ALM Analysis Run
        taskLabel:
          type: string
          description: Short UI label for the task.
          example: ALM Analysis Run
        taskDescription:
          type: string
          nullable: true
          description: Optional longer description of what the task does.
        taskIcon:
          type: string
          nullable: true
          description: Icon identifier or emoji for UI display.
          example: "<sasIconAttribute>"
        tags:
          type: array
          description: Tags used for categorisation and filtering.
          items:
            type: string
          example:
          - alm
          - production
    taskListResponse:
      type: object
      description: >
        Response wrapper for the list of available tasks.
        The wrapper structure allows adding top-level fields in the future
        without breaking existing clients.
      required:
      - tasks
      properties:
        tasks:
          type: array
          description: List of available (non-hidden) tasks.
          items:
            $ref: "#/components/schemas/taskConfigBase"
    validationError:
      type: object
      description: A single field-level validation error detail.
      required:
      - loc
      - msg
      - type
      properties:
        loc:
          type: array
          description: Location path of the invalid field.
          items:
            oneOf:
            - type: string
            - type: integer
        msg:
          type: string
          description: Human-readable error message.
        type:
          type: string
          description: Machine-readable error type identifier.
        ctx:
          type: object
          description: Additional context for the error.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
  examples:
    TaskListResponseExample:
      summary: List of available tasks
      description: List of available tasks
      value:
        tasks:
        - taskId: alm_run_task
          taskName: ALM Analysis Run
          taskLabel: ALM Analysis Run
          taskIcon: "sasIconAttribute"
          taskDescription: Runs an Asset-Liability Management analysis on the selected
            portfolio.
          tags:
          - alm
          - production
          - analysis
        - taskId: core_data_task
          taskName: Core Data Helper
          taskLabel: Data Operations
          taskIcon: sasIconAttribute
          taskDescription: General-purpose data helper for core operations.
          tags:
          - core
          - data
          - production
    InputRequestPayloadExample:
      summary: Start a new ALM task session
      description: Start a new ALM task session
      value:
        taskId: alm_run_task
        content:
        - type: text
          text: Run ALM analysis for portfolio Q3 2025
    OutputResponseSyncExample:
      summary: Synchronous task response
      description: Synchronous task response
      value:
        sessionId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        content:
        - type: text
          text: "ALM analysis completed successfully. The portfolio Q3 2025 shows\
            \ a duration gap of 2.3 years."
        - type: structured
          data:
            durationGap: 2.3
            currency: USD
            reportDate: "2025-09-30"
  responses:
    "400":
      description: One or more arguments is invalid.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            version: 2
            httpStatusCode: 400
            message: Bad Request
            details:
            - One or more request parameters are invalid.
    "403":
      description: The requested operation is forbidden or not authorised.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            version: 2
            httpStatusCode: 403
            message: Forbidden
            details:
            - You are not authorized to perform this operation.
    "422":
      description: Validation error request body failed schema validation.
      content:
        application/json:
          schema:
            type: object
            description: Validation error response from the upstream Python API.
            properties:
              detail:
                type: array
                items:
                  $ref: "#/components/schemas/validationError"
          example:
            detail:
            - loc:
              - body
              - content
              msg: field required
              type: value_error.missing
    defaultResponse:
      description: Unexpected upstream error response.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            version: 2
            httpStatusCode: 500
            message: Internal Server Error
            details:
            - An unexpected error occurred. Please try again later.




