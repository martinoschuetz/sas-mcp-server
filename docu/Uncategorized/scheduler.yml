servers:
- url: http://mock-scheduler.apifirst.unx.sas.com/scheduler
  description: kubernetes mock server
components:
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
        links:
          type: array
          description: The API's top-level links.
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method to invoke this endpoint.
        rel:
          type: string
          description: The relationship of this URL to the object.
        uri:
          type: string
          description: The relative URI of the REST endpoint.
        href:
          type: string
          description: The full URL of the REST endpoint.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type consumed/produced.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    baseCollection:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    errorResponse:
      title: Error
      type: object
      description: The representation of an error.
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The error message.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred
          items:
            $ref: "#/components/schemas/errorResponse"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    historyCollection:
      title: History Collection
      type: object
      description: A collection of history records.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: Array of History records
            items:
              $ref: "#/components/schemas/history"
    jobCollection:
      title: Job Collection
      type: object
      description: A collection of scheduled jobs.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: Array of Job records
            items:
              $ref: "#/components/schemas/jobWithLinks"
    fireTimesCollection:
      title: Fire times Collection
      type: object
      description: A collection of fire times.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: Array of fire time dates
            items:
              type: string
              format: date-time
              description: A representation of the time when the job will be run.
                This time string expects a format based on the common form of ISO-8601,
                YYYY-MM-DDTHH:MM:SS.SSSZ, which is year-month-day letter 'T' hour:minute:second
                and fractions.
    history:
      title: jobHistory
      type: object
      description: Job history information.
      properties:
        version:
          type: integer
          description: Collection schema version
        id:
          type: string
          description: Unique identifier for this history record
        jobId:
          type: string
          description: Unique identifier for a particular job
        jobGroup:
          type: string
          description: Identifier for a particular job group
        jobFireTimeStamp:
          type: string
          format: date-time
          description: A Date representing time the job ran
        body:
          type: object
          description: Data passed as request body to service
        jobStatus:
          type: string
          enum:
          - success
          - failure
          description: String representing status of job
        httpStatusCode:
          type: string
          description: HTTP status code value
        errorResponse:
          $ref: "#/components/schemas/errorResponse"
    job:
      title: job
      type: object
      description: A job that has been saved in a deployment and can be scheduled.
      required:
      - name
      - description
      - request
      - triggers
      properties:
        version:
          type: integer
          description: Job schema version
          default: 1
        id:
          type: string
          description: Unique identifier for a particular job
        name:
          type: string
          description: Name assigned to the job
        description:
          type: string
          description: An informative description of the job
        group:
          type: string
          description: A term by which jobs can be organized
        runAs:
          type: string
          description: Username to run the job under
        jobTimeOut:
          type: integer
          description: The maximum number of seconds to wait for the job request to
            complete
          default: 30
        request:
          $ref: "#/components/schemas/request"
        triggers:
          $ref: "#/components/schemas/triggers"
    jobWithLinks:
      title: job
      type: object
      description: A job that has been saved in a deployment and can be scheduled
        (including links).
      required:
      - name
      - description
      - request
      - triggers
      properties:
        version:
          type: integer
          description: Job schema version
        id:
          type: string
          description: unique identifier for a particular job
        name:
          type: string
          description: name assigned to the job
        description:
          type: string
          description: An informative description of the job
        group:
          type: string
          description: A term by which jobs can be organized
        runAs:
          type: string
          description: Username to run the job under
        jobTimeOut:
          type: integer
          description: The maximum number of seconds to wait for the job request to
            complete
          default: 30
        request:
          $ref: "#/components/schemas/request"
        triggers:
          $ref: "#/components/schemas/triggers"
        links:
          $ref: "#/components/schemas/links"
    jobTransferObject:
      title: jobTransferObject
      type: object
      description: A job in transfer object format.
      required:
      - content
      properties:
        version:
          type: integer
          description: Job schema version.
        summary:
          $ref: "#/components/schemas/summary"
        content:
          type: string
          description: A Base64-encoded string representation of the job.
        state:
          type: string
          description: Transfer object state.
    links:
      type: array
      description: Service links that apply to this object
      items:
        $ref: "#/components/schemas/link"
    request:
      description: The HTTP request that will be excuted by the scheduled job.
      type: object
      required:
      - uri
      - method
      - headers
      - body
      properties:
        uri:
          type: string
          description: URI of job to be invoked
        method:
          type: string
          description: HTTP method used on the uri
          enum:
          - POST
          - GET
          - DELETE
          - PUT
          - HEAD
          default: POST
        headers:
          title: headers
          description: Map of HTTP Request headers used to invoke the job
          type: object
          additionalProperties:
            properties:
              map:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
        body:
          $ref: "#/components/schemas/body"
    body:
      type: object
      description: request body for uri if needed
    triggers:
      type: array
      description: Array of triggers for scheduled request
      items:
        $ref: "#/components/schemas/trigger"
    trigger:
      description: An event that signals when a new instance of a job should execute.
      required:
      - name
      - type
      properties:
        id:
          type: string
          description: unique identifier for a particular trigger
        type:
          type: string
          description: Specify type of trigger as a String.
          enum:
          - IMMEDIATE
          - SIMPLE
          - CRON
          - TIMEEVENT
          default: IMMEDIATE
        name:
          type: string
          description: An identifier used in retrieving this trigger
        start:
          type: string
          format: date-time
          description: A representation of the time when the scheduler will run the
            job. This time string expects a format based on the common form of ISO-8601,
            YYYY-MM-DDTHH:MM:SS.SSSZ, which is year-month-day letter 'T' hour:minute:second
            and fractions. Used by SIMPLE and CRON types.
        end:
          type: string
          format: date-time
          description: A representation of the time when the scheduler will stop scheduling
            the job. This time string expects a format based on the common form of
            ISO-8601, YYYY-MM-DDTHH:MM:SS.SSSZ, which is year-month-day letter 'T'
            hour:minute:second and fractions. Used by SIMPLE and CRON types.
        repeat:
          type: integer
          description: Set the number of times to repeat the job, given other constraints.
            "-1" is special, meaning run the job forever. Used by SIMPLE and CRON
            types.
          default: 1
        interval:
          type: array
          description: Set the spacing between repetition of the job. May be a single
            non-negative integer referring to the number of interval units for all
            interval units except WEEKDAY or a list of weekdays for the interval unit
            of WEEKDAY. Used by SIMPLE and CRON types.
          items:
            type: string
        intervalUnit:
          type: string
          description: Set the time unit for the spacing between job executions. Used
            by SIMPLE and CRON types.
          enum:
          - SECOND
          - MINUTE
          - HOUR
          - DAY
          - WEEK
          - WEEKDAY
          - MONTH
          - YEAR
          default: DAY
        cron:
          type: string
          description: Specify a "cron expression" as a String. A cron expression
            is a string comprised of 6 or 7 fields separated by white space. For details
            on the values of the fields, see https://www.quartz-scheduler.org/documentation/quartz-2.3.0/tutorials/crontrigger.html.
            Required for CRON type.
        active:
          type: boolean
          description: designates if the associated job will be run based on the definition
            of this trigger
          default: true
        recurrence:
          $ref: "#/components/schemas/recurrence"
        hours:
          type: string
          description: comma-separated list of hours for a TimeEvent trigger. Values
            should be between 0 and 23, inclusive.
        minutes:
          type: string
          description: comma-separated list of minutes for a TimeEvent trigger. Values
            should be between 0 and 59, inclusive.
        duration:
          type: integer
          description: number of minutes the trigger event is true or active.
          default: 1
        timezone:
          type: string
          description: timezone used to interpret hours:minutes for TimeEvent trigger
          default: GMT
        maxOccurrence:
          type: integer
          description: number of times to run the TimeEvent job. The default of -1
            means no maximum
          default: -1
    recurrence:
      description: The trigger recurrence type.
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: RecurrenceType for the recurrence
          enum:
          - minutely
          - hourly
          - daily
          - weekly
          - monthly
          - yearly
          - datelist
        startDate:
          type: string
          description: The date to start this recurrence specified as yyyy-mm-dd.
            Required for all recurrence types except datelist.
          default: No default
        endDate:
          type: string
          description: The date to end this recurrence specified as yyyy-mm-dd. Used
            by all recurrence types except datelist.
          default: No default
        skipCount:
          type: integer
          description: The number of interval units to skip, defaults to 1 meaning
            no skip. Used by all recurrence types except datelist.
          default: 1
        daysOfWeek:
          type: array
          description: a list of weekdays. Required for weekly recurrence type. Used
            by monthly and yearly recurrence types in conjunction with occurrence
            but should contain only one weekday for these types.
          items:
            type: string
            enum:
            - sunday
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
          default: No default
        occurrence:
          type: string
          description: Ordinal value representing a specific week instance. Used by
            monthly and yearly recurrence types in conjunction with daysOfWeek.
          enum:
          - first
          - second
          - third
          - fourth
          - last
          default: No default
        dayOfMonth:
          type: integer
          description: The specific numerical value for a day. Range is from 1 to
            32. 32 is a special value meaning the last day of the month, no matter
            how many days the month has. If a day is specified but does not exist,
            the job is skipped. Used by monthly and yearly recurrence types as an
            alternative to occurrence and daysOfWeek.
          default: No default
        monthOfYear:
          type: string
          description: The month to run the job. Required for yearly recurrence type.
          enum:
          - January
          - February
          - March
          - April
          - May
          - June
          - July
          - August
          - September
          - October
          - November
          - December
          default: No default
        dates:
          description: a list of dates using format yyyy-mm-dd. Required for the datelist
            recurrence type.
          type: array
          items:
            type: string
          default: No default
        expression:
          type: string
          description: A scheduler specific opaque field.  Not currently used by this
            scheduler
          default: No default
    summary:
      title: Resource Summary
      required:
      - id
      - links
      - version
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the resource.
        name:
          type: string
          description: The name of the resource.
        type:
          type: string
          description: The type of the resource.
        description:
          type: string
          description: The description of the resource.
        createdBy:
          type: string
          description: The user who created the resource.
        creationTimeStamp:
          type: string
          description: The timestamp in YYYY-MM-DDThh:mm:ss.sssZ format when the resource
            was created.
          format: date-time
        modifiedBy:
          type: string
          description: The user who most recently modified the resource.
        modifiedTimeStamp:
          type: string
          description: The timestamp in YYYY-MM-DDThh:mm:ss.sssZ format when the resource
            was last modified.
          format: date-time
        links:
          type: array
          description: The links that apply to the resource.
          items:
            $ref: '#/components/schemas/link'
        version:
          type: integer
          description: The version number of the resource.
      description: The summarized representation of a resource.
    resourceSelection:
      title: Resource Selection
      type: object
      description: The representation of a selection of zero or more resources.
      required:
      - type
      - resources
      properties:
        name:
          type: string
          description: The name of the selection.
        type:
          type: string
          description: Specifies whether the resources array contains IDs, URIs, or
            both. If \"id\", the array contains resource identifiers only. If \"uri\",
            the array contains resource URIs.  If \"mixed\", the array contains a
            mixture of identifiers and URIs.
          enum:
          - id
          - uri
          - mixed
        resources:
          type: array
          description: The selected resources as an array of resource IDs or URIs.
          items:
            type: string
        links:
          type: array
          description: The links that apply to the selection.
          items:
            $ref: '#/components/schemas/link'
        version:
          description: The schema version number of this media type. This representation
            is version 2.
          type: integer
    nextFireTimeCollection:
      title: Collection of job next fire times and possibly error objects
      description: A collection of job next fire times and job IDs or error objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: job next fire times and error objects
            items:
              $ref: "#/components/schemas/nextFireTimeOrError"
    nextFireTimeOrError:
      title: Next fire time or error object
      description: An object that contains either a job ID and next fire time or an
        error object.
      oneOf:
      - type: object
        properties:
          id:
            type: string
            description: Job ID
          nextFireTime:
            type: string
            format: date-time
            description: The next fire time for the job
      - $ref: "#/components/schemas/errorResponse"
  examples:
    createOrUpdateJobBody:
      summary: Body to create or update a scheduled job (runs immediately)
      description: Sample body when using POST to schedule a job that runs immediately.
      value:
        version: 1
        name: Mail Schedule
        group: Now
        description: Send Mail to No One right Now
        request:
          uri: "/mail/messages"
          method: POST
          headers:
            Content-Type:
            - application/sas.vnd.mail+json
            Accept:
            - application/json
          body:
            to:
            - address: noone@sas.com
              personal: No One
            from:
              address: noone@sas.com
              personal: No One
            subject: Test Mail Subject From MailService
            textMessage: This is test Email from MailService running in SpringBoot!
        triggers:
        - name: mail_Now
          type: IMMEDIATE
    createOrUpdateJobCronBody:
      summary: Body to create a scheduled job (CRON schedule)
      description: Sample body when using POST to create a job that uses a CRON schedule.
      value:
        version: 1
        name: Mail Schedule
        group: Now
        description: Send Mail to No One right Now
        request:
          uri: "/mail/messages"
          method: POST
          headers:
            Content-Type:
            - application/sas.vnd.mail+json
            Accept:
            - application/json
          body:
            to:
            - address: noone@sas.com
