---
openapi: 3.0.3
info:
  version: "2"
  title: Scheduling
  description: >
    The Scheduling API schedules jobs to be executed according to a
    time schedule.
    <details>
    <summary><b>Overview</b></summary><br>
    A job is a program operation invoked via a REST api call.
    This API manages only the scheduled job resource. The API provides the
    means to create, read, update, and delete scheduled jobs. In addtion, the
    API can query the list of available jobs based on various criteria, obtain
    job data,  obtain calendar data, and scheduled job history information.
    </p>
    At a minimum, a job is a combination of a name, a request, and a collection of
    triggers.
    The request is the representation of the program operation while the triggers
    are the representation of the date[s] and time[s] for which the operation is invoked.
    </p>
    </details>
    <br>
    <details>
    <summary><b>Triggers</b></summary><br>
    A trigger comes in four different flavors:
    <ul>
    <li><b>immediate</b><br>runs immediately</li>
    <li><b>cron</b><br>provides a cron schedule string to represent invocation periods.</li>
    <li><b>simple</b><br>allows for simple time interval specifications</li>
    <li><b>timeEvent</b><br>allows for more complex time interval specifications</li>
    </ul>
    <br>A trigger can be active or inactive. An inactive trigger remains associated
    to its job but
    does not determine when the job should be fired. There can be any number of active
    triggers,
    including none.
    </p>
    </details>
    <br>
    <details>
    <summary><b>Consumers</b></summary><br>
    This API is usable by any API/solution which requires scheduling for a program
    operation as modeled by a REST endpoint.
    </p>
    </details>
    <br>
    <details>
    <summary><b>Scheduler Behavior</b></summary><br>
    All jobs created by this API are unique.  It is up to the caller of the API to
    decide if they want to
    create multiple jobs with identical content except for the trigger or to create
    a single job with
    multiple triggers.  A best practice recommendation would be to create single jobs
    with multiple
    triggers, as this model would generate fewer jobs to manage.  When a job is run,
    its result (status
    and response body), are logged in a history record, indexed by the job's id.  If
    a job is scheduled
    to run multiple times due to triggers which fire multiple times in the future,
    each run will create a
    unique history record associated with the job's id.
    </p>
    </details>
    <br>
    <details>
    <summary><b>Authentication and Authorization</b></summary><br>
    Users of the API must be authenticated through standard mechanisms which ultimately
    provide a valid
    Oauth2 token on any Requests to the API.  A User can be an authenticated user
    via a client logon
    or another API acting on its own behalf.
    </p>
    Users of the API may obtain different information based on their Authorization.  Users
    that hold the
    SAS Administrators group are allowed access to all content (can obtain any job
    or history).
    A User that is just an authenticated user is allowed access to content they have
    created - their
    jobs and history.
    </p>
    </details>
    <br>
    <details>
    <summary><b>Terminology</b></summary><br>
    <ul><li><b>Job</b>: A program operation invoked via a REST api call.</li>
    <li><b>Scheduling Server</b>: A server that runs jobs. The scheduling server determines
    whether the schedule criteria and dependencies have been met before a job is run.</li>
    <li><b>Trigger</b>: An event that signals when a new instance of a job should
    execute.</li>
    </ul>    </p>
    </details>
    <br>
    <details>
    <summary><b>Scenarios</b></summary><br>
    <ul>
    <li><b>Scenario 1</b><br>
    An API provides functionality which changes over time.  The API surfaces a client
    interface
    for consumers to select this functionality when the consumer desires.  If the
    consumer would benefit
    from a repeated schedule of invocations, the functionality could be scheduled
    with the scheduling
    API.  For example, Report Distribution generates reports on active data.  If a
    consumer wants a
    report every Monday morning to summarize the prior weeks work, a REST api call
    to the Report Distribution API
    can be made via the Scheduling API, set to trigger every Monday at 10:00 am.
    </li>
    <li><b>Scenario 2</b><br>
    An API provides functionality which needs to run periodically.  The API has a
    means for an
    Administrator to customize the time/date schedule for the required period.  Using
    this information,the API can
    schedule the functionality using the scheduling API bootstrap feature.  For
    example, Backup wants to run every Friday, generating archive information for
    the deployment.
    On startup, Backup will invoke a schedule for its API using the bootstrap feature,
    installing
    one job with its accompanying trigger[s].
    </li>
    </ul>
    </p>
    </details>
    <br>
    <details>
    <summary><b>Dependent APIs</b></summary><br>
    <ul>
    <li>Authentication</li>
    <li>Authorization</li>
    <li>Identities</li>
    </ul>
    </p>
    </details>
    <br>
    <details>
    <summary><b>Error Codes</b></summary><br>
    <p>
    <table><thead>
    <tr><th><b>HTTP Status Code</b></th><th>Error Code</th><th>Description</th></tr></thead>
    <tr>
    <td>400</td>
    <td>11301</td>
    <td>The Scheduler API `request.uri` is configured to deny use of Absolute URIs.</td>
    </tr>
    <tr>
    <td>400</td>
    <td>11304</td>
    <td>The Scheduler API `job` is given a bad `trigger` that never fires.</td>
    </tr>
    <tr>
    <td>404</td>
    <td>11306</td>
    <td>The Scheduler API `job.id` is missing.</td>
    </tr>
    <tr>
    <td>404</td>
    <td>11307</td>
    <td>The Scheduler API `history.id` is is missing.</td>
    </tr>
    <td>400</td>
    <td>11309</td>
    <td>The Scheduler API `trigger.end` must not come before or equal the `trigger.start`
    DateTime value.</td>
    </tr>
    <tr>
    <td>400</td>
    <td>11310</td>
    <td>The Scheduler API `id` is invalid.</td>
    </tr>
    <tr>
    <td>400</td>
    <td>11311</td>
    <td>The Scheduler API `request` is invalid.</td>
    </tr>
    <tr>
    <td>400</td>
    <td>11313</td>
    <td>The Scheduler API `runAs` designates a user that does not match the current
    user.</td>
    </tr>
    </table>
    </details>
    <br>
    </p>
  termsOfService: 'https://www.sas.com/en_us/legal/copyright.html'
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
tags:
- name: Root
  description: The API root.
- name: Job
  description: The endpoints managing the Job resource.
- name: History
  description: The endpoints managing the Job History resource.
- name: Transfer
  description: The endpoints for transfer object resources.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get Scheduler links
      operationId: root
      description: |
        The base scheduler URI that returns a set of links which define the scheduling service.
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getSchedulerRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getSchedulerRootResponse"
    head:
      tags:
      - Root
      summary: Check if the scheduler is available
      description: Returns whether or not the scheduler is running.
      operationId: headersForRoot
      responses:
        "200":
          description: Successful response
          headers:
            Content-Type:
              schema:
                type: string
  /jobs:
    get:
      tags:
      - Job
      summary: Get scheduled jobs
      description: Jobs uri.  Returns a collection of scheduled jobs.
      operationId: getJobs
      parameters:
      - name: start
        in: query
        description: The starting index of the first job in a page.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: >
          Maximum number of jobs to return in this page of results. The actual
          number of returned jobs may be less if the collection has been
          exhausted.
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: >
          Filter criteria for returned jobs. See the [Filtering
          section](https://developer.sas.com/rest-apis/scheduler-v2/docs/getting-started/usage-notes#filtering).
          <br>Any attribute of the jobs can be used to filter the results.
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: >
          Sort returned collection of jobs.  The sort criteria supports the
          following fields in either ascending or descending order (name,
          type).  See the [Sorting
          section](https://developer.sas.com/rest-apis/scheduler-v2/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          Name of a credential domain of type OAuth2.0. The credential secret
          will be retrieved to impersonate a group-managed service account  for the
          current request.
        schema:
          type: string
      responses:
        "200":
          description: Jobs
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/jobCollection"
              examples:
                json:
                  $ref: "#/components/examples/getJobsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/jobCollection"
              examples:
                json:
                  $ref: "#/components/examples/getJobsResponse"
    post:
      tags:
      - Job
      summary: Create a scheduled job
      description: Create a new scheduled job.
      operationId: createJob
      parameters:
      - name: Delegate-Domain
        in: header
        description: >
          Name of a credential domain of type OAuth2.0. The credential secret
          will be retrieved to impersonate a group-managed service account  for the
          current request.
        schema:
          type: string
      - name: parentFolderUri
        in: query
        description: The URI of the parent folder in which to save the scheduled job.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.schedule.job+json:
            schema:
              $ref: "#/components/schemas/job"
            examples:
              json:
                $ref: "#/components/examples/createOrUpdateJobBody"
              daily:
                $ref: "#/components/examples/createOrUpdateJobDailyBody"
              timeEvent:
                $ref: "#/components/examples/createOrUpdateJobTimeEventBody"
          application/json:
            schema:
              $ref: "#/components/schemas/job"
            examples:
              json:
                $ref: "#/components/examples/createOrUpdateJobBody"
              daily:
                $ref: "#/components/examples/createOrUpdateJobDailyBody"
              timeEvent:
                $ref: "#/components/examples/createOrUpdateJobTimeEventBody"
        description: Job definition to be scheduled
        required: true
      responses:
        "201":
          description: Successful response
          headers:
            Location:
              description: The uri for the returned job.
              schema:
                type: string
            ETag:
              description: The entity tag for this job.
              schema:
                type: string
            Last-Modified:
              description: The HTTP-date string representing the timestamp of the
                last update to this job.
              schema:
                type: string
          content:
            application/vnd.sas.schedule.job+json:
              schema:
                $ref: "#/components/schemas/jobWithLinks"
              examples:
                json:
                  $ref: "#/components/examples/createOrUpdateJobResponse"
                daily:
                  $ref: "#/components/examples/createOrUpdateJobDailyResponse"
                timeEvent:
                  $ref: "#/components/examples/createOrUpdateJobTimeEventResponse"
                cron:
                  $ref: "#/components/examples/createOrUpdateJobCronBody"
            application/json:
              schema:
                $ref: "#/components/schemas/jobWithLinks"
              examples:
                json:
                  $ref: "#/components/examples/createOrUpdateJobResponse"
                daily:
                  $ref: "#/components/examples/createOrUpdateJobDailyResponse"
                timeEvent:
                  $ref: "#/components/examples/createOrUpdateJobTimeEventResponse"
                cron:
                  $ref: "#/components/examples/createOrUpdateJobCronResponse"
        "400":
          description: Malformed JSON body, or invalid request.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/createOrUpdateJobErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/createOrUpdateJobErrorResponse"
  /jobs/{jobId}:
    get:
      tags:
      - Job
      summary: Get scheduled job
      description: Jobs uri.  Returns a specific scheduled job.
      operationId: getJob
      parameters:
      - name: jobId
        in: path
        description: Job id
        required: true
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          Name of a credential domain of type OAuth2.0. The credential secret
          will be retrieved to impersonate a group-managed service account  for the
          current request.
        schema:
          type: string
      responses:
        "200":
          description: Successful responses
          headers:
            ETag:
              description: The entity tag for this job.
              schema:
                type: string
            Last-Modified:
              description: The HTTP-date string representing the timestamp of the
                last update to this job.
              schema:
                type: string
          content:
            application/vnd.sas.schedule.job+json:
              schema:
                $ref: "#/components/schemas/jobWithLinks"
              examples:
                json:
                  $ref: "#/components/examples/getJobResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/jobWithLinks"
              examples:
                json:
                  $ref: "#/components/examples/getJobResponse"
        "404":
          description: Resource not found.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getJobNotFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getJobNotFoundErrorResponse"
    head:
      tags:
      - Job
      summary: Test for a scheduled job
      description: Jobs uri.  Test for a specific scheduled job.
      operationId: headersForJob
      parameters:
      - name: jobId
        in: path
        description: Job id
        required: true
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          Name of a credential domain of type OAuth2.0. The credential secret
          will be retrieved to impersonate a group-managed service account  for the
          current request.
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          headers:
            ETag:
              description: The entity tag for this job.
              schema:
                type: string
            Last-Modified:
              description: The HTTP-date string representing the timestamp of the
                last update to this job.
              schema:
                type: string
        "404":
          description: Resource not found.
          headers:
            Content-Type:
              schema:
                type: string
    put:
      tags:
      - Job
      summary: Update a scheduled job
      description: |
        Update an existing scheduled job. The only attributes that can be
        updated are `name`, `description`, `group`, `jobTimeOut`, `request.body`,
        `request.headers`, and `triggers`; all others are ignored.

        The following fields are **immutable** and cannot be changed after job creation.
        Any values supplied for these fields in the request body are silently ignored:

        | Field | Description |
        |---|---|
        | `id` | The unique identifier assigned at creation. |
        | `runAs` | The identity under which the job runs; set from the authentication context and cannot be overridden. |
        | `request.uri` | The target URI of the scheduled request; fixed at creation time. |
        | `request.method` | The HTTP method of the scheduled request; fixed at creation time. |
        | `creationTimeStamp` | System-managed timestamp set when the job was first created. |
        | `createdBy` | The identity that created the job; set from the authentication context at creation. |
        | `modifiedTimeStamp` | System-managed timestamp updated automatically by the persistence layer on each save. |
        | `modifiedBy` | System-managed identity updated automatically by the audit layer on each save. |
      operationId: updateJob
      parameters:
      - name: jobId
        in: path
        description: Job id
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header of this job. Must match the current entity tag for the job.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: Ignored when `If-Match` is specified. The timestamp obtained
          from the most recent `Last-Modified` response header of this job. Must be
          later than or equal to the timestamp when the job was last modified.
        schema:
          type: string
      - name: parentFolderUri
        in: query
        description: The URI of the parent folder in which to save the scheduled job.
          If the scheduled job is in a different folder, it is moved to the specified
          parent folder.
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          Name of a credential domain of type OAuth2.0. The credential secret
          will be retrieved to impersonate a group-managed service account  for the
          current request.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.schedule.job+json:
            schema:
              $ref: "#/components/schemas/job"
            examples:
              json:
                $ref: "#/components/examples/createOrUpdateJobBody"
              daily:
                $ref: "#/components/examples/createOrUpdateJobDailyBody"
              timeEvent:
                $ref: "#/components/examples/createOrUpdateJobTimeEventBody"
          application/json:
            schema:
              $ref: "#/components/schemas/job"
            examples:
              json:
                $ref: "#/components/examples/createOrUpdateJobBody"
              daily:
                $ref: "#/components/examples/createOrUpdateJobDailyBody"
              timeEvent:
                $ref: "#/components/examples/createOrUpdateJobTimeEventBody"
        description: Job definition to be scheduled
        required: true
      responses:
        "200":
          description: Job updated
          headers:
            ETag:
              description: The entity tag for this job.
              schema:
                type: string
            Last-Modified:
              description: The HTTP-date string representing the timestamp of the
                last update to this job.
              schema:
                type: string
          content:
            application/vnd.sas.schedule.job+json:
              schema:
                $ref: "#/components/schemas/jobWithLinks"
              examples:
                json:
                  $ref: "#/components/examples/createOrUpdateJobResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/jobWithLinks"
              examples:
                json:
                  $ref: "#/components/examples/createOrUpdateJobResponse"
        "400":
          description: Malformed JSON body, or invalid request.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/createOrUpdateJobErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/createOrUpdateJobErrorResponse"
        "404":
          description: Job does not exist
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getJobNotFoundErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getJobNotFoundErrorResponse"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header was earlier than
            the resource's last modified timestamp.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/putJobPreconditionFailedErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/putJobPreconditionFailedErrorResponse"
        "428":
          description: The request was missing a `If-Match` or `If-Unmodified-Since`
            header.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/putJobPreconditionRequiredErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/putJobPreconditionRequiredErrorResponse"
    delete:
      tags:
      - Job
      summary: Delete scheduled job
      description: Jobs uri.  Deletes a specific scheduled job.
      operationId: deleteJob
      parameters:
      - name: jobId
        in: path
        description: Job id
        required: true
        schema:
          type: string
      - name: Delegate-Domain
        in: header
        description: >
          Name of a credential domain of type OAuth2.0. The credential secret
          will be retrieved to impersonate a group-managed service account  for the
          current request.
        schema:
          type: string
      responses:
        "204":
          description: Successful responses
        "404":
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getJobNotFoundErrorResponse"
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getJobNotFoundErrorResponse"
  /jobs/{jobId}#transfer:
    get:
      tags:
      - Transfer
      summary: Get scheduled job in transfer object format
      description: Returns a specific scheduled job in transfer object format.
      operationId: getJobAsTransfer
      parameters:
      - name: jobId
        in: path
        description: Job id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful responses
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/jobTransferObject"
              examples:
                json:
                  $ref: "#/components/examples/getJobTransferObjectResponse"
        "404":
          description: Resource not found.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/getJobNotFoundErrorResponse"
    put:
      tags:
      - Transfer
      summary: Create or update a scheduled job from a transfer object
      description: Create or update a scheduled job from a transfer object. All triggers
        associated with the job will be inactive by default.
      operationId: updateJobFromTransfer
      parameters:
      - name: jobId
        in: path
        description: Job id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/jobTransferObject"
            examples:
              json:
                $ref: "#/components/examples/getJobTransferObjectResponse"
        description: Scheduled job in transfer object format
        required: true
      responses:
        "200":
          description: A scheduled job is created from a transfer object
          headers:
            ETag:
              description: The entity tag for this job.
              schema:
                type: string
            Last-Modified:
              description: The HTTP-date string representing the timestamp of the
                last update to this job.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                json:
                  $ref: "#/components/examples/createOrUpdateJobTransferObjectResponse"
        "201":
          description: A scheduled job is updated from a transfer object
          headers:
            ETag:
              description: The entity tag for this job.
              schema:
                type: string
            Last-Modified:
              description: The HTTP-date string representing the timestamp of the
                last update to this job.
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                json:
                  $ref: "#/components/examples/createOrUpdateJobTransferObjectResponse"
        "400":
          description: Malformed JSON body, or invalid request.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
