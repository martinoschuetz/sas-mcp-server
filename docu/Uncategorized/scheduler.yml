            from:
              address: noone@sas.com
              personal: No One
            subject: Test Mail Subject From MailService
            textMessage: This is test Email from MailService running in SpringBoot!
        triggers:
        - name: Mail_Cron
          type: CRON
          cron: 0 0 8 ? * MON-FRI *
