      summary: Existence check image
      description: >
        Existence check for an image


        This operation uses an explicit format modifier
        ('.svg').  Doing so is to support the primary use case of embedding the
        link in a web page or other such context where the client cannot pass an
        'Accept:' header to specify the image type.


        This URL is secured, and valid only for the current user.


        By protocol, SVG images are always XML. The media type is always 'image/svg+xml'.
      operationId: headersForImage
      parameters:
      - name: imageId
        in: path
        required: true
        description: The system-generated ID returned with the completed job (in the
          'image' link).
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: Optional ETag. On a match, 304 (not modified) is returned.
