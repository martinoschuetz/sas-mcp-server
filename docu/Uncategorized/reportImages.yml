      responses:
        "200":
          description: The image is returned. Caching headers (Cache-Control, Expires,
            Pragma) are returned encouraging the browser to cache this image.
          headers:
            ETag:
              description: The entity tag for this image.
              schema:
                type: string
            Cache-Control:
              description: Header returned encouraging the browser to cache this image.
              schema:
                type: string
            Expires:
              description: Header returned encouraging the browser to cache this image.
              schema:
                type: string
            Pragma:
              description: Header returned encouraging the browser to cache this image.
              schema:
                type: string
          content:
