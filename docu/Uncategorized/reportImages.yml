servers:
- url: http://example.com/reportImages
  description: This is an example base URL.
components:
  parameters:
    reportUri:
      name: reportUri
      in: query
      required: true
      description: The report from which to generate images.
      schema:
        type: string
    layoutType:
      name: layoutType
      in: query
      required: false
      description: The type of image to render. <ul> <li><code>thumbnail</code> --
        selects a suitable report element and reduces the detail to better render
        at a smaller size. </li> <li><code>normal</code> -- selects a suitable report
        element, but there is no reduction of detail.</li> <li><code>entireSection</code>
        -- the entire section (page).</li> </ul>
      schema:
        type: string
        enum:
        - thumbnail
        - normal
        - entireSection
        default: thumbnail
    selectionType:
      name: selectionType
      in: query
      required: false
      description: The selected operation. <ul> <li><code>report</code> -- get a single
        image, representing the entire report. <li><code>perSection</code> -- get
        one image per section. <li><code>visualElements</code> -- specify the visual
        elements to render in parameter <code>visualElementNames</code> or <code>visualElementName</code>
        for the /directImage operation. </ul>
      schema:
        type: string
        enum:
        - report
        - perSection
        - visualElements
        default: report
    visualElementNames:
      name: visualElementNames
      in: query
      required: false
      description: If "selectionType=visualElements" is specified, this parameter
        lists the element names to render. Separate multiple elements with commas.
      schema:
        type: string
    visualElementName:
      name: visualElementName
      in: query
      required: false
      description: The report element to render.
      schema:
        type: string
    size:
      name: size
      in: query
      required: true
      description: The size of the rendered image. Format is <code><em>width</em><strong>x</strong><em>height</em></code>,
        with no spaces. For example, "268x151".
      schema:
        type: string
    wait:
      name: wait
      in: query
      required: false
      description: The number of seconds to wait for an update before returning from
        the "long poll". The maximum is 30 seconds.
      schema:
        type: number
        format: float
        default: 0.5
    refresh:
      name: refresh
      in: query
      required: false
      description: If true, bypass caches and generate a new image.
      schema:
        type: boolean
        default: false
    sectionIndex:
      name: sectionIndex
      in: query
      required: false
      description: The section to render. This parameter applies when <code>layoutType==entireSection</code>.
      schema:
        type: integer
        format: int32
        default: 0
    renderLimit:
      name: renderLimit
      in: query
      required: false
      description: Limit how many images to render. For no limit, set to -1. Clients
        can specify "1" to quickly get the first image and how many remaining images
        are available.
      schema:
        type: integer
        format: int32
        default: -1
    imageType:
      name: imageType
      in: query
      required: false
      description: In addition to the default "svg" for SVG image generation, "png"
        is now supported and results in a png image being created.
      schema:
        type: string
        default: svg
        enum:
        - svg
        - png
    staleImageAllowed:
      name: staleImageAllowed
      in: query
      required: false
      description: If available, should a "stale" image be returned? (when returned,
        it will be with link relation "staleImage", and the job will continue running
        to generate the image). This parameter is introduced in 2023.03.
      schema:
        type: boolean
        default: true
    style:
      name: style
      in: query
      required: false
      description: The only non-empty value supported is "highContrast", which results
        in a high contrast image being rendered.
      schema:
        type: string
        enum:
        - (null/empty string)
        - highContrast
    timeout:
      name: timeout
      in: query
      required: false
      description: Job timeout in seconds, default = -1 which means system default
        timeout, typically 2 minutes.
      schema:
        type: integer
    Accept-Language:
      name: Accept-Language
      in: header
      description: The user's locale. For non-thumbnail operations, this locale is
        a factor for both rendering and caching. For thumbnail requests, typically
        only the right-to-left aspect is considered. Thumbnails do not typically include
        localizable content, and consequently are shareable among users with different
        locales. For details, see <a href="https://tools.ietf.org/html/rfc7231#section-5.3.5"
        target="_blank">Accept-Language</a>.
      required: false
      schema:
        type: string
    Accept-Locale:
      name: Accept-Locale
      in: header
      description: A "format locale" distinct from the user's language (Accept-Language).
        Usage and syntax is similar to Accept-Language.
      required: false
      schema:
        type: string
  responses:
    badRequestError:
      description: The request was invalid.
      content:
        application/vnd.sas.error+json;version=2:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            report not found:
              $ref: "#/components/examples/reportNotFound"
        application/json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            report not found:
              $ref: "#/components/examples/reportNotFound"
      headers:
        Content-Type:
          schema:
            type: string
    missingParameterError:
      description: A required parameter is missing.
      content:
        application/vnd.sas.error+json;version=2:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            report not found:
              $ref: "#/components/examples/reportUriMissing"
        application/json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            report not found:
              $ref: "#/components/examples/reportUriMissing"
      headers:
        Content-Type:
          schema:
            type: string
    reportNotFound:
      description: The report could not be found.
      content:
        application/vnd.sas.error+json;version=2:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            report not found:
              $ref: "#/components/examples/reportNotFound"
        application/json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            report not found:
              $ref: "#/components/examples/reportNotFound"
      headers:
        Content-Type:
          schema:
            type: string
    jobNotFound:
      description: The job could not be found.
      content:
        application/vnd.sas.error+json;version=2:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            report not found:
              $ref: "#/components/examples/jobNotFound"
        application/json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            report not found:
              $ref: "#/components/examples/jobNotFound"
      headers:
        Content-Type:
          schema:
            type: string
  schemas:
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    job:
      title: The Operation to Create Images
      description: Primary media type of this service. This media type represents
        the job to obtain the requested images. When the job is completed, the images
        element contains one object per image returned. Each object contains metadata
        about the image such as section, name, and size, and also a link to get the
        actual image and other relevant links. After the "report analysis" phase is
        complete, the metadata for each image is available (excepting the URI to get
        the image). A client can use this metadata to know that image 1 is a pie chart,
        image 2 is a bar chart, and image 3 is a table, possibly showing a facsimile
        if several seconds pass and the job has not completed.
      x-sas-media-type:
        name: application/vnd.sas.report.images.job
        version: 2
      required:
      - id
      - state
      - creationTimeStamp
      - version
      properties:
        id:
          type: string
          description: The unique identifier of this job.
        state:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          description: The overall state of this job.  "Completed" and "failed" are
            the terminal states.
        duration:
          type: number
          format: float
          description: How many seconds to complete this job. Returned with completed
            and failed jobs.
        creationTimeStamp:
          type: string
          description: When the job was created.
          format: date-time
        pagingState:
          $ref: "#/components/schemas/pagingState"
        error:
          $ref: "#/components/schemas/error2"
        images:
          type: array
          description: An array of image detail, one array for each image this job
            produces. After the report analysis phase completes, this array contains
            the image metadata, missing only the retrieval link to be complete.
          items:
            $ref: "#/components/schemas/imageDetail"
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 2. If the client specifies version=1, the "modifiedTimeStamp"
            member is not included with the associated images, and an early return
            with a "cached" image will not occur.
      example:
        id: d145d576-78d0-42d4-a5fc-569cd0533903
        version: 2
        state: running
        durationMSec: 155
        creationTimeStamp: 2017-11-17T18:46:59.774000Z
        links:
        - method: GET
          rel: self
          href: /reportImages/jobs/d145d576-78d0-42d4-a5fc-569cd0533903
          uri: /reportImages/jobs/d145d576-78d0-42d4-a5fc-569cd0533903
          type: application/vnd.sas.report.images.job+json
        - method: GET
          rel: state
          href: /reportImages/jobs/d145d576-78d0-42d4-a5fc-569cd0533903/state
          uri: /reportImages/jobs/d145d576-78d0-42d4-a5fc-569cd0533903/state
          type: text/plain
        images:
        - sectionIndex: 0
          sectionName: vi6
          sectionLabel: Page 1
          elementName: ve41
          modifiedTimeStamp: 2017-11-16T18:19:23.600000Z
          visualType: Table
          size: 268x151
          state: completed
          links:
          - method: GET
            rel: image
            href: /reportImages/images/K738605462B1380786238.svg
            uri: /reportImages/images/K738605462B1380786238.svg
            type: image/svg+xml
        - sectionIndex: 1
          sectionName: vi47
          sectionLabel: Page 2
          elementName: ve50
          modifiedTimeStamp: 2017-11-12T14:05:13.450000Z
          visualType: pie
          size: 268x151
          state: running
          links:
          - method: GET
            rel: staleImage
            href: /reportImages/images/K738605462B1234567890.svg
            uri: /reportImages/images/K738605462B1234567890.svg
            type: image/svg+xml
    imageDetail:
      title: Describes an Individual Image
      description: Metadata about the image, including state and links. Terminal states
        are "completed" and "failed". Completed images have link relation "image"
        to download the image; the URI is suitable for a browser's IMG tag.
      required:
      - sectionIndex
      - sectionName
      - sectionLabel
      - elementName
      - visualType
      - size
      - state
      properties:
        sectionIndex:
          type: integer
          format: int32
          description: The section (page, 0-based) of this report from which this
            image came.
        sectionName:
          type: string
          description: The internal name of the section.
        sectionLabel:
          type: string
          description: The user label of the section.
        elementName:
          type: string
          description: The internal name of the element this image represents.
        visualType:
          type: string
          description: 'The type of the element. For a graph, it is the graphType.
            For example: "pie" or "bar". For a section, it is "Section". For a composite
            (such as linear regression) the type is "Composite".  For a table or crosstable,
            the type is "Table" and "Crosstab", respectively.  For a text-only element,
            it is "Text". These types come from the report definition.'
        size:
          type: string
          description: The requested size. For example, "268x151".
        state:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - ignored
          description: "The state of this job.  Terminal states: completed, failed,\
            \ ignored."
        modifiedTimeStamp:
          type: string
          description: The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format of when
            the referenced image was last updated. This member is  present only when
            a link to an image is also present (either `image` or `staleImage`), and
            indicates the modified time of that image. This member was not available
            in version 1 of this media type.
          format: date-time
        error:
          $ref: "#/components/schemas/error2"
        links:
          type: array
          description: An array of links for retrieving the image or initiating a
            new job. Expect link relation "image". The "image" URI is how the SVG
            (or PNG) image is retrieved.
          items:
            $ref: "#/components/schemas/link"
      example:
        sectionIndex: 0
        sectionName: vi6
        sectionLabel: Page 1
        elementName: ve41
        modifiedTimeStamp: 2017-11-16T18:19:23.600000Z
        visualType: Table
        size: 268x151
        state: completed
        links:
        - method: GET
          rel: image
          href: /reportImages/images/K738605462B1380786238.svg
          uri: /reportImages/images/K738605462B1380786238.svg
          type: image/svg+xml
        - method: GET
          rel: staleImage
          href: /reportImages/images/K738605462B1234567890.svg
          uri: /reportImages/images/K738605462B1234567890.svg
          type: image/svg+xml
    jobRequest:
      type: object
      title: Job Request Details
      description: This represents the input to create the job to get the image(s).
        Parameters "reportUri" and "size" are required. A version of the [createJob
        resource](#op:createJobWithParams) exists that takes all of these values as
        request parameters.
      x-sas-media-type:
        name: application/vnd.sas.report.images.job.request
        version: 3
      required:
      - reportUri
      properties:
        reportUri:
          type: string
          description: The report from which to generate images.
        layoutType:
          type: string
          enum:
          - thumbnail
          - normal
          - entireSection
          default: thumbnail
          description: The type of image.
        selectionType:
          type: string
          enum:
          - report
          - perSection
          - visualElements
          - paging
          default: report
          description: >-
            The type of operation selected.

            -"report" gets a single image that represents the entire report.

            -"perSection" gets one image per section.

            -"visualElements" enables the caller to specify the visual elements to
            render (in parameter "visualElementNames").
        size:
          type: string
          description: The image size. Format is <code><em>width</em><strong>x</strong><em>height</em></code>,
            with no spaces. For example, "268x151".
        imageType:
          type: string
          enum:
          - svg
          - png
          description: (v3) the image's type. "svg" (default), or "png".
        specificVisualElements:
          type: array
          description: An array of name/size pairs, each representing a visual element
            to render.
          items:
            $ref: "#/components/schemas/nameAndSize"
        sectionIndex:
          type: integer
          format: int32
          default: 0
          description: The section (page) to render. Applies only when layoutType==entireSection.
        refresh:
          type: boolean
          default: false
          description: If true, bypass caches and generate a new image.
        renderLimit:
          type: integer
          format: int32
          default: -1
          description: Limit how many images to render. For no limit, set to -1. Clients
            can specify "1" to quickly get the first image and how many remaining
            images are available.
        pagingOptions:
          $ref: "#/components/schemas/pagingOptions"
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 3.
      example:
        version: 3
        reportUri: /reports/reports/ffdfe936-80a9-4969-a786-4a314df13f3f
        layoutType: thumbnail
        size: 268x151
        refresh: true
    nameAndSize:
      type: object
      title: Report Element Name and Size
      description: Report element name and size.
      required:
      - name
      - size
      properties:
        name:
          type: string
          description: The report element name.
        size:
          type: string
          description: The image size. For example, "268x151".
      example:
        name: ve41
        size: 268x151
    pagingOptions:
      title: Paging Options
      description: >
        Paging details for page-oriented requests. Note when included in a request,
        must be null
        if "returnMultiple" is false, must not be null if "returnMultiple" is true.
      type: object
      required:
      - start
      - limit
      properties:
        start:
          type: integer
          description: Start index, 0-based, of the first thumbnail to return.
        limit:
          type: integer
          description: Number of thumbnails to return in a single "page".
    pagingState:
      title: Paging State
      description: Object returned if paging had been requested
      type: object
      required:
      - start
      - limit
      - count
      properties:
        start:
          type: integer
          description: start index (0-based) of the first thumbnai.
        limit:
          type: integer
          description: number of thumbnails returned in a single "page"
        count:
          type: integer
          description: number of available thumbnails.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    thumbnailJob:
      title: Thumbnail Job
      description: The representation of a thumbnail job.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.job
        version: 1
      required:
      - id
      - state
      - links
      - version
      properties:
        id:
          type: string
          description: The generated id for this job.
        state:
          type: string
          description: The state of this job.
          enum:
          - pending
          - running
          - completed
          - failed
        thumbnails:
          type: array
          description: Thumbnail objects, typically 1 unless paging had been requested.
          items:
            $ref: "#/components/schemas/thumbnail"
        error:
          $ref: "#/components/schemas/error2"
        duration:
          type: number
          format: float
          description: duration, in seconds, of the job.
        defaultThumbnailSasThemesIconKey:
          type: string
          description: >
            A number of fully themed "icons" are available within SAS Clients. If
            provided, this is that representation and
            should be used in preference to the the image specified by link relation
            "defaultThumbnailImage".
        pagingState:
          $ref: "#/components/schemas/pagingState"
        links:
          type: array
          description: Link relations for this job. Expect 'self' and 'defaultThumbnailImage'.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          format: int32
          description: The version number of the thumbnail job. This representation
            is version 1.
    thumbnailRequest:
      title: Thumbnail Request
      description: A request to create a new job that creates or delivers a thumbnail.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.job.request
      required:
      - acceptItem
      - resourceUri
      properties:
        acceptItem:
          type: string
          description: >
            A media type string listing acceptable media types, possibly with quality
            values. Example:
            "image/*,text/plain;q=0.9,text/csv;q=0.8".
        resourceUri:
          type: string
          description: URI to the resource for which a thumbnail is needed.
        resourceType:
          type: string
          description: The SAS type of the resource for which a thumbnail is needed.
        detailLevel:
          type: string
          description: The expected level of detail. (default is "low")
          default: "low"
          enum:
          - low
          - high
        scope:
          type: string
          description: Whether a single element is to be represented, or the entire
            page. (default is "element")
          default: "element"
          enum:
          - element
          - page
        returnMultiple:
          type: boolean
          description: Whether a single thumbnail is to be returned (false) or multiple
            thumbnails (true). (default is false)
          default: false
        refresh:
          type: boolean
          description: Whether the freshest possible result is requested. (default
            is false)
          default: false
        sizingOptions:
          $ref: "#/components/schemas/sizingOptions"
        accessibilityOptions:
          $ref: "#/components/schemas/accessibilityOptions"
        themeId:
          type: string
          description: The client's current theme.
        pagingOptions:
          $ref: "#/components/schemas/pagingOptions"
        version:
          type: integer
          format: int32
          description: The version number of the thumbnail representation. This representation
            is version 1.
    accessibilityOptions:
      title: Accessibility Options
      description: This object describes accessibility requests; providers are not
        required to honor this
      type: object
      properties:
        highContrast:
          type: boolean
          default: false
          description: indicates whether "high contrast" visual adjustments are desired.
            (default is false)
    thumbnail:
      title: Thumbnail
      description: Information for retrieving a thumbnail.
      required:
      - state
      properties:
        state:
          type: string
          description: the state of this thumbnail
          enum:
          - pending
          - running
          - completed
          - failed
        error:
          $ref: "#/components/schemas/error2"
        modifiedTimeStamp:
          type: string
          description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format when
            the thumbnail was last modified.
          format: date-time
        links:
          type: array
          description: >
            Link relations for this thumbnail. Expect: 'thumbnail' (the thumbnail
            to pick up) and 'staleThumbnail' (an older
            thumbnail that can be picked up while a more current thumbnail is being
            prepared)
          items:
            $ref: "#/components/schemas/link"
    sizingOptions:
      title: Sizing Options
      description: >
        Sizing options; providers should honor values suitable to the type of object
        for which they provide thumbnails, and
        clients should supply values suitable to their presentation needs.
      type: object
      properties:
        viewWidth:
          type: integer
          description: CSS Pixel image width.
        viewHeight:
          type: integer
          description: CSS Pixel image height.
        devicePixelRatio:
          type: number
          format: float
          default: 1.0
          description: device pixel ratio; some mobile devices support values greater
            than 1. (default is 1.0)
        maxTextCharacters:
          type: integer
          description: if plain text is returned, the maximum number of characters
            to return.
        maxTableColumns:
          type: integer
          description: if a table or other CSV presentation is returned, the maximum
            number of columns to return.
        maxTableRows:
          type: integer
          description: if a table or other CSV presentation is returned, the maximum
            number of rows to return.
  examples:
    jobResponseAccepted:
      description: >
        The response body for a "report images" (not "thumbnails") job which is not
        complete and is running asynchronously.
        Note that the "state" can be "pending" or "running", it will not be "complete"
        or "error".
      value: {"id": "dd062f55-de56-4af2-8a8d-5cc99f017eaf", "state": "pending", "creationTimeStamp": "2023-11-02T17:39:49.178329315Z",
        "version": 2, "links": [{"method": "GET", "rel": "self", "href": "/reportImages/jobs/dd062f55-de56-4af2-8a8d-5cc99f017eaf",
            "uri": "/reportImages/jobs/dd062f55-de56-4af2-8a8d-5cc99f017eaf", "type": "application/vnd.sas.report.images.job"},
          {"method": "GET", "rel": "state", "href": "/reportImages/jobs/dd062f55-de56-4af2-8a8d-5cc99f017eaf/state",
            "uri": "/reportImages/jobs/dd062f55-de56-4af2-8a8d-5cc99f017eaf/state",
            "type": "text/plain"}]}
    reportUriMissing:
      description: >
        Bad request, required parameter 'reportUri' is missing.
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 22015, "message": "report\
          \ uri is missing", "details": ["path: /reportImages/...", "correlator: 6436e29d-9f56-4371-9e9a-23fa07cb4aa5"]}
    jobRequestBody:
      description: >
        job request body
      value: {"reportUri": "/reports/reports/24b7d0a7-a0a0-493b-8fcb-afbf92c8a017",
        "layoutType": "thumbnail", "imageType": "svg", "selectionType": "report",
        "size": "176x99", "version": 1, "refresh": false}
    reportNotFound:
      description: >
        Bad request, the report cannot be read.
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 22010, "message": "Failed\
          \ reading report, status: 404.", "details": ["path: /reportImages/...",
          "correlator: 99921b54-a671-4a4d-882a-911ef7dc66b2"]}
    deleteNotAuthorized:
      description: >
        This operation requires being an administrator and the user is not.  403 (Not
        Authorized) can occur on any
        endpoint and is usually not documented; but because this endpoint is special
        this documentation might be
        helpful
      value: no response body for delete
    jobResponseComplete:
      description: >
        The response body for a "report images" (not "thumbnails") job which has completed.
      value: {"id": "dd062f55-de56-4af2-8a8d-5cc99f017eaf", "state": "completed",
        "duration": 2.284, "creationTimeStamp": "2023-11-02T17:39:49.178329315Z",
        "images": [{"sectionIndex": 0, "sectionName": "vi6", "sectionLabel": "Page\
              \ 1", "elementName": "ve20", "visualType": "bar", "size": "1760x990",
            "state": "completed", "modifiedTimeStamp": "2023-11-02T17:39:51.437795974Z",
            "links": [{"method": "GET", "rel": "image", "href": "/reportImages/images/U2760400494C1721799964.svg",
                "uri": "/reportImages/images/U2760400494C1721799964.svg", "type": "image/svg+xml"}]}],
        "version": 2, "links": [{"method": "GET", "rel": "self", "href": "/reportImages/jobs/dd062f55-de56-4af2-8a8d-5cc99f017eaf",
            "uri": "/reportImages/jobs/dd062f55-de56-4af2-8a8d-5cc99f017eaf", "type": "application/vnd.sas.report.images.job"},
          {"method": "GET", "rel": "state", "href": "/reportImages/jobs/dd062f55-de56-4af2-8a8d-5cc99f017eaf/state",
            "uri": "/reportImages/jobs/dd062f55-de56-4af2-8a8d-5cc99f017eaf/state",
            "type": "text/plain"}]}
    pickupImageNotFound:
      description: >
        The pickup image was not found. This is unusual because in the primary use
        case, that image URI was
        just returned from the job.  Note the path will be the failed path, it could
        have been a png or svg.
      value: {"version": 2, "httpStatusCode": 400, "errorCode": 22015, "message": "record\
          \ not found", "details": ["pickup Record", "path: /reportImages/images/U2760400494C425435426.svg",
          "correlator: a1fdd596-dce0-4dcc-acad-8e1487436e08"]}
    jobNotFound:
      description: >
        the job was not found.
      value: {"version": 2, "httpStatusCode": 404, "errorCode": 22012, "message": "record\
          \ not found", "details": ["jobId: dd062f55-de56-4af2-8a8d-5cc99f017eae",
          "path: /reportImages/jobs/dd062f55-de56-4af2-8a8d-5cc99f017eae", "correlator:\
            \ 0368adb8-8d72-471b-9929-f78f77c1a3cb"]}
    jobState:
      description: >
        The state of the job, as plain/text.  There are no known uses of this at this
        time.
      value: completed
    getViaPost_reportSummary:
      description: >
        Report Summary from supplied BIRD (likely from a report being edited). The
        summary is often an empty string (reports don't have a report summary by default).
      value: This report calculates kumquats per acre.
    rootLinks:
      description: >
        Root links
      value: {"links": [{"method": "POST", "rel": "createJob", "href": "/reportImages/jobs",
            "uri": "/reportImages/jobs", "type": "application/vnd.sas.report.images.job.request",
            "responseType": "application/vnd.sas.report.images.job"}, {"method": "POST",
            "rel": "createJobWithParameters", "href": "/reportImages/jobs", "uri": "/reportImages/jobs",
            "responseType": "application/vnd.sas.report.images.job"}, {"method": "POST",
            "rel": "createJobReportBody", "href": "/reportImages/jobs", "uri": "/reportImages/jobs",
            "type": "application/vnd.sas.report.content", "responseType": "application/vnd.sas.report.images.job"},
          {"method": "DELETE", "rel": "deleteForReport", "href": "/reportImages/images?reportUri={reportUri}",
            "uri": "/reportImages/images?reportUri={reportUri}"}, {"method": "DELETE",
            "rel": "deleteAll", "href": "/reportImages/images", "uri": "/reportImages/images"},
          {"method": "GET", "rel": "settings", "href": "/reportImages/commons/settings",
            "uri": "/reportImages/commons/settings", "type": "application/vnd.sas.attributes"},
          {"method": "GET", "rel": "reportSummary", "href": "/reportImages/reportSummary?reportUri={reportUri}",
            "uri": "/reportImages/reportSummary?reportUri={reportUri}", "type": "text/plain"}],
        "version": 1}
    thumbJobResponseComplete:
      description: >
        The response body for a "thumbnails" job which has completed.
      value: {"id": "41619853-9db4-477a-b7fe-39618c92b75c", "state": "completed",
        "thumbnails": [{"state": "completed", "modifiedTimeStamp": "2023-11-02T17:19:55.994599312Z",
            "links": [{"method": "GET", "rel": "thumbnail", "href": "/reportImages/images/U2760400494C2036456495.svg",
                "uri": "/reportImages/images/U2760400494C2036456495.svg", "type": "image/svg+xml"}]}],
        "duration": 2.009, "defaultThumbnailSasThemesIconKey": "sas.icons.HC.TILEZEROSTATE",
        "version": 1, "links": [{"method": "GET", "rel": "self", "href": "/reportImages/jobs/41619853-9db4-477a-b7fe-39618c92b75c",
            "uri": "/reportImages/jobs/41619853-9db4-477a-b7fe-39618c92b75c", "type": "application/vnd.sas.thumbnails.job"},
          {"method": "GET", "rel": "defaultThumbnailImage", "href": "/reportImages/defaultReportThumbnail.svg",
            "uri": "/reportImages/defaultReportThumbnail.svg", "type": "image/svg+xml"}]}
    thumbJobResponseAccepted:
      description: >
        The response body for a "thumbnails" job which is not complete and is running
        asynchronously.  Note that
        the "state" can be "pending" or "running", it will not be "complete" or "error".
      value: {"id": "b1300cd4-f6df-4de8-9031-f303cbb3f78b", "state": "pending", "defaultThumbnailSasThemesIconKey": "sas.icons.HC.TILEZEROSTATE",
        "version": 1, "links": [{"method": "GET", "rel": "self", "href": "/reportImages/jobs/b1300cd4-f6df-4de8-9031-f303cbb3f78b",
            "uri": "/reportImages/jobs/b1300cd4-f6df-4de8-9031-f303cbb3f78b", "type": "application/vnd.sas.thumbnails.job"},
          {"method": "GET", "rel": "defaultThumbnailImage", "href": "/reportImages/defaultReportThumbnail.svg",
            "uri": "/reportImages/defaultReportThumbnail.svg", "type": "image/svg+xml"}]}
    reportSummary:
      description: >
        Correct response from a /reportSummary request. This is often an empty string
        (reports don't have a report summary by default).
      value: This report calculates kumquats per acre.
    thumbJobRequestBody:
      description: >
        The request body for a "thumbnails" job (this is what SAS Drive uses and is
        the most typical use).
      value: {"acceptItem": "image/*,text/plain,text/csv,*/*;0.8", "resourceUri": "/reports/reports/24b7d0a7-a0a0-493b-8fcb-afbf92c8a017",
        "resourceType": "report", "returnMultiple": false, "detail": "low", "scope": "element",
        "sizingOptions": {"viewWidth": 268, "viewHeight": 151, "devicePixelRatio": 1.1,
          "maxTextCharacters": 100, "maxTableColumns": 3, "maxTableRows": 5}, "accessibilityOptions": {
          "highContrast": true}, "refresh": false}
    thumbnailsReportNotFound:
      description: >
        Thumbnails request failed, error follows the thumbnails provider contract
        (note
        "defaultThumbnailSasThemesIconKey" and link "defaultThumbnailImage".
      value: {"id": "5a4d7128-bb67-49e8-b353-1f03db5f86b9", "state": "failed", "error": {
          "version": 2, "httpStatusCode": 400, "errorCode": 22010, "message": "Failed\
            \ reading report, status: 404.", "details": ["correlator: 9f57a9d5-ca67-45bc-919f-100e6178e691"]},
        "duration": 0.033, "defaultThumbnailSasThemesIconKey": "sas.icons.HC.TILEZEROSTATE",
        "version": 1, "links": [{"method": "GET", "rel": "self", "href": "/reportImages/jobs/5a4d7128-bb67-49e8-b353-1f03db5f86b9",
            "uri": "/reportImages/jobs/5a4d7128-bb67-49e8-b353-1f03db5f86b9", "type": "application/vnd.sas.thumbnails.job"},
          {"method": "GET", "rel": "defaultThumbnailImage", "href": "/reportImages/defaultReportThumbnail.svg",
            "uri": "/reportImages/defaultReportThumbnail.svg", "type": "image/svg+xml"}]}
