                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        "428":
          description: The request headers did not include a `If-Match` precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
    delete:
      tags:
      - Score Definitions
      summary: Delete a score definition
      description: Deletes the specified score definition.
      operationId: deleteScoreDefinition
      parameters:
      - name: definitionId
        description: The unique identifier for the score definition.
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The score definition was deleted.
