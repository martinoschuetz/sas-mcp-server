openapi: 3.0.3
info:
  version: "3"
  title: Score Definitions
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  description: The Score Definitions API is used for creating and maintaining score
    definitions.
servers:
- url: "https://example.com/scoreDefinitions"
  description: This is an example of a base URL.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Score Definitions
  description: "Contains operations to create, read, update, and delete score definitions."
- name: Code
  description: Contains operations for generating code.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
    head:
      tags:
      - Root
      summary: Get the headers for the API
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
  /definitions:
    get:
      tags:
      - Score Definitions
      summary: Get a collection of the score definitions
      description: "Returns a list of the score definitions based on the specified\
        \ pagination, filtering, and sorting options. The items in the list depend\
        \ on the `Accept-Item` header."
      operationId: getScoreDefinitions
      parameters:
      - name: Accept-Item
        description: Used for selecting the desired item representation.
        in: header
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.score.definition+json
          - application/vnd.sas.score.definition.summary+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.summary+json
      - name: start
        description: Returns the index of the first score definition.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: Returns the maximum number of score definitions.
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      - name: filter
        in: query
        description: "The criteria used for filtering the score definitions. See [Filtering\
          \ in REST APIs](https://developer.sas.com/rest-apis/scoreDefinitions-v3/docs/getting-started/usage-notes#filtering)."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "The criteria used for sorting the score definitions. See [Sorting\
          \ in REST APIs](https://developer.sas.com/rest-apis/scoreDefinitions-v3/docs/getting-started/usage-notes#sorting)."
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/scoreDefinitionCollection"
              examples:
                default:
                  $ref: "#/components/examples/scoreDefinitionList"
            application/json:
              schema:
                $ref: "#/components/schemas/scoreDefinitionCollection"
              examples:
                default:
                  $ref: "#/components/examples/scoreDefinitionList"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
    post:
      tags:
      - Score Definitions
      summary: Create a new score definition
      description: Creates a new score definition based on the representation in the
        request body.
      operationId: createScoreDefinition
      parameters:
      - name: parentFolderUri
        in: query
        description: Adds the score definition as a member of a folder.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.score.definition+json:
            schema:
              $ref: "#/components/schemas/scoreDefinition"
            examples:
              default:
                $ref: "#/components/examples/scoreDefinitionFull"
          application/json:
            schema:
              $ref: "#/components/schemas/scoreDefinition"
            examples:
              default:
                $ref: "#/components/examples/scoreDefinitionFull"
        description: Score definition details that need to be created.
        required: true
      responses:
        "201":
          description: A score definition was created.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Location:
              description: The URL of the score definition.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the score definition.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp when the score definition was last modified.\
                \ The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`."
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.score.definition+json:
              schema:
                $ref: "#/components/schemas/scoreDefinition"
              examples:
                default:
                  $ref: "#/components/examples/scoreDefinitionFull"
            application/json:
              schema:
                $ref: "#/components/schemas/scoreDefinition"
              examples:
                default:
                  $ref: "#/components/examples/scoreDefinitionFull"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.score.definition+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
  "/definitions/{definitionId}":
    get:
      tags:
