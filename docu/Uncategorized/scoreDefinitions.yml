      operationId: headersForScoreDefinition
      parameters:
      - name: definitionId
        description: The unique identifier for the score definition.
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            ETag:
              description: The entity tag for the score definition.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp when the score definition was last modified.\
                \ The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`."
              schema:
                type: string
                format: date-time
        "404":
          description: No score definition exists at the requested path.
    put:
      tags:
      - Score Definitions
      summary: Update a score definition
      description: Updates the specified score definition based on the representation
        in the request body.
      operationId: updateScoreDefinition
      parameters:
      - name: definitionId
        description: The unique identifier for the score definition.
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the score definition.
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.score.definition+json:
            schema:
              $ref: "#/components/schemas/scoreDefinition"
            examples:
              default:
                $ref: "#/components/examples/scoreDefinitionFull"
          application/json:
            schema:
              $ref: "#/components/schemas/scoreDefinition"
            examples:
              default:
                $ref: "#/components/examples/scoreDefinitionFull"
        description: The representation of a score definition.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            ETag:
              description: The entity tag for the score definition.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp when the score definition was last modified.\
                \ The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`."
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.score.definition+json:
              schema:
                $ref: "#/components/schemas/scoreDefinition"
              examples:
                default:
                  $ref: "#/components/examples/scoreDefinitionFull"
            application/json:
              schema:
                $ref: "#/components/schemas/scoreDefinition"
              examples:
                default:
                  $ref: "#/components/examples/scoreDefinitionFull"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.score.definition+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No score definition exists at the requested path.
          content:
            application/vnd.sas.score.definition+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "412":
          description: The `If-Match` request header did not match the resource's
