            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    head:
      tags:
      - Score Definitions
      summary: Get the headers for a score definition
      description: Returns the headers for the specified score definition. Also used
