---
openapi: 3.0.3
info:
  description: >
    The forecasting pipelines API provides forecasting-specific
    functionality around Analytics Pipelines (see analyticsPipelines).
    This includes the ability to fetch pipeline/component results, publish
    pipeline results to another location, and set the champion pipeline.
  version: "3"
  title: Forecasting Pipelines
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: https://support.sas.com/techsup/license/index.html
tags:
- name: Pipeline Comparison
  description: The operations for pipeline comparison.
- name: Components
  description: The operations for the component resource.
- name: Pipelines
  description: The operations for the pipeline resource.
- name: Root
  description: The operations for the root resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the API object
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootResponse"
          headers:
            Last-Modified:
              description: Timestamp of the last modification.
              schema:
                type: string
    head:
      tags:
      - Root
      summary: Check presence of service
      description: Allows clients to check if this service is up and responding to
        requests.
      operationId: headersForRoot
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                type: object
              examples:
                json:
                  $ref: "#/components/examples/rootResponse"
            application/json:
              schema:
                type: object
              examples:
                json:
                  $ref: "#/components/examples/rootResponse"
          headers:
            Last-Modified:
              description: Timestamp of the last modification.
              schema:
                type: string
  /comparison:
    post:
      tags:
      - Pipeline Comparison
      summary: Compare pipelines
      description: Compares the given pipelines to determine which one produced the
        most accurate results.
      operationId: createComparison
      requestBody:
        content:
          application/vnd.sas.forecasting.pipeline.comparison.request+json:
            schema:
              $ref: "#/components/schemas/pipelineComparisonRequest"
            examples:
              json:
                $ref: "#/components/examples/comparePipelinesForChampRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/pipelineComparisonRequest"
            examples:
              json:
                $ref: "#/components/examples/comparePipelinesForChampRequest"
        description: Request specifying the pipelines and stat to be used to compare
          them
        required: true
      responses:
        "200":
          description: Comparison completed successfully and champion pipeline is
            returned in response body
          content:
            application/vnd.sas.analytics.pipeline+json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/cmpPipelinesForChamp"
            application/json:
              schema:
                $ref: "#/components/schemas/pipeline"
              examples:
                default:
                  $ref: "#/components/examples/cmpPipelinesForChamp"
          headers:
            Last-Modified:
              description: Timestamp of the last modification.
              schema:
                type: string
        "400":
          description: Request body is invalid or incomplete. If none of the given
            pipelines contain valid results, status 400 with code 75508 will occur.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/status400Response"
  /comparison/results:
    get:
      tags:
      - Pipeline Comparison
      summary: Get pipeline comparison results
      description: Fetches the pipeline comparison results and returns them as a collection
        of analytics reports.
      operationId: getComparisonResults
      parameters:
      - name: projectId
        in: query
        description: ID of the project containing the pipelines for which results
          are desired
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: "Query used to filter the collection. Valid fields are the parameters\
          \ in the pipeline summary statistics table. E.g. to fetch results for selected\
          \ pipelines 1 and 2: `in(id, 'pipeline-id-1', 'pipeline-id-2')`"
        required: false
        schema:
          type: string
      - name: compare
        in: query
        description: Whether or not to generate normalized analytics reports for the
          given selection (i.e. use same range for both X- and Y-axes)
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Comparison results returned successfully
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/analyticsReportCollection"
              examples:
                default:
                  $ref: "#/components/examples/cmpPipelines"
            application/json:
              schema:
                $ref: "#/components/schemas/analyticsReportCollection"
              examples:
                default:
                  $ref: "#/components/examples/cmpPipelines"
          headers:
            Last-Modified:
              description: Timestamp of the last modification.
              schema:
                type: string
        "404":
          description: No component result found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/status404Response"
  /comparison/table:
    get:
      tags:
      - Pipeline Comparison
      summary: Get pipeline comparison table
      description: Fetches the pipeline comparison results. These include summary
        statistics for each pipeline within the given parent project and whether or
        not each pipeline is currently the champion.
      operationId: getComparisonTable
      parameters:
      - name: projectId
        in: query
        description: ID of the project containing the pipelines
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Comparison results returned successfully
          content:
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/cmpTableResp"
            application/json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/cmpTableResp"
          headers:
            Last-Modified:
              description: Timestamp of the last modification.
              schema:
                type: string
        "404":
          description: No component result found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/status404Response"
  "/pipelines/{pipelineId}/components/{componentId}/results":
    get:
      tags:
      - Components
      summary: Get component results
      description: Fetches the component results and returns them as a collection
        of analytics reports.
      operationId: getComponentResults
      parameters:
      - name: pipelineId
        in: path
        description: ID of the pipeline containing the component
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: ID of the component for which results are desired
        required: true
        schema:
          type: string
      - name: matrix
        in: query
        description: Whether or not to organize the results into a grid
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Component results returned successfully. Items in the collection
            will be application/vnd.sas.analytics.report+json.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/analyticsReportCollection"
              examples:
                default:
                  $ref: "#/components/examples/componentResults"
            application/json:
              schema:
                $ref: "#/components/schemas/analyticsReportCollection"
              examples:
                default:
                  $ref: "#/components/examples/componentResults"
          headers:
            Last-Modified:
              description: Timestamp of the last modification.
              schema:
                type: string
        "404":
          description: No component result found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/status404Response"
    head:
      tags:
      - Components
      summary: Component results check
      description: Checks if component results exist
      operationId: headersForResults
      parameters:
      - name: pipelineId
        in: path
        description: ID of the pipeline containing the component
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: ID of the component for which results are desired
        required: true
        schema:
          type: string
      - name: matrix
        in: query
        description: Whether or not to organize the results into a grid
        required: false
        schema:
          type: boolean
          default: false
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the results.
        schema:
          type: string
      - name: Last-Modified
        in: header
        description: The modification timestamp from the most recent response header.
          Must match the current timestamp for the results.
        schema:
          type: string
      responses:
        "200":
          description: Component results exist
          headers:
            Last-Modified:
              description: Timestamp of the last modification.
              schema:
                type: string
        "404":
          description: No component results found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/status404Response"
  "/pipelines/{pipelineId}/components/{componentId}/results/{resultId}":
    get:
      tags:
      - Components
      summary: Get a specific result for a component
      description: Fetches the specified component results and returns them as an
        analytics report.
      operationId: getComponentResult
      parameters:
      - name: pipelineId
        in: path
        description: ID of the pipeline containing the component
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: ID of the component for which the result is desired
        required: true
        schema:
          type: string
      - name: resultId
        in: path
        description: "ID of the desired result. Supported delegates: @codeReport"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Component result returned successfully
          content:
            application/vnd.sas.analytics.report+json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/componentResultsByID"
            application/json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                default:
                  $ref: "#/components/examples/componentResultsByID"
          headers:
            Last-Modified:
              description: Timestamp of the last modification.
              schema:
                type: string
        "404":
          description: No component result found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/status404Response"
    head:
      tags:
      - Components
      summary: Specific component result check
      description: Checks if a specific component result exists
      operationId: headersForResult
      parameters:
      - name: pipelineId
        in: path
        description: ID of the pipeline containing the component
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: ID of the component for which to check for the result
        required: true
        schema:
          type: string
      - name: resultId
        in: path
        description: "ID of the desired result. Supported delegates: @codeReport"
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the results.
        schema:
          type: string
      - name: Last-Modified
        in: header
        description: The modification timestamp from the most recent response header.
          Must match the current timestamp for the results.
        schema:
          type: string
      responses:
        "200":
          description: Component result exists
          headers:
            Last-Modified:
              description: Timestamp of the last modification.
              schema:
                type: string
        "404":
          description: No component result found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/status404Response"
  "/pipelines/{pipelineId}/results":
    post:
      tags:
      - Pipelines
      summary: Publish forecasts
      description: Publishes forecasts for the selected pipeline.
      operationId: createResults
      parameters:
      - name: pipelineId
        in: path
        description: ID of the pipeline for which to publish results
        required: true
        schema:
          type: string
      - name: overwrite
        in: query
        description: Whether or not to overwrite the target table if it already exists
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/vnd.sas.forecasting.table.reference+json:
            schema:
              $ref: "#/components/schemas/tableReference"
            examples:
              json:
                $ref: "#/components/examples/publishResultsRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/tableReference"
            examples:
              json:
                $ref: "#/components/examples/publishResultsRequest"
        description: Specification of target table where results are to be published
        required: true
      responses:
        "200":
          description: Results replaced at specified location
          content:
            application/vnd.sas.data.table+json:
              schema:
                $ref: "#/components/schemas/dataTable"
              examples:
                default:
                  $ref: "#/components/examples/pipelineResults"
            application/json:
              schema:
                $ref: "#/components/schemas/dataTable"
              examples:
                default:
                  $ref: "#/components/examples/pipelineResults"
          headers:
            Location:
              description: The URL of the published results
              schema:
                type: string
        "201":
          description: Results created in specified location
          content:
            application/vnd.sas.data.table+json:
              schema:
                $ref: "#/components/schemas/dataTable"
              examples:
                default:
                  $ref: "#/components/examples/pipelineResults"
            application/json:
              schema:
                $ref: "#/components/schemas/dataTable"
              examples:
                default:
                  $ref: "#/components/examples/pipelineResults"
          headers:
            Location:
              description: The URL of the published results
              schema:
                type: string
        "400":
          description: Request body contains an error or is incomplete
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/status400Response"
        "409":
          description: Already exists and overwrite is false
  "/pipelines/{pipelineId}/status":
    put:
      tags:
      - Pipelines
      summary: Update status
      description: Notifies that the status of the given pipeline will be updated.
      operationId: updateStatus
      parameters:
      - name: pipelineId
        in: path
        description: ID of the pipeline for which to update status
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the results.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.forecasting.pipeline.status.update+json:
            schema:
              $ref: "#/components/schemas/statusUpdateRequest"
            examples:
              json:
                $ref: "#/components/examples/statusUpdateRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/statusUpdateRequest"
            examples:
              json:
                $ref: "#/components/examples/statusUpdateRequest"
        description: Specification of new status and associated properties.
        required: true
      responses:
        "204":
          description: The status update was processed
        "400":
          description: Request body contains an error or is incomplete
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/status400Response"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/preConditionFailed"
        "428":
          description: The request headers did not include a 'If-Match' precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/preConditionRequired"
  "/importedStrategies":
    post:
      tags:
      - Components
      summary: Import strategy
      description: Augments an imported strategy for use in a forecasting pipeline.
      operationId: createImportedStrategy
      requestBody:
        content:
          application/vnd.sas.analytics.component.template+json:
            schema:
              $ref: "#/components/schemas/analyticsComponentTemplate"
            examples:
              json:
                $ref: "#/components/examples/componentTemplate"
          application/json:
            schema:
              $ref: "#/components/schemas/analyticsComponentTemplate"
            examples:
              json:
                $ref: "#/components/examples/componentTemplate"
        description: The component template of the strategy
        required: true
      responses:
        "200":
          description: The updated strategy
          content:
            application/vnd.sas.analytics.component.template+json:
              schema:
                $ref: "#/components/schemas/analyticsComponentTemplate"
              examples:
                json:
                  $ref: "#/components/examples/componentTemplate"
            application/json:
              schema:
                $ref: "#/components/schemas/analyticsComponentTemplate"
              examples:
                json:
                  $ref: "#/components/examples/componentTemplate"
        "400":
          description: Request body contains an error or is incomplete
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/status400Response"
  "/exportedStrategies":
    post:
      tags:
      - Components
      summary: Export strategy
      description: Augments an exported strategy for migration to another environment.
      operationId: createExportedStrategy
      requestBody:
        content:
          application/vnd.sas.analytics.component.template+json:
            schema:
              $ref: "#/components/schemas/analyticsComponentTemplate"
            examples:
              json:
                $ref: "#/components/examples/componentTemplate"
          application/json:
            schema:
              $ref: "#/components/schemas/analyticsComponentTemplate"
            examples:
              json:
                $ref: "#/components/examples/componentTemplate"
        description: The component template of the strategy
        required: true
      responses:
        "200":
          description: The updated strategy
          content:
            application/vnd.sas.analytics.component.template+json:
              schema:
                $ref: "#/components/schemas/analyticsComponentTemplate"
              examples:
                json:
                  $ref: "#/components/examples/componentTemplate"
            application/json:
              schema:
                $ref: "#/components/schemas/analyticsComponentTemplate"
              examples:
                json:
                  $ref: "#/components/examples/componentTemplate"
        "400":
          description: Request body contains an error or is incomplete
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/status400Response"
  "/pipelines/{pipelineId}":
    delete:
      tags:
      - Pipelines
      summary: Delete a pipeline
      description: Deletes the specified pipeline and its associated resources.
      operationId: deletePipeline
      parameters:
      - name: pipelineId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not found
  "/pipelines/{pipelineId}/components/{componentId}/postprocessJobs":
    post:
      tags:
      - Components
      summary: Create a post-processing job for a component
      description: Triggers a post-processing job for the specified pipeline component.
      operationId: createComponentPostprocessJob
      parameters:
      - name: pipelineId
        in: path
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        required: true
        schema:
          type: string
      - name: casSessionId
        in: query
        required: false
        description: CAS session identifier to use for the post-processing job.
        schema:
          type: string
      - name: saveTables
        in: query
        required: false
        description: Whether to save generated tables as part of post-processing.
        schema:
          type: boolean
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                description: The created post-processing job resource.
        "400":
          description: Request parameters are invalid or incomplete.
  "/pipelines/{pipelineId}/components/{componentId}":
    delete:
      tags:
      - Components
      summary: Delete a pipeline component
      description: Deletes the specified component and cleans up associated CAS resources.
      operationId: deleteComponent
      parameters:
      - name: pipelineId
        in: path
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not found
servers:
- url: http://example.com/forecastingPipelines
  description: kubernetes mock server
components:
  schemas:
    analyticsReportCollection:
      title: Analytics Report Collection
      description: A collection of analytics reports.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The array of `application/vnd.sas.analytics.report` representations.
            items:
              $ref: "#/components/schemas/report"
    pipelineComparisonRequest:
      title: Pipeline Comparison Request
      description: Request to compare two or more pipelines to determine which produced
        the most accurate results.
      required:
      - pipelineSelection
      - stat
      properties:
        pipelineSelection:
          description: The pipelines to compare. Only relative URIs of pipeline resources
            are supported.
          type: array
          items:
            type: string
        stat:
          type: string
          description: The stat used to determine the optimal result set
          enum:
          - AADJRSQ
          - ADJRSQ
          - AIC
          - AICC
          - APC
          - GMAPE
          - GMAPES
          - GMAPPE
          - GMASPE
          - GMRAE
          - MAE
          - MAPE
          - MAPES
          - MAPPE
          - MASE
          - MAXAPES
          - MAXERR
          - MAXPE
          - MAXPPE
          - MAXRE
          - MAXSPE
          - MDAPE
          - MDAPES
          - MDAPPE
          - MDASPE
          - MDRAE
          - ME
          - MINAPES
          - MINERR
          - MINPE
          - MINPPE
          - MINRE
          - MINSPE
          - MPE
          - MPPE
          - MRAE
          - MRE
          - MSE
          - MSPE
          - RMSE
          - RSQUARE
          - RWRSQ
          - SBC
          - SMAPE
          - UMSE
          - URMSE
          - WAPE
          - MOVINGAVERAGE_WASE
        version:
          type: integer
          format: int32
          description: The version number of this representation schema.  This representation
            is version 1.
    statusUpdateRequest:
      title: Status Update Request
      description: Request to notify that a pipeline status will be changed.
      required:
      - status
      - dataSourceUri
      - dataDefinition
      properties:
        status:
          description: The new status
          type: string
          enum:
          - RUNNING
        dataSourceUri:
          type: string
          description: The URI of the data source
        dataDefinition:
          $ref: "#/components/schemas/dataDefinition"
        modelingSettings:
          type: object
          description: The settings to be passed to each modeling node
        toNode:
          type: string
          description: The UUID of the of the final node for this run
        links:
          type: array
          description: Links available for this resource
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          format: int32
          description: The version number of this representation schema.  This representation
            is version 1.
    dataDefinition:
      type: object
      title: Data Definition
      description: Representation of data definition
      properties:
        id:
          type: string
          description: DataDefinition ID
        accumulatedTimeSeriesTableName:
          type: string
          description: Accumulated time series table name
        attributesIndexTableName:
          type: string
          description: Attributes index table name
        caslibName:
          type: string
          description: The cas lib for all output data
        serverName:
          type: string
          description: The cas server for all output data
        createdBy:
          type: string
          description: User that created this resource
        creationTimeStamp:
          type: string
          format: date-time
          description: Time stamp of resource creation
        description:
          type: string
          description: A memo field for the dataDefinition to add information
        forecastSettings:
          $ref: "#/components/schemas/forecastSettings"
        forecastsTableName:
          type: string
          description: Output forecast table name
        forecastsUpdated:
          type: boolean
          description: Forecasts updated indicator
        hierarchyForecasting:
          type: boolean
          description: Hierarchy forecasting indicator
        horizonTableName:
          type: string
          description: Horizon table name
        modifiedBy:
          type: string
          description: The last user to modify this resource
