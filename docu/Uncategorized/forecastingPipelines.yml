          "classification": "pluggable_auto", "status": "created", "iconCode": "",
          "executionProviderId": "Compute", "code": "options mprint;\noptions validmemname=extend;\n\
            options VALIDVARNAME=ANY;\n\n%let temp_work_location = %sysfunc(pathname(work));\n\
            %let sas_root_location = %sysget(SASROOT);\n\n/* connect to CAS session\
