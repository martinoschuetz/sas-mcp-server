      value: {"creationTimeStamp": "0001-01-01T00:00:00Z", "modifiedTimeStamp": "0001-01-01T00:00:00Z",
        "revision": 0, "version": 1, "order": 1, "type": "codeEditor", "parameterMap": {
          "code": {"order": 1, "parameter": "code", "preformatted": false, "type": "char",
            "values": ["code"]}, "type": {"order": 1, "parameter": "type", "preformatted": false,
            "type": "char", "values": ["type"]}}, "data": [{"dataMap": {"code": "*request\
                \ ODS output outInfo and name it as sforecast_outInformation;\nods\
                \ output OutInfo = sforecast_outInformation;\n*run TSMODEL to generate\
                \ forecasts;\nproc tsmodel data = inlib.\"_ACCUMULATED_TS\"n logcontrol\
                \ = (error = keep warning = keep) outobj = ( outfor = outlib.\"92bbc07d._OUTFOR\"\
                n outstat = outlib.\"92bbc07d._OUTSTAT\"n outSelect = outlib.\"92bbc07d._OUTSELECT\"\
                n outmodelinfo = outlib.\"92bbc07d._OUTMODELINFO\"n ) outlog = outlib.\"\
                92bbc07d._OUTLOG\"n errorstop = YES ;\n*define time series ID variable\
                \ and the time interval;\nid 'DATE'n interval = WEEK setmissing =\
                \ MISSING trimid = LEFT;\n*define time series and the corresponding\
                \ accumulation methods;\nvar 'sales'n/ acc =TOTAL setmiss =MISSING;\n\
                ;\n*define the by variables if exist;\nby 'location'n 'sku'n ;\n*using\
                \ the ATSM (Automatic Time Series Model) package;\nrequire atsm;\n\
                *starting user script;\nsubmit;\ndeclare object dataFrame(tsdf);\n\
                declare object diagnose(diagnose);\ndeclare object diagSpec(diagspec);\n\
                declare object inselect(selspec);\ndeclare object FORECAST(foreng);\n\
                rc = dataFrame.initialize();\nrc = dataFrame.addY('sales'n);\n*add\
                \ independent variables to the tsdf object if there is any;\nrc =\
                \ diagSpec.open();\nrc = diagSpec.setESM('method', 'BEST');\nrc =\
                \ diagSpec.setARIMAX('identify', 'BOTH');\nrc = diagSpec.setIDM('intermittent',\
                \ 2);\nrc = diagSpec.setIDM('METHOD', \"BEST\");\nrc = diagSpec.close();\n\
                rc = diagnose.initialize(dataFrame);\nrc = diagnose.setSpec(diagSpec);\n\
                rc = diagnose.setOption('holdout',0);\nrc = diagnose.setOption('back',0);\n\
                rc = diagnose.setOption('criterion','MAPE');\nrc = diagnose.setOption('minobs.trend',2);\n\
                rc = diagnose.setOption('minobs.season',2);\nrc = diagnose.Run();\n\
                ndiag = diagnose.nmodels();\nrc = inselect.Open(ndiag);\nrc = inselect.AddFrom(diagnose);\n\
                rc = inselect.close();\nrc = forecast.initialize(dataFrame);\nrc =\
                \ forecast.AddFrom(inselect);\nrc = forecast.setOption('holdout',0);\n\
                rc = forecast.setOption('back',0);\nrc = forecast.setOption('criterion','MAPE');\n\
                rc = forecast.setOption('minobs.trend',2);\nrc = forecast.setOption('minobs.season',2);\n\
                rc = forecast.setOption('minobs.mean',2);\nrc = forecast.setOption('fcst.bd.lower',0);\n\
                rc = forecast.setOption('horizon',20169);\nrc = forecast.setOption('alpha',0.05);\n\
                rc = forecast.setOption('lead',12);\nrc = forecast.Run();\ndeclare\
                \ object outFor(outFor);\ndeclare object outStat(outStat);\ndeclare\
                \ object outSelect(outSelect);\ndeclare object outModelInfo(outModelInfo);\n\
                rc = outFor.collect(forecast);\nrc = outStat.collect(forecast);\n\
                rc = outSelect.collect(forecast);\nrc = outModelInfo.collect(forecast);\n\
                endsubmit;\nquit;\n*generate outinformation CAS table;\ndata outlib.\"\
                92bbc07d._OUTINFORMATION\"n;\nset work.sforecast_outInformation;\n\
                run;\n", "type": "SAS"}, "rowNumber": 1}], "xInteger": false, "yInteger": false}
