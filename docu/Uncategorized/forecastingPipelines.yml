            &caslibIn\");\nlibname inlib cas sessref=vf_session caslib=\"&caslibIn\"\
            ;\nlibname outlib cas sessref=vf_session caslib=\"&caslibOut\";\n\nproc\
            \ lua restart;\nsubmit;\nlocal sasrootpath = sas.symget('sas_root_location')\n\
            local rootPath = sasrootpath..'/misc/codegenscrpt/source/lua'\npackage.path\
            \ = rootPath..'/?.lua;'..package.path\n\npackage.loaded[\"fscb.common.plugin_contract_init\"\
            ] = nil\nlocal run = require(\"fscb.common.plugin_contract_init\")\n\n\
            package.loaded[\"fscb.common.json\"] = nil\nlocal JSON = require(\"fscb.common.json\"\
            )\n\nlocal args = JSON:decode(sas.symget('_backendArgs'))\nargs.cas.sessionID\
            \ = sas.symget(\"casSessionId\")\nargs.cas.libIn = \"inlib\"\nargs.cas.libOut\
            \ = \"outlib\"\nargs.cas.session = \"vf_session\"\n\n![CODE[preProcessArgsCode]]\n\
            \nfileName = sas.symget('temp_work_location')..\"/vfMacros.sas\"\nmacroList\
            \ = sas.symget('temp_work_location')..\"/vfMacroList.sas\"\nrun.vf_setMacros(args,\
            \ fileName, macroList)\n\n--[[ write code to file ]]\nargs.cas.sasCodeFile\
            \ = sas.symget('temp_work_location')..\"/\"..args.cas.sasCodeFile\nsas.symput('codeFilePath',\
            \ args.cas.sasCodeFile)\n\n![CODE[preProcessTransformationsCode]]\n\n\
            endsubmit;\nrun;\n%include \"&temp_work_location./vfMacros.sas\" /encoding=utf8;\n\
            %include \"&temp_work_location./vfMacroList.sas\" /encoding=utf8;\n\n\
            %macro __validateBackendArgs;\n    %global preProcessErrorStatus;\n  \
            \  %if \"&vf_classification\" eq \"pluggable_hierarchical\" %then %do;\n\
            \        proc cas;\n            %include \"&sas_root_location/misc/codegenscrpt/source/casl/hfp_args_comparison.casl\"\
            ;\n            errorStatus = 0;\n            args = json2casl(symget('_backendArgs'));\n\
            \            if args._forecastTask ne \"DIAGNOSE\" then do;\n        \
            \        argsLast = json2casl(symget('_backendArgsLast'));\n         \
            \       if dim(argsLast) ne 0 then do;\n                    argsComp =\
            \ hfp_args_comparison(args, argsLast);\n                    errorStatus\
            \ = argsComp.errorStatus;\n                    if argsComp.errorStatus\
            \ eq 0 then symputx('_forecastTask', argsComp.forecastTask);\n       \
            \         end;\n                else do;\n                    print (error)\
            \ \"The DIAGNOSE task has never been executed and should be successfully\
            \ executed at least once before any other forecast task can be enabled.\"\
            ;   \n                    errorStatus = 1;\n                end;\n   \
            \         end;\n            symputx('preProcessErrorStatus', errorStatus);\n\
            \        quit;\n    %end;\n    %else %do;\n        %let preProcessErrorStatus\
            \ = 0;\n    %end;\n%mend __validateBackendArgs;\n%__validateBackendArgs;\n\
            \n/* set _leadExtend and _forecastBack for backwards compatibility */\n\
            %let _leadExtend = false;\n%let _forecastBack = &vf_back;\n\n/* wrap in\
            \ macro so we can print resolved code to file */\n%macro vf_wrapper;\n\
            \    %if &preProcessErrorStatus ne 0 %then %abort;\n\n\n/* CODE_START\
            \ */\n![CODE[code]]\n/* CODE_END */\n%mend vf_wrapper;\n\nfilename mprint\
            \ \"&codeFilePath\";\noptions mfile;\n%vf_wrapper;\noptions nomfile;\n\
            \n/* Promote Tables */\n%vf_promoteCASTable(localCASTable = &vf_outFor,\
            \ globalCASTable = &vf_tableOutPrefix..OUTFOR);\n%vf_promoteCASTable(localCASTable\
            \ = &vf_outStat, globalCASTable = &vf_tableOutPrefix..OUTSTAT);\n%vf_promoteCASTable(localCASTable\
            \ = &vf_outInformation, globalCASTable = &vf_tableOutPrefix..OUTINFORMATION);\n\
            %vf_promoteCASTable(localCASTable = &vf_outLog, globalCASTable = &vf_tableOutPrefix..OUTLOG);\n\
            %vf_promoteCASTable(localCASTable = &vf_outModelInfo, globalCASTable =\
            \ &vf_tableOutPrefix..OUTMODELINFO);\n%vf_promoteCASTable(localCASTable\
            \ = &vf_outSelect, globalCASTable = &vf_tableOutPrefix..OUTSELECT);\n\
            %vf_promoteCASTable(localCASTable = &vf_outFmsg, globalCASTable = &vf_tableOutPrefix..DIAGNOSEOUTFMSG);\n\
            %vf_promoteCASTable(localCASTable = &vf_outEst, globalCASTable = &vf_tableOutPrefix..OUTEST);\n\
            %vf_promoteCASTable(localCASTable = &vf_outComp, globalCASTable = &vf_tableOutPrefix..OUTCOMPONENT);\n\
            %vf_promoteCASTable(localCASTable = &vf_outEvent, globalCASTable = &vf_tableOutPrefix..OUTEVENT);\n\
            %vf_promoteCASTable(localCASTable = &vf_outEventDum, globalCASTable =\
            \ &vf_tableOutPrefix..OUTEVENTDUM);\n%vf_promoteCASTable(localCASTable\
            \ = &vf_outIndep, globalCASTable = &vf_tableOutPrefix..OUTINDEP);\n%vf_promoteCASTable(localCASTable\
            \ = &vf_outFor_Model, globalCASTable = &vf_tableOutPrefix..OUTFOR_MODEL);\n\
            %vf_promoteCASTable(localCASTable = &vf_outStat_Model, globalCASTable\
            \ = &vf_tableOutPrefix..OUTSTAT_MODEL);\n%vf_promoteCASTable(localCASTable\
            \ = &vf_outFor_Horizon, globalCASTable = &vf_tableOutPrefix..OUTFOR_HORIZON);\n\
            %vf_promoteCASTable(localCASTable = &vf_outFeature, globalCASTable = &vf_tableOutPrefix..OUTFEATURE);\n\
            \ncas vf_session disconnect;\ncas vf_session clear;\n\n\n\n/*SUMMARY_START*/\n\
            proc lua restart;\nsubmit;\n\nlocal sasrootpath = sas.symget('sas_root_location')\n\
            local rootPath = sasrootpath..'/misc/codegenscrpt/source/lua'\npackage.path\
            \ = rootPath..'/?.lua;'..package.path\npackage.loaded[\"fscb.forecastSummary.forecast_summary\"\
            ] = nil\nlocal run = require(\"fscb.forecastSummary.forecast_summary\"\
            )\n\npackage.loaded[\"fscb.common.json\"] = nil\nlocal JSON = require(\"\
            fscb.common.json\")\nlocal args = JSON:decode(sas.symget('_backendArgs'))\n\
            args.cas.sessionID = sas.symget(\"casSessionId\")\nargs.cas.caslibIn =\
            \ args.cas.caslibOut\nif args.cas.tableInPrefix == \"\" or args.cas.tableInPrefix\
            \ == nil then\n  args.isSegmentationPipeline = false\nelse\n  args.isSegmentationPipeline\
            \ = true\nend\nargs.cas.tableInPrefix = args.cas.tableOutPrefix\nargs.output={\n\
            \    basicstat_summary = \"STAT_SUMMARY\",\n    pattern_summary = \"PATTERN_SUMMARY\"\
            ,\n    advancedstat_summary = \"ADV_STAT_SUMMARY\",\n    outlog = \"VALIDATIONLOG\"\
            \n}\n\n--[[ disable writing summary code to file ]]\nargs.cas.sasCodeFile\
            \ = nil\n\nrun.forecast_summary(args)\nendsubmit;\nrun;\nquit;\n\n/* call\
            \ the post-processing rest endpoint */\n%put If necessary, post-process\
            \ component...;\n%let http_prefix =%sysget(SAS_URL_SERVICE_TEMPLATE);\n\
            %let ndx = %eval(%index(&http_prefix, @) - 1);\n%let http_prefix = %substr(&http_prefix,\
            \ 1, &ndx);\nfilename resp TEMP;\nproc http\n  method=\"POST\"\n  url=\"\
            &http_prefix.sas-forecasting-pipelines/forecastingPipelines/pipelines/&pipelineId./components/&componentId./postprocessJobs?casSessionId=&casSessionId.\"\
            \n  OAUTH_BEARER = SAS_SERVICES\n  out=resp; \nrun;\n%put Response status:\
            \ &SYS_PROCHTTP_STATUS_CODE;\n\n%if not (&SYS_PROCHTTP_STATUS_CODE <=\
            \ 299) %then %do;\n  %put ERROR: An invalid response was received.;\n\
            \  %abort;\n%end;\n\n/*SUMMARY_END*/\n", "systemAttributes": {"casSessionId": "",
            "sasCode_Language": "sas", "vfBuildVersion": "14"}, "componentProperties": {
            "_arimaxInclude": true, "_esmInclude": true, "_holdoutSampleSize": 0,
            "_idmInclude": true, "_idmMethod": "BEST", "_intermittencySensitivity": 2,
            "_minobs": 2, "_minobsSeason": 2, "_minobsTrend": 2, "_outtable_mergedAttrInclude": true,
            "_outtable_outcompInclude": false, "_outtable_outestInclude": false, "_outtable_outeventInclude": false,
            "_outtable_outeventdumInclude": false, "_outtable_outfmsgInclude": false,
            "_outtable_outforInclude": true, "_outtable_outindepInclude": false, "_outtable_outlogInclude": true,
            "_outtable_outmodelinfoInclude": true, "_outtable_outselectInclude": true,
            "_outtable_outstatInclude": true, "_outtable_outsumInclude": true, "_selectionCriteria": "MAPE",
            "_ucmInclude": false, "cas": {"sasCodeFile": "vf_code.sas"}, "code": "/*-------------------------------------------------------------------\n\
              \ * copyright (c) 2022 by SAS Institute Inc., Cary NC\n * name    :\
              \ vf_auto_forecast.sas\n * purpose : Example of using Proc TSMODEL to\
              \ forecast.  \n *           Generate forecast using  auto-forecasting\
              \ model to include\n                more model families: with ESM, IDM,\
              \ UCM or ARIMAX model\n *-------------------------------------------------------------------\
              \ \n *  List of strategy specific properties for this Sample\n *  (available\
              \ as sas MACRO variable to be used in code):\n *     _arimaxInclude\
              \            - Specify whether to include ARIMAX model\n *         \
              \                        for diagnosis\n *     _esmInclude         \
              \      - Specify whether to include ESM model\n *                  \
              \               for diagnosis\n *     _idmInclude               - Specify\
              \ whether to include IDM model\n *                                 for\
              \ diagnosis\n *     _intermittencySensitivity - Sensitivity for intermittency\
              \ test\n *     _idmMethod                - IDM method \n *     _ucmInclude\
              \               - Specify whether to include UCM model\n *         \
              \                        for diagnosis\n *     _combInclude        \
              \      - Specify whether to combine the models\n *                 \
              \                other than the external ones for \n *             \
              \                    diagnosis\n *     _minobs                   - Minimum\
              \ number of observations for a \n *                                \
              \ non-mean model\n *     _minobsTrend              - Minimum number\
              \ of observations for a\n *                                 trend model\n\
              \ *     _minobsSeason             - Minimum number of seasonal cycles\
              \ for\n *                                 a seasonal model\n *     _holdoutSampleSize\
              \        - Size of data to be used for holdout\n *     _holdoutSamplePercent\
              \     - Percentage of data to be used for \n *                     \
              \            holdout\n *     _selectionCriteria        - Model selection\
              \ criteria\n *-------------------------------------------------------------------\
              \ \n * Component needs to produce output datasets and promote to &vf_caslibOut\
              \ as necessary.\n * Output dataset names:\n *     &vf_outFor   - Required\
              \ table containing forecast results. It contains\n *               \
              \     BY variables, time ID variable, ACTUAL, PREDICT, STD, LOWER, UPPER,\
              \ ERROR.\n *     &vf_outStat  - Required table containing summary statistics.\
              \ It contains BY variables,\n *                    _REGION_, _SELECT_,\
              \ _MODEL_, and various statistics of fit.\n *     &vf_outInformation\
              \ - Required table containing execution summary. It contains processing\
              \ information of TSMODEL\n *                          such as number\
              \ of groups, maximum time ID, number of variables, etc. \n *     &vf_outModelInfo\
              \   - Required table containing selected model information. It contains\
              \ BY variables, \n *                          _MODEL_, _MODELTYPE_,\
              \ and various flags for seasonal, trend, inputs, events, etc.\n *  \
              \   &vf_outLog   - Required table containing log messages. It contains\n\
              \ *                    BY variables, _ERRORNO_, _LOGLEN_, _LOG_.\n *\
              \     &vf_outSelect - Required table containing model selection statistics.\
              \ It contains BY variables, \n *                     _REGION_, _SELECT_,\
              \ _MODEL_, _SELECTED_ and various statistics of fit.\n *     &vf_outEst\
              \   - Optional table containing parameter estimates. It contains _PARM_,\
              \ _STDERR_, \n *                    _TVALUE_, _PVALUE_, and model information,\
              \ etc.\n *     &vf_outFmsg  - Optional table containing forecast model\
              \ selection graph. It contains\n *                    _SPECNAME_, _SPECLEN_,\
              \ _FMSGPEC_, and _NAME_.\n *     &vf_outComp         - Optional table\
              \ containing model forecast components. It contains BY variables,\n\
              \ *                           time ID variable, _ACTUAL_, _PREDICT_,\
              \ _COMP_, _STD_, _LOWER_, _UPPER_.\n *     &vf_outEvent        - Optional\
              \ table containing event definitions. It contains the definitions for\
              \ \n *                           event variables that are specified\
              \ in an instance of the EVENT object.\n *     &vf_outEventdum   - Optional\
              \ table containing event dum variables. It contains time ID variable,\n\
              \ *                           _XVAR_(event name), X(values of event).\n\
              \ *     &vf_outIndep        - Optional table containing independent\
              \ variables. It contains BY variables, time ID variable,\n *       \
              \                    _XVAR_(independent name) and X(values of independent\
              \ variable).\n *-------------------------------------------------------------------*/\n\
              \n/* clean up tables from previous run */\nproc cas;\n    session &vf_session;\n\
              \    setsessopt / caslib = \"&vf_caslibOut\";\n    droptable / table\
              \ = \"&vf_outFor\"           quiet = 1;\n    droptable / table = \"\
              &vf_outInformation\"   quiet = 1;\n    droptable / table = \"&vf_outLog\"\
              \           quiet = 1;\n    droptable / table = \"&vf_outModelInfo\"\
              \     quiet = 1;\n    droptable / table = \"&vf_outSelect\"        quiet\
              \ = 1;\n    droptable / table = \"&vf_outEst\"           quiet = 1;\n\
              \    droptable / table = \"&vf_outComp\"          quiet = 1;\n    droptable\
              \ / table = \"&vf_outEvent\"         quiet = 1;\n    droptable / table\
              \ = \"&vf_outEventdum\"    quiet = 1;\n    droptable / table = \"&vf_outIndep\"\
              \         quiet = 1;\n    droptable / table = \"&vf_outFmsg\"      \
              \    quiet = 1;\nrun;\nquit;\n\n*request ODS output outInfo and name\
              \ it as sforecast_outInformation;\nods output OutInfo = sforecast_outInformation;\n\
              \n/* checking existence of event, independent variables */\n%if %UPCASE(\"\
              &_outtable_outeventInclude\") eq \"TRUE\" %then %do;\n    %if \"&vf_inEventObj\"\
              \ eq \"\" and \"&vf_events\" eq \"\" %then %do;\n        %put WARNING:\
              \ Cannot create OUTEVENT table because there are no events in the project.;\n\
              \        %let _outtable_outeventInclude = FALSE;\n    %end;\n    %if\
              \ \"&vf_inEventObj\" ne \"\" and \"&vf_events\" eq \"\" %then %do;\n\
              \        %put WARNING: OUTEVENT table can be large because it copies\
              \ event definitions for all events to all BY groups.;\n    %end;\n%end;\n\
              %if %UPCASE(\"&_outtable_outeventdumInclude\") eq \"TRUE\" %then %do;\n\
              \    %if \"&vf_events\" eq \"\" %then %do;\n        %put WARNING: Cannot\
              \ create OUTEVENTDUM table because there are no events in the project.;\n\
              \        %let _outtable_outeventdumInclude = FALSE;\n    %end;\n%end;\n\
              %if %UPCASE(\"&_outtable_outindepInclude\") eq \"TRUE\" %then %do;\n\
              \    %if \"&vf_indepVars\" eq \"\" %then %do;\n        %put WARNING:\
              \ Cannot create OUTINDEP table because there are no independent variables\
              \ in the project.;\n        %let _outtable_outindepInclude = FALSE;\n\
              \    %end;\n%end;\n\n*run TSMODEL to generate forecasts;\nproc tsmodel\
              \ data = &vf_libIn..\"&vf_inData\"n\n          logcontrol = (error =\
              \ keep warning = keep)\n          %if \"&vf_inEventObj\" ne \"\" %then\
              \ %do;\n             inobj = (&vf_inEventObj)\n          %end;\n   \
              \       outobj = (\n                       outfor  = &vf_libOut..\"\
              &vf_outFor\"n\n                       outstat = &vf_libOut..\"&vf_outStat\"\
              n\n                       outSelect = &vf_libOut..\"&vf_outSelect\"\
              n\n                       outmodelinfo = &vf_libOut..\"&vf_outModelInfo\"\
              n\n                       %if %UPCASE(\"&_outtable_outestInclude\")\
              \ eq \"TRUE\" %then outest = &vf_libOut..\"&vf_outEst\"n;\n        \
              \               %if %UPCASE(\"&_outtable_outcompInclude\") eq \"TRUE\"\
              \ %then outcomp = &vf_libOut..\"&vf_outComp\"n;\n                  \
              \     %if %UPCASE(\"&_outtable_outeventInclude\") eq \"TRUE\" %then\
              \ outevent = &vf_libOut..\"&vf_outEvent\"n;\n                      \
              \ %if %UPCASE(\"&_outtable_outeventdumInclude\") eq \"TRUE\" %then outeventdum\
              \ = &vf_libOut..\"&vf_outEventDum\"n;\n                       %if %UPCASE(\"\
              &_outtable_outindepInclude\") eq \"TRUE\" %then outindep = &vf_libOut..\"\
              &vf_outIndep\"n;\n                       %if %UPCASE(\"&_outtable_outfmsgInclude\"\
              ) eq \"TRUE\" %then outfmsg = &vf_libOut..\"&vf_outFmsg\"n;\n      \
              \                 )\n          outlog  = &vf_libOut..\"&vf_outLog\"\
              n          \n          errorstop = YES   \n          ;\n          \n\
              \    *define time series ID variable and the time interval;\n    id\
              \ &vf_timeID interval = &vf_timeIDInterval\n                  setmissing\
              \ = &vf_setMissing trimid = LEFT;\n\n    *define time series and the\
              \ corresponding accumulation methods;\n    %vf_varsTSMODEL;\n\n    *define\
              \ the by variables if exist;\n    %if \"&vf_byVars\" ne \"\" %then %do;\n\
              \       by &vf_byVars;\n    %end;\n\n    *using the ATSM (Automatic\
              \ Time Series Model) package;\n    require atsm;\n\n    *starting user\
              \ script;\n    submit;\n    \n        /*declare ATSM objects;*/\n  \
              \      /*\n        TSDF:     Time series data frame used to group series\
              \ variables for DIAGNOSE and FORENG objects\n        DIAGNOSE: Automatic\
              \ time series model generation\n        FORENG:   Automatic time series\
              \ model selection and forecasting\n        DIAGSPEC: Diagnostic control\
              \ options for DIAGNOSE object\n        OUTFOR:   Collector for FORENG\
              \ forecasts\n        OUTSTAT:  Collector for FORENG forecast performance\
              \ statistics\n        */\n        \n        declare object dataFrame(tsdf);\n\
              \        declare object diagnose(diagnose);\n        declare object\
              \ diagSpec(diagspec);\n        declare object inselect(selspec); \n\
              \        declare object FORECAST(foreng);\n        \n        /*initialize\
              \ the tsdf object and assign the time series roles: setup dependent\
              \ and independent variables*/\n        rc = dataFrame.initialize();\n\
              \        rc = dataFrame.addY(&vf_depVar);\n\n        *add independent\
              \ variables to the tsdf object if there is any;\n        %if \"&vf_indepVars\"\
              \ ne \"\" %then %do;\n            %vf_addXTSMODEL(dataFrame);\n    \
              \    %end;\n    \n        /*setup up event information*/\n        %if\
              \ \"&vf_inEventObj\" ne \"\" or \"&vf_events\" ne \"\" %then %do;\n\
              \            declare object ev1(event);\n            rc = ev1.Initialize();\n\
              \            %vf_addEvents(dataFrame, ev1);\n        %end;\n       \n\
              \        /*open and setup the diagspec object and enable ESM, IDM, UCM\
              \ and ARIMAX model class for diagnose;*/\n        /*setup time series\
              \ diagnose specifications*/\n        /*open the diagspec object and\
              \ enable ESM, IDM, UCM, ARIMAX model class for diagnose; */\n      \
              \  rc = diagSpec.open();\n        %if %UPCASE(\"&_esmInclude\") eq \"\
              TRUE\"  %then %do;\n            rc = diagSpec.setESM('method', 'BEST');\n\
              \        %end;\n        %if %UPCASE(\"&_arimaxInclude\") eq \"TRUE\"\
              \  %then %do;\n            rc = diagSpec.setARIMAX('identify', 'BOTH');\n\
              \        %end;\n        %if %UPCASE(\"&_idmInclude\") eq \"TRUE\" %then\
              \ %do;\n            rc = diagSpec.setIDM('intermittent', \n        \
              \                         &_intermittencySensitivity);   \n        \
              \    rc = diagSpec.setIDM('METHOD', \"&_idmMethod\");\n        %end;\n\
              \        %else %do;\n            rc = diagSpec.setIDM('intermittent',\
              \ 1000000);\n        %end;\n        %if %UPCASE(\"&_ucmInclude\") eq\
              \ \"TRUE\" %then %do;\n            rc = diagSpec.setUCM();\n       \
              \ %end;\n\n\n        \n        rc = diagSpec.close();\n    \n      \
              \  /*diagnose time series to generate candidate model list*/\n     \
              \   /*set the diagnose object using the diagspec object and run the\
              \ diagnose process; */\n        rc = diagnose.initialize(dataFrame);\n\
              \        rc = diagnose.setSpec(diagSpec);\n        \n        %vf_setObjectOptions(instance=diagnose,\
              \ object=diagnose)\n        \n        rc = diagnose.Run();\n       \
              \ ndiag = diagnose.nmodels();                                 \n   \
              \         \n        /*Run model selection and forecast*/           \
              \          \n        rc = inselect.Open(ndiag);\n        rc = inselect.AddFrom(diagnose);\
              \ \n        rc = inselect.close(); \n        \n        /*initialize\
              \ the foreng object with the diagnose result and run model selecting\
              \ and generate forecasts;*/         \n        rc = forecast.initialize(dataFrame);\n\
              \        rc = forecast.AddFrom(inselect);\n\n        %vf_setObjectOptions(instance=forecast,\
              \ object=foreng)\n\n        rc = forecast.setOption('SEASONTEST', 'NONE');\n\
              \        %if %UPCASE(\"&_idmInclude\") ne \"TRUE\" %then %do;\n    \
              \        rc = forecast.setOption('INTERMITTENT', 1000000); /* some large\
              \ number */\n        %end;\n               \n        rc = forecast.Run();\n\
              \    \n        /*collect forecast results*/\n        declare object\
              \ outFor(outFor);\n        declare object outStat(outStat);\n      \
              \  declare object outSelect(outSelect);\n        declare object outModelInfo(outModelInfo);\n\
              \        \n        %if %UPCASE(\"&_outtable_outestInclude\") eq \"TRUE\"\
              \ %then %do;\n            declare object outest(outest);\n         \
              \   rc = outest.collect(forecast);\n        %end;\n        %if %UPCASE(\"\
              &_outtable_outcompInclude\") eq \"TRUE\" %then %do;\n            declare\
              \ object outcomp(outcomp);\n            rc = outcomp.collect(forecast);\n\
              \        %end;\n        %if %UPCASE(\"&_outtable_outeventInclude\")\
              \ eq \"TRUE\" %then %do;\n            declare object outevent(outevent);\n\
              \            rc = outevent.collect(ev1);\n        %end;\n        %if\
              \ %UPCASE(\"&_outtable_outeventdumInclude\") eq \"TRUE\" %then %do;\n\
              \            declare object outeventdum(outeventdum);\n            rc\
              \ = outeventdum.collect(dataFrame);\n        %end;\n        %if %UPCASE(\"\
              &_outtable_outindepInclude\") eq \"TRUE\" %then %do;\n            declare\
              \ object outindep(outindep);\n            rc = outindep.collect(forecast);\n\
              \        %end;\n        %if %UPCASE(\"&_outtable_outfmsgInclude\") eq\
              \ \"TRUE\" %then %do;\n            declare object outfmsg(outfmsg);\n\
              \            rc = outfmsg.collect(forecast);\n        %end;\n\n    \
              \    /*collect the forecast and statistic-of-fit from the forgen object\
              \ run results; */\n        rc = outFor.collect(forecast);\n        rc\
              \ = outStat.collect(forecast);\n        rc = outSelect.collect(forecast);\
              \  \n        rc = outModelInfo.collect(forecast);\n    endsubmit;\n\
              quit;\n\n*generate outinformation CAS table;\ndata &vf_libOut..\"&vf_outInformation\"\
              n;\n    set work.sforecast_outInformation;\nrun;\n\n\n/*******************************************************************************************************\n\
              Optional: promote OUTPUT Datasets.\nBy default following OUTPUT datasets\
              \ are promoted automatically.\nOUTFOR\nOUTSTAT\nOUTINFORMATION\nOUTMODELINFO\n\
              OUTSELECT\nIf additional OUTPUT datasets that needs to be promoted to\
              \ global scope, please use vf_promoteCASTable MACRO.\nSample code as\
              \ follows:\n%vf_promoteCASTable(localCASTable = localTableName, globalCASTable\
              \ = globalTableName);\n********************************************************************************************************/",
            "code_Language": "text/vnd.sas.source.sas", "dataSpecification": {"outAttributesList": [
                {"columns": ["NOBS", "N", "NMISS", "MIN", "MAX", "MEAN", "STDDEV",
                    "_STATUS_"], "name": "OUTSUM"}, {"columns": ["_REGION_", "_SELECT_",
                    "_MODEL_", "DFE", "N", "NOBS", "NMISSA", "NMISSP", "NPARMS", "TSS",
                    "SST", "SSE", "MSE", "RMSE", "UMSE", "URMSE", "MAPE", "MAE", "RSQUARE",
                    "ADJRSQ", "AADJRSQ", "RWRSQ", "AIC", "AICC", "SBC", "APC", "MAXERR",
                    "MINERR", "MAXPE", "MINPE", "ME", "MPE", "MDAPE", "GMAPE", "MINPPE",
                    "MAXPPE", "MPPE", "MAPPE", "MDAPPE", "GMAPPE", "MINSPE", "MAXSPE",
                    "MSPE", "SMAPE", "MDASPE", "GMASPE", "MINRE", "MAXRE", "MRE",
                    "MRAE", "MDRAE", "GMRAE", "MASE", "MINAPES", "MAXAPES", "MAPES",
                    "MDAPES", "GMAPES"], "name": "OUTSTAT"}, {"columns": ["_MODEL_",
                    "_MODELTYPE_", "_DEPTRANS_", "_SEASONAL_", "_TREND_", "_INPUTS_",
                    "_EVENTS_", "_OUTLIERS_", "_STATUS_", "_SOURCE_"], "name": "OUTMODELINFO"}]},
            "preProcessArgsCode": "--[[ read dynamic args from table ]]\nif sas.exists(\"\
              inlib._BACKENDARGS\") then\n  local dsid = sas.open(\"inlib._BACKENDARGS\"\
              )\n\n  for row in sas.rows(dsid) do\n    --[[ split path on \".\" ]]\n\
              \    local path = {}\n    for k in row.key:gmatch \"[^.]+\" do\n   \
              \     table.insert(path, k)\n    end\n\n    --[[ traverse path ]]\n\
              \    local obj = args\n    for i = 1, #path - 1 do\n        if obj[path[i]]\
              \ == nil then\n          --[[ insert missing object ]]\n          obj[path[i]]\
              \ = {}\n        end\n        obj = obj[path[i]]\n    end\n\n    --[[\
              \ set value ]]\n    obj[path[#path]] = row.value\n  end\n\n  sas.close(dsid)\n\
              \n  --[[ update _backendArgs macro var for use in subsequent code ]]\n\
              \  sas.symput('_backendArgs', JSON:encode(args))\nend", "preProcessTransformationsCode": "--[[\
              \ apply transformations to input data ]]\nif args.dataSpecification.inTransformations\
              \ then\n\n    --[[ set max syserr to 4 (allow warnings) ]]\n    local\
              \ prevMaxSysErr = sas.get_max_syserr()\n    sas.set_max_syserr(4)\n\n\
              \    --[[ initialize references to the tables at the root ]]\n    sas.symput('_timeseries',\
              \ \"&inData\")\n    sas.symput('_attributes', \"&inAttributes\")\n\n\
              \    --[[ apply series of tranformations to input data ]]\n    for i,\
              \ transformation in ipairs(args.dataSpecification.inTransformations)\
              \ do\n        if transformation.type == 'FEDSQL' then\n            --[[\
              \ submit query ]]--\n            local query = transformation.value\n\
              \            sas.submit[[\n                proc cas;\n             \
              \       fedsql.execDirect /\n                        query=\"@query@\"\
              ;\n                run;\n                quit;\n            ]]\n   \
              \     end\n\n        --[[ update table reference so next transformation\
              \ is applied to output of previous one ]]\n        sas.symput(transformation.tableReferenceKey,\
              \ transformation.tableReferenceValue)\n    end\n\n    --[[ restore max\
              \ syserr ]]\n    sas.set_max_syserr(prevMaxSysErr)\nend"}, "componentPropertyMetadata": {}},
