          type: string
        links:
          description: Links that apply to this resource
          type: array
          items:
            $ref: "#/components/schemas/link"
        lockTimeout:
          $ref: "#/components/schemas/instant"
        lockedBy:
          type: string
          description: 'The user who holds the lock, if it has not expired. Only this
            user has write access to the project.'
        modelImageUri:
          type: string
          description: "The uri of the project's image"
        modifiedBy:
          description: The timestamp when this resource was last modified.
          type: string
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The userid who last modified this resource.
        name:
          type: string
          description: The name of the project
