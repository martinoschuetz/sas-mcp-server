---
openapi: 3.0.3
info:
  description: |-
    The text-analytics-provider API is a mid-tier API for SAS Visual Text Analytics (VTA).  It is defined as a provider to the Analytics Gateway API.  The main purpose of this API is to provide customized VTA-specific capabilities to the core CAP framework by customizing certain HATEOS requests that are sent to /analyticsGateway.  This is done by the API registering 'Capabilities' with the CAP gateway. For SAS Advanced Analytics Internal use ONLY.
  version: "1"
  title: Text Analytics Provider
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: https://support.sas.com/techsup/license/index.html
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: ProviderDetails
  description: Provides information to an analytics provider gateway when registering
    as an analytics provider.
- name: Projects
  description: Contains the operations for managing text analytics projects.
- name: Enumerations
  description: Enumerations.
- name: Language
  description: Provides language related operations.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      operationId: root
      description: Returns the links to the top-level resources for the API.
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example-1:
                  value:
                    version: 1
                    links:
                    - method: POST
                      rel: run
                      href: /textAnalyticsProvider/jobs
                      uri: /textAnalyticsProvider/jobs
                      type: application/vnd.sas.job.execution.job
                      responseType: application/vnd.sas.job.execution.job
                    - method: GET
                      rel: enumerations
                      href: /textAnalyticsProvider/enumerations
                      uri: /textAnalyticsProvider/enumerations
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.analytics.enumeration.group
                    - method: POST
                      rel: scaImport
                      href: /textAnalyticsProvider/projects
                      uri: /textAnalyticsProvider/projects
                      type: application/vnd.sas.text.analytics.import.project
                      responseType: application/vnd.sas.job.execution.job
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example-1:
                  value:
                    version: 1
                    links:
                    - method: POST
                      rel: run
                      href: /textAnalyticsProvider/jobs
                      uri: /textAnalyticsProvider/jobs
                      type: application/vnd.sas.job.execution.job
                      responseType: application/vnd.sas.job.execution.job
                    - method: GET
                      rel: enumerations
                      href: /textAnalyticsProvider/enumerations
                      uri: /textAnalyticsProvider/enumerations
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.analytics.enumeration.group
                    - method: POST
                      rel: scaImport
                      href: /textAnalyticsProvider/projects
                      uri: /textAnalyticsProvider/projects
                      type: application/vnd.sas.text.analytics.import.project
                      responseType: application/vnd.sas.job.execution.job
  /enumerations:
    get:
      tags:
      - Enumerations
      summary: Get enumerations
      description: Gets enumerations that are specific to text analysis workflow as
        well as a localized value that can be displayed in current user's locale.  This
        returns a resource collection of type enumerationGroup.
      operationId: getEnumerations
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/enumerationGroup"
              examples:
                json:
                  $ref: "#/components/examples/getEnumerationsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/enumerationGroup"
              examples:
                json:
                  $ref: "#/components/examples/getEnumerationsResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/enumerations400Response"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/enumerations400Response"
