components:
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    analyticsProviderDetails:
      title: Analytics provider details
      description: Details about the text analytics provider
      type: object
      required:
      - productIds
      - type
      - version
      properties:
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
        description:
          type: string
          description: Localized provider description
        providedLinks:
          type: object
          description: Map that indicates provider links that should be added to various
            media types
        providerCapabilities:
          type: object
          description: Map that indicates the capabilities this provider supports
        providerName:
          type: string
          description: Localized provider name
        productIds:
          type: array
          description: "List of licensed product ids associated with the provider.\
            \ Each id must have an existing, unexpired license in order for the provider\
            \ to be made available to gateway clients."
          items:
            type: integer
            format: int32
        type:
          type: string
          description: Localized string that describes the project type handled by
            the provider
        version:
          type: integer
          format: int32
          description: The version number of this representation schema.
    importConcept:
      description: A concept to be imported.
      title: A concept to be imported.
      x-sas-media-type: application/vnd.sas.text.concept.import+json;version=1
      required:
      - id
      - version
      allOf:
      - type: object
        properties:
          name:
            type: string
            description: The user defined name of the concept
          value:
            type: string
            description: The rule value of the concept. To include multiple rules
              separate each one with a newline character.
          preDefined:
            type: boolean
            description: Determines wheter the concept is a predefined concept or
              not. The default is FALSE
          enabled:
            type: boolean
            description: The enabled or disabled status of the concept. The default
              is TRUE.
          caseInsensitive:
            type: boolean
            description: This value is used to determine whether to ignore case differences
              or not while matching the documents to the concept. Optional. The default
              is TRUE.
          priority:
            type: integer
            description: This value used when scoring uses the Best Match setting.
              Optional. Default value is 10.
          children:
            type: array
            description: A list of other SAS Contexual Analysis concepts that are
              children concepts to the current SAS Contextual Analysis concept
            items:
              $ref: "#/components/schemas/importConcept"
    importCategory:
      description: A category to be imported.
      title: A category to be imported.
      x-sas-media-type: application/vnd.sas.text.category.import+json;version=1
      required:
      - id
      - version
      allOf:
      - type: object
        properties:
          name:
            type: string
            description: The user defined name of the category
          value:
            type: string
            description: The rule value of the category
          children:
            type: array
            description: A list of other SAS Contextual Analysis categories that are
              children categories to the current SAS Contextual Analysis category
            items:
              $ref: "#/components/schemas/importCategory"
