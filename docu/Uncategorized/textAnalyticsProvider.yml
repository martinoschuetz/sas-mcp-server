          description: The ID of the user that created or submitted the job.
          type: string
        modifiedBy:
          description: The ID of the user that last modified the job.
          type: string
        links:
          type: array
          description: The links that are associated with the job.
          items:
            $ref: "#/components/schemas/link"
    choice:
      title: Validation Choice
      description: An valid value for a property.
      properties:
        displayValue:
          type: string
          description: The value displayed to a user for selecting the choice.
        value:
          type: string
          description: The value assigned to a property if the choice is selected.
    instant:
      title: Instant
      description: An instantaneous point on the time-line.
      properties:
        epochSecond:
          description: The number of seconds from the epoch of 1970-01-01T00:00:00Z.
          type: integer
          format: int64
        nano:
          description: The number of nanoseconds, later along the time-line, from
            the seconds field.  This is always positive, and never exceeds 999,999,999.
          type: integer
          format: int32
    validationConstraint:
      title: Validation Constraint
      description: A description of the valid values for a property.
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          description: The constraint type.
          enum:
          - range
          - choicelist
        enabledWhen:
          type: string
          description: An expression describing when the constraint is enabled.
        enabledWhenValue:
          type: boolean
          description: An indication of whether or not this item is enabled for a
            given set of property values. It is an evaluation of the enabledWhen expression
            over the property values.
        overrideLink:
          $ref: "#/components/schemas/link"
    request:
      title: Job Request
      description: The job request.
      x-sas-media-type:
        name: application/vnd.sas.job.execution.job.request
        version: 1
      required:
      - id
      type: object
      properties:
        version:
          type: integer
          description: The version number of the representation. The current version
            is 2.
        id:
          type: string
          description: The unique identifier for the job.
        name:
          type: string
          description: The name of the job.
        description:
          type: string
          description: The description of the job.
        creationTimeStamp:
          description: The timestamp for when the job was created, in the format of
            `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        modifiedTimeStamp:
          description: The timestamp for when the job was last modified, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
          type: string
        createdBy:
          description: The ID of the user that created or submitted the job.
          type: string
        modifiedBy:
          description: The ID of the user that last modified the job.
          type: string
        jobDefinitionUri:
          type: string
          description: The URI of the job definition that is to be executed.
        jobDefinition:
          type: object
          description: The definition of the job that is to be executed.
        expiresAfter:
          type: string
          description: The duration of time (in <a href="https://www.w3.org/TR/xmlschema-2/#duration"
            target="_blank">W3C XML duration format</a>) after the completion of the
            job when the job should be deleted by the Job Execution service.
        arguments:
          type: object
          description: The values of the arguments described in the job definition.
        properties:
          type: object
          description: The value of properties in the format of (map<string, string>)
            that contains name value pairs (map<name, value>). The maximum name value
            length is 100.
          additionalProperties:
            type: string
        links:
          type: array
          description: The links that are associated with the job.
          items:
            $ref: "#/components/schemas/link"
