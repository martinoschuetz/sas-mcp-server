          type: string
          description: Additional message to explain the project status
        projectType:
          type: string
          description: The project type.  Corresponds to a provider id
        providerSpecificProperties:
          type: object
          description: A map to hold provider specific project information
          additionalProperties:
            type: string
        readOnlySharing:
          type: boolean
          description: 'Last selected mode of sharing. If true, and shared is true,
            then project is shared in read-only mode. Ignored if not shared.'
