  "/projects/{projectId}/languageMode":
    get:
      tags:
      - Projects
      summary: Get project language mode
      description: Get language mode for a project.
      operationId: getProjectLanguageMode
      parameters:
      - name: projectId
        in: path
        description: project ID.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.text.language.modes+json:
              schema:
                $ref: "#/components/schemas/languageModes"
              examples:
                json:
                  $ref: "#/components/examples/getProjectLanguageModeResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/languageModes"
              examples:
                json:
                  $ref: "#/components/examples/getProjectLanguageModeResponse"
    put:
      tags:
      - Projects
      summary: Set project language mode
      description: Set language mode for a project.
      operationId: updateProjectLanguageMode
      parameters:
      - name: projectId
        in: path
        description: project ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              type: string
            examples:
              example-1:
                value: MANUAL
      responses:
        "204":
          description: OK
  "/projects/{projectId}/languages":
    get:
      tags:
      - Projects
      summary: Get project languages
      description: Get project languages.
      operationId: getProjectLanguages
      parameters:
      - name: projectId
        in: path
        description: project ID.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/languageCollection"
              examples:
                json:
                  $ref: "#/components/examples/getProjectLanguagesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/languageCollection"
              examples:
                json:
                  $ref: "#/components/examples/getProjectLanguagesResponse"
    put:
      tags:
      - Projects
      summary: Set project language
      description: Set project language.
      operationId: updateProjectLanguages
      parameters:
      - name: projectId
        in: path
        description: project ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              type: string
            examples:
              example-1:
                value: EN
      responses:
        "204":
          description: OK
  "/projects/{projectId}/dataSource":
    post:
      tags:
      - Projects
      summary: Updates an existing project's data input
      description: "Create a job to handle the input data changing for the project.\
        \ The input data can be the same table that was used during the project creation\
        \ or can be a new table.  This endpoint creates a job to handle the update\
        \ asynchronously and returns the job.  The job will copy the CAS Table to\
        \ a project-specific CAS LIB. It also resets all the components in every pipeline\
        \ to a state of created, forcing the user to rerun the pipeline, as the data\
        \ may have changed."
      operationId: createUpdateDataSourceJob
      requestBody:
        content:
          application/json: {}
      parameters:
      - name: projectId
        in: path
        description: ID of the project.
        required: true
        schema:
          type: string
      - name: newDataSourceUri
        in: query
        description: "URI for new data source for the project. If this query parameter\
          \ is not provided, this end point will refresh the original data."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/postDataSourceResponse"
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/postDataSourceResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/postDataSourceError"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/postDataSourceError"
  "/projects/importSCA":
    post:
      x-sas-internal: true
      tags:
      - Projects
      summary: Imports a SAS Contextual Analysis (SCA) project
      description: "Creates a job to handle the import of a SAS Contextual Analysis\
        \ (SCA) project asynchronously and returns it. The job will first create a\
        \ concepts and category taxonomy using the information from the input request\
        \ and then creates a new Visual Text Analytics project using those taxonomies."
      operationId: createImportJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/importProject"
            examples:
              json:
                $ref: "#/components/examples/scaImportRequest"
          application/vnd.sas.text.analytics.import.project+json:
            schema:
              $ref: "#/components/schemas/importProject"
            examples:
              json:
                $ref: "#/components/examples/scaImportRequest"
        description: The SCA project import object
        required: true
      parameters:
      - name: parentFolderUri
        in: query
        description: "Specifies the URI of the folder in which to place the imported\
          \ project. If the resource could not be placed in the folder, the import\
          \ fails."
        required: false
        schema:
          type: string
      responses:
        "201":
          description: The request succeeded.
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
            Location:
              description: Location of the job
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/scaImportResponse"
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/scaImportResponse"
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/importSCA400Response"
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/importSCA400Response"
  "/projects/{projectId}/pipelines/{pipelineId}/components/{componentId}/state":
    put:
      tags:
      - Projects
      summary: Updates the component state
      description: Updates the component state of the specified pipeline belonging
        to the specified project. This end point doesn't return any request body as
        we are just updating the state of the component.
      operationId: updateComponentState
      parameters:
      - name: projectId
        in: path
        description: ID of the text project
        required: true
        schema:
          type: string
      - name: pipelineId
        in: path
        description: ID of the pipeline
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: ID of the component in the specified pipeline
        required: true
        schema:
          type: string
      - name: actionPerformed
        in: query
        description: "The action which was performed on the component. If the action\
          \ is TOPIC_PROMOTED, the category component state will be changed to modified."
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The request succeeded.
        "400":
          description: The request was invalid.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
