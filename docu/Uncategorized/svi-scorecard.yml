---
openapi: 3.0.3
info:
  version: '1'
  title: Scorecard
  description: The Scorecard REST API provides access to the Scorecard functionality
    in Visual Investigator.
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: 'https://developer.sas.com'
tags:
- name: Batch Job
  description: Endpoints related to Batch Jobs.
- name: Root
  description: Endpoints related to Root.
- name: Scorecard
  description: Endpoints related to Scorecard.
- name: Scorecard Definition
  description: Endpoints related to Scorecard Definitions.
- name: SviJobController
  description: Endpoints related to Jobs.
- name: Transport
  description: Endpoints related to Transport.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the root API
      operationId: root
      description: The root of the API. This resource returns an Api object.
      responses:
        '200':
          description: Api object returned successfully.
          headers:
            Content-Type:
              description: The Content Type of the response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                api:
                  $ref: '#/components/examples/api'
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                api:
                  $ref: '#/components/examples/api'
  /jobs/{batchId}:
    parameters:
    - name: batchId
      in: path
      description: The ID of the batch job
      required: true
      schema:
        type: string
        maxLength: 36
    get:
      tags:
      - Batch Job
      summary: Get full representation of a batch job
      description: Performs a GET request returning the full representation of the
        batch.
      operationId: getJob
      responses:
        '200':
          description: Batch job details
          headers:
            ETag:
              description: Entity tag for the resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/batchJobRep'
              examples:
                batchJobExample:
                  $ref: '#/components/examples/batchJobExample'
            vnd.sas.investigation.score.batch.job/json:
              schema:
                $ref: '#/components/schemas/batchJobRep'
              examples:
                batchJobExample:
                  $ref: '#/components/examples/batchJobExample'
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '404':
          description: Batch job not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
    head:
      tags:
      - Batch Job
      summary: Check existence of a batch job
      description: Performs a HEAD request to check the existence of a batch job.
      operationId: headersForCheckJob
      parameters:
      - name: batchId
        in: path
        description: The ID of the batch job
        required: true
        schema:
          type: string
          maxLength: 36
      responses:
        '200':
          description: Batch job exists
          headers:
            ETag:
              description: Entity tag for the resource.
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '404':
          description: Batch job not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
    patch:
      tags:
      - Batch Job
      summary: Patch a batch job
      description: Updates a specific batch job by providing a BatchJobRep object.
      operationId: patchJob
      parameters:
      - name: batchId
        in: path
        description: The ID of the batch job to be patched
        required: true
        schema:
          type: string
          maxLength: 36
      requestBody:
        description: The representation of the batch job to be patched
        required: true
        content:
          application/vnd.sas.investigation.score.batch.job/json:
            schema:
              $ref: '#/components/schemas/batchJobRep'
            examples:
              BatchJobExample:
                $ref: '#/components/examples/batchJobExample'
      responses:
        '200':
          description: Batch job updated successfully
          content:
            application/vnd.sas.investigation.score.batch.job/json:
              schema:
                $ref: '#/components/schemas/batchJobRep'
              examples:
                BatchJobExample:
                  $ref: '#/components/examples/batchJobExample'
            application/json:
              schema:
                $ref: '#/components/schemas/batchJobRep'
              examples:
                BatchJobExample:
                  $ref: '#/components/examples/batchJobExample'
        '400':
          description: Invalid input, object invalid
          content:
            application/vnd.sas.error+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error2'
                - $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
                error2ValidationFailureResponse:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '404':
          description: Batch job not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
        '412':
          description: Precondition Failed
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response412:
                  $ref: '#/components/examples/error2Response412'
  /jobs:
    get:
      tags:
      - Batch Job
      summary: Returns a collection of batch jobs
      description: Perform a GET request returning a collection of batch jobs.
      operationId: getBatchJobs
      parameters:
      - name: start
        in: query
        description: Index to start with
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: limit
        in: query
        description: Limit query
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sortBy
        in: query
        description: Sort order
        required: false
        schema:
          type: string
          default: 'creationTimeStamp:descending'
      - name: filter
        in: query
        description: Query options
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Collection of batch jobs
          content:
            application/vnd.sas.collection/json:
              schema:
                $ref: '#/components/schemas/batchJobRepCollection'
              examples:
                BatchJobRepCollectionExample:
                  $ref: '#/components/examples/batchJobRepCollectionExample'
            application/json:
              schema:
                $ref: '#/components/schemas/batchJobRepCollection'
              examples:
                BatchJobRepCollectionExample:
                  $ref: '#/components/examples/batchJobRepCollectionExample'
          headers:
            Content-Type:
              description: The Content Type of the response.
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '404':
          description: Batch job not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
    post:
      tags:
      - Batch Job
      summary: Create a new batch job
      description: Create a new batch job by providing a BatchJobRep object.
      operationId: createJob
      requestBody:
        description: The representation of the batch job to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/batchJobRep'
            examples:
              batchJobExample:
                $ref: '#/components/examples/batchJobExample'
          application/vnd.sas.investigation.score.batch.job/json:
            schema:
              $ref: '#/components/schemas/batchJobRep'
            examples:
              batchJobExample:
                $ref: '#/components/examples/batchJobExample'
      responses:
        '201':
          description: Batch job created successfully
          content:
            application/vnd.sas.investigation.score.batch.job/json:
              schema:
                $ref: '#/components/schemas/batchJobRep'
              examples:
                batchJobExample:
                  $ref: '#/components/examples/batchJobExample'
            application/json:
              schema:
                $ref: '#/components/schemas/batchJobRep'
              examples:
                batchJobExample:
                  $ref: '#/components/examples/batchJobExample'
        '400':
          description: Invalid input, object invalid
          content:
            application/vnd.sas.error+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error2'
                - $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
                error2ValidationFailureResponse:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '409':
          description: An existing item already exists
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response409:
                  $ref: '#/components/examples/error2Response409'
    head:
      tags:
      - Batch Job
      summary: Check existence of batch jobs
      description: Performs a HEAD request to check the existence of batch jobs.
      operationId: headersForBatchJobs
      parameters:
      - name: start
        in: query
        description: Index to start with
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: limit
        in: query
        description: Limit query
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sortBy
        in: query
        description: Sort order
        required: false
        schema:
          type: string
          default: 'creationTimeStamp:descending'
      - name: filter
        in: query
        description: Query options
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Batch jobs exist
          headers:
            Content-Type:
              description: The Content Type of the response.
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '404':
          description: Batch job not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
  /jobs/{batchId}/batchActions/{actionType}:
    post:
      tags:
      - Batch Job
      summary: Perform action on a batch job
      description: Performs a specified action on a batch job.
      operationId: createPerformAction
      parameters:
      - name: batchId
        in: path
        description: The ID of the batch job to perform action on
        required: true
        schema:
          type: string
          maxLength: 36
      - name: actionType
        in: path
        description: The type of action to be performed
        required: true
        schema:
          type: string
      - name: modifiedTimeStamp
        in: query
        description: Modified timestamp
        required: false
        schema:
          type: string
          maxLength: 100
      - name: modifiedOverride
        in: query
        description: Modified override
        required: false
        schema:
          type: string
          default: false
          maxLength: 100
      - name: asynchronous
        in: query
        description: If the action should be performed asynchronously
        required: false
        schema:
          type: boolean
          default: false
      - name: sas-svi-job-id
        in: header
        description: The job tracking Id
        required: false
        schema:
          type: string
          maxLength: 50
      - name: sas-svi-job-category-id
        in: header
        description: The job tracking category Id
        required: false
        schema:
          type: string
          maxLength: 50
      - name: sas-svi-job-subtask-id
        in: header
        description: The job tracking subtask Id
        required: false
        schema:
          type: string
          maxLength: 50
      responses:
        '200':
          description: Action performed successfully
          content:
            application/vnd.sas.investigation.score.batch.job/json:
              schema:
                $ref: '#/components/schemas/batchJobRep'
              examples:
                batchJobExample:
                  $ref: '#/components/examples/batchJobExample'
            application/json:
              schema:
                $ref: '#/components/schemas/batchJobRep'
              examples:
                batchJobExample:
                  $ref: '#/components/examples/batchJobExample'
        '202':
          description: Action request accepted and will be processed asynchronously
        '404':
          description: Not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error2'
                - $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
                error2ValidationFailureResponse:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
  /sviJobs/{jobCorrelationId}/ROLL_BACK:
    post:
      tags:
      - SviJobController
      summary: Rollback a batch job
      description: Rollback a batch job using its job correlation id.
      operationId: createRollbackBatchJob
      parameters:
      - name: jobCorrelationId
        in: path
        description: The correlation ID of the batch job to be rolled back
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Batch job rolled back and its representation returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/batchJobRep'
              examples:
                batchJobExample:
                  $ref: '#/components/examples/batchJobExample'
            application/vnd.sas.investigation.score.batch.job/json:
              schema:
                $ref: '#/components/schemas/batchJobRep'
              examples:
                batchJobExample:
                  $ref: '#/components/examples/batchJobExample'
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error2'
                - $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
                error2ValidationFailureResponse:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
  /config:
    get:
      tags:
      - Transport
      summary: "Export configurations"
      operationId: "getHandle"
      description: "Retrieve configurations from the server."
      responses:
        '200':
          description: "Successful operation"
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/configurationObject'
            application/json:
              schema:
                $ref: '#/components/schemas/configurationObject'
          headers:
            Content-Type:
              description: The Content Type of the response.
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '500':
          description: Not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response500'
      security:
      - ScorecardFeatures:
        - EXPORT
    post:
      tags:
      - Transport
      summary: "Import configurations"
      operationId: "createHandle"
      description: "Post configurations to the server."
      requestBody:
        content:
          application/zip:
            schema:
              type: "string"
              format: "binary"
        required: true
      responses:
        '200':
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error2'
                - $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
                error2ValidationFailureResponse:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
      security:
      - ScorecardFeatures:
        - IMPORT
        - ADMIN
  /definition/{definitionId}/batches/{batchId}/scorecards/{scoreId}:
    parameters:
    - in: header
      name: Accept-Item
      description: The type of representation to return.
      required: true
      schema:
        type: string
    - in: path
      name: definitionId
      description: The definition Id
      required: true
      schema:
        type: string
        maxLength: 36
    - in: path
      name: batchId
      description: The batch Id
      required: true
      schema:
        type: string
        maxLength: 36
    - in: path
      name: scoreId
      description: The score Id
      required: true
      schema:
        type: string
        maxLength: 36
    get:
      tags:
      - Scorecard
      summary: "Get summary scorecard"
      description: "Get summary scorecard"
      operationId: getSummaryScorecard
      responses:
        '200':
          description: "Successful operation"
          headers:
            ETag:
              description: Entity tag for the resource.
              schema:
                type: string
          content:
            application/vnd.sas.investigation.score.scorecard.summary/json:
              schema:
                $ref: '#/components/schemas/scorecardSummaryDefinition'
              examples:
                scorecardSummaryExample:
                  $ref: '#/components/examples/scorecardSummaryExample'
            application/json:
              schema:
                $ref: '#/components/schemas/scorecardSummaryDefinition'
              examples:
                scorecardSummaryExample:
                  $ref: '#/components/examples/scorecardSummaryExample'
            application/vnd.sas.investigation.score.scorecard.full/json:
              schema:
                $ref: '#/components/schemas/fullScorecardDefinitionRep'
              examples:
                scorecardSummaryExample:
                  $ref: '#/components/examples/fullScorecardDefinitionRepExample'
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '404':
          description: Not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
    head:
      tags:
      - Scorecard
      summary: "Get summary headers"
      description: "Get Summary headers"
      operationId: "headersForSummary"
      responses:
        '200':
          description: "Successful operation"
          headers:
            ETag:
              description: Entity tag for the resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: "object"
              examples:
                headResponse:
                  $ref: '#/components/examples/headResponseExample'
            application/vnd.sas.investigation.score.scorecard.summary/json:
              schema:
                $ref: '#/components/schemas/scorecardSummaryDefinition'
              examples:
                headResponse:
                  $ref: '#/components/examples/headResponseExample'
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
  /definition/{definitionId}/scorecards:
    parameters:
    - in: path
      name: definitionId
      description: The definition Id
      required: true
      schema:
        type: string
        maxLength: 36
    - name: start
      in: query
      description: Index to start with
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    - name: limit
      in: query
      description: Limit query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
    - name: sortBy
      in: query
      description: Sort order
      required: false
      schema:
        type: string
        default: 'default'
    - name: filter
      in: query
      description: Query options
      required: false
      schema:
        type: string
    get:
      tags:
      - Scorecard
      summary: "Return a collection of summary scorecards"
      description: "Return a collection of summary scorecards"
      operationId: "getSummaryCollection"
      responses:
        '200':
          description: "Successful operation"
          headers:
            ETag:
              description: Entity tag for the resource.
              schema:
                type: string
          content:
            application/vnd.sas.collection/json:
              schema:
                $ref: '#/components/schemas/scorecardSummaryCollection'
              examples:
                scorecardSummaryCollectionExample:
                  $ref: '#/components/examples/scorecardSummaryCollectionExample'
            application/json:
              schema:
                $ref: '#/components/schemas/scorecardSummaryCollection'
              examples:
                scorecardSummaryCollectionExample:
                  $ref: '#/components/examples/scorecardSummaryCollectionExample'
            application/vnd.sas.investigation.score.scorecard.summary/json:
              schema:
                $ref: '#/components/schemas/scorecardSummaryDefinition'
              examples:
                scorecardSummaryExample:
                  $ref: '#/components/examples/scorecardSummaryExample'
            application/vnd.sas.investigation.score.scorecard.full/json:
              schema:
                $ref: '#/components/schemas/fullScorecardDefinitionRep'
              examples:
                scorecardSummaryExample:
                  $ref: '#/components/examples/fullScorecardDefinitionRepExample'
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '404':
          description: The summary scorecard definition with the definition ID \"tester2\"
            was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response404'
    head:
      tags:
      - Scorecard
      summary: "Return the headers for a collection of summary scorecards"
      description: "Return a collection of summary scorecards"
      operationId: "headersForSummaryCollection"
      responses:
        '200':
          description: "Successful operation"
          headers:
            ETag:
              description: Entity tag for the resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: "object"
              examples:
                headResponse:
                  $ref: '#/components/examples/headResponseExample'
            application/vnd.sas.collection/json:
              schema:
                $ref: '#/components/schemas/scorecardSummaryCollection'
              examples:
                headResponse:
                  $ref: '#/components/examples/headResponseExample'
  /definitions/{definitionId}:
    parameters:
    - name: definitionId
      in: path
      description: The definition Id
      required: true
      schema:
        type: string
        maxLength: 36
    get:
      tags:
      - Scorecard Definition
      summary: "Performs a GET request returning the full representation of the definition"
      description: "Performs a GET request returning the full representation of the\
        \ definition"
      operationId: "getScorecardDefinition"
      responses:
        '200':
          description: A scorecard definition
          headers:
            ETag:
              description: Entity tag for the resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scorecardDefinitionRep'
              examples:
                ScorecardDefinitionRepExample:
                  $ref: '#/components/examples/scorecardDefinitionRepExample'
            application/vnd.sas.investigation.score.definition/json:
              schema:
                $ref: '#/components/schemas/scorecardDefinitionRep'
              examples:
                ScorecardDefinitionRepExample:
                  $ref: '#/components/examples/scorecardDefinitionRepExample'
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '404':
          description: The scorecard definition with the definition ID \"tester2\"
            was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response404'
    head:
      tags:
      - Scorecard Definition
      summary: "Returns the headers for the full representation of the definition"
      description: "Returns the headers for the full representation of the definition"
      operationId: "headersForScorecardDefinition"
