          description: The media type of each item in the collection.
          example: application/vnd.sas.health.metering.collection+json
        count:
          type: integer
          description: The number of items returned.
          example: 4
        version:
          type: integer
          description: The version of this collection representation.
          example: 2
        links:
          type: array
          description: Links to related resources (self, collection).
          items:
            $ref: "#/components/schemas/link"
        items:
          type: array
          items:
            $ref: "#/components/schemas/meteringEntry"
