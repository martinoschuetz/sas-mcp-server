    ingestionStepHistory:
      title: ingestion's steps history record
      description: Historical record of the execution of a data ingestion step.
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      - $ref: "#/components/schemas/stepStartEnd"
      - type: object
        properties:
          stepId:
            example: efc53099-96b2-4126-90a8-b5b59140a4fd
            type: string
            description: Specifies the ID of the data ingestion step that is being
              executed. This can be an extraction ID, a transformation ID, a load
              ID, or a job ID.
          mappingId:
            example: ce0dbee3-01a9-4a9f-a7a8-d7b1f2cf738f
            type: string
            description: The ID of the mapping used in the data ingestion.
          mappingName:
            description: The name of the mapping used in the data ingestion.
            type: string
            example: FHIR 4B to SAS Health
          fileName:
            description: The name of the file used in the data ingestion.
            type: string
            example: bedoccupancy_bundle.json
          executionStep:
            example: Extraction
            type: string
            enum:
            - Extraction
            - Transformation
            - Load
            - EntityResolution
            description: Name of the data ingestion step that is being executed ("Extraction",
              "Transformation", "Load", or "EntityResolution").
          ingestionId:
            example: de0dbee3-01a9-4a9f-a7a8-d7b1f2cf738f
            type: string
            description: ID for the data ingestion.
          type:
            example: FHIR
            type: string
            enum:
            - FHIR
            - CSV
          recordCount:
            example: 2328
            type: integer
            description: The number of records processed by the data ingestion step.
              This can be the number of records extracted from the source data store,
              the number of records transformed, or the number of records loaded to
              the destination database.
          status:
            example: Error
            type: string
            enum:
            - Running
            - Canceled
            - Complete
            - Warnings
            - Error
            description: The current status of the data ingestion step.
          statusDescription:
            example: "Error 1049: Unknown database 'hls_cdm'"
            type: string
            description: Description of the current status of the data ingestion step.
          schemaName:
            example: HLS_CDM
            type: string
            description: Name of the schema for the destination database.
          tableName:
            example: HLS_PATIENT
            type: string
            description: Name of the table being loaded in the destination database.
          sourceConnId:
            example: 89fb9213-54bf-453c-9d80-075d6d7c76b1
            type: string
            description: ID for the connection to the source data store (for example,
              FHIR) from which to extract the data.
          targetConnId:
            example: 80226ea6-bdf9-415b-8c66-9cf01c27ea3f
            type: string
            description: ID for the connection to the target data store (for example,
              SingleStore) to receive the loaded the data.
          connectionName:
            example: Azure FHIR Connection
            type: string
            description: Name of the connection to the source data store (for example,
              FHIR) from which to extract the data.
          targetConnName:
            example: HLS CDM for SingleStore
            type: string
            description: Name of the connection to the target data store (for example,
              SingleStore) to receive the loaded the data.
          scheduleId:
            example: 7866167d-057d-4c79-9862-ecb0d9d41d79
            type: string
            description: ID for the scheduled job that launched the data ingestion.
          scheduleName:
            example: Once a week
            type: string
            description: Name of the scheduled job that launched the data ingestion.
          recurrenceDescription:
            example: Happens once a week for 4 times
            type: string
            description: Description of the recurrence if the scheduled data ingestion
              is set to be a recurrent incremental data load.
          recurrenceFrequency:
            example: weekly
            type: string
            enum:
            - minutely
            - hourly
            - daily
            - weekly
            - monthly
            description: Frequency of the recurrence if the scheduled data ingestion
              is set to be a recurrent incremental data load.
          recurrenceInterval:
            example: 1
            type: integer
            description: Interval of the recurrence if the scheduled data ingestion
              is set to be a recurrent incremental data load.
          loadType:
            example: incremental
            type: string
            enum:
            - complete
            - incremental
            description: Type of data load requested for the data ingestion ("complete"
              or "incremental").
          stepURL:
            example: https://sasazureapifhirdev.azurehealthcareapis.com/$export?_type=Patient
            type: string
            description: Specifies the relevant URL for the current step. For an extraction,
              this is the URL used to extract the data from the FHIR server. For a
              transformation, this is the URL of the file that contains the results
              of the transformation. For a load, this is empty. For entity resolution,
              this is the URL of the SAS log file for the entity resolution job.
          submissionStartTimeStamp:
            example: 2022-12-05T08:15:30-05:00
            type: string
            description: Timestamp for when the data ingestion started.
          submissionEndTimeStamp:
            example: 2022-12-05T10:15:30-05:00
            type: string
            description: Timestamp for when the data ingestion ended.
          nextRun:
            example: 2022-12-05T10:15:30-05:00
            type: string
            description: Timestamp for the next time the data ingestion is scheduled
              to be executed.
          entityResolutionEnabled:
            type: boolean
            example: true
            description: Flag to indicate if entity resolution should be performed
              as part of the ingestion.
