        "428":
          $ref: "#/components/responses/428"
    delete:
      summary: Delete a custom target table, its default mappings and its references
        in connections
      description: |
        Delete a custom target table.

        It also deletes the target table's default mappings and references to the target table in connections.

        Only administrators can delete a custom target table. If a non administrator tries to delete a custom target table he'll get an `HTTP 403` error response.

        Only custom (created by an administrator) target tables can be deleted. If you try to delete a target table provided by SAS during installation you'll get an `HTTP 405` error response.

        Only custom target tables that are neither currently being ingested nor scheduled for future ingestion can be deleted. If you attempt to delete a custom target table that is either actively ingested or scheduled for future ingestion, you’ll receive a HTTP 409 error response.

        Clients that do not support DELETE can use POST with no request body and specify the query parameters `?_method=DELETE&targetId={targetId}`.
      operationId: deleteTargetTable
      tags:
      - Target Tables
      responses:
        "204":
          description: No content.
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                version: 2
                httpStatusCode: 400
                errorCode: 144517
                message: The specified ID for the target "{Id}" is not a valid UUID.
        "405":
          description: Read-only target tables cannot be deleted.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                readOnly:
                  description: SAS-provided target tables cannot be deleted.
                  value:
                    version: 2
                    httpStatusCode: 405
                    errorCode: 144057
                    message: You cannot delete the target table with ID "{targetID}"
                      because it was provided by SAS during installation.
        "409":
          description: Cannot delete a target table that either being ingested or
            scheduled to be ingested.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                ingesting:
                  description: Error when trying to delete a custom target table that
                    is being ingested.
                  value:
                    version: 2
                    httpStatusCode: 409
                    errorCode: 144058
                    message: You cannot delete the target table because it is currently
                      being used in a data ingestion by schedule "my Schedule".
                    remediation: Try again when the schedule has completed.
                scheduled:
                  description: Error when trying to delete a custom target table that
                    is scheduled to be ingested.
                  value:
                    version: 2
                    httpStatusCode: 409
                    errorCode: 144059
                    message: The target table could not be deleted beacuse it's scheduled
                      to be ingested via a schedule named 'blah'.
                    remediation: Either deactivate or delete the schedule 'blah' and
                      try again.
    patch:
      summary: Delete specific mappings from a default target table
      description: |
        Partially updates a default target table by deleting multiple mappings as specified in a JSON patch.
        See https://datatracker.ietf.org/doc/html/rfc6902 for details about the JSON patch.
        Only the "remove" operation for a JSON patch is supported. No other operations for a JSON patch are supported.

        After the deletion, a representation of the updated default target table is returned.

        Because a HTTP PATCH operation is atomic, either all the requested mappings are successfully deleted or none of them is deleted.

        Clients that do not support PATCH can use POST /targetTables and specify the query parameters `?_method=PATCH&targetId={targetId}`.
      operationId: patchTargetTable
      tags:
      - Target Tables
      parameters:
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/ifUnmodifiedSince"
      requestBody:
        $ref: "#/components/requestBodies/targetTableJSONPatch"
      responses:
        "200":
          description: The target table was updated successfully. Return a JSON representation
            of the updated target table.
          content:
            application/vnd.sas.health.default-target-table:
              schema:
                $ref: "#/components/schemas/patchTargetTableResponse"
              examples:
                Updated Target Table:
                  $ref: "#/components/examples/patchedTargetTableResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/patchTargetTableResponse"
              examples:
                Updated Target Table:
                  $ref: "#/components/examples/patchedTargetTableResponse"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "404":
          $ref: "#/components/responses/404"
        "400":
          description: The JSON patch request is not well-formed (for example, invalid
            JSON syntax).
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "409":
          description: |
            The patch request is syntactically valid but would result in a resource state that is inconsistent or invalid.

            For example the target table would miss a required mapping or existing instances of the default target table used in connections are still using the deleted mappings for ingestions.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/conflict"
        "415":
          description: |
            The server refuses to accept the request because the payload format is in an unsupported format.

            For example the payload's Content-Type may not match the expected Content-Type.

            The response SHOULD include an Accept-Patch response header to notify the client what patch document media types are supported.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/unsupportedMediaType"
        "412":
          $ref: "#/components/responses/412"
