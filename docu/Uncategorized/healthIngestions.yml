---
openapi: 3.0.3
info:
  title: Health Ingestions
  version: "1"
  description: |
    The SAS Health API enables you to ingest health data from various industry standards such as FHIR into a common data model. That data can be leveraged within the SAS Health suite of products for further analysis.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: example.com/healthIngestions
  description: local mock server
tags:
- description: Contains the operations for the root resource.
  name: Root
- description: Operations for managing the common data model database information.
  name: Common Data Model Information
- description: Manage connection details.
  name: Connection Details
- description: Manage the mapping of fields from external data sources to fields in
    the common data model tables for a specified connection.
  name: Connection Target Field Mappings
- description: Manages the common data model target tables for a given connection.
  name: Connection Targets
- description: Manages the types of connections to external health data sources (such
    as FHIR).
  name: Connection Types
- description: Manages the connections to external health data sources (such as FHIR).
  name: Connections
- description: Operations for managing data sources.
  name: Data Sources
- description: Manage data views.
  name: Data Views
- description: Extracts data from external data sources.
  name: Extracts
- description: Operations for managing data uploads to the common data model.
  name: File Upload
- description: Operations for managing the history of ingestion executions.
  name: History
- description: Orchestrates the extraction, transformation, and loading of data from
    external data sources into the common data model.
  name: Ingestions
- description: Operations for managing the insight reports.
  name: Insight Reports
- description: Loads data into the common data model.
  name: Loads
- description: Operations for managing codes in Data Model Lookup Table.
  name: Lookup Codes
- description: Operations for managing mappings.
  name: Mappings
- description: Operations for managing mapping file uploads.
  name: Mappings Upload
- description: Operations for querying patient metering data. Use the `period` parameter
    to aggregate by month, quarter, or year.
  name: Metering
- description: Operations for managing rule sets.
  name: Rule Sets
- description: Operations for managing the styles that are used for rendering common
    data model table information in a user interface.
  name: Table Styles
- description: Manages the field mappings of external data sources to tables in the
    common data model.
  name: Target Tables
- description: Transforms the original shape of the data from external data sources
    into a shape suitable for storage in the common data model.
  name: Transforms
- description: Operations for managing value sets.
  name: Value Sets
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      operationId: root
      description: Returns a list of links to the top-level operations surfaced through
        this API.
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getHealthIngestionsRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getHealthIngestionsRootResponse"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
  /connections:
    get:
      summary: Get the list of connections to an external data source
      description: Get the list of connections to an external data source
      operationId: getConnections
      tags:
      - Connections
      responses:
        "200":
          description: The expected response to a valid request.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/connectionCollection"
              examples:
                default:
                  $ref: "#/components/examples/ConnectionCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/connectionCollection"
              examples:
                default:
                  $ref: "#/components/examples/ConnectionCollection"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
    post:
      tags:
      - Connections
      summary: Create a new connection
      description: Create a connection that has a system-generated ID
      operationId: createConnection
      requestBody:
        required: true
        description: The connection to create or test
        content:
          application/vnd.sas.health.connection+json:
            schema:
              $ref: "#/components/schemas/connection"
            examples:
              default:
                $ref: "#/components/examples/ConnectionRequestBody"
          application/json:
            schema:
              $ref: "#/components/schemas/connection"
            examples:
              default:
                $ref: "#/components/examples/ConnectionRequestBody"
      responses:
        "201":
          description: The request succeeded and either the created connection is
            returned or the results of testing the connection are returned.
          headers:
            Location:
              description: The URI of the newly created connection. Not present when
                testing a connection.
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/vnd.sas.health.connection+json:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                default:
                  $ref: "#/components/examples/AzureFHIRconnection"
            application/json:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                default:
                  $ref: "#/components/examples/AzureFHIRconnection"
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                version: 2
                httpStatusCode: 400
                errorCode: 144003
                message: The request's body does not match the expected media type.
                remediation: Correct the errors and try again.
        "404":
          $ref: "#/components/responses/404"
  /commons/validations/connections:
    post:
      tags:
      - Connections
      summary: Test the connection
      description: Verify that a connection can be established.
      operationId: createConnectionTest
      requestBody:
        $ref: "#/components/requestBodies/connectionTest"
      responses:
        "200":
          description: The connection has been tested. The results of the test are
            returned.
          headers:
            Content-Type:
              schema:
                $ref: "#/components/schemas/validation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                Can Connect:
                  $ref: "#/components/examples/connectionTestSuccess"
                Cannot Connect:
                  $ref: "#/components/examples/connectionTestFailure"
            application/vnd.sas.validation:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                Can Connect:
                  $ref: "#/components/examples/connectionTestSuccess"
                Cannot Connect:
                  $ref: "#/components/examples/connectionTestFailure"
        "201":
          description: The connection has been tested. The results of the test are
            returned.
          headers:
            Location:
              description: No location is returnd when testing a connection
              schema:
                type: string
            Content-Type:
              schema:
                $ref: "#/components/schemas/validation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                Can Connect:
                  $ref: "#/components/examples/connectionTestSuccess"
                Cannot Connect:
                  $ref: "#/components/examples/connectionTestFailure"
            application/vnd.sas.validation:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                Can Connect:
                  $ref: "#/components/examples/connectionTestSuccess"
                Cannot Connect:
                  $ref: "#/components/examples/connectionTestFailure"
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                version: 2
                httpStatusCode: 400
                errorCode: 144003
                message: The request's body does not match the expected media type.
                remediation: Correct the errors and try again.
  /connections/{connectionId}:
    parameters:
    - name: connectionId
      in: path
      required: true
      description: The ID of the connection
      schema:
        type: string
    get:
      summary: Get a specific connection to an external data source
      description: Retrieves the details for a specific connection to an external
        data source.
      operationId: getConnection
      tags:
      - Connections
      responses:
        "200":
          description: The expected response to a valid request.
          content:
            application/vnd.sas.health.connection+json:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                awsFHIR:
                  $ref: "#/components/examples/AWSFHIRconnection"
                default:
                  $ref: "#/components/examples/AzureFHIRconnection"
            application/json:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                awsFHIR:
                  $ref: "#/components/examples/AWSFHIRconnection"
                default:
                  $ref: "#/components/examples/AzureFHIRconnection"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "404":
          $ref: "#/components/responses/404"
    head:
      summary: Get the headers for a specific connection to an external data source
      description: HEAD for getting a specific connection to an external data source
        by id
      operationId: headersForGetConnection
      tags:
      - Connections
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
    delete:
      summary: Delete the specified connection
      description: Deletes connection specified through connection ID. Clients that
        do not support DELETE can use POST /connections with no request body and specify
        the query parameters `?_method=DELETE&connectionId={connectionId}`.
      operationId: deleteConnection
      tags:
      - Connections
      responses:
        "204":
          description: No content.
        "404":
          $ref: "#/components/responses/404"
    put:
      summary: Update the specified connection
      description: Updates the connection referenced by the connection id. Clients
        that do not support PUT can use POST /connections and specify the query parameters
        `?_method=PUT&connectionId={connectionId}`.
      operationId: updateConnection
      tags:
      - Connections
      requestBody:
        $ref: "#/components/requestBodies/connectionUpdate"
      responses:
        "200":
          description: The request succeeded and the connection was updated.
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/vnd.sas.health.connection:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                default:
                  $ref: "#/components/examples/connection"
            application/json:
              schema:
                $ref: "#/components/schemas/connection"
              examples:
                default:
                  $ref: "#/components/examples/connection"
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                version: 2
                httpStatusCode: 400
                errorCode: 10011501
                message: The connection put request body is invalid or missing.
                remediation: Correct the errors and try again.
        "412":
          $ref: "#/components/responses/412"
        "428":
          $ref: "#/components/responses/428"
  /connections/{connectionId}/targets:
    get:
      summary: Get the list of connection targets
      description: Get the list of connection targets.
      operationId: getConnectionTargetTables
      tags:
      - Connection Targets
      parameters:
      - name: connectionId
        in: path
        required: true
        description: The ID of the connection to retrieve the connection targets for.
        schema:
          type: string
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: The expected response to a valid request.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/connectionTargetCollection"
              examples:
                default:
                  $ref: "#/components/examples/connectionTargetCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/connectionTargetCollection"
              examples:
                default:
                  $ref: "#/components/examples/connectionTargetCollection"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
    head:
      summary: Get the headers for the list of connection targets
      description: Get the headers for the list of connection targets.
      operationId: headersForGetConnectionTargetTables
      tags:
      - Connection Targets
      parameters:
      - name: connectionId
        in: path
        required: true
        description: The ID of the connection to retrieve the connection targets for.
        schema:
          type: string
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
    post:
      summary: Create the connection targets
      description: Creates connection targets for a connection. A connection may have
        at most one connection target with a given table ID, and attempting to create
        another connection target with the same table ID will result in the operation
        failing with a 409 status.
      operationId: createConnectionTargetTables
      tags:
      - Connection Targets
      parameters:
      - name: connectionId
        in: path
        required: true
        description: The ID of the connection to add connection targets to.
        schema:
          type: string
      requestBody:
        required: true
        description: The connection targets to be added to the connection.
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/connectionTargetCollection"
            examples:
              default:
                $ref: "#/components/examples/createConnectionTargets"
          application/json:
            schema:
              $ref: "#/components/schemas/connectionTargetCollection"
            examples:
              default:
                $ref: "#/components/examples/createConnectionTargets"
      responses:
        "201":
          description: The request succeeded and the created connection targets are
            returned.
          headers:
            Location:
              description: The URI of the newly created connection target.
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/vnd.sas.health.connection+json:
              schema:
                $ref: "#/components/schemas/connectionTargetCollection"
              examples:
                default:
                  $ref: "#/components/examples/connectionTargetCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/connectionTargetCollection"
              examples:
                default:
                  $ref: "#/components/examples/connectionTargetCollection"
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                version: 2
                httpStatusCode: 400
                errorCode: 10011501
                message: The connection target body is invalid or missing.
                remediation: Correct the errors and try again.
  /connections/{connectionId}/missingTables:
    get:
      summary: List of removed target tables for a connection
      description: Get the list of target tarbles removed from a connection.
      operationId: getRemovedConnectionTargetTables
      tags:
      - Connection Targets
      parameters:
      - name: connectionId
        in: path
        required: true
        description: The ID of the connection to retrieve the missing tables for.
        schema:
          type: string
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: The expected response to a valid request.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/targetTableCollection"
              examples:
                default:
                  $ref: "#/components/examples/TargetTableCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/targetTableCollection"
              examples:
                default:
                  $ref: "#/components/examples/TargetTableCollection"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
    head:
      summary: Get headers for the list of removed tables for a connection
      description: HEAD for getting the list of removed tables for a connection
      operationId: headersForGetRemovedConnectionTargetTables
      tags:
      - Connection Targets
      parameters:
      - name: connectionId
        in: path
        required: true
        description: The ID of the connection to retrieve the connection targets for.
        schema:
          type: string
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
  /connections/{connectionId}/targets/{targetId}:
    get:
      summary: Get a specific connection target
      description: Get a specific connection target
      operationId: getConnectionTargetObject
      tags:
      - Connection Targets
      parameters:
      - name: connectionId
        in: path
        required: true
        description: The ID of the connection to retrieve the connection target for.
        schema:
          type: string
      - name: targetId
        in: path
        required: true
        description: The ID of the targetTable to retrieve connectionTarget.
        schema:
          type: string
      responses:
        "200":
          description: The expected response to a valid request.
          content:
            application/vnd.sas.health.connection.target:
              schema:
                $ref: "#/components/schemas/connectionTarget"
              examples:
                default:
                  $ref: "#/components/examples/connectionTarget"
            application/json:
              schema:
                $ref: "#/components/schemas/connectionTarget"
              examples:
                default:
                  $ref: "#/components/examples/connectionTarget"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "404":
          $ref: "#/components/responses/404"
    patch:
      summary: Update the deleted field for a specific connection target
      description: Update the deleted field for a specific connection target
      operationId: patchConnectionTargetDeleted
      tags:
      - Connection Targets
      parameters:
      - name: connectionId
        in: path
        required: true
        description: The ID of the connection of the connection target.
        schema:
          type: string
      - name: targetId
        in: path
        required: true
        description: The ID of the connectionTarget to update field of
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/connectionTargetPatch"
      responses:
        "200":
          description: The request succeeded and the deleted field was updated.
          headers:
            Location:
              description: The URI of the patched object.
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/vnd.sas.health.connection.target:
              schema:
                $ref: "#/components/schemas/connectionTarget"
              examples:
                default:
                  $ref: "#/components/examples/connectionTarget"
            application/json:
              schema:
                $ref: "#/components/schemas/connectionTarget"
              examples:
                default:
                  $ref: "#/components/examples/connectionTarget"
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                version: 2
                httpStatusCode: 400
                errorCode: 10011501
                message: The connection target patch body is invalid or missing.
                remediation: Correct the errors and try again.
        "412":
          $ref: "#/components/responses/412"
    head:
      summary: Get the headers for a specific connection target
      description: Get the headers for a specific connection target.
      operationId: headersForConnectionTargetObject
      tags:
      - Connection Targets
      parameters:
      - name: connectionId
        in: path
        required: true
        description: The ID of the connection to retrieve the connection target for.
        schema:
          type: string
      - name: targetId
        in: path
        required: true
        description: The ID of the targetTable to retrieve connectionTarget.
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "404":
          $ref: "#/components/responses/404"
  /connections/{connectionId}/targets/{targetId}/fields:
    parameters:
    - name: connectionId
      in: path
      required: true
      description: The id of the connection.
      schema:
        type: string
    - name: targetId
      in: path
      required: true
      description: The ID of the target table
      schema:
        type: string
    get:
      summary: Get the list of fields for a target table
      description: Get the list of fields for a target table.
      operationId: getConnectionTargetMappings
      tags:
      - Connection Target Field Mappings
      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: The expected response to a valid request.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/targetTableFieldCollection"
              examples:
                default:
                  $ref: "#/components/examples/TargetTableFieldCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/targetTableFieldCollection"
              examples:
                default:
                  $ref: "#/components/examples/TargetTableFieldCollection"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
    head:
      summary: Get the headers for the list of fields for a target table
      description: Get the headers for the list of fields for a target table.
      operationId: headersForGetConnectionTargetTableFields
      tags:
      - Connection Target Field Mappings
      parameters:
      - $ref: "#/components/parameters/startParam"
      - $ref: "#/components/parameters/limitParam"
      - $ref: "#/components/parameters/filterParam"
      - $ref: "#/components/parameters/sortByParam"
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "404":
          $ref: "#/components/responses/404"
    post:
      summary: Create a field mapping for a target table
      description: >
        Create a field mapping for a target table. The mapping will have a system-generated
        ID.

        No duplicate fields are allowed.

        Two fields are considered duplicates if they belong to the same combination
        of connectionId/targetId path parameters and have the same "name" property.

        Attempting to create another field with the same combination of connectionId/targetId
        path parameters and "name" property will result in the operation
        failing with a 409 status.

        Clients that do not support DELETE can use POST with no request body and specify
        the query parameters `?_method=DELETE&fieldId={fieldId}`.
      operationId: createConnectionTargetMapping
      tags:
      - Connection Target Field Mappings
      requestBody:
        $ref: "#/components/requestBodies/connectionTargetField"
      responses:
        "201":
          description: The request succeeded and the created field is returned.
          headers:
            Location:
              description: The URI of the newly created field.
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/vnd.sas.health.target-table.field+json:
              schema:
                $ref: "#/components/schemas/targetTableField"
              examples:
                default:
                  $ref: "#/components/examples/targetTableField"
            application/json:
              schema:
                $ref: "#/components/schemas/targetTableField"
              examples:
                default:
                  $ref: "#/components/examples/targetTableField"
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                version: 2
                httpStatusCode: 400
                errorCode: 144003
                message: The request's body does not match the expected media type.
                remediation: Correct the errors and try again.
        "409":
          description: The provided field is a duplicate of an existing field
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/duplicateField"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/duplicateField"
    delete:
      summary: Delete the field mappings for a target table
      description: Delete the field mappings for a target table. Clients that do not
        support DELETE can use POST with no request body and specify a query parameter
        of `?_method=DELETE`.
      operationId: deleteConnectionTargetMappings
      tags:
      - Connection Target Field Mappings
      responses:
        "204":
          description: No content.
  /connections/{connectionId}/targets/{targetId}/missingCols:
    parameters:
    - name: connectionId
      in: path
      required: true
      description: The ID of the connection.
      schema:
        type: string
    - name: targetId
      in: path
      required: true
