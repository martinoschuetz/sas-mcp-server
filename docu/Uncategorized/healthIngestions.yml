  /metering:
    get:
      tags:
      - Metering
      summary: Get unique patient counts aggregated by period
      operationId: getMetering
      description: >
        Returns one entry for each period from the earliest recorded snapshot through
        the current period. Each entry contains the most recent unique patient count
        captured within that period. The period parameter controls aggregation granularity
        (month, quarter, or year).
      parameters:
      - name: period
        in: query
        required: true
        description: The time granularity used to aggregate unique patient counts.
        schema:
          type: string
          enum:
          - month
          - quarter
          - year
          example: month
      responses:
        "200":
          description: A collection of metering entries aggregated by the requested
            period.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/meteringCollection"
              examples:
                meteringByMonth:
                  $ref: "#/components/examples/meteringByMonthResponse"
                meteringByQuarter:
                  $ref: "#/components/examples/meteringByQuarterResponse"
                meteringByYear:
                  $ref: "#/components/examples/meteringByYearResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/meteringCollection"
              examples:
                meteringByMonth:
                  $ref: "#/components/examples/meteringByMonthResponse"
                meteringByQuarter:
                  $ref: "#/components/examples/meteringByQuarterResponse"
                meteringByYear:
                  $ref: "#/components/examples/meteringByYearResponse"
          headers:
            Content-Type:
              $ref: "#/components/headers/Content-Type"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
components:
  parameters:
    startParam:
      name: start
      in: query
      description: 0-based Offset of the first type to return. The defaults is 0.
      schema:
        type: integer
      example: 100
    limitParam:
      name: limit
      in: query
      description: Maximum number of studies to return. The defaults is 20.
      schema:
        type: integer
      example: 10
    filterParam:
      name: filter
      in: query
      description: >
        Filter criteria.
        See [Filtering in REST APIs](https://developer.sas.com/rest-apis/healthIngestions-v1/docs/getting-started/usage-notes#filtering).
      schema:
        type: string
        format: filter-criteria
      example: eq(name,'ACME')
    sortByParam:
      name: sortBy
      in: query
      description: >
        Sort returned types.
        See [Sorting in REST APIs](https://developer.sas.com/rest-apis/healthIngestions-v1/docs/getting-started/usage-notes#sorting).
      schema:
        type: string
        format: sort-criteria
      example: name
    ifNoneMatch:
      name: If-None-Match
      in: header
      description: >
        The value of the ETag that was returned from a GET request for this resource.
        Provide this header to perform a conditional GET request. The server will
        return the resource only if its ETag does not match the provided value.
      required: false
      schema:
        type: string
        example: W/"67ab43", "54ed21", "7892dd"
    ifMatch:
      name: If-Match
      in: header
      description: >
        The value of the ETag that was returned from a GET or previous
        PUT/POST of this resource. Either of If-Match or If-Unmodified-Since
        must be provided for conditional updates.
      required: false
      schema:
        type: string
      example: W/"1623426788185211000"
    ifUnmodifiedSince:
      name: If-Unmodified-Since
      in: header
      description: >
        The requested resource will update only if the resource has not been modified
        after the date specified by this HTTP header.
      required: false
      schema:
        type: string
      example: Sat, 10 Apr 2021 08:00:00 GMT
    mappingPatchRequestContent:
      name: Content-Type
      in: header
      description: >
        Media type representing the name of a field of an external source to map to
        a field of a table in the Common Data Model.
        Media type 'application/vnd.sas.health.connection.target.field.patch.request+json'
        is the default.
      required: false
      schema:
        type: string
        enum:
        - "application/vnd.sas.health.connection.target.field.patch.request+json"
        - "application/json"
    getRuleSetAcceptItemParam:
      name: Accept-Item
      in: header
      required: false
      description: |
        By default, this endpoint returns a summary of the rulesets.
        If the Accept-Item header is set to 'application/json' or 'application/vnd.sas.health.rule-set+json',
        then a full representation of rulesets is returned.
      schema:
        type: string
        format: media-type
        enum:
        - application/json
        - application/json;version=1
        - application/vnd.sas.health.rule-set+json
        - application/vnd.sas.health.rule-set+json;version=1
        - application/vnd.sas.health.rule-set.summary+json
        - application/vnd.sas.health.rule-set.summary+json;version=1
        default: application/vnd.sas.health.rule-set.summary+json
  schemas:
    meteringEntry:
      description: >
        Unique patient count for a single period. The fields present depend on
        the `period` query parameter: `month` entries include `year` and `month`;
        `quarter` entries include `year` and `quarter`; `year` entries include
        `year` only.
      title: Metering Entry
      type: object
      required:
      - year
      - uniquePatients
      properties:
        year:
          type: string
          description: The four-digit calendar year.
          example: "2026"
        month:
          type: string
          description: The two-digit calendar month (01–12). Present only when period=month.
          example: "04"
        quarter:
          type: string
          description: Quarter identifier (q1, q2, q3, q4). Present only when period=quarter.
          example: "q1"
        uniquePatients:
          type: integer
          format: int64
          description: The most recent unique patient count recorded within this period.
          example: 120
        version:
          type: integer
          description: The version of this representation.
          example: 1
        links:
          type: array
          description: Links to related resources.
          items:
            $ref: "#/components/schemas/link"
    meteringCollection:
