components:
  schemas:
    link:
      type: object
      properties:
        method:
          pattern: GET|PUT|PATCH|DELETE|POST|HEAD|COPY|OPTIONS|CONNECT|TRACE
          type: string
          xml:
            attribute: true
        rel:
          maxLength: 100
          minLength: 0
          type: string
          xml:
            attribute: true
        href:
          maxLength: 4000
          minLength: 0
          type: string
          xml:
            attribute: true
        uri:
          maxLength: 4000
          minLength: 0
          pattern: /.*
          type: string
          xml:
            attribute: true
        type:
          maxLength: 500
          minLength: 0
          type: string
          xml:
            attribute: true
        responseType:
          maxLength: 500
          minLength: 0
          type: string
          xml:
            attribute: true
        itemType:
          maxLength: 500
          minLength: 0
          type: string
          xml:
            attribute: true
        responseItemType:
          maxLength: 500
          minLength: 0
          type: string
          xml:
            attribute: true
        title:
          maxLength: 500
          minLength: 0
          type: string
          xml:
            attribute: true
      xml:
        name: link
    userGroupOptionsRep:
      type: object
      properties:
        userGroupSelectionStrategy:
          type: string
          description: UserGroup chooser selection strategy.
          enum:
          - USERS
          - GROUPS
          - USERS_AND_GROUPS
        allowMultipleUserGroupSelections:
          type: boolean
          description: Allow multiple UserGroup chooser selections.
      description: Usergroup options representation.
    userPromptRep:
      required:
      - label
      - name
      - solution
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
        userPromptId:
          type: string
          description: User prompt identifier.
        solution:
          maxLength: 250
          minLength: 0
          type: string
          description: document template solution.
        name:
          maxLength: 250
          minLength: 0
          type: string
          description: Prompt name.
        label:
          type: string
          description: Prompt label.
        defaultValue:
          type: string
          description: Prompt default value.
        required:
          type: boolean
          description: Require a value.
        controlType:
          type: string
          description: Control type for input.
          enum:
          - text
          - combobox
          - date
          - datetime
          - number
          - checkbox
          - usergroup
          - unsupported
        referenceDataListName:
          type: string
          description: Reference data list name for multi-valued inputs.
        format:
          type: string
          description: Prompt format.
        value:
          type: string
          description: Prompt value.
        maxLength:
          type: integer
          description: Maximum length of the value.
          format: int32
        multipleLines:
          type: boolean
          description: Whether to support multiple text input lines.
        showTwentyFourHourClock:
          type: boolean
          description: Whether to show the 24-hour clock on date inputs.
        showSeconds:
          type: boolean
          description: Whether to show seconds on date inputs.
        userGroupOptions:
          $ref: '#/components/schemas/userGroupOptionsRep'
      description: User prompt representation.
    errorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
          writeOnly: true
          deprecated: true
        errorCode:
          type: integer
          format: int32
          xml:
            attribute: true
        message:
          type: string
        details:
          type: array
          xml:
            wrapped: true
          items:
            type: string
            xml:
              name: detail
        remediation:
          type: string
        errors:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/errorResponse'
        id:
          type: string
          xml:
            attribute: true
        links:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/link'
        version:
          type: integer
          format: int32
        httpStatusCode:
          type: integer
          format: int32
          xml:
            attribute: true
        targetUri:
          type: string
          deprecated: true
      xml:
        name: error
