---
openapi: 3.0.3
info:
  title: Report Data
  version: "17"
  description: |
    Executes queries to retrieve data for a report.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/reportData
  description: example server
tags:
- name: Root
  description: The API root.
- name: Executors
  description: The operations for the executors resource.
- name: Jobs
  description: The operations for the jobs resource.
- name: Results
  description: The operations for the results resource.
- name: ResultsCache
  description: The operations for the results cache resource.
- name: MetadataSupplements
  description: The operations for the metadata supplements resource.
- name: Settings
  description: The operations for the settings.
- name: ValidateService
  description: The operations for service-specific details.
- name: Validation
  description: Runs checks on various scenarios to check for issues up front.
paths:
  /:
    get:
      tags:
      - Root
      summary: Returns a set of links to the top-level resources and operations in
        the service
      description: >
        For more details on the returned links, see <a
        href="#RootLinkRelations">Root Link Relations table</a>.
      operationId: root
      responses:
        "200":
          description: OK. Returns the service's links
          headers:
            Content-Type:
              description: application/vnd.sas.api+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                json:
                  $ref: "#/components/examples/responseGetTopLevel"
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                json:
                  $ref: "#/components/examples/responseGetTopLevel"
  /executors:
    head:
      summary: Get the headers associated with the collection of the executors on
        the system
      description: Since executors are only accessible by the user that created them,
        this is effectively a list of the executors owned by the current authenticated
        user.
      operationId: headersForExecutors
      tags:
      - Executors
      parameters:
      - name: Accept-Item
        description: This is an optional header. If not present then items of application/vnd.sas.report.data.executor+json
          type are returned.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.report.data.executor+json;version=1
          - application/vnd.sas.report.data.executor+json
          - application/json
          default: application/vnd.sas.report.data.executor+json;version=1
      responses:
        "200":
          description: OK. The collection returned can be empty.
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.report.data.executor+json;version=1
              schema:
                type: string
    get:
      summary: Get a collection of the executors on the system
      description: Since executors are only accessible by the user that created them,
        this is effectively a list of the executors owned by the current authenticated
        user.
      operationId: getExecutors
      tags:
      - Executors
      parameters:
      - name: Accept-Item
        description: This is an optional header. If not present then items of application/vnd.sas.report.data.executor+json
          type are returned.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.report.data.executor+json;version=1
          - application/vnd.sas.report.data.executor+json
          - application/json
          default: application/vnd.sas.report.data.executor+json;version=1
      responses:
        "200":
          description: OK. The collection returned can be empty.
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.report.data.executor+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/executors"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutors"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/executors"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutors"
            application/json:
              schema:
                $ref: "#/components/schemas/executors"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutors"
    post:
      summary: Create executor
      description: Create an executor (application/vnd.sas.report.data.executor) for
        the current authenticated user.
      operationId: createExecutor
      tags:
      - Executors
      parameters:
      - $ref: '#/components/parameters/executorType'
      - $ref: '#/components/parameters/createCasSessions'
      - $ref: '#/components/parameters/createThreadedHistory'
      - $ref: '#/components/parameters/historyTablename'
      responses:
        "201":
          description: Created. The response body will have the newly created executor
            (application/vnd.sas.report.data.executor) - this executor is considered
            to be owned by the current authenticated user.
          headers:
            Content-Type:
              description: application/vnd.sas.report.data.executor+json;version=1
              schema:
                type: string
            Location:
              description: The location header will include the URI that can be used
                to retrieve the executor. This URI is equivalent to the self link
                returned in the response body.
              schema:
                type: string
          content:
            application/vnd.sas.report.data.executor+json;version=1:
              schema:
                $ref: "#/components/schemas/executor"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateExecutorSuccess"
            application/vnd.sas.report.data.executor+json:
              schema:
                $ref: "#/components/schemas/executor"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateExecutorSuccess"
            application/json:
              schema:
                $ref: "#/components/schemas/executor"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateExecutorSuccess"
        '400':
          description: Failure. The response body will have the reason for the failure.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseCreateExecutorFailure"
  "/executors/{executorId}":
    head:
      summary: Gets a header for an executor
      operationId: headersForExecutor
      tags:
      - Executors
      description: Get the header for the executor identified by a particular id.
      parameters:
      - name: executorId
        in: path
        description: The id of the executor
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: Ok
          headers:
            Content-Type:
              description: application/vnd.sas.report.data.executor+json;version=1
              schema:
                type: string
    get:
      summary: Get an executor
      description: Get the executor identified by a particular id. An executor can
        only be retrieved by the user that created it.
      operationId: getExecutor
      tags:
      - Executors
      parameters:
      - name: executorId
        in: path
        description: The id of the executor
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: Ok
          headers:
            Content-Type:
              description: application/vnd.sas.report.data.executor+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.report.data.executor+json;version=1:
              schema:
                $ref: "#/components/schemas/executor"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorIdSuccess"
            application/vnd.sas.report.data.executor+json:
              schema:
                $ref: "#/components/schemas/executor"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorIdSuccess"
            application/json:
              schema:
                $ref: "#/components/schemas/executor"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorIdSuccess"
        "403":
          description: Forbidden; the executor was not created by the current authenticated
            user
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorIdFailure403"
        "404":
          description: Not Found; the executor is not present on the system
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorIdFailure404"
    delete:
      summary: Delete an executor
      description: Delete the executor identified by a particular id. An executor
        can only be deleted by the user that created it. Deleting an executor also
        cancels all jobs still running on that executor.
      operationId: deleteExecutor
      tags:
      - Executors
      parameters:
      - name: executorId
        in: path
        description: The id of the executor
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden; the executor was not created by the current authenticated
            user
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteExecutorFailure403"
        "404":
          description: Not Found; the executor is not present on the system
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteExecutorFailure404"
  "/executors/{executorId}/histories":
    head:
      summary: Gets a header for an executor histories
      operationId: headersForExecutorsHistories
      tags:
      - Executors
      description: Get the header for a collection of all the histories in the executor.
      parameters:
      - name: executorId
        in: path
        description: The unique identifier of the executor
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                type: string
    get:
      summary: Get executor histories
      description: Get a collection of all the histories in the executor.
      operationId: getExecutorHistories
      tags:
      - Executors
      parameters:
      - name: executorId
        in: path
        required: true
        description: The unique identifier of the executor
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.report.data.executor.history+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/executorHistoryCollection"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorHistoriesSuccessCollection"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/executorHistoryCollection"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorHistoriesSuccessCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/executorHistoryCollection"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorHistoriesSuccessCollection"
    post:
      summary: Create an executor history
      description: Creates an executor history based on the parameters
      operationId: createExecutorHistory
      tags:
      - Executors
      parameters:
      - name: executorId
        in: path
        required: true
        description: The unique identifier of the executor
        schema:
          type: string
      - name: sessionId
        in: query
        required: false
        description: The session to use for gathering the history. If the session
          is empty or not provided, all sessions in the executor will be used to gather
          history. If the session is one of the pooled sessions, all of the pooled
          sessions will be used to gather the history. If the session is a dedicated
          analytics session, only that session will be used to gather the history.
          The maximum field length is 150 chars.
        schema:
          type: string
      - name: dataDefinitions
        in: query
        required: false
        description: A comma separated list of the data definition names to be included
          in the history.  Only actions marked with the specified data definitions
          will be included in the history.  If the list is empty or not specified,
          no data definition filtering will occur.
        schema:
          type: string
      responses:
        "201":
          description: An executor history was created successfully
          headers:
            Content-Type:
              description: application/vnd.sas.report.data.executor.history+json;version=1
              schema:
                type: string
            Location:
              description: The location header will include the URI that can be used
                to retrieve the executor history. This URI is equivalent to the self
                link returned in the response body.
              schema:
                type: string
          content:
            application/vnd.sas.report.data.executor.history+json;version=1:
              schema:
                $ref: "#/components/schemas/executorHistory"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateExecutorHistorySuccess"
            application/vnd.sas.report.data.executor.history+json:
              schema:
                $ref: "#/components/schemas/executorHistory"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateExecutorHistorySuccess"
            application/json:
              schema:
                $ref: "#/components/schemas/executorHistory"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateExecutorHistorySuccess"
        '400':
          description: Failure. The response body will have the reason for the failure.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseCreateExecutorHistoryFailure400"
        "404":
          description: Failure. Either the executor id or the dedicated session id
            was not found.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseCreateExecutorHistoryFailure404"
  "/executors/{executorId}/histories/{historyId}":
    head:
      summary: Gets a header for an executor history
      operationId: headersForExecutorsHistory
      tags:
      - Executors
      description: Get the header for the executor identified by a particular id.
      parameters:
      - name: executorId
        in: path
        required: true
        description: The unique identifier of the executor
        schema:
          type: string
      - name: historyId
        in: path
        required: true
        description: The unique identifier of the history within the executor.
        schema:
          type: string
      responses:
        "200":
          description: Ok
          headers:
            Content-Type:
              description: application/vnd.sas.report.data.executor+json;version=1
              schema:
                type: string
    get:
      summary: Get an executor history
      description: Get the specified history within the specified executor
      operationId: getExecutorHistory
      tags:
      - Executors
      parameters:
      - name: executorId
        in: path
        required: true
        description: The unique identifier of the executor
        schema:
          type: string
      - name: historyId
        in: path
        required: true
        description: The unique identifier of the history within the executor.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded
          headers:
            Content-Type:
              description: application/vnd.sas.report.data.executor.history+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.report.data.executor.history+json;version=1:
              schema:
                $ref: "#/components/schemas/executorHistory"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorHistorySuccess"
            application/vnd.sas.report.data.executor.history+json:
              schema:
                $ref: "#/components/schemas/executorHistory"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorHistorySuccess"
            application/json:
              schema:
                $ref: "#/components/schemas/executorHistory"
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorHistorySuccess"
        "404":
          description: Either the executor id or the history id was not found
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseGetExecutorHistoryFailure"
    delete:
      summary: Delete an executor history
      description: Deletes the specified history
      operationId: deleteExecutorHistory
      tags:
      - Executors
      parameters:
      - name: executorId
        in: path
        description: The id of the executor
        required: true
        schema:
          type: string
          format: object-id
      - name: historyId
        in: path
        required: true
        description: The unique identifier of the history within the executor.
        schema:
          type: string
      responses:
        "204":
          description: No Content. The history was deleted
        "404":
          description: Either the executor id or the history id was not found
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteExecutorHistoryFailure"
  "/executors/{executorId}/jobs/{jobId}":
    delete:
      deprecated: true
      summary: Cancel a synchronous query job
      description: >
        Cancel the query job identified by a particular executor id / job id
        combination that was created with the _/results_ endpoint. This is a
        fire-and-forget operation - a successful response indicates that the
        request was accepted and has been passed on to the data processing
        layer, but does not guarantee completion. The original data query
        request will return with results once either the job or the cancellation
        is complete. **Deprecated:** Use [cancelJob](#cancelJob) operation
        instead.
      operationId: deleteExecutorJob
      tags:
      - Executors
      parameters:
      - name: executorId
        in: path
        description: The id of the executor
        required: true
        schema:
          type: string
          format: object-id
      - name: jobId
        in: path
        description: The id of the job. The maximum field length is 150 chars.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "202":
          description: Accepted; the cancellation request was accepted and passed
            on to the data processing layer
        "403":
          description: Forbidden; the executor was not created by the current authenticated
            user
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteExecutorIdJobIdFailure403"
        "404":
          description: Not Found; the executor was not found on the system
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteExecutorIdJobIdFailure404"
  "/executors/{executorId}/sessions/{sessionId}":
    delete:
      summary: Delete a CAS session that contains one or more generated resources
      description: Delete the CAS session identified by a particular executor id /
        session id combination.
      operationId: deleteExecutorSession
      tags:
      - Executors
      parameters:
      - name: executorId
        in: path
        description: The id of the executor
        required: true
        schema:
          type: string
          format: object-id
      - name: sessionId
        in: path
        description: >
          The id of the session. The sessionId for a particular data query
          request is identified through an attribute in the returned Results.
          Alternatively, the name of an associated generated resource may be
          specified as the sessionId and the associated CAS sessionId will be
          looked up. The maximum field length is 150 chars.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "204":
          description: No Content; the specified CAS session was deleted or did not
            exist
        "403":
          description: Forbidden; the executor was not created by the current authenticated
            user
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteExecutorIdSessionIdFailure403"
        "404":
          description: Not Found; the executor was not found on the system
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteExecutorIdSessionIdFailure404"
  "/executors/{executorId}/cache/dataSources/servers/{casServerName}/caslibs/{caslibName}/tables/{tableName}":
    delete:
      summary: Delete the executor's cached dataSource (table)
      description: >
        Clear the executor's cached information that it maintains for the
        specified dataSource (table) so that a single executor can continue to
        be used. This will help **optimize** CAS session reuse. **Since: Version
        3** <br><br> **Note:** The triplet dataSource identifier
        **/servers/{casServerName}/caslibs/{caslibName}/tables/{tableName}** is
        commonly used to identify a single table in CAS.
      operationId: deleteExecutorCachedDataSource
      tags:
      - Executors
      parameters:
      - name: executorId
        in: path
        description: The id of the executor
        required: true
        schema:
          type: string
          format: object-id
      - name: casServerName
        in: path
        description: The name of the cas server where the table is located. The maximum
          field length is 150 chars.
        required: true
        schema:
          type: string
          format: object-id
      - name: caslibName
        in: path
        description: The name of the cas library where the table is located. The maximum
          field length is 150 chars.
        required: true
        schema:
          type: string
          format: object-id
      - name: tableName
        in: path
        description: The name of the table that identifies the information to be cleared
          from the executor's cache. The maximum field length is 150 chars.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden; the executor was not created by the current authenticated
            user
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteExecutorIdCasTable403"
        "404":
          description: Not Found; the executor is not present on the system
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteExecutorIdCasTable404"
  /jobs#createDataQueryJob:
    post:
      summary: Create data query job
      description: >
        Create a data query job by supplying a mini BIRD Report including the
        Data Source / Data Definition / Query State information. If a **jobId**
        is specified, it must be globally unique among jobs. **Since: Version
        3**
      operationId: createDataQueryJob
      tags:
      - Jobs
      parameters:
      - $ref: "#/components/parameters/executorId"
      - $ref: "#/components/parameters/postJobId"
      - $ref: "#/components/parameters/dataDefinitions"
      - $ref: "#/components/parameters/indexStrings"
      - $ref: "#/components/parameters/embeddedData"
      - $ref: "#/components/parameters/useCache"
      - $ref: "#/components/parameters/homogenize"
      - $ref: "#/components/parameters/includeDiagnostics"
      - $ref: "#/components/parameters/sequence"
      - $ref: "#/components/parameters/wait"
      - $ref: "#/components/parameters/dataSetFormat"
      - $ref: "#/components/parameters/timeout"
      - $ref: "#/components/parameters/Accept-Language"
      - $ref: "#/components/parameters/Accept-Locale"
      - $ref: "#/components/parameters/Job-Accept-Item"
      requestBody:
        content:
          application/vnd.sas.report.query+json:
            schema:
              $ref: "#/components/schemas/reportQuery"
            examples:
              json:
                $ref: "#/components/examples/requestExampleDataQueryJson"
          application/json:
            schema:
              $ref: "#/components/schemas/reportQuery"
            examples:
              json:
                $ref: "#/components/examples/requestExampleDataQueryJson"
          application/vnd.sas.report.query+xml:
            schema:
              $ref: "#/components/schemas/reportQuery"
            examples:
              xml:
                $ref: "#/components/examples/requestExampleDataQueryXML"
          application/xml:
            schema:
              $ref: "#/components/schemas/reportQuery"
            examples:
              xml:
                $ref: "#/components/examples/requestExampleDataQueryXML"
      responses:
        "201":
          description: Created; the query job finished within the wait time
          headers:
            Content-Type:
              description: application/vnd.sas.report.data.job
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.report.results
              schema:
                type: string
            Location:
              description: The location header will include the URI that can be used
                to retrieve the job. This URI is equivalent to the self link returned
                in the response body.
              schema:
                type: string
          content:
