        data for the specified data definitions in a provided report
      description: >
        Check for any features used by the specified data definitions in the
        provided report content that are not supported for generating full
        interactive offline data.
        <br> This endpoint is intended to be used by the
        reportPackages service's validateOfflinePackage endpoints and is not
        typically called directly by a client.
        <br><br> Refer to <a href="#error-codes.md">SAS Error codes</a> for
        information on common error and failure codes.
      operationId: validateOfflineDataFromReportContent
      tags:
      - Validation
      parameters:
      - $ref: "#/components/parameters/dataDefinitions"
      requestBody:
        content:
          application/vnd.sas.report.content+json:
            schema:
              $ref: "#/components/schemas/reportContent"
            examples:
              json:
                $ref: "#/components/examples/requestBodyReportContentJsonOfflineData"
          application/json:
            schema:
              $ref: "#/components/schemas/reportContent"
            examples:
              json:
                $ref: "#/components/examples/requestBodyReportContentJsonOfflineData"
          application/vnd.sas.report.content+xml:
            schema:
              $ref: "#/components/schemas/reportContent"
            examples:
              xml:
                $ref: "#/components/examples/requestBodyReportContentXmlOfflineData"
          application/xml:
            schema:
              $ref: "#/components/schemas/reportContent"
            examples:
              xml:
                $ref: "#/components/examples/requestBodyReportContentXmlOfflineData"
        description: The body for this request is a BIRD Report that is provided in
          either XML or JSON format.
        required: true
      responses:
        "200":
          description: The requested validation completed successfully.
          headers:
            Content-Type:
              description: application/vnd.sas.report.data.offline.validation
              schema:
                type: string
          content:
            application/vnd.sas.report.data.offline.validation+json;version=1:
              schema:
                $ref: '#/components/schemas/reportDataOfflineValidation'
              examples:
                json:
                  $ref: "#/components/examples/responsePostOfflineDataJson200"
            application/vnd.sas.report.data.offline.validation+json:
              schema:
                $ref: '#/components/schemas/reportDataOfflineValidation'
              examples:
                json:
                  $ref: "#/components/examples/responsePostOfflineDataJson200"
            application/json:
              schema:
                $ref: '#/components/schemas/reportDataOfflineValidation'
              examples:
                json:
                  $ref: "#/components/examples/responsePostOfflineDataJson200"
            application/vnd.sas.report.data.offline.validation+xml;version=1:
              schema:
                $ref: '#/components/schemas/reportDataOfflineValidation'
              examples:
                xml:
                  $ref: "#/components/examples/responsePostOfflineDataXml200"
            application/vnd.sas.report.data.offline.validation+xml:
              schema:
                $ref: '#/components/schemas/reportDataOfflineValidation'
              examples:
                xml:
                  $ref: "#/components/examples/responsePostOfflineDataXml200"
            application/xml:
              schema:
                $ref: '#/components/schemas/reportDataOfflineValidation'
              examples:
                xml:
                  $ref: "#/components/examples/responsePostOfflineDataXml200"
        "400":
          description: Bad Request (e.g., Missing or invalid request parameter, Invalid
            object type).
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responsePostOfflineDataJson400"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                xml:
                  $ref: "#/components/examples/responsePostOfflineDataXml400"
        "409":
          description: Conflict. Report content downgrade is not supported. The report
            content sent in the body is a higher report version than the service supports.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
