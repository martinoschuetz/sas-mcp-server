        included in the body of the request. If a **reportVersion** is not
        specified with the **reportUri**, the default report content media-type
        for this release will be used. If **reportContent** is provided, the
        report version is determined from the xmlns schema. If both a
        **reportUri** and a **reportContent** body are provided in the request,
        the **reportContent** is used. <br><br> **Note:** The **executorId**
        query parameter for this endpoint was introduced, **Since: Version 4**.
        <br><br> **Note:** The **reportVersion** query parameter and determining
        the report content media-type version from the **reportContent** body
        were introduced, **Since: Version 5**. Prior to this release, only the
        latest version was supported. <br><br> Support for a detailed
        metadatas supplement response was added, **Since: Version 17**.
      operationId: createMetadataSupplement
      tags:
      - MetadataSupplements
      parameters:
      - $ref: "#/components/parameters/executorId"
      - $ref: "#/components/parameters/reportUri"
      - $ref: "#/components/parameters/reportVersion"
      - $ref: "#/components/parameters/Accept-Language"
      - $ref: "#/components/parameters/Accept-Locale"
      requestBody:
        content:
          application/vnd.sas.report.content+json:
            schema:
              $ref: "#/components/schemas/reportContent"
            examples:
              json:
                $ref: "#/components/examples/requestBodyReportContentJson"
          application/json:
            schema:
              $ref: "#/components/schemas/reportContent"
            examples:
              json:
                $ref: "#/components/examples/requestBodyReportContentJson"
          application/vnd.sas.report.content+xml:
            schema:
              $ref: "#/components/schemas/reportContent"
            examples:
              xml:
                $ref: "#/components/examples/requestBodyReportContentXml"
          application/xml:
            schema:
              $ref: "#/components/schemas/reportContent"
            examples:
              xml:
                $ref: "#/components/examples/requestBodyReportContentXml"
        description: The body for this request is a BIRD Report that is provided in
          either XML or JSON format. The report content may optionally include a SASReportState
          sub-element with overrides for the report state.
      responses:
        "201":
          description: Ok; metadata supplement created
          headers:
            Content-Type:
              description: application/vnd.sas.report.metadata.supplement
              schema:
                type: string
          content:
            application/vnd.sas.report.metadata.supplement+json:
              schema:
                $ref: "#/components/schemas/metadataSupplementV3"
              examples:
                json:
                  $ref: "#/components/examples/responsePostMetadataSupplementsJsonV3_201"
            application/vnd.sas.report.metadata.supplement+json;version=3:
              schema:
                $ref: "#/components/schemas/metadataSupplementV3"
              examples:
                json:
                  $ref: "#/components/examples/responsePostMetadataSupplementsJsonV3_201"
            application/vnd.sas.report.metadata.supplement+json;version=2:
              schema:
                $ref: "#/components/schemas/metadataSupplementV2"
              examples:
                json:
                  $ref: "#/components/examples/responsePostMetadataSupplementsJsonV2_201"
            application/vnd.sas.report.metadata.supplement+json;version=1:
              schema:
                $ref: "#/components/schemas/metadataSupplementV1"
              examples:
                json:
                  $ref: "#/components/examples/responsePostMetadataSupplementsJsonV1_201"
            application/json:
              schema:
                $ref: "#/components/schemas/metadataSupplementV3"
              examples:
                json:
                  $ref: "#/components/examples/responsePostMetadataSupplementsJsonV3_201"
            application/vnd.sas.report.metadata.supplement+xml:
              schema:
                $ref: "#/components/schemas/metadataSupplementV3"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsXmlV3_201"
            application/vnd.sas.report.metadata.supplement+xml;version=3:
              schema:
                $ref: "#/components/schemas/metadataSupplementV3"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsXmlV3_201"
            application/vnd.sas.report.metadata.supplement+xml;version=2:
              schema:
                $ref: "#/components/schemas/metadataSupplementV2"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsXmlV2_201"
            application/vnd.sas.report.metadata.supplement+xml;version=1:
              schema:
                $ref: "#/components/schemas/metadataSupplementV1"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsXmlV1_201"
            application/xml:
              schema:
                $ref: "#/components/schemas/metadataSupplementV3"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsXmlV3_201"
            application/vnd.sas.report.metadata.supplement.detail+json:
              schema:
                $ref: "#/components/schemas/metadataSupplementDetail"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsDetailJson_201"
            application/vnd.sas.report.metadata.supplement.detail+json;version=1:
              schema:
                $ref: "#/components/schemas/metadataSupplementDetail"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsDetailJson_201"
            application/vnd.sas.report.metadata.supplement.detail+xml:
              schema:
                $ref: "#/components/schemas/metadataSupplementDetail"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsDetailXml_201"
            application/vnd.sas.report.metadata.supplement.detail+xml;version=1:
              schema:
                $ref: "#/components/schemas/metadataSupplementDetail"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsDetailXml_201"
        "400":
          description: Bad Request; invalid parameters / invalid or incomplete query
            definition
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responsePostMetadataSupplementsJson400"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsXml400"
        "404":
          description: Report not found for the given 'reportUri'
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responsePostMetadataSupplementsJson404"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsXml404"
        "409":
          description: Conflict. Report content downgrade is not supported.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responsePostMetadataSupplementsJson409"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                xml:
                  $ref: "#/components/examples/responsePostMetadataSupplementsXml409"
