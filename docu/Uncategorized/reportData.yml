    requestExampleDataQueryXML:
      summary: Create data query job
      description: The request body contains a full BIRD Report with content
      value: |
        <?xml version="1.0" encoding="UTF-8"?>
        <SASReport xmlns="http://www.sas.com/sasreportmodel/bird-4.34.0" label="Report 1" implicitInteractions="reportPrompt sectionPrompt sectionLink" createdLocale="en" createdVersion="4.34.0" dateCreated="2023-10-12T18:06:11Z" dateModified="2023-10-12T18:06:11Z" createdApplication="SAS Visual Analytics 2020" nextUniqueNameIndex="27">
            <DataDefinitions>
                <ParentDataDefinition childQueryRelationship="independent" status="executable" dataSource="ds7" name="dd21">
                    <BusinessItems>
                        <RelationalDataItem name="bi24" base="bi8"/>
                        <RelationalDataItem name="bi25" base="bi17"/>
                    </BusinessItems>
                    <DataDefinition dataSource="ds7" type="multidimensional" name="dd22">
                        <MultidimensionalQuery detail="false">
                            <Axes>
                                <Axis type="column">
                                    <BusinessItem ref="bi24"/>
                                </Axis>
                                <Axis type="row">
                                    <BusinessItem ref="bi25"/>
                                </Axis>
                            </Axes>
                            <ColumnSortItems>
                                <MeasureSortItem ref="bi25" sortDirection="descending"/>
                                <SortItem ref="bi24" sortDirection="ascending"/>
                            </ColumnSortItems>
                        </MultidimensionalQuery>
                        <ResultDefinitions>
                            <ResultDefinition purpose="primary" maxRowsLookup="graphDefault" maxRowsBehavior="truncate" name="dd23"/>
                        </ResultDefinitions>
                    </DataDefinition>
                </ParentDataDefinition>
            </DataDefinitions>
            <DataSources>
                <DataSource label="CARS" type="relational" name="ds7">
                    <CasResource server="cas-shared-default" library="HPS" table="CARS" locale="en"/>
                    <BusinessItemFolder>
                        <DataItem name="bi8" xref="car"/>
                        <DataItem name="bi9" xref="color"/>
                        <DataItem name="bi10" xref="dealer"/>
                        <DataItem name="bi11" xref="dest"/>
                        <DataItem name="bi12" xref="dte"/>
                        <DataItem name="bi13" xref="returns"/>
                        <DataItem name="bi14" xref="sales"/>
                        <DataItem name="bi15" xref="type"/>
                        <DataItem name="bi16" xref="wght"/>
                        <PredefinedDataItem calculation="totalCount" name="bi17" label="Frequency" usage="quantitative" format="COMMA12."/>
                        <PredefinedDataItem calculation="totalCountPercent" name="bi18" label="Frequency Percent" usage="quantitative" format="PERCENT20.2"/>
                    </BusinessItemFolder>
                </DataSource>
            </DataSources>
            <VisualElements>
                <Graph graphType="bar" supplementalVisuals="ve26" resultDefinitions="dd23" name="ve20" data="dd21" label="Bar - car 1" applyDynamicBrushes="yes" sourceInteractionVariables="bi24">
                    <EditorProperties>
                        <Property key="isAutoLabel">true</Property>
                        <Property key="autoFrequencyQueryDataItemName">bi25</Property>
                    </EditorProperties>
                    <Title auto="true"><P><DynamicSpan key="bird.autotitle.template.oneOfTwo.fmt.txt"><Substitutions><Substitution valueType="label" variables="bi17"/><Substitution valueType="label" variables="bi8"/></Substitutions></DynamicSpan></P></Title>
        <![CDATA[<StatGraph border="false" opaque="false" includeMissingDiscrete="true" selectionMode="multiple" missingValueDisplay="autolabel">
            <Dimension/>
            <PadAttrs top="0px" bottom="0px" left="0px" right="0px"/>
            <Dimension/>
            <Meta>
                <DynVars>
                    <DynVar name="CATEGORY" description="CATEGORY_VAR" required="true" assignedType="character" type="character">
                        <DefaultValues>
                            <Value>dd23.bi24</Value>
                        </DefaultValues>
                    </DynVar>
                    <DynVar name="RESPONSE" description="MEASURE_VAR" required="true" assignedType="numeric" type="numeric" multiplesAllowed="true">
                        <DefaultValues>
                            <Value>dd23.bi25</Value>
                        </DefaultValues>
                    </DynVar>
                    <DynVar name="GROUP" description="SUBGROUP_VAR" required="false" type="character"/>
                    <DynVar name="COLUMN" description="HORIZONTAL_SERIES_VAR" required="false" type="character" multiplesAllowed="true"/>
                    <DynVar name="ROW" description="VERTICAL_SERIES_VAR" required="false" type="character" multiplesAllowed="true"/>
                    <DynVar name="TIP" description="TIP_VAR" required="false" assignedType="numeric" type="any" multiplesAllowed="true">
                        <DefaultValues>
                            <Value>dd23.bi24</Value>
                            <Value>dd23.bi25</Value>
                        </DefaultValues>
                    </DynVar>
                    <DynVar name="KEY_FRAME" description="ANIMATION" required="false" type="time" multiplesAllowed="false"/>
                    <DynVar name="HIDDEN" description="HIDDEN_VAR" required="false" type="character" multiplesAllowed="true"/>
                </DynVars>
                <DataNameMap>
                    <Entry model="LayoutDataMatrix" data="dd23"/>
                </DataNameMap>
            </Meta>
            <LayoutDataMatrix cellHeightMin="1px" cellWidthMin="1px" includeMissingClass="true" rowVars="ROW" columnVars="COLUMN" name="LayoutDataMatrix">
                <LayoutPrototypeOverlay2D>
                    <BarChartParm name="BarChart" tipListPolicy="replace" _stmt="barchart" compactLabelFormats="true" groupDisplay="cluster" orient="horizontal" stat="none" tip="TIP" category="CATEGORY" responseVars="RESPONSE" group="GROUP"/>
                    <XAxisOpts name="categoryAxis">
                        <DiscreteOpts sortOrder="data"/>
                        <LinearOpts>
                            <TickValueFormatOpts extractScale="true"/>
                        </LinearOpts>
                    </XAxisOpts>
                    <YAxisOpts reverse="true">
                        <DiscreteOpts tickValueFitPolicy="staggertruncatedrop" sortOrder="data" tickValueAppearance="auto"/>
                        <LinearOpts>
                            <TickValueFormatOpts extractScale="true"/>
                        </LinearOpts>
                    </YAxisOpts>
                </LayoutPrototypeOverlay2D>
            </LayoutDataMatrix>
            <LayoutGlobalLegend legendTitlePosition="top" allowCollapsed="true">
                <AutoLegend>
                    <GraphNames>
                        <Value>BarChart</Value>
                    </GraphNames>
                </AutoLegend>
            </LayoutGlobalLegend>
            <Animation keyFrameSortOrder="ascending_unformatted" keyFrame="KEY_FRAME"/>
            <OverviewAxis maxPlotSize="60px" minPlotSize="35px" visible="off" axis="categoryAxis"/>
        </StatGraph>
        ]]>
                </Graph>
                <Table columnSizing="autoFill" resultDefinitions="dd23" name="ve26" data="dd21" applyDynamicBrushes="yes" sourceInteractionVariables="bi24">
                    <Columns>
                        <Column variable="bi24"/>
                        <Column variable="bi25"/>
                    </Columns>
                </Table>
            </VisualElements>
            <View>
                <Section name="vi6" label="Page 1">
                    <Body>
                        <MediaContainer target="mt2">
                            <ResponsiveLayout orientation="vertical" overflow="fit">
                                <Weights mediaTarget="mt5" unit="percent">
                                    <Weight value="100%"/>
                                </Weights>
                                <Weights mediaTarget="mt4" unit="percent">
                                    <Weight value="100%"/>
                                </Weights>
                                <Weights mediaTarget="mt3" unit="percent">
                                    <Weight value="100%"/>
                                </Weights>
                            </ResponsiveLayout>
                            <Visual ref="ve20" name="vi19">
                                <ResponsiveConstraint>
                                    <WidthConstraint>
                                        <Width mediaTarget="mt3" preferredSizeBehavior="ignore" flexibility="flexible"/>
                                    </WidthConstraint>
                                    <HeightConstraint>
                                        <Height mediaTarget="mt3" preferredSizeBehavior="ignore" flexibility="flexible"/>
                                    </HeightConstraint>
                                </ResponsiveConstraint>
                            </Visual>
                        </MediaContainer>
                    </Body>
                </Section>
            </View>
            <MediaSchemes>
                <MediaScheme name="ms1">
                    <BaseStylesheetResource theme="opal"/>
                    <Stylesheet><![CDATA[]]></Stylesheet>
                </MediaScheme>
            </MediaSchemes>
            <MediaTargets>
                <MediaTarget windowSize="default" scheme="ms1" name="mt2"/>
                <MediaTarget windowSize="small" scheme="ms1" name="mt3"/>
                <MediaTarget windowSize="medium" scheme="ms1" name="mt4"/>
                <MediaTarget windowSize="large" scheme="ms1" name="mt5"/>
            </MediaTargets>
            <Properties>
                <Property key="displayDataSource">ds7</Property>
            </Properties>
            <ExportProperties>
                <Export destination="pdf">
                    <Property key="showCoverPage" value="true"></Property>
                    <Property key="showPageNumbers" value="true"></Property>
                </Export>
            </ExportProperties>
            <History>
                <Versions>
                    <Version key="4.34.0" lastDate="2023-10-12T18:06:11Z"/>
                </Versions>
            </History>
            <SASReportState>
                <View/>
            </SASReportState>
        </SASReport>
