            Content-Type:
              description: text/plain
              schema:
                type: string
    get:
      summary: Get current query job state
      description: >
        Get the current state of the query job identified by a particular id. A
        job can only be retrieved by the user that created it. **Since: Version
        3**
      operationId: getJobState
      tags:
      - Jobs
      parameters:
      - name: jobId
        in: path
        description: The id of the job. The maximum field length is 150 chars.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: The current state of the query job. One of 'pending', 'running',
            'canceling', 'completed', 'canceled', or 'failed'.
          headers:
            Content-Type:
              description: text/plain
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              examples:
                api:
                  summary: A job state example
                  description: The current state of the query job.
                  value: pending
        "403":
          description: Forbidden; the job was not created by the current authenticated
            user
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseGetJobsJobIdStateJson403"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                xml:
                  $ref: "#/components/examples/responseGetJobsJobIdStateXml403"
        "404":
          description: Not Found; the job is not present on the system
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseGetJobsJobIdStateJson404"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                xml:
                  $ref: "#/components/examples/responseGetJobsJobIdStateXml404"
    put:
      summary: Cancel query job
      description: >
        Cancels the query job identified by a particular id. A job can only be
        canceled by the user that created it. Note that canceling the job simply
        sends a signal to the query that it should cancel. How the query reacts
        to that signal is dependent on the specifics for that query and does not
        guarantee that query will be canceled. **Since: Version 3**
      operationId: cancelJob
      tags:
      - Jobs
      parameters:
      - name: jobId
        in: path
        description: The id of the job
        required: true
        schema:
          type: string
          format: object-id
      - name: value
        in: query
        description: |
          The state **canceled** is the only supported state.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The current state of the cancelled query job. One of 'canceling',
            'completed', 'canceled', or 'failed'.
          content:
            text/plain:
              schema:
                type: string
              example: "canceled"
        "400":
          description: Bad Request; a value other than 'canceled' was specified.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responsePutJobsJobIdStateJson400"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                xml:
                  $ref: "#/components/examples/responsePutJobsJobIdStateXml400"
        "403":
          description: Forbidden; the job was not created by the current authenticated
            user
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responsePutJobsJobIdStateJson403"
            application/vnd.sas.error+xml;version=2:
