    reportDataOfflineValidation:
      description: Represents any issues that would prevent generating full rollup
        data for the specified data definitions in a provided report.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1
        valid:
          type: boolean
          description: This indicates if the data definition will contain data in
            offline mode. If it is false, the data definition uses some feature that
            is not able to determine any data for offline viewing. If true, data can
            be determined, although there may still be messages indicating that full
            rollup data to support interactivity for offline viewing could not be
            determined.
        error:
          $ref: '#/components/schemas/error'
        messages:
          type: array
          description: Details about all the features used in the visual elements
            that depend on the data definition that will impact the functionality
            of the report when using an offline package. These messages indicate which
            visual element is impacted. If the visual element is part of a composite,
            then the CompositeContainer will be indicated. There can be multiple distinct
            messages for a visual element, but duplicates will be filtered out.
          items:
            $ref: '#/components/schemas/reportDataOfflineValidationMessages'
      example:
        version: 1
        valid: true
        messages:
        - type: limitedInteractivity
          reportElement: ve37
          message: Data-driven content is not supported.
        - type: limitedInteractivity
          reportElement": ve37
          message: Automatic actions are not supported.
    reportDataOfflineValidationMessages:
      description: Contains the details of an individual validation failure.
      type: object
      properties:
        type:
          type: string
          description: The validation failure type. This differentiates between visuals
            that can be rendered in their initial state but will not support full
            interactivity, those visuals that are not supported at all in offline
            packages, and the reason why further queries were needed to generate the
            offline data.
          enum:
          - limitedInteractivity
          - unsupportedFeature
          - offlineNeedsAdvancedProcessing
        reportElement:
          type: string
          description: The name of the reportElement that failed validation. For composite
            visuals, this will be the name of the CompositeContainer.
        message:
          type: string
          description: A descriptive message of the validation failure.
    api:
