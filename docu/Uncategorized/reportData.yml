    reportContent:
      type: object
      description: >
        This media type contains a full <a
        href="http://sww.sas.com/saspedia/SASReport_(Business_Intelligence_Report_Definition)">SASReport</a>
        XML or JSON. <br><br>  Versioning for this media type is tied to the BIRD
        Schema version.  Supported versions are identified  by the `/reports/versions`
        and `/reports/versions/@defaultVersion` endpoints in the **reports** service.
        The `/reports/versions` endpoint provides a list of the supported versions
        + a mapping between the media
        type version and the associated SASReport schema version for each, and the
        `/reports/versions/@defaultVersion`
        endpoint identifies the default for unversioned requests.        
    reportQuery:
      type: object
      description: >
        This media type contains <a
        href="http://sww.sas.com/saspedia/SASReport_(Business_Intelligence_Report_Definition)">SASReport</a>
        XML or JSON with <a
        href="http://sww.sas.com/saspedia/DataSource_(Business_Intelligence_Report_Definition)">DataSource</a>
        and <a
        href="http://sww.sas.com/saspedia/DataDefinition_(Business_Intelligence_Report_Definition)">DataDefinition</a>
        elements. The query may also optionally include a <a
        href="http://sww.sas.com/saspedia/SASReportState_(Business_Intelligence_Report_Definition)">SASReportState</a>
        element with related Query State. Additional details and guidance on
        formulating valid BIRD queries can be found on the <a
        href="http://sww.sas.com/saspedia/Business_Intelligence_Report_Definition#Data_Topics">BIRD
        Data Topics</a> pages. <br><br>  Versioning for this media type is tied to
        the BIRD Schema version.  Supported versions are identified  by the `/reports/versions`
        and `/reports/versions/@defaultVersion` endpoints in the **reports** service.
        The `/reports/versions` endpoint provides a list of the supported versions
        + a mapping between the media
        type version and the associated SASReport schema version for each, and the
        `/reports/versions/@defaultVersion`
        endpoint identifies the default for unversioned request
    reportQueryState:
      type: object
      description: >
        This media type is represented by a <a
        href="http://sww.sas.com/saspedia/SASReportState_(Business_Intelligence_Report_Definition)">SASReportState</a>
        XML or JSON element with <a
        href="http://sww.sas.com/saspedia/Parameters_(State)_(Business_Intelligence_Report_Definition)">Parameters</a>
        and <a
        href="http://sww.sas.com/saspedia/Data_(State)_(Business_Intelligence_Report_Definition)">Data
        state</a>. Refer to the <a
        href="http://sww.sas.com/saspedia/Business_Intelligence_Report_Definition_Document_State_Specification">BIRD
        Report State specification</a> for additional information. <br><br>
        Versioning for this media type is tied to the BIRD Schema version.  Supported
        versions are identified  by the `/reports/versions` and `/reports/versions/@defaultVersion`
        endpoints in the **reports** service.
        The `/reports/versions` endpoint provides a list of the supported versions
        + a mapping between the media
        type version and the associated SASReport schema version for each, and the
        `/reports/versions/@defaultVersion`
        endpoint identifies the default for unversioned requests.        
    reportResults:
      type: object
      description: >
        This media type contains <a
        href="http://sww.sas.com/saspedia/SASReport_(Business_Intelligence_Report_Definition)">SASReport</a>
        XML or JSON with <a
        href="http://sww.sas.com/saspedia/Results_(Business_Intelligence_Report_Definition)">Results</a>
        Results and <a
        href="http://sww.sas.com/saspedia/Properties_(Business_Intelligence_Report_Definition)">Properties</a>.
        Refer to the <a
        href="http://sww.sas.com/saspedia/Business_Intelligence_Report_Definition_Results_Specification">BIRD
        Results specification</a> for additional information. <br><br>
        Versioning for this media type is tied to the BIRD Schema version.  Supported
        versions are identified  by the `/reports/versions` and `/reports/versions/@defaultVersion`
        endpoints in the **reports** service.
        The `/reports/versions` endpoint provides a list of the supported versions
        + a mapping between the media
        type version and the associated SASReport schema version for each, and the
        `/reports/versions/@defaultVersion`
        endpoint identifies the default for unversioned requests.        
    dataExternal:
      description: This returns JSON formatted data from a query.
      required:
      - version
      - resultName
      - rowCount
      - availableRowCount
      - data
      - columns
      - parameters
      properties:
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 1.
        resultName:
          type: string
          description: The name of the associated query result
        rowCount:
          type: integer
          format: int32
          description: The number of rows in the data.
        availableRowCount:
          type: integer
          format: int32
          description: For truncated results, the number of available rows meeting
            the query criteria.
        data:
          type: array
          description: A 2-dimensional array of data values, organized in row-major
            order.
          items:
            type: array
            items:
              type: string
        columns:
          type: array
          description: Zero or more data external column objects
          items:
            $ref: "#/components/schemas/dataExternalColumn"
        parameters:
          type: array
          description: Zero or more data external parameter objects
          items:
            $ref: "#/components/schemas/dataExternalParameter"
    dataExternalColumn:
      type: object
      description: Information about a data external column
      required:
      - name
      - label
      - type
      properties:
        name:
          type: string
          description: The column name
        label:
          type: string
          description: The column label
        datatype:
          title: type
          type: string
          description: The column type
          enum:
          - string
          - number
          - date
          - datetime
        usage:
          type: string
          description: >
            Populated only for **number** and **date** columns, the usage
            identifies whether the column is categorical, quantitative, or
            should be used for data brushing.
          enum:
          - categorical
          - quantitative
          - brush
        aggregation:
          type: string
          description: The column aggregation. Populated only for `number`
        format:
          $ref: "#/components/schemas/dataExternalFormat"
    dataExternalFormat:
      type: object
      description: >
        The object used for formatting to the value. Populated only for
        **number**, **date** and **datetime**.
      required:
      - name
      - width
      - precision
      - formatString
      properties:
        name:
          type: string
          description: SAS Format name
        width:
          type: integer
          format: int32
          description: The non-negative decimal integer indicating the minimum number
            of characters to be written to the output.
        precision:
          type: integer
          format: int32
          description: The non-negative decimal integer usually used to restrict the
            number of characters. The specific behavior depends on the conversion.
        formatString:
          type: string
          description: The string representation of the format which combines the
            name, the width and the precision.
    dataExternalParameter:
      description: Information about a data external parameter
      required:
      - name
      - label
      - dataType
      - value
      properties:
        name:
          type: string
          description: The parameter name
        label:
          type: string
          description: The parameter label
        dataType:
          type: string
          description: The parameter dataType
          enum:
          - string
          - number
          - date
          - datetime
        value:
          type: string
          description: The parameter value
        format:
          $ref: "#/components/schemas/dataExternalFormat"
