  /jobs:
    get:
      summary: Get a collection of the query jobs on the system
      description: >
        Since jobs are only accessible by the user that created them, this is
        effectively a list of the jobs owned by the current authenticated user.
        A job remains accessible for **5 minutes** after the query finishes,
        unless the job is explicitly deleted. **Since: Version 3**
      operationId: getJobs
      tags:
      - Jobs
      parameters:
      - name: Accept-Item
        description: This is an optional header. If not present, then items of type
          'application/vnd.sas.report.data.job' are returned in the same format as
          the Accept type.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.report.data.job+json
          - application/json
          - application/vnd.sas.report.data.job+xml
          - application/xml
          default: application/vnd.sas.report.data.job+json
      responses:
        "200":
          description: OK. The collection returned can be empty.
          headers:
            Content-Type:
              description: application/vnd.sas.collection
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.report.data.job
              schema:
                type: string
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/jobs"
              examples:
                json:
                  $ref: "#/components/examples/responseGetJobsJson200"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/jobs"
              examples:
                json:
                  $ref: "#/components/examples/responseGetJobsJson200"
            application/json:
              schema:
                $ref: "#/components/schemas/jobs"
              examples:
                json:
                  $ref: "#/components/examples/responseGetJobsJson200"
            application/vnd.sas.collection+xml;version=2:
              schema:
                $ref: "#/components/schemas/jobs"
              examples:
                xml:
                  $ref: "#/components/examples/responseGetJobsCollectionXml200"
            application/vnd.sas.collection+xml:
              schema:
                $ref: "#/components/schemas/jobs"
              examples:
                xml:
                  $ref: "#/components/examples/responseGetJobsCollectionXml200"
            application/xml:
              schema:
                $ref: "#/components/schemas/jobs"
              examples:
                xml:
                  $ref: "#/components/examples/responseGetJobsCollectionXml200"
  "/jobs/{jobId}":
    head:
      summary: Gets a header for a query job
      operationId: headersForQueryJob
      tags:
      - Jobs
      description: Get the header for the query job identified by a particular id.
      parameters:
      - name: jobId
        in: path
        description: The id of the job. The maximum field length is 150 chars.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: Ok
          headers:
            Content-Type:
              description: application/vnd.sas.report.data.job
              schema:
                type: string
    get:
      summary: Get a query job
      description: >
        Get the query job identified by a particular id. A job can only be
        retrieved by the user that created it. **Since: Version 3**
      operationId: getJob
      tags:
      - Jobs
      parameters:
      - name: jobId
        in: path
        description: The id of the job. The maximum field length is 150 chars.
        required: true
        schema:
          type: string
          format: object-id
