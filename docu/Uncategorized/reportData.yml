components:
  parameters:
    executorId:
      name: executorId
      in: query
      required: false
      description: The id of an executor to use for the query. If not provided, a
        one-time executor will be created and cleaned up at the end of query processing.
      schema:
        type: string
    executorType:
      name: executorType
      in: query
      required: false
      description: >
        The type of executor requested. Typically a default is set, but
        reportPackages uses the new 'singleThread' option when it plans to reuse
        the executor to complete a single job.  Single Thread indicates that jobs  associated
        with this executor are intended to be run one-at-a-time.
          **Since: Version 4**
        Possible values are:

        - **singleThread**
      schema:
        type: string
    createCasSessions:
      name: createCasSessions
      in: query
      required: false
      description: Create cas sessions in the background on executor creation.
      schema:
        type: boolean
        default: false
    createThreadedHistory:
      name: createThreadedHistory
      in: query
      required: false
      description: >
        Tells CAS sessions created for threading purposes to store their action history
        when the session is closed.  This table is in
        memory only and will expire in 2 hours.  **Since: Version 12**
      schema:
        type: boolean
        default: false
    historyTablename:
      name: historyTablename
      in: query
      required: false
      description: >
        The name of a CAS table to be created in the CASUSER library when the executor
        is closed.  This table is in memory only and will
        expire in 2 hours.  **Since: Version 12**
      schema:
        type: string
    jobId:
      name: jobId
      in: query
      required: false
      description: >
        The globally unique id of a [job](#job). If not provided when creating a
        job for a data query request, a globally unique job id will be assigned
        automatically. The maximum field length is 150 chars.
      schema:
        type: string
    postJobId:
      name: jobId
      in: query
      required: false
      description: >
        The globally unique id to use for this [job](#job). To achieve this
        uniqueness, it is suggested that the executorId also be specified and
        the jobId be derived using the executorId plus some identifier unique on
        that [executor](#executor). The use case for specifying the jobId is
        when a wait parameter is specified and there is a need to be able to
        cancel or delete the job before the request returns.
      schema:
        type: string
    dd:
      name: dd
      in: query
      required: false
      description: >
        A comma delimited list of the [data definitions](#data-definitions) for
        which results should be returned. The list can reference either
        DataDefinition names and/or ParentDataDefinition names. Default is
        **all** data definitions in the provided mini-report.
      schema:
        type: string
    dataDefinitions:
      name: dataDefinitions
      in: query
      required: false
      description: >
        A comma delimited list of the [data definitions](#data-definitions) for
        which results should be returned. The list can reference either
        DataDefinition names and/or ParentDataDefinition names. Default is
        **all** data definitions in the provided mini-report.
      schema:
        type: string
    sequence:
      name: sequence
      in: query
      required: false
      description: >
        An executor specific value, assigned by the client, to indicate the
        submit order of the data request. This is used by the service to
        determine the relative priority of the data requests. **Since: Version
        3**
      schema:
        type: number
        format: long
        default: 0
    wait:
      name: wait
      in: query
      required: false
      description: >
        Specifies the number of floating point seconds to wait for the job to
        complete. The range is 0-30 seconds. **Since: Version 3**
      schema:
        type: number
        format: float
        default: 0
    indexStrings:
      name: indexStrings
      in: query
      required: false
      description: Return data in StringTable format.
      schema:
        type: boolean
        default: true
    embeddedData:
      name: embeddedData
      in: query
      required: false
      description: >
        Include CSV content as inline embedded data. <br><br> When **true**, the
        Results will include Data and StringTable elements with inline CSV data.
        <br><br> When **false**, the CSV data will be cached on the server, and
        the Results will include DataFile and StringTableFile elements with a
        **file** attribute identifying the URI that can be used to retrieve the
        file. <br><br> Starting in Version **3**, the embeddedData parameter is
        now a string, with valid values **true**, **false**, and **limited**.
        When **limited**, the Results will include inline CSV for small result
        sets, and DataFile and StringTableFile elements for larger result sets.
        The embedded data limit defaults to **200 bytes**, but is configurable
        through the **sas.reportdata.properties.custom.embeddedDataLimitBytes**
        service configuration property. **Since: Version 3**
      schema:
        type: string
        default: true
    useCache:
      name: useCache
      in: query
      required: false
      description: >
        Enable caching to be used during query execution to optimize
        performance. There are two levels of caching within the data query
        pipeline - an "outer" Results Cache where previously generated Results
        are stored for reuse across users / sessions and an "inner"
        executor-level cache that stores pre-processed data and result artifacts
        for reuse during the same executor session. Possible values are:

        - **true**: enable all caching (prior to executing the queries, look for previously
        generated Results in the outer cache, and enable inner data provider level
        caching when executing the queries).

        - **false**: disable all caching (prior to executing the queries, do not look
        for previously generated Results in the outer cache, and disable inner data
        provider level caching when executing the queries).

        - **innerOnly**: prior to executing the queries, do not look for previously
        generated Results in the outer cache, but enable data provider level inner
        caching when executing the queries.
      schema:
        type: string
        default: true
    homogenize:
      name: homogenize
      in: query
      required: false
      description: Normalize the queries prior to execution in order to increase cache
        efficiency.
      schema:
        type: boolean
        default: true
    includeDiagnostics:
      name: includeDiagnostics
      in: query
      required: false
      description: >
        Include additional diagnostic information in the returned Results. This
        option is intended primarily for debug purposes. <br><br> When **true**,
        the following runtime information will be returned: <br><br> <a
        href="http://sww.sas.com/saspedia/DiagnosticProperties_(Business_Intelligence_Report_Definition)">DiagnosticProperties</a>
          - resultCacheKey
          - retrievedFromCache
          - homogenized

        <a href="http://sww.sas.com/saspedia/Properties_(Business_Intelligence_Report_Definition)">Properties</a>
          - VAT:IncomingReport
          - VAT:HomogenizedReport
          - VAT:TimingDiagnostics
      schema:
        type: boolean
        default: false
    reportUri:
      name: reportUri
      in: query
      required: false
      description: The URI of the persisted report
      schema:
        type: string
    reportVersion:
      name: reportVersion
      in: query
      required: false
      description: >
        The report content media-type version of the associated reportUri to be
        retrieved. **Since: Version 5**
      schema:
        type: integer
    reportStateUri:
      name: reportStateUri
      in: query
      required: false
      description: |
        The URI of the persisted report state. **Since: Version 3**
      schema:
        type: string
    reportContentKey:
      name: reportContentKey
      in: query
      required: false
      description: The lookup key for a cached copy of the report. This is intended
        for use when clients are re-querying for additional data to supplement an
        existing Report Package - the `reportContentKey` is auto-populated within
        the package 'requery' link. If provided, this will take precedence over the
        **reportUri**. If the report is not found in cache and a **reportUri** is
        provided, the **reportUri** will be used to retrieve it from persistence.
        The maximum field length is 150 chars.
      schema:
        type: string
    reportDate:
      name: reportDate
      in: query
      required: false
      description: The time stamp of the client copy of the report - in GMT, ISO 8601
        format (yyyy-MM-dd'T'HH:mm:ss.SSS'Z'). This is intended for use when clients
        are re-querying for additional data to supplement an existing Report Package
        - the **reportDate** is auto-populated within the package 'requery' link.
        If the report is not found in cache, and the persisted copy of the report
        is newer than the specified date, then a **409 Conflict** error code will
        be returned, indicating that the report must be re-executed because the content
        has changed on the server.
      schema:
        type: string
        format: date-time
    packageId:
      name: packageId
      in: query
      required: true
      description: A package-specific id to use for caching of the report content
        for subsequent use. The maximum field length is 150 chars.
      schema:
        type: string
    packageDataLevel:
      name: packageDataLevel
      in: query
      required: false
      description: >
        The data level of the report package. Possible values are:

        - **baseline**: generate data to support rendering of the initial view of
        the report

        - **interactive**: generate data to support offline interactions

        - **custom**: generate data to support rendering of a custom view of the report

        - **nodata**: no data was requested for this report package - generate only
        a metadata supplement

        Refer to the Terminology section in the Report Packages service for more details
        on the supported Data Levels.
      schema:
        type: string
        default: baseline
    Accept-Language:
      name: Accept-Language
      in: header
      description: >
        Industry standard header for specifying the user's locale. Results
        content will be localized according to the Accept-Language.

        For more details, see the specs at <a href="https://tools.ietf.org/html/rfc7231#section-5.3.5"
        target="_blank">Accept-Language</a>
      required: false
      schema:
        type: string
    Accept-Locale:
      name: Accept-Locale
      in: header
      description: >
        SAS header for specifying a "format locale" distinct from the user's
        language (Accept-Language).  Usage and syntax is similar to
        Accept-Language. The results content will be sorted and formatted
        according to the Accept-Locale.
      required: false
      schema:
        type: string
    Job-Accept-Item:
      name: Accept-Item
      in: header
      description: >
        An optional header used when creating query jobs to specify the media
        type for the results. If not specified, then the media type defaults the
        results media type that corresponds to the Accept media type. For
        example, if the query job media type specifies JSON, then the results
        would be JSON.
      required: false
      schema:
        type: string
    dataSetFormat:
      name: dataSetFormat
      in: query
      description: >
        The requested dataset format. Acceptable values NONE, B64DS. **Since: Version
        4**
      required: false
      schema:
        type: string
        enum:
        - NONE
        - B64DS
        default: NONE
    timeout:
      name: timeout
      in: query
      required: false
      description: >
        Limits the number of seconds a query job is allowed to run before being
        aborted. **Since: Version 9**
      schema:
        type: number
        format: long
        default: 0
  requestBodies:
    reportContent:
      content:
        application/vnd.sas.report.content+json:
          schema:
            $ref: "#/components/schemas/reportContent"
          examples:
            json:
              $ref: "#/components/examples/requestBodyReportContentJson"
        application/vnd.sas.report.content+xml:
          schema:
            $ref: "#/components/schemas/reportContent"
          examples:
            xml:
              $ref: "#/components/examples/requestBodyReportContentXml"
      description: The request body contains a full BIRD Report with content and embedded
        query state from the Report Package.
      required: true
    reportQuery:
      content:
        application/vnd.sas.report.query+json:
          schema:
            $ref: "#/components/schemas/reportQuery"
          examples:
            json:
              $ref: "#/components/examples/requestExampleReportQueryJson"
        application/json:
          schema:
            $ref: "#/components/schemas/reportQuery"
          examples:
            json:
              $ref: "#/components/examples/requestExampleReportQueryJson"
      description: A mini BIRD Report with one or more data queries.
      required: true
    reportQueryState:
      content:
        application/vnd.sas.report.query.state+json:
          schema:
            $ref: "#/components/schemas/reportQueryState"
          examples:
            json:
              $ref: "#/components/examples/requestExampleReportQueryJson"
        application/vnd.sas.report.query.state+xml:
          schema:
