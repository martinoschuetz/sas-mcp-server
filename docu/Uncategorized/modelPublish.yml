---
openapi: 3.0.3
info:
  title: Model Publish
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: The Model Publish API provides support for publishing objects to a
    predefined destination.
  version: "12"
servers:
- url: "https://example.com/modelPublish"
  description: "This is an example of a base URL."
tags:
- name: Publish
  description: Contains the operations for publishing models.
- name: Destinations
  description: Contains the operations for publishing destinations.
- name: Internal Only
  description: Contains the operations for internal-only endpoints.
paths:
  /:
    get:
      tags:
      - Publish
      summary: Get a list of top-level resource links
      description: Returns a list of links to the top-level resources that are surfaced
        through this API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
    head:
      tags:
      - Publish
      summary: Check API availability
      description: Returns header information and a status of whether the Model Publish
        service is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
  /models:
    head:
      tags:
      - Publish
      summary: Check if published models exist
      description: Returns header information for the list of published models.
      operationId: headersForPublishModelsUsingGET_1
      parameters:
      - name: start
        in: query
        description: The index of the first published model to return.
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: The maximum number of published models to return.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: filter
        in: query
        description: The criteria for filtering the publishing destinations. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/modelPublish/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        description: The criteria for sorting the publishing destinations. See [Sorting
          in REST APIs](https://developer.sas.com/rest-apis/modelPublish/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/publishModelCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/publishModelCollection"
    get:
      tags:
      - Publish
      summary: Get a list of published models
      description: Returns a list of published models.
      operationId: getPublishModelsUsingGET_1
      parameters:
      - name: start
        in: query
        description: The index of the first published model to return.
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: The maximum number of published models to return.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: filter
        in: query
        description: The criteria for filtering the publishing destinations. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/modelPublish/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        description: The criteria for sorting the publishing destinations. See [Sorting
          in REST APIs](https://developer.sas.com/rest-apis/modelPublish/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            X-Items-Count:
              description: The total number of published models that are available.
                This is used for pagination.
              schema:
                type: integer
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/publishModelCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/publishModelCollection"
    post:
      tags:
      - Publish
      summary: Publish models
      description: Publish one or more models to a CAS server, Hadoop, SAS Micro Analytic
        Service, or Teradata, as well as Azure Machine Learning (AML), and container
        destinations such as Amazon Web Services (AWS), Azure, Google Cloud Platform
        (GCP), and Private Docker.
      operationId: createPublishModels
      parameters:
      - name: reuseExistingModules
        in: query
        description: Reuse the published modules.
        required: false
        schema:
          type: boolean
      - name: promoteModelTable
        in: query
        description: Indicates whether to promote the destination table.
        required: false
        schema:
          type: boolean
      - name: Authorization
        in: header
        description: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.models.publishing.request:
            schema:
              $ref: "#/components/schemas/publishRequest"
          application/vnd.sas.models.publishing.request.asynchronous:
            schema:
              $ref: "#/components/schemas/publishRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/publishRequest"
        description: The representation of a publish request.
        required: true
      responses:
        "201":
          description: The models were published.
          headers:
            Location:
              description: /modelPublish/models/{publishId}
              schema:
                type: string
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.models.publishing.model+json:
              schema:
                $ref: "#/components/schemas/baseCollection2"
            application/json:
              schema:
                $ref: "#/components/schemas/baseCollection2"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.models.publishing.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  "/models/{publishId}":
    head:
      tags:
      - Publish
      summary: Check if a published model exists
      description: Returns header information for a published model.
      operationId: headersForPublishedModel
      parameters:
      - name: publishId
        in: path
        description: publishId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publishModel"
            application/vnd.sas.models.publishing.model+json:
              schema:
                $ref: "#/components/schemas/publishModel"
        "404":
          description: No published model exists at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.models.publishing.model+json:
              schema:
                $ref: "#/components/schemas/error2"
    get:
      tags:
      - Publish
      summary: Get published models
      description: Returns published models.
      operationId: getPublishedModel
      parameters:
      - name: publishId
        in: path
        description: The identifier for the published models.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publishModel"
            application/vnd.sas.models.publishing.model+json:
              schema:
                $ref: "#/components/schemas/publishModel"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/publishModel"
        "404":
          description: No published models exist at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.models.publishing.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      tags:
      - Publish
      summary: Delete a published model
      description: Deletes a published model by ID.
      operationId: deletePublishModel
      parameters:
      - name: publishId
        in: path
        description: The published model ID.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The published model was deleted.
  "/models/{publishId}/mappedCode":
    post:
      summary: Get the mapped code for a model
      description: Returns the code to be able to run the model based on the provided
        data and mapping information in request.
      operationId: generateMappedModelCode
      tags:
      - Publish
      parameters:
      - name: publishId
        in: path
        required: true
        description: The ID of the published model.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.score.code.generation.request+json:
            schema:
              $ref: "#/components/schemas/scoreCodeGenerationRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/scoreCodeGenerationRequest"
        description: The information for `scoreDefinitionId` and hints.
        required: true
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.score.mapped.code+json:
              schema:
                $ref: "#/components/schemas/mappedCode"
            application/json:
              schema:
                $ref: "#/components/schemas/mappedCode"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.score.mapped.code+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "500":
          description: The request could not be fulfilled because of an unexpected
            server error.
          content:
            application/vnd.sas.score.mapped.code+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  "/models/{publishId}/dockerfile":
    get:
      tags:
      - Publish
      summary: Get Dockerfile metadata for a published model
      description: Returns the Dockerfile metadata for a model that was published
        to a container.
      operationId: getPublishedModelDockerfile
      parameters:
      - name: publishId
        in: path
        description: The identifier of the published model.
        required: true
        schema:
          type: string
        examples:
          publishId:
            $ref: "#/components/examples/publishId"
      - in: header
        name: Accept
        description: The original media type of the resource.
        schema:
          type: string
        example: application/vnd.sas.file+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp for when the resource was last modified.
              schema:
                type: string
              example: Tue, 12 Oct 2021 11:05:54 GMT
            Content-Type:
              description: The actual content type of the returned content.
              schema:
                type: string
              example: application/vnd.sas.file+json
          content:
            application/vnd.sas.file+json:
              schema:
                $ref: "#/components/schemas/dockerfile"
              examples:
                dockerfileResource:
                  $ref: "#/components/examples/dockerfileResource"
            application/json:
              schema:
                $ref: "#/components/schemas/dockerfile"
              examples:
                dockerfileResource:
                  $ref: "#/components/examples/dockerfileResource"
        "404":
          description: "The Dockerfile resource for the published model could not\
            \ be found."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/dockerfileNotFound"
  "/models/{publishId}/dockerfile/content":
    get:
      tags:
      - Publish
      summary: Get Dockerfile content for a published model
      description: Returns the Dockerfile content for a model that was published to
        a container.
      operationId: getPublishedModelDockerfileContent
      parameters:
      - name: publishId
        in: path
        description: The identifier of the published model.
        required: true
        schema:
          type: string
        examples:
          publishId:
            $ref: "#/components/examples/publishId"
      - in: header
        name: Accept
        description: The original media type of the resource.
        schema:
          type: string
        example: text/plain
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The actual content type of the returned content.
              schema:
                type: string
              example: text/plain
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/dockerfileContent"
              examples:
                dockerfileContent:
                  $ref: "#/components/examples/dockerfileContent"
        "404":
          description: "The Dockerfile resource for the published model could not\
            \ be found."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/dockerfileNotFound"
  "/models/{publishId}/log":
    get:
      tags:
      - Publish
      summary: Get a published model log
      description: Returns a published model log.
      operationId: getPublishedModelLog
      parameters:
      - name: publishId
        in: path
        description: The identifier of the published model log.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/log"
            plain/text:
              schema:
                $ref: "#/components/schemas/log"
  "/models/{publishId}/modelManifest":
    get:
      tags:
      - Publish
      summary: Get manifest for a published object
      description: Returns the manifest for the object (model, decision, or rule set)  that
        was published to a container.
      operationId: getPublishedModelManifest
      parameters:
      - name: publishId
        in: path
        description: The identifier of the published object.
        required: true
        schema:
          type: string
        examples:
          publishId:
            $ref: "#/components/examples/publishId"
      - in: header
        name: Accept
        description: The media type of the resource.
        schema:
          type: string
        example: application/vnd.sas.models.publishing.model.manifest+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp for when the resource was last modified.
              schema:
                type: string
              example: Tue, 12 Oct 2021 11:05:54 GMT
            Content-Type:
              description: The actual content type of the returned content.
              schema:
                type: string
              example: application/vnd.sas.models.publishing.model.manifest+json
          content:
            application/vnd.sas.models.publishing.model.manifest+json:
              schema:
                $ref: "#/components/schemas/modelManifest"
              examples:
                default:
                  $ref: "#/components/examples/modelManifest"
        "404":
          description: "The model manifest for the published object could not be found."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/modelManifestNotFound"
  "/models/{publishId}/deploymentDescriptor":
    get:
      tags:
      - Publish
      summary: Get deployment descriptor for a published object
      description: Returns the deployment descriptor for the object (model, decision,
        or rule set) that was published to a container.
      operationId: getPublishedModelDeploymentDescriptor
      parameters:
      - name: publishId
        in: path
        description: The identifier of the published object.
        required: true
        schema:
          type: string
        examples:
          publishId:
            $ref: "#/components/examples/publishId"
      - in: header
        name: Accept
        description: The media type of the resource.
        schema:
          type: string
        example: application/json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp for when the resource was last modified.
              schema:
                type: string
              example: Tue, 12 Oct 2021 11:05:54 GMT
            Content-Type:
              description: The actual content type of the returned content.
              schema:
                type: string
              example: application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deploymentDescriptor"
              examples:
                default:
                  $ref: "#/components/examples/deploymentDescriptor"
        "404":
          description: "The deployment descriptor for the published object could not\
            \ be found."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/deploymentDescriptorNotFound"
  "/models/{publishId}/deploymentDescriptor/{descriptorName}":
    get:
      tags:
      - Publish
      summary: Get deployment descriptor file content for a published object
      description: Returns the deployment descriptor content for a published object
        that was published to a container.
      operationId: getPublishedModelDeploymentDescriptorContent
      parameters:
      - name: publishId
        in: path
        description: The identifier of the published object.
        required: true
        schema:
          type: string
        example: 094078e7-278a-4719-a704-6e5e65af29e
      - name: descriptorName
        in: path
        description: The file name of the deployment descriptor.
        required: true
        schema:
          type: string
        example: service.yaml
      - in: header
        name: Accept
        description: The original media type of the resource.
        schema:
          type: string
        example: text/plain
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The actual content type of the returned content.
              schema:
                type: string
              example: text/plain
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/deploymentDescriptorContent"
              examples:
                descriptorContent:
                  $ref: "#/components/examples/deploymentDescriptorContent"
        "404":
          description: "The deployment descriptor content for the published object\
            \ could not be found."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/deploymentDescriptorNotFound"
  /destinations:
    head:
      tags:
      - Destinations
      summary: Check publishing destinations availability
      description: Returns header information for a list of publishing destinations.
      operationId: headersForDestinationsUsingGET_1
      parameters:
      - name: start
        in: query
        description: The index of the first publishing destination to return.
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: The maximum number of publishing destinations to return.
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: filter
        in: query
        description: The criteria for filtering the publishing destinations. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/modelPublish/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        description: The criteria for sorting the publishing destinations. See [Sorting
          in REST APIs](https://developer.sas.com/rest-apis/modelPublish/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/destinationCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/destinationCollection"
    get:
      tags:
      - Destinations
      summary: Get a list of publishing destinations
      description: Returns a list of publishing destinations.
      operationId: getDestinationsUsingGET_1
      parameters:
      - name: start
        in: query
        description: The index of the first publishing destination to return.
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: The maximum number of publishing destinations to return.
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: filter
        in: query
        description: The criteria for filtering the publishing destinations. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/modelPublish/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        description: The criteria for sorting the publishing destinations. See [Sorting
          in REST APIs](https://developer.sas.com/rest-apis/modelPublish/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/destinationCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/destinationCollection"
    post:
      tags:
      - Destinations
      summary: Create a publishing destination
      description: Creates a publishing destination.
      operationId: createDestination
      requestBody:
        content:
          application/vnd.sas.models.publishing.destination:
            schema:
              $ref: "#/components/schemas/destination"
          application/vnd.sas.models.publishing.destination.cas:
            schema:
              $ref: "#/components/schemas/destinationCas"
          application/vnd.sas.models.publishing.destination.mas:
            schema:
              $ref: "#/components/schemas/destinationMas"
          application/vnd.sas.models.publishing.destination.teradata:
            schema:
              $ref: "#/components/schemas/destinationTeradata"
          application/vnd.sas.models.publishing.destination.hadoop:
            schema:
              $ref: "#/components/schemas/destinationHadoop"
          application/json:
            schema:
              $ref: "#/components/schemas/destination"
        description: Creates a publishing destination.
        required: true
      responses:
        "201":
          description: The publishing destination was created.
          headers:
            Location:
              description: /modelPublish/destinations/{destinationName}
              schema:
                type: string
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.models.publishing.destination+json:
              schema:
                $ref: "#/components/schemas/destination"
            application/vnd.sas.models.publishing.destination.cas+json:
              schema:
                $ref: "#/components/schemas/destinationCas"
            application/vnd.sas.models.publishing.destination.mas+json:
              schema:
                $ref: "#/components/schemas/destinationMas"
            application/vnd.sas.models.publishing.destination.teradata+json:
              schema:
                $ref: "#/components/schemas/destinationTeradata"
            application/vnd.sas.models.publishing.destination.hadoop+json:
              schema:
                $ref: "#/components/schemas/destinationHadoop"
            application/json:
              schema:
                $ref: "#/components/schemas/destination"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.models.publishing.destination+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.models.publishing.destination.cas+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.models.publishing.destination.mas+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.models.publishing.destination.teradata+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.models.publishing.destination.hadoop+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  "/destinations/{destinationName}":
    head:
      tags:
      - Destinations
      summary: Check publishing destination by name
      description: Returns the header information for a publishing destination by
        name.
      operationId: headersForDestinationUsingGET_1
      parameters:
      - name: destinationName
        in: path
        description: destinationName
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.models.publishing.destination+json:
              schema:
                $ref: "#/components/schemas/destination"
            application/vnd.sas.models.publishing.destination.cas+json:
              schema:
                $ref: "#/components/schemas/destinationCas"
            application/vnd.sas.models.publishing.destination.mas+json:
              schema:
                $ref: "#/components/schemas/destinationMas"
            application/vnd.sas.models.publishing.destination.teradata+json:
              schema:
                $ref: "#/components/schemas/destinationTeradata"
            application/vnd.sas.models.publishing.destination.hadoop+json:
              schema:
                $ref: "#/components/schemas/destinationHadoop"
            application/json:
              schema:
                $ref: "#/components/schemas/destination"
    get:
      tags:
      - Destinations
      summary: Get a publishing destination by name
      description: Returns a publishing destination by name.
      operationId: getDestinationUsingGET_1
      parameters:
      - name: destinationName
        in: path
        description: destinationName
