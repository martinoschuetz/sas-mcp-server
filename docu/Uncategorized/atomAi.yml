---
openapi: 3.0.3
info:
  version: "1"
  title: SAS Atom AI Proxy
  description: >
    Reverse proxy for SAS Atom AI Python API. Requests to
    /atomAi/{sasAtomAiApiPath} are forwarded after stripping the /atomAi context
    root. Currently a catch‑all path is exposed. (Allowed path restrictions will
    be added later.) Path transformation examples:
      GET  /atomAi/tasks                -> /ai/tasks
      POST /atomAi/session            -> /ai/session
      DELETE /atomAi/session/123            -> /ai/session/123
      GET  /atomAi/session/123/state   -> /ai/session/123/state
      POST /atomAi/refreshCirrusCache  -> /ai/refreshCirrusCache
    Forwarded headers:
      Authorization (Bearer token)
      X-Sas-Authorization (same token)
      X-Sas-User-Id (resolved user id)
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
tags:
- name: Atom Ai Proxy
  description: Operations for the SAS Atom AI Proxy API.
servers:
- url: https://example.com/atomAi
  description: SAS Atom AI Proxy API
paths:
  /:
    get:
      operationId: root
      summary: Get API root information
      description: Returns basic information about the Atom AI Proxy API.
      tags:
      - Atom Ai Proxy
      security:
      - bearerAuth: []
      responses:
        "200":
          description: API information returned successfully
          headers:
            Last-Modified:
              description: Last modification date of the API
              schema:
                type: string
                format: date-time
            ETag:
              description: Entity tag for the API root
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: SAS Atom AI Proxy
                  version:
                    type: string
                    example: "1"
                  links:
                    type: array
                    items:
                      type: object
              example:
                name: SAS Atom AI Proxy
                version: "1"
                links: []
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: SAS Atom AI Proxy
                  version:
                    type: string
                    example: "1"
              example:
                name: SAS Atom AI Proxy
                version: "1"
        "403":
          $ref: "#/components/responses/403"
  "/{sasAtomAiApiPath}":
    parameters:
    - $ref: "#/components/parameters/restPath"
    head:
      operationId: headersForResource
      summary: HEAD operation for Atom AI upstream
      description: Returns headers for the specified resource without body.
      tags:
      - Atom Ai Proxy
      security:
      - bearerAuth: []
      responses:
        "200":
          description: Resource headers returned successfully
          headers:
            Last-Modified:
              description: Last modification date of the resource
              schema:
                type: string
                format: date-time
            ETag:
              description: Entity tag for the resource
              schema:
                type: string
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
        "502":
          $ref: "#/components/responses/502"
    get:
      operationId: getResource
      summary: Proxy GET to Atom AI upstream
      description: Forwards GET to upstream API.
      tags:
      - Atom Ai Proxy
      security:
      - bearerAuth: []
      responses:
        "200":
          description: Request forwarded successfully
          headers:
            Last-Modified:
              description: Last modification date of the resource
              schema:
                type: string
                format: date-time
            ETag:
              description: Entity tag for the resource
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                type: object
              example:
                items: []
                count: 0
            application/json:
              schema:
                type: object
              example:
                items: []
                count: 0
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
        "502":
          $ref: "#/components/responses/502"
        default:
          $ref: "#/components/responses/defaultResponse"
    post:
      operationId: createResource
      summary: Proxy POST to Atom AI upstream
      description: Forwards POST to upstream API.
      tags:
      - Atom Ai Proxy
      security:
      - bearerAuth: []
      requestBody:
        description: Request payload to forward to upstream API
        content:
          application/vnd.sas.summary+json:
            schema:
              type: object
            example:
              name: example
              value: data
          application/json:
            schema:
              type: object
            example:
              name: example
              value: data
      responses:
        "200":
          description: Request processed successfully
          content:
            application/vnd.sas.summary+json:
              schema:
                type: object
              example:
                status: processed
        "201":
          description: Resource created successfully
          headers:
            Location:
              description: Location of the created resource
              schema:
                type: string
            Last-Modified:
              description: Last modification date of the resource
              schema:
                type: string
                format: date-time
            ETag:
              description: Entity tag for the resource
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                type: object
              example:
                id: "12345"
                status: created
            application/json:
              schema:
                type: object
              example:
                id: "12345"
                status: created
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
        "502":
          $ref: "#/components/responses/502"
        default:
          $ref: "#/components/responses/defaultResponse"
    put:
      operationId: updateResource
      summary: Proxy PUT to Atom AI upstream
      description: Forwards PUT to upstream API.
      tags:
      - Atom Ai Proxy
      security:
      - bearerAuth: []
      responses:
        "200":
          description: Resource updated successfully
          headers:
            Last-Modified:
              description: Last modification date of the resource
              schema:
                type: string
                format: date-time
            ETag:
              description: Entity tag for the resource
              schema:
                type: string
          content:
            application/vnd.sas.summary+json:
              schema:
                type: object
              example:
                id: "12345"
                status: updated
            application/json:
              schema:
                type: object
              example:
                id: "12345"
                status: updated
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
        "412":
          description: Precondition failed
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                version: 2
                httpStatusCode: 412
                message: Precondition Failed
                details:
                - The resource has been modified since last retrieval
        "428":
          description: Precondition required
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                version: 2
                httpStatusCode: 428
                message: Precondition Required
                details:
                - This request requires a conditional header
        "502":
          $ref: "#/components/responses/502"
        default:
          $ref: "#/components/responses/defaultResponse"
    patch:
      operationId: patchResource
      summary: Proxy PATCH to Atom AI upstream
      description: Forwards PATCH to upstream API.
      tags:
      - Atom Ai Proxy
      security:
      - bearerAuth: []
      responses:
        "200":
          description: Resource partially updated successfully
          content:
            application/vnd.sas.summary+json:
              schema:
                type: object
              example:
                id: "12345"
                status: patched
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
        "412":
          description: Precondition failed
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error"
              example:
                version: 2
                httpStatusCode: 412
                message: Precondition Failed
                details:
                - The resource has been modified since last retrieval
        "502":
          $ref: "#/components/responses/502"
        default:
          $ref: "#/components/responses/defaultResponse"
    delete:
      operationId: deleteResource
      summary: Proxy DELETE to Atom AI upstream
      description: Forwards DELETE to upstream API.
      tags:
      - Atom Ai Proxy
      security:
      - bearerAuth: []
      responses:
        "204":
          description: Resource deleted successfully
        "400":
          $ref: "#/components/responses/400"
        "403":
          $ref: "#/components/responses/403"
        "502":
          $ref: "#/components/responses/502"
        default:
          $ref: "#/components/responses/defaultResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication using JWT tokens
  parameters:
    restPath:
      name: sasAtomAiApiPath
      in: path
      description: >
        Relative path (one or more slash-separated segments) forwarded
        after removing /atomAi. Examples: chat | sessions | session/123/state |
        refreshCirrusCache
      required: true
      schema:
        type: string
  schemas:
    error:
      $ref: "#/components/schemas/error2"
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
  responses:
    "400":
      description: One or more arguments is invalid.
      headers:
        Content-Type:
          description: application/vnd.sas.error+json
          schema:
            type: string
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          examples:
            missingParameter:
              value:
                version: 2
                httpStatusCode: 400
                message: Bad Request
                details:
                - You must specify the request parameter "sas-atom-ai-api-path".
                - "path: /atomAi/"
                - "correlator: a711bf91-32c1-4539-b6e7-cf33e13412a2"
    "403":
      description: The requested destination URL is forbidden or not authorized.
      headers:
        Content-Type:
          description: application/vnd.sas.error+json
          schema:
            type: string
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            version: 2
            httpStatusCode: 403
            message: Forbidden
            details:
            - "The following path cannot be accessed because it is not authorized:\
              \ 'sas-atom-ai-api-path'."
            - "path: /atomAi/restricted/"
            - "correlator: 6abc86c0-51da-4b40-97ac-c8700be0eee0"
    "502":
      description: Upstream API unavailable or proxy error.
      headers:
        Content-Type:
          description: application/vnd.sas.error+json
          schema:
            type: string
        Last-Modified:
          description: Last modification date of the resource
          schema:
            type: string
            format: date-time
        ETag:
          description: Entity tag for the resource
          schema:
            type: string
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            version: 2
            httpStatusCode: 502
            message: Service Unavailable
            details:
            - Upstream Atom AI Python API not reachable.
    defaultResponse:
      description: Upstream response returned unchanged.
