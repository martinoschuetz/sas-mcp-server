  /access:
    get:
      summary: Get security rules for all entity types
      tags:
      - EntityLevelSecurity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/entityLevelRules'
              examples:
                List of entity level rules:
                  $ref: '#/components/examples/entityLevelRules'
            application/vnd.sas.investigation.entity.rules:
              schema:
