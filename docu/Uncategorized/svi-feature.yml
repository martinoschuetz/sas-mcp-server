        description: the ID of the group to remove from all defined security rules.
        in: path
        required: true
        schema:
          type: string
      summary: Removes all references to a group from the security rules that have
        been defined
      operationId: deleteGroupsForEntityRules
      description: Removes all references to a group from the security rules that
        have been defined.
