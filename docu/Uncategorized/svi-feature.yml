      operationId: getTaskStatus
      deprecated: true
      description: This endpoint is deprecated and replaced by SASVisualInvestigator/jobMonitor/jobs/{taskId}.
        It will be removed from the Feature API in 2025.03.
      parameters:
      - name: taskId
