---
openapi: 3.0.3
info:
  version: '4'
  title: Feature
  description: |
    The Feature API exposes functionality to assign capabilities to a group managed by Identities to authorize members of that group to perform actions. Note: groups inherit permissions from their parent groups recursively.

    The Feature API also provides functions to assign Read, Create, Update and Delete permission operations on a DataHub entity type.

    It also exposes endpoints for checking the lifecycle of asynchronous background jobs.

    The "capability" and "license check" functionality formerly provided by the feature service has been moved to the SAS authorization service.
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: 'https://developer.sas.com'
tags:
- name: Root
  description: The root of the API.
- name: JobMonitoring
  description: Endpoints related to Job Monitoring.
- name: EntityLevelSecurity
  description: Endpoints related to Entity Level Security.
- name: UserManagement
  description: Endpoints related to User Management.
paths:
  /:
    get:
      tags:
      - Root
      summary: The root level of the REST API
      operationId: root
      description: The root level of the REST API. Used to retrieve a CSRF token via
        the response headers.
      responses:
        '200':
          description: Returns links for the Feature service. Also used to determine
            whether the service provided by the API is available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                Api Example:
                  $ref: '#/components/examples/Top-Level-Links-Example'
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                Api Example:
                  $ref: '#/components/examples/Top-Level-Links-Example'
  /jobMonitor/jobs:
    get:
      tags:
      - JobMonitoring
      summary: Get information about the status of the background jobs that have been
        started
      operationId: getJobs
      deprecated: true
      description: This endpoint is deprecated and replaced by SASVisualInvestigator/jobMonitor/jobs.
        It will be removed from the Feature API in 2025.03.
      parameters:
      - name: start
        in: query
        required: false
        description: Set the start position for paging.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        required: false
        description: Set the limit for paging.
        schema:
          type: integer
          default: 10
      - name: sortBy
        in: query
        required: false
        description: The sorting criteria for the response collection
        schema:
          type: string
      - name: filter
        in: query
        required: false
        description: The criteria to filter the response collection by.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/jobCollection'
              examples:
                A small list of jobs:
                  $ref: '#/components/examples/Jobs-Collection'
            application/json:
              schema:
                $ref: '#/components/schemas/jobCollection'
              examples:
                A small list of jobs:
                  $ref: '#/components/examples/Jobs-Collection'
        '403':
          description: Forbidden. The user does not have the required svi.feature.jobs
            permission.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                User requires svi.feature.jobs permission:
                  $ref: '#/components/examples/Error-User-Not-Authorized'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                User requires svi.feature.jobs permission:
                  $ref: '#/components/examples/Error-User-Not-Authorized'
  '/jobMonitor/jobs/{jobId}':
    get:
      tags:
      - JobMonitoring
      summary: Get information about the status of a background job
      operationId: getJobStatus
      deprecated: true
      description: This endpoint is deprecated and replaced by SASVisualInvestigator/jobMonitor/jobs/{jobId}.
        It will be removed from the Feature API in 2025.03.
      parameters:
      - name: jobId
        in: path
        required: true
        description: The job ID
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.sas.investigation.job.monitor.job+json:
              schema:
                $ref: '#/components/schemas/jobV1'
              examples:
                A completed configuration import job:
                  $ref: '#/components/examples/Completed-Configuration-Import-JobV1'
            application/vnd.sas.job.monitor.job+json:
              schema:
