        name: application/vnd.sas.investigation.entity.rules
        version: 1
      properties:
        version:
          type: integer
          description: The version of this set of entity level rules
        name:
          type: string
          description: The name of the entity type these rules are applied to
        rules:
          description: The set of entity level rules that are applied to this entity
            type
          type: array
          items:
            type: object
            properties:
              group:
                type: string
                description: The group that the rule is assigned to.
              conditionName:
                type: string
                description: A description of the rule.
              permissions:
                type: object
                description: 'A map of permission action type (read, write, update,
                  delete, search) to boolean. Describes whether the group has the
                  permission to do the given action type on the entity.'
              conditions:
                type: array
                description: The conditions that form the rule.
                items:
                  properties:
                    type:
                      type: string
                      description: The type of the condition.  Describes an operator
                        that should be applied to the field and value.
                    field:
                      type: string
                      description: The field the condition will operate on.
                    value:
                      type: string
                      description: The value of the field that is evaluated against
                        the condition.
