                $ref: '#/components/examples/entityLevelRules'
      parameters:
      - name: entityType
        in: path
        required: true
        description: The entity type
        schema:
          type: string
      responses:
        '201':
          headers:
            Location:
              description: The URL of the created rule.
              schema:
                type: string
          description: Created
          content:
            application/vnd.sas.investigation.entity.rules+json:
              schema:
                $ref: '#/components/schemas/entityLevelRules'
              examples:
                entityRules:
                  $ref: '#/components/examples/entityLevelRules'
            application/json:
              schema:
                $ref: '#/components/schemas/entityLevelRules'
              examples:
                entityRules:
                  $ref: '#/components/examples/entityLevelRules'
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                Entity types mismatched between path and body:
                  $ref: '#/components/examples/Entity-Type-Mismatch'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                Entity types mismatched between path and body:
                  $ref: '#/components/examples/Entity-Type-Mismatch'
        '403':
          description: Forbidden. The user does not have the required svi.access.entity.edit
            permission.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                User requires svi.access.entity.edit permission:
                  $ref: '#/components/examples/Error-User-Not-Authorized'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                User requires svi.access.entity.edit permission:
                  $ref: '#/components/examples/Error-User-Not-Authorized'
    put:
      tags:
      - EntityLevelSecurity
      summary: Update entity level security rules
      operationId: updateEntitySecurityRulesForEntity
      description: Update the list of entity level security rules for the given entity
        type.
      parameters:
      - name: entityType
        in: path
        required: true
        description: The entity type
        schema:
          type: string
      - name: If-Match
        in: header
        description: 'ETag header. If the ETag does not match, the update will fail.'
        schema:
          type: string
      responses:
        '200':
          headers:
            Location:
              description: The URI of the new type
              schema:
                type: string
            ETag:
              description: The up-to-date version number of the type
              schema:
                type: integer
            Last-Modified:
              description: The new last modified timestamp
              schema:
                type: integer
          description: OK
          content:
            application/vnd.sas.investigation.entity.rules+json:
              schema:
                $ref: '#/components/schemas/entityLevelRules'
              examples:
                entityRules:
                  $ref: '#/components/examples/entityLevelRules'
            application/json:
              schema:
                $ref: '#/components/schemas/entityLevelRules'
              examples:
                entityRules:
                  $ref: '#/components/examples/entityLevelRules'
        '400':
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                Malformed Request:
                  $ref: '#/components/examples/Request-Invalid-Body'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                Malformed Request:
                  $ref: '#/components/examples/Request-Invalid-Body'
        '403':
          description: Forbidden. The user does not have the required svi.access.entity.edit
            permission.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                User requires svi.access.entity.edit permission:
                  $ref: '#/components/examples/Error-User-Not-Authorized'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                User requires svi.access.entity.edit permission:
                  $ref: '#/components/examples/Error-User-Not-Authorized'
        '412':
          description: The request refers to an out-of-date version of the resource.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                Request to update an out-of-date version of the resource:
                  $ref: '#/components/examples/Expired-Etag-Details'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                Request to update an out-of-date version of the resource:
                  $ref: '#/components/examples/Expired-Etag-Details'
        '428':
          description: The request is missing the If-Match header.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                Request to update the resource missing Etag details:
                  $ref: '#/components/examples/Missing-Etag-Details'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                Request to update the resource missing Etag details:
                  $ref: '#/components/examples/Missing-Etag-Details'
