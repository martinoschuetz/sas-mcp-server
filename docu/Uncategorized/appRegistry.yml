---
openapi: 3.0.3
info:
  version: "7"
  title: App Registry
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
  description: >
    The App Registry API is the central registration for loosely couple applications.
    It provides a curated
    view for the current user of which applications are available, taking into account
    licensing, access permissions
    and other details. It provides localized labels, and is the central point of information
    for user interface
    components navigating between applications. Applications integrate with SAS Drive
    and the Application Switcher via
    this registry.


    This is a largely read-only API; there are few mutation operations, and most of
    them are administrator-restricted.
    A note about returned media types. All GET methods allow an Accept request header
    of `application/json`, but will
    return the actual specific media type in Content-Type response header.


    A note regarding eTags.  Conditional GET is supported for the `applicationTree`
    and `types` resources, bulk and
    individual get.  304 (not modified) is returned on a matching eTag.  These rest
    resources do not support mutation,
    so 412/428 are not relevant.


    Localization.  Applications have a `label`, types (via applicationAction) have
    `targetVerbLabel`.  Both are
    localized, honoring the `Accept-Language` request header.
tags:
- name: Root
  description: API links.
- name: Query
  description: Use of App Registry.
- name: Preference
  description: Areas for users to customize behavior, for example 'favorites'.
- name: Redirect
  description: Analyze supplied object, redirect browser to suitable application.
- name: Upload
  description: Applications upload their registration (restricted).
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Return HATEOAS links for paths under this location; returned link
        relations will include "**appTree**" and  "**types**".
      operationId: root
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root links normal user:
                  $ref: "#/components/examples/rootNormalUser"
                root links admin user:
                  $ref: "#/components/examples/rootAdminUser"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root links normal user:
                  $ref: "#/components/examples/rootNormalUser"
                root links admin user:
                  $ref: "#/components/examples/rootAdminUser"
  /applications:
    get:
      tags:
      - Query
      summary: Simple table of applications
      description: This provides a simple HTML table of available applications with
        data the Administrator might need if setting a configuration property.
      operationId: getApplications
      responses:
        "200":
          description: OK
          content:
            text/html:
              examples:
                application table:
                  $ref: "#/components/examples/applicationTable"
  /applications/applicationTree:
    get:
      tags:
      - Query
      summary: Tree of available applications
      description: This is the **primary method** of this API; App Switcher will be
        the primary (only?) consumer. Returns a tree representation of all applications
        this user has access to. This representation will be prepared for the current
        user, including filtering unauthorized applications and localization, as well
        as empty branch removal. The returned "tree" will be a standard sas collection,
        each item is a "top level" node, including both "branch" and "leaf" nodes.
        Branch nodes represent the tree structure and can have "child" nodes (which
        themselves can be branch or leaf nodes). Returned leaf nodes will typically
        have one of the following links, based on whether this node is currently a
        "favorite" for the user - "removeFavorite", "addFavorite". If the user has
        any favorite applications, then an artificial branch listing just those favorites
        will be added to the returned tree.  The branch's id will be "favorites".  Currently
        this will be the first branch, but clients are cautioned to use the id if
        necessary to locate this "favorites" branch. Requesting "list" mode will return
        only a list (not tree), and the nodes will be only the leaf nodes.  These
        nodes will be in the same order they would appear in a presentation view (in-order
        traversal).
      operationId: getApplicationTree
      parameters:
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      - name: viewId
        in: query
        description: optional view, see main description.
        required: false
        schema:
          type: string
      - name: branchesLast
        in: query
        description: The current default is to list branch nodes after any leaf (orphan)
          nodes, although this might change in the future. Specify this value as `true`
          to require branches to be last, or `false` otherwise.
        schema:
          type: boolean
      - name: mode
        in: query
        description: optional presentation mode. "tree" the default as generally described
          in this document; "list" new list-only mode showing only leaf nodes
        required: false
        schema:
          type: string
          enum:
          - tree
          - list
          default: tree
      - name: Accept-Item
        in: header
        description: how the caller wants the items returned
        schema:
          type: string
          enum:
          - application/vnd.sas.app.registry.application+json
          - application/vnd.sas.app.registry.application.enhanced+json
          - application/json
          default: application/vnd.sas.app.registry.application+json
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The entity tag for this resource.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/applicationCollection"
              examples:
                application tree:
                  $ref: "#/components/examples/applicationTree"
                application tree enhanced:
                  $ref: "#/components/examples/applicationTreeEnhanced"
            application/json:
              schema:
                $ref: "#/components/schemas/applicationCollection"
              examples:
                application tree:
                  $ref: "#/components/examples/applicationTree"
                application tree enhanced:
                  $ref: "#/components/examples/applicationTreeEnhanced"
        "304":
          description: Not Modified (caller's eTag matches)
  "/applications/applicationTree/{nodeId}":
    get:
      tags:
      - Query
      summary: Details of specified application (or branch)
      description: This is a single node in the tree (along with possible children).
        There are no known client use cases for using  this endpoint.
      operationId: getApplicationTreeNode
      parameters:
      - name: nodeId
        in: path
        description: the node id.
        required: true
        schema:
          type: string
      - name: viewId
        in: query
        required: false
        description: optional view, see main description.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: optional ETag; upon match status 304 is returned.
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The entity tag for this resource.
              schema:
                type: string
          content:
            application/vnd.sas.app.registry.application+json:
              schema:
                $ref: "#/components/schemas/application"
              examples:
                single application:
                  $ref: "#/components/examples/singleApplication"
            application/json:
              schema:
                $ref: "#/components/schemas/application"
              examples:
                single application:
                  $ref: "#/components/examples/singleApplication"
        "304":
          description: Not Modified (caller's eTag matches)
        "404":
          description: Not found.  This could include checking for a node which has
            been filtered out because of authorization.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/notFound"
    head:
      tags:
      - Query
      summary: Details of specified application (or branch)
      description: This is a single node in the tree (along with possible children).
        There are no known client use cases for using  this endpoint.
      operationId: headersForApplicationTreeNode
      parameters:
      - name: nodeId
        in: path
        description: the node id.
        required: true
        schema:
          type: string
      - name: viewId
        in: query
        required: false
        description: optional view, see main description.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: optional ETag; upon match status 304 is returned.
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The entity tag for this resource.
              schema:
                type: string
          content:
            application/vnd.sas.app.registry.application+json:
              schema:
                $ref: "#/components/schemas/application"
              examples:
                single application:
                  $ref: "#/components/examples/singleApplication"
            application/json:
              schema:
                $ref: "#/components/schemas/application"
              examples:
                single application:
                  $ref: "#/components/examples/singleApplication"
        "304":
          description: Not Modified (caller's eTag matches)
        "404":
          description: Not found.  This could include checking for a node which has
            been filtered out because of authorization.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/notFound"
  "/applications/applicationTree/{nodeId}#enhanced":
    get:
      tags:
      - Query
      summary: Details when specifically requesting the 'enhanced' response media
