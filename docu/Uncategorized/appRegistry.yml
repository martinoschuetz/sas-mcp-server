      description: This is a single node in the tree when specifically requesting
        the 'enhanced' response media type. (application/vnd.sas.app.registry.application.enhanced+json)
      operationId: getApplicationTreeNodeEnhanced
      parameters:
      - name: nodeId
        in: path
        description: the node id.
        required: true
        schema:
          type: string
      - name: viewId
        in: query
        required: false
        description: optional view, see main description.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: optional ETag; upon match status 304 is returned.
        schema:
          type: string
      - name: Accept
        in: header
        required: true
        description: This response is only when this accept header is provided and
          equal to "application/vnd.sas.app.registry.application.enhanced+json".
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The entity tag for this resource.
              schema:
                type: string
          content:
            application/vnd.sas.app.registry.application.enhanced+json:
              schema:
                $ref: "#/components/schemas/applicationEnhanced"
              examples:
                single application enhanced:
                  $ref: "#/components/examples/singleApplicationEnhanced"
        "304":
          description: Not Modified (caller's eTag matches)
          content:
            application/vnd.sas.app.registry.application.enhanced+json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Not found.  This could include checking for a node which has
            been filtered out because of authorization.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/notFound"
    head:
      tags:
      - Query
      summary: Details when specifically requesting the 'enhanced' response media
        type
      description: This is a single node in the tree when specifically requesting
        the 'enhanced' response media type.
      operationId: headersForApplicationTreeNodeEnhanced
      parameters:
      - name: nodeId
        in: path
        description: the node id.
        required: true
        schema:
          type: string
      - name: viewId
        in: query
        required: false
        description: optional view, see main description.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: optional ETag; upon match status 304 is returned.
        schema:
          type: string
      - name: Accept
        in: header
        required: true
        description: This response is only when this accept header is provided and
          equal to "application/vnd.sas.app.registry.application.enhanced+json".
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The entity tag for this resource.
              schema:
                type: string
          content:
            application/vnd.sas.app.registry.application.enhanced+json:
              schema:
                $ref: "#/components/schemas/applicationEnhanced"
              examples:
                single application enhanced:
                  $ref: "#/components/examples/singleApplicationEnhanced"
        "304":
          description: Not Modified (caller's eTag matches)
          content:
            application/vnd.sas.app.registry.application.enhanced+json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: Not found.  This could include checking for a node which has
            been filtered out because of authorization.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/notFound"
  /applications/favorites:
    get:
      tags:
      - Preference
      summary: List of user's favorites
      description: List of the user's favorites.  Returned favorite members will have
        a "delete" link.  The collection is expected to be small; pagination/filtering
        is not supported.  Order is significant, so sorting is not supported. Note
        that the user's favorites are returned as part of the "tree" for getApplicationTree.  Consequently
        this operation focuses at supporting a "favorites reorder" dialog, where only
        the id and label are needed.
      operationId: getFavorites
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: how the caller wants the items returned
        schema:
          type: string
          default: application/vnd.sas.app.registry.favorite+json
      - name: If-None-Match
        in: header
        description: Optional eTag. On a match, 304 (not modified) is returned.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The entity tag
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/favoritesCollection"
              examples:
                get favorites:
                  $ref: "#/components/examples/getFavorites"
            application/json:
              schema:
                $ref: "#/components/schemas/favoritesCollection"
              examples:
                get favorites:
                  $ref: "#/components/examples/getFavorites"
    put:
      tags:
      - Preference
      summary: Update the list of user's favorites
      description: Update the list of user's favorites.  Order is significant.  Only
        the directiveId is honored on upload. Note that conditional update is not
        required, this is the user's own list that he/she is changing; multi-update
        is not an anticipated problem.
      operationId: updateFavorites
      requestBody:
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/favoritesCollection"
            examples:
              put favorites:
                $ref: "#/components/examples/putMultipleFavoriteApps-Body"
        description: The new favorites
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/favoritesCollection"
              examples:
                put response (same as get favorites):
                  $ref: "#/components/examples/getFavorites"
            application/json:
              schema:
                $ref: "#/components/schemas/favoritesCollection"
              examples:
                get favorites:
                  $ref: "#/components/examples/getFavorites"
        "400":
          description: Bad input.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                get favorites:
                  $ref: "#/components/examples/putFavorites-error"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                get favorites:
                  $ref: "#/components/examples/putFavorites-error"
    delete:
      tags:
      - Preference
      summary: Remove all the user's favorites
      description: Remove all the user's favorites.
      operationId: deleteFavorites
      responses:
        "204":
          description: No Content
  "/applications/favorites/{directiveId}":
    put:
      tags:
      - Preference
      summary: Set Favorite
      description: Set this directive as a favorite.  Note NO NEED for a request body.  This
        is establishing the directive as a "favorite", conditional update (eTag) is
        not needed.
      operationId: updateFavorite
      parameters:
      - name: directiveId
        in: path
        required: true
        description: The unique identifier of a directive to be set as a favorite.
        schema:
          type: string
      responses:
        "200":
          description: directive was already a favorite, it is now moved to the end
            of the list
          content:
            application/vnd.sas.app.registry.favorite+json:
              schema:
                $ref: "#/components/schemas/favorite"
              examples:
                get favorites:
                  $ref: "#/components/examples/putOneFavoriteApp"
            application/json:
              schema:
                $ref: "#/components/schemas/favorite"
              examples:
                get favorites:
                  $ref: "#/components/examples/putOneFavoriteApp"
        "201":
          description: directive added as a favorite
          content:
            application/vnd.sas.app.registry.favorite+json:
              schema:
                $ref: "#/components/schemas/favorite"
              examples:
                get favorites:
                  $ref: "#/components/examples/putOneFavoriteApp"
            application/json:
              schema:
                $ref: "#/components/schemas/favorite"
              examples:
                get favorites:
                  $ref: "#/components/examples/putOneFavoriteApp"
        "400":
          description: Bad input.  Specifying a branch (SAS code 10219)
          content:
            application/vnd.sas.app.registry.favorite+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error - specified a branch:
                  $ref: "#/components/examples/putOneFavorite-branch"
                error - not an application:
                  $ref: "#/components/examples/putOneFavorite-notAnApp"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error - specified a branch:
                  $ref: "#/components/examples/putOneFavorite-branch"
                error - not an application:
                  $ref: "#/components/examples/putOneFavorite-notAnApp"
        "404":
          description: "directive not found, SAS Code: 10218"
          content:
            application/vnd.sas.app.registry.favorite+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                get favorites:
                  $ref: "#/components/examples/putOneFavorite-notAnApp"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                get favorites:
                  $ref: "#/components/examples/putOneFavorite-notAnApp"
    delete:
      tags:
      - Preference
      summary: Remove Favorite
      description: Remove favorite.
      operationId: deleteFavorite
      parameters:
      - name: directiveId
        in: path
        required: true
        description: The unique identifier of a favorite directive.
        schema:
          type: string
      responses:
        "204":
          description: favorite removed
  /types:
    get:
      tags:
      - Query
      summary: Repository types the user can open
      description: Returns a collection of all repository **types** this user has
        access to, along with details of which  application supports each type. An
        empty collection is returned for the case where there are no available types.
        Note that while the standard sas collection is used, the size is expected
        to be small and pagination is not  supported.
      operationId: getTypes
      parameters:
      - name: viewId
        in: query
        required: false
        description: optional view, see main description.
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          headers:
            ETag:
              description: The entity tag for this resource.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/artifactTypeCollection"
              examples:
                service names:
                  $ref: "#/components/examples/types"
            application/json:
              schema:
                $ref: "#/components/schemas/artifactTypeCollection"
              examples:
                service names:
                  $ref: "#/components/examples/types"
        "304":
          description: Not Modified (caller's eTag matches)
  "/types/{typeId}":
    get:
      tags:
      - Query
      summary: Return a single repository type for the user
      description: Returns the artifact/repository type information for the requested
        type. One use case might be for the "side menu" component, when opening a
        "report", to check what application(s) *open* report objects.
      operationId: getType
      parameters:
      - name: typeId
        in: path
        description: the type id.
        required: true
        schema:
          type: string
          format: object-id
      - name: viewId
        in: query
        required: false
        description: optional view, see main description.
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The entity tag for this resource.
              schema:
                type: string
          content:
            application/vnd.sas.app.registry.artifact.type+json:
              schema:
                $ref: "#/components/schemas/artifactType"
              examples:
                get type:
                  $ref: "#/components/examples/type"
                get type unknown:
                  $ref: "#/components/examples/typeNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/artifactType"
              examples:
                get type:
                  $ref: "#/components/examples/type"
                get type unknown:
                  $ref: "#/components/examples/typeNotFound"
        "304":
          description: Not Modified (caller's eTag matches)
    head:
      tags:
      - Query
      summary: Return a single repository type for the user
      description: Returns the artifact/repository type information for the requested
        type. One use case might be for the "side menu" component, when opening a
        "report", to check what application(s) *open* report objects.
      operationId: headersForType
      parameters:
      - name: typeId
        in: path
        description: the type id.
        required: true
        schema:
          type: string
          format: object-id
      - name: viewId
        in: query
        required: false
        description: optional view, see main description.
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The entity tag for this resource.
              schema:
                type: string
          content:
            application/vnd.sas.app.registry.artifact.type+json:
              schema:
                $ref: "#/components/schemas/artifactType"
              examples:
                get type:
                  $ref: "#/components/examples/type"
                get type unknown:
                  $ref: "#/components/examples/typeNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/artifactType"
              examples:
                get type:
                  $ref: "#/components/examples/type"
                get type unknown:
                  $ref: "#/components/examples/typeNotFound"
        "304":
          description: Not Modified (caller's eTag matches)
  /redirect:
    get:
      tags:
      - Redirect
      summary: Redirect browser to suitable application to open supplied object
      description: Note -  this is not a "normal REST method"; instead this is a more
        traditional endpoint for a browser "GET"  operation.  Also there is no "200"
        series response, success is a "303" (see other) redirect. For the supplied
        object, determine its 'type', and redirect to the application most appropriate
        for this type for this user. For example, if the supplied object is a 'report',
        then for most users this would be a redirect to the report viewer.  Users
        who have a preference to open with the editor, 'SAS Visual Analytics' would
        instead be sent to that application. The redirect will have a request parameter
        (appSwitcherMessage) which encodes details as the client side 'App Switcher'
        expects so that the client will automatically request to open this object.
        No action is needed on the application's part to recognize this parameter
        other than integrate with App Switcher.
      operationId: redirect
      parameters:
      - name: targetUri
        in: query
        required: true
        description: The URI to the object to open.
        schema:
          type: string
      - name: objectType
        in: query
        required: false
        description: The 'type' to open.  If absent then a request is sent to the
          object asking its type. (media type is application/vnd.sas.summary+json)
        schema:
          type: string
      responses:
        "303":
          description: Successful response, redirect to suitably open the object (targetUri)
          headers:
            Location:
              description: The URI to redirect to.
              schema:
                type: string
        "400":
          description: input format error, for example an empty targetUri
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                input error:
                  $ref: "#/components/examples/redirect400"
                target not found:
                  $ref: "#/components/examples/redirect400NotFound"
  /initialPage:
    get:
      tags:
      - Redirect
      summary: Redirect browser to suitable application
      description: >
        Note -  this is not a "normal REST method"; instead this is a more
        traditional endpoint for a browser "GET"  operation.  Also there is no
        "200" series response, success is a "302" (found) redirect.


        The intended use case is the user goes to the server root and k8s magic
        redirects the user here.
      operationId: getInitialPage
      responses:
        "302":
          description: Successful response, redirect to suitable application
          headers:
            Location:
              description: The URI to redirect to.
              schema:
                type: string
  /serviceNames:
    get:
      tags:
      - Query
      summary: List of service names
      description: List of services, just the ID and name of each. Consumption is
        expected do be from administrative tooling, which will want the entire collection;
        so sorting, filtering, and pagination are not supported.
      operationId: getServiceNames
      parameters:
      - name: refresh
        in: query
        required: false
        description: when true (default), a live query is performed, if false a cached
          result may be returned.
        schema:
          type: boolean
          default: true
      - name: mode
        in: query
        required: false
        description: >
          should the currently available service names ("" or "current") be returned,
          or all service names seen
          in this instance, an approximation of a list of deployed services ("deployed").
        schema:
          type: string
          enum:
          - current
          - deployed
          default: current
      - name: Accept-Item
        in: header
        required: false
        description: how the caller wants the items returned
        schema:
          type: string
          default: application/vnd.sas.app.registry.service.name+json
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/serviceNamesCollection"
              examples:
                service names:
                  $ref: "#/components/examples/serviceNames"
            application/json:
              schema:
                $ref: "#/components/schemas/serviceNamesCollection"
              examples:
                service names:
                  $ref: "#/components/examples/serviceNames"
  /integration:
    get:
      tags:
      - Upload
      summary: Return all registrations
      description: Returns a collection of all registrations.  (Note there are no
        link relations returned here, despite using a  "standard" sas collection which
        documents they are possible.) By default each file resource files (localization)
        has only the fileName returned, not contents.
      operationId: getRegistrations
      parameters:
      - name: fullResources
        in: query
        description: default false.  When false, returned resources have only fileName
          ("contents" are omitted).
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Successful response
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/directiveContentCollection"
              examples:
                get all applications:
                  $ref: "#/components/examples/getAllIntegration"
            application/json:
              schema:
                $ref: "#/components/schemas/directiveContentCollection"
              examples:
                get all applications:
                  $ref: "#/components/examples/getAllIntegration"
        "403":
          description: forbidden.  This is a restricted resource, most users are not
            allowed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/errorNotAdmin"
    post:
      tags:
      - Upload
      summary: Upload one or more integration definitions
      description: >
        Only method to upload definitions (usually used indirectly via java
        annotation @AppRegistryEnabled).
        Returns a "UploadResult", with "directives" being successful entries, warnings
        (typically null), and a "changed"  flag - typically false (because most apps
        attempt to register at startup, and usually they are already  registered).
        Note that a changed registration is recognized.
        By default each file resource files (localization) has only the fileName returned,
        not contents.
        Typically this upload will *not* result in a change (because applications
        register every time they start). The  Http response code of 200 indicates
        "no change", 201 "something changed"
        Additional information can be found in the Developers' Guide.
      operationId: createRegistration
      parameters:
      - name: fullResources
        in: query
        description: default false.  When false, returned resources have only fileName
          ("contents" are omitted).
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/vnd.sas.app.registry.integration.files+json:
            schema:
              $ref: "#/components/schemas/integrationFilesIn"
            examples:
              add application integration (java style):
                $ref: "#/components/examples/integrationJavaStyleL10N"
              add application integration (go style):
                $ref: "#/components/examples/integrationGoStyleL10N"
          application/json:
            schema:
              $ref: "#/components/schemas/integrationFilesIn"
            examples:
              add application integration (java style):
                $ref: "#/components/examples/integrationJavaStyleL10N"
              add application integration (go style):
                $ref: "#/components/examples/integrationGoStyleL10N"
        description: A list of files being uploaded; these will be 1 or more xml files
          for directives, plus any needed  localization property files.
        required: true
      responses:
        "200":
          description: Upload processed, NO CHANGE
          headers:
            Content-Type:
              description: response media type 'application/vnd.sas.app.registry.upload.result+json'
              schema:
                type: string
          content:
            application/vnd.sas.app.registry.upload.result+json:
              schema:
                $ref: "#/components/schemas/uploadResult"
              examples:
                no change result:
                  $ref: "#/components/examples/uploadResponseNoChange"
            application/json:
              schema:
                $ref: "#/components/schemas/uploadResult"
              examples:
                no change result:
                  $ref: "#/components/examples/uploadResponseNoChange"
        "201":
          description: Upload processed, SOMETHING CHANGED
          headers:
            Content-Type:
              description: response media type 'application/vnd.sas.app.registry.upload.result+json'
              schema:
                type: string
          content:
            application/vnd.sas.app.registry.upload.result+json:
              schema:
                $ref: "#/components/schemas/uploadResult"
              examples:
                change result:
                  $ref: "#/components/examples/uploadResponseChangeNoted"
            application/json:
              schema:
                $ref: "#/components/schemas/uploadResult"
              examples:
                change result:
                  $ref: "#/components/examples/uploadResponseChangeNoted"
        "400":
          description: bad input. The details section of the standard sas exception
            will have considerable diagnostic information. Additionally, the sas errorCode
            will be set.  One of (1017 directive name or resource name too long),
            (10206 bad xml), or (10207 xml missing).
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                change result:
                  $ref: "#/components/examples/uploadErrorInInput"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                change result:
                  $ref: "#/components/examples/uploadErrorInInput"
        "403":
          description: forbidden.  This is a restricted resource, most users are not
            allowed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/errorNotAdmin"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/errorNotAdmin"
  "/integration/{nodeId}":
    get:
      tags:
      - Upload
      summary: Return a specified registration
      description: Returns a single registration. By default each file resource files
        (localization) has both the fileName and contents returned.
      operationId: getRegistration
      parameters:
      - name: nodeId
        in: path
        description: the registration to return, e.g. "SASHome".
        required: true
        schema:
          type: string
      - name: fullResources
        in: query
        description: default true.  When false, returned resources have only fileName
          ("contents" are omitted).
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Successful response
          content:
            application/vnd.sas.app.registry.directive.content+json:
              schema:
                $ref: "#/components/schemas/directiveContent"
              examples:
                get one app:
                  $ref: "#/components/examples/getOneIntegration"
            application/json:
              schema:
                $ref: "#/components/schemas/directiveContent"
              examples:
                get one app:
                  $ref: "#/components/examples/getOneIntegration"
        "403":
          description: forbidden.  This is a restricted resource, most users are not
            allowed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/errorNotAdmin"
        "404":
          description: not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/nodeNotFound"
    head:
      tags:
      - Upload
      summary: Return a specified registration
      description: Returns a single registration. By default each file resource files
        (localization) has both the fileName and contents returned.
      operationId: headersForRegistration
      parameters:
      - name: nodeId
        in: path
        description: the registration to return, e.g. "SASHome".
        required: true
        schema:
          type: string
      - name: fullResources
        in: query
        description: default true.  When false, returned resources have only fileName
          ("contents" are omitted).
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Successful response
          content:
            application/vnd.sas.app.registry.directive.content+json:
              schema:
                $ref: "#/components/schemas/directiveContent"
              examples:
                get one app:
                  $ref: "#/components/examples/getOneIntegration"
            application/json:
              schema:
                $ref: "#/components/schemas/directiveContent"
              examples:
                get one app:
                  $ref: "#/components/examples/getOneIntegration"
        "403":
          description: forbidden.  This is a restricted resource, most users are not
            allowed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/errorNotAdmin"
        "404":
          description: not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/nodeNotFound"
    delete:
      tags:
      - Upload
      summary: Delete a specified registration
      description: Deletes a registration.
      operationId: deleteRegistration
      parameters:
      - name: nodeId
        in: path
        description: the registration to delete, e.g. "SASHome".
        required: true
        schema:
          type: string
      responses:
        "204":
          description: delete successful
        "403":
          description: forbidden.  This is a restricted resource, most users are not
            allowed.
servers:
- url: http://example.com/appRegistry
  description: Sample server URL.
components:
  schemas:
    applicationCollection:
      title: collection of application objects
      description: A standard sas collection (of ApplicationInfo) which does not support
        paging. The size is expected to be small.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/application"
            description: Array of the application (tree).
    artifactTypeCollection:
      title: collection of type objects
      description: A standard sas collection (of ArtifactType) which does not support
        paging. The size is expected to be small.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/artifactType"
            description: Array of the artifact type info.
    application:
      required:
      - id
      - label
      - branch
      - root
      - hidden
      x-sas-media-type:
        name: application/vnd.sas.app.registry.application
        version: 2
      description: This represents a "branch" or "leaf" node; boolean field *branch*
        can be used to determine which.
      properties:
        id:
          type: string
          description: the REST id. (directive/branch name).
        label:
          type: string
          description: the localized label, suitable to show the user.
        branch:
          type: boolean
          description: is this node a "branch" (or a "leaf")
        root:
          type: boolean
          description: Is this node a "root" node? That is, is it at the "top level"
            and not have a containing branch?  Both leaf and branch nodes can be a
            "root" node.
        hidden:
          type: boolean
          description: Is this node to be "hidden" from the normal user presentation?
        viewId:
          x-sas-attributes:
            since: 3
          type: string
          description: (version 2) What view is this node part of?  Will be null (missing)
            for 'side menu' use.
        icon:
          x-sas-attributes:
            since: 3
          type: string
          description: (version 2) an icon to associate with this node, will be a
            URI or other lookup item.
        children:
          type: array
          description: (**branch** only) a list of child nodes, each being an ApplicationInfo,
            either branch or leaf.
          items:
            $ref: "#/components/schemas/application"
        appName:
          type: string
          description: (**leaf** only) the name of the application.
        applicationSuite:
          type: boolean
          description: True if this branch is a suite of applications; false if a
            single application with multiple entry points. The GUI needs to know,
            so the application creating this node adds this info to its integration
            xml.
        appId:
          type: string
          description: (**Leaf** only) what is the appId of this "application".  "appId"
            is a concept which has existed in this  space, including AppSwitcher for
            some time.  Multiple leaf nodes often have the same appId (representing
            a  single application, and presented in the same iFrame).  For example,
            Customer Intelligence has approximately 10 leaf nodes all with the same
            appId ... using this structure for intra-app navigation.
        appSwitcherCompliance:
          type: boolean
          description: (**Leaf** only) is this leaf conforming with the rules of the
            application switcher? (default true) (most  specify <tt>true</tt> here).  Note
            that a true value requires <tt>appId</tt> to be specified.
        uri:
          type: string
          description: (**leaf** only) the uri to this app.
        specialRole:
          type: string
          description: (**Leaf** only) if this leaf has a special role, that role
            is specified here. Valid roles are "home" and  "reportViewer".
        createDefaultShortcut:
          type: boolean
          description: (**leaf** only) Has this leaf requested a "default shortcut"
            be created?
        shortcutLabel:
          type: string
          description: (**leaf** only) Used in conjunction with <tt>createDefaultShortcut</tt>,
            a localized  label for the shortcut.
        links:
          type: array
          description: the Hateoas link for this branch/leaf.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of this schema. This representation is 2.
    applicationEnhanced:
      x-sas-media-type:
        name: application/vnd.sas.app.registry.application.enhanced
        version: 1
      title: leaf node with optional "authRules" member
      description: This represents a leaf node with the additional information from
        the optional "authRules" member.
      allOf:
      - $ref: "#/components/schemas/application"
      - type: object
        properties:
          version:
            type: integer
            description: The version number of this schema. This representation is
              1.
          authRules:
            $ref: "#/components/schemas/authRules"
    authRules:
      title: authorization rules
      description: Authorization rules info for this application, a list of "entryPoints"
        and "capabilities". "entryPoints", typically exactly 1 member, define the
        rule for accessing the application. "capabilities", often 0 to several, define
        the rule(s) for optional functionality, which the administration might want
        to grant or limit to communities of users.
      properties:
        entryPoints:
          type: array
          description: Typically exactly 1 member, define the rule for accessing the
            application.
          items:
            $ref: "#/components/schemas/authRuleId"
        capabilities:
          type: array
          description: Often 0 to several, define the rule(s) for optional functionality,
            which the administration might want to grant or limit to communities of
            users.
          items:
            $ref: "#/components/schemas/authRuleId"
    authRuleId:
      required:
      - ruleId
      - label
      description: A single authorization rule Id, with label and optional description.
      properties:
        ruleId:
          type: string
          description: The authorization rule Id
        label:
          type: string
          description: Localized label, for example "SASDrive allow upload"
        description:
          type: string
          description: Optional localized description providing more information about
            this rule.
    favorite:
      x-sas-attributes:
        since: 5
      title: favorite
      description: favorite
      required:
      - directiveId
      properties:
        directiveId:
          type: string
          description: The identifier, which will be the directive identifier, e.g.
            the application
        label:
          type: string
          description: The application label. (ignored on upload)
        links:
          type: array
          description: favorite links, this will include "delete" to remove this application
            as a favorite.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of this schema. This representation is 1.
    favoritesCollection:
      x-sas-attributes:
        since: 5
      title: collection of the user's favorites
      description: a standard sas collection (of Favorite) which does not support
        paging. The size is expected to be small.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/favorite"
            description: Array of favorite.
    artifactType:
      required:
      - id
      - type
      - apps
      x-sas-media-type:
        name: application/vnd.sas.app.registry.artifact.type
        version: 1
      description: the artifact or repository type
      properties:
        id:
          type: string
          description: the REST id. (will be the same as the type).
        type:
          type: string
          description: The repository type this represents, for example "report".
        apps:
          type: array
          description: the application(s) which open this type.
          items:
            $ref: "#/components/schemas/applicationAction"
        creators:
          type: array
          description: list of directives which can create this type.
          items:
            $ref: "#/components/schemas/directiveAndAppId"
        links:
          type: array
          description: the Hateoas link(s) for this object.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of this schema. This representation is 1.
    directiveAndAppId:
      required:
      - directive
      - appId
      description: simple holder of a directive id and application id.
      properties:
        directive:
          type: string
          description: the directive name.
        appId:
          type: string
          description: the application id.
    applicationAction:
      required:
      - directive
      - appId
      - targetVerbLabel
      description: an individual "verb/application" combo, for example "edit" with
        "visualanalytics".  This is also not a distinct  REST object, but contained
        within ArtifactType.
      properties:
        directive:
          type: string
          description: the application's directive.
        appId:
          type: string
          description: the associated "appId" - this is the same ID as the App Switcher
            uses.
        targetVerbLabel:
          type: string
          description: the already localized label to present to the user.  Often
            "open", "edit", or "view".
        targetVerbCode:
          type: string
          description: Typically null, if supplied, pass this key along to the opening
            application so it knows which choice the user  made. The primary intent
            is for applications which supply multiple actions to know which the user
            selected,  for example if "designer-viewer" were a single application,
            they would ask to present to users both "view" and  "edit", and would
            need to know which the user selected.  The reason this is rarely used
            is that typically the  operation is "app, do the one thing you are expecting
            to do with something of this type".
        allTypesRegistration:
          type: boolean
          description: typically null, true if this entry is because the application
            registered for "all types".  (This requested by the client so it can treat
            such entries differently.)
    uploadResult:
      description: result of uploading application registration data
      properties:
        changed:
          type: boolean
          description: whether the uploaded data represents a change; true if the
            application has never uploaded data before, or has  changed its uploaded
            data in any way.
        deletedDirectives:
          type: array
          description: a list of deleted leaf nodes and/or branch nodes.
          items:
            type: string
        directives:
          type: array
          description: a list of DirectiveContent reflecting what was uploaded.
          items:
            $ref: "#/components/schemas/directiveContent"
        warnings:
          type: array
          description: a list of warnings generated when the uploaded data was parsed.
          items:
            type: string
    directiveContentCollection:
      title: collection of DirectiveContent
      description: a standard sas collection (of DirectiveContent) which does not
        support paging. The size is expected to be small.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/directiveContent"
            description: Array of the application (tree).
    directiveContent:
      required:
      - id
      - integrationXml
      description: representation of the branch/leaf
      properties:
        id:
          type: string
          description: the directive's (branch/leaf) id.
        integrationXml:
          type: string
          description: integration xml for this node.
        resources:
          type: array
          description: various L10N resource files
          items:
            $ref: "#/components/schemas/fileContents"
    integrationFilesIn:
      required:
      - files
      description: holds an array of files.
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/fileContents"
    fileContents:
      required:
      - fileName
      description: a file name, and its contents.
      properties:
        fileName:
          type: string
          description: the file name, e.g. "sashome_es.properties"
        contents:
          type: string
          description: file contents, typically omitted in "get all" use case.
    serviceNamesCollection:
      title: collection of service names
      description: a standard sas collection (of ServiceName) which does not support
        paging. The size is expected to be modest.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/serviceName"
            description: Array of the service name info.
    serviceName:
      title: service name
      description: mapping of service ID to name
      properties:
        id:
          type: string
          description: the service's ID
        name:
          type: string
          description: the service's name
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
  examples:
    type:
      description: >
        get a single type (report in this case)
