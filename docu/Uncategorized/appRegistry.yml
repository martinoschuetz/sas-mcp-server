          \ and Visualize", "hidden": false}
    integrationJavaStyleL10N:
      description: >
        VA integration request.  Note the payload is an XML file, and one or more
        property files, encoded as a JSON string.
        Automation takes care of the encoding, developers are expected to write the
        xml and properties files. This is a
        "java style" localization, with resource bundles attached too (only 1 properties
        file is shown here, but
        20+ is common)
      value: {"files": [{"fileName": "sasvisualanalytics.xml", "contents": "<?xml\
              \ version=\"1.0\" encoding=\"UTF-8\"?>\r\n<appRegistryEntries>\r\n \
              \   <delete>\r\n        <entry name=\"SASReportViewer\"/>\r\n    </delete>\r\
              \n    <appRegistryLeaf name=\"SASVisualAnalytics\" label.key=\"label.txt\"\
              \ uri=\"/SASVisualAnalytics/\"\r\n                     parentId=\"analytics_life_cycle_branch\"\
              >\r\n        <options\r\n                appId=\"VANextLogon\"\r\n \
              \               appSwitcherCompliance=\"true\"\r\n                createDefaultShortcut=\"\
              true\"\r\n                relativeOrder=\"140\"\r\n                appName=\"\
              SAS® Visual Analytics\"\r\n                shortcutLabel.key=\"label.txt\"\
              />\r\n        <artifact\r\n                name=\"report\"\r\n     \
              \           allowSetLogonDocument=\"true\"\r\n                createArtifactAuthorizationURI=\"\
              /SASVisualAnalytics_capabilities/edit\"\r\n                openingPriority=\"\
              20\">\r\n            <verb labelL10NKey=\"appregistry.otherApplicationIntegration.verbLabelOpen.txt\"\
              />\r\n        </artifact>\r\n        <artifact\r\n                name=\"\
              dataTable\"\r\n                authorizationURI=\"/SASVisualAnalytics_capabilities/edit\"\
              \r\n                openingPriority=\"20\">\r\n            <verb label.key=\"\
              exploreAndVisualize.txt\"/>\r\n        </artifact>\r\n        <authRules>\r\
              \n            <entryPoints>\r\n                <!-- \"Access SAS Visual\
              \ Analytics\" -->\r\n                <authRule ruleId=\"00b08a2f-847f-4c2a-98b5-e1711860d02d\"\
              \ label.key=\"entryPoint.label.txt\"/>\r\n            </entryPoints>\r\
              \n            <capabilities>\r\n                <!-- \"Create and modify\
              \ analytical models in SAS Visual Analytics.\" -->\r\n             \
              \   <authRule ruleId=\"2e6585ad-4a5a-406d-a9f1-79beac6043d8\" label.key=\"\
              capability.analytical.models.label.txt\"/>\r\n                <!-- \"\
              Allow to create a shared data view.\" -->\r\n                <authRule\
              \ ruleId=\"SASVisualAnalytics-SDV-1\" label.key=\"capability.shared.data.view.label.txt\"\
              />\r\n            </capabilities>\r\n        </authRules>\r\n      \
              \  <localizationResource propertyFilePrefix=\"sasvisualanalytics\"/>\r\
              \n    </appRegistryLeaf>\r\n</appRegistryEntries>\r\n"}, {"fileName": "sasvisualanalytics.properties",
            "contents": "# our application's label\r\nlabel.txt=Explore and Visualize\r\
              \napp.openReport.txt=Open report\r\nexploreAndVisualize.txt=Explore\
              \ and visualize\r\nentryPoint.label.txt=Access SAS Visual Analytics\r\
              \ncapability.analytical.models.label.txt=Create and modify analytical\
              \ models in SAS Visual Analytics.\r\ncapability.shared.data.view.label.txt=Allow\
              \ to create a shared data view."}]}
