components:
  schemas:
    createReference:
      title: Create reference
      description: Used to create a single reference.
      required:
      - resourceUri
      properties:
        resourceUri:
          type: string
          description: The URI of the resource that this [reference](#model:reference)
            represents.
        contentType:
          type: string
          description: The type of the resource this refers to. This will be "report",
            or "storedprocess" or whatever type string is appropriate for the resource.
            The type should be registered with the types service so that services
            that retrieve this resource can look up the correct media type and endpoints
            for retrieving resources of this type. Also, it is very important that
            this value matches the type field of the summary representation (that
            is, the `application/vnd.sas.summary+json` representation).
        source:
          type: string
          description: Source for this reference. This is an indicator of the context
            from which the referenced resource was obtained. For a resource external
            to the deployment the source value is defined either by the process providing
            the resource inforamtion or is user-defined. For resources populated from
            within the deployment the default value is `sas`.
        analysisTimeStamp:
          type: string
          format: date-time
          description: Time stamp of the relationship analysis for this reference.
        creationTimeStamp:
          type: string
          format: date-time
          description: Time stamp of the creation of the referenced resource not this
            resource. For a resource external to the deployment, where an original
            time stamp is unavailable, the time stamp of the source file or the analysis
            time stamp will be used.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Time stamp of last modification of the referenced resource
            not this resource. For a resource external to the deployment, where an
            original time stamp is unavailable, the time stamp of the source file
            or the analysis time stamp will be used.
        createdBy:
          type: string
          description: The id of the user who created the referenced resource not
            this resource. For a resource external to the deployment, where the original
            user id is unavailable, the user id from the create / update request will
            be used.
        modifiedBy:
          type: string
          description: The id of the last user who modified the referenced resource
            not this resource. For a resource external to the deployment, where the
            original user id is unavailable, the user id from the create / update
            request will be used.
        name:
          type: string
          description: The name of the referenced resource.
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
    createReferenceCollection:
      title: Create references collection
      description: A collection used to create multiple references.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The array of `application/vnd.sas.relationship.reference`
              representations.
            items:
              $ref: "#/components/schemas/createReference"
    referenceCollection:
      title: References collection
      description: A collection of references.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The array of `application/vnd.sas.relationship.reference`
              representations.
            items:
              anyOf:
              - $ref: "#/components/schemas/reference"
              - $ref: "#/components/schemas/error2"
    updateReference:
      title: Update reference resource
      description: The reference to update.
      allOf:
      - $ref: "#/components/schemas/createReference"
      - type: object
        properties:
          id:
            type: string
            description: System-assigned unique ID for this object.
    reference:
      title: Reference resource
      description: A reference contains basic information about a resource for which
        there is a relationship. This is the `application/vnd.sas.relationship.reference`
        media type.
