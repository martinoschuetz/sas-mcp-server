---
openapi: 3.0.3
info:
  version: "2"
  title: Relationships
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  description: "This API is deprecated as of 2023.10 and will be removed in a future\
    \ release.\nThe Relationships API manages the storage and discovery of relationships,\
    \ and the retrieval of networks of relationship data."
tags:
- name: Root
  description: The operations for root.
- name: Relationships Management
  description: The operations for relationships management.
- name: Relationships Types Management
  description: The operations for relationships types management.
- name: References Management
  description: The operations for references management.
- name: Jobs Management
  description: The operations for jobs management.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the top-level links
      operationId: root
      description: >
        Returns a list of links to the top-level collections surfaced through
        this API. These top level links will include "relationships", "types",
        and "references". <p> <b>Authorization:</b> Any authenticated user. </p>
      parameters:
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.api+json
          - application/json
          default: application/vnd.sas.api+json
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              description: The media type of the response body.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                API:
                  $ref: "#/components/examples/rootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                API:
                  $ref: "#/components/examples/rootResponse"
        "404":
          description: The service was not avaialable.
  /relationships:
    get:
      summary: Get a paginated list of relationships
      description: Returns a paginated collection of relationships. The subject(s)
        are specified using either the `resourceUri` or the `referenceId` query parameter.
        Using `resourceUri` or `referenceId` in the filter parameter can conflict
        with the `resourceUri` or `referenceId` query parameter. Standard paging,
        filtering, and sorting options are provided. The media type of the returned
        items in the collection is `application/vnd.sas.relationship+json`. References
        may also be queried using [POST /relationships#withQuery](#op:getRelationshipsWithQuery)
        with the query string in the request body.
      operationId: getRelationshipsQuery
      tags:
      - Relationships Management
      parameters:
      - name: resourceUri
        in: query
        description: >
          The subject or subjects for which to get relationships. Specify
          multiple subjects by using the `'|'` separator.
        schema:
          type: string
      - name: referenceId
        in: query
        description: >
          The ID of the subject or subjects for which to get relationships.
          Specify multiple subjects by using the `'|'` separator.
        schema:
          type: string
      - name: depth
        in: query
        description: >
          How deep to traverse the relationships tree. A value >1 specifies a
          recursive traversal through the list of related resources up to the
          specified depth. A value of -1 returns all relationships for all
          resources. The default setting is 1, which returns only direct
          relationships of the resource.
        schema:
          type: integer
          format: int32
          default: 1
      - name: direction
        in: query
        description: >
          The direction of the relationships to return. A relationship is
          defined as a resource URI "to" a related resource URI. A direction
          value of "from" returns relationships where the resource(s)
          indicated by the `resourceUri` or `referenceId` parameter is the
          related resource. A value of "both" returns all relationships that
          include the resource(s) indicated by the `resourceUri` or
          `referenceId` parameter.
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: The 0-based start index of a paginated request.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        required: false
        description: The maximum number of items to return in this request.
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: "The sort criteria for returned relationships. Supports the following\
          \ fields in either ascending or descending order: `id`, `type`, `resourceUri`,\
          \ `referenceId`, `relatedResourceUri`, `relatedReferenceId`, `source`, `modifiedTimeStamp`,\
          \ `creationTimeStamp`, `createdBy`, `modifiedBy`."
        schema:
          type: string
          format: sort-criteria
          default: name
      - name: filter
        in: query
        description: 'An expression for filtering the collection. Valid expressions
          include `eq(member,"string")`. Allowed members: `id`, `resourceUri`, `type`,
          `relatedResourceUri`, `source`, `resource.type`. The `resource.type` criteria
          is applied to each resource and related resource. When depth > 1, the relationship
          type and `resource.type` criteria are applied at each level. Relationships
          that are filtered out for a given level are not used to search the next
          level.'
        schema:
          type: string
          format: filter-criteria
      responses:
        "200":
          description: Ok.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the relationship was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/relationshipCollection"
              examples:
                API:
                  $ref: "#/components/examples/relationshipsCollectionResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/relationshipCollection"
              examples:
                API:
                  $ref: "#/components/examples/relationshipsCollectionResponse"
        "400":
          description: Bad request (the request is not well-formed).
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/BadRequestGetRel"
    post:
      summary: Add a relationship
      description: Adds a new relationship. A relationship requires a resource, a
        related resource and the relationship type. A resource can be specified by
        either a resource URI or a reference ID. The related resource can be defined
        by either a related resource URI or a related reference ID. Relationship uniqueness
        is defined by the combination of the resource and the related resource. If
        an invalid reference ID is provided a 404 is returned. If a reference does
        not exist for a resource URI a reeference will be created. When possible,
        additional resource information is queried and added to the reference. For
        resources external to the SAS system, the client should provide additional
        reference information. Attempting to add a relationship that already exists
        leaves the existing relationship unchanged.
      operationId: createRelationship
      tags:
      - Relationships Management
      requestBody:
        content:
          application/vnd.sas.relationship+json:
            schema:
              $ref: "#/components/schemas/createRelationship"
            examples:
              API:
                $ref: "#/components/examples/createRelationshipRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/createRelationship"
            examples:
              API:
                $ref: "#/components/examples/createRelationshipRequest"
        description: A relationship.
        required: true
      responses:
        "201":
          description: The relationship was added.
          headers:
            Location:
              description: Location (URL) of the new relationship.
              schema:
                type: string
            ETag:
              description: The entity tag for the relationship.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the relationship was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.relationship+json:
              schema:
                $ref: "#/components/schemas/relationship"
              examples:
                API:
                  $ref: "#/components/examples/relationshipResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/relationship"
              examples:
                API:
                  $ref: "#/components/examples/relationshipResponse"
        "400":
          description: Bad request (the request is not well-formed).
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/BadRequestPost"
        "409":
          description: The requested object already exists.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/409ConflictResponseRel"
    patch:
      summary: Delete relationships
      operationId: patchRelationships
      description: 'Delete a list of relationships. Uses a JSON Patch body with `"op"
        : "remove"` on a specific relationship ID.  Clients which do not support PATCH
        can use POST and specify a query parameter of `?_method=PATCH`. All referenced
        resources must exist for the PATCH to be applied.'
      tags:
      - Relationships Management
      requestBody:
        content:
          application/json-patch:
            schema:
              $ref: "#/components/schemas/multiDeleteCollection"
            examples:
              API:
                $ref: "#/components/examples/patch"
          application/json:
            schema:
              $ref: "#/components/schemas/multiDeleteCollection"
            examples:
              API:
                $ref: "#/components/examples/patch"
        description: The relationships.
      responses:
        "204":
          description: Ok. The relationships were deleted.
        "400":
          description: Bad request (the request is not well-formed).
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/BadRequestPatch"
  "/relationships/{relationshipId}":
    head:
      summary: Check if relationship exists
      description: Returns whether or not a relationship with the specified ID exists,
        along with appropriate headers.
      operationId: headersForRelationship
      tags:
      - Relationships Management
      parameters:
      - name: relationshipId
        in: path
        description: The relationship ID.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok. The relationship exists.
          headers:
            ETag:
              description: The entity tag for the relationship.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the relationship was last modified.
              schema:
                type: string
                format: date-time
        "404":
          description: No relationship exists at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/404NotFoundRel"
    get:
      summary: Get a relationship
      description: Returns an existing relationship.
      operationId: getRelationship
      tags:
      - Relationships Management
      parameters:
      - name: relationshipId
        in: path
        description: The relationship ID.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok.
          headers:
            ETag:
              description: The entity tag for the relationship.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the relationship was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.relationship+json:
              schema:
                $ref: "#/components/schemas/relationship"
              examples:
                API:
                  $ref: "#/components/examples/relationshipResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/relationship"
              examples:
                API:
                  $ref: "#/components/examples/relationshipResponse"
        "404":
          description: No relationship exists at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/404NotFoundRel"
    put:
      summary: Update a relationship
      description: The PUT will fail if the ID in the body does match not the `relationshipId`.
        Only the `type` field can be updated.
      operationId: updateRelationship
      tags:
      - Relationships Management
      parameters:
      - name: relationshipId
        in: path
        description: The relationship ID.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The eEag that was returned from a GET, POST, or PUT of this relationship.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the `lastModified` date of the relationship.  If
          the relationship has been updated since this time, the update will fail.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.relationship+json:
            schema:
              $ref: "#/components/schemas/updateRelationship"
            examples:
              API:
                $ref: "#/components/examples/updateRelationshipRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/updateRelationship"
            examples:
              API:
                $ref: "#/components/examples/updateRelationshipRequest"
        description: The relationship.
        required: true
      responses:
        "200":
          description: Ok.
          headers:
            Location:
              description: Location (URL) of the new reference.
              schema:
                type: string
            ETag:
              description: The entity tag for the reference.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the reference was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.relationship+json:
              schema:
                $ref: "#/components/schemas/relationship"
              examples:
                API:
                  $ref: "#/components/examples/relationshipResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/relationship"
              examples:
                API:
                  $ref: "#/components/examples/relationshipResponse"
        "400":
          description: Bad request (the request is not well-formed).
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/BadRequestPost"
        "404":
          description: No relationship exists at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/404NotFoundRel"
        "409":
          description: A conflict exists with an existing relationship.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/409ConflictResponseRel"
        "412":
          description: Precondition failed. The target has changed since it was last
            fetched.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/412PreconditionFailedRel"
        "428":
          description: The request headers did not include an `If-Match` or `If-Unmodified-Since`
            precondition.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/428PreconditionRequiredRel"
    delete:
      summary: Remove a relationship
      description: Removes the specified relationship. This operation will not remove
        references even if there are no relationships which use the referenced resource.
      operationId: deleteRelationship
      tags:
      - Relationships Management
      parameters:
      - name: relationshipId
        in: path
        description: The relationship ID.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The relationship was deleted.
  /relationships#multiPost:
    post:
      summary: Update or create relationships
      description: A relationship requires a resource, a related resource, and a relationship
        type. A resource can be specified by either a resource URI or a reference
        ID. The related resource can be defined by either a related resource URI or
        a related reference ID. Relationship uniqueness is defined by the combination
        of the resource and the related resource. When the ID is provided, this operation
        performs a full replacement of the relationship. When no ID is provided, and
        the relationship is not unique, the relationship is not updated. The parameter
        `?onConflict=update` can be used to update existing relationships with a matching
        resource and related URIs. The ID field cannot be updated during this operation.
        The response is a collection of `application/vnd.sas.relationship` resources.
        When a resource creation or update fails, the collection includes an `application/vnd.sas.error`
        object that describes why the operation failed. If an invalid reference ID
        is provided a 404 is returned. If a reference does not exist for a resource
        URI a reeference will be created. When possible, additional resource information
        is queried and added to the reference. For resources external to the SAS system,
        the client should provide additional reference information. The media type
        `application/vnd.sas.collection+json` is required for this endpoint to prevent
        ambiguity with other POST operations to this collection.
      operationId: createOrUpdateRelationships
      tags:
      - Relationships Management
      parameters:
      - name: onConflict
        in: query
        description: How to handle conflicts when a reference already exists.
        required: false
        schema:
          type: string
          enum:
          - update
          - ignore
      - name: If-Unmodified-Since
        in: header
        description: The value of the lastModified date of the relationship.  If the
          relationship has been updated since this time, the update will fail.  This
          header is only required when the `onConflict='update'` parameter is specified,
          and is only applied to relationships being updated.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/createRelationshipCollection"
            examples:
              API:
                $ref: "#/components/examples/relationshipsPostRequest"
        description: A collection of `application/vnd.sas.relationship` resources.
        required: true
      responses:
        "200":
          description: Ok.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/relationshipCollection"
              examples:
                API:
                  $ref: "#/components/examples/relationshipsPostResponse"
        "400":
          description: Bad request (the request is not well-formed).
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/BadRequestPostRel"
  /relationships#withQuery:
    post:
      summary: Get paginated list of relationships via query
      description: Returns a paginated collection of relationships. Standard paging,
        filtering, and sorting options are provided. The media type of the returned
        items in the collection is `application/vnd.sas.relationship+json`. This call
        is an extended GET operation and therefore idempotent.
      operationId: getRelationshipsWithQuery
      tags:
      - Relationships Management
      parameters:
      - name: start
        in: query
        required: false
        description: The 0-based start index of a paginated request.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        required: false
        description: The maximum number of items to return in this request.
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: "The sort criteria supports the following fields in ascending\
          \ or descending order: `id`, `type`, `resourceUri`, `referenceId`, `relatedResourceUri`,\
          \ `relatedReferenceId`, `source`, `modifiedTimeStamp`, `creationTimeStamp`,\
          \ `createdBy`, `modifiedBy`."
        schema:
          type: string
          format: sort-criteria
          default: name
      requestBody:
        content:
          application/vnd.sas.relationship.query+json:
            schema:
              $ref: "#/components/schemas/relationshipQuery"
            examples:
              API:
                $ref: "#/components/examples/relationshipsPostQueryRequest"
        description: relationshipQuery
        required: true
      responses:
        "200":
          description: Ok.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the relationship was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/relationshipCollection"
              examples:
                API:
                  $ref: "#/components/examples/relationshipsPostQueryResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/relationshipCollection"
              examples:
                API:
                  $ref: "#/components/examples/relationshipsPostQueryResponse"
        "400":
          description: Bad request (the request is not well-formed).
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/BadRequestGetRel"
  /types:
    get:
      summary: Get relationships types
      description: Returns a collection of relationships types. The media type of
        the returned collection items is `application/vnd.sas.relationship.type+json`.
        `Accept-Language` is specified to return locale-specific labels and descriptions.
      operationId: getTypes
      tags:
      - Relationships Types Management
      parameters:
      - name: Accept-Language
        in: header
        description: The lanaguage/locale to use for localizable content.
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first relationship type in a page.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: The maximum number of types to return in this page of results.
          The actual number of returned types may be less if the collection has been
          exhausted.
        schema:
          type: integer
          default: 50
      - name: filter
        in: query
        description: "Filter criteria for returned types. Filters are supported on\
          \ the following top level fields for types: `name`, `description`, `directional`,\
          \ `label`, `partnerName`, `partnerDescription`, `partnerLabel`."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "Sort returned types. The sort criteria supports the following\
          \ fields in ascending or descending order: `name`, `description`, `directional`,\
          \ `label`, `partnerName`, `partnerDescription`, `partnerLabel`."
        schema:
          type: string
          format: sort-criteria
          default: name
      responses:
        "200":
          description: Ok.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/typeCollection"
              examples:
                API:
                  $ref: "#/components/examples/relationshipsTypesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/typeCollection"
              examples:
                API:
                  $ref: "#/components/examples/relationshipsTypesResponse"
        "400":
          description: Bad request (the request is not well-formed).
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/BadRequestGetType"
  "/types/{typeName}":
    get:
      summary: Get relationship type
      description: Returns information about a relationship type. The default return
        media type is `application/vnd.sas.relationship.type+json`. To return locale-specific
        labels and descriptions, specify an `Accept-Language`.
      operationId: getType
      tags:
      - Relationships Types Management
      parameters:
      - name: Accept-Language
        in: header
        description: The lanaguage/locale to use for localizable content.
        schema:
          type: string
      - name: typeName
        in: path
        description: The type name.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
            application/vnd.sas.relationship.type+json:
              schema:
                $ref: "#/components/schemas/type"
              examples:
                API:
                  $ref: "#/components/examples/relationshipsTypeResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/type"
              examples:
                API:
                  $ref: "#/components/examples/relationshipsTypeResponse"
        "404":
          description: No type exists at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/404NotFoundType"
  /references:
    get:
      summary: Get references
      description: Returns a collection of references.  Standard paging, filtering,
        and sorting options are provided. The default media type of the returned items
        in the collection is `application/vnd.sas.relationship.reference+json`. References
        may also be queried using [POST /references#withQuery](#op:getReferencesWithQuery)
        with the query string in the request body.
      operationId: getReferences
      tags:
      - References Management
      parameters:
      - name: Accept-Item
        in: header
        description: An alternative media type that the service recognizes. Optional.
          If the service can not provide the media type, a 406 response is returned.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.summary+json
          - application/vnd.sas.relationship.reference+json
      - name: start
        in: query
        description: The starting index of the first reference in a page.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: The maximum number of references to return in this page of results.
          The actual number of returned references may be less if the collection has
          been exhausted.
        schema:
          type: integer
          default: 50
      - name: filter
        in: query
        description: "Filter criteria for returned references. Filters are supported\
          \ on the following top level fields for references: `id`, `name`, `resourceUri`,\
          \ `type`, `source`, `analysisTimeStamp`, `modifiedTimeStamp`, `creationTimeStamp`,\
          \ `createdBy`, `modifiedBy`."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "Sort the returned resources.  The sort criteria supports the\
          \ following fields in ascending or descending order: `id`, `name`, `resourceUri`,\
          \ `type`, `source`, `analysisTimeStamp`, `modifiedTimeStamp`, `creationTimeStamp`,\
          \ `createdBy`, `modifiedBy`."
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: Ok.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the relationship was last modified.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.collection+json:
              schema:
