              examples:
                API:
                  $ref: "#/components/examples/getReferencesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/referenceCollection"
              examples:
                API:
                  $ref: "#/components/examples/getReferencesResponse"
        "400":
          description: Bad request (the request is not well-formed).
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                API:
                  $ref: "#/components/examples/BadRequestGetRef"
    post:
      summary: Create a new reference
      description: The resource URI must be set by the client within the request body,
        and this URI must be unique across the entire system.
      operationId: createReference
      tags:
      - References Management
      requestBody:
        content:
          application/vnd.sas.relationship.reference+json:
            schema:
              $ref: "#/components/schemas/createReference"
