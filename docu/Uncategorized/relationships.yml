      description: Returns a paginated collection of references.  Standard paging,
        filtering, and sorting options are provided. The default media type of the
        returned items in the collection is `application/vnd.sas.relationship.reference+json`.
        This call is an extended GET operation and therefore idempotent. The body
        of the request contains the query parameters and filters to apply to the request.
        To find references with the content type of `table` the body of the request
        would be `eq(contentType, "table")`.
      operationId: getReferencesWithQuery
