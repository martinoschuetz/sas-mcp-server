  /references#multiPost:
    post:
      summary: Update or create references
      description: >
        Updates or creates references. When the ID is provided for a reference
        in the collection, the operation performs a full replacement of the
        reference. If no ID is provided, and the resource URI is not unique in
        the system, the reference is not updated (the default). The parameter
        `?onConflict=update` can be used to update existing references with a
        matching resource URI. The ID field can not be updated during this
        operation. If the reference does not exist, one is created. The response
        will be a collection of `application/vnd.sas.relationship.reference`
        resources. If a reference creation or update fails, the collection will
        include an `application/vnd.sas.error` object that describes why the
        reference failed. The specific media type of
        `application/vnd.sas.collection+json` is required for this endpoint to
        prevent ambiguity with other POST operations to this collection.
      operationId: createOrUpdateReferences
      tags:
      - References Management
      parameters:
      - name: onConflict
        in: query
        description: How to handle conflicts when a reference already exists.
        required: false
        schema:
          type: string
          enum:
          - update
          - ignore
      - name: If-Unmodified-Since
        in: header
        description: The value of the `lastModified` date of the reference. If the
          reference has been updated since this time, the update will fail.  This
          header is required only when the `onConflict='update'` parameter is specified
          and is applied only to updated references.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/createReferenceCollection"
            examples:
              API:
                $ref: "#/components/examples/createReferencesRequest"
        description: A collection of `application/vnd.sas.relationship.reference`
          resources.
        required: true
      responses:
        "200":
          description: Ok.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
