---
openapi: 3.0.3
info:
  version: "1"
  title: Data Quality Monitoring
  description: "The Data Quality Monitoring API provides a way to create, manage,\
    \ and apply data quality monitoring rules to a data set. These rules identify\
    \ where the data set meets defined conditions."
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: "http://example.com/dataQualityMonitoring"
  description: This is an example base URL.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Argument Types
  description: Contains the operations for the argument types used by Data Quality
    Monitoring rules.
- name: Code
  description: Contains the operations for generating code for data quality monitoring
    rules.
- name: Domains
  description: Contains the operations for the domains where data quality monitoring
    rules are evaluated.
- name: Rule Definitions
  description: Contains the operations for rule definitions.
- name: Rule Templates
  description: Contains the operations for rule templates.
- name: Tags
  description: Contains the operations for managing tags for rule definitions and
    rule templates.
paths:
  /:
    head:
      operationId: headersForRoot
      summary: Get headers and verify that API is available
      description: |
        Returns header information and verifies that the Data Quality Monitoring service is running.
      tags:
      - Root
      responses:
        "200":
          description: OK.
        "404":
          $ref: "#/paths/~1/get/responses/404"
    get:
      operationId: root
      summary: Get top-level resource links
      description: Returns a list of top-level resource links provided by the Data
        Quality Monitoring API.
      tags:
      - Root
      parameters:
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.api+json
          - application/json
          default: application/vnd.sas.api+json
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              description: The media type of the response body.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/paths/~1/get/responses/200/content/application~1json/schema"
              examples:
                API:
                  $ref: "#/paths/~1/get/responses/200/content/application~1json/examples/API"
            application/json:
              schema:
                title: API
                description: The list of links to top-level resources and operations
                  available from root of the API.
                x-sas-media-type:
                  name: application/vnd.sas.api
                  version: 1
                required:
                - version
                - links
                properties:
                  version:
                    type: integer
                    description: The version number of the API representation. This
                      is version 1.
                    minimum: 1
                  links:
                    description: The API's top-level links.
                    type: array
                    items:
                      title: Link
                      type: object
                      description: A link to a related operation or resource.
                      required:
                      - rel
                      properties:
                        method:
                          type: string
                          description: The HTTP method for the link.
                        rel:
                          type: string
                          description: The relationship of the link to the resource.
                        uri:
                          type: string
                          description: The relative URI for the link.
                        href:
                          type: string
                          description: The URL for the link.
                        title:
                          type: string
                          description: The title for the link.
                        type:
                          type: string
                          description: The media type or link type for the link.
                        itemType:
                          type: string
                          description: "If this is a link to a container, `itemType`\
                            \ is the media type or link type for the items in the\
                            \ container."
                        responseType:
                          type: string
                          description: "The media type or link type of the response\
                            \ body for a `PUT`, `POST`, or `PATCH` operation."
                        responseItemType:
                          type: string
                          description: "The media type or link type of the items in\
                            \ the response body for a `PUT`, `POST`, or `PATCH` operation."
              examples:
                API:
                  summary: Root API response
                  description: The root response consists of a collection of links
                    that can be used to navigate the Data Quality Monitoring service
                    API.
                  value:
                    version: 1
                    links:
                    - method: GET
                      rel: argumentTypes
                      href: /dataQualityMonitoring/argumentTypes
                      uri: /dataQualityMonitoring/argumentTypes
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.rule.argument.type
                    - method: GET
                      rel: domains
                      href: /dataQualityMonitoring/domains
                      uri: /dataQualityMonitoring/domains
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.rule.domain
                    - method: GET
                      rel: ruleDefinitions
                      href: /dataQualityMonitoring/ruleDefinitions
                      uri: /dataQualityMonitoring/ruleDefinitions
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.rule.definition
                    - method: POST
                      rel: createRuleDefinition
                      href: /dataQualityMonitoring/ruleDefinitions
                      uri: /dataQualityMonitoring/ruleDefinitions
                      type: application/vnd.sas.data.quality.rule.definition
                    - method: GET
                      rel: ruleTemplates
                      href: /dataQualityMonitoring/ruleTemplates
                      uri: /dataQualityMonitoring/ruleTemplates
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.rule.template
                    - method: GET
                      rel: tags
                      href: /dataQualityMonitoring/tags
                      uri: /dataQualityMonitoring/tags
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.tag.rule.definition
                    - method: POST
                      rel: createTags
                      href: /dataQualityMonitoring/tags
                      uri: /dataQualityMonitoring/tags
                      type: application/vnd.sas.data.quality.tag.rule.definition
        "404":
          description: The Data Quality Monitoring service is not available.
          content:
            application/vnd.sas.error+json:
              schema:
                title: Error
                type: object
                description: The representation of an error.
                x-sas-media-type:
                  name: application/vnd.sas.error
                  version: 2
                required:
                - httpStatusCode
                - version
                properties:
                  message:
                    type: string
                    description: The message for the error.
                  id:
                    type: string
                    description: The string ID for the error.
                  errorCode:
                    type: integer
                    description: The numeric ID for the error.
                  httpStatusCode:
                    type: integer
                    description: The HTTP status code for the error.
                  details:
                    type: array
                    description: Messages that provide additional details about the
                      cause of the error.
                    items:
                      type: string
                  remediation:
                    type: string
                    description: A message that describes how to resolve the error.
                  errors:
                    type: array
                    description: Any additional errors that occurred.
                    items:
                      $ref: "#/paths/~1/get/responses/404/content/application~1vnd.sas.error%2Bjson/schema"
                  links:
                    type: array
                    description: The links that apply to the error.
                    items:
                      $ref: "#/paths/~1/get/responses/200/content/application~1json/schema/properties/links/items"
                  version:
                    type: integer
                    description: The version number of the error representation. This
                      representation is version 2.
              examples:
                Error - Service Unavailable:
                  summary: Error - Service Unavailable
                  description: The service is unavailable.
                  value:
                    version: 2
                    httpStatusCode: 404
                    message: Not Found
                    details: The service is unavailable.
