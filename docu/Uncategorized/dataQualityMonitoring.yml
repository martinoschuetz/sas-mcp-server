                        fields:
                        - id: 9301f87f-4664-44cd-aadf-db700f701805
                          version: 1
                          name: column
                          description: Specifies the column name (string).
                          context: input
                          argumentTypeId: 2d3ccd67-a2c0-422f-9f44-9855075d10f8
                          required: true
                          properties: '{"dataBound": true}'
                        - id: da76021c-7cb4-4ddc-ba4b-f0cba1c01be2
                          version: 1
                          name: min_value
                          label: min limit
                          description: "Specifies the minimum value that the column's\
                            \ value is expected not to fall below. When omitted, the\
                            \ lower bound is treated as unbounded (double)."
                          context: input
                          argumentTypeId: afe3b1df-2176-4899-a265-d86819172d21
                          required: false
                          properties: '{"defaultValue" : ""}'
                        - id: 0dee5625-ee0f-4ea4-8e3b-5f8dfe6a201d
                          version: 1
                          name: max_value
                          label: max limit
                          description: "Specifies the maximum value that the column's\
                            \ value is expected not to exceed. When omitted, the upper\
                            \ bound is treated as unbounded (double)."
                          context: input
                          argumentTypeId: afe3b1df-2176-4899-a265-d86819172d21
                          required: false
                          properties: '{"defaultValue" : ""}'
                        - id: 7600c79d-ec9c-40f9-a872-15db49226bcc
                          version: 1
                          name: strict_min
                          description: "If True, specifies that the column's value\
                            \ must be strictly greater than the min_value (Boolean).\
                            \ Default=False"
                          context: input
                          argumentTypeId: bfde6006-e6cd-43b9-b4e4-f3adce76a6f7
                          required: false
                          properties: '{"defaultValue" : "false"}'
                        - id: b5c63df0-fd7f-4462-8695-0e1f6b09cadb
                          version: 1
                          name: strict_max
                          description: "If True, specifies that the column's value\
                            \ must be strictly less than the max_value (Boolean).\
                            \ Default=False."
                          context: input
                          argumentTypeId: bfde6006-e6cd-43b9-b4e4-f3adce76a6f7
                          required: false
                          properties: '{"defaultValue" : "false"}'
                        - id: 832fb28c-3a2d-48d2-a4cc-987f5971c183
                          version: 1
                          name: treatMissingAsZero
                          description: "If True, treats all missing values as zero\
                            \ (Boolean). Default=False"
                          context: input
                          argumentTypeId: bfde6006-e6cd-43b9-b4e4-f3adce76a6f7
                          required: false
                          properties: '{"defaultValue" : "false"}'
                        implementations:
                        - id: 34600eb6-e9c2-4113-9ade-45c4dcc441c1
                          version: 1
                          domainId: 14f7ac7e-37d8-4744-b4c7-5544bc52a19d
                          expression: |2-

                            length '{{.result_column}}'N $5;

                            column_tmp_{{.alias}} = '{{.column}}'N;

                            /* Handle missing values if requested */
                            {{- if .treatMissingAsZero}}
                            if vtype('{{.column}}'N) = "N" and missing('{{.column}}'N) then
                                column_tmp_{{.alias}} = 0;
                            {{- end}}

                            '{{.result_column}}'N = 'FALSE';

                            /* Evaluate boundary condition and build based on strict flags */
                            {{- if and .min_value .max_value}}
                            {{- if and .strict_min .strict_max}}
                            if column_tmp_{{.alias}} > {{.min_value}} and
                               column_tmp_{{.alias}} < {{.max_value}} then
                            {{- else if .strict_min}}
                            if column_tmp_{{.alias}} > {{.min_value}} and
                               column_tmp_{{.alias}} <= {{.max_value}} then
                            {{- else if .strict_max}}
                            if column_tmp_{{.alias}} >= {{.min_value}} and
                               column_tmp_{{.alias}} < {{.max_value}} then
                            {{- else}}
                            if column_tmp_{{.alias}} >= {{.min_value}} and
                               column_tmp_{{.alias}} <= {{.max_value}} then
                            {{- end}}
                                '{{.result_column}}'N = 'TRUE';

                            {{- else if .min_value}}
                            {{- if .strict_min}}
                            if column_tmp_{{.alias}} > {{.min_value}} then
                            {{- else}}
                            if column_tmp_{{.alias}} >= {{.min_value}} then
                            {{- end}}
                                '{{.result_column}}'N = 'TRUE';

                            {{- else if .max_value}}
                            {{- if .strict_max}}
                            if column_tmp_{{.alias}} < {{.max_value}} then
                            {{- else}}
                            if column_tmp_{{.alias}} <= {{.max_value}} then
                            {{- end}}
                                '{{.result_column}}'N = 'TRUE';

                            {{- else}}
                            /* ERROR: both min_value and max_value are unset — at least one bound is required */
                            %put ERROR: ExpectColumnValuesToBeBetween — at least one of min_value or max_value must be provided;
                            {{- end}}

                            drop column_tmp_{{.alias}};
                        - id: 5cf27b0a-2883-49d9-bd6c-d7245fde00ac
                          version: 1
                          domainId: 347963d3-d196-464e-9865-199c195b0820
                          expression: |2-

                            ExpectColumnValuesToBeBetween(
                                column="{{.column}}"
                                {{- if .min_value}},
                                min_value={{.min_value}}
                                {{- end}}
                                {{- if .max_value}},
                                max_value={{.max_value}}
                                {{- end}},
                                strict_min={{if .strict_min}}True{{else}}False{{end}},
                                strict_max={{if .strict_max}}True{{else}}False{{end}}
                            )
