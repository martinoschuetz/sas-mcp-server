                      - id: 0dee5625-ee0f-4ea4-8e3b-5f8dfe6a201d
                        version: 1
                        name: max_value
                        label: max limit
                        description: "Specifies the maximum value that the column's\
                          \ value is expected not to exceed. When omitted, the upper\
                          \ bound is treated as unbounded (double)."
                        context: input
                        argumentTypeId: afe3b1df-2176-4899-a265-d86819172d21
                        required: false
                        properties: '{"required": false, "requiredWithout": "da76021c-7cb4-4ddc-ba4b-f0cba1c01be2",
                          "greaterThanOrEqual": "da76021c-7cb4-4ddc-ba4b-f0cba1c01be2",
                          "typeDescriptor": {"type": "afe3b1df-2176-4899-a265-d86819172d21"}}'
                      - id: 7600c79d-ec9c-40f9-a872-15db49226bcc
                        version: 1
                        name: strict_min
                        description: "If True, specifies that the column's value must\
                          \ be strictly greater than the min_value (Boolean). Default=False"
                        context: input
                        argumentTypeId: bfde6006-e6cd-43b9-b4e4-f3adce76a6f7
                        required: false
                        properties: '{"required": false, "typeDescriptor": {"type":
