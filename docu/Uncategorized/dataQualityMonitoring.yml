components:
  schemas:
    argumentType:
      title: Argument Type
      description: The representation of an argument type.
      required:
      - id
      - name
      - primitive
      allOf:
      - $ref: "#/components/schemas/tag/allOf/0"
      properties:
        name:
          description: The identity of this argument type; the maximum length is 100.
            Leading and trailing whitespace characters are not allowed.
          type: string
        description:
          description: The descriptive text for this argument type; the maximum length
            is 1000.
          type: string
        primitive:
          description: "The flag indicating if the type is a primitive type. If true,\
            \ it indicates that child objects are not supported. If false, it indicates\
            \ a complex type that supports having child components of other types."
          type: boolean
    argumentTypeCollection:
      title: Argument Type Collection
      description: This is a collection of argument types.
      allOf:
      - $ref: "#/components/schemas/domainCollection/allOf/0"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/argumentType"
    codeGenerationRequest:
      title: Code Generation Request
      description: "Given a list of rule definition revisions and their execution\
        \ bindings, generate and return the code for execution in the specified domain."
      required:
      - domainId
      - rules
      - inputTable
      - outputTable
      - columnPassthroughMode
      properties:
        domainId:
          description: The ID of the domain that the request is to target for generating
            code.
          type: string
          format: uuid
        rules:
          description: List of the rule definition revisions for which the request
            will generate code and the code generation metadata for each rule.
          type: array
          items:
            type: object
            required:
            - definitionRevisionUri
            - resultColumn
            properties:
              definitionRevisionUri:
                description: The URI of the rule definition revision for which the
                  request will generate code.
                type: string
              parameterBindings:
                description: List of the rule definition's parameters and the code
                  generation bindings for each.
                type: array
                items:
                  type: object
                  required:
                  - parameterId
                  - bindingType
                  properties:
                    parameterId:
                      description: The ID of the rule parameter.
                      type: string
                      format: uuid
                    bindingType:
                      description: The type of parameter binding this entry represents
                        (e.g. column_mapping).
                      type: string
                    columnName:
                      description: The name of the column in the input table to which
                        this rule parameter is bound.
                      type: string
              resultColumn:
                description: Name of the column in the output table to store the result
                  of the code generated for this rule definition revision.
                type: string
        inputTable:
          description: Name of the table that is the input to the generated code.
          type: string
        outputTable:
          description: Name of the table to which the generated code should write
            its results.
          type: string
        summaryTable:
          description: Name of the table to which the generated code should write
            its summary of results.
          type: string
        saveSummary:
          description: Flag to control whether code generation produces code to save
            the summary results table's contents back to Data Quality Monitoring.
          type: boolean
        columnPassthroughMode:
          description: "Directive to indicate which columns from the input table should\
            \ be passed through to the output table.  Choices are to pass through\
            \ all columns, only columns mapped to rule definition parameters, or only\
            \ specified columns."
          type: string
          format: enumeration
          enum:
          - all
          - mapped
          - specified
          default: all
        passthroughColumns:
          description: List of the columns from the input table to pass through to
            the output table when columnPassthroughMode is set to 'specified'.
          type: array
          items:
            type: string
    domain:
      title: Domain
      description: The representation of a Domain where data quality rules are evaluated
        and/or rule actions are executed.
      required:
      - id
      - name
      allOf:
      - $ref: "#/components/schemas/tag/allOf/0"
      properties:
        name:
          description: The identity of this domain; the maximum length is 100. Leading
            and trailing whitespace characters are not allowed.
          type: string
        description:
          description: The descriptive text for this domain; the maximum length is
            1000.
          type: string
    domainCollection:
      title: Domain Collection
      description: This is a collection of Domains.
      allOf:
      - title: Base Collection
        description: This is a base schema used to define paginated collections of
          resources. This base schema is extended by other schemas in APIs by adding
          an 'items' array property. These extensions define the application/vnd.sas.collection
          media type (version 2)
        properties:
          name:
            type: string
            description: The name of the collection.
          start:
            type: integer
            description: The zero-based index of the first item in the collection.
            format: int64
          limit:
            type: integer
            description: The number of items that were requested for the collection.
          count:
            type: integer
            description: "If populated, indicates the number of items in the collection."
            format: int64
          accept:
            type: string
            description: A space-delimited list of media types from which an `Accept`
              header can be constructed.
          links:
            type: array
            description: The links that apply to the collection.
            items:
              $ref: "#/paths/~1/get/responses/200/content/application~1json/schema/properties/links/items"
          version:
            type: integer
            description: The version number of the collection representation. This
              representation is version 2.
      - type: object
        properties:
          items:
            type: array
            description: Array containing domain resources.
            items:
              $ref: "#/components/schemas/domain"
    ruleDefinition:
      title: Rule Definition
      description: "A rule definition defines the different execution domains the\
        \ rule supports, the implementation of the rule within those domains, the\
        \ rule fields utilized by the rule, and the different data sources the rule\
        \ targets."
      type: object
      allOf:
      - $ref: "#/components/schemas/tag/allOf/0"
      required:
      - name
      - templateRevisionUri
      properties:
        name:
          description: The identity of this rule definition; the maximum length is
            100. Leading and trailing whitespace characters are not allowed.
          type: string
        description:
          description: The descriptive text for this rule definition; the maximum
            length is 1000.
          type: string
        tags:
          type: array
          description: An array that contains all the tags associated with the rule
            definition.
          items:
            type: string
        templateRevisionUri:
          description: URI of the rule template revision this definition is linked
            to.
          type: string
        template:
          $ref: "#/components/schemas/ruleTemplate"
        draft:
          description: A value to determine if the revision is a draft.
          type: boolean
        revisionNumber:
          description: The revision number of this current revision of the rule definition.
          type: integer
        revisionId:
          description: The ID of this current revision.
          type: string
          format: uuid
        revisionUri:
          description: The URI of this current revision.
          type: string
        previousRevisionId:
          description: The ID of the previous revision.
          type: string
          format: uuid
        previousRevisionUri:
          description: The URI of the previous revision.
          type: string
        parameters:
          type: array
          description: A list that contains rule parameter resources.
          items:
            $ref: "#/components/schemas/ruleParameter"
    ruleDefinitionCollection:
      title: Rule Definition Collection
      description: A collection of rule definitions.
      type: object
      allOf:
      - $ref: "#/components/schemas/domainCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains a collection of rule definition representations.
            items:
              anyOf:
              - $ref: "#/components/schemas/ruleDefinition"
              - $ref: "#/components/schemas/ruleDefinitionSummary"
    ruleDefinitionSummary:
      title: Rule Definition Summary
      description: Summary information about a rule definition.
      type: object
      allOf:
      - $ref: "#/components/schemas/tag/allOf/0"
      required:
      - name
      properties:
        name:
          description: The identity of this rule definition; the maximum length is
            100. Leading and trailing whitespace characters are not allowed.
          type: string
        description:
          description: The descriptive text for this rule definition; the maximum
            length is 1000.
          type: string
        tags:
          type: array
          description: An array that contains all the tags associated with the rule
            definition.
          items:
            type: string
        templateRevisionUri:
          description: URI of the rule template revision this definition is linked
            to.
          type: string
        template:
          $ref: "#/components/schemas/ruleTemplateSummary"
        draft:
          description: A value to determine if the revision is a draft.
          type: boolean
        revisionNumber:
          description: The revision number of this current revision of the rule definition.
          type: integer
        revisionId:
          description: The ID of this current revision.
          type: string
          format: uuid
        revisionUri:
          description: The URI of this current revision.
          type: string
        previousRevisionId:
          description: The ID of the previous revision.
          type: string
          format: uuid
        previousRevisionUri:
          description: The URI of the previous revision.
          type: string
    ruleField:
      title: Rule Field
      type: object
      description: The representation of a Rule Field.
      required:
      - name
      - context
      allOf:
      - title: Abstract Simple Object
        description: abstractSimpleObject supports modeling of other objects with
          minimal fields; it is never instantiated.
        properties:
          id:
            type: string
            description: The unique identity of this object. Immutable after creation.
          version:
            type: integer
            description: The version of the media type.
      properties:
        name:
          description: The identity of this rule field; the maximum length is 100.
            Leading and trailing whitespace characters are not allowed.
          type: string
        label:
          description: The user-presented text to represent this rule field; the maximum
            length is 100.
          type: string
        description:
          description: The descriptive text for this rule field; the maximum length
            is 1000.
          type: string
        context:
          description: |
            A string that is used to indicate the type of field.
          type: string
          enum:
          - input
          - output
          - inputOutput
          - internal
        argumentTypeId:
          description: |
            **Deprecated**: This property is deprecated. Please use the "type" field in the "typeDescriptor" rule field property instead.

            The ID of the rule field's argument type.
          type: string
          format: uuid
        childArgumentTypeId:
          description: |
            **Deprecated**: This property is deprecated. Please use the "childDescriptors" field in the "typeDescriptor" rule field property instead.

            The ID of the argument type of the child objects.
          type: string
          format: uuid
        required:
          description: |
            **Deprecated**: This property is deprecated. Please use the "required" rule field property instead.

            A value to determine if the field is required by the rule template; false if it is optional.
          type: boolean
        properties:
          description: |
            A JSON string describing metadata associated with the rule field. The string can be used by a consuming application to improve its rendering of the rule field, perform validation of values for the rule field, and so on.

            Example 1: Specify a default value for an Integer rule field by adding a "defaultValue" property to the properties object.  For example {"defaultValue" : 5} or {"defaultValue" : [1, 5]} for a list of integers.

            Example 2: Indicate a rule field (and its associated rule definition parameter) is bound to an input column by using the "dataBound" property to true. For example: {"dataBound" : true}

            The maximum length is 1000.
          type: object
          allOf:
          - $ref: "#/components/schemas/ruleFieldProperties"
    ruleFieldProperties:
      title: Rule Field Properties
      type: object
      description: The representation of a Rule Field's properties.
      properties:
        dataBound:
          description: A value to determine if the field is bound to an input column;
            false if it is not.
          type: boolean
        defaultValue:
          description: |
            A JSON value, array or object describing the default value for this rule field. The type of the default value must match the argument type of the rule field. For a List type rule field, the default value must be a JSON array. For a Dictionary type rule field, the default value must be a JSON object.
            This property is ignored if the "dataBound" property is set to true.
          anyOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
          - type: array
            items: {}
          - type: object
        required:
          description: |
            A value to determine if the field is required by the rule template; false if the field is optional.
            This property is ignored if the "dataBound" property is set to true.
          type: boolean
          default: false
        requiredWith:
          description: |
            This property specifies a list of rule field IDs that this rule field is associated with.  If a value is provided for ANY of the specified associated fields, then a value must be provided for this field as well.  If no value is provided for any of the associated fields, then this field is optional.
            This property is ignored if the "dataBound" property is set to true.
          type: array
          items:
            type: string
        requiredWithAll:
          description: |
            This property specifies a list of rule field IDs that this rule field is associated with.  If a value is provided for ALL of the specified associated fields, then a value must be provided for this field as well.  If no value is provided for any of the associated fields, then this field is optional.
            This property is ignored if the "dataBound" property is set to true.
          type: array
          items:
            type: string
        requiredWithout:
          description: |
            This property specifies a list of rule field IDs that this rule field is associated with.  If a value is NOT provided for ANY of the specified associated fields, then a value must be provided for this field.
            This property is ignored if the "dataBound" property is set to true.
          type: array
          items:
            type: string
        requiredWithoutAll:
          description: |
            This property specifies a list of rule field IDs that this rule field is associated with.  If a value is NOT provided for ALL of the specified associated fields, then a value must be provided for this field.
            This property is ignored if the "dataBound" property is set to true.
          type: array
          items:
            type: string
        equal:
          description: |
            This property specifies the ID of another rule field that this rule field is associated with and stipulates that if a value is provided for this rule field, then the value must be equal to the value provided for the associated rule field.
            This property is ignored if the "dataBound" property is set to true.
          type: string
        notEqual:
          description: |
            This property specifies the ID of another rule field that this rule field is associated with and stipulates that if a value is provided for this rule field, then the value must NOT be equal to the value provided for the associated rule field.
            This property is ignored if the "dataBound" property is set to true.
          type: string
        greaterThan:
          description: |
            This property specifies the ID of another rule field that this rule field is associated with and stipulates that if a value is provided for this rule field, then the value must be greater than the value provided for the associated rule field.
            This property only applies to rule fields with argument type, Number.  It is ignored for rule fields with other argument types and if the "dataBound" property is set to true.
          type: string
        greaterThanOrEqual:
          description: |
            This property specifies the ID of another rule field that this rule field is associated with and stipulates that if a value is provided for this rule field, then the value must be greater than or equal to the value provided for the associated rule field.
            This property only applies to rule fields with argument type, Number.  It is ignored for rule fields with other argument types and if the "dataBound" property is set to true.
          type: string
        lessThan:
          description: |
            This property specifies the ID of another rule field that this rule field is associated with and stipulates that if a value is provided for this rule field, then the value must be less than the value provided for the associated rule field.
            This property only applies to rule fields with argument type, Number.  It is ignored for rule fields with other argument types and if the "dataBound" property is set to true.
          type: string
        lessThanOrEqual:
          description: |
            This property specifies the ID of another rule field that this rule field is associated with and stipulates that if a value is provided for this rule field, then the value must be less than or equal to the value provided for the associated rule field.
            This property only applies to rule fields with argument type, Number.  It is ignored for rule fields with other argument types and if the "dataBound" property is set to true.
          type: string
        typeDescriptor:
          description: A JSON object describing type metadata for this rule field.
          type: object
          allOf:
          - $ref: "#/components/schemas/typeDescriptor"
    ruleImplementation:
      title: Rule Implementation
      type: object
      description: The representation of a Rule Implementation.
      required:
      - domainId
      allOf:
      - $ref: "#/components/schemas/ruleField/allOf/0"
      properties:
        domainId:
          description: The ID of the rule implementation's execution domain.
          type: string
          format: uuid
        expression:
          description: |
            A templated unit of code that can be evaluated in the associated execution domain to return a value of true or false; the maximum length is 4000.
          type: string
    ruleParameter:
      title: Rule Parameter
      type: object
      description: The representation of a Rule Parameter. There must be a one to
        one mapping between rule parameters and rule fields in the referenced rule
        template.
      required:
      - fieldId
      allOf:
      - $ref: "#/components/schemas/ruleField/allOf/0"
      properties:
        fieldId:
          description: The ID of the rule template's rule field instance that this
            rule definition parameter applies to.
          type: string
          format: uuid
        label:
          description: The user-presented text to represent this rule parameter; the
            maximum length is 100.
          type: string
        value:
          description: |
            A JSON string describing an initial value for the rule parameter and its associated rule field.  This value is used for the parameter at code
            generation unless an override was provided and permitted. An example is [1, 3, 5].
          type: string
        properties:
          description: |
            A JSON string describing metadata associated with the rule parameter. The string can be used by a consuming application to improve its rendering of the rule parameter, perform validation of values for the rule parameter, and so on.
            The maximum length is 1000.
          type: object
          allOf:
          - title: Rule Parameter Properties
            type: object
            description: The representation of a Rule Parameter's properties.
            properties:
              typeDescriptor:
                description: A JSON object describing type metadata for this rule
                  parameter that could not be defined at the rule template level.
                type: object
                allOf:
                - $ref: "#/components/schemas/typeDescriptor"
    ruleTemplate:
      title: Rule Template
      description: "A rule template is a generalized representation of a Data Quality\
        \ Monitoring rule and is used to create a rule definition. A rule template\
        \ defines the different execution domains the rule supports, the implementation\
        \ of the rule within those domains, the rule fields utilized by the rule,\
        \ and the different data sources the rule targets."
      type: object
      allOf:
      - $ref: "#/components/schemas/tag/allOf/0"
      required:
      - name
      - implementations
      properties:
        name:
          description: The identity of this rule template; the maximum length is 200.
            Leading and trailing whitespace characters are not allowed.
          type: string
        summary:
          description: The summary for this rule template; the maximum length is 200.
          type: string
        description:
          description: The descriptive text for this rule template; the maximum length
            is 2000.
          type: string
        type:
          description: The type for this rule template; the maximum length is 100.
          type: string
        tags:
          type: array
          description: An array that contains all the tags associated with the rule
            template.
          items:
            type: string
        mode:
          description: "Represents whether a rule definition is applied to each row,\
            \ to a group of rows, or to the complete input table."
          type: string
          format: enumeration
          enum:
          - row
          - set
          - group
          default: row
        draft:
          description: A value to determine if the revision is a draft.
          type: boolean
        revisionNumber:
          description: The revision number of this current revision of the rule template.
          type: integer
        revisionUri:
          description: The URI of this current revision.
          type: string
        previousRevisionUri:
          description: The URI of the previous revision.
          type: string
        revisionId:
          description: The ID of this current revision.
          type: string
          format: uuid
        previousRevisionId:
          description: The ID of the previous revision.
          type: string
          format: uuid
        fields:
          type: array
          description: A list that contains rule field resources. Field names must
            be unique within the rule template.
          items:
            $ref: "#/components/schemas/ruleField"
        implementations:
          type: array
          description: A list that contains a rule implementation for each supported
            domain.
          items:
            $ref: "#/components/schemas/ruleImplementation"
        dataConnectorTargets:
          type: array
          description: An array that contains the list of supported data source connector
            targets for the rule. Each item is the URI of the supported data connector
            target.
          items:
            type: string
    ruleTemplateSummary:
      title: Rule Template Summary
      description: Summary information about a rule template.
      type: object
      allOf:
      - $ref: "#/components/schemas/tag/allOf/0"
      required:
      - name
      properties:
        name:
          description: The identity of this rule template; the maximum length is 200.
            Leading and trailing whitespace characters are not allowed.
          type: string
        summary:
          description: The summary for this rule template; the maximum length is 200.
          type: string
        description:
          description: The descriptive text for this rule template; the maximum length
            is 2000.
          type: string
        type:
          description: The type for this rule template; the maximum length is 100.
          type: string
        tags:
          type: array
          description: An array that contains all the tags associated with the rule
            template.
          items:
            type: string
        mode:
          description: "Represents whether a rule definition is applied to each row,\
            \ to a group of rows, or to the complete input table."
          type: string
          format: enumeration
          enum:
          - row
          - set
          - group
          default: row
        draft:
          description: A value to determine if the revision is a draft.
          type: boolean
        revisionNumber:
          description: The revision number of the current revision of a rule template.
          type: integer
        revisionUri:
          description: The URI of the current revision.
          type: string
        previousRevisionUri:
          description: The URI of the previous revision.
          type: string
        revisionId:
          description: The ID of this current revision.
          type: string
          format: uuid
        previousRevisionId:
          description: The ID of the previous revision.
          type: string
          format: uuid
    ruleTemplateCollection:
      title: Rule Template Collection
      description: A collection of rule templates.
      type: object
      allOf:
      - $ref: "#/components/schemas/domainCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains a collection of rule template representations.
            items:
              anyOf:
              - $ref: "#/components/schemas/ruleTemplate"
              - $ref: "#/components/schemas/ruleTemplateSummary"
    tag:
      title: Tag
      description: The representation of a tag.
      type: object
      required:
      - name
      allOf:
      - title: Abstract Object
        description: abstractObject supports modeling of other objects; it is never
          instantiated.
        properties:
          id:
            type: string
            description: The unique identity of this object. Immutable after creation.
          creationTimeStamp:
            type: string
            description: "The date and time this object was created in the format\
              \ of YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
            format: date-time
            readOnly: true
          modifiedTimeStamp:
            type: string
            description: "The date and time this object was last modified in the format\
              \ of YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
            format: date-time
            readOnly: true
          createdBy:
            type: string
            description: The identity that created this object. The value is ignored
              on input.
            readOnly: true
          modifiedBy:
            type: string
            description: The identity that modified this object. The value is ignored
              on input.
            readOnly: true
          version:
            type: integer
            description: The version of the media type.
          links:
            type: array
            description: The links that apply to the object. The value is ignored
              on input.
            items:
              $ref: "#/paths/~1/get/responses/200/content/application~1json/schema/properties/links/items"
            readOnly: true
      properties:
        name:
          description: "The name of the tag. The maximum length is 50 characters.\
            \ Tag names are not case sensitive for uniqueness, but the original case\
            \ is preserved."
          type: string
          maxLength: 50
    typeDescriptor:
      title: Type Descriptor
      description: A property that defines the argument type of a rule parameter or
        a rule field and its constraints.
      properties:
        type:
          description: "The ID of the argument type for this descriptor. If omitted,\
            \ it indicates the field or parameter accepts any argument type at this\
            \ type descriptor level."
          type: string
          format: uuid
        childDescriptors:
          description: "A list of child type descriptors. This is used when the argument\
            \ type is a complex type such as List or Dictionary, where the child descriptors\
            \ define the argument types of the elements in the List or the keys and\
            \ values in the Dictionary.  It is ignored for primitive types.  For a\
            \ Dictionary, the child type descriptor at index zero (0) of the list\
            \ defines the argument type for the keys, and the child type descriptor\
            \ at index one (1) of the list defines the argument type for the values.\
            \  For a List, the child descriptor at each index defines the argument\
            \ type for List elements at that same index.  If there are List elements\
            \ that lack a child type descriptor at the same index then the child type\
            \ descriptor with the highest index value is used to define the expected\
            \ argument type."
          type: array
          items:
            $ref: "#/components/schemas/typeDescriptor"
        allowedValues:
          description: "A list of allowed values for this argument type. If specified,\
            \ the value for an object of this argument type must match a value in\
            \ the list."
          type: array
        minimum:
          description: "A constraint specifying a lower bound for the length or value\
            \ for an object of this argument type.  For Character, this specifies\
            \ the maximum character length of the string.  For List and Dictionary,\
            \ this specifies the minimum number of elements in the collection.  For\
            \ Number this specifies the minimum value.  For other argument types this\
            \ constraint is ignored."
          type: integer
        maximum:
          description: "A constraint specifying an upper bound for the length or value\
            \ for an object of this argument type.  For Character, this specifies\
            \ the maximum character length of the string.  For List and Dictionary,\
            \ this specifies the maximum number of elements in the collection.  For\
            \ Number this specifies the maximum value.  For other argument types this\
            \ constraint is ignored."
          type: integer
        length:
          description: "A constraint specifying the exact length for an object of\
            \ this argument type.  For Character, this specifies the character length\
            \ of the string.  For List and Dictionary, this specifies the number of\
            \ elements in the collection.  For other argument types this constraint\
            \ is ignored."
          type: integer
