                        version: 1
                        name: ExpectColumnValuesToBeBetween
                        summary: ExpectColumnValuesToBeBetween
                        description: "The ExpectColumnValuesToBeBetween rule template\
                          \ expects column values to be between a specified minimum\
                          \ and maximum value. At least one bound must be provided.\
                          \ When only min_value is set, validates that values are\
                          \ greater than (or equal to) the minimum. When only max_value\
                          \ is set, validates that values are less than (or equal\
                          \ to) the maximum."
                        type: column values between
                        revisionNumber: 1
                        draft: false
                        revisionUri: /dataQualityMonitoring/ruleTemplates/4608b8ec-101f-4121-a443-ba117b9b0dab/revisions/2d985707-4dd8-40d7-988a-9138562f8e2d
