        content:
          application/vnd.sas.data.quality.rule.definition+json:
            schema:
              $ref: "#/paths/~1ruleDefinitions/post/requestBody/content/application~1json/schema"
            examples:
              Rule Definition:
                $ref: "#/paths/~1ruleDefinitions/post/requestBody/content/application~1json/examples/Rule%20Definition"
          application/json:
            schema:
              title: Rule Definition Creation Request
              description: "A rule definition defines the execution domains that the\
                \ rule supports, the implementation of the rule in those domains,\
                \ the rule fields used, and the different data sources that the rule\
                \ targets."
              type: object
              required:
              - name
              - templateRevisionUri
              properties:
                version:
                  type: integer
                  description: The version of the media type.
                name:
                  description: The identity of this rule definition. The maximum length
                    is 100. Leading and trailing whitespace characters are not allowed.
                  type: string
                description:
                  description: The descriptive text for this rule definition. The
                    maximum length is 1000.
                  type: string
                tags:
                  type: array
                  description: An array that contains all the tags to be associated
                    with the rule definition.
                  items:
                    type: string
                templateRevisionUri:
                  description: |
                    The URI of the rule template revision that this definition is linked to. When creating multiple revisions for a rule definition, all revisions must reference the same rule template. However, they can reference different revisions of the rule template.
                    Attempts to create a new rule definition revision that references a different rule template result in a HTTP Status 409.
                  type: string
                parameters:
                  type: array
                  description: A list that contains rule parameter resources.
                  items:
                    $ref: "#/components/schemas/ruleParameter"
