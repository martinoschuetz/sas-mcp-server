  /code:
    post:
      x-sas-internal: true
      operationId: codeGenerationRequest
      summary: Generate code
      description: |
        Given a list of rule definition revisions and their execution bindings, generate and return the code for execution in the specified domain.
      tags:
      - Code
      parameters:
      - name: Content-Type
        description: |
          The item representation for the supplied code generation request.
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/vnd.sas.data.quality.code.generation.request+json
          - application/json
          default: application/vnd.sas.data.quality.code.generation.request+json
      - name: Accept
        description: |
          The desired item representation for the returned generated code.
        in: header
        required: true
        schema:
          type: string
          enum:
          - text/plain
          default: text/plain
      requestBody:
        content:
          application/vnd.sas.data.quality.code.generation.request+json:
            schema:
              $ref: "#/components/schemas/codeGenerationRequest"
            examples:
              Code Generation Request:
                $ref: "#/paths/~1code/post/requestBody/content/application~1json/examples/Code%20Generation%20Request"
          application/json:
            schema:
              $ref: "#/components/schemas/codeGenerationRequest"
            examples:
              Code Generation Request:
                summary: A code generation request
                description: A rule definition's code generation request.
                value:
                  domainId: 14f7ac7e-37d8-4744-b4c7-5544bc52a19d
                  inputTable: input_table
                  outputTable: output_table
                  columnPassthroughMode: specified
                  passthroughColumns:
                  - input_column1
                  - input_column2
                  - input_column4
                  rules:
                  - definitionRevisionUri: /dataQualityMonitoring/ruleDefinitions/787bffc3-6dc9-41f0-b59d-92ae77ed259e/revisions/93e3c00d-443f-4d84-9d4a-2a0cc2af7869
                    parameterBindings:
                    - parameterId: 8cb6f007-378b-4a7a-9da5-b8822e67b970
                      bindingType: column_mapping
                      columnName: input_column1
                    - parameterId: a0d41a20-49f1-4e62-a600-2b5814e44a58
                      bindingType: column_mapping
                      columnName: input_column2
                    resultColumn: output_column1
                  - definitionRevisionUri: /dataQualityMonitoring/ruleDefinitions/32a39acc-91fc-4102-8f76-49fec5a15a4a/revisions/ea05a26a-abb3-40d5-830a-69db4638d6f6
                    parameterBindings:
                    - parameterId: bec63780-1251-4fc1-82d6-31d290a33f61
                      bindingType: column_mapping
                      columnName: input_column2
                    resultColumn: output_column2
                  saveSummary: true
                  summaryTable: summary_table
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
            Location:
              description: The location of the created object.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the object.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
                description: Generated code as plain text.
              examples:
                Generated Code:
                  value: The generated SAS code
        "400":
          $ref: "#/paths/~1tags/get/responses/400"
        "403":
          $ref: "#/paths/~1tags/get/responses/403"
        "404":
          description: The specified resource was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/paths/~1/get/responses/404/content/application~1vnd.sas.error%2Bjson/schema"
              examples:
                Error - Not Found:
                  summary: Error - Not Found
                  description: The specified resource was not found.
                  value:
                    version: 2
                    httpStatusCode: 404
                    message: Not Found
                    details: No object was found with the ID "2b647d99-60f4-4252-adea-8ea2bd35974c".
  /code/results:
    post:
      x-sas-internal: true
      operationId: saveExecutionResults
      summary: Save execution results
      description: |
        Store a copy of a summary results table and information about the code execution that generated the table.
      tags:
      - Code
      parameters:
      - name: Content-Type
        description: |
          The item representation for the executed code.
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/vnd.sas.data.quality.code.results.summary.table+json
          - application/json
          default: application/vnd.sas.data.quality.code.results.summary.table+json
      requestBody:
        content:
          application/vnd.sas.data.quality.code.results.summary.table+json:
            schema:
              $ref: "#/paths/~1code~1results/post/requestBody/content/application~1json/schema"
            examples:
              Save Execution Results:
                $ref: "#/paths/~1code~1results/post/requestBody/content/application~1json/examples/Save%20Execution%20Results"
          application/json:
            schema:
              title: Save Execution Results
              description: Store a copy of a summary results table and information
                about the code execution that generated the table.
              required:
              - executionStartTime
              - executionEndTime
              - rules
              - inputTable
              - numRecordsProcessed
              properties:
                executionStartTime:
                  description: The date and time the code execution instance began.
                  type: string
                  format: date-time
                executionEndTime:
                  description: The date and time the code execution instance completed.
                  type: string
                  format: date-time
                rules:
                  description: List of the Rule Definition Revisions which were executed
                    and the summary results for each rule.
                  type: array
                  items:
                    type: object
                    required:
                    - definitionRevisionUri
                    - numExceptions
                    properties:
                      definitionRevisionUri:
                        description: The revision of the rule definition whose generated
                          code was run as part of the code execution instance.
                        type: string
                      numExceptions:
                        description: The number of exceptions encountered for this
                          rule definition revision during the code execution.
                        type: integer
                inputTable:
                  description: Name of the table that was the input for the executed
                    code.
                  type: string
                numRecordsProcessed:
                  description: The total number of records/rows processed by the executed
                    code.
                  type: integer
            examples:
              Save Execution Results:
