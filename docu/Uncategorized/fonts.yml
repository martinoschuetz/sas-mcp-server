components:
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error:
      $ref: "#/components/schemas/error2"
    baseCollection:
      $ref: "#/components/schemas/baseCollection2"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    font:
      title: Font
      description: The representation of a font.
      required:
      - id
      properties:
        id:
          type: string
          description: The unique identifier for the font.
        name:
          type: string
          description: Full font name
        description:
          type: string
          description: Font description
        family:
          type: string
          description: Font family name
        subfamilyName:
          type: string
          description: Distinguishes the fonts in a group with the same Font Family
            name
        typographicFamilyName:
          type: string
          description: Preferred family name
        typographicSubfamilyName:
          type: string
          description: Subfamily name within the typographic family grouping
        postScriptName:
          type: string
          description: PostScript CID findfont name
        format:
          type: string
          description: Font format - 'ttf' or 'ttc' or 'woff'
        style:
          type: string
          description: Font style - 'normal' or 'italic'
        weight:
          type: string
          description: Font weight - 'regular', 'bold'
        fontVersion:
          type: string
          description: The Font version
        panose:
          type: string
          description: The panose Typeface Classification Number
        usWeightClass:
          type: integer
          description: Indicates the visual weight of the characters in the font
        usWidthClass:
          type: integer
          description: Indicates a relative change from the normal aspect ratio for
            the glyphs in a font
        sasSystemFont:
          type: boolean
          description: Flag to identify the SAS system font
        private:
          type: boolean
          description: Flag marking this font as private or internal font for SAS
            when set
        fileId:
          type: string
          description: The id for font file
        index:
          type: integer
          description: The font index number for a font residing in a TrueType collection
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          default: 1
        links:
          description: The links that apply to the font
          type: array
          items:
            $ref: "#/components/schemas/link"
    fontFile:
      title: Font file
      description: The font file contains information specific to the font file such
        at a unique id, time stamps, length, names of fonts contained in the file,
        and a uri for the file. The font file can be used to get metadata information
        about the file or get the font contents using the file id and content link.
      required:
      - id
      properties:
        id:
          type: string
          description: The unique identifier for the font file
        length:
          type: integer
          description: The compressed length of the font file contents
        totalLength:
          type: integer
          description: The uncompressed length of the font file contents
        format:
          type: string
          description: Font format - 'ttf' or 'ttc' or 'woff'
        uri:
          type: string
          description: The original URI from where the font was loaded
        sasSystemFont:
          type: boolean
          description: Flag to identify the SAS system font
        private:
          type: boolean
          description: Flag marking this font as private or internal font for SAS
            when set
        createdBy:
          type: string
          description: The user who created the font.
        modifiedBy:
          type: string
          description: The user who most recently modified the font.
        creationTimeStamp:
          type: string
          description: The time stamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            font was created
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The time stamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            font was last modified
          format: date-time
        fontNames:
          description: The font names that are contained in the font file
          type: array
          items:
            type: string
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
          default: 1
        links:
          description: The links that apply to the font.
          type: array
          items:
            $ref: '#/components/schemas/link'
    fontFamily:
      title: Font Family
      description: The font family name of a font
      properties:
        family:
          type: string
          description: Font family name
        symbolFont:
          type: boolean
          description: Indicates a font is a symbol font when true.
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 2.
          default: 2
    fontCollection:
      description: A collection of font representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/font"
            description: The array of application/vnd.sas.font representations.
          version:
            type: integer
            description: This media type's schema version number. This representation
              is version 2.
            default: 2
      title: Font Collection
    fileCollection:
      description: A collection of font file representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/fontFile"
            description: The array of application/vnd.sas.font.file representations.
          version:
            type: integer
            description: This media type's schema version number. This representation
              is version 2.
            default: 2
      title: File Collection
    fontFamilyCollection:
      description: A collection of font family representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/fontFamily"
            description: The array of application/vnd.sas.font.family representations.
          version:
            type: integer
            description: This media type's schema version number. This representation
              is version 2.
            default: 2
      title: Font Family Collection
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
