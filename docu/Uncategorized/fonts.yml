---
openapi: 3.0.3
info:
  version: "3"
  title: Fonts
  description: The Fonts Service API provides the means to store and retrieve font
    content and the metadata associated with it. The metadata includes font names,
    font attributes, and locations of the font content.
  termsOfService: 'https://www.sas.com/en_us/legal/copyright.html'
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: http://example.com/fonts
  description: This is an example base URL.
tags:
- name: Root
  description: The API root.
- name: Files
  description: Operations for font files.
- name: File
  description: Operations for font file.
- name: Fonts
  description: Operations for font collections.
- name: Font
  description: Operations for font resources.
x-sas-traits:
  resources:
  - name: font
    description: A font:content and metadata describing a typeface composed of glyphs
      of a particular weight and style.
    pluralName: fonts
    mediaTypes:
    - application/vnd.sas.font
    - application/vnd.sas.font.file
    - application/vnd.sas.font.family
paths:
  /:
    head:
      tags:
      - Root
      summary: Get the headers associated with the top-level resources and operations
        in the service
      description: >
        For more details on the returned top-level resources, see <a
        href="#RootLinkRelations">Root Link Relations table</a>.
      operationId: headersForRoot
      responses:
        "200":
          description: OK. The service's links are returned.
          headers:
            Content-Type:
              description: application/vnd.sas.api+json;version=1
              schema:
                $ref: '#/components/schemas/api'
    get:
      tags:
      - Root
      summary: Get the links to the top-level resources and operations
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: OK. The service's links are returned.
          headers:
            Content-Type:
              description: application/vnd.sas.api+json;version=1
              schema:
                $ref: '#/components/schemas/api'
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                json:
                  $ref: "#/components/examples/responseGetRootAdmin"
                json1:
                  $ref: "#/components/examples/responseGetRoot"
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                json:
                  $ref: "#/components/examples/responseGetRootAdmin"
                json1:
                  $ref: "#/components/examples/responseGetRoot"
  /files:
    get:
      summary: Get a collection of font files
      description: Returns a collection of font files based on the specified pagination,
        filtering, and sorting options.<br>The media type of the returned collection
        items is `application/vnd.sas.font.file+json`.
      operationId: getFiles
      tags:
      - Files
      parameters:
      - name: Accept-Item
        description: This is an optional header. If not present then items of type
          application/vnd.sas.font.file+json;version=1 are returned.
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.font.file;version=1
          - application/vnd.sas.font.file
          - application/json
          default: application/vnd.sas.font.file;version=1
      - name: start
        in: query
        description: The index of the first files to return.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: The maximum number of files to return.
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the font files. See [Filtering in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the files. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                type: string
            Content-Item-Type:
              description: application/vnd.sas.font.file+json;version=1
              schema:
                type: string
          description: OK. The request succeeded.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/fileCollection"
              examples:
                json:
                  $ref: "#/components/examples/responseGetFiles"
            application/json:
              schema:
                $ref: "#/components/schemas/fileCollection"
              examples:
                json:
                  $ref: "#/components/examples/responseGetFiles"
        "400":
          description: Bad Request. Unsupported filter function or invalid filter
            argument.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetFilesBadRequest"
    head:
      summary: Get headers for the collection of font files
      description: Returns headers for the collection of font files.<br>The media
        type of the returned collection items is `application/vnd.sas.font.file+json`.
      operationId: headersForFiles
      tags:
      - Files
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: This is an optional header. If not present then items of type
          application/vnd.sas.font.file+json;version=1 are returned.
        schema:
          type: string
          enum:
          - application/vnd.sas.font.file;version=1
          - application/vnd.sas.font.file
          - application/json
          default: application/vnd.sas.font.file;version=1
      - name: start
        in: query
        description: The index of the first files to return.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: The maximum number of files to return.
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the font files. See [Filtering in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the files. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK. The request succeeded.
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                $ref: '#/components/schemas/fileCollection'
            Content-Item-Type:
              description: application/vnd.sas.font.file+json;version=1
              schema:
                type: string
        "400":
          description: Bad Request. The request was invalid.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
    post:
      summary: Add a new font file and create one or more fonts from the given font
        file
      description: Creates a new file based on the user provided URL. <p> <b>Authorization:</b>
        Administrators only, on the provider tenant only </p>
      operationId: createFontUrl
      tags:
      - Files
      parameters:
      - name: uri
        in: query
        description: Font file location
        required: true
        schema:
          type: string
      - name: overwrite
        in: query
        description: Flag to indicate whether to overwrite an older version of the
          font, if found, with the one provided.
        required: false
        schema:
          type: string
          default: 'false'
      responses:
        "201":
          description: Created. A font file was created.
          headers:
            Content-Type:
              description: application/vnd.sas.font.file+json;version=1
              schema:
                type: string
            Location:
              description: The URL of the font file.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the font file.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the font was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.font.file+json;version=1:
              schema:
                $ref: "#/components/schemas/fontFile"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFile"
            application/vnd.sas.font.file+json:
              schema:
                $ref: "#/components/schemas/fontFile"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFile"
            application/json:
              schema:
                $ref: "#/components/schemas/fontFile"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFile"
        "400":
          description: Bad Request. The request body was missing or invalid.<br> URL
            is empty.<br> URL is too long.<br> URL contains an invalid character -
            /, \\, \#, and ? are not allowed.<br> URL is invalid.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFileBadRequest"
        "403":
          description: Forbidden. The action can be performed only on the provider
            tenant.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFileForbidden"
        "409":
          description: Older version of the font or file was found.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFileConflict"
  /files#octet:
    post:
      summary: Add a new font file and create one or more fonts from the given font
        file
      description: Creates a new font file based on the representation in the request
        body. <p> <b>Authorization:</b> Administrators only, on the provider tenant
        only </p>
      operationId: createFont
      tags:
      - Files
      parameters:
      - name: overwrite
        in: query
        description: Flag to indicate whether to overwrite an older version of the
          font, if found, with the one provided.
        required: false
        schema:
          type: string
          default: 'false'
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: object
              format: binary
            example:
              value: <Bytes go here>
        description: The binary representation of a font.
        required: true
      responses:
        "201":
          description: Created. A font file was created.
          headers:
            Content-Type:
              description: application/vnd.sas.font.file+json;version=1
              schema:
                type: string
            Location:
              description: The URL of the font file.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the font file.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the font was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.font.file+json;version=1:
              schema:
                $ref: "#/components/schemas/fontFile"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFile"
            application/vnd.sas.font.file+json:
              schema:
                $ref: "#/components/schemas/fontFile"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFile"
            application/json:
              schema:
                $ref: "#/components/schemas/fontFile"
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFile"
        "400":
          description: Bad Request. The request body was missing or invalid.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFileBadRequest"
        "403":
          description: Forbidden. The action can be performed only on the provider
            tenant.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFileForbidden"
        "409":
          description: Older version of the font or file was found.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseCreateFileConflictOlderVersion"
  "/files/{fileId}":
    get:
      parameters:
      - name: fileId
        in: path
        required: true
        description: The unique identifier for the font file.
        schema:
          type: string
      summary: Get a font file
      description: Returns the representation of the specified font file.
      operationId: getFile
      tags:
      - File
      responses:
        "200":
          description: OK. The request succeeded.
          headers:
            Content-Type:
              description: application/vnd.sas.font.file+json;version=1
              schema:
                type: string
            Location:
              description: The URL of the font file.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the font file.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the font was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.font.file+json;version=1:
              schema:
                $ref: "#/components/schemas/fontFile"
              examples:
                json:
                  $ref: "#/components/examples/responseGetFontFile"
            application/vnd.sas.font.file+json:
              schema:
                $ref: "#/components/schemas/fontFile"
              examples:
                json:
                  $ref: "#/components/examples/responseGetFontFile"
            application/json:
              schema:
                $ref: "#/components/schemas/fontFile"
              examples:
                json:
                  $ref: "#/components/examples/responseGetFontFile"
        "404":
          description: Not Found. No font file exists at the requested path.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseGetFontFileNotFound"
    head:
      parameters:
      - name: fileId
        in: path
        required: true
        description: The unique identifier for the font file.
        schema:
          type: string
      summary: Get the font file headers
      description: Returns the headers for the representation of the specified font
        file.
      operationId: headersForFile
      tags:
      - File
      responses:
        "200":
          description: OK. The request succeeded.
          headers:
            Content-Type:
              description: application/vnd.sas.font.file+json;version=1
              schema:
                type: string
            Location:
              description: The URL of the font file.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the font file.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the font was last modified.
              schema:
                type: string
        "404":
          description: Not Found. No font file exists at the requested path.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
    delete:
      summary: Delete a font file
      description: Deletes the specified font file and the associated fonts. <p> <b>Authorization:</b>
        Administrators only, on the provider tenant only </p>
      operationId: deleteFile
      tags:
      - File
      parameters:
      - name: fileId
        in: path
        description: The unique identifier for the font file.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted. The font file was deleted.
        "403":
          description: Forbidden. The action can be performed only on the provider
            tenant.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteFileForbidden"
        "404":
          description: Not Found. No file exists at the requested path.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseDeleteFontFileNotFound"
  "/files/{fileId}/content":
    get:
      summary: Get font content
      description: Returns the font content, including ETag.
      operationId: getContent
      tags:
      - File
      parameters:
      - name: fileId
        in: path
        description: The unique identifier for the font to get content.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK. The request succeeded.
          headers:
            Content-Type:
              description: application/octet-stream
              schema:
                type: string
            Location:
              description: The URL of the font file.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the font content.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the font was last modified.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: byte
              example: U3BlYWtlYXN5IG1ha2VzIHdvcmtpbmcgd2l0aCBBUElzIGZ1biE=
        "404":
          description: Not Found. No font content exists at the requested path.
          content:
            "*/*":
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responseGetFontContentNotFound"
    head:
      summary: Return the headers for the font file content
      description: Return the headers for the font file content, including ETag.
      operationId: headersForFileContent
      tags:
      - File
      parameters:
      - name: fileId
        in: path
        description: The unique identifier for the font file used to get content.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK. The request succeeded.
          headers:
            Content-Type:
              description: application/octet-stream
              schema:
                type: string
            Location:
              description: The URL of the font file.
              schema:
                type: string
                format: uri
            ETag:
              description: The entity tag for the font file.
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the font file was last modified.
              schema:
                type: string
        "404":
          description: Not Found. The font content is not present.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
  /fonts:
    get:
      summary: Get a collection of fonts
      description: Returns a collection of fonts as font representations based on
        the specified pagination, filtering, and sorting options.<br>The media type
        of the returned collection items is `application/vnd.sas.font+json`.
      operationId: getFonts
      tags:
      - Fonts
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: This is an optional header. If not present then items of type
          application/vnd.sas.font+json;version=1 are returned.
        schema:
          type: string
          enum:
          - application/vnd.sas.font;version=1
          - application/vnd.sas.font
          - application/json
          default: application/vnd.sas.font;version=1
      - name: start
        in: query
        description: The index of the first font to return.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: The maximum number of fonts to return.
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the fonts. See [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the fonts. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK. The request succeeded.
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                $ref: '#/components/schemas/fontCollection'
            Content-Item-Type:
              description: application/vnd.sas.font+json;version=1
              schema:
                type: string
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/fontCollection"
              examples:
                json:
                  $ref: "#/components/examples/responseGetFonts"
            application/json:
              schema:
                $ref: "#/components/schemas/fontCollection"
              examples:
                json:
                  $ref: "#/components/examples/responseGetFonts"
        "400":
          description: Bad Request. Unsupported filter function or Invalid filter
            argument.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                json:
                  $ref: "#/components/examples/responseGetFontsBadRequest"
    head:
      summary: Get headers for a collection of fonts
      description: Returns a collection of of fonts as font representations based
        on the specified pagination, filtering, and sorting options.<br>The media
        type of the returned collection items is `application/vnd.sas.font+json`.
      operationId: headersForFonts
      tags:
      - Fonts
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: This is an optional header. If not present then items of type
          application/vnd.sas.font+json;version=1 are returned.
        schema:
          type: string
          enum:
          - application/vnd.sas.font;version=1
          - application/vnd.sas.font
          - application/json
          default: application/vnd.sas.font;version=1
      - name: start
        in: query
        description: The index of the first font to return.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: The maximum number of fonts to return.
        schema:
          type: integer
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the fonts. See [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the fonts. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          headers:
            Content-Type:
              description: application/vnd.sas.collection+json;version=2
              schema:
                $ref: '#/components/schemas/fontCollection'
            Content-Item-Type:
              description: application/vnd.sas.font+json;version=1
              schema:
                type: string
          description: OK. The request succeeded.
        "400":
          description: Bad Request. The request was invalid.
          headers:
            Content-Type:
              description: application/vnd.sas.error+json;version=2
              schema:
                type: string
  /families:
    get:
      summary: Get a collection of font families
      description: Returns a collection of font family objects based on the specified
        pagination, filtering, and sorting options.<br>The media type of the returned
        collection items is `application/vnd.sas.font.family+json`.
      operationId: getFontFamilies
      tags:
      - Fonts
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: This is an optional header. If not present then items of type
          application/vnd.sas.font.family+json;version=2 are returned.
