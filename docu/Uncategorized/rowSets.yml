  schemas:
    row:
      title: Row
      type: object
      description: Representation of a row summary object.
      properties:
        cells:
          type: array
          description: The cells for this row. Values can be number, integer, null,
            boolean, or string.
          items: {}
        version:
          type: integer
          description: The row schema version.
        links:
          type: array
          description: The links that apply to this resource.
          items:
            $ref: "#/components/schemas/link"
    rowCollection:
      title: Row Collection
      type: object
      description: A pageable collection of row resources.
      properties:
        name:
          type: string
          description: The name of the collection "rows" in the context of the request.
        start:
          type: integer
          description: The 0-based index of the result candidates to start returning.
        limit:
          type: integer
          description: The maximum number of results requested.
        count:
          type: integer
          description: The number of results returned in the collection.
        accept:
          type: string
          description: A space-separated list of link types of the items in this collection.
        links:
          type: array
          description: Paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
        items:
          type: array
          description: The results of a query.
          items:
            $ref: "#/components/schemas/row"
        version:
          type: integer
          description: The collection schema version.
    rowSet:
      title: Row Set
      type: object
      description: A paginated collection of rows and the columns in the cells of
        the row.
      properties:
        columnDetail:
          type: string
          description: The level of detail of the columns array member. This value
            is set by the columnDetail query parameter. The value defaults to summary
            when none is provided.
          enum:
          - summary
          - detail
          - names
        start:
          type: integer
          description: The 0-based index of the rows candidates to start returning.
        limit:
          type: integer
          description: The maximum number of rows requested.
        count:
          type: integer
          description: The actual number of rows returned in the collection.
        columnCount:
          type: integer
          description: The number of columns in the collection. Can be omitted if
            the count is not known.
        columnStart:
          type: integer
          description: The index of the first column in the columns member, 0-based.
            Defaults to 0. Omitted if the includeColumns query parameter is set.
        columnLimit:
          type: integer
          description: The number of columns to return in each page. Defaults to 25.
            Omitted if the includeColumns query parameter is set.
        links:
          type: array
          description: Paging links that apply to this object.
          items:
            $ref: "#/components/schemas/link"
        rows:
          type: array
          description: The results of this query as an array containing arrays of
            heterogeneous data.
          items:
            type: array
            items:
              type: string
        columns:
          type: array
          description: |
            The rows' corresponding columns. The type of items in this array is determined by the columnDetail query parameter's value, which can be one of the following:
            - summary - The default if no value is specified. Contains application/vnd.sas.data.column.summary objects.
            - detail - Contains application/vnd.sas.data.column objects.
            - names - Contains the column names as JSON strings.
          items:
            type: string
        version:
          type: integer
          description: Collection schema version.
    where:
      title: WHERE Clause
      type: string
      description: |
        The WHERE clause to pass through to the underlying data service.
        This acts as a filter on the provided data.
        example:  Make='Honda'.
    api:
      description: A list of links to top level resources available from the root
        of the API.
      properties:
        links:
          description: The API's top-level links.
          items:
            $ref: "#/components/schemas/link"
          type: array
        version:
          description: The version number of the API representation. This is version
            1.
          minimum: 1
          type: integer
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
