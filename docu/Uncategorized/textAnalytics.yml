---
openapi: 3.0.3
info:
  description: |-
    The text-analytics API is a mid-tier API for SAS Visual Text Analytics (VTA).  It is defined as a provider to the Analytics Gateway API.  The main purpose of this API is to provide customized VTA-specific capabilities to the core CAP framework by customizing certain HATEOS requests that are sent to /analyticsGateway.  This is done by the API registering 'Capabilities' with the CAP gateway.
    Additionally, this API provides aggregate endpoints for specific VTA functions.  Since this API is the only VTA mid-tier API to have a full overview of all the VTA provided mid-tier APIs, endpoints that need to make multiple API calls are defined here. A couple of examples are the endpoints for testing and validating concepts and categories.
  version: '4'
  title: Text Analytics
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
tags:
- name: Project
  description: Project.
- name: Root
  description: Root.
- name: JobExecution
  description: Job Execution.
- name: Enumerations
  description: Enumerations.
- name: Language
  description: Language.
- name: ProviderDetails
  description: Provider Details.
paths:
