  description: This is a sample base URL.
components:
  schemas:
    scorecodePackage:
      description: A zip file containing the scorecode and model.
      type: object
    metadataCollection:
      title: Metadata collection
      description: A collection of metadata objects.
      x-sas-media-type: application/vnd.sas.collection+json;version=1
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/metadata'
            description: |
              The array of `application/vnd.sas.text.project.metadata` representations.
          projectId:
            type: string
            description: The ID of the project in which this metadata collection belongs
    metadata:
      title: Metadata
      x-sas-media-type: application/vnd.sas.text.project.metadata+json;version=1
      type: object
      description: metadata values
      required:
      - projectId
      - key
      - value
      - version
      properties:
        version:
          type: integer
          description: The version number of the representation schema. This is version
            1.
          minimum: 1
        projectId:
          type: string
          description: ID of the project
        componentId:
          type: string
          description: ID of the component
        key:
          type: string
          description: The metadata key
        value:
          type: string
          description: The value of the metadata
        id:
          type: string
          description: |
            A unique, system-generated ID for the metadata.
        creationTimeStamp:
          type: string
          description: |
            The date when the metadata was created.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: |
            The date when the metadata was last updated.
          format: date-time
        createdBy:
          type: string
          description: |
            The ID of the user that created the metadata.
        modifiedBy:
          type: string
          description: |
            The ID of the user that last updated the metadata.
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
    categoryTestResults:
      description: The results of testing a category against sample text.
      title: Category test results
      x-sas-media-type: application/vnd.sas.text.analytics.category.test.results+json;version=1
      type: object
      properties:
        version:
          type: integer
          description: The version number of the representation schema. This is version
            1.
          minimum: 1
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
        results:
          type: object
          description: results containing the output of the testing the category against
            sample text.
          properties:
            categoryResults:
              $ref: '#/components/schemas/categorizationJobResult'
    conceptTestResults:
      description: The results of testing a concept against sample text.
      title: Concept test results
      x-sas-media-type: application/vnd.sas.text.analytics.concept.test.results+json;version=1
      type: object
      properties:
        version:
          type: integer
          description: The version number of the representation schema. This is version
            1.
          minimum: 1
        matches:
          $ref: '#/components/schemas/conceptResult'
        factMatches:
          $ref: '#/components/schemas/factResult'
    conceptResult:
      title: Concept Result
