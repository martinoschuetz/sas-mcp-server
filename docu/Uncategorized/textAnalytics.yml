  '/projects/{projectId}/pipelines/{pipelineId}/components/{componentId}/scoreCode':
    get:
      tags:
      - Project
      summary: Generates the score code for the specified component of the specified
        pipeline
      description: |
        Generates the score code for the specified component of the specified pipeline.Score code enables user to deploy models to automate the process of labeling a set of input documents into their respective concepts, categories, topics, and sentiment.  This end point enables user to download score code. When a user downloads score code from a component (concept, category, topic, sentiment) of the pipeline, the resulting ZIP file  contains two entries,  SAS score code for the component: This code can be used to score an external CAS table within a SAS Viya environment (for example, in SAS Studio). A copy of the model created within the component- The model can be used to score external SAS data sets within a SAS 9.4 environment. The models created in SAS Visual Text Analytics 8.2 are compatible with SAS 9.4M5 or higher.
      operationId: getScoreCode
      parameters:
      - name: projectId
        in: path
        description: ID of the text project
        required: true
        schema:
          type: string
      - name: pipelineId
        in: path
        description: ID of the pipeline
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: ID of the component in the specified pipeline
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded. Score code was generated and downloaded
            as a zip file successfully.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/scorecodePackage'
              examples:
                example-1:
                  value: {}
        '400':
          description: The request was invalid.
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                example-1:
                  value:
                    message: string
                    id: string
                    errorCode: 0
                    httpStatusCode: 0
                    details:
                    - string
                    remediation: string
                    errors:
                    - {}
                    links:
                    - method: string
                      rel: string
                      uri: string
                      href: string
                      title: string
                      type: string
                      itemType: string
                      responseType: string
                      responseItemType: string
                    version: 0
  '/projects/{projectId}/pipelines/{pipelineId}/components/{componentId}/aStoreScoreCode':
    get:
      tags:
      - Project
      summary: Generates the score code for the specified component of the specified
        pipeline
      description: 'Generates the score code for the specified component of the specified
        pipeline. Score code enables user to deploy models to automate the process
        of labeling a set of input documents into their respective concepts, categories,
        topics, and sentiment. When a user downloads score code from a component (concept,
        category, topic, sentiment) of the pipeline, the resulting ZIP file contains
        two entries. The first is the SAS score code for the component which can be
        used to score an external CAS table within a SAS Viya environment (for example,
        in SAS Studio). The second is a copy of the model created within the component.
        The model can be used to score external SAS data sets within a SAS 9.4 environment.
        The models created in SAS Visual Text Analytics 8.2 are compatible with SAS
        9.4M5 or higher.'
      operationId: getAstoreScoreCode
      parameters:
      - name: projectId
        in: path
        description: ID of the text project
        required: true
        schema:
          type: string
      - name: pipelineId
        in: path
        description: ID of the pipeline
        required: true
        schema:
          type: string
      - name: componentId
        in: path
        description: ID of the component in the specified pipeline
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded. Score code was generated and downloaded
            as a zip file successfully.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/scorecodePackage'
              examples:
                example-1:
                  value: {}
        '400':
          description: The request was invalid.
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                example-1:
                  value:
                    message: string
                    id: string
                    errorCode: 0
                    httpStatusCode: 0
