---
openapi: 3.0.3
info:
  title: Detection
  description: |
    The SAS Detection API provides an entry point for customers with ION messages to apply a
    SAS Decisioning Architecture ecosystem decision to an incoming message and return results.
  version: '1'
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  termsOfService: 'http://www.sas.com/en_us/legal/copyright.html'
servers:
- url: http://example.com/detection
  description: This is a sample base URL.
security: [{}]
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Decision
  description: Contains the operations for the decision resource.
- name: Health
  description: Contains the health status of dependent resources.
- name: Metrics
  description: Contains the metrics that are gathered with Prometheus.
- name: Rule Metrics
  description: Contains the rule metrics stored in Redis.
- name: Validate
  description: Contains the operations to validate a message.
- name: Generate
  description: Contains the operations to generate various formats from a variety
    of inputs.
- name: Verbose
  description: Contains the operations to retriever and set the verboseness level
    for a given deployment package.
- name: Settings
  description: Contains the operations for retrieving the SAS Detection Engine environment
    variable settings.
- name: Restart
  description: Contains the operations that enable you to restart the Kubernetes SAS
    Container Runtime pod via a REST call.
- name: Stats
  description: Contains the operations for retrieving statistics relative to the running
    system.
- name: Mapping
  description: Contains the operations that are used to interact with the mapping
    from where SAS Detection Engine references message content, to where it is found
    in the actual ION message. Use this endpoint only with the guidance of your administration
    and technical support.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level resources surfaced through
        this API.
      responses:
        '200':
          description: The request succeeded.
          headers:
            Etag:
              $ref: '#/components/headers/etagHeader'
            Last-Modified:
              $ref: '#/components/headers/lastModifiedHeader'
            Location:
              $ref: '#/components/headers/locationHeader'
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/detection_root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/detection_root"
        '404':
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/badRequestErrorResponse"
  /decision/execute:
    post:
      summary: Execute a decision
      description: Executes the decision that resides in the same SAS Container Runtime
        (SCR) pod.
      operationId: createExecutedDecision
      tags:
      - Decision
      parameters:
      - name: debug
        in: query
        required: false
        schema:
          type: string
        description: 'If true, then the body returned contains the processed transaction
          and other information about the processing.'
      requestBody:
        required: true
        content:
          application/vnd.sas.detection.message.schema_name+ion:
            example:
              $ref: "#/components/examples/incoming_ion"
          application/json:
            example:
              $ref: "#/components/examples/incoming_json"
        description: 'ION binary format data, representing customer data, that will
          be augmented with results of running a decision.'
      responses:
        '200':
          description: The request succeeded. The incoming ION message was processed.
          content:
            application/json:
              examples:
                json:
                  $ref: "#/components/examples/execute_200_json"
            application/ion:
              examples:
                json:
                  $ref: "#/components/examples/execute_200_ion"
        '400':
          description: A problem exists in the incoming ION message
          content:
            text/plain:
              example: "{message:{sas:{system:{returnDesc:'BORG',returnDetails:{Reason:'Message\
                \ Classification provided does not match valid choices.  Please update\
                \ messageClassificationName in the provided ION.',ValidOrganizations:['Bank_A','North_America','Europe']},returnType:8}}}}"
        '404':
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/badRequestErrorResponse"
  /decision/description:
