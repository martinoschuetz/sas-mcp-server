      responses:
        '200':
          description: The request succeeded. The rule metrics were retrieved.
          headers:
            Content-Type:
              description: The media type of the response collection.
              schema:
                type: string
            Last-Modified:
              description: The time at which this object was last modified.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/json:
              schema:
