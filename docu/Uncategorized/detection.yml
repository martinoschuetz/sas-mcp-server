  /mapping:
    get:
      summary: Get the current mapping
      description: Retrieves the current mapping from where SAS Detection Engine references
        the message content, to where it is found in the actual ION message.
      operationId: getMapping
      tags:
      - Mapping
      responses:
        '200':
          description: The request succeeded. The current mapping was retrieved.
          headers:
            Content-Type:
              description: The media type of the response collection.
              schema:
