  /generate/textION:
    post:
      summary: Generate a text ION message
      description: Generates a text ION message from a binary ION message representation.
      operationId: createGeneratedTextIon
      tags:
      - Generate
      requestBody:
        description: ION binary format
        required: true
        content:
          application/vnd.sas.detection.message+ion:
            example:
              $ref: "#/components/examples/incoming_ion"
          application/json:
            example:
              $ref: "#/components/examples/incoming_json"
          default:
            example:
              $ref: "#/components/examples/incoming_ion"
      responses:
        '200':
          description: The request succeeded. The text ION message was generated.
          content:
            text/plain:
              example: "{SMH:{smh_acct_type:'CC',smh_activity_detail1:'NAP',smh_activity_detail2:'NAP',smh_activity_detail3:'NAP',smh_activity_type:'CA',smh_authenticate_mtd:'CD'}}"
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/badRequestErrorResponse"
        '404':
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/badRequestErrorResponse"
  /generate/executeFromION:
    post:
      summary: Generate a JSON Body from a binary ION message
      description: Generates a JSON body that SAS Container Runtime expects from a
        binary ION message representation.
      operationId: createGeneratedExecuteFromIon
      tags:
      - Generate
      requestBody:
        description: The ION binary format.
        required: true
        content:
          application/json:
            example:
              $ref: "#/components/examples/incoming_json"
          default:
            example:
              $ref: "#/components/examples/incoming_ion"
      responses:
        '200':
