  /ready:
    get:
      summary: Get the SAS Detection Engine readiness
      description: Returns the readiness of the SAS Detection Engine. This endpoint
        is used internally to determine whether the SAS Detection Engine is ready
        to receive transactions.
      operationId: getReady
      tags:
      - Health
      responses:
        '200':
          description: The request succeeded. The SAS Detection Engine is ready to
            receive transactions.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              examples:
                default:
                  $ref: "#/components/examples/ready_200"
              schema:
                type: string
        '500':
          description: The request could not be fulfilled because of an unexpected
            server error. The SAS Detection Engine is not yet ready to receive transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                default:
                  $ref: "#/components/examples/ready_500"
