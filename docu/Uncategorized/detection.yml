  /restart:
    patch:
      summary: Restart all replicas in the SAS Container Runtime deployment
      description: |
        Restarts all replicas in the SAS Container Runtime deployment from the pod.
        <br> 1. Open a terminal, such as Git BASH.
        <br> 2. Enable the ServiceAccount permissions on the cluster:
        <br>    export KUBECONFIG=admin.conf
        <br>    kubectl create clusterrolebinding serviceaccounts-cluster-admin-myuser --clusterrole=cluster-admin --group=system:serviceaccounts
      operationId: patchRestartDeployment
      tags:
      - Restart
      parameters:
      - name: version
        in: query
        required: false
        schema:
          type: string
        description: 'The semantic version of the desired SAS Container Runtime container
          image.'
      responses:
        '200':
          description: The request succeeded. All of the replicas in the SAS Container
            Runtime deployment were restarted.
          content:
            application/json:
              schema:
                type: string
              examples:
                default:
                  $ref: "#/components/examples/restart_200"
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/restart_400"
        '404':
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/restart_404"
        '412':
          description: The request could not be processed because of a conflict in
            the current state of the resource.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
