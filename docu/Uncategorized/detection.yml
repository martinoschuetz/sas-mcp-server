                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/describeObject'
              examples:
                default:
                  $ref: "#/components/examples/describe_summary"
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/describe_400"
        '404':
