  /decision/validate:
    post:
      summary: Validate the provided information
      description: Validates the provided information.
      operationId: createValidate
      tags:
      - Validate
      requestBody:
        required: true
        content:
          application/vnd.sas.detection.message.schema_name+ion:
            schema:
              type: object
            examples:
              default:
                $ref: "#/components/examples/incoming_ion"
          application/vnd.sas.detection.message+ion:
            schema:
              type: object
            examples:
              default:
                $ref: "#/components/examples/incoming_ion"
          application/json:
            schema:
              type: object
            examples:
              json:
                $ref: "#/components/examples/incoming_json"
        description: 'ION binary format data, representing customer data, that will
          be augmented with results of running a decision.'
      responses:
        '200':
          description: The request succeeded. The provided information was validated.
          content:
