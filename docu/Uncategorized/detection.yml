  /generate/binaryION:
    post:
      summary: Generate a binary ION message
      description: Generates a binary ION message from a textual ION message representation.
      operationId: createGeneratedBinaryIon
      tags:
      - Generate
      requestBody:
        description: ION text format
        required: true
        content:
          application/json:
            example:
              $ref: "#/components/examples/incoming_json"
          default:
            example:
              $ref: "#/components/examples/incoming_ion"
      responses:
        '200':
          description: The request succeeded. The binary ION message was generated.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              example: "Binary content of a processed message"
        '400':
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
