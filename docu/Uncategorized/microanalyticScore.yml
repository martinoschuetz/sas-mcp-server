components:
  headers:
    Sas-Service-Response-Flag:
      description: Indicates whether the response is from a SAS service.
      schema:
        type: boolean
      example: true
  schemas:
    module:
      title: Module
      description: Describes a module that has been compiled and loaded by the service.
      properties:
        id:
          type: string
          description: A generated unique string that identifies a module in an installation.
        name:
          type: string
          description: The name that is associated with a module.
        revision:
          type: integer
          description: A whole number that indicates the revision of a module. It
            starts at 1 and increments by 1 each time the module is revised.
        description:
          type: string
          description: Text that describes the rules and logic performed by the module.
        scope:
          type: string
          description: The scope restricts how a module can be used. The value 'public'
            indicates the module is available to be called outside another module.
            The value 'private' indicates that a module can be called only from within
            another module.
          enum:
          - public
          - private
        language:
          type: string
          description: The language of the module source. DS2 indicates that the module
            source is written in the DS2 language.
          enum:
          - ds2
        creationTimeStamp:
          type: string
          format: date-time
          description: The initial creation time of the module.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The last revision time of the module.
        stepsIds:
          type: array
          description: An array of step IDs in the module.
          items:
            type: string
        properties:
          type: array
          items:
            $ref: "#/components/schemas/property"
          description: The properties specified for the module.
        warnings:
          type: array
          description: Optional object that is included if warnings are generated
            when this resource is compiled.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The link relations for the module.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The media type's schema version number. The current version
            is 2.
          default: 2
    submodule:
      title: Submodule
      description: Describes a submodule that has been compiled and loaded by the
        service.
      properties:
        id:
          type: string
          description: A string that, together with the moduleId, uniquely identifies
            the submodule.
        name:
          type: string
          description: The name that is associated with the submodule.
        moduleId:
          type: string
          description: A unique string that identifies the module that contains this
            submodule.
        language:
          type: string
          description: A string that describes the type or language of the submodule.
          enum:
          - ds2
          - astore
        description:
          type: string
          description: Text that describes the rules and logic performed by the submodule.
        attributes:
          type: object
          description: Optional attributes that are determined by the language.
          properties:
            keyValue:
              type: string
              description: Contains the key value that is needed to access the keystore.
                It is required for ASTORE submodules and ignored for DS2 submodules.
        creationTimeStamp:
          type: string
          format: date-time
          description: The initial creation time of the submodule.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The last revision time of the submodule.
        links:
          type: array
          description: The link relations for the submodule.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The media type's schema version number. The current version
            is 1.
          default: 1
    moduleDefinition:
      title: Module Definition
      description: The representation of a module for module creation.
      required:
      - scope
      - source
      properties:
        id:
          type: string
          description: An optional identifier for the module. If not specified, the
            source code of the module is parsed to determine the value of the module
            identifier.
        description:
          type: string
          description: Optional text that describes the logic or functionality of
            the module.
          default: ""
        scope:
          type: string
          description: The scope restricts how a module can be used. The value 'public'
            indicates the module is available to be called outside another module.
            The value 'private' indicates that a module can be called only from within
            another module.
          enum:
          - public
          - private
        type:
          type: string
          description: Optional text that describes the source code type. Currently,
            the only valid value is text/vnd.sas.source.ds2.
          enum:
          - text/vnd.sas.source.ds2
        source:
          type: string
          description: The source code of the module.
        properties:
          type: array
          items:
            $ref: "#/components/schemas/property"
          description: Additional metadata about the module. If a property definition
            is not needed, this can be omitted or specified as an empty array.
          default: []
        submodules:
          type: array
          items:
            $ref: "#/components/schemas/submoduleDefinition"
          description: Optional list of submodules for this module.
        version:
          type: integer
          description: The media type's schema version number. The current version
            is 2.
          default: 2
    submoduleDefinition:
      title: Submodule Definition
      description: A representation of a submodule for module creation.
      required:
      - language
      - source
      properties:
        name:
          type: string
          description: An optional name of the submodule module. If not present, the
            source code of the submodule is parsed to determine the value of the submodule
            name.
        language:
          type: string
          description: String that describes the type or language of the submodule.
          enum:
          - ds2
          - astore
        description:
          type: string
          description: Optional text that describes the logic or functionality of
            the submodule.
          default: ""
        source:
          type: string
          description: For DS2 modules, this must contain the source code of the module.
            For analytic store (ASTORE) modules, this contains the absolute path to
            a file that contains the ASTORE module. The file must be accessible to
            the Micro Analytic Service server, not the client. For a clustered deployment,
            the file must be accessible from each cluster member. Locating the file
            on a network share is one way to accomplish this.
        attributes:
          type: object
          description: Optional attributes that are determined by the language.
          properties:
            keyValue:
              type: string
              description: Contains the key value that is needed to access the keystore.
                It is required for ASTORE submodules and ignored for DS2 submodules.
    moduleSource:
      title: Module Source
      description: The source code of the module or submodule.
      type: object
      properties:
        version:
          type: integer
          description: The media type's schema version number. The current version
            is 2.
          default: 2
        moduleId:
          type: string
          description: A unique string that identifies the module that contains this
            source.
        submoduleId:
          type: string
          description: Optional unique string that identifies the submodule that contains
            this source. This is omitted if the source code is for a module.
        source:
          type: string
          description: The source code used.
        links:
          type: array
          description: A collection of links to related resources or operations.
          items:
            $ref: "#/components/schemas/link"
    step:
      title: Step
      description: A representation of a unit of code to be executed, and its inputs
        and outputs.
      type: object
      properties:
        id:
          type: string
          description: The identifier of a step that is included in the compiled module.
            The identifier is user-specified and is often a name for the step.
        moduleId:
          type: string
          description: The identifier of the module that contains the step.
        description:
          type: string
          description: Text that describes the logic performed by the step.
        inputs:
          type: array
          description: Describes information about the specific input values that
            should be specified in the request body when a step is executed.
          items:
            $ref: "#/components/schemas/stepParameter"
        outputs:
          type: array
          description: Describes information about the specific output values that
            should be expected in the response body of step execution.
          items:
            $ref: "#/components/schemas/stepParameter"
        links:
          type: array
          description: A collection of links to related resources or operations.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The media type's schema version number. The current version
            is 1.
          default: 1
    stepInput:
      title: Step Input
      description: Describes the input values that are required when a step is validated
        or executed.
      type: object
      required:
      - inputs
      properties:
        inputs:
          type: array
          description: The values to pass to the step as inputs for validation or
            execution. The order of the variables should match the order presented
            in the input signature.
          items:
            anyOf:
            - $ref: "#/components/schemas/numberVariable"
            - $ref: "#/components/schemas/stringVariable"
            - $ref: "#/components/schemas/booleanVariable"
            - $ref: "#/components/schemas/arrayVariable"
            - $ref: "#/components/schemas/objectVariable"
        version:
          type: integer
          description: The media type's schema version number. The current version
            is 1.
          default: 1
        metadata:
          type: object
          description: A map of name-value pairs that are used to pass metadata from
            the client to the server. For more information, see [Using Transaction
            Metadata during Step Execution](https://documentation.sas.com/doc/en/mascdc/default/masag/p1g5v0cgkvs318n1i3cyhy7j6j7k.htm).
          additionalProperties:
            type: string
    stepOutput:
      title: Step Output
      description: This type describes the output values that are returned when a
        step is executed.
      type: object
      properties:
        moduleId:
          type: string
          description: The identifier of the module that contains the executed step.
        stepId:
          type: string
          description: The name of the step that produced this output.
        executionState:
          type: string
          description: The state of execution. Valid values are 'completed', 'submitted'
            and 'timedOut'.
        outputs:
          type: array
          description: The output values that are returned from an executed step.
            The order of the variables matches the order presented in the output signature.
          items:
            anyOf:
            - $ref: "#/components/schemas/numberVariable"
            - $ref: "#/components/schemas/stringVariable"
            - $ref: "#/components/schemas/booleanVariable"
            - $ref: "#/components/schemas/arrayVariable"
            - $ref: "#/components/schemas/objectVariable"
        links:
          type: array
          description: The link relations for the step output.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The media type's schema version number. The current version
            is 2.
          default: 2
        metadata:
          type: object
          description: A map of name-value pairs that are used to pass metadata from
            the server to the client.
          additionalProperties:
            type: string
    stepParameter:
      title: Step Parameter
      description: An object that describes the format of an input or output to a
        step.
      type: object
      properties:
        name:
          type: string
          description: The name of the input or output variable.
        type:
          type: string
          description: The data type of a variable. If the variable's type is (array
            of) integer, long, or decimal, the value must be a JSON (array of) number.
            If the variable's type is (array of) string or char, the value must be
            a JSON (array of) string. Only one-dimensional arrays are supported. Null
            is used to represent missing values. For DS2, decimal corresponds to the
            double data type.
          enum:
          - decimal
          - bigint
          - integer
          - string
          - binary
          - decimalArray
          - bigintArray
          - integerArray
          - stringArray
          - binaryArray
        size:
          type: integer
          description: For a string type, this field indicates the length of the string
            and is at least one. For non-string types, this field is ignored.
        dim:
          type: integer
          description: For an array type, this field indicates the length of the array
            and is at least one. For non-array types, this field is ignored.
    property:
      title: Property
      description: A name/value property that represents metadata for a module.
      type: object
      properties:
        name:
          type: string
          description: Name of the property.
        value:
          type: string
          description: Value of the property.
    numberVariable:
      title: NumberVariable
      description: A name/value pair that represents an input or output variable of
        type number.
      type: object
      properties:
        name:
          type: string
          description: Name of the variable.
        value:
          description: The value of the variable of type number.
          type: number
    stringVariable:
      title: StringVariable
      description: A name/value pair that represents an input or output variable of
        type String.
      type: object
      properties:
        name:
          type: string
          description: Name of the variable.
        value:
          description: The value of the variable of type string.
          type: string
        encoding:
          type: string
          description: The encoding of the variable value. It can be null or 'b64'.
    booleanVariable:
      title: BooleanVariable
      description: A name/value pair that represents an input or output variable of
        type boolean.
      type: object
      properties:
        name:
          type: string
          description: Name of the variable.
        value:
          description: The value of the variable of type boolean.
          type: boolean
    arrayVariable:
      title: ArrayVariable
      description: A name/value pair that represents an input or output variable of
        type array
      type: object
      properties:
        name:
          type: string
          description: Name of the variable.
        value:
          description: The value of the variable of type array.
          type: array
    objectVariable:
      title: ObjectVariable
      description: A name/value pair that represents an input or output variable of
        type object
      type: object
      properties:
        name:
          type: string
          description: Name of the variable.
        value:
          description: The value of the variable of type object.
          type: object
    job:
      title: Job
      description: Describes an asynchronous job that is used to create a module.
      type: object
      properties:
        id:
          type: string
          description: A generated unique string that identifies a job.
        description:
          type: string
          description: Optional text that describes the job.
        moduleId:
          type: string
          description: The ID of module that is being created or updated. This information
            is also logged for all the messages related to this job.
        operation:
          type: string
          description: Indicates whether the job is used to create or update the module.
          enum:
          - create
          - update
        state:
          type: string
          description: The state of the job. It can be 'pending', 'running', 'completed',
            'failed', 'cancelled'  or 'timedOut'.
        errors:
          type: array
          description: Optional object that is included if compiling the provided
            module produced errors.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The link relations for the job.
          items: {}
        version:
          type: integer
          description: The media type's schema version number. The current version
            is 2.
          default: 2
    moduleCollection:
      title: Module Collection
      description: A collection of module representations.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/module"
            description: An array that contains module resources.
    submoduleCollection:
      title: Submodule Collection
      description: A collection of submodule representations.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/submodule"
            description: An array that contains module resources.
    stepCollection:
      title: Step Collection
      description: A collection of step representations.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/step"
            description: An array that contains step resources.
    jobCollection:
      title: Job Collection
      description: A collection of job representations.
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/job"
            description: An array that contains job resources.
    microAnalyticScoreError:
      title: Micro Analytic Score Error
      description: An error with Micro Analytic Score execution.
      type: object
      allOf:
      - $ref: "#/components/schemas/error2"
      - properties:
          moduleId:
            type: string
            description: The identifier of the module in which the error occured.
          stepId:
            type: string
            description: The identifier of the execution step in which the error occured.
          timestamp:
            type: integer
            description: The time at which the error occured.
          serverity:
            type: integer
            description: The level of the error. Possible values are NULL (0), NONE
              (1), NOTE (2), WARNING (3), or ERROR (4).
          loggerName:
            type: string
            description: The name of the logger that printed the error.
          threadId:
            type: integer
            description: The ID of the thread in which the error occured.
          sqlState:
            type: string
            description: Additional error information that is related to databases.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    validation:
      title: Validation Response
      description: The response from a pre-flight validation request. For APIs which
        support validation, the client can run operations (typically on resources
        in the `/commons/validation`) with `application/vnd.sas.validation+json` as
        the requested response type (via the `Accept:` request header). The service
        will validate the request but not execute the request, and return this response
        to indicate if the request was valid at the time it was made.
      x-sas-media-type:
        name: application/vnd.sas.validation
        version: 1
      required:
      - version
      - valid
      properties:
        version:
          description: This media type's schema version number. This representation
            is version 1.
          type: integer
        valid:
          description: '`true` if and only if the validation was successful.'
          type: boolean
        error:
          $ref: "#/components/schemas/error2"
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
