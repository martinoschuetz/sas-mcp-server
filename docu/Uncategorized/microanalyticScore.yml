        description: New Module
        scope: public
        language: ds2
        stepIds:
        - variable_test
        properties:
        - name: NewModule property 1
          value: NewModule property value
        - name: NewModule property 2
          value: ''
        warnings: []
    UpdateModuleRequest:
      description: Update module request.
      value:
        id: SampleModule
        version: 1
        description: Update the SampleModule module.
        source: |
          package variabletest /overwrite=yes;
           method variable_test_update(varchar(32767) in_string, bigint in_int, double in_float, bigint in_boolean, in_out varchar out_string, in_out bigint out_int, in_out double out_float, in_out bigint out_boolean);
           out_int=in_int + 2;
           out_float=in_float + 1.11;
           if (in_boolean = 0) then out_boolean=1;
           else out_boolean=0;
           out_string=reverse(in_string);
           end;
           endpackage;
        type: text/vnd.sas.source.ds2
        properties:
        - name: test property name
          value: test property value
        - name: test property name 2
          value: ''
        scope: public
