      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module that contains this step was last modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module
                that contains this step.
              schema:
                type: string
        "404":
          description: The requested module or step could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    post:
      tags:
      - Steps
      summary: Execute a step
      description: |
        Executes the step with the specified input values. Depending on the value that is assigned to the `waitTime` parameter, execution occurs in one of the following ways:
        If the assigned value is `missing`, the call waits until the execution is complete before it
        returns. The `outputs` variable in the reply contains the output of the
        execution. The `executionState` variable is assigned the value
        `completed` in the returned `stepOutput` object.

        If the assigned value is a positive number, the call waits the
        specified  number of milliseconds. If the execution completes within the
        `waitTime` value, the `outputs` variable in the reply contains the
        output of the execution and the `executionState` variable is set to
        `completed`.

        If the execution does not complete within
        `waitTime` value, the `outputs` variable is empty and the
        `executionState` variable is assigned the value `timedOut` in the
        returned `stepOutput` object.


        If the assigned value is
        zero, the call returns immediately after validation. The `outputs`
        variable is empty and the `executionState` variable is assigned the
        value `submitted` in the returned `stepOutput` object.


        If the assigned value is non-numeric or a negative value, the execution
        fails with an error.
      operationId: createStepExecution
      parameters:
      - name: moduleId
        in: path
        description: The identifier of the module that contains the step to execute.
        required: true
        schema:
          type: string
      - name: stepId
        in: path
        description: The identifier of the step to execute.
        required: true
        schema:
          type: string
      - name: waitTime
        in: query
        description: A value that determines how to execute the step. For more information,
          see the operation description above and [Synchronous, Asynchronous, and
          Timed Execution](https://documentation.sas.com/doc/en/mascdc/default/masag/p0t6c324lr03qkn1tsjq8gcielko.htm).
        required: false
        schema:
          type: integer
      requestBody:
        content:
          application/vnd.sas.microanalytic.module.step.input+json:
            schema:
              $ref: "#/components/schemas/stepInput"
            examples:
              default:
                $ref: "#/components/examples/ExecuteStepRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/stepInput"
            examples:
              default:
                $ref: "#/components/examples/ExecuteStepRequest"
        description: The input values to use for the execution.
        required: true
      responses:
        "201":
          description: The StepOutput was created.
          content:
            application/vnd.sas.microanalytic.module.step.output+json:
              schema:
                $ref: "#/components/schemas/stepOutput"
              examples:
                default:
                  $ref: "#/components/examples/ExecuteStepResponse"
                timedOut:
                  $ref: "#/components/examples/ExecuteStepTimedOutResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/stepOutput"
              examples:
                default:
                  $ref: "#/components/examples/ExecuteStepResponse"
                timedOut:
                  $ref: "#/components/examples/ExecuteStepTimedOutResponse"
        "400":
          description: The specified inputs were invalid. The step could not be executed.
          content:
            application/vnd.sas.error+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/error2"
                - $ref: "#/components/schemas/microAnalyticScoreError"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: The requested module or step could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/error2"
                - $ref: "#/components/schemas/microAnalyticScoreError"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
