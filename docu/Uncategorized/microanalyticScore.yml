---
openapi: 3.0.3
info:
  version: "8"
  title: Micro Analytic Score
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  license:
    name: SAS Institute
    url: https://support.sas.com/techsup/license/index.html
  description: The Micro Analytic Score API provides stateless, memory-resident, high-performance
    program execution.
servers:
- url: https://example.com/microanalyticScore
  description: This is an example of a base URL.
externalDocs:
  description: Developer documentation
  url: https://developer.sas.com
security:
- SASLogon:
  - openid
tags:
- name: Root
  description: Contains the operations for the Root resource.
- name: Modules
  description: Contains the operations for module resources.
- name: Submodules
  description: Contains the operations for submodule resources.
- name: Steps
  description: Contains the operations for step resources.
- name: Jobs
  description: Contains the operations for job resources.
paths:
  /:
    get:
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level collections that are surfaced
        through the API.  HEAD is also supported and returns status and headers only.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded. A collection of link objects was returned.
          headers:
            Sas-Service-Response-Flag:
              $ref: '#/components/headers/Sas-Service-Response-Flag'
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
    head:
      summary: Get headers for the service
      description: Retrieves headers for the service and checks whether the service
        is available.
      operationId: headersForRoot
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded. The service is available.
          headers:
            Sas-Service-Response-Flag:
              $ref: '#/components/headers/Sas-Service-Response-Flag'
  /modules:
    get:
      tags:
      - Modules
      summary: Get loaded modules
      description: Retrieves the collection of modules that are loaded in memory by
        the service. Standard paging options are supported. The returned collection
        items are of type application/vnd.sas.microanalytic.module.
      operationId: getModules
      parameters:
      - name: start
        in: query
        description: The index of the first module to return.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The maximum number of modules to return.
        schema:
          type: integer
          default: 20
      - name: filter
        in: query
        description: The criteria for filtering the modules. See [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the modules. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: '#/components/headers/Sas-Service-Response-Flag'
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/moduleCollection"
              examples:
                default:
                  $ref: "#/components/examples/GetLoadedModulesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/moduleCollection"
              examples:
                default:
                  $ref: "#/components/examples/GetLoadedModulesResponse"
    post:
      tags:
      - Modules
      summary: Create a module
      description: "Creates and loads a module from the provided module definition\
        \ and returns a representation of the loaded module. Note that the name assigned\
        \ to a module ID, package, public method, or submodule must not include any\
        \ of the following characters: forward slash, backslash, period, and semicolon."
      operationId: createModule
      requestBody:
        content:
          application/vnd.sas.microanalytic.module.definition+json:
            schema:
              $ref: "#/components/schemas/moduleDefinition"
            examples:
              default:
                $ref: "#/components/examples/CreateModuleRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/moduleDefinition"
            examples:
              default:
                $ref: "#/components/examples/CreateModuleRequest"
        description: A definition of the module to be created.
        required: true
      responses:
        "201":
          description: The module was created.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module was last modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module.
              schema:
                type: string
            Location:
              description: The URL of the module.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.microanalytic.module+json:
              schema:
                $ref: "#/components/schemas/module"
              examples:
                default:
                  $ref: "#/components/examples/CreateModuleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/module"
              examples:
                default:
                  $ref: "#/components/examples/CreateModuleResponse"
        "400":
          description: The request was invalid. The module was not created.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/createModuleBadRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/createModuleBadRequest"
  "/modules/{moduleId}":
    get:
      tags:
      - Modules
      summary: Get module
      description: For the specified module, returns detailed information including
        the steps that are contained in the module.
      operationId: getModule
      parameters:
      - name: moduleId
        in: path
        description: The identifier of the module to retrieve.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The Etag that is returned from a GET, POST, or PUT of this module.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the 'lastModified' date of the module. If the module
          has been updated since this time, the update will fail.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module was last modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module.
              schema:
                type: string
          content:
            application/vnd.sas.microanalytic.module+json:
              schema:
                $ref: "#/components/schemas/module"
              examples:
                default:
                  $ref: "#/components/examples/GetLoadedModuleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/module"
              examples:
                default:
                  $ref: "#/components/examples/GetLoadedModuleResponse"
        "404":
          description: The requested module could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    head:
      tags:
      - Modules
      summary: Get headers for module
      description: For the specified module, returns header information for subsequent
        PUT or check for existence.
      operationId: headersForModule
      parameters:
      - name: moduleId
        in: path
        description: The identifier of the module to retrieve.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The Etag that is returned from a GET, POST, or PUT of this module.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the 'lastModified' date of the module. If the module
          has been updated since this time, the update will fail.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module was last modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module.
              schema:
                type: string
        "404":
          description: The requested module could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    put:
      tags:
      - Modules
      summary: Update a module
      description: For the specified module, replaces the existing module with values
        from the request body. Please note, the source of the module is not replaced.
      operationId: updateModule
      parameters:
      - name: moduleId
        in: path
        description: The identifier of the module to update.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The Etag that is returned from a GET, POST, or PUT of this module.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the 'lastModified' date of the module. If the module
          has been updated since this time, the update will fail.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.microanalytic.module+json:
            schema:
              $ref: "#/components/schemas/module"
            examples:
              default:
                $ref: "#/components/examples/UpdateModuleRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/module"
            examples:
              default:
                $ref: "#/components/examples/UpdateModuleRequest"
        description: The new definition of the module to load. The name of the module
          in the new definition must match the previously loaded name.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module was last modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module.
              schema:
                type: string
          content:
            application/vnd.sas.microanalytic.module+json:
              schema:
                $ref: "#/components/schemas/module"
              examples:
                default:
                  $ref: "#/components/examples/UpdateModuleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/module"
              examples:
                default:
                  $ref: "#/components/examples/UpdateModuleResponse"
        "400":
          description: The request was invalid. The module could not be updated.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: The requested module could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "412":
          description: The If-Match request header did not match the module's Etag
            or the If-Unmodified-Since request header did not match the module's last
            modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        "428":
          description: The request headers did not include an If-Match or If-Unmodified-Since
            precondition. Set appropriate values for the If-Unmodified-Since and If-Match
            request headers before reattempting the request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/updateModulePreConditionRequired"
    delete:
      tags:
      - Modules
      summary: Delete a module
      description: Deletes the specified module.
      operationId: deleteModule
      parameters:
      - name: moduleId
        in: path
        description: The identifier of the module to delete.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The module was deleted.
  "/modules/{moduleId}/source":
    get:
      tags:
      - Modules
      summary: Get module source
      description: Returns the source code of the specified module.
      operationId: getModuleSource
      parameters:
      - name: moduleId
        in: path
        description: The identifier of the module that contains the source code.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module was last modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module.
              schema:
                type: string
          content:
            application/vnd.sas.microanalytic.module.source+json:
              schema:
                $ref: "#/components/schemas/moduleSource"
              examples:
                default:
                  $ref: "#/components/examples/GetModuleSourceResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/moduleSource"
              examples:
                default:
                  $ref: "#/components/examples/GetModuleSourceResponse"
        "404":
          description: The requested module could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    head:
      tags:
      - Modules
      summary: Get headers for module source
      description: For the specified module, returns header information for subsequent
        PUT or check for existence. Since the module source is persisted as part of
        the module, the ETag and Last Modified Date as the same as that of the module.
      operationId: headersForModuleSource
      parameters:
      - name: moduleId
        in: path
        description: The identifier of the module of the source to retrieve.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The Etag that is returned from a GET, POST, or PUT of this module.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the 'lastModified' date of the module. If the module
          has been updated since this time, the update will fail.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module was last modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module.
              schema:
                type: string
        "404":
          description: The requested module could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    put:
      tags:
      - Modules
      summary: Update module source
      description: Replaces the module source of the specified module with values
        in the request body.
      operationId: updateModuleSource
      parameters:
      - name: moduleId
        in: path
        description: The identifier of the module to update.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The Etag returned from a GET, POST, or PUT of this module source.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the lastModified date of the module source. If the
          module source has been updated since this time, the update will fail.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.microanalytic.module.source+json:
            schema:
              $ref: "#/components/schemas/moduleSource"
            examples:
              default:
                $ref: "#/components/examples/UpdateModuleSourceRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/moduleSource"
            examples:
              default:
                $ref: "#/components/examples/UpdateModuleSourceRequest"
        description: The new module source to load.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module was last modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module.
              schema:
                type: string
          content:
            application/vnd.sas.microanalytic.module.source+json:
              schema:
                $ref: "#/components/schemas/moduleSource"
              examples:
                default:
                  $ref: "#/components/examples/UpdateModuleSourceResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/moduleSource"
              examples:
                default:
                  $ref: "#/components/examples/UpdateModuleSourceResponse"
        "400":
          description: The request was invalid. The module could not be updated.
          content:
            application/vnd.sas.microanalytic.module.source+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: The requested module could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "412":
          description: The If-Match request header did not match the module's Etag
            or the If-Unmodified-Since request header did not match the module's last
            modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/updateModuleSourcePreConditionFailed"
        "428":
          description: The request header did not include an If-Match or If-Unmodified-Since
            precondition. Set the appropriate values for the If-Unmodified-Since and
            If-Match request headers before reattempting the request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/updateModuleSourcePreConditionRequired"
  "/modules/{moduleId}/submodules":
    get:
      tags:
      - Submodules
      summary: Get submodules for this module
      description: Retrieves the collection of submodules contained by the specified
        module.
      operationId: getSubmodules
      parameters:
      - name: moduleId
        in: path
        required: true
        description: The identifier of the module that contains the submodule collection.
        schema:
          type: string
      - name: start
        in: query
        description: The index of the first submodule to return.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The maximum number of submodules to return.
        schema:
          type: integer
          default: 20
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module was last modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/submoduleCollection"
              examples:
                default:
                  $ref: "#/components/examples/GetSubmodulesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/submoduleCollection"
              examples:
                default:
                  $ref: "#/components/examples/GetSubmodulesResponse"
        "404":
          description: The module that contains the submodules collection could not
            be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    head:
      tags:
      - Submodules
      summary: Get headers to the submodules for this module
      description: Retrieves the headers of the collection of submodules contained
        by the specified module.
      operationId: headersForSubmodules
      parameters:
      - name: moduleId
        in: path
        required: true
        description: The identifier of the module that contains the submodule collection.
        schema:
          type: string
      - name: start
        in: query
        description: The index of the first submodule to return.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The maximum number of submodules to return.
        schema:
          type: integer
          default: 20
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module was last modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module.
              schema:
                type: string
        "404":
          description: The module that contains the submodules collection could not
            be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  "/modules/{moduleId}/submodules/{submoduleId}":
    get:
      tags:
      - Submodules
      summary: Get a submodule of the module
      description: Returns detailed information about the specified submodule of the
        specified module.
      operationId: getSubmodule
      parameters:
      - name: moduleId
        in: path
        required: true
        description: The identifier of the module that contains the submodule.
        schema:
          type: string
      - name: submoduleId
        in: path
        required: true
        description: The identifier of the submodule.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module that contains this submodule was last
                modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module
                that contains this submodule.
              schema:
                type: string
          content:
            application/vnd.sas.microanalytic.submodule+json:
              schema:
                $ref: "#/components/schemas/submodule"
              examples:
                default:
                  $ref: "#/components/examples/GetSubmoduleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/submodule"
              examples:
                default:
                  $ref: "#/components/examples/GetSubmoduleResponse"
        "404":
          description: The requested module or submodule could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    head:
      tags:
      - Submodules
      summary: Get headers for a submodule of the module
      description: Returns header information about the specified submodule of the
        specified module.
      operationId: headersForSubmodule
      parameters:
      - name: moduleId
        in: path
        required: true
        description: The identifier of the module that contains the submodule.
        schema:
          type: string
      - name: submoduleId
        in: path
        required: true
        description: The identifier of the submodule.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module that contains this submodule was last
                modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module
                that contains this submodule.
              schema:
                type: string
        "404":
          description: The requested module or submodule could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  "/modules/{moduleId}/submodules/{submoduleId}/source":
    get:
      tags:
      - Submodules
      summary: Get submodule source
      description: Retrieves the source code for the specified submodule and module.
      operationId: getSubmoduleSource
      parameters:
      - name: moduleId
        in: path
        required: true
        description: The identifier of the module that contains the submodule.
        schema:
          type: string
      - name: submoduleId
        in: path
        required: true
        description: The identifier of the submodule.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: '#/components/headers/Sas-Service-Response-Flag'
            Last-Modified:
              description: The timestamp (in EEE, dd MMM yyyy HH:mm:ss GMT format)
                that indicates when the module that contains this submodule was last
                modified.
              schema:
                type: string
            Etag:
              description: The entity tag that identifies this revision of the module
                that contains this submodule.
