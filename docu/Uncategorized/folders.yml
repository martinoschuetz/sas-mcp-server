      operationId: patchFolderMember
      parameters:
      - name: folderId
        in: path
        description: The identifier of a specific folder, or of one of the delegate
          strings @myFolder, @appDataFolder, @myHistory, @myFavorites, or @public.
        required: true
        schema:
          type: string
          format: object-id
      - name: memberId
        in: path
        description: Member id.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The ETag that was returned from a GET, POST, or PUT of this folder.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the lastModified date of the folder. If the folder
          has been updated since this time, the update fails.
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/memberIn"
      responses:
        "200":
          description: The request succeeded. The member was updated.
          headers:
            Last-Modified:
              description: The RFC 1123 date string representing the timestamp of
                the last update to this member.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                json:
                  $ref: "#/components/examples/folderMemberResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                json:
                  $ref: "#/components/examples/folderMemberResponse"
        "400":
          description: The request was invalid. The JSON or some other element was
            malformed.
          content:
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "404":
          description: No member exists at the requested path.
          content:
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. The name change requested would create
            a naming conflict.
          content:
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resource's last modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "422":
          description: One or more elements of the body is invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
  "/folders/{folderId}/histories":
    post:
      tags:
      - Member
      summary: Update the modification date for a history member
      description: >
        Updates the modification date for a history member. If the object URI
        exists as a reference in the history folder, the information including
        the added field is updated. If it does not exist, a new member is added,
        and an eviction is performed if the folder is already at the maximum
        members threshold.
      operationId: createHistory
      parameters:
      - name: folderId
        in: path
        description: "The identifier of a specific history folder, or the delegate\
          \ string: @myHistory."
        required: true
        schema:
          type: string
          format: object-id
      - name: abortOnMetadataFailure
        in: query
        description: If true, if the GET to retrieve the member metadata fails, abort
          the member creation. If false, the member creation succeeds regardless of
          the metadata retrieval status. The default value is false.
        schema:
          type: boolean
      requestBody:
        $ref: "#/components/requestBodies/memberIn"
      responses:
        "200":
          description: The member was updated.
          headers:
            Location:
              description: The URI of the created or updated object.
              schema:
                type: string
            Last-Modified:
              description: The RFC 1123 timestamp representing the last time this
                member was updated.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                json:
                  $ref: "#/components/examples/folderMemberResponse"
            application/vnd.sas.content.summary+json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                json:
                  $ref: "#/components/examples/folderMemberSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                json:
                  $ref: "#/components/examples/folderMemberResponse"
        "201":
          description: A member was created.
          headers:
            Location:
              description: The URI of the created or updated object.
              schema:
                type: string
            Last-Modified:
              description: The ISO8601 timestamp that represents the last time this
                member was updated.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                json:
                  $ref: "#/components/examples/folderMemberResponse"
            application/vnd.sas.content.summary+json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                json:
                  $ref: "#/components/examples/folderMemberSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                json:
                  $ref: "#/components/examples/folderMemberResponse"
        "400":
          description: The request was invalid. A folder type other than a history
            folder was referenced, or the body does not contain valid JSON.
          content:
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/vnd.sas.content.summary+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "404":
          description: No folder exists at the requested path.
          content:
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/vnd.sas.content.summary+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "422":
          description: History creation failed because the metadata retrieval failed.
          content:
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/vnd.sas.content.summary+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
  /ancestors:
    post:
      tags:
      - Metainfo
      summary: Get ancestors for a list of resource URIs
      description: Get the ancestors of a set of URIs. Each URI is represented in
        the result as an Ancestor object.
      operationId: createBulkAncestors
      parameters:
      - name: allowPartialPath
        in: query
        description: Allow a partial path from the item if the user does not have
          access to all the folders in the path.
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
            examples:
              json:
                $ref: "#/components/examples/ancestorsRequestBody"
        description: The list of URIs for which to retrieve ancestry.
        required: true
      responses:
        "200":
          description: The ancestors for each URI was returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/ancestorCollection"
              examples:
                json:
                  $ref: "#/components/examples/ancestorsResponseBody"
            application/json:
              schema:
                $ref: "#/components/schemas/ancestorCollection"
              examples:
                json:
                  $ref: "#/components/examples/ancestorsResponseBody"
        "400":
          description: The request was invalid. The body was malformed or is missing.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
    get:
      tags:
      - Metainfo
      summary: Get a resource's ancestors
      description: Get the ancestors of a resource by URI as a flat list, ordered
        starting with the parent folder of the resource, and continuing up to the
        root folder.
      operationId: getAncestors
      parameters:
      - name: childUri
        in: query
        description: The URI of the target resource whose ancestry is desired.
        required: true
        schema:
          type: string
      - name: allowPartialPath
        in: query
        description: Allow a partial path from the item if the user does not have
          access to all the folders in the path.
        schema:
          type: boolean
      responses:
        "200":
          description: The member was found and the ancestry was returned. In the
            case of a root folder, a 200 HTTP status code and an empty list of ancestors
            is returned.
          content:
            application/vnd.sas.content.folder.ancestor+json:
              schema:
                $ref: "#/components/schemas/ancestor"
              examples:
                json:
                  $ref: "#/components/examples/ancestorsSingleResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ancestor"
              examples:
                json:
                  $ref: "#/components/examples/ancestorsSingleResponse"
        "204":
          description: No ancestors were found for the URI.
        "400":
          description: No childUri parameter was provided.
          content:
            application/vnd.sas.content.folder.ancestor+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
