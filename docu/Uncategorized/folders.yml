    post:
      tags:
      - Member
      summary: Add a member to a folder
      description: >
        Adds a new member to the folder. If the member type is 'child' and the
        object referenced is already a member of any folder (including the
        specified parent), this operation fails with a 409 status (conflict). If
        the object being added is a folder, this method checks that the name is
        unique (among other members that are of the same type). If a name
        collision occurs, a 409 status is returned.

        For SAS managed objects, certain member attributes stored in the
        folder (such as name and description) are synchronized with the
        attributes of the object identified by the member's URI, provided
        that the URI is accessible. As a result, the name stored for the
        member will be the name of the object at the URI, regardless of
        the name value supplied in the request body. Name uniqueness
        checks are based on the synchronized name, not the name in the
        request. If the URI is not accessible or does not reference a SAS
        managed object, the name and other attributes from the request
        body are used as provided.
      operationId: createFolderMember
      parameters:
      - name: folderId
        in: path
        description: The identifier of a specific folder, or of one of the delegate
          strings @myFolder, @appDataFolder, @myHistory, @myFavorites, or @public.
        required: true
        schema:
          type: string
          format: object-id
      - name: abortOnMetadataFailure
        in: query
        description: If true, the member creation is aborted if the GET to retrieve
          the member metadata fails. If false, the member creation succeeds regardless
          of the metadata retrieval status. The default value is false.
        schema:
          type: boolean
      - name: forceMove
        in: query
        description: If true, if this is a creation of a child member and if the URI
          in the member already exists in another folder, the member is moved to the
          requested folder. If it is already a member of the requested folder, the
          request succeeds. The default value is false.
        schema:
          type: boolean
      requestBody:
        $ref: "#/components/requestBodies/memberIn"
      responses:
        "200":
          description: The request succeeded. The member was updated.
          headers:
            Location:
              description: The URI to the newly created object.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                json:
                  $ref: "#/components/examples/createFolderMember"
            application/json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                json:
                  $ref: "#/components/examples/createFolderMember"
        "201":
          description: A member was created.
