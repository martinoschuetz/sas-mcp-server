    memberIn:
      title: Member Schema
      description: The schema for creating a new folder member.
      required:
      - name
      - uri
      - type
      properties:
        uri:
          type: string
          format: relative URI
          description: >
            The URI of the item that the member represents. The service does not
            make any attempt to validate this field, so it can be anything.
            However, if this is a folder, it MUST be the folder's URI. It should
            come from the folder's "self" link, and not be assembled from
            pieces.
        type:
          type: string
          description: >
            Must be "child" or "reference". Child members are deleted when the
            parent folder is deleted. Child members that rely on SAS
            authorization checking inherit authorization settings from the
            parent folder. An object can be a child of one and only one folder.
            Reference members have no such restrictions. Any member object can
            be referenced from an unrestricted number of containers.
        parentFolderUri:
          type: string
          description: >
            The URI of this member's parent folder. This is writable by the
            client. In order to perform a move, PUT this member with an updated
            parentFolderUri pointing to the new parent.
        name:
          type: string
          description: >
            Localizable name of the member object. This attribute is persisted
            with the folder for performance reasons. For SAS managed objects,
            this value is synchronized with the name attribute of the object
            at the specified URI when the URI is accessible. In that case, the
            value supplied in the request is overridden, so callers should
            supply the actual name of the object without modification. If the
            URI is not accessible or does not reference a SAS managed object,
            the name value from the request is used as provided.
        description:
          type: string
          description: >
            Localizable description of the member object. Member attribute is
            synchronized with attribute of member object for SAS managed
            objects.
        creationTimeStamp:
          type: string
          format: date-time
          description: >
            Timestamp of member object creation. Member attribute is
            synchronized with attribute of member object for SAS managed
            objects.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: >
            Timestamp of last member object modification. Member attribute is
            synchronized with attribute of member object for SAS managed
            objects.
        contentType:
          type: string
          description: >
            Member object type. Member attribute is synchronized with attribute
            of member object for SAS managed objects.
        typeDefName:
          type: string
          description: >
            (version 2) If the resource has a subtype that applies, the client
            can specify it when creating the member. This gives the client
            navigating the members more information for filtering, sorting, or
            searching for matching members.
        iconUri:
          type: string
          format: relative URI
          description: >
            Member object icon URI. Member attribute is synchronized with
            attribute of member object for SAS managed objects.
        orderNum:
          type: integer
          description: >
            Optional ordering specifier to provide user ordering of members.
            When retrieving members, if no other ordering is specified, members
            are ordered by this field in ascending order. The values do not have
            to be sequential; the results are ordered according to the values
            provided. The values also do not have to be unique. However,
            duplicates result in arbitrary ordering of records with duplicate
            values.
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 2.
      example:
        name: Test Object
        type: child
        uri: /objekts/e8cdb3af-30d8-423d-92a1-6f3bf1dffbb9
        contentType: objekt
