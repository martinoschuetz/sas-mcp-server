  /delegateFolders:
    get:
      tags:
      - Folder
      summary: Get the folders for a given set of delegate names
      description: Returns the folders for the given set of delegate names, or all
        delegate folders if no names are provided.
      operationId: getDelegateFolders
      parameters:
      - name: name
        in: query
        description: The name of the delegate (including the leading '@') desired.
          Multiple values of the name parameter can be provided.
        schema:
