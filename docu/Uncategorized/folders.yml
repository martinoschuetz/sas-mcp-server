---
# yamllint disable rule:braces
openapi: 3.0.3
info:
  version: "7"
  title: Folders
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: >
    The Folders API provides an organizational structure for SAS and external
    content. It can also be used for favorites folders or a history of objects
    accessed. The resources that are stored in folders (members) use a URI to
    point back to those resources.
    <H4><strong>Terminology:</strong></H4>
    <H4>folder</H4>
      <p> A virtual container for other folders, or any resource that can be represented
    with a URI.</p>
    <H4>member</H4>
      <p> A resource contained in a folder. A member can itself be a folder, creating
    a hierarchical structure for folders and subfolders. Members have two types: child
    and reference. A child member inherits authorizations from its container, and
    a given resource can be a child only in a single folder. Reference members do
    not inherit authorizations, and a resource can have many references in many different
    folders.</p>
    <H4>Folder Type and Authorization</H4>
      <p> Folder types are the properties used to describe folders. Folder types are
    not authorization controls and do not affect access to folders or folder members.</p>
      <p> The hiddenFolder type and the associated hidden=true property are used by
    client applications to hide certain folders from default views. They are intended
    as UI hints and are not authorization controls.
      The service does not implicitly filter out folders by type, including hiddenFolder.
    Type-based filtering is applied only when a query filter explicitly requests it,
    and folders are returned according to the caller’s permissions and applicable
    authorization rules.</p>
      <p> All folder operations (GET, POST, PUT, PATCH, DELETE, including recursive
    delete) are permission-checked per request against the caller's tenant authorization
    rules.</p>
servers:
- url: http://example.com/folders
  description: This is an example base URL.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Folder
  description: Contains the operations for the folder resource.
- name: Member
  description: Contains the operations for the folder member resource.
- name: Metainfo
  description: Contains the operations that retrieve information about folders (such
    as ancestors, types, and so on).
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level collections surfaced through
        this API. These top-level links include /folders and /ancestors.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/folderCollection"
              examples:
                json:
                  $ref: "#/components/examples/getFoldersResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/folderCollection"
              examples:
                json:
                  $ref: "#/components/examples/getFoldersResponse"
  /rootFolders:
    get:
      tags:
      - Folder
      summary: Get a list of root folders
      description: Returns a list of root folders. Standard paging, filtering, and
        sorting options are provided.
      operationId: getRootFolders
      parameters:
      - name: start
        in: query
        description: 0-based offset of first folder to return. The default value is
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of folders to return. The default value is 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned folders. See [Filtering in REST\
          \ APIs](https://developer.sas.com/rest-apis/folders-v6/docs/getting-started/usage-notes#filtering).\
          \ <br>Any member of the Folder object can be used to filter the results:\
          \ id, name, description, createdBy, modifiedBy, properties, type, or parent.\
          \ Date fields currently cannot be used to filter results."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort returned folder. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/folders-v6/docs/getting-started/usage-notes#sorting).<br>
          The default sort order is name:ascending. Other valid sorting options are
          <li><code>added</code> the timestamp when the item was added to the folder</li>
          <li><code>name</code> the folder name </ul>
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/folderCollection"
              examples:
                json:
                  $ref: "#/components/examples/getFoldersPagination"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/folderCollection"
              examples:
                json:
                  $ref: "#/components/examples/getFoldersPagination"
            application/json:
              schema:
                $ref: "#/components/schemas/folderCollection"
              examples:
                json:
                  $ref: "#/components/examples/getFoldersPagination"
        "400":
          description: The request was invalid. An invalid filter or combination of
            request parameters was provided.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
  /folders:
    get:
      tags:
      - Folder
      summary: Get a list of folders
      description: Returns a list of folders. Standard paging, filtering, and sorting
        options are provided. Only folders that the caller has read permission for
        are returned; a folder's type does not filter the response.
      operationId: getFolders
      parameters:
      - name: start
        in: query
        description: 0-based offset of first folder to return. The default value is
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of folders to return. The default value is 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned folders. See [Filtering in REST\
          \ APIs](https://developer.sas.com/rest-apis/folders-v6/docs/getting-started/usage-notes#filtering).\
          \ <br>Any member of the Folder object can be used to filter the results:\
          \ id, name, description, createdBy, modifiedBy, properties, type, or parent.\
          \ Date fields currently cannot be used to filter results. <br>Sample queries<br>\
          \ <ul> <li>Get Root Folders: `/folders?filter=isNull(parent)`</li> <li>Get\
          \ folders by name: `/folders?filter=contains(name, 'Sample')`</li> <li>Get\
          \ folders by type: `/folders?filter=in(type, 'history', 'favorites')`</li>\
          \ </ul>"
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort returned folder. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/folders-v6/docs/getting-started/usage-notes#sorting).<br>
          The default sort order is name:ascending. Other valid sorting options are
          <ul><li><code>orderNum</code> the order specified by the user</li> <li><code>added</code>
          the timestamp when the item was added to the folder</li> <li><code>name</code>
          the folder name </ul>
        schema:
          type: string
          format: sort-criteria
      - name: childUri
        in: query
        description: Return only folders containing a child member with the specified
          URI. For now, childUri, referenceUri, memberUri, and filter are mutually
          exclusive. The childUri has special semantics, because it should return
          only a single item. The URL form `/folders/.?childUri={resourceUri}` can
          be used to return a single item.
        schema:
          type: string
          format: relative URI
      - name: referenceUri
        in: query
        description: Return only folders containing a reference member with the specified
          URI. For now, childUri, referenceUri, memberUri, and filter are mutually
          exclusive.
        schema:
          type: string
          format: relative URI
      - name: memberUri
        in: query
        description: Return only folders containing any member with the specified
          URI. For now, childUri, referenceUri, memberUri, and filter are mutually
          exclusive.
        schema:
          type: string
          format: relative URI
      - name: optimizeAuthorizations
        x-sas-internal: true
        in: query
        description: Use the performance optimization that can reduce the number of
          authorizations needed to fill the request.  When used, the count attribute
          of the collection will not be returned for non-admin users unless all the
          members of the collection have been evaluated for authorization.
        schema:
          type: boolean
      - name: Accept-Language
        in: header
        description: Enumerates the languages that the client prefers to use for the
          response. This can be used to provide localized data where available.
        schema:
          type: string
      - name: Accept-Item
        in: header
        description: If provided, this should be an alternative media type that the
          service recognizes. If the media type is not one that the service can provide,
          a 406 response is returned.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/folderCollection"
              examples:
                json:
                  $ref: "#/components/examples/getFoldersPagination"
            application/json:
              schema:
                $ref: "#/components/schemas/folderCollection"
              examples:
                json:
                  $ref: "#/components/examples/getFoldersPagination"
        "400":
          description: The request was invalid. An invalid filter or combination of
            request parameters was provided.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
    post:
      tags:
      - Folder
      summary: Create a new folder
      description: Creates a new empty folder. Members can be added to the folder
        using the `/folders/{folderId}/members` endpoint. This service maintains name
        uniqueness at any given level in the folder structure. In other words, if
        you try to create a root folder named "newRootFolder", and a root folder with
        that name exists, the operation fails with a 409 status. If you try to create
        a subfolder using the `?parentFolderUri` parameter, and the parent already
        has a subfolder with the same name, the operation fails with a 409 status.
      operationId: createFolder
      parameters:
      - name: parentFolderUri
        in: query
        required: true
        description: URI of folder to add new folder as a child. This parameter is
          required. An explicit value of "none" indicates that the client wants to
          create a root folder.
        schema:
          type: string
          format: relative URI
      requestBody:
        $ref: "#/components/requestBodies/folderIncoming"
      responses:
        "201":
          description: A folder was created.
          headers:
            Location:
              description: The URI of the newly created folder.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/folder"
              examples:
                json:
                  $ref: "#/components/examples/createFolder"
            application/json:
              schema:
                $ref: "#/components/schemas/folder"
              examples:
                json:
                  $ref: "#/components/examples/createFolder"
        "400":
          description: The request was invalid. The parentFolderUri is not a valid
            folder, or does not exist. A malformed request body also returns this
            status.
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "404":
          description: No folder exists at the requested path.
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
  /folders/@item:
    patch:
      tags:
      - Folder
      summary: Move the child member for a resource to a folder specified by the parentFolderUri
      description: Move the child member for the resource specified by childUri to
        the folder specified by parentFolderUri.
      operationId: patchMoveFolderItem
      parameters:
      - name: childUri
        in: query
        description: The URI of a resource whose parent folder is to be changed.
        schema:
          type: string
      - name: parentFolderUri
        in: query
        description: The URI of the target folder to move the resource to.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The resource was moved to the new target
            folder and the new parent returned.
          headers:
            Last-Modified:
              description: the ISO8601 date string representing the timestamp of the
                last update to this folder.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/folder"
              examples:
                json:
                  $ref: "#/components/examples/getSingleFolder"
            application/json:
              schema:
                $ref: "#/components/schemas/folder"
              examples:
                json:
                  $ref: "#/components/examples/getSingleFolder"
        "400":
          description: The request was invalid. Either no path or childUri was provided
            in the request, or the request was not formatted correctly.
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "404":
          description: No resource with the given childUri was found as a child of
            any folder.
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
    get:
      tags:
      - Folder
      summary: Get a folder with a path or a child URI
      description: Get a folder with a resource wildcard. Either a path or a child
        URI is required. The result must be exactly one matching folder. If the childUri
        parameter is provided, the parent folder of the member with the matching URI
        is returned, if it exists. If the path is provided, it must be a slash-delimited
        path to the desired folder.
      operationId: getFolderItem
      parameters:
      - name: childUri
        in: query
        description: The URI of a resource whose parent folder you want to return.
          This can be a folder or non-folder resource.
        schema:
          type: string
      - name: path
        in: query
        description: The slash-delimited path to a folder. For example, `/root/child/grandchild/greatgrandchild`
          would return the folder greatgrandchild.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The folder was found and returned.
          headers:
            Last-Modified:
              description: the ISO8601 date string representing the timestamp of the
                last update to this folder.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/folder"
              examples:
                json:
                  $ref: "#/components/examples/getSingleFolder"
            application/json:
              schema:
                $ref: "#/components/schemas/folder"
              examples:
                json:
                  $ref: "#/components/examples/getSingleFolder"
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                json:
                  $ref: "#/components/examples/folderMemberResponse"
        "400":
          description: The request was invalid. Either no path or childUri was provided
            in the request, or the request was not formatted correctly.
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "404":
          description: No folder exists at the requested path. No folder that matches
            the criteria exists.
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
  "/folders/{folderId}":
    get:
      tags:
      - Folder
      summary: Get a folder
      description: Returns the specified folder.
      operationId: getFolder
      parameters:
      - name: folderId
        in: path
        description: The identifier of a specific folder or one of the delegate strings
          @myFolder, @appDataFolder, @myHistory, @myFavorites, or @public.
        required: true
        schema:
          type: string
          format: object-id
      - name: Accept-Language
        in: header
        description: Enumerates the languages that the client prefers to use for the
          response. This can be used to provide localized data where available.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The folder was returned.
          headers:
            Last-Modified:
              description: The RFC 1123 date string representing the timestamp of
                the last update to this folder.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/folder"
              examples:
                json:
                  $ref: "#/components/examples/getSingleFolder"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/folder"
              examples:
                json:
                  $ref: "#/components/examples/getSingleFolder"
            application/json:
              schema:
                $ref: "#/components/schemas/folder"
              examples:
                json:
                  $ref: "#/components/examples/getSingleFolder"
        "400":
          description: The request was invalid. An invalid delegate string was specified.
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "404":
          description: No folder exists at the requested path.
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
    head:
      tags:
      - Folder
      summary: Get a folder
      description: Returns the specified folder.
      operationId: headersForFolder
      parameters:
      - name: folderId
        in: path
        description: The identifier of a specific folder or one of the delegate strings
          @myFolder, @appDataFolder, @myHistory, @myFavorites, or @public.
        required: true
        schema:
          type: string
          format: object-id
      - name: Accept-Language
        in: header
        description: Enumerates the languages that the client prefers to use for the
          response. This can be used to provide localized data where available.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The folder was returned.
          headers:
            Last-Modified:
              description: The RFC 1123 date string representing the timestamp of
                the last update to this folder.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
        "400":
          description: The request was invalid. An invalid delegate string was specified.
        "404":
          description: No folder exists at the requested path.
    delete:
      tags:
      - Folder
      summary: Delete a folder
      description: >
        The specified folder is deleted. If the folder is not empty, a recursive
        option can be specified to indicate a recursive delete. If the folder is
        not empty and no recursive option is present, an error response is returned.
        Any non-folder content is not deleted.
      operationId: deleteFolder
      parameters:
      - name: folderId
        in: path
        description: The identifier of a specific folder or one of the delegate strings
          @myFolder, @appDataFolder, @myHistory, @myFavorites, or @public.
        required: true
        schema:
          type: string
          format: object-id
      - name: recursive
        in: query
        description: do a recursive delete of the folder
        schema:
          type: boolean
      responses:
        "204":
          description: The folder was deleted.
        "400":
          description: The request was invalid. The folder was not empty, and recursive=true
            was not specified.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "404":
          description: No folder exists at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. The folder has children, and recursive=true
            was not specified, or the folder contains non-folder children.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
    put:
      tags:
      - Folder
      summary: Update a folder
      description: |
        Replaces an existing folder.
      operationId: updateFolder
      parameters:
      - name: folderId
        in: path
        description: The identifier of a specific folder, or of one of the delegate
          strings @myFolder, @appDataFolder, @myHistory, @myFavorites, or @public.
        required: true
        schema:
          type: string
          format: object-id
      - name: If-Match
        in: header
        description: The ETag that was returned from a GET, POST, or PUT of this folder.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the lastModified date of the folder. If the folder
          has been updated since this time, the update fails.
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/folderIncoming"
      responses:
        "200":
          description: The request succeeded. The folder was updated.
          headers:
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this folder.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/folder"
              examples:
                json:
                  $ref: "#/components/examples/getSingleFolder"
            application/json:
              schema:
                $ref: "#/components/schemas/folder"
              examples:
                json:
                  $ref: "#/components/examples/getSingleFolder"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "404":
          description: No folder exists at the requested path.
          content:
            application/vnd.sas.content.folder+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resource's last modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
