    folderIn:
      title: Folder Schema
      description: The schema for creating a new folder.
      required:
      - name
      properties:
        name:
          type: string
          description: Localizable folder name.
        description:
          type: string
          description: Localizable folder description.
        type:
          type: string
          description: Specialized subtype for this folder. The default value is 'folder'.
            It is not a security or authorization control.
          default: folder
        parentFolderUri:
          type: string
          description: >
            The URI of this folder's parent folder. This is writable by the
            client. In order to perform a move, PUT this folder with an updated
            parentFolderUri pointing to the new parent. It is valid for this
            field to be null, which indicates a root folder.
