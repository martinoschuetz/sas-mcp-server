                  $ref: "#/components/examples/getFoldersPagination"
  /paths:
    post:
      tags:
      - Folder
      summary: Find an object by path
      description: Find an object, if it exists, by path. The client provides an ordered
        list of parent folder names, the object name, and the object content type
        and, if needed, the matching object type definition name (typeDefName). By
        default, returns a common summary representation of the object, but the client
        can request the full member representation of a subfolder or member object
        by using an appropriate Accept header.
      operationId: findByPath
      requestBody:
        content:
          application/vnd.sas.content.folder.path+json:
            schema:
              $ref: "#/components/schemas/path"
            examples:
              subfolder:
                $ref: "#/components/examples/findByPathSubfolderRequest"
              member:
                $ref: "#/components/examples/findByPathNonFolderMemberRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/path"
            examples:
              subfolder:
                $ref: "#/components/examples/findByPathSubfolderRequest"
              member:
                $ref: "#/components/examples/findByPathNonFolderMemberRequest"
        description: |
          The set of parent names, the object name, the object content type, and optionally,
          the object type definition name.
        required: true
      responses:
        "200":
          description: The object was found and returned in the requested representation.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                subfolder:
                  $ref: "#/components/examples/folderSummary"
                member:
                  $ref: "#/components/examples/folderMemberSummary"
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/member"
              examples:
                subfolder:
                  $ref: "#/components/examples/subfolderAsMemberRep"
                member:
                  $ref: "#/components/examples/nonFolderMemberAsMemberRep"
            application/json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                subfolder:
                  $ref: "#/components/examples/folderSummary"
                member:
                  $ref: "#/components/examples/folderMemberSummary"
        "400":
          description: The request was invalid. The request body was malformed or
            is absent.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "404":
          description: No object with the specified type exists at the requested path.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/vnd.sas.content.folder.member+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
  "/commons/catalog/folders/{folderId}":
    get:
      tags:
      - Folder
      summary: Return a metadata archive for the requested folder
      description: >
        This endpoint is used by the catalog service to retrieve information from
        a folder so that the members can be searched and displayed.
      operationId: getCatalogFolder
      parameters:
      - name: folderId
        in: path
        description: The identifier of the folder to catalog.
        schema:
          type: string
        required: true
      responses:
        "200":
          description: The request was successfully processed. The body contains the
            resulting metadata archive.
          content:
            application/vnd.sas.metadata.archive+json:
              schema:
                $ref: "#/components/schemas/metadataArchive"
              examples:
                json:
                  $ref: "#/components/examples/metadataArchiveResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/metadataArchive"
              examples:
                json:
                  $ref: "#/components/examples/metadataArchiveResponse"
  "/commons/validations/folders/{folderId}/members/{memberId}/name":
    put:
      tags:
      - Member
      summary: Validate that a member can be named or renamed to the given value without
        creating a conflict
      description: >
        This endpoint can be used by a client to test whether creating or
        renaming a member would create a naming conflict before actually
        attempting the operation. When creating a new member, a memberId of @new
        indicates that the attempted operation would create a new member, where
        a folderId of @root is a placeholder representing the root level of the
        folder hierarchy. For example,<br> PUT
        /commons/validations/folders/@root/members/@new/name?value=TestFolder1&type=folder<br>
        would check if one could successfully create a root folder named
        TestFolder1 and respond appropriately.<br> PUT
        /commons/validations/folders/@myFolder/members/@new/name?value=TestReport1&type=report<br>
        would check whether a new member named TestReport1 of type report could
        be added to the user's My Folder.
      operationId: validateMemberName
      parameters:
      - name: folderId
        in: path
        description: The identifier of the folder whose members are to be checked.
          A value of @root indicates checking a root-level folder, and type must be
          folder.
        required: true
        schema:
          type: string
      - name: memberId
        in: path
        description: If a rename is being attempted, the identifier of the member
          being renamed. If a new member is being created, the @new placeholder is
          used.
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: The name to be tested.
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: The type of the member to be tested. Members of the same type
          have to be named uniquely, so both the new name and type are required. The
          value of the type parameter should be the same as the type attribute returned
          in the summary representation of the underlying resource object.
        required: true
        schema:
          type: string
      - name: typeDefName
        in: query
        description: The Type definition name to test against. This must match exactly
          with the desired value. A null value is compared with null values in the
          repository. If the underlying reource object returns a typeDefName in the
          summary representation, that value should be provided.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request was successfully processed. The body contains the
            result, whether the name/type is acceptable.
          content:
            application/vnd.sas.validation+json:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                json:
                  $ref: "#/components/examples/validationTypeSuccessResponse"
        "204":
          description: The name is acceptable. The Accept header was application/json,
            so no further data is returned.
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "409":
          description: The supplied name would create a conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
components:
  requestBodies:
    folderIncoming:
      content:
        application/vnd.sas.content.folder+json:
          schema:
            $ref: "#/components/schemas/folderIn"
          examples:
            json:
              $ref: "#/components/examples/folderBody"
        application/json:
          schema:
            $ref: "#/components/schemas/folderIn"
          examples:
            json:
              $ref: "#/components/examples/folderBody"
      description: Folder
    memberIn:
      content:
        application/vnd.sas.content.folder.member+json:
          schema:
            $ref: "#/components/schemas/memberIn"
          examples:
            json:
              $ref: "#/components/examples/folderMemberBody"
        application/json:
          schema:
            $ref: "#/components/schemas/memberIn"
          examples:
            json:
              $ref: "#/components/examples/folderMemberBody"
      description: Member
  schemas:
    baseCollection:
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header can be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    errorResponse:
      title: "Error"
      description: "The representation of an error."
      type: object
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The error message.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred
          items:
            $ref: "#/components/schemas/errorResponse"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    link:
      title: "Link"
      description: "A link to a related operation or resource."
      properties:
        method:
          type: string
          description: The HTTP method to invoke this endpoint.
        rel:
          type: string
          description: The relationship of this URL to the object.
        uri:
          type: string
          description: The relative URI of the REST endpoint.
        href:
          type: string
          description: The full URL of the REST endpoint.
        type:
          type: string
          description: The media type consumed/produced.
    summary:
      title: Resource Summary
      description: The summarized representation of a resource. Often used in collection
        responses when more specific details are not needed.
      required:
      - id
      - links
      - version
      properties:
        id:
          type: string
          description: The unique identifier for the resource.
        name:
          type: string
          description: The name of the resource.
        type:
          type: string
          description: The type of the resource.
        description:
          type: string
          description: The description of the resource.
        createdBy:
          type: string
          description: The user who created the resource.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp in YYYY-MM-DDThh:mm:ss.sssZ format when the resource
            was created.
        modifiedBy:
          type: string
          description: The user who most recently modified the resource.
        modifiedTimeStamp:
          type: string
