  "/folders/{folderId}/members":
    get:
      tags:
      - Member
      summary: Get a list of folder members
      description: >
        Returns a list of folder members. Standard paging, filtering, and
        sorting options are available. The media type of the returned collection
        items is application/vnd.sas.content.folder.member. Default sorting for
        this collection is name:ascending, unless the folder is of the history
        folder type. Default sorting for history folders is added:descending,
        which orders the elements starting with the most recently added.
      operationId: getFolderMembers
      parameters:
      - name: folderId
        in: path
        description: The identifier of a specific folder, or of one of the delegate
          strings @myFolder, @appDataFolder, @myHistory, @myFavorites, or @public.
        required: true
        schema:
          type: string
          format: object-id
      - name: start
        in: query
        description: Offset of first member to return. The default value is 0.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Maximum number of members to return. The default value is 20.
        schema:
          type: integer
          format: int64
      - name: filter
        in: query
        description: "Filter criteria for returned members. See [Filtering in REST\
          \ APIs](https://developer.sas.com/rest-apis/folders-v6/docs/getting-started/usage-notes#filtering).\
          \ For example, you can filter for a member with a given name as a way to\
          \ test if a folder already has a member with that name: <code>?filter=eq(name,\
          \ 'bobsyouruncle')</code>"
        schema:
          type: string
      - name: sortBy
        in: query
        description: Sort returned collection of members. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/folders-v6/docs/getting-started/usage-notes#sorting).
          The member collection can be sorted by folders first by using sortBy=eq(contentType,'folder'):descending
          Use :ascending to soft by folders last. Specifying sortBy=eq(contentType,'folder'):descending,name:ascending,type:ascending
          sorts by folders first, then by name, then by type.
        schema:
          type: string
      - name: recursive
        in: query
        description: If true, the members of the requested folder, plus all of its
          descendants, are returned in a flat list (no order is guaranteed). Reference
          members that refer to folders are not followed unless the followReferences
          parameter is true. The default value of this parameter is false.
        schema:
          type: boolean
      - name: followReferences
        in: query
        description: If true, references to other folders are followed when returning
          the recursive list of members. If recursive is false, then the value of
          this parameter is meaningless. The default value of this parameter is false.
        schema:
          type: boolean
      - name: Accept-Item
        in: header
        description: If provided, this should be an alternative media type that the
          service recognizes. If the media type is not one that the service can provide,
          a 406 response is returned. Valid media types for the member collection
          are application/vnd.sas.content.folder.member+json (default), application/vnd.sas.content.folder.member.summary+json
          (an abbreviated format that provides fewer links, but better performance),
          and application/vnd.sas.summary+json (a standard summary representation).
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: Enumerates the languages that the client prefers to use for the
          response. This can be used to provide localized data where available.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. A list of folder members was returned.
          headers:
            Content-Type:
              description: The content type of the response (application/vnd.sas.collection+json)
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/memberCollection"
              examples:
                json:
                  $ref: "#/components/examples/memberCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/memberCollection"
              examples:
                json:
                  $ref: "#/components/examples/memberCollection"
        "400":
          description: The request was invalid. An invalid filter or combination of
            request parameters was provided.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
        "404":
          description: No folder exists at the requested path.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/errorResponse"
    head:
