---
openapi: 3.0.3
info:
  title: Thumbnails
  description: >
    Provides representation of SAS objects, often images. Engages with Report
    Images and other thumbnail providers.
    All GET operations have a corresponding HEAD which is identical in all respects
    except a response body is not returned.

    Version 2 introduces "/overrides", the ability for customers to override
    specific object's thumbnail.

    Version 3 introduces "/configuration", to return processed configuration information
    which the client needs
    (currently this is in support of "/overrides" needs).
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
  version: "3"
tags:
- name: Registrations
  description: The operations for integrating thumbnail providers with the thumbnails
    service.
- name: Jobs
  description: The operations for the jobs resource.
- name: Override
  description: Thumbnail override.
- name: Root
  description: The operations for the root resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: >
        Returns the links to the top-level resources for the API.  The link relations
        are:
        "createJob", "bulkCreateJobs", "defaultThumbnails", "configuration", "createRegistrations",
        "getRegistrations", "createOverride", and "thumbnailOverrides".  The 2 "registration"
        oriented
        links are restricted to administrator and other services and are not expected
        to be used by customers.
        The two "override" links are by default restricted to the administrator and
        were added in version
        2 of this API.  "configuration" is new with version 3 of this API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root links:
                  $ref: "#/components/examples/root_links"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root links:
                  $ref: "#/components/examples/root_links"
  /configuration:
    get:
      tags:
      - Override
      summary: Get the configuration for the API
      description: Returns the processed configuration for the API which a client
        might need to know.
      operationId: getConfiguration
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.thumbnails.configuration+json:
              schema:
                $ref: "#/components/schemas/configuration"
              examples:
                root links:
                  $ref: "#/components/examples/configuration"
            application/json:
              schema:
                $ref: "#/components/schemas/configuration"
              examples:
                root links:
                  $ref: "#/components/examples/configuration"
    head:
      tags:
      - Override
      summary: Existance check of the configuration for the API
      description: Returns the processed configuration for the API which a client
        might need to know.
      operationId: headersForConfiguration
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.thumbnails.configuration+json:
              schema:
                $ref: "#/components/schemas/configuration"
              examples:
                root links:
                  $ref: "#/components/examples/configuration"
            application/json:
              schema:
                $ref: "#/components/schemas/configuration"
              examples:
                root links:
                  $ref: "#/components/examples/configuration"
  /defaultThumbnails:
    get:
      tags:
      - Root
      summary: Default thumbnails
      description: Collection of default thumbnails which can safely be cached. Items
        will be of type `application/vnd.sas.thumbnails.default`.
      operationId: getDefaultThumbnails
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/defaultThumbnails"
              examples:
                default thumbnails:
                  $ref: "#/components/examples/default_thumbnails"
            application/json:
              schema:
                $ref: "#/components/schemas/defaultThumbnails"
              examples:
                default thumbnails:
                  $ref: "#/components/examples/default_thumbnails"
  /defaultThumbnail.svg:
    get:
      tags:
      - Root
      summary: Default default thumbnail
      description: The thumbnail to use when a provider cannot be located.
      operationId: getDefaultThumbnail
      responses:
        "200":
          description: The default image (Note that caching headers are returned encouraging
            the browser to cache this image).
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
              examples:
                default thumbnail:
                  $ref: "#/components/examples/defaultThumbnail"
  /registrations:
    get:
      tags:
      - Registrations
      summary: Get the collection of thumbnail provider registrations
      description: Returns a collection of thumbnail provider registrations.
      operationId: getRegistrations
      responses:
        "200":
          description: The collection of thumbnail provider registrations.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/thumbnailProviderRegistrations"
              examples:
                get registrations:
                  value:
                    $ref: "#/components/examples/getRegistrations"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailProviderRegistrations"
              examples:
                get registrations:
                  $ref: "#/components/examples/getRegistrations"
        "403":
          description: Forbidden. This is a restricted resource, most users are not
            allowed.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                get registrations:
                  value:
                    $ref: "#/components/examples/getRegistrationsDenied"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                get registrations:
                  value:
                    $ref: "#/components/examples/getRegistrationsDenied"
    post:
      tags:
      - Registrations
      summary: Create, update, and delete thumbnail provider registrations for a service
      description: Create, update, and delete thumbnail provider registrations. The
        expectation is that this call will almost always be made by the thumbnails-bootstrap
        jar on behalf of the service that is providing thumbnail support. By default
        this endpoint is restricted to the internal application user (group `sasapp`),
        or administrators.
      operationId: createRegistrations
      requestBody:
        content:
          application/vnd.sas.thumbnails.registrations+json:
            schema:
              $ref: "#/components/schemas/registrations"
            examples:
              asyncRegistration:
                $ref: "#/components/examples/requestThumbnailProviderRegistrationReportImages"
              defaultOnlyRegistration:
                $ref: "#/components/examples/requestThumbnailProviderRegistrationDefaultOnly"
          application/json:
            schema:
              $ref: "#/components/schemas/registrations"
            examples:
              asyncRegistration:
                $ref: "#/components/examples/requestThumbnailProviderRegistrationReportImages"
              defaultOnlyRegistration:
                $ref: "#/components/examples/requestThumbnailProviderRegistrationDefaultOnly"
        description: An array of one to many thumbnail provider registrations.
        required: true
      responses:
        "200":
          description: No new registrations were added, no existing registrations
            were updated, and no existing registrations were deleted.
          content:
            application/vnd.sas.app.thumbnails.registrations.result+json:
              schema:
                $ref: "#/components/schemas/registrationsResult"
              examples:
                typical, unchanged:
                  $ref: "#/components/examples/postRegistrationUnchanged"
            application/json:
              schema:
                $ref: "#/components/schemas/registrationsResult"
              examples:
                typical, unchanged:
                  $ref: "#/components/examples/postRegistrationUnchanged"
        "201":
          description: At least one of these occurred - a new registrations was added,
            an existing registration was updated, or an existing registration was
            deleted.
          content:
            application/vnd.sas.app.thumbnails.registrations.result+json:
              schema:
                $ref: "#/components/schemas/registrationsResult"
              examples:
                single add:
                  $ref: "#/components/examples/postRegistrationSingleAdd"
                add, delete, modify:
                  $ref: "#/components/examples/PostRegistrationAddDeleteModify"
            application/json:
              schema:
                $ref: "#/components/schemas/registrationsResult"
              examples:
                single add:
                  $ref: "#/components/examples/postRegistrationSingleAdd"
                add, delete, modify:
                  $ref: "#/components/examples/PostRegistrationAddDeleteModify"
        "400":
          description: The caller provided incorrect data, such as an empty array
            of registration instances, or a registration was missing required fields
            or contained invalid values for enum fields.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalid request body:
                  $ref: "#/components/examples/postRegistrationError"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalid request body:
                  $ref: "#/components/examples/postRegistrationError"
        "403":
          description: Forbidden. This is a restricted resource, most users are not
            allowed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationsDenied"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationsDenied"
  "/registrations/{registrationId}":
    get:
      tags:
      - Registrations
      summary: Return a specified registration
      description: Returns a single registration.
      operationId: getRegistration
      parameters:
      - name: registrationId
        in: path
        description: The thumbnail provider registration to return.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/vnd.sas.thumbnails.registration+json:
              schema:
                $ref: "#/components/schemas/thumbnailProviderRegistration"
              examples:
                get registration:
                  $ref: "#/components/examples/getRegistration"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailProviderRegistration"
              examples:
                get registration:
                  $ref: "#/components/examples/getRegistration"
        "403":
          description: Forbidden. This is a restricted resource, most users are not
            allowed.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationsDenied"
            "application/json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationsDenied"
        "404":
          description: Not found.
          content:
            application/vnd.sas.thumbnails.registration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationNotFound"
    head:
      tags:
      - Registrations
      summary: Existence check for a registration
      description: Existence check for a registration.
      operationId: headersForRegistration
      parameters:
      - name: registrationId
        in: path
        description: The thumbnail provider registration to return.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/vnd.sas.thumbnails.registration+json:
              schema:
                $ref: "#/components/schemas/thumbnailProviderRegistration"
              examples:
                get registration:
                  $ref: "#/components/examples/getRegistration"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailProviderRegistration"
              examples:
                get registration:
                  $ref: "#/components/examples/getRegistration"
        "403":
          description: Forbidden. This is a restricted resource, most users are not
            allowed.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationsDenied"
            "application/json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationsDenied"
        "404":
          description: Not found.
          content:
            application/vnd.sas.thumbnails.registration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationNotFound"
    delete:
      tags:
      - Registrations
      summary: Delete a specified registration
      description: Deletes a registration.
      operationId: deleteRegistration
      parameters:
      - name: registrationId
        in: path
        description: The registration to delete.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Delete successful.
        "403":
          description: Forbidden. This is a restricted resource, most users are not
            allowed.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationsDenied"
            "application/json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not authorized:
                  $ref: "#/components/examples/getRegistrationsDenied"
  /jobs:
    post:
      summary: Create one or multiple thumbnail job
      description: >
        This operation can be used to create a single thumbnail job, or multiple,
        based on the input received.


        The original functionality receives a request body for a single thumbnail
        job, either media type
        "application/vnd.sas.thumbnails.job.request+json" or "application/json".


        Version 2 of this API introduces media type "application/vnd.sas.thumbnails.bulk.job.request+json"
        for creating multiple jobs.  This request body is nearly identical to the
        single request,
        except that rather than "resourceUri" and "resourceType" is an array of these
        data.  The motive
        for this bulk creation is common usage in clients needs to create a number
        of jobs at the same time and
        this bulk operation cuts down on initial message traffic.


        The return for the bulk operation is a collection of jobs, in the same order
        as "resources" specifies.
        Hereafter each job is independent.  Each may already be complete or running
        asynchronously.  Note per
        standards, the http status of a bulk operation is either 202 (at least one
        job is still running), 400
        (all failed), or 200 otherwise.
      operationId: createJob
      tags:
      - Jobs
      parameters:
      - name: Accept-Locale
        in: header
        required: false
        description: SAS header for specifying a "format locale" distinct from the
          user's language (Accept-Language).  Usage and syntax is similar to https://tools.ietf.org/html/rfc7231#section-5.3.5
        schema:
          type: string
      - name: wait
        in: query
        required: false
        description: This service implements "long poll", how long to wait for an
          update before returning anyway, in floating point seconds. The maximum is
          30 seconds.
        schema:
          type: number
          format: float
          default: 0.5
      - name: ignoreOverride
        in: query
        required: false
        description: >
          If there is an override image configured for resourceUri, the override is
          normally
          returned.  Specifying true for ignoreOverride prevents the override from
          being used
          and the thumbnail request proceeds "normally".
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/vnd.sas.thumbnails.job.request+json:
            schema:
              $ref: "#/components/schemas/thumbnailRequest"
            examples:
              typical:
                $ref: "#/components/examples/requestCreateJob"
          application/json:
            schema:
              $ref: "#/components/schemas/thumbnailRequest"
            examples:
              typical:
                $ref: "#/components/examples/requestCreateJob"
          application/vnd.sas.thumbnails.bulk.job.request+json:
            schema:
              $ref: "#/components/schemas/bulkJobRequest"
            examples:
              bulkJobRequest:
                $ref: "#/components/examples/requestCreateJobBulk"
        description: The representation of a thumbnail job.
        required: true
      responses:
        "200":
          description: >
            A positive response for a "bulk" job creation.  All jobs are either complete
            or in error state.  Note
            this will only be media type "application/vnd.sas.collection+json".  "application/json"
            is part of the
            "create one thumbnail job" use case.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/bulkJobResponseCollection"
              examples:
                bulk job creation:
                  $ref: "#/components/examples/bulk_job_create"
        "201":
          description: A (single) thumbnail job was created and has completed.
          headers:
            Location:
              description: The URL of the thumbnail job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                completed job:
                  $ref: "#/components/examples/completed_job"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                completed job:
                  $ref: "#/components/examples/completed_job"
        "202":
          description: one or more thumbnail job was accepted; the job is not yet
            complete.
          headers:
            Location:
              description: The URL of the thumbnail job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                running job:
                  $ref: "#/components/examples/running_job"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                running job:
                  $ref: "#/components/examples/running_job"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/bulkJobResponseCollection"
              examples:
                bulk job creation:
                  $ref: "#/components/examples/bulk_job_create"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error job:
                  $ref: "#/components/examples/job_with_error"
                bulk job complete failure:
                  $ref: "#/components/examples/bulk_job_create_fail"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error job:
                  $ref: "#/components/examples/job_with_error"
                bulk job complete failure:
                  $ref: "#/components/examples/bulk_job_create_fail"
  "/jobs/{thumbnailJobId}":
    get:
      summary: Get a thumbnail job
      description: Returns the representation of the specified thumbnail job.
      operationId: getJob
      tags:
      - Jobs
      parameters:
      - name: thumbnailJobId
        in: path
        required: true
        description: The unique identifier for the thumbnail job.
        schema:
          type: string
      - name: wait
        in: query
        required: false
        description: This service implements "long poll", how long to wait for an
          update before returning anyway, in floating point seconds. The maximum is
          30 seconds.
        schema:
          type: number
          format: float
          default: 0.5
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                completed job:
                  $ref: "#/components/examples/completed_job"
                running job:
                  $ref: "#/components/examples/running_job"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                completed job:
                  $ref: "#/components/examples/completed_job"
                running job:
                  $ref: "#/components/examples/running_job"
        "404":
          description: No thumbnail job exists at the requested path.
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/error_job_not_found"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/error_job_not_found"
    head:
      summary: Existance check for a job
      description: Existance check for a job.
      operationId: headersForJob
      tags:
      - Jobs
      parameters:
      - name: thumbnailJobId
        in: path
        required: true
        description: The unique identifier for the thumbnail job.
        schema:
          type: string
      - name: wait
        in: query
        required: false
        description: This service implements "long poll", how long to wait for an
          update before returning anyway, in floating point seconds. The maximum is
          30 seconds.
        schema:
          type: number
          format: float
          default: 0.5
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                completed job:
                  $ref: "#/components/examples/completed_job"
                running job:
                  $ref: "#/components/examples/running_job"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailJob"
              examples:
                completed job:
                  $ref: "#/components/examples/completed_job"
                running job:
                  $ref: "#/components/examples/running_job"
        "404":
          description: No thumbnail job exists at the requested path.
          content:
            application/vnd.sas.thumbnails.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/error_job_not_found"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/error_job_not_found"
  /overrides:
    post:
      summary: Create thumbnail override
      description: >
        Create the override.  NOTE CAREFULLY, this will include a system generated
        ID.
        While there is both a "get all" (collection) and "get one", the "get all"
        operation
        includes an important use case - the ability to specify the URI of the object
        which
        is overridden.

        Initially restricted to administrators, this operation is now (2025.05) supported
        for any use with write
        permission to (objectUri).

        The override is constrained, by default, to be a relative path. **Configuration
        options**
        are available:

        - "thumbnailOverrideUnconstrained" [false] - If true, then the override URI
        can reference any location.

        - "thumbnailOverridePrefix" ["/"] - Unless overrides are unconstrained, then
        the thumbnail URI must begin with this prefix.
             This value MAY BE a CSV list, e.g. "/,https:/my.company.com/imageserver".

        - "thumbnailOverrideSizeLimit" [1000000] - The maximum size of a thumbnail.
      operationId: createOverride
      tags:
      - Override
      requestBody:
        content:
          application/vnd.sas.thumbnails.override+json:
            schema:
              $ref: "#/components/schemas/thumbnailOverride"
            examples:
              relativePath:
                $ref: "#/components/examples/requestOverrideExample1"
              absolutePath:
                $ref: "#/components/examples/requestOverrideExample2"
          application/json:
            schema:
              $ref: "#/components/schemas/thumbnailOverride"
            examples:
              relativePath:
                $ref: "#/components/examples/requestOverrideExample1"
              absolutePath:
                $ref: "#/components/examples/requestOverrideExample2"
        description: A thumbnail override definition
        required: true
      responses:
        "201":
          description: the override was successfully created.
          headers:
            Location:
              description: the URL of the created override
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.thumbnails.override+json:
              schema:
                $ref: "#/components/schemas/thumbnailOverride"
              examples:
                create override response:
                  $ref: "#/components/examples/thumbnail_override"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailOverride"
              examples:
                create override response:
                  $ref: "#/components/examples/thumbnail_override"
        "400":
          description: the request was invalid
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request - cannot read override:
                  $ref: "#/components/examples/overrides400-1"
                bad request - override is not "relative":
                  $ref: "#/components/examples/overrides400-2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request - cannot read override:
                  $ref: "#/components/examples/overrides400-1"
                bad request - override is not "relative":
                  $ref: "#/components/examples/overrides400-2"
        "409":
          description: >
            conflict - the objectUri already has an override.  NOTE: a "self" link
            to it is returned, allowing the
            caller to examine it, retrieve its eTag and possibly update it (via PUT).
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                conflict, the object URI already has an override:
                  $ref: "#/components/examples/overrides409"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                conflict, the object URI already has an override:
                  $ref: "#/components/examples/overrides409"
    get:
      summary: Get overrides
      description: >
        Collection of overrides.  Standard filtering is supported.

        Initially restricted to administrators, this operation is now (2025.05) supported
        for any use with write
        permission to (objectUri).
      operationId: getOverrides
      tags:
      - Override
      parameters:
      - name: filter
        in: query
        description: >
          Optional filter, standard sas filtering.  This can be helpful if desiring
          to know which, if any, of multiple
          objects have an override.  For example:

          in(objectUri,'/reports/reports/c4858e05-fea6-41ba-a492-354973a18c4c','/reports/reports/304e1c18-43e1-4081-8924-1b80f2b00272')
        schema:
          type: string
      - name: objectUri
        in: query
        description: >
          Return only the override for this objectUri.  This is a convenience for:

          filter=eq(objectUri,'<objectUri>')   (substituting the supplied value for
          <objectUri>)
        schema:
          type: string
      responses:
        "200":
          description: The collection of overrides.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/overrideRegistrations"
              examples:
                overrides collection:
                  $ref: "#/components/examples/overrides"
            application/json:
              schema:
                $ref: "#/components/schemas/overrideRegistrations"
              examples:
                overrides collection:
                  $ref: "#/components/examples/overrides"
  /overrides/{overrideId}:
    get:
      summary: Get override
      description: >
        Get the override BY ID.  Note if desiring the override for a particular source
        object, instead
        use "GET /thumbnails/overrides?objectUri={objectUri}" .

        Initially restricted to administrators, this operation is now (2025.05) supported
        for any use with write
        permission to (objectUri).
      operationId: getOverride
      tags:
      - Override
      parameters:
      - name: overrideId
        in: path
        description: the override ID to get
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag
        schema:
          type: string
      responses:
        "200":
          description: the override
          headers:
            ETag:
              description: the ETag for this override; required for PUT.
              schema:
                type: string
          content:
            application/vnd.sas.thumbnails.override+json:
              schema:
                $ref: "#/components/schemas/thumbnailOverride"
              examples:
                thumbnail override:
                  $ref: "#/components/examples/thumbnail_override"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailOverride"
              examples:
                thumbnail override:
                  $ref: "#/components/examples/thumbnail_override"
        "304":
          description: Not Modified - client's cached version is current
          headers:
            ETag:
              description: the ETag for this override; required for PUT.
              schema:
                type: string
        "404":
          description: not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/overrides404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/overrides404"
    head:
      summary: Existence check for override
      description: >
        Existence check for an override.  Note if desiring the override for a particular
        source object, instead
        use "GET /thumbnails/overrides?objectUri={objectUri}" .
      operationId: headersForOverride
      tags:
      - Override
      parameters:
      - name: overrideId
        in: path
        description: the override ID to get
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag
        schema:
          type: string
      responses:
        "200":
          description: the override
          headers:
            ETag:
              description: the ETag for this override; required for PUT.
              schema:
                type: string
          content:
            application/vnd.sas.thumbnails.override+json:
              schema:
                $ref: "#/components/schemas/thumbnailOverride"
              examples:
                thumbnail override:
                  $ref: "#/components/examples/thumbnail_override"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailOverride"
              examples:
                thumbnail override:
                  $ref: "#/components/examples/thumbnail_override"
        "304":
          description: Not Modified - client's cached version is current
          headers:
            ETag:
              description: the ETag for this override; required for PUT.
              schema:
                type: string
        "404":
          description: not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/overrides404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/overrides404"
    put:
      summary: Update override
      description: Update the specified override.
      operationId: updateOverride
      tags:
      - Override
      parameters:
      - name: overrideId
        in: path
        description: the override ID to update
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: ETag
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.thumbnails.override+json:
            schema:
              $ref: "#/components/schemas/thumbnailOverride"
            examples:
              relativePath:
                $ref: "#/components/examples/requestOverrideExample1"
              absolutePath:
                $ref: "#/components/examples/requestOverrideExample2"
          application/json:
            schema:
              $ref: "#/components/schemas/thumbnailOverride"
            examples:
              relativePath:
                $ref: "#/components/examples/requestOverrideExample1"
              absolutePath:
                $ref: "#/components/examples/requestOverrideExample2"
        description: A thumbnail override definition
        required: true
      responses:
        "200":
          description: the override was updated.
          headers:
            ETag:
              description: the updated ETag for this override.
              schema:
                type: string
          content:
            application/vnd.sas.thumbnails.override+json:
              schema:
                $ref: "#/components/schemas/thumbnailOverride"
              examples:
                thumbnail override:
                  $ref: "#/components/examples/thumbnail_override"
            application/json:
              schema:
                $ref: "#/components/schemas/thumbnailOverride"
              examples:
                thumbnail override:
                  $ref: "#/components/examples/thumbnail_override"
        "400":
          description: the request was invalid
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request - cannot read override:
                  $ref: "#/components/examples/overrides400-1"
                bad request - override is not "relative":
                  $ref: "#/components/examples/overrides400-2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request - cannot read override:
                  $ref: "#/components/examples/overrides400-1"
                bad request - override is not "relative":
                  $ref: "#/components/examples/overrides400-2"
        "404":
          description: not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/overrides404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/overrides404"
        "412":
          description: precondition failed - caller's If-Match header is incorrect
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/overrides412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/overrides412"
        "428":
          description: precondition required - missing required If-Match header
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/overrides428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                not found:
                  $ref: "#/components/examples/overrides428"
    delete:
      summary: Delete override
      description: Delete the override.
      operationId: deleteOverride
      tags:
      - Override
      parameters:
      - name: overrideId
        in: path
        description: the override ID to get
        required: true
        schema:
          type: string
      responses:
        "204":
          description: no content
servers:
- url: http://example.com/thumbnails
  description: Sample server URL.
components:
  schemas:
    registrations:
      title: Registration
      description: A collection of registration objects.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.registrations
        version: "1"
      properties:
        registrations:
          type: array
          description: An array of 1 to many thumbnail provider registrations.
          items:
            $ref: "#/components/schemas/thumbnailProviderRegistration"
    registrationsResult:
      title: Registration Result
      description: Results of a registrations POST.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.registrations.result
        version: "1"
      properties:
        addedIds:
          type: array
          description: An array of the ids of registered thumbnail providers that
            were added.
          items:
            type: string
            description: The id of a newly registered thumbnail provider.
        updatedIds:
          type: array
          description: An array of the ids of registered thumbnail providers that
            were updated.
          items:
            type: string
            description: The id of an updated registered thumbnail provider.
        deletedIds:
          type: array
          description: An array of the ids of registered thumbnail providers that
            were deleted.
          items:
            type: string
            description: The id of a deleted registered thumbnail provider.
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 1.
    thumbnailProviderRegistrations:
      title: Thumbnail Provider Registration Collection
      description: A collection of thumbnail provider registrations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: An array of `application/vnd.sas.thumbnails.registration+json`
              representations.
            items:
              $ref: "#/components/schemas/thumbnailProviderRegistration"
    thumbnailProviderRegistration:
      title: Thumbnail Provider Registration
      description: A full representation of a thumbnail provider registration.
      required:
      - id
      - serviceName
      - providerContractType
      - thumbnailJobUri
      - defaultThumbnailImageUri
      - defaultThumbnailImageMediaType
      - sasTypes
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.registration
        version: "1"
      properties:
        id:
          type: string
          description: The unique ID for this registration.
        serviceName:
          type: string
          description: The name of the service this registration pertains to, used
            in log and error messages.
        providerContractType:
          type: string
          description: The contract the provider conforms to. 'defaultOnly' means
            this provider only provides a default thumbnail. 'asynchronous' means
            this provider may not respond to a request to generate a thumbnail in
            a timely fashion and needs the flexibility of an asynchronous job pattern.
            'synchronous' means this provider expects to respond to a request to generate
            a thumbnail and does not need the flexibility of an asynchronous job pattern.
          enum:
          - defaultOnly
          - asynchronous
          - synchronous
        thumbnailJobUri:
          type: string
          description: The URI to POST a request for a thumbnail.
        defaultThumbnailImageUri:
          type: string
          description: The URI to GET a request for a thumbnail. This is expected
            to return an image of some sort.
        defaultThumbnailImageMediaType:
          type: string
          description: The media type of the default thumbnail image, e.g. "image/png",
            "image/svg+xml", ...
        defaultThumbnailSasThemesIconKey:
          type: string
          description: The SAS Theme/fonts key for the default thumbnail image, allowing
            for theme-based images of the default thumbnail image.
        sasTypes:
          type: array
          description: An array of the types the provider's service supports, at least
            one is required.
          items:
            type: string
            description: The name of a type supported by the provider's service.
        providerPriority:
          type: integer
          format: int32
          description: If more than one provider is able to provide a thumbnail for
            a specific type, which should be used? Lower numbers get preferential
            treatment. Default value is 100.
        action:
          type: string
          description: In registrations POSTs, allows a provider to delete a previously
            added registration if set to 'delete'. Defaults to 'add'.
          enum:
          - add
          - delete
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 1.
        links:
          type: array
          description: link relations "self" and "delete" are returned from GET.
          items:
            $ref: "#/components/schemas/link"
    defaultThumbnails:
      description: A collection of default thumbnails.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The default thumbnails.
            items:
              $ref: "#/components/schemas/defaultThumbnail"
    defaultThumbnail:
      title: Default Thumbnail
      description: Represents a default thumbnail for a SAS type.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.default
        version: "1"
      properties:
        type:
          type: string
          description: The SAS type.
        defaultThumbnailSasThemesIconKey:
          type: string
          description: SAS internal key for this icon.
        link:
          $ref: "#/components/schemas/link"
        defaultOnly:
          type: boolean
          description: Is this a 'defaultOnly' registration? If so, client can short-circuit
            requests for this type of object and need not ask for individual thumbnails.
          default: false
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 1.
    bulkJobRequest:
      title: Bulk Job Request
      description: >
        Represents a request for multiple thumbnail jobs.  Note, this is the same
        as a single
        job request, except instead of "resourceUri" and "resourceType" there is "resources".
        Each job will have the same characteristics (size, detailLevel, ...) except
        that each is
        for a different resource.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.bulk.job.request
        version: "1"
      required:
      - resources
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/resource"
        acceptItem:
          type: string
          description: >
            A media type string listing acceptable media types, possibly with quality
            values. Example:
            "image/*,text/plain;q=0.9,text/csv;q=0.8".
        detailLevel:
          type: string
          description: The expected level of detail. (default is "low")
          default: "low"
          enum:
          - low
          - high
        scope:
          type: string
          description: Whether a single element is to be represented, or the entire
            page. (default is "element")
          default: "element"
          enum:
          - element
          - page
        returnMultiple:
          type: boolean
          description: Whether a single thumbnail is to be returned (false) or multiple
            thumbnails (true). (default is false)
          default: false
        refresh:
          type: boolean
          description: Whether the freshest possible result is requested. (default
            is false)
          default: false
        sizingOptions:
          $ref: "#/components/schemas/sizingOptions"
        accessibilityOptions:
          $ref: "#/components/schemas/accessibilityOptions"
        themeId:
          type: string
          description: The client's current theme.
        pagingOptions:
          $ref: "#/components/schemas/pagingOptions"
        version:
          type: integer
          format: int32
          description: The version number of the bulk thumbnail job request representation.
            This representation is version 1.
    resource:
      title: single resource of a bulk request
      description: >
        A single resource of a bulk request.  "resourceUri" is required, "resourceType"
        is recommended.  If not supplied,
        the service will query the object to determine its type so as to dispatch
        to an appropriate thumbnail provider.
      required:
      - resourceUri
      properties:
        resourceUri:
          type: string
          description: URI to the resource for which a thumbnail is needed
        resourceType:
          type: string
          description: The SAS type of the resource for which the thumbnail is needed.
    bulkJobResponseCollection:
      title: jobs created from a bulk request
      description: >
        Jobs created from a bulk request.  Each are exactly as if created by a single
        job.  Since a job can contain an error object, if there's an error in the
        creation, e.g. missing required parameter, the error will be in the job
        object.  This collection is guaranteed to be the same size as the requesting
        bulk request, and in the same order.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: An array of `application/vnd.sas.thumbnails.registration+json`
              representations.
            items:
              $ref: "#/components/schemas/thumbnailJob"
    thumbnailOverride:
      title: thumbnail override
      description: Thumbnail override definition.
      required:
      - objectUri
      - thumbnailOverrideUri
      - overrideContentType
      properties:
        id:
          type: string
          description: >
            The unique ID for this override.  This will always be present
            for returned definitions; it is ignored for POST, required for PUT.
        objectUri:
          type: string
          description: the URI to the object to be overridden
        thumbnailOverrideUri:
          type: string
          description: the image to show
        overrideContentType:
          type: string
          format: mime type
          description: >
            The mime type of thumbnailOverrideUri.  Must start with "image/", and
            must
            be specific.  When the override is returned, this value populates the
            "Content-Type" response header.  Valid examples: "image/png", "image/svg+xml".
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 1.
        links:
          type: array
          description: link relations "self", "update", and "delete", subject to security.
          items:
            $ref: "#/components/schemas/link"
    overrideRegistrations:
      title: Override registrations collection
      description: A collection of thumbnail overrides.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: An array of `application/vnd.sas.thumbnails.override+json`
              representations.
            items:
              $ref: "#/components/schemas/thumbnailOverride"
    configuration:
      title: Configuration
      description: Configuration details that the client might need.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.configuration
        version: "1"
      properties:
        overrideUnconstrained:
          type: boolean
          description: Typically false, is the override location "unconstrained"?
            When false, see "overridePrefixes".
        overridePrefixes:
          type: array
          description: array of one or more prefixes, a supplied override must match
            one.
          items:
            type: string
        version:
          type: integer
          format: int32
          description: This media type's schema version number. This representation
            is version 1.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    thumbnailJob:
      title: Thumbnail Job
      description: The representation of a thumbnail job.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.job
        version: 1
      required:
      - id
      - state
      - links
      - version
      properties:
        id:
          type: string
          description: The generated id for this job.
        state:
          type: string
          description: The state of this job.
          enum:
          - pending
          - running
          - completed
          - failed
        thumbnails:
          type: array
          description: Thumbnail objects, typically 1 unless paging had been requested.
          items:
            $ref: "#/components/schemas/thumbnail"
        error:
          $ref: "#/components/schemas/error2"
        duration:
          type: number
          format: float
          description: duration, in seconds, of the job.
        defaultThumbnailSasThemesIconKey:
          type: string
          description: >
            A number of fully themed "icons" are available within SAS Clients. If
            provided, this is that representation and
            should be used in preference to the the image specified by link relation
            "defaultThumbnailImage".
        pagingState:
          $ref: "#/components/schemas/pagingState"
        links:
          type: array
          description: Link relations for this job. Expect 'self' and 'defaultThumbnailImage'.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          format: int32
          description: The version number of the thumbnail job. This representation
            is version 1.
    pagingOptions:
      title: Paging Options
      description: >
        Paging details for page-oriented requests. Note when included in a request,
        must be null
        if "returnMultiple" is false, must not be null if "returnMultiple" is true.
      type: object
      required:
      - start
      - limit
      properties:
        start:
          type: integer
          description: Start index, 0-based, of the first thumbnail to return.
        limit:
          type: integer
          description: Number of thumbnails to return in a single "page".
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    thumbnailRequest:
      title: Thumbnail Request
      description: A request to create a new job that creates or delivers a thumbnail.
      x-sas-media-type:
        name: application/vnd.sas.thumbnails.job.request
      required:
      - acceptItem
      - resourceUri
      properties:
        acceptItem:
          type: string
          description: >
            A media type string listing acceptable media types, possibly with quality
            values. Example:
            "image/*,text/plain;q=0.9,text/csv;q=0.8".
        resourceUri:
          type: string
          description: URI to the resource for which a thumbnail is needed.
        resourceType:
          type: string
          description: The SAS type of the resource for which a thumbnail is needed.
        detailLevel:
          type: string
          description: The expected level of detail. (default is "low")
          default: "low"
          enum:
          - low
          - high
        scope:
          type: string
          description: Whether a single element is to be represented, or the entire
            page. (default is "element")
          default: "element"
          enum:
          - element
          - page
        returnMultiple:
          type: boolean
          description: Whether a single thumbnail is to be returned (false) or multiple
            thumbnails (true). (default is false)
          default: false
        refresh:
          type: boolean
          description: Whether the freshest possible result is requested. (default
            is false)
          default: false
        sizingOptions:
          $ref: "#/components/schemas/sizingOptions"
        accessibilityOptions:
          $ref: "#/components/schemas/accessibilityOptions"
        themeId:
          type: string
          description: The client's current theme.
        pagingOptions:
          $ref: "#/components/schemas/pagingOptions"
        version:
          type: integer
          format: int32
          description: The version number of the thumbnail representation. This representation
            is version 1.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    accessibilityOptions:
      title: Accessibility Options
      description: This object describes accessibility requests; providers are not
        required to honor this
      type: object
      properties:
        highContrast:
          type: boolean
          default: false
          description: indicates whether "high contrast" visual adjustments are desired.
            (default is false)
    sizingOptions:
      title: Sizing Options
      description: >
        Sizing options; providers should honor values suitable to the type of object
        for which they provide thumbnails, and
        clients should supply values suitable to their presentation needs.
      type: object
      properties:
        viewWidth:
          type: integer
          description: CSS Pixel image width.
        viewHeight:
          type: integer
          description: CSS Pixel image height.
        devicePixelRatio:
          type: number
          format: float
          default: 1.0
          description: device pixel ratio; some mobile devices support values greater
            than 1. (default is 1.0)
        maxTextCharacters:
          type: integer
          description: if plain text is returned, the maximum number of characters
            to return.
        maxTableColumns:
          type: integer
          description: if a table or other CSV presentation is returned, the maximum
            number of columns to return.
        maxTableRows:
          type: integer
          description: if a table or other CSV presentation is returned, the maximum
            number of rows to return.
    thumbnail:
      title: Thumbnail
      description: Information for retrieving a thumbnail.
      required:
      - state
      properties:
        state:
          type: string
          description: the state of this thumbnail
          enum:
          - pending
          - running
          - completed
          - failed
        error:
          $ref: "#/components/schemas/error2"
        modifiedTimeStamp:
          type: string
          description: The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format when
            the thumbnail was last modified.
          format: date-time
        links:
          type: array
          description: >
            Link relations for this thumbnail. Expect: 'thumbnail' (the thumbnail
            to pick up) and 'staleThumbnail' (an older
            thumbnail that can be picked up while a more current thumbnail is being
            prepared)
          items:
            $ref: "#/components/schemas/link"
    pagingState:
      title: Paging State
      description: Object returned if paging had been requested
      type: object
      required:
      - start
      - limit
      - count
      properties:
        start:
          type: integer
          description: start index (0-based) of the first thumbnai.
        limit:
          type: integer
          description: number of thumbnails returned in a single "page"
        count:
          type: integer
          description: number of available thumbnails.
