---
openapi: 3.0.3
info:
  version: "2"
  title: Analytics Data Segmentation Modeling
  description: A REST API intended to support analytics modeling for each data segment
    within an analytics pipeline.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
tags:
- name: ApiRoot
  description: The operations for the root resource of the API.
- name: Plans
  description: The operations related to segmentation plans.
- name: PlanSegments
  description: The operations related to segments within a segmentation plan.
paths:
  /:
    get:
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level collections surfaced through
        this API.  These top level links will include create and retrieve operations
        for /segmentation plans.
      operationId: root
      tags:
      - ApiRoot
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/ApiRootGetResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/ApiRootGetResponse"
  /plans:
    get:
      summary: Retrieve a collection of segmentation plans
      description: Obtains a collection of segmentation plans in the format specified
        by the accept-item header.
      operationId: getPlans
      tags:
      - Plans
      parameters:
      - name: start
        description: The index of the first segmentation plans to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
          maximum: 9223372036854775807
      - name: limit
        description: The maximum number of segmentation plans to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 30
          minimum: 0
          maximum: 2147483647
      - name: filter
        in: query
        description: The criteria for filtering the segmentation plans. The all simple
          fields in the plan can be used in the filter query. Attributes are not supported
          in the filter query. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/analyticsDataSegmentation-v1/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the segmentation plans. See [Sorting
          in REST APIs](https://developer.sas.com/rest-apis/analyticsDataSegmentation-v1/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: Accept-Item
        in: header
        description: Requested media type for items in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.segmentation.plan+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.analytics.segmentation.plan+json
      responses:
        "200":
          $ref: "#/components/responses/collectionReturned"
        "404":
          $ref: "#/components/responses/notFound"
    post:
      summary: Create a segmentation plan
      description: Create a segmentation plan as a component. This does not support
        the creation of segments in the initial resource.
      operationId: createPlan
      tags:
      - Plans
      requestBody:
        content:
          application/vnd.sas.analytics.segmentation.plan+json:
            schema:
              $ref: "#/components/schemas/analyticsSegmentationPlan"
            examples:
              default:
                $ref: "#/components/examples/PlansPostRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/analyticsSegmentationPlan"
            examples:
              default:
                $ref: "#/components/examples/PlansPostRequest"
        description: The representation of the new segmentation plan.
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: The URL of the segmentation plan.
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            application/vnd.sas.analytics.segmentation.plan+json:
              schema:
                $ref: "#/components/schemas/analyticsSegmentationPlan"
              examples:
                default:
                  $ref: "#/components/examples/PlansPostResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/analyticsSegmentationPlan"
              examples:
                default:
                  $ref: "#/components/examples/PlansPostResponse"
        "400":
          $ref: "#/components/responses/badRequest"
  "/plans/{planId}":
    head:
      summary: Retrieve a segmentation plan
      description: Obtains a segmentation plan in the format specified by the accept
        header.
      operationId: headersForPlan
      parameters:
      - $ref: "#/components/parameters/planId"
      tags:
      - Plans
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
        "403":
          description: Either no resource exists at the requested path or the user
            is not authorized to access it.
        "404":
          description: No resource exists at the requested path (when requested by
            an administrator).
    get:
      summary: Retrieve a segmentation plan
      description: Obtains a segmentation plan in the format specified by the accept
        header.
      operationId: getPlan
      parameters:
      - $ref: "#/components/parameters/planId"
      tags:
      - Plans
      responses:
        "200":
          # $ref: "#/components/responses/planReturned"
          description: OK
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            "application/vnd.sas.analytics.segmentation.plan+json":
              schema:
                $ref: "#/components/schemas/analyticsSegmentationPlan"
              examples:
                default:
                  $ref: "#/components/examples/PlansGetResponse"
            "application/vnd.sas.transfer.object+json":
              schema:
                $ref: "#/components/schemas/transferObject"
              examples:
                default:
                  $ref: "#/components/examples/PlansGetTransferObjectResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/analyticsSegmentationPlan"
              examples:
                default:
                  $ref: "#/components/examples/PlansGetResponse"
        "403":
          $ref: "#/components/responses/singleForbidden"
        "404":
          $ref: "#/components/responses/singleNotFound"
    put:
      summary: Update a segmentation plan
      description: Request that a segmentation plan be updated.
      operationId: updatePlan
      tags:
      - Plans
      parameters:
      - $ref: "#/components/parameters/planId"
      - in: header
        name: If-Match
        description: Update the segmentation plan only if the resources current ETag
          header matches this value.  Not used for Transfer Objects.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.analytics.segmentation.plan+json:
            schema:
              $ref: "#/components/schemas/analyticsSegmentationPlan"
            examples:
              default:
                $ref: "#/components/examples/PlanPutRequest"
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              default:
                $ref: "#/components/examples/PlanPutImportRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/analyticsSegmentationPlan"
            examples:
              default:
                $ref: "#/components/examples/PlanPutRequest"
        description: The representation of a segmentation plan. The plan's `id` field
          must match the `planId` path parameter.
        required: true
      responses:
        "200":
          $ref: "#/components/responses/planReturned"
        "400":
          $ref: "#/components/responses/badRequest"
        "403":
          $ref: "#/components/responses/singleForbidden"
        "404":
          $ref: "#/components/responses/singleNotFound"
        "412":
          $ref: "#/components/responses/preconditionFailed"
        "428":
          $ref: "#/components/responses/preconditionRequired"
    delete:
      summary: Delete a segmentation plan
      description: Request that a segmentation plan be deleted.
      operationId: deletePlan
      parameters:
      - $ref: "#/components/parameters/planId"
      tags:
      - Plans
      responses:
        "204":
          $ref: "#/components/responses/deleteSuccessful"
        "404":
          description: The specified segmentation plan does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PlansDeleteNotFoundResponse"
  "/plans/{planId}/segments":
    parameters:
    - $ref: "#/components/parameters/planId"
    head:
      summary: Retrieve a collection of segment models for a segmentation plan
      description: Obtains a collection of segments associated with the segmentation
        plan in the format specified by the accept-item header.
      operationId: headersForPlanSegments
      tags:
      - PlanSegments
      parameters:
      - name: start
        description: The index of the first segment to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of segments to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 30
      - name: filter
        in: query
        description: The criteria for filtering the segments. The all simple fields
          in the segment can be used in the filter query. Individual fields within
          discriminators and fitStatistics can also be used in the filter query. Attributes
          are not supported in the filter query. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/analyticsDataSegmentation-v1/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the segments. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/analyticsDataSegmentation-v1/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: Accept-Item
        in: header
        description: Requested media type for items in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.segment+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.summary+json
      responses:
        "200":
          description: OK
          headers:
            Last-Modified:
              description: The latest date and time at which any segment in the response
                was last modified.
              schema:
                type: string
        "404":
          description: Not Found
    get:
      summary: Retrieve a collection of segment models for a segmentation plan
      description: Obtains a collection of segments associated with the segmentation
        plan in the format specified by the accept-item header.
      operationId: getPlanSegments
      tags:
      - PlanSegments
      parameters:
      - name: start
        description: The index of the first segment to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of segments to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 30
      - name: filter
        in: query
        description: The criteria for filtering the segments. The all simple fields
          in the segment can be used in the filter query. Individual fields within
          discriminators and fitStatistics can also be used in the filter query. Attributes
          are not supported in the filter query. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/analyticsDataSegmentation-v1/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the segments. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/analyticsDataSegmentation-v1/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: Accept-Item
        in: header
        description: Requested media type for items in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.segment+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.summary+json
      responses:
        "200":
          description: OK
          headers:
            Last-Modified:
              description: The latest date and time at which any segment in the response
                was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/collection2"
              examples:
                default:
                  $ref: "#/components/examples/PlanSegmentsGetResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/collection2"
              examples:
                default:
                  $ref: "#/components/examples/PlanSegmentsGetResponse"
        "404":
          $ref: "#/components/responses/notFound"
    post:
      summary: Add/Update a collection of segments in a segmentation plan
      description: "Multi-POST: This operation is used to add segments that do not\
        \ already exist in the segment and/or update segments that do. If a segment\
        \ in the collection has a populated id field then it is considered an update;\
        \ otherwise it is a creation of the segment. All successfully created or modified\
        \ segments will be returned in the response body in the same order that they\
        \ were provided in the request body. They will each contain an `up` link that\
        \ points to the plan specified in the path parameter. For any segment that\
        \ failed to be created or updated, the collection returned will contain an\
        \ application/vnd.sas.error object in place of the application/vnd.sas.analytics.segment\
        \ object that would have been there if it had succeeded."
      operationId: addUpdatePlanSegments
      tags:
      - PlanSegments
      parameters:
      - name: onConflict
        in: query
        description: How to handle conflicts when a segment already exists. If set
          to `update`, existing items will be updated. If set to `ignore`, existing
          items in the collection will not be updated and an error code of `409 Conflict`
          will be inserted into the response body collection.
        required: false
        schema:
          type: string
          enum:
          - update
          - ignore
          default: ignore
      - name: If-Unmodified-Since
        in: header
        description: The latest allowed value of the lastModified date of a segment
          that is to be updated. If a segment has been modified since this time, the
          update will fail. This header is only required when the `onConflict='update'`
          parameter is specified and at least one segment is being updated.
        required: false
        schema:
          type: string
      - name: Accept-Item
        in: header
        description: Requested media type for items in the collection.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.analytics.segment+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.summary+json
      requestBody:
        content:
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/collection2"
            examples:
              default:
                $ref: "#/components/examples/PlanSegmentsPostRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/collection2"
            examples:
              default:
                $ref: "#/components/examples/PlanSegmentsPostRequest"
        description: The collection of new segments to add to the segmentation plan.
        required: true
      responses:
        "200":
          description: At least one segment was created and/or Updated
          headers:
            Last-Modified:
              description: The latest date and time at which any segment in the response
                was last modified.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/collection2"
              examples:
                default:
                  $ref: "#/components/examples/PlanSegmentsPostResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/collection2"
              examples:
                default:
                  $ref: "#/components/examples/PlanSegmentsPostResponse"
        "400":
          $ref: "#/components/responses/badRequest"
        "404":
          description: No segmentation plan exists at the requested path.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PlanSegmentsPostNotFoundResponse"
    delete:
      summary: Delete all child segments of the segmentation plan
      description: Deletes the collection of segmentation plans that are children
        of the specified.
      operationId: deletePlanSegments
      tags:
      - PlanSegments
      responses:
        "204":
          $ref: "#/components/responses/deleteSuccessful"
        "404":
          description: The specified segmentation plan does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PlanSegmentsDeleteNotFoundResponse"
  "/plans/{planId}/segments/{segmentId}":
    parameters:
    - $ref: "#/components/parameters/planId"
    - $ref: "#/components/parameters/segmentId"
    head:
      summary: Retrieve a segment model
      description: Obtains a segment in the format specified by the accept-item header.
      operationId: headersForSegment
      tags:
      - PlanSegments
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: E-Tag for response
              schema:
                type: string
            Last-Modified:
              description: The date and time at which the segment was last modified.
              schema:
                type: string
        "403":
          description: Either no resource exists at the requested path or the user
            is not authorized to access it.
        "404":
          description: No resource exists at the requested path (when requested by
            an administrator).
    get:
      summary: Retrieve a segment model
      description: Obtains a segment in the format specified by the accept-item header.
      operationId: getSegment
      tags:
      - PlanSegments
      responses:
        "200":
          $ref: "#/components/responses/segmentReturned"
        "403":
          $ref: "#/components/responses/singleForbidden"
        "404":
          $ref: "#/components/responses/singleNotFound"
    put:
      summary: Update a segment
      description: Updates the details of a segment. If setting the state to `modified`,
        all nested components and segments (inward) and container components and segments
        (outward) will have the `modified` state automatically propagated to them.
      operationId: updateSegment
      tags:
      - PlanSegments
      parameters:
      - in: header
        name: If-Match
        description: Update the segmentation plan only if the resources current ETag
          header matches this value
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.analytics.segment+json:
            schema:
              $ref: "#/components/schemas/analyticsSegment"
            examples:
              default:
                $ref: "#/components/examples/PlanSegmentPutRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/analyticsSegment"
            examples:
              default:
                $ref: "#/components/examples/PlanSegmentPutRequest"
        description: The new properties of the segment to update in the segmentation
          plan.
        required: true
      responses:
        "200":
          $ref: "#/components/responses/segmentReturned"
        "400":
          $ref: "#/components/responses/badRequest"
        "403":
          $ref: "#/components/responses/singleForbidden"
        "404":
          $ref: "#/components/responses/singleNotFound"
        "412":
          $ref: "#/components/responses/preconditionFailed"
        "428":
          $ref: "#/components/responses/preconditionRequired"
    delete:
      summary: Delete a segment
      description: Deletes the specified segment.
      operationId: deleteSegment
      tags:
      - PlanSegments
      responses:
        "204":
          $ref: "#/components/responses/deleteSuccessful"
        "404":
          description: The specified segment does not exist in the specified segmentation
            plan.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/PlanSegmentDeleteNotFoundResponse"
  "/plans/{planId}/segments/{segmentId}/state":
    parameters:
    - $ref: "#/components/parameters/planId"
    - $ref: "#/components/parameters/segmentId"
    put:
      summary: Set the state for a Segment
      description: Set the specified state for Segment that corresponds to the specified
        plan id and segment id. There is no response body. If setting the state to
        `modified`, all nested components and segments (inward) and container components
        and segments (outward) will have the `modified` state automatically propagated
        to them.
      operationId: updateSegmentState
      tags:
      - PlanSegments
      parameters:
      - name: value
        in: query
        description: The requested value to which the segment status is to be set
        required: true
        schema:
          type: string
          enum:
          - created
          - modified
          - pending
          - running
          - canceled
          - completed
          - failed
      responses:
        "204":
          description: State successfully set
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  $ref: "#/components/examples/PlanSegmentStatePutResponse"
        "400":
          $ref: "#/components/responses/badRequest"
    head:
      summary: Get the state for a Segment
      description: Get the specified state for Segment that corresponds to the specified
        plan id and segment id.
      operationId: headersForSegmentState
      tags:
      - PlanSegments
      responses:
        "200":
          description: State successfully retrieved
        "400":
          description: Bad Request
    get:
      summary: Get the state for a Segment
      description: Get the specified state for Segment that corresponds to the specified
        plan id and segment id.
      operationId: getSegmentState
      tags:
      - PlanSegments
      responses:
        "200":
          description: State successfully retrieved
          content:
            text/plain:
              schema:
                type: string
                enum:
                - created
                - modified
                - pending
                - running
                - canceled
                - completed
                - failed
              examples:
                default:
                  $ref: "#/components/examples/PlanSegmentStateGetResponse"
        "400":
          $ref: "#/components/responses/badRequest"
  "/plans/{planId}/segmentsState":
    parameters:
    - $ref: "#/components/parameters/planId"
    post:
      summary: Set the state for all Segments or a subset of the segments in a Plan
      description: Set the specified state for Segments that correspond to the specified
        plan id and optional resource selection. This is an atomic action. The selection
        of segments whose state was set is returned in the response body. If setting
        the state to `modified`, all nested components and segments (inward) and container
        components and segments (outward) will have the `modified` state automatically
        propagated to them (separately from the previously mentioned atomic action).
      operationId: updatePlanSegmentsStates
      tags:
      - PlanSegments
      parameters:
      - name: value
        in: query
        description: The requested value to which the segment state is to be set
        required: true
        schema:
          type: string
          enum:
          - created
          - modified
          - pending
          - running
          - canceled
          - completed
          - failed
      requestBody:
        content:
          application/vnd.sas.selection+json:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
              default:
                $ref: "#/components/examples/PlanSegmentStatePostSelectionRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/selection"
            examples:
              default:
                $ref: "#/components/examples/PlanSegmentStatePostSelectionRequest"
        description: The selection of segments to transition to the specified state.
          If not specified, all segments in the plan will have their state set.
      responses:
        "204":
          description: Successfully set the state for all requested segments.
        "400":
          $ref: "#/components/responses/badRequest"
servers:
- url: "http://example.com/analyticsDataSegmentation"
  description: kubernetes mock server
components:
  parameters:
    planId:
      name: planId
      in: path
      description: Identifier for the segmentation plan.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    segmentId:
      name: segmentId
      in: path
      description: Identifier for the segment model.
      required: true
      schema:
        type: string
  responses:
    planReturned:
      description: OK
      headers:
        ETag:
          description: E-Tag for response
          schema:
            type: string
      content:
        "application/vnd.sas.analytics.segmentation.plan+json":
          schema:
            $ref: "#/components/schemas/analyticsSegmentationPlan"
          examples:
            default:
              $ref: "#/components/examples/ComponentPlanReturned"
        "application/json":
          schema:
            $ref: "#/components/schemas/analyticsSegmentationPlan"
          examples:
            default:
              $ref: "#/components/examples/ComponentPlanReturned"
    segmentReturned:
      description: OK
      headers:
        ETag:
          description: E-Tag for response
          schema:
            type: string
        Last-Modified:
          description: The date and time at which the segment was last modified.
          schema:
            type: string
      content:
        "application/vnd.sas.analytics.segment+json":
          schema:
            $ref: "#/components/schemas/analyticsSegment"
          examples:
            default:
              $ref: "#/components/examples/PlanSegment"
        "application/json":
          schema:
            $ref: "#/components/schemas/analyticsSegment"
          examples:
            default:
              $ref: "#/components/examples/PlanSegment"
    collectionReturned:
      description: OK
      content:
        "application/vnd.sas.collection+json":
          schema:
            $ref: "#/components/schemas/collection2"
          examples:
            default:
              $ref: "#/components/examples/Collection"
        "application/json":
          schema:
            $ref: "#/components/schemas/collection2"
          examples:
            default:
              $ref: "#/components/examples/Collection"
    deleteSuccessful:
      description: Delete Successful
    badRequest:
      description: Bad Request
      content:
        "application/vnd.sas.error+json":
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            default:
              $ref: "#/components/examples/Error400PlanBadRequest"
    notFound:
      description: Not Found
