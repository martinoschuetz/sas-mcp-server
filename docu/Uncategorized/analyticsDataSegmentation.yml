                example: "_SEG_"
                maximum: 256
              longValue:
                type: integer
                format: int64
                description: A numeric value for the discriminator.
                example: 78
                maximum: 9223372036854775807
                minimum: -9223372036854775808
              doubleValue:
                type: number
                format: double
                description: A numeric value for the discriminator.
                example: 3.14159265
                maximum: 1.7976931348623157e+308
                minimum: -1.7976931348623157e+308
              stringValue:
                type: string
                description: A string value for the discriminator.
                example: blue
                maximum: 4000
            description: A distinct data value. It is expected that only one of the
              value properties will be set for a discriminator, but this is not enforced.
          description: The set of distinct data values used to identify data that
            is part of this segment.
        fitStatistics:
          type: array
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: A name for the fitStatistic. There is no attempt made
                  to make these unique.
                example: "WMAPE"
                maximum: 256
              value:
                type: number
                format: double
                description: The value for the fitStatistic.
                example: 3.45
                maximum: 1.7976931348623157e+308
                minimum: -1.7976931348623157e+308
            description: A fit statistic.
          description: The collection of fit statistics calculated for the segment.
        templateName:
          type: string
          maximum: 100
          description: The name of the template to use for modeling the segment data.<br/>
