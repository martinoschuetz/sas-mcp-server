          example: [{"method": "GET", "rel": "self", "href": "/analyticsDataSegmentation/plans/d6d2dd86-f3de-47f4-a006-8e7d2b9e3d63/segments/46cd070d-d5e7-4633-93a3-a840bf098e51",
