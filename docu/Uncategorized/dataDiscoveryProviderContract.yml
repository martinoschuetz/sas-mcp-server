---
openapi: 3.0.3
info:
  description: "This API is deprecated as of 2024.03 and will be removed in a future\
    \ release.\nData Discovery Provider Contract"
  version: "2"
  title: Data Discovery Provider Contract
  license:
    name: SAS Institute
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
tags:
- name: Root
  description: The root of the data Discovery provider API.
- name: Assessment Reports
  description: Create and manage assessment reports.
- name: Suggestion Reports
  description: Manage recommendations.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level collections surfaced through
        this API. These top-level links include the Job Execution Provider mandated
        links.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
    head:
      tags:
      - Root
      summary: Check if the Provider service is available
      description: Returns whether or not the service is running.
      operationId: headersForRoot
      responses:
        "200":
          description: OK.  Service is running and available
  "/assessmentReports/{assessmentReportId}":
    get:
      tags:
      - Assessment Reports
      summary: Get a report using the provided id
      description: Returns an assessment report with the given id if it exists
      operationId: getAssessmentReport
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the model.  Media type application/vnd.sas.data.discovery.assessment.report+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.assessment.report+json
          - application/json
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: assessmentReportId
        in: path
        description: The report id.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.discovery.assessment.report+json:
              schema:
                $ref: "#/components/schemas/assessmentReport"
              examples:
                Assessment Report:
                  $ref: "#/components/examples/assessmentReportResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/assessmentReport"
              examples:
                Assessment Report:
                  $ref: "#/components/examples/assessmentReportResponse"
        "404":
          description: Assessment report with the specified ID does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Not Found:
                  $ref: "#/components/examples/404NotFound"
    head:
      tags:
      - Assessment Reports
      summary: Check if the report exists
      description: Returns whether or not the assessment report with the specified
        id exists.
      operationId: headersForAssessmentReport
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the report.  Media type application/vnd.sas.data.discovery.assessment.report+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.assessment.report+json
          - application/json
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: assessmentReportId
        in: path
        description: The report id.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK. Assessment report exists.
          headers:
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
        "404":
          description: Assessment report with the specified ID does not exist.
    delete:
      tags:
      - Assessment Reports
      summary: Delete the report with the given Id
      description: Deletes the assessment report if it exists, or returns a 404 if
        the report does not exist.
      operationId: deleteAssessmentReport
      parameters:
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: assessmentReportId
        in: path
        description: The report id.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No content; the assessment report has been deleted
  "/suggestionReports/{suggestionReportId}":
    get:
      tags:
      - Suggestion Reports
      summary: Get a report using the provided id
      description: Returns a suggestion report with the given id if it exists
      operationId: getSuggestionReport
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the model.  Media type application/vnd.sas.data.discovery.suggestion.report+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.suggestion.report+json
          - application/json
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: suggestionReportId
        in: path
        description: The report id.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.discovery.suggestion.report+json:
              schema:
                $ref: "#/components/schemas/suggestionReport"
              examples:
                Suggestion Report:
                  $ref: "#/components/examples/suggestionReportResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/suggestionReport"
              examples:
                Suggestion Report:
                  $ref: "#/components/examples/suggestionReportResponse"
        "404":
          description: Suggestion report with the specified ID does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Not Found:
                  $ref: "#/components/examples/404NotFound"
    post:
      tags:
      - Suggestion Reports
      summary: Get a report using the provided id with filter criteria
      description: Returns a suggestion report with the given id if it exists, filtered
        based on the contents of the request body
      operationId: getViaPostSuggestionReport
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the model.  Media type application/vnd.sas.data.discovery.suggestion.report+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.suggestion.report+json
          - application/json
      - name: sortBy
        in: query
        description: Specifies the ordering to apply to the suggestions in a suggestion
          report. This parameter is only meaningful for the application/vnd.sas.data.discovery.suggestion.report
          representation; summaries do not include the suggestions. Supported values
          are subject, action, and score.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Specifies the maximum number of suggestions returned in a suggestion
          report. This parameter is only meaningful for the application/vnd.sas.data.discovery.suggestion.report
          representation; summaries do not include the suggestions. Values must be
          greater than zero, but note that the provider will not provide more suggestions
          than indicated, and may provide fewer.
        required: false
        schema:
          type: integer
          format: int32
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: suggestionReportId
        in: path
        description: The report id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.data.discovery.suggestion.report.filter+json:
            schema:
              $ref: "#/components/schemas/suggestionReportFilter"
            examples:
              Suggestion Report Filter:
                $ref: "#/components/examples/suggestionReportFilter"
          application/json:
            schema:
              $ref: "#/components/schemas/suggestionReportFilter"
            examples:
              Suggestion Report Filter:
                $ref: "#/components/examples/suggestionReportFilter"
        description: representation of the filter criteria in the body.  Media type
          application/vnd.sas.data.discovery.suggestion.report.filter+json is the
          default.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.discovery.suggestion.report+json:
              schema:
                $ref: "#/components/schemas/suggestionReport"
              examples:
                Suggestion Report:
                  $ref: "#/components/examples/suggestionReportResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/suggestionReport"
              examples:
                Suggestion Report:
                  $ref: "#/components/examples/suggestionReportResponse"
        "400":
          description: Invalid input
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Bad Request:
                  $ref: "#/components/examples/400BadRequest"
        "404":
          description: Suggestion report with the specified ID does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Not Found:
                  $ref: "#/components/examples/404NotFound"
    head:
      tags:
      - Suggestion Reports
      summary: Check if the report exists
      description: Returns whether or not the suggestion report with the specified
        id exists.
      operationId: headersForSuggestionReport
      parameters:
      - name: Accept
        in: header
        description: Requested representation of the report.  Media type application/vnd.sas.data.discovery.suggestion.report+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.suggestion.report+json
          - application/json
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: suggestionReportId
        in: path
        description: The report id.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK. Suggestion report exists.
          headers:
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
        "404":
          description: Suggestion report with the specified ID does not exist.
    patch:
      tags:
      - Suggestion Reports
      summary: Optional operation used for collect data for retraining models
      description: Update the suggestion report with applied suggestions. This is
        used to collect data for retraining the models by capturing the set of suggestions
        that have been run as part of a plan. Only the 'replace' operation is supported,
        and only for the path /suggestions/{suggestionId}/applied; the value must
        be a boolean. Other operations and properties are ignored. If the model is
        not retrainable, return a 405/Method not allowed response.
      operationId: patchSuggestionReport
      parameters:
      - name: If-match
        in: header
        description: Etag for the conditional patch, obtained via a GET request for
          the report.
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Requested representation of the model.  Media type application/vnd.sas.data.discovery.suggestion.report+json
          is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.data.discovery.suggestion.report+json
          - application/json
      - name: sortBy
        in: query
        description: Specifies the ordering to apply to the suggestions in a suggestion
          report. This parameter is only meaningful for the application/vnd.sas.data.discovery.suggestion.report
          representation; summaries do not include the suggestions. Supported values
          are subject, action, and score.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Specifies the maximum number of suggestions returned in a suggestion
          report. This parameter is only meaningful for the application/vnd.sas.data.discovery.suggestion.report
          representation; summaries do not include the suggestions. Values must be
          greater than zero, but note that the provider will not provide more suggestions
          than indicated, and may provide fewer.
        required: false
        schema:
          type: integer
          format: int32
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: suggestionReportId
        in: path
        description: The report id.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.data.discovery.suggestion.report+json:
              schema:
                $ref: "#/components/schemas/suggestionReport"
              examples:
                Suggestion Report:
                  $ref: "#/components/examples/suggestionReportResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/suggestionReport"
              examples:
                Suggestion Report:
                  $ref: "#/components/examples/suggestionReportResponse"
        "400":
          description: Invalid input
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Bad Request:
                  $ref: "#/components/examples/400BadRequest"
        "404":
          description: Suggestion report with the specified ID does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Not Found:
                  $ref: "#/components/examples/404NotFound"
        "405":
          description: Method not allowed. This indicates that the provider does not
            enable updating suggestions.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Method Not Allowed:
                  $ref: "#/components/examples/405MethodNotAllowed"
        "412":
          description: "Precondition failed: The model has changed since it was last\
            \ fetched."
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Precondition Failed:
                  $ref: "#/components/examples/412PreconditionFailed"
        "428":
          description: Precondition required. Include an If-Match header with the
            request.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Error - Precondition Required:
                  $ref: "#/components/examples/428PreconditionRequired"
    delete:
      tags:
      - Suggestion Reports
      summary: Delete the report with the given Id
      description: Deletes the suggestion report if exists, or returns a 404 if the
        report does not exist.
      operationId: deleteSuggestionReport
      parameters:
      - name: sessionId
        in: query
        description: Specifies the session identifier.
        required: false
        schema:
          type: string
      - name: suggestionReportId
        in: path
        description: The report id.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No content; the suggestion report has been deleted
servers:
- url: http://example.com/dataDiscoveryProviderContract
  description: The root of the dataDiscoveryProvider API.
components:
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      required:
      - version
      - links
      properties:
        links:
          $ref: "#/components/schemas/links"
        version:
          format: int32
          type: integer
          description: The version of the media-type that represents this API.
      example:
        version: 1
        links:
        - method: GET
          rel: commonsSettings
          href: /{providerName}/commons/settings
          uri: /{providerName}/commons/settings
          type: application/vnd.sas.attributes
        - method: POST
          rel: jobs
          href: /{providerName}/jobs
          uri: /{providerName}/jobs
          type: application/vnd.sas.job.execution.job.request
          responseType: application/vnd.sas.job.execution.job
    assessment:
      title: Assessment, used to capture features needed to make suggestions
      description: The Assessment is the data element that appears in an assessment
        report. It represents a single set of features as computed by the provider.
        The id field is provided to support the generation of training data, where
        it serves as a key when combining the assessment with the suggestion.
      type: object
      required:
      - subject
      - features
      properties:
        id:
          type: string
          description: "Unique identifier of the Assessment. This field is generated\
            \ by the service. Max length: 36"
        subject:
          type: string
          description: "The subject for the suggestion; for example, a table provider\
            \ may provide subjects representing columns within the table, or for the\
            \ table itself. Max length: 100."
        features:
          type: object
          description: A JSON dictionary consisting of feature keys and values; the
            schema varies by provider.
    assessmentReport:
      title: Assessment Report, used to describe aspects of the resource under consideration
      description: The Assessment Report contains the information used by models to
        generate suggestions.
      type: object
      required:
      - name
      properties:
        version:
          type: integer
          format: int32
          description: The version number of the assessment report representation.
            1 is the only supported version.
        id:
          type: string
          description: "Unique identifier of the assessment report. This field is\
            \ generated by the service. Max length: 36"
        name:
          type: string
          description: "Name of the report. Max length: 100"
        description:
          type: string
          description: "Descriptive text for this report. Max length: 1000"
        resourceURI:
          type: string
          description: The URI of the resource being assessed.
        providerName:
          type: string
          description: "The name of the assessment provider to use during evaluation.\
            \ Max length: 100."
        assessments:
          type: object
          description: The assessments for the report, keyed by scope; each scope
            has a list of assessments.
          properties:
            scope:
              type: array
              description: The list of assessments for the provided scope.
              items:
                $ref: "#/components/schemas/assessment"
        createdBy:
          type: string
          description: The user who created this report. This field is generated by
            the service.
        creationTimeStamp:
          type: string
          format: date-time
          description: Timestamp of report creation. This field is generated by the
            service.
        modifiedBy:
          type: string
          description: The last user to modify this report. This field is generated
            by the service.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Timestamp of last modification. This field is generated by
            the service.
        links:
          type: array
          description: HATEOAS links.
          items:
            $ref: "#/components/schemas/link"
    suggestion:
      title: Suggestion, used to provide information about a single suggestion
      description: The Suggestion is the data element that appears in a suggestion
        report. It represents a single suggestion as computed by the provider. The
        id field is provided to support the PATCH operation on a suggestion report.
      type: object
      required:
      - subject
      - action
      - score
      properties:
        version:
          type: integer
          format: int32
          description: The version number of the Suggestion representation. 1 is the
            only supported version.
        id:
          type: string
          description: "Unique identifier of the Suggestion. This field is generated\
            \ by the service. Max length: 36"
        action:
          type: string
          description: "The label returned by the provider; applications interpret\
            \ this label to react to suggestions. Max length: 100"
        subject:
          type: string
          description: "The subject for the suggestion; for example, a table provider\
            \ may provide subjects representing columns within the table, or for the\
            \ table itself. Max length: 100."
        score:
          type: number
          description: The score associated with the suggestion. This is generally
            a value between 0 and 1 (inclusive), but may vary by provider.
        description:
          type: string
          description: Additional text that accompanies the suggestion. Max length
            1000.
    suggestionReport:
      title: Suggestion Report, used to describe aspects of the resource under consideration
      description: The Suggestion Report contains the information for suggestions
        made by the provider's models.
      type: object
      required:
      - name
      properties:
        version:
          type: integer
          format: int32
          description: The version number of the suggestion report representation.
            1 is the only supported version.
        id:
          type: string
          description: "Unique identifier of the suggestion report. This field is\
            \ generated by the service. Max length: 36"
        name:
          type: string
          description: "Name of the report. Max length: 100"
        description:
          type: string
          description: "Descriptive text for this report. Max length: 1000"
        resourceURI:
          type: string
          description: The URI of the resource being assessed.
        providerName:
          type: string
          description: "The name of the assessment provider to use during evaluation.\
            \ Max length: 100."
        suggestions:
          type: object
          description: The suggestions for the report, keyed by scope; each scope
            has a list of suggestions.
          properties:
            scope:
              type: array
              description: The list of suggestions for a given scope.
              items:
                $ref: "#/components/schemas/suggestion"
        createdBy:
          type: string
          description: The user who created this report. This field is generated by
            the service.
        creationTimeStamp:
          type: string
          format: date-time
          description: Timestamp of report creation. This field is generated by the
            service.
        modifiedBy:
          type: string
          description: The last user to modify this report. This field is generated
            by the service.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Timestamp of last modification. This field is generated by
            the service.
        links:
          type: array
          description: HATEOAS links.
          items:
            $ref: "#/components/schemas/link"
    suggestionReportFilter:
      title: Suggestion Report filter criteria, used to restrict which suggestions
        are returned in a report.
      description: The report filter consists of a map of subjects to an array of
        actions. Suggestion reports will be returned without any suggestions for the
        subject/action tuple.
      type: object
      properties:
        version:
          type: integer
          format: int32
          description: The version number of the suggestion report representation.
            1 is the only supported version.
        filter:
          type: object
          description: An object whose keys are potentially subjects in the report;
            the value for each key is an array of strings representing the set of
            actions that are to be filtered out of the report for the subject.
    links:
      title: Links
      type: array
      items:
        $ref: "#/components/schemas/link"
      description: Provides zero or more links to related resources and actions.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
  examples:
    400BadRequest:
      summary: Error - Bad Request
      description: The request body is invalid.
      value:
        version: 2
        httpStatusCode: 400
        errorCode: 85026
        message: Bad Request
        details:
        - 'The ID "1c845bc3-8b2c-4d8e-b5d5-6631092d02ae" in the URI does not match
          the ID "0a6b3f07-5b54-45db-9a6c-e975d54ca06d" in the request body.'
        - "path: /dataDiscoveryTableProvider/suggestionReports/1c845bc3-8b2c-4d8e-b5d5-6631092d02ae"
        - "correlator: 70e24a9f-4986-404b-a03a-0cd660aa30e4"
    404NotFound:
      summary: Error - Not Found
      description: The object was not found.
      value:
        version: 2
        httpStatusCode: 404
