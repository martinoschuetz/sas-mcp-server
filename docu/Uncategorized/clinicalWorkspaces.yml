---
openapi: 3.0.3
info:
  version: "1"
  title: SAS Clinical Workspaces
  description: >
    The SAS Clinical Workspaces API provides API endpoints necessary for
    managing clinical workspaces and their content.
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: https://example.com/clinicalWorkspaces
  description: kubernetes mock server
tags:
- name: Root
  description: The operations for the root resource.
- name: Workspace
  description: The operations for managing a user's workspace.
- name: Synchronization
  description: The operations for managing synchronization items.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
              description: Describes the representation of the collection response.
          content:
            application/vnd.sas.api+json:
              schema:
                title: API
                description: The list of links to top-level resources and operations
                  available from the root of the API.
                x-sas-media-type:
                  name: application/vnd.sas.api
                  version: 1
                required:
                - version
                - links
                properties:
                  version:
                    type: integer
                    description: The version number of the API representation. This
                      is version 1.
                    minimum: 1
                  links:
                    description: The API's top-level links.
                    type: array
                    items:
                      title: Link
                      type: object
                      description: A link to a related operation or resource.
                      required:
                      - rel
                      properties:
                        method:
                          type: string
                          description: The HTTP method for the link.
                        rel:
                          type: string
                          description: The relationship of the link to the resource.
                        uri:
                          type: string
                          description: The relative URI for the link.
                        href:
                          type: string
                          description: The URL for the link.
                        title:
                          type: string
                          description: The title for the link.
                        type:
                          type: string
                          description: The media type or link type for the link.
                        itemType:
                          type: string
                          description: If this is a link to a container, `itemType`
                            is the media type or link type for the items in the container.
                        responseType:
                          type: string
                          description: The media type or link type of the response
                            body for a `PUT`, `POST`, or `PATCH` operation.
                        responseItemType:
                          type: string
                          description: The media type or link type of the items in
                            the response body for a `PUT`, `POST`, or `PATCH` operation.
              examples:
                api:
                  summary: Links to the API resources
                  value:
                    version: 1
                    links:
                    - method: POST
                      rel: createWorkspace
                      href: /clinicalWorkspaces/userWorkspace
                      uri: /clinicalWorkspaces/userWorkspace
                      responseType: application/vnd.sas.clinical.workspace+json
            application/json:
              schema:
                $ref: "#/paths/~1/get/responses/200/content/application~1vnd.sas.api%2Bjson/schema"
              examples:
                api:
                  $ref: "#/paths/~1/get/responses/200/content/application~1vnd.sas.api%2Bjson/examples/api"
        "404":
          description: The service is not available.
    head:
      tags:
      - Root
      summary: Get the headers for the API
      description: >
        Returns the headers for the API. Also determines whether the service
        provided by the API is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The service is running.
          headers:
            Content-Type:
              schema:
                type: string
              description: Describes the representation of the collection response.
        "404":
          description: The service is not available.
  /synchronization/items:
    get:
      tags:
      - Synchronization
      summary: Get the collection of synchronization items
      description: >
        Returns the collection of synchronization items matching the specified
        filter. Users belonging to the 'Clinical Administrators' group can run
        as an administrator by specifying a value of 'admin' for the
        'X-SAS-Clinical-Authorization' header. The default behavior is to run in
        non-administrative mode. Only synchronization items associated with the
        current user will be returned for non-administrators.
      operationId: getSynchronizationItems
      parameters:
      - name: start
        in: query
        description: 0-based offset of the first type to return. Defaults to 0.
        schema:
          type: integer
        example: 10
      - name: limit
        in: query
        description: The maximum number of items to return. Defaults to 10. The maximum
          cannot exceed 500.
        schema:
          type: integer
        example: 10
      - name: filter
        in: query
        description: >
          Filter criteria for items. See [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
        example: eq(name,'ACME')
      - name: sortBy
        in: query
        description: >
          Sorts the returned items. See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
          example: name:ascending:primary
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection:
              schema:
                description: The schema for a collection of synchronization items.
                allOf:
                - description: This is a base schema used to define paginated collections
                    of resources. This base schema is extended by other schemas by
                    adding an 'items' array property. These extensions define the
                    application/vnd.sas.collection media type (version 2)
                  properties:
                    accept:
                      description: A space-delimited list of media types from which
                        an `Accept` header may be constructed.
                      type: string
                    name:
                      type: string
                      description: The name of the collection.
                    count:
                      type: integer
                      description: The total item count.
                    start:
                      type: integer
                      description: The zero-based index of the first item in the collection.
                    limit:
                      type: integer
                      description: The number of items that were requested from the
                        collection.
                    links:
                      description: The links that apply to the collection.
                      items: {}
                      type: array
                    version:
                      type: integer
                      description: The version number of the collection representation.
                - type: object
                  properties:
                    items:
                      type: array
                      description: The array of synchronization items.
                      items:
                        title: Synchronization Item
                        description: The representation of a synchronization item.
                        type: object
                        properties:
                          version:
                            type: number
                            description: The version of the representation. This is
                              version 1.
                          id:
                            description: The unique identifier of the synchronization
                              item.
                            type: string
                          workspaceId:
                            type: string
                            description: The unique identifier of the workspace associated
                              with this synchronization item.
                          userId:
                            type: string
                            description: The identifier of the user associated with
                              this synchronization item.
                          name:
                            type: string
                            description: The name of the file associated with this
                              synchronization item.
                          location:
                            type: string
                            description: The location, or parent path, of the file
                              associated with this synchronization item.
                          path:
                            type: string
                            description: The path of the file associated with this
                              synchronization item.
                          fileVersion:
                            type: string
                            description: >
                              The current version of the repository file
                              associated with this synchronization item (if
                              the file exists in the repository).
                          repositoryFileSize:
                            type: number
                            description: >
                              The size of the repository file associated with
                              this synchronization item (if the file exists in
                              the repository).
                          repositoryModifiedTimeStamp:
                            type: string
                            format: date-time
                            description: >
                              The modified timestamp of the repository file
                              associated with this synchronization item (if
                              the file exists in the repository).
                          synchronizationInfo:
                            type: object
                            description: Additional synchronization information associated
                              with this synchronization item.
                            $ref: "#/components/schemas/synchronizationItem/properties/synchronizationInfo"
              example:
                summary: Get synchronization items
                description: Returns a collection of synchronization items.
                value:
                  links:
                  - method: GET
                    rel: self
                    href: /clinicalWorkspaces/synchronization/items?filter=and(startsWith(path,'/RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1725036088990/testGetSynchronizationItems_Filtering-1725036088990/'),like(name,'folder*_file?.txt'))&sortBy=name:ascending:primary&start=0&limit=10
                    uri: /clinicalWorkspaces/synchronization/items?filter=and(startsWith(path,'/RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1725036088990/testGetSynchronizationItems_Filtering-1725036088990/'),like(name,'folder*_file?.txt'))&sortBy=name:ascending:primary&start=0&limit=10
                    type: application/vnd.sas.collection
                    itemType: application/vnd.sas.clinical.synchronization.info+json
                  - method: GET
                    rel: collection
                    href: /clinicalWorkspaces/synchronization/items
                    uri: /clinicalWorkspaces/synchronization/items
                    type: application/vnd.sas.collection
                    itemType: application/vnd.sas.clinical.synchronization.info+json
                  name: items
                  accept: application/vnd.sas.clinical.synchronization.info+json
                  start: 0
                  count: 3
                  items:
                  - version: 1
                    id: 39ab413a-0013-466f-bd3e-0f287199b18e
                    workspaceId: 5ae783a1-eb1d-49ec-9a39-5204e54a311a
                    userId: sastest1
                    name: folder1_file1.txt
                    location: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1725036088990/testGetSynchronizationItems_Filtering-1725036088990/folder1
                    path: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1725036088990/testGetSynchronizationItems_Filtering-1725036088990/folder1/folder1_file1.txt
                    fileVersion: "-"
                    repositoryFileSize: 17
                    repositoryModifiedTimeStamp: 2024-08-30T16:42:20Z
                    synchronizationInfo:
                      version: 1
                      checkedOut: false
                      synchronizationFileVersion: "-"
                      synchronizationTimeStamp: 2024-08-30T16:42:31.345000Z
                      workspaceStatus: IN_SYNC
                  - version: 1
                    id: 24e8bd6e-495c-4656-a253-faebef615cac
                    workspaceId: 5ae783a1-eb1d-49ec-9a39-5204e54a311a
                    userId: sastest1
                    name: folder2_file1.txt
                    location: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1725036088990/testGetSynchronizationItems_Filtering-1725036088990/folder2
                    path: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1725036088990/testGetSynchronizationItems_Filtering-1725036088990/folder2/folder2_file1.txt
                    fileVersion: "-"
                    repositoryFileSize: 17
                    repositoryModifiedTimeStamp: 2024-08-30T16:42:21Z
                    synchronizationInfo:
                      version: 1
                      checkedOut: true
                      checkedOutBy: sastest1
                      checkedOutByDisplayName: SAS Test User 1 (sastest1)
                      checkedOutTimeStamp: 2024-08-30T16:42:33Z
                      synchronizationFileVersion: "-"
                      synchronizationTimeStamp: 2024-08-30T16:42:35.514000Z
                      workspaceStatus: IN_SYNC
                  - version: 1
                    id: 20f3dc8f-b58f-4f3a-8d3e-b2f272520ad1
                    workspaceId: 5ae783a1-eb1d-49ec-9a39-5204e54a311a
                    userId: sastest1
                    name: folder3_file1.txt
                    location: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1725036088990/testGetSynchronizationItems_Filtering-1725036088990/folder3
                    path: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1725036088990/testGetSynchronizationItems_Filtering-1725036088990/folder3/folder3_file1.txt
                    fileVersion: "-"
                    repositoryFileSize: 17
                    repositoryModifiedTimeStamp: 2024-08-30T16:42:22Z
                    synchronizationInfo:
                      version: 1
                      checkedOut: true
                      checkedOutBy: sastest1
                      checkedOutByDisplayName: SAS Test User 1 (sastest1)
                      checkedOutTimeStamp: 2024-08-30T16:42:40Z
                      synchronizationFileVersion: "-"
                      synchronizationTimeStamp: 2024-08-30T16:42:42.714000Z
                      workspaceStatus: IN_SYNC
                  limit: 10
                  version: 2
            application/json:
              schema:
                $ref: "#/paths/~1synchronization~1items/get/responses/200/content/application~1vnd.sas.collection/schema"
              example:
                $ref: "#/paths/~1synchronization~1items/get/responses/200/content/application~1vnd.sas.collection/example"
    post:
      tags:
      - Synchronization
      summary: Get the collection of synchronization items eligible for check in for
        the current user
      description: >
        Returns the collection of synchronization items eligible for check in
        for the current user based on the specified paths.
      operationId: getCheckInSynchronizationItems
      parameters:
      - name: type
        in: query
        required: true
        description: >
          The type of check in synchronization items to retrieve. CHECKED_OUT
          retrieves synchronization items of checked out files only and
          CHECKIN includes synchronization items for files available for check
          in (this includes checked out files and new files which don't yet
          exist in the repository).
        schema:
          type: string
          enum:
          - CHECKED_OUT
          - CHECKIN
      requestBody:
        required: true
        description: >
          The list of paths to retrieve synchronization items for. If a folder
          path is specified, synchronization items will be retrieved for files
          within the folder.
        content:
          application/json:
            schema:
              type: array
              example:
              - /RemoteTests/RemoteWorkspaceControllerSynchronizationTest-1716224505926/testGetSynchronizationItems-1716224505926/folder1
              - /RemoteTests/RemoteWorkspaceControllerSynchronizationTest-1716224505926/testGetSynchronizationItems-1716224505926/folder2
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/paths/~1synchronization~1items/get/responses/200/content/application~1vnd.sas.collection/schema"
              example:
                $ref: "#/paths/~1synchronization~1items/get/responses/200/content/application~1vnd.sas.collection/example"
            application/json:
              schema:
                $ref: "#/paths/~1synchronization~1items/get/responses/200/content/application~1vnd.sas.collection/schema"
              example:
                $ref: "#/paths/~1synchronization~1items/get/responses/200/content/application~1vnd.sas.collection/example"
  /userWorkspace:
    post:
      tags:
      - Workspace
      summary: Create a new workspace
      description: |
        Add a new workspace.
      operationId: createWorkspace
      responses:
        "201":
          description: The request succeeded and the created workspace is returned.
          content:
            application/vnd.sas.clinical.workspace:
              schema:
                title: Workspace
                description: >
                  An area where files and folders may be stored. A workspace is
                  associated with a specific user. Files and folders within a
                  user's workspace are only accessible by that user.
                properties:
                  version:
                    description: The version of the representation. This is version
                      1.
                    type: number
                  id:
                    description: The unique identifier of the workspace.
                    type: string
                  owner:
                    description: The user ID of the user that owns the workspace.
                    type: string
                  name:
                    description: The name of the workspace.
                    type: string
                  empty:
                    description: Whether or not the workspace is empty.
                    type: boolean
              examples:
                workspace:
                  description: Workspace representation.
                  value:
                    version: 1
                    id: 8107898a-70d7-43cc-850f-004d28bff58d
                    owner: sastest2
                    name: sastest2
                    empty: true
            application/json:
              schema:
                $ref: "#/paths/~1userWorkspace/post/responses/201/content/application~1vnd.sas.clinical.workspace/schema"
              examples:
                workspace:
                  $ref: "#/paths/~1userWorkspace/post/responses/201/content/application~1vnd.sas.clinical.workspace/examples/workspace"
        "400":
          description: Bad Request
        "409":
          description: The workspace already exists.
    get:
      tags:
      - Workspace
      summary: Get the current user's workspace
      description: Get the current user's workspace.
      operationId: getWorkspace
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.clinical.workspace:
              schema:
                $ref: "#/paths/~1userWorkspace/post/responses/201/content/application~1vnd.sas.clinical.workspace/schema"
              examples:
                workspace:
                  $ref: "#/paths/~1userWorkspace/post/responses/201/content/application~1vnd.sas.clinical.workspace/examples/workspace"
            application/json:
              schema:
                $ref: "#/paths/~1userWorkspace/post/responses/201/content/application~1vnd.sas.clinical.workspace/schema"
              examples:
                workspace:
                  $ref: "#/paths/~1userWorkspace/post/responses/201/content/application~1vnd.sas.clinical.workspace/examples/workspace"
        "404":
          description: Not found - The workspace could not be found.
    head:
      tags:
      - Workspace
      summary: Determine if the current user's workspace exists
      description: Determine if the current user's workspace exists.
      operationId: headersForWorkspace
      responses:
        "200":
          description: OK - the workspace exists.
        "404":
          description: Not found - the workspace could not be found.
    delete:
      tags:
      - Workspace
      summary: Delete the current user's workspace
      description: >
        Delete the current user's workspace. All files and folders within the
        workspace must be deleted before the workspace can be deleted.
      operationId: deleteWorkspace
      responses:
        "204":
          description: The workspace was deleted.
        "400":
          description: Bad Request
        "404":
          description: Not found - the workspace could not be found.
  /userWorkspace/items/item:
    get:
      tags:
      - Workspace
      summary: Get the workspace item with the specified path
      description: |
        Get the workspace item with the specified path.
      operationId: getWorkspaceItemTemp
      parameters:
      - name: Accept
        in: header
        description: >
          The requested representation of workspace item. Media type
          'application/vnd.sas.clinical.workspace.item+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.clinical.workspace.item+json
          - application/vnd.sas.collection+json
          - application/json
      - name: path
        in: query
        required: true
        description: The full path of the workspace item.
        schema:
          type: string
        examples:
          folder:
            value: /Org/project/programs
          file:
            value: /Org/project/programs/report.sas
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection:
              schema:
                description: The schema for a collection of workspace items which
                  can be folders or files.
                allOf:
                - $ref: "#/paths/~1synchronization~1items/get/responses/200/content/application~1vnd.sas.collection/schema/allOf/0"
                - type: object
                  properties:
                    items:
                      type: array
                      description: The array of workspace items.
                      items:
                        $ref: "#/components/schemas/workspaceFile/allOf/0"
              examples:
                getWorkspaceChildren:
                  summary: Get workspace item children.
                  description: Returns a collection of workspace items.
                  value:
                    links:
                    - method: GET
                      rel: self
                      href: /clinicalWorkspaces/userWorkspace/items/Org/project/programs?start=0&limit=3
                      uri: /clinicalWorkspaces/userWorkspace/items/Org/project/programs?start=0&limit=3
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.clinical.workspace.item+json
                    - method: GET
                      rel: collection
                      href: /clinicalWorkspaces/userWorkspace/items/Org/project/programs
                      uri: /clinicalWorkspaces/userWorkspace/items/Org/project/programs
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.clinical.workspace.item+json
                    name: items
                    accept: application/vnd.sas.clinical.workspace.item+json
                    start: 0
                    count: 3
                    items:
                    - version: 1
                      workspaceId: ce211872-f840-4d41-bcb4-4974cb35840e
                      name: inputs
                      path: /Org/project/programs/inputs
                      type: FOLDER
                      modifiedTimeStamp: 2023-12-13T16:04:42.183000Z
                    - version: 1
                      workspaceId: ce211872-f840-4d41-bcb4-4974cb35840e
                      name: outputs
                      path: /Org/project/programs/outputs
                      type: FOLDER
                      modifiedTimeStamp: 2023-12-13T16:04:49.306000Z
                    - version: 1
                      workspaceId: ce211872-f840-4d41-bcb4-4974cb35840e
                      name: sleep.sas
                      path: /Org/project/programs/sleep.sas
                      type: FILE
                      modifiedTimeStamp: 2023-12-13T15:39:09.907000Z
                      contentType: application/x-sas
                      size: 22
                    limit: 3
                    version: 2
            application/vnd.sas.clinical.workspace.item:
              schema:
                $ref: "#/components/schemas/workspaceFile/allOf/0"
              examples:
                workspaceFolder:
                  summary: An example of getting a workspace item that is a folder.
                  description: Returns a workspace folder representation.
                  value:
                    version: 1
                    workspaceId: ce211872-f840-4d41-bcb4-4974cb35840e
                    name: programs
                    location: /Org/project
                    path: /Org/project/programs
                    type: FOLDER
                    modifiedTimeStamp: 2023-12-13T16:04:52.385000Z
                workspaceFile:
                  summary: An example of getting a workspace item that is a file.
                  description: Returns a workspace file representation.
                  value:
                    version: 1
                    workspaceId: ce211872-f840-4d41-bcb4-4974cb35840e
                    name: sleep.sas
                    path: /Org/project/programs/sleep.sas
                    type: FILE
                    modifiedTimeStamp: 2023-12-13T15:39:09.907000Z
                    contentType: application/x-sas
                    size: 22
            application/json:
              schema:
                $ref: "#/components/schemas/workspaceFile/allOf/0"
              examples:
                workspaceFolder:
                  $ref: "#/paths/~1userWorkspace~1items~1item/get/responses/200/content/application~1vnd.sas.clinical.workspace.item/examples/workspaceFolder"
                workspaceFile:
                  $ref: "#/paths/~1userWorkspace~1items~1item/get/responses/200/content/application~1vnd.sas.clinical.workspace.item/examples/workspaceFile"
        "404":
          description: Not found - the workspace item could not be found.
          content:
            application/vnd.sas.error+json:
              schema:
                title: Error
                type: object
                description: The representation of an error.
                x-sas-media-type:
                  name: application/vnd.sas.error
                  version: 2
                required:
                - httpStatusCode
                - version
                properties:
                  message:
                    type: string
                    description: The message for the error.
                  id:
                    type: string
                    description: The string ID for the error.
                  errorCode:
                    type: integer
                    description: The numeric ID for the error.
                  httpStatusCode:
                    type: integer
                    description: The HTTP status code for the error.
                  details:
                    type: array
                    description: Messages that provide additional details about the
                      cause of the error.
                    items:
                      type: string
                  remediation:
                    type: string
                    description: A message that describes how to resolve the error.
                  errors:
                    type: array
                    description: Any additional errors that occurred.
                    items:
                      $ref: "#/paths/~1userWorkspace~1items~1item/get/responses/404/content/application~1vnd.sas.error%2Bjson/schema"
                  links:
                    type: array
                    description: The links that apply to the error.
                    items:
                      $ref: "#/paths/~1/get/responses/200/content/application~1vnd.sas.api%2Bjson/schema/properties/links/items"
                  version:
                    type: integer
                    description: The version number of the error representation. This
                      representation is version 2.
              examples:
                json:
                  summary: Not found error response
                  description: This is an example of an error response for a resource
                    that is not found.
                  value:
                    errorCode: 145016
                    message: No resource with the path "/does/not/exist" was found.
                    details:
                    - Workspace item was not found /does/not/exist
                    remediation: Either the path is incorrect or the desired resource
                      does not exist.
                    version: 2
                    httpStatusCode: 404
            application/json:
              schema:
                $ref: "#/paths/~1userWorkspace~1items~1item/get/responses/404/content/application~1vnd.sas.error%2Bjson/schema"
              examples:
                json:
                  $ref: "#/paths/~1userWorkspace~1items~1item/get/responses/404/content/application~1vnd.sas.error%2Bjson/examples/json"
    delete:
      tags:
      - Workspace
      summary: Delete the workspace item with the specified path
      description: Delete the workspace item with the specified path.
      operationId: deleteItemTemp
      parameters:
      - name: path
        in: query
        required: true
        description: The full path of the workspace item.
        schema:
          type: string
        examples:
          folder:
            value: /Org/project/programs
          file:
            value: /Org/project/programs/report.sas
      responses:
        "204":
          description: The workspace item was successfully deleted.
        "404":
          description: Not found - the workspace item could not be found.
  /userWorkspace/items/item/rename:
    post:
      tags:
      - Workspace
      summary: Rename the item at the specified path
      description: |
        Rename the item at the specified path.
      operationId: renameItem
      parameters:
      - name: path
        in: query
