          type: string
        owner:
          description: The user ID of the user that owns the workspace.
          type: string
        name:
          description: The name of the workspace.
          type: string
        empty:
          description: Whether or not the workspace is empty.
          type: boolean
    workspaceItem:
      title: Workspace Item
