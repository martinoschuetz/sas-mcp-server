            synchronization item (if the file exists in the repository).
        synchronizationInfo:
          title: Synchronization Info
          description: The representation of synchronization information for a repository
            and/or workspace file.
          type: object
          properties:
            version:
              type: number
              description: The version of the representation. This is version 1.
            checkedOut:
              type: boolean
              description: Indicates whether the file associated with this synchronization
                information is checked out.
            checkedOutBy:
              type: string
              description: >
                The identifier of the user who has the file associated with this
                synchronization information checked out (if the file is checked
