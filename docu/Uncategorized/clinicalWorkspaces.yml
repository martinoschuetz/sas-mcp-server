  "/userWorkspace/files/{path}/**":
    post:
      tags:
      - Workspace
      summary: Update the file with the specified path
      description: Update the file with the specified path.
      operationId: updateFile
      parameters:
      - name: path
        in: path
        required: true
        description: >
          The path of the file. This could be a workspace and/or repository
          file path depending on the action.
        schema:
          type: string
          example: /Org/project/programs/report.sas
      - name: action
        in: query
        required: true
        description: >
          The update action to perform on the file. Supported actions:

          * CHECK_OUT: Check out a repository file and copy it to the workspace. If
          the file exists in the workspace its

          content will be overwritten. Any parent contexts and folders that don't
          currently exist in the workspace are

          created in the workspace as folders.

          * CHECK_OUT_WITHOUT_COPY: Check out a repository file and do not copy the
          file or its parent containers to the

          workspace.

          * UNDO_CHECKOUT: Undo the check out of a file that is currently checked
          out. Users can only undo checkout on

          files they have checked out. The workspace content of the file is not affected
          by undo checkout.

          * CHECK_IN: Check in a file which currently exists in the repository and
          is checked out or check in a new file

          which exists in the workspace, but does not yet exist in the repository.
          Checking in a file will result in the

          file being created or updated in the repository and any missing parent folders
          will be created in the repository.

          The optional version and file comments will be applied if specified.

          * COPY_LATEST_VERSION: Copy the content of a file in the repository to the
          workspace. For versioned files the

          content of the most recent version of the file will be copied to the workspace.
          Existing workspace files will have

          their content overwritten if the content of the file does not already match
          that of the most recent version of

          the file in the repository.

          * COPY_VERSION: Copy the content of a file in the repository to the workspace.
          For versioned files, by default the

          content of the latest version of the file will be copied to the workspace.
          The optional fileVersion can

          be specified to copy the content of an earlier version of the file. Existing
          workspace files will have

          their content overwritten if the content of the file does not already match
          that of the specified fileVersion

          in the repository, or the latest version when no version is specified.
        schema:
          type: string
          enum:
          - CHECK_OUT
          - CHECK_OUT_WITHOUT_COPY
          - UNDO_CHECKOUT
          - CHECK_IN
          - COPY_LATEST_VERSION
      - name: fileVersion
        in: query
        description: >
          The optional version specification for checking in a version of the
          file or copying a version of the file to the workspace. This
          parameter is not required, so for check in, unless a version
          parameter value is provided, new files are created un-versioned. For
          the CHECK_IN action, the valid values for version are MAJOR, MINOR,
          or a specific version such as 2.3. If MAJOR, new files are created
          as versioned with initial version 1.0. Similarly, MINOR creates a
          versioned file with version 0.1. If the file exists and is
          versioned, new versions are MINOR versions by default. To specify a
          version other than MAJOR or MINOR, a value can be specified between
          0.1 and 99999.99999. For COPY_VERSION, the specific file version you
          wish to copy to the workspace can be specified; otherwise the
          content of the most recent version is copied. This parameter is only
          applicable when the action is CHECK_IN and COPY_VERSION.
        required: false
        schema:
          type: string
        example: MAJOR
      - name: comment
        in: query
        description: >
          The optional file version comment for this file. This is only
          applicable when action is CHECK_IN.
        required: false
        schema:
          type: string
        example: Final report version.
      responses:
        "200":
          description: OK - the file was updated successfully.
          content:
            application/vnd.sas.clinical.workspace.file:
              schema:
                title: Workspace File
                description: The representation of a workspace file.
                allOf:
                - $ref: "#/components/schemas/workspaceFile/allOf/0"
                - type: object
                  properties:
                    contentType:
                      type: string
                      description: The content type of the file.
                    size:
                      type: number
                      description: The size of the file in bytes.
            application/json:
              schema:
                $ref: "#/paths/~1userWorkspace~1files~1%7Bpath%7D~1**/post/responses/200/content/application~1vnd.sas.clinical.workspace.file/schema"
              examples:
                workspaceFile:
                  $ref: "#/paths/~1userWorkspace~1items~1item/get/responses/200/content/application~1vnd.sas.clinical.workspace.item/examples/workspaceFile"
