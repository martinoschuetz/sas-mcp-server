      type: object
      properties:
        version:
          type: number
          description: The version of the representation. This is version 1.
        workspaceId:
          type: string
          description: The unique identifier of the workspace in which this item is
            stored.
        name:
          type: string
          description: The name of the item.
        location:
          type: string
          description: The location, or parent path, of the item.
        path:
          type: string
          description: The path of the item.
        type:
          type: string
          description: The type of the workspace item.
          enum:
          - FILE
          - FOLDER
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The date and time the item was last modified.
    workspaceFile:
