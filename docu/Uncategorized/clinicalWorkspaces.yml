  /userWorkspace/items/batch:
    post:
      tags:
      - Workspace
      summary: Asynchronously update one or more workspace items
      description: Asynchronously update one or more workspace items.
      operationId: batchUpdate
      parameters:
      - name: clientId
        in: query
        schema:
          type: string
        required: false
        description: The client ID that is associated with the action status.
      - name: action
        in: query
        required: true
        description: >
          The action to perform on the workspace items. Supported actions:

          * DELETE: Delete one or more workspace items. The request body is a list
          of paths for the items to delete.

          * MOVE: Move one or more workspace items to the specified destination path.

          * COPY: Copy one or more workspace items to the specified destination path.

          * REPOSITORY_CHECK_OUT: Check out one or more repository files and/or folders.
          The Check Out Specification

          should be specified in the request body. If 'copyContent' is 'true' in the
          request body, existing workspace

          files will have their content overwritten. By default or if 'copyContent'
          is 'false', the repository file

          content is not copied to the workspace and workspace file content will not
          change.

          * WORKSPACE_CHECK_OUT: Check out one or more workspace files and/or folders.
          Files must also exist in the

          repository to be checked out, therefore, the specified paths must exist
          in both the repository and workspace for

          the check out action to succeed. The Check Out Specification should be specified
          in the request body. If

          'copyContent' is 'true' in the request body, existing workspace files will
          have their content overwritten.

          By default or if 'copyContent' is 'false', the repository file content is
          not copied to the workspace and

          workspace file content will not change.

          * UNDO_CHECKOUT: Undo the check out of one or more files that are currently
          checked out. Users can only undo

          checkout on files they have checked out. The workspace content of the files
          is not affected by undo checkout.

          The request body is a list of paths for the items to undo.

          * UNDO_CHECKOUT_BY_FILTER: Undo the check out of one or more files that
          are currently checked out by specifying

          a filter of synchronization items to act on. The request body is a plain
          text filter.

          * CHECK_IN: Check in one or more files which currently exist in the repository
          and are checked out and/or one or

          more new files which exist in the workspace, but do not yet exist in the
          repository. Checking in a file will

          result in the file being created or updated in the repository and any missing
          parent folders will be created

          in the repository. The Check In Specification should be specified in the
          request body.

          * DOWNLOAD: To be used for tracking download status when downloading one
          or more items. Specify a list of one or more paths to be

          downloaded to the request body, and then use the action status ID returned
          on the response header in each individual item download call. Note the paths

          passed here must match each path sent to download to get the proper download
          status for each item.

          * UPLOAD: To be used for tracking upload status when uploading one or more
          files. Specify a list of one or more file paths to be

          uploaded to the request body, and then use the action status ID returned
          on the response header in each individual file upload call. Note the paths

          passed here must match each path sent to upload to get the proper upload
          status for each file.

          * UPLOAD_EXPAND: To be used for tracking upload status when uploading and
          expanding a zip file to a folder. Specify the destination folder path to
          the

          to the request body, and then use the action status ID returned on the response
          header in the upload and expand call. Note the path

          passed here must match the path sent to upload and expand to get the proper
          upload status.

          * COPY_LATEST_VERSION: Copy the content of one or more files in the repository
          to the workspace. For versioned files the

          content of the most recent version of the file will be copied to the workspace.
          Existing workspace files will have

          their content overwritten if the content of the file does not already match
          that of the most recent version of the

          file in the repository. Additionally, if a repository container path is
          specified, the container will be created

          in the workspace as a folder, and any files and containers within the subtree
          of the container will be also be

          copied to the workspace. The request body is a list of paths for the items
          to perform copy latest version on.

          * COPY_SPECIFIC_VERSION: Copy the content of one or more files in the repository
          to the workspace. The

          content of the specified version of the file will be copied to the workspace.
          Existing workspace files will have

          their content overwritten if the content of the file does not already match
          that of the specified version of the

          file in the repository. The request body is a list File Specifications which
          allow for specifying the path and version

          of each file that should have its version content copied.

          * COPY_FOLDER_STRUCTURE: Copy one or more repository containers in the repository
          to the workspace as folders.

          If 'includeSubfolders' is 'false' only the specified containers are copied
          and none of their content. If

          'includeSubfolders' is 'true' specified containers and containers within
          their subtree will be copied. Files

          are not copied to the workspace. The Copy Folder Specification should be
          specified in the request body.
        schema:
          type: string
          enum:
          - DELETE
          - MOVE
          - COPY
          - REPOSITORY_CHECK_OUT
          - WORKSPACE_CHECK_OUT
          - UNDO_CHECKOUT
          - UNDO_CHECKOUT_BY_FILTER
          - CHECK_IN
          - DOWNLOAD
          - UPLOAD
          - UPLOAD_EXPAND
          - COPY_LATEST_VERSION
          - COPY_SPECIFIC_VERSION
          - COPY_FOLDER_STRUCTURE
      requestBody:
        required: true
        description: >
          The workspace update specification. This value varies based on the
          type of update and the 'action' request parameter value.
        content:
          application/vnd.sas.clinical.workspace.move.copy+json:
            schema:
              title: Workspace Move or Copy
              description: The required information to perform batch move or copy.
              properties:
                version:
                  description: The version of the representation. This is version
                    1.
                  type: number
                  example: 1
                paths:
                  description: The paths of the files or folders to be moved or copied.
                  type: array
                  items:
                    type: string
                  example:
                  - /Results/1-12-23.txt
                  - /Results/Data
                destinationPath:
                  description: The path of the container to which the repository items
                    are moved or copied.
                  type: string
                  example: /Backup/TestingData
          application/vnd.sas.clinical.check.in.specification+json:
            schema:
              title: Check In Specification
              description: The specification for the check in action.
              properties:
                version:
                  type: number
                  description: The version of the representation. This is version
                    1.
                  example: 1
                fileSpecifications:
                  type: array
                  items:
                    $ref: "#/components/schemas/checkInSpecification/properties/fileSpecifications/items"
                  description: The file specifications for the files to be checked
                    in.
                commment:
                  type: string
                  description: The check in comment to be applied to all checked in
                    files.
                  example: Adding SAS programs to repository
                includeNewFiles:
                  type: boolean
                  description: Whether new files should be included in the check in
                    action. Only checked out files will be checked in if false.
          application/vnd.sas.clinical.check.out.specification+json:
            schema:
              title: Check Out Specification
              description: The specification for the check out action.
              properties:
                version:
                  type: number
                  description: The version of the representation. This is version
                    1.
                  example: 1
                paths:
                  type: array
                  description: >
                    The paths for the files and folders to be checked out. If a
                    folder is specified files in the subtree of the folder will
                    be checked out. Additionally, if 'copyContent' is 'true',
                    any non-existing parent contexts and folders of the checked
                    out files are created in the workspace as folders.
                  example:
                  - /testBatchCheckOut-Folder/testBatchCheckOut-File.txt
                  - /testBatchCheckOut-Folder/testBatchCheckOut-Folder2
                  items: {}
                copyContent:
                  type: boolean
                  description: >
                    Whether the checked out files should be copied to the
                    workspace. If true, existing workspace files will be
                    overwritten. The default value is false.
          application/vnd.sas.clinical.copy.folder.specification+json:
            schema:
              title: Copy Folder Specification
              description: The specification for the copy folder structure action.
              properties:
                version:
                  type: number
                  description: The version of the representation. This is version
                    1.
                  example: 1
                paths:
                  type: array
                  description: >
                    The paths for the repository containers to be copied to the
                    workspace. Additionally, any non-existing parent contexts
                    and folders of the copied containers are created in the
                    workspace as folders.
                  example:
                  - /testBatchCopyFolderStructure-Folder1
                  - /testBatchCopyFolderStructure-Folder2
                  items: {}
                includeSubfolders:
                  type: boolean
                  description: >
                    Whether containers within the subtree of specified container
                    paths should be copied to the workspace. The default value
                    is false.
          text/plain:
            schema:
              description: >
                The filter to retrieve the synchronization items to update. This
                applies only when the 'action' request parameter is
                'UNDO_CHECKOUT_BY_FILTER'.
              example: eq(name,'item-to-update.txt')
          application/json:
            schema:
              oneOf:
              - $ref: "#/paths/~1userWorkspace~1items~1batch/post/requestBody/content/application~1vnd.sas.clinical.workspace.move.copy%2Bjson/schema"
              - $ref: "#/paths/~1userWorkspace~1items~1batch/post/requestBody/content/application~1vnd.sas.clinical.check.in.specification%2Bjson/schema"
              - $ref: "#/paths/~1userWorkspace~1items~1batch/post/requestBody/content/application~1vnd.sas.clinical.check.out.specification%2Bjson/schema"
              - $ref: "#/paths/~1userWorkspace~1items~1batch/post/requestBody/content/application~1vnd.sas.clinical.copy.folder.specification%2Bjson/schema"
              - type: array
                example:
                - /testBatchDelete-Folder/testBatchDelete-Item2
                - /testBatchDelete-Folder/testBatchDelete-Folder2
              - type: array
                example:
                  value:
                  - version: 1
                    path: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1727458868194/testBatchCopySpecificVersion-1727458868194/copyLatestFolder2/file4.txt
                    fileVersion: "0.3"
                  - version: 1
                    path: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1727458868194/testBatchCopySpecificVersion-1727458868194/copyLatestFolder1/copyLatestFolder1.1/file3.txt
                    fileVersion: "99.98"
                  - version: 1
                    path: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1727458868194/testBatchCopySpecificVersion-1727458868194/copyLatestFolder1/file1.txt
                    fileVersion: "1.0"
                  - version: 1
                    path: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1727458868194/testBatchCopySpecificVersion-1727458868194/copyLatestFolder2/file5.txt
                    fileVersion: "99999.99999"
                  - version: 1
                    path: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1727458868194/testBatchCopySpecificVersion-1727458868194/copyLatestFolder1/file2.txt
      responses:
        "202":
          description: >
            The request was accepted. See the Location header for a link to
            status information.
          headers:
            Location:
              schema:
                type: string
              description: The link to determine the status of the operation that
                was initiated with this request.
  "/userWorkspace/folders/{path}/**":
    post:
      tags:
      - Workspace
      summary: Create a folder at the specified path with the specified name
      description: |
        Create a folder at the specified path with the specified name.
      operationId: createFolder
      parameters:
      - name: path
        in: path
        schema:
          type: string
        required: true
        description: The path of the parent directory.
        example: /Org/project/programs
      - name: name
        in: query
        schema:
          type: string
        required: true
        description: The name of the folder to be created.
        example: Results
      responses:
        "201":
          description: Created - the folder was created.
          content:
            application/vnd.sas.clinical.workspace.folder:
              schema:
                title: Workspace Folder
                description: The representation of a workspace folder.
                allOf:
                - $ref: "#/components/schemas/workspaceFile/allOf/0"
              examples:
                workspaceFolder:
                  $ref: "#/paths/~1userWorkspace~1items~1item/get/responses/200/content/application~1vnd.sas.clinical.workspace.item/examples/workspaceFolder"
            application/json:
              schema:
                $ref: "#/paths/~1userWorkspace~1folders~1%7Bpath%7D~1**/post/responses/201/content/application~1vnd.sas.clinical.workspace.folder/schema"
              examples:
                workspaceFolder:
                  $ref: "#/paths/~1userWorkspace~1items~1item/get/responses/200/content/application~1vnd.sas.clinical.workspace.item/examples/workspaceFolder"
        "400":
          description: Bad Request
        "404":
          description: Not found - the parent folder could not be found.
        "409":
          description: The workspace folder already exists.
  "/userWorkspace/log/lines/{path}/**":
    get:
      tags:
      - Workspace
      summary: Get the log file content at the specified path
      description: >
        Gets the parsed log file's content. This allows formatting of the output
        rather than a simple text output.
      operationId: getLogLines
      parameters:
      - name: path
        in: path
        schema:
          type: string
        required: true
        description: The path of the log file.
        example: /Org/project/JobLog.log
      responses:
        "200":
          description: The request succeeded and the parsed log is returned.
          content:
            application/vnd.sas.clinical.log:
              schema:
                title: Log
                description: The representation of a log file.
                type: object
                properties:
                  version:
                    type: number
                    description: The version of the representation. This is version
                      1.
                  logLineReps:
                    type: array
                    description: The list of log lines.
                    items:
                      $ref: "#/components/schemas/log/properties/logLineReps/items"
                  hasErrors:
                    type: boolean
                    description: Whether or not the log has any errors.
                  hasWarnings:
                    type: boolean
                    description: Whether or not the log has any warnings.
              examples:
                log:
                  description: Log file representation.
                  value:
                    version: 1
                    logLines:
                    - version: 1
                      line: Wednesday, June 26, 2024 05:27:34 PM
                      type: normal
                    - version: 1
                      line: "NOTE: Additional information about Host:"
                      type: note
                    - version: 1
                      line: "WARNING: The data set WORK._NULL may be incomplete. When\
                        \ this step was stopped there were 0 observations and 0 variables."
                      type: warning
                    - version: 1
                      line: "ERROR: Failed to completed task. Additional information:"
                      type: error
                    hasErrors: true
                    hasWarnings: true
            application/json:
              schema:
                $ref: "#/paths/~1userWorkspace~1log~1lines~1%7Bpath%7D~1**/get/responses/200/content/application~1vnd.sas.clinical.log/schema"
              examples:
                log:
                  $ref: "#/paths/~1userWorkspace~1log~1lines~1%7Bpath%7D~1**/get/responses/200/content/application~1vnd.sas.clinical.log/examples/log"
        "400":
          description: Bad Request
        "404":
          description: The log file was not found at the given path.
  /workspaces/items/batch:
    post:
      tags:
      - Workspace
      summary: Asynchronously update one or more items within one or more workspaces
      description: Asynchronously update one or more items within one or more workspaces.
        Requires administrative privileges.
      operationId: batchAdminUpdate
      parameters:
      - name: clientId
        in: query
        schema:
          type: string
        required: false
        description: The client ID that is associated with the action status.
      - name: action
        in: query
        required: true
        description: >
          The action to perform on the workspace items. Supported actions:

          * UNDO_CHECKOUT: Undo the check out of one or more files that are currently
          checked out. This is an administrative

          undo checkout which allows undoing the checkout of files checked out by
          other users. The workspace content of

          the files is not affected by undo checkout. The request body is a collection
          of Workspace Paths which allows for

          grouping file/folder paths by the associated workspace.

          * UNDO_CHECKOUT_BY_FILTER: Undo the check out of one or more files that
          are currently checked out by specifying

          a filter of synchronization items to act on. This is an administrative undo
          checkout which allows undoing the

          checkout of files checked out by other users. The workspace content of the
          files is not affected by undo checkout.

          The request body is a plain text filter.
        schema:
          type: string
          enum:
          - UNDO_CHECKOUT
          - UNDO_CHECKOUT_BY_FILTER
      requestBody:
        required: true
        description: >
          The update specification. This value varies based on the type of
          update and the 'action' request parameter value.
        content:
          application/json:
            schema:
              type: array
              example:
                value:
                - version: 1
                  workspaceId: 96ee1102-d7b9-4825-9b4d-df26ba55f2b0
                  paths:
                  - /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1724942479836/testBatchAdminUndoCheckout-1724942479836/folder3
                  - /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1724942479836/testBatchAdminUndoCheckout-1724942479836/file3.txt
                - version: 1
                  workspaceId: de067777-485f-488b-89f0-c8429cce5c4a
                  paths:
                  - /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1724942479836/testBatchAdminUndoCheckout-1724942479836/folder2
                  - /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1724942479836/testBatchAdminUndoCheckout-1724942479836/file2.txt
                - version: 1
                  workspaceId: 5ae783a1-eb1d-49ec-9a39-5204e54a311a
                  paths:
                  - /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1724942479836/testBatchAdminUndoCheckout-1724942479836/folder1
                  - /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1724942479836/testBatchAdminUndoCheckout-1724942479836/file1.txt
          text/plain:
            schema:
              description: >
                The filter to retrieve the synchronization items to update. This
                applies only when the 'action' request parameter is
                'UNDO_CHECKOUT_BY_FILTER'.
              example: eq(name,'item-to-update.txt')
      responses:
        "202":
          description: >
            The request was accepted. See the Location header for a link to
            status information.
          headers:
            Location:
              schema:
                type: string
              description: The link to determine the status of the operation that
                was initiated with this request.
components:
  parameters:
    startParam:
      name: start
      in: query
      description: 0-based offset of the first type to return. Defaults to 0.
      schema:
        type: integer
      example: 10
    limitParam:
      name: limit
      in: query
      description: The maximum number of items to return. Defaults to 10. The maximum
        cannot exceed 500.
      schema:
        type: integer
      example: 10
    filterParam:
      name: filter
      in: query
      description: >
        Filter criteria for items. See [Filtering in REST
        APIs](https://developer.sas.com/apis/rest/Topics/#filters).
      schema:
        type: string
        format: filter-criteria
      example: eq(name,'ACME')
    sortByParam:
      name: sortBy
      in: query
      description: >
        Sorts the returned items. See [Sorting in REST
        APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
      schema:
        type: string
        format: sort-criteria
        example: name:ascending:primary
  schemas:
    fileSpecification:
      title: File Specification
      description: Path and version information for a file.
      properties:
        version:
          type: number
          description: The version of the representation. This is version 1.
          example: 1
        path:
          type: string
          description: The path of the file.
          example: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1718153164023/testBatchCheckIn-1718153164023/checkin-file1.txt
        fileVersion:
          type: string
          description: The version of the file.
          example: "1.0"
    checkInSpecification:
      title: Check In Specification
      description: The specification for the check in action.
      properties:
        version:
          type: number
          description: The version of the representation. This is version 1.
          example: 1
        fileSpecifications:
          type: array
          items:
            title: File Specification
            description: Path and version information for a file.
            properties:
              version:
                type: number
                description: The version of the representation. This is version 1.
                example: 1
              path:
                type: string
                description: The path of the file.
                example: /RemoteSynchronizationTest/RemoteWorkspaceControllerSynchronizationTest-1718153164023/testBatchCheckIn-1718153164023/checkin-file1.txt
              fileVersion:
                type: string
                description: The version of the file.
                example: "1.0"
          description: The file specifications for the files to be checked in.
        commment:
          type: string
          description: The check in comment to be applied to all checked in files.
          example: Adding SAS programs to repository
        includeNewFiles:
          type: boolean
          description: Whether new files should be included in the check in action.
            Only checked out files will be checked in if false.
    checkOutSpecification:
      title: Check Out Specification
      description: The specification for the check out action.
      properties:
        version:
          type: number
          description: The version of the representation. This is version 1.
          example: 1
        paths:
          type: array
          description: >
            The paths for the files and folders to be checked out. If a folder
            is specified files in the subtree of the folder will be checked out.
            Additionally, if 'copyContent' is 'true', any non-existing parent
            contexts and folders of the checked out files are created in the
            workspace as folders.
          example:
          - /testBatchCheckOut-Folder/testBatchCheckOut-File.txt
          - /testBatchCheckOut-Folder/testBatchCheckOut-Folder2
          items: {}
        copyContent:
          type: boolean
          description: >
            Whether the checked out files should be copied to the workspace. If
            true, existing workspace files will be overwritten. The default
            value is false.
    copyFolderSpecification:
      title: Copy Folder Specification
      description: The specification for the copy folder structure action.
      properties:
        version:
          type: number
          description: The version of the representation. This is version 1.
          example: 1
        paths:
          type: array
          description: >
            The paths for the repository containers to be copied to the
            workspace. Additionally, any non-existing parent contexts and
            folders of the copied containers are created in the workspace as
            folders.
          example:
          - /testBatchCopyFolderStructure-Folder1
          - /testBatchCopyFolderStructure-Folder2
          items: {}
        includeSubfolders:
          type: boolean
          description: >
            Whether containers within the subtree of specified container paths
            should be copied to the workspace. The default value is false.
    synchronizationInfo:
      title: Synchronization Info
      description: The representation of synchronization information for a repository
        and/or workspace file.
      type: object
      properties:
        version:
          type: number
          description: The version of the representation. This is version 1.
        checkedOut:
          type: boolean
          description: Indicates whether the file associated with this synchronization
            information is checked out.
        checkedOutBy:
          type: string
          description: >
            The identifier of the user who has the file associated with this
            synchronization information checked out (if the file is checked
            out).'
        checkedOutByDisplayName:
          type: string
          description: >
            The display name of the user who has the file associated with this
            synchronization information checked out (if the file is checked
            out).
        checkedOutTimeStamp:
          type: string
          format: date-time
          description: >
            The date and time the file associated with this synchronization
            information was checked out (if the file is checked out).
        synchronizationFileVersion:
          type: string
          description: >
            The version of the file in the repository at the time the workspace
            file was synced with the repository. Files can be synced via a check
            in, check out (with copy content) or copy to workspace actions.
        synchronizationTimeStamp:
          type: string
          format: date-time
          description: >
            The date and time the workspace file and repository file were last
            synced. Files can be synced via a check in, check out or copy to
            workspace actions.
        workspaceStatus:
          type: string
          description: The workspace status of the file associated with this synchronization
            information.
          enum:
          - IN_SYNC
          - NOT_SYNCED
          - OUT_OF_SYNC
          - WORKSPACE_FILE_MISSING
    synchronizationItem:
