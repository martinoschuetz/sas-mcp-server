                checked out).
            checkedOutTimeStamp:
              type: string
              format: date-time
              description: >
                The date and time the file associated with this synchronization
                information was checked out (if the file is checked out).
            synchronizationFileVersion:
              type: string
              description: >
                The version of the file in the repository at the time the
                workspace file was synced with the repository. Files can be
                synced via a check in, check out (with copy content) or copy to
                workspace actions.
            synchronizationTimeStamp:
              type: string
              format: date-time
              description: >
                The date and time the workspace file and repository file were
                last synced. Files can be synced via a check in, check out or
                copy to workspace actions.
            workspaceStatus:
              type: string
              description: The workspace status of the file associated with this synchronization
                information.
              enum:
              - IN_SYNC
              - NOT_SYNCED
              - OUT_OF_SYNC
              - WORKSPACE_FILE_MISSING
    workspace:
      title: Workspace
      description: >
        An area where files and folders may be stored. A workspace is associated
        with a specific user. Files and folders within a user's workspace are
        only accessible by that user.
      properties:
        version:
          description: The version of the representation. This is version 1.
