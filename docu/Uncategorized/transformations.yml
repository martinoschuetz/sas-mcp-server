---
openapi: 3.0.3
info:
  version: "3"
  title: Transformations
  description: Regardless of where data resides, the transformations you need to perform
    on that data are often the same. The Data Transformation API provides a means
    to model the information needed to perform a data transformation and specify code
    generation templates to be used to generate code for data transformations in the
    location in which the data being operated on exists.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Transformations
  description: Contains the operations for the Transformations resource.
- name: Schemas
  description: Contains the operations for the Schemas resource.
- name: Templates
  description: Contains the operations for the Templates resource.
paths:
  /:
    get:
      operationId: root
      summary: API Root
      description: The API root
      tags:
      - Root
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/json
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                "Default":
                  $ref: "#/components/examples/RootGet200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                "Default":
                  $ref: "#/components/examples/RootGet200Response"
    head:
      operationId: headersForRoot
      summary: Headers on root
      description: Check if the service is available
      tags:
      - Root
      responses:
        "200":
          description: OK.  The service is available
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/json
  /transformations:
    post:
      operationId: createTransformation
      summary: Create a transformation
      description: Create a transformation from the provided request
      tags:
      - Transformations
      requestBody:
        content:
          application/vnd.sas.transformation+json:
            schema:
              $ref: "#/components/schemas/transformation"
            examples:
              "Default":
                $ref: "#/components/examples/Transformation"
          application/json:
            schema:
              $ref: "#/components/schemas/transformation"
            examples:
              "Default":
                $ref: "#/components/examples/Transformation"
        description: Transformation to create
        required: true
      responses:
        "201":
          description: Transformation created successfully
          headers:
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
            Location:
              description: location of the newly created resource
              schema:
                type: string
          content:
            application/vnd.sas.transformation+json:
              schema:
                $ref: "#/components/schemas/transformation"
              examples:
                "Default":
                  $ref: "#/components/examples/TransformationGet200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/transformation"
              examples:
                "Default":
                  $ref: "#/components/examples/TransformationGet200Response"
        "400":
          description: Bad Request.  The request body is malformed, or one of the
            representation members in the request body is invalid.
        "409":
          description: Conflict. This will occur when the user provides an id in the
            request.
        "415":
          description: unsupported media type
    get:
      operationId: getTransformations
      summary: Get all transformations
      description: Returns a collection of transformations. Standard paging, filtering
        and sorting options are provided.
      tags:
      - Transformations
      parameters:
      - name: start
        in: query
        description: The starting index of the first transformation in a page. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of transformations to return in this page of results.
          The actual number of returned transformations may be less if the collection
          has been exhausted. Defaults to 30.
        schema:
          type: integer
      - name: filter
        in: query
        description: Filter criteria for returned transformation.
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort returned transformations.  The sort criteria supports the
          following fields in either ascending or descending order (name, description).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK.  The service is available
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/vnd.sas.collection+json
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/transformationCollection"
              examples:
                "Default":
                  $ref: "#/components/examples/TransformationsGet200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/transformationCollection"
              examples:
                "Default":
                  $ref: "#/components/examples/TransformationsGet200Response"
  "/transformations/{transformationId}":
    get:
      operationId: getTransformation
      summary: Get transformation
      description: Returns information about a single transformation based on its
        unique id.
      tags:
      - Transformations
      parameters:
      - name: transformationId
        in: path
        description: id of the transformation
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK. Transformation exists.
          headers:
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.transformation+json:
              schema:
                $ref: "#/components/schemas/transformation"
              examples:
                "Default":
                  $ref: "#/components/examples/TransformationGet200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/transformation"
              examples:
                "Default":
                  $ref: "#/components/examples/TransformationGet200Response"
        "404":
          description: Transformation does not exist
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error404Response"
    head:
      operationId: headersForTransformation
      summary: Check if transformation exists
      description: Returns whether or not the transformation with the specified id
        exists.
      tags:
      - Transformations
      parameters:
      - name: transformationId
        in: path
        description: id of the transformation
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK. Transformation exists.
          headers:
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
        "404":
          description: Transformation does not exist
    put:
      operationId: updateTransformation
      summary: Update/Replace an existing transformation
      description: Either updates an existing transformation via a full replacement
        of the resource or creates the resource with the given id. If the object already
        exists, and the etag isn't passed in, the update will fail.
      tags:
      - Transformations
      parameters:
      - name: transformationId
        in: path
        description: id of the transformation
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: The etag that was returned from a GET, POST, or PUT of this job
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.transformation+json:
            schema:
              $ref: "#/components/schemas/transformation"
            examples:
              "Default":
                $ref: "#/components/examples/Transformation"
          application/json:
            schema:
              $ref: "#/components/schemas/transformation"
            examples:
              "Default":
                $ref: "#/components/examples/Transformation"
        description: transformation to update
        required: true
      responses:
        "200":
          description: transformation updated successfully
          headers:
            Etag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.transformation+json:
              schema:
                $ref: "#/components/schemas/transformation"
              examples:
                "Default":
                  $ref: "#/components/examples/TransformationGet200Response"
            application/json:
              schema:
                $ref: "#/components/schemas/transformation"
              examples:
                "Default":
                  $ref: "#/components/examples/TransformationGet200Response"
        "400":
          description: Bad Request. The request body is malformed, or one of the representation
            members in the request body is invalid.  This status will also be returned
            when the user provides an id in the request body that does not match the
            id in the path of the url.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error400Response"
        "412":
          description: The ETag provided does not match the current version of the
            object.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error412Response"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                "Default":
                  $ref: "#/components/examples/Error412Response"
        "415":
          description: unsupported media type
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error415Response"
        "428":
          description: The ETag was not provided when updating an existing type.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error428Response"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                "Default":
                  $ref: "#/components/examples/Error428Response"
    delete:
      operationId: deleteTransformation
      summary: Delete a transformation
      description: Deletes the specified transformation and permanently removes it
        from the service.
      tags:
      - Transformations
      parameters:
      - name: transformationId
        in: path
        description: id of the transformation
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Transformation deleted successfully
        "404":
          description: Transformation does not exist
  "/transformations/{transformationId}/schema":
    get:
      operationId: getTransformationSchema
      summary: Get the transformation's JSON schema
      description: Get the JSON schema defining the inputs for this transformation
      tags:
      - Schemas
      parameters:
      - name: transformationId
        in: path
        description: id of the transformation
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK. Transformation's schema retrieved successfully
          content:
            application/schema:
              schema:
                format: string
              examples:
                "Default":
                  $ref: "#/components/examples/SchemaGet200Response"
        "404":
          description: Transformation or its respective schema does not exist
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error404Response"
    put:
      operationId: updateTransformationSchema
      summary: Update/Replace the transformation's JSON schema
      description: Set the JSON schema defining the inputs for this transformation
      tags:
      - Schemas
      parameters:
      - name: transformationId
        in: path
        description: id of the transformation
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
            examples:
              "Default":
                $ref: "#/components/examples/Schema"
          application/schema:
            schema:
              type: string
            examples:
              "Default":
                $ref: "#/components/examples/Schema"
          application/octet-stream:
            schema:
              type: string
            examples:
              "Default":
                $ref: "#/components/examples/Schema"
        description: Schema defining the inputs for this transformation
        required: true
      responses:
        "200":
          description: OK. JobType template updated successfully.
          content:
            "*/*":
              schema:
                type: string
              examples:
                "Default":
                  $ref: "#/components/examples/SchemaGet200Response"
        "400":
          description: Bad Request.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error400Response"
        "404":
          description: Transformation does exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error404Response"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resource's last modified timestamp.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error412Response"
        "428":
          description: The request headers did not include an `If-Match` or `If-Unmodified-Since`
            precondition. The ETag was not provided when updating an existing type.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error428Response"
  "/transformations/{transformationId}/templates/{jobType}":
    get:
      operationId: getTransformationTemplate
      summary: Get the code gen template
      description: Get the code gen template for the given transformation and job
        type
      tags:
      - Templates
      parameters:
      - name: transformationId
        in: path
        description: id of the transformation
        required: true
        schema:
          type: string
      - name: jobType
        in: path
        description: type of job to use this template for
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK. Transformation's job type's template retrieved successfully.
          content:
            "*/*":
              schema:
                type: string
              examples:
                "Default":
                  $ref: "#/components/examples/Template"
        "404":
          description: Transformation or JobType template do not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error404Response"
    put:
      operationId: updateTransformationTemplate
      summary: Update/Replace the code gen template
      description: Update/Replace the code gen template for the given transformation
        and job type
      tags:
      - Templates
      parameters:
      - name: transformationId
        in: path
        description: id of the transformation
        required: true
        schema:
          type: string
      - name: jobType
        in: path
        description: type of job to use this template for
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
            examples:
              "Default":
                $ref: "#/components/examples/Template"
          application/json:
            schema:
              type: string
            examples:
              "Default":
                $ref: "#/components/examples/Template"
        description: code gen template
        required: true
      responses:
        "200":
          description: OK. Transformation's job type's template updated successfully.
          content:
            "*/*":
              schema:
                type: string
              examples:
                "Default":
                  $ref: "#/components/examples/TemplateGet200Response"
        "404":
          description: Transformation does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                "Default":
                  $ref: "#/components/examples/Error404Response"
servers:
- url: http://example.com/transformations
  description: mock server
components:
  schemas:
    transformation:
      description: A set of one or more operations upon data that are performed as
        a "atomic" operation.
      type: object
      properties:
        version:
          type: number
          description: version of the media type
        transformationVersion:
          type: number
          description: version of the transformation as provided by the creator of
            the transformation
        id:
          type: string
          description: unique id
        name:
          type: string
          description: name
        description:
          type: string
          description: description
        targetPlatforms:
          type: array
          description: environments in which this transformation can be executed
          items:
            type: string
        type:
          type: string
          description: type of transformation (column, row, table, multiTable)
        columnType:
          type: string
          description: type of column (string, decimal)
        inputPorts:
          type: array
          items:
            $ref: "#/components/schemas/port"
        outputPorts:
          type: array
          items:
            $ref: "#/components/schemas/outputPort"
        links:
          type: array
          description: zero or more link objects
          items:
            $ref: "#/components/schemas/link"
        properties:
          type: array
          description: a list of user provided properties
          items:
            $ref: "#/components/schemas/prop"
    port:
      type: object
      description: a data input into a transformation.  It can contain multiple per
        named port, depending on the min and max entries settings.
      properties:
        name:
          type: string
          description: name of the port
        description:
          type: string
          description: description of the port
        minEntries:
          type: integer
          description: minimum number of entries for this port
        maxEntries:
          type: integer
          description: maximum number of entries for this port
    outputPort:
      type: object
      description: a data output connection from a transformation. It can contain
        multiple per named port, depending on the min and max entries settings.
      allOf:
      - $ref: "#/components/schemas/port"
      - type: object
        properties:
          columnDelta:
            $ref: "#/components/schemas/columnDelta"
    columnDelta:
      type: object
      description: the changes to an input port as it is processed by a transformation.
      properties:
        inputPort:
          type: string
          description: name of the input port on which this delta applies
        addedColumns:
          type: array
          description: list of parameter names that represent columns that were added
            to this input port
          items:
            type: string
        removedColumns:
          type: array
          description: list of parameter names that represent columns that were removed
            from this input port
          items:
            type: string
        redefinesSchema:
          type: boolean
          description: indicates whether the schema for this output port is refined
            as part of this transformation and can't be inferred from an input port.  If
            this is true, added and removed columns fields are ignored.
    transformationCollection:
      type: object
      description: A pageable collection of transformation objects
      properties:
        name:
          type: string
          description: The name of the collection "transformations" in the context
            of the request.
        start:
          type: integer
          description: The 0-based index of the result candidates to start returning.
        limit:
          type: integer
          description: The maximum number of results requested.
        count:
          type: integer
          description: The actual number of results returned in the collection.
        accept:
          type: string
          description: The accept header value that was used in the initial request.
        links:
          type: array
          description: Paging links that apply to this object
          items:
            $ref: "#/components/schemas/link"
        items:
          type: array
          description: The actual results of a query
          items:
            $ref: "#/components/schemas/transformation"
        version:
          type: integer
          description: Collection schema version
    api:
      type: object
      description: a collection of the base links of the service
      properties:
        links:
          type: array
          description: the base links of the service
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    prop:
      type: object
      description: Name/value pair
      properties:
        name:
          type: string
          description: Name of the property
        value:
          type: string
          description: Value of the property
    errorResponse:
      description: A commons error representation.
      properties:
        message:
          type: string
          description: The error message.
        errorCode:
          type: integer
          description: An integer code indicating the nature of the failure.
        httpStatusCode:
          type: integer
          description: The HTTP status response.
        remediation:
          type: string
          description: An optional string indicating what the client might be able
            to do to complete the operation successfully.
        details:
          type: array
          description: An array of strings that contain details about the error.
          items:
            type: string
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
  examples:
    TransformationGet200Response:
      description: Get collection of transformations successful response.
      value:
        version: 3
        id: 4093b46f-3c42-417d-bbf0-dae694d89ca3
        name: DATAFLOW.COMMON.CASING
        description: Make values in a column a uniform upper or lower case.
        targetPlatforms:
        - SAS.DS1
        type: column
        columnType: string
        links:
        - method: GET
          rel: self
          href: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3
          uri: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3
          type: application/vnd.sas.transformation
        - method: GET
          rel: schema
          href: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3/schema
          uri: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3/schema
          type: application/schema+json
        - method: PUT
          rel: update
          href: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3
          uri: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3
          type: application/vnd.sas.transformation
          responseType: application/vnd.sas.transformation
        - method: DELETE
          rel: delete
          href: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3
          uri: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3
        - method: PUT
          rel: updateSchema
          href: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3/schema
          uri: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3/schema
          type: application/schema+json
        - method: PUT
          rel: updateTemplate
          href: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3/templates/{jobType}
          uri: /transformations/transformations/4093b46f-3c42-417d-bbf0-dae694d89ca3/templates/{jobType}
        properties: []
        transformationVersion: 2
    Template:
      description: Template string model example.
      value: REST
    Error428Response:
      description: Unable to update transformation because an ETag was not provided
        with the request.
      value:
        errorCode: 0
        message: Unable to update transformation {0} because an ETag was not provided
          with the request.
        details:
        - 'traceId: 631aabd55c243006'
        - 'path: /transformations/transformations/f2d28238-0de6-44c0-85ab-083b2b21631d'
        links: []
        version: 2
        httpStatusCode: 428
    Error404Response:
      description: Transformation not found response.
      value:
        errorCode: 32809
        message: Requested transformation with id 85a14fb8-5bfe-4bdb-bd69-6433ee26740
          could not be found.
