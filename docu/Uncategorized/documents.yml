            uri: "/documents/topicDocuments/AIRLINES_KEY_PARSING_TERMS_OUT_476ACB51-D420-4A0D-B727-B36C03CB84DE_TOPICS_OUT_F6F98215-1D4A-4BA0-AB7F-C98A98D761D2/topics/1/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text&sentimentTableInfo=TACASLIB~fs~AIRLINES_KEY_SENTIMENT_OUT_3A6489B7-3064-4267-811D-29821CB6FC9C&sortBy=relevancy:descending"
            type: application/vnd.sas.collection
            itemType: application/vnd.sas.text.document.topic
          id: "4159"
          text: "I have a thought concerning your airline that I'd like to pass on.\
            \ I hope you find it of some benefit.     Here's the suggestion: First,\
            \ let me say, I am not fat, but I do identify with our overweight fellow\
            \ passengers.  I am 6 feet tall.  When I was in high school, I said 5\
            \ feet 12 inches, so I wouldn't seem so tall for a girl.  I can understand\
            \ both sides of the weight/seat rules, but my sympathy goes out to the\
            \ people who are overweight.  I am sure they wish NOT to be fat.  If you\
            \ think it is hard on other passengers to sit next to a fat person, just\
            \ think how hard it is on the fat person who is stuffed into a seat that\
            \ is minimally large enough for the average passenger.  Why not reward\
            \ the skinny people with frequent flyer miles for having the correct body\
            \ surface area for their height and weight?    Why not reserve special\
            \ seating for our overweight pals.  Then, if there are say, 4 such large\
            \ seats per aircraft, then 4 people who would otherwise be uncomfortable\
            \ could fly in the relative comfort that the rest of us enjoy.  I would\
            \ hesitate to continue this policy as it stands.  I know you respond to\
            \ the needs of your passengers.  Please don't start asking us what size\
            \ shoes we wear!!!!!!   When I consider all of the interactions I've had\
            \ with your company, I'd have to say I'm extremely happy with your performance.\
            \ I'm definitely going to fly with you again. And, you can bet I'll recommend\
            \ others fly you, too.  Here's some more about me: I've flown five times\
            \ or less in the past 12 months, mostly for pleasure. I usually buy a\
            \ discount coach ticket.   Thanks for taking the time to read this. I\
            \ hope to hear something from you soon."
