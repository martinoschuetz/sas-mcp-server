            uri: "/documents/topicDocuments/AIRLINES_KEY_PARSING_TERMS_OUT_476ACB51-D420-4A0D-B727-B36C03CB84DE_TOPICS_OUT_F6F98215-1D4A-4BA0-AB7F-C98A98D761D2/topics/1/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text&sentimentTableInfo=TACASLIB~fs~AIRLINES_KEY_SENTIMENT_OUT_3A6489B7-3064-4267-811D-29821CB6FC9C&sortBy=relevancy:descending"
            type: application/vnd.sas.collection
            itemType: application/vnd.sas.text.document.topic
          id: "4693"
          text: "I would like to bring to your attention a problem I encountered with\
            \ your airline's flight attendants.    I was flying from Honolulu to Los\
            \ Angeles on a booked flight when I was asked  by a flight attendant if\
            \ I would give up my much valued and sought after &quot;extra leg room&quot;\
            \ seat to a very tall man that just had surgery on his knee.  I was very\
            \ hesitant at first for the obvious reason being having leg room makes\
            \ a five hour flight much more comfortable.  Well, they asked the passenger\
            \ seated next to me to give up his seat also so that the man could sit\
            \ with his wife.  He said he would move if they upgraded him to first\
            \ class.  The flight attendant told both of us that they'd seat us in\
            \ first class for changing seats.  (We knew that they were available because\
            \ they were selling them at the check in counter prior to boarding.) \
            \ The flight attendant directed us to our new seats - but not in first\
            \ class!  It was very upsetting.  Not only did we give up our assigned\
            \ seats that had LEG ROOM but we were moved to seats with NO LEG ROOM\
            \ and not upgraded to first class like we were told!  Before take-off\
            \ we were told that because of security reasons, they could not bring\
            \ people up from economy to first class.  Well, that's not true because\
            \ two young men siting three rows in front of us got moved to first class\
            \ right before the plane took off because they were friends of someone\
            \ who worked at the ticket counter!  I don't understand the misrepresentation.\
            \  I am a professional female and the passenger who also gave up his seat\
            \ is a professional as well.  Why were we told one thing and denied it\
            \ in return?  Wow, we got free headsets and two drink tickets instead.\
            \    Here's what I'd like to see happen: Do what's right!  It's up to\
            \ you! Don't promise first class and smooth it over with drink tickets\
            \ and headsets.  Tell your flight attendants to be honest with their offer.\
            \  I probably would've moved for the drink tickets just to be nice to\
            \ the guy with the bad knee!  No one would turn down a chance to sit in\
            \ first class!   Here's a little about me: I've flown five times or less\
            \ in the past 12 months, mostly for business.  I hope you are able to\
            \ address my concerns. I look forward to hearing from you soon."
          topicId: "1"
          sentiment: Negative
          relevancy: 0.8913609430890731
