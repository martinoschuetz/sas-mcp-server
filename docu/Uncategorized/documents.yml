---
openapi: 3.0.3
info:
  version: "4"
  title: Documents
  description: |
    The Documents API can be used to retrieve documents information that is stored on the CAS server in a CAS table. This API enables users to retrieve documents related to different text analytics components that derive terms, topics, concepts, categories, and so on. This API is therefore linked to and from the other related microservices. Whenever a user performs a text analysis based on terms, topics, concepts, categories, or sentiment, the documents are matched with the associated text components.  <br/><br/>
    Additionally, this API can give insight to users regarding how many documents are matched to a particular text component. Also, highlighting is displayed for matching text (tokens) along with position information within the documents.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: "http://example.com/documents"
  description: This is a sample base URL.
tags:
- name: Root
  description: The API root.
- name: DocumentTables
  description: Operations performed on document tables.
- name: ConceptDocuments
  description: Operations performed on matching concept documents.
- name: CategoryDocuments
  description: Operations performed on matching category documents.
- name: TermDocuments
  description: Operations performed on matching term documents.
- name: TopicDocuments
  description: Operations performed on matching topic documents.
paths:
  /:
    get:
      tags:
      - Root
      summary: Gets API resource links
      operationId: root
      description: Returns a list of links to the top level resources in this API.
        This entry point does not require authentication. Some links can be omitted
        for non-authenticated calls.
      responses:
        "200":
          description: A collection of link objects.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
      parameters: []
  "/documentTables/{tableId}/documents":
    get:
      tags:
      - DocumentTables
      summary: Gets the entire collection of all table documents
      operationId: getDocumentTablesDocuments
      description: Returns information about a collection of all table documents based
        on a unique tableId.
      parameters:
      - name: tableId
        in: path
        required: true
        description: The ID of the document table.
        schema:
          type: string
      - name: serverId
        in: query
        required: true
        description: The ID of the server from which to fetch the documents.
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: The name of the CAS library from which to fetch the documents.
        schema:
          type: string
      - name: textColumnName
        in: query
        required: true
        description: The column name in the documents table used to identify the text
          of a document.
        schema:
          type: string
      - name: idColumnName
        in: query
        required: false
        description: The column name in the documents table used to uniquely identify
          documents. The default is "\__uniqueid\__".
        schema:
          type: string
          default: __uniqueid__
      - name: returnFields
        in: query
        required: false
        description: "The document fields to return. These fields are the column names\
          \ of a document table. Multiple fields can be specified separated by a comma\
          \ (,)."
        schema:
          type: string
      - name: languageColumnName
        in: query
        required: false
        description: The column name in the documents table used to identify the language
          of a document.
        schema:
          type: string
      - name: languageValue
        in: query
        required: false
        description: The ISO 639-1 code for the document language. This parameter
          is used together with the languageColumnName parameter to fetch documents
          belonging to the specified language.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: |
          Maximum number of documents to return in this page of results. The actual number of returned documents could be less if the collection has been exhausted. The default is 100.
        schema:
          type: integer
          default: 100
      - name: start
        in: query
        required: false
        description: The starting offset. The default is 0.
        schema:
          type: integer
          default: 0
      - name: sortBy
        in: query
        description: |
          Sort-returned documents. The sort criteria support the following fields in either ascending or descending order (id, sentiment, display variables). The default is "id". See [sorting collections](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
          default: id
      - name: sentimentTableInfo
        in: query
        required: false
        description: The sentiment CAS table information in forms of "myCaslib~fs~myCasTable"
          where "myCaslib" and "myCasTable" are caslib and CAS table name respectively.
        schema:
          type: string
      - $ref: "#/components/parameters/indexTableInfo"
      - $ref: "#/components/parameters/searchTerms"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/documentCollection"
              examples:
                api:
                  $ref: "#/components/examples/getDocumentsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/documentCollection"
              examples:
                api:
                  $ref: "#/components/examples/getDocumentsResponse"
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "404":
          description: A table with the given ID does not exist.
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getDocumentsErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getDocumentsErrorResponse"
  "/documentTables/{tableId}/documents/{documentId}":
    get:
      tags:
      - DocumentTables
      summary: Gets a single table document
      operationId: getDocumentTablesDocument
      description: Returns information about a single table document based on its
        unique documentId within a specified document table.
      parameters:
      - name: tableId
        in: path
        required: true
        description: The ID of the document table.
        schema:
          type: string
      - name: documentId
        in: path
        required: true
        description: The ID of the topic document.
        schema:
          type: string
      - name: serverId
        in: query
        required: true
        description: The ID of the server from which to fetch the document.
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: The name of the CAS library from which to fetch the document.
        schema:
          type: string
      - name: textColumnName
        in: query
        required: true
        description: The column name in the documents table used to identify the text
          of a document.
        schema:
          type: string
      - name: idColumnName
        in: query
        required: false
        description: The column name in the documents table used to uniquely identify
          documents. The default is "\__uniqueid\__".
        schema:
          type: string
          default: __uniqueid__
      - name: returnFields
        in: query
        required: false
        description: "The document fields to return. These fields are the column names\
          \ of a document table. Multiple fields can be specified separated by a comma\
          \ (,)."
        schema:
          type: string
      - name: sentimentTableInfo
        in: query
        required: false
        description: The sentiment CAS table information in forms of "myCaslib~fs~myCasTable"
          where "myCaslib" and "myCasTable" are caslib and CAS table name respectively.
        schema:
          type: string
      - $ref: "#/components/parameters/indexTableInfo"
      - $ref: "#/components/parameters/searchTerms"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.text.document+json:
              schema:
                $ref: "#/components/schemas/document"
              examples:
                api:
                  $ref: "#/components/examples/getDocumentResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/document"
              examples:
                api:
                  $ref: "#/components/examples/getDocumentResponse"
          headers:
            Content-Type:
              schema:
                type: string
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "404":
          description: A table or document with the given ID does not exist.
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
          content:
            application/vnd.sas.text.document+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getDocumentErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getDocumentErrorResponse"
  "/conceptDocuments/{taxonomyId}/concepts/{conceptId}/documents":
    get:
      tags:
      - ConceptDocuments
      summary: Gets the entire collection of matching concept documents
      operationId: getConceptDocuments
      description: The entry point into this service should be from the concept taxonomy
        service. Navigating from here returns information about a collection of matching
        concept documents based on its unique conceptId within a specified concept
        taxonomy.
      parameters:
      - name: taxonomyId
        in: path
        required: true
        description: The ID of the concept taxonomy.
        schema:
          type: string
      - name: conceptId
        in: path
        required: true
        description: The ID of the concept.
        schema:
          type: string
      - name: serverId
        in: query
        required: true
        description: The ID of the server from which to fetch the documents.
        schema:
          type: string
      - name: casLibName
        in: query
        required: true
        description: The name of the CAS library from which to fetch the documents.
        schema:
          type: string
      - name: textColumnName
        in: query
        required: true
        description: The column name in the documents table used to identify the text
          of a document.
        schema:
          type: string
      - name: idColumnName
        in: query
        required: false
        description: The column name in the documents table used to uniquely identify
          documents. The default is "\__uniqueid\__".
        schema:
          type: string
          default: __uniqueid__
      - name: returnFields
        in: query
        required: false
        description: "The document fields to return. These fields are the column names\
          \ of a document table. Multiple fields can be specified separated by a comma\
          \ (,)."
        schema:
          type: string
      - name: sortBy
        in: query
        description: |
          Sort-returned documents. The sort criteria support the following fields in either ascending or descending order (id, fact matches, sentiment, display variables). The default is "id". See [sorting collections](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
          default: id
      - name: limit
        in: query
        required: false
        description: |
          Maximum number of documents to return in this page of results. The actual number of
          returned documents could be less if the collection has been exhausted. The default is 100.
        schema:
          type: integer
          default: 100
      - name: start
        in: query
        required: false
        description: The starting offset. The default is 0.
        schema:
          type: integer
          default: 0
      - name: sentimentTableInfo
        in: query
        required: false
        description: The sentiment CAS table information in forms of "myCaslib~fs~myCasTable"
          where "myCaslib" and "myCasTable" are caslib and CAS table name respectively.
        schema:
          type: string
      - name: searchMatches
        in: query
        required: false
        description: |
          Indicates whether to return search highlighting in the text field or not.
          By default or when the value is set to false, even if the search query parameter is provided,
          the tokens and text fields are returned in documents and there will be no search highlighting.
          If the value is set to true and there is a search query parameter along with indexTableInfo,
          the search highlighting will be returned in the text field and there will be no tokens returned.
        schema:
          type: boolean
          default: false
      - name: unMatched
        in: query
        required: false
        description: |
          Indicates whether to return documents that have no matches for the specified concept. 
          By default, or when the value is set to false, documents are returned that match the specified concept. 
          If the value is set to true, documents are returned that have no matches for the specified concept.
        schema:
          type: boolean
          default: false
      - $ref: "#/components/parameters/indexTableInfo"
      - $ref: "#/components/parameters/searchTerms"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/conceptDocumentCollection"
              examples:
                api:
                  $ref: "#/components/examples/getConceptDocumentsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/conceptDocumentCollection"
              examples:
                api:
                  $ref: "#/components/examples/getConceptDocumentsResponse"
          headers:
            Content-Type:
              schema:
                type: string
            Last-Modified:
              description: When response was created.
              schema:
                type: string
        "404":
          description: A concept with the given ID does not exist.
          headers:
            Last-Modified:
              description: When response was created.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getConceptDocumentsErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                api:
                  $ref: "#/components/examples/getConceptDocumentsErrorResponse"
