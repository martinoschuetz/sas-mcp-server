            itemType: application/vnd.sas.text.document.term
          id: "4"
          text: "Since I'm not terribly shy about writing when I have had a poor experience\
            \ with Continental, I thought it was appropriate to write you to share\
            \ some more positive thoughts.    I flew on Christmas Day from Houston\
            \ (IAH) to Portland, Oregon (PDX), on the 11:49 am flight (583, as I recall\
            \ from memory) and was quite happy with the professional, courteous, and\
            \ effective service provided by Steve J., a gate agent in Houston who\
            \ was working the Portland flight.      Upon arriving at the gate, Mr.\
            \ J. noted in the computer that I apparently did not have a ticket and\
            \ that it had been canceled, which, needless to say, was inconsistent\
            \ with the assurances I received from a telephone reservations agent from\
            \ whom I had ticketed a few days prior.  I was upset and frustrated and\
            \ Mr. J. was unusually professional and calm in resolving the matter.\
            \  After a call and some furious typing, he discovered that the telephone\
            \ agent (who by the way could use some training) had failed to enter my\
            \ credit card number and we quickly resolved the situation.  Before I\
            \ could even get upset about the elite upgrade I had lost out on because\
            \ of the snafu Mr. J. handed me a first-class boarding pass along with\
            \ a pleasant Merry Christmas greeting.    I could be writing you today\
            \ to complain about the telephone agent, among other things, but instead\
            \ am extremely happy to have encountered a gate agent who, despite having\
            \ to work on Christmas, was not only cheerful, but quite good at his job.\
            \ I look forward to many future Continental flights -- maybe I'll even\
            \ forgive the last time I sat on the tarmac at LaGuardia for two hours!\
            \    Sincerely,    Jeffrey S."
