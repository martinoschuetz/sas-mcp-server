          id: "119"
          text: "With complaints about air travel at an all-time high, I hope airlines\
            \ such as yours are willing to listen to passengers like me. I would like\
            \ to bring to your attention a problem I encountered with your airline's\
            \ flight attendants. This incident has left me extremely upset.  This\
            \ incident occurred on 12/25/2000. This was a domestic flight.    I was\
            \ travelling on a red eye flight from Phoenix to La Guardia Christmas\
            \ morning.  Everyone had carry-on luggage so it was taking awhile.  I\
            \ was in the window seat and the gentleman in the aisle had a large bag.\
            \  One flight attendant told him that she would look for a place and that\
            \ he was to wait.  He waited in his seat and put the bag between his legs\
            \ to accomodate other boarding passengers.  Another flight attendant came\
            \ up to him and said &quot;Now you know that ain't gonna work like that.&quot;\
            \  The passenger tried to explain what was going on, but the flight attendant\
            \ cut him off by saying &quot;Uh uh...we cannot fly like that and I will\
            \ kick you off the plane.&quot;  Right then the other flight attendant\
            \ came up and tried to explain what she had been doing and took the bag.\
            \ No apology was given. The passenger had been completely non-confrontational\
            \ while the flight attendant had completely attacked him verbally.  In\
            \ a conversation with the other passenger I stated what a jerk the flight\
            \ attendant had been.  At this point he (the flight attendant) approached\
            \ me and said &quot;if you have something to say say it to my face.&quot;\
            \  To which i replied, &quot;okay, what is your name?&quot;  He said,\
            \ &quot;K.&quot;  I asked for his last name and he said he did not have\
            \ to give it to me.  This was fine.  Then, he came back and, leaning across\
            \ the two seats, got in my face and said that whatever I had said was\
            \ my opinion.  At this point, a verbal altercation occured between the\
            \ two of us which ended in him saying &quot;just sit back and go to sleep&quot;\
            \ in a very condescending tone.  This happened on a plane full of passengers\
            \ while the plane was still at the gate.  When he said that I made up\
            \ my mind that it was not worth it to argue with him.  The passenger's\
            \ comment behind me was that he was afraid to do anything for fear of\
            \ getting yelled at by the flight crew.       Later, when I asked the\
            \ other flight attendant if K was just an initial or his name, she faltered\
            \ and made excuses for his behavior.  I never recieved an apology.   \
            \ My flight had a connection in Chicago and it ended up being only about\
            \ 15 minutes.  Because I travel a lot, I had a feeling that my bags would\
            \ not make the connection with me, which was understandable.  Arriving\
            \ in New York, I found that I was right.  After all the other passengers\
            \ had gotten their luggage, only the Phoenix passengers remained waiting\
            \ for out bags.  We approached the attendant at the carousel who told\
            \ us to wait 15 more minutes.  Why?  Our baggage was not going to magically\
            \ appear.  We went up to the ticket counter where the attendant there\
            \ was not aware of anything.  We asked when the next flight was due in\
            \ from Chicago (thinking that our bags would be on that one) and she had\
            \ no clue.    So, we began filling out the missing baggage forms.  Once\
            \ completed, we were told that it would take at least 3 days to get our\
            \ bags to us.  Please keep in mind that this is Christmas Day; we have\
            \ presents and food in these bags.  When we asked to speak to a supervisor,\
            \ we were told that she was in a very important meeting.  On Christmas\
            \ Day?  At nine am?  What is more important than frustrated customers?\
            \  Finally, someone appeared who said that he would get our bags to us\
            \ that day and he gave us several numbers to call.  Over the course of\
            \ Christmas Day, we called numerous times;  the voicemail was full on\
            \ one line and the other line was the employee break room.  We asked people\
            \ to look for our bags, we asked if anything had happened.  NOTHING was\
            \ done.  We called corporate.  The could not help us until the bags had\
            \ been lost for five days.  We spent Christmas without gifts, without\
            \ a meal, without clean clothing, and with a customer service staff who\
            \ did not care at all that this was going on.  I came back to Phoenix\
            \ three days later, without any bags.  We have been in contact with corporate\
            \ and are trying to resolve the issues with our bags.    I believe I have\
            \ the potential to be a valuable customer of your company, and I hope\
            \ you are willing to address this matter to my satisfaction. My primary\
            \ reason for using American Trans Air is because your prices are usually\
            \ quite fair.    To be honest, I've been very dissatisfied with your airline\
            \ in the past.    I would be unwilling to pay more even if this problem\
            \ were fixed.  I seriously doubt that I will ever fly your airline again,\
            \ and you can be sure I will urge others to avoid American Trans Air whenever\
            \ possible.     Here's what I'd like to see happen: I would like some\
            \ form of disciplinary action to be taken with the flight attendant, and\
            \ I would like a written apology from him.  Corporate can handle the baggage\
            \ issues.  I do not want any free vouchers as I will NEVER fly this airline\
            \ again and, whenever I am travelling, I will let everyone know about\
            \ my experiences with this airline.     I hope you are able to address\
            \ my concerns. I look forward to hearing from you soon."
