            itemType: application/vnd.sas.text.document.concept
          id: "75"
          text: "With complaints about air travel at an all-time high, I hope airlines\
            \ such as yours are willing to listen to passengers like me. I would like\
            \ to bring to your attention a problem I encountered with your airline's\
            \ overall experience. This incident is quite annoying.  For the record,\
            \ my flight number was 5078. This incident occurred on February 5, 2001.\
            \ This was a regional flight.    With a snowstorm impending for Albany\
            \ NY area I attempted to change my American Eagle flight from February\
            \ 5, 2001 to February 4, 2001.  I was told no change could be made until\
            \ my flight was cancelled.    On February 5, 2001, I called (800) 433-7300,\
            \ hourly, to confirm that flight 5078 was a go.  It was reported on time,\
            \ up to and including the time I arrived at ALB, and so I returned my\
            \ rental car.    Then at the gate I was told the flight was still on time.\
            \  It wasn't until shortly before the scheduled 4:25 PM departure, and\
            \ as the snow really started coming, that there would be a delay.  The\
            \ flight was not cancelled until almost 5:30, and then I was out of options.\
            \  I was told that I could stay at a hotel (at my expense), or if I stayed\
            \ at the terminal, I would have to go to the &quot;uncomfortable benches,\
            \ on the other side of the security check area.&quot;    Fortunately I\
            \ was able to arrange accomodations with a friend who drove 23 miles in\
            \ what was now a raging storm, and had a place to stay for the night.\
            \  Before I left I was rebooked on flight 5142 for 11 AM on February 6,\
            \ 2001.    I arrived at ALB approximately 9:30 AM, and told my ride to\
            \ go, as the weather was good, and the 800 number informed me that the\
            \ flight was on-time.  If that was true I wouldn't be writing this.  Just\
            \ before 11 AM I was informed the flight would be cancelled &quot;because\
            \ of weather&quot; and to make an interminable story somewhat shorter,\
            \ I finally left ALB at 1:56 PM (sorry, I don't remember that flight number),\
            \ ultimately arriving at JFK 22 hours late.    PS, I did obtain a meal\
            \ voucher on the second day, but only because I heard someone else ask\
            \ about same.  It was never offered to me.    I believe I have the potential\
            \ to be a valuable customer of your company, and I hope you are willing\
            \ to address this matter to my satisfaction. My primary reason for using\
            \ American Airlines, Inc. is because I have used it satisfactorily before.\
            \    To be honest, I've been somewhat dissatisfied with your airline in\
            \ the past.    When I buy a ticket from your airline I usually spend $150.00.\
            \ I think I'd be willing to pay even more if this problem were fixed.\
            \  I am unsure whether I will fly your airline in the future, and I don't\
            \ know whether I can recommend American Airlines, Inc. to others.    Here's\
            \ what I'd like to see happen: Refund the cost of my return ticket ($51),\
            \ and more importantly, let the customer know sooner when a flight is\
            \ a no go, so that you can utilize your other options.     I hope you\
            \ are able to address my concerns. I look forward to hearing from you\
            \ soon."
          conceptId: 2c9180b75b6da55d015b8bb718750060
