          id: "1703"
          text: "I would like to bring to your attention a problem I encountered with\
            \ your airline's flight attendants on flight 786 - June 28, 2001 - Phoenix\
            \ to Portland - departing 7:41am and arriving 10:27am.    On our recent\
            \ flight from Phoenix to Portland, Oregon, we experienced a very unruly\
            \ six-year-old child traveling alone. The flight attendants did NOTHING\
            \ to provide care or supervision to this child, other than giving her\
            \ snacks and soda. In fact, they gave the child coffee and Dr. Pepper\
            \ for refreshments.   My son and I were seated in 18A and 18B. All of\
            \ the passengers near this child - who was seated in 18F - were dismayed\
            \ and appalled at her behavior.  She was disrespectful, demanding, and\
            \ obnoxious. She continuously kicked the seat in front of her and demanded\
            \ that the passengers around her provide for her needs - which were exhaustive.\
            \   Many of the passengers in rows 17-19 were making jokes about her.\
            \ For instance, at one point she told everyone that she was going to Portland\
            \ to stay with her mother after her father's house caught on fire.  After\
            \ she went to the bathroom, two passengers in row 19 suggested to others\
            \ that her father probably burned the house down on purpose to get rid\
            \ of her.  When the child returned and couldn't find the bathroom, the\
            \ gentleman in 18D told her to go ask the flight attendant - when she\
            \ refused and demanded loudly for him to &quot;come with me right now\
            \ - YOU!  NOW!&quot; and poking him with her finger, he rose to follow\
            \ her to the back.  As he turned to go, he said quietly to several of\
            \ us - &quot;Yes Madeleine, its the door with the big red handle&quot;,\
            \ at which everyone laughed.  The man and his wife (in 18D and 18E) ordered\
            \ vodka and orange juice (remember, this was an 8:00am flight).  When\
            \ the vodka arrived, we teased him that it looked like he was going to\
            \ NEED a drink - he made joking gestures and comments to us across the\
            \ isle that he had ordered it to give to her to shut her up.  We picked\
            \ it up and joked along with him.  Later he said that he was afraid she\
            \ would be even worse drunk.  Everyone laughed again.  All of these jokes\
            \ were said at times that the child was not present, or low enough that\
            \ she could not hear.  Many jokes were made regarding earplugs, alcohol,\
            \ and Ritalin.  The joking was wide spread and continued for the first\
            \ half of the flight, and it was my feeling that the jokes were intended\
            \ to lighten everyone's attitude - sort of a &quot;laughter is the best\
            \ medicine&quot; type of approach - rather than sitting there fuming for\
            \ three hours.  After that, several of us were trying to sleep.  However,\
            \ the child would become so loud that she woke me frequently - EVEN WITH\
            \ EAR PLUGS. When the couple sitting in 18D &amp; E was trying to sleep,\
            \ she would poke and shake them to wake them up, demanding that they not\
            \ sleep.  When they wanted to look out the window, she would close the\
            \ curtain and glare at them defiantly.  When the man put his arm around\
            \ his wife, the little girl insisted that he &quot;put his arm down!&quot;\
            \  - grabbing it and pushing it off of the wife.  She glared, HISSED,\
            \ and made claws at anyone who made eye contact with her, including me.\
            \ She even said loudly on several occasions that her dad was going to\
            \ &quot;kick my ass.&quot;  Remember, this was a SIX YEAR OLD.  This went\
            \ on for almost three hours.  I asked the flight attendants repeatedly\
            \ to please not give her any more sugared/caffeine drinks. They ignored\
            \ my requests, and did not respond.   As horrible as this was, the worst\
            \ was yet to come.  As we neared the end of our flight, the flight attendant\
            \ in charge of the child came to my seat. She leaned over the passenger\
            \ in seat 18C until her face was about 6-8 inches from mine.  Then she\
            \ proceeded to loudly ream me out for suggesting that a child be given\
            \ alcohol and Ritalin.  She was very hostile.  She defended the girl's\
            \ behavior as being typical of any &quot;six year old little girl.&quot;\
            \  I could tell that she was not someone I could reason with, so simply\
            \ told her that it was just a joke circulating among many of the passengers,\
            \ but that I got her point. She ignored my comments, talking over me,\
            \ and continued to berate me, getting even more wild eyed. She stated\
            \ that she didn't know if I had any children (my son was sitting right\
            \ next to me) but wondered how I would feel if someone suggested that\
            \ they be given alcohol.  I stated that my children would not act that\
            \ way, and so the topic was unlikely to be raised. She stated loudly &quot;She's\
            \ only six years old!&quot;  I told her that obnoxious behavior at any\
            \ age is unacceptable to me, and stated again &quot;but I get your point.&quot;\
            \  She continued berating me.  She said that she was responsible for the\
            \ little girl, and that she wasn't being rude to anyone, wasn't kicking\
            \ the seats, or doing anything to disturb anyone.  I replied that she\
            \ WAS kicking the seat, and that she WAS being obnoxious and rude, not\
            \ just to the passengers near her, but to me also - and that I was surprised\
            \ she didn't notice these behaviors - and stated AGAIN that I got the\
            \ point. The flight attendant then stated in a threatening manner, &quot;Would\
            \ you like me to move you to another seat?  Because I can CERTAINLY do\
            \ that!&quot;  This was absurd, since the flight was completely full,\
            \ including first class.  Additionally, I had no intention on moving away\
            \ from my son, or at the very end of a three-hour flight. In addition,\
            \ it was not said in a manner or tone that demonstrated a sincere willingness\
            \ to resolve the problem.  It was clear token of her power, and ability\
            \ to inconvenience me. Seeing that this was going nowhere, as I was repeatedly\
            \ interrupted and she was literally in my face, I told her - &quot;Well\
            \ I have certainly learned my lesson. Thank you for correcting me&quot;\
            \ - then she left without further comment.  This entire exchange took\
            \ less than a minute, or so.  After that, she attempted to monitor the\
            \ child, and it took almost all of her attention for the remaining 15\
            \ minutes or so.  She remained standing in the aisle and continuously\
            \ tried to calm her.  When she left, the passenger in seat 18C stated\
            \ that she was afraid of that flight attendant.  After a few minutes,\
            \ I started a conversation with this passenger. I knew that she had flown\
            \ standby, and asked how that worked - i.e. was it less expensive - and\
            \ why she flew that way. She got a very sheepish look on her face, and\
            \ then told me that she worked for the airline. I confirmed with her that\
            \ she worked for America West and asked what she did. She stated that\
            \ she was, in fact, a flight attendant HERSELF.  She said it very quietly\
            \ and looked very embarrassed.  Then she told me how sorry she was that\
            \ I had been treated the way I had, and that she had never seen anything\
            \ like it. As a witness to EVERYTHING on that plane, she felt the flight\
            \ attendant did not handle herself properly, and didn't do her job in\
            \ caring for the child - and she apologized profusely on behalf of your\
            \ company.  I asked her how she would have handled that differently. She\
            \ stated that she would probably have taken the child to the back to keep\
            \ her busy, so she wouldn't disturb the other passengers.  She also told\
            \ me it was usually America West's policy to place unaccompanied children\
            \ in rows 18 or 19. She again stated that she thought the flight attendant\
            \ was scary, that she was shocked, and apologized again.  I felt terrible\
            \ when I got home, and had a difficult time sleeping that night. I feel\
            \ I did nothing wrong and yet, I was the one victimized by the flight\
            \ attendant. I admit to participating in the general joking that was circulating\
            \ regarding this child's behavior, and was willing to admit that some\
            \ of it may have been offensive to some people, but I initiated very little\
            \ of it.  There was no ill will toward the child by any of the participants,\
            \ including me, and everyone knew these were jokes.  I believe we were\
            \ just trying to relieve the tension of a crowded flight and an obnoxious\
            \ passenger.    Additionally, if my child had been behaving in such a\
            \ disruptive manner, I fully expect that the attendant would have asked\
            \ me to control my child, so that he didn't disturb the other passengers.\
            \  Why should there be a different standard if the flight attendant is\
            \ responsible, rather than the parent?  My son was outraged at the treatment\
            \ I received.  I convinced him that the proper response was to write a\
            \ letter and let you handle it.    Further, I feel the flight attendant\
            \ made no effort to resolve any of these issues in a rational or professional\
            \ manner. As an example, about 15 minutes before this encounter, I went\
            \ to the back of the plane to use the restroom. Both flight attendants\
            \ were back there and, if they felt something should be said, they had\
            \ a perfect opportunity to express their concern at that time, in private\
            \ and in a professional manner, without making a scene.  As I stated,\
            \ the flight attendant's behavior was hostile, threatening, and unprofessional.\
            \ Although I don't recall the flight attendants name, I can tell you that\
            \ she had blond curly hair and was slightly large. I am positive you have\
            \ records of both the flight attendants on that flight, as well as the\
            \ flight attendant that flew standby in the seat next to mine and can\
            \ verify my story - if she hasn't already done so.   In this day of &quot;air\
            \ rage&quot;, and all the concern about how to prevent it, it seems that\
            \ the attendants would be in better control of themselves in an effort\
            \ to set an example.  Secondly, it seems that on a VERY FULL flight, like\
            \ ours, the attendants would make extra efforts to ensure that there was\
            \ no friction among the passengers.  On this flight, there were several\
            \ children, but only one who behaved so poorly.  My husband advised me\
            \ to forget it, saying that a letter wouldn't accomplish anything. But\
            \ I believe that someone doesn't rise to CEO of a large corporation, like\
            \ an airline, without placing a great deal of emphasis on customer service.\
            \  As a manager in a government agency, I would definitely want to know\
            \ if my employees were so rude to one of our customers. Sadly, I am writing\
            \ to give you that information about one of your employees.  Here's what\
            \ I'd like to see happen: I would like a written letter of apology from\
            \ the flight attendant involved. Additionally I would like assurances\
            \ that you will review your policies regarding placement of unattended\
            \ children in with the general passengers rather than in the first or\
            \ last rows, where they can be monitored easily.  I would like to know\
            \ that you will review your policies on the standards for care and responsibility\
            \ required of the flight attendant assigned to the unaccompanied traveling\
            \ child. I would also like to see a copy of your airline's policy(s) regarding\
            \ flight attendant handling of issues such as this. I would appreciate\
            \ confirmation of the disposition of this attendant.   In lieu of a written\
            \ apology, I feel that airline should compensate my son and me with complimentary\
            \ tickets for this terribly victimizing experience.  I also feel that\
            \ everyone in rows 17-19 should receive the same compensation, as they\
            \ were all subjected to this child's loathsome behavior, as well as the\
            \ lack of concern displayed by the attendant.  To be honest, I have never\
            \ flown on your airline before this trip. Without a satisfactory conclusion\
            \ to this event, I will look hard for alternative airlines in the future,\
            \ and you can be sure I will urge others to avoid America West Airlines\
            \ whenever possible.  I have already shared this story with everyone I\
            \ know, and they are anxiously waiting to hear how you handle it.  Here's\
            \ a little about me: I've flown six to 10 times in the past 12 months,\
            \ for both leisure and business.  I usually buy a discount coach ticket.\
            \  I hope you are able to address my concerns. I look forward to hearing\
            \ from you soon."
