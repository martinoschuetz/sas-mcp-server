            uri: /documents/conceptDocuments/2c9180b75b6da55d015b8bb71865005e/concepts/2c9180b75b6da55d015b8bb718750060/documents/27?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.text.document.concept
          - method: GET
            rel: up
            href: /documents/conceptDocuments/2c9180b75b6da55d015b8bb71865005e/concepts/2c9180b75b6da55d015b8bb718750060/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            uri: /documents/conceptDocuments/2c9180b75b6da55d015b8bb71865005e/concepts/2c9180b75b6da55d015b8bb718750060/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.collection
            itemType: application/vnd.sas.text.document.concept
          id: "27"
          text: "With complaints about air travel at an all-time high, I hope airlines\
            \ such as yours are willing to listen to passengers like me. I would like\
            \ to bring to your attention a problem I encountered with your airline's\
            \ baggage claim. This incident is quite annoying.  For the record, my\
            \ flight number was 0139 Q and 1278 T. This incident occurred on 1/20/01\
            \ and 2/3/01. This was a domestic flight.    There was seven people traveling\
            \ in our party.  We left Newark 1/20/01 to Los Angeles.  Upon arrival\
            \ it we discovered that one bag was missing.  This was a cosmetic bag\
            \ with toothbrushes, shaving supplies, cosmetics, etc., for my husband,\
            \ my three children and myself.  The bag was later found (detoured to\
            \ Brazil) and delivered to our hotel two days later.  However, in the\
            \ meantime we incurred $63.00 in expenses replacing the needed items.\
            \  Our return trip was from Las Vegas to Newark on 2/3/01.  We had thirteen\
            \ bags checked.  Upon emptying our luggage we discovered that a camera\
            \ was &quot;missing&quot; from one of our bags.  It is valued at approximately\
            \ $200.00 but the two disks in the camera case which contained all of\
            \ our pictures for the last two weeks are irreplacable.    I believe I\
            \ have the potential to be a valuable customer of your company, and I\
            \ hope you are willing to address this matter to my satisfaction. My primary\
            \ reason for using Continental Airlines is because your prices are usually\
            \ quite fair.    I think I'd be willing to pay even more if this problem\
            \ were fixed.  I am unsure whether I will fly your airline in the future.\
            \ and I don't know whether I can recommend Continental Airlines to others.\
            \    Here's what I'd like to see happen: The lost bag is confirmed in\
            \ that I have the delivery tag from the delivery to our hotel. I also\
            \ have the receipt for the replacement cosmetics.  I do not know if the\
            \ camera is a covered item but my hope would be that some sort of survellience\
            \ picked up the removal of the camera from our bag.  If nothing else,\
            \ I would appreciate the return of the two disks which contains the pictures.\
            \     I hope you are able to address my concerns. I look forward to hearing\
            \ from you soon."
          conceptId: 2c9180b75b6da55d015b8bb718750060
