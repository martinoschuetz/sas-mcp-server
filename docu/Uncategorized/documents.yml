          id: "76"
          text: "With complaints about air travel at an all-time high, I hope airlines\
            \ such as yours are willing to listen to passengers like me. I would like\
            \ to bring to your attention a problem I encountered with your airline's\
            \ overall experience. This incident has left me unsure of whether to use\
            \ Continental Airlines' services in the future.  This incident occurred\
            \ on January 3rd and 7th, 2001 on a domestic flight.    I am writing to\
            \ address two different issues that constituted my first Continental Airlines\
            \ experience.  My partner and I were scheduled to be on a flight from\
            \ Buffalo, NY to New York City (LGA) scheduled to depart at 7:30 PM on\
            \ January 3, 2001.  The plane arrived on time; however, the pilots did\
            \ not arrive until 10:30 PM.  Although the three hours spent in the Buffalo\
            \ airport was frustrating, the gate staff and the airline attendant (she\
            \ was on the previous flight) were most accommodating and kept us well\
            \ informed.  Had it not been for those three ladies, I am quite certain\
            \ I would have a much different tone to this letter.  We finally arrived\
            \ in LaGuardia shortly after midnight, and after securing the rental car\
            \ and driving to our destination (Stamford, CT), we checked into the hotel\
            \ at almost 2 AM.    As inconvenient as what this event was, the return\
            \ flight was even more chaotic.  The flight was to leave at approximately\
            \ 6:30 PM on January 7, 2001.  The gate attendant finally informed us\
            \ that there would be a delay at 6:45 PM.  After promising to keep us\
            \ posted, she announced to the group of approximately 20 travellers that\
            \ if the plane was not able to be repaired (a baggage cart hit it in Orlando,\
            \ yet it made it to Washington, DC and then on to LaGuardia without being\
            \ serviced) she would have us all rebooked on a US Airways flight at 8:30\
            \ PM.  Shortly before 8, she announced that the plane would not be ready\
            \ and that we should all proceed to the ticket counter to have our tickets\
            \ transferred.  Imagine, if you will, 20 travelers, some having just come\
            \ from Disneyworld with small children, given 30 minutes to get from one\
            \ terminal to another, with stops at the luggage carousel and both ticket\
            \ counters en route.  We all reached the first desk and were reticketed,\
            \ picked up our luggage downstairs and ran out to the bus.  We all piled\
            \ into a airport bus with luggage in tow and drove around the airport\
            \ to the US Airways terminal in just enough time to see the plane we were\
            \ rescheduled on change from &quot;on time&quot; to &quot;departed&quot;\
            \ on the monitor.  We again boarded the bus and returned to the Continental\
            \ counter to be reseated on the next Continental flight that evening.\
            \  After asking for a comment card from the counter agent, we were all\
            \ supplied with the standard &quot;sorry&quot; package, that would not\
            \ begin to warrant me undertaking any further excursions with Continental.\
            \    The job I have requires some travel.  Last year I logged over 40,000\
            \ miles on various airlines and over a month in various hotels.  Fortunately,\
            \ I am able to have some latitude in the selection process in relation\
            \ to the carriers I fly.  To be quite honest with you, I am certain that\
            \ there are events that are uncontrollable, but how those events are handled\
            \ attracts or repels customers.    I believe I have the potential to be\
            \ a valuable customer of your company, and I hope you are willing to address\
            \ this matter to my satisfaction.     I am unsure whether I will fly your\
            \ airline in the future, and at this time I cannot, in good faith, recommend\
            \ Continental Airlines to others.    Here's what I'd like to see happen:\
            \ I would like to have two coupons in the amount of $150 each (one for\
            \ myself and one for my partner) for future travel on Continental airlines\
            \ to allow you the opportunity to prove that you are one of the best domestic\
            \ airline carriers.     I hope you are able to address my concerns. I\
            \ look forward to hearing from you soon."
          conceptId: 2c9180b75b6da55d015b8bb718750060
