          id: "4101"
          text: "I'm writing to ask you a question about the aircraft interior at\
            \ your company.  Im a big guy, 6'4 260lbs.  I just flew on Alaska and\
            \ was very uncomfortable because seats were very small.  I was told you\
            \ had larger seats.  Is this true?  If not , can you recommend an airline\
            \ or aircraft that has larger or comfortable seats?    Thank you for your\
            \ time. I'd be grateful to have an answer soon."
