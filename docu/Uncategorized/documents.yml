        items:
        - version: 1
          links:
          - method: GET
            rel: self
            href: /documents/documentTables/AIRLINES_KEY/documents/1?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            uri: /documents/documentTables/AIRLINES_KEY/documents/1?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.text.document
          - method: GET
            rel: up
            href: /documents/documentTables/AIRLINES_KEY/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            uri: /documents/documentTables/AIRLINES_KEY/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.collection
            itemType: application/vnd.sas.text.document
          id: "1"
          text: "I am VERY irritated at the poor response to getting my baggage. \
            \ I arrived in San Antonio at 8:05 p.m. with another travel partner. \
            \ His baggage was here, but mine was not.  I requested delivery of my\
            \ bag to my home upon arrival.  It did not arrive until after 3:00 p.m.\
            \ the following day.      I am asking that you provide a written apology,\
            \ and travel compensation (first-class upgrade on next flight).    Thank\
            \ you for taking the time to read this.    Sincerely,    John E."
        - version: 1
          links:
          - method: GET
            rel: self
            href: /documents/documentTables/AIRLINES_KEY/documents/2?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            uri: /documents/documentTables/AIRLINES_KEY/documents/2?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.text.document
          - method: GET
            rel: up
            href: /documents/documentTables/AIRLINES_KEY/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            uri: /documents/documentTables/AIRLINES_KEY/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.collection
            itemType: application/vnd.sas.text.document
          id: "2"
          text: "I would like to suggest that you compliment the flight attendants,\
            \ they were wonderful and made me feel very comfortable during my flight.\
            \    Thank you for taking the time to read this.    I hope this is helpful\
            \ to you.    Sincerely,    Kim R."
        - version: 1
          links:
          - method: GET
            rel: self
            href: /documents/documentTables/AIRLINES_KEY/documents/3?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            uri: /documents/documentTables/AIRLINES_KEY/documents/3?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.text.document
          - method: GET
            rel: up
            href: /documents/documentTables/AIRLINES_KEY/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            uri: /documents/documentTables/AIRLINES_KEY/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.collection
            itemType: application/vnd.sas.text.document
          id: "3"
          text: "I had a delightful ending to my vacation due to the personable and\
            \ attentive flight attendants on this flight.  More specifically, I found\
            \ Marlene, Jackie, Joanne, and, especially Suzi to be friendly, conversive,\
            \ and sincere throughout the flight which, by the way, arrived early in\
            \ Atlantic City.    All too often people complain. I just wanted to provide\
            \ you with some positive feedback for a job well done!    Thank you for\
            \ your time and keep up the good work!    Cordially,    Dennis Craig M."
        - version: 1
          links:
          - method: GET
            rel: self
            href: /documents/documentTables/AIRLINES_KEY/documents/4?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            uri: /documents/documentTables/AIRLINES_KEY/documents/4?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.text.document
          - method: GET
            rel: up
            href: /documents/documentTables/AIRLINES_KEY/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            uri: /documents/documentTables/AIRLINES_KEY/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.collection
            itemType: application/vnd.sas.text.document
          id: "4"
          text: "Since I'm not terribly shy about writing when I have had a poor experience\
            \ with Continental, I thought it was appropriate to write you to share\
            \ some more positive thoughts.    I flew on Christmas Day from Houston\
            \ (IAH) to Portland, Oregon (PDX), on the 11:49 am flight (583, as I recall\
            \ from memory) and was quite happy with the professional, courteous, and\
            \ effective service provided by Steve J., a gate agent in Houston who\
            \ was working the Portland flight.      Upon arriving at the gate, Mr.\
            \ J. noted in the computer that I apparently did not have a ticket and\
            \ that it had been canceled, which, needless to say, was inconsistent\
            \ with the assurances I received from a telephone reservations agent from\
            \ whom I had ticketed a few days prior.  I was upset and frustrated and\
            \ Mr. J. was unusually professional and calm in resolving the matter.\
            \  After a call and some furious typing, he discovered that the telephone\
            \ agent (who by the way could use some training) had failed to enter my\
            \ credit card number and we quickly resolved the situation.  Before I\
            \ could even get upset about the elite upgrade I had lost out on because\
            \ of the snafu Mr. J. handed me a first-class boarding pass along with\
            \ a pleasant Merry Christmas greeting.    I could be writing you today\
            \ to complain about the telephone agent, among other things, but instead\
            \ am extremely happy to have encountered a gate agent who, despite having\
            \ to work on Christmas, was not only cheerful, but quite good at his job.\
            \ I look forward to many future Continental flights -- maybe I'll even\
            \ forgive the last time I sat on the tarmac at LaGuardia for two hours!\
            \    Sincerely,    Jeffrey S."
        - version: 1
          links:
          - method: GET
            rel: self
            href: /documents/documentTables/AIRLINES_KEY/documents/5?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            uri: /documents/documentTables/AIRLINES_KEY/documents/5?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.text.document
          - method: GET
            rel: up
            href: /documents/documentTables/AIRLINES_KEY/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            uri: /documents/documentTables/AIRLINES_KEY/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.collection
            itemType: application/vnd.sas.text.document
          id: "5"
          text: "With complaints about air travel at an all-time high, I hope airlines\
            \ such as yours are willing to listen to passengers like me. I would like\
            \ to bring to your attention a problem I encountered with your airline's\
            \ overall experience. This incident is quite annoying.  For the record,\
            \ I don't remembermy flight number. This incident occurred on 10-00. This\
            \ was a domestic flight.    We flew on AirTran for our vacation.  Our\
            \ flight to Florida was fine.  We were starved and the flight attendent\
            \ gave us a couple of extra cookies, so, that was nice, but, our flight\
            \ home was not so nice.   We were at the airport on time, but, our flight\
            \ was delayed about an hour.  We had to run to make it to our next flight\
            \ in Georgia.  We had our tickets in hand and we made it with less that\
            \ 30 seconds to spare.  We got on the plan and the flight attendent had\
            \ given our seats to someone else.  (We were supposed to fly in the exit\
            \ seats)  They made us sit in the back of the plane.  It was so noisy,\
            \ I got such a headache I could hardly walk.  To top it off, a little\
            \ kid behind us kept on screaming and kicking our chairs.  I feel that\
            \ the flight attendent (who was NOT very nice) should have given us our\
            \ correct seats in the middle of the plane so it would not have been so\
            \ noisy and we would not have had a annoying child behind us.  The flight\
            \ atttendent acted like it was our fault that we almost did not make the\
            \ flight and she was very rude to us.  Anyway, I am not sure if I will\
            \ ever fly AirTran again, this was our first experience, and I don't know\
            \ if I want to repeat it.    I believe I have the potential to be a valuable\
            \ customer of your company, and I hope you are willing to address this\
            \ matter to my satisfaction.     To be honest, I've been somewhat dissatisfied\
            \ with your airline in the past.    I don't know if I'd be willing to\
            \ pay more even if this problem were fixed.  I will look hard for alternative\
            \ airlines in the future. and You can be sure I plan to tell others to\
            \ avoid AirTran Airways whenever possible.     Here's what I'd like to\
            \ see happen: I don't know.     I hope you are able to address my concerns.\
            \ I look forward to hearing from you soon."
        limit: 5
        version: 2
