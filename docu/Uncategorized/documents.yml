            uri: /documents/termDocuments/AIRLINES_KEY_PARSING_TERMS_OUT_476ACB51-D420-4A0D-B727-B36C03CB84DE/terms/10556/documents?casLibName=TACASLIB&serverId=cas&idColumnName=key&textColumnName=text
            type: application/vnd.sas.collection
            itemType: application/vnd.sas.text.document.term
          id: "5"
          text: "With complaints about air travel at an all-time high, I hope airlines\
            \ such as yours are willing to listen to passengers like me. I would like\
            \ to bring to your attention a problem I encountered with your airline's\
            \ overall experience. This incident is quite annoying.  For the record,\
            \ I don't remembermy flight number. This incident occurred on 10-00. This\
            \ was a domestic flight.    We flew on AirTran for our vacation.  Our\
            \ flight to Florida was fine.  We were starved and the flight attendent\
            \ gave us a couple of extra cookies, so, that was nice, but, our flight\
            \ home was not so nice.   We were at the airport on time, but, our flight\
            \ was delayed about an hour.  We had to run to make it to our next flight\
            \ in Georgia.  We had our tickets in hand and we made it with less that\
            \ 30 seconds to spare.  We got on the plan and the flight attendent had\
            \ given our seats to someone else.  (We were supposed to fly in the exit\
            \ seats)  They made us sit in the back of the plane.  It was so noisy,\
            \ I got such a headache I could hardly walk.  To top it off, a little\
            \ kid behind us kept on screaming and kicking our chairs.  I feel that\
            \ the flight attendent (who was NOT very nice) should have given us our\
            \ correct seats in the middle of the plane so it would not have been so\
            \ noisy and we would not have had a annoying child behind us.  The flight\
            \ atttendent acted like it was our fault that we almost did not make the\
            \ flight and she was very rude to us.  Anyway, I am not sure if I will\
            \ ever fly AirTran again, this was our first experience, and I don't know\
            \ if I want to repeat it.    I believe I have the potential to be a valuable\
            \ customer of your company, and I hope you are willing to address this\
            \ matter to my satisfaction.     To be honest, I've been somewhat dissatisfied\
            \ with your airline in the past.    I don't know if I'd be willing to\
            \ pay more even if this problem were fixed.  I will look hard for alternative\
            \ airlines in the future. and You can be sure I plan to tell others to\
            \ avoid AirTran Airways whenever possible.     Here's what I'd like to\
            \ see happen: I don't know.     I hope you are able to address my concerns.\
            \ I look forward to hearing from you soon."
