            itemType: application/vnd.sas.text.document.topic
          id: "2949"
          text: "I'm writing to ask you a question about the flight attendants at\
            \ your company.  It is my understanding that all passengers sitting in\
            \ exit row seats must be physically capable and willing to perform emergency\
            \ actions.On December 18. 2000. I flew on AA Flt 934 from Guayaquil, Ecuador\
            \ to Miami. After takeoff the flight attendant, Martha, allowed a short,\
            \ small woman to move into the empty Exit Row  no. 16. ABC.  She also\
            \ allowed the woman to put her 22-inch carry on bag on the floor of the\
            \ row to use as a footrest during the flight, and not even under the seat\
            \ in front of her.  I complained to Martha that this seemed to me to be\
            \ a infraction of airline rules.    Martha told me that stowing baggage\
            \ overhead only applied to takeoff and landing. Since I was still very\
            \ concerned, the head flight attendant told me the same thing.--That the\
            \ rule of keeping the floor of the row clear, only applied to takeoff\
            \ and landing.  I said that I would contact AA about this, and he replied\
            \ that he would deny that there was any problem.    Thank you for your\
            \ time. I'd be grateful to have an answer soon."
