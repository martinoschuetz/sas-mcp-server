            type: application/vnd.sas.collection
            itemType: application/vnd.sas.text.document.topic
          id: "2161"
          text: "I'm writing to ask you a question about the flight attendants policy\
            \ at your company.  Is there a policy of your flight attendants to &quot;ask&quot;\
            \ if  people of size need a seat belt exentsion?  I am deeply offended\
            \ by the question.  I am a large person - but I fly in First Class to\
            \ avoid that embarrassing situation.  And if I DID need the extension,\
            \ I would ask them.  I fly every week, and I am able to fit into the seatbelts\
            \ just fine!  Please be very aware of this, as it can be very hurtful\
            \ and embarrassing.   Thank you for your time. I'd be grateful to have\
            \ an answer soon.  I am a Platinum member of you AAvantage, and I fly\
            \ EVERY week to somewhere."
          topicId: "1"
