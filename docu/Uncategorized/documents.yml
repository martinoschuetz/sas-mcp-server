components:
  parameters:
    indexTableInfo:
      name: indexTableInfo
      in: query
      required: false
      description: |
        The information about the index table. The format is casLibName~fs~indexTableName
        where, the casLibName is the name of CAS library where the index table exists and
        indexTableName is the name of the index table. The index table is a CAS table used to support
        the search through documents. The 'search' query parameter can only be used when the value of this
        parameter is defined.
      schema:
        type: string
    searchTerms:
      name: search
      in: query
      required: false
      description: |
        Defines the keywords separated by space used in searching the documents.

        The following characters are reserved for special meaning (note, those characters are non-searchable):

        | Characters | Details about reserved characters |
        |---------------------------------------------------------------|--------------------------------------------------------------------------------|
        | + | Will not match any document that does not have this keyword. The '+' must follow the keyword. |
        | - | Matches any document that does not have this keyword. The '-' must follow the keyword. |
        | * | Wildcard character that matches any character within a word. |
        | " | Denotes a phrase that must be matched in exact sequence." |
        | +() | Used to group different keywords together. This notation will enforce to match documents containing at least one of those grouped keywords. |

        Some sample search parameters:

        | Sample Search Parameter   | Details about the search parameter |
        |---------------------------------------------------------------|--------------------------------------------------------------------------------|
        | wine                      | documents matching wine keyword |
        | +wine fruit               | documents containing 'wine' but can have 'fruit' keyword as well </li> |
        | -wine fruit               | documents not containing 'wine' but should contain 'fruit'    |
        | wine \"smoked meat\"      | documents either containing 'wine' or 'smoked meat' keywords  |
        | +(wine wines) fruit       | documents should contain at least 'wine' or 'wines' also they can have 'fruit' keyword |
        | +(wine wines) +fruit      | documents should contain at least 'wine' or 'wines' but also contain 'fruit' keyword |
        | +(wine wines) +fruit prime| documents should contain at least 'wine' or 'wines' but also contain 'fruit' keyword and can have 'prime' keyword|
      schema:
        type: string
  schemas:
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error:
      $ref: "#/components/schemas/error2"
    document:
      title: Document
      description: A document object.
      x-sas-media-type: application/vnd.sas.text.document+json;version=1
      properties:
        id:
          type: string
          description: The ID of the document.
        text:
          type: string
          description: The text contained in the document.
        returnFields:
          type: object
          description: "Array containing the values for fields of the document based\
            \ on the 'returnFields' query parameter, if specified."
      required:
      - id
      - text
    conceptDocument:
      title: Concept Document
      description: A concept document object.
      x-sas-media-type: application/vnd.sas.text.document.concept+json;version=1
      properties:
        conceptId:
          type: string
          description: The ID for the concept associated with document.
        id:
          type: string
          description: The ID of the document.
        text:
          type: string
          description: The text contained in the document.
        returnFields:
          type: object
          description: "Array containing the values for fields of the document based\
            \ on the 'returnFields' query parameter, if specified."
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/conceptTokenCollection"
          description: Array containing tokens
        _factMatchesCount:
          type: integer
          description: "Number representing the count for the fact matches in the\
            \ document for the specified concept. If there are no facts matched, the\
            \ value will be 0."
      required:
      - id
      - conceptId
      - text
      - tokens
      - _factMatchesCount
    categoryDocument:
      title: Category Document
      description: A category document object.
      x-sas-media-type: application/vnd.sas.text.document.category+json;version=1
      properties:
        id:
          type: string
          description: |
            The ID of the document.
        text:
          type: string
          description: |
            The text contained in the document.
        returnFields:
          type: object
          description: "Array containing the values for fields of the document based\
            \ on the 'returnFields' query parameter, if specified."
        categoryId:
          type: string
          description: |
            The ID for the category associated with the document.
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/tokenCollection"
          description: |
            Array containing tokens
      required:
      - categoryId
      - id
      - text
      - tokens
    topicDocument:
      title: Topic Document
      description: A topic document object.
      x-sas-media-type: application/vnd.sas.text.document.topic+json;version=1
      properties:
        topicId:
          type: string
          description: |
            The ID for the topic associated with the document.
        id:
          type: string
          description: |
            The ID of the document.
        text:
          type: string
          description: |
            The text contained in the document.
        returnFields:
          type: object
          description: "Array containing the values for fields of the document based\
            \ on the 'returnFields' query parameter, if specified."
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/tokenCollection"
          description: |
            Array containing tokens
      required:
      - topicId
      - id
      - text
      - tokens
    termDocument:
      title: Term Document
      description: A term document object.
      x-sas-media-type: application/vnd.sas.text.document.term+json;version=1
      properties:
        termId:
          type: string
          description: |
            The ID for the term associated with the document.
        id:
          type: string
          description: |
            The ID of the document.
        text:
          type: string
          description: |
            The text contained in the document.
        returnFields:
          type: object
          description: "Array containing the values for fields of the document based\
            \ on the 'returnFields' query parameter, if specified."
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/tokenCollection"
          description: |
            Array containing tokens
      required:
      - termId
      - id
      - text
      - tokens
    token:
      title: Token
      description: A token containing text.
      x-sas-media-type: application/json;version=1
      required:
      - type
      - matchedTerm
      - beginIndex
      - endIndex
      properties:
        type:
          type: string
          description: |
            The type of the token.  Types include plain TEXT, HIGHLIGHT, and FACT.
        matchedTerm:
          type: string
          description: |
            The text of the token.  This might have been adjusted from the original text to prevent overlap with another token.
        beginIndex:
          type: integer
          description: |
            The original start offset of the token.
        endIndex:
          type: integer
          description: |
            The original end offset of the token.
      x-examples:
        example-1:
          value:
            type: string
            matchedTerm: string
            beginIndex: 0
            endIndex: 0
    factTag:
      title: Fact Tag
      description: A match to a fact argument.
      required:
      - name
      - matchedText
      properties:
        name:
          type: string
          description: |
            The name of the argument.
        matchedText:
          type: string
          description: |
            The text that the argument matched.
      x-examples: {}
    categoryDocumentsCollection:
      title: Category Documents Collection
      description: A pageable collection of category documents.
      x-sas-media-type: application/vnd.sas.collection+json;version=1
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/categoryDocument"
            description: Array containing category documents
          matchedDocumentsCount:
            type: integer
            description: |
              Represents the total number of matching documents for the selected category.
              This property is available when the search and indexTableInfo query parameters are not null and empty.
    conceptDocumentCollection:
      title: Concept Documents Collection
      description: A pageable collection of concept documents.
      x-sas-media-type: application/vnd.sas.collection+json;version=1
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          matchedDocumentsCount:
            type: integer
            description: |
              Represents the total number of matching documents for the selected concept.
              This property is available when the search and indexTableInfo query parameters are not null and empty.
          items:
            type: array
            items:
              $ref: "#/components/schemas/conceptDocument"
            description: Array containing concept documents
    termDocumentsCollection:
      title: Term Documents Collection
      description: A pageable collection of term documents.
      x-sas-media-type: application/vnd.sas.collection+json;version=1
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          matchedDocumentsCount:
            type: integer
            description: |
