            itemType: application/vnd.sas.text.document.concept
          id: "67"
          text: "With complaints about air travel at an all-time high, I hope airlines\
            \ such as yours are willing to listen to passengers like me. I would like\
            \ to bring to your attention some problems I have encountered with your\
            \ airline's overall experience. These incidents have left me extremely\
            \ upset.       I have been a frequent traveler utilizing TWA since June\
            \ of 2000.  I have not had any major problems with the airline up until\
            \ January of 2001.  For some reason, the staff (on the aircraft, at the\
            \ gate, AND on the phone) have been rude and unhelpful.  For example:\
            \ When flying first class, my baggage is CONSISTENTLY unloaded last; When\
            \ in the first and coach class cabins, I feel as if I am troubling the\
            \ flight attendants to simply ask for another glass of water; When calling\
            \ the service center to inquire about reservations, the individuals are\
            \ EXTREMELY rude and have even hung up on me if I do not have the correct\
            \ record locator to make life easier for them.    I would say I am an\
            \ extremely valuable customer of your company, and I hope my loyalty will\
            \ be rewarded by your full attention to this matter. My primary reason\
            \ for using Trans World Airlines is because I have used it satisfactorily\
            \ before.    To be honest, I've been very dissatisfied with your airline\
            \ in the past.    When I buy a ticket from your airline I usually spend\
            \ $400.00 and I travel approximatley 5000 miles per week. I would be willing\
            \ to pay even more if this problem were fixed.  I seriously doubt that\
            \ I will ever fly your airline again, and you can be sure I will urge\
            \ others to avoid Trans World Airlines whenever possible.     For now,\
            \ I have switched all of my business air travel over to Delta.    I hope\
            \ you are able to address my concerns. I look forward to hearing from\
            \ you soon."
          conceptId: 2c9180b75b6da55d015b8bb718750060
