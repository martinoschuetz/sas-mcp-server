            type: application/vnd.sas.collection
            itemType: application/vnd.sas.text.document.concept
          id: "56"
          text: "I know yours is a frequently criticized industry, so it gives me\
            \ great pleasure to send this compliment about your airline's price and\
            \ value. I hope you'll let everyone involved in this great experience\
            \ know that their work is greatly appreciated. For your reference, my\
            \ flight was 181. It was a domestic flight. I traveled on 1/17/2001. \
            \   Recently, my family had moved to Florida, but my sister had to stay\
            \ in PA to finish her 1st semester of the year in her high school. Because\
            \ of this, we had to purchase a one way ticket so she could then join\
            \ us in our new home. Upon calling all the airlines, I was highly frustrated\
            \ because the prices for one-way tickets were almost $600. When I had\
            \ called Continental, we received a ticket price of $128. We were extreamly\
            \ thrilled by this as it is expensive to move over 1000 miles to start\
            \ with. Also, the employees who I spoke with on the phone to make and\
            \ later change the destinationm city were extreamly courtous, helpful\
            \ and patient.    Perhaps it would help you to know a little bit about\
            \ me. I am a true fan of your company, and this reinforces my feelings\
            \ about it. I only fly your airline from time to time. I use Continental\
            \ Airlines because your flights are fairly priced.     I don't know that\
            \ I'd be willing to pay more, even with this kind of service. You can\
            \ certainly count on my business in the future, and I have every intention\
            \ of urging others to fly with you.    Thanks again for everything. Keep\
            \ up the good work!"
          conceptId: 2c9180b75b6da55d015b8bb718750060
