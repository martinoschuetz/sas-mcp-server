          itemType: application/vnd.sas.text.document.category
        id: "444"
        text: "With complaints about air travel at an all-time high, I hope airlines\
          \ such as yours are willing to listen to passengers like me. I would like\
          \ to bring to your attention a problem I encountered with your airline's\
          \ flight attendants. This incident has left me extremely upset. For the\
          \ record, my flight number was 534V. This incident occurred on 2/14/01.\
          \ This was a domestic flight.    On February 14, 2001 I was scheduled to\
          \ fly from Chicago O'Hare on Flight# 534V to Detroit and then to London.\
          \    The initial flight was delayed in Chicago for approximately 30 minutes.\
          \  I had an hour and a half in Detroit to catch my connection to London\
          \ and was concerned about having enough time.  We finally boarded the plane\
          \ and were told that it was a full flight.  I found my seat which was about\
          \ 20 rows back and on the aisle.    As I sat and waited for departure, I\
          \ overheard a female flight attendant complain to another flight attendant\
          \ about the, &quot;stupid passengers who kept opening the overhead luggage\
          \ bins.  Don't they know they're closed for a reason?&quot;  I was disgusted\
          \ by her comments, but took that to be normal flight attendant behavior.\
          \    A few minutes later, an African American passenger boarded the plane\
          \ and made his way to his seat in the rear.  The before-mentioned flight\
          \ attendant was standing in the aisle two seats in front of me.  The boarding\
          \ passenger, put his hands lightly on her hips in order to push past her.\
          \  (She was rather large and took up most of the room in the aisle.)  Please\
          \ keep in mind too that the passengers had been admonished to quickly board\
          \ the full capacity plane.    The flight attendant turned around and said,\
          \ &quot;Sir -- per section code ### I can have you removed from this plane.&quot;\
          \  He said something to the effect of, &quot;please, just drop it.&quot;\
          \  The female flight attendant then went to the front of the plane and shortly\
          \ two male attendants escorted the man off the airplane.    The man sitting\
          \ next to me and I began discussing the incident since we had both witnessed\
          \ the entire exchange.  The pilot made an annoucement about further delays\
          \ due &quot;to an unfortuante situation between a flight attendant and a\
          \ passenger.&quot;  He asked any witnesses to push their call button.  My\
          \ neighbor and I both reached for the call button at the same time.    We\
          \ were escorted to the gateway and both gave our version of events to the\
          \ Northwest service representative and to a Chicago police officer.  While\
          \ I was speaking, the involved flight attendant got directly in my face\
          \ and called me a liar.  She was hysterical and had been crying and told\
          \ me that, &quot;the passenger had groped her breasts.  I had not seen antyhing\
          \ and was lying.&quot;  I was irate that the flight attendant was able to\
          \ confront me as such and knew that he &quot;breast groping&quot; allegations\
          \ were false.    The customer service manager for Northwest did re-route\
          \ me on a British Airways flight.  However, my baggage was mishandled and\
          \ I spent most of my London vacation without my packed items.    I believe\
          \ I have the potential to be a valuable customer of your company, and I\
          \ hope you are willing to address this matter to my satisfaction. My primary\
          \ reason for using Northwest Airlines is because I have used it satisfactorily\
          \ before.    To be honest, I've been very dissatisfied with your airline\
          \ in the past.    When I buy a ticket from your airline I usually spend\
          \ $700.00. I would be unwilling to pay more even if this problem were fixed.\
          \  I seriously doubt that I will ever fly your airline again, and you can\
          \ be sure I will urge others to avoid Northwest Airlines whenever possible.\
          \     Here's what I'd like to see happen: I would like Northwest Airlines\
          \ to acknowledge my complaint and to reimburse partially for my ticket cost.\
          \     I hope you are able to address my concerns. I look forward to hearing\
          \ from you soon."
        categoryId: 2c9180a75b6da552015b8c7aaf7e002d
        sentiment: Negative
