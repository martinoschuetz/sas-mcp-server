          id: "1"
          text: "I am VERY irritated at the poor response to getting my baggage. \
            \ I arrived in San Antonio at 8:05 p.m. with another travel partner. \
            \ His baggage was here, but mine was not.  I requested delivery of my\
            \ bag to my home upon arrival.  It did not arrive until after 3:00 p.m.\
            \ the following day.      I am asking that you provide a written apology,\
            \ and travel compensation (first-class upgrade on next flight).    Thank\
            \ you for taking the time to read this.    Sincerely,    John E."
