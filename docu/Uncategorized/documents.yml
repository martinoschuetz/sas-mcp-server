          id: "5163"
          text: 'I would like to bring to your attention a problem I encountered with
            your airline''s flight attendants.      My previous experiences with American
            Airlines have been positive, which is why I feel compelled to write this
            letter expressing my disappointment and frustration with the customer
            service I received on May 17, 2003 (flight 1610 from DFW to DCA).    There
            were two flight attendants in coach on this day (a female attendant with
            blonde hair & a tall male attendant with greyish hair).  The service from
            from the female attendant was subpar at best, and the male attendant was
            absolutely rude and offensive.      For example, at the beginning of the
            flight, the lady sitting next to me asked the female attendant for headphones
            and never received them.  Later she asked for a pillow, and never received
            that either.  We discussed how the flight attendant was not particularly
            pleasant to us and was clearly forgetful and/or apathetic. I figured perhaps
            she was having a bad day, so I considered it an anomaly and put it out
            of my mind.     Later however, I got up to go to the lavatory and it was
            occupied, so I had to wait by the door next to the attendant station.
            The male attendant bombarded through with a drink in his hand and yelled
            "excuse me", brushing against me as he went by. I was shocked and amazed
            at how rude he was.  Then, as I was making my way back to my seat toward
            the front of the plane, he was going through with the beverage cart and
            moving forward also (in front of me). So, I planned to wait patiently
            behind him until he was finished and had moved past my seat, which was
            only two rows away. Then he decided he wanted to move the other direction
            suddenly, and exclaimed loudly "you''re going to have to move out of the
            way!"  I was a bit taken aback, not to mention embarrassed and annoyed
            by his reaction--particularly since I believed I was making a concerted
            effort to stay out of the way so he could do his job.  It is difficult
            to convey simply through this letter how obnoxious he came across and
            how his utterly surly and tactless affect made me feel.      I spent ten
            years in the customer service industry myself, so I definitely empathize
            with the stress level one can be subjected to when dealing with the general
            public.  I realize the job of a flight attendant is difficult and demanding
            in the first place, and AA employees have been through a great deal of
            turmoil lately, so tensions are no doubt escalated.  However, as a paying
            customer, I would rather patronize an airline where I find a rudimentary
            competency and courtesy level among the staff.  My expectation is to not
            be treated in a rude and disrespectful manner--this is not a lofty expectation.     Here''s
            what I''d like to see happen: If employees are malcontented with the nature
            of their jobs or with their pay, they should be encouraged to find employment
            elsewhere.  If an individual is simply angry and repressed for personal
            reasons, he should probably be urged to consider a profession that allows
            him to function more as a "behind the scenes" individual contributor,
            instead of being the representative face of your organization in a customer
            service capacity.  Probably the most difficult part of a flight attendant''s
            job is being "on" and being courteous to people when you simply don''t
            feel like it.  But that IS the nature of the job, and if one is not capable
            of performing that job, he should be relieved of his duties.       Here''s
            a little about me: I''ve flown six to 10 times in the past 12 months,
            mostly for business. I usually buy a full-fare coach ticket.    I hope
            you are able to address my concerns. I look forward to hearing from you
            soon.'
          categoryId: 2c9180a75b6da552015b8c7aaf7e002d
