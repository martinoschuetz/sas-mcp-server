          id: "1935"
          text: "I would like to bring to your attention a problem I encountered with\
            \ your airline's flight attendants.    RE: Flight 2411 Coach - Delta Express\
            \ - Orlando/Indianapolis on July 13, 2001  My complaint is about the service\
            \ or lack thereof of a particular flight attendant.  Upon entering the\
            \ Boeing 737, I saw a very unkept female, wearing dark slacks and lighter\
            \ top.  Her hair had been, at one time in a ponytail, but half of it was\
            \ falling around her face.  She wore no make up, glasses and made no attempt\
            \ to greet passengers.  I assumed she was a mechanic or someone that was\
            \ responsible for the maintenance of the plane or the loading of cargo.\
            \  Imagine my surprise when I discovered she was a flight attendant. \
            \ The flight took off fine and was a nice flight.  The attendant mentioned,\
            \ however, was serving beverages/snacks and not doing it very well.  She\
            \ looked at my row, asking us in a monotone voice what we wanted.  I was\
            \ tempted to say a pleasant attitude might be nice, but asked for a coke.\
            \  She gave the lady on the aisle her beverage/napkin/snack but failed\
            \ to do so with me and the passenger by the window.  This was a late night\
            \ flight, arriving in Indianapolis at 11:30 p.m. and I wanted to take\
            \ some medication, but couldn't on an empty stomach. The lady next to\
            \ me got the attendant's attention and mentioned to her that we didn't\
            \ receive our snacks.  She rolled her eyes and said, &quot;I'll get it\
            \ later.&quot;  Needless to say, later never came.  A man across from\
            \ us asked for a blanket as he was wearing shorts and chilly; that too\
            \ never happened.  We landed and disembarked from the plane with the same\
            \ attendant by the door never uttering a word, such as &quot;Thank you\
            \ for flying Delta&quot; or &quot;have a good evening&quot;.  The flight\
            \ was excellent, but the service was very poor if not boardering on rude.\
            \  Between her appearance and attitude, she was a very poor representation\
            \ of your airlines.  To be honest, I've been somewhat dissatisfied with\
            \ your airline in the past.I am unsure whether I will fly your airline\
            \ in the future, and you can be sure I plan to tell others to avoid Delta\
            \ Air Lines whenever possible.   Here's what I'd like to see happen: I\
            \ would like Delta to give the attendant and her supervisor a copy of\
            \ my complaint.  Like a receptionist gives the first impression of the\
            \ business she/he works for, so does the flight attendant.  She did nothing\
            \ that would encourage passengers to fly with Delta again.     Here's\
            \ a little about me: I've flown five times or less in the past 12 months,\
            \ mostly for pleasure. I usually buy a full-fare coach ticket.  I hope\
            \ you are able to address my concerns. I look forward to hearing from\
