---
openapi: 3.0.3
info:
  version: "7"
  title: Transfer
  description: >-
    The Transfer Service REST API enables clients to import and export
    content.
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
  # For local development
  # - url: "http://localhost:4010"
  #   description: local mock server
- url: "http://mock-transfer.apifirst.unx.sas.com/transfer"
  description: kubernetes mock server
tags:
- name: Root
  description: Endpoints for root resources.
- name: Packages
  description: Endpoints related to Transfer packages.
- name: Export Jobs
  description: Endpoints for Export Jobs.
- name: Mappables
  description: >-
    Endpoints for presenting mapping options (Mappables).
- name: Import Jobs
  description: Endpoints for Import Jobs.
- name: Import Artifacts
  description: Information persisted about imported objects.
- name: Import Messages
  description: Messages associated with previous imports.
- name: Mappings
  description: Endpoints for Mappings persistence.
- name: User Interface
  description: Endpoints for User Interface related functionality.
- name: Automation
  description: Endpoints useful for automating migration steps.
paths:
  /:
    get:
      tags:
      - Root
      operationId: root
      summary: Get a list of top-level links
      description: >
        Returns a collection of links to the top-level collections surfaced
        through this API. Includes links for the following relations:
          - packages
          - createPackage
          - exportJobs
          - startExport
          - importJobs
          - startImport
          - mappings
          - createMapping
          - importArtifacts
          - importMessages
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/ApiResponse.json"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/ApiResponse.json"
        "404":
          description: Not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  /apiMeta:
    get:
      tags:
      - Root
      operationId: getApiMeta
      summary: Retrieve a summary of properties for the api
      description: "Used to obtain properties for the api including information about\
        \ resources and media types.  Properties are retrieved from the apiMeta.config\
        \ file associated with this service.<br><br> Sub endpoints also supported\
        \ include:<br><br>apiMeta/resources<br>apiMeta/mediaTypes<br>apiMeta/properties<br>apiMeta/versions<br>apiMeta/doc"
      responses:
        "200":
          description: OK
  /packages:
    get:
      tags:
      - Packages
      operationId: getPackages
      summary: Get a list of packages saved on the service
      description: Returns list of the transfer package summary objects.
      parameters:
      - name: start
        in: query
        schema:
          type: integer
        description: 0-based Offset of first package to return.  Defaults to 0.
      - name: limit
        in: query
        schema:
          type: integer
        description: Maximum number of packages to return.  Defaults to 20.
      - name: filter
        in: query
        schema:
          type: string
          format: filter-criteria
        description: >
          Filter criteria for returned packages. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/transfer-v7/docs/getting-started/usage-notes#filtering).
          <br>Any
          member of the application/vnd.sas.transfer.package can be used to
          filter the results.
      - name: sortBy
        in: query
        schema:
          type: string
          format: sort-criteria
        description: >-
          Sort returned packages.  See [Sorting in REST
          APIs](https://developer.sas.com/rest-apis/transfer-v7/docs/getting-started/usage-notes#sorting).<br>
          The
          default sort order will be name:ascending.  Other valid sorting
          options are <li><code>added</code> the timestamp when the item was
          added to the folder</li> <li><code>name</code> the object name </ul>
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/transferPackageCollection"
              examples:
                json:
                  $ref: "#/components/examples/PackageCollection.json"
            application/json:
              schema:
                $ref: "#/components/schemas/transferPackageCollection"
              examples:
                json:
                  $ref: "#/components/examples/PackageCollection.json"
    post:
      tags:
      - Packages
      operationId: createPackage
      summary: Create a new transfer package
      description: >-
        Create the package for the supplied in
        application/vnd.sas.transfer.package.
      requestBody:
        content:
          application/vnd.sas.transfer.package+json:
            schema:
              $ref: "#/components/schemas/transferPackage"
            examples:
              json:
                $ref: "#/components/examples/PackageDefinition.json"
        required: true
        description: The transfer package definition to persist.
      responses:
        "201":
          description: New content created
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/resourceSummary"
              examples:
                json:
                  $ref: "#/components/examples/CommonSummary.json"
          headers:
            Location:
              schema:
                type: string
              description: The URI to the newly created transfer package
        "400":
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  "/packages#withParts":
    post:
      tags:
      - Packages
      operationId: createPackageFromParts
      summary: Create a new transfer package via a multipart request
      description: Create the package for the supplied in multipart/form-data. The
        request accepts a single file representing the contents of the transfer package.  For
        Viya packages the file must have a .json extension, while for SAS Version
        9 packages the file must have a .spk extension.  Given that the size of any
        package file may be large, this method does not return the uploaded package
        to the caller, but rather returns a summary representation of the package,
        including its id and name.
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/transferPackage"
        description: The transfer package definition to persist.
        required: true
      responses:
        "201":
          description: New content created
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/resourceSummary"
              examples:
                json:
                  $ref: "#/components/examples/CommonSummary.json"
          headers:
            Location:
              schema:
                type: string
              description: The URI to the newly created transfer package
        "400":
          description: Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  "/packages/{pkgId}":
    get:
      tags:
      - Packages
      operationId: getPackage
      summary: Get detailed package
      description: Returns the full package with all info and data.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        required: true
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.transfer.package+json:
              schema:
                $ref: "#/components/schemas/transferPackage"
              examples:
                json:
                  $ref: "#/components/examples/PackageDefinition.json"
        "404":
          description: Not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  "/packages/{pkgId}#withParts":
    get:
      tags:
      - Packages
      operationId: getPackageAsParts
      summary: Get detailed package in a multipart format
      description: >-
        Returns the full package with all info and data. The request will return the
        entire contents of the transfer package as a single part, in an
        application/vnd.sas.transfer.package+json format.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        required: true
      responses:
        "200":
          description: OK
          content:
            multipart/form-data:
              schema:
                $ref: "#/components/schemas/transferPackage"
              examples:
                json:
                  $ref: "#/components/examples/PackageDefinition.json"
        "404":
          description: Not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
    delete:
      tags:
      - Packages
      operationId: deletePackage
      summary: Delete the package
      description: The specified package is deleted.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        required: true
      - name: deleteJobs
        in: query
        schema:
          type: boolean
        description: True to delete jobs associated with this package. Defaults to
          false.
      responses:
        "204":
          description: Package is deleted.
        "404":
          description: Package does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  "/packages/{pkgId}/objects":
    get:
      tags:
      - Packages
      operationId: getPackageObjects
      summary: Get list of transfer objects
      description: >-
        Returns a list of the transfer object contained in the package. The
        contents are Transfer Object Summary objects. This endpoint will return
        an empty collection if the package has no objects.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        required: true
      - name: start
        in: query
        schema:
          type: integer
        description: 0-based Offset of first object to return.  Defaults to 0.
      - name: limit
        in: query
        schema:
          type: integer
        description: Maximum number of objects to return.  Defaults to 20.
      - name: filter
        in: query
        schema:
          type: string
          format: filter-criteria
        description: >
          Filter criteria for returned objects. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/transfer-v7/docs/getting-started/usage-notes#filtering).
          <br>Any
          member of the  application/vnd.sas.transfer.object can be used to
          filter the results.
      - name: sortBy
        in: query
        schema:
          type: string
          format: sort-criteria
        description: >-
          Sort returned objects.  See [Sorting in REST
          APIs](https://developer.sas.com/rest-apis/transfer-v7/docs/getting-started/usage-notes#sorting).
          <br> The
          default sort order will be name:ascending.  Other valid sorting
          options are <li><code>added</code> the timestamp when the item was
          added to the folder</li> <li><code>name</code> the object name </ul>
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/transferObjectCollection"
              examples:
                json:
                  $ref: "#/components/examples/TransferObjectCollection.json"
        "404":
          description: Not Found - the package was not found so collection does not
            exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  "/packages/{pkgId}/objects/{objId}":
    get:
      tags:
      - Packages
      operationId: getPackageObject
      summary: Get transfer object
      description: Returns the information about the specific transfer object.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        required: true
      - name: objId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific transfer object.
        required: true
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/transferObject"
              examples:
                json:
                  $ref: "#/components/examples/TransferObject.json"
        "404":
          description: Not found - Object not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  "/packages/{pkgId}/connectors":
    get:
      tags:
      - Packages
      operationId: getPackageConnectors
      summary: Get list of connectors
      description: >-
        Returns list of transfer object connectors for all transfer objects in
        package. The list will only return connectors for which the object that
        they are connected to is not in the requested items list.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        required: true
      - name: start
        in: query
        schema:
          type: integer
        description: 0-based Offset of first connector to return.  Defaults to 0.
      - name: limit
        in: query
        schema:
          type: integer
        description: Maximum number of connectors to return.  Defaults to 20.
      - name: sortBy
        in: query
        schema:
          type: string
          format: sort-criteria
        description: >-
          Sort returned connectors.  See [Sorting in REST
          APIs](https://developer.sas.com/rest-apis/transfer-v7/docs/getting-started/usage-notes#sorting).
          <br> The
          default sort order will be name:ascending.  Other valid sorting
          options are <li><code>added</code> the timestamp when the item was
          added to the folder</li> <li><code>name</code> the object name </ul>
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/resourceCollection"
              examples:
                json:
                  $ref: "#/components/examples/ConnectorCollection.json"
        "404":
          description: Not Found - the package was not found so collection does not
            exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  "/packages/{pkgId}/connectors/{connId}":
    get:
      tags:
      - Packages
      operationId: getPackageConnector
      summary: Get transfer object connector
      description: Returns the information about the specific transfer object connector.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        required: true
      - name: connId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific transfer object connector.
        required: true
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.transfer.connector+json:
              schema:
                $ref: "#/components/schemas/transferObjectConnector"
              examples:
                json:
                  $ref: "#/components/examples/TransferConnector.json"
        "404":
          description: Not found - connector not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  "/packages/{pkgId}/mapping":
    get:
      tags:
      - Packages
      operationId: getPackageMapping
      summary: Get import mapping
      description: Returns the import mapping for the package.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        required: true
      - name: skipV9Enhancements
        x-sas-internal: true
        in: query
        schema:
          type: boolean
        description: When <b>true</b> will skip calling the import9 service to make
          enhancements to the mapping of a package originating from V9.  The default
          value is <b>false</b>.
        required: false
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.transfer.import.mapping+json:
              schema:
                $ref: "#/components/schemas/importMapping"
              examples:
                json:
                  $ref: "#/components/examples/ImportMapping.json"
        "404":
          description: Not found - unable to produce import mapping.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  "/packages/{pkgId}/mappables":
    head:
      summary: HEAD
      operationId: headMappables
      description: Standard HEAD
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        example: 5abf816a-2997-4da3-b6bf-c88995864398
        required: true
      - name: includeHidden
        description: Indicates if results hidden by default should be included instead.
          Defaults to false.  Examples of hidden results include columns, since column
          mapping is not supported.
        in: query
        schema:
          type: boolean
        required: false
        example: false
      - name: activeMappingSetId
        description: >
          The identifier of the active mapping set to use for the mappables.
        in: query
        schema:
          type: string
          format: object-id
        required: false
        example: 5abf816a-2997-4da3-b6bf-c88995864398
      responses:
        "200":
          description: OK
      tags:
      - Mappables
    get:
      tags:
      - Mappables
      operationId: getMappables
      summary: Get mappables
      description: Returns the mappables identified by content providers for objects
        in the package.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        example: 5abf816a-2997-4da3-b6bf-c88995864398
        required: true
      - name: includeHidden
        description: Indicates if results hidden by default should be included instead.
          Defaults to false.  Examples of hidden results include columns, since column
          mapping is not supported.
        in: query
        schema:
          type: boolean
        required: false
        example: false
      - name: activeMappingSetId
        description: >
          The identifier of the active mapping set to use for the mappables.
        in: query
        schema:
          type: string
          format: object-id
        required: false
        example: 5abf816a-2997-4da3-b6bf-c88995864398
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/mappablesCollection"
              examples:
                Mappables Collection (EG Projects):
                  $ref: "#/components/examples/mappablesCollectionExample-EGProjectPaths"
        "404":
          description: Package not found - unable to retrieve mappables for the pkgId
            provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  "/packages/{pkgId}/mappables#yaml":
    get:
      tags:
      - Mappables
      - Automation
      operationId: getImportSelectionsYaml
      summary: Get import selections YAML
      description: Returns the mappables as YAML for ease of editing by clients and
        subsequent use during the import process.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        example: 5abf816a-2997-4da3-b6bf-c88995864398
        required: true
      - name: activeMappingSetId
        description: >
          The identifier of the active mapping set to use for the mappables.
        in: query
        schema:
          type: string
          format: object-id
        required: false
        example: 5abf816a-2997-4da3-b6bf-c88995864398
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/yamlImportMappingFile"
              examples:
                Import Mapping Sample:
                  $ref: "#/components/examples/yamlImportMappingFile-Sample"
        "404":
          description: Package not found - unable to retrieve mappables for the pkgId
            provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
    post:
      tags:
      - Mappables
      - Automation
      operationId: postImportSelectionsYaml
      summary: Convert import selections to mappables
      description: Converts the import selections provided in the body to mappables
        format for subsequent use during the import process.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        example: 5abf816a-2997-4da3-b6bf-c88995864398
        required: true
      requestBody:
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/yamlImportMappingFile"
            examples:
              Import Mapping Sample:
                $ref: "#/components/examples/yamlImportMappingFile-Sample"
        description: The information describing how to create the transfer package.
        required: true
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/mappablesCollection"
              examples:
                Mappables Collection (EG Projects):
                  $ref: "#/components/examples/mappablesCollectionExample-EGProjectPaths"
        "404":
          description: Package not found - unable to retrieve mappables for the pkgId
            provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  "/packages/{pkgId}/objects/{objectId}/mappables":
    head:
      summary: HEAD
      operationId: headObjectMappables
      description: Standard HEAD
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        example: 5abf816a-2997-4da3-b6bf-c88995864398
        required: true
      - name: objectId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific object in the package.
        example: 5abf816a-2997-4da3-b6bf-c88995864398
        required: true
      responses:
        "200":
          description: OK
      tags:
      - Mappables
    get:
      tags:
      - Mappables
      operationId: getObjectMappables
      summary: Get mappables
      description: Returns the mappables identified by a content provider for a specific
        object in the package.
      parameters:
      - name: pkgId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific package.
        example: 5abf816a-2997-4da3-b6bf-c88995864398
        required: true
      - name: objectId
        in: path
        schema:
          type: string
          format: object-id
        description: |
          The identifier of a specific object in the package.
        example: 5abf816a-2997-4da3-b6bf-c88995864398
        required: true
      - name: includeHidden
        description: Indicates if results hidden by default should be included instead.
          Defaults to false.  Examples of hidden results include columns, since column
          mapping is not supported.
        in: query
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/mappablesCollection"
              examples:
                Mappables Collection (EG Projects):
                  $ref: "#/components/examples/mappablesCollectionExample-EGProjectPaths"
        "404":
          description: Package or object not found - unable to retrieve mappables
            for the pkgId and objectId provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                json:
                  $ref: "#/components/examples/ErrorResponse.json"
  /exportJobs:
    post:
      tags:
      - Export Jobs
      operationId: createExportJob
      summary: Create a job for the purpose of exporting content
      description: Produces a transfer package based on the items supplied in the
        request.
      requestBody:
        content:
          application/vnd.sas.transfer.export.request+json:
            schema:
              $ref: "#/components/schemas/exportRequest"
