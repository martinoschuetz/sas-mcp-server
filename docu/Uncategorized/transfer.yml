components:
  parameters:
    importArtifactIdParameter:
      name: importArtifactId
      in: path
      description: The system-assigned unique identifier for the import artifact data.
      required: true
      schema:
        type: string
      example: a3e8197e-0404-4efa-87dc-fee37171102f
    msgIdParameter:
      name: msgId
      in: path
      description: The system-assigned unique identifier for the import message.
      required: true
      schema:
        type: string
      example: a3e8197e-0404-4efa-87dc-fee37171102f
    pkgIdParameter:
      name: pkgId
      in: path
      description: The identifier of an existing package resource.
      required: true
      schema:
        type: string
      example: a3e8197e-0404-4efa-87dc-fee37171102f
    objIdParameter:
      name: objId
      in: path
      description: The identifier of an existing specific transfer object.
      required: true
      schema:
        type: string
      example: a3e8197e-0404-4efa-87dc-fee37171102f
    connIdParameter:
      name: connId
      in: path
      description: The identifier of a specific transfer object connector.
      required: true
      schema:
        type: string
      example: a3e8197e-0404-4efa-87dc-fee37171102f
    exportJobIdParameter:
      name: expJobId
      in: path
      description: The identifier of a specific export job.
      required: true
      schema:
        type: string
      example: a3e8197e-0404-4efa-87dc-fee37171102f
    importJobIdParameter:
      name: impJobId
      in: path
      description: The identifier of a specific import job.
      required: true
      schema:
        type: string
      example: a3e8197e-0404-4efa-87dc-fee37171102f
    selectionSetIdParameter:
      name: selectionSetId
      in: path
      description: The identifier of the selection set
      required: true
      schema:
        type: string
      example: a3e8197e-0404-4efa-87dc-fee37171102f
    selectionIdParameter:
      name: selectionId
      in: path
      description: The identifier of the selection
      required: true
      schema:
        type: string
      example: a3e8197e-0404-4efa-87dc-fee37171102f
  schemas:
    transferPackage:
      description: information about a transfer package
      required:
      - id
      - name
      - requestedItems
      properties:
        id:
          type: string
          format: object-id
          description: unique identifier of the object
        name:
          type: string
          description: The name (i.e. the display name) of the transfer package.
        description:
          type: string
          description: >-
            A short description of the transfer package as defined by the
            creator of the resource.
        version:
          type: integer
          description: >-
            This media type's schema version number. This representation is
            version 1.
        details:
          type: array
          description: |
            List of vnd.sas.transfer.object objects contained in this package.
          items:
            $ref: "#/components/schemas/transferDetails"
        options:
          type: object
          description: >-
            options to be used when package is supplied to an import. Its a map
            of optionName=optionValue
        requestedItems:
          type: array
          description: >-
            List of strings that represent the actual resources that were
            requested in the original export request object. ResourceCollections
            will be expanded to show the resourceUri of each object.
          items:
            type: string
        transferObjectCount:
          type: integer
          format: int64
          description: the count of transfer objects included in this package
        creationTimeStamp:
          type: string
          format: date-time
          description: Timestamp of package creation.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Timestamp of last package modification.
        createdBy:
          type: string
          description: The name of the user who created this package
        modifiedBy:
          type: string
          description: The name of the last user who modified this package
        links:
          type: array
          description: Paging links that apply to this object
          items:
            $ref: "#/components/schemas/link"
    transferPackageSummary:
      description: summary information about a transfer package
      properties:
        id:
          type: string
          format: object-id
          description: unique identifier of the object
        name:
          type: string
          description: name of the object
        description:
          type: string
          description: description of the object
        createdBy:
          type: string
          description: user responsible for creating the object
        creationTimeStamp:
          type: string
          format: date-time
          description: DateTime of object creation
        modifiedBy:
          type: string
          description: user responsible for most recent modification of the object
        modifiedTimeStamp:
          type: string
          format: date-time
          description: DateTime of last object modification
        transferObjectCount:
          type: integer
          format: int64
          description: Number of transfer objects found in the package
        links:
          type: array
          description: Paging links that apply to this object
          items:
            $ref: "#/components/schemas/link"
    transferPackageCollection:
      description: a collection of transfer package summary objects
      properties:
        name:
          type: string
          description: The name of the collection in the context of the request.
        start:
          type: integer
          description: The 0-based index of the result candidates to start returning.
        limit:
          type: integer
          description: The maximum number of results requested.
        count:
          type: integer
          description: The total number of un-paged results available.
        accept:
          type: string
          description: The accept header value that was used in the initial request.
        links:
          type: array
          description: Paging links that apply to this object
          items:
            $ref: "#/components/schemas/link"
        items:
          type: array
          description: The actual results of a query
          items:
            $ref: "#/components/schemas/transferPackageSummary"
        version:
          type: integer
          description: collection schema version
    transferDetails:
      description: a transfer object and its connectors
      properties:
        transferObject:
          $ref: "#/components/schemas/transferObject"
        connectors:
          $ref: "#/components/schemas/transferObjectConnector"
    transferObject:
      description: information regarding a transfer object
      properties:
        id:
          type: string
          format: object-id
          description: unique identifier of the object
        version:
          type: integer
          description: >-
            This media type's schema version number. This representation is
            version 1.
        summary:
          $ref: "#/components/schemas/resourceSummary"
