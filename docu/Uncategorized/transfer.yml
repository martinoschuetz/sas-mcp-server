        list. This structure is used to communicate a list of mappables along with
        other
      x-sas-media-type:
        name: application/vnd.sas.transfer.mappable.list
        version: 1
      type: object
      properties:
        version:
          type: integer
          description: the version of this object
        id:
          type: string
          description: The unique identifier for this mappable list.  When creating
            a new list, this value is not required and will be generated by the system.
        name:
          type: string
          description: The name of the list of mappables.
        description:
          type: string
          description: The description of the list of mappables.
        items:
          type: array
          description: The list of mappable items.
          items:
            $ref: "#/components/schemas/mappable"
    mappableActionRequest:
      title: Mappable Action Request
      description: |-
        A request to perform an action on a set of mappables.  The action to
        perform is specified in the action property.

        Action-specific properties are specified in the associated 'options'
        sub-structure as indicated below:

        | Action | Options Element |
        | --- | --- |
        | APPLY | applyOptions |
      x-sas-media-type:
        name: application/vnd.sas.transfer.mappable.action.request
        version: 1
      properties:
        version:
          type: integer
          description: the version of this object
        action:
          type: string
          description: |-
            the action to perform on the mappables.

            The following actions are supported:
            | Action | Description |
            | --- | --- |
            | APPLY | Apply the selection set to the mappables passed to the request, and return the updated mappables. |
            | | Pagination, filtering and sorting are not supported. |
          enum:
          - APPLY
        applyOptions:
          $ref: "#/components/schemas/mappablesActionRequestApplyOptions"
        mappables:
          type: array
          description: An array containing Mappable resources.
          items:
            $ref: "#/components/schemas/mappable"
    mappablesActionRequestApplyOptions:
      x-sas-hidden: true
      title: Apply Options
      description: options for the apply action.
      properties:
        scope:
          type: string
          description: |-
            the level at which to apply the selection set.

            The following values are supported:
            | Scope | Description |
            | --- | --- |
            | MAPPABLE | Apply the selection set at the mappable level.  This is the most granular way to apply selections. |
          enum:
          - MAPPABLE
        # ruleSetId:
        #   type: string
        #   description: The identifier of the rule set to use when applyMethod is ruleSet.
    selectionSet:
      title: Selection Set
      description: Set of selections
      type: object
      properties:
        version:
          type: number
          description: the media type schema version number.
        id:
          type: string
          description: The system-assigned unique identifier for this selection set.
        name:
          type: string
          description: The name of the selection set.
        description:
          type: string
          description: The description of the selection set.
        selections:
          $ref: "#/components/schemas/selection"
    selection:
      title: Selection
      description: Selection
      type: object
      properties:
        version:
          type: number
          description: the media type schema version number.
        id:
          type: string
          description: The system-assigned unique identifier for this selection.
        mappableId:
          type: string
          description: >-
            The mappable id to which this selection applies.  This value is used
            when the selection is being applied at the mappable level.
        mcId:
          type: string
          description: >-
            The migration correlation ID (mcId) of the transfer object to which
            the mappableId is associated.
        value:
          type: string
          description: The value of the selection.
    mappableOptions:
      x-sas-hidden: true
      title: Mappable Options
      description: valid options for a mappable.
      properties:
        defaultOption:
          type: object
          description: the default option to present for this mappable
        options:
          type: array
          description: >-
            the list of possible options for this mappable, if a list of options
            is to be provided
          items:
            type: object
            description: each item is a single potential option for this mappable
        selectorType:
          type: string
          description: |-
            the type of selector to use for this mappable.  The selector type
            determines how the user will be presented with the options for
            this mappable, if a client chooses to honor the selector type.  The
            default is AUTO, which means the client will choose the best
            selector to use.

            The following selector types are supported:
            | Selector Type | Description |
            | --- | --- |
            | AUTO | Client chooses the best selector to use |
            | APP_SERVER | SAS application server selector |
            | COMPUTE_CONTEXT | SAS compute context selector |
            | COMPUTE_LIBRARY | SAS compute library selector |
            | CAS_SERVER | CAS server selector |
            | CASLIB | Caslib selector |
            | DATE | Date selector |
            | DATETIME | DateTime selector |
            | USER | User selector |
            | GROUP | Group selector |
            | FILE_CLIENT | File client selector |
            | FILE_SERVER | File server selector |
            | PATH_CLIENT | Path client selector |
            | PATH_SERVER | Path server selector |
            | RESOURCE_FOLDER | Folders service resource selector |
          enum:
          - AUTO
          - APP_SERVER
          - COMPUTE_CONTEXT
          - COMPUTE_LIBRARY
          - CAS_SERVER
          - CASLIB
          - DATE
          - DATETIME
          - USER
          - GROUP
          - FILE_CLIENT
          - FILE_SERVER
          - PATH_CLIENT
          - PATH_SERVER
          - RESOURCE_FOLDER
          #          # OpenAPI 3.1 supports describing enums, so we can do it here
          #          oneOf:
          #            - const: AUTO
          #              description: client chooses the best selector to use (default)
          #            - const: APP_SERVER
          #              description: SAS application server selector
          #            - const: COMPUTE_CONTEXT
          #              description: SAS compute context selector
          #            - const: COMPUTE_LIBRARY
          #              description: SAS compute library selector
          #            - const: CAS_SERVER
          #              description: CAS server selector
          #            - const: CASLIB
          #              description: Caslib selector
          #            - const: DATE
          #              description: Date selector
          #            - const: DATETIME
          #              description: DateTime selector
          #            - const: USER
          #              description: User selector
          #            - const: GROUP
          #              description: Group selector
          #            - const: FILE_CLIENT
          #              description: File client selector
          #            - const: FILE_SERVER
          #              description: File server selector
          #            - const: PATH_CLIENT
          #              description: Path client selector
          #            - const: PATH_SERVER
          #              description: Path server selector
          #            - const: RESOURCE_FOLDER
          #              description: Folders service resource selector
          default: AUTO
        constraints:
          $ref: "#/components/schemas/mappableOptionsConstraints"
    mappableOptionsConstraints:
      x-sas-hidden: true
      title: Mappable Options Constraints
      description: constraints for the options for a mappable
      properties:
        min:
          type: integer
          description: >-
            for strings, the minimum required length.
            for numerics, the minimum value.
        max:
          type: integer
          description: >-
            for strings, the maximum allowed length.
            for numerics, the maximum allowed value.
        required:
          type: boolean
          description: >-
            indicates if at least one option must be selected for this mappable
        multiSelect:
          type: boolean
          description: >-
            indicates if multiple options can be chosen for this mappable
        hidden:
          type: boolean
          description: >-
            indicates if the options for this mappable should be hidden from
            the user
