    transferMapping:
      title: transferMapping
      type: object
      description: >-
        Media type: application/vnd.sas.transfer.mapping.map


        A modification of and eventual replacement for the importMapping
        model. As such it follows that design closely, with the changes
        restricted to those necessary to 1) persist the model with
        appropriate unique keys and 2) remove restrictions in the prior
        design created by treating source and target properties as a 1:1
        mapping, which is only true for a limited subset of objects.
      properties:
        id:
          type: string
        name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/mapItem"
        substitutions:
          type: array
          items:
            $ref: "#/components/schemas/mapSubstitution"
        links:
          $ref: "#/components/schemas/link"
        options:
          type: array
          items:
            $ref: "#/components/schemas/mapOption"
    mapItem:
      title: mapItem
      type: object
      description: >+
        Media type: application/vnd.sas.transfer.mapping.item


        Describes a single item that requires mapping. May or may not
        correspond to a correspond to connection point as transferObject
        did, since conversion services may inject new items.

      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        sourceProperties:
          type: array
          items:
            $ref: "#/components/schemas/mapSourceProperty"
        targetProperties:
          type: array
          items:
            $ref: "#/components/schemas/mapTargetProperty"
        type:
          type: string
    mapOption:
      title: mapOption
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
      description: >-
        Media type: application/vnd.sas.transfer.mapping.option


        Usage of mapOption is unclear, however it is necessary to
        maintain bi-directional conversion of importMapping <=>
        transferMapping.
    mapSubstitution:
      title: mapSubstitution
      type: object
      properties:
        properties:
          type: array
          items:
            $ref: "#/components/schemas/mapSubstitutionProperty"
        id:
          type: string
        name:
          type: string
        path:
          type: string
      description: >-
        Media type: application/vnd.sas.transfer.mapping.substitution


        Identifies an object or property in the import package and  an
        associated list of attribute:value pairs.
    mapTargetProperty:
      title: mapTargetProperty
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
      x-tags:
      - Mappings
      description: >-
        Identifies an object property in the import package and its
        associated value if any. May or may not correspond to an object
        in a mapSourceProperty, at the discretion of the converting
        service.
    mapSourceProperty:
      title: mapSourceProperty
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
      description: >-
        Identifies an object property in the import package and its
        associated value if any.
    mappingSummary:
      title: mappingSummary
      type: object
      description: >-
        Media type: application/vnd.sas.transfer.mapping.summary


        Description a summary object for metadata about a
        transferMapping, including the cardinality of its various
        property collections in additional to the usual fields.


        The type field is used to ident
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        links:
          type: array
          description: Paging links that apply to this object
          items:
            $ref: "#/components/schemas/link"
        modifiedTimeStamp:
          type: string
          format: date-time
          description: DateTime of last object modification
        modifiedBy:
          type: string
          description: >-
            user responsible for most recent modification of the
            object
        creationTimeStamp:
          type: string
          format: date-time
          description: DateTime of object creation
        createdBy:
          type: string
          description: user responsible for creating the object
        mapOptionCount:
          type: integer
        mapSubstitutionCount:
          type: integer
        mapItemCount:
          type: integer
    mappingOperation:
      title: mappingOperation
      type: object
      description: >+
        Media type: application/vnd.sas.transfer.mapping.operation


        A request to perform a complex operation (i.e. anything other
        than CRUD) on a map or maps. Semantics vary based on the
        requested operation.


        The operation source may be specified either by id or including
        the appropriate JSON object, but the endpoint will not accept
        both.


        All endpoints that process mappingOperations will return the
        resultant mapping in the response body.


        If a targetId is specified, the map result will also be saved,
        and will update the mapping name and description as specified by
        the targetName and targetDescription.


        - MERGE:
          - POST to /mappings/{MAP_ID}
          - Requires a source map.
          - Description: Combines all fields in the map specified in the path parameter
        (the "base map") with those in the
                         source map in the following manner: mapTargetProperty values
        in the source map replace those in the
                         base map. mapItems in the source map not found in the base
        map will be added.

        - POPULATE:
          - POST to /mappings/{MAP_ID}
          - Description: Copies mapTargetProperty values for each mapItem in the source
        map from the matching item in the map specified in the path parameter (the
        "base map") if they exist.
          - Does not accept target maps.

        - RESET:
          - POST to /mappings/{MAP_ID}
          - Description: Removes all mapItems, mapSubstitutions and mapOptions from
        the map specified in the path parameter
          - Does not accept source or target maps.

        - TRANSLATE:
          - POST to /mappings
          - Header: requires ACCEPT="application/vnd.sas.transfer.mapping.map"
          - Requires a source map.
          - Description: Converts an importMapping to the new transferMapping format

        - REVERT:
          - POST to /mappings
          - Header: requires ACCEPT="application/vnd.sas.transfer.import.mapping"
          - Requires a source map.
          - Description: Converts a transferMapping back to the importMapping format
          - Note: It is possible that some information can be lost in the backward
        conversion, however, the round-trip of
                  importMapping => transferMapping => importMapping is lossless since
        no advanced features are used in that
                  scenario.

      properties:
        mapOperator:
          type: string
          enum:
          - MERGE
          - TRANSLATE
          - REVERT
          - RESET
        sourceId:
          type: string
        targetId:
          type: string
        targetName:
          type: string
        targetDescription:
          type: string
        sourceTransferMap:
          $ref: "#/components/schemas/transferMapping"
        sourceImportMap:
          $ref: "#/components/schemas/importMapping"
    mapSubstitutionProperty:
      title: mapSubstitutionProperty
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
      x-tags:
      - Mappings
      description: >-
        Represents an attribute:value pair contained by a
        mapSubstitution
