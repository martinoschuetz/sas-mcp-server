      operationId: putMappingsFromMappables
      description: |
        Updates a mapping with content from mappables.
        The new content is a full replacement, and the mappables are passed in the request body *items* property.

        Optionally, *name* and/or *description* fields may be updated if specified.
        If *name* is specified, it must not be empty.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mappableList"
            application/vnd.sas.transfer.mappable.list:
              schema:
                $ref: "#/components/schemas/mappableList"
        "404":
          description: Not Found
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/errorResponse"
      requestBody:
        content:
          application/vnd.sas.transfer.mappable.list:
            schema:
              $ref: "#/components/schemas/mappableList"
            examples:
              Mappable list:
                $ref: "#/components/examples/mappableList"
        description: ""
      tags:
      - Mappings
      - Mappables

    patch:
      summary: Merge mapping
      operationId: patchMappingsFromMappables
      description: |2

        Merges mappings using content from mappables, or a stored mapping set.

        The map indicated by the *id* path parameter is the "base map".
        The map to be merged with the base map is the "source map".

        The source map is defined by *one* of the following:
          - the mappables passed in the request body *items* property
          - the map referenced by the *sourceMapId* query parameter

        Merging of mapping items from the source map into the base map occurs as follows:

          - If a source map item is not present in the base map, it is added.
          - If a source map item is present in the base map, it is replaced.
          - Existing base map items not specified in the source map are left unchanged.

        The result of the merge is stored in the base map and returned in the response body.

        To prevent updating the base map, set the *update* query parameter to false.

        Optionally, *name* and/or *description* fields may be updated if specified, but only
        when passing sourceMap in the request body.  If *name* is specified, it must not be empty.
      parameters:
      - name: id
        in: path
        description: id of the map
        schema:
          type: string
        required: true
      - name: sourceMapId
        in: query
        description: The id of the stored mapping set to use as the source map when
          merging. If not specified, the source map is taken from the request body.
        schema:
          type: string
        required: false
      - name: update
        in: query
        description: Specifies if the base map will be updated with the merge result.
          If true, the base map is updated. If false, the base map is not updated.
          The merge is always returned in the response body.
        schema:
          type: boolean
          default: true
        required: false
      requestBody:
        required: false
        content:
          application/vnd.sas.transfer.mappable.list:
            schema:
              $ref: "#/components/schemas/mappableList"
            examples:
              Mappable list:
                $ref: "#/components/examples/mappableList"
        description: The list of mappables to use as the source map when merging.
          This is required if the sourceMapId query parameter is not specified.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mappableList"
            application/vnd.sas.transfer.mappable.list:
              schema:
                $ref: "#/components/schemas/mappableList"
        "404":
          description: Not Found
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/errorResponse"
      tags:
      - Mappings
      - Mappables

