    presentationGroup:
      description: information about a presentation group
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: |
            unique identifier of the presentation group

            Presentation group values:
              - CONTENT:
                  - Used for general content presentation (target location, storage locations, policies).
              - TABLES:
                  - Used for table presentation (SAS tables, CAS tables).
              - IDENTITY
                  - Used for identity-related presentation (users, groups)
              - PATH
                  - Used for presenting paths or directories referenced by code.
              - DATA_RESOURCE
                  - Used for presenting libraries and other data resources.
              - OTHER
                  - Used for presentation grouping not covered elsewhere.
          enum:
          - CONTENT
          - TABLES
          - IDENTITY
          - PATH
          - DATA_RESOURCE
          - OTHER
        name:
          type: string
          description: The display name of the presentation group.
        description:
          type: string
          description: >-
            The description of the presentation group. This is used to provide
            additional context or information about the group.
        infoTip:
          type: string
          description: >-
            The info tip for the presentation group. This is typicaly used to provide
            pop-up information in the UI when the user hovers over the group name,
            but can
            be used in any way the client chooses.
        displayOrder:
          type: integer
          description: |
            The display order of the presentation group. This is used to determine
            the order in which the presentation groups are displayed in the UI.
        version:
          type: integer
          description: >-
            This media type's schema version number. This representation is
            version 1.
      example:
        id: CONTENT
        name: Content
        description: Presentation group for content-related items.
        infoTip: This group contains all content-related items.
        displayOrder: 1
        version: 1
