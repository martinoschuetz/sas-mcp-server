            mappable list with the new mapping set id.
  "/mappings#upload":
    post:
      summary: Create a mapping by uploading a file
      operationId: postMappingUpload
      parameters:
      - name: outName
        in: query
        description: The name to assign to the new mapping.  Optional for YAML and
          sasxfer uploads (derived from filename if omitted). Required for JSON uploads.
        schema:
          type: string
      - name: outDesc
        in: query
        description: The description to assign to the new mapping.
        schema:
          type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/importMapping"
        "400":
          description: Bad Request
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/errorResponse"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The mapping file to upload.
              required:
              - file
        description: The mapping file to upload.  Valid file types are json, yaml
          (yml), and sasxfer.
      tags:
      - Mappings
      - Automation
      description: |2-

        Uploads a mapping file to create and store a new mapping set.  An Id
        will be automatically generated.

        The uploaded file must be in one of the following formats, with a proper
        file extension indicating the format:

        - YAML (.yaml or .yml): The file must conform to the mapping selections
          format produced by the download-as-YAML endpoint (GET /mappings/{id}
          with Accept: application/yaml).  Both version 2 and version 3
          (multi-document) formats are supported.
        - SASXFER (.sasxfer): The file must contain valid mapping metadata.
          For example:
            - Path mapping metadata as produced by Content Assessment tools.
        - JSON (.json): Legacy deprecated format.  The file must conform to the import mapping schema.

        When uploading a YAML or sasxfer file, the outName parameter is optional;
        if omitted, the mapping name is derived from the filename.

        **Version 3 YAML Example (multi-document):**

        ```yaml
        ---
        version: 3
        # Mapping Selections

        type: mappingSelections
        # Mappings applied during import.
        #
        mappings:
          global:
            content:
              - id: 0ae288b292dd0a44dae4ea05dcc4f26a
                # selectedValueLookup: FOLDER_SERVER
                selectedValue: /Public/Demo

            path:
              - id: 1c65062f7edf9e4bb5b1222c9b54ab07
                # originalValue: \\server\share\EGP_Projects
                selectedValue: /Public/Demo/Data

            other:
              - id: 09d50195065ffc52152592f8f255fb5e
                # originalValue: SAS Content
                selectedValue: SAS Content

          object:
          # No object-level mappings necessary
        ---
        type: mappingSets
        sets:
          - id: default
            name: default
            description: Mapping set containing full mappable details
            spec:
              version: 1
              data: |
                <encoded JSON array of mappables>
        ```

        The first document (type: mappingSelections) contains the user-editable
        mapping values.  The second document (type: mappingSets) contains
        encoded mappable details used internally for richer metadata.
