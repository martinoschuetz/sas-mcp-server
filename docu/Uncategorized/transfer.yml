      description: |
        Save a new mapping. An Id will be automatically generated.

        Behavior of this endpoint varies by header content-type.

        For application/vnd.sas.transfer.mapping.map:
          - Creates and stores a new transferMapping, as specified in the request body.

        For application/vnd.sas.transfer.mapping.operation:
          - Executes the operation specified. See the mappingOperation model description for details.
          - Valid operation types for this endpoint are
            - TRANSLATE: Convert an importMapping to a transferMapping
            - REVERT: Convert a transferMapping to an importMapping

        For application/vnd.sas.transfer.mappable.list:
