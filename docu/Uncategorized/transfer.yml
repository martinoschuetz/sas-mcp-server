    delete:
      tags:
      - Import Artifacts
      operationId: deleteImportArtifact
      summary: Delete import information for an import artifact
      description: >-
        Deletes import data for a resource that was created by an import
        operation. This operation is for administrative clean-up only. It should
        not normally be required to delete imported resource data. Events will
        be used to clean up this data when the resources they represent are
        deleted, and the import data should persist as long as the imported
        resources themselves.
      parameters:
      - $ref: "#/components/parameters/importArtifactIdParameter"
      responses:
        "204":
          description: OK. The import artifact data was deleted.
        "404":
          description: The import artifact was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/errorResponse"
