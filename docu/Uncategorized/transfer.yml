    yamlImportMappingFile-Sample:
      description: |
        A sample application/yaml response for mappables

        For example:

        ```yaml
        ---
        version: 2
        # Import Selections
        # Wed Mar 04 04:39:49 UTC 2026
        # Mapping selections to be applied during the import of a transfer package.
        # 1. Review the 'global' and 'object' sections below.
        # 2. Modify the 'selectedValue' for each mapping as needed.
        # 3. Save the file and provide it during the import process to apply these selections.
        #
        # NOTES:
        #    Spacing and indentation are significant, so be careful when editing this file.
        #    Lines starting with '#' are comments and will be ignored during import.
        #

        # Mappings applied during import.
        #
        mappings:
          # Global Mappings: 4
          # These mappings apply to all objects in the package unless overridden at the object level.
          #
          global:
            # ---------
            # Contents: General settings related to content being migrated.
            # ---------
            content:
              # ---------
              # Folder Creation Policy
              # ---------
              - id: 1b81862690ab24aadc35285c07f60640
                groupId: MN
                groupItemId: folderCreationPolicy
                # Example Values:
                #  Specify target location
                #  Maintain source folder structure
                # originalValue:
                selectedValue:

              # ---------
              # Target Location      : Destination folder for objects in this package
              # ---------
              - id: 0ae288b292dd0a44dae4ea05dcc4f26a
                groupId: MN
                groupItemId: targetlocation
                # originalValue:
                selectedValue:

            # ---------
            # Table References: Tables referenced by content being migrated
            # ---------
            tables:
              # ---------
              # CARS
              # ---------
              - id: 47b81bf026d8f70b50c777a401c5d449
                groupId: Table
                groupItemId: /SASProjects/BASE/CARS(Table)::A5N1740C.BK00000X
                # Example Values:
                #  /SAS Projects/BASE/CARS(Table)
                #  CARS
                # originalValue: /SAS Projects/BASE/CARS(Table)
                selectedValue: CARS

            # ---------
            # Other: Additional information related to migration.
            # ---------
            other:
              # ---------
              # SASApp
              # ---------
              - id: 6e9d4dae860ce2929a93229af24b3a82
                groupId: ApplicationServer
                groupItemId: /A5N1740C.AS000002::A5N1740C.AS000002
                # Example Value: /A5N1740C.AS000002
                # originalValue: /A5N1740C.AS000002
                selectedValue: /A5N1740C.AS000002

          # Object Mappings: 4
          #
          # Package: cars.spk
          # Id: 938f3dbf-19ce-4270-b0cb-6fb7a7f06423
          # Description: Package for importing cars.spk
          # Version: 1
          # Created: 2026-03-04 04:38:42.391
          # CreatedBy: sasiom2
          # ModifiedBy: sasiom2
          #
          object:
            # ---------
            # Library:
            # /SAS Projects/BASE/BASE
            # ---------
            A5N1740C.B400000A:
              # ---------
              # DirPath
              # ---------
              - id: 5290ecd4d1db27e10287ad9a2da73d54
                groupId: A5N1740C.B400000A
                groupItemId: DirPath
                mcid: A5N1740C.B400000A
                # Example Value: /r/vfiler04/vol/vol407/vae/Releases/Data/vadata
                # originalValue: /r/vfiler04/vol/vol407/vae/Releases/Data/vadata
                selectedValue: /r/vfiler04/vol/vol407/vae/Releases/Data/vadata

              # ---------
              # CASServer
              # ---------
              - id: 2d6f9000f580ad362264dccd056b1ee8
                groupId: A5N1740C.B400000A
                groupItemId: CASServer
                mcid: A5N1740C.B400000A
                # Example Value: cas-shared-default
                # originalValue: cas-shared-default
                selectedValue: cas-shared-default

              # ---------
              # ImportTargetEnvs
              # ---------
              - id: cc6283465bbb1370743f947987637201
                groupId: A5N1740C.B400000A
                groupItemId: ImportTargetEnvs
                mcid: A5N1740C.B400000A
                # Example Value: CAS, Compute
                # originalValue: CAS, Compute
                selectedValue: CAS, Compute

              # ---------
              # ComputeContexts
              # ---------
              - id: 62da110cb14828eab2fcdf1df14c9b60
                groupId: A5N1740C.B400000A
                groupItemId: ComputeContexts
                mcid: A5N1740C.B400000A
                # Example Value: SAS Studio compute context, SAS Job Execution compute context
                # originalValue: SAS Studio compute context, SAS Job Execution compute context
                selectedValue: SAS Studio compute context, SAS Job Execution compute context

        ```
      externalValue: "./examples/yamlImportMappingFile-Sample.yaml"
