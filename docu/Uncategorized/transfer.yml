      summary: Get import information for an import artifact
      description: >-
        Returns import data for a resource that was created by an import
        operation.
      parameters:
      - $ref: "#/components/parameters/importArtifactIdParameter"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.transfer.import.artifact+json:
              schema:
