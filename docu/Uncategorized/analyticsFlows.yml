---
openapi: 3.0.3
info:
  description: Supports the definition and execution of large automated analytic processes
    that are composed of a graph of individual jobs. This API manages the resources
    necessary to define the graph as well as to initiate and coordinate the execution
    of the jobs. To enable running flows as JES Jobs, this API registers with the
    Job Execution Service as an execution provider for AnalyticsFlow jobs.
  version: "3"
  title: Advanced Analytics Flows
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
servers:
- url: "http://example.com/analyticsFlows"
  description: mock server
tags:
- name: Root
  description: The operations for the root resource.
- name: FlowController
  description: The operations for the flows resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the API object
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      responses:
        "200":
          description: OK
          headers: {}
          content:
            "application/vnd.sas.api+json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsGetRequest200Response"
            "application/json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsGetRequest200Response"
  /flows:
    get:
      tags:
      - FlowController
      summary: Retrieve a collection of Analytics Flows
      description: Returns a collection of flows based on the specified pagination,
        filtering, and sorting options. The media type of the items in the collection
        is controlled using the Accept-Item header.
      operationId: getFlows
      parameters:
      - name: Accept-Item
        in: header
        description: Requested media type for flow collection items.
        required: false
        schema:
          type: string
          default: application/vnd.sas.summary+json
          enum:
          - application/vnd.sas.summary+json
          - application/vnd.sas.analytics.flow+json
      - name: start
        in: query
        description: The index of the first flow to return.
        required: false
        schema:
          type: integer
          default: 0
          format: int64
      - name: limit
        in: query
        description: The maximum number of flows to return.
        required: false
        schema:
          type: integer
          default: 10
          format: int32
      - name: sortBy
        in: query
        description: The criteria for sorting the collection. See [Sorting in REST
          APIs](https://developer.sas.com/rest-apis/analyticsFlows-v2/docs/getting-started/usage-notes#sorting).
        required: false
        schema:
          type: string
          format: sort-criteria
      - name: filter
        in: query
        description: The criteria for filtering the collection. See [Filtering in
          REST APIs](https://developer.sas.com/rest-apis/analyticsFlows-v2/docs/getting-started/usage-notes#filtering).
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: media type of the returned resource
              schema:
                type: string
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            "application/vnd.sas.collection+json":
              schema:
                $ref: "#/components/schemas/flowsCollection"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsGetFlowsRequest200Response"
            "application/json":
              schema:
                $ref: "#/components/schemas/flowsCollection"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsGetFlowsRequest200Response"
    post:
      tags:
      - FlowController
      summary: Create an Analytics Flow
      description: Create an Analytics Flow with the content passed in the body of
        the request. A successful response body will contain the fully-populated resource.
      operationId: createFlow
      requestBody:
        content:
          "application/vnd.sas.analytics.flow+json":
            schema:
              $ref: "#/components/schemas/flow"
            examples:
              json:
                $ref: "#/components/examples/creationRequest"
          "application/json":
            schema:
              $ref: "#/components/schemas/flow"
            examples:
              json:
                $ref: "#/components/examples/creationRequest"
        description: The fully-populated representation of a flow to be created.
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: The URL of the newly created flow
              schema:
                type: string
            Content-Type:
              description: media type of the newly created resource
              schema:
                type: string
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            "application/vnd.sas.analytics.flow+json":
              schema:
                $ref: "#/components/schemas/flow"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPostFlowRequest201Response"
            "application/json":
              schema:
                $ref: "#/components/schemas/flow"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPostFlowRequest201Response"
        "400":
          description: Bad Request
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPostFlowsRequest400Response"
  "/flows/{flowId}":
    get:
      tags:
      - FlowController
      summary: Find an Analytics Flow
      description: Find an Analytics Flow resource that corresponds to the specified
        flow id.
      operationId: getFlow
      parameters:
      - name: flowId
        in: path
        description: id of the flow to locate
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
            ETag:
              description: E-Tag for response
              schema:
                type: string
            Last-Modified:
              description: The time at which the flow was last updated.
              schema:
                type: string
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/flow"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsGetFlowsbyIdRequest200Response"
            "application/vnd.sas.analytics.flow+json":
              schema:
                $ref: "#/components/schemas/flow"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsGetFlowsbyIdRequest200Response"
            "application/vnd.sas.transfer.object+json":
              schema:
                # Override the transfer object so we can set content property type to be string instead of object
                # $ref: 'http://swagger.na.sas.com/reference/schema/application/vnd.sas.transfer.object/v1/transferObject.yaml'
                title: Transfer Object
                description: Content providers implementing the Transfer Object Provider
                  contract use this media type to store information about the content
                  to be transferred.
                x-sas-media-type:
                  name: application/vnd.sas.transfer.object
                  version: 1
                properties:
                  id:
                    type: string
                    format: object-id
                    description: unique identifier of the object
                  version:
                    type: integer
                    description: This media type's schema version number. This representation
                      is version 1.
                  summary:
                    $ref: "#/components/schemas/summary"
                  content:
                    type: string
                    description: optional. Choose this or fileServiceContent. This
                      is the content object that must be serialized in a format that
                      is valid for internet transmission. This includes valid encoding
                      formats like Base64 or data structures like JSON. This is provided
                      by the content provider and the transfer service expects no
                      visibility into or understanding of this value.
                  fileServiceContent:
                    type: string
                    description: optional. Choose this or content. This holds the
                      URI of a file service object that contains the transferable
                      object.
                  connectors:
                    type: array
                    description: a list of associations or references to other external
                      objects to be recreated on import
                    items:
                      $ref: "#/components/schemas/transferObjectConnector"
                  substitutions:
                    type: object
                    description: map with keys of parameter and value. Used to replace
                      the value of parameter with the value of value
                  links:
                    type: array
                    description: Paging links that apply to this object
                    items:
                      $ref: "#/components/schemas/link"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsGetFlowsbyIdAcceptTransferObjectRequest200Response"
        "404":
          description: Not Found
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsGetFlowsbyIdRequest404Response"
    head:
      tags:
      - FlowController
      summary: Verify existence of an Analytics Flow
      description: Confirm existence of an Analytics Flow resource that corresponds
        to the specified flow id.
      operationId: headersForFlow
      parameters:
      - name: flowId
        in: path
        description: id of the flow to locate
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: media type of the resource
              schema:
                type: string
            ETag:
              description: E-Tag for response
              schema:
                type: string
            Last-Modified:
              description: The time at which the flow was last updated.
              schema:
                type: string
        "404":
          description: Not Found
    put:
      tags:
      - FlowController
      summary: Update an Analytics Flow
      description: Update the properties and connections in an Analytics Flow specified
        by a flow id and return the resulting flow. The body of the request contains
        the complete flow configuration that is being requested.The flow may include
        any number of flow connections. Connections that do not include a 'prev' link
        are initial nodes. A flow may only contain a single initial node.
      operationId: updateFlow
      parameters:
      - in: header
        name: "If-Match"
        description: Update the scope resource only if the resources current ETag
          header matches this value
        schema:
          type: string
      - name: flowId
        in: path
        description: id of the flow to update.
        required: true
        schema:
          type: string
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/flow"
            examples:
              Default:
                $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdRequestBody"
          "application/vnd.sas.analytics.flow+json":
            schema:
              $ref: "#/components/schemas/flow"
            examples:
              Default:
                $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdRequestBody"
        description: The fully-populated representation of a flow to be updated.
        required: true
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: media type of the updated resource
              schema:
                type: string
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/flow"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdRequest200Response"
            "application/vnd.sas.analytics.flow+json":
              schema:
                $ref: "#/components/schemas/flow"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdRequest200Response"
        "400":
          description: Bad Request
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdRequest400Response"
        "412":
          description: Precondition Failed
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdRequest412Response"
        "428":
          description: Precondition Required
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdRequest428Response"
    delete:
      tags:
      - FlowController
      summary: Delete an Analytics Flow
      description: Delete an existing Analytics Flow resource that corresponds to
        the specified flow id. If the flow is is associated with a pipeline, the flow
        will not be deleted.
      operationId: deleteFlow
      parameters:
      - name: flowId
        in: path
        description: id of the flow to delete.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "409":
          description: Conflict. The flow is associated with a pipeline.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsDeleteFlowByIdRequest409Response"
  /flows/{flowId}#transfer:
    put:
      tags:
      - FlowController
      summary: Create or update a flow from a transfer object
      description: Updates a flow to match the content of the provided transfer object.
        If the flow does not exist, it is created. This is not a conditional PUT request.
        This endpoint is meant for use via the transfer microservice. See [Transfer
        API](/apis/transfer/v2/swagger.yaml) for usage.
      operationId: updateFlowFromTransfer
      parameters:
      - name: flowId
        in: path
        description: The unique identifier for the flow.
        required: true
        schema:
          type: string
      requestBody:
        content:
          "application/vnd.sas.transfer.object+json":
            schema:
              # Override the transfer object so we can set content property type to be string instead of object
              # $ref: 'http://swagger.na.sas.com/reference/schema/application/vnd.sas.transfer.object/v1/transferObject.yaml'
              title: Transfer Object
              description: Content providers implementing the Transfer Object Provider
                contract use this media type to store information about the content
                to be transferred.
              x-sas-media-type:
                name: application/vnd.sas.transfer.object
                version: 1
              properties:
                id:
                  type: string
                  format: object-id
                  description: unique identifier of the object
                version:
                  type: integer
                  description: This media type's schema version number. This representation
                    is version 1.
                summary:
                  $ref: "#/components/schemas/summary"
                content:
                  type: string
                  description: optional. Choose this or fileServiceContent. This is
                    the content object that must be serialized in a format that is
                    valid for internet transmission. This includes valid encoding
                    formats like Base64 or data structures like JSON. This is provided
                    by the content provider and the transfer service expects no visibility
                    into or understanding of this value.
                fileServiceContent:
                  type: string
                  description: optional. Choose this or content. This holds the URI
                    of a file service object that contains the transferable object.
                connectors:
                  type: array
                  description: a list of associations or references to other external
                    objects to be recreated on import
                  items:
                    $ref: "#/components/schemas/transferObjectConnector"
                substitutions:
                  type: object
                  description: map with keys of parameter and value. Used to replace
                    the value of parameter with the value of value
                links:
                  type: array
                  description: Paging links that apply to this object
                  items:
                    $ref: "#/components/schemas/link"
            examples:
              Default:
                $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdTransferRequestBody"
        description: The transfer object containing the flow.
        required: true
      responses:
        "200":
          description: An existing flow was updated.
          headers: {}
          content:
            "application/vnd.sas.summary+json":
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdTransferRequestSuccessfulResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdTransferRequestSuccessfulResponse"
        "201":
          description: The flow was created.
          headers:
            Location:
              description: The URL of the flow.
              schema:
                type: string
                format: uri
          content:
            "application/vnd.sas.summary+json":
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdTransferRequestSuccessfulResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdTransferRequestSuccessfulResponse"
        "400":
          description: The flow could not be created because the request was invalid.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdTransferRequest400Response"
  "/flows/{flowId}/state":
    put:
      tags:
      - FlowController
      summary: Set the state for an Analytics Flow
      description: Set the specified state for an Analytics Flow that corresponds
        to the specified flow id. Setting the state of the flow is equivalent to telling
        the flow to transition to that state.  So, if the state is set to RUNNING,
        the flow will attempt to run. If the state is set to CANCELED, the execution
        of the flow will be canceled. The toNode query parameter may be used to indicate
        that the flow should run starting with the initial node and ending with the
        specified node. Only paths to that node will be executed.
      operationId: updateFlowState
      parameters:
      - name: flowId
        in: path
        description: id of the flow for which the state is to be updated.
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: The requested value to which the flow status is to be set
        required: true
        schema:
          type: string
          enum:
          - RUNNING
          - CANCELED
          - COMPLETED
      - name: toNode
        in: query
        description: The URI to the final node in the flow to execute. This parameter
          is ignored if the value parameter is not RUNNING.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              description: media type of the flow resource, whose state change was
                requested
              schema:
                type: string
            ETag:
              description: E-Tag for response
              schema:
                type: string
          content:
            "application/vnd.sas.analytics.flow+json":
              schema:
                $ref: "#/components/schemas/flow"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdStateUpdateRequest200Response"
            "application/json":
              schema:
                $ref: "#/components/schemas/flow"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdStateUpdateRequest200Response"
        "400":
          description: Bad Request
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                Default:
                  $ref: "#/components/examples/AnalyticsFlowsPutFlowsbyIdStateUpdateRequest400Response"
components:
  schemas:
    flowConnection:
      type: object
      description: Specifies a connection between two nodes in a flow.
      properties:
        createdBy:
          type: string
          description: userid of the user who created the resource
        creationTimeStamp:
          type: string
          format: date-time
          description: creation time of the resource
        description:
          type: string
          description: user-provided description of the resource
          maximum: 500
        name:
          type: string
          description: User-specified name of the resource
          maximum: 100
        fromNodeUri:
          type: string
          description: URI of from-node in the connection. This connection is an outgoing
            connection from the from-node.
          maximum: 225
        id:
          type: string
          description: system-assigned ID of the resource
          maximum: 225
        links:
          type: array
          description: The links that apply to the resource
          items:
            $ref: "#/components/schemas/link"
        modifiedBy:
          type: string
          description: The userid of the user who last updated the resource
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The time of the last update of the resource
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The revision number of this resource.  The version number of
            this resource. When updating a resource, this field must not be modified
            from the value it was when the resource was last retrieved. This field
            is not required at creation time. This field is not required at creation
            time.
        state:
          type: string
          description: state of the to-node associated with this connection.
          maximum: 20
          enum:
          - UNDEFINED
          - PENDING
          - WAITING
          - STARTUPCODE
          - GLOBALPROPERTIES
          - STARTING
          - RUNNING
          - CANCELED
          - COMPLETED
          - ERROR
        toNodeUri:
          type: string
          description: URI of to-node in the connection. This connection is an incoming
            connection to the to-node.
          maximum: 225
        version:
          type: integer
          format: int32
          description: version of the representation.
    flow:
      type: object
      description: A resource that represents a collection of flow connections and
        an overall state. A flow has a single initial node that is represented by
        a flow connection that has no from-node. All other connections in the flow
        must have a valid from-node that is equal to the to-node of at least one other
        connection in the flow. Terminal nodes in the flow are those with a to-node
        that is not equal to the from-node of any other connection in the flow.
      required:
      - name
      properties:
        createdBy:
          type: string
          description: userid of the user who created the resource
        creationTimeStamp:
          type: string
          format: date-time
          description: creation time of the resource
        description:
          type: string
          description: user-provided description of the resource
          maximum: 500
        id:
          type: string
          description: system-assigned ID of the resource
          maximum: 2255
        links:
          type: array
          description: The links that apply to the resource
          items:
            $ref: "#/components/schemas/link"
        modifiedBy:
          type: string
          description: The userid of the user who last updated the resource
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The time of the last update of the resource
        name:
          type: string
          description: User-specified name of the resource
          maximum: 100
        nodes:
          type: array
          description: connections between nodes
          items:
            $ref: "#/components/schemas/flowConnection"
        revision:
          type: integer
          format: int64
          description: The revision number of this resource. When updating a resource,
            this field must not be modified from the value it was when the resource
            was last retrieved. This field is not required at creation time.
          minimum: 0
        state:
          type: string
          description: The state of the current flow
          maximum: 20
          enum:
          - UNDEFINED
          - RUNNING
          - ERROR
          - CANCELED
          - COMPLETED
          - DELETED
        version:
          type: integer
          format: int32
          description: version of the representation
    flowsCollection:
      title: Flows Collection
      description: A collection of Flow representations
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/flow"
            description: The array of Flow representations in the collection.
    transferObjectConnector:
      title: Transfer Object Connector
      description: Content providers implementing the Transfer Object Provider contract
        use this media type to provide connection information for the content to be
        transfered.
      x-sas-media-type:
        name: application/vnd.sas.transfer.object.connector
        version: 1
      properties:
        id:
          type: string
          format: object-id
          description: unique identifier of the object
        name:
          type: string
          description: name of the related object
        version:
          type: integer
          description: transfer object connector version
        uri:
          type: string
          description: the URI of the related object
        contentType:
          type: string
          description: media type of the related object
        type:
          type: string
          description: type of connection. This can be any value the creator of the
            connection wants but should be used to determine what to do to reconstitute
            the relationship.
        hints:
          type: array
          description: hints that can be used to help find the object to connect to
            in the target system
          items:
            type: string
    summary:
      title: Resource Summary
      type: object
      description: The summarized representation of a resource. Often used in collection
        responses when more specific details aren't needed.
      x-sas-media-type:
        name: application/vnd.sas.summary
        version: 1
      required:
      - id
      - links
      - version
      properties:
        id:
          type: string
          description: The unique identifier for the resource.
        name:
          type: string
          description: The name of the resource.
        type:
          type: string
          description: The type of the resource.
        description:
          type: string
          description: The description of the resource.
        createdBy:
          type: string
          description: The user who created the resource.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp in YYYY-MM-DDThh:mm:ss.sssZ format when the resource
            was created.
        modifiedBy:
          type: string
          description: The user who most recently modified the resource.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp in YYYY-MM-DDThh:mm:ss.sssZ format when the resource
            was last modified.
        links:
          type: array
          description: The links that apply to the resource.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the resource. This representation is
            version 1.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
