      operationId: deleteDomain
      summary: Delete Domain
      description: Deletes the shadow domain with the provided id. In order to drop
        the domain along with all the credentials set the query parameter dropDisposition
        to ?dropDisposition=cascade. This will successfully drop the domain containing
        objects and return an empty body with the status code 204 'No Content'. Setting
        the ?dropDisposition=restrict will restrict the dropping of a domain that
        contains any objects.
      tags:
      - Domains
      parameters:
      - name: serverId
        in: path
