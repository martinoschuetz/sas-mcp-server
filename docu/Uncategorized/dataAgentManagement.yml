        required: true
        schema:
          type: string
      - name: domainId
        in: path
        description: The domain id
        required: true
        schema:
          type: string
      - name: dropDisposition
        in: query
        description: >
          Specifies the drop disposition as one of the following values:
            - 'cascade' - indicates if contained objects should be dropped
            - 'restrict' - restricts the drop of a target if it contains any objects.
          This is the default value.
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Domain is deleted
        "400":
          description: Bad Request
        "404":
          description: |
            Domain not found
