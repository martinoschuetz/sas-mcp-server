---
openapi: 3.0.3
info:
  version: "4"
  title: Data Agent Management
  description: >
    The Data Agent Management API provides a way for users to administer and
    configure the SAS Data Agent. It enables administrators and authorized users
    to view and operate on the configuration data and metadata stored in the
    server's System catalog surfaced via the Information Views. Users should use
    this API to retrieve, define and configure data services, data source names,
    catalogs and schemas; set and modify options on the server itself, including
    the connection management, privilege caching, data masking encryption, etc.
    This service also provides a way to manage shadow domains and credentials
    for the Remote or on-premise Data Agent. The colocated or in-cloud Data Agent
    uses the
    credentials service for the credential management.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: "SAS Developers"
    email: "devex@sas.com"
    url: "https://developer.sas.com"
servers:
- url: http://example.com/dataAgentManagement
  description: Example of dataAgentManagement base URL.
tags:
- name: Root
  description: The API root.
- name: Servers
  description: SAS Data Agent Definitions and Configuration.
- name: Data Services
  description: Data Service Definitions and Configuration.
- name: Data Source Names
  description: Data Source Name Definitions and Configuration.
- name: Catalogs
  description: Catalog Definitions and Configuration.
- name: Schemas
  description: Schema Definitions and Configuration.
- name: Domains
  description: Shadow Domains.
- name: Credentials
  description: Credentials defined in shadow domains.
paths:
  /:
    get:
      operationId: root
      summary: API root information
      description: Returns information about this API and the top level entry points.
      tags:
      - Root
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/getRootResponse"
    head:
      operationId: headersForRoot
      summary: Check if the service is available
      description: Returns whether or not the Data Agent Management service is running.
      tags:
      - Root
      responses:
        "200":
          description: OK. Service is running and available
  "/{serverId}":
    get:
      operationId: getServer
      summary: Get SAS Data Agent
      description: Returns information about a single Data Agent based on the unique
        id provided. By default a complete server representation, application/vnd.sas.data.agent.admin.server+json
        is returned. If an alternate media type is required, please set an Accept
        header to the required representation.
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      tags:
      - Servers
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.data.agent.admin.server+json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/getServerResponse"
            application/vnd.sas.data.agent.admin.server.summary+json:
              schema:
                $ref: "#/components/schemas/serverSummary"
              examples:
                serverSummary:
                  $ref: "#/components/examples/getServerSummaryResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/getServerResponse"
        "404":
          description: |
            Data Agent does not exist
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
    head:
      operationId: headersForServer
      summary: Check if Data Agent service exists
      description: Returns whether or not a Data Agent service with the specified
        id exists.
      tags:
      - Servers
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK. Server exists.
        "404":
          description: Server does not exist
    patch:
      operationId: patchServer
      summary: Update Server configuration options
      description: Updates or adds the configuration options specified in the 'options'
        field. Only the 'options' field can be updated. This includes the server configuration
        options, including connection pooling, data masking, caching, connection string
        options, etc.
      tags:
      - Servers
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/updateServerRequest"
      responses:
        "200":
          description: |
            A server updated
          content:
            application/vnd.sas.data.agent.admin.server+json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/getServerResponseAfterPatch"
            application/json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/getServerResponseAfterPatch"
        "400":
          description: |
            Bad Request.
            - 27727 No fields were found to update.
            - 27731 Update on the field '' is not supported.
            - 27737 An invalid option name specified: "".
            - 27738 An invalid option value specified: "".
            - 27739 The number of embedded options "" exceeded the total number of options allowed "".
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorUpdateOnFieldNotSupported"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorUpdateOnFieldNotSupported"
        "404":
          description: |
            Server not found.
            - 27700 A Data Agent with id '' was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
    put:
      operationId: updateServer
      summary: Update Server by replacing its configuration options
      description: Updates the server by replacing all of the existing configuration
        options with the new ones specified in the 'options' field. Only the 'options'
        field can be updated. This includes the server configuration options, including
        connection pooling, data masking, caching, connection string options, etc.
      tags:
      - Servers
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/updateServerRequest"
      responses:
        "200":
          description: |
            A server updated
          content:
            application/vnd.sas.data.agent.admin.server+json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/getServerResponseAfterPut"
            application/json:
              schema:
                $ref: "#/components/schemas/server"
              examples:
                server:
                  $ref: "#/components/examples/getServerResponseAfterPut"
        "400":
          description: |
            Bad Request.
            - 27727 No fields were found to update.
            - 27731 Update on the field '' is not supported.
            - 27737 An invalid option name specified: "".
            - 27738 An invalid option value specified: "".
            - 27739 The number of embedded options "" exceeded the total number of options allowed "".
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorUpdateOnFieldNotSupported"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorUpdateOnFieldNotSupported"
        "404":
          description: |
            Server not found.
            - 27700 A Data Agent with id '' was not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
  "/{serverId}/dataServices":
    get:
      operationId: getDataServices
      summary: Get Data Services
      description: Returns a collection of data services defined in the SAS Data Agent.
        Standard paging, filtering and sorting options are provided. The members of
        this collection use application/vnd.sas.data.agent.data.service.summary+json
        media type.
      tags:
      - Data Services
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: >
          The desired data service representation. The Accept-Item options
          are:
            - application/vnd.sas.data.agent.admin.data.service.summary+json (default)
            - application/vnd.sas.data.agent.admin.data.service+json

          If Accept-Item type is set to application/vnd.sas.data.agent.admin.data.service+json
          the detailed data service representation with configuration options will
          be returned. Otherwise, if the header is not set or is set to application/vnd.sas.data.agent.admin.data.service.summary+json
          the summary representation will be returned.
        schema:
          type: string
          enum:
          - application/vnd.sas.data.agent.admin.data.service.summary+json
          - application/vnd.sas.data.agent.admin.data.service+json
          default: application/vnd.sas.data.agent.admin.data.service.summary+json
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first data service in a page. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of data services to return in this page of results.
          The actual number of returned data services may be less if the collection
          has been exhausted. Defaults to 30.
        schema:
          type: integer
      - name: filter
        in: query
        description: 'Filter criteria for returned data services. See the [Filtering
          in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters) for more
          information on the format of the filter. The supported functions are: and,
          or, not, eq, ne, lt, le, gt, ge, startsWith, endsWith. Filtering can be
          performed on most of the fields. For example, in order to return the data
          services with type set to oracle, provide the following filter parameter
          filter=eq(type, "oracle").'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort returned data services. The sort criteria supports all the
          fields in either ascending or descending order.  See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)
          for more information on the format of the sort keys. In order sort the data
          services by name in the ascending order set the query parameter sortBy=name:ascending.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/dataServiceSummaryCollection"
                - $ref: "#/components/schemas/dataServiceCollection"
              examples:
                dataServiceSummaries:
                  $ref: "#/components/examples/getDataServiceSummariesResponse"
                dataServices:
                  $ref: "#/components/examples/getDataServicesResponse"
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/dataServiceSummaryCollection"
                - $ref: "#/components/schemas/dataServiceCollection"
              examples:
                dataServiceSummaries:
                  $ref: "#/components/examples/getDataServiceSummariesResponse"
                dataServices:
                  $ref: "#/components/examples/getDataServicesResponse"
        "400":
          description: |
            Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorInvalidParameter"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorInvalidParameter"
        "404":
          description: |
            Data Agent not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorServerNotFound"
    head:
      operationId: headersForDataServices
      summary: Check if data services are available
      description: Returns whether or not data services for the specified server are
        available.
      tags:
      - Data Services
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: >
          The desired data service representation. The Accept-Item options
          are:
            - application/vnd.sas.data.agent.admin.data.service.summary+json (default)
            - application/vnd.sas.data.agent.admin.data.service+json

          If Accept-Item type is set to application/vnd.sas.data.agent.admin.data.service+json
          the detailed data service representation with configuration options will
          be returned. Otherwise, if the header is not set or is set to application/vnd.sas.data.agent.admin.data.service.summary+json
          the summary representation will be returned.
        schema:
          type: string
          enum:
          - application/vnd.sas.data.agent.admin.data.service.summary+json
          - application/vnd.sas.data.agent.admin.data.service+json
          default: application/vnd.sas.data.agent.admin.data.service.summary+json
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first data service in a page. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of data services to return in this page of results.
          The actual number of returned data services may be less if the collection
          has been exhausted. Defaults to 30.
        schema:
          type: integer
      - name: filter
        in: query
        description: 'Filter criteria for returned data services. See the [Filtering
          in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters) for more
          information on the format of the filter. The supported functions are: and,
          or, not, eq, ne, lt, le, gt, ge, startsWith, endsWith. Filtering can be
          performed on most of the fields. For example, in order to return the data
          services with type set to oracle, provide the following filter parameter
          filter=eq(type, "oracle").'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort returned data services. The sort criteria supports all the
          fields in either ascending or descending order.  See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)
          for more information on the format of the sort keys. In order sort the data
          services by name in the ascending order set the query parameter sortBy=name:ascending.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK. Data services available.
        "400":
          description: Bad request.
        "404":
          description: Data agent not found.
    post:
      operationId: createDataService
      summary: Create a new data service
      description: Create a new data service.
      tags:
      - Data Services
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      - name: isDriverConoptsQuoted
        in: query
        description: Defines if the driver conopts option values are quoted. Defaults
          to true. Note the driver conopts are conopts embedded within the outer conopts.
        required: false
        schema:
          type: boolean
      requestBody:
        $ref: "#/components/requestBodies/createDataServiceRequest"
      responses:
        "201":
          description: New data service created
          headers:
            Location:
              description: The location of a newly created data service resource.
              schema:
                type: string
          content:
            application/vnd.sas.data.agent.admin.data.service+json:
              schema:
                $ref: "#/components/schemas/dataService"
              examples:
                dataService:
                  $ref: "#/components/examples/createDataServiceResponse"
                dataServiceWithDriverConopts:
                  $ref: "#/components/examples/createDataServiceWithDriverConoptsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/dataService"
              examples:
                dataService:
                  $ref: "#/components/examples/createDataServiceResponse"
                dataServiceWithDriverConopts:
                  $ref: "#/components/examples/createDataServiceWithDriverConoptsResponse"
        "400":
          description: |
            Bad Request.
            - 27737 An invalid option name specified: "".
            - 27738 An invalid option value specified: "".
            - 27739 The number of embedded options "" exceeded the total number of options allowed "".
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorInvalidOptionInBody"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorInvalidOptionInBody"
        "409":
          description: Conflict. The data service with the same name already exists.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorConflictOnDataServiceCreation"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorConflictOnDataServiceCreation"
