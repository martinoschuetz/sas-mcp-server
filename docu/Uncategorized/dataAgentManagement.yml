        description: The user id
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/updateUserCredentialRequest"
      responses:
        "200":
          description: A user credential updated
          content:
            application/vnd.sas.data.agent.admin.credential+json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                schema:
                  $ref: "#/components/examples/getUserCredentialResponseAfterPut"
            application/json:
              schema:
                $ref: "#/components/schemas/credential"
              examples:
                schema:
                  $ref: "#/components/examples/getUserCredentialResponseAfterPut"
        "400":
          description: |
            Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorInvalidOptionInBody"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorInvalidOptionInBody"
        "404":
          description: |
            Server, domain or user not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorCredentialNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorCredentialNotFound"
    delete:
      operationId: deleteUserCredential
      summary: Delete User Credential
      description: Deletes the user credential in a shadow domain.
      tags:
      - Credentials
      parameters:
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      - name: domainId
        in: path
        description: The domain id
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: The user id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Credential is deleted
        "404":
          description: |
            Server, domain or user not found
