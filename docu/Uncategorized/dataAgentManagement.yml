          description: |
            Bad Request
            - 27625 A request resulted in the Server error. Message: "Invalid connection". SQLState: "HY000". Error code: "0".
            - 27629 An invalid path resource "serverId" with value "" was specified.
            - 27629 An invalid path resource "domainId" with value "" was specified.
            - 27724 Missing or invalid fields in body error
