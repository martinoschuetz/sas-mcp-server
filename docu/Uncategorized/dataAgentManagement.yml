      - name
      properties:
        name:
          type: string
          description: |
            The name of the DSN
        description:
          type: string
          description: |
            A brief description about the data source name
        dataServiceName:
          type: string
          description: |
            The data service name of the DSN
        dataSourceNameType:
          type: string
          description: |
            Specifies the DSN type.
          enum:
          - federated
          - noprompt
          - connect
          - file
        format:
          type: string
          description: >
            Specifies the format of the content as standard, which is the
            standard driver connection string
        ownerId:
          type: string
          description: |
            Specifies the id of the user that owns the DSN
        ownerName:
          type: string
          description: |
            Specifies the name of the user that owns the DSN
        ownerType:
          type: string
          description: |
            Specifies the owner type
          enum:
          - user
          - role
        version:
          type: integer
          description: data source name schema version
        links:
          type: array
          description: Links to related resources and/or operations
          items:
            $ref: "#/components/schemas/link"
    dataSourceNameSummaryCollection:
      title: The Data Source Name Summary Collection
      description: A collection of data source name summary representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/dataSourceNameSummary"
            description: The array of `application/vnd.sas.data.agent.admin.data.source.name.summary+json`
              representations.
    dataSourceName:
      type: object
      description: Information about a data source name (or DSN), including the configuration
        options, connection options and lineage information. The `name` and `dataSourceNameType`
        fields are required when creating a new DSN. When creating a standard DSN
        the `dataServiceName` is also required, and when creating the federated DSN
        the `children` field is required. The `format`, `ownerId`, `ownerName` and
        `ownerType` are ignored when creating or updating a DSN. The `dataServiceName`
        field cannot be updated via a PUT or PATCH.
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 256
          description: |
            The name of the DSN
        description:
          type: string
          maxLength: 256
          description: |
            A brief description about the data source name
        dataServiceName:
          type: string
          maxLength: 256
          description: >
            The data service name of the DSN. This field is required when
            creating a standard DSN. This feild is ignored when updating the
            data source name.
        dataSourceNameType:
          type: string
          maxLength: 256
          description: >
            Specifies the DSN type. This field is required when creating a new
            data source name.
          enum:
          - federated
          - noprompt
          - connect
          - file
        format:
          type: string
          maxLength: 32
          description: >
            Specifies the format of the content as standard, which is the
            standard driver connection string. This field is ignored when
            creating or updating the data source name.
        ownerId:
          type: string
          maxLength: 256
          description: >
            Specifies the id of the user that owns the DSN. This field is
            ignored when creating or updating the data source name.
        ownerName:
          type: string
          maxLength: 256
          description: >
            Specifies the name of the user that owns the DSN. This field is
            ignored when creating or updating the data source name.
        ownerType:
          type: string
          maxLength: 10
          description: >
            Specifies the owner type. This field is ignored when creating or
            updating the data source name.
          enum:
          - user
          - role
        options:
          type: array
          maxLength: 100
          description: |
            Specifies the data source name configuration options. All password option values must be Base64 or SAS encoded.
          items:
            type: object
            additionalProperties:
              oneOf:
              - type: string
              - type: number
              - type: integer
              - type: boolean
              - type: array
        connectionOptions:
          type: array
          maxLength: 100
          description: |
            Specifies the data source name connection options.
          items:
            type: object
            additionalProperties:
              oneOf:
              - type: string
              - type: number
              - type: integer
              - type: boolean
              - type: array
        children:
          type: array
          maxLength: 100
          description: >
            Specifies the children of a federated DSN as an array of String
            values.
          items: {}
        asAdministrator:
          type: boolean
          description: >
            Specifies if the DSN is created using the ADMINISTRATOR role as the
            owner. This field is used only when creating a DSN.
        version:
          type: integer
          description: data source name schema version
        links:
          type: array
          description: Links to related resources and/or operations
          items:
            $ref: "#/components/schemas/link"
    dataSourceNameCollection:
      title: The Data Source Name Collection
      description: A collection of data source name representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
