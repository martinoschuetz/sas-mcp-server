  "/{serverId}/catalogs":
    get:
      operationId: getCatalogs
      summary: Get Catalogs
      description: Returns a collection of system catalogs. Standard paging, filtering
        and sorting options are provided. The members of this collection use application/vnd.sas.data.agent.admin.catalog.summary+json
        media type.
      tags:
      - Catalogs
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: >
          The desired catalog representation. The Accept-Item options are:
            - application/vnd.sas.data.agent.admin.catalog.summary+json (default)
            - application/vnd.sas.data.agent.admin.catalog+json

          If Accept-Item type is set to application/vnd.sas.data.agent.admin.catalog+json
          the complete catalog representation with configuration options will be returned.
          Otherwise, if the header is not set or is set to application/vnd.sas.data.agent.admin.catalog.summary+json
          the summary representation will be returned.
        schema:
          type: string
          enum:
          - application/vnd.sas.data.agent.admin.catalog.summary+json
          - application/vnd.sas.data.agent.admin.catalog+json
          default: application/vnd.sas.data.agent.admin.catalog.summary+json
      - name: serverId
        in: path
        description: The server id
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first catalog in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of catalogs to return in this page of results.
          The actual number of returned catalogs may be less if the collection has
          been exhausted. Defaults to 30.
        schema:
          type: integer
      - name: filter
        in: query
        description: >-
          Filter criteria for returned catalogs. See the [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters) for more
          information on the format of the filter. The supported functions
          are: and, or, not, eq, ne, lt, le, gt, ge, startsWith, endsWith.
          Filtering can be performed on most of the fields. Examples:
           - Get catalogs with name starting with and driver set to 'and(startsWith(name,
          "LD"), eq(driver, "BASE"))'
           - Get catalogs with driver not equals to 'ne(driver, "BASE")'
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: >-
          Sort returned catalogs. The sort criteria supports all the fields in
          either ascending or descending order.  See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting) for more
          information on the format of the sort keys. Examples:
           - Sort by name in an ascending order: /dataAgentContent/DataAgent_HRdataSources/BASE/catalogs?sortBy=name:ascending
           - Sort by driver in a descending order: /dataAgentContent/DataAgent_HRdataSources/BASE/catalogs?sortBy=driver:descending
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/catalogSummaryCollection"
                - $ref: "#/components/schemas/catalogCollection"
              examples:
                catalogSummaries:
                  $ref: "#/components/examples/getCatalogSummariesResponse"
                catalogs:
                  $ref: "#/components/examples/getCatalogsResponse"
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/catalogSummaryCollection"
                - $ref: "#/components/schemas/catalogCollection"
              examples:
                catalogSummaries:
                  $ref: "#/components/examples/getCatalogSummariesResponse"
                catalogs:
                  $ref: "#/components/examples/getCatalogsResponse"
        "400":
          description: |
            Bad Request
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/errorInvalidParameter"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
