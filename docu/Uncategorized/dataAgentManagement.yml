  schemas:
    serverSummary:
      type: object
      description: Basic information about the server.
      properties:
        name:
          type: string
          description: |
            The name of the server
        serverVersion:
          type: string
          description: |
            The Data Agent server version
        type:
          type: string
          description: |
            The type of the server
        version:
          type: integer
          description: server schema version
        links:
          type: array
          description: Paging links that apply to this object
          items:
            $ref: "#/components/schemas/link"
    server:
      type: object
      description: Complete details about a Data Agent, including the configuration
        information. All the fields are ignored on a PUT and PATCH except for the
        `options` field.
      properties:
        name:
          type: string
          description: >
            The name of the server. This field is ignored when updating the
            server.
        serverVersion:
          type: string
          description: >
            The Data Agent version. This field is ignored when updating the
            server.
        type:
          type: string
          description: >
            The type of the server. This field is ignored when updating the
            server.
        options:
          type: array
          maxLength: 100
          description: |
            Specifies the server configuration options. All password option values must be Base64 or SAS encoded.
          items:
            type: object
            additionalProperties:
              oneOf:
              - type: string
              - type: number
              - type: integer
              - type: boolean
              - type: array
        version:
          type: integer
          description: server schema version
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
    dataServiceSummary:
      type: object
      description: Basic information about a data service.
      required:
      - name
      properties:
        name:
          type: string
          description: |
            The name of the data service
        dataServiceVersion:
          type: string
          description: |
            The data service version
        type:
          type: string
          description: |
            Specifies the data service type.
          enum:
          - base
          - db2unxpc
          - fedsvr
          - hive
          - mds
          - mysql
          - odbc
          - odbcFed
          - oracle
          - teradata
          - postgres
          - redshift
          - saphana
          - sqlserver
          - sqlsrv
          - sqlsvr
          - dagent
          - fileTransfer
          - unknown
          - server
          - tran
        domain:
          type: string
          description: >
            Specifies the authentication domain associated with the data service.
        version:
          type: integer
          description: data service schema version
        links:
          type: array
          description: Links to related resources and/or operations
          items:
            $ref: "#/components/schemas/link"
    dataServiceSummaryCollection:
      title: The Data Service Summary Collection
      description: A pageable collection of data service summary representations
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/dataServiceSummary"
            description: The array of `application/vnd.sas.data.agent.admin.data.service.summary+json`
              representations.
    dataService:
      type: object
      description: Detailed information about a data service, including its configuration.
      required:
      - name
      properties:
        name:
          type: string
          description: |
            The name of the data service
        dataServiceVersion:
          type: string
          description: |
            The data service version
        type:
          type: string
          description: |
            Specifies the data service type.
          enum:
          - base
          - db2unxpc
          - fedsvr
          - hive
          - mds
          - mysql
          - odbc
          - odbcFed
          - oracle
          - teradata
          - postgres
          - redshift
          - saphana
          - sqlserver
          - sqlsrv
          - sqlsvr
          - dagent
          - fileTransfer
          - unknown
          - server
          - tran
        domain:
          type: string
          description: >
            Specifies the authentication domain associated with the data service.
        options:
          type: array
          description: |
            Specifies the data service configuration options.
          items:
            type: object
            additionalProperties:
              oneOf:
              - type: string
              - type: number
              - type: integer
              - type: boolean
              - type: array
        version:
          type: integer
          description: data service schema version
        links:
          type: array
          description: Links to related resources and/or operations
          items:
            $ref: "#/components/schemas/link"
    dataServiceRequest:
      type: object
      description: The media type used to create or update the data service. The `type`
        field cannot be updated via a PUT and PATCH. The `name` and `type` fields
        are required when creating a new data service via a POST.
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 256
          description: >
            The name of the data service. This field is required when creating a
            new data service.
        type:
          type: string
          maxLength: 32
          description: >
            Specifies the data service type. Used when creating a new data
            service. Ignored when updating a data service.
          enum:
          - base
          - db2unxpc
          - fedsvr
          - hive
          - mds
          - mysql
          - odbc
          - odbcFed
          - oracle
          - teradata
          - postgres
          - redshift
          - saphana
          - sqlserver
          - sqlsrv
          - sqlsvr
          - dagent
          - fileTransfer
          - unknown
          - server
          - tran
        domain:
          type: string
          maxLength: 256
          description: >
            Specifies the authentication domain associated with the data service.
        catalogName:
          type: string
          maxLength: 256
          description: >
            Specifies the logical catalog name associated with the data service.
            This field is optional and is used when creating or updating a data
            service. If omitted, the default logical name matches the data
            service name.
        catalogs:
          type: array
          maxItems: 1000
          description: >
            Specifies the list of catalogs to register. This field is optional
            and is used when creating or updating a data service.
          items: {}
        registerAll:
          type: boolean
          description: >
            Specifies if to register all the catalogs. If registerAll is set to
            true and the catalogs list is specified, the list will be omitted.
            This field is optional and is used when creating or updating a data
            service.
        userName:
          type: string
          maxLength: 255
          description: >
            Specifies the name of the user used for establishing a connection to
            the data source, so that the connection and catalog names can be
            validated. This field is optional and is used when creating or
            updating a data service.
        password:
          type: string
          format: base64
          maxLength: 32768
          description: >
            Specifies the user's password used for establishing a connection to
            the data source, so that the connection and catalog names can be
            validated. This field is optional and is used when creating or
            updating a data service. The password must be Base64 encoded.
        isValidated:
          type: boolean
          description: >
            Specifies whether the connection, domain and catalog names are to be
            validated. This field is optional and is used when creating or
            updating a data service.
        options:
          type: array
          maxLength: 100
          description: |
            Specifies the data service configuration options. All password option values must be Base64 or SAS encoded.
          items:
            type: object
            additionalProperties:
              oneOf:
              - type: string
              - type: number
              - type: integer
              - type: boolean
              - type: array
        version:
          type: integer
          description: The data service request schema version
    dataServiceCollection:
      title: The Data Service Collection
      description: A collection of data service representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
