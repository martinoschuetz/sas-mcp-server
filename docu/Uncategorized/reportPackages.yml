  /jobs#requestParams:
    post:
      summary: Create a job to generate a report package from a persisted report
      description: >
        Create a job to generate a baseline, interactive, or nodata report
        package (<a
        href="#application-vnd.sas.report.package.job">application/vnd.sas.report.package.job</a>)
        from a persisted report. <br><br> The caller should use the <b>state</b>
        field in the response to check the job state. Upon 'running', the
        <b>self</b> link can be used to check the job state again. Upon
        'completed', the <b>reportPackages</b> link can be used to retrieve the
        package.   <br><br> The **reportStateUri** query parameter may be
        provided to identify persisted report state to be applied. (**Since:
        Version 3**) <br><br> Refer to <a href="#error-codes.md">SAS Error
        codes</a> for information on common error and failure codes.
      operationId: createJob
      tags:
      - Jobs
      parameters:
      - $ref: "#/components/parameters/reportUri"
      - $ref: "#/components/parameters/reportStateUri"
      - $ref: "#/components/parameters/dataLevelNoCustom"
      - $ref: "#/components/parameters/indexStrings"
      - $ref: "#/components/parameters/embeddedData"
      - $ref: "#/components/parameters/reportElements"
      - $ref: "#/components/parameters/style"
      - $ref: "#/components/parameters/wait"
      - $ref: "#/components/parameters/timeout"
      - $ref: "#/components/parameters/ifModifiedSince"
      - $ref: "#/components/parameters/themeVersion"
      - $ref: "#/components/parameters/executorId"
      - $ref: "#/components/parameters/dataSetFormat"
      - $ref: "#/components/parameters/completionNotification"
      - $ref: "#/components/parameters/parentFolderUri"
      - $ref: "#/components/parameters/filename"
      - $ref: "#/components/parameters/nameConflict"
      - $ref: "#/components/parameters/Accept-Language"
      - $ref: "#/components/parameters/Accept-Locale"
      - $ref: "#/components/parameters/Accept-Item"
      responses:
        "201":
          description: The requested report package job completed.
          headers:
            Location:
              description: Identifies the URI of the newly created job. This URI is
                equivalent to the 'self' link returned in the response body.
              schema:
                type: string
          content:
            application/vnd.sas.report.package.job+json;version=2:
              schema:
                oneOf:
                - $ref: "#/components/schemas/reportPackageJobCompleted"
                - $ref: "#/components/schemas/reportPackageJobFailed"
              examples:
                reportPackageJobCompleted:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson201"
                reportPackageJobFailed:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson409"
            application/vnd.sas.report.package.job+json;version=1:
              schema:
                oneOf:
                - $ref: "#/components/schemas/reportPackageJobCompleted"
                - $ref: "#/components/schemas/reportPackageJobFailed"
              examples:
                reportPackageJobCompleted:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson201"
                reportPackageJobFailed:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson409"
            application/vnd.sas.report.package.job+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/reportPackageJobCompleted"
                - $ref: "#/components/schemas/reportPackageJobFailed"
              examples:
                reportPackageJobCompleted:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson201"
                reportPackageJobFailed:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson409"
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/reportPackageJobCompleted"
                - $ref: "#/components/schemas/reportPackageJobFailed"
              examples:
                rreportPackageJobCompleted:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson201"
                reportPackageJobFailed:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson409"
            application/vnd.sas.report.package.job+xml;version=2:
              schema:
                oneOf:
                - $ref: "#/components/schemas/reportPackageJobCompleted"
                - $ref: "#/components/schemas/reportPackageJobFailed"
              examples:
                reportPackageJobCompleted:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml201"
                reportPackageJobFailed:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml409"
            application/vnd.sas.report.package.job+xml;version=1:
              schema:
                oneOf:
                - $ref: "#/components/schemas/reportPackageJobCompleted"
                - $ref: "#/components/schemas/reportPackageJobFailed"
              examples:
                reportPackageJobCompleted:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml201"
                reportPackageJobFailed:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml409"
            application/vnd.sas.report.package.job+xml:
              schema:
                oneOf:
                - $ref: "#/components/schemas/reportPackageJobCompleted"
                - $ref: "#/components/schemas/reportPackageJobFailed"
              examples:
                reportPackageJobCompleted:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml201"
                reportPackageJobFailed:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml409"
            application/xml:
              schema:
                oneOf:
                - $ref: "#/components/schemas/reportPackageJobCompleted"
                - $ref: "#/components/schemas/reportPackageJobFailed"
              examples:
                reportPackageJobCompled:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml201"
                reportPackageJobFailed:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml409"
        "202":
          description: The report package request has been accepted - the job is in
            the queue.
          headers:
            Location:
              description: Identifies the URI of the newly created job. This URI is
                equivalent to the 'self' link returned in the response body.
              schema:
                type: string
          content:
            application/vnd.sas.report.package.job+json;version=2:
              schema:
                $ref: "#/components/schemas/reportPackageJobRunning"
              examples:
                json:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson202"
            application/vnd.sas.report.package.job+json;version=1:
              schema:
                $ref: "#/components/schemas/reportPackageJobRunning"
              examples:
                json:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson202"
            application/vnd.sas.report.package.job+json:
              schema:
                $ref: "#/components/schemas/reportPackageJobRunning"
              examples:
                json:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson202"
            application/json:
              schema:
                $ref: "#/components/schemas/reportPackageJobRunning"
              examples:
                json:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson202"
            application/vnd.sas.report.package.job+xml;version=2:
              schema:
                $ref: "#/components/schemas/reportPackageJobRunning"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml202"
            application/vnd.sas.report.package.job+xml;version=1:
              schema:
                $ref: "#/components/schemas/reportPackageJobRunning"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml202"
            application/vnd.sas.report.package.job+xml:
              schema:
                $ref: "#/components/schemas/reportPackageJobRunning"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml202"
            application/xml:
              schema:
                $ref: "#/components/schemas/reportPackageJobRunning"
              examples:
                xml:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml202"
        "400":
          description: Bad Request (e.g., Missing or invalid request parameter, Invalid
            object type, Input parse error).
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson400"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                xml:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml400"
        "404":
          description: Not Found. The report with the given reportUri is not present
            on the system and/or the user does not have permission.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson404"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                xml:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml404"
        "409":
          description: Conflict. Report content downgrade is not supported. This error
            will be returned if the content version of the referenced report is newer
            than the content version of the requested package.
          content:
            application/vnd.sas.error+json;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                json:
                  $ref: "#/components/examples/responsePostJobsRequestParamsJson409"
            application/vnd.sas.error+xml;version=2:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                xml:
                  $ref: "#/components/examples/responsePostJobsRequestParamsXml409"
