    put:
      summary: Cancel package job
      description: >
        Cancels the package job identified by a particular id. A job can only be
        canceled by the user that created it. Note that canceling the job simply
        sends a signal to the package job that it should cancel. How the package job
        reacts
        to that signal is dependent on the specifics for that package job. Canceling
        a package
        job also cancels the data query job if it is still running. (**Since: Version
        18**)
      operationId: cancelJob
      tags:
      - Jobs
      parameters:
      - name: jobId
        in: path
        description: The id of the job
        required: true
        schema:
          type: string
          format: object-id
      - name: value
        in: query
        description: |
          The state **canceled** is the only supported state.
        required: true
        schema:
          type: string
      responses:
        "202":
          description: Accepted. The report package cancel request has been accepted
            - the job is in the queue. The current state of the canceled package job
            will be "canceling".
          headers:
            Content-Type:
              description: text/plain
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              examples:
                Canceling:
                  $ref: "#/components/examples/responsePutJobsJobIdStateTextPlain202Canceling"
                Canceled:
                  $ref: "#/components/examples/responsePutJobsJobIdStateTextPlain202Canceled"
