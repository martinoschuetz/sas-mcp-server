  schemas:
    bytes:
      description: Placeholder for various returned objects that cannot be completely
        documented here.
      type: object
    reportPackageJob:
      type: object
      description: Information about the job created to generate a report package.
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 2
        id:
          type: string
          description: The system generated id of the report package job.
        state:
          type: string
          description: >
            The state of the job. It can be pending, running, failed, completed,
            or notModified. The notModified value is **Since: Version 2**
        source:
          type: string
          description: The source of the report package related to this job - i.e.
            the 'reportUri' (when generating a package for a persisted report) or
            the 'reportIdentifier' that was passed in (when generating a package from
            XML/JSON content).
        createdBy:
          type: string
          description: The id of the user who created this job.
        creationTimeStamp:
          type: string
          description: The time when this job was created - in GMT, ISO 8601 format.
        startTimeStamp:
          type: string
          description: For running or completed jobs, this time indicates when the
            job execution started - in GMT, ISO 8601 format.
        completionTimeStamp:
          type: string
          description: For completed jobs, this time indicates when the job execution
            completed - in GMT, ISO 8601 format.
        error:
          type: object
          description: For failed jobs, an error object describing the failure.
        links:
          type: array
          description: Zero or more links to related resources or operations. See
            the <a href="#JobLinkRelations">Job Link relations table</a> for a description
            of the link types.
          items:
            $ref: '#/components/schemas/link'
    reportPackageJobCompleted:
      type: object
      description: A completed job for a report package.
      x-sas-media-type:
        name: application/vnd.sas.report.package.job
        version: 1
      properties:
