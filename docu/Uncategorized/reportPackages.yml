    reportContent:
      type: object
      description: >
        This media type contains a full <a
        href="http://sww.sas.com/saspedia/SASReport_(Business_Intelligence_Report_Definition)">SASReport</a>
        XML or JSON. Refer to the <a
        href="http://sww.sas.com/saspedia/Business_Intelligence_Report_Definition">BIRD
        specification</a> for more details. <br><br>
        Versioning for this media type is tied to the BIRD Schema version.  Versions
        4+ are supported in this release
        of the service.  A full list of the supported versions are identified by the
        `/reports/versions` and
        `/reports/versions/@defaultVersion` endpoints in the **reports** service.  The
        `/reports/versions` endpoint
        provides a list of the supported versions + a mapping between the media type
        version and the associated
        SASReport schema version for each, and the `/reports/versions/@defaultVersion`
        endpoint identifies the default
        for unversioned requests.
    reportTheme:
      description: >
        This media type is represented by the custom SAS Themes definition in the
        JSON format see the model definition <a
        href="http://swagger.na.sas.com/swagger-ui/?url=/apis/themes/v5/openapi-all.json">reportTheme</a>.
    reportState:
      type: object
      description: >
        This media type is represented by a <a
        href="http://sww.sas.com/saspedia/SASReportState_(Business_Intelligence_Report_Definition)">SASReportState</a>
        XML or JSON element.  Refer to the <a
        href="http://sww.sas.com/saspedia/Business_Intelligence_Report_Definition_Document_State_Specification">BIRD
        Report State specification</a> for additional  information. <br><br>
        Versioning for this media type is tied to the BIRD Schema version.  Versions
        4+ are supported in this release
        of the service.  A full list of the supported versions are identified by the
        `/reports/versions` and
        `/reports/versions/@defaultVersion` endpoints in the **reports** service.  The
        `/reports/versions` endpoint
        provides a list of the supported versions + a mapping between the media type
        version and the associated
        SASReport schema version for each, and the `/reports/versions/@defaultVersion`
        endpoint identifies the default
        for unversioned requests.
    reportPackage:
      type: object
      description: |
        A [report package](#ReportPackage)
      x-sas-media-type:
        name: application/vnd.sas.report.package
        version:
      properties:
        version:
          type: integer
          description: This media type's schema version number.  Versioning for this
            media type is tied to the BIRD Schema version and matches the version
            of the report.xml content included in the package.  Versions 4+ are supported
            in this release of the service. A full list of the supported versions
            are identified by the `/reports/versions` endpoint in the **reports**
            service, and the current default version can be looked up dynamically
            using `/reports/versions/@defaultVersion`.
        id:
          type: string
          description: The system generated id of the report package.
        dataLevel:
          type: string
          description: The data level of the report package. Refer to the Data Level
            definition for more information.
        generatedTimeStamp:
          type: string
          description: The date and time when the report package was generated - in
            GMT, ISO 8601 format. This can be used to determine if the report must
            be re-generated due to changes on the server.
        modifiedTimeStamp:
          type: string
          description: >
            The date and time of the last modification to the report or the
            referenced data sources - in GMT, ISO 8601 format. (**Since: Version
            2**)
        updateCharacteristic:
          type: string
          description: >
            **Optional** The package may have a unique update characteristics.
            The values are **timeSensitive** and **volatile.** (**Since: Version
            2**)
        timeSensitivityInterval:
          type: string
          description: >
            **Optional** The time interval for which the time-sensitive data in this
            report package is valid. The package will have a time Sensitivity Interval
            only if the update characteristics is set to **timeSensitive**. Possible
            values
            are - MINUTE, HOUR, DAY, WEEK, WEEKV, MONTH, QUARTER, YEAR AND ALLTIME.
        expirationForTimeSensitiveData:
          type: string
          description: >
            **Optional** The date and time when the time-sensitive data in this report
            package
            is set to expire  - in GMT, ISO 8601 format. . The package will have a
            expiration
            time only if the update characteristics is set to **timeSensitive**.
        locale:
          type: string
          description: The locale of the report package. This is determined at generation
            time based on the Accept-Language of the request.
        formatLocale:
          type: string
          description: >
            The format locale of the report package. This is determined at
            generation time based on the **Accept-Locale** of the request.
            (**Since: Version 2**)
        reportElements:
          type: string
          description: >
            A comma-delimited list representing the subset of the report
            elements that were included in the report package generation. This
            includes the sections (**vi#**)  and visual elements (**ve#**) that
            were provided in the **&reportElements** query parameter of the
            report package generation (POST /jobs) . If this member is
            not  present, all of the report elements were included in the report
            package generation. (**Since: Version 2**)
        reportStateUri:
          type: string
          description: >
            The URI of the report state applied when generating the report
            package. (**Since: Version 3**)
        source:
          type: string
          description: The source of the report package - ie. the 'reportUri' (when
            generating a package for a persisted report) or the 'reportIdentifier'
            that was passed in (when generating a package from XML/JSON content).
        size:
          type: integer
          description: The size of the package in bytes. This size indicates the total
            uncompressed size including all the files and links in the package.
        style:
          type: string
          description: >
            Indicates the client has set a style override. Example: "highContrast"
            (**Since: Version 22**)
        files:
          type: array
          description: Array of zero or more file objects.
          items:
            $ref: "#/components/schemas/fileObject"
        links:
          type: array
          description: Zero or more links to related resources or operations. See
            the <a href="#PackageLinkRelations">Package Link relations table</a> for
            a description of the link types.
          items:
            $ref: '#/components/schemas/link'
        warnings:
          type: string
          description: A comma-separated list of the warnings, if any, that were encountered
            during the report package generation. - "result" -- One or more data retrievals
            encountered problems. Additional information will be available on the
            Result elements within the Report. See the BIRD Result specification for
            additional details. - "schema" -- Schema validation failed. Details will
            be available in the log or through a call to the report service validation
            API. - "unableToValidate" -- The schema could not be validated. Details
            will be available in the log or through a call to the report service validation
            API. - "missingImage" -- One or more images could not be retrieved. The
            'file' attribute for missing images will point to the original resource
            URI and will not have a corresponding file in the report package. Refer
            to BIRD images for more information. - "missingCSS" -- The base style
            sheet resource could not be retrieved. If available, the Themes service
            default style sheet will be substituted in the package. - "missingResource"
            -- The Metadata Supplement is missing from the package. - "limitedInteractivity"
            -- One or more visuals were not able to retrieve sufficient data to support
            full interactivity when viewed disconnected from the server. Additional
            information will be available in the package status report. - "timeout"
            -- One or more data retrievals timed out while running. Additional information
            will be available in the package status report and on the Result elements
            within the report. - "unresolvedDynamicPrompt" -- One or more dynamic
            prompts could not resolve their source data. Additional information will
            be available in the package status report. - "unsupportedFeature" -- The
            report uses a feature that is not supported in offline packages. For offline
            packages, additional information will be available in the package status
            report. - "possibleUpgradeInProgress" -- An upgrade might be in progress.
            This may be the root cause for some or all of the other package warnings.
            For offline packages, additional information will be available in the
            package status report. - "casMaintenance" -- CAS is in a read-only or
            unavailable state, possibly due to an update. This may be the root cause
            for some or all of the other package warnings.
        systemParameters:
          type: array
          description: >
            Array of 0 or more systemParameter objects.  (**Since: Version 58**)
          items:
            $ref: "#/components/schemas/systemParameter"
    systemParameter:
      type: object
      description: >
        An object representing a system parameter.  The value of the
        parameter is either a single quoted (') string, a single number, a quoted
        (') csv list surrounded by square brackets [], or a list of numbers
        surrounded by square brackets [].  If a string has a quote (') within it,
        it will be escaped by doubling the single quote ('').  (**Since: Version 58**)
      properties:
        name:
          type: string
          description: The name of the system parameter (currentUser, currentUserMemberships).
        dataType:
          type: string
          description: The data type of the system parameter (string, double).
    fileObject:
      type: object
      description: A file object.
      properties:
        type:
          type: string
          description: The type of file (report, data, image, css, html, resource,
            state, status, gml, theme).
        name:
          type: string
          description: The name of the file. Files that can be retrieved in multiple
            formats (XML, JSON) will not include an file extension. Clients may choose
            to append the extension if the file is persisted locally.
        contentKey:
          type: string
          description: A key derived based on the hash of the file contents. Clients
            can use this string to compare across multiple versions of the same package
            to determine if the contents of the file has changed. This key can also
            be used to compare files from different packages for equality.
        source:
          type: string
          description: The original server location for the package file. Currently
            only populated for files of type 'image'.
        links:
          type: array
          description: A list of zero or more links to related resources or operations.
            Report package files will include a single **content** link that can be
            used to retrieve the file contents.
          items:
            $ref: '#/components/schemas/link'
    reportPackageOfflineValidation:
      description: This object describes the results of an offline report package
        validation check.
      type: object
      properties:
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 2
        valid:
          type: boolean
          description: This indicates if the report will be renderable offline. If
            it is false, there are errors in the report or features used that cannot
            be rendered from an offline package. If true, the report is renderable,
            although there may still be messages indicating elements in the report
            that will have limited interactivity when the report is viewed offline.
        error:
          type: object
          description: For failed jobs, an error object describing the failure.
        messages:
          type: array
          description: Details about all the features used in the report's visual
            elements that will impact the functionality of the report when using an
            offline package. These messages indicate which visual element is impacted.
            If the visual element is part of a composite, then the CompositeContainer
            will be indicated. There can be multiple distinct messages for a visual
            element, but duplicates will be filtered out.
          items:
            $ref: "#/components/schemas/reportPackageOfflineValidationMessages"
      example:
        version: 2
        valid: true
        messages:
        - type: limitedInteractivity
          reportElement: ve37
          message: Data-driven content is not supported.
        - type: limitedInteractivity
          reportElement": ve37
          message: Automatic actions are not supported.
        - type: unsupportedFeature
          reportElement: ve39
          message: Job content objects are not supported.
        - type: exportCondition
          reportElement: vi40
          message: "When a page's visibility is limited to specified users, that page\
            \ is not included when you export the entire report. This is because the\
            \ user-based limitation can no longer be applied. To export pages or objects\
            \ when a page in a report has limited visibility, select a subset of the\
            \ pages or the objects. (**Since: Version 2**)"
    reportPackageOfflineValidationMessages:
      description: This object contains information about a specific offline issue
        that will impact the report when viewed from an offline package.
      type: object
      properties:
        type:
          type: string
          description: The validation failure type. This differentiates between visuals
            that can be rendered in their initial state but will not support full
            interactivity, those visuals that are not supported at all in offline
            packages, and the reason why further queries were needed to generate the
            offline data.
          enum:
          - limitedInteractivity
          - unsupportedFeature
          - offlineNeedsAdvancedProcessing
          - exportCondition
        reportElement:
          type: string
          description: The name of the reportElement that failed validation. For composite
            visuals, this will be the name of the CompositeContainer.
        message:
          type: string
          description: A descriptive message of the validation failure.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error:
      $ref: "#/components/schemas/error2"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    attributes:
      title: Attributes
      description: Contains a set of attributes in the form of a map from string names
        to arbitrary values. The values may be strings, numbers, booleans, arrays,
        objects or null.
      x-sas-media-type:
        name: application/vnd.sas.attributes
        version: 1
      required:
      - version
      - attributes
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        description:
          type: string
          description: A description of the set of attributes.
        label:
          type: string
          description: A brief description or label for the set of attributes.
        attributes:
          type: object
          description: 'The map of attribute names to values.  The set of names is
            open, though individual services may define a closed set needed for a
            given resource in that service. The value of each attribute may be of
            types: number, string, boolean, array, or object.  Although property this
            is required, the mapping object can be empty, unless stated otherwise
            by specific documentation for resources where the application/vnd.sas.attributes
            type is used.'
          additionalProperties: true
        links:
          description: Links to associated resources and operations. APIs may provide
            links for the link relations `self', `update` (to replace the attributes),
            `patch` (to update some attributes) or others.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
