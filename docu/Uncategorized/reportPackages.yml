---
openapi: 3.0.3
info:
  title: Report Packages
  version: "21"
  description: >
    Executes reports, and generates report packages containing the XML, CSS,
    CSV, and other files needed for rendering reports in the viewer or in
    document form.
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/reportPackages
  description: example server
tags:
- name: Root
  description: The API root.
- name: Jobs
  description: Jobs to create report packages.
- name: Packages
  description: Report package resources.
- name: Files
  description: Files included in report packages.
- name: Release
  description: The platform release attributes.
- name: Settings
  description: The settings managed by the service.
- name: Validation
  description: Runs checks on various scenarios to check for issues up front.
paths:
  /:
    get:
      summary: Returns a set of links to the top-level resources and operations in
        the service
      description: >
        For more details on the returned links, see <a
        href="#RootLinkRelations">Root Link relations table</a>.
      tags:
      - Root
      responses:
        "200":
          description: OK. Returns the service's links
          headers:
            Content-Type:
              description: Identifies the media type returned in the response body.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                json:
                  $ref: "#/components/examples/responseGetRoot200"
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                json:
                  $ref: "#/components/examples/responseGetRoot200"
      operationId: root
  /release:
    head:
      summary: Get the headers associated with the list of platform release attributes
      description: >
        These attributes help our mobile and portable clients better determine how
        to setup the UI prior to logging on to the server.
        As such, user authentication is not required for this request.

        For more details on the returned platform release attributes, see the <a href="#Release">/release</a>
        resource.
      operationId: headersForRelease
      tags:
      - Release
      responses:
        "200":
          description: Ok
          headers:
            Content-Type:
              description: application/vnd.sas.attributes+json;version=1
              schema:
                $ref: '#/components/schemas/attributes'
    get:
      summary: The list of platform release attributes that have been made available
        to all clients of the service
      description: >
        These attributes help our mobile and portable clients better determine how
        to setup the UI prior to logging on to the server.
        As such, user authentication is not required for this request.

        For more details on the returned platform release attributes, see the <a href="#Release">/release</a>
        resource.
      operationId: getRelease
      tags:
      - Release
      responses:
        "200":
          description: Ok. The platform release attributes are returned.
          headers:
            Content-Type:
              description: application/vnd.sas.attributes+json
              schema:
                $ref: '#/components/schemas/attributes'
          content:
            application/vnd.sas.attributes+json;version=1:
              schema:
                $ref: '#/components/schemas/attributes'
              examples:
                json:
                  $ref: "#/components/examples/responseGetReleaseJson200"
            application/vnd.sas.attributes+json:
              schema:
                $ref: '#/components/schemas/attributes'
              examples:
                json:
                  $ref: "#/components/examples/responseGetReleaseJson200"
            application/json:
              schema:
                $ref: '#/components/schemas/attributes'
              examples:
                json:
                  $ref: "#/components/examples/responseGetReleaseJson200"
