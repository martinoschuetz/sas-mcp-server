components:
  parameters:
    reportUri:
      name: reportUri
      in: query
      description: The URI of the source report.
      required: true
      schema:
        type: string
    reportStateUri:
      name: reportStateUri
      in: query
      description: >
        The URI of the report state that may be used to identify the persisted
        report state. (**Since: Version 3**)
      required: false
      schema:
        type: string
    dataLevelNoCustom:
      name: dataLevel
      in: query
      description: The level of data to include in the report package (baseline, interactive,
        nodata, offline). Refer to the package <a href="#terminology.md">Terminology</a>
        section for more details.<br> `offline` - **since Version 7**
      required: false
      schema:
        type: string
        enum:
        - baseline
        - interactive
        - nodata
        - offline
        default: baseline
    dataLevelCustom:
      name: dataLevel
      in: query
      description: The level of data to include in the report package. For this particular
        request, only dataLevel=custom applies. Refer to the package <a href="#terminology.md">Terminology</a>
        section for more details.
      required: false
      schema:
        type: string
        enum:
        - custom
        default: custom
    dataLevelFull:
      name: dataLevel
      in: query
      description: The level of data to include in the report package (baseline, interactive,
        custom, nodata, offline). Refer to the package <a href="#terminology.md">Terminology</a>
        section for more details.<br> `offline` - **since Version 7**
      required: false
      schema:
        type: string
        enum:
        - baseline
        - interactive
        - custom
        - nodata
        - offline
        default: baseline
    indexStrings:
      name: indexStrings
      in: query
      description: Specifies whether or not to create string tables for string columns
        (**Since version 7**).
      required: false
      schema:
        type: boolean
        enum:
        - true
        - false
        default: true
    embeddedData:
      name: embeddedData
      in: query
      description: >
        Include CSV content as inline embedded data.  <br><br> When **true**,
        the Results will include Data and StringTable elements with inline CSV
        data. <br><br> When **false**, the CSV data will be cached on the
        server, and the Results will include DataFile and StringTableFile
        elements with a **file**  attribute identifying the URI that can be used
        to retrieve the file. <br><br> The embeddedData parameter is a string,
        with valid values **true**, **false**, and **limited**.
        When  **limited**, the Results will include inline CSV for small result
        sets, and DataFile and StringTableFile elements for larger result sets.
        The embedded  data limit defaults to **200 bytes**, but is configurable
        through the **sas.reportdata.properties.custom.embeddedDataLimitBytes**
        service configuration  property (**Since version 7**).
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        - 'limited'
        default: limited
    reportElements:
      name: reportElements
      in: query
      description: A comma separated list of the sections (vi#) / visual elements
        (ve#) to include in the report package -- (default = full report). This list
        is used to minimize the data queries that are executed and to filter the list
        of images that are included in the report package.
      required: false
      schema:
        type: string
    reportVersion:
      name: reportVersion
      in: query
      description: The media version that the report should be opened as, overriding
        the version the report actually is. This allows for downgrading report versions.
      required: false
      schema:
        type: number
        format: integer
    style:
      name: style
      in: query
      description: An override style to replace the report theme as defined in the
        BIRD report.
      required: false
      schema:
        type: string
        enum:
        - highContrast
    wait:
      name: wait
      in: query
      description: Specifies the number of floating point seconds to wait for the
        job to complete. The range is 0-30 seconds.
      required: false
      schema:
        type: number
        format: float
        default: 0
    Accept-Language:
      name: Accept-Language
      in: header
      description: >
        Industry standard header for specifying the user's locale. Report
        package content including report definition, data, and result warnings
        will be localized according to the Accept-Language.

        For more details, see the specs at <a href="https://tools.ietf.org/html/rfc7231#section-5.3.5">Accept-Language</a>
      required: true
      schema:
        type: string
    Accept-Locale:
      name: Accept-Locale
      in: header
      description: >
        SAS header for specifying a "format locale" distinct from the user's
        language (Accept-Language).  Usage and syntax is similar to
        Accept-Language. The report package content will be sorted and formatted
        according to the Accept-Locale. If not specified, the Accept-Language
        locale is used for sorting and formatting.
      required: true
      schema:
        type: string
    Accept-Item:
      name: Accept-Item
      in: header
      description: >
        An optional header used when creating report package jobs to specify the
        requested package version - reference <a
        href="#application-vnd.sas.report.package">application/vnd.sas.report.package</a>.
        In this release, version 3 and version 4 packages are supported.  If not
        specified, the latest version will be used. (**Since: Version 5**)
      required: false
      schema:
        type: string
    reportIdentifier:
      name: reportIdentifier
      in: query
      description: A freeform string used for auditing and for tracking the request
        through logs. It is passed around in place of the 'reportUri' for standalone
        XML reports. While not required, clients are encouraged to populate it and
        to prefix it with an application-specific identifier of some sort to facilitate
        debugging. This will also show up in the 'location' field on audit reports,
        so if there is an identifier that would be meaningful to the user, that would
        be good to consider. If the package is being generated from the contents of
        a previously saved but now modified report, it is recommended that this be
        populated with the URI of the original report in order to maintain the association.
        The maximum field length is 2000 chars.
      required: false
      schema:
        type: string
    ifModifiedSince:
      name: ifModifiedSince
      in: query
      description: The report package is generated if and only if the report or the
        data sources have changed since the value of ifModifiedSince. The `state`
        member of <a href="#application-vnd.sas.report.package.job">application/vnd.sas.report.package.job</a>
        is set to `notModified` if the package is not generated.
      required: false
      schema:
        type: string
        format: date-time
    themeVersion:
      name: themeVersion
      in: query
      description: >
        Used to override the theme version used by the service. This value is
        associated with the **htmlcommons** version that is currently active on
        the server and will default to that version. (**Since: Version 3**)
      required: false
      schema:
        type: string
    packageIdParm:
      name: packageId
      in: path
      description: The id of the report package. The maximum field length is 150 chars.
      required: true
      schema:
        type: string
    fileNameParm:
      name: fileName
      in: path
      description: The name of the report package file. The maximum field length is
        500 chars.
      required: true
      schema:
        type: string
    executorId:
      name: executorId
      in: query
      description: The id of an existing reportData executor. **(Since Version 4)**
      required: false
      schema:
        type: string
    dataSetFormat:
      name: dataSetFormat
      in: query
      description: The requested dataset format. Acceptable values NONE, B64DS. **(Since
        Version 4)**
      required: false
      schema:
        type: string
        enum:
        - NONE
        - B64DS
        default: NONE
    timeout:
      name: timeout
      in: query
      description: The number of seconds the create package job will wait for data
        job requests to complete. **(Since Version 8)**
      required: false
      schema:
        type: number
        format: integer
    completionNotification:
      name: completionNotification
      in: query
      description: >
        Specifies the type of notification to be sent out on job completion. A
        value of **application** will trigger an application notification of
        type 'reportPackageGenerationComplete' to be posted to the notification
        service for the user who submitted the job. (**Since version 11**)
      required: false
      schema:
        type: string
        enum:
        - application
        - email
        - none
        default: none
    parentFolderUri:
      name: parentFolderUri
      in: query
      required: false
      description: >
        The URI of the folder service location to which to add the new zipped
        report package file.   Setting the parentFolderUri argument will cause
        the resolved-filename.sasreportpkg.zip file to be created or modified.
        These files will be saved to the files service, under the requested
        folder, and will be visible in applications like  SAS Drive, SAS
        Environment Manager, or SAS Studio.  (**Since version 11**)
      schema:
        type: string
    filename:
      name: filename
      in: query
      required: false
      description: >
        The name to use for the zipped report package file. The name of the file
        will be resolved-filename.sasreportpkg.zip.  If this argument is not
        provided it will use the report name as the default filename. These
        files will be saved to the  files service, under the requested folder,
        and will be visible in applications like SAS Drive, SAs Environment
        Manager,  or SAS Studio.  This argument is only applicable when the parentFolderUri
        argument has
        been specified. (**Since version 11**) The maximum field length is 500 chars.
      schema:
        type: string
    nameConflict:
      name: nameConflict
      in: query
      required: false
      description: >
        The "replace" argument will overwrite an existing
        resolved-filename.sasreportpkg.zip file if one exists, and will update
        the modifiedTimeStamp.  The "rename" argument will create a unique name
        by appending a numeric counter "(#)" to the filename (ie.
        resolved-filename(1).sasreportpkg.zip,  resolved-filename(2).sasreportpkg.zip).  If
        the filename already contains a numeric counter (ie.
        resolved-filename(108).sasreportpkg.zip) it will  be used as base
        numeric counter.  This argument is only applicable when the
        parentFolderUri argument has been specified. (**Since version 11**)
      schema:
        type: string
        enum:
        - rename
        - replace
        default: replace
