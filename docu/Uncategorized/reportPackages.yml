        required: true
        schema:
          type: string
      responses:
        "200":
          description: The current state of the package job. One of 'pending', 'running',
            'canceling', 'canceled', 'failed', and 'completed'.
          headers:
            Content-Type:
              description: text/plain
              schema:
                type: string
                format: object-id
          content:
