        properties:
          id:
            type: string
            description: The triage type identifier.
          name:
            type: string
            description: The name (label) of the triage type.
          description:
            type: string
            description: The description of the triage type.
          localizedName:
            type: string
            description: The localized name of the triage type determined using the
              Accept-Language header.
            readOnly: true
          localizedDescription:
            type: string
            description: The localized description of the triage type determined using
              the Accept-Language header.
            readOnly: true
          domainID:
            type: string
            description: The domain identifier of the triage type.
          triageMode:
            type: string
            description: The triage mode of the triage type. Currently not used.
          servicePriority:
            type: integer
            description: The service priority of the triage type. This is used during
              servicing. The lower the number, the higher the priority.
            minimum: 1
            maximum: 32767
          alertAccessGroupID:
            type: string
            description: The Identities group identifier associated with the triage
              type. Only users that are members of this group can view and work alerts
              in the triage type. The group identifier needs to be a SASTriageUsers
              member.
            maximum: 100
          groupID:
            type: string
            description: The Identities group identifier associated with the triage
              type. Only users that are members of this group can view and work alerts
              in the triage type. The group identifier needs to be a SASTriageUsers
              member. (Deprecated — use AlertAccessGroupID instead.)
            deprecated: true
            maximum: 100
          managementGroupID:
            type: string
            description: The management group identifier of the triage type. Not providing
              a management group identifier is equivalent to SASTriageUsers. The group
              identifier needs to be a SASTriageUsers member.
          defaultFlag:
            type: boolean
            description: Flag indicating if this is the default triage type.
          defaultActionGroups:
            type: array
            description: The list of available default action groups for the triage
              type. Action groups are applied in the order they are listed.
            items:
              type: object
              properties:
                id:
                  type: string
                  description: The action group identifier.
                order:
                  type: integer
                  description: The order in which the action group is applied. This
                    field is ignored on input, the order is determined by the order
                    of the action groups in the list when submitted.
