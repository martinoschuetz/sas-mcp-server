          maximum: 36
        alertType:
          type: string
          description: The alertType of the alerting event.
          maximum: 20
        alertTriggerText:
          type: string
          description: The alertTriggerText of the alerting event.
        enrichmentData:
          type: object
          description: The enrichmentData of the alerting event.
        creationTimeStamp:
          type: string
          readOnly: true
          description: The creationTimeStamp of the alerting event.
        links:
          type: array
          description: Paging links that apply to this resource.
          items:
            $ref: '#/components/schemas/link'
        version:
          type: integer
          description: The version number of the schema for this media type. This
