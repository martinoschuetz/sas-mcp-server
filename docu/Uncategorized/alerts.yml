              examples:
                json:
                  $ref: '#/components/examples/domainCollectionUpsertResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/domainCollectionResource'
              examples:
                json:
                  $ref: '#/components/examples/domainCollectionUpsertResponse'
