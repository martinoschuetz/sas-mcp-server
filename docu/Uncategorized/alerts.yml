        actionableEntityLabel:
          type: string
          description: The actionableEntityLabel of the alerting event.
          maximum: 500
        parentEntityID:
          type: string
          description: The parentEntityID of the alerting event.
          maximum: 100
        parentEntityTypeID:
          type: string
          description: The parentEntityTypeID of the alerting event.
          maximum: 36
        contactEntityID:
          type: string
          description: The contactEntityID of the alerting event.
          maximum: 100
        contactEntityTypeID:
          type: string
          description: The contactEntityTypeID of the alerting event.
          maximum: 36
        alertOrigin:
          type: string
          description: The alertOrigin of the alerting event.
          maximum: 20
        alertOriginID:
          type: string
          description: The alertOriginID of the alerting event.
