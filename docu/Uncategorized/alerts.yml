  /actions/groups#multiPost:
    post:
      tags:
      - Administration - Disposition Configuration
      summary: Create or update action groups
      operationId: createActionGroups
      description: |-
        Creates or updates action groups.
        Due to relationships among the objects, this action is transactional. If there is an error during the update/creation of any object, the entire operation will fail and the response will be an error message indicating which item was in violation. For update, precondition checks are done using the optimistic lock version of the object. If the action is successful, a collection of the updated/created objects is returned.
      requestBody:
        description: Specifies an array of action groups to create and/or update.
        content:
          application/vnd.sas.collection.triage.action.group+json:
            schema:
              type: array
              items:
                anyOf:
                - $ref: '#/components/schemas/actionGroupResourceCreate'
                - $ref: '#/components/schemas/actionGroupResourceUpdate'
            examples:
              json:
                $ref: '#/components/examples/actionGroupUpsertRequest'
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/actionGroupCollectionResource'
              examples:
                json:
                  $ref: '#/components/examples/actionGroupCollectionUpsertResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/actionGroupCollectionResource'
              examples:
                json:
                  $ref: '#/components/examples/actionGroupCollectionUpsertResponse'
        '400':
          description: The request was invalid.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
