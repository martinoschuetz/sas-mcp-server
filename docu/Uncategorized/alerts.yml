  /alerts/{alertId}/related:
    post:
      tags:
      - Alert Operations - Alert
      summary: Get alerts related to an alert
      operationId: getRelatedAlerts
      description: |
        Returns a collection of alerts that are related to the specified alert. An alert is considered related if any of the entity ID and type pairs on the specified alert (actionableEntityID/actionableEntityTypeID, parentEntityID/parentEntityTypeID, or contactEntityID/contactEntityTypeID) appear in any entity field pair on another alert.
      parameters:
      - name: alertId
        in: path
        description: Specifies the identifier of the alert.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/collectionStart'
      - $ref: '#/components/parameters/collectionLimit'
      - $ref: '#/components/parameters/collectionSortBy'
      - name: Accept-Item
        in: header
        required: false
        description: The desired alert representation. The Accept-Item options are
          <ul><li>application/vnd.sas.triage.alert</li><li>application/vnd.sas.triage.alert.list</li></ul>.
          If the application/vnd.sas.triage.alert.list media type is specified, the
          content type should be <em>application/json</em>, and the alert objects
          will contain additional advanced list data information.
        schema:
          type: string
          enum:
          - application/vnd.sas.triage.alert
          - application/vnd.sas.triage.alert.list
          default: application/vnd.sas.triage.alert
      requestBody:
        description: The filter criteria for the collection. Filters can be sent as
          plain text or as a structured JSON object (if requesting the alert collection
          with advanced list  data).
        required: false
        content:
          text/plain:
            schema:
              type: string
              format: sort-criteria
            example: eq(createdBy, 'user1')
          application/json:
            schema:
              $ref: '#/components/schemas/alertListRequest'
            example:
              filter: eq(createdBy, 'user1')
              listsData:
              - field: actionableEntityID
                lists:
                - Blocked Cards
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
          content:
            application/vnd.sas.collection+json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/alertCollectionResource'
                - $ref: '#/components/schemas/alertCollectionResourceList'
              examples:
                json:
                  $ref: '#/components/examples/alertCollectionResponse'
                list:
