components:
  schemas:
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    apiResource:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: '#/components/schemas/link'
    collectionResource:
      title: Base Collection
      type: object
      description: A base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2).
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated, indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: '#/components/schemas/link'
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    actionResource:
      title: Action
      description: Specifies an action.
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: Specifies the action identifier.
          name:
            type: string
            description: Specifies the name of the action.
          description:
            type: string
            description: Specifies the description of the action.
          localizedName:
            type: string
            description: Specifies the localized name of the action.
          localizedDescription:
            type: string
            description: Specifies the localized description of the action.
          externalFlag:
            type: boolean
            description: Indicates if this is an external action.
          interactiveFlag:
            type: boolean
            description: Indicates if this is an interactive action.
          links:
            type: array
            description: Specifies the paging links that apply to this resource.
            items:
              $ref: '#/components/schemas/link'
          parametersJSON:
            type: string
            description: Specifies the parameters for this action.
          version:
            type: integer
            description: Specifies the version number of the schema for this media
              type. This representation is version 1.
    actionCollectionResource:
      title: Action Collection
      description: Specifies a collection of actions, with optional links to the first,
        previous, and next page.
      allOf:
      - $ref: '#/components/schemas/collectionResource'
      - type: object
        properties:
          items:
            type: array
            description: Specifies an array of alert objects.
            items:
              $ref: '#/components/schemas/actionResource'
    errorResource:
      title: Error
      type: object
      description: An error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string identifier for the error.
        errorCode:
          type: integer
          description: The numeric identifier for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: An array of any additional errors that may have occurred.
          items:
            $ref: '#/components/schemas/errorResource'
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: '#/components/schemas/link'
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    trackedResource:
      title: Tracked Resource
      type: object
      description: This class is used to provide common attributes and behaviors around
        tracking who created or modified objects and when objects were created or
        modified.
      properties:
        createdBy:
          type: string
          readOnly: true
          description: The username that created the resource.
        modifiedBy:
          type: string
          readOnly: true
          description: The username that last modified the resource.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp for when the resource was created.
        modifiedTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp for when the resource was last modified.
    actionGroupResource:
      title: Action Group
      description: Specifies an action group.
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: Specifies the action group identifier.
          builtInFlag:
            type: boolean
            description: Indicates if this is a built-in action group.
          autoEnactedFlag:
            type: boolean
            description: Indicates if this action group's actions should be carried
              out automatically when applying dispositions that are associated with
              this action group. If set to true, the action group can contain only
              external actions, and it cannot be included in a triage type's default
              action groups.
          name:
            type: string
            description: Specifies the name of the action group.
          description:
            type: string
            description: Specifies the description of the action group.
          members:
            type: array
            items:
              properties:
                id:
                  type: string
                  description: Specifies the action group member identifier.
                  maximum: 36
                  enum:
                  - auto-close-alert
                  - close-alert
                  - external-send-to-kafka
                  - interactive-auto-close-alert
                  - interactive-move-to-queue
                  - interactive-set-reason-code
                  - interactive-suspend-alert
                  - move-to-queue
                  - reactivate-alert
                  - set-productivity-rating
                  - suspend-alert
                name:
                  type: string
                  description: Specifies the action group member name.
                  maximum: 100
                order:
                  type: integer
                  description: Specifies the order in which the action group member
                    is applied.
                  readOnly: true
                argumentsJSON:
                  description: Specifies the arguments for the action group member.
                  type: string
                validationJSON:
                  description: Specifies the validation for the action group member.
                  type: string
                localizationKey:
                  description: Specifies the localized value for the action group
                    member name.
                  type: string
                  maximum: 36
                localizedName:
                  type: string
                  description: Specifies the localized name of the action group member.
                localizedDescription:
                  type: string
                  description: Specifies the localized description of the action group
                    member.
          localizedName:
            type: string
            description: Specifies the localized name of the action group.
          localizedDescription:
            type: string
            description: Specifies the localized description of the action group.
          links:
            type: array
            description: Specifies the paging links that apply to this resource.
            items:
              $ref: '#/components/schemas/link'
          optLockVersion:
            type: integer
            description: Specifies the optimistic lock version of the action group.
          version:
            type: integer
            description: Specifies the version number of the schema for this media
              type. This representation is version 1.
      - $ref: '#/components/schemas/trackedResource'
    actionGroupCollectionResource:
      title: Action Group Collection
      description: Specifies a collection of action groups, with optional links to
        the first, previous, and next page.
      allOf:
      - $ref: '#/components/schemas/collectionResource'
      - type: object
        properties:
          items:
            type: array
            description: Specifies an array of action group objects.
            items:
              $ref: '#/components/schemas/actionGroupResource'
    actionGroupResourceCreate:
      title: Create Action Group
      description: Specifies an action group to create.
      type: object
      allOf:
      - $ref: '#/components/schemas/actionGroupResource'
      - required:
        - name
    actionGroupResourceUpdate:
      title: Update Action Group
      description: Specifies an action group to update.
      type: object
      allOf:
      - $ref: '#/components/schemas/actionGroupResource'
      - required:
        - id
        - name
        - optLockVersion
    alertingEventResource:
