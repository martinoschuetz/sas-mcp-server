    queueResource:
      title: Queue
      description: A queue.
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: The queue identifier.
          name:
            type: string
            description: The name (label) of the queue.
          description:
            type: string
            description: The description of the queue.
            maximum: 500
          localizedName:
            type: string
            description: The localized name of the queue determined using the Accept-Language
              header.
          localizedDescription:
            type: string
            description: The localized description of the queue determined using the
              Accept-Language header.
          domainID:
            type: string
            description: The domain identifier of the queue.
            maximum: 36
          alertWorkGroupID:
            type: string
            description: The Identities group identifier associated with the queue.
              Only users that are members of this group can work alerts in the queue.
              The group identifier needs to be a SASTriageUsers member.
            maximum: 100
          groupID:
            type: string
            description: The Identities group identifier associated with the queue.
              Only users that are members of this group can work alerts in the queue.
              The group identifier needs to be a SASTriageUsers member.  (Deprecated
              — use AlertWorkGroupID instead.)
            deprecated: true
            maximum: 100
          triageTypeID:
            type: string
            description: The triage type identifier of the queue.
            maximum: 36
          scheduledDispositionID:
            type: string
            description: The disposition identifier to be applied to all alerts in
              this queue at the designated "scheduledDispositionTime". This disposition
              must have bulkApplyFlag = true.
          scheduledDispositionTime:
            type: string
            description: The time, specified in 24-hour and minutes format, "hh:mm",
              that the scheduled disposition will be applied to all alerts in this
              queue. The time is in the local time zone of the server.
          servicePriority:
            type: integer
            description: Specifies the service priority of the queue. When this queue
              is moved to another triage type, it is assigned the lowest service priority
              relative to the non-default queues in that triage type.
            minimum: 1
            maximum: 32767
          serviceSortFieldOrder:
            type: string
            description: The alerting field that is used to sort the alerts in the
              queue.
            maximum: 500
          serviceEnabled:
            type: boolean
            description: Determines whether alerts in the queue are surfaced to the
              users that are using servicing.
          alertMaxDurationInQueue:
            type: integer
            description: Specifies, in hours, the maximum amount of time that an alert
              remains active in the queue before being closed. If not set, alerts
              in this queue are not closed automatically via this setting. Note that
              values that are <= 0 will be treated as if not set.
            default:
          routingEnabled:
            type: boolean
            description: Determines whether alerts can be routed to the queue.
          routingPriority:
            type: integer
            description: The routing priority of the queue, used during alert routing.
              Lower numbers are higher priority.
            minimum: 1
            maximum: 32767
          routingRule:
            type: string
            description: The condition that needs to be met in order for the alert
              to be routed to the queue.
          stickyFlag:
            type: boolean
            description: If set to true, alerts cannot be routed out of that queue
              by the system.
          reactivationEnabled:
            type: boolean
            description: Determines whether suppressed alerts in this queue can be
              reactivated.
          reactivationRule:
            type: string
            description: The condition that needs to be met in order for a suppressed
              alert in this queue to be reactivated.
          autoDispositionID:
            type: string
            description: The identifier of an existing disposition that is automatically
              enacted on any alerts that enter the queue. This disposition must have
              bulkApplyFlag = true.
            maximum: 36
          dispositions:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
            description: An array of dispositions associated with the queue.
          queueRetentionPeriodAfterClosure:
            type: integer
            description: The amount of days before the alert should be purged from
              the system. Not setting this value means the alert will never be purged.
            minimum: 1
            maximum: 32767
            default:
          defaultFlag:
            type: boolean
            description: Flag indicating if this is the default queue.
          optLockVersion:
            type: integer
            description: The optimistic lock version of the queue.
          links:
            type: array
            description: Paging links that apply to this resource.
            items:
              $ref: '#/components/schemas/link'
          version:
            type: integer
            description: The version number of the schema for this media type. This
              representation is version 1.
      - $ref: '#/components/schemas/trackedResource'
    queueCollectionResource:
