            application/json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                json:
                  $ref: '#/components/examples/actionGroupForbiddenResponse'
        '404':
          description: No action group exists at the requested path.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                json:
