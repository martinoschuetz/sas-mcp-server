  /localizations#import:
    post:
      tags:
      - Administration - Localization
      summary: Create or update localizations with a ZIP file
      operationId: createUpdateLocalizationsViaZip
      description: Creates or updates objects by importing a ZIP file. Due to relationships
        among the objects, this action is transactional. If there is an error during
        the update/creation of any object, the entire operation will fail and the
        response will be an error message indicating which item was in violation.
        <br/><br/> The request body is a ZIP file containing localization properties
        files describing the localizations to create and/or update. The properties
        file names follow a convention that specifies the locale to which the file
        applies. For example,<br/> <pre> Length     Date       Time    Name<br/> ---------  ----------
        -----   ----<br/> 937        09-12-2024 15:09   localizations_en.properties<br/>
        987        09-12-2024 15:43   localizations_es.properties<br/> ---------                     -------<br/>
        1924                          2 files<br/> </pre><br/> Properties files themselves
        are made up of <tt>key=value</tt> pairs, one per line. The key format is illustrated
        below, with <tt>'+'</tt> as the separator between key tokens. The value is
        the string value to show for the given locale.<br/><br/> <tt>triage+disposition+AD_BUILT_IN_CLOSE+name=Nombre
        de cierre automático</tt><br/> <br/>The tokens are:<br/> <ul> <li>The literal
        <tt>'triage'</tt></li> <li>The object-type (e.g., disposition)</li> <li>The
        object ID (e.g., AD_BUILT_IN_CLOSE)</li> <li>Either <tt>'name'</tt> or <tt>'description'</tt>
        or <tt>'header'</tt></li> </ul>
      requestBody:
        description: Specifies a ZIP file containing properties files, one per locale.
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/localizationZipImportResponse'
              examples:
                json:
                  $ref: '#/components/examples/localizationZipImportResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/localizationZipImportResponse'
              examples:
                json:
                  $ref: '#/components/examples/localizationZipImportResponse'
        '400':
          description: The request was invalid.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                json:
                  $ref: '#/components/examples/localizationUpsert400Response'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                json:
                  $ref: '#/components/examples/localizationUpsert400Response'
        '403':
          description: The user did not have the necessary permissions.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                json-forbidden:
                  $ref: '#/components/examples/localizationCollectionForbiddenResponse'
                json-insufficient-capabilities:
                  $ref: '#/components/examples/insufficientCapabilitiesResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                json-forbidden:
                  $ref: '#/components/examples/localizationCollectionForbiddenResponse'
                json-insufficient-capabilities:
                  $ref: '#/components/examples/insufficientCapabilitiesResponse'
