    alertingEventsCollectionResource:
      title: Alerting Event Collection
      description: One page of alerting events, with optional links to first, prev,
        and the next page.
      allOf:
      - $ref: '#/components/schemas/collectionResource'
      - type: object
        properties:
          items:
            type: array
            description: An array of alerting event objects.
            items:
              $ref: '#/components/schemas/alertingEventResource'
    alertListRequest:
      title: Advanced List Data for Alerts
      description: A request for advanced list data for alerts.
      allOf:
      - type: object
        properties:
          listsData:
            type: array
            description: The advanced lists data request.
            items:
              type: object
              required:
              - field
              - lists
              properties:
                field:
                  type: string
                  description: An alert field to get advanced list data for.
                lists:
                  type: array
                  description: The lists to get advanced list data for.
                  items:
                    type: string
    alertResource:
      title: Alert
      description: An alert.
      allOf:
      - type: object
        required:
        - id
        properties:
          id:
            type: string
            description: The alert identifier.
          actionableEntityID:
            type: string
            description: The identifier of the actionable entity.
          actionableEntityTypeID:
            type: string
            description: The type of the actionable entity.
          actionableEntityLabel:
            type: string
            description: The label of the actionable entity.
          parentEntityID:
            type: string
            description: The identifier of the parent entity.
          parentEntityTypeID:
            type: string
            description: The type of the parent entity.
          contactEntityID:
            type: string
            description: The identifier of the contact entity.
          contactEntityTypeID:
            type: string
            description: The type of the contact entity.
          score:
            type: integer
            description: The score of the alert.
          alertOrigin:
            type: string
            description: The origin of the alert.
          alertOriginID:
            type: string
            description: The identifier of the alert in the origin system.
          status:
            type: string
            description: The status of the alert.
          productivityRating:
            type: string
            description: The productivity rating of the alert.
          checkoutUserID:
            type: string
            description: The user who currently has the lock on the alert.
          checkoutTimeStamp:
            type: string
            format: date-time
            description: The timestamp for when the alert was locked to the user.
          checkoutServiceType:
            type: string
            description: The type of lock the user has on the alert.
          dispositionTimeStamp:
            type: string
            format: date-time
            description: The timestamp for when the alert was last dispositioned.
          autoActivateTimeStamp:
            type: string
            format: date-time
            description: The timestamp for when the alert will be changed from a SUPPRESSED
              state to an ACTIVE state.
          autoCloseTimeStamp:
            type: string
            format: date-time
            description: The timestamp for when the alert will be changed to a CLOSED
              state.
          autoCloseInQueueTimeStamp:
            type: string
            format: date-time
            description: The timestamp for when the alert will be changed to a CLOSED
              state based on the amount of time it has been in the queue.
          optLockVersion:
            type: integer
            description: The optimistic lock version of the alert.
          domainID:
            type: string
            description: The identifier of the domain where the alert exists.
          queueID:
            type: string
            description: The identifier of the queue the alert is currently in.
          alertType:
            type: string
            description: The code for the type of the alert.
          alertTriggerText:
            type: string
            description: Text that provides context to the cause of this alert.
          enrichmentData:
            type: object
            additionalProperties: true
            description: Additional data providing enrichment for the alert.
          label:
            type: string
            description: The label of the alert generated using the alert type's label
              expression.
          autoPurgeAfterClosureTimeStamp:
            type: string
            format: date-time
            description: The timestamp for when the alert will be purged from the
              system.
          links:
            type: array
            description: Paging links that apply to this resource.
            items:
              $ref: '#/components/schemas/link'
          version:
            type: integer
            description: This media type's schema version number. This representation
              is version 1.
      - $ref: '#/components/schemas/trackedResource'
    alertCollectionResource:
      title: Alert Collection
      description: One page of alerts, with optional links to first, prev, and the
        next page.
      allOf:
      - $ref: '#/components/schemas/collectionResource'
      - type: object
        properties:
          items:
            type: array
            description: An array of alert objects.
            items:
              $ref: '#/components/schemas/alertResource'
    listMemberships:
      title: List Membership
      description: An object specifying the list membership of an object.
      allOf:
      - type: object
        properties:
          field:
            type: string
            description: The field name.
          memberships:
            type: array
            description: An array of the lists that the object is a member of for
              the specified field.
            items:
              type: string
    listsData:
      title: Lists Data
      description: An object specifying the lists information in response to a request
        for list data.
      allOf:
      - type: object
        properties:
          name:
            type: string
            description: The list name.
          label:
            type: string
            description: The list label as stored in the list-data service.
          localizedLabel:
            type: string
            description: The list label localized to the request's locale.
          error:
            type: object
            description: An object containing details about any error that was encountered
              when attempting to retrieve the list data for the list. This field will
              be null if no errors were encountered when attempting to retrieve the
              list data for the list.
            properties:
              version:
                type: integer
                description: The version of the error response.
              id:
                type: string
                description: The ID of the error response.
              httpStatusCode:
                type: integer
                description: The HTTP status code of the error response.
              errorCode:
                type: integer
                description: The error code of the error response.
              message:
                type: string
                description: The error message of the error response.
    alertResourceList:
      title: Alert with List Data
      description: An alert annotated with advanced list data.
      allOf:
      - $ref: '#/components/schemas/alertResource'
      - type: object
        properties:
          listMemberships:
            type: array
            items:
              $ref: '#/components/schemas/listMemberships'
          listsData:
            type: array
            items:
              $ref: '#/components/schemas/listsData'
    alertCollectionResourceList:
      title: Alert Collection
      description: One page of alerts with advanced list data, with optional links
        to first, prev, and the next page.
      allOf:
      - $ref: '#/components/schemas/collectionResource'
      - type: object
        properties:
          items:
            type: array
            description: An array of alert objects with advanced list data.
            items:
              $ref: '#/components/schemas/alertResourceList'
    alertActionRequest:
      title: Alert Action Request
      description: Specifies the alert action request.
      type: object
      properties:
        alertIds:
          type: array
          description: Specifies an array of alert identifiers.
          items:
            type: string
    alertActionCollectionResponse:
      title: Alert Action Response
      description: Specifies the alert action response.
      type: object
      properties:
        count:
          type: integer
          description: Indicates the number of items in the collection.
          format: int64
        links:
          type: array
          description: Specifies the links that apply to the collection.
          items:
            $ref: '#/components/schemas/link'
        version:
          type: integer
          description: Specifies the version number of the collection representation.
            This representation is version 1.
        items:
          type: array
          description: Specifies an array of alert action responses.
          items:
            type: object
            properties:
              alert:
                $ref: '#/components/schemas/alertResource'
              alertId:
                type: string
                description: Specifies the alert identifier of the alert which the
                  action was performed against.
              error:
                $ref: '#/components/schemas/errorResource'
              alertChanged:
                type: boolean
                description: Indicates if the alert has changed from a successful
                  action request.
    alertListActionRequest:
      title: Alert Advanced List Action Request
      description: Specifies the advanced list alert action request.
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: The alert ID to perform the action on.
          actions:
            type: array
            items:
              type: object
              properties:
                action:
                  type: string
                  description: Specifies the list action to take.
                  enum:
                  - add
                  - remove
                field:
                  type: string
                  description: Specifies the alert field whose value will be added
                    or removed.
                listName:
                  type: string
                  description: Specifies the name of the list to add or remove the
                    value from.
    alertListActionResponse:
      title: Alert Advanced List Action Response
      description: Specifies the alert advanced list action response.
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: The ID of the alert which the list action was performed against.
          message:
            type: string
            description: A message indicating the result of performing the list action.
          hasErrors:
            type: boolean
            description: Indicates whether any errors were encountered when performing
              the list action.
          results:
            type: array
            description: An array of the results of performing the list action.
            items:
              type: object
              properties:
                listName:
                  type: string
                  description: Specifies the name of the list that the value was added
                    or removed from.
                state:
                  type: string
                  description: Specifies the advanced list's state.
                  enum:
                  - deployed
                  - developing
                addError:
                  type: object
                  description: An object containing details about any error that was
                    encountered when attempting to add a value to the list. This field
                    will be null if no errors were encountered when attempting to
                    add a value to the list.
                  properties:
                    version:
                      type: integer
                      description: The version of the error response.
                    httpStatusCode:
                      type: integer
                      description: The HTTP status code of the error response.
                    errorCode:
                      type: integer
                      description: The error code of the error response.
                    message:
                      type: string
                      description: The error message of the error response.
                removeError:
                  type: object
                  description: An object containing details about any error that was
                    encountered when attempting to remove a value from the list. This
                    field will be null if no errors were encountered when attempting
                    to remove a value from the list.
                  properties:
                    version:
                      type: integer
                      description: The version of the error response.
                    httpStatusCode:
                      type: integer
                      description: The HTTP status code of the error response.
                    errorCode:
                      type: integer
                      description: The error code of the error response.
                    message:
                      type: string
                      description: The error message of the error response.
    alertHistoryResource:
      title: Alert History
      description: An alert history record.
      allOf:
      - type: object
        required:
        - alertHistoryID
        properties:
          alertHistoryID:
            type: string
            description: The identifier for the alert history record.
          actionTimeStamp:
            type: string
            format: date-time
            description: The timestamp for when the alert history record was written.
          actionType:
            type: string
            description: The action type that created the alert history record.
          alert:
            description: The representation of the alert as a result of the change
              that created the history record.
            allOf:
            - $ref: '#/components/schemas/alertResource'
          serviceType:
            type: string
            description: The service type associated with the history record.
          links:
            type: array
            description: Paging links that apply to this resource.
            items:
              $ref: '#/components/schemas/link'
          version:
            type: integer
            description: The schema version number for this media type.
    alertHistoryCollectionResource:
      title: Alert History Collection
      description: One page of alert history records, with optional links to first,
        prev, and the next page.
      allOf:
      - $ref: '#/components/schemas/collectionResource'
      - type: object
        properties:
          items:
            type: array
            description: An array of alert history records.
            items:
              $ref: '#/components/schemas/alertHistoryResource'
    alertHistorySummaryResource:
      title: Alert History Summary
      description: An alert history summary.
      allOf:
      - type: object
        properties:
          alert:
            description: The representation of the alert as a result of the change
              that created the history record.
            allOf:
            - $ref: '#/components/schemas/alertHistoryResource'
          links:
            type: array
            description: Paging links that apply to this resource.
            items:
              $ref: '#/components/schemas/link'
          version:
            type: integer
            description: The schema version number for this media type.
    alertHistorySummaryCollectionResource:
      title: Alert History Summary Collection
      description: Alert history summaries.
      allOf:
      - $ref: '#/components/schemas/collectionResource'
      - type: object
        properties:
          items:
            type: array
            description: An array of alert history records.
            items:
              $ref: '#/components/schemas/alertHistorySummaryResource'
    alertTypeResource:
      title: Alert Type
      description: An alert type.
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: The alert type identifier.
          name:
            type: string
            description: The name of the alert type.
            maximum: 100
          description:
            type: string
            description: The description of the alert type.
            maximum: 500
          localizedName:
            type: string
            description: The localized name of the alert type.
          localizedDescription:
            type: string
            description: The localized description of the alert type.
          code:
            type: string
            description: The code associated with the alert type. Each alert type
              must have a unique code.
            maximum: 15
          domainID:
            type: string
            description: The domain identifier of the alert type.
            maximum: 36
          actionableEntityTypeID:
            type: string
            description: The identifier of the entity type that this alert type is
              alerting on.
            maximum: 36
          actionableEntityVariablePathName:
            type: string
            description: The message schema variable where the identifier of the actionable
              entity is found on the alerted transaction.
          parentEntityVariablePathName:
            type: string
            description: The message schema variable where the identifier of the parent
              entity is found on the alerted transaction.
          parentEntityTypeID:
            type: string
            description: The identifier of the entity that acts as the parent entity
              for the entity that this alert type is alerting on.
          contactEntityVariablePathName:
            type: string
            description: The message schema variable where the identifier of the contact
              entity is found on the alerted transaction.
          contactEntityTypeID:
            type: string
            description: The identifier of the entity type that acts as the contact
              entity for the entity that this alert type is alerting on.
          alertLabelExpression:
            type: string
            description: The expression used to generate the alert label.
            maximum: 1000
          optLockVersion:
            type: integer
            description: The optimistic lock version of the alert type.
          links:
            type: array
            description: Paging links that apply to this resource.
            items:
              $ref: '#/components/schemas/link'
          version:
            type: integer
            description: The version number of the schema for this media type. This
              representation is version 1.
      - $ref: '#/components/schemas/trackedResource'
    alertTypeCollectionResource:
      title: Alert Type Collection
      description: One page of alert types, with optional links to first, prev, and
        the next page.
      allOf:
      - $ref: '#/components/schemas/collectionResource'
      - type: object
        properties:
          items:
            type: array
            description: An array of alert type objects.
            items:
              $ref: '#/components/schemas/alertTypeResource'
    alertTypeResourceCreate:
      title: Create Alert Type
      description: Creates an alert type.
      type: object
      allOf:
      - $ref: '#/components/schemas/alertTypeResource'
      - required:
        - name
        - code
        - domainID
        - actionableEntityTypeID
    alertTypeResourceUpdate:
      title: Update Alert Type
      description: Updates an alert type.
      type: object
      allOf:
      - $ref: '#/components/schemas/alertTypeResource'
      - required:
        - id
        - name
        - code
        - domainID
        - actionableEntityTypeID
        - optLockVersion
    commentResource:
      title: Comment
      description: A comment.
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: The comment identifier.
          priority:
            type: string
            description: The priority of the comment.
            enum:
            - high
            - medium
            - low
            default: low
          parentId:
            type: string
            description: The identifier of the parent comment.
            maximum: 36
          resourceUri:
            type: string
            description: The resource URI for the alert to which the comment applies.
            maximum: 250
          elementId:
            type: string
            description: The elementId of the comment is the disposition identifier
              when the comment refers to an alert disposition.
            maximum: 250
          subject:
            type: string
            description: The subject of the comment.
            maximum: 100
          text:
            type: string
            description: The text of the comment.
            maximum: 1000
          childCount:
            type: integer
            description: The number of children belonging to the comment (set for
              queries only).
          optLockVersion:
            type: integer
            description: The optimistic lock version of the comment.
          links:
            type: array
            description: Paging links that apply to this resource.
            items:
              $ref: '#/components/schemas/link'
          version:
            type: integer
            description: The version number of the schema for this media type. This
              representation is version 1.
      - $ref: '#/components/schemas/trackedResource'
    commentCollectionResource:
      title: Comment Collection
      description: One page of comments, with optional links to first, prev, and the
        next page.
      allOf:
      - $ref: '#/components/schemas/collectionResource'
      - type: object
        properties:
          items:
            type: array
            description: An array of comment objects.
            items:
              $ref: '#/components/schemas/commentResource'
    commentResourceCreate:
      title: Create Comment
      description: Creates a comment.
      type: object
      allOf:
      - $ref: '#/components/schemas/commentResource'
      - required:
        - resourceUri
    definitionData:
      title: Definition Data
      type: object
      description: The definition data of a grid, page, or component definition.
      properties:
        childComponents:
          type: array
          description: A childComponent can contain another childComponent.
          items:
            allOf:
            - $ref: '#/components/schemas/definitionData'
            - type: object
              properties:
                defaultSize:
                  type: string
                coordinates:
                  type: array
                  items:
                    type: integer
                  maxItems: 2
                  minItems: 2
        configID:
          type: string
          description: Specifies the identifier of another component.
        datasources:
          type: array
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: string
                description: Specifies a unique identifier for a given datasource.
              externalUri:
                type: string
                description: Indicates that the alerts external data proxy should
                  be used for fetching data. The externalUri is passed to the proxy
                  which leverages BOSS to retrieve external data.
              path:
                type: string
                description: Indicates that data should come from the alert data or
                  enrichmentData for the alert being presented on the current page.
        type:
          type: string
          enum:
          - EqualColumns
          - Pane
          - RelatedAlerts
          - Splitter
          - Table
          - TabBar
          - Tab
          - Transactions
          description: |
            Available types:
             * `EqualColumns` - viewer that displays key-value pairings
             * `Pane` - a container component that can nest other components
             * `RelatedAlerts` - a special type of table component that pulls data from alerts related to the current alert
             * `Splitter` - a container component that can nest other components in 2 sections split by a horizontal (up to 2x3) or vertical (up to 3x2) split-bar
             * `Table` - a generic table component good for visualizing data from multiple objects
             * `TabBar` - a container component that can nest other components across multiple tabs via a Tab container
             * `Tab` - a container that renders tab content and must be used as a child of the TabBar component
             * `Transactions` - a special type of table component that pulls data from transactions
    componentDefinitionResource:
      title: Component Definition
      description: A component definition.
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: The component definition identifier.
          definitionData:
            allOf:
            - $ref: '#/components/schemas/definitionData'
            - description: The definition data of the component definition.
          optLockVersion:
            type: integer
            description: The optimistic lock version of the component definition.
          links:
            type: array
            description: Paging links that apply to this resource.
            items:
              $ref: '#/components/schemas/link'
          version:
            type: integer
            description: The version number of the schema for this media type. This
              representation is version 1.
      - $ref: '#/components/schemas/trackedResource'
    componentDefinitionCollectionResource:
      title: Component Definition Collection
      description: One page of component definitions, with optional links to first,
        prev, and the next page.
      allOf:
      - $ref: '#/components/schemas/collectionResource'
      - type: object
        properties:
          items:
            type: array
            description: An array of component definition objects.
            items:
              $ref: '#/components/schemas/componentDefinitionResource'
    componentDefinitionResourceCreate:
      title: Create Component Definition
      description: Creates a component definition.
      type: object
      allOf:
      - $ref: '#/components/schemas/componentDefinitionResource'
      - required:
        - definitionData
    componentDefinitionResourceUpdate:
      title: Update Component Definition
      description: Updates a component definition.
      type: object
      allOf:
      - $ref: '#/components/schemas/componentDefinitionResource'
      - required:
        - id
        - definitionData
        - optLockVersion
    configImportResource:
      title: Configuration Import
      description: A configuration import response.
      allOf:
      - type: object
        properties:
          configurationComplete:
            type: boolean
            description: Specifies whether the configuration completed.
          configurationResults:
            type: array
            description: A list of results for each configuration file imported.
            items:
              type: object
              properties:
                startTimestamp:
                  type: string
                  description: The start timestamp of the configuration file.
                completionTimestamp:
                  type: string
                  description: The completion timestamp of the configuration file.
                path:
                  type: string
                  description: The path of the configuration file.
                status:
                  type: string
                  description: The status of the configuration file.
                  enum:
                  - success
                  - failure
                  - skipped
                numResourcesCreatedOrUpdated:
                  type: integer
                  description: The number of resources created or updated in the configuration
                    file.
                error:
                  allOf:
                  - $ref: '#/components/schemas/errorResource'
                  - description: The error detail if saving the configuration file
                      failed.
          httpStatusCode:
            type: integer
            description: The http status code.
          totalNumResourcesCreatedOrUpdated:
            type: integer
            description: Total number of resources created or updated.
          version:
            type: integer
            description: The version number of the schema for this media type. This
              representation is version 1.
    actionGroupsResource:
      title: Default Actions Groups
      description: Default action groups to apply to an alert.
      allOf:
      - type: object
        properties:
          actionGroupID:
            type: string
            description: The action group identifier of the default actions.
          actionIDs:
            type: array
            description: The action group actions.
            items:
              type: object
              properties:
                actionID:
                  type: string
                  description: The action identifier.
                order:
                  type: integer
                  description: The order in which the action is taken within the action
                    group.
    applyRequest:
      title: Apply Default Actions
      description: Applies default actions to a single checked out alert.
      type: object
      required:
      - optLockVersion
      properties:
        optLockVersion:
          type: integer
          description: The optimistic lock version of the alert.
        actionGroups:
          type: array
          description: Action groups for the default actions. The action groups listed
            must be associated with the triage type of the alert.
          items:
            $ref: '#/components/schemas/actionGroupsResource'
        comments:
          type: array
          description: Optional comments for the default actions.
          items:
            $ref: '#/components/schemas/commentResource'
    actionGroupResults:
      title: Action Group Results
      type: array
      description: The results of the primary action group.
      items:
        type: object
        properties:
          actionGroupID:
            type: string
            description: The primary action group identifier.
          actionResults:
            type: array
            description: An array of results of each action in the primary action
              group.
            items:
              type: object
              description: The result of an action in the primary action group.
              properties:
                id:
                  type: string
                  description: The action identifier.
                name:
                  type: string
                  description: The action name.
                localizedName:
                  type: string
                  description: The localized action name.
                result:
                  type: string
                  description: The result of the action.
                error:
                  type: string
                  description: Contains the error message shown if the action fails.
    applyResponse:
      title: Apply Default Actions Result
      description: The result of applying default actions to an alert.
      allOf:
      - type: object
        properties:
          triageTypeID:
            type: string
            description: The identifier of the triage type for the alert.
          alertID:
            type: string
            description: The identifier of the alert that the actions were applied
              to.
          result:
            type: string
            description: The result of applying the actions, either "SUCCESS" or "FAIL".
          historyID:
            type: string
            description: The identifier of the default actions history record.
          correlationID:
            type: string
            description: A system generated identifier corresponding to the application
              of the actions.
          version:
            type: string
            description: The version of the representation for the result.
          commentResult:
            type: object
            description: The result of saving the default actions comment(s).
            properties:
              result:
                type: string
                description: The result of saving the comment, either "SUCCESS" or
                  "FAIL".
              error:
                allOf:
                - $ref: '#/components/schemas/errorResource'
                - description: The error detail if saving the default actions comment(s)
                    failed.
          actionGroupResults:
            allOf:
            - $ref: '#/components/schemas/actionGroupResults'
            - description: The results of the action groups for the default actions.
          error:
            allOf:
            - $ref: '#/components/schemas/errorResource'
            - description: The error detail if the default actions failed.
    daHistoryResource:
      title: Default Actions History
      description: A default actions history record.
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: The default actions history record identifier.
          order:
            type: integer
