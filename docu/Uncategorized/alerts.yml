            application/json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                json:
                  $ref: '#/components/examples/actionGroupNotFoundResponse'
    head:
      tags:
      - Administration - Disposition Configuration
      summary: Retrieve the headers and check the availability of an action group
      operationId: headersForActionGroup
      description: Retrieves the headers and checks the availability of an action
        group.
      parameters:
