  /pageDefinitions#multiPost:
    post:
      tags:
      - Administration - Page Definition
      summary: Create/Update page definitions
      operationId: createUpdatePageDefinitions
      description: |
        Creates or updates page definitions. This endpoint supports both version 1 and version 2 representations.

        **Version Behavior:**
        - **Version 1** (version=1 or omitted): Creates the page definition AND a page definition mapping if entityTypeID is provided.
        - **Version 2** (version=2): Creates only the page definition. Use page definition mappings separately to associate with entity types and triage types.

        Mixed versions in the same request are supported. The version is determined by the "version" field in each item's JSON body.

        Due to relationships among the objects, this action is transactional. If there is an error during the update/creation 
        of any object, the entire operation will fail and the response will be an error message indicating which item was in 
        violation. For update, precondition checks are done using the optimistic lock version of the object. If the action is 
        successful, a collection of the updated/created objects is returned.
      requestBody:
        description: Specifies an array of page definition objects to create and/or
          update.
        content:
          application/vnd.sas.collection.triage.page.definition+json:
            schema:
              type: array
              items:
                anyOf:
                - $ref: '#/components/schemas/pageDefinitionResourceCreate'
                - $ref: '#/components/schemas/pageDefinitionResourceUpdate'
            examples:
              json:
                $ref: '#/components/examples/pageDefinitionUpsertRequest'
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/pageDefinitionCollectionResource'
