        in: path
        description: Specifies the identifier of the action group.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
        '403':
          description: The user did not have the necessary permissions.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
        '404':
          description: No action group exists at the requested path.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
    delete:
      tags:
      - Administration - Disposition Configuration
      summary: Delete an action group
      operationId: deleteForActionGroup
      description: Deletes an action group.
      parameters:
      - name: actionGroupId
        in: path
        description: Specifies the identifier of the action group.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The action group was deleted.
        '403':
          description: The user did not have the necessary permissions.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                json-insufficient-capabilities:
                  $ref: '#/components/examples/actionGroupInsufficientCapabilitiesAdministrator'
                json-forbidden:
                  $ref: '#/components/examples/actionGroupForbiddenResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                json-insufficient-capabilities:
                  $ref: '#/components/examples/actionGroupInsufficientCapabilitiesAdministrator'
                json-forbidden:
                  $ref: '#/components/examples/actionGroupForbiddenResponse'
        '404':
          description: No action group exists at the requested path.
          headers:
            Content-Type:
              $ref: '#/components/headers/ContentTypeResponseHeader'
