          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                json:
                  $ref: '#/components/examples/relatedAlerts400Response'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                json:
                  $ref: '#/components/examples/relatedAlerts400Response'
        '403':
