---
openapi: 3.0.3
info:
  version: "1"
  title: Gen AI Gateway
  description: The Gen AI gateway.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: https://example.com/genAiGateway
  description: This is an example base URL.
tags:
- name: Root
  description: The API root.
- name: Proxy
  description: Send a direct LLM request to the Gen AI platform.
- name: Copilots
  description: Copilots related operations.
- name: Chats
  description: Chat related operations.
- name: Messages
  description: Message related operations.
- name: AccessInfo
  description: Access information for the GenAI platform.
- name: Copilot Requests
  description: Copilot request related operations.
- name: Status
  description: Service related operations.
- name: Model Context Protocol
  description: MCP related operations.
- name: Agents
  description: Agent related operations.
paths:
  /v1:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: getRoot
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getRootResponse"
        "404":
          description: Service is not available
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
    head:
      summary: Check the state of the service
      tags:
      - Root
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded. The service is available.
      description: Determine if the service is available.
  /v1/proxy:
    post:
      summary: Send a direct LLM request to the Gen AI platform
      description: |
        Send a direct LLM request to the Gen AI platform.
        Direct LLM proxy is intended for use in agentic frameworks or scenarios where GEM is not required.
        For example, this can be used to send a request to the model completions endpoint (/openai/deployments/gpt-4.1/chat/completions?api-version=2024-12-01-preview).
        The request body should contain the messages to send to the model and the expected response format.
        The response from the model is returned in the body of the response.
        For more information about the request body and response format, see the documentation of a specific model.
      operationId: proxy
      tags:
      - Proxy
      parameters:
      - name: sas-application-name
        in: header
        required: true
        schema:
          type: string
        description: The name of the application that is using the Gen AI Gateway
          Direct LLM Proxy.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The request body to send to the Gen AI platform.
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        description: The role of the message sender (e.g., "user",
                          "developer", "system").
                      content:
                        type: string
                        description: The content of the message.
                response_format:
                  type: object
                  description: The expected response format (e.g., "json_object",
                    "text").
                  properties:
                    type:
                      type: string
                      description: The type of the response format (e.g., "json_object",
                        "text").
      responses:
        "200":
          description: The request was successful. The response from the Gen AI platform
            is returned in the body.
          content:
            application/json:
              schema:
                type: object
                description: The response returned by model.
  /v1/status:
    get:
      summary: Provides the current status of the GenAI Gateway service
      description: Provides the current status of the GenAI Gateway service. If disabled,
        includes the reason for its status.
      tags:
      - Status
      operationId: getStatus
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/status"
              examples:
                enabled:
                  $ref: "#/components/examples/statusEnabled"
                disabled:
                  $ref: "#/components/examples/statusDisabled"
    post:
      summary: Enable the GenAI Gateway service
      description: |
        Enables the GenAI Gateway service by creating credentials. Note: This operation may take a while since there is an Azure AD propagation delay. When using a new client secret, it can take several seconds (sometimes up to a minute) for the new secret to become active across all Microsoft Identity endpoints. If the service is already enabled, a 409 Conflict is returned.
      tags:
      - Status
      operationId: createCredentials
      requestBody:
        description: The enable request payload.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                territory:
                  type: string
                  description: The territory for which to enable the service.
                platformUrl:
                  type: string
                  description: The URL of the Gen AI platform.
              required:
              - territory
              - platformUrl
            examples:
              default:
                value:
                  territory: "US"
                  platformUrl: "https://genai.sas.com"
      responses:
        "201":
          description: The service was enabled and credentials were created.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/status"
              examples:
                default:
                  $ref: "#/components/examples/statusEnabled"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
        "409":
          description: The service is already enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
    put:
      summary: Renew the GenAI Gateway service credentials
      description: |
        Renews the credentials for the GenAI Gateway service. Requires administrator privileges. If the service is not enabled, a 409 Conflict is returned.
      tags:
      - Status
      operationId: updateCredentials
      responses:
        "200":
          description: The credentials were renewed and the service status is returned.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/status"
              examples:
                default:
                  $ref: "#/components/examples/statusEnabled"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
        "409":
          description: The service is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
    delete:
      summary: Disable the GenAI Gateway service
      description: |
        Disables the GenAI Gateway service by deleting credentials. If the service is already disabled, a 409 Conflict is returned.
      tags:
      - Status
      operationId: deleteCredentials
      responses:
        "204":
          description: The service was disabled and credentials were deleted.
  /v1/accessInfo:
    get:
      summary: Retrieve Access Information for the GenAI Platform
      description: Retrieves access information including access-token and site number
        details for the Gen AI Platform. Access restricted to users in the `VSCodeGenAI`
        group.
      operationId: getAccessInfo
      tags:
      - AccessInfo
      responses:
        "200":
          description: Successfully retrieved access information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/accessInfo"
              examples:
                default:
                  $ref: "#/components/examples/accessInfo"
  /v1/copilots:
    parameters:
    - name: hasChats
      schema:
        type: boolean
        default: true
      in: query
      required: false
      description: Whether to fetch only copilots in use, with existing chats.
    get:
      summary: Copilots that are available or may be in use
      tags:
      - Copilots
      operationId: getCopilots
      responses:
        "200":
          description: A collection of copilots
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/copilots"
              examples:
                default:
                  $ref: "#/components/examples/copilotsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/copilots"
              examples:
                default:
                  $ref: "#/components/examples/copilotsResponse"
      description: Get copilots that are available or may be in use.
  /v1/copilots/{copilotId}/{copilotVersion}:
    parameters:
    - name: copilotId
      schema:
        type: string
      in: path
      required: true
      description: The copilot id
    - name: copilotVersion
      schema:
        type: string
      in: path
      required: true
      description: The copilot version number
    head:
      summary: Check the state of a copilot
      tags:
      - Copilots
      operationId: headersForCopilot
      responses:
        "200":
          description: The request succeeded. The copilot is available.
        "404":
          description: The copilot does not exist.
      description: Determine if the copilot is available.
  /v1/chats:
    get:
      description: Retrieve a list of chats
      summary: |
        Retrieve a list of chats using either basic filters or search
        with an advanced expression using the "filter" field.
      tags:
      - Chats
      operationId: getChats
      parameters:
      - name: copilot.id
        in: query
        description: The ID of the copilot for which to retrieve chats
        schema:
          type: string
          format: string
        required: false
      - name: copilot.version
        in: query
        description: The version of the copilot for which to retrieve chats
        schema:
          type: string
          format: string
        required: false
      - name: createdBy
        in: query
        description: The userId of the person that created the chats that should be
          retrieved. This feature is only available to administrators.
        schema:
          type: string
          format: string
        required: false
      - name: creationTimeStamp
        in: query
        description: The creation timestamp of the chat to retrieve
        schema:
          type: string
          format: timestamp
        required: false
      - name: filter
        in: query
        description: The criteria for filtering the collection. See [Filtering in
          REST APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: id
        in: query
        description: The unique identifier of the chat to retrieve
        schema:
          type: string
          format: string
        required: false
      - name: modifiedBy
        in: query
        description: The userId of the person that modified the chats that should
          be retrieve. This feature is only available to administrators.
        schema:
          type: string
          format: string
        required: false
      - name: modifiedTimeStamp
        in: query
        description: The modification timestamp of the chat to retrieve
        schema:
          type: string
          format: timestamp
        required: false
      - name: start
        in: query
        description: The start index for pagination
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The limit parameter for pagination
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: The criteria for sorting the collection. See [Sorting in REST
          APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#sorting.
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: A collection of chats
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/chats"
              examples:
                default:
                  $ref: "#/components/examples/chatsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/chats"
              examples:
                default:
                  $ref: "#/components/examples/chatsResponse"
    post:
      summary: Create a chat
      tags:
      - Chats
      operationId: createChat
      description: Create a chat for a specific copilot. Optionally, an initial request
        can be included.
      requestBody:
        description: The chat to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/chatRequest"
            examples:
              example1:
                $ref: "#/components/examples/chatRequest1"
              example2:
                $ref: "#/components/examples/chatRequest2"
              example3:
                $ref: "#/components/examples/chatRequest3"
      responses:
        "201":
          description: The chat was created.
          headers:
            Location:
              description: The URI of the newly-created resource.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/chat"
              examples:
                example1:
                  $ref: "#/components/examples/chatResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
  /v1/chats/{chatId}:
    get:
      description: Retrieve a specific chat
      summary: Retrieve a specific chat. This feature is only available to administrators
      tags:
      - Chats
      operationId: getChat
      parameters:
      - name: chatId
        in: path
        description: The ID of the chat to retrieve.
        schema:
          type: string
          format: string
        required: true
      responses:
        "200":
          description: A single chat object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/chat"
              examples:
                default:
                  $ref: "#/components/examples/chatResponse"
    head:
      summary: Verify that a chat exists. This feature is only available to administrators
      description: Determine if the chat is available.
      tags:
      - Chats
      operationId: headersForChat
      parameters:
      - name: chatId
        in: path
        description: The ID of the chat to verify.
        schema:
          type: string
          format: string
        required: true
      responses:
        "200":
          description: The request succeeded. The chat is available.
        "404":
          description: The chat does not exist.
  /v1/chats/{chatId}/state:
    get:
      summary: Retrieve the state of a specific chat
      tags:
      - Chats
      operationId: getChatState
      description: |
        Returns the current state ("ready" or "processing") of the specified chat. If a chat is in
        the "processing" state, it means that a message is currently being processed by the copilot.
        The [Cancel Chat](#operation/cancelChat) endpoint can be used to cancel a chat that is in
        the "processing" state.
      parameters:
      - name: chatId
        in: path
        required: true
        description: The ID of the chat to retrieve the state for.
        schema:
          type: string
      responses:
        "200":
          description: The current state of the chat.
          content:
            text/plain:
              schema:
                type: string
                description: The state of the chat.
                enum: [ready, processing]
              example: ready
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
        "404":
          description: The chat does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
    put:
      summary: Cancel a chat
      tags:
      - Chats
      operationId: updateChatState
      description: |
        Cancel a chat that is in the "processing" state. The chat will immediately move to the "ready" state
        and new messages can be submitted. The cancellation operation will be processed on the server in the
        background.

        Note that the "value=canceled" query string parameter is required.
      parameters:
      - name: chatId
        in: path
        description: The ID of the chat to verify.
        schema:
          type: string
          format: string
        required: true
      - name: value
        in: query
        description: The "value" query string parameter must be set to "canceled"
        schema:
          type: string
          format: string
          example: canceled
        required: true
      responses:
        "200":
          description: The chat was successfully canceled.
        "404":
          description: The chat does not exist.
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
  /v1/chats/{chatId}/messages:
    parameters:
    - name: chatId
      schema:
        type: string
      in: path
      required: true
      description: The chat ID
    get:
      summary: Get the collection of messages
      tags:
      - Messages
      operationId: getMessages
      description: |
        Get the collection of messages. Note that by default, only the first ten messages of the chat are returned.
        To retrieve all messages, use the "start", "limit", and "sortBy" query parameters. For example to retrieve
        the twenty most recent messages, use the following query string: ?limit=20&sortBy=order:descending.
      parameters:
      - name: filter
        in: query
        description: The criteria for filtering the collection. See [Filtering in
          REST APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: start
        in: query
        description: The start index for pagination
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The limit parameter for pagination
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: The criteria for sorting the collection. See [Sorting in REST
          APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: A collection of messages.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/messages"
              examples:
                default:
                  $ref: "#/components/examples/messagesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/messages"
              examples:
                default:
                  $ref: "#/components/examples/messagesResponse"
    post:
      summary: Create a message
      tags:
      - Messages
      operationId: createMessage
      description: |
        Create a message where the structure of the body is indicated by the "type"
        field. The following "type" values can be sent from the client: "userRequest",
        "userPromptRequest" or "functionResult".
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/userRequest"
              - $ref: "#/components/schemas/userPromptRequest"
              - $ref: "#/components/schemas/functionResult"
            examples:
              example1:
                $ref: "#/components/examples/userRequest"
              example2:
                $ref: "#/components/examples/userPromptRequest"
              example3:
                $ref: "#/components/examples/functionResult"
        description: The message to create
      responses:
        "201":
          description: |
            The message was created. Poll the getMessages endpoint to retrieve the
            full response from the copilot.
          headers:
            Location:
              description: The URI of the newly-created resource.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/userRequest"
                - $ref: "#/components/schemas/userPromptRequest"
                - $ref: "#/components/schemas/functionResult"
              examples:
                example1:
                  $ref: "#/components/examples/userRequestResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
        "409":
          description: |
            An HTTP 409 (Conflict) response can happen for a message of type "userRequest" or "userPromptRequest" if the
            chat is currently in the "processing" state. New request messages can only be accepted when the chat is in
            the "ready" state. If necessary, the chat can be returned to the "ready" state by using the cancel chat
            endpoint to stop the current message from being processed further.

            A 409 response can also occur for a message of type "functionResult" if the chat is not in the "processing"
            state or if the function result cannot be matched with an active initiating request. This situation can
            occur if the initiating request was canceled.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
  /v1/copilotRequest:
    post:
      summary: Send a message to a copilot
      tags:
      - Copilot Requests
      operationId: callCopilot
      description: |
        Send a message to a copilot where the structure of the message is indicated
        by the "type" field. The following "type" values can be sent from the client:
        "userRequest" or "userPromptRequest".
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/copilotRequest"
            examples:
              example1:
                $ref: "#/components/examples/copilotRequest"
        description: The request to send to a copilot
      responses:
        "201":
          description: |
            The response from the copilot.
          headers:
            Location:
              description: The URI of the newly-created resource.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/copilotResponse"
                - $ref: "#/components/schemas/copilotFunctionResponse"
              examples:
                example1:
                  $ref: "#/components/examples/copilotRequestResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/errorResponse"
  /v1/mcpServers:
    get:
      summary: Retrieve a collection of MCP server registrations
      description: |
        Get a collection of MCP server registrations. Note that by default,
        only the first ten MCP server registrations are returned. To retrieve
        all MCP server registrations, use the "start", "limit", and "sortBy"
        query parameters. For example, to retrieve the twenty most recently
        registered MCP servers, use the following query string:
        `?limit=20&sortBy=order:descending`.
      tags:
      - Model Context Protocol
      operationId: getMcpServers
      parameters:
      - name: filter
        in: query
        description: The criteria for filtering the collection. See [Filtering in
          REST APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: start
        in: query
        description: The start index for pagination.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The maximum number of MCP server registrations to return on a
          page.
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: The criteria for sorting the collection. See [Sorting in REST
          APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: A collection of MCP server registrations.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/mcpServers"
              examples:
                default:
                  $ref: "#/components/examples/mcpServersResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/mcpServers"
              examples:
                default:
                  $ref: "#/components/examples/mcpServersResponse"
          headers:
            Content-Type:
              schema:
                type: string
    post:
      summary: Create an MCP server registration
      description: Create a new MCP server registration.
      tags:
      - Model Context Protocol
      operationId: createMcpServer
      requestBody:
        description: The MCP server registration to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/mcpServer"
            examples:
              default:
                $ref: "#/components/examples/mcpServerRequest"
      responses:
        "201":
          description: The MCP server registration was created.
          headers:
            ETag:
              schema:
                type: string
            Last-Modified:
              description: The time stamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format
                when the resource was last modified.
              schema:
                type: string
            Location:
              description: The URI of the newly-created resource.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mcpServer"
              examples:
                default:
                  $ref: "#/components/examples/mcpServerResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
