  /v1/agents:
    get:
      summary: Retrieve a collection of agents
      description: |
        Get a collection of agents. Note that by default, only the first ten
        agents are returned. To retrieve all agents, use the "start", "limit",
        and "sortBy" query parameters. For example, to retrieve the twenty most
        recently created agents, use the following query string:
        `?limit=20&sortBy=order:descending`.
      tags:
      - Agents
      operationId: getAgents
      parameters:
      - name: filter
        in: query
        description: The criteria for filtering the collection. See [Filtering in
          REST APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: start
        in: query
        description: The start index for pagination.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The maximum number of agents to return on a page.
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        description: The criteria for sorting the collection. See [Sorting in REST
          APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: A collection of agents.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/agents"
              examples:
                default:
                  $ref: "#/components/examples/agentsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/agents"
              examples:
                default:
                  $ref: "#/components/examples/agentsResponse"
          headers:
            Content-Type:
              schema:
