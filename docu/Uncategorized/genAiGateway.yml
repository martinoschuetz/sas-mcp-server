components:
  schemas:
    status:
      type: object
      description: Retrieves information about whether the GenAI Gateway service is
        enabled.
      properties:
        enabled:
          type: boolean
          description: Indicates whether the GenAI Gateway service is enabled.
        reason:
          type: string
          description: If the service is disabled, provides the reason why it is disabled.
        activeTimeStamp:
          type: string
          description: Indicates the time when credentials were created in Orders
            API.
        territory:
          type: string
          description: Indicates the territory associated with the credentials.
    accessInfo:
      type: object
      description: Retrieves access information including credentials and site number
        details for the Gen AI platform.
      properties:
        accessToken:
          type: string
          description: The access token for the Gen AI platform.
        siteNumber:
          type: string
          description: The site number associated with the license.
        platformUrl:
          type: string
          description: The URL of the Gen AI platform.
        secretId:
          type: string
          description: The secret ID from Orders API.
    copilot:
      type: object
      description: Copilot instance that contains the copilot ID and version.
      properties:
        id:
          type: string
          description: ID of the copilot
        version:
          type: string
          description: |
            Version of the copilot. This value must be in a url appropriate
            format. The "v" prefix is required. For example: v1, v2, v3, etc.
    initialRequest:
      type: object
      description: Optional first message request that will be sent to the copilot
      oneOf:
      - $ref: "#/components/schemas/userRequest"
      - $ref: "#/components/schemas/userPromptRequest"
    chatRequest:
      type: object
      description: A request to create a new chat instance
      properties:
        applicationName:
          type: string
          description: The name of the application that is using the copilot.
          maxLength: 50
        copilot:
          $ref: "#/components/schemas/copilot"
        initialRequest:
          $ref: "#/components/schemas/initialRequest"
      required:
      - copilot
      - applicationName

    chat:
      type: object
      description: A chat
      properties:
        id:
          type: string
          description: ID of the chat.
        copilot:
          $ref: "#/components/schemas/copilot"
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the chat was created.
        createdBy:
          type: string
          description: The user who created the chat.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the chat was last modified.
        modifiedBy:
          type: string
          description: The user who last modified the chat.
        state:
          type: string
          description: The state of the chat with possible values of "ready" or "processing".
          enum:
          - ready
          - processing
    messageType:
      title: Message Type
      description: The message type. Indicates one of the enums.
      type: string
      enum:
      - userRequest
      - userPromptRequest
      - functionResult
      - copilotResponse
      - copilotFunctionResponse
    message:
      title: Message
      description: A message to or from a copilot.
      required:
      - type
      properties:
        id:
          type: string
          description: ID of the message.
        type:
          $ref: "#/components/schemas/messageType"
      discriminator:
        propertyName: type
        mapping:
          userRequest: "#/components/schemas/userRequest"
          userPromptRequest: "#/components/schemas/userPromptRequest"
          functionResult: "#/components/schemas/functionResult"
          copilotResponse: "#/components/schemas/copilotResponse"
          copilotFunctionResponse: "#/components/schemas/copilotFunctionResponse"
    userRequest:
      title: User request
      description: A message from the user. The "type" field should be set to either
        "userRequest", "userPromptRequest", or "functionResult".
      required:
      - content
      allOf:
      - $ref: "#/components/schemas/message"
      - type: object
        properties:
          context:
            description: Map of context values
            type: object
            additionalProperties: true
          content:
            type: string
            description: The message content.
          canceled:
            type: boolean
            description: False by default. Whether or not the request was canceled.
    userPromptRequest:
      title: User prompt request
      description: A message from the user indicating the selected prompt. The "type"
        field should be set to "userPromptRequest".
      required:
      - selectedPrompt
      allOf:
      - $ref: "#/components/schemas/message"
      - type: object
        properties:
          context:
            description: Map of context values
            type: object
            additionalProperties: true
          selectedPrompt:
            $ref: "#/components/schemas/prompt"
          canceled:
            type: boolean
            description: False by default. Whether or not the request was canceled.
    functionResult:
      title: Function result
      description: A message containing the results of a function call.
      required:
      - data
      - copilotFunctionResponseId
      allOf:
      - $ref: "#/components/schemas/message"
      - type: object
        properties:
          data:
            description: Map of data values
            type: object
            additionalProperties: true
          partial:
            description: Whether or not the result is a partial function result.
            type: boolean
          copilotFunctionResponseId:
            description: The id of the function response related to the results.
            type: string
          jobId:
            description: If applicable, the id of the job associated with the function
              result.
            type: string
    functionCall:
      title: Function call
      description: A function to call.
      type: object
      properties:
        name:
          type: string
          description: Name of the function to call.
        arguments:
          description: Map of function arguments
          type: object
          additionalProperties: true
    copilotResponse:
      title: Copilot response
      description: A response from a copilot.
      allOf:
      - $ref: "#/components/schemas/message"
      - type: object
        properties:
          content:
            type: string
            description: The message content.
          promptCard:
            $ref: "#/components/schemas/promptCard"
          complete:
            type: boolean
            description: Whether or not the copilot is done responding
          requestMessageId:
            type: string
            description: The ID of the request message that triggered this response.
          metadata:
            description: Optional JSON data that provides additional contextual information
              in the response
            type: object
            additionalProperties: true
    copilotFunctionResponse:
      title: Copilot function response
      description: A response from a copilot including a function call.
      required:
      - functionCall
      allOf:
      - $ref: "#/components/schemas/message"
      - type: object
        properties:
          functionCall:
            $ref: "#/components/schemas/functionCall"
          content:
            type: string
            description: The message content.
          complete:
            type: boolean
            description: Whether or not the copilot is done responding
          requestMessageId:
            type: string
            description: The ID of the request message that triggered this response.
    copilots:
      title: Collection of copilots
      description: A collection of copilots
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/copilot"
    chats:
      title: Collection of chats
      description: A collection of chats
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/chat"
    messages:
      title: Collection of messages
      description: A collection of messages
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              anyOf:
              - $ref: "#/components/schemas/copilotResponse"
              - $ref: "#/components/schemas/copilotFunctionResponse"
              - $ref: "#/components/schemas/functionResult"
              - $ref: "#/components/schemas/userRequest"
              - $ref: "#/components/schemas/userPromptRequest"
    promptCardType:
      title: Prompt Card Type
      description: The prompt card type.
      type: string
      enum:
      - list
      - custom
    promptCard:
      title: Prompt card
      description: A card of predefined prompts
      required:
      - type
      - content
      type: object
      properties:
        type:
          $ref: "#/components/schemas/promptCardType"
        content:
          oneOf:
          - $ref: "#/components/schemas/promptList"
          - $ref: "#/components/schemas/promptCustom"
      discriminator:
        propertyName: type
        mapping:
          list: "#/components/schemas/promptList"
          custom: "#/components/schemas/promptCustom"
    promptList:
      title: Prompt list
      description: A list of prompts.
      required:
      - prompts
      allOf:
      - $ref: "#/components/schemas/promptCard"
      - type: object
        properties:
          prompts:
            type: array
            description: Array containing prompt objects
            items:
              $ref: "#/components/schemas/prompt"
    prompt:
      title: Prompt
      description: A predefined prompt.
      required:
      - label
      - messageText
      properties:
        id:
          type: string
          description: The id of the prompt.
        label:
          type: string
          description: The text shown on the prompt element.
        messageText:
          type: string
          description: The text sent in the message if the prompt is selected.
        properties:
          type: object
          description: Additional set of properties related to the prompt.
    promptCustom:
      title: Prompt custom
      description: A custom prompt card.
      required:
      - content
      allOf:
      - $ref: "#/components/schemas/promptCard"
      - type: object
        properties:
          content:
            type: object
    copilotRequest:
      title: Copilot request
      description: A request to a copilot.
      required:
      - copilot
      - applicationName
      - message
      properties:
        copilot:
          $ref: "#/components/schemas/copilot"
        applicationName:
          type: string
          description: The name of the application that is using the copilot.
        message:
          oneOf:
          - $ref: "#/components/schemas/userRequest"
          - $ref: "#/components/schemas/userPromptRequest"
    mcpServer:
      title: MCP Server Registration
      description: An MCP server registration containing the information needed to
        connect to it.
      type: object
      required:
      - id
      - url
      properties:
        id:
          type: string
          description: The unique identifier of the MCP server registration.
        url:
          type: string
          description: |
            The URL of the MCP server.

            This may be a relative URL that is resolved against the base URL
            of the Viya deployment. Relative URLs must begin with a forward
            slash (`/`).
    mcpServers:
      title: Collection of MCP server registrations
      description: A collection of MCP server registrations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/mcpServer"
    tool:
      title: Tool
      description: |
        A tool that an agent has access to. A tool must specify either an MCP
        server and glob filter (`mcpServerId` and `globFilter`) or a sub-agent
        (`subAgentId`), but not both.
      type: object
      properties:
        mcpServerId:
          type: string
          description: |
            The identifier of the MCP server registration that provides the
            tools. Must be accompanied by a `globFilter` and must not be
            combined with a `subAgentId`.
        globFilter:
          type: string
          description: |
            A glob pattern that selects which tools from the MCP server are
            made available to the agent. Required when `mcpServerId` is set.
        subAgentId:
          type: string
          description: |
            The identifier of another agent to use as a tool. Must not be
            combined with `mcpServerId` or `globFilter`.
      oneOf:
      - title: MCP server tool
        description: |
          A tool backed by an MCP server. Requires both `mcpServerId` and
          `globFilter`, and must not include `subAgentId`.
        required:
        - mcpServerId
        - globFilter
        not:
          required:
          - subAgentId
      - title: Sub-agent tool
        description: |
          A tool backed by another agent. Requires `subAgentId`, and must
          not include `mcpServerId` or `globFilter`.
        required:
        - subAgentId
        not:
          anyOf:
          - required:
            - mcpServerId
          - required:
            - globFilter
    agent:
      title: Agent
      description: |
        An agent containing the metadata that describes it, such as its prompt
        and the tools it has access to.
      type: object
      required:
      - id
      - name
      - prompt
      - tools
      properties:
        id:
          type: string
          description: The unique identifier of the agent.
        name:
          type: string
          description: The display name of the agent.
        description:
          type: string
          description: A description of the agent.
        prompt:
          type: string
          description: The system prompt that defines the agent's behavior.
        tools:
          type: array
          description: The tools that the agent has access to.
          items:
            $ref: "#/components/schemas/tool"
    agents:
      title: Collection of agents
      description: A collection of agents.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/agent"
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
