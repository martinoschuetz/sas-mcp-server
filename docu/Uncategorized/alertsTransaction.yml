      description: When this HEAD request is submitted to the sas-alerts-transaction
        service the header information for the PDF template with the specified ID
        is returned.
      parameters:
      - name: pdfTemplateId
        in: path
        description: The pdfTemplateId parameter is used to specify the ID of the
          PDF template.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A 200 response is returned if the PDF template exists. The
            response contains only headers, no body.
          headers:
            Content-Type:
              schema:
                type: string
            Last-Modified:
              description: Date and time of last modification.
              schema:
                type: string
        '404':
          headers:
            Content-Type:
              schema:
                type: string
          description: A 404 response is returned if the PDF template with the specified
            ID could not be found.
  /downloads:
    post:
      tags:
      - Downloads
      summary: Generate a PDF download for transactions
      operationId: createDownload
      description: When this POST request is submitted to the sas-alerts-transaction
        service, a PDF document is generated for the specified transactions using
        the identified PDF template. The generated document is returned as a binary
        PDF file attachment. Optionally, an alertId may be provided to include alert
        details in the generated document. If the requesting user has the unmask or
        never-mask capability, unmasked transaction data can be included in the output
        by setting the appropriate request header.
      parameters:
      - in: header
        name: SAS-Triage-Unmask
        required: false
        description: An optional request header that controls whether unmasked transaction
          data is returned in the generated PDF. Accepted values are case-insensitive
          boolean strings ("true" or "false"). This header is honored only when the
          requesting user has the "triage.alert.unmask" or "triage.alert.never_mask"
          capability. When the user has the "triage.alert.never_mask" capability,
          unmasked data is always returned regardless of the header value. If the
          header is provided with a value that cannot be parsed as a boolean, a 400
          error is returned.
        schema:
          type: string
          example: 'true'
      requestBody:
        description: The body of this POST request specifies the PDF template to use
          and the transactions to include in the generated PDF download.
        content:
          application/vnd.sas.triage.transaction.pdf.downloads+json:
            schema:
              $ref: '#/components/schemas/downloadRequest'
            examples:
              default:
                $ref: '#/components/examples/post-downloads'
          application/json:
            schema:
              $ref: '#/components/schemas/downloadRequest'
            examples:
              default:
                $ref: '#/components/examples/post-downloads'
      responses:
        '200':
          description: A 200 response is returned by the sas-alerts-transaction service
            when the PDF document has been generated successfully. The response body
            contains the binary PDF content, which is delivered as a file attachment
            named "transaction-report.pdf".
          headers:
            Content-Type:
              schema:
                type: string
                example: application/pdf
            Content-Disposition:
              description: Indicates the PDF should be downloaded as an attachment
                with the filename "transaction-report.pdf".
              schema:
                type: string
                example: attachment; filename=transaction-report.pdf
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                description: The binary content of the generated PDF document.
              examples:
                default:
                  $ref: '#/components/examples/download-200'
        '400':
          description: A 400 response is returned by the sas-alerts-transaction service
            when the submitted POST request is identified as being invalid. Common
            causes include a missing required field (such as "templateId" or "transactionIds"),
            an empty "transactionIds" map, a "templateId" that does not correspond
            to an existing PDF template, an "alertId" or "templateId" outside the
            allowed length range (1 to 36 characters), an unsupported request media
            type version, or a "SAS-Triage-Unmask" header value that cannot be parsed
            as a boolean.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                missingField:
                  $ref: '#/components/examples/download-400'
                templateNotFound:
                  $ref: '#/components/examples/download-400-template'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                missingField:
                  $ref: '#/components/examples/download-400'
                templateNotFound:
                  $ref: '#/components/examples/download-400-template'
components:
  schemas:
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, then `itemType` is the media
            type or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`
            `POST` or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT` `POST` or `PATCH` operation.
    apiResource:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: '#/components/schemas/link'
    collectionResource:
      title: Base-Collection
      type: object
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        items:
          type: array
          description: The list of items in the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: '#/components/schemas/link'
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    transactionTypeRequest:
      title: Transaction Type Request
      description: The list of fields available for performing create operations on
        this API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - discriminators
      - indexableVariablePaths
      - transactionTypeTableName
      - transactionDatetimePath
      - transactionIdPath
      properties:
        id:
          type: string
          description: The unique identifier of the transaction type. If not specified
            by the user the system generates a unique UUID for the transaction type.
          maxLength: 100
        displayNameLocalizationKey:
          type: string
          description: The unique display localization key for the transaction type.
            This shall be deprecated.
          maxLength: 100
        defaultDisplayName:
          type: string
          description: The display name of the transaction type. This shall be deprecated.
          maxLength: 100
        name:
          type: string
          description: The name of the transaction type. If no value is provided,
            the system will default to using the 'defaultDisplayName' property. This
            is in replacement of 'defaultDisplayName' property.
          maxLength: 100
        messageSchemaName:
          type: string
          description: The message schema of the transaction type.
          maxLength: 127
        discriminators:
          type: object
          description: |
            The unique discriminator identifiers for the transaction type.
            <br> It is a map of keys and values.
            <br> The keys are variable paths that should match the discriminator fields defined previously in the discriminator configuration.
            <br> The value is an array of values for the discriminator variable path to identify the transaction type.
        indexableVariablePaths:
          type: string
          description: A string array of variable paths from the message that can
            be searched on.
        transactionTypeTableName:
          type: string
          description: The name of the table that will be created to store transactions
            of this type.
          maxLength: 30
        transactionDatetimePath:
          type: string
          description: The path to the variable on the message from which the date
            and time stamp for transactions of this type will be retrieved.
        transactionIdPath:
          type: string
          description: The path to the variable on the message from which the transaction
            ID for transaction of this type will be retrieved.
        retentionPeriod:
          type: integer
          description: |
            The 'retentionPeriod' property is used to specify, in days, the period of time that transactions of a given type will be retained for. A transaction will be purged from the database once it has exceeded the retention period of the transaction type with which it is associated.
            <br> If the 'retentionPeriod' property is set to '0' for a given transaction type then transactions of this type will retained indefinitely in the database.
            <br> If the 'retentionPeriod' property is left undefined the system will default to a value of '0'.
          minimum: 0
        alertTypes:
          type: array
          description: Specifies an array of alert types associated with the transaction
            type.
          items:
            type: object
            properties:
              id:
                type: string
                description: Specifies the identifier of the alert type.
                maxLength: 36
        partitionConfigId:
          type: string
          description: Specifies the identifier of the partition configuration.
        optLockVersion:
          type: integer
          description: |
            The 'optLockVersion' property specifies the version number of a transaction type configuration definition. The optLockVersion iterates up by 1 each time a transaction type configuration definition is successfully updated.
            <br> The 'optLockVersion' number included in a POST request must be set to a number greater than the transaction type configuration definition's current 'optLockVersion' number or be set to a value of '-1'.
            <br> If the 'optLockVersion' specified in a POST request to update an existing transaction type configuration definition is set to '-1', and no changes are included in the body of the request, then no changes are made to the configuration definition but the request will return a '201' response.
            <br> If the 'optLockVersion' specified in a POST request to update an existing transaction type configuration definition is set to '-1' and changes are included in the body of the request, then the transaction type configuration definition will be updated successfully and a '201' response returned.
            <br> A '412' error response will be returned if the 'optLockVersion' specified in the POST request to update an existing transaction type configuration definition is left undefined or has a value equal to or less than the configuration definition's current 'optLockVersion" value.
        version:
          type: integer
          description: The 'version' property specifies the version of the transaction
            type concept that will be used for a particular configuration definition.
            The properties available for the transaction type concept may differ between
            versions.
    transactionTypeResponse:
      title: Transaction Type Response
      description: The list of fields received in the response after performing operations
        on this API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      properties:
