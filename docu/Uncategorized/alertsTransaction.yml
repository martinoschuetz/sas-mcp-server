    pdfTemplateRequest:
      title: PDF Template Request
      description: The list of fields available for performing a create or update
        operation on this API. The request must be submitted as a multipart/form-data
        request with the template definition provided in the "template" form field
        as a JSON string.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - name
      - header
      - body
      properties:
        id:
          type: string
          description: The unique identifier of the PDF template definition. If not
            specified, the system will generate a unique UUID for the PDF template
            definition.
          maxLength: 36
        name:
          type: string
          maxLength: 100
          description: The display name of the PDF template definition.
        title:
          type: string
          maxLength: 200
          description: An optional descriptive title for the PDF template.
        gridId:
          type: string
          maxLength: 36
          description: The ID of the transaction grid definition associated with this
            PDF template. Required when field-level configurations are specified in
            the body.
        status:
          type: string
          description: |
            The status of the PDF template definition. Valid values are "ACTIVE" and "INACTIVE".
            <br> An ACTIVE template cannot be deleted.
            <br> An ACTIVE template requires a fully specified field configuration in the body.
          enum:
          - ACTIVE
          - INACTIVE
        header:
          type: object
          description: The header configuration for the PDF template, controlling
            the optional logo image displayed at the top of each generated PDF.
          properties:
            imageAlignment:
              type: string
              description: The horizontal alignment of the logo image within the PDF
                header. Valid values are "left", "center", and "right".
              enum:
              - left
              - center
              - right
            imageName:
              type: string
              maxLength: 100
              description: The image name of the logo associated with this template.
                This field is required when a logo file is included in the multipart/form-data
                request. The size of the image must be equal to or less than 500kb.
        body:
          type: object
          description: The body configuration for the PDF template, specifying the
            layout and field content of each generated PDF page.
          properties:
            alertDetailsConfig:
              type: object
              description: The configuration that controls the alert details section
                of the PDF body.
              required:
              - alignment
              properties:
                alignment:
                  type: string
                  description: The horizontal alignment of the alert details content.
                    Valid values are "left", "center", and "right".
                  enum:
                  - left
                  - center
                  - right
                repeatForEachTransaction:
                  type: boolean
                  description: When set to true, the alert details section is repeated
                    for each transaction in the report.
                enrichmentMappingIDs:
                  type: array
                  description: An ordered list of enrichment mapping IDs to include
                    in the alert details section.
                  items:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                        maxLength: 36
                        description: The unique identifier of the enrichment mapping.
                      displayOrder:
                        type: integer
                        minimum: 0
                        description: The display order of the enrichment mapping within
                          the alert details section.
                alertDetails:
                  type: array
                  description: An ordered list of individual alert detail field definitions
                    to include in the alert details section.
                  items:
                    type: object
                    required:
                    - label
                    - path
                    properties:
                      label:
                        type: string
                        maxLength: 100
                        description: The display label for this alert detail field.
                      path:
                        type: string
                        maxLength: 255
                        description: The JSON path to the field value within the transaction
                          data.
                      displayOrder:
                        type: integer
                        minimum: 0
                        description: The display order of this field within the alert
                          details section.
            transactionTableConfig:
              type: object
              description: The configuration that controls the transaction table section
                of the PDF body.
              required:
              - transactionFieldConfigs
              properties:
                transactionFieldConfigs:
                  type: object
                  description: The configuration for the fields displayed in the transaction
                    table.
                  required:
                  - textAlignment
                  properties:
                    textAlignment:
                      type: string
                      description: The horizontal alignment of text within the transaction
                        table. Valid values are "left", "center", and "right".
                      enum:
                      - left
                      - center
                      - right
                    fields:
                      type: array
                      description: An ordered list of transaction field configurations
                        defining the columns of the transaction table.
                      items:
                        type: object
                        required:
                        - id
                        properties:
                          id:
                            type: string
                            maxLength: 36
                            description: The unique identifier of the transaction
                              field configuration.
                          displayOrder:
                            type: integer
                            minimum: 0
                            description: The display order of this field within the
                              transaction table.
        optLockVersion:
          type: integer
          description: |
            The 'optLockVersion' property specifies the version number of a PDF template definition. The optLockVersion increments by 1 each time the PDF template is successfully updated.
            <br> The 'optLockVersion' number included in a POST request must be set to a number greater than the template's current 'optLockVersion' number or be set to a value of '-1'.
            <br> If the 'optLockVersion' specified in a POST request is set to '-1' and no changes are included in the body, no changes are made but the request will return a '201' response.
            <br> If the 'optLockVersion' specified in a POST request is set to '-1' and changes are included, the PDF template will be updated successfully.
            <br> A '412' error response will be returned if the 'optLockVersion' specified in the POST request is left undefined or has a value equal to or less than the template's current 'optLockVersion' value.
        version:
          type: integer
          description: The 'version' property specifies the version of the PDF template
            concept used for this definition.
