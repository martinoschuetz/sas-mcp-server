        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp of when the resource was created.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp of when the resource was last modified.
    errorResource:
      title: Error Resource
      description: The representation of an error.
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: An array of any additional errors that may have occurred.
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: '#/components/schemas/link'
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    alertTypeResponse:
      title: Alert Types Response
      description: Returns the list of fields received in the alert type response.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      properties:
        alertTypes:
          type: array
          description: Specifies an array of alert types associated with the transaction
            type.
          items:
            type: object
            properties:
              id:
                type: string
                description: Specifies the identifier of the alert type.
                maxLength: 100
