              localizedName:
                type: string
                description: Specifies the localized name of the alert type.
    transactionGridDefinitionRequest:
      title: Transaction Grid Definition Request
      description: The list of fields available for performing create operations on
        this API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - transactionFieldConfigs
      - transactionTypeIds
      properties:
        id:
          type: string
          description: The unique identifier of the transaction grid definition. If
            not specified by the user the system will generate a unique UUID for the
            transaction grid definition.
          maxLength: 100
        displayNameLocalizationKey:
          type: string
          description: The unique display localization key for the transaction grid
            definition. This shall be deprecated.
          maxLength: 100
        defaultDisplayName:
          type: string
          description: The display name of the transaction grid definition. This shall
            be deprecated.
          maxLength: 100
        name:
          type: string
          description: The name of the transaction grid definition. This is in replacement
            of the 'defaultDisplayName' property.
          maxLength: 100
        maxLookbackOffset:
          type: integer
          minimum: 1
          description: Defines the maximum number of days in the past, calculated
            from today's date, that messages can be retrieved for. The default maximum
            lookback is 90 days.
        defaultLookbackOffset:
          type: integer
          minimum: 1
          description: Defines the default number of days in the past, calculated
            from today's date, for which messages are retrieved. The property defaults
            to 7 days.
        transactionTypeIds:
          type: array
          description: Array of transaction type ID objects to be associated with
            the transaction grid.
          items:
            type: object
            properties:
              id:
                type: string
                description: The transaction type ID.
        optLockVersion:
          type: integer
          description: |
            The 'optLockVersion' property specifies the version number of a transaction grid configuration definition. The optLockVersion iterates up by 1 each time a transaction grid configuration definition is successfully updated.
            <br> The 'optLockVersion' number included in a POST request must be set to a number greater than the transaction grid configuration definition's current 'optLockVersion' number or be set to a value of '-1'.
            <br> If the 'optLockVersion' specified in a POST request to update an existing transaction grid configuration definition is set to '-1', and no changes are included in the body of the request, then no changes are made to the configuration definition but the request will return a '201' response.
            <br> If the 'optLockVersion' specified in a POST request to update an existing transaction grid configuration definition is set to '-1' and changes are included in the body of the request, then the transaction grid configuration definition will be updated successfully and a '201' response returned.
            <br> A '412' error response will be returned if the 'optLockVersion' specified in the POST request to update an existing transaction grid configuration definition is left undefined or has a value equal to or less than the configuration definition's current 'optLockVersion" value.
        version:
          type: integer
          description: The 'version' property specifies the version of the transaction
            grid concept that will be used for a particular configuration definition.
            The properties available for the transaction grid concept may differ between
            versions.
        transactionFieldConfigs:
          type: array
          description: Array of field configuration objects to be shown on the transaction
            grid.
          items:
            type: object
            properties:
              id:
                type: string
                description: The unique identifier of a field configuration.
                maxLength: 100
              displayNameLocalizationKey:
                type: string
                description: The unique display localization key for the field configuration.
                  This shall be deprecated
                maxLength: 100
              defaultDisplayName:
                type: string
                description: The display name of the field configuration will be used
                  as the column header label when this field is surfaced in the transaction
                  grid.
                maxLength: 100
              name:
                type: string
                description: The name of the field configuration will be used as the
                  column header label when this field is surfaced in the transaction
                  grid. If no value is provided, the system will default to using
                  the 'defaultDisplayName' property. This is in replacement of 'defaultDisplayName'
                  property.
                maxLength: 100
              displayOrderVal:
                type: integer
                description: |
                  The display order value determines the position that a given transaction field will occupy within the grid. 
                  <br> Ordering of the transaction fields is left aligned and if two field configurations share the same display value the "defaultDisplayName" will be used to order these transaction fields alphabetically.
                minimum: 0
              textAlignment:
                type: string
                description: |
                  The text alignment specified for a field configuration determines the alignment of the values presented within that transaction field when surfaced within the transaction grid. 
                  <br> The supported values are "left", "right", "center", "justify", "leftAligned" and "rightAligned".
                  <br> The values "leftAligned" and "rightAligned" are deprecated as part of the 2024.06 cadence release. These values will become unsupported in the 2024.08 cadence release.
                  <br> If the user does not specify the alignment, the system will default to using the "right" option for field configurations with data type "number" or "decimalNumber" and "left" option for all other data types.
              displayWidthVal:
                type: integer
                minimum: 1
                description: The display width value determines the default width
                  of the transaction field column when surfaced in the transaction
                  grid.
              isSortable:
                type: boolean
                description: |
                  Determines if the field configuration supports sorting on the values displayed for that transaction field within a transaction grid.
                  `true`: The field configuration can be sorted.
                  `false`: The field configuration cannot be sorted.
              defaultSortDirection:
                type: string
                description: |
                  Determines if the values in the transaction field column will be displayed in ascending or descending order by default when surfaced within the transaction grid.
                  <br> The supported values are "asc" and "desc".
                  <br> The user can specify this property only if "isSortable" is set to "true".
                  By default no sorting will be applicable for the column where user does not specify this property.
              isResizable:
                type: boolean
                description: |
                  Determines if the field configuration supports resizing of the transaction field column when surfaced within the transaction grid.
                  `true`: The field configuration can be resized.
                  `false`: The field configuration cannot be resized.
              variablePath:
                type: string
                description: The path to the variable on the message from which the
                  values to be displayed within the transaction field will be retrieved.
              dataType:
                type: string
                description: |
                  Determines the data type of the values in the transaction field column within the transaction grid.
                  <br> The supported values are "string", "number", "boolean", "date", "decimalNumber" and "dateTime".
                  <br> If the user does not specify the data type, the system will default to using the "string" option.
              decimalNumberPrecision:
                type: integer
                minimum: 2
                description: |
                  Specifies the precision of decimal values in the transaction field column within the transaction grid.
                  <br> The user can specify this property only if "dataType" is set to "decimalNumber".
                  <br> If the user does not specify the precision of decimal values, the system will default to using a decimal precision value of 2.
                  <br> The user can specify a value either greater than or equal to 2. The request will return a '400' error response if a value less than 2 is specified.
              isArray:
                type: boolean
                description: Indicates whether the field is an array.
              recursiveGridID:
                type: string
                description: ID of the grid configuration to be associated with field
                  configuration. It will be used to display the results of recursive
                  search.
                maxLength: 36
              renderConfig:
                type: array
                description: The renderConfig property is an array of objects that
                  specifies the render type and associated properties for a transaction
                  field configuration. The renderConfig property is used to provide
                  additional display instructions for how the values within a transaction
                  field should be rendered when surfaced in the transaction grid.
              listsData:
                type: array
                description: Array of listsData objects associated with that particular
                  transaction field config.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The unique identifier of the list.
                      maxLength: 36
                    label:
                      type: string
                      description: The label of the list.
                    columnName:
                      type: string
                      description: The column name of the list.
    transactionGridDefinitionResponse:
