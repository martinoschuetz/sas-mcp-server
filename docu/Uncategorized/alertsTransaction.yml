    downloadRequest:
      title: Download Request
      description: The request body for generating a PDF download for one or more
        transactions.
      x-sas-media-type:
        name: application/vnd.sas.triage.transaction.pdf.downloads
        version: 1
      required:
      - templateId
      - transactionIds
      properties:
        version:
          type: integer
          description: The version of this resource representation.
        alertId:
          type: string
          description: The unique identifier of the alert associated with the transactions
            to include in the PDF download. When provided, alert details are included
            in the generated document.
          maxLength: 36
        templateId:
          type: string
          description: The unique identifier of the PDF template to use when generating
            the download. The specified template must exist.
          minLength: 1
          maxLength: 36
        transactionIds:
          type: object
          description: A map of transaction type IDs to arrays of transaction IDs.
            Each key is a transaction type ID, and the corresponding value is a list
            of transaction IDs of that type to include in the generated PDF. At least
            one entry is required.
          minProperties: 1
          additionalProperties:
            type: array
            description: A list of transaction IDs for the corresponding transaction
              type.
            items:
              type: string
              description: A transaction ID.
