---
openapi: 3.0.3
info:
  version: '1'
  title: Triage - Transactions
  description: The SAS Alert Triage Transaction REST API provides a means to configure
    transaction types and how they are exposed within the SAS Alert Triage UI. The
    API also supports the retrieval of transactions. <details> <summary><b>Overview</b></summary>
    This API provides operations to configure and update the sas-alerts-transaction.
    <br> The sas-alerts-transaction API handles all translated related information
    within SAS Alert Triage, including discriminator variables, transaction types
    and how transactions are surfaced within the UI. </details>
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: https://developer.sas.com
servers:
- url: http://example.com/alertsTransaction
  description: This is an example base URL.
tags:
- name: Root
  description: Get a list of top-level links from the sas-alerts-transaction services.
- name: Transaction Types
  description: The operations for defining and managing transaction types.
- name: Transaction Grid Definition Configuration
  description: The operations for defining and managing transaction grid definition
    configurations.
- name: Transaction Viewer Config
  description: The operations for defining and managing transaction viewer configurations.
- name: Transaction Discriminators
  description: The operations for defining and managing transaction discriminators.
- name: Transaction Mask Config
  description: The operations for defining and managing transaction masking configurations.
- name: Transaction Marking Configuration
  description: The operations for defining and managing custom transaction marking
    configuration definitions.
- name: Transaction Access Control Rules
  description: The operations for defining and managing transaction access control
    rule configurations.
- name: Transaction
  description: Get a transaction's details.
- name: Transaction Purging Job
  description: This endpoint will be deprecated. Use the endpoint in 'Transaction
    Job' instead. The operations for initiating a background job that purges transactions.
- name: Transaction Job
  description: The operations for initiating a background job for transactions.
- name: Transaction Memos
  description: The operations for defining and managing transaction memo definitions.
- name: Transaction Mark Message Configuration
  description: The operations for defining and managing transaction mark message configurations.
- name: Transaction Marks
  description: The operations for applying and getting transaction marks for a specified
    transaction in the context of an alert.
- name: Transaction Localization
  description: The operations for defining and managing transaction localization configurations.
- name: Transaction Job Logs
  description: The operations for getting transaction job logs.
- name: Partition Configuration
  description: The operations for defining and managing partition configurations.
- name: Pdf Template
  description: The operations for retrieving and deleting PDF template configurations.
- name: Downloads
  description: The operations for generating PDF downloads for transactions.
paths:
  /:
    get:
      tags:
      - Root
      summary: Retrieve the sas-alerts-transaction service's top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced by
        this API.
      responses:
        '200':
          description: A 200 response is returned by the sas-alerts-transaction service
            if the GET request to retrieve the top-level links for the sas-alerts-transaction
            service is successful.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/apiResource'
              examples:
                json:
                  $ref: '#/components/examples/rootResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/apiResource'
              examples:
                json:
                  $ref: '#/components/examples/rootResponse'
  /transactionTypes:
    post:
      tags:
      - Transaction Types
      summary: Define a transaction type
      operationId: createTransactionTypes
      description: When this POST request is submitted to the sas-alerts-transaction
        service, a new transaction type definition is created.
      requestBody:
        description: The body of this POST request contains the details of the transaction
          type to be created.
        content:
          application/vnd.sas.triage.transaction.type+json:
            schema:
              $ref: '#/components/schemas/transactionTypeRequest'
            examples:
              default:
                $ref: '#/components/examples/post-transaction-types'
          application/json:
            schema:
              $ref: '#/components/schemas/transactionTypeRequest'
            examples:
              default:
                $ref: '#/components/examples/post-transaction-types'
      responses:
        '201':
          headers:
            Content-Type:
              schema:
                type: string
          description: A 201 response is returned by the sas-alerts-transaction service
            if the POST request to create a new transaction type configuration is
            successful.
          content:
            application/vnd.sas.triage.transaction.type+json:
              schema:
                $ref: '#/components/schemas/transactionTypeResponse'
              examples:
                default:
                  $ref: '#/components/examples/transaction-type-201'
            application/json:
              schema:
                $ref: '#/components/schemas/transactionTypeResponse'
              examples:
                default:
                  $ref: '#/components/examples/transaction-type-201'
        '400':
          description: A 400 response is returned by the sas-alerts-transaction service
            when the submitted POST request is identified as being invalid. For example,
            the request might contain invalid data or the structure of the request's
            body is invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                default:
                  $ref: '#/components/examples/transaction-type-400'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                default:
                  $ref: '#/components/examples/transaction-type-400'
    get:
      tags:
      - Transaction Types
      summary: Retrieve all transaction types
      operationId: getTransactionTypes
      description: When this GET request is submitted to the sas-alerts-transaction
        service a list of existing transaction type definitions is returned.
      responses:
        '200':
          description: A 200 response is returned by the sas-alerts-transaction service
            if the GET request was successful and a list of transaction type definitions
            was returned.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/collectionResource'
              examples:
                default:
                  $ref: '#/components/examples/transaction-types-200'
            application/json:
              schema:
                $ref: '#/components/schemas/collectionResource'
              examples:
                default:
                  $ref: '#/components/examples/transaction-types-200'
  /transactionType/{transactionTypeId}:
    get:
      tags:
      - Transaction Types
      summary: Retrieve a specific transaction type
      operationId: getTransactionType
      description: When this GET request is submitted to the sas-alerts-transaction
        service the transaction type definition with the specified ID will be returned.
      parameters:
      - name: transactionTypeId
        in: path
        description: The transactionTypeId GET request parameter is used to specify
          the ID of the transaction type definition that will be retrieved.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Type:
              schema:
                type: string
            Last-Modified:
              description: Data and Time of last modification.
              schema:
                type: string
          description: A 200 response is returned by the sas-alerts-transaction service
            if the GET request was successful and the transaction type definition
            with the specified ID was returned.
          content:
            application/vnd.sas.triage.transaction.type+json:
              schema:
                $ref: '#/components/schemas/transactionTypeResponse'
              examples:
                default:
                  $ref: '#/components/examples/transaction-type-200'
            application/json:
              schema:
                $ref: '#/components/schemas/transactionTypeResponse'
              examples:
                default:
                  $ref: '#/components/examples/transaction-type-200'
        '404':
          description: A 404 response is returned by the sas-alerts-transaction service
            when the GET request was submitted with a missing resource.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                default:
                  $ref: '#/components/examples/transaction-type-404'
            application/json:
              schema:
                $ref: '#/components/schemas/errorResource'
              examples:
                default:
                  $ref: '#/components/examples/transaction-type-404'
    head:
      tags:
      - Transaction Types
      summary: Retrieve a transaction type's header information
      operationId: headersForTransactionType
      description: When this HEAD request is submitted to the sas-alerts-transaction
        service the header information for the transaction grid configuration definition
        with the specified ID is returned.
      parameters:
      - name: transactionTypeId
        in: path
        description: The transactionTypeId HEAD request parameter is used to specify
          the ID of the transaction type definition that will be retrieved.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Type:
              schema:
                type: string
            Last-Modified:
              description: Data and Time of last modification.
              schema:
                type: string
          description: A 200 response is returned by the sas-alerts-transaction service
            if the HEAD request was successful and the transaction type definition
            with the specified ID was returned.
        '404':
          headers:
            Content-Type:
              schema:
                type: string
          description: A 404 response is returned by the sas-alerts-transaction service
            when the HEAD request was submitted with a missing resource.
  /transactionType/{transactionTypeId}/alertTypes:
    get:
