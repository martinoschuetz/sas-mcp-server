                description: The name of the field configuration will be used as the
                  column header label when this field is surfaced in the transaction
                  grid. This is in replacement of 'displayName' property.
                maxLength: 100
              localizedName:
                type: string
                description: The localized name of the field configuration.
              displayOrderVal:
                type: integer
                description: |
                  The display order value determines the position that a given transaction field will occupy within the grid. 
                  <br> Ordering of the transaction fields is left aligned and if two field configurations share the same display value the "defaultDisplayName" will be used to order these transaction fields alphabetically.
                minimum: 0
              textAlignment:
                type: string
                description: |
