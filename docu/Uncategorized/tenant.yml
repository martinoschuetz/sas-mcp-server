---
openapi: 3.0.3
info:
  title: Tenants
  description: Manages information about tenants and multi-tenant services.
  version: "3"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
externalDocs:
  description: Developer documentation
  url: "https://developer.sas.com"
servers:
- url: http://mock-tenant.apifirst.unx.sas.com/tenant
  description: mock tenant server
x-sas-traits:
  resources:
  - name: tenant
    description: Information about a tenant
    mediaTypes:
    - application/vnd.sas.tenant
    collection: tenants
    resourceId: tenantId
    paginated: true
    sortable: true
    filterable: true
    excludeSummary: true
  - name: service
    description: Information about a (multi-tenant) service
    mediaTypes:
    - application/vnd.sas.tenant.service
    collection: services
    resourceId: serviceId
    paginated: true
    sortable: true
    filterable: true
    excludeOperations:
    - post
    excludeSummary: true
  - name: serviceTenancy
    description: Information about a service for a particular tenant
    mediaTypes:
    - application/vnd.sas.tenant.service.tenancy
    collection: tenancies
    resourceId: tenantId
    paginated: true
    sortable: true
    filterable: true
    excludeOperations:
    - post
    - delete
    excludeSummary: true
tags:
- name: Tenants
  description: The operations for the tenants resource.
- name: Services
  description: The operations for the services resource.
- name: Service Tenancies
  description: The operations for the service tenancies resource.
- name: Root
  description: The operations for the root resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json;version=1:
              schema:
                $ref: "#/components/schemas/api"
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
    head:
      tags:
      - Root
      summary: Get the headers for the API
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded.
  /tenants:
    get:
      summary: Get a collection of tenants
      description: "Returns a collection of tenants based on the specified pagination,\
        \ filtering, and sorting options. The items in the collection use the `application/vnd.sas.tenant+json`\
        \ media type."
      operationId: getTenants
      tags:
      - Tenants
      parameters:
      - name: start
        in: query
        description: The index of the first item to return. The default value is 0.
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The maximum number of items to return. The default value is 10.
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: "The criteria for sorting the items. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)."
        schema:
          type: string
      - name: filter
        in: query
        description: "The criteria for filtering the items. See [Filtering in REST\
          \ APIs](https://developer.sas.com/apis/rest/Topics/#filters)."
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/tenantCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/tenantCollection"
    head:
      summary: Check if tenant collection exists
      description: Determine if the collection of tenants exists.
      operationId: headersForTenants
      tags:
      - Tenants
      parameters:
      - name: start
        in: query
        description: The index of the first item to return. The default value is 0.
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The maximum number of items to return. The default value is 10.
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: "The criteria for sorting the items. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)."
        schema:
          type: string
      - name: filter
        in: query
        description: "The criteria for filtering the items. See [Filtering in REST\
          \ APIs](https://developer.sas.com/apis/rest/Topics/#filters)."
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
    post:
      summary: Create a new tenant
      description: |-
        Creates a new tenant based on the representation in the request body and then creates the tenant's goal.
        The `name`, `description` and `accessPolicy` properties are optional. If not specified, `name` will be set to the value of the `id` property.
        `accessPolicy` will always be set to `providerTenantUsersOnly`. It can be changed to `allUsers` after the `state` property for the tenant's goal has been set to `onboarded`. Though, clients may want to wait until the `state` property for the tenant's goal result is also `onboarded`.
        The `state` property for the goal will be initialized to `undefined`.
      operationId: createTenant
      requestBody:
        content:
          application/vnd.sas.tenant+json:
            schema:
              $ref: "#/components/schemas/createTenant"
          application/json:
            schema:
              $ref: "#/components/schemas/createTenant"
        description: The representation of a tenant.
        required: true
      tags:
      - Tenants
      responses:
        "201":
          description: A tenant was created.
          headers:
            ETag:
              description: The entity tag for the tenant.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format\
                \ when the tenant was last modified."
              schema:
                type: string
            Location:
              description: The URL of the tenant.
              schema:
                type: string
          content:
            application/vnd.sas.tenant+json:
              schema:
                $ref: "#/components/schemas/tenant"
            application/json:
              schema:
                $ref: "#/components/schemas/tenant"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.empty:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "409":
          description: The requested ID conflicts with an existing tenant.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.empty:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  "/tenants/{tenantId}":
    parameters:
    - name: tenantId
      in: path
      description: The unique identifier for the tenant.
      required: true
      schema:
        type: string
    get:
      summary: Get a tenant
      description: "Returns the representation of the specified tenant. A tenant resource\
        \ is created using `POST /tenants` and deleted using `DELETE /tenants/{tenantId}`."
      operationId: getTenant
      tags:
      - Tenants
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the tenant.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format\
                \ when the tenant was last modified."
              schema:
                type: string
          content:
            application/vnd.sas.tenant+json:
              schema:
                $ref: "#/components/schemas/tenant"
            application/json:
              schema:
                $ref: "#/components/schemas/tenant"
        "404":
          description: No tenant exists at the requested path.
    head:
      summary: Get the headers for a tenant
      description: Returns the headers for the specified tenant. Also used to determine
        whether a particular tenant exists.
      operationId: headersForTenant
      tags:
      - Tenants
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the tenant.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format\
                \ when the tenant was last modified."
              schema:
                type: string
        "404":
          description: No tenant exists at the requested path.
    put:
      summary: Update a tenant
      description: "Updates the specified tenant based on the representation in the\
        \ request body. Only the `name`, `description`, and `accessPolicy` properties\
        \ may be updated."
      operationId: updateTenant
      parameters:
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the tenant.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: "The timestamp obtained from the most recent `Last-Modified`\
          \ response header. Ignored when `If-Match` is specified, otherwise must\
          \ match the timestamp when the tenant was last modified."
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.tenant+json:
            schema:
              $ref: "#/components/schemas/updateTenant"
          application/json:
            schema:
              $ref: "#/components/schemas/updateTenant"
        description: The representation of a tenant.
        required: true
      tags:
      - Tenants
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the tenant.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format\
                \ when the tenant was last modified."
              schema:
                type: string
          content:
            application/vnd.sas.tenant+json:
              schema:
                $ref: "#/components/schemas/tenant"
            application/json:
              schema:
                $ref: "#/components/schemas/tenant"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.empty:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No tenant exists at the requested path.
        "409":
          description: The requested accessPolicy conflicts with the state of the
            tenant's goal.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.empty:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "412":
          description: "The values for the request header field `If-Match` and the\
            \ resource's entity tag are not the same, or the request header field\
            \ `If-Unmodified-Since` has an earlier value than the resource's last-modified\
            \ timestamp."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: "One of the following request header fields is required: `If-Match`\
            \ or `If-Unmodified-Since`."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      summary: Delete a tenant
      description: "Deletes the specified tenant and its goal and goal result, as\
        \ well as any associated service tenancies."
      operationId: deleteTenant
      tags:
      - Tenants
      responses:
        "204":
          description: The tenant was deleted.
        "404":
          description: No tenant exists at the requested path.
        "409":
          description: The tenant was not deleted because it is not offboarded.
  "/tenants/{tenantId}/goal":
    parameters:
    - name: tenantId
      in: path
      description: The unique identifier for the tenant.
      required: true
      schema:
        type: string
    get:
      summary: Get a tenant's goal
      description: "Returns the representation of the specified tenant's goal. A goal\
        \ is automatically created when a tenant is created and deleted when a tenant\
        \ is deleted. The possible values for the `state` property are `onboarded`,\
        \ `offboarded`, and `undefined`."
      operationId: getTenantGoal
      tags:
      - Tenants
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the goal.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format\
                \ when the goal was last modified."
              schema:
                type: string
          content:
            application/vnd.sas.tenant.goal+json:
              schema:
                $ref: "#/components/schemas/tenantGoal"
            application/json:
              schema:
                $ref: "#/components/schemas/tenantGoal"
        "404":
          description: No goal exists at the requested path.
    head:
      summary: Get the headers for a tenant's goal
      description: Returns the headers for the specified tenant's goal. Also used
        to determine whether a particular tenant's goal exists.
      operationId: headersForTenantGoal
      tags:
      - Tenants
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the goal.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format\
                \ when the goal was last modified."
              schema:
                type: string
        "404":
          description: No goal exists at the requested path.
    put:
      summary: Update a tenant's goal
      description: |-
        Updates the specified tenant's goal based on the representation in the request body.
        Only the `state` property may be updated. Valid `state` values for update are `onboarded` and `offboarded`.
        The first time that the goal `state` is modified a set of service tenancies will be created for this tenant for all currently registered services. The `state` property for each new service tenancy will be initialized to `undefined`.
      operationId: updateTenantGoal
      parameters:
      - name: If-Match
        in: header
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the goal.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: "The timestamp obtained from the most recent `Last-Modified`\
          \ response header. Ignored when `If-Match` is specified, otherwise must\
          \ match the timestamp when the goal was last modified."
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.tenant.goal+json:
            schema:
              $ref: "#/components/schemas/updateTenantGoal"
          application/json:
            schema:
              $ref: "#/components/schemas/updateTenantGoal"
        description: The representation of a goal.
        required: true
      tags:
      - Tenants
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the goal.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format\
                \ when the goal was last modified."
              schema:
                type: string
          content:
            application/vnd.sas.tenant.goal+json:
              schema:
                $ref: "#/components/schemas/tenantGoal"
            application/json:
              schema:
                $ref: "#/components/schemas/tenantGoal"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json;version=2:
              schema:
                $ref: "#/components/schemas/error2"
            application/vnd.sas.empty:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No goal exists at the requested path.
        "412":
          description: "The values for the request header field `If-Match` and the\
            \ resource's entity tag are not the same, or the request header field\
            \ `If-Unmodified-Since` has an earlier value than the resource's last-modified\
            \ timestamp."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: "One of the following request header fields is required: `If-Match`\
            \ or `If-Unmodified-Since`."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  "/tenants/{tenantId}/goalResult":
    parameters:
    - name: tenantId
      in: path
      description: The unique identifier for the tenant.
      required: true
      schema:
        type: string
    get:
      summary: Get a tenant's goal result
      description: "Returns the representation for the specified tenant's goal result.\
        \ A goal result is automatically created when a tenant is created and deleted\
        \ when a tenant is deleted. The value returned for the `state` property will\
        \ be a function of the state of the tenant's goal and the tenant's service\
        \ tenancies. If the goal's state is `onboarded` then the goal result's state\
        \ will be `onboarded` if all service tenancy states for the tenant are `onboarded`,\
        \ `onboardingFailed` if any service tenancy state for the tenant is `onboardingFailed`,\
        \ and `onboarding` otherwise. If the goal's state is `offboarded` then the\
        \ goal result's state will be `offboarded` if all service tenancy states for\
        \ the tenant are `offboarded`, `offboardingFailed` if any service tenancy\
        \ state for the tenant is `offboardingFailed`, and `offboarding` otherwise.\
        \ If the goal's state is `undefined` then the goal result's state will be\
        \ `undefined`."
      operationId: getTenantGoalResult
      tags:
      - Tenants
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.tenant.goal.result+json:
              schema:
                $ref: "#/components/schemas/tenantGoalResult"
            application/json:
              schema:
                $ref: "#/components/schemas/tenantGoalResult"
        "404":
          description: No goal result exists at the requested path.
    head:
      summary: Get the headers for a tenant's goal result
      description: Returns the headers for the specified tenant's goal result. Also
        used to determine whether a particular tenant's goal result exists.
      operationId: headersForTenantGoalResult
      tags:
      - Tenants
      responses:
        "200":
          description: The request succeeded.
        "404":
          description: No goal result exists at the requested path.
  "/tenants/{tenantId}/tenancies":
    parameters:
    - name: tenantId
      in: path
      description: The unique identifier for the tenant.
      required: true
      schema:
        type: string
    get:
      summary: Get service tenancies for a tenant
      description: |-
        Returns a collection of service tenancies for the specified tenant based on the specified pagination, filtering, and sorting options. The items in the collection use the `application/vnd.sas.tenant.service.tenancy+json` media type.
        The response items will NOT contain any transition link relations, such as `start` or `repeat`.
      operationId: getServiceTenanciesForTenant
      tags:
      - Tenants
      parameters:
      - name: start
        in: query
        description: The index of the first item to return. The default value is 0.
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The maximum number of items to return. The default value is 10.
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: "The criteria for sorting the items. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)."
        schema:
          type: string
      - name: filter
        in: query
        description: "The criteria for filtering the items. See [Filtering in REST\
          \ APIs](https://developer.sas.com/apis/rest/Topics/#filters)."
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/serviceTenancyCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/serviceTenancyCollection"
        "404":
          description: No service tenancies collection exists at the requested path.
    head:
      summary: Check if services tenancies for the specified tenant exists
      description: Determine if the collection of service tenancies for the specified
        tenant exists.
      operationId: headersForServiceTenanciesForTenant
      tags:
      - Tenants
      parameters:
      - name: start
        in: query
        description: The index of the first item to return. The default value is 0.
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The maximum number of items to return. The default value is 10.
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: "The criteria for sorting the items. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)."
        schema:
          type: string
      - name: filter
        in: query
        description: "The criteria for filtering the items. See [Filtering in REST\
          \ APIs](https://developer.sas.com/apis/rest/Topics/#filters)."
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
        "404":
          description: No service tenancies collection exists at the requested path.
  /services:
    get:
      summary: Get a collection of services
      description: "Returns a collection of services based on the specified pagination,\
        \ filtering, and sorting options. The items in the collection use the `application/vnd.sas.tenant.service+json`\
        \ media type."
      operationId: getServices
      tags:
      - Services
      parameters:
      - name: start
        in: query
        description: The index of the first item to return. The default value is 0.
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The maximum number of items to return. The default value is 10.
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: "The criteria for sorting the items. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)."
        schema:
          type: string
      - name: filter
        in: query
        description: "The criteria for filtering the items. See [Filtering in REST\
          \ APIs](https://developer.sas.com/apis/rest/Topics/#filters)."
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/serviceCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/serviceCollection"
    head:
      summary: Check if service collection exists
      description: Determine if the collection of services exists.
      operationId: headersForServices
      tags:
      - Services
      parameters:
      - name: start
        in: query
        description: The index of the first item to return. The default value is 0.
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The maximum number of items to return. The default value is 10.
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: "The criteria for sorting the items. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting)."
        schema:
          type: string
      - name: filter
        in: query
        description: "The criteria for filtering the items. See [Filtering in REST\
          \ APIs](https://developer.sas.com/apis/rest/Topics/#filters)."
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
  "/services/{serviceId}":
    parameters:
    - name: serviceId
      in: path
      description: The unique identifier for the service.
      required: true
      schema:
        type: string
    get:
      summary: Get a service
      description: "Returns the representation for the specified service. A service\
        \ resource is created using PUT /services/{serviceId} and deleted using DELETE\
        \ /services/{serviceId}."
      operationId: getService
      tags:
      - Services
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the service.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format\
                \ when the service was last modified."
              schema:
                type: string
          content:
            application/vnd.sas.tenant.service+json:
              schema:
                $ref: "#/components/schemas/service"
            application/json:
              schema:
                $ref: "#/components/schemas/service"
        "404":
          description: No service exists at the requested path.
    head:
      summary: Get the headers for a service
      description: Returns the headers for the specified service. Also used to determine
        whether a particular service exists.
      operationId: headersForService
      tags:
      - Services
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the service.
              schema:
                type: string
            Last-Modified:
              description: "The timestamp in `EEE, dd MMM yyyy HH:mm:ss GMT` format\
                \ when the service was last modified."
              schema:
                type: string
        "404":
          description: No service exists at the requested path.
    put:
      summary: Create a new service or update an existing one
      description: |-
        Creates a new service or updates an existing one based on the representation in the request body.
