components:
  schemas:
    api:
      type: object
      description: The links array member contains links to the top-level resources
        in the API.
      required:
      - version
      properties:
        version:
          type: integer
          description: |
            This media type's schema version number. This representation is
            version 1.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: |
            Zero or more link objects. See the above link relations table for a
            description of the link types.
    link:
      type: object
      description: A link to another resource.
      required:
      - rel
      - method
      properties:
        rel:
          type: string
          description: |
            The link relation: a mnemonic string which indicates the meaning of
            this link. Use standard IANA link relations where appropriate; SAS
            custom link relations must be lowerCamelCase identifiers. This is
            not a user-visible (UI) string.
        method:
          type: string
          description: >
            The HTTP method, one of GET, HEAD, PUT, POST, PATCH, DELETE
            (although we typically do not list HEAD links in link collections.)
        uri:
          type: string
          description: |
            The URI of the target resource,relative to the root of the API. Must
            start with /. One of uri or href is required.
        href:
          type: string
          description: |
            The full URL. Must start with /. One of uri or href is required.
        title:
          type: string
          description: |
            The human-readable title of this link.
        type:
          type: string
          description: |
            The primary link type. Required except for DELETE links.
        itemType:
          type: string
          description: |
            Optional; used if the link type is a collection.
        responseType:
          type: string
          description: |
            Optional; used if response content type is not the
            same as the request content type.
        responseItemType:
          type: string
          description: |
            Optional; used if the items in the response
            body is not the same as the item type of the request body.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    error2:
      type: object
      description: A standard error object.
      required:
      - version
      properties:
        version:
          type: integer
          description: |
            Version information for this error format (integer, value 2).
          default: 2
        id:
          type: string
          description: |
            Optional error identifier string.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: |
            A list of vnd.sas.link objects as per Link representation.
        errorCode:
          type: integer
          format: int64
          description: |
            The system error code for reference (64-bit integer), often used for
            correlation with back-end service error message identifiers.
            Services should reserve a range in error code ranges and list
            specific error codes in error codes.
        httpStatusCode:
          type: integer
          description: |
            The HTTP status code error number (integer), 1xx, 2xx, 3xx, 4xx, or
            5xx values.
        message:
          type: string
          description: |
            The back end system error message string. The message should be
            localized as per the Accept-Language of the request.
        details:
          type: array
          items:
            type: string
          description: |
            Detailed information specific to this error; a list of strings. If
            appropriate, these strings should be localized as per the
            Accept-Language of the request.
        remediation:
          type: array
          items:
            type: string
          description: |
            Recommended actions to resolve the error; a list of strings. The
            remediation string should be localized as per the Accept-Language of
            the request.
        errors:
          type: array
          items:
            type: string
          description: |
            An array of nested error objects.
    tenantCollection:
      title: Tenant Collection
      description: A collection of tenant representations.
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
