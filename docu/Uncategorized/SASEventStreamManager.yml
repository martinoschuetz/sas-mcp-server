---
openapi: 3.0.3
info:
  title: Event Stream Manager
  description: The Event Stream Manager API provides programmatic access to deployment
    and monitoring capabilities within SAS Event Stream Manager.  It allows users
    to perform operations such as creating and deleting deployments, managing ESP
    servers, and deploying and monitoring projects.
  version: '4'
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: https://example.com/SASEventStreamManager/v4
  description: This is an example of a base URL.
tags:
- name: Deployment Definition
  description: Contains the operations for creating, editing, and deleting deployments.
- name: Cluster Deployment
  description: Contains the operations for managing ESP servers and projects that
    run in a Kubernetes cluster. The ESP servers and projects are associated with
    a deployment whose type is cluster.
- name: Edge Deployment
  description: Contains the operations for managing ESP servers and projects that
    run on edge servers. The ESP servers and projects are associated with a deployment
    whose type is edge.
- name: Project
  description: Contains the operations for returning details of projects.
- name: Edge Server
  description: Contains the operations for managing ESP servers.
- name: Job
  description: Contains the operations for returning details of running jobs.
- name: Project Promotion
  description: Contains the operations for managing project promotion.
- name: Pod
  description: Contains the operations for querying pods that are running in a Kubernetes
    cluster.
- name: Root
  description: Contains the operations for the root resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      operationId: root
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              description: The media type for the response (application/vnd.sas.api+json).
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/rootResponse200"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example:
                  $ref: "#/components/examples/rootResponse200"
  /deployments:
    get:
      summary: Get all deployments
      description: Returns a list of all deployments, including details of the deployments
        such as assigned ESP servers and running projects.
      operationId: getListDeployments
      parameters:
      - description: The maximum number of records to be returned.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
          minimum: 1
          maximum: 10000
      - description: The number of the first record to be returned.
        in: query
        name: start
        required: false
        schema:
          default: 0
          format: int64
          type: integer
          minimum: 0
      - description: When `true`, details of servers and projects are not included
        in: query
        name: noDetails
        required: false
        schema:
          default: false
          type: boolean
      - description: If this parameter is set to `production`, then only production
          deployments are returned. If this parameter is set to `test`, then only
          non-production deployments are returned. Otherwise, deployments are returned
          regardless of their production status.
        in: query
        name: suitableFor
        required: false
        schema:
          type: string
          enum:
          - production
          - test
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/resourceCollectionDeploymentRepresentation'
              schema:
                $ref: '#/components/schemas/resourceCollectionDeploymentRepresentation'
            application/vnd.sas.collection+json:
              examples:
                example:
                  $ref: '#/components/examples/resourceCollectionDeploymentRepresentation'
              schema:
                $ref: '#/components/schemas/resourceCollectionDeploymentRepresentation'
          description: The request succeeded.
      tags:
      - Deployment Definition
    post:
      summary: Create a deployment
      description: Creates a deployment of type edge or cluster, to manage ESP servers
        and projects.
      operationId: createDeployment
      requestBody:
        content:
          application/json:
            examples:
              clusterExample:
                $ref: '#/components/examples/createClusterDeploymentRepresentation'
              edgeExample:
                $ref: '#/components/examples/createDeploymentRepresentation'
            schema:
              $ref: '#/components/schemas/createDeploymentRepresentation'
          application/vnd.sas.esp.deployment+json:
            examples:
              clusterExample:
                $ref: '#/components/examples/createClusterDeploymentRepresentation'
              edgeExample:
                $ref: '#/components/examples/createDeploymentRepresentation'
            schema:
              $ref: '#/components/schemas/createDeploymentRepresentation'
        required: true
      responses:
        '201':
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              examples:
                clusterExample:
                  $ref: '#/components/examples/deploymentClusterRepresentation'
                edgeExample:
                  $ref: '#/components/examples/deploymentRepresentation'
              schema:
                $ref: '#/components/schemas/deploymentRepresentation'
            application/vnd.sas.esp.deployment+json:
              examples:
                clusterExample:
                  $ref: '#/components/examples/deploymentClusterRepresentation'
                edgeExample:
                  $ref: '#/components/examples/deploymentRepresentation'
              schema:
                $ref: '#/components/schemas/deploymentRepresentation'
          description: The request succeeded.
        '400':
          $ref: '#/components/responses/errorResponse400'
      tags:
      - Deployment Definition
  /deployments/{deploymentName}:
    delete:
      summary: Delete a deployment
      description: Deletes a specific deployment identified by its name.
      operationId: deleteDeleteDeployment
      parameters:
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      responses:
        '204':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          description: The request succeeded.
      tags:
      - Deployment Definition
    get:
      summary: Get a deployment
      description: Retrieves a specific deployment identified by its name.
      operationId: getDeployment
      parameters:
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/deploymentRepresentation'
              schema:
                $ref: '#/components/schemas/deploymentRepresentation'
            application/vnd.sas.esp.deployment+json:
              examples:
                example:
                  $ref: '#/components/examples/deploymentRepresentation'
              schema:
                $ref: '#/components/schemas/deploymentRepresentation'
          description: The request succeeded.
      tags:
      - Deployment Definition
    patch:
      summary: Update a specific deployment
      description: Updates a specific deployment identified by its name. An updated
        deployment representation is returned.
      operationId: patchDeployment
      parameters:
      - in: header
        name: If-Unmodified-Since
        description: If-Unmodified-Since
        required: false
        schema:
          format: HTTP-date
          type: string
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.esp.update-deployment+json:
            examples:
              example:
                $ref: '#/components/examples/updateDeploymentRepresentation'
            schema:
              $ref: '#/components/schemas/updateDeploymentRepresentation'
          application/json:
            examples:
              example:
                $ref: '#/components/examples/updateDeploymentRepresentation'
            schema:
              $ref: '#/components/schemas/updateDeploymentRepresentation'
        required: true
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/deploymentRepresentation'
              schema:
                $ref: '#/components/schemas/deploymentRepresentation'
            application/vnd.sas.esp.deployment+json:
              examples:
                example:
                  $ref: '#/components/examples/deploymentRepresentation'
              schema:
                $ref: '#/components/schemas/deploymentRepresentation'
          description: The request succeeded.
        '400':
          $ref: '#/components/responses/errorResponse400'
        '412':
          $ref: '#/components/responses/errorResponse412IfUnmodifiedSince'
        '428':
          $ref: '#/components/responses/errorResponse428PreconditionRequired'
      tags:
      - Deployment Definition
    head:
      summary: Check if a deployment exists
      description: Returns header information about a specific deployment identified
        by its name.
      operationId: headersForGetDeployment
      parameters:
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          description: The request succeeded.
      tags:
      - Deployment Definition
  /deployments/{deploymentName}/edgeServers:
    get:
      summary: Get ESP servers for the specified deployment
      description: Returns a list of ESP servers that are associated with the specified
        deployment.
      operationId: getAssets
      parameters:
      - description: The maximum number of records to be returned.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
          minimum: 1
          maximum: 10000
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      - description: The number of the first record to be returned.
        in: query
        name: start
        required: false
        schema:
          default: 0
          format: int64
          type: integer
          minimum: 0
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/resourceCollectionEsmEspServerRepresentation'
              schema:
                $ref: '#/components/schemas/resourceCollectionEsmEspServerRepresentation'
            application/vnd.sas.collection+json:
              examples:
                example:
                  $ref: '#/components/examples/resourceCollectionEsmEspServerRepresentation'
              schema:
                $ref: '#/components/schemas/resourceCollectionEsmEspServerRepresentation'
          description: The request succeeded.
      tags:
      - Edge Deployment
    post:
      summary: Add ESP servers to the specified deployment
      description: Adds ESP servers to the specified deployment. Provides a list of
        names of existing ESP servers to be added.
      operationId: createServersToDeployment
      parameters:
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      - in: header
        name: If-Unmodified-Since
        description: If-Unmodified-Since
        required: false
        schema:
          format: HTTP-date
          type: string
      requestBody:
        content:
          application/vnd.sas.esp.update-deployment-server-list+json:
            examples:
              example:
                $ref: '#/components/examples/updateDeploymentServerListRepresentation'
            schema:
              $ref: '#/components/schemas/updateDeploymentServerListRepresentation'
          application/json:
            examples:
              example:
                $ref: '#/components/examples/updateDeploymentServerListRepresentation'
            schema:
              $ref: '#/components/schemas/updateDeploymentServerListRepresentation'
        required: true
      responses:
        '201':
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Content-Type:
              $ref: '#/components/headers/ContentType'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/deploymentRepresentation'
              schema:
                items:
                  $ref: '#/components/schemas/deploymentRepresentation'
            application/vnd.sas.esp.deployment+json:
              examples:
                example:
                  $ref: '#/components/examples/deploymentRepresentation'
              schema:
                $ref: '#/components/schemas/deploymentRepresentation'
          description: The request succeeded.
        '400':
          $ref: '#/components/responses/errorResponse400'
        '412':
          $ref: '#/components/responses/errorResponse412IfUnmodifiedSince'
        '428':
          $ref: '#/components/responses/errorResponse428PreconditionRequired'
      tags:
      - Edge Deployment
    patch:
      summary: Remove ESP servers from the associated deployment
      description: Removes ESP servers from the associated deployment. Provides a
        list of names of existing ESP servers to be removed.
      operationId: patchRemoveServersFromDeployment
      parameters:
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      - in: header
        name: If-Unmodified-Since
        description: If-Unmodified-Since
        required: false
        schema:
          format: HTTP-date
          type: string
      - in: query
        name: forceRemoval
        description: When this parameter is set to `true`, all ESP servers are removed,
          including ESP servers that have running projects. When this parameter is
          set to `false`, if there are any ESP servers that have running projects,
          then no ESP servers are removed.
        required: false
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/vnd.sas.esp.update-deployment-server-list+json:
            examples:
              example:
                $ref: '#/components/examples/updateDeploymentServerListRepresentation'
            schema:
              $ref: '#/components/schemas/updateDeploymentServerListRepresentation'
          application/json:
            examples:
              example:
                $ref: '#/components/examples/updateDeploymentServerListRepresentation'
            schema:
              $ref: '#/components/schemas/updateDeploymentServerListRepresentation'
        required: true
      responses:
        '200':
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Content-Type:
              $ref: '#/components/headers/ContentType'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/deploymentRepresentation'
              schema:
                items:
                  $ref: '#/components/schemas/deploymentRepresentation'
            application/vnd.sas.esp.deployment+json:
              examples:
                example:
                  $ref: '#/components/examples/deploymentRepresentation'
              schema:
                $ref: '#/components/schemas/deploymentRepresentation'
          description: The request succeeded.
        '400':
          $ref: '#/components/responses/errorResponse400'
        '412':
          $ref: '#/components/responses/errorResponse412IfUnmodifiedSince'
        '428':
          $ref: '#/components/responses/errorResponse428PreconditionRequired'
      tags:
      - Edge Deployment
    head:
      summary: Check if ESP servers exist for the specified deployment
      description: Returns header information about ESP servers that are associated
        with the specified deployment.
      operationId: headersForGetAssets
      parameters:
      - description: The maximum number of records to be returned.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
          minimum: 1
          maximum: 10000
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      - description: The number of the first record to be returned.
        in: query
        name: start
        required: false
        schema:
          default: 0
          format: int64
          type: integer
          minimum: 0
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          description: The request succeeded.
      tags:
      - Edge Deployment
  /deployments/{deploymentName}/edgeServers/{serverName}/projects:
    post:
      summary: Deploy a project to an ESP server
      description: Deploys a project to an ESP server. Returns information about the
        job that processes the request.
      operationId: createDeployProjectOnEdge
      parameters:
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      - in: path
        name: serverName
        description: The name of the ESP server.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.esp.deploy-edge+json:
            examples:
              minimalConfigurationToRunOnEdgeDeployment:
                $ref: '#/components/examples/minimalConfigurationToRunOnEdgeDeployment'
            schema:
              $ref: '#/components/schemas/deployEdgeRepresentation'
          application/json:
            examples:
              minimalConfigurationToRunOnEdgeDeployment:
                $ref: '#/components/examples/minimalConfigurationToRunOnEdgeDeployment'
            schema:
              $ref: '#/components/schemas/deployEdgeRepresentation'
        required: true
      responses:
        '201':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/vnd.sas.esp.job-representation+json:
              examples:
                example:
                  $ref: '#/components/examples/jobRepresentation'
              schema:
                $ref: '#/components/schemas/jobRepresentation'
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/jobRepresentation'
              schema:
                $ref: '#/components/schemas/jobRepresentation'
          description: The request succeeded.
        '400':
          $ref: '#/components/responses/errorResponse400'
        '404':
          $ref: '#/components/responses/errorResponse404'
      tags:
      - Edge Deployment
    get:
      summary: Get a list of projects that run on an ESP server
      description: Returns a list of projects that run on the specified ESP server
        and are associated with the specified deployment.
      operationId: getDeploymentProjects
      parameters:
      - description: The maximum number of records to be returned.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
          minimum: 1
          maximum: 10000
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      - description: The number of the first record to be returned.
        in: query
        name: start
        required: false
        schema:
          default: 0
          format: int64
          type: integer
          minimum: 0
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      - in: path
        name: serverName
        description: The name of the ESP server.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/resourceCollectionRunningProjectRepresentation'
              schema:
                $ref: '#/components/schemas/resourceCollectionRunningProjectRepresentation'
            application/vnd.sas.collection+json:
              examples:
                example:
                  $ref: '#/components/examples/resourceCollectionRunningProjectRepresentation'
              schema:
                $ref: '#/components/schemas/resourceCollectionRunningProjectRepresentation'
          description: The request succeeded.
      tags:
      - Edge Deployment
    head:
      summary: Check if projects exist on an ESP server
      description: Returns header information about projects that run on the specified
        ESP server and are associated with the specified deployment.
      operationId: headersForGetDeploymentProject
      parameters:
      - description: The maximum number of records to be returned.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
          minimum: 1
          maximum: 10000
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      - description: The number of the first record to be returned.
        in: query
        name: start
        required: false
        schema:
          default: 0
          format: int64
          type: integer
          minimum: 0
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      - in: path
        name: serverName
        description: The name of the ESP server.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          description: The request succeeded.
      tags:
      - Edge Deployment
  /deployments/{deploymentName}/edgeServers/{serverName}/projects/{projectName}:
    get:
      summary: Get a project on the specified ESP server for the specified deployment
      description: Returns a project that runs on the specified ESP server and is
        associated with the specified deployment.
      operationId: getServerProjects
      parameters:
      - description: The maximum number of records to be returned.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
          minimum: 1
          maximum: 10000
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      - description: The number of the first record to be returned.
        in: query
        name: start
        required: false
        schema:
          default: 0
          format: int64
          type: integer
          minimum: 0
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      - in: path
        name: serverName
        description: The name of the ESP server.
        required: true
        schema:
          type: string
      - in: path
        name: projectName
        description: The name of the ESP project.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/runningProjectRepresentation'
              schema:
                $ref: '#/components/schemas/runningProjectRepresentation'
            application/vnd.sas.esp.running-project+json:
              examples:
                example:
                  $ref: '#/components/examples/runningProjectRepresentation'
              schema:
                $ref: '#/components/schemas/runningProjectRepresentation'
          description: The request succeeded.
      tags:
      - Edge Deployment
    head:
      summary: Check if a project exists on the ESP server
      description: Returns header information about a project that runs on the specified
        ESP server and is associated with the specified deployment.
      operationId: headersForServerProjects
      parameters:
      - description: The maximum number of records to be returned.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          type: integer
          minimum: 1
          maximum: 10000
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      - description: The number of the first record to be returned.
        in: query
        name: start
        required: false
        schema:
          default: 0
          format: int64
          type: integer
          minimum: 0
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      - in: path
        name: serverName
        description: The name of the ESP server.
        required: true
        schema:
          type: string
      - in: path
        name: projectName
        description: The name of the ESP project.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          description: The request succeeded.
      tags:
      - Edge Deployment
    delete:
      summary: Delete a project from the specified ESP server and deployment
      description: Deletes a project from the specified ESP server and deployment.
      operationId: deleteDeploymentServerProject
      parameters:
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      - in: path
        name: serverName
        description: The name of the ESP server.
        required: true
        schema:
          type: string
      - in: path
        name: projectName
        description: The name of the ESP project.
        required: true
        schema:
          type: string
      responses:
        '204':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          description: The request succeeded.
      tags:
      - Edge Deployment
  /deployments/{deploymentName}/clusterServers:
    post:
      summary: Deploy a project to the Kubernetes cluster
      description: Deploys a project to the Kubernetes cluster. An ESP server is created
        on demand in the Kubernetes cluster. Returns information about the job that
        processes the request.
      operationId: createDeployProjectOnCluster
      parameters:
      - in: path
        name: deploymentName
        description: The name of the deployment.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.esp.deploy-cluster+json:
            examples:
              minimalConfigurationToRunOnClusterDeployment:
                $ref: '#/components/examples/minimalConfigurationToRunOnClusterDeployment'
              advancedConfigurationToRunOnClusterDeployment:
                $ref: '#/components/examples/advancedConfigurationToRunOnClusterDeployment'
            schema:
              $ref: '#/components/schemas/deployClusterRepresentation'
          application/json:
            examples:
              minimalConfigurationToRunOnClusterDeployment:
                $ref: '#/components/examples/minimalConfigurationToRunOnClusterDeployment'
              advancedConfigurationToRunOnClusterDeployment:
                $ref: '#/components/examples/advancedConfigurationToRunOnClusterDeployment'
            schema:
