      - description: The maximum number of records to be returned.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          minimum: 1
          maximum: 10000
          format: int32
          type: integer
      - description: The number of the first record to be returned.
        in: query
        name: start
        required: false
        schema:
          default: 0
          format: int64
          type: integer
          minimum: 0
      - in: query
        name: filter
        description: A filter expression for filtering servers.
        required: false
        schema:
          default: ''
          type: string
          example: deploymentId='097a507e-3e00-4646-98ba-0d11fe724f3a'
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/resourceCollectionEsmEspServerRepresentation'
              schema:
                $ref: '#/components/schemas/resourceCollectionEsmEspServerRepresentation'
            application/vnd.sas.collection+json:
              examples:
                example:
                  $ref: '#/components/examples/resourceCollectionEsmEspServerRepresentation'
              schema:
                $ref: '#/components/schemas/resourceCollectionEsmEspServerRepresentation'
          description: The request succeeded.
      tags:
      - Edge Server
    post:
      summary: Add ESP server details
      description: Adds information about an ESP server.
      operationId: createRegisterServer
      requestBody:
        content:
          application/vnd.sas.esp.esp-server+json:
            examples:
              example:
                $ref: '#/components/examples/createServerRepresentation'
            schema:
              $ref: '#/components/schemas/createServerRepresentation'
          application/json:
            examples:
              example:
                $ref: '#/components/examples/createServerRepresentation'
            schema:
              $ref: '#/components/schemas/createServerRepresentation'
        required: true
      responses:
        '201':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/vnd.sas.esp.esp-server+json:
              examples:
                example:
                  $ref: '#/components/examples/esmEspServerRepresentation'
              schema:
                $ref: '#/components/schemas/esmEspServerRepresentation'
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/esmEspServerRepresentation'
              schema:
                $ref: '#/components/schemas/esmEspServerRepresentation'
          description: The request succeeded.
        '400':
          $ref: '#/components/responses/errorResponse400'
      tags:
      - Edge Server
  /edgeServers/{serverName}:
    delete:
      summary: Delete ESP server details
      description: Deletes the information about an ESP server identified by its name.
        This endpoint is valid only for ESP servers that are running on edge servers
        and have been manually registered to SAS Event Stream Manager.
      operationId: deleteRemoveServer
      parameters:
      - in: path
        name: serverName
        description: The name of the ESP server.
        required: true
        schema:
          type: string
      responses:
        '204':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          description: The request succeeded.
      tags:
      - Edge Server
    get:
      summary: Get ESP server details
      description: Retrieves the information about a specific ESP server identified
        by its name.
      operationId: getServer
      parameters:
      - in: path
        name: serverName
        description: The name of the ESP server.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/vnd.sas.esp.esp-server+json:
              examples:
                example:
                  $ref: '#/components/examples/esmEspServerRepresentation'
              schema:
                $ref: '#/components/schemas/esmEspServerRepresentation'
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/esmEspServerRepresentation'
              schema:
                $ref: '#/components/schemas/esmEspServerRepresentation'
          description: The request succeeded.
      tags:
      - Edge Server
    head:
      summary: Check if an ESP server exists
      description: Returns header information about a specific ESP server identified
        by its name.
      operationId: headersForGetServer
      parameters:
      - in: path
        name: serverName
        description: The name of the ESP server.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers: {}
          description: The request succeeded.
      tags:
      - Edge Server
components:
  headers:
    ContentType:
      description: The response `Content-Type` header from the service.
      schema:
        type: string
    LastModified:
      description: The last modified time.
      schema:
        type: string
    Location:
      description: URL of the created or updated resource.
      schema:
        type: string
  responses:
    errorResponse400:
      description: The request was invalid. Additional information is available in
        the application logs if the environment variable `LOGGING_LEVEL_ORG_SPRINGFRAMEWORK`
        is set to `DEBUG`.
      content:
        application/vnd.sas.error+json:
          examples:
            example:
              $ref: '#/components/examples/errorResponse400'
          schema:
            $ref: '#/components/schemas/errorResponse'
    errorResponse401:
      content:
        application/vnd.sas.error+json:
          examples:
            example:
              $ref: '#/components/examples/errorResponse401'
          schema:
            $ref: '#/components/schemas/errorResponse'
      description: The request is not authenticated.
    errorResponse403:
      content:
        application/vnd.sas.error+json:
          examples:
            example:
              $ref: '#/components/examples/errorResponse403'
          schema:
            $ref: '#/components/schemas/errorResponse'
      description: The user did not have the necessary permissions.
    errorResponse404:
      content:
        application/vnd.sas.error+json:
          examples:
            example:
              $ref: '#/components/examples/errorResponse404'
          schema:
            $ref: '#/components/schemas/errorResponse'
      description: No resource exists at the requested path.
    errorResponse409:
      description: The request could not be completed due to a conflict with the current
        state of the resource.
      content:
        application/vnd.sas.error+json:
          examples:
            example:
              $ref: '#/components/examples/errorResponse409'
          schema:
            $ref: '#/components/schemas/errorResponse'
    errorResponse412IfUnmodifiedSince:
      content:
        application/vnd.sas.error+json:
          examples:
            example:
              $ref: '#/components/examples/errorResponse412IfUnmodifiedSince'
          schema:
            $ref: '#/components/schemas/errorResponse'
      description: The `If-Unmodified-Since` request header did not match the resource's
        last modified timestamp.
    errorResponse412IfMatch:
      content:
        application/vnd.sas.error+json:
          examples:
            example:
              $ref: '#/components/examples/errorResponse412IfMatch'
          schema:
            $ref: '#/components/schemas/errorResponse'
      description: The `If-Match` request header did not match the resource's entity
        tag.
    errorResponse428PreconditionRequired:
      content:
        application/vnd.sas.error+json:
          examples:
            example:
              $ref: '#/components/examples/errorResponse428PreconditionRequired'
          schema:
            $ref: '#/components/schemas/errorResponse'
      description: A precondition header is required.
    errorResponse502:
      description: Bad Gateway. The ESP server was unable to complete the request.
      content:
        application/vnd.sas.error+json:
          examples:
            example:
              $ref: '#/components/examples/errorResponse404'
          schema:
            $ref: '#/components/schemas/errorResponse'
    errorResponse503PackagingOrVersioningNotAvailable:
      description: Functionality for project packages is not enabled, or functionality
        for project versions is not enabled.
      content:
        application/vnd.sas.error+json:
          examples:
            projectPackagingNotEnabled:
              $ref: '#/components/examples/projectPackagingNotEnabled'
            projectVersioningNotEnabled:
              $ref: '#/components/examples/projectVersioningNotEnabled'
          schema:
            $ref: '#/components/schemas/errorResponse'
    errorResponse503PackagingVersioningOrRemoteGitNotAvailable:
      description: Functionality for project packages is not enabled, functionality
        for project versions is not enabled, or functionality for remote Git connections
        is not enabled.
      content:
        application/vnd.sas.error+json:
          examples:
            projectPackagingNotEnabled:
              $ref: '#/components/examples/projectPackagingNotEnabled'
            projectVersioningNotEnabled:
              $ref: '#/components/examples/projectVersioningNotEnabled'
            remoteGitNotEnabled:
              $ref: '#/components/examples/remoteGitNotEnabled'
          schema:
            $ref: '#/components/schemas/errorResponse'
  parameters:
    projectVersionNumberString:
      name: version
      description: The project's version number. The version number must include a
        version and promotion level. Each value must be a non-negative integer, separated
        with a '.' character.
      in: query
      required: true
      schema:
        type: string
      examples:
        versionAndPromotionLevel:
          value: '3.2'
          summary: A major version of 3 and a promotion level of 2
  schemas:
    aggregatedRunningProjectRepresentation:
      description: Aggregated running project representation.
      properties:
        id:
          type: string
        majorVersion:
          format: int32
          type: integer
        minorVersion:
          format: int32
          type: integer
        name:
          type: string
        serverCount:
          items:
            type: string
          type: array
          uniqueItems: true
        statuses:
          additionalProperties:
            format: int32
            type: integer
          type: object
        tagStrings:
          items:
            type: string
          type: array
          uniqueItems: true
          writeOnly: true
        tags:
          items:
            type: string
          type: array
          uniqueItems: true
      type: object
    api:
      description: >-
        The list of links to top-level resources and operations available from the
        root of the API.
      properties:
        links:
          description: The API's top-level links.
          items:
            $ref: '#/components/schemas/link'
          type: array
        version:
          description: The version number of the API representation.
          type: integer
      required:
      - version
      - links
      title: API
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
    clusterProjectConfigurationRepresentation:
      description: A representation of a running ESP project in the Kubernetes cluster.
      properties:
        cpuLimit:
          type: string
        cpuRequested:
          type: string
        environmentVariables:
          additionalProperties:
            type: string
          example:
            key: value
          type: object
        gpuLimit:
          type: string
        gpuRequested:
          type: string
        memoryLimit:
          type: string
        memoryRequested:
          type: string
        replicasLimit:
          type: string
        replicasRequested:
          type: string
      type: object
    deployEdgeRepresentation:
      description: A representation to run an ESP project on a deployment whose type
        is `edge`. If the `projectVersion` property is not supplied, then the latest
        version of the project is used.
      properties:
        projectName:
          type: string
        projectVersion:
          format: int32
          type: integer
      required:
      - projectName
      type: object
    deployClusterRepresentation:
      description: >-
        The `clusterConfiguration` property is optional when deploying to a deployment
        of type `cluster`. If the `projectVersion` property is not supplied, then
        the latest version of the project is used.
      properties:
        clusterConfiguration:
          $ref: '#/components/schemas/clusterProjectServerRepresentation'
        projectName:
          type: string
        projectVersion:
          type: integer
      required:
      - projectName
      type: object
    clusterProjectServerRepresentation:
      description: The configuration settings for running the project in a Kubernetes
        cluster. A representation of the limits for the associated ESP server that
        runs in the Kubernetes cluster.
      properties:
        continuousOperation:
          description: >-
            Specifies whether continuous operation is enabled for the ESP server.
            When continuous operation is enabled, the ESP server does not stop and
            start automatically.
          default: true
          type: boolean
        customEnvironmentVariables:
          additionalProperties:
            type: string
          type: object
        customServerProperties:
          additionalProperties:
            type: string
          type: object
        gpuReliant:
          type: boolean
        loadOnly:
          type: boolean
        settings:
          $ref: '#/components/schemas/clusterUserSettings'
      type: object
    clusterUserSettings:
      description: A user's settings for an ESP server that is running in the Kubernetes
        cluster.
      properties:
        averageUtilization:
          format: int32
          type: integer
        limitsCpu:
          format: float
          minimum: 0
          type: number
        limitsGpu:
          format: int32
          minimum: 0
          type: integer
        limitsMemory:
          pattern: ^(?:\d+\.)?\d+(k|M|G|T|P|E|Ki|Mi|Gi|Ti|Pi|Ei)?$
          type: string
        maxReplicas:
          format: int32
          type: integer
        minReplicas:
          format: int32
          type: integer
        requestsCpu:
          format: float
          minimum: 0
          type: number
        requestsGpu:
          format: int32
          minimum: 0
          type: integer
