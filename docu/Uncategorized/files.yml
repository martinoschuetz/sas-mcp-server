            application/json:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV4Resp:
                  $ref: '#/components/examples/getFilesV4Resp'
        "400":
          description: The request was not valid. A validation error occurred. Check
            the string that was returned in the response for more information. A possible
            cause is that the filename is not specified in the request body.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                nameNotGivenErrResp:
                  $ref: '#/components/examples/fileIdDoNotMatch'
        "403":
          description: "File is quarantined. User does not have permission to read\
            \ the content of file."
