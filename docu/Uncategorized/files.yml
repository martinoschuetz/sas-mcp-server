              schema:
                $ref: "#/components/schemas/error2"
              examples:
                fileNotFoundErrResp:
                  $ref: '#/components/examples/fileNotFoundRrrResponse'
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag or the `If-Unmodified-Since` request header did not match the
            resource's last modified timestamp. Another operation modified the resource.
            Get an updated representation of the resource before trying the request
            again.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                fileAlreadyUpdatedErrResp:
                  $ref: '#/components/examples/fileUpdatedErrResp'
        "428":
          description: The request headers did not include a `If-Match` or `If-Unmodified-Since`
            precondition. Specify the appropriate values for the `If-Unmodified-Since`
            and `If-Match` request headers before trying the request again.
          content:
            application/vnd.sas.error+json:
