        \ change only `quarantine` status. This end-Point is only accessible to SAS\
        \ Administrators."
      tags:
      - Security
      operationId: patchFileResourceQuarantine
      parameters:
      - name: If-Match
        in: header
        description: The entity tag that was obtained from the most recent `ETag`
          response header.
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The timestamp that was obtained from the most recent `Last-Modified`
          response header. This is ignored when `If-Match` is specified.
        schema:
          type: string
      - name: fileId
        in: path
        description: The identifier of the file resource to update.
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/quarantineFileToPatch"
      responses:
        "200":
          description: "The request succeeded. The updates were applied, and the new\
            \ object data is returned in the response body."
          headers:
            ETag:
              description: The entity tag for current resource.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the resource.
              schema:
                type: string
          content:
            application/vnd.sas.file+json:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV4Resp:
                  $ref: '#/components/examples/getFilesV4Resp'
            application/vnd.sas.file+json;version=4:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
