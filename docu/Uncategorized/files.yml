  "/files/{fileId}/version/{fileVersion}/content":
    get:
      summary: Get the file resource content for a specified version
      description: Retrieves the content of the file resource for a specified version.
      tags:
      - Files
      operationId: getfileContentForGivenVersion
      parameters:
      - name: fileId
        in: path
        description: The identifier of the file resource for which to fetch content.
        required: true
        schema:
          type: string
      - name: fileVersion
        in: path
        description: The version of the file resource for which to fetch content.
        required: true
        schema:
          type: string
      - name: changeContentDisposition
        in: query
        description: 'Specifies whether to use the persisted content-disposition value.
          If this is specified to true and the word "attachment" appears in the content-disposition,
          it is changed to "inline". No other changes are made to the content-disposition
          value.'
        required: false
        schema:
          type: boolean
      - name: If-Range
        in: header
        description: "A conditional range request. The client must specify the previously\
          \ returned `ETag` as the `If-Range` header value. This determines whether\
          \ the resource has been modified. If it has been modified, the entire file\
          \ is returned. Otherwise, only partial content is returned using the `Range`\
          \ header. "
        required: false
        schema:
          type: string
      - name: Range
        in: header
        description: "A specific range request. The value specifies the required byte\
          \ range--for example, bytes=0-100."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The stream is returned in the response
            body.
        "206":
          description: The partial content request succeeded. The requested range
            of data is in the response body.
        "404":
          description: No content was found for the specified identifier.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                fileNotFoundErrResp:
                  $ref: '#/components/examples/fileNotFoundRrrResponse'
        "416":
          description: An invalid or non-overlapping range was specified in the `Range`
            request header.
