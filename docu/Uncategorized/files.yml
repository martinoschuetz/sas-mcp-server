---
openapi: 3.0.3
info:
  version: "9"
  title: Files
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  description: >
    The File Service API is a versatile solution for storing, retrieving, and managing
    different types of files such as documents, attachments, and reports. Each file
    requires a specified name and  content type and can optionally be linked to a
    parentUri, which associates the file with another identifiable object. This feature
    allows users to organize and retrieve files either individually by their  unique
    file ID or in groups based on the associated parentUri. Each file includes a content
    stream to ensure that the file’s data is preserved and accessible. Once a file
    is created, users can update its  metadata or replace the file content entirely.
    The API also supports file versioning, enabling multiple versions of the same
    file to be maintained over time by including version-specific parameters during  creation.
    Deletion options are provided as well, allowing users to delete individual files
    by ID or remove all files associated with a specific parentUri. Overall, the File
    Service API offers a comprehensive
    and adaptable platform for persistent file management across various application
    use cases.
tags:
- name: Root
  description: The operations for the Root resource.
- name: Files
  description: "The CRUD (Create, Read, Update, Delete) operations for files."
- name: Index
  description: The operations to obtain a generic indexable representation of files.
- name: Summary
  description: The operations to obtain a generic summary representation of files.
- name: Security
  description: The operations to unquarantine the file.
- name: Settings
  description: The operations to return configuration settings information.
- name: Transfer
  description: The operations to export and import file resources for transfer workflows.
- name: Catalog
  description: The operations to retrieve catalog metadata for file resources.
paths:
  /:
    get:
      summary: Get top-level resource links
      description: Returns a list of links to the top-level resources that are available
        through the API. These top-level links include create and retrieve operations
        for /files.
      tags:
      - Root
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: '#/components/examples/getTopLevelResponse'
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: '#/components/examples/getTopLevelResponse'
        "503":
          description: Service Temporarily Unavailable The service is not available.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                serviceUnavailableErrResp:
                  $ref: '#/components/examples/serviceUnavailableErrResp'
    head:
      summary: Check the state of the service
      description: Indicates whether the service is available.
      tags:
      - Root
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded. The service is available.
          headers:
            Content-Type:
              schema:
                type: string
        "503":
          description: Service Temporarily Unavailable The service is not available.
  /files:
    get:
      summary: Get file resources
      description: "Retrieves file resources for the specified criteria. Standard\
        \ paging, filtering, and sorting options are available."
      tags:
      - Files
      operationId: getFileResourceForFilterQuery
      parameters:
      - name: Accept-Item
        in: header
        description: "The file resource media type value. If this is not specified,\
          \ the API returns the latest version."
        required: false
        schema:
          type: string
      - name: parentUri
        in: query
        description: The URI of the associated object or parent object.
        schema:
          type: string
      - name: start
        in: query
        description: The offset of the first member to return. The default value is
          0.
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The maximum number of members to return. The default value is
          10.
        schema:
          type: integer
          format: int32
      - name: filter
        in: query
        description: The filter criteria to apply to the returned member collection.
        schema:
          type: string
      - name: sortBy
        in: query
        description: The sort criteria  applies to the returned member collection.
        schema:
          type: string
      responses:
        "200":
          description: "The request succeeded. If files are found for the specified\
            \ criteria, they are returned in a collection. If no files are found,\
            \ an empty collection is returned."
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/fileResourceCollection"
              examples:
                collectionResp:
                  $ref: '#/components/examples/getFilesCollectionResp'
            application/json:
              schema:
                $ref: "#/components/schemas/fileResourceCollection"
              examples:
                collectionResp:
                  $ref: '#/components/examples/getFilesCollectionResp'
        "404":
          description: file not found.
          content:
            application/vnd.sas.error+json:
              examples:
                collectionErrResp:
                  $ref: '#/components/examples/headFileNotFoundErrResp'
    head:
      summary: Check if file resources endpoint is available
      description: Determines whether the files collection endpoint is available.
      tags:
      - Files
      operationId: headersForFiles
      responses:
        "200":
          description: The request succeeded. The files collection endpoint is available.
          headers:
            Content-Type:
              schema:
                type: string
    delete:
      summary: Delete file resources
      description: "Deletes file resources for the specified parentUri. If the user\
        \ is not authorized to delete all matching files, no files are deleted."
      tags:
      - Files
      operationId: deleteFileResourceForGivenParentUri
      parameters:
      - name: parentUri
        in: query
        description: The parent URI that is associated with the file resources to
          be deleted.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The file resources for the specified parentUri were successfully
            deleted.
        "404":
          description: No file resources exist for the specified parentUri.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                fileNotFoundErrResp:
                  $ref: '#/components/examples/noFileFoundErrResp'
  /files#schema:
    get:
      summary: Get schema for indexing
      description: This endpoint returns schema field to be indexed by search service.
      tags:
      - Files
      operationId: getfileindexschema
      parameters:
      - name: Accept
        in: header
        description: The type specific schema representation media type application/vnd.sas.search.type.schema+json.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The schema representation of file service fields to be indexed.
          content:
            application/vnd.sas.search.type.schema+json:
              schema:
                $ref: "#/components/schemas/schema"
              examples:
                schemaResp:
                  $ref: '#/components/examples/getFilesSchemaResp'
            application/json:
              schema:
                $ref: "#/components/schemas/schema"
              examples:
                schemaResp:
                  $ref: '#/components/examples/getFilesSchemaResp'
  /files#rawUpload:
    post:
      summary: Create new file resource
      description: Creates a new file resource by passing file content in the request
        body.
      tags:
      - Files
      operationId: createNewFile
      parameters:
      - name: Content-Type
        in: header
        description: The actual MIME type of the file.
        schema:
          type: string
      - name: Content-Disposition
        in: header
        description: "The content disposition. It indicates whether the content is\
          \ expected to be displayed inline in a browser (as a web page or part of\
          \ a web page) or as an attachment that is downloaded and saved locally.\
          \ If a filename is specified in the header, it is used as the default name\
          \ of the file."
        schema:
          type: string
      - name: expirationTimeStamp
        in: query
        description: "A timestamp that indicates when a file expires. If this is not\
          \ specified, the file never expires."
        required: false
        schema:
          type: string
      - name: parentFolderUri
        in: query
        description: The URI of the folder in which the file should be made a member.
        schema:
          type: string
      - name: searchable
        in: query
        description: An indicator specifying if a file is searchable or not. Defaulted
          to 'true' indicating file is searchable.
        schema:
          type: boolean
      - name: typeDefName
        in: query
        description: 'The type definition name of the file. If the file is associated
          with a folder and the client does not provide the value of this parameter,
          the file-service tries to find the best possible value using type-registry
          service. If it fails to find a default value, it defaults to "file".'
        schema:
          type: string
      - name: versioned
        in: query
        description: "An indicator specifying if a file is a version control file\
          \ or not. If set to true, the endpoint will return first version of the\
          \ file."
        schema:
          type: boolean
      requestBody:
        content:
          "*/*":
            schema:
              $ref: "#/components/schemas/file"
            examples:
              file:
                value: File content to be uploaded
        description: The contents of the file to be passed in raw format in the request
          body.
      responses:
        "201":
          description: The file resource was created and returned in the response
            body.
          headers:
            ETag:
              description: The entity tag for the file resource.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the file resource.
              schema:
                type: string
            Location:
              description: The URI of the file resource.
              schema:
                type: string
          content:
            application/vnd.sas.file+json:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV4Resp:
                  $ref: '#/components/examples/getFilesV4Resp'
            application/vnd.sas.file+json;version=1:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV1Resp:
                  $ref: '#/components/examples/getFilesV1Resp'
            application/vnd.sas.file+json;version=2:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV2Resp:
                  $ref: '#/components/examples/getFilesV2Resp'
            application/vnd.sas.file+json;version=3:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV3Resp:
                  $ref: '#/components/examples/getFilesV3Resp'
            application/vnd.sas.file+json;version=4:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV4Resp:
                  $ref: '#/components/examples/getFilesV4Resp'
            application/json:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV4Resp:
                  $ref: '#/components/examples/getFilesV4Resp'
        "400":
          description: "The request was not valid. A validation error occurred, and\
            \ the file cannot be created. Check the response for more information.\
            \ Here are common reasons for this issue: The file is larger than the\
            \ permitted size, or the file type is not supported."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                uploadErrResp:
                  $ref: '#/components/examples/uploadErrResp'
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. A file with the specified name cannot be
            created in the folder because the file already exists in that folder.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                uploadConlictErrResp:
                  $ref: '#/components/examples/postUploadConflictErrResp'
  /files#multipartUpload:
    post:
      summary: Create a new file resource
      description: Creates a new file resource by passing a file in the form of a
        multipart request.
      tags:
      - Files
      operationId: createNewFileMultiPart
      parameters:
      - name: Content-Type
        in: header
        description: 'The MIME type for the multipart request. You must specify "multipart/form-data;
          boundary={boundaryString}". You can specify the actual MIME type of the
          file by using Content-Type as form data in the request body.'
        schema:
          type: string
      - name: Content-Disposition
        in: header
        description: "The content disposition. This indicates whether the content\
          \ is expected to be displayed inline in a browser (as a web page or part\
          \ of a web page) or as an attachment that is downloaded and saved locally.\
          \ If a filename is specified in the header, it is used as the default name\
          \ of the file."
        schema:
          type: string
      - name: expirationTimeStamp
        in: query
        description: "A timestamp that indicates when a file expires. If it is not\
          \ specified, the file never expires."
        required: false
        schema:
          type: string
      - name: parentFolderUri
        in: query
        description: The URI of the folder in which to add the file.
        schema:
          type: string
      - name: searchable
        in: query
        description: An indicator specifying if a file is searchable or not. Defaulted
          to 'true' indicating file is searchable.
        schema:
          type: boolean
      - name: typeDefName
        in: query
        description: 'The type definition name of the file. If the file is associated
          with folder and the client does not provide the value of this parameter,
          the  file-service tries to find the best possible value using type-registry
          service. If it fails to find a default value, it defaults to "file".'
        schema:
          type: string
      - name: versioned
        in: query
        description: "An indicator specifying if a file is a version control file\
          \ or not. If set to true, the endpoint will return first version of the\
          \ file."
        schema:
          type: boolean
      - name: recoverable
        in: query
        description: An indicator specifying if a file is recoverable or not.If a
          user deleted the file then those files can be recovered.There is a certain
          retention period till which the file will be retained.
        schema:
          type: boolean
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                filename:
                  description: The name of the file. Clients must specify name of
                    the file as form data in the request body.
                  type: string
                file:
                  description: The actual file content. The content should be listed
                    in the format of standard form data in the request body. Only
                    one file is permitted in a multipart request.
                  type: string
                  format: binary
            examples:
              file:
                value:
                  filename: test_file.txt
                  file: file content to upload.
      responses:
        "201":
          description: The file was created and returned in the response body.
          headers:
            ETag:
              description: The entity tag for the file resource.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the file resource.
              schema:
                type: string
            Location:
              description: The URI of the file resource.
              schema:
                type: string
          content:
            application/vnd.sas.file+json:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV4Resp:
                  $ref: '#/components/examples/getFilesV4Resp'
            application/vnd.sas.file+json;version=1:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV1Resp:
                  $ref: '#/components/examples/getFilesV1Resp'
            application/vnd.sas.file+json;version=2:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV2Resp:
                  $ref: '#/components/examples/getFilesV2Resp'
            application/vnd.sas.file+json;version=3:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV3Resp:
                  $ref: '#/components/examples/getFilesV3Resp'
            application/vnd.sas.file+json;version=4:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV4Resp:
                  $ref: '#/components/examples/getFilesV4Resp'
            application/json:
              schema:
                $ref: "#/components/schemas/fileResource"
              examples:
                filesV4Resp:
                  $ref: '#/components/examples/getFilesV4Resp'
        "400":
          description: "The request was not valid. A validation error occurred, and\
            \ the file cannot be created. Check the response for more information.\
            \ Here are common reasons for this issue: The file is larger than the\
            \ permitted size, the file type is not supported, or the multipart request\
            \ contains more than one file."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                uploadErrResp:
                  $ref: '#/components/examples/postUploadErrResp'
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. A file with the specified name cannot be
            created in the folder because the file already exists in that folder.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                uploadConlictErrResp:
                  $ref: '#/components/examples/postUploadConflictErrResp'
  /files#transferImport:
    post:
      summary: Create a file resource from a transfer object
      description: Creates a file resource from a transfer object payload used by
        transfer workflows.
      tags:
      - Transfer
      operationId: createFileFromTransferObject
      requestBody:
        required: true
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/transferObject"
            examples:
              transferImportRequest:
                summary: Create a file from transfer payload
                value:
                  version: 2
                  summary:
                    id: "7d6a8d8d-2fd1-4f66-b2cd-2bf90a0f71f1"
                    name: "simpleText.txt"
                    description: "Test Transfer Description"
                    createdBy: "sasdemo"
                    creationTimeStamp: "2026-07-01T09:12:31.000Z"
                    modifiedBy: "sasdemo"
                    modifiedTimeStamp: "2026-07-01T09:12:31.000Z"
                  content: "eyJmaWxlUmVzb3VyY2UiOnsibmFtZSI6InNpbXBsZVRleHQudHh0IiwiY29udGVudFR5cGUiOiJ0ZXh0L3BsYWluIiwicGFyZW50VXJpIjoiL3Rlc3QvcGFyZW50LzEyMyJ9LCJjb250ZW50IjoiU0dWc2JHOGdWMjl5YkdRaCJ9"
                  connectors:
                  - version: 2
                    uri: "/test/parent/123"
                    name: "simpleText.txt"
                    contentType: "text/plain"
                    type: "parent"
                    forceMapping: false
      responses:
        "201":
          description: The request succeeded. The file resource was created from the
            transfer object.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/fileResourceSummary"
              examples:
                transferImportCreated:
                  summary: Created file summary
                  value:
                    id: "2bd7c66d-4e30-4cc1-8d9f-9e2b8b8e6ef1"
                    name: "simpleText.txt"
                    description: "Test Transfer Description"
                    createdBy: "sasdemo"
                    creationTimeStamp: "2026-07-01T09:13:11.000Z"
                    modifiedBy: "sasdemo"
                    modifiedTimeStamp: "2026-07-01T09:13:11.000Z"
                    version: 2
        "400":
          description: The request was not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                transferImportBadRequestErrResp:
                  $ref: '#/components/examples/transferImportBadRequestErrResp'
  /files#fetchFilesForMultipleParentUri:
    post:
      summary: Get file resources for multiple parentUris
      description: Retrieves the file resources that are associated with multiple
        parentUri specifications. Request the parentUri values in the body. The returned
        collection is grouped by parentUri.
      tags:
      - Files
      operationId: fetchFilesForParentUris
      parameters:
      - name: Accept-Item
        in: header
        description: "The file resource media type value. If this is not specified,\
          \ the API returns the latest version."
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/selection"
      responses:
        "200":
          description: "The request succeeded. If files are found for the specified\
            \ criteria, they are returned in a collection. If no files are found,\
            \ an empty collection is returned."
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/fileResourceCollection"
              examples:
                collectionResp:
                  $ref: '#/components/examples/getFilesCollectionResp'
            application/json:
              schema:
                $ref: "#/components/schemas/fileResourceCollection"
              examples:
                collectionResp:
                  $ref: '#/components/examples/getFilesCollectionResp'
  /files#fetchIndexableRepresentationCollection:
    post:
      summary: Get indexable representations for parentUris
      description: Retrieves indexable representations of files that are associated
        with multiple parentUri specifications. Request the parentUri values in the
        body. The returned collection is grouped by parentUri.
      tags:
      - Index
      operationId: fetchFilesIndexableRepForParentUris
      parameters:
      - name: Accept-Item
        in: header
        description: The value of the file resource media type. You must specify this
          as "application/vnd.sas.search.indexable.data".
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/selection"
      responses:
        "200":
          description: "The request succeeded. If files are found for the specified\
            \ criteria, they are returned in a collection. If no files are found,\
            \ an empty collection is returned."
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/fileResourceCollection"
              examples:
                indexableCollectionResp:
                  $ref: '#/components/examples/getFilesIndexableCollectionResp'
            application/json:
              schema:
                $ref: "#/components/schemas/fileResourceCollection"
              examples:
                indexableCollectionResp:
                  $ref: '#/components/examples/getFilesIndexableCollectionResp'
        "400":
          description: "The request was not valid. A validation error occurred, and\
            \ the file cannot be created. Check the response for more information.\
            \ Here are common reasons for this issue: The file is larger than the\
            \ permitted size, the file type is not supported, or the multipart request\
            \ contains more than one file."
  /files#getIndexableRepresentationCollection:
    get:
      summary: Get indexable representations for files
      description: "Retrieves indexable representations of file resources for the\
        \ specified criteria. Standard paging is available."
      tags:
      - Index
      operationId: getFilesIndexableResource
      parameters:
      - name: Accept-Item
        in: header
        description: The value of the file resource media type. You must specify this
          as "application/vnd.sas.search.indexable.data".
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: The offset of the first member to return. The default is 0.
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The maximum number of members to return. The default value is
          10.
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: "The request succeeded. If files are found for the specified\
            \ criteria, indexable representations are returned in a collection. If\
            \ no files are found, an empty collection is returned."
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/fileResourceIndexCollection"
              examples:
                indexableCollectionResp:
                  $ref: '#/components/examples/getFilesIndexableCollectionResp'
            application/json:
              schema:
                $ref: "#/components/schemas/fileResourceIndexCollection"
              examples:
                indexableCollectionResp:
                  $ref: '#/components/examples/getFilesIndexableCollectionResp'
        "400":
          description: The request was not valid. The `limit` parameter cannot be
            less than 0 or greater than 10000.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                limitErrResp:
                  $ref: '#/components/examples/getFilesCollectionErrResp'
  /files#getSummaryRepresentationCollection:
    get:
      summary: Get summary representations
      description: "Retrieves summary representations of file resources for the specified\
        \ criteria. Standard paging, filtering, and sorting options are available."
      tags:
      - Summary
      operationId: getFilesSummaryForFilter
      parameters:
      - name: Accept-Item
        in: header
        description: The value of the file resource media type. You must specify this
          as "application/vnd.sas.summary".
        required: true
        schema:
          type: string
      - name: parentUri
        in: query
        description: The URI of the associated object or parent object.
        schema:
          type: string
      - name: start
        in: query
        description: The offset of the first member to return. The default value is
          0.
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The maximum number of members to return. The default value is
          10.
        schema:
          type: integer
          format: int32
      - name: filter
        in: query
        description: The filter criteria to apply to the returned member collection.
        schema:
          type: string
      - name: sortBy
        in: query
        description: The sort criteria to apply to the returned member collection.
        schema:
          type: string
      responses:
        "200":
          description: "The request succeeded. If files are found for the specified\
            \ criteria, summary representations are returned in a collection. If no\
            \ files are found, an empty collection is returned."
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/fileResourceSummaryCollection"
              examples:
                summaryCollectionResp:
                  $ref: '#/components/examples/getFilesSummaryCollectionResp'
            application/json:
              schema:
                $ref: "#/components/schemas/fileResourceSummaryCollection"
              examples:
                summaryCollectionResp:
                  $ref: '#/components/examples/getFilesSummaryCollectionResp'
