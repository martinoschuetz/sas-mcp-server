      tags:
      - Localization
      summary: Retrieve untranslated resources for the provided locale list
      description: Performs a comparison of existing solution messages using the provided
        list of locales and returns a zip file containing any untranslated solution
        messages. Requires authentication with admin privileges. By default, the current
        system configuration is queried to update the stored solution messages.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
            example:
            - fr
            - es
        required: true
      parameters:
      - name: disableExport
        in: query
        description: If true, the current system configuration will not be exported
          and imported to update the stored solution messages.
        required: false
