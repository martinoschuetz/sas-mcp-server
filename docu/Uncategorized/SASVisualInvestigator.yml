        in: query
        description: The filter criteria for the returned collection.
        schema:
          type: string
      - name: sortBy
        in: query
        description: The sort order for the returned collection.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/messageCollection'
              examples:
                solutionMessage:
                  $ref: '#/components/examples/solutionMessageCollection'
