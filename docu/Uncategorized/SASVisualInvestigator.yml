---
openapi: 3.0.3
info:
  version: '8'
  title: Visual Investigator
  description: The SAS Visual Investigator REST API provides configuration values
    to the client defining what it should display to the user.
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: 'https://developer.sas.com'
tags:
- name: Api
  description: The root of the API.
- name: Html
  description: Endpoints that return HTML.
- name: Properties
  description: Endpoints related to Properties.
- name: Configuration
  description: Endpoints related to Configuration.
- name: Tabs
  description: Endpoints related to Tabs.
- name: Deployment
  description: Endpoints related to Deployment.
- name: Groups
  description: Endpoints related to Groups.
- name: Preferences
  description: Endpoints related to Preferences.
- name: Pages
  description: Endpoints related to Pages.
- name: Link Search
  description: Endpoints related to Link Search.
- name: Maps
  description: Endpoints related to Maps.
- name: Solutions
  description: Endpoints related to Solutions.
- name: Recently Viewed
  description: Endpoints related to Recently Viewed records.
- name: Localization
  description: Endpoints related to Solution Localization.
- name: Saved Searches
  description: Endpoints related to Saved Searches.
- name: JobMonitoring
  description: Endpoints related to Job Monitoring.
- name: UserManagement
  description: Endpoints related to User Management.
paths:
  /:
    get:
      tags:
      - Api
      summary: Get navigation links
      operationId: root
      description: The root of the API. This resource contains links to the top-level
        resources in the API. Response is a 302 Found that redirects to index.html.
      responses:
        '302':
          description: Redirect response code to redirect client to 'index.html'.
          headers:
            Location:
              description: The URL for 'index.html'.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                api:
                  $ref: '#/components/examples/api'
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                api:
                  $ref: '#/components/examples/api'
  /index.html:
    get:
      tags:
      - Html
      summary: Get SAS Visual Investigator Home page
      operationId: getIndexHtml
      description: The Home page for SAS Visual Investigator.
      responses:
        '200':
          description: The request for the resource succeeded.
          content:
            text/html:
              schema:
                type: string
              examples:
                htmlPageExample:
                  $ref: '#/components/examples/homepageHtml'
  /admin.html:
    get:
      tags:
      - Html
      summary: Get SAS Visual Investigator administrator Home page
      operationId: getAdminHtml
      description: The administrator Home page for SAS Visual Investigator.
      responses:
        '200':
          description: The request for the resource succeeded.
          content:
            text/html:
              schema:
                type: string
              examples:
                htmlPageExample:
                  $ref: '#/components/examples/homepageHtml'
  /scenAdmin.html:
    get:
      tags:
      - Html
      summary: Redirect to support old URL for Scenario Administrator
      operationId: scenAdmin
      description: 'Redirect to support the old URL for Scenario Administrator, for
        customers who have previously bookmarked Scenario Administrator.'
      responses:
        '302':
          description: Redirect response code to redirect client to the current Scenario
            Administrator page.
          headers:
            Location:
              description: The current URL for Scenario Administrator.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
              examples:
                htmlPageExample:
                  $ref: '#/components/examples/homepageHtml'
  /i18nResources:
    get:
      tags:
      - Configuration
      summary: Get localization resources
      operationId: getI18nResources
      description: Get the localization resources for SAS Visual Investigator.
      responses:
        '200':
          description: The request for the resource succeeded.
          content:
            application/json:
              schema:
                type: string
              examples:
                i18nResourcesExample:
                  $ref: '#/components/examples/i18nResources'
  /rest:
    get:
      tags:
      - Api
      summary: Get navigation links
      operationId: getRootNavigationLinks
      description: The root of the API. This resource contains links to the top-level
        resources in the API.
      responses:
        '200':
          description: The request for the resource succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                api:
                  $ref: '#/components/examples/api'
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                api:
                  $ref: '#/components/examples/api'
  /linkSearch:
    post:
      tags:
      - Link Search
      summary: Perform a SAND search that returns cardinality information
      operationId: linkSearch
      description: |
        This endpoint performs two functions:

        (1) Performs a SAND search - supports TableVisualizationResponse and SummaryVisualizationResponse.

        (2) Injects into the response relationships that can be created (respecting relationship cardinality) between a specified object and the objects returned by the search. Available relationships are in the '_availableRelationships' field.
      requestBody:
        content:
          application/vnd.sas.investigation.link.search+json:
            schema:
              $ref: '#/components/schemas/linkSearchRequest'
            examples:
              linkSearchRequest:
                $ref: '#/components/examples/linkSearchRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/linkSearchRequest'
            examples:
              linkSearchRequest:
                $ref: '#/components/examples/linkSearchRequest'
      responses:
        '200':
          description: The link search succeeded.
          content:
            application/vnd.sas.sand.search.response+json:
              schema:
                $ref: '#/components/schemas/searchResponse'
              examples:
                linkSearchResponse:
                  $ref: '#/components/examples/linkSearchResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/searchResponse'
              examples:
                linkSearchResponse:
                  $ref: '#/components/examples/linkSearchResponse'
        '400':
          description: The request is malformed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response412:
                  $ref: '#/components/examples/error2Response400'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response412:
                  $ref: '#/components/examples/error2Response400'
        '404':
          description: No supported visualizations were provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
  '/osmMapTiles/{zoomLevel}/{xCoordinate}/{yCoordinate}':
    get:
      tags:
      - Maps
      operationId: getMapTile
      summary: Get map tile
      description: 'Redirect to the SAS OSM server for the required map tile, appending
        the calculated checksum to the request.'
      responses:
        '302':
          description: Redirect response code that redirects the client to the SAS
            OSM server.
          headers:
            Location:
              description: URL of the SAS OSM server.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: If any of the path parameters are out of their allowed ranges.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
    parameters:
    - name: zoomLevel
      in: path
      required: true
      description: The zoom level.
      schema:
        type: integer
        minimum: 0
        maximum: 18
    - name: xCoordinate
      in: path
      required: true
      description: The x coordinate.
      schema:
        type: integer
        minimum: 0
        maximum: 262143
    - name: yCoordinate
      in: path
      required: true
      description: The y coordinate.
      schema:
        type: integer
        minimum: 0
        maximum: 262143
  /appConfigurations:
    get:
      tags:
      - Properties
      summary: Get all app configurations
      operationId: getConfigurationBundles
      description: Get a list of all app configurations.
      parameters:
      - name: start
        in: query
        description: The index of the first result to include on the page.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: The number of results that should be returned.
        required: false
        schema:
          type: integer
          default: 100
      - name: filter
        in: query
        description: The filter criteria for the returned collection.
        schema:
          type: string
      - name: sortBy
        in: query
        description: The sort order for the returned collection.
        schema:
          type: string
      responses:
        '200':
          description: The request for the resource succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/appConfigurationCollection'
              examples:
                An example of an App Configuration:
                  $ref: '#/components/examples/appConfigurationCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/appConfigurationCollection'
              examples:
                An example of an App Configuration:
                  $ref: '#/components/examples/appConfigurationCollection'
    patch:
      tags:
      - Properties
      summary: Batch patch app configurations
      operationId: patchAppConfiguration
      description: >-
        Apply a batch of operations to app configurations. The request body is a JSON
        array of
        patch operations. Each operation targets a specific app configuration identified
        by the
        last segment of the `path` field (e.g. `/appConfigurations/{id}`), or a nested
        property
        within an app configuration (e.g. `/appConfigurations/{id}/{propertyName}`).


        **Entity-level operations** (path: `/appConfigurations/{id}`):

        - **add** – Create a new app configuration. The `value` field must contain
        a full app
          configuration representation. If an app configuration with the same `id`
        already exists
          the operation is silently skipped.

        - **replace** – Replace an existing app configuration. The `value` field must
        contain the
          full updated representation including a `version` that is not older than
        the current one.
          If the app configuration does not exist, the entire patch is rejected with
        a 400 error.

        - **remove** – Delete the app configuration identified by the `path`.

        - **test** – Assert that the app configuration identified by the `path` exists.
          If it does not exist, the entire patch is rejected with a 400 error.


        **Nested property operations** (path: `/appConfigurations/{id}/{property...}`):

        When the path includes segments beyond the `{id}`, the operation targets a
        specific
        property within the identified app configuration.

        - **add** – Set the property value. The app configuration must already exist.

        - **replace** – Update the property value. The property must currently exist
        (have a
          non-null value). Targeting a property that does not exist returns a 400
        error.

        - **remove** – Clear (null) the property value. The property must currently
        exist.
          Targeting a property that does not exist returns a 400 error.

        - **test** – Assert the property equals the provided `value`. If the property
        does not
          exist or does not match, the entire patch is rejected with a 400 error.


        Note: The `id` field is not patchable. Attempting to target it via a nested
        property
        operation (e.g. `/appConfigurations/{id}/id`) will result in a 400 error.
      requestBody:
        required: true
        description: A JSON array of patch operations to apply to app configurations.
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/jsonPatchDocument'
            examples:
              addAppConfig:
                summary: Create a new app configuration
                value:
                - op: add
                  path: /appConfigurations/-
                  value:
                    appName: MyNewApp
                    appType: Admin
                    urlPathToBootStrap: /my-new-app/bootstrap.json
                    loadOrder: 10
                    moduleName: myNewAppModule
                    version: 1
              replaceAppConfig:
                summary: Replace an existing app configuration
                value:
                - op: replace
                  path: /appConfigurations/abc-123
                  value:
                    id: abc-123
                    appName: UpdatedApp
                    appType: Admin
                    loadOrder: 20
                    version: 2
              removeAppConfig:
                summary: Delete an app configuration
                value:
                - op: remove
                  path: /appConfigurations/abc-123
              testAppConfig:
                summary: Test that an app configuration exists
                value:
                - op: test
                  path: /appConfigurations/abc-123
              addThenRemove:
                summary: Create then remove an app configuration
                value:
                - op: add
                  path: /appConfigurations/-
                  value:
                    id: temp-app-123
                    appName: TempApp
                    appType: Admin
                    version: 1
                - op: remove
                  path: /appConfigurations/temp-app-123
              replaceNestedProperty:
                summary: Replace a single property on an existing app configuration
                value:
                - op: replace
                  path: /appConfigurations/abc-123/appName
                  value: RenamedApp
              addNestedProperty:
                summary: Set a property value on an existing app configuration
                value:
                - op: add
                  path: /appConfigurations/abc-123/urlPathToApplicationCheck
                  value: /apps/myapp/health
              removeNestedProperty:
                summary: Clear a property on an existing app configuration
                value:
                - op: remove
                  path: /appConfigurations/abc-123/urlPathToApplicationCheck
              testNestedProperty:
                summary: Assert a property has a specific value
                value:
                - op: test
                  path: /appConfigurations/abc-123/appType
                  value: Core
              mixedBatch:
                summary: Mixed batch with entity-level and nested property operations
                value:
                - op: test
                  path: /appConfigurations/abc-123/appType
                  value: Core
                - op: replace
                  path: /appConfigurations/abc-123/appName
                  value: NewName
                - op: replace
                  path: /appConfigurations/abc-123/loadOrder
                  value: 3
                - op: add
                  path: /appConfigurations/-
                  value:
                    appName: SecondApp
                    appType: Admin
                    loadOrder: 10
                    version: 1
          application/json:
            schema:
              $ref: '#/components/schemas/jsonPatchDocument'
      responses:
        '200':
          description: >-
            The patch was applied successfully. Returns a collection containing only
            the app
            configurations that were created by `add` operations in this batch.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/appConfigurationCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/appConfigurationCollection'
        '400':
          description: >-
            The request is malformed. Possible causes include: the patch document
            is not valid JSON,
            an unsupported operation was used, a `test` operation failed because the
            app configuration
            does not exist or a nested property value does not match, the `add` operation
            is missing
            the `value` field, or a nested property path targets an unrecognized or
            non-existent field.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
        '404':
          description: >-
            A `replace` operation targeted an app configuration that does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
  '/appConfigurations/{appConfigurationId}/configurations':
    get:
      tags:
      - Properties
      summary: Get configuration bundles
      operationId: getConfigurationBundlesByAppConfiguration
      description: Get a summary list of configuration bundles available for the given
        Visual Investigator application. The elements of the collection will be of
        type application/vnd.sas.investigation.app.configuration.bundle.summary+json.
      parameters:
      - name: limit
        in: query
        description: The number of results that should be returned.
        required: false
        schema:
          type: integer
          default: 10
      - name: start
        in: query
        description: The index of the first result to include on the page.
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: The request for the resource succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/configurationBundleSummaryCollection'
              examples:
                configurationBundleSummaryCollection:
                  $ref: '#/components/examples/configurationBundleSummaryCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/configurationBundleSummaryCollection'
              examples:
                configurationBundleSummaryCollection:
                  $ref: '#/components/examples/configurationBundleSummaryCollection'
    post:
      tags:
      - Properties
      summary: Create a configuration bundle
      operationId: createConfigurationBundle
      description: Create a configuration bundle to an app configuration bundle collection.
      requestBody:
        content:
          application/vnd.sas.investigation.app.configuration.bundle+json:
            schema:
              $ref: '#/components/schemas/configurationBundle'
            examples:
              configurationBundle:
                $ref: '#/components/examples/configurationBundle'
          application/json:
            schema:
              $ref: '#/components/schemas/configurationBundle'
            examples:
              configurationBundle:
                $ref: '#/components/examples/configurationBundle'
      responses:
        '201':
          description: The resource was successfully created.
          headers:
            ETag:
              description: The up-to-date version number of the type.
              schema:
                type: integer
            Location:
              description: The URI of the new type.
              schema:
                type: string
          content:
            application/vnd.sas.investigation.app.configuration.bundle+json:
              schema:
                $ref: '#/components/schemas/configurationBundle'
              examples:
                configurationBundle:
                  $ref: '#/components/examples/configurationBundle'
            application/json:
              schema:
                $ref: '#/components/schemas/configurationBundle'
              examples:
                configurationBundle:
                  $ref: '#/components/examples/configurationBundle'
        '400':
          description: The request is malformed or the resource is not a valid configuration
            bundle.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
    parameters:
    - name: appConfigurationId
      in: path
      description: The application ID.
      required: true
      schema:
        type: string
  '/appConfigurations/{appConfigurationId}/configurations/{bundleName}':
    get:
      tags:
      - Properties
      summary: Get a configuration bundle
      operationId: getConfigurationBundle
      description: Get the configuration values for a particular configuration bundle.
      responses:
        '200':
          headers:
            ETag:
              description: The entity tag for this resource.
              schema:
                type: string
          description: The request for the resource succeeded.
          content:
            application/vnd.sas.investigation.app.configuration.bundle+json:
              schema:
                $ref: '#/components/schemas/configurationBundle'
              examples:
                configurationBundle:
                  $ref: '#/components/examples/configurationBundle'
            application/json:
              schema:
                $ref: '#/components/schemas/configurationBundle'
              examples:
                configurationBundle:
                  $ref: '#/components/examples/configurationBundle'
    put:
      tags:
      - Properties
      summary: Update a configuration bundle
      operationId: updateConfigurationBundle
      description: Update a configuration bundle for the given appConfigurationId.
      parameters:
      - name: If-Match
        in: header
        description: Update the resource only if the resources current ETag header
          matches this value.
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            Location:
              description: The URI of the new type.
              schema:
                type: string
            ETag:
              description: The up-to-date version number of the type.
              schema:
                type: integer
          description: The resource was successfully updated.
          content:
            application/vnd.sas.investigation.app.configuration.bundle+json:
              schema:
                $ref: '#/components/schemas/configurationBundle'
              examples:
                configurationBundle:
                  $ref: '#/components/examples/configurationBundle'
            application/json:
              schema:
                $ref: '#/components/schemas/configurationBundle'
              examples:
                configurationBundle:
                  $ref: '#/components/examples/configurationBundle'
        '400':
          description: The request is malformed or the resource is not a valid configuration
            bundle.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
        '412':
          description: The request refers to an out-of-date version of the configuration.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response412:
                  $ref: '#/components/examples/error2Response412'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response412:
                  $ref: '#/components/examples/error2Response412'
        '428':
          description: The request is missing the If-Match header.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response428:
                  $ref: '#/components/examples/error2Response428'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response428:
                  $ref: '#/components/examples/error2Response428'
    delete:
      tags:
      - Properties
      summary: Delete a configuration bundle
      operationId: deleteConfigurationBundle
      description: Delete a configuration bundle for a given appConfigurationId.
      responses:
        '204':
          description: The resource was successfully deleted.
    parameters:
    - name: appConfigurationId
      in: path
      required: true
      description: The application ID.
      schema:
        type: string
    - name: bundleName
      in: path
      required: true
      description: The name of the configuration bundle.
      schema:
        type: string
  '/appConfigurationCategories/{categoryId}/configurations':
    get:
      tags:
      - Properties
      operationId: getConfigurationBundlesForCategory
      summary: Get configuration bundles for a given category
      description: Get the configuration bundles for a given category.
      parameters:
      - name: limit
        in: query
        description: 'The maximum number of results in a response, beginning from
          the ''start'' value.'
        required: false
        schema:
          type: integer
          default: 10
      - name: start
        in: query
        description: The index to start the results from in the collection.
        required: false
        schema:
          type: integer
          default: 0
      - name: Accept-Item
        in: header
        required: false
        description: The type of representation to return.
        schema:
          type: string
          enum:
          - application/vnd.sas.investigation.app.configuration.bundle.summary+json
          - application/vnd.sas.investigation.app.configuration.bundle+json
          default: application/vnd.sas.investigation.app.configuration.bundle.summary+json
      responses:
        '200':
          description: The request for the resource succeeded.
          headers:
            Cache-Control:
              schema:
                type: string
                default: 'max-age=86400,private'
          content:
            application/vnd.sas.collection+json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/configurationBundleCollection'
                - $ref: '#/components/schemas/configurationBundleSummaryCollection'
              examples:
                An example of a Configuration Bundle:
                  $ref: '#/components/examples/configurationBundle'
                An example of a Configuration Bundle Summary:
                  $ref: '#/components/examples/configurationBundleSummary'
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/configurationBundleCollection'
                - $ref: '#/components/schemas/configurationBundleSummaryCollection'
              examples:
                An example of a Configuration Bundle:
                  $ref: '#/components/examples/configurationBundle'
                An example of a Configuration Bundle Summary:
                  $ref: '#/components/examples/configurationBundleSummary'
    head:
      tags:
      - Properties
      operationId: headersForConfigurationBundlesForCategory
      summary: Get configuration bundles for a given category
      description: 'Get the configuration bundles for a given category, this is a
        HEAD operation.'
      parameters:
      - name: limit
        in: query
        description: 'The maximum number of results in a response, beginning from
          the ''start'' value.'
        required: false
        schema:
          type: integer
          default: 10
      - name: start
        in: query
        description: The index to start the results from in the collection.
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: The request for the resource succeeded.
          headers:
            Cache-Control:
              schema:
                type: string
                default: 'max-age=86400,private'
    parameters:
    - name: categoryId
      in: path
      description: The ID of the category.
      required: true
      schema:
        type: string
        enum:
        - category-desktop
        - category-global
        - category-mobile
  /casEnabled:
    get:
      tags:
      - Deployment
      operationId: getCasEnabled
      summary: Returns whether CAS is enabled
      description: Returns whether CAS is enabled for the current tenant.
      responses:
        '200':
          description: The request for the resource succeeded.
          content:
