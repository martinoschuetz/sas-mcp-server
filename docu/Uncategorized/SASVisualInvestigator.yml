          description: The name of the app this configuration is linked to.
        appType:
          type: string
          description: The appType of the app this configuration is linked to.
        urlPathToBootStrap:
          type: string
          description: Path to bootstrap.
        loadOrder:
          type: integer
          description: The configured load order.
        moduleName:
          type: string
          description: The module of the app this configuration is linked to.
        version:
          type: integer
          description: The version number of this schema.
        urlPathToApplicationCheck:
          type: string
          description: 'Property is used to ''check'' a config. By ''checked'' we
            mean that, if configured, the supplied url returns a 2XX HTTP response.'
        solutionName:
