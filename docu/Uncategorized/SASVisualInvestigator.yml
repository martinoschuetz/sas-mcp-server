    jobCollection:
      title: Job collection
      description: A collection of job representations.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/job'
    job:
      title: Job
      description: |
        A representation of a job that has been registered with the SAS Visual Investigator job monitor.

        A collection of tasks that can be executed in the background while the user is interacting with the application. These tasks work towards a common goal.

        For example, an administrator may click a button on the interface to index the data in the system to make it searchable. This creates a background job called 'index.' This job is made up of sub-tasks which must be completed successfully for the whole job to be completed successfully. In this example, each subtask is the indexing job for a particular entity type.
      x-sas-type: Job
      x-media-type:
        name: application/vnd.sas.investigation.job.monitor.job
        version: 1
      properties:
        version:
          type: integer
          description: The version of the media type
        id:
          type: string
          description: The unique identifier of the job.
        name:
          type: string
          description: The name of the job.
        description:
          type: string
          description: A human readable description of the job.
        status:
          type: string
          description: The status of the job.
        startedBy:
          type: string
          description: The user who started the job.
        startedTimeStamp:
          type: string
          format: date-time
          description: 'The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            job started.'
        endedTimeStamp:
          type: string
          format: date-time
          description: 'The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            job ended.'
        message:
          type: string
          description: A localized message describing the job failure if it failed.
        parameters:
          type: object
          description: The parameters that are required to run the job.
        tasks:
          type: array
          description: The status of any tasks that are children of the job.
          items:
            $ref: '#/components/schemas/task'
        tags:
          type: array
          description: Any tags that apply to the job for filtering purposes.
          items:
            type: string
        links:
          type: array
          description: The REST link relations.
          items:
            $ref: '#/components/schemas/link'
    task:
      title: Task
      description: A representation of a task that has been registered under a job
        in the SAS Visual Investigator job monitor.
      x-media-type:
        name: application/vnd.sas.investigation.job.monitor.task
        version: 1
      properties:
        version:
          type: integer
          description: The version of the media type
        parent:
          type: string
          description: The UUID of the parent job or task.
        id:
          type: string
          description: The UUID of the task.
        name:
          type: string
          description: The name of the task.
        description:
          type: string
          description: A human readable description for the task.
        parameters:
          type: object
          description: The parameters that are required to run the task.
        status:
          type: string
          description: the status of the task.
        startedTimeStamp:
          type: string
          format: date-time
          description: 'The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            task started.'
        endedTimeStamp:
          type: string
          format: date-time
          description: 'The timestamp in `YYYY-MM-DDThh:mm:ss.sssZ` format when the
            task ended.'
        message:
          type: string
          description: a localized message describing a failure that occurred if there
            was a failure.
        subTasks:
          type: array
          description: Any subtasks to be completed as part of this task.
          items:
            $ref: '#/components/schemas/task'
        links:
          type: array
          description: The REST link relations for this resource.
          items:
            $ref: '#/components/schemas/link'
