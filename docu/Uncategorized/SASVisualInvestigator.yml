        creationTimeStamp:
          type: string
          description: The creation date in ISO 8601 format.
        modifiedTimeStamp:
          type: string
          description: The last modification date in ISO 8601 format.
        appConfigurationId:
          type: string
          description: The id of the application this configuration bundle is for.
        solutionName:
          type: string
          description: The name of the solution that owns this configuration bundle.
        version:
          type: integer
          description: This media type's schema version number. This representation
