        phoneticSearch:
          type: boolean
          description: This denotes whether phonetic searching is enabled on the saved
            search.
        synonymSearch:
          type: boolean
          description: This denotes whether synonym searching is enabled on the saved
            search.
    savedSearchesResponse:
