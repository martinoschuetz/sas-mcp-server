      title: Enriched Page
      description: 'A page has a template (defining the layout of the page), data
        (to be displayed in the template), and some metadata about the page event
        that resulted in the retrieval of the page. An enriched page holds additional
        properties that are used by handlers.'
      type: object
      properties:
        id:
          description: The ID of the object represented by this page.
          type: string
        type:
          description: The type of the object represented by this page.
          type: string
        typeId:
          description: The ID of the object type represented by this page.
          type: integer
        typeVersion:
          description: The version of the object type represented by this page.
          type: integer
        documentVersion:
          description: The version of the object represented by this page.
          type: integer
        template:
          $ref: '#/components/schemas/template'
        data:
          $ref: '#/components/schemas/templateData'
        sheetSummaries:
          type: array
          description: A collection that summarizes the workspaces and insights that
            are attached to the object.
          items:
            $ref: '#/components/schemas/sheetSummary'
        commentCount:
          type: integer
          description: The number of comments attached to the object.
        eventMetadata:
          type: object
          description: The page event that retrieved this page.
          properties:
            mode:
              type: string
              enum:
              - V
              - C
              - E
        linkedTemplateData:
          type: array
          description: The templates that are included in this page.
          items:
            $ref: '#/components/schemas/linkedTemplate'
        actions:
          type: object
          description: A collection of all the action items (toolbar items) that are
            associated with this page.
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  attrs:
                    $ref: '#/components/schemas/actionItemDetails'
        fieldRestrictions:
          type: object
          description: Represents restrictions on the fields of this page. The key
            is the object type and the value is the restricted fields.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/fieldRestriction'
        fileRestrictions:
          type: object
          description: Represents restrictions on file categories that are associated
            with this page.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/fileRestriction'
        conditions:
          type: array
          description: A collection of conditions on this page that can be evaluated
            by clients.
          items:
            $ref: '#/components/schemas/condition'
        users:
          type: object
          description: Users that are referenced by the page.
          additionalProperties:
            type: string
        groups:
          type: object
          description: Groups that are referenced by the page.
          additionalProperties:
            type: string
        fileCategories:
          description: File categories that are associated with the page.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        restrictionConditions:
          type: object
          description: A collection of restriction conditions that can be evaluated
            by a client. The key is the object type and the value is the restrictions.
          additionalProperties:
            type: object
            properties:
              restrictions:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    restrictions:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          id:
                            type: string
                          expression:
                            type: string
                          objectState:
                            type: string
        fieldConditions:
          type: object
          description: A map that associates conditions to a given field on the page.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/condition'
    templateMetadata:
      title: Template Metadata
      description: Additional metadata about a template.
      type: object
      properties:
        dataSources:
          type: object
          description: A list of data sources for the template.
          properties:
            objectName:
              type: string
            fields:
              type: array
              items:
                type: string
        linkedTemplates:
          type: array
          description: A collection of templates that are linked to this template.
            A linked template is a reference to another template and the traversal
            that will be used to find linked data to populate the template.
          items:
            type: object
            properties:
              templateUuid:
                type: string
              traversalUuid:
                type: string
        workspaceEnabled:
          type: boolean
          description: Whether workspaces are enabled on this template.
        insightsEnabled:
          type: boolean
          description: Whether insights are enabled on this template.
        workspaceCreationEnabled:
          type: boolean
          description: Whether workspaces can be created when a template is opened
            in 'create' mode.
        insightsCreationEnabled:
          type: boolean
          description: Whether insights can be created when a template is opened in
            'create' mode.
        resources:
          type: object
          description: Map of resource strings that are associated with this template.
          additionalProperties:
            type: string
    template:
      title: Template
      description: A template describes the layout of a page in SAS Visual Investigator.
        It contains the layout of the page itself and additional metadata that clients
        use to format and display a page to end users.
      type: object
      properties:
        id:
          type: integer
          description: The ID of the template.
        uuid:
          type: string
          description: The UUID of the template.
        name:
          type: string
          description: The name of the template.
        template:
          type: object
          description: 'The page template itself, represented as a JSON document.'
        metadata:
          $ref: '#/components/schemas/templateMetadata'
        linkedTraversals:
          type: array
          description: The UUID of traversals that are associated with this template.
          items:
            type: string
        templateType:
          type: string
          description: 'The type of page this template represents (for example page,
            print, or Home page).'
        clientApplication:
          type: string
          description: 'The application that displays this template (for example,
            SAS Visual Investigator or SAS Mobile Investigator).'
        linkedReferenceLists:
          type: array
          description: The names of reference lists that are referenced by this template.
          items:
            type: string
        fileCategories:
          type: array
          description: File categories that are referenced by this template.
          items:
            type: object
            properties:
              objectName:
                type: string
              fileCategories:
                type: array
                items:
                  type: string
        conditions:
          type: array
          description: Conditions that are referenced by this template.
          items:
            type: string
        publishCode:
          type: string
          description: The solution publish status of this template.
          enum:
          - OPEN
          - PUBLISHED
          - MODIFIED
        solutionName:
          type: string
          description: The name of the solution that owns this template.
        solutionLabel:
          type: string
          description: The label of the solution that owns this template.
        active:
          type: boolean
    templateData:
      title: Template Data
      description: Data to be displayed in a template.
      type: object
      properties:
        id:
          type: string
          description: The ID of the object.
        displayLabel:
          type: string
          description: The label of the object.
        fieldValues:
          type: object
          description: Data to be displayed in fields on the template.
          additionalProperties:
            type: string
    sheetSummary:
      title: Sheet Summary
      description: 'A summary representation of a sheet, insights and workspaces are
        different types of sheet.'
      type: object
      properties:
        type:
          type: string
          description: The type of sheet.
          enum:
          - WORKSHEET
          - NOTESHEET
        name:
          type: string
          description: The name of the sheet.
        id:
          type: integer
          description: The ID of the sheet.
        tabOrder:
          type: integer
          description: Specifies the order in which a sheet should be displayed in
            the toolbar.
    linkedTemplate:
      title: Linked Template
      description: A template and the traversal that is used to find data that populates
        the template.
      type: object
      properties:
        templateUuid:
          type: string
          description: The UUID of the linked template.
        traversalUuid:
          type: string
          description: The UUID of the traversal used to find data to populate the
            linked template.
        traversal:
          type: object
          description: The definition of the traversal.
          additionalProperties:
            type: string
    document:
      title: Document
      type: object
      description: >
        The actual data that is associated with a particular Entity Type. Entity
        Types are the metadata and Documents are the data.
      properties:
        objectTypeName:
          type: string
          description: The name of the entity type with which the document is associated.
        objectTypeId:
          type: integer
          format: int64
          description: The ID of the entity type with which the document is associated.
        objectTypeVersion:
          type: integer
          description: The internal Data Hub version for the entity type that is associated
            with the document.
        id:
          type: string
          description: The qualified ID that uniquely identifies the document.
        displayLabel:
          type: string
          description: The value to use for displaying the ID of the document.
        fieldValues:
          type: object
          description: >
            The values for the fields and child objects that are defined for the
            related entity type. The actual data of the document exists here.
          additionalProperties: true
        validFrom:
          type: string
          format: date-time
          description: The timestamp value that indicates the starting datetime for
            when the document is valid.
        validTo:
          type: string
          format: date-time
          description: The timestamp value that indicates the ending datetime for
            when the document is valid.
        createdAt:
          type: string
          format: date-time
          description: The timestamp that indicates when the document was created.
        lastUpdatedAt:
          type: string
          format: date-time
          description: The timestamp that indicates when the document was last modified.
    enrichedDocument:
      title: Enriched Document
      type: object
      description: The actual data that is associated with a particular Entity Type.
        Entity Types are the metadata and Documents are the data. The document is
        "enriched" with additional data such as comments, insights, and workspaces.
      allOf:
      - $ref: '#/components/schemas/document'
      - type: object
        properties:
          comments:
            type: array
            description: The comments that are associated with the document.
            items:
              $ref: '#/components/schemas/comment'
          sheets:
            type: array
            items:
              $ref: '#/components/schemas/sheet'
            description: The insights and workspaces that are associated with the
              document.
          attachmentsCount:
            type: integer
            format: int64
            description: The number of attachments that are associated with the document.
    comment:
      title: Comment
      type: object
      description: >
        Additional text on an internal document.

        During an Update operation, all properties of a comment are read-only
        except the category. This is for security and audit purposes to keep
        historical data accurate.
      properties:
        id:
          type: integer
          format: int64
          description: The unique identifier for the comment.
        category:
          type: string
          description: The category of the comment.
        author:
          $ref: '#/components/schemas/commentUser'
        createDate:
          type: string
          format: date-time
          description: The date on which the comment was created.
        lastUpdatedAt:
          type: string
          format: date-time
          description: The date on which the comment was updated.
        lastUpdatedBy:
          type: string
          description: The user who last updated the comment.
        detail:
          type: string
          description: Text of the comment.
    commentUser:
      title: Comment Author
      type: object
      description: Information about an author of a comment.
      properties:
        id:
          type: string
          description: The unique identifier of the comment author.
        name:
          type: string
          description: The name of the user who is the comment author.
    sheet:
      title: Sheet
      type: object
      description: An instance of an insight or workspace.
      properties:
        id:
          type: integer
          format: int64
          description: A value that uniquely identifies the insight or workspace.
        name:
          type: string
          description: The name of the insight or workspace.
        tabOrder:
          type: integer
          description: The tab order for the insight or workspace.
        type:
          type: string
          enum:
          - WORKSHEET
          - NOTESHEET
          description: >
            Indicates the type of "sheet", either a workspace or an insight:
            <ul>
              <li>`WORKSHEET` - a workspace</li>
              <li>`NOTESHEET` - an insight</li>
            </ul>
        cells:
          type: array
          description: The individual cells on the sheet.
          items:
            $ref: '#/components/schemas/sheetCell'
        lastModified:
          type: string
          format: date-time
          description: The timestamp that indicates when this cell was last modified.
    sheetCell:
      title: Cell
      type: object
      description: An individual cell on a workspace or an insight.
      properties:
        id:
          type: integer
          format: int64
          description: A value that uniquely identifies the cell.
        row:
          type: integer
          description: The row of the worksheet or insight in which the cell exists.
        position:
          type: integer
          description: The position of the cell in the row.
        type:
          type: string
          enum:
          - LIVE
          - STATIC
          - IMAGE
          - TEXT
          description: |
            The type of the cell: <ul>
              <li>`LIVE` - live visualization</li>
              <li>`STATIC` - static visualization or network</li>
              <li>`IMAGE` - Base64 encoded image and annotations</li>
              <li>`TEXT` - simple text cell for HTML</li>
            </ul>
        height:
          type: integer
          description: The height of the cell.
        width:
          type: integer
          description: The width of the cell.
        lastModified:
          type: string
          format: date-time
          description: The timestamp that indicates when this cell was last modified.
    actionItemDetails:
      title: Action Item Details
      description: 'A representation of an ''action'' (control) that can be used by
        a user, commonly a toolbar item. For example, an action could be ''Attachments''
        which when added to a page and selected by a user displays the attachments
        manager window.'
      type: object
      properties:
        category:
          type: string
          description: Constant.
          enum:
          - ActionItem
        uuid:
          type: string
          description: The UUID of the action item.
        actionId:
          type: integer
          description: The ID of the action item.
        controlId:
          type: integer
          description: The ID of a control if this action item is associated with
            a control.
        attributes:
          type: object
          description: Additional metadata that will be passed to a control.
          additionalProperties:
            type: object
        resources:
          type: object
          description: Localizable resources.
          additionalProperties:
            type: string
        actionName:
          type: string
          description: The name of the action item.
        displayName:
          type: string
          description: The display name of the action item.
    fieldRestriction:
      title: Field Restriction
      description: Represents a restriction on a field value in an object.
      type: object
      properties:
        required:
          type: boolean
          description: Whether the field must be populated.
        readOnly:
          type: boolean
          description: Whether the field should be marked as read only.
        maxLength:
          type: integer
          description: The maximum permitted length of the fields value.
        systemReserved:
          type: boolean
          description: 'Whether this field is system reserved, meaning it has special
            significance to SAS Visual Investigator and is hidden from end users.'
        fieldDataType:
          type: string
          description: 'The data type of the field value (for example, BOOLEAN, INTEGER,
            STRING, and so on), clients can use this to format data entry and display.'
        precision:
          type: integer
          description: The numeric precision of the field value.
        scale:
          type: integer
          description: The numeric scale of the field value.
        constrainingListName:
          type: string
          description: The name of the reference list the field value is constrained
            by.
        cascadingReferenceDataFilterByCode:
          type: string
          description: 'If the field is constrained by a reference list that is part
            of hierarchical reference data, this value specifies which ''parent code''
            the available values should fall under.'
        cascadingReferenceDataFilterByField:
          type: string
          description: 'If the field is constrained by a reference list that is part
            of hierarchical reference data, this value specifies which field represents
            the ''parent code'' the available values should fall under.'
        allowMultipleSelections:
          type: boolean
          description: Whether multiple entries can be selected if the field represents
            a user group chooser.
        userSelectionStrategy:
          type: string
          description: Specifies what can be selected in a user group chooser.
          enum:
          - USERS
          - GROUPS
          - USERS_AND_GROUPS
    fileRestriction:
      title: File Restriction
      description: Represents restrictions on a file category.
      type: object
      properties:
        required:
          type: string
          description: Whether the file category is required.
        requiresDocumentLock:
          type: string
          description: Whether a lock on the object is required before interacting
            with the file category.
        allowMultipleFiles:
          type: string
          description: Whether multiple files are allowed by the file category.
    condition:
      title: Condition
      description: 'A condition can be evaluated by a client and is used to control
        how a UI element is displayed to a user. Conditions can be used with different
        UI elements, ranging from fields to the style of links and nodes on network
        diagrams. Please refer to the SAS Visual Investigator Administrator Documentation
        for a full explanation of controls and their use cases.'
      type: object
      properties:
        id:
          type: string
          description: The ID of the condition.
        version:
          type: integer
          description: The version of the condition.
        name:
          type: string
          description: The name of the condition.
        description:
          type: string
          description: A description of the condition.
        condition:
          type: object
          description: The definition of the condition that will be evaluated by clients.
        referencedConditions:
          type: array
          description: The ID of other conditions referenced by this condition.
          items:
            type: string
        referencedFacts:
          type: array
          description: Facts that are associated with this condition.
          uniqueItems: true
          items:
            type: object
            properties:
              factType:
                type: string
                description: The type of the fact.
                enum:
                - FIELD
                - MEMBERSHIP
                - CONDITION_REFERENCE
              factPlaceholder:
                type: string
                description: Will specify a field used by the fact if 'factType' is
                  FIELD.
              factValue:
                type: string
                description: Value that is used by the fact.
        ownerName:
          type: string
          description: The object type that owns this condition.
        referencedBy:
          type: array
          description: Associations of the condition.
          items:
            type: object
            properties:
              type:
                type: string
                description: The condition association type.
                enum:
                - REQUIRED_FIELD
                - READ_ONLY_FIELD
                - TEMPLATE_CONTROL
                - NLD_STYLING
                - CONDITION
              association:
                type: string
                description: The ID of the associated condition.
        creationTimeStamp:
          type: string
          description: When the condition was created.
        createdBy:
          type: string
          description: Who created the condition.
        modifiedTimeStamp:
          type: string
          description: When the condition was last modified.
        modifiedBy:
          type: string
          description: Who last modified the condition.
    solutionPublishResult:
      title: Solution Publish Result
      description: The result of a solution publish action.
      x-sas-media-type:
        name: application/vnd.sas.investigation.solution.publish.result
        version: 1
      type: object
      properties:
        solutionName:
          type: string
          description: The name of the solution that has been published.
        solutionLabel:
          type: string
          description: The label of the solution that has been published.
        successful:
          type: integer
          description: The number of items that were published successfully.
        failed:
          type: integer
          description: The number of items that failed to publish successfully.
        results:
          type: array
          description: A collection that details which items published successfully
            and which failed.
          items:
            $ref: '#/components/schemas/itemPublishResult'
        links:
          type: array
          description: A collection of links.
          items:
            $ref: '#/components/schemas/link'
    itemPublishResult:
      title: Item Publish Result
      description: Details the result of publishing an item.
      type: object
      properties:
        type:
          type: string
          description: The type of item that was requested to be published.
          enum:
          - CONTEXT_MAPPING
          - ENTITY_TYPE
          - FLOW
          - PAGE_TEMPLATE
          - WORKFLOW_TEMPLATE
        label:
          type: string
          description: The label of the item that was published.
        successful:
          type: integer
          description: The number of items that were published.
        failed:
          type: integer
          description: The number of items that failed to be published.
        errors:
          type: array
          description: Errors that were encountered while publishing.
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the item.
              label:
                type: string
                description: The label of the item.
              message:
                type: string
                description: Description that specifies what went wrong.
    api:
      properties:
        links:
          description: The API's top-level links.
          items:
            $ref: '#/components/schemas/link'
          type: array
        version:
          description: The version number of the API representation, this is version
            1.
          minimum: 1
          type: integer
    error2:
      properties:
        details:
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
          type: array
        errorCode:
          description: The numeric ID for the error.
          type: integer
        errors:
          description: Any additional errors that occurred.
          items:
            $ref: '#/components/schemas/error2'
          type: array
        httpStatusCode:
          description: The HTTP status code for the error.
          type: integer
        id:
          description: The string ID for the error.
          type: string
        links:
          description: The links that apply to the error.
          items:
            $ref: '#/components/schemas/link'
          type: array
        message:
          description: The message for the error.
          type: string
        remediation:
          description: A message that describes how to resolve the error.
          type: string
        version:
          description: The version number of the error representation. This representation
            is version 2.
          type: integer
    baseCollection2:
      properties:
        accept:
          description: A space-delimited list of media types from which an `Accept`
            header can be constructed.
          type: string
        count:
          description: If populated indicates the number of items in the collection.
          format: int64
          type: integer
        limit:
          description: The number of items that were requested for the collection.
          type: integer
        links:
          description: The links that apply to the collection.
          items:
            $ref: '#/components/schemas/link'
          type: array
        name:
          description: The name of the collection.
          type: string
        start:
          description: The zero-based index of the first item in the collection.
          format: int64
          type: integer
        version:
          description: The version number of the collection representation. This representation
            is version 2.
          type: integer
    link:
      properties:
        href:
          description: The URL for the link.
          type: string
        itemType:
          description: 'If this is a link to a container, `itemType` is the media
            type or link type for the items in the container.'
          type: string
        method:
          description: The HTTP method for the link.
          type: string
        rel:
          description: The relationship of the link to the resource.
          type: string
        responseItemType:
          description: 'The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.'
          type: string
        responseType:
          description: 'The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.'
          type: string
        title:
          description: The title for the link.
          type: string
        type:
          description: The media type or link type for the link.
          type: string
        uri:
          description: The relative URI for the link.
          type: string
    searchRequest:
      description: 'The request to /searches when performing a search including the
        object types to search, the query, filter, and selection criteria, as well
        as which visualizations to return'
      type: object
      properties:
        version:
          description: The representation version (3)
          type: integer
        types:
          description: 'The optional list of type names for the object types to be
            searched. If missing, all types will be searched.'
          type: array
          items:
            type: string
        query:
          $ref: '#/components/schemas/query'
        filter:
          $ref: '#/components/schemas/filter'
        selection:
          $ref: '#/components/schemas/selection'
        visualizations:
          description: The collection of visualizations to be returned. The keys supplied
            in this map will be used in the search response to identify the requested
            visualizations. See the visualization request definitions for details.
          type: object
          items:
            $ref: '#/components/schemas/visualizationRequest'
    searchResponse:
      description: The response from /searches when performing a search including
        the various visualizations that can be returned
      type: object
      properties:
        version:
          description: The representation version (3)
          type: integer
        types:
          description: The list of object type names from the search request.
          type: array
          items:
            type: string
        query:
          $ref: '#/components/schemas/query'
        visualizations:
          description: The requested search visualizations keyed by the identifiers
            specified in the search request. See the visualization response definitions
            for details.
          type: object
          items:
            $ref: '#/components/schemas/visualizationResponse'
        errors:
          description: Any errors relating to the search.
          type: array
          items:
            $ref: '#/components/schemas/error2'
    query:
      description: The different query types that can be used to search for objects.
        See specific query definitions for more details.
      type: object
      properties:
        version:
          description: The representation version (2)
          type: integer
        type:
          description: The type of this query object. The value of this property determines
            which other properties are expected.
          type: string
          enum:
          - and
          - compound
          - object
          - or
          - text
    filter:
      description: The different filter types that can be applied to narrow or drill
        down into the search results. See specific filter definitions for more details.
      type: object
      properties:
        version:
          description: The representation version (2)
          type: integer
        type:
          description: The type of this filter object. The value of this property
            determines which other properties are expected.
          type: string
          enum:
          - and
          - box
          - dateRange
          - not
          - or
          - polygon
          - query
          - radius
          - range
          - shape
          - terms
          - type
    selection:
      description: The criteria by which search results are marked as selected
      type: object
      properties:
        version:
          description: The representation version (2)
