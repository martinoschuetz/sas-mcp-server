        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/appConfiguration'
            description: Array containing app configurations.
    jsonPatchDocument:
      title: JSON Patch Document
      description: >-
        An array of JSON Patch operations as defined by RFC 6902.
        For the appConfigurations resource the `remove` operation is only supported
        at the top-level resource path (e.g. `/appConfigurations/{id}`) and results
        in
        a soft-delete (archived) rather than a physical deletion.
      type: array
      items:
        $ref: '#/components/schemas/jsonPatchOperation'
    jsonPatchOperation:
      title: JSON Patch Operation
      description: A single operation within a JSON Patch document (RFC 6902).
      type: object
      required:
      - op
      - path
      properties:
        op:
          type: string
          description: The operation to perform.
          enum:
          - add
          - remove
          - replace
          - move
          - copy
          - test
        path:
          type: string
          description: >-
            A JSON Pointer (RFC 6901) identifying the target location within the resource.
            For `remove` operations on appConfigurations this must be the top-level
            resource path
            (e.g. `/appConfigurations/{id}`).
        value:
          description: The value to apply. Required for `add`, `replace`, and `test`
            operations.
        from:
          type: string
          description: A JSON Pointer identifying the source location. Used by `move`
            and `copy` operations.
        reason:
          type: string
          description: An optional annotation describing why this operation is being
            applied.
    appConfiguration:
      title: Application Configuration
