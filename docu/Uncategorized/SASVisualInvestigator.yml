              $ref: '#/components/schemas/messageCollection'
            examples:
              solutionMessageCollectionPost:
                $ref: '#/components/examples/postSolutionMessageCollection'
          application/json:
            schema:
              $ref: '#/components/schemas/messageCollection'
            examples:
              solutionMessageCollectionPost:
                $ref: '#/components/examples/postSolutionMessageCollection'
      responses:
        '201':
          description: Created
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/messageCollection'
              examples:
                solutionMessage:
                  $ref: '#/components/examples/solutionMessageCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/messageCollection'
              examples:
                solutionMessage:
                  $ref: '#/components/examples/solutionMessageCollection'
        '400':
          description: The request is malformed.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response412:
                  $ref: '#/components/examples/error2Response400'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response412:
                  $ref: '#/components/examples/error2Response400'
