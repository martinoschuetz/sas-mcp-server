        label:
          type: string
          description: The label of the saved search.
        queryText:
          type: string
          description: The query text of the saved search.
        searchType:
          type: string
          description: This denotes whether the search is a map search or standard
            search. Valid entries are "standard" and "map".
        defaultAction:
          type: string
          description: The default action for the click action on the saved search.
