      description: |
        This example requests to view the specified report objects, and incident and person
        objects that contain either of the terms, "John" and "Smith" on the Map and Table visualizations.
        The user would also like to use the Facets and Selection visualizations to determine what filters might be worth
        applying to reduce their result set or select particular results of interest.
