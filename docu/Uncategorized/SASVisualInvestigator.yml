    viGroup:
      title: Group
      description: 'An entity that represents some role within an organization (such
        as team membership, job role, permissions, responsibilities, and so on) that
        distinguishes a group of users from another. A group has a collection of users
        as its members. It might also have other groups as members, forming a tree
