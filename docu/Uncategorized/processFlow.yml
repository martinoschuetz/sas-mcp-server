openapi: 3.0.3
info:
  description: >-
    The Process Flow Management Service REST API provide generic platform to
    clients for executing as well as monitoring business process flows.



    Features of this API include the following:
     1. Create and manage process flow template, instances, components, shared-data
    and function group.
     2. Create a process flow template using existing components.
     3. Execute a process flow template with either default or custom parameter values.
     4. Get all templates present in the system.
     5. Get all process template instances present in the system.
     6. Get all process template function groups present in the system.
  version: "2"
  title: Process Flow Management
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  license:
    name: Term of Use
    url: https://www.sas.com/en_us/legal/copyright.html
tags:
- name: Root
  description: The api root.
- name: Component
  description: Process flow component controller.
- name: Function
  description: Process flow template function controller.
- name: Instance
  description: Process flow template instance controller.
- name: Shared Data
  description: Process flow shared data controller.
- name: Template
  description: Process flow template controller.
- name: Data Extracts
  description: Retail analytics dataExtraction controller.
