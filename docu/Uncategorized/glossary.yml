                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.glossary.term.type.summary+json
                    - method: GET
                      rel: up
                      href: /glossary
                      uri: /glossary
                      type: application/vnd.sas.api
                    - method: POST
