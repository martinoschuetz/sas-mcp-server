      operationId: deleteRelationshipType
      summary: Delete a relationship type
      description: |
        Deletes a relationship type. Cannot delete system-owned types (HTTP 403). If the type has existing relationships and force is false (the default), the request is rejected with HTTP 409 and the error response includes a count of the existing relationships. If force is true, all relationships of that type are deleted first within the same transaction, then the type is deleted.
