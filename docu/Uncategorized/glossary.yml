                        responseType: application/vnd.sas.glossary.term.type
                      - method: DELETE
                        rel: delete
                        href: /glossary/termTypes/d4671576-1de8-44e3-8ddf-fc1c17bf4134
                        uri: /glossary/termTypes/d4671576-1de8-44e3-8ddf-fc1c17bf4134
                      - method: GET
                        rel: alternate
                        href: /glossary/termTypes/d4671576-1de8-44e3-8ddf-fc1c17bf4134
