  /terms:
    get:
      operationId: getTerms
      summary: Get terms
      description: |
        Returns a list of terms.  The items are sorted by name by default. The properties that can be used as filter and sort criteria are:
          * id
          * name
          * label
          * description
          * createdBy
          * creationTimeStamp
          * modifiedBy
          * modifiedTimeStamp
          * termTypeId
          * parentId
      tags:
      - Terms
      parameters:
      - name: start
        in: query
        description: The zero-based offset of first object to return. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of objects to return. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Filter criteria for returned objects. See [Filtering in REST\
          \ APIs](https://developer.sas.com/rest-apis/glossary/docs/getting-started/usage-notes#filtering)."
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: "Sort criteria for returned objects. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/glossary/docs/getting-started/usage-notes#sorting)."
        schema:
          type: string
          format: sort-criteria
      - name: Accept
        in: header
        description: The desired representation for the response.
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/json
          default: application/vnd.sas.collection+json
      - name: allowDrafts
        description: |
          This parameter allows drafts to be returned with the list of terms, provided the user making this request is a member of the Glossary.GlossaryAdministrators group. If a draft for a term exists and drafts are allowed, then the draft will be returned instead of the published term.
            * "user": Only drafts created by the current user will be included.
            * "all": All drafts will be included.
            * "none": Only published terms will be returned.
        in: query
        schema:
          type: string
          enum:
          - user
          - all
          - none
          default: user
