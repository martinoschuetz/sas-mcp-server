                        uri: /glossary/termTypes/d4671576-1de8-44e3-8ddf-fc1c17bf4134
                        type: application/vnd.sas.glossary.term.type
                      - method: GET
                        rel: up
                        href: /glossary/termTypes
                        uri: /glossary/termTypes
                        type: application/vnd.sas.collection
                        itemType: application/vnd.sas.glossary.term.type.summary
                      - method: PUT
                        rel: update
