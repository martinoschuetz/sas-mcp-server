---
openapi: 3.0.3
info:
  version: "3"
  title: Glossary
  description: |
    The Glossary API allows users to associate business terms with technology assets such as data sets and columns, documents, and business rules.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: "https://developer.sas.com"
servers:
- url: "http://example.com/glossary"
  description: The SAS Glossary server.
tags:
- name: Root
  description: Contains root level resources.
- name: Term Types
  description: Contains life cycle management resources for term types.
- name: Terms
  description: Contains life cycle management resources for terms.
- name: Drafts
  description: Contains life cycle management resources for draft terms.
- name: Relationship Types
  description: Contains life cycle management resources for relationship type definitions.
- name: Term Relationships
  description: Contains life cycle management resources for term-to-term relationships.
- name: Transfer
  description: Contains resources required by the transfer object provider contract.
paths:
  /:
    get:
      operationId: root
      summary: Get top-level resource links
      description: Returns a list of top-level resource links provided by the Glossary
        API.
      tags:
      - Root
      parameters:
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.api+json
          - application/json
          default: application/vnd.sas.api+json
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              description: The media type of the response body.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/paths/~1/get/responses/200/content/application~1json/schema"
              examples:
                API:
                  $ref: "#/paths/~1/get/responses/200/content/application~1json/examples/API"
            application/json:
              schema:
                title: API
                description: The list of links to top-level resources and operations
                  available from the root of the API.
                x-sas-media-type:
                  name: application/vnd.sas.api
                  version: 1
                required:
                - version
                - links
                properties:
                  version:
                    type: integer
                    description: The version number of the API representation. This
                      is version 1.
                    minimum: 1
                  links:
                    description: The API's top-level links.
                    type: array
                    items:
                      title: Link
                      type: object
                      description: A link to a related operation or resource.
                      required:
                      - rel
                      properties:
                        method:
                          type: string
                          description: The HTTP method for the link.
                        rel:
                          type: string
                          description: The relationship of the link to the resource.
                        uri:
                          type: string
                          description: The relative URI for the link.
                        href:
                          type: string
                          description: The URL for the link.
                        title:
                          type: string
                          description: The title for the link.
                        type:
                          type: string
                          description: The media type or link type for the link.
                        itemType:
                          type: string
                          description: "If this is a link to a container, `itemType`\
                            \ is the media type or link type for the items in the\
                            \ container."
                        responseType:
                          type: string
                          description: "The media type or link type of the response\
                            \ body for a `PUT`, `POST`, or `PATCH` operation."
                        responseItemType:
                          type: string
                          description: "The media type or link type of the items in\
                            \ the response body for a `PUT`, `POST`, or `PATCH` operation."
              examples:
                API:
                  summary: Root API response
                  description: The root response consists of a collection of links
                    that can be used to navigate the Glossary service API.
                  value:
                    version: 1
                    links:
                    - method: GET
                      rel: termTypes
                      href: /glossary/termTypes
                      uri: /glossary/termTypes
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.glossary.term.type
                    - method: POST
                      rel: createTermType
                      href: /glossary/termTypes
                      uri: /glossary/termTypes
                      type: application/vnd.sas.glossary.term.type
                      responseType: application/vnd.sas.glossary.term.type
                    - method: GET
                      rel: terms
                      href: /glossary/terms
                      uri: /glossary/terms
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.glossary.term
                    - method: POST
                      rel: createTerm
                      href: /glossary/terms?publish=true
                      uri: /glossary/terms?publish=true
                      type: application/vnd.sas.glossary.term
                      responseType: application/vnd.sas.glossary.term
                    - method: POST
                      rel: importTerms
                      href: /glossary/importTerms
                      uri: /glossary/importTerms
                      type: application/vnd.sas.job.execution.job
                      responseType: application/vnd.sas.job.execution.job
                    - method: GET
                      rel: drafts
                      href: /glossary/drafts
                      uri: /glossary/drafts
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.glossary.term.draft
                    - method: POST
                      rel: createDraft
                      href: /glossary/terms?publish=false
                      uri: /glossary/terms?publish=false
                      type: application/vnd.sas.glossary.term
                      responseType: application/vnd.sas.glossary.term
        "404":
          description: The Glossary service is not available.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/paths/~1terms/post/responses/409/content/application~1vnd.sas.error%2Bjson/schema"
              examples:
                Error - Service Unavailable:
                  summary: Error - Service Unavailable
                  description: The service is unavailable.
                  value:
                    version: 2
                    httpStatusCode: 404
                    message: Not Found
                    details: The service is unavailable.
  /termTypes:
    get:
      operationId: getTermTypes
      summary: Get term types
      description: |
        Returns a list of term types.  The items are sorted by name by default. The properties that can be used as filter and sort criteria are:
          * id
          * name
          * label
          * description
          * createdBy
          * creationTimeStamp
          * modifiedBy
          * modifiedTimeStamp
      tags:
      - Term Types
      parameters:
      - $ref: "#/paths/~1terms/get/parameters/0"
      - $ref: "#/paths/~1terms/get/parameters/1"
      - $ref: "#/paths/~1terms/get/parameters/2"
      - $ref: "#/paths/~1terms/get/parameters/3"
      - $ref: "#/paths/~1terms/get/parameters/4"
      - name: Accept-Item
        description: The desired item representation for collections.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.glossary.term.type.summary+json
          - application/vnd.sas.glossary.term.type+json
          - application/json
          default: application/vnd.sas.glossary.term.type.summary+json
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/termTypeCollection"
              examples:
                Term Type Collection:
                  $ref: "#/paths/~1termTypes/get/responses/200/content/application~1json/examples/Term%20Type%20Collection"
            application/json:
              schema:
                $ref: "#/components/schemas/termTypeCollection"
              examples:
                Term Type Collection:
                  summary: Term type collection
                  description: A list of term types.
                  value:
                    version: 2
                    accept: application/vnd.sas.glossary.term.type.summary
                    count: 1
                    start: 0
                    limit: 10
                    name: termTypes
                    items:
                    - creationTimeStamp: "0001-01-01T00:00:00Z"
                      createdBy: sasuser
                      modifiedTimeStamp: "2021-10-11T00:00:00Z"
                      modifiedBy: sasuser
                      id: d4671576-1de8-44e3-8ddf-fc1c17bf4134
                      links:
