components:
  schemas:
    termType:
      title: Term Type
      description: Information about a term type.
      type: object
      required:
      - id
      - name
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: The unique identity of this term type; this attribute is
              immutable after creation.
          creationTimeStamp:
            type: string
            description: "The date and time this object was created, in the format\
              \ of YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
            format: date-time
            readOnly: true
          modifiedTimeStamp:
            type: string
            description: "The date and time this object was last modified, in the\
              \ format of YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
            format: date-time
            readOnly: true
          createdBy:
            type: string
            description: The identity that created this object. The value is ignored
              on input.
            readOnly: true
          modifiedBy:
            type: string
            description: The identity that modified this object last. The value is
              ignored on input.
            readOnly: true
          version:
            type: integer
            description: The version of the media type.
            readOnly: true
          name:
            type: string
            description: |
              The name of the term type; the maximum length is 100. The name must be unique (case-insensitive) among all term types.
          label:
            type: string
            description: A label for the term type; the maximum length is 100.
          description:
            type: string
            description: A description for the term type; the maximum length is 1000.
          baseType:
            description: The term type name this type is based upon if applicable.
            type: string
          usageCount:
            description: The number of terms associated with the given term type.
            type: integer
            readOnly: true
          attributeCount:
            description: The number of attributes defined by the given term type.
            type: integer
            readOnly: true
      - type: object
        properties:
          attributes:
            type: array
            description: An ordered list of attributes.
            items:
              $ref: "#/components/schemas/termTypeAttributes"
    termTypeSummary:
      title: Term Type Summary
      description: Summary information about a term type.
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: The unique identity of this term type; this attribute is immutable
            after creation.
        creationTimeStamp:
          type: string
          description: "The date and time this object was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
          format: date-time
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: "The date and time this object was last modified, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
          format: date-time
          readOnly: true
        createdBy:
          type: string
          description: The identity that created this object. The value is ignored
            on input.
          readOnly: true
        modifiedBy:
          type: string
          description: The identity that modified this object last. The value is ignored
            on input.
          readOnly: true
        version:
          type: integer
          description: The version of the media type.
          readOnly: true
        name:
          type: string
          description: |
            The name of the term type; the maximum length is 100. The name must be unique (case-insensitive) among all term types.
        label:
          type: string
          description: A label for the term type; the maximum length is 100.
        description:
          type: string
          description: A description for the term type; the maximum length is 1000.
        baseType:
          description: The term type name this type is based upon if applicable.
          type: string
        usageCount:
          description: The number of terms associated with the given term type.
          type: integer
          readOnly: true
        attributeCount:
          description: The number of attributes defined by the given term type.
          type: integer
          readOnly: true
    termTypeCollection:
      title: Term Type Collection
      description: A collection of term types.
      type: object
      allOf:
      - $ref: "#/components/schemas/termCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains a collection of term type or term
              type summary representations.
            items:
              anyOf:
              - $ref: "#/components/schemas/termTypeSummary"
              - $ref: "#/components/schemas/termType"
    termTypeAttributes:
      type: object
      description: An attribute object.
      required:
      - name
      - label
      - type
      properties:
        name:
          description: |
            The name of the attribute. The name must be unique (case-insensitive) within the set of attribute names for the term type. The maximum length is 63. Once the attribute name is set it cannot change, but the label property may be updated on an existing attribute.
          type: string
        type:
          description: The type of attribute. This determines which types of values
            are appropriate for this attribute.
          type: string
          enum:
          - single-line
          - multi-line
          - single-select
          - multi-select
          - boolean
          - date
          - time
          - date-time
        label:
          description: |
            A label used for displaying this attribute to a user. The label must be unique (case-insensitive) within the set of attributes for the term type. The maximum length is 100.
          type: string
        description:
          description: A description of this attribute. The maximum length is 140.
          type: string
        hidden:
          description: A true value indicates this attribute should be hidden when
            the term is rendered in the user interface.
          type: boolean
        inherited:
          description: A read-only boolean indicating whether this attribute was inherited
            by an ancestor term type.
          type: boolean
          readOnly: true
        required:
          description: A true value indicates the attribute is required.
          type: boolean
        editorOptions:
          description: A collection of key/value pairs that are used to specify optional
            properties for the editor controls that correspond to the various attribute
            types.
          type: object
        items:
          description: A list of possible values for the attribute; required when
            type is single-select or multi-select.
          type: array
          items:
            description: A possible value for the attribute. The maximum length is
              100.
            type: string
        defaultValue:
          description: |
            The default value for the attribute. The default value must be present in the items list when items is specified. Multiple default values, where applicable, will be represented by comma separated values. Values containing one or more commas must be wrapped in quotation marks. Quotation marks must be doubled. The format for attributes of type "date" should be "YYYY-MM-DD". The format for attributes of type "time" should be "hh:mm:ssZ". The format for attributes of type "date-time" should be "YYYY-MM-DDThh:mm:ssZ". Boolean values should be either "true" or "false".
          type: string
    term:
      title: Term
      description: Information about a term
      type: object
      required:
      - name
      - termTypeId
      properties:
        id:
          type: string
          description: The unique identity of this term. Immutable after creation.
        name:
          type: string
          description: "The name of the term; the maximum length is 100. The name\
            \ must be unique (case-insensitive) among all terms and drafts that share\
            \ the same parentId. Also, a term must not have the same name as its parent.\
            \ Backslashes are not allowed."
        label:
          type: string
          description: A label for the term; the maximum length is 100.
        description:
          type: string
          description: A description for the term; the maximum length is 1000.
        status:
          type: string
          readOnly: true
          description: A value to indicate if the term has been published.
        termTypeId:
          type: string
          description: ID of the term type.  Immutable after creation.
        termTypeLabel:
          type: string
          description: "The label of the term type, or the name if the label is empty."
          readOnly: true
        parentId:
          type: string
          description: ID of the parent term. This is immutable for drafts of published
            terms.
        definition:
          type: string
          description: A definition for the term.
        termRevision:
          type: integer
          description: The current revision of the term.
          readOnly: true
        assetCount:
          type: integer
          description: The number of assets assigned to this term.
          readOnly: true
        isDraft:
          type: boolean
          description: A value to determine if the term is a draft.
        creationTimeStamp:
          type: string
          description: "The date and time this object was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
          format: date-time
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: "The date and time this object was last modified, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
          format: date-time
          readOnly: true
        createdBy:
          type: string
          description: The identity that created this object. The value is ignored
            on input.
          readOnly: true
        modifiedBy:
          type: string
          description: the identity that modified this object last. The value is ignored
            on input.
          readOnly: true
        version:
          type: integer
          description: The version of the media type.
          readOnly: true
        attributes:
          type: object
          additionalProperties: true
          description: A map of key/value pairs representing attributes for the term;
            the keys are strings and the values are objects.
    termCollection:
      title: Term Collection
      description: A collection of terms.
      type: object
      allOf:
      - title: Base Collection
        description: This is a base schema used to define paginated collections of
          resources. This base schema is extended by other schemas in APIs by adding
          an 'items' array property. These extensions define the application/vnd.sas.collection
          media type (version 2)
        properties:
          name:
            type: string
            description: The name of the collection.
          start:
            type: integer
            description: The zero-based index of the first item in the collection.
            format: int64
          limit:
            type: integer
            description: The number of items that were requested for the collection.
          count:
            type: integer
            description: If populated indicates the number of items in the collection.
            format: int64
          accept:
            type: string
            description: A space-delimited list of media types from which an `Accept`
              header may be constructed.
          links:
            type: array
            description: The links that apply to the collection.
            items:
              $ref: "#/paths/~1/get/responses/200/content/application~1json/schema/properties/links/items"
          version:
            type: integer
            description: The version number of the collection representation. This
              representation is version 2.
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains definition resources.
            items:
              $ref: "#/components/schemas/term"
    relationshipType:
      title: Relationship Type
      description: A relationship type defines a kind of term-to-term relationship.
      type: object
      x-sas-media-type:
        name: application/vnd.sas.glossary.relationship.type
        version: 1
      required:
      - name
      - directionality
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: The unique identifier of this relationship type. Assigned
              by the server on creation.
            readOnly: true
          name:
            type: string
            description: The name of the relationship type. Must be unique (case-insensitive)
              among all relationship type names. Maximum length is 100.
            maxLength: 100
          description:
            type: string
            description: A human-readable explanation of the relationship type's meaning.
          directionality:
            type: string
            description: Whether the relationship is bidirectional or directional.
            enum:
            - bidirectional
            - directional
          inverseName:
            type: string
            description: The label seen from the target term's perspective. Required
              when directionality is "directional"; must be null or absent for bidirectional
              types. Maximum length is 100.
            maxLength: 100
          systemOwned:
            type: boolean
            description: Indicates whether this is a system-owned type that cannot
              be deleted. Read-only.
            readOnly: true
          createdBy:
            type: string
            description: The identity that created this object.
            readOnly: true
          creationTimeStamp:
            type: string
            format: date-time
            description: "The date and time this object was created, in the format\
              \ of YYYY-MM-DDThh:mm:ss.sssZ."
            readOnly: true
          modifiedBy:
            type: string
            description: The identity that last modified this object.
            readOnly: true
          modifiedTimeStamp:
            type: string
            format: date-time
            description: "The date and time this object was last modified, in the\
              \ format of YYYY-MM-DDThh:mm:ss.sssZ."
            readOnly: true
          version:
            type: integer
            description: The version of the media type.
            readOnly: true
          links:
            type: array
            description: Links that apply to this resource.
            readOnly: true
            items:
              title: Link
              type: object
              description: A link to a related operation or resource.
              properties:
                method:
                  type: string
                  description: The HTTP method for the link.
                rel:
                  type: string
                  description: The relationship of the link to the resource.
                uri:
                  type: string
                  description: The relative URI for the link.
                href:
                  type: string
                  description: The URL for the link.
                type:
                  type: string
                  description: The media type or link type for the link.
    relationshipTypeCollection:
      title: Relationship Type Collection
      description: A collection of relationship types.
      type: object
      allOf:
      - $ref: "#/components/schemas/termCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains relationship type representations.
            items:
              $ref: "#/components/schemas/relationshipType"
    relationshipTypeCreateRequest:
      title: Relationship Type Create/Update Request
      description: The request body for creating or updating a relationship type.
      type: object
      required:
      - name
      - directionality
      properties:
        name:
          type: string
          description: The name of the relationship type.
          maxLength: 100
        description:
          type: string
          description: A human-readable explanation of the relationship type's meaning.
        directionality:
          type: string
          description: Whether the relationship is bidirectional or directional.
          enum:
          - bidirectional
          - directional
        inverseName:
          type: string
          description: The label seen from the target term's perspective. Required
            for directional types.
          maxLength: 100
    termRelationship:
      title: Term Relationship
      description: A relationship between two glossary terms.
      type: object
      x-sas-media-type:
        name: application/vnd.sas.glossary.term.relationship
        version: 1
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: The unique identifier of this relationship.
            readOnly: true
          sourceTermId:
            type: string
            description: The ID of the source term.
          sourceTermName:
            type: string
            description: The name of the source term.
            readOnly: true
          targetTermId:
            type: string
            description: The ID of the target term.
          targetTermName:
            type: string
            description: The name of the target term.
            readOnly: true
          typeId:
            type: string
            description: The ID of the relationship type.
          typeName:
            type: string
            description: The resolved name of the relationship type.
            readOnly: true
          createdBy:
            type: string
            description: The identity that created this object.
            readOnly: true
          creationTimeStamp:
            type: string
            format: date-time
            description: The date and time this object was created.
            readOnly: true
          modifiedBy:
            type: string
            description: The identity that last modified this object.
            readOnly: true
          modifiedTimeStamp:
            type: string
            format: date-time
            description: The date and time this object was last modified.
            readOnly: true
          version:
            type: integer
            description: The version of the media type.
            readOnly: true
          links:
            type: array
            description: Links that apply to this resource.
            readOnly: true
            items:
              $ref: "#/components/schemas/relationshipType/allOf/0/properties/links/items"
    termRelationshipSummary:
      title: Term Relationship Summary
      description: "Summary representation of a term relationship, shown in collection\
        \ responses."
      type: object
      x-sas-media-type:
        name: application/vnd.sas.glossary.term.relationship.summary
        version: 1
      properties:
        id:
          type: string
          description: The unique identifier of this relationship.
        relatedTermId:
          type: string
          description: The ID of the other term in the relationship (not the context
            term).
        relatedTermName:
          type: string
          description: The name of the other term in the relationship.
        typeId:
          type: string
          description: The ID of the relationship type.
        typeName:
          type: string
          description: "The resolved type name. For directional types queried from\
            \ the target side, this is the inverse name."
        direction:
          type: string
          description: 'The direction of this relationship. For bidirectional relationships,
            this is always "bidirectional". For directional relationships, this is
            "source" when queried from the source term and "target" when queried from
            the target term.'
          enum:
          - bidirectional
          - source
          - target
        creationTimeStamp:
          type: string
          format: date-time
          description: The date and time this relationship was created.
    termRelationshipCollection:
      title: Term Relationship Collection
      description: A collection of full term relationship resources.
      type: object
      allOf:
      - $ref: "#/components/schemas/termCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains full term relationship representations.
            items:
              $ref: "#/components/schemas/termRelationship"
    termRelationshipSummaryCollection:
      title: Term Relationship Summary Collection
      description: A collection of term relationship summaries scoped to a specific
        term.
      type: object
      allOf:
      - $ref: "#/components/schemas/termCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains term relationship summary representations.
            items:
              $ref: "#/components/schemas/termRelationshipSummary"
    termRelationshipCreateRequest:
      title: Term Relationship Create Request
      description: The request body for creating a term-to-term relationship. The
        source term is implied from the path parameter.
      type: object
      required:
      - targetTermId
      - typeId
      properties:
        targetTermId:
          type: string
          description: The ID of the target term.
        typeId:
          type: string
          description: The ID of the relationship type to use.
