    post:
      operationId: createTermType
      summary: Create a term type
      description: Creates a term type with the given content.
      tags:
      - Term Types
      parameters:
      - name: Content-Type
        required: true
        description: The representation in the request body.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.glossary.term.type+json
          - application/json
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.glossary.term.type+json
          - application/vnd.sas.glossary.term.type.summary+json
          - application/json
          default: application/vnd.sas.glossary.term.type+json
      requestBody:
        content:
          application/vnd.sas.glossary.term.type+json:
            schema:
              $ref: "#/components/schemas/termType"
            examples:
              Term Type:
                $ref: "#/paths/~1termTypes/post/requestBody/content/application~1json/examples/Term%20Type"
          application/json:
            schema:
              $ref: "#/components/schemas/termType"
            examples:
              Term Type:
                summary: Term type
                description: A term type.
                value:
                  id: b1744b2b-b984-4454-8b65-f09873708caf
                  name: New Term Type
                  label: Term Type
                  description: A new term type
                  attributes:
                  - name: singleLineTextAttribute
                    label: A single-line text attribute
                    description: This is a description of the attribute. Single-line
                      text attributes can be up to 4000 characters long and cannot
                      contain newline characters.
                    required: true
                    type: single-line
                    defaultValue: This is an example of a single-line text attribute.
                  - name: multiLineTextAttribute
                    label: A multi-line text attribute
                    description: Multi-line text attributes can be up to 4000 characters.  Newline
                      characters are allowed.
                    type: multi-line
                    defaultValue: This is an example of a multi-line text attribute\nwith\nnewline\ncharacters.
                  - name: booleanAttribute
                    label: A boolean attribute
                    description: Boolean attributes can be either "true" or "false"
                    type: boolean
                    defaultValue: "true"
                  - name: dateAttribute
                    label: A date attribute
                    description: Date attributes should be specified with the format
                      "YYYY-MM-DD"
                    type: date
                    defaultValue: "2024-02-12"
                  - name: timeAttribute
                    label: A time attribute
                    description: 'Time attributes should be specified with the format
                      "hh:mm:ssZ"'
                    type: time
                    defaultValue: "10:23:45Z"
                  - name: dateTimeAttribute
                    label: A date-time attribute
                    description: 'Date-time attributes should be specified with the
                      format "YYYY-MM-DDThh:mm:ssZ"'
                    type: date-time
                    defaultValue: "2024-02-12T10:23:45Z"
                  - name: singleSelectAttribute
                    label: A single-select attribute
                    description: Single-select attributes must specify at least one
                      item in the "items" field
                    type: single-select
                    items:
                    - Item 1
                    - Item 2
                    - Item 3
                    defaultValue: Item 1
                  - name: multiSelectAttribute
                    label: A multi-select attribute
                    description: Multi-select attributes must specify at least one
                      item in the "items" field
                    type: multi-select
                    items:
                    - Item 1
                    - Item 2
                    - Item 3
                    defaultValue: "Item 1,Item 3"
      responses:
        "201":
          description: |
            Created. The term type has been created.
          headers:
            Location:
              $ref: "#/paths/~1terms/post/responses/201/headers/Location"
            ETag:
              $ref: "#/paths/~1terms/post/responses/201/headers/ETag"
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
