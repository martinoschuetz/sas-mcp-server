      summary: Import terms via CSV
      description: |
        Imports terms from a CSV File. The CSV should be uploaded as a multipart value under the key "termCSV". Additionally, the multipart key "updateExisting" can be set to true if the import should overwrite existing terms. This request will return a job that can be polled for status and results. There are rules for the format of CSV files that contain glossary terms. For details about the rules for term CSV files, see [Import Terms](https://documentation.sas.com/doc/en/infocatcdc/default/infocatag/n1nxgg0zvizng1n1o50msmz643q1.htm#p12kd27uyalulin18b572lta80ck) in the SAS Information Catalog User's Guide.
