  /termTypes#transfer:
    post:
      x-sas-internal: true
      operationId: transferTermTypes
      summary: Transfer term types
      description: Imports term types through the Transfer service.  The name of the
        file containing term types in the request must be ExportTermType.xml.
      tags:
      - Transfer
      parameters:
      - name: Content-Type
        required: true
        description: The representation in the request body.
        in: header
        schema:
          type: string
          enum:
          - multipart/form-data
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.transfer.import.summary+json
          - application/json
          default: application/vnd.sas.transfer.import.summary+json
      responses:
        "201":
          description: |
            The import was successful.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
            application/vnd.sas.transfer.import.summary+json:
              schema:
                $ref: "#/paths/~1terms%23transfer/post/responses/202/content/application~1json/schema"
              examples:
