          type: boolean
          default: false
      responses:
        "204":
          description: No Content. The relationship type was deleted.
        "401":
          $ref: "#/paths/~1termTypes/get/responses/401"
        "403":
          description: Forbidden. The relationship type is system-owned and cannot
            be deleted.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/paths/~1terms/post/responses/409/content/application~1vnd.sas.error%2Bjson/schema"
              examples:
                Error - Forbidden:
                  summary: Error - Forbidden
                  description: The relationship type is system-owned and cannot be
                    deleted.
                  value:
                    version: 2
                    httpStatusCode: 403
                    id: glossary.relationshipType.systemOwned
                    message: Forbidden
                    details:
                    - The relationship type "relatedTerms" is system-owned and cannot
                      be deleted.
        "404":
          $ref: "#/paths/~1termTypes/get/responses/404"
        "409":
          description: |
            Conflict. The relationship type is in use by existing relationships and force is false. The error response includes a count field with the number of existing relationships.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/paths/~1terms/post/responses/409/content/application~1vnd.sas.error%2Bjson/schema"
              examples:
                Error - Conflict In Use:
                  summary: Error - Conflict In Use
                  description: The relationship type is currently in use.
                  value:
                    version: 2
                    httpStatusCode: 409
                    id: glossary.relationshipType.inUse
                    message: Conflict
                    count: 3
                    details:
                    - The relationship type is in use by 3 relationships. Set force=true
                      to delete them first.
