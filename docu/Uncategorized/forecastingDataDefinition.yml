  "/dataDefinitions/{dataDefinitionId}/tableDefinitions":
    get:
      tags:
      - Table Definition
      summary: Get All table definitions
      description: Returns a list of table definitions for a data definition. The
        returned items will be media type "application/vnd.sas.analytics.forecasting.table.definition".
      operationId: getTableDefinitions
      parameters:
      - name: start
        in: query
        description: Offset of first table definition to retrieve (0-based). Defaults
          to 0
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of table definitions to retrieve. Defaults to
          30
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      - name: sortBy
        in: query
        description: Sort criteria for retrieved table definitions (see https://developer.sas.com/rest-apis/forecastingDataDefinition-v2/docs/getting-started/usage-notes#sorting)
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: Filter criteria for retrieved table definitions (see https://developer.sas.com/rest-apis/forecastingDataDefinition-v2/docs/getting-started/usage-notes#filtering)
        required: false
        schema:
          type: string
      - name: tableType
        in: query
        description: The type of table definition requested
        required: false
        schema:
          type: string
      - name: dataDefinitionId
        in: path
        description: The id of the data definition
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/tableDefinitionCollection"
              examples:
                default:
                  $ref: "#/components/examples/getTableDefsResp"
            application/json:
              schema:
                $ref: "#/components/schemas/tableDefinitionCollection"
              examples:
                default:
                  $ref: "#/components/examples/getTableDefsResp"
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/vnd.sas.collection+json
    post:
      tags:
      - Table Definition
      summary: Create a table definition
      description: Creates a table definition
      operationId: createTableDefinition
      parameters:
      - name: dataDefinitionId
        in: path
        description: The id of the data definition
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/tableDefinition"
      responses:
        "201":
          description: OK
          headers:
            Location:
              description: The URL of the table definition.
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for the table definition.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.forecasting.table.definition+json:
              schema:
                $ref: "#/components/schemas/tableDefinition"
              examples:
                default:
                  $ref: "#/components/examples/getInputTableDefResp"
