---
openapi: 3.0.3
info:
  description: Forecasting Data Definitions API
  version: "2"
  title: Forecasting Data Definitions
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  license:
    name: SAS Institute Inc.
    url: "https://support.sas.com/techsup/license/index.html"
tags:
- name: Root
  description: The operations for the root resource.
- name: Table Definition
  description: The operations for a table definition resource.
- name: Hierarchy
  description: The operations for a hierarchy resource.
- name: Variable
  description: The operations for a variable resource.
- name: Time Definition
  description: The operations for a time definition resource.
- name: Data Definition
  description: The operations for a data definition resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: The API object contains a set of links for the supported endpoints.
      operationId: root
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/rootResp"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/rootResp"
          headers: {}
  /dataDefinitions:
    get:
      tags:
      - Data Definition
      summary: Get All data definitions
      description: Returns a list of data definitions. For a list of data definitions
        with a particular parentUri, caller may specify the optional query parameter
        'parentUri={parentUri}'. The returned items will be media type "application/vnd.sas.analytics.forecasting.data.definition".
      operationId: getDataDefinitions
      parameters:
      - name: start
        in: query
        description: Offset of first data definition to retrieve (0-based). Defaults
          to 0
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of data definitions to retrieve. Defaults to 30
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      - name: sortBy
        in: query
        description: Sort criteria for retrieved data definitions (see https://developer.sas.com/rest-apis/forecastingDataDefinition-v2/docs/getting-started/usage-notes#sorting)
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: Filter criteria for retrieved data definitions (see https://developer.sas.com/rest-apis/forecastingDataDefinition-v2/docs/getting-started/usage-notes#filtering)
        required: false
        schema:
          type: string
      - name: parentUri
        in: query
        description: The parentUri for the data definition
        required: false
        schema:
          type: string
      - name: checkForUpdates
        in: query
        description: Flag to determine whether to check the data definition source
          input data for updates
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/vnd.sas.collection+json
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/dataDefinitionCollection"
              examples:
                default:
                  $ref: "#/components/examples/getDataDefsResp"
            application/json:
              schema:
                $ref: "#/components/schemas/dataDefinitionCollection"
              examples:
                default:
                  $ref: "#/components/examples/getDataDefsResp"
    post:
      tags:
      - Data Definition
      summary: Create a data definition
      description: Creates a data definition
      operationId: createDataDefinition
      requestBody:
        content:
          application/vnd.sas.analytics.forecasting.data.definition.request+json:
            schema:
              $ref: "#/components/schemas/dataDefinitionRequest"
            examples:
              json:
                $ref: "#/components/examples/createDataDefRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/dataDefinitionRequest"
            examples:
              json:
                $ref: "#/components/examples/createDataDefRequest"
        description: dataDefinition request
        required: true
      responses:
        "201":
          description: OK
          headers:
            Location:
              description: The URI of the data definition.
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for the data definition.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.forecasting.data.definition+json:
              schema:
                $ref: "#/components/schemas/dataDefinition"
              examples:
                default:
                  $ref: "#/components/examples/createDataDefResp"
            application/json:
              schema:
                $ref: "#/components/schemas/dataDefinition"
              examples:
                default:
                  $ref: "#/components/examples/createDataDefResp"
        "400":
          description: The information sent in the request body contains an error
            or is incomplete
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/badRequest"
  "/dataDefinitions/{dataDefinitionId}":
    head:
      tags:
      - Data Definition
      summary: Check the availability of a data definition
      description: Retrieve the headers and check the availability of a data definition
      operationId: headersForDataDefinition
      parameters:
      - name: dataDefinitionId
        in: path
        description: The id of the data definition to find
        required: true
        schema:
          type: string
      - name: checkForUpdates
        in: query
        description: Flag to determine whether to check the data definition source
          input data for updates
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: E-Tag for the data definition.
              schema:
                type: string
        "404":
          description: Data definition not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
    get:
      tags:
      - Data Definition
      summary: Get a data definition
      description: Returns a data definition specified by the  data definition id
      operationId: getDataDefinition
      parameters:
      - name: dataDefinitionId
        in: path
        description: The id of the data definition to find
        required: true
        schema:
          type: string
      - name: checkForUpdates
        in: query
        description: Flag to determine whether to check the data definition source
          input data for updates
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: E-Tag for the data definition.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.forecasting.data.definition+json:
              schema:
                $ref: "#/components/schemas/dataDefinition"
              examples:
                default:
                  $ref: "#/components/examples/getDataDefResp"
            application/json:
              schema:
                $ref: "#/components/schemas/dataDefinition"
              examples:
                default:
                  $ref: "#/components/examples/getDataDefResp"
        "404":
          description: Data definition not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
    put:
      tags:
      - Data Definition
      summary: Update a data definition
      description: Updates a data definition specified by the id
      operationId: updateDataDefinition
      parameters:
      - name: dataDefinitionId
        in: path
        description: The id of the data definition to find
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: Update the data definition only if the current ETag header matches
          this value
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.analytics.forecasting.data.definition+json:
            schema:
              $ref: "#/components/schemas/dataDefinition"
            examples:
              json:
                $ref: "#/components/examples/putDataDefReq"
          application/json:
            schema:
              $ref: "#/components/schemas/dataDefinition"
            examples:
              json:
                $ref: "#/components/examples/putDataDefReq"
        description: dataDefinition
        required: true
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: E-Tag for time definition
              schema:
                type: string
          content:
            application/vnd.sas.analytics.forecasting.data.definition+json:
              schema:
                $ref: "#/components/schemas/dataDefinition"
              examples:
                json:
                  $ref: "#/components/examples/getDataDefResp"
            application/json:
              schema:
                $ref: "#/components/schemas/dataDefinition"
              examples:
                json:
                  $ref: "#/components/examples/getDataDefResp"
        "400":
          description: The information sent in the request body contains an error
            or is incomplete
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: Data definition not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
        "412":
          description: The 'If-Match' request header did not match the resource's
            entity tag.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/preConditionFailed"
        "428":
          description: The request headers did not include an 'If-Match' precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/preConditionRequired"
    delete:
      tags:
      - Data Definition
      summary: Delete a data definition
      description: Deletes a data definition specified by the id
      operationId: deleteDataDefinition
      parameters:
      - name: dataDefinitionId
        in: path
        description: The id of the data definition to find.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Data definition not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
  "/dataDefinitions/{dataDefinitionId}/dataUpdateJobs":
    post:
      tags:
      - Data Definition
      summary: Update Input Data
      description: Updates the input data that needs to be updated from the source
      operationId: createDataUpdateJob
      parameters:
      - name: dataDefinitionId
        in: path
        description: The id of the data definition for which to update the input data.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK. Input table is updated successfully. Job is return with
            "complete" state.
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/dataUpdateResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/dataUpdateResponse"
        "404":
          description: Data definition not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
  "/dataDefinitions/{dataDefinitionId}/finalForecast":
    post:
      tags:
      - Data Definition
      summary: Publish Final Forecast
      description: Publishes the final forecast to the table reference specified
      operationId: createFinalForecastTable
      parameters:
      - name: dataDefinitionId
        in: path
        description: The id of the data definition for which to publish the final
          forecast.
        required: true
        schema:
          type: string
      - name: overwrite
        in: query
        description: Indicate desire to overwrite existing table at tableRef.
        required: false
        schema:
          type: boolean
          default: false
      - name: promote
        in: query
        description: Indicate desire to promote the table at tableRef.
        required: false
        schema:
          type: boolean
          default: true
      requestBody:
        content:
          application/vnd.sas.forecasting.table.reference+json:
            schema:
              $ref: "#/components/schemas/tableReference"
            examples:
              json:
                $ref: "#/components/examples/publishFFRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/tableReference"
            examples:
              json:
                $ref: "#/components/examples/publishFFRequest"
        description: The table information for the location of the published table.
      responses:
        "201":
          description: OK
          headers:
            Location:
              description: The URI of the new data table.
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for the data table.
              schema:
                type: string
          content:
            application/vnd.sas.data.table+json:
              schema:
                $ref: "#/components/schemas/table"
              examples:
                json:
                  $ref: "#/components/examples/publishFFResp"
            application/json:
              schema:
                $ref: "#/components/schemas/table"
              examples:
                json:
                  $ref: "#/components/examples/publishFFResp"
        "400":
          description: The information sent in the request body contains an error
            or is incomplete
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: Data definition not found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFound"
  "/dataDefinitions/{dataDefinitionId}/hierarchies":
    get:
      tags:
      - Hierarchy
      summary: Get All hierarchies
      description: Returns a list of hierarchies for a data definition. The returned
        items will be media type "application/vnd.sas.analytics.hierarchy".
      operationId: getHierarchies
      parameters:
      - name: dataDefinitionId
        in: path
        description: The id of the data definition from which to get all hierarchies.
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: Offset of first data definition to retrieve (0-based). Defaults
          to 0
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of data definitions to retrieve. Defaults to 30
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      - name: sortBy
        in: query
        description: Sort criteria for retrieved data definitions (see https://developer.sas.com/rest-apis/forecastingDataDefinition-v2/docs/getting-started/usage-notes#sorting)
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: Filter criteria for retrieved data definitions (see https://developer.sas.com/rest-apis/forecastingDataDefinition-v2/docs/getting-started/usage-notes#filtering)
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/hierarchyCollection"
              examples:
                default:
                  $ref: "#/components/examples/getHierResp"
            application/json:
              schema:
                $ref: "#/components/schemas/hierarchyCollection"
              examples:
                default:
                  $ref: "#/components/examples/getHierResp"
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - application/vnd.sas.collection+json
    post:
      tags:
      - Hierarchy
      summary: Create a hierarchy
      description: Creates a hierarchy
      operationId: createHierarchy
      parameters:
      - name: dataDefinitionId
        in: path
        description: The id of the data definition from which to create the hierarchy.
        required: true
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/hierarchy"
      responses:
        "201":
          description: OK
          headers:
            Location:
              description: The URI of the newly created hierarchy
              schema:
                type: string
                format: uri
            ETag:
              description: E-Tag for the hierarchy.
              schema:
                type: string
          content:
            application/vnd.sas.analytics.forecasting.hierarchy+json:
              schema:
                $ref: "#/components/schemas/hierarchy"
              examples:
                json:
                  $ref: "#/components/examples/getHierarchyResp"
            application/json:
              schema:
                $ref: "#/components/schemas/hierarchy"
              examples:
                json:
                  $ref: "#/components/examples/getHierarchyResp"
        "400":
          description: The information sent in the request body contains an error
            or is incomplete
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/badRequest"
