---
openapi: 3.0.3
info:
  title: Visual Investigator Alerts
  description: |-
    The Visual Investigator Alerts API supports managing alerts in SAS Visual Investigator.
  version: '7'
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
  license:
    name: Terms of Use
    url: 'https://www.sas.com/en_us/legal/copyright.html'
tags:
- name: Alerts
  description: The endpoints for managing alerts including creating, updating, retrieval,
    and deletion.
- name: Alerting Events
  description: The endpoints for managing alerting events including creating, update,
    retrieval, and deletion.
- name: Alerting Event Metadata
  description: The endpoints for retrieving alerting event metadata.
- name: Alert Dispositions
  description: The endpoints for managing alert dispositions including creating, update,
    retrieval, and deletion.
- name: Alert Metadata
  description: The endpoints for retrieving alert metadata.
- name: Alert Actions
  description: The endpoints for performing alert actions.
- name: Reports
  description: The endpoints to manage reports for assignments and dispositions.
- name: Replication Analyzer
  description: The endpoints for retrieving replication analyze or repair.  These
    are used for debugging purposes.
- name: Suppressed Scenarios
  description: The endpoints for retrieving and deleting suppressed scenarios.
- name: Replicated Objects
  description: The endpoints for retrieving replicated objects.
- name: Scenario Fired Events
  description: Endpoints for retrieving scenario fired events.
- name: Scenario Fired Event Dispositions
  description: Endpoints for managing scenario fired event dispositions.
- name: Scenario Fired Event Metadata
  description: The endpoints for retrieving scenario fired event metadata.
- name: Scenarios
  description: The endpoints for retrieving scenario dispositions.
- name: Root
  description: The root of the API.
- name: Executions
  description: The endpoints for retrieving and deleting executions.
- name: Queues
  description: The endpoints for creating, updating, retrieving, and deleting queues.
- name: Strategies
  description: The endpoints for creating, updating, upserting, retrieving, and deleting
    strategies.
- name: Config
  description: The endpoints for creating and retrieving transport service import
    configurations.
- name: Routing Rules
  description: The endpoints for creating, updating, upserting, retrieving, and deleting
    routing rules.
- name: Logic Expressions
  description: The endpoints for creating, updating, upserting,  retrieving, and deleting
    logic expressions.
- name: Enrichment Fields
  description: The endpoints for creating, updating, upserting, and retrieving enrichment
    fields.
- name: Domains
  description: The endpoints for creating, updating, upserting, retrieving, and deleting
    domains.
- name: Scenario Tags
  description: The endpoints for creating, updating, upserting, and retrieving scenario
    tags.
- name: Triage Definitions
  description: The endpoints for creating, updating, upserting, and retrieving triage
    definitions.
- name: Metrics
  description: The endpoints for retrieving metrics.
paths:
  /queues:
    post:
      tags:
      - Queues
      summary: "Upsert or create a queue"
      operationId: "createQueue"
      description: Upserts existing queues or creates a new queue.
      parameters:
      - name: "Accept-Item"
        in: "header"
        required: false
        description: Specifies the media type of the items returned.
        schema:
          type: "string"
          enum:
          - "application/vnd.sas.investigation.triage.queue+json"
          - "application/vnd.sas.collection+json"
      requestBody:
        content:
          application/vnd.sas.investigation.triage.queue+json:
            schema:
              $ref: "#/components/schemas/queueRep"
            examples:
              queueExample:
                $ref: "#/components/examples/QueueExample"
          application/json:
            schema:
              $ref: "#/components/schemas/queueRep"
            examples:
              queueExample:
                $ref: "#/components/examples/QueueExample"
          application/vnd.sas.collection+json:
            schema:
              $ref: "#/components/schemas/queueRep"
            examples:
              queueExample:
                $ref: "#/components/examples/QueueExample"
        required: true
      responses:
        "201":
          description: "A queue was created."
          headers:
            Content-Type:
              description: The content type of the response.
              schema:
                type: string
            Location:
              description: The URI of the new queue.
              schema:
                type: string
          content:
            application/vnd.sas.investigation.triage.queue+json:
              schema:
                $ref: "#/components/schemas/queueRep"
              examples:
                queueExample:
                  $ref: "#/components/examples/QueueExample"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/queueRep"
              examples:
                queueExample:
                  $ref: "#/components/examples/QueueExample"
            application/json:
              schema:
                $ref: "#/components/schemas/queueRep"
              examples:
                queueExample:
                  $ref: "#/components/examples/QueueExample"
        '400':
          description: "The request was invalid"
          content:
            application/vnd.sas.error+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error2'
                - $ref: '#/components/schemas/validationFailure'
              examples:
                error2Response400:
                  $ref: '#/components/examples/error2Response400'
                error2ValidationFailureResponse:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '409':
          description: "The request could not be completed due to a conflict with\
            \ the current state of the queue."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response409:
                  $ref: '#/components/examples/error2Response409'
        '500':
          description: "The request could not be fulfilled because of an unexpected\
            \ server error."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response500:
                  $ref: '#/components/examples/error2Response500'
    get:
      tags:
      - Queues
      summary: "Get queues"
      operationId: "getQueues"
      description: Returns queues based on a standard filter.
      parameters:
      - name: "userId"
        in: "query"
        required: false
        description: Specifies the identifier for the given user.
        schema:
          type: "string"
          maxLength: 255
      - name: "start"
        in: "query"
        required: false
        description: Specifies the index of the first item to return. The default
          value is 0.
        schema:
          type: "integer"
          format: "int32"
          default: 0
          minimum: 0
      - name: "limit"
        in: "query"
        required: false
        description: Specifies the maximum number of items to return. The default
          value is 10.
        schema:
          type: "integer"
          format: "int32"
          default: 10
          minimum: 0
      - name: "sortBy"
        in: "query"
        required: false
        description: >-
          Specifies the criteria for sorting the items. See [Sorting in REST
          APIs](https://developer.sas.com/rest-apis/svi-alert-v3/docs/getting-started/usage-notes#sorting).
        schema:
          type: "string"
          default: "creationTimeStamp:descending"
          maxLength: 1000
      - name: "filter"
        in: "query"
        required: false
        description: >-
          Specifies the criteria for filtering the items. See [Filtering in REST
          APIs](https://developer.sas.com/rest-apis/svi-alert-v3/docs/getting-started/usage-notes#filtering).
        schema:
          type: "string"
          maxLength: 1000
      - name: "Accept-Item"
        in: "header"
        required: false
        description: Specifies the media type of the items returned.
        schema:
          type: "string"
          enum:
          - "application/vnd.sas.investigation.triage.queue+json"
      responses:
        "200":
          description: "The request succeeded."
          headers:
            Content-Type:
              description: Specifies the content type of the response.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/queueCollectionRep"
              examples:
                queueCollectionExample:
                  $ref: "#/components/examples/QueueCollectionExample"
            application/json:
              schema:
                $ref: "#/components/schemas/queueCollectionRep"
              examples:
                queueCollectionExample:
                  $ref: "#/components/examples/QueueCollectionExample"
        '400':
          description: "The request was invalid."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/validationFailure'
              examples:
                error2ValidationFailureResponse:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        '500':
          description: "The request could not be fulfilled because of an unexpected\
            \ server error."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response500:
                  $ref: '#/components/examples/error2Response500'
  /queues/{queueId}:
