            application/vnd.sas.investigation.triage.scorecard+json:
              schema:
                $ref: "#/components/schemas/responseEntity"
              examples:
                headResponse:
                  $ref: '#/components/examples/headResponseExample'
            application/json:
              schema:
                $ref: "#/components/schemas/responseEntity"
              examples:
                headResponse:
                  $ref: '#/components/examples/headResponseExample'
        '400':
          description: "The request was invalid."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/validationFailure'
              examples:
                error2ValidationFailureResponse:
                  $ref: '#/components/examples/error2ValidationFailureResponse'
        "404":
          description: "No alert exists at the requested path."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response404:
                  $ref: '#/components/examples/error2Response404'
        "500":
          description: "The request could not be fulfilled because of an unexpected\
            \ server error."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              examples:
                error2Response500:
                  $ref: '#/components/examples/error2Response500'
