  /replicationAnalyzer/analyze:
    get:
      tags:
      - Replication Analyzer
      summary: "Get replication analyzer"
      operationId: "getMissingReplicationCount"
      description: |
        Returns the count of scenario-fired events where replication is missing.
        1. Use the 'analyze' endpoint to see whether there is missing replication. 
        2. Use the 'repair' endpoint to replicate what is missing. 
        3. Optionally, check the replication queue in the RabbitMQ UI and wait for the replication queue to fully drain. 
        4. Repeat until there is no missing replication in the 'analyze' response. Return the count of SFEs.
      responses:
        "200":
          description: "The request succeeded."
          headers:
            Content-Type:
              description: Specifies the content type of the response.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
              example: "0"
  /replicationAnalyzer/repair:
    get:
      tags:
      - Replication Analyzer
      summary: "Get replication analyzer repair messages"
      operationId: "getSendMessagesForMissingReplication"
      description: |
        Sends replication messages for every SFE where replication is missing and then returns the count of SFEs where repair was initiated.
        1. To prevent too many SFEs from missing replication, there is a limit to how many SFE repairs can be initiated at one time. This parameter defaults to 10000.
        2. The repair does not take effect until all other outstanding messages on the replication queue in RabbitMQ are processed.
      parameters:
      - name: "limit"
        in: "query"
        required: false
        description: Specifies the maximum number of items to return. The default
          value is 10.
        schema:
          type: "integer"
          format: "int32"
          default: 10
      responses:
        "200":
          description: "The request succeeded."
          headers:
            Content-Type:
              description: Specifies the content type of the response.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
              example: "0"
