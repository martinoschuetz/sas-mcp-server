  /v1/workflows/reviews/{reviewId}/alert-disposition:
    post:
      tags:
      - AML Workflow Controller
      summary: Alert Disposition
      description: Alert Disposition
      operationId: alertDisposition
      parameters:
      - name: reviewId
        in: path
        description: EDD Review ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDispositionRep'
      responses:
        "204":
          description: Alert Disposition successful
        "400":
          description: Alert Disposition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Review or Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/:
    get:
      tags:
      - /
      summary: Returns all available collections and top-level resources
      description: Returns all available collections and top-level resources
      operationId: root
      responses:
        "200":
