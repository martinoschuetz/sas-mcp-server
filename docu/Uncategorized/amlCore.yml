---
openapi: 3.0.1
info:
  title: Anti-Money Laundering Core
  description: An API for Anti-Money Laundering Solution.
  version: "1"
servers:
- url: http://example.com/amlCore
  description: Example base url.
paths:
  /v1/entityTypes/updatedReportsLinksAndEfile:
    put:
      tags:
      - AML Entity Controller
      summary: "Update reports, links, and efile"
      description: "Update reports and links, and optionally, update efile"
      operationId: updateReportsLinksAndEfile
      parameters:
      - name: efileId
        in: query
        required: false
        schema:
          type: string
      - name: newEfileStatus
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportsAndLinksPayload'
        required: true
      responses:
        "400":
          description: "reports, links, efile update failed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsAndLinksPayload'
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/ReportsAndLinksPayload'
        "412":
          description: "reports, links, efile update failed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsAndLinksPayload'
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/ReportsAndLinksPayload'
        "200":
          description: "reports, links, efile update successful"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsAndLinksPayload'
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/ReportsAndLinksPayload'
        "428":
          description: "reports, links, efile update failed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsAndLinksPayload'
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/ReportsAndLinksPayload'
  /v1/entityTypes/{entityType}/entities/{entityId}/createdReport:
    post:
      tags:
      - AML Entity Controller
      summary: Create regulatory report
      description: "Create regulatory report, including child entities"
      operationId: postCreateReport
      parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
      - name: entityId
        in: path
        required: true
        schema:
          type: string
      - name: formConfigurationId
        in: query
        required: true
        schema:
          type: string
      - name: createType
        in: query
        required: false
        schema:
          type: string
          default: default
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityRep'
      responses:
        "404":
          description: entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedDocument'
        "400":
          description: report creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedDocument'
        "201":
          description: report creation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedDocument'
  /v1/entityTypes/{entityType}/entities/{entityId}/clonedEntity:
    post:
      tags:
      - AML Entity Controller
      summary: Clone DataHub entity
      description: "Clone DataHub entity, including child entities"
      operationId: postCloneEntity
      parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
      - name: entityId
        in: path
        required: true
        schema:
          type: string
      responses:
        "201":
          description: entity cloning successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedDocument'
        "404":
          description: entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedDocument'
        "400":
          description: entity cloning failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedDocument'
  /v1/entityTypes/{entityType}/entities/{entityId}/clonedAndLinkedEntity:
    post:
      tags:
      - AML Entity Controller
      summary: Clone and link DataHub entity
      description: "Clone DataHub entity, including child entities, and link to related\
        \ entity"
      operationId: postCloneAndLinkEntity
      parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
      - name: entityId
        in: path
        required: true
        schema:
          type: string
      - name: fromEntityId
        in: query
        required: true
        schema:
          type: string
      - name: fromEntityType
        in: query
        required: true
        schema:
          type: string
      - name: includeRelationships
        in: query
        required: false
        schema:
          type: string
      - name: resetType
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityRep'
      responses:
        "201":
          description: entity cloning successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAndLink'
        "404":
          description: entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAndLink'
        "400":
          description: entity cloning failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAndLink'
  /v1/commons/validations/eFilingBatches:
    post:
      tags:
      - AML Validation Controller
      summary: Validates eFilingBatch against the schema
      description: "Validates eFilingBatch against the schema, returns list of errors"
      operationId: postEFilingBatches
      parameters:
      - name: schemaName
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/xml:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: Validation was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionValidationResponse'
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionValidationResponse'
            application/vnd.sas.validation+json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionValidationResponse'
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionValidationResponse'
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionValidationResponse'
            application/vnd.sas.validation+json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionValidationResponse'
  /v1/alerts:
    post:
      tags:
      - AML Alert Controller
      summary: Closes CRR alert
      description: Closes CRR alert
      operationId: closeCRRAlert
      parameters:
      - name: disposition
        in: query
        required: false
        schema:
          type: string
      - name: partyNumber
        in: query
        required: false
        schema:
          type: string
      - name: currentScore
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: overrideScoreCode
        in: query
        required: false
        schema:
          type: string
      - name: overrideCrrUpdate
        in: query
        required: false
        schema:
          type: boolean
      - name: action
        in: query
        required: true
        schema:
          type: string
        description: Action to be performed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRep'
          application/vnd.sas.investigation.triage.alert+json:
            schema:
              $ref: '#/components/schemas/AlertRep'
      responses:
        "201":
          description: The operation was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CDDEntityFact'
            application/vnd.sas.aml.alert.parameter+json:
              schema:
                $ref: '#/components/schemas/CDDEntityFact'
        "400":
          description: The operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CDDEntityFact'
            application/vnd.sas.aml.alert.parameter+json:
              schema:
                $ref: '#/components/schemas/CDDEntityFact'
    patch:
      tags:
      - AML Alert Controller
      summary: Change network risk
      description: Change network risk
      operationId: changeNetworkRisk
      parameters:
      - name: overrideNetworkClassification
        in: query
        required: false
        schema:
          type: string
      - name: partyNumber
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRep'
          application/vnd.sas.investigation.triage.alert+json:
            schema:
              $ref: '#/components/schemas/AlertRep'
      responses:
        "201":
          description: The operation was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkClassification'
            application/vnd.sas.aml.alert.parameter+json:
              schema:
                $ref: '#/components/schemas/NetworkClassification'
        "400":
          description: The operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkClassification'
            application/vnd.sas.aml.alert.parameter+json:
              schema:
                $ref: '#/components/schemas/NetworkClassification'
  /v1/facts:
    patch:
      tags:
      - AML Fact Controller
      summary: Patch fact table
      description: Patch arbitrary column in the fact table
      operationId: patchFact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/factParameter'
          application/vnd.sas.aml.fact.parameter+json:
            schema:
              $ref: '#/components/schemas/factParameter'
        required: true
      responses:
        "404":
          description: Patch has failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/factParameter'
            application/vnd.sas.aml.fact.parameter+json:
              schema:
                $ref: '#/components/schemas/factParameter'
        "200":
          description: Patch was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/factParameter'
            application/vnd.sas.aml.fact.parameter+json:
              schema:
                $ref: '#/components/schemas/factParameter'
        "422":
          description: Patch has failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/factParameter'
            application/vnd.sas.aml.fact.parameter+json:
              schema:
                $ref: '#/components/schemas/factParameter'
        "400":
          description: Patch has failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/factParameter'
            application/vnd.sas.aml.fact.parameter+json:
              schema:
                $ref: '#/components/schemas/factParameter'
        "412":
          description: Patch has failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/factParameter'
            application/vnd.sas.aml.fact.parameter+json:
              schema:
                $ref: '#/components/schemas/factParameter'
  /v1/entityTypes/{entityType}/entities/{entityId}/updatedEntities:
    patch:
      tags:
      - AML Entity Controller
      summary: Update entity's field
      description: Update the field of entity and any related entities included
      operationId: patchEntityField
      parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
      - name: entityId
        in: path
        required: true
        schema:
          type: string
      - name: fieldName
        in: query
        required: true
        schema:
          type: string
      - name: fieldValue
        in: query
        required: true
        schema:
          type: string
      - name: includeRelationships
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: entity update successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrichedDocument'
        "404":
          description: entity not found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrichedDocument'
        "412":
          description: preconditions not met
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrichedDocument'
        "422":
          description: entity not processable
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrichedDocument'
        "400":
          description: entity update failed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrichedDocument'
  /v1/transactions:
    get:
      tags:
      - AML Transaction Controller
      summary: Returns a list of entity transaction records
      description: Returns a list of entity transaction records
      operationId: getEntityTransactionsFromCore
      parameters:
      - name: entityNumber
        in: query
        required: false
        schema:
          type: string
      - name: entityKey
        in: query
        required: false
        schema:
          type: string
      - name: entityLevelCode
        in: query
        required: true
        schema:
          type: string
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: start
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
      - name: previousCount
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: relationships
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionEntityTransaction'
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionEntityTransaction'
            application/vnd.sas.aml.transaction+json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionEntityTransaction'
  /v1/transactions/{partyNumber}/scoringDates:
    get:
      tags:
      - AML Transaction Controller
      summary: Returns a list of scoring dates
      description: Returns a list of scoring dates
      operationId: getScoringDates
      parameters:
      - name: partyNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date-time
            application/vnd.sas.collection+json:
              schema:
                type: array
                items:
                  type: string
                  format: date-time
  /v1/transactions/kcPrepTables:
    get:
      tags:
      - AML Transaction Controller
      summary: Returns a list tables with prep records from KC
      description: Returns a list tables with prep records from KC
      operationId: getKCPrepRecords
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: tables
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
      - name: mapping
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/table'
            application/vnd.sas.collection+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/table'
  /v1/transactions/search:
    get:
      tags:
      - AML Transaction Controller
      summary: Returns a list of transaction records
      description: Returns a list of transaction records. Returns a maximum of 1000
        records. Use the filter parameter to search on transaction columns.
      operationId: searchTransactions
      parameters:
      - name: filter
        in: query
        description: A filter to apply to the transactions.
        required: false
        schema:
          $ref: '#/components/schemas/documentFilterRequest'
      - name: table
        in: query
        description: Name of the AML core table to search in.
        required: true
        schema:
          type: string
      - name: objectType
        in: query
        description: The object type used to search for related transactions.
        required: false
        schema:
          type: string
      - name: objectId
        in: query
        description: The object id used to search for related transactions.
        required: false
        schema:
          type: string
      - name: relatedTransactionsOnly
        description: If true, the results are limited to transactions associated with
          the specified objectType and objectId. These related transactions represent
          the context records linked to one or more alerts.
        in: query
        required: false
        schema:
          type: boolean
      - name: triggeringTransactionsOnly
        description: If true, the results are limited to related triggering transactions
          associated with the specified objectType and objectId.
        in: query
        required: false
        schema:
          type: boolean
      - name: productiveSFEOnly
        description: If true, the results are limited to related transactions with
          productive scenario-fired events associated with the specified objectType
          and objectId.
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceCollectionTransaction'
            application/vnd.sas.collection+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceCollectionTransaction'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/transactions/columns:
    get:
      tags:
      - AML Transaction Controller
      summary: Returns a list of columns from core transaction tables
      description: Returns a list of columns from core transaction tables
      operationId: getTransactionColumns
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/transactionTable'
            application/vnd.sas.collection+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/transactionTable'
  /v1/transactions/processAndLink:
    post:
      tags:
      - AML Transaction Controller
      summary: Creates/Updates and links a list of transactions
      description: Creates/Updates and links a list of transactions
      operationId: processAndLinkTransactions
      parameters:
      - name: Accept
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.sas.aml.transaction.link.payload
          - application/vnd.sas.aml.transaction.link.payload.v1
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.sas.aml.transaction.link.rep
          - application/vnd.sas.aml.transaction.link.rep.v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionLinkRep'
          application/vnd.sas.aml.transaction.link.rep:
            schema:
              $ref: '#/components/schemas/TransactionLinkRep'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.aml.transaction.link.payload:
              schema:
                $ref: '#/components/schemas/TransactionLinkPayload'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "415":
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/resources:
    get:
      tags:
      - AML Resources Controller
      summary: Returns the localized text for the UI
      description: Returns the localized text for the UI.
      operationId: getResources
      parameters:
      - name: locale
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The operation was successful
          content:
            application/vnd.sas.aml.import.resources+json:
              schema:
                $ref: '#/components/schemas/resourcesRep'
            application/json:
              schema:
                $ref: '#/components/schemas/resourcesRep'
  /v1/preferences:
    get:
      tags:
      - AML Preferences Controller
      summary: Returns preferences
      description: Returns preferences
      operationId: getPreferences
      responses:
        "200":
          description: The operation was successful
          content:
            application/json:
              schema:
                type: string
            application/vnd.sas.collection+json:
              schema:
                type: string
            application/vnd.sas.aml.preference+json:
              schema:
                type: string
        "400":
          description: One or more request parameters were invalid
          content:
            application/json:
              schema:
                type: string
            application/vnd.sas.collection+json:
              schema:
                type: string
            application/vnd.sas.aml.preference+json:
              schema:
                type: string
  /migration/comments:
    get:
      tags:
      - AML Migration Controller
      summary: comment migration
      description: comment migration
      operationId: getCommentMigration
      parameters:
      - name: action
        in: query
        required: true
        schema:
          type: string
      - name: objectTypeCode
        in: query
        required: false
        schema:
          type: string
      - name: objectId
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/migrationStatus'
            application/vnd.sas.aml.migration.status+json:
              schema:
                $ref: '#/components/schemas/migrationStatus'
  /migration/comments/logs:
    get:
      tags:
      - AML Migration Controller
      summary: Get comment migration logs
      description: Get comment migration logs
      operationId: getCommentMigrationLogs
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: start
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionMigrationLog'
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionMigrationLog'
  /migration/attachments:
    get:
      tags:
      - AML Migration Controller
      summary: attachment migration
      description: attachment migration
      operationId: getAttachmentMigration
      parameters:
      - name: action
        in: query
        required: true
        schema:
          type: string
      - name: objectTypeCode
        in: query
        required: false
        schema:
          type: string
      - name: objectId
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/migrationStatus'
            application/vnd.sas.aml.migration.status+json:
              schema:
                $ref: '#/components/schemas/migrationStatus'
  /migration/attachments/logs:
    get:
      tags:
      - AML Migration Controller
      summary: Get attachment migration logs
      description: Get attachment migration logs
      operationId: getAttachmentMigrationLogs
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: start
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionMigrationLog'
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/ResourceCollectionMigrationLog'
  /v1/licenses/{productId}:
    get:
      tags:
      - AML License Information Controller
      summary: Returns information about license expiration
      description: "Returns number of days left for license expiration, grace period,\
        \ and warning period"
      operationId: getLicenseInformation
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "404":
          description: License Information not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/licenseInformation'
            application/vnd.sas.aml.license.information+json:
              schema:
                $ref: '#/components/schemas/licenseInformation'
        "200":
          description: License Information fetch was successful
          content:
            application/json:
              schema:
