            href: /clinicalEnrollmentSimulation/sites/a1307846-53a3-4335-a475-9fa0e44594f5
            uri: /clinicalEnrollmentSimulation/sites/a1307846-53a3-4335-a475-9fa0e44594f5
          - method: GET
            rel: getCountry
            href: /clinicalEnrollmentSimulation/countries/01d26343-d19a-4414-a285-081959d44096
            uri: /clinicalEnrollmentSimulation/countries/01d26343-d19a-4414-a285-081959d44096
            type: application/vnd.sas.ctres.country
        - version: 2
          httpStatusCode: 400
          errorCode: 10011501
          message: "Line 2: The site body is invalid or missing."
          details:
          - "Line 2: Allergy: Min Startup Time Distribution must be a float greater\
            \ than 0, with the Min <= Median <= Max."
          - "Line 2: Allergy: Median Startup Time Distribution must be a float greater\
            \ than 0, with Min <= Median <= Max."
          - "Line 2: Allergy: Max Startup Time Distribution must be a float greater\
