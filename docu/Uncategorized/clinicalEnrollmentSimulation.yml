          type: string
          maxLength: 1000
          example: This study tests the ACME Drug.
        therapeuticAreaId:
          title: Therapeutic Area ID
          description: The identifier for the associated therapeutic area.
          type: string
          maxLength: 36
          example: 14980789-ecf9-400b-9ba7-1b1baca41c4e
