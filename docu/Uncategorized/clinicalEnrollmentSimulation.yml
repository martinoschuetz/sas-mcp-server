                    title: Site Creation Time
                    description: Creation date of this site.
                    type: string
                    format: date-time
                  modifiedBy:
                    title: Site Last Modified By
                    description: The userid of the user who last modified the site.
                    type: string
                    example: userid
                  modifiedTimeStamp:
                    title: Site Last Modified Time
                    description: Date of last modification.
                    type: string
                    format: date-time
