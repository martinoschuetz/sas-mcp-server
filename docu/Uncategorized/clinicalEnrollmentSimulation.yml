    scenario:
      title: A Scenario
      description: The scenario object.
      required:
      - name
      - attributes
      - state
      - studyId
      properties:
        version:
          title: Representation Version
          description: This media type's schema version number. This representation
            is version 1.
          type: integer
          example: 1
        id:
          title: Scenario ID
          description: >
            The unique identifier for a scenario. If not provided when creating
            a scenario, one will be generated for the user. Must be a valid v4
            UUID.
          type: string
          maxLength: 36
          example: 48ac0588-028c-4869-a756-2ffe5cce0ab4
        name:
          title: Scenario Name
          description: The given name for a scenario. This must be unique.
          type: string
          maxLength: 100
          example: ACME Scenario
        description:
          title: Scenario Description
          description: The given description for a scenario. Optional.
          type: string
          maxLength: 1000
          example: This scenario tests the ACME Drug.
        state:
          title: Scenario State
          description: The state of a scenario.
          type: string
          maxLength: 100
          example: In Progress
        studyId:
          title: Study ID
          description: The ID of the study that the scenario belongs to. Cannot be
            changed after creation.
          type: string
          maxLength: 36
          example: a89d6f9b-8dda-4ed7-9fa9-920e8196ce38
        studyUri:
          title: Study URI
          description: The full URI to the study the scenario belongs to.
          type: string
          example: /clinicalEnrollmentSimulation/studies/a89d6f9b-8dda-4ed7-9fa9-920e8196ce38
        attributes:
          title: Scenario Attributes
          description: The attributes for this scenario.
          type: object
          properties:
            archived:
              title: Archived
              description: The flag for marking a scenario as archived. Cannot be
                changed after setting to true.
              type: boolean
              example: true
            archivedDescription:
              title: Archived Description
              description: The given description for archiving a scenario. Optional.
              type: string
              maxLength: 1000
              example: This scenario is archived for review.
            subjectEnrollment:
              title: Subject Enrollment
              description: The target number of patients to enroll in the scenario.
              type: integer
              minimum: 1
              example: 1234
            startDate:
              title: Study Start Date
              description: The date when the study begins.
              type: string
              format: date-time
            countries:
              title: Countries
              description: The countries used in a scenario.
              type: array
              items:
                title: A Scenario Country
                description: The country object being used within a scenario.
                required:
                - id
                - startupCost
                - minTime
                - medianTime
                - maxTime
                - startProbability
                - concurrentSites
                - screenFailureRate
                properties:
                  id:
                    title: Country ID
                    description: The unique identifier for a country.
                    type: string
                    readOnly: true
                    maxLength: 36
                    example: 01d26343-d19a-4414-a285-081959d44096
                  name:
                    title: Country Name
                    description: The given name for a country. This must be unique.
                    type: string
                    readOnly: true
                    maxLength: 100
                    example: Brazil
                  description:
                    title: Country Description
                    description: The given description for a country. Optional.
                    readOnly: true
                    type: string
                    maxLength: 1000
                    example: Description and notes that apply to Brazil.
                  startupCost:
                    title: Startup Cost
                    description: The startup cost for the country.
                    type: integer
                    minimum: 0
                    example: 1234
                  minTime:
                    title: Minimum Startup Time
                    description: The minimum startup time in days.
                    type: integer
                    minimum: 0
                    example: 7
                  medianTime:
                    title: Median Startup Time
                    description: The most common startup time in days.
                    type: integer
                    minimum: 0
                    example: 14
                  maxTime:
                    title: Maximum Startup Time
                    description: The maximum startup time in days.
                    type: integer
                    minimum: 0
                    example: 21
                  startProbability:
                    title: Startup Success Probability
                    description: The percent probability of startup success.
                    type: integer
                    minimum: 0
                    maximum: 100
                    example: 100
                  concurrentSites:
                    title: Concurrent Site Startups Possible
                    description: The amount of concurrent site startups possible.
                    type: integer
                    minimum: 0
                    example: 12
                  screenFailureRate:
                    title: Screen Failure Rate
                    description: The expected screen failure rate for subjects in
                      this country.
                    type: number
                    minimum: 0
                    maximum: 100
                    example: 5
            sites:
              title: Sites
              description: The sites used in a scenario.
              type: array
              items:
                title: A Scenario Site
                description: The site object being used within a scenario.
                required:
                - id
                - startupCost
                - minTime
                - medianTime
                - maxTime
                - startProbability
                - noSubjectsProbability
                - highRecruitmentRate
                - lowRecruitmentRate
                - monthsHighRecruitment
                - subjectScreenCost
                - subjectCompletionCost
                - numberAvailable
                properties:
                  id:
                    title: Site ID
                    description: The unique identifier for a site.
                    type: string
                    readOnly: true
                    maxLength: 36
                    example: a1307846-53a3-4335-a475-9fa0e44594f5
                  name:
                    title: Site Name
                    description: The given name for a site. This must be unique.
                    type: string
                    readOnly: true
                    maxLength: 100
                    example: Site01
                  description:
                    title: Site Description
                    description: The given description for a site. Optional.
                    type: string
                    readOnly: true
                    maxLength: 1000
                    example: Description and notes that apply to Site01.
                  countryId:
                    title: Site Country ID
                    description: The unique identifier for the Country a site belongs
                      to.
                    type: string
                    readOnly: true
                    maxLength: 36
                    example: 01d26343-d19a-4414-a285-081959d44096
                  startupCost:
                    title: Startup Cost
                    description: The startup cost for the site.
                    type: integer
                    minimum: 0
                    example: 1234
                  minTime:
                    title: Minimum Startup Time
                    description: The minimum startup time in days.
                    type: integer
                    minimum: 0
                    example: 7
                  medianTime:
                    title: Median Startup Time
                    description: The most common startup time in days.
                    type: integer
                    minimum: 0
                    example: 14
                  maxTime:
                    title: Maximum Startup Time
                    description: The maximum startup time in days.
                    type: integer
                    minimum: 0
                    example: 21
                  startProbability:
                    title: Startup Success Probability
                    description: The percent probability of startup success.
                    type: integer
                    minimum: 0
                    maximum: 100
                    example: 100
                  noSubjectsProbability:
                    title: Probability of 0 Subjects
                    description: The percent probability of 0 subjects.
                    type: integer
                    minimum: 0
                    maximum: 100
                    example: 100
                  highRecruitmentRate:
                    title: Highest Expected Recruitment Rate
                    description: The highest rate of recruitment.
                    type: integer
                    minimum: 0
                    example: 22
                  lowRecruitmentRate:
                    title: Lowest Expected Recruitment Rate
                    description: The lowest rate of recruitment.
                    type: integer
                    minimum: 0
                    example: 11
                  monthsHighRecruitment:
                    title: Months in High Recruitment Rate
                    description: The amount of months in high recruitment rate.
                    type: integer
                    minimum: 0
                    example: 10
                  subjectScreenCost:
                    title: Subject Screening Cost
                    description: The cost of screening per subject.
                    type: integer
                    minimum: 0
                    example: 1234
                  subjectCompletionCost:
                    title: Subject Completion Cost
                    description: The cost per subject for all visits.
                    type: integer
                    minimum: 0
                    example: 1234
                  numberAvailable:
                    title: Number of Available Sites
                    description: The number of available sites.
                    type: integer
                    minimum: 1
                    example: 12
            cohorts:
              title: Cohorts
              description: The cohorts used in a scenario.
              type: array
              items:
                $ref: "#/components/schemas/study/properties/attributes/properties/cohorts/items"
            visits:
              title: Visits
              description: The visits used in a scenario.
              type: array
              items:
                $ref: "#/components/schemas/study/properties/attributes/properties/visits/items"
            locked:
              title: Locked
              description: The flag for marking a scenario as locked. Cannot be changed
                after setting to true.
              type: boolean
              example: true
            lockedDescription:
              title: Locked Description
              description: The given description for locking a scenario. Optional.
              type: string
              maxLength: 1000
              example: This scenario is locked for review.
        createdBy:
          title: Scenario Created By
          description: The userid of the user who created this scenario.
          type: string
          example: userid
        creationTimeStamp:
          title: Scenario Creation Time
          description: Creation date of this scenario.
          type: string
          format: date-time
        modifiedBy:
          title: Scenario Last Modified By
          description: The userid of the user who last modified the scenario.
          type: string
          example: userid
        modifiedTimeStamp:
          title: Scenario Last Modified Time
          description: Date of last modification.
          type: string
          format: date-time
        links:
          type: array
          title: Scenario Links
          description: Links that apply to this object.
          items:
            $ref: "#/components/schemas/study/properties/links/items"
          example:
          - method: GET
            rel: self
