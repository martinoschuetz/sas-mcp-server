---
openapi: 3.0.3
info:
  version: "1"
  title: Clinical Trial Enrollment Simulator
  description: >
    The Clinical Trial Enrollment Simulator (CTrES) API provides basic create,
    read, update, and delete  functions on resources necessary for the running
    of trial enrollment simulations. The API makes use of SAS/CASL and computes
    expected patient enrollment based on input provided to the application.
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- description: Mock server
  url: http://example.com/clinicalEnrollmentSimulation
tags:
- name: Root
  description: The operations for the root resource.
- name: Studies
  description: The operations for study resources.
- name: Scenarios
  description: The operations for scenario resources.
- name: Simulations
  description: The operations for simulation resources.
- name: Countries
  description: The operations for country resources.
- name: Therapeutic Areas
  description: The operations for therapeutic areas.
- name: Sites
  description: The operations for site resources.
- name: Recent
  description: The operations for recent activity resources.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                title: API
                description: The list of links to top-level resources and operations
                  available from the root of the API.
                x-sas-media-type:
                  name: application/vnd.sas.api
                  version: 1
                required:
                - version
                - links
                properties:
                  version:
                    type: integer
                    description: The version number of the API representation. This
                      is version 1.
                    minimum: 1
                  links:
                    description: The API's top-level links.
                    type: array
                    items:
                      $ref: "#/components/schemas/study/properties/links/items"
              example:
                version: 1
                links:
                - method: GET
                  rel: getTherapeuticAreas
                  href: /clinicalEnrollmentSimulation/therapeuticAreas
                  uri: /clinicalEnrollmentSimulation/therapeuticAreas
                  type: application/vnd.sas.collection
                  itemType: application/vnd.sas.ctres.therapeutic-area
                - method: POST
                  rel: createTherapeuticArea
                  href: /clinicalEnrollmentSimulation/therapeuticAreas
                  uri: /clinicalEnrollmentSimulation/therapeuticAreas
                  type: application/vnd.sas.ctres.therapeutic-area
                  responseType: application/vnd.sas.ctres.therapeutic-area
                - method: GET
                  rel: getCountryNames
                  href: /clinicalEnrollmentSimulation/countryNames
                  uri: /clinicalEnrollmentSimulation/countryNames
                  type: application/vnd.sas.collection
                  itemType: text/plain
                - method: GET
                  rel: getCountries
                  href: /clinicalEnrollmentSimulation/countries
                  uri: /clinicalEnrollmentSimulation/countries
                  type: application/vnd.sas.collection
                  itemType: application/vnd.sas.ctres.country
                - method: POST
                  rel: createCountry
                  href: /clinicalEnrollmentSimulation/countries
                  uri: /clinicalEnrollmentSimulation/countries
                  type: application/vnd.sas.ctres.country
                  responseType: application/vnd.sas.ctres.country
                - method: POST
                  rel: uploadCountries
                  href: /clinicalEnrollmentSimulation/countries
                  uri: /clinicalEnrollmentSimulation/countries
                  type: multipart/form-data
                  itemType: application/json
                - method: GET
                  rel: getSites
                  href: /clinicalEnrollmentSimulation/sites
                  uri: /clinicalEnrollmentSimulation/sites
                  type: application/vnd.sas.collection
                  itemType: application/vnd.sas.ctres.site
                - method: POST
                  rel: createSite
                  href: /clinicalEnrollmentSimulation/sites
                  uri: /clinicalEnrollmentSimulation/sites
                  type: application/vnd.sas.ctres.site
                  responseType: application/vnd.sas.ctres.site
                - method: POST
                  rel: uploadSites
                  href: /clinicalEnrollmentSimulation/sites
                  uri: /clinicalEnrollmentSimulation/sites
                  type: multipart/form-data
                  itemType: application/json
                - method: GET
                  rel: getStudies
                  href: /clinicalEnrollmentSimulation/studies
                  uri: /clinicalEnrollmentSimulation/studies
                  type: application/vnd.sas.collection
                  itemType: application/vnd.sas.ctres.study
                - method: POST
                  rel: createStudy
                  href: /clinicalEnrollmentSimulation/studies
                  uri: /clinicalEnrollmentSimulation/studies
                  type: application/vnd.sas.ctres.study
                  responseType: application/vnd.sas.ctres.study
                - method: POST
                  rel: uploadStudies
                  href: /clinicalEnrollmentSimulation/studies
                  uri: /clinicalEnrollmentSimulation/studies
                  type: multipart/form-data
                  itemType: application/json
                - method: GET
                  rel: getScenarios
                  href: /clinicalEnrollmentSimulation/scenarios
                  uri: /clinicalEnrollmentSimulation/scenario
                  type: application/vnd.sas.collection
                  itemType: application/vnd.sas.ctres.scenario
                - method: POST
                  rel: createScenario
                  href: /clinicalEnrollmentSimulation/scenarios
                  uri: /clinicalEnrollmentSimulation/scenarios
                  type: application/vnd.sas.ctres.scenario
                  responseType: application/vnd.sas.ctres.scenario
                - method: POST
                  rel: uploadScenarios
                  href: /clinicalEnrollmentSimulation/scenarios
                  uri: /clinicalEnrollmentSimulation/scenarios
                  type: multipart/form-data
                  itemType: application/json
                - method: GET
                  rel: getSimulations
                  href: /clinicalEnrollmentSimulation/simulations
                  uri: /clinicalEnrollmentSimulation/simulations
                  type: application/vnd.sas.collection
                  itemType: application/vnd.sas.ctres.simulations
                - method: GET
                  rel: getRecentActivity
                  href: /clinicalEnrollmentSimulation/recentActivity
                  uri: /clinicalEnrollmentSimulation/recentActivity
                  type: application/vnd.sas.collection
                  itemType: application/vnd.sas.ctres.recent-activity
            application/json:
              schema:
                $ref: "#/paths/~1/get/responses/200/content/application~1vnd.sas.api%2Bjson/schema"
              example:
                version: 1
                links:
                - method: GET
                  rel: getStudies
                  href: /clinicalEnrollmentSimulation/studies
                  uri: /clinicalEnrollmentSimulation/studies
                  type: application/vnd.sas.collection
                  itemType: application/vnd.sas.ctres.study
                - method: POST
                  rel: createStudy
                  href: /clinicalEnrollmentSimulation/studies
                  uri: /clinicalEnrollmentSimulation/studies
                  type: application/vnd.sas.ctres.study
                  responseType: application/vnd.sas.ctres.study
                - method: GET
                  rel: getSimulations
                  href: /clinicalEnrollmentSimulation/simulations
                  uri: /clinicalEnrollmentSimulation/simulations
                  type: application/vnd.sas.collection
                  itemType: application/vnd.sas.ctres.simulations
    head:
      tags:
      - Root
      summary: Get the headers for the API
      description: >
        Returns the headers for the API. Also used to determine whether the
        service provided by the API is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded.
  /studies:
    get:
      tags:
      - Studies
      summary: Get a list of studies
      description: >
        Get a list of all studies. The collection returned can be filtered,
        sorted, and paged. The default sort order will be the study name. It is
        also possible to filter using the functions eq, gt, ge, lt, le, or
        contains. <br> Returned items will be of media type
        application/vnd.sas.ctres.study.
      operationId: getStudies
      parameters:
      - name: Accept
        in: header
        description: >
          The requested representation of the study collection. Media type
          'application/vnd.sas.collection+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/json
      - name: Accept-Item
        in: header
        description: >
          The requested representation of the study items in the collection.
          Media type 'application/vnd.sas.ctres.study+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.ctres.study+json
          - application/vnd.sas.summary+json
          - application/json
      - name: start
        in: query
        description: 0-based Offset of first item to return. Defaults to 0.
        schema:
          type: integer
        example: 100
      - name: limit
        in: query
        description: Maximum number of items to return. Defaults to 20.
        schema:
          type: integer
        example: 10
      - name: filter
        in: query
        description: >
          Filter criteria for returned studies. See [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
        example: eq(name,'ACME')
      - name: sortBy
        in: query
        description: >
          Sort returned items. See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
        example: name
      responses:
        "200":
          description: The request succeeded and matching studies are returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                title: Collection of Studies
                description: This is a collection of studies.
                allOf:
                - $ref: "#/components/schemas/studyUpload/allOf/0"
                - type: object
                  properties:
                    items:
                      type: array
                      description: The actual results of a query
                      items:
                        $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/0"
                example:
                  version: 2
                  accept: application/vnd.sas.ctres.study
                  count: 1
                  start: 0
                  limit: 20
                  name: studies
                  items:
                  - version: 1
                    id: 48ac0588-028c-4869-a756-2ffe5cce0ab4
                    name: ACME Study
                    description: This study tests the ACME Drug.
                    therapeuticAreaId: 14980789-ecf9-400b-9ba7-1b1baca41c4e
                    therapeuticAreaUri: >
                      /clinicalEnrollmentSimulation/therapeuticAreas/14980789-ecf9-400b-9ba7-1b1baca41c4e
                    scenarioCount: 3
                    attributes:
                      archived: false,
                      subjectEnrollment: 1234
                      therapeuticAreaName: Test Therapeutic Area
                      startDate: 2021-09-13
                      firstCountryApprovalDate: 2021-09-13
                      firstSiteStartupDate: 2021-09-14
                      firstSubjectScreeningDate: 2021-09-15
                      firstSubjectEnrollmentDate: 2021-09-16
                      firstSubjectFirstVisitDate: 2021-09-17
                      firstSubjectLastVisitDate: 2021-09-18
                      lastSubjectFirstVisitDate: 2021-09-19
                      lastSubjectLastVisitDate: 2021-09-20
                      enrollmentEndDate: 2021-09-21
                      estimatedCost: 100
                      visits:
                      - id: a1462d80-5423-42be-818a-e2e188bde0d5
                        name: First Visit
                        visitDay: 1
                      - id: 5523e0dc-bbb8-4e4f-9871-e66dcce4cfcf
                        name: Last Visit
                        visitDay: 2
                      cohorts:
                      - id: f2b5a3d4-3c43-48f4-a2b0-8c1027d18cd0
                        name: Everybody
                        enrollmentPercentage: 100
                        earlyTerminationProbability: 1
                    createdBy: userid
                    creationTimeStamp: 2021-06-23T17:21:48.960000Z
                    modifiedBy: userid
                    modifiedTimeStamp: 2021-06-23T17:21:48.960000Z
                    links:
                    - method: GET
                      rel: self
                      href: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                      uri: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                      type: application/vnd.sas.ctres.study
                    - method: PUT
                      rel: update
                      href: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                      uri: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                      type: application/vnd.sas.ctres.study
                      responseType: application/vnd.sas.ctres.study
                    - method: DELETE
                      rel: delete
                      href: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                      uri: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                    - method: GET
                      rel: getTherapeuticArea
                      href: /clinicalEnrollmentSimulation/therapeuticAreas/14980789-ecf9-400b-9ba7-1b1baca41c4e
                      uri: /clinicalEnrollmentSimulation/therapeuticAreas/14980789-ecf9-400b-9ba7-1b1baca41c4e
                      type: application/vnd.sas.ctres.therapeutic-area
                  links:
                  - method: GET
                    rel: collection
                    href: /clinicalEnrollmentSimulation/studies
                    uri: /clinicalEnrollmentSimulation/studies
                    type: application/vnd.sas.collection
                    itemType: application/vnd.sas.ctres.study
                  - method: GET
                    rel: self
                    href: /clinicalEnrollmentSimulation/studies?start=0&limit=20&sortBy=name
                    uri: /clinicalEnrollmentSimulation/studies?start=0&limit=20&sortBy=name
                    type: application/vnd.sas.collection
                    itemType: application/vnd.sas.ctres.study
            application/json:
              schema:
                $ref: "#/paths/~1studies/get/responses/200/content/application~1vnd.sas.collection%2Bjson/schema"
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/1"
              example:
                httpStatusCode: 400
                errorCode: 1126
                message: The limit parameter must be greater or equal to zero.
                details:
                - "path: /clinicalEnrollmentSimulation/studies"
                - "correlator: ce9bcf5b-4139-4055-ba75-c58f58ed4a84"
    post:
      tags:
      - Studies
      summary: Create a new study
      description: Create a study from the given request body.
      operationId: createStudy
      parameters:
      - name: parentFolderUri
        required: true
        in: query
        description: The URI of the folder to create the study in. Not required for
          upload requests.
        schema:
          type: string
        example: /folders/folders/@myFolder
      requestBody:
        required: true
        description: The study to create.
        content:
          application/vnd.sas.ctres.study+json:
            schema:
              $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/0"
          application/json:
            schema:
              $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/0"
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    Study CSV file to upload. File key can be repeated for
                    cohort and visit CSVs, or file1 and file2 keys can be used
                    for optional CSVs.
                file1:
                  type: string
                  format: binary
                file2:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "201":
          description: The request succeeded and the created study is returned.
          headers:
            Location:
              description: The URI of the newly created resource.
              schema:
                type: string
            Etag:
              description: An entity tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                title: Study Upload Response
                description: The collection of created studies and errors.
                allOf:
                - $ref: "#/components/schemas/studyUpload/allOf/0"
                - type: object
                  properties:
                    items:
                      type: array
                      description: The actual results of the upload
                      items:
                        oneOf:
                        - $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/0"
                        - $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/1"
                example:
                  version: 2
                  accept: application/vnd.sas.ctres.study
                  count: 3
                  start: 0
                  limit: 20
                  name: studiesAndErrors
                  items:
                  - version: 1
                    id: 48ac0588-028c-4869-a756-2ffe5cce0ab4
                    name: ACME Study
                    description: This study tests the ACME Drug.
                    therapeuticAreaId: 14980789-ecf9-400b-9ba7-1b1baca41c4e
                    therapeuticAreaUri: >
                      /clinicalEnrollmentSimulation/therapeuticAreas/14980789-ecf9-400b-9ba7-1b1baca41c4e
                    scenarioCount: 0
                    attributes:
                      archived: true,
                      archivedDescription: This study is archived for future reference.
                      subjectEnrollment: 1234
                      therapeuticAreaName: Test Therapeutic Area
                      startDate: 2021-09-13
                      firstCountryApprovalDate: 2021-09-13
                      firstSiteStartupDate: 2021-09-14
                      firstSubjectScreeningDate: 2021-09-15
                      firstSubjectEnrollmentDate: 2021-09-16
                      firstSubjectFirstVisitDate: 2021-09-17
                      firstSubjectLastVisitDate: 2021-09-18
                      lastSubjectFirstVisitDate: 2021-09-19
                      lastSubjectLastVisitDate: 2021-09-20
                      enrollmentEndDate: 2021-09-21
                      estimatedCost: 100
                      visits:
                      - id: a1462d80-5423-42be-818a-e2e188bde0d5
                        name: First Visit
                        visitDay: 1
                      - id: 5523e0dc-bbb8-4e4f-9871-e66dcce4cfcf
                        name: Last Visit
                        visitDay: 2
                      cohorts:
                      - id: f2b5a3d4-3c43-48f4-a2b0-8c1027d18cd0
                        name: Everybody
                        enrollmentPercentage: 100
                        earlyTerminationProbability: 1
                      createdBy: userid
                      creationTimeStamp: 2021-06-23T17:21:48.960000Z
                      modifiedBy: userid
                      modifiedTimeStamp: 2021-06-23T17:21:48.960000Z
                      links:
                      - method: GET
                        rel: self
                        href: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                        uri: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                        type: application/vnd.sas.ctres.study
                      - method: PUT
                        rel: update
                        href: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                        uri: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                        type: application/vnd.sas.ctres.study
                        responseType: application/vnd.sas.ctres.study
                      - method: DELETE
                        rel: delete
                        href: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                        uri: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                      - method: GET
                        rel: getTherapeuticArea
                        href: /clinicalEnrollmentSimulation/therapeuticAreas/14980789-ecf9-400b-9ba7-1b1baca41c4e
                        uri: /clinicalEnrollmentSimulation/therapeuticAreas/14980789-ecf9-400b-9ba7-1b1baca41c4e
                        type: application/vnd.sas.ctres.therapeutic-area
                  - version: 2
                    httpStatusCode: 400
                    errorCode: 10011501
                    message: The study body is invalid or missing.
                    details:
                    - The field "Name" violated the "required" constraint.
                    remediation: Correct the errors and try again.
                  - version: 2
                    httpStatusCode: 409
                    errorCode: 10011501
                    message: The requested name "ACME Study" is already in use.
            application/vnd.sas.ctres.study+json:
              schema:
                $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/0"
            application/json:
              schema:
                $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/0"
        "400":
          description: Bad request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/1"
              example:
                version: 2
                httpStatusCode: 400
                errorCode: 10011501
                message: The study body is invalid or missing.
                details:
                - The field "Name" violated the "required" constraint.
                - "path: /clinicalEnrollmentSimulation/studies"
                - "correlator: e0fbc0c3-b134-4967-a66b-c4efd8a32bd9"
                remediation: Correct the errors and try again.
        "409":
          description: Conflict.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/1"
              example:
                version: 2
                httpStatusCode: 409
                errorCode: 10011501
                message: The requested name "ACME Study" is already in use.
                details:
                - "path: /clinicalEnrollmentSimulation/studies"
                - "correlator: e0fbc0c3-b134-4967-a66b-c4efd8a32bd9"
  "/studies/{studyId}":
    parameters:
    - name: studyId
      in: path
      required: true
      description: The unique identifier for the study.
      schema:
        type: string
      example: 48ac0588-028c-4869-a756-2ffe5cce0ab4
    get:
      tags:
      - Studies
      summary: Get a study
      description: Retrieve the specific study with the given ID.
      operationId: getStudy
      parameters:
      - name: Accept
        in: header
        description: >
          The requested representation of the study. Media type
          'application/vnd.sas.ctres.study+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.ctres.study+json
          - application/vnd.sas.summary+json
          - application/json
      responses:
        "200":
          description: The request succeeded and matching study is returned.
          headers:
            Etag:
              description: An entity tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.ctres.study+json:
              schema:
                $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/0"
            application/vnd.sas.summary+json:
              schema:
                title: A Study Summary
                description: The study summary object.
                properties:
                  version:
                    title: Representation Version
                    description: This media type's schema version number. This representation
                      is version 2.
                    type: integer
                    example: 2
                  id:
                    title: Study ID
                    description: >
                      The unique identifier for a study. If not provided when
                      creating a study, one will be generated for the user. Must
                      be a valid v4 UUID.
                    type: string
                    maxLength: 36
                    example: 48ac0588-028c-4869-a756-2ffe5cce0ab4
                  name:
                    title: Study Name
                    description: The given name for a study. This must be unique.
                    type: string
                    maxLength: 100
                    example: ACME Study
                  description:
                    title: Study Description
                    description: The given description for a study. Optional.
                    type: string
                    maxLength: 1000
                    example: This study tests the ACME Drug.
                  type:
                    title: Resource Type
                    description: The resource type.
                    type: string
                    maxLength: 100
                    example: study
                  createdBy:
                    title: Study Created By
                    description: The userid of the user who created this study.
                    type: string
                    example: userid
                  creationTimeStamp:
                    title: Study Creation Time
                    description: Creation date of this study.
                    type: string
                    format: date-time
                  modifiedBy:
                    title: Study Last Modified By
                    description: The userid of the user who last modified the study.
                    type: string
                    example: userid
                  modifiedTimeStamp:
                    title: Study Last Modified Time
                    description: Date of last modification.
                    type: string
                    format: date-time
                  links:
                    type: array
                    title: Study Links
                    description: Links that apply to this object.
                    items:
                      $ref: "#/components/schemas/study/properties/links/items"
                    example:
                    - method: GET
                      rel: self
                      href: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                      uri: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                      type: application/vnd.sas.ctres.study
                    - method: self
                      rel: alternate
                      href: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                      uri: /clinicalEnrollmentSimulation/studies/48ac0588-028c-4869-a756-2ffe5cce0ab4
                      type: application/vnd.sas.summary
            application/json:
              schema:
                $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/0"
        "404":
          description: The request failed. No study with the given ID was found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/studyUpload/allOf/1/properties/items/items/oneOf/1"
              example:
                version: 2
                httpStatusCode: 404
                errorCode: 10011502
                message: No study with ID "abc66d39-fb77-4d75-a1b9-5b2b2970a263" was
