                      to.
                    type: string
                    maxLength: 36
                    example: 01d26343-d19a-4414-a285-081959d44096
                  countryUri:
                    title: Country URI
                    description: The full URI to the country the site belongs to.
                    type: string
                    example: /clinicalEnrollmentSimulation/countries/a89d6f9b-8dda-4ed7-9fa9-920e8196ce38
