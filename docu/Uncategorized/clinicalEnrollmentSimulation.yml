                        description: The site therapeutic area details.
                        type: array
                        items:
                          $ref: "#/components/schemas/site/properties/attributes/properties/therapeuticAreas/items"
                  createdBy:
                    title: Site Created By
                    description: The userid of the user who created this site.
                    type: string
                    example: userid
