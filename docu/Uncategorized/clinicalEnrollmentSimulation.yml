            \ than 0, with Min <= Median <= Max."
          - "Line 2: Addiction: Max Startup Time Distribution must be a float greater\
            \ than 0, with Min <= Median <= Max."
          remediation: Correct the errors and try again.
        - version: 2
          httpStatusCode: 400
          errorCode: 10011501
          message: "Line 7: A duplicate site name cannot exist within a country."
