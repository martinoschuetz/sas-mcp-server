    dataItemProperties:
      description: The properties to be udpated on the data item.
      type: object
      properties:
        name:
          description: The new name of the data item.
          type: string
        format:
          description: The new format of the data item.
          type: string
        aggregation:
          description: The new aggregation of the data item.
          type: string
          enum: ["sum", "average", "min", "max", "count", "median", "variance", "numberMissing",
            "standardDeviation", "standardError", "firstQuartile", "thirdQuartile",
            "skewness", "kurtosis", "coefficientOfVariation", "correctedSumOfSquares",
            "uncorrectedSumOfSquares", "tStatistic", "pValue"]
        classification:
          description: The new classification of the data item.
          type: string
          enum: ["category", "measure", "geography"]
        geographyDataSource:
          description: The geography data source that is applicable for a classification
            of "geography". This property is optional and is only allowed if the classification
            is being set to a geography. If this object is provided, either the geographyNameCodeContext
            property or the geographyCoordinates property is required, but both are
            not allowed. If not provided, the default property geographyNameCodeContext
            is used with a value of "CountryRegionNames".
          type: object
          properties:
            geographyNameCodeContext:
              description: The geography name or code context for the data item. If
                this value is SubdivisionNames, the property geographyCountryRegion
                must be specified as well.
              type: string
              enum: ["CountryRegionNames", "CountryRegionISO2LetterCodes", "CountryRegionISO3LetterCodes",
                "CountryRegionISONumericCodes", "CountryRegionSASMapIdValues", "SubdivisionNames",
                "SubdivisionSASMapIdValues", "USStateNames", "USStateAbbreviations",
                "USZipCodes"]
            geographyCountryRegion:
              description: The geography country/region when specifying a geographyNameCodeContext
                of SubdivisionNames. This property is only valid in this context.
              type: string
            geographyDataProvider:
              description: The data defining the geography data provider. If this
                object is supplied, the dataProvider property is required.
              type: object
              properties:
                dataProvider:
                  description: The name or label of the geography data provider.
                  type: string
                idColumn:
                  description: The name or label of the column for the ID to be used
                    by the data provider. If not provided, the data item is used in
                    which this data provider is being supplied.
                  type: string
                coordinateSpace:
                  description: The coordinate space value for the specified coordinates.
                    This property is optional. If not specified, it defaults to "WorldGeodeticSystem".
                  type: string
                  enum: ["WebMercator", "WorldGeodeticSystem", "BritishNationalGrid",
                    "SingaporeTransverseMercator"]
            geographyCoordinates:
              description: The data items specifying the geography coordinates. If
                this object is supplied, both a latitudeDataItem and a longitudeDataItem
                are requried.
              type: object
              properties:
                latitudeDataItem:
                  description: The name or label of the data item specifying the geography
                    latitude.
                  type: string
                longitudeDataItem:
                  description: The name or label of the data item specifying the geography
                    longitude.
                  type: string
                coordinateSpace:
                  description: The coordinate space value for the specified coordinates.
                    This property is optional. If not specified, it defaults to "WorldGeodeticSystem".
                  type: string
                  enum: ["WebMercator", "WorldGeodeticSystem", "BritishNationalGrid",
                    "SingaporeTransverseMercator"]
