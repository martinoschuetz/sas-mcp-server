      description: The data mapping for a data view that is not a data join. This
        property is only applicable when the dataItemConflictResolution property is
        set to 'dataMapping'. It is not valid to use this manual data item mapping
        when the data view is a data join.
      type: object
      properties:
        dataItemMapping:
          type: array
          items:
            type: object
            required:
            - dataItem
            - applyOption
            properties:
              dataItem:
                description: The data item in the data view for this mapping.
                type: string
              targetDataItem:
                description: The data item to be replaced in the target data. It is
                  required and only applicable for an applyOption of "replace". It
                  is not allowed for an applyOption of "ignore" or "add".
                type: string
              applyOption:
                description: The option used when applying this data item.
                type: string
                enum: ["ignore", "add", "replace"]
