      description: The common representation of API endpoints at the top level of
        a service.
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    reportPrivateDataXml:
      description: >
        This object represents the returned object in the response from parsing report
        xml to obtain the report private data.
      properties:
        privateData:
          type: object
          description: The private data for the requested report.
          properties:
            reportUsesPrivateData:
              description: A boolean value indicating if the report uses private data.
              type: boolean
            dataSourcesHavePrivateData:
              description: The data sources on the report that contain private data.
              type: array
              items:
                description: The name of the data source
                type: string
            dataSourcesUsePrivateData:
              description: The data sources on the report that contain private data
                that is used on the report.
              type: array
              items:
                description: The name of the data source
                type: string
            pages:
              description: The pages on the report containing visual elements referencing
                private data.
              type: array
              items:
                description: The name of the page.
                type: string
            visualElements:
              description: The visual elements referencing private data on the report.
              type: array
              items:
                description: The visual element name
                type: string
            visualContainers:
              description: The containers on the report containing visual elements
                referencing private data.
              type: array
              items:
                description: The container name
                type: string
    reportVisualElements:
      description: >
        This object represents the returned object in the response to a GET request
        for viewable visual elements on a report.
      properties:
        reportId:
          type: string
          description: The id of the requested report.
        reportName:
          type: string
          description: The name of the requested report.
        reportUri:
          type: string
          description: The uri of the requested report.
        parameters:
          type: array
          description: The viewable visual elements on the requested report.
          items:
            description: The visual elements
            type: object
            properties:
              name:
                description: The visual element name.
                type: string
              type:
                description: The visual element type.
                type: string
              label:
                description: The visual element label.
                type: string
    reportParameters:
      description: >
        This object represents the returned object in the response to a GET request
        for available parameters on a report.
      properties:
        reportId:
          type: string
          description: The id of the requested report.
        reportName:
          type: string
          description: The name of the requested report.
        reportUri:
          type: string
          description: The uri of the requested report.
        parameters:
          type: array
          description: The available parameters on the requested report.
          items:
            description: The available parameters
            type: object
            properties:
              name:
                description: The parameter name.
                type: string
              label:
                description: The parameter label.
                type: string
              value:
                description: The parameter value.
                type: string
    copyRequest:
      description: >
        The request object in the body of copy request. It optionally allows the consumer
        to specify the
        name, location, and conflict resolution policy for the new report sesulting
        from the copy request.
      properties:
        resultFolder:
          description: The URI of the folder in which to save the copied report. If
            not specified the default value will be used of the folder containing
            the source report.
          type: string
        resultReportName:
          description: The name of the resulting report. If not specified the default
            value will be used of the name of the source report, with an appended
            version if needed.
          type: string
        resultNameConflict:
          description: The name conflict resolution strategy. If not specified, the
            default behavior of "rename" will be used.
          type: string
          enum: ["abort", "rename", "replace"]
    reportPrivateData:
      description: >
        This object represents the returned object in the response to a GET request
        for report private data.
      properties:
        reportId:
          type: string
          description: The id of the requested report.
        reportName:
          type: string
          description: The name of the requested report.
        reportUri:
          type: string
          description: The uri of the requested report.
        privateData:
          type: object
          description: The private data for the requested report.
          properties:
            reportUsesPrivateData:
              description: A boolean value indicating if the report uses private data.
              type: boolean
            dataSourcesHavePrivateData:
              description: The data sources on the report that contain private data.
              type: array
              items:
                description: The name of the data source
                type: string
            dataSourcesUsePrivateData:
              description: The data sources on the report that contain private data
                that is used on the report.
              type: array
              items:
                description: The name of the data source
                type: string
            pages:
              description: The pages on the report containing visual elements referencing
                private data.
              type: array
              items:
                description: The name of the page.
                type: string
            visualElements:
              description: The visual elements referencing private data on the report.
              type: array
              items:
                description: The visual element name
                type: string
            visualContainers:
              description: The containers on the report containing visual elements
                referencing private data.
              type: array
              items:
                description: The container name
                type: string
    request:
      description: >
        A request object is the root object contained in the body of requests for
        put and post endpoints.
        It specifies the destination of the resulting report as well as the operations
        to be performed on
        the report.
      properties:
        id:
          description: The id of the request, usually a UUID.
          type: string
        version:
          description: This media type's schema version number.
          type: integer
        resultFolder:
          description: The URI of the folder in which to save the resulting report.
            If not specified and a new report is being created, the default value
            of "/reports/reports/@myFolder" is used.
          type: string
        resultReportName:
          description: The name of the resulting report. If not specified and a new
            report is being created, the default value of "Report" is used along with
            a resultNameConflict policy of "rename".
          type: string
        resultNameConflict:
          description: The name conflict resolution strategy. If not specified, the
            default behavior of "abort" is used when updating a report and the default
            behavior of "rename" is used when creating a new report.
          type: string
          enum: ["abort", "rename", "replace"]
        operations:
          type: array
          items:
            $ref: "#/components/schemas/operation"
    response:
      description: >
        This object represents the response to a request and contains the individual
        responses for
        each of the requested operations.
      properties:
        id:
          type: string
          description: The id of the request, usually a UUID.
        version:
          type: integer
          description: This media type's schema version number.
        resultReportId:
          type: string
          description: The resulting report id if a new report was requested.
        resultReportName:
          type: string
          description: The resulting report name if a new report was requested. This
            name may be different than the name requested if a name conflict occurs
            and the reportNameConflict option was specified as "rename".
        resultReportUri:
          type: string
          description: The resulting report uri if a new report was requested.
        resultFolderUri:
          type: string
          description: The folder uri containing the resulting report if a new report
            was requested.
        operations:
          description: An array of responses for the operations that were performed.
            This array of responses is a one to one mapping of the operations in the
            request.
          type: array
          items:
            $ref: "#/components/schemas/operationResponse"
        status:
          description: The status, such as success or failure.
          type: string
        messages:
          description: Messages associated with the results of the request.
          type: array
          items:
            type: string
    copyResponse:
      description: >
        This object represents the response to a request to copy a report.
      properties:
        resultReportId:
          type: string
          description: The resulting report id if a new report was requested.
        resultReportName:
          type: string
          description: The resulting report name if a new report was requested. This
            name may be different than the name requested if a name conflict occurs
            and the reportNameConflict option was specified as "rename".
        resultReportUri:
          type: string
          description: The resulting report uri if a new report was requested.
        resultFolderUri:
          type: string
          description: The folder uri containing the resulting report if a new report
            was requested.
