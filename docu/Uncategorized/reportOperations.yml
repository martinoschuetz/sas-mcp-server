      operationId: updateReportCopy
      description: Create a copy of a report. The report to be copied is denoted in
        the uri of the request. The name and location of the copied report can be
        specified in the body of the request with the resultFolder and resultReportName
        properties. These are optional properties. If not specified, the copy will
        be placed in the same folder as the original report, using the same report
