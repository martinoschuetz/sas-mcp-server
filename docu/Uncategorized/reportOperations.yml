---
openapi: 3.0.3
info:
  version: "1"
  title: Report Operations
  description: >
    The Report Operations API provides a mechanism to create and update reports, while
    adding data sources, visual elements, and other components to the report. One
    or more
    operations can be specified on a request while either creating a new report or
    updating
    an existing report. The operations will be performed in the order they appear
    in the
    request. All of the operations specified in the request must be valid and must
    be
    successful for the request to be successful and the report updates persisted.
    The response
    will include an array of operation results showing the results of each operation.
    There
    will be a one to one correlation of the operation results to the array of operations
    in
    the original request. For example, the results of the first operation in the request
    will
    be the first entry in the operations array in the response.
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: https://developer.sas.com
tags:
- name: Root
  description: The operations for the root resource.
- name: Report
  description: The operations for creating and updating a base report.
- name: Admin
  description: The operations for administrator or service use.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                baseUrl:
                  $ref: "#/components/examples/responseBaseUrl"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                baseUrl:
                  $ref: "#/components/examples/responseBaseUrl"
          headers:
            Content-Type:
              required: true
              description: the content type
              schema:
                type: string
  "/reports":
    post:
      tags:
      - Report
      summary: Create a report while applying the specified operation(s)
      operationId: createReport
      description: Create a report while applying the specified operation(s). The
        new report can be generated with a specific name and location by denoting
        the resultFolder and resultReportName in the body of the request. If neither
        of these are specified in the body, the report named "Report" is generated
        in the location /folders/folders/@myFolder.
      requestBody:
        description: The request details identifying the operations to be performed
          on the new report.
        content:
          application/vnd.sas.report.operations.request+json:
            schema:
              $ref: "#/components/schemas/request"
            examples:
              addPage:
                $ref: "#/components/examples/requestAddPageOperation"
              addData:
                $ref: "#/components/examples/requestAddDataOperation"
              updateData:
                $ref: "#/components/examples/requestUpdateDataOperation"
              changeData:
                $ref: "#/components/examples/requestChangeDataOperationPost"
              applyDataView:
                $ref: "#/components/examples/requestApplyDataViewOperationPost"
              addObject:
                $ref: "#/components/examples/requestAddObjectOperationPost"
              setParameterValue:
                $ref: "#/components/examples/requestSetParameterValueOperation"
          application/json:
            schema:
              $ref: "#/components/schemas/request"
            examples:
              addPage:
                $ref: "#/components/examples/requestAddPageOperation"
              addData:
                $ref: "#/components/examples/requestAddDataOperation"
              updateData:
                $ref: "#/components/examples/requestUpdateDataOperation"
              changeData:
                $ref: "#/components/examples/requestChangeDataOperationPost"
              applyDataView:
                $ref: "#/components/examples/requestApplyDataViewOperationPost"
              addObject:
                $ref: "#/components/examples/requestAddObjectOperationPost"
              setParameterValue:
                $ref: "#/components/examples/requestSetParameterValueOperation"
        required: true
      responses:
        "201":
          description: The new report was successfully created.
          headers:
            Content-Type:
              description: Type of the response body.
              schema:
                type: string
            Location:
              description: The location of the new report.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the new report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp for the report.
              schema:
                type: string
          content:
            application/vnd.sas.report.operations.results+json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                addPage:
                  $ref: "#/components/examples/responseAddPageOperation"
                addData:
                  $ref: "#/components/examples/responseAddDataOperation"
                updateData:
                  $ref: "#/components/examples/responseUpdateDataOperation"
                changeData:
                  $ref: "#/components/examples/responseChangeDataOperationPost"
                applyDataView:
                  $ref: "#/components/examples/responseApplyDataViewOperationPost"
                addObject:
                  $ref: "#/components/examples/responseAddObjectOperationPost"
                setParameterValue:
                  $ref: "#/components/examples/responseSetParameterValueOperation"
            application/json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                addPage:
                  $ref: "#/components/examples/responseAddPageOperation"
                addData:
                  $ref: "#/components/examples/responseAddDataOperation"
                updateData:
                  $ref: "#/components/examples/responseUpdateDataOperation"
                changeData:
                  $ref: "#/components/examples/responseChangeDataOperationPost"
                applyDataView:
                  $ref: "#/components/examples/responseApplyDataViewOperationPost"
                addObject:
                  $ref: "#/components/examples/responseAddObjectOperationPost"
                setParameterValue:
                  $ref: "#/components/examples/responseSetParameterValueOperation"
        "400":
          description: This is a bad request. The request is not properly formed or
            the body is missing required fields.
          headers:
            Content-Type:
              description: Type of the error in the body.
              schema:
                type: string
          content:
            application/vnd.sas.report.operations.error+json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseAddDataOperationFailure"
            application/json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseAddDataOperationFailure"
        "404":
          description: The result report folder does not exist.
          headers:
            Content-Type:
              description: Type of the error body.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorReportNotFound"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorReportNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorReportNotFound"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorReportNotFound"
        "409":
          description: A report with the same name already exists in the destination
            folder.
          headers:
            Content-Type:
              description: Type of the error body.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorFileAlreadyExists"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorFileAlreadyExists"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorFileAlreadyExists"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorFileAlreadyExists"
  "/reports/{reportId}":
    put:
      tags:
      - Report
      summary: Update a report while applying the specified operation(s)
      operationId: updateReport
      description: Create or update a report while applying the specified operation(s).
        The source report for the updates is denoted in the uri of the request. A
        new report can be generated by denoting a resultFolder or resultReportName
        in the body of the request. If neither of these are specified in the body,
        the source report is directly updated.
      parameters:
      - name: reportId
        in: path
        description: The ID of an existing report.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The value of the etag that was returned from a GET or previous
          PUT of this type. If provided, this MUST match exactly the current value
          of the etag of the object. This parameter is noted as required, but it may
          be substituted with a precondition value for the "If-Unmodified-Since" parameter.
          Either an "If-Match" value or an "If-Unmodified-Since" value must be supplied.
        required: true
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        schema:
          type: string
        description: A date to compare against the saved report, to assert the precondition
          for this request, that the request only executes if the report has been
          unmodified since this specified date.
      requestBody:
        description: The request details identifying the operations to be performed
          on the report.
        content:
          application/vnd.sas.report.operations.request+json:
            schema:
              $ref: "#/components/schemas/request"
            examples:
              addPage:
                $ref: "#/components/examples/requestAddPageOperation"
              addData:
                $ref: "#/components/examples/requestAddDataOperation"
              updateData:
                $ref: "#/components/examples/requestUpdateDataOperation"
              changeData:
                $ref: "#/components/examples/requestChangeDataOperationPut"
              applyDataView:
                $ref: "#/components/examples/requestApplyDataViewOperationPut"
              addObject:
                $ref: "#/components/examples/requestAddObjectOperationPut"
              setParameterValue:
                $ref: "#/components/examples/requestSetParameterValueOperation"
          application/json:
            schema:
              $ref: "#/components/schemas/request"
            examples:
              addPage:
                $ref: "#/components/examples/requestAddPageOperation"
              addData:
                $ref: "#/components/examples/requestAddDataOperation"
              updateData:
                $ref: "#/components/examples/requestUpdateDataOperation"
              changeData:
                $ref: "#/components/examples/requestChangeDataOperationPut"
              applyDataView:
                $ref: "#/components/examples/requestApplyDataViewOperationPut"
              addObject:
                $ref: "#/components/examples/requestAddObjectOperationPut"
              setParameterValue:
                $ref: "#/components/examples/requestSetParameterValueOperation"
        required: true
      responses:
        "200":
          description: The report was successfully updated.
          headers:
            Content-Type:
              description: Type of the response body.
              schema:
                type: string
            Location:
              description: The location of the updated report.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the new report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp for the report.
              schema:
                type: string
          content:
            application/vnd.sas.report.operations.results+json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                addPage:
                  $ref: "#/components/examples/responseAddPageOperation"
                addData:
                  $ref: "#/components/examples/responseAddDataOperation"
                updateData:
                  $ref: "#/components/examples/responseUpdateDataOperation"
                changeData:
                  $ref: "#/components/examples/responseChangeDataOperationPut"
                applyDataView:
                  $ref: "#/components/examples/responseApplyDataViewOperationPut"
                addObject:
                  $ref: "#/components/examples/responseAddObjectOperationPut"
                setParameterValue:
                  $ref: "#/components/examples/responseSetParameterValueOperation"
            application/json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                addPage:
                  $ref: "#/components/examples/responseAddPageOperation"
                addData:
                  $ref: "#/components/examples/responseAddDataOperation"
                updateData:
                  $ref: "#/components/examples/responseUpdateDataOperation"
                changeData:
                  $ref: "#/components/examples/responseChangeDataOperationPut"
                applyDataView:
                  $ref: "#/components/examples/responseApplyDataViewOperationPut"
                addObject:
                  $ref: "#/components/examples/responseAddObjectOperationPut"
                setParameterValue:
                  $ref: "#/components/examples/responseSetParameterValueOperation"
        "201":
          description: The new report was successfully created.
          headers:
            Content-Type:
              description: Type of the response body.
              schema:
                type: string
            Location:
              description: The location of the new report.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the new report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp for the report.
              schema:
                type: string
          content:
            application/vnd.sas.report.operations.results+json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                addPage:
                  $ref: "#/components/examples/responseAddPageOperation"
                addData:
                  $ref: "#/components/examples/responseAddDataOperation"
                updateData:
                  $ref: "#/components/examples/responseUpdateDataOperation"
                changeData:
                  $ref: "#/components/examples/responseChangeDataOperationPut"
                addObject:
                  $ref: "#/components/examples/responseAddObjectOperationPut"
                applyDataView:
                  $ref: "#/components/examples/responseApplyDataViewOperationPut"
                setParameterValue:
                  $ref: "#/components/examples/responseSetParameterValueOperation"
            application/json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                addPage:
                  $ref: "#/components/examples/responseAddPageOperation"
                addData:
                  $ref: "#/components/examples/responseAddDataOperation"
                updateData:
                  $ref: "#/components/examples/responseUpdateDataOperation"
                changeData:
                  $ref: "#/components/examples/responseChangeDataOperationPut"
                applyDataView:
                  $ref: "#/components/examples/responseApplyDataViewOperationPut"
                addObject:
                  $ref: "#/components/examples/responseAddObjectOperationPut"
                setParameterValue:
                  $ref: "#/components/examples/responseSetParameterValueOperation"
        "400":
          description: This is a bad request. The request is not properly formed or
            the body is missing required fields or the update has failed.
          headers:
            Content-Type:
              description: Type of the response body.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the new report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp for the report.
              schema:
                type: string
          content:
            application/vnd.sas.report.operations.error+json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseAddDataOperationFailure"
            application/json:
              schema:
                $ref: "#/components/schemas/response"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseAddDataOperationFailure"
        "404":
          description: The source report does not exist or the result report folder
            does not exist.
          headers:
            Content-Type:
              description: Type of the error body.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the new report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp for the report.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorReportNotFound"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorReportNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorReportNotFound"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorReportNotFound"
        "409":
          description: A report with the same name already exists in the destination
            folder.
          headers:
            Content-Type:
              description: Type of the response body.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorFileAlreadyExists"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorFileAlreadyExists"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorFileAlreadyExists"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorFileAlreadyExists"
        "412":
          description: The if-match etag value provided does not match the current
            version of the report or the report has been modified since the if-unmodified-since
            value provided.
          headers:
            Content-Type:
              description: Type of the response body.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorFailedPrecondition"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorFailedPrecondition"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorFailedPrecondition"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorFailedPrecondition"
        "428":
          description: Either an if-match etag value or an if-unmodified-since value
            is required in request header.
          headers:
            Content-Type:
              description: Type of the error body.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorNoPrecondition"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorNoPrecondition"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                addDataOperation:
                  $ref: "#/components/examples/responseErrorNoPrecondition"
                addObjectOperation:
                  $ref: "#/components/examples/responseErrorNoPrecondition"
    get:
      tags:
      - Report
      summary: Get the specified report
      operationId: getReport
      description: Retrieve a report.
      parameters:
      - name: reportId
        in: path
        description: Identifier of existing report type.
        required: true
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        schema:
          type: string
        description: A date to compare against the saved report, to assert the precondition
          for this request, that the request will only execute if the report has been
          modified since this specified date.
      - name: parameter
        in: query
        required: false
        description: Specify a parameter name or label to be retrieved. If this is
          specified, the parameter details will be returned in the response in place
          of the full report.
        schema:
          type: string
      responses:
        "200":
          description: Success. The report details are returned in json format.
          headers:
            Content-Type:
              description: Type of the response body.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
          content:
            application/vnd.sas.report.operations.report+json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                getReport:
                  $ref: "#/components/examples/responseGetReport"
                getReportParameter:
                  $ref: "#/components/examples/responseGetReportParameter"
            application/json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                getReport:
                  $ref: "#/components/examples/responseGetReport"
                getReportParameter:
                  $ref: "#/components/examples/responseGetReportParameter"
        "304":
          description: The report has not been modified since the If-Modified precondition.
          headers:
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
        "404":
          description: No report with the given ID was found.
          headers:
            Content-Type:
              description: A type of an error object.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                reportNotFound:
                  $ref: "#/components/examples/responseErrorReportNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                reportNotFound:
                  $ref: "#/components/examples/responseErrorReportNotFound"
    head:
      tags:
      - Report
      summary: Existence check for a report
      operationId: headersForReport
      description: Existence check for a report.
      parameters:
      - name: reportId
        in: path
        description: Identifier of existing report type.
        required: true
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        schema:
          type: string
        description: A date to compare against the saved report, to assert the precondition
          for this request, that the request will only execute if the report has been
          modified since this specified date.
      - name: parameter
        in: query
        required: false
        description: Specify a parameter name or label to be retrieved. If this is
          specified, the parameter details will be returned in the response in place
          of the full report.
        schema:
          type: string
      responses:
        "200":
          description: Success. The report details are returned in json format.
          headers:
            Content-Type:
              description: Type of the response body.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
        "304":
          description: The report has not been modified since the If-Modified precondition.
          headers:
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
        "404":
          description: No report with the given ID was found.
          headers:
            Content-Type:
              description: A type of an error object.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
  "/reports/{reportId}/parameters":
    get:
      tags:
      - Report
      summary: Get the available parameters associated with a report
      operationId: getReportParameters
      description: Get the parameters associated with the report.
      parameters:
      - name: reportId
        in: path
        description: The ID of an existing report.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success. The report details are returned in json format.
          headers:
            Content-Type:
              description: Type of the response body.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
          content:
            application/vnd.sas.report.operations.report+json:
              schema:
                $ref: "#/components/schemas/reportParameters"
              examples:
                getReportParameters:
                  $ref: "#/components/examples/responseGetReportParameters"
            application/json:
              schema:
                $ref: "#/components/schemas/reportParameters"
              examples:
                getReportParameters:
                  $ref: "#/components/examples/responseGetReportParameters"
        "404":
          description: No report with the given ID was found.
          headers:
            Content-Type:
              description: A type of an error object.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                reportNotFound:
                  $ref: "#/components/examples/responseErrorReportNotFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                reportNotFound:
                  $ref: "#/components/examples/responseErrorReportNotFound"
    head:
      tags:
      - Report
      summary: Check if report parameters exist and retrieve metadata
      operationId: headersForReportParameters
      description: Returns metadata headers for the report parameters without the
        response body.
      parameters:
      - name: reportId
        in: path
        description: The ID of an existing report.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Metadata headers returned successfully.
          headers:
            Etag:
              description: A tag that identifies this revision of the report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of the report.
              schema:
                type: string
        "404":
          description: No report with the given ID was found.
  "/reports/privateData":
    post:
      tags:
      - Report
      summary: Get the private data associated with a report based on the XML passed
