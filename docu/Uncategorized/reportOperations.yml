        "400":
          description: This is a bad request. The request is not properly formed or
            the body is missing required fields or the update has failed.
          headers:
            Content-Type:
              description: Type of the response body.
              schema:
                type: string
            Etag:
              description: A tag that identifies this revision of the new report.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp for the report.
              schema:
                type: string
          content:
