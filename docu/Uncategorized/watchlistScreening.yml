                      date: "2024-02-14T00:00:00Z"
                      counters:
                        entityScreeningRequests: 3
                        paymentScreeningRequests: 0
                    - collection: sanctions
                      date: "2024-02-12T00:00:00Z"
                      counters:
                        entityScreeningRequests: 1
                        paymentScreeningRequests: 0
                    links:
                    - method: GET
                      rel: up
                      href: /watchlistScreening
                      uri: /watchlistScreening
                      type: application/vnd.sas.api
                    - method: GET
                      rel: self
                      href: /watchlistScreening/statistics?from=2024-02-12&to=2024-02-14
                      uri: /watchlistScreening/statistics?from=2024-02-12&to=2024-02-14
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.watchlist.screening.statistics+json
