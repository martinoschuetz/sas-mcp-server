---
openapi: 3.0.3
info:
  version: "12"
  title: Real-Time Watchlist Screening
  description: |
    The Real-Time Watchlist Screening API supports screening party and payment information against lists of known or suspected parties that are involved in illegal activities, such as money laundering, terrorism financing, or other criminal behaviors.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: "https://developer.sas.com"
servers:
- url: "http://example.com/watchlistScreening"
  description: This is an example of a base URL.
tags:
- name: Root
  description: Contains operations for the root resource.
- name: Screening
  description: Contains the operations to screen named entities against a collection
    of watchlists.
- name: Presets
  description: "Contains the operations to create, read, update, and delete presets\
    \ and channels. Presets are predefined options that control screening requests."
- name: Screening Exceptions
  description: "Contains the operations to create, read, update, and delete screening\
    \ exceptions. Screening exceptions identify the profiles or conditions that, when\
    \ matched, do not generate a hit during the screening process."
- name: Custom Watchlist
  description: Contains the operations to publish and remove a custom watchlist. A
    custom watchlist enables screening hits on entities that do not appear in the
    official watchlists.
- name: Watchlist Profiles
  description: Contains the operation to read watchlist profiles. A watchlist profile
    represents the publication of data on a sanctioned entity or individual by a given
    watchlist. A specific version of a watchlist profile is identified by the unique
    pairing of its profile ID and checksum.
- name: Watchlist Metadata
  description: Contains the operations to read watchlist metadata. The watchlist metadata
    contains information about a watchlist including its sanction codes and categories.
- name: Watchlist Screening Statistics
  description: Contains the operation to read watchlist screening statistics.
paths:
  /:
    get:
      operationId: root
      summary: Get the list of watchlist screening resources
      description: Returns the watchlist screening resources.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: The media type of the response body.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/paths/~1/get/responses/200/content/application~1json/schema"
              examples:
                Root Collection:
                  $ref: "#/paths/~1/get/responses/200/content/application~1json/examples/Root%20Collection"
            application/json:
              schema:
                title: API
                description: The list of links to top-level resources and operations
                  available from the root of the API.
                x-sas-media-type:
                  name: application/vnd.sas.api
                  version: 1
                required:
                - version
                - links
                properties:
                  version:
                    type: integer
                    description: The version number of the API representation. This
                      is version 1.
                    minimum: 1
                  links:
                    description: The API's top-level links.
                    type: array
                    items:
                      $ref: "#/components/schemas/preset/properties/links/items"
              examples:
                Root Collection:
                  summary: Watchlist Screening Root Collection
                  description: A collection of watchlist screening resources.
                  value:
                    version: 1
                    links:
                    - method: POST
                      rel: screen entity
                      href: /watchlistScreening/entity
                      uri: /watchlistScreening/entity
                      type: application/json
                      itemType: application/json
                    - method: POST
                      rel: screen payment
                      href: /watchlistScreening/payment
                      uri: /watchlistScreening/payment
                      type: application/json
                      itemType: application/json
                    - method: POST
                      rel: create preset
                      href: /watchlistScreening/presets
                      uri: /watchlistScreening/presets
                      type: application/vnd.sas.watchlist.screening.preset
                      responseType: application/vnd.sas.watchlist.screening.preset
                    - method: GET
                      rel: get presets
                      href: /watchlistScreening/presets
                      uri: /watchlistScreening/presets
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.watchlist.screening.preset
                    - method: POST
                      rel: create profile exceptions
                      href: /watchlistScreening/exceptions
                      uri: /watchlistScreening/exceptions
                      type: application/vnd.sas.watchlist.screening.profile.exception
                      responseType: application/vnd.sas.watchlist.screening.profile.exception
                    - method: GET
                      rel: get profile exceptions
                      href: /watchlistScreening/exceptions
                      uri: /watchlistScreening/exceptions
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.watchlist.screening.profile.exception
                    - method: POST
