  /customWatchlist:
    post:
      operationId: createCustomWatchlist
      summary: Publish a custom watchlist
      description: |
        Publishes the custom watchlist provided in the request body, replacing
        any prior watchlist that was in use. Requests that are being
        processed will continue to use the previous custom watchlist, but
        subsequent requests will use the new custom watchlist. If the request
        fails, the previous custom watchlist remains in effect.

        Because custom watchlists can be large, the request does not return a payload.
      tags:
      - Custom Watchlist
      parameters:
      - name: Content-Type
        in: header
        description: The representation for the custom watchlist.
        schema:
          type: string
          enum:
          - application/xml
          default: application/xml
      requestBody:
        description: The custom watchlist contents.
        required: true
        content:
          application/xml:
            examples:
              Custom watchlist:
                summary: Custom watchlist request
                description: The request body for a custom watchlist.
                value:
                  sdnList:
                    publshInformation:
                      Publish_Date: 09/07/2023
                      Record_Count: "4"
                    sdnEntry:
                    - uid: "36"
                      firstName: Norman
                      lastName: James
                      sdnType: Individual
                      programList:
                        program: CANADA
                      akaList: ""
                      addressList:
                        address:
                          uid: "25"
                          city: Aldergrove
                          country: Canada
                    - uid: "37"
                      firstName: Cindy
                      lastName: DeScrier
                      sdnType: Individual
                      programList:
                        program: UK
                      akaList: ""
                      addressList:
                        address:
                          uid: "26"
                          city: Suffolk
                          country: England
                    "_xmlns:xsi": "http://www.w3.org/2001/XMLSchema-instance"
                    _xmlns: "http://tempuri.org/sdnList.xsd"
      responses:
        "204":
          description: The custom watchlist was published.
        "400":
          $ref: "#/paths/~1entity/post/responses/400"
        "404":
          $ref: "#/paths/~1/get/responses/404"
        "500":
          $ref: "#/paths/~1presets/get/responses/500"
    delete:
      operationId: deleteCustomWatchlist
      summary: Remove a custom watchlist
      description: |
        Removes the custom watchlist. Requests that are being
        processed will continue to use the custom watchlist, but
        subsequent requests will not. If the request
        fails, the previous custom watchlist remains in effect.
      tags:
      - Custom Watchlist
      responses:
        "204":
          description: The request succeeded.
        "404":
          $ref: "#/paths/~1/get/responses/404"
        "500":
          $ref: "#/paths/~1presets/get/responses/500"
