                      uri: /watchlistScreening/exceptions
                      type: application/vnd.sas.watchlist.screening.conditional.exception
                      responseType: application/vnd.sas.watchlist.screening.conditional.exception
                    - method: GET
                      rel: get conditional exceptions
                      href: /watchlistScreening/exceptions
                      uri: /watchlistScreening/exceptions
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.watchlist.screening.conditional.exception
                    - method: GET
                      rel: get watchlist categories
                      href: /watchlistScreening/collection/categories
                      uri: /watchlistScreening/collection/categories
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.watchlist.screening.collection.categories
                    - method: GET
                      rel: get watchlist sanction codes
                      href: /watchlistScreening/collection/sanctionCodes
                      uri: /watchlistScreening/collection/sanctionCodes
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.watchlist.screening.collection.sanction.codes
                    - method: GET
