        profileId:
          type: string
          description: The ID of the watchlist profile.
        resolutionName:
          type: string
          description: The name of the resolution.
        productivity:
          type: string
          description: The productivity impact of the resolution.
        comment:
          type: string
          description: Any additional comments regarding the resolution.
        action:
          type: string
          description: The action taken as a result of the resolution.
        sendForReview:
          type: boolean
          description: Indicates whether the resolution should be sent for review.
        triggerException:
          type: boolean
          description: Indicates whether an exception should be triggered.
        modifiedBy:
          type: string
          description: The user who last modified the screening resolution.
        modifiedDttm:
          type: string
          description: "The date and time when the screening resolution was last modified,\
            \ in the format of YYYY-MM-DDThh:mm:ss.sssZ."
        reviewedBy:
          type: string
          description: "The user who reviewed the screening resolution. If reviewedBy\
            \ is provided, reviewedDttm must also be provided."
        reviewedDttm:
          type: string
          description: "The date and time when the screening resolution was reviewed,\
            \ in the format of YYYY-MM-DDThh:mm:ss.sssZ. If reviewedDttm is provided,\
            \ reviewedBy must also be provided."
        matchFinalized:
          type: boolean
          description: Indicates whether the screening resolution is final.
