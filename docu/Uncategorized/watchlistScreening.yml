      - profileId
      - resolutionName
      - modifiedBy
      - modifiedDttm
      - productivity
      - sendForReview
      - triggerException
      - matchFinalized
      properties:
        messageReference:
          type: string
          description: The unique identifier that is generated by SAS Real-Time Watchlist
