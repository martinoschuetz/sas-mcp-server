  /statistics:
    get:
      operationId: getWatchlistScreeningStats
      summary: Get the watchlist screening statistics
      description: Returns the requested watchlist screening statistics.
      tags:
      - Watchlist Screening Statistics
      parameters:
      - name: to
        description: "The end date, in YYYY-MM-DD format expressed in UTC (Universal\
          \ Time Coordinated), of the time frame to use for the data extraction."
        in: query
        schema:
          type: string
          format: date
      - name: from
        required: true
        description: "The start date, in YYYY-MM-DD format expressed in UTC (Universal\
          \ Time Coordinated), of the time frame to use for the data extraction."
        in: query
        schema:
          type: string
          format: date
      - name: Accept
        in: header
        description: The desired representation for the response.
        schema:
          type: string
          enum:
          - application/vnd.sas.watchlist.screening.statistics+json
          - application/json
          default: application/vnd.sas.watchlist.screening.statistics+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/watchlistScreeningStatsCollection"
              examples:
                Watchlist Screening Stats Collection:
                  $ref: "#/paths/~1statistics/get/responses/200/content/application~1json/examples/Watchlist%20Screening%20Stats"
            application/json:
              schema:
                $ref: "#/components/schemas/watchlistScreeningStatsCollection"
              examples:
                Watchlist Screening Stats:
                  summary: Watchlist Screening Statistics Collection
                  description: A collection of watchlist screening statistics.
                  value:
                    version: 2
                    name: watchlist screening statistics
