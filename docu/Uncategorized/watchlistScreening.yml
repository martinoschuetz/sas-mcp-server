components:
  schemas:
    entityScreening:
      title: Entity Screening
      description: The collection of objects that are required to screen an entity.
        This is the default configuration. This request is based on a message schema
        and might change after deployment.
      type: object
      properties:
        message:
          type: object
          required:
          - party
          properties:
            screeningOptions:
              title: Screening Options
              type: object
              description: The options that are applied during an entity screening
                request.
              properties:
                messageReference:
                  title: Message Reference
                  type: string
                  description: The unique identifier that is generated by SAS Real-Time
                    Watchlist Screening for a screening request. This value is populated
                    in the screening response and is ignored on input.
                  minLength: 0
                  maxLength: 36
                  readOnly: true
                projectReference:
                  title: Project Reference
                  type: string
                  description: A project reference that is attached to the screening
                    request. It enables you to trace and report on special requests
                    through the system. This variable is provided for informational
                    purposes only.
                  maxLength: 100
                chnEntity:
                  title: Entity Channel
                  type: string
                  description: Enables you to override the default screening channel
                    for parties specified as "entity".
                  maxLength: 50
                chnUnknown:
                  title: Unknown Channel
                  type: string
                  description: Enables you to override the default screening channel
                    for parties specified as "unknown".
                  maxLength: 50
                chnIndividual:
                  title: Individual Channel
                  type: string
                  description: Enables you to override the default screening channel
                    for parties specified as "individual".
                  maxLength: 50
                wlpLastUpdated:
                  title: Watchlist Profile Last Updated
                  type: string
                  description: |
                    Enables you to screen incoming records against a delta of the watchlist, by the watchlist profile last updated date. Only the entities whose profiles have changed since a given date in the past (including that date) are screened.
                    Specify the value in ISO-8601 YYYY-MM-DD format.
                  maxLength: 10
                suppressAlertsFlg:
                  title: Suppress Alerts Flag
                  type: boolean
                  description: |
                    Enables you to manage requests for tuning purposes.
                    Valid values are as follows:
                      * true: Alerts are suppressed.
                      * false: Alerts are not suppressed.
                  default: false
                routingClassification:
                  title: Routing Classification
                  type: string
                  description: |
                    Enables you to override the default screening request routing classification. If no value is specified, a default routing classification is assigned: "batch" for Kafka messages and "real-time" for REST requests.
                  maxLength: 10
            notifications:
              title: Notifications
              description: All error and warning messages that are involved in the
                respective context of the screening process.
              type: object
              readOnly: true
              properties:
                errors:
                  title: Errors
                  description: Errors that occurred during processing.
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    minLength: 0
                    maxLength: 500
                warnings:
                  title: Warnings
                  description: Warnings that occurred during processing.
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    minLength: 0
                    maxLength: 500
            party:
              title: Party
              description: "A list of entities and, for each entity, the information\
                \ that is required to process the screening request."
              type: array
              minItems: 1
              maxItems: 10000
              items:
                type: object
                required:
                - identifier
                properties:
                  identifier:
                    title: Identifier
                    type: string
                    description: The unique identifier that is associated with an
                      individual entity in the screening request. This field is required
                      and must be between 5 and 100 characters in length.
                    minLength: 5
                    maxLength: 100
                  identifierDesc:
                    title: Identifier Description
                    type: string
                    description: A description to attach to the unique identifier
                      for categorization purposes.
                    maxLength: 20
                  category:
                    title: Category
                    type: string
                    description: The category of the entity being screened.
                    maxLength: 36
                  type:
                    title: Type
                    type: string
                    enum:
                    - individual
                    - entity
                    - unknown
                    description: 'The type of entity being screened. If not specified
                      or a value other than "individual", "entity" or "unknown" is
                      supplied, the record is processed using "unknown".'
                    maxLength: 10
                  gender:
                    title: Gender
                    type: string
                    enum:
                    - male
                    - female
                    - other
                    default: other
                    description: 'The gender of the entity being screened. This field
                      is used only when the type of entity being screened is "individual".
                      If not specified or a value other than "male", "female" or "other"
                      is supplied, the record is processed using "other".'
                    maxLength: 10
                  name:
                    title: Name
                    type: string
                    description: |
                      The name of the entity being screened. If this field is not specified, the surname field must be included in the request.
                      If it is specified, the surname and firstName fields are ignored.
                      The value must be at least 2 characters and not more than 220 characters.
                      For individuals, the value is interpreted as a comma-delimited list of "surname, first name".
                    minLength: 2
                    maxLength: 220
                  firstName:
                    title: First Name
                    type: string
                    description: The first name of the entity being screened. This
                      field is optional.
                    minLength: 2
                    maxLength: 100
                  surname:
                    title: Surname
                    type: string
                    description: |
                      The surname of the entity being screened. If name is not supplied, this field is required.
                      If used with firstName, the two fields are combined to form the full name of the entity.
                      The value must be at least 2 characters and not more than 100 characters.
                    minLength: 2
                    maxLength: 100
                  dateOfBirth:
                    title: Date of Birth
                    type: array
                    maxItems: 100
                    description: |
                      A list of supplied birthdate information for the entity being screened. This object is used only when the type of entity being screened is "individual".
                      * If the birthtDt field is supplied, the birthDay, birthMonth, and birthYear fields are not used in the screening request.
                      * If the birthDt field is not supplied, an attempt is made to interpret the birthDay, birthMonth, and birthYear as a date, and use that in the screening request.
                      * If the birthDay or birthMonth are not specified, only the birthYear is used in the screening request.
                    items:
                      type: object
                      properties:
                        birthDt:
                          title: Date of Birth
                          type: string
                          description: "The birthdate, in ISO-8601 YYYY-MM-DD format,\
                            \ of the entity being screened. If provided, this field\
                            \ must be valid for the screening request to succeed."
                          maxLength: 10
                        birthDay:
                          title: Day of Birth
                          type: integer
                          description: The numeric birth day of the month for the
                            entity being screened. This field can be used in combination
                            with birthMonth and birthYear.
                        birthMonth:
                          title: Month of Birth
                          type: integer
                          description: "The numeric birth month for the entity being\
                            \ screened. If provided, this field must be valid for\
                            \ the screening request to succeed. This field can be\
                            \ used in combination with birthDay and birthYear."
                        birthYear:
                          title: Year of Birth
                          type: integer
                          description: "The birth year of the entity being screened.\
                            \ If provided, this field must be valid for the screening\
                            \ request to succeed. This field can be used in combination\
                            \ with birthDay and birthMonth."
                  address:
                    title: Address
                    type: array
                    maxItems: 100
                    description: A list of addresses that are associated with the
                      entity that is being screened.
                    items:
                      type: object
                      required:
                      - countryCode
                      properties:
                        category:
                          title: Address Category
                          type: string
                          enum:
                          - pob
                          - address
                          - other
                          default: other
                          description: 'The category for this address. If not specified,
                            or a value other than "pob" (place of birth), "address"
                            or "other" is supplied, the record is processed using
                            "other".'
                          maxLength: 36
                        name:
                          title: Address Name
                          type: string
                          description: "The name of the address, such as a house name."
                          maxLength: 36
                        number:
                          title: Address Number
                          type: string
                          description: "The address number, such as a house number\
                            \ or post office box number."
                          maxLength: 36
                        lastChangeDt:
                          title: Address Last Changed Date
                          type: string
                          description: The last known date that the address for this
                            entity was changed.
                          maxLength: 10
                        region:
                          title: Address Region
                          type: string
                          description: The region of the area in which the entity
                            is located.
                          maxLength: 100
                        type:
                          title: Address Type
                          type: string
                          description: "The type of address being used, such as home\
                            \ address or shipping address."
                          maxLength: 36
                        county:
                          title: Address County
                          type: string
                          description: The county in which the entity is located.
                          maxLength: 100
                        city:
                          title: Address City
                          type: string
                          description: The city in which the entity is located.
                          maxLength: 100
                        street:
                          title: Address Street
                          type: string
                          description: The street on which the entity is located.
                          maxLength: 100
                        buildingNumber:
                          title: Address Building Number
                          type: string
                          description: The number of the building at which the entity
                            is located.
                          maxLength: 36
                        buildingName:
                          title: Address Building Name
                          type: string
                          description: The name of the building at which the entity
                            is located.
                          maxLength: 50
                        floor:
                          title: Address Floor
                          type: string
                          description: The floor number on which the entity is located.
                          maxLength: 36
                        state:
                          title: Address State
                          type: string
                          description: The code or name of the state in which the
                            entity is located.
                          maxLength: 100
                        countryCode:
                          title: Address Country Code
                          type: string
                          description: "The ISO 3166 alphabetic code of the country\
                            \ in which the entity is located. This can be an Alpha-2\
                            \ or Alpha-3 code. If an address variable is provided,\
                            \ this field is required. If this code is invalid, the\
                            \ request for this entity results in an error."
                          minLength: 2
                          maxLength: 3
                        postcode:
                          title: Address Postcode
                          type: string
                          description: The postcode or ZIP code in which the entity
                            is located.
                          maxLength: 36
                        postBox:
                          title: Address Post Box
                          type: string
                          description: The post box number that is associated with
                            the address.
                          maxLength: 10
                        full:
                          title: Full Address
                          type: string
                          description: The full address in which the entity is located.
                          maxLength: 500
                  identity:
                    title: Identity
                    type: array
                    maxItems: 100
                    description: The attributes that correspond to an entity's proof
                      of identity.
                    items:
                      type: object
                      required:
                      - number
                      properties:
                        number:
                          title: Identity Number
                          type: string
                          description: "The identifying number that is associated\
                            \ with the supplied form of identification for the entity.\
                            \ If a form of identity is provided, this field is required\
                            \ and must be valid for the screening request to succeed."
                          maxLength: 100
                        countryOfIssue:
                          title: Country of Issue (ISO)
                          type: integer
                          description: The numeric ISO code of the country that is
                            associated with the supplied form of identification for
                            the entity.
                        countryOfIssueCode:
                          title: Country of Issue Code
                          type: string
                          description: The ISO 3166 alphabetic code of the country
                            that is associated with the supplied form of identification
                            for the entity. This can be an Alpha-2 or Alpha-3 code.
                          maxLength: 3
                        dateOfIssue:
                          title: Date of Issue
                          type: string
                          description: The date of issue for the supplied form of
                            identification for the entity. Specify the value in ISO-8601
                            YYYY-MM-DD format.
                          maxLength: 10
                        dateOfExpiry:
                          title: Date of Expiry
                          type: string
                          description: The expiration date of the supplied form of
                            identification for the entity. Specify the value in ISO-8601
                            YYYY-MM-DD format.
                          maxLength: 10
                        validFrom:
                          title: Valid From
                          type: string
                          description: The date of issue for the supplied form of
                            identification for the entity. Specify the value in ISO-8601
                            YYYY-MM-DD format.
                          maxLength: 10
                        validTo:
                          title: Valid To
                          type: string
                          description: The expiration date of the supplied form of
                            identification for the entity. Specify the value in ISO-8601
                            YYYY-MM-DD format.
                          maxLength: 10
                        type:
                          title: Identity Type
                          type: string
                          description: The type of identification that is supplied.
                          maxLength: 36
                        issuedBy:
                          title: Issued By
                          type: string
                          description: The entity that issued the identification.
                          maxLength: 36
                        details:
                          title: Identity Details
                          type: string
                          description: Additional details for this form of identification.
                          maxLength: 100
                  alert:
                    title: Alert
                    type: object
                    description: All of the alert information that is involved in
                      the respective context of this party.
                    readOnly: true
                    properties:
                      screeningOutcome:
                        title: Screening Outcome
                        type: string
                        minLength: 1
                        maxLength: 10
                        description: "The alert type outcome that is captured for\
                          \ a screening process. Possible values are Alerted, Excluded,\
                          \ and Suppressed."
                        enum:
                        - No Alert
                        - Alerted
                        - Excluded
                        - Suppressed
                      comment:
                        title: Comment
                        type: string
                        minLength: 0
                        maxLength: 100
                        description: The comment that is captured from the rule that
                          is responsible for generating or suppressing an alert.
                      type:
                        title: Type
                        type: string
                        minLength: 0
                        maxLength: 100
                        description: The alert type that is computed from the matched
                          profiles. This field is set by the SAS Detection Definition
                          rules when alert recommendations are generated.
                  screeningResult:
                    title: Screening Result
                    type: object
                    readOnly: true
                    description: The result of a screening.
                    properties:
                      notifications:
                        $ref: "#/components/schemas/entityScreening/properties/message/properties/notifications"
                      statusCode:
                        title: Status Code
                        type: string
                        enum:
                        - Success
                        - Warning
                        - Validation Failure
                        - Failure
                        description: |-
                          The status of a screening request at the record level.
                          * Success: screening successful.
                          * Warning: screening successful with warnings
                          * Validation Failure: screening request failure
                          * Failure: screening response failure
                        minLength: 7
                        maxLength: 18
                        readOnly: true
                      hits:
                        title: Hits
                        type: integer
                        description: The number of hits against the entity that occurred
                          during the screening request.
                        readOnly: true
                      discardedHits:
                        title: Discarded Hits
                        type: integer
                        description: The number of discarded hits against the entity
                          that occurred during the screening request as a result of
                          a screening exception.
                        readOnly: true
                      remainingHits:
                        title: Remaining Hits
                        type: integer
                        description: The total number of unique hits. This is calculated
                          by subtracting the number of 'discardedHits' from the total
                          number of 'hits'.
                        readOnly: true
                      maxScore:
                        title: Maximum Score
                        type: integer
                        description: "For the screened entity, the highest matchProfile.score\
                          \ of all of the matchedProfile records."
                        readOnly: true
                      primaryName:
                        title: Primary Name
                        type: string
                        description: "For the screened entity, the matchedProfile.primaryName\
                          \ that is associated with the matchedProfile record that\
                          \ was used to determine screeningResult.maxScore."
                        readOnly: true
                        maxLength: 50
                      matchedName:
                        title: Matched name
                        type: string
                        description: "For the screened entity, the matchedProfile.matchedName\
                          \ that is associated with the matchedProfile record that\
                          \ was used to determine screeningResult.maxScore."
                        readOnly: true
                        maxLength: 50
                      maxProximityScore:
                        title: Maximum Proximity Score
                        type: integer
                        description: "For the screened entity, the highest matchProfile.proximityScore\
                          \ of all of the matchedProfile records."
                        readOnly: true
                      tags:
                        title: Tags
                        type: array
                        maxItems: 20
                        description: The unique set of tags associated with all of
                          the active matchedProfile records.
                        readOnly: true
                        items:
                          type: string
                          minLength: 1
                          maxLength: 4
                      messageReference:
                        title: Message Reference
                        type: string
                        description: The unique identifier that is generated by SAS
                          Real-Time Watchlist Screening for a screening request.
                        minLength: 0
                        maxLength: 36
                        readOnly: true
                      projectReference:
                        title: Project Reference
                        type: string
                        description: An identifier that is provided as part of a screening
                          request. It enables you to trace and report on special requests
                          through the system.
                        minLength: 0
                        maxLength: 100
                        readOnly: true
                      suppressAlertsFlg:
                        title: Suppress Alerts Flag
                        type: boolean
                        description: |
                          Enables you to manage requests for tuning purposes.
                          Valid values are as follows:
                            * true: Alerts are suppressed.
                            * false: Alerts are not suppressed.
                        default: false
                      routingClassification:
                        title: Routing Classification
                        type: string
                        description: |
                          Enables you to override the default screening request routing classification. If no value is specified, a default routing classification is assigned: "batch" for Kafka messages and "real-time" for REST requests.
                        maxLength: 10
                      matchedProfile:
                        title: Matched Profile
                        type: array
                        maxItems: 1000
                        description: The outcome data that is received from the watchlist
                          screening engine when a hit occurs. This data is utilized
                          in the alert generation process.
                        readOnly: true
                        items:
                          type: object
                          properties:
                            score:
                              title: Score
                              type: integer
                              description: Indicates the confidence level of the match.
                              readOnly: true
                            level:
                              title: Level
                              type: string
                              description: |
                                The strength of the hit. This is based on the elements that have matched (such as name, city, country, gender, DOB, ID). If a match occurs
                                only on name, the level is always "low". Otherwise, the level corresponds to the highest level assigned to the matched criteria as defined
                                in the metadata policies. If the match was ignored as a result of a screening exception, the level value is set to "discarded".
                              minLength: 1
                              maxLength: 10
                              readOnly: true
                            profileId:
                              title: Profile ID
                              type: string
                              description: The ID that is returned from the watchlist
                                provider.
                              minLength: 1
                              maxLength: 100
                              readOnly: true
                            checksum:
                              title: Checksum
                              type: integer
                              description: A hash of the entire watchlist profile.
                                This enables you to verify the value against your
                                alerts database to determine whether it has changed.
                              readOnly: true
                            coreChecksum:
                              title: Core Checksum
                              type: integer
                              description: |
                                The checksum value that is associated with the subset of profile data that constitutes important information. This changes only when properties that
                                are part of the screening logic are changed. This includes names, addresses, IDs, date of birth, sanctions, and status.
                              readOnly: true
                            proximityScore:
                              title: Proximity Score
                              type: integer
                              description: |-
                                The proximity score with respect to a profile that is published by a watchlist.

                                This attribute indicates how close a watchlist entry is to a sanctioned watchlist profile. Possible values include:

                                100 - sanctioned profile

                                80 - direct relationship with sanctioned profile

                                50 - one relationship removed from a sanctioned profile

                                0 - no relationship found

                                null - undefined

