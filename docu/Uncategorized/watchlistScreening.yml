            $ref: "#/components/schemas/preset/properties/links/items"
          readOnly: true
    preset:
      title: Preset
      description: Presets are predefined options that control screening requests.
      type: object
      required:
      - name
      - options
      properties:
        id:
          type: string
          description: A unique identifier for the preset.
        name:
          type: string
          description: A unique name for the preset. The name is referenced in screening
            requests that use the preset. Names are automatically prefixed with the
            configured client reference for the deployment in order to ensure uniqueness
            across multiple environments (such as test and production).
        options:
          type: object
          required:
          - threshold
          - matching
          - geoScore
          - geoThreshold
          - lowQualityAliases
          - dobMatching
          - dobPrecision
          - dobPolicy
          - genderPolicy
          - idPolicy
          - idPrecision
          - cityProximity
          - cityPolicy
          - countryPolicy
          - charset
          - status
          - tweaks
          description: The set of options for this preset.
          properties:
            threshold:
              type: integer
              minimum: 50
              maximum: 100
              description: "Specifies the name matching threshold. When the threshold\
                \ value is between 50 and 84 matching is broader, and some hits are\
                \ returned that would not be returned with a higher threshold."
            matching:
              type: string
              enum:
              - fuzzy
              - strict
              - balanced
              - broad
              description: |
                The matching technique:
                * **fuzzy**: is the default sensitivity in terms of the fuzzy logic capabilities.
                * **strict**: applies a higher penalty for missing and mismatching words, while keeping the same level of fuzziness between words.
                * **balanced**: accepts a smaller set of misspells (doubled letters, letter inversions, mismatched vowels) and all the important words need to be matched, but the screening speed is extremely fast.
                * **broad**: is a Google-like search that (for example) raises hits when searching for a last name only. Note that the threshold is not used for this setting.
            recordType:
              type: string
              enum:
              - individual
              - entity
              - unknown
              description: "By default, any screened records that are not assigned\
                \ a record type are processed as type **unknown**. This option sets\
                \ the default record type value for all records in a request that\
                \ do not have a type assigned."
            geoScore:
              type: boolean
              description: "When enabled, all the payment fields are searched for\
                \ matches with the countries of any reported hit. As a result, a new\
                \ score will be delivered in the response. This only applies to payment\
                \ screening."
            geoThreshold:
              type: integer
              minimum: 0
              maximum: 100
              description: "Defines a minimum threshold for the geoScore in the matches.\
                \ If the computed geoScore is below this threshold, the matches are\
                \ not reported. The geoScore option must be enabled for this option\
                \ to affect payment screening."
            bicThreshold:
              type: integer
              minimum: 85
              maximum: 100
              description: Specifies the threshold to be used when screening expanded
                Business Identifier Codes (BICs).
            lowQualityAliases:
              type: string
              enum:
              - none
              - reclassified
              description: "Specifies what type of lowQualityAlias should be included\
                \ in the screening scope. Currently, only the reclassified aliases\
                \ can be included."
            dobMatching:
              type: string
              enum:
              - year
              - perfect
              description: |
                The date of birth matching type: **perfect** matches the full date if available, **year** accepts the match if the year is matched.
            dobPrecision:
              type: integer
              minimum: 0
              maximum: 100
              description: |
                Date of birth matching precision: for year matching, specifies the accepted difference (in years). Note: when metaScore is set to **true**, and if the date of birth is within the defined range set by this parameter, the calculation of the score takes into account the ratio (actual year difference) / (dobPrecision). For example, a difference of 3 years between 2 dates with dobPrecision = 7 will score higher than if dobPrecision = 4 years for the same 3-year difference.
            dobPolicy:
              description: Date of birth policy.
              type: object
              required:
              - value
              - match
              - level
              properties:
                value:
                  type: string
                  enum:
                  - required
                  - optional
                  - expected
                  description: "Specifies whether the metadata value should be defined\
                    \ in the watchlist record in order to accept a hit. With **expected**,\
                    \ a small penalty is applied to the final score in case of missing\
                    \ data while with **optional** the score is left untouched. *Note\
                    \ that when the metaScore is enabled, the default value is **expected**\
                    \ instead of **optional**.*"
                match:
                  type: string
                  enum:
                  - required
                  - optional
                  description: "Specifies whether the metadata value (when present),\
                    \ should match the value in the record (when present) in order\
                    \ to accept a hit. *Note that when the metaScore is enabled, the\
                    \ default value is **optional** instead of **required**.*"
                level:
                  type: string
                  enum:
                  - low
                  - medium
                  - high
                  description: Specifies the level of importance that is assigned
                    to the hit if the metadata value is found and matched.
            genderPolicy:
              description: Gender policy.
              type: object
              required:
              - value
              - match
              - level
              properties:
                value:
                  type: string
                  enum:
                  - required
                  - optional
                  - expected
                  description: "Specifies whether the metadata value should be defined\
                    \ in the watchlist record in order to accept a hit. With **expected**,\
                    \ a small penalty is applied to the final score in case of missing\
                    \ data while with **optional** the score is left untouched. *Note\
                    \ that when the metaScore is enabled, the default value is **expected**\
                    \ instead of **optional**.*"
                match:
                  type: string
                  enum:
                  - required
                  - optional
                  description: "Specifies whether the metadata value (when present),\
                    \ should match the value in the record (when present) in order\
                    \ to accept a hit. *Note that when the metaScore is enabled, the\
                    \ default value is **optional** instead of **required**.*"
                level:
                  type: string
                  enum:
                  - low
                  - medium
                  - high
                  description: Specifies the level of importance that is assigned
                    to the hit if the metadata value is found and matched.
            idPolicy:
              description: The IDs policy.
              type: object
              required:
              - value
              - match
              - level
              properties:
                value:
                  type: string
                  enum:
                  - required
                  - optional
                  - expected
                  description: "Specifies whether the metadata value should be defined\
