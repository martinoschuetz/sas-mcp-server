                  - optional
                  description: "Specifies whether the metadata value (when present)\
                    \ should match the value in the record (when present) in order\
                    \ to accept a hit. *Note that when the metaScore is enabled, the\
                    \ default value is **optional** instead of **required**.*"
                level:
                  type: string
                  enum:
                  - low
                  - medium
                  - high
                  description: Specifies the level of importance that is assigned
                    to the hit if the metadata value is found and matched.
            charset:
              type: string
              enum:
              - latin
              - auto
              description: Specifies the character set that is used in queries. Set
                the value to **auto** if the original script names are being sent.
            riskCountries:
              type: array
              items:
                type: string
              description: Specifies the list of ISO 2 risk country codes that define
                the countries against which to match your data. Potential matches
                are country and city names in your screened object (in **TEXT** mode)
                and **places** in the metadata.
            riskRegions:
              type: array
              items:
                type: string
              description: 'Specifies the the list of regions to identify in which
                main cities are detected. This includes regions in a private list.
                If the region exists in multiple countries, specify the country that
                is associated with the city by adding "/isoCode". Use the watchlist
                metadata "/collection/regions" endpoint to get the list of all region
                values.'
            status:
              type: string
              enum:
              - any
              - active
              - inactive
              - deceased
              description: "Specifies the minimum status of a matched record. If 'active',\
                \ only the active profiles are matched. If 'inactive', active and\
                \ inactive profiles are matched. If 'deceased' only deceased profiles\
                \ are matched."
            inactiveDays:
              type: integer
              description: Specifies the number of days since this record was flagged
                as inactive (PEP or RCA). This is available only in some watchlists.
            pepLevel:
              type: string
              enum:
              - intl
              - state
              - regional
              - local
              description: "For PEPs, the minimum level of responsibility."
            tweaks:
              type: object
              required:
              - detectTitle
              - detectBicCodes
              - useTextPlaces
              - surnameAbbreviations
              - perfectSmallNames
              - bidirectionalMatching
              - deepIndexSearch
              - lowQualityNicknames
              - partialIndividualNames
              - partialIndividualNamePatterns
              - partialEntityNames
              - longAbbreviations
              - minTextMatchLength
              - globalLegalForms
              description: Specifies the advanced screen options.
              properties:
                detectTitle:
                  type: boolean
                  description: "When enabled, any title in the passed name (Mr, Dr,\
                    \ and so on) is identified. A title has a very low weight in the\
                    \ final score."
                detectBicCodes:
                  type: boolean
                  description: "When enabled, any Swift BIC-8 or BIC-11 identifier\
                    \ in the names and texts is detected, expanded, and screened."
                useTextPlaces:
                  type: boolean
                  description: "When enabled, uses the identified city/country pairs\
                    \ in a screened **text**, and automatically adds them as places\
                    \ in the screening context. This enables the metaScore for this\
                    \ request only."
                surnameAbbreviations:
                  type: boolean
                  description: "When enabled, abbreviations are accepted in the main\
                    \ surname words. For example, Saddam H. will match Saddam Hussein.\
                    \ It is recommended that you turn this on only for ad hoc searches."
                perfectSmallNames:
                  description: Configures the matching policy for names composed of
                    a single small word.
                  oneOf:
                  - type: boolean
                    description: "When enabled, any match with a name composed by\
                      \ a single small word (<= 4 letters) must be perfect."
                  - type: integer
                    description: Specifies the maximum length of small words for which
                      a perfect match is required.
                    minimum: 0
                    maximum: 10
                bidirectionalMatching:
                  type: boolean
                  description: "When enabled, word-level matching is performed from\
                    \ both the left and right sides. This can help to catch matches\
                    \ where the beginning of the word has 2 or more unexpected letters."
                deepIndexSearch:
                  type: boolean
                  description: |
                    When names are screened, a word index is built for the submitted request and list profiles are considered candidates (potential matches), if they contain indexed words.
                    Noise words, legal forms, and other lower weighted words are generally not indexed. Using this tweak forces the indexing of all words and considers any list profile
                    that contains at least one of the words, even if the matching word is noisy. Note that enabling this tweak can negatively impact performance.
                lowQualityNicknames:
                  type: boolean
                  description: "Specifies the system contains data tables with nicknames\
                    \ (for example, Anthony/Tony). When this tweak is enabled, this\
                    \ table is extended with more variations such as translations\
                    \ or language-specific name alternatives (for example, John/Juan,\
                    \ Viktor/Vitya)."
                partialIndividualNames:
                  type: string
                  description: |
                    Configures the partial matching policy for individual names.
                    * NONE:  Any unmatched word in the request or in the list profile lowers the score, based on its nature. For example, common words like GROUP or a legal form have a lot less weight.
                    * REQUEST: If all the words in the list profile are matched, any unmatched word in the request only slightly impacts the score.
                    * PROFILE: If all the words in the request are matched, any unmatched word in the profile only slightly impacts the score.
                    * BOTH: Assuming that the name is fully matched, any other word in the request or the profile only slightly impacts the score.

                    Note that, by default, at least one word in the surnames, except particles such as AL, BIN, etc., and one word in the first and middle names can be matched. Other patterns can be configured in the "partialIndividualNamePatterns" field.
                  enum:
                  - NONE
                  - REQUEST
                  - PROFILE
                  - BOTH
                partialIndividualNamePatterns:
                  type: array
                  items:
                    type: string
                  description: 'Specifies the list of patterns for the partial individual
                    name matching. One pattern is in the form "x,y" where x is the
                    minimum amount of matched words in the surnames group and y is
                    the minimum amount of matched words in the first names group.
                    Note that particles are excluded.'
                partialEntityNames:
                  type: string
                  description: |
                    Configures the partial matching policy for entity names.
                    * NONE:  Any unmatched word in the request or in the list profile lowers the score, based on its nature. For example, common words like GROUP or a legal form have a lot less weight.
                    * REQUEST: If all the words in the list profile are matched, any unmatched word in the request only slightly impacts the score.
                    * PROFILE: If all the words in the request are matched, any unmatched word in the profile only slightly impacts the score.
                    * BOTH: Assuming that the name is fully matched, any other word in the request or the profile only slightly impacts the score.
                  enum:
                  - NONE
                  - REQUEST
                  - PROFILE
                  - BOTH
                longAbbreviations:
                  type: boolean
                  description: "Allows a word (>3 letters) to be considered as a truncation\
                    \ of a much longer word (>= 6 letters). For example, 'Intern'\
                    \ would be considered an abbreviation of 'International'."
                minTextMatchLength:
                  type: integer
                  minimum: 0
                  maximum: 5
                  description: "Specifies the minimum length of matches found in texts,\
                    \ if only 1 word is matching."
                globalLegalForms:
                  type: boolean
                  description: Looks for legal form words in the screened entity name
                    regardless of the locations specified in the "address" party field.
                    This includes searching in languages that do not match the country
                    of incorporation of the entity.
            exclusions:
              type: array
              items:
                type: string
              description: |
                An array of (root level) JetFlow property names that should **not** be screened. By default, this includes paymentId, amount, paymentType,
                direction, transactionId, transactionType. Note that paymentId and paymentType are obsolete and have been replaced by transactionId and transactionType respectively.
            fieldPresets:
              type: object
              description: "By default, the top-level options and presets are used.\
                \ This object can overwrite the default and specify which preset to\
                \ use with which field."
              additionalProperties:
                type: string
                description: Specifies the name of the preset to apply when screening
                  this field.
              example:
                creditor: san
                debtor: pep
            metaScore:
              type: boolean
              readOnly: true
              default: true
              description: "When enabled, the final score takes into account any matched\
                \ metadata, assuming that the requested precision is reached. For\
                \ example, if the DOB precision is set to 5 years, the closer they\
                \ match, the higher the score; but the hit is discarded if the DOB\
                \ difference is > 5 years.  This value is provided as a default, and\
                \ is ignored on input."
            detectStripping:
              type: boolean
              readOnly: true
              default: false
              description: "When enabled, this transaction is included in a stripping\
                \ detection process and returns a status if an attempt to resubmit\
                \ a similar transaction without the reported hit(s) is identified.\
                \  This value is provided as a default, and is ignored on input."
            detectDuplicates:
              type: boolean
              readOnly: true
              default: false
              description: "When enabled, this transaction is included in a duplicate\
                \ detection process and returns a status if the exact same transaction\
                \ has been seen before. This value is provided as a default, and is\
                \ ignored on input."
        creationTimeStamp:
          type: string
          description: "Specifies the date and time that this object was created,\
            \ in the format of YYYY-MM-DDThh:mm:ss.sssZ. This value is ignored on\
            \ input."
          format: date-time
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: "Specifies the date and time that this object was last modified,\
            \ in the format of YYYY-MM-DDThh:mm:ss.sssZ. This value is ignored on\
            \ input."
          format: date-time
          readOnly: true
        version:
          type: integer
          description: Specifies the version number of the media type.
        links:
          type: array
          description: Specifies the links that apply to the object. This value is
            ignored on input.
          items:
            title: Link
            type: object
            description: A link to a related operation or resource.
            required:
            - rel
            properties:
              method:
                type: string
                description: The HTTP method for the link.
              rel:
                type: string
                description: The relationship of the link to the resource.
              uri:
                type: string
                description: The relative URI for the link.
              href:
                type: string
                description: The URL for the link.
              title:
                type: string
                description: The title for the link.
              type:
                type: string
                description: The media type or link type for the link.
              itemType:
                type: string
                description: "If this is a link to a container, `itemType` is the\
                  \ media type or link type for the items in the container."
              responseType:
                type: string
                description: "The media type or link type of the response body for\
                  \ a `PUT`, `POST`, or `PATCH` operation."
              responseItemType:
                type: string
                description: "The media type or link type of the items in the response\
                  \ body for a `PUT`, `POST`, or `PATCH` operation."
          readOnly: true
    channel:
      title: Channel
      description: A channel is a type of preset that matches screened records to
        a specific preset based on the tags found in screened records.
      type: object
      required:
      - name
      - options
      properties:
        id:
          type: string
          description: Specifies a unique identifier for the channel.
        name:
          type: string
          description: A unique name for the channel. The name is referenced in screening
            requests that use the channel. Names are automatically prefixed with the
            configured client reference for the deployment in order to ensure uniqueness
            across multiple environments (such as test and production).
        options:
          type: object
          description: Specifies the set of options for this preset.
          required:
          - tags
          - tagPresets
          properties:
            tagPresets:
              type: array
              description: |
                The ordered mapping between a tag found in the potentially matched watchlist record and a preset to use. The first applicable mapping is used. There
                must be at least one mapping.
              items:
                type: object
                required:
                - tag
                - preset
                properties:
                  tag:
                    type: string
                    description: Specifies the tag to match in the watchlist record.
                  preset:
                    type: string
                    description: Specifies the name of the preset to apply. Names
                      are automatically prefixed with the configured client reference
                      for the deployment in order to ensure uniqueness across multiple
                      environments (such as test and production).
            tags:
              type: array
              items:
                type: string
                enum:
                - SAN
                - PEP
                - RCA
                - SOC
                - OOL
                - AM
                - BRD
                - SIE
                - SIP
                - LOC
                - VSL
                - AIR
                - PRV
                - "!SAN"
                - "!PEP"
                - "!RCA"
                - "!SOC"
                - "!BRD"
                - "!OOL"
                - "!AM"
                - "!SIE"
                - "!SIP"
                - "!LOC"
                - "!VSL"
                - "!AIR"
                - "!PRV"
              description: 'Specifies the list of profile tag restrictions. To create
                an exclusion condition, prepend a tag with the "!" character. For
                sanction (or payment) screening, SAN and LOC are recommended.'
        creationTimeStamp:
          type: string
          description: "Specifies the date and time that this object was created,\
            \ in the format of YYYY-MM-DDThh:mm:ss.sssZ. This value is ignored on\
            \ input."
          format: date-time
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: "Specifies the date and time that this object was last modified,\
            \ in the format of YYYY-MM-DDThh:mm:ss.sssZ. This value is ignored on\
            \ input."
          format: date-time
          readOnly: true
        version:
          type: integer
          description: Specifies the version number of the media type.
        links:
          type: array
          description: Specifies the links that apply to the object. This value is
            ignored on input.
          items:
            $ref: "#/components/schemas/preset/properties/links/items"
          readOnly: true
    presetCollection:
      title: Preset Collection
      description: A collection of presets and channels.
      allOf:
      - title: Base Collection
        description: This is a base schema used to define paginated collections of
          resources. This base schema is extended by other schemas in APIs by adding
          an 'items' array property. These extensions define the application/vnd.sas.collection
          media type (version 2)
        properties:
          name:
            type: string
            description: The name of the collection.
          start:
            type: integer
            description: The zero-based index of the first item in the collection.
            format: int64
          limit:
            type: integer
            description: The number of items that were requested for the collection.
          count:
            type: integer
            description: If populated indicates the number of items in the collection.
            format: int64
          accept:
            type: string
            description: A space-delimited list of media types from which an `Accept`
              header may be constructed.
          links:
            type: array
            description: The links that apply to the collection.
            items:
              $ref: "#/components/schemas/preset/properties/links/items"
          version:
            type: integer
            description: The version number of the collection representation. This
              representation is version 2.
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: Specifies the list of available presets and channels.
            items:
              anyOf:
              - $ref: "#/components/schemas/preset"
              - $ref: "#/components/schemas/channel"
    profileException:
      title: Profile Exception
      description: |
        A profile exception identifies a profile that does not generate alerts for a specific entity during the
        screening process. A profile exception applies if both the party identifier and the screening result
        profile ID match the values that are specified for the exception. When these fields match, the screening
        result hit is classified as "discarded".
      type: object
      required:
      - identifier
      - profileId
      properties:
        id:
          type: string
          description: The internal exception ID that is used to refer to the exception.
            This value is ignored on input.
          readOnly: true
        identifier:
          type: string
          description: A user provided identifier that corresponds to the "identifier"
            field in a party record used for screening.
        profileId:
          type: string
          description: The profile ID of the watchlist record that is attached to
            this exception.
        status:
          readOnly: true
          type: string
          description: The status of the exception. This value is ignored on input.
        creationTimeStamp:
          type: string
          description: "The date and time this object was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ. This value is ignored on input."
          format: date-time
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: "The date and time this object was last modified, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ. This value is ignored on input."
          format: date-time
          readOnly: true
        version:
          type: integer
          description: The version number of the media type. This value is ignored
            on input.
          readOnly: true
        links:
          type: array
          description: The links that apply to the object. This value is ignored on
            input.
          items:
            $ref: "#/components/schemas/preset/properties/links/items"
          readOnly: true
    conditionalException:
      title: Conditional Exception
      description: |
        A conditional exception identifies conditions that do not generate alerts for a screening request during
        the screening process. A conditional exception applies if the data in a screening request satisfy the conditions
        specified by the conditional exception. When these conditions are met, the screening result hit is classified as "discarded".
      type: object
      required:
      - expirationType
      properties:
        id:
          type: string
          description: The internal exception ID that is used to refer to the exception.
            This value is ignored on input.
          readOnly: true
        status:
          readOnly: true
          type: string
          description: The status of the exception. This value is ignored on input.
        profileId:
          type: string
          description: The profile ID of the watchlist record that is attached to
            this exception. This value is immutable after creation.
        match:
          type: string
          description: |
            The name (or alias) of the watchlist record that should be accepted. When empty, any match with the given profile is managed by this exception.
            This data is not retained. Instead, a hash is computed and returned in the matchHash field. This value is immutable after creation. If a value is provided, a valid profileId value is required.
          writeOnly: true
        matchHash:
          type: integer
          description: The internal hash of the matched name. A hash value is generated
            because the actual value is not retained.
          readOnly: true
        source:
          type: string
          description: |
            The exact string for which a match is triggered. The exception is active only if the same source is screened again. The matching string is not case sensitive.
            When empty, any string that triggers the specified match is managed by this exception. This data is not retained. Instead, a hash is computed and returned in the sourceHash field. This value is immutable after creation. If a value is provided, a valid profileId value is required.
          writeOnly: true
        sourceHash:
          type: integer
          description: |
            The internal hash of the source data. A hash value is generated because the actual value is not retained.
          readOnly: true
        expirationType:
          type: string
          description: |-
            Determines the condition in which this exception should be invalidated:

             • NEVER: The exception never expires.

             • DATE: When the scheduled date occurs.

             • PROFILE: When the profile changes in the watchlist. If this value is provided, a valid profileId value is required.

             • CORE_PROFILE: When any important profile information has changed in the watchlist. Important profile information includes all the properties that are part of the screening logic. This includes names, addresses, IDs, dates of birth, sanctions, status, etc. If this value is provided, a valid profileId value is required.
          enum:
          - NEVER
          - DATE
          - PROFILE
          - CORE_PROFILE
        expirationDate:
          type: string
          description: "If the expirationType is set to DATE, specifies the expiration\
            \ date of the exception. This is required if expirationType=DATE."
        profileChecksum:
          type: integer
          description: The profile checksum (as provided in the screening results)
            to be used if the expirationType is set to PROFILE. This is required if
            expirationType=PROFILE.
        coreChecksum:
          type: integer
          description: The core profile checksum (as provided in the screening results)
            to be used if the expirationType is set to CORE_PROFILE. This is required
            if expirationType=CORE_PROFILE.
        prefix:
          type: string
          description: "Specifies the text to match that precedes the exact text (source)\
            \ in order to apply this exception. This is optional. If a value is provided,\
            \ a valid profileId value is required."
        suffix:
          type: string
          description: "Specifies the text to match that follows the exact text (source)\
            \ in order to apply this exception. This is optional. If a value is provided,\
            \ a valid profileId value is required."
        conditions:
          type: array
          description: Specifies additional restrictions on the request or found match
            for this exception to be applicable.
          maxItems: 20
          items:
            type: object
            required:
            - path
            - operator
            - value
            properties:
              path:
                type: string
                description: Specifies the path to a SAS Real-Time Watchlist Screening
                  message schema field. The extracted field value evaluates against
                  the provided condition value. The valid paths are listed as 'enum'
                  values.
                enum:
                - /matchedProfile/categories
                - /matchedProfile/checksum
                - /matchedProfile/coreChecksum
                - /matchedProfile/dateOfBirth/birthDay
                - /matchedProfile/dateOfBirth/birthMonth
                - /matchedProfile/dateOfBirth/birthYear
                - /matchedProfile/level
                - /matchedProfile/locationPath
                - /matchedProfile/matchType
                - /matchedProfile/matchedName
                - /matchedProfile/primaryName
                - /matchedProfile/profileBirthPlaces/city
                - /matchedProfile/profileBirthPlaces/countryCode
                - /matchedProfile/profileGender
                - /matchedProfile/profileId
                - /matchedProfile/profileIds
                - /matchedProfile/profileLastUpdated
                - /matchedProfile/profilePlaces/city
                - /matchedProfile/profilePlaces/countryCode
                - /matchedProfile/profileStatus
                - /matchedProfile/profileType
                - /matchedProfile/sanctions
                - /matchedProfile/score
                - /matchedProfile/scoreScope
                - /matchedProfile/screened
                - /matchedProfile/tags
                - /party/address/category
                - /party/address/city
                - /party/address/countryCode
                - /party/address/postcode
                - /party/dateOfBirth/birthDt
                - /party/gender
                - /party/identifier
                - /party/identity/number
                - /payment/amount
                - /payment/currency
                - /payment/purpose
                - /payment/transactionId
                - /payment/transactionType
              operator:
                type: string
                description: the comparison operator to apply on the path.
                enum:
                - "="
                - "!="
                - ">"
                - ">="
                - <
                - <=
                - between
                - contains
              value:
                description: |
                  The string (or a list of possible strings) to match with the extracted path field. This value is considered to be a regular expression
                  if it starts with the special character ~ (for example, ~[0-9]{1,2}). This value is replaced with the content of a path (extracted value) when
                  wrapped in ${} (for example, ${/party/identifier}).
                oneOf:
                - type: string
                - type: array
                  minItems: 1
                  items:
                    type: string
        creationTimeStamp:
          type: string
          description: "The date and time that this object was created, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ. This value is ignored on input."
          format: date-time
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: "The date and time that this object was last modified, in the\
            \ format of YYYY-MM-DDThh:mm:ss.sssZ. This value is ignored on input."
          format: date-time
          readOnly: true
        version:
          type: integer
          description: The version number of the media type. This value is ignored
            on input.
          readOnly: true
        links:
          type: array
          description: The links that apply to the object. This value is ignored on
            input.
          items:
            $ref: "#/components/schemas/preset/properties/links/items"
          readOnly: true
    screeningExceptionCollection:
      title: Screening Exception Collection
      description: A collection of screening exceptions.
      allOf:
      - $ref: "#/components/schemas/presetCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: The list of available screening exceptions.
            items:
              anyOf:
              - $ref: "#/components/schemas/profileException"
              - $ref: "#/components/schemas/conditionalException"
    watchlistCategories:
      title: Watchlist Categories
      description: Metadata that contains information about a watchlist's categories.
      type: object
      properties:
        watchlist:
          type: string
          description: The name of the watchlist.
        captureDt:
          type: string
          description: The date on which the watchlist was captured.
        data:
          type: array
          description: The list of watchlist categories.
          items:
            type: object
            properties:
              listId:
                type: string
                description: The ID of the list the sanction belongs to.
              category:
                type: string
                description: The category label of the list.
        links:
          type: array
          description: The links that apply to the object. The value is ignored on
            input.
          items:
            $ref: "#/components/schemas/preset/properties/links/items"
          readOnly: true
    watchlistCategoriesCollection:
      title: Watchlist Categories Collection
      description: A collection of watchlist categories.
      allOf:
      - $ref: "#/components/schemas/presetCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/watchlistCategories"
    watchlistSanctionCodes:
      title: Watchlist Sanction Codes
      description: Metadata that contains information about a watchlist's sanction
        codes.
      type: object
      properties:
        watchlist:
          type: string
          description: The name of the watchlist.
        captureDt:
          type: string
          description: The date on which the watchlist was captured.
        data:
          type: array
          description: The list of watchlist sanction codes.
          items:
            type: object
            properties:
              code:
                type: string
                description: The sanction code.
              country:
                type: string
                description: The ISO country code.
              labels:
                type: array
                description: The list of sanction names.
                items:
                  type: string
              listId:
                type: string
                description: The ID of the list the sanction belongs to.
        links:
          type: array
          description: The links that apply to the object. The value is ignored on
            input.
          items:
            $ref: "#/components/schemas/preset/properties/links/items"
          readOnly: true
    watchlistSanctionCodesCollection:
      title: Watchlist Sanction Codes Collection
      description: A collection of watchlist sanction codes.
      allOf:
      - $ref: "#/components/schemas/presetCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
