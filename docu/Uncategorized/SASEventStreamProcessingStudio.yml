  examples:
    createProjectRepresentation:
      description: An example of a representation for creating a project called `timerDemo`.
      value:
        description: Project description.
        friendlyName: timerDemo
        production: false
        tags:
        - connector
        versionNotes: This is the initial version
        xml: >
          <project name="timerDemo" threads="1" pubsub="auto"
          heartbeat-interval="1">
              <description><![CDATA[Project description.]]></description>
            <metadata>
              <meta id="studioUploadedBy">user1@sas.com</meta>
              <meta id="studioUploaded">1626941783080</meta>
              <meta id="studioModifiedBy">user1@sas.com</meta>
              <meta id="studioModified">1626949539653</meta>
              <meta id="layout">{"cq1":{"Copy":{"x":-370,"y":-255},"Filter_Even":{"x":-55,"y":-255},"Filter_Odd":{"x":245,"y":-255},"Source":{"x":-55,"y":-440}}}</meta>
            </metadata>
            <contqueries>
              <contquery name="cq1">
                <windows>
                  <window-source pubsub="true" name="Source">
                    <schema>
                      <fields>
                        <field name="id" type="int64" key="true"/>
                        <field name="time" type="stamp"/>
                        <field name="label" type="string"/>
                      </fields>
                    </schema>
                    <connectors>
                      <connector class="timer" name="source_generator">
                        <properties>
                          <property name="type"><![CDATA[pub]]></property>
                          <property name="timeformat"><![CDATA[%Y-%m-%d %H:%M:%S]]></property>
                          <property name="basetime"><![CDATA[2021-05-05 00:00:00]]></property>
                          <property name="interval"><![CDATA[2]]></property>
                          <property name="unit"><![CDATA[second]]></property>
                        </properties>
                      </connector>
                    </connectors>
                  </window-source>
                  <window-copy pubsub="true" name="Copy">
                    <retention type="bycount_sliding"><![CDATA[5]]></retention>
                  </window-copy>
                  <window-filter pubsub="true" name="Filter_Even">
                    <use><![CDATA[id]]></use>
                    <code><![CDATA[function filter(data)
                    return data.id % 2 == 0
                    end]]></code>
                  </window-filter>
                  <window-filter pubsub="true" name="Filter_Odd">
                    <use><![CDATA[id]]></use>
                    <code><![CDATA[function filter(data)
                    return data.id % 2 == 1
                    end]]></code>
                  </window-filter>
                </windows>
                <edges>
                  <edge source="Source" target="Copy"/>
                  <edge source="Source" target="Filter_Even"/>
                  <edge source="Source" target="Filter_Odd"/>
                </edges>
              </contquery>
            </contqueries>
          </project>
