    espProjectCreateRepresentation:
      description: This example shows how to create an ESP project.
      value:
        description: This is the project's description.
        friendlyName: simpleProject
        tags:
        - Project
        versionNotes: This is the initial version.
        xml: >-
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>

          <project heartbeat-interval="1" name="simpleProject" pubsub="auto"
          threads="1">
            <contqueries>
              <contquery name="cq1">
                <windows>
                  <window-source name="source" pubsub="true">
                    <schema>
                      <fields>
                        <field key="true" name="id" type="int64"/>
                        <field name="time" type="stamp"/>
                        <field name="label" type="string"/>
                      </fields>
                    </schema>
                    <connectors>
                      <connector class="timer" name="source_timer">
                        <properties>
                          <property name="type"><![CDATA[pub]]></property>
                          <property name="timeformat"><![CDATA[%Y-%m-%d %H:%M:%S]]></property>
                          <property name="basetime"><![CDATA[2022-01-01 00:00:00]]></property>
                          <property name="interval"><![CDATA[2]]></property>
                          <property name="unit"><![CDATA[second]]></property>
                        </properties>
                      </connector>
                    </connectors>
                  </window-source>
                  <window-copy name="copy" pubsub="true">
                    <retention type="bycount_sliding">5</retention>
                  </window-copy>
                  <window-filter name="even">
                    <use><![CDATA[id]]></use>
                    <code><![CDATA[function filter(data)
                    return data.id % 2 == 0
                    end]]></code>
                  </window-filter>
                  <window-filter name="odd">
                    <use><![CDATA[id]]></use>
                    <code><![CDATA[function filter(data)
                    return data.id % 2 == 1
                    end]]></code>
                  </window-filter>
                </windows>
                <edges>
                  <edge source="source" target="copy"/>
                  <edge source="source" target="even"/>
                  <edge source="source" target="odd"/>
                </edges>
              </contquery>
            </contqueries>
          </project>
