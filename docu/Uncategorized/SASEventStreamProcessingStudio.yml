---
openapi: 3.0.3
info:
  description: The Event Stream Processing Studio API provides programmatic access
    to core project management and packaging capabilities within SAS Event Stream
    Processing Studio. It allows users to perform operations such as creating and
    deleting projects, creating and promoting project versions, and managing files
    and folders within project packages.
  version: '4'
  title: Event Stream Processing Studio
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: https://example.com/SASEventStreamProcessingStudio/v4
  description: This is an example of a base URL.
tags:
- name: Project
  description: Contains the operations for creating, editing, and deleting projects.
- name: Project Versioning
  description: Contains the operations for managing project package versions.
- name: Project File Management
  description: Contains the operations for managing project package files and folders.
- name: Root
  description: Contains the operations for the root resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      operationId: root
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              description: The media type for the response (application/vnd.sas.api+json).
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/rootResponse200"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                example:
                  $ref: "#/components/examples/rootResponse200"
  /projects:
    get:
      summary: Get projects
      description: Returns a list of all projects, including basic information about
        the projects.
      operationId: getListProjects
      parameters:
      - description: The number of the first record to be returned.
        in: query
        name: start
        required: false
        schema:
          default: 0
          minimum: 0
          format: int64
          type: integer
      - description: The maximum number of records to be returned.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          minimum: 1
          maximum: 10000
          format: int32
          type: integer
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          content:
            application/vnd.sas.collection+json:
              examples:
                example:
                  $ref: '#/components/examples/resourceCollectionEspProjectBaseRepresentation'
              schema:
                $ref: '#/components/schemas/resourceCollectionEspProjectBaseRepresentation'
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/resourceCollectionEspProjectBaseRepresentation'
              schema:
                $ref: '#/components/schemas/resourceCollectionEspProjectBaseRepresentation'
          description: The request succeeded.
      tags:
      - Project
    post:
      summary: Create a project
      description: Creates a project. By default a project package is created. The
        request fails if a project with the provided name already exists. The created
        project is returned.
      operationId: createProject
      parameters:
      - description: The identifier of a project to copy the content from.
        in: query
        name: copyFrom
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/vnd.sas.esp.espproject+json:
            examples:
              example:
                $ref: '#/components/examples/espProjectCreateRepresentation'
            schema:
              $ref: '#/components/schemas/espProjectCreateRepresentation'
          application/json:
            examples:
              example:
                $ref: '#/components/examples/espProjectCreateRepresentation'
            schema:
              $ref: '#/components/schemas/espProjectCreateRepresentation'
        required: true
      responses:
        '201':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/vnd.sas.esp.espproject+json:
              examples:
                example:
                  $ref: '#/components/examples/espProjectRepresentation'
              schema:
                $ref: '#/components/schemas/espProjectRepresentation'
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/espProjectRepresentation'
              schema:
                $ref: '#/components/schemas/espProjectRepresentation'
          description: The request succeeded.
        '400':
          $ref: '#/components/responses/errorResponse400'
        '409':
          $ref: '#/components/responses/errorResponse409'
      tags:
      - Project
  /projects/{projectName}:
    get:
      summary: Get a project
      description: Retrieves a specific project identified by its name.
      operationId: getProject
      parameters:
      - description: The name of the project.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/vnd.sas.esp.espproject+json:
              examples:
                example:
                  $ref: '#/components/examples/espProjectRepresentation'
              schema:
                $ref: '#/components/schemas/espProjectRepresentation'
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/espProjectRepresentation'
              schema:
                $ref: '#/components/schemas/espProjectRepresentation'
          description: The request succeeded.
        '404':
          $ref: '#/components/responses/errorResponse404'
      tags:
      - Project
    head:
      summary: Check if a project exists
      description: Returns header information about a specific project identified
        by its name.
      operationId: headersForGetProject
      parameters:
      - description: The name of the project.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          description: The request succeeded.
      tags:
      - Project
    patch:
      summary: Update a specific project
      description: Updates a specific project, identified by its name. An updated
        project representation is returned.
      operationId: patchProject
      parameters:
      - description: The name of the project.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: If-Unmodified-Since
        in: header
        name: If-Unmodified-Since
        required: false
        schema:
          format: HTTP-date
          type: string
      requestBody:
        content:
          application/vnd.sas.esp.espproject+json:
            examples:
              example:
                $ref: '#/components/examples/patchEspProjectRepresentation'
            schema:
              $ref: '#/components/schemas/patchEspProjectRepresentation'
          application/json:
            examples:
              example:
                $ref: '#/components/examples/patchEspProjectRepresentation'
            schema:
              $ref: '#/components/schemas/patchEspProjectRepresentation'
        required: true
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/vnd.sas.esp.espproject+json:
              examples:
                example:
                  $ref: '#/components/examples/espProjectRepresentation'
              schema:
                $ref: '#/components/schemas/espProjectRepresentation'
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/espProjectRepresentation'
              schema:
                $ref: '#/components/schemas/espProjectRepresentation'
          description: The request succeeded.
        '404':
          $ref: '#/components/responses/errorResponse404'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '409':
          $ref: '#/components/responses/errorResponse409'
        '412':
          $ref: '#/components/responses/errorResponse412IfUnmodifiedSince'
        '428':
          $ref: '#/components/responses/errorResponse428PreconditionRequired'
      tags:
      - Project
    delete:
      summary: Delete a project
      description: Deletes a project, given the project's name. By default the project
        is deleted from SAS Event Stream Manager as well.
      operationId: deleteProject
      parameters:
      - description: The name of the project.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: Whether to delete the project from SAS Event Stream Manager as
          well as from SAS Event Stream Processing Studio.
        in: query
        name: esm
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '204':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          description: The request succeeded.
        '404':
          $ref: '#/components/responses/errorResponse404'
        '409':
          $ref: '#/components/responses/errorResponse409ProjectIsRunningInCluster'
      tags:
      - Project
  /projects/{projectName}/versions:
    post:
      summary: Create a new project version
      description: Creates a new version of a project. For example, creates a new
        version with version 1.
      operationId: createVersionProject
      parameters:
      - description: The project name.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/vnd.sas.esp.project.packaging.versions+json:
            examples:
              versioning:
                $ref: '#/components/examples/createVersionProjectRepresentation'
            schema:
              $ref: '#/components/schemas/createVersionProjectRepresentation'
          application/json:
            examples:
              versioning:
                $ref: '#/components/examples/createVersionProjectRepresentation'
              promotion:
                $ref: '#/components/examples/createVersionProjectRepresentation'
            schema:
              $ref: '#/components/schemas/createVersionProjectRepresentation'
      responses:
        '201':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/projectVersionHistoryRepresentation'
              schema:
                $ref: '#/components/schemas/projectVersionHistoryRepresentation'
            application/vnd.sas.esp.project-version-history+json:
              examples:
                example:
                  $ref: '#/components/examples/projectVersionHistoryRepresentation'
              schema:
                $ref: '#/components/schemas/projectVersionHistoryRepresentation'
          description: The new version was created, or the version was promoted.
        '400':
          content:
            application/vnd.sas.error+json:
              examples:
                example:
                  $ref: '#/components/examples/errorResponse400'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: The specific project exists, but the specified version or promotion
            level does not.
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          content:
            application/vnd.sas.error+json:
              examples:
                example:
                  $ref: '#/components/examples/errorResponse404'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: The specified project does not exist.
        '409':
          content:
            application/vnd.sas.error+json:
              examples:
                alreadyExists:
                  $ref: '#/components/examples/createPromotedProjectErrorAlreadyExists'
                locked:
                  $ref: '#/components/examples/projectIsLocked'
                unsavedChanges:
                  $ref: '#/components/examples/projectHasUnsavedChanges'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: |
            The project is locked by another user and cannot be versioned at this time, or the project has changes that must be saved first.
        '500':
          content:
            application/vnd.sas.error+json:
              examples:
                projectVersioningInternalImplementationError:
                  $ref: '#/components/examples/projectVersioningInternalImplementationError'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: An internal error has occurred during project versioning. See
            the application logs for more details.
        '503':
          $ref: '#/components/responses/errorResponse503PackagingOrVersioningNotAvailable'
      tags:
      - Project Versioning
    get:
      summary: Get the version history of a project
      description: Returns the version history of a project.
      operationId: getVersionHistory
      parameters:
      - description: The project name.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: If `true`, then returns the version notes for each version. If
          `false` or not specified, returns just the version numbers with empty notes.
        in: query
        name: includeNotes
        required: false
        schema:
          type: boolean
      - description: If specified, then returns the history for this version of the
          project only. If this parameter is not provided, returns the history for
          all versions for the project.
        in: query
        name: forVersion
        required: false
        schema:
          format: int32
          type: integer
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/projectVersionHistoryRepresentation'
              schema:
                $ref: '#/components/schemas/projectVersionHistoryRepresentation'
            application/vnd.sas.esp.project-version-history+json:
              examples:
                example:
                  $ref: '#/components/examples/projectVersionHistoryRepresentation'
              schema:
                $ref: '#/components/schemas/projectVersionHistoryRepresentation'
          description: The response contains the version history of the project.
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          content:
            application/vnd.sas.error+json:
              examples:
                example:
                  $ref: '#/components/examples/errorResponse404'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: The project does not exist.
        '500':
          content:
            application/vnd.sas.error+json:
              examples:
                projectVersioningInternalImplementationError:
                  $ref: '#/components/examples/projectVersioningInternalImplementationError'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: An internal error has occurred during project versioning. See
            the application logs for more details.
        '503':
          $ref: '#/components/responses/errorResponse503PackagingOrVersioningNotAvailable'
      tags:
      - Project Versioning
    head:
      summary: Check if the version history exists
      description: Returns header information about the version history of a project.
      operationId: headersForGetVersionHistory
      parameters:
      - description: The project name.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: If `true`, then returns the version notes for each version. If
          `false` or not specified, returns just the version numbers with empty notes.
        in: query
        name: includeNotes
        required: false
        schema:
          type: boolean
      - description: If specified, then returns the history for this version of the
          project only. If this parameter is not provided, returns the history for
          all versions for the project.
        in: query
        name: forVersion
        required: false
        schema:
          format: int32
          type: integer
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          description: The response contains the version history of the project.
      tags:
      - Project Versioning
  /projects/{projectName}/promotions:
    post:
      summary: Promote a project
      description: Promotes a project version to the next promotion level when further
        promotion levels are available. An initial version must be created before
        the project can be promoted.
      operationId: createPromotedProject
      parameters:
      - description: The project name.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/vnd.sas.esp.project.packaging.promotions+json:
            examples:
              promotion:
                $ref: '#/components/examples/promoteProjectByOneLevelRepresentation'
            schema:
              $ref: '#/components/schemas/promoteProjectByOneLevelRepresentation'
          application/json:
            examples:
              versioning:
                $ref: '#/components/examples/promoteProjectByOneLevelRepresentation'
              promotion:
                $ref: '#/components/examples/promoteProjectByOneLevelRepresentation'
            schema:
              $ref: '#/components/schemas/promoteProjectByOneLevelRepresentation'
      responses:
        '201':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/projectVersionHistoryRepresentation'
              schema:
                $ref: '#/components/schemas/projectVersionHistoryRepresentation'
            application/vnd.sas.esp.project-version-history+json:
              examples:
                example:
                  $ref: '#/components/examples/projectVersionHistoryRepresentation'
              schema:
                $ref: '#/components/schemas/projectVersionHistoryRepresentation'
          description: The new version was created, or the version was promoted.
        '400':
          content:
            application/vnd.sas.error+json:
              examples:
                example:
                  $ref: '#/components/examples/errorResponse400'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: The specific project exists, but there is no initial version,
            or the project has been promoted to the highest level that this application
            supports.
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          content:
            application/vnd.sas.error+json:
              examples:
                maxLevelReached:
                  $ref: '#/components/examples/createPromotedProjectErrorMax'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: |
            The project has already been promoted to the maximum permitted level.
        '404':
          content:
            application/vnd.sas.error+json:
              examples:
                example:
                  $ref: '#/components/examples/errorResponse404'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: The specified project does not exist.
        '409':
          content:
            application/vnd.sas.error+json:
              examples:
                alreadyExists:
                  $ref: '#/components/examples/createPromotedProjectErrorAlreadyExists'
                locked:
                  $ref: '#/components/examples/projectIsLocked'
                unsavedChanges:
                  $ref: '#/components/examples/projectHasUnsavedChanges'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: |
            The specified project with the specified version and promotion level already exists, or the project is locked by another user and cannot be promoted at this time, or the project has changes that must be saved first.
        '410':
          content:
            application/vnd.sas.error+json:
              example:
                previousVersionDoesNotExist:
                  $ref: '#/components/examples/createPromotedProjectErrorPreviousVersionDoesNotExist'
                schema:
                  $ref: '#/components/schemas/errorResponse'
          description: |
            The specified project cannot be promoted to the specified version and level because it has not been promoted to the previous version or level.
        '500':
          content:
            application/vnd.sas.error+json:
              examples:
                projectVersioningInternalImplementationError:
                  $ref: '#/components/examples/projectVersioningInternalImplementationError'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: An internal error has occurred during project versioning. See
            the application logs for more details.
        '503':
          $ref: '#/components/responses/errorResponse503PackagingOrVersioningNotAvailable'
      tags:
      - Project Versioning
    get:
      summary: Get the promotion history of a project
      description: Returns the promotion history of a project.
      operationId: getPromotionHistory
      parameters:
      - description: The project name.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: If `true`, then returns the version notes for each version. If
          `false` or not specified, returns just the version numbers with empty notes.
        in: query
        name: includeNotes
        required: false
        schema:
          type: boolean
      - description: If specified, then returns the history for this version of the
          project only. If this parameter is not provided, returns the history for
          all versions for the project.
        in: query
        name: forVersion
        required: false
        schema:
          format: int32
          type: integer
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/projectVersionHistoryRepresentation'
              schema:
                $ref: '#/components/schemas/projectVersionHistoryRepresentation'
            application/vnd.sas.esp.project-version-history+json:
              examples:
                example:
                  $ref: '#/components/examples/projectVersionHistoryRepresentation'
              schema:
                $ref: '#/components/schemas/projectVersionHistoryRepresentation'
          description: The response contains the version history of the project.
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          content:
            application/vnd.sas.error+json:
              examples:
                example:
                  $ref: '#/components/examples/errorResponse404'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: The project does not exist.
        '500':
          content:
            application/vnd.sas.error+json:
              examples:
                projectVersioningInternalImplementationError:
                  $ref: '#/components/examples/projectVersioningInternalImplementationError'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: An internal error has occurred during project versioning. See
            the application logs for more details.
        '503':
          $ref: '#/components/responses/errorResponse503PackagingOrVersioningNotAvailable'
      tags:
      - Project Versioning
    head:
      summary: Check if the promotion history exists
      description: Returns header information about the promotion history of a project.
      operationId: headersForGetPromotionHistory
      parameters:
      - description: The project name.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: If `true`, then returns the version notes for each version. If
          `false` or not specified, returns just the version numbers with empty notes.
        in: query
        name: includeNotes
        required: false
        schema:
          type: boolean
      - description: If specified, then returns the history for this version of the
          project only. If this parameter is not provided, returns the history for
          all versions for the project.
        in: query
        name: forVersion
        required: false
        schema:
          format: int32
          type: integer
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          description: The response contains the version history of the project.
      tags:
      - Project Versioning
  /project/{projectName}/files:
    post:
      summary: Create a file
      description: Creates a file within the specified subfolder in a project package.
      operationId: createPostUploadFile
      parameters:
      - description: The project name.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: "The path to the file. Example: `/test_files/my.csv`."
        in: query
        name: path
        required: true
        schema:
          type: string
      - description: The index of the partial file chunk that is being transferred.
        in: query
        name: chunk
        required: false
        schema:
          default: -1
          format: int32
          type: integer
      - description: The total number of chunks.
        in: query
        name: chunks
        required: false
        schema:
          default: -1
          format: int32
          type: integer
      requestBody:
        content:
          '*/*':
            examples:
              example:
                $ref: '#/components/examples/file'
          application/vnd.sas.esp.summary:
            examples:
              example:
                $ref: '#/components/examples/file'
          application/json:
            examples:
              example:
                $ref: '#/components/examples/file'
        required: true
      responses:
        '201':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/resourceSummary'
              schema:
                $ref: '#/components/schemas/resourceSummary'
            application/vnd.sas.summary+json:
              examples:
                example:
                  $ref: '#/components/examples/resourceSummary'
              schema:
                $ref: '#/components/schemas/resourceSummary'
          description: The request succeeded.
        '400':
          $ref: '#/components/responses/errorResponse400'
        '409':
          $ref: '#/components/responses/errorResponse409'
      tags:
      - Project File Management
    head:
      summary: Check if a file exists
      description: Returns header information about a file from a specified project
        package, identified by the project name and path.
      operationId: headersForGetFile
      parameters:
      - description: The project name.
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: "The path to the file. Example: `/test_files/my.csv`."
        in: query
        name: path
        required: true
        schema:
          type: string
      - description: The filter parameter.
        in: query
        name: filter
        required: false
        schema:
          type: string
      responses:
        '200':
          headers:
            ContentType:
              $ref: '#/components/headers/ContentType'
          description: The request succeeded.
      tags:
