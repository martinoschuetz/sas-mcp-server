  /dictionaries:
    get:
      tags:
      - Dictionaries
      summary: Get a list of dictionaries
      description: |
        Get a list of all dictionaries. The collection returned can be filtered, sorted, and paged. The default sort order will be the dictionary name. It is also possible to filter using the functions eq, gt, ge, lt, le, or contains.<br>Returned items will be of media type application/vnd.sas.opt.dictionary.
      operationId: getDictionaries
      parameters:
      - name: Accept
        in: header
        description: |
          The requested representation of the dictionary collection. Media type 'application/vnd.sas.collection+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.collection+json
          - application/json
      - name: Accept-Item
        in: header
        description: |
          The requested representation of the items in the collection. Media type 'application/vnd.sas.opt.dictionary+json' is the default. Must be compatible with Accept header subtype.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.opt.dictionary+json
          - application/json
      - name: start
        in: query
        description: 0-based Offset of first item to return. Defaults to 0.
        schema:
          type: integer
        example: 100
      - name: limit
        in: query
        description: Maximum number of items to return. Defaults to 20.
        schema:
          type: integer
        example: 10
      - name: filter
        in: query
        description: |
          Filter criteria for returned items. See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
        example: "eq(name,'ACME')"
      - name: sortBy
        in: query
        description: |
          Sort returned items. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
        example: name
      - name: excludeLinks
        in: query
        description: |
          Optional parameter to remove links from items in a collection response. Useful for shrinking response body.
        schema:
          type: boolean
        example: true
      responses:
        "200":
          description: The request succeeded and matching dictionaries are returned.
