servers:
- url: "http://example.com/deploymentBackup"
  description: This is an example base URL.
components:
  schemas:
    backupRequest:
      title: Backup Request
      description: Schema for backup Request.
      properties:
        version:
          type: integer
          description: The version number of this representation, the current version
            is 2.
        slug:
          type: string
          description: name given to a backup operation.
        comments:
          type: string
          description: free text comments associated with this backup operation
        configurationId:
          type: string
          description: id of a configuration to be used for backup operation. For
            now only `default` configuration is supported.
        backupType:
          type: string
          enum:
          - default
          - binary
          description: Type of postgres backup defines `backupType`. `backupType`
            can be `default` or `binary`. If backup type is `default` postgres backup
            will be taken with pg_dump and if backup type is `binary` postgres backup
            will be taken with pg_basebackup utility.
        includeAllSourcesForBinaryBackup:
          type: boolean
          description: This is optional boolean variable which will be false by default
            if omitted from the request body. This flag will be considered only if
            we are selecting backupType as `binary`. If this flag set to true `SAS
            Configuration Server`, `SAS Message Broker` and `SAS Cloud Analytic Services`
            backup will also be taken along with postgres `binary` backup, else backup
            will have only `SAS Infrastructure Data Server` binary backup.
    backupJob:
      title: Backup Job
      description: Information about backup job. Returns vnd.sas.backup.job
      properties:
        version:
          type: integer
          description: The version number of this representation, the current version
            is 2.
        jobId:
          type: string
          description: identifier of job, derived from start timestamp.
        backupType:
          type: string
          enum:
          - default
          - binary
          description: Type of postgres backup defines `backupType`. `backupType`
            can be `default` or `binary`. If backup type is `default` postgres backup
            will be taken with pg_dump and if backup type is `binary` postgres backup
            will be taken with pg_basebackup utility.
        includeAllSourcesForBinaryBackup:
          type: boolean
          description: This is optional boolean variable which will be false by default
            if omitted from the request body. This flag will be considered only if
            we are selecting backupType as `binary`. If this flag set to true `SAS
            Configuration Server`, `SAS Message Broker` and `SAS Cloud Analytic Services`
            backup will also be taken along with postgres `binary` backup, else backup
            will have only `SAS Infrastructure Data Server` binary backup.
        slug:
          type: string
          description: Slug name is a name given to a backup operation.
        comments:
          type: string
          description: free text comments associated with this backup operation.
        state:
          type: string
          enum:
          - pending
          - running
          - completedWithWarning
          - completed
          - failed
          - canceling
          - canceled
          description: The state of the job. The state can be `pending`, `running`,
            `completedWithWarning`, `completed`, `failed`, `canceling`, `canceled`.
        owner:
          type: string
          description: user who initiated this backup.
        purged:
          type: boolean
          description: This is boolean variable which will be false by default. Value
            will be true if this backup no more exist because of auto purge after
            specified retention period.
        startTimeStamp:
          type: string
          format: date-time
          description: Date Time stamp when job started.
        endTimeStamp:
          type: string
          format: date-time
          description: Date Time stamp when job completed.
        message:
          $ref: "#/components/schemas/message"
        links:
          type: array
          description: relation links that apply to this resource
          items:
            $ref: "#/components/schemas/link"
    backup:
      title: Backup
      description: Backup representation.
      properties:
        version:
          type: integer
          description: The version number of this representation, the current version
            is 2.
        backupId:
          type: string
          description: id derived from start timestamp.
        backupType:
          type: string
          enum:
          - default
          - binary
          description: Type of postgres backup defines `backupType`. `backupType`
            can be `default` or `binary`. If backup type is `default` postgres backup
            will be taken with pg_dump and if backup type is `binary` postgres backup
            will be taken with pg_basebackup utility.
        includeAllSourcesForBinaryBackup:
          type: boolean
          description: This is optional boolean variable which will be false by default
            if omitted from the request body. This flag will be considered only if
            we are selecting backupType as `binary`. If this flag set to true `SAS
            Configuration Server`, `SAS Message Broker` and `SAS Cloud Analytic Services`
            backup will also be taken along with postgres `binary` backup, else backup
            will have only `SAS Infrastructure Data Server` binary backup.
        slug:
          type: string
          description: Slug name is a name given to a backup operation.
        comments:
          type: string
          description: free text comments associated with this backup operation.
        name:
          type: string
          description: name derived from start timestamp.
        state:
          type: string
          enum:
          - pending
          - running
          - completedWithWarning
          - completed
          - failed
          - canceling
          - canceled
          description: The state of the job. The state can be `pending`, `running`,
            `completedWithWarning`, `completed`, `failed`, `canceling`, `canceled`.
        size:
          type: integer
          format: int64
          description: The size of the files in bytes after backup.
        owner:
          type: string
          description: user who initiated this backup.
        purged:
          type: boolean
          description: This is boolean variable which will be false by default. Value
            will be true if this backup no more exist because of auto purge after
            specified retention period.
        startTimeStamp:
          type: string
          format: date-time
          description: Date Time stamp when backup started.
        endTimeStamp:
          type: string
          format: date-time
          description: Date Time stamp when backup completed.
        sources:
          type: array
          description: sources included in this backup
          items:
            $ref: "#/components/schemas/source"
        message:
          $ref: "#/components/schemas/message"
        links:
          type: array
          description: relation links that apply to this resource
          items:
            $ref: "#/components/schemas/link"
    backupSummary:
      title: Backup Summary
      description: Representation of type vnd.sas.backup.summary
      properties:
        version:
          type: integer
          description: The version number of this representation, the current version
            is 2.
        backupId:
          type: string
          description: id derived from start timestamp
        backupType:
          type: string
          enum:
          - default
          - binary
          description: Type of postgres backup defines `backupType`. `backupType`
            can be `default` or `binary`. If backup type is `default` postgres backup
            will be taken with pg_dump and if backup type is `binary` postgres backup
            will be taken with pg_basebackup utility.
        includeAllSourcesForBinaryBackup:
          type: boolean
          description: This is optional boolean variable which will be false by default
            if omitted from the request body. This flag will be considered only if
            we are selecting backupType as binary. If this flag set to true `SAS Configuration
            Server`, `SAS Message Broker` and `SAS Cloud Analytic Services` backup
            will also be taken along with postgres binary backup, else backup will
            have only `SAS Infrastructure Data Server` binary backup.
        slug:
          type: string
          description: Slug name is a name given to a backup operation.
        comments:
          type: string
          description: free text comments associated with this backup operation.
        name:
          type: string
          description: name derived from start timestamp
        state:
          type: string
          enum:
          - pending
          - running
          - completedWithWarning
          - completed
          - failed
          - canceling
          - canceled
          description: The state of the operation. The state can be `pending`, `running`,
            `completedWithWarning`, `completed`, `failed`, `canceling`, `canceled`.
        size:
          type: integer
          format: int64
          description: The size of the files in bytes after backup.
        owner:
          type: string
          description: user who initiated this backup.
        purged:
          type: boolean
          description: This is boolean variable which will be false by default. Value
            will be true if this backup no more exist because of auto purge after
            specified retention period.
        startTimeStamp:
          type: string
          format: date-time
          description: Date Time stamp when job started.
        endTimeStamp:
          type: string
          format: date-time
          description: Date Time stamp when job completed.
        sources:
          $ref: "#/components/schemas/sourceSummary"
        message:
          $ref: "#/components/schemas/message"
        links:
          type: array
          description: relation links that apply to this resource
          items:
            $ref: "#/components/schemas/link"
    restoreRequest:
      title: Restore Request
      description: Schema for restore Request.
      type: object
      required:
      - backupName
      properties:
        version:
          type: integer
          description: The version number of this representation, the current version
            is 2.
        slug:
          type: string
          description: name given to a restore operation.
        comments:
          type: string
          description: free text comments associated with this restore operation
        backupName:
          type: string
          description: unique id of backup for which restore operation is to be executed.
            This is same as 'name' field from vnd.sas.backup representation
        force:
          type: boolean
          default: false
          description: "optional boolean variable which will be false by default if\
            \ omitted from the request body. This will enable user to force restore\
            \ a source if the pre restore validations fail. for example: This can\
            \ be used when the list of databases currently in SAS Infrastructure Data\
            \ Server do not match with the list databases that were backed up. If\
            \ it is set to true, the restore operation will be forced to restore databases\
            \ that are currently present both in SAS Infrastructure Data Server and\
            \ the backup."
    restoreJob:
      title: Restore Job
      description: Information about restore job. Returns vnd.sas.restore.job
