---
openapi: 3.0.3
info:
  version: "4"
  title: Deployment Backup
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
  description: Document listing the methods available for the deployment backup REST
    API
tags:
- name: Root
  description: The operations for Root resource.
- name: Backups
  description: Backup Operations.
- name: DeploymentBackups
  description: Backup Operations done by Provider Administrator in Multi-tenant environment.
- name: Configurations
  description: Operation on Configuration.
- name: Sources
  description: Operation on Sources.
- name: Restores
  description: Restore Operations.
- name: DeploymentRestores
  description: Restore Operations done by Provider Administrator in Multi-tenant environment.
paths:
  /:
    get:
      summary: List of top-level links
      description: Returns list of links to the top-level collections surfaced through
        this API.
      operationId: root
      tags:
      - Root
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootapi"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/rootapi"
    head:
      summary: Check if backup service is available
      description: Returns whether backup service is running. It also returns headers
        that get "/" Api returns.
      operationId: headersForRoot
      tags:
      - Root
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
  /backups:
    get:
      summary: Retrieves the history of all the backups that have been performed till
        date by Tenant in multi-tenant environment or by administrator in non-multi-tenant
        environment
      description: Get backup operations history(Paginated). Returns application/vnd.sas.collection
        of type application/vnd.sas.backup.summary
      operationId: getBackups
      tags:
      - Backups
      parameters:
      - name: start
        in: query
        required: false
        description: (Optional) starting index of paginated list of backups from history
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: (Optional) number of backups from history on a page.
        schema:
          type: integer
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.backup.summary+json:
              schema:
                $ref: "#/components/schemas/backupCollection"
              examples:
                json:
                  $ref: "#/components/examples/backups"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/backupCollection"
              examples:
                json:
                  $ref: "#/components/examples/backups"
            application/json:
              schema:
                $ref: "#/components/schemas/backupCollection"
              examples:
                json:
                  $ref: "#/components/examples/backups"
  /backups#deployment:
    get:
      summary: Retrieves the history of all the backups that have been performed till
        date by Provider Administrator in multi-tenant-environment
      description: Get Provider backup operations history(Paginated). Returns application/vnd.sas.collection
        of type application/vnd.sas.backup.deployment.summary
      operationId: getDeploymentBackups
      tags:
      - DeploymentBackups
      parameters:
      - name: start
        in: query
        required: false
        description: (Optional) starting index of paginated list of Provider backups
          from history
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: (Optional) number of backups from history on a page.
        schema:
          type: integer
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.backup.deployment.summary+json:
              schema:
                $ref: "#/components/schemas/deploymentBackupCollection"
              examples:
                json:
                  $ref: "#/components/examples/backupsDeployment"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/deploymentBackupCollection"
              examples:
                json:
                  $ref: "#/components/examples/backupsDeployment"
            application/json:
              schema:
                $ref: "#/components/schemas/deploymentBackupCollection"
              examples:
                json:
                  $ref: "#/components/examples/backupsDeployment"
  /backups/{backupId}:
    get:
      summary: Get backup operation's details for Tenant in multi-tenant environment
        or for administrator in non-multi-tenant environment
      description: Get backup details performed by Tenant in multi-tenant environment
        or by administrator in non-multi-tenant environment for given backup id. Returns
        application/vnd.sas.backup+json
      operationId: getBackup
      tags:
      - Backups
      parameters:
      - name: backupId
        in: path
        required: true
        description: specifies unique id of backup operation for which details have
          been asked
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.backup+json:
              schema:
                $ref: "#/components/schemas/backup"
              examples:
                json:
                  $ref: "#/components/examples/backupsId"
            application/json:
              schema:
                $ref: "#/components/schemas/backup"
              examples:
                json:
                  $ref: "#/components/examples/backupsId"
        "404":
          description: No backup with given id found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /backups/{backupId}#deployment:
    get:
      summary: Get details of backup operation performed by Provider Administrator
        in multi-tenant environment
      description: Get backup operation's details which is performed by Provider Administrator
        in multi-tenant environment. Returns application/vnd.sas.backup.deployment.summary+json
      operationId: getDeploymentBackup
      tags:
      - DeploymentBackups
      parameters:
      - name: backupId
        in: path
        required: true
        description: specifies unique id of backup operation for which details have
          been asked
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.backup.deployment.summary+json:
              schema:
                $ref: "#/components/schemas/backupDeploymentSummary"
              examples:
                json:
                  $ref: "#/components/examples/backupsIdDeployment"
            application/json:
              schema:
                $ref: "#/components/schemas/backupDeploymentSummary"
              examples:
                json:
                  $ref: "#/components/examples/backupsIdDeployment"
        "404":
          description: No backup with given id found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /backups/jobs:
    post:
      summary: Initiates a backup operation for Tenant in multi-tenant environment
        or by administrator in non-multi-tenant environment asynchronously
      description: Start a backup asynchronously.The backup job is created and returned
        to user while the operation happens in the background. Returns application/vnd.sas.backup.job+json
      operationId: createStartBackup
      tags:
      - Backups
      requestBody:
        content:
          application/vnd.sas.backup.request+json:
            schema:
              $ref: "#/components/schemas/backupRequest"
            examples:
              json:
                $ref: "#/components/examples/backupJobRequest"
        description: request body for the backup operation
        required: true
      responses:
        "202":
          description: Accepted - if operation is requested asynchronous
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
            Location:
              description: Location of the newly created job in the form /backups/jobs/{id}
              schema:
                type: string
          content:
            application/vnd.sas.backup.job+json:
              schema:
                $ref: "#/components/schemas/backupJob"
              examples:
                json:
                  $ref: "#/components/examples/backupJobResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/backupJob"
              examples:
                json:
                  $ref: "#/components/examples/backupJobResponse"
        "400":
          description: "(Bad Request): There was a validation error for the request."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error2"
        "409":
          description: Resource Conflict.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/resourceConflictError"
    get:
      summary: Retrieves the running or pending backup jobs started by Tenant in multi-tenant
        environment or by administrator in non-multi-tenant environment
      description: Get collection of running / pending backup jobs started by Tenant
        in multi-tenant environment or by administrator in non-multi-tenant environment.
        Returns application/vnd.sas.collection of type application/vnd.sas.backup.job
      operationId: getRunningBackups
      tags:
      - Backups
      parameters:
      - name: start
        in: query
        required: false
        description: (Optional) starting index of paginated list of running backups
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: (Optional) number of running backups .
        schema:
          type: integer
      responses:
        "200":
          description: Success
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.backup.job:
              schema:
                $ref: "#/components/schemas/backupJobCollection"
              examples:
                json:
                  $ref: "#/components/examples/backupJobResponse"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/backupJobCollection"
              examples:
                json:
                  $ref: "#/components/examples/backupJobResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/backupJobCollection"
              examples:
                json:
                  $ref: "#/components/examples/backupJobResponse"
  /backups/jobs#deployment:
    post:
      summary: Start backup by Provider Administrator in multi-tenant environment
      description: Start a backup by Provider Administrator asynchronously. Returns
        application/vnd.sas.backup.deployment.job.details+json
      operationId: createStartDeploymentBackup
      tags:
      - DeploymentBackups
      requestBody:
        content:
          application/vnd.sas.backup.deployment.request+json:
            schema:
              $ref: "#/components/schemas/deploymentRequest"
            examples:
              json:
                $ref: "#/components/examples/backupJobDeploymentRequest"
        description: request body for the backup operation performed by Provider Administrator
        required: true
      responses:
        "202":
          description: Accepted - if operation is requested asynchronous
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
            Location:
              description: Location of the newly created job in the form /backups/jobs/{id}
              schema:
                type: string
          content:
            application/vnd.sas.backup.deployment.job.details+json:
              schema:
                $ref: "#/components/schemas/backupDeploymentJobDetails"
              examples:
                json:
                  $ref: "#/components/examples/backupJobDeploymentResponse"
        "400":
          description: "(Bad Request): There was a validation error for the request."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error2"
        "409":
          description: Resource Conflict.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/resourceConflictError"
  /backups/jobs/{jobId}:
    get:
      summary: Get backup job of Tenant in multi-tenant environment or administrator
        in non-multi-tenant environment by given id
      description: Get details of any backup job of Tenant in multi-tenant environment
        or administrator in non-multi-tenant environment. Returns application/vnd.sas.backup.job+json
      operationId: getBackupJob
      tags:
      - Backups
      parameters:
      - name: jobId
        in: path
        required: true
        description: A valid id of any ongoing or completed backup operation.
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.backup.job+json:
              schema:
                $ref: "#/components/schemas/backupJob"
              examples:
                json:
                  $ref: "#/components/examples/backupJobId"
            application/json:
              schema:
                $ref: "#/components/schemas/backupJob"
              examples:
                json:
                  $ref: "#/components/examples/backupJobId"
        "404":
          description: No backup job with given jobId found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /backups/jobs/{jobId}#deployment:
    get:
      summary: Backup job details started by Provider Administrator in multi-tenant
        environment
      description: Get details of backup job started by Provider Administrator. Returns  application/vnd.sas.backup.deployment.job.details+json
      operationId: getDeploymentBackupJob
      tags:
      - DeploymentBackups
      parameters:
      - name: jobId
        in: path
        required: true
        description: A valid id of any ongoing or completed backup operation.
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.backup.deployment.job.details+json:
              schema:
                $ref: "#/components/schemas/backupDeploymentJobDetails"
              examples:
                json:
                  $ref: "#/components/examples/backupJobIdDeployment"
            application/json:
              schema:
                $ref: "#/components/schemas/backupDeploymentJobDetails"
              examples:
                json:
                  $ref: "#/components/examples/backupJobIdDeployment"
        "404":
          description: No backup job with given jobId found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /backups/jobs/{jobId}/state:
    get:
      summary: Backup job state
      description: Get state of the backup job by id. Possible values for this attribute
        are 'pending', 'running', 'completedWithWarning', 'completed', 'failed', 'canceling',
        'canceled'.
      operationId: getBackupState
      tags:
      - Backups
      parameters:
      - name: jobId
        in: path
        description: id of the backup job
        required: true
        schema:
          type: string
      responses:
        "200":
          description: success
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.job.state+json:
              schema:
                $ref: "#/components/schemas/jobState"
              examples:
                json:
                  $ref: "#/components/examples/backupJobState"
            application/json:
              schema:
                $ref: "#/components/schemas/jobState"
              examples:
                json:
                  $ref: "#/components/examples/backupJobState"
        "404":
          description: No backup job with given jobId found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
    put:
      summary: Change state of only running or pending Backup job to cancel
      description: Change the state of the backup job by id. A state of backup job
        can be changed to 'canceled' only if that job's status is either 'running'
        or 'pending'.  The value for this attribute is 'canceled'.
      operationId: updateJobState
      tags:
      - Backups
      parameters:
      - name: jobId
        in: path
        description: id of the backup job
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: Value should be 'canceled'.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: success
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.job.state+json:
              schema:
                $ref: "#/components/schemas/jobState"
              examples:
                json:
                  $ref: "#/components/examples/backupCancelState"
            application/json:
              schema:
                $ref: "#/components/schemas/jobState"
              examples:
                json:
                  $ref: "#/components/examples/backupCancelState"
        "400":
          description: "(Bad Request): There was a validation error for the request."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error2"
        "404":
          description: No backup job with given jobId found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /backups/jobs/{jobId}/state#deployment:
    get:
      summary: Deployment Backup job state
      description: Get state of the backup job by id. Possible values for this attribute
        are 'pending', 'running', 'completedWithWarning', 'completed', 'failed' 'canceling',
        'canceled'.
      operationId: getDeploymentBackupState
      tags:
      - DeploymentBackups
      parameters:
      - name: jobId
        in: path
        description: id of the backup job
        required: true
        schema:
          type: string
      responses:
        "200":
          description: success
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.job.deployment.state+json:
              schema:
                $ref: "#/components/schemas/jobDeploymentState"
              examples:
                json:
                  $ref: "#/components/examples/backupJobDeploymentState"
            application/json:
              schema:
                $ref: "#/components/schemas/jobDeploymentState"
              examples:
                json:
                  $ref: "#/components/examples/backupJobDeploymentState"
        "404":
          description: No backup job with given jobId found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
    put:
      summary: Change state of only running or pending Deployment Backup job to cancel
      description: Change the state of the backup job by id. A state of backup job
        can be changed to 'canceled' only if that job's status is either 'running'
        or 'pending'.  The value for this attribute is 'canceled'.
      operationId: updateDeploymentJobState
      tags:
      - DeploymentBackups
      parameters:
      - name: jobId
        in: path
        description: id of the backup job
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: Value should be 'canceled'.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: success
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.job.deployment.state+json:
              schema:
                $ref: "#/components/schemas/jobDeploymentState"
              examples:
                json:
                  $ref: "#/components/examples/backupCancelStateDeployment"
            application/json:
              schema:
                $ref: "#/components/schemas/jobDeploymentState"
              examples:
                json:
                  $ref: "#/components/examples/backupCancelStateDeployment"
        "400":
          description: "(Bad Request): There was a validation error for the request."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/error2"
        "404":
          description: No backup job with given jobId found
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /configurations:
    get:
      summary: Available configurations
      description: Get all configurations. Returns application/vnd.sas.collection
        of type application/vnd.sas.backup.configuration
      operationId: getBackupConfigurations
      tags:
      - Configurations
      responses:
        "200":
          description: Success
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
                json:
                  $ref: "#/components/examples/configurations"
            application/json:
              schema:
                $ref: "#/components/schemas/configurationCollection"
              examples:
                json:
                  $ref: "#/components/examples/configurations"
  /configurations/{configurationId}:
    get:
      summary: Configuration by id
      description: Get backup configuration with given id.
      operationId: getBackupConfiguration
      tags:
      - Configurations
      parameters:
      - name: configurationId
        in: path
        description: id of the required configuration
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.backup.configuration+json:
              schema:
                $ref: "#/components/schemas/backupConfiguration"
              examples:
                json:
                  $ref: "#/components/examples/configuration"
            application/json:
              schema:
                $ref: "#/components/schemas/backupConfiguration"
              examples:
                json:
                  $ref: "#/components/examples/configuration"
        "404":
          description: No configuration found with given id
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /configurations/{configurationId}/sources:
    get:
      summary: Sources enabled for backup/restore
      description: Get collection of backup enabled sources. Returns application/vnd.sas.collection
        of type application/vnd.sas.backup.source.type
      operationId: getBackupSources
      tags:
      - Sources
      parameters:
      - name: configurationId
        in: path
        description: id of the parent configuration
        required: true
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: (Optional) starting index of paginated list of running backups
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: (Optional) number of running backups .
        schema:
          type: integer
      responses:
        "200":
          description: Success
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/sourceCollection"
              examples:
                json:
                  $ref: "#/components/examples/sources"
            application/json:
              schema:
                $ref: "#/components/schemas/sourceCollection"
              examples:
                json:
                  $ref: "#/components/examples/sources"
        "404":
          description: No configuration found with given id
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/notFoundError"
  /configurations/{configurationId}/sources/{sourceId}:
    get:
      summary: Backup enabled source by id
      description: Get configuration of a backup enabled source by id.
      operationId: getBackupSource
      tags:
      - Sources
      parameters:
      - name: configurationId
        in: path
        description: id of the parent configuration
        required: true
        schema:
          type: string
      - name: sourceId
        in: path
        description: id of the source whose configuration is required
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success
          headers:
            Cache-Control:
              description: The caching policy for the media type
              schema:
                type: string
          content:
            application/vnd.sas.backup.source.type+json:
              schema:
                $ref: "#/components/schemas/backupSourceType"
              examples:
                json:
                  $ref: "#/components/examples/source"
            application/json:
              schema:
                $ref: "#/components/schemas/backupSourceType"
              examples:
                json:
                  $ref: "#/components/examples/source"
        "404":
          description: either configuration with given configuration Id or source
            with given sourceId not found
          content:
            application/vnd.sas.error+json:
              schema:
