---
openapi: 3.0.3
info:
  version: "7"
  title: Risk Explorations
  description: >-
    The Risk Explorations API supports the creation and management of risk exploration
    files.  These explorations are
    used with the SAS Risk Explorer application.

    Features of this API include the following:
     1. Creating the Risk Exploration
     2. Retrieving the Risk Exploration
     3. Updating the Risk Exploration
     4. Deleting the Risk Exploration
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: "SAS Developers"
    url: "https://developer.sas.com"
    email: "devex@sas.com"
tags:
- name: Root
  description: The operations for the root resource.
- name: Explorations
  description: The operations for a RiskExploration resource.
paths:
  /:
    head:
      tags:
      - Root
      summary: Check if Risk Explorations service is available
      description: This endpoint can be used to check the availability of the Risk
        Exploration service.
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded. The service is available.
        "404":
          description: The service is not available.
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a collection of links to the top-level collections surfaced
        through this API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                risk-exploration-collection:
                  $ref: "#/components/examples/rootLinksV1"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                risk-exploration-collection:
                  $ref: "#/components/examples/rootLinksV1"
        "404":
          description: Service is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /explorations:
    get:
      tags:
      - Explorations
      summary: Get a collection of risk explorations
      description: Returns a collection of risk explorations. Standard paging and
        sorting options are provided. Default sorting for this collection will be
        name:ascending.
      operationId: getExplorations
      parameters:
      - name: loadDataSources
        in: query
        description: If loadDataSources is set to true, the dataSources list will
          be populated for all returned explorations.
        required: false
        schema:
          type: boolean
          default: false
      - name: populateAnalysis
        in: query
        description: If populateAnalysis is set to true, the analysis content will
          be populated for all returned explorations.
        required: false
        schema:
          type: boolean
          default: false
      - name: start
        in: query
        description: pagination parameter, what is the starting index.
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: pagination parameter, how many items to return.
        schema:
          type: integer
          format: int32
          default: 100
      - name: filter
        in: query
        description: The criteria for filtering the explorations.
        schema:
          type: string
      - name: sortBy
        in: query
        description: The criteria for sorting the explorations.
        schema:
          type: string
      responses:
        "200":
          description: Explorations
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/explorationCollectionV1"
              examples:
                exploration-collection:
                  $ref: "#/components/examples/explorationsCollectionV1"
            application/json:
              schema:
                $ref: "#/components/schemas/explorationCollectionV1"
              examples:
                exploration-collection:
                  $ref: "#/components/examples/explorationsCollectionV1"
        "400":
          description: An invalid filter or combination of request parameters was
            provided.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Bad request error
                  value: {"errorCode": 78617, "message": 'The "limit" parameter must
                      be greater than or equal to zero and less than 10001. [78617]',
                    "details": ["traceId: 8d9c39e243450894", "path: /riskExplorations/explorations/"],
                    "links": [], "version": 2, "httpStatusCode": 400}
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Bad request error
                  value: {"errorCode": 78617, "message": 'The "limit" parameter must
                      be greater than or equal to zero and less than 10001. [78617]',
                    "details": ["traceId: 8d9c39e243450894", "path: /riskExplorations/explorations/"],
                    "links": [], "version": 2, "httpStatusCode": 400}
    post:
      tags:
      - Explorations
      summary: Create new exploration
      description: Creates a new exploration or copy an existing exploration. Name
        uniqueness across explorations in a folder is enforced. Only the name, description,
        dataSources, parentUri, properties, and analysis fields are editable.
      operationId: createRiskExploration
      parameters:
      - name: parentFolderUri
        in: query
        description: Folder uri to save the exploration in
        required: false
        schema:
          type: string
      - name: parentFolderDisplayPath
        in: query
        description: The full display folder path to save the exploration in
        required: false
        schema:
          type: string
      - name: createFolder
        in: query
        description: Create the folder display path passed in if it does not exist.
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/vnd.sas.risk.exploration+json:
            schema:
              $ref: "#/components/schemas/newExplorationV1"
          application/json:
            schema:
              $ref: "#/components/schemas/newExplorationV1"
        required: true
      responses:
        "201":
          description: New exploration created
          headers:
            Location:
              description: The URI of the newly created exploration
              schema:
                type: string
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this exploration.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/explorationV1"
            application/json:
              schema:
                $ref: "#/components/schemas/explorationV1"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                sample:
                  summary: Bad request error
                  value:
                    errorCode: 78634
                    message: "The parent folder information is required. [78634]"
                    details:
                    - "traceId: 18a25c30c218943c"
                    - "path: /riskExplorations/explorations"
                    version: 2
                    httpStatusCode: 400
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                sample:
                  summary: Bad request error
                  value:
                    errorCode: 78634
                    message: "The parent folder information is required. [78634]"
                    details:
                    - "traceId: 18a25c30c218943c"
                    - "path: /riskExplorations/explorations"
                    version: 2
                    httpStatusCode: 400
        "404":
          description: The request was not found.
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                sample:
                  summary: Not found error
                  value:
                    errorCode: 78623
                    message": 'The parent folder for the risk exploration "SCENSIM
                      folder path 1.rskexp" could not be found. [78623]'
                    details":
                    - "traceId: 3a246823fd5dd2f4"
                    - "path: /riskExplorations/explorations"
                    version: 2
                    httpStatusCode: 404
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                sample:
                  summary: Not found error
                  value:
                    errorCode: 78623
                    message": 'The parent folder for the risk exploration "SCENSIM
                      folder path 1.rskexp" could not be found. [78623]'
                    details":
                    - "traceId: 3a246823fd5dd2f4"
                    - "path: /riskExplorations/explorations"
                    version: 2
                    httpStatusCode: 404
        "409":
          description: The exploration name already exists.
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Conflict error
                  value:
                    errorCode: 78612
                    message: "A risk exploration with the specified name already exists.\
                      \ [78612]"
                    details:
                    - "traceId: 4f925733fd7956a3"
                    - "path: /riskExplorations/explorations"
                    version: 2
                    httpStatusCode: 409
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Conflict error
                  value:
                    errorCode: 78612
                    message: "A risk exploration with the specified name already exists.\
                      \ [78612]"
                    details:
                    - "traceId: 4f925733fd7956a3"
                    - "path: /riskExplorations/explorations"
                    version: 2
                    httpStatusCode: 409
  /explorations/{explorationId}:
    get:
      tags:
      - Explorations
      summary: Get exploration
      description: Returns the specified exploration.  HEAD is also supported and
        will return status and headers only.
      operationId: getExploration
      parameters:
      - name: explorationId
        in: path
        description: The identifier of a specific exploration.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: Returns the exploration.
          headers:
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this exploration.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/explorationV1"
              examples:
                risk-exploration:
                  $ref: "#/components/examples/getExplorationV1"
            application/json:
              schema:
                $ref: "#/components/schemas/explorationV1"
              examples:
                risk-exploration:
                  $ref: "#/components/examples/getExplorationV1"
        "404":
          description: The risk exploration was not found.
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Not found error
                  value:
                    errorCode: 78601
                    message: 'The risk exploration file with the ID "ba8fa6cb-e115-47f7-880c-cbdbeb05c7fcxx"
                      could not be found. [78601]'
                    details:
                    - "traceId: ff021b6a915d850e"
                    - "path: /riskExplorations/explorations/ba8fa6cb-e115-47f7-880c-cbdbeb05c7fcxx"
                    version: 2
                    httpStatusCode: 404
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Not found error
                  value:
                    errorCode: 78601
                    message: 'The risk exploration file with the ID "ba8fa6cb-e115-47f7-880c-cbdbeb05c7fcxx"
                      could not be found. [78601]'
                    details:
                    - "traceId: ff021b6a915d850e"
                    - "path: /riskExplorations/explorations/ba8fa6cb-e115-47f7-880c-cbdbeb05c7fcxx"
                    version: 2
                    httpStatusCode: 404
    patch:
      tags:
      - Explorations
      summary: Patch an existing exploration
      description: Patches an existing exploration. Only the name, description, dataSources,
        parentUri, properties, and analysis fields are editable.
      operationId: patchExploration
      parameters:
      - name: explorationId
        in: path
        description: The identifier of a specific exploration and MUST exactly match
          exploration id sent in body of request.
        required: true
        schema:
          type: string
          format: object-id
      - name: If-Match
        in: header
        description: The ETag that was returned from a GET, POST or PATCH of this
          exploration.
        required: false
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: Notes that the patch should be applied only if the object hasn't
          been modified since the given date.
        required: false
        schema:
          type: integer
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: "#/components/schemas/explorationPatchV1"
          application/json:
            schema:
              $ref: "#/components/schemas/explorationPatchV1"
        required: true
      responses:
        "200":
          description: Exploration Patched
          headers:
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this exploration.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/explorationV1"
            application/json:
              schema:
                $ref: "#/components/schemas/explorationV1"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/badRequest"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: Exploration is not found.
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/notFound"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/notFound"
        "409":
          description: New exploration name already exists.
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/conflict"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/conflict"
        "412":
          description: The ETag or Modified date provided does not match the current
            version of the object.
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/preConditionFailed"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/preConditionFailed"
        "422":
          description: The request could not be processed.
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/unprocessableEntity"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/unprocessableEntity"
        "428":
          description: The ETag or Modified date was not provided when updating an
            existing type.
          content:
            application/vnd.sas.risk.exploration+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/preConditionRequired"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/preConditionRequired"
    delete:
      tags:
      - Explorations
      summary: Delete exploration
      description: The specified exploration is deleted.
      operationId: deleteExplorations
      parameters:
      - name: explorationId
        in: path
        description: The identifier of a specific exploration.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "204":
          description: Exploration is deleted.
servers:
- url: "http://example.com/riskExplorations"
  description: This is an example base URL.
components:
  # SCHEMAS ====================================================================
  schemas:
    newExplorationV1:
      title: New Exploration
      description: The representation used to create a new exploration.
      required:
      - name
      properties:
        name:
          type: string
          description: Exploration name.
        description:
          type: string
          description: Exploration description.
        dataSources:
          type: array
          description: An array of data source detail information to find the associated
            Risk Environment needed.
          items: {}
        analysis:
          type: string
          description: SAS Risk Explorer information used by the application specific
            to the exploration.
        parentUri:
          type: string
          format: string
          description: The folder uri to save the risk exploration in.
        properties:
          type: object
          description: Additional properties that could be specified for the exploration.
          additionalProperties:
            type: string
        version:
          type: integer
          description: The version number of hte exploration representation.  This
            representation is version 1.
    explorationPatchV1:
      title: Patch Exploration
      description: The representation used to patch an exploration.
      required:
      - explorationId
      allOf:
      - $ref: "#/components/schemas/newExplorationV1"
      - type: object
        properties:
          explorationId:
            type: string
            format: object-id
            description: Exploration id.
    explorationV1:
      title: Exploration
      description: The representation of an exploration.
      allOf:
      - $ref: "#/components/schemas/newExplorationV1"
      - type: object
        properties:
          documentType:
            type: string
            description: The document type of the exploration.
          encoding:
            type: string
            description: The encoding of the exploration.
          dataSourcesLoaded:
            type: boolean
            description: Indicates if the data sources saved with the exploration
              are valid on load.
          contentType:
            type: string
            description: The media type of the exploration.
          contentDisposition:
            type: string
            description: Value for Content Disposition header which will be set in
              response while downloading.
          favorite:
            type: boolean
            description: If the exploration is found in the My Favorites folder true
              will be set.
          recent:
            type: boolean
            description: If the exploration is found in the My History folder true
              will be set.
          folderDisplayName:
            type: string
            description: The full folder path displayed to the user.
          size:
            type: integer
            description: The size of the exploration file.
          createdBy:
            type: string
            description: The userid of the user who created this exploration.
          creationTimeStamp:
            type: string
            format: date-time
            description: Timestamp of exploration creation.
          modifiedBy:
            type: string
            description: The userid of the last user who modified this exploration.
          modifiedTimeStamp:
            type: string
            format: date-time
            description: Timestamp of last exploration modification.
          links:
            type: array
            description: The links that apply to the exploration.
            items:
              $ref: "#/components/schemas/link"
    explorationCollectionV1:
      title: Exploration Collection
      description: A collection of exploration representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The array of exploration representations.
            items:
              $ref: "#/components/schemas/explorationV1"
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
  examples:
    rootLinksV1:
      summary: List of risk explorations links.
      description: GET risk explorations response.
      value: {"version": 1, "links": [{"method": "GET", "rel": "riskExplorations",
            "href": "/riskExplorations/explorations", "uri": "/riskExplorations/explorations",
            "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.risk.exploration"},
          {"method": "POST", "rel": "createRiskExploration", "href": "/riskExplorations/explorations?parentFolderUri={parentFolderUri}&parentFolderDisplayPath={parentFolderDisplayPath}&createFolder={createFolder}",
            "uri": "/riskExplorations/explorations?parentFolderUri={parentFolderUri}&parentFolderDisplayPath={parentFolderDisplayPath}&createFolder={createFolder}",
            "type": "application/vnd.sas.risk.exploration"}, {"method": "GET", "rel": "getRiskExploration",
            "href": "/riskExplorations/explorations/{explorationId}", "uri": "/riskExplorations/explorations/{explorationId}",
            "type": "application/vnd.sas.risk.exploration"}]}
    explorationsCollectionV1:
      summary: Response for GET risk explorations collection.
      description: Results for a GET risk explorations collection.
      value: {"links": [{"method": "GET", "rel": "collection", "href": "/riskExplorations/explorations",
            "uri": "/riskExplorations/explorations", "type": "application/vnd.sas.collection",
            "itemType": "application/vnd.sas.risk.exploration"}, {"method": "GET",
            "rel": "self", "href": "/riskExplorations/explorations?start=0&limit=250",
            "uri": "/riskExplorations/explorations?start=0&limit=250", "type": "application/vnd.sas.collection",
            "itemType": "application/vnd.sas.risk.exploration"}, {"method": "POST",
            "rel": "createRiskExploration", "href": "/explorations?parentFolderUri={parentFolderUri}&parentFolderDisplayPath={parentFolderDisplayPath}&createFolder={createFolder}",
            "uri": "/explorations?parentFolderUri={parentFolderUri}&parentFolderDisplayPath={parentFolderDisplayPath}&createFolder={createFolder}",
            "type": "application/vnd.sas.risk.exploration"}], "name": "riskExplorations",
