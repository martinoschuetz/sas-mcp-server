        description: Includes the generated BPMN model.
        required: false
        schema:
          type: boolean
      tags:
      - Workflows
    get:
      summary: Get the details for the specified workflow definition
      description: Retrieves the details for the specified workflow definition.
      operationId: getWorkflow
