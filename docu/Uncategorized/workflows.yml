---
openapi: 3.0.3
info:
  version: "4"
  title: Visual Investigator Workflow
  description: The SAS Visual Investigator Workflow API enable users to execute and
    manage workflows created within SAS Visual Investigator. The SAS Visual Investigator
    workflows are based on an open-source engine that complies with the Business Process
    Model and Notation (BPMN) 2.0 standard. It supports industry standards for visual
    representation and behavior, and it provides support for established workflow
    patterns. SAS Visual Investigator workflows are efficient and scalable, and integrate
    with other standard business process implementations.
  termsOfService: 'https://www.sas.com/en_us/legal/copyright.html'
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
servers:
- url: 'http://example.com/workflows'
  description: An example URL including the base path for this service that is based
    off svi-datahub.
tags:
- name: Workflows
  description: Endpoints to manage workflow templates.
- name: Processes
  description: Endpoints manage workflow processes.
- name: Tasks
  description: Endpoints related to workflow tasks.
- name: Metrics Summary
  description: Endpoints to view historical process activity measurements.
- name: History
  description: Endpoint to view history of workflow process activity.
- name: Settings
  x-sas-internal: true
  description: Endpoints to manage grid settings for tasks.
paths:
# Workflows Section -------------------------------------------------------
  /:
    post:
      summary: Create a new workflow definition
      description: Creates a new workflow definition.
      operationId: createWorkflow
      x-sas-internal: true
      responses:
        "201":
          headers:
            Last-Modified:
              description: The time at which this resource was last updated.
              schema:
                type: integer
                format: int64
            Location:
              description: The location of the new resource.
              schema:
                type: string
          description: The workflow definition was created.
          content:
            application/vnd.sas.investigation.workflow.workflow+json:
              schema:
                $ref: "#/components/schemas/workflowRep"
              examples:
                api:
                  $ref: "#/components/examples/singleWorkflowTemplate"
            application/json:
              schema:
                $ref: "#/components/schemas/workflowRep"
              examples:
                api:
                  $ref: "#/components/examples/singleWorkflowTemplate"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
      parameters:
      - in: query
        name: start
        description: start
        required: false
        schema:
          type: boolean
      - in: header
        name: Content-Type
        description: The version of the workflow in the body.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.investigation.workflow.workflow+json:
            schema:
              $ref: "#/components/schemas/workflowRep"
            examples:
              api:
                $ref: "#/components/examples/createWorkflowRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/workflowRep"
            examples:
              api:
                $ref: "#/components/examples/createWorkflowRequest"
        description: The representation of the definition.
        required: true
      tags:
      - Workflows
    head:
      summary: Get the headers for the workflow definitions
      description: Returns the headers for the workflow definitions.
      operationId: headersForWorkflows
      responses:
        "200":
          headers: {}
          description: The request succeeded.
        "400":
          description: The request was invalid.
      parameters:
      - in: query
        name: fields
        description: The comma-separated list of resource members to return in the
          collection.
        required: false
        schema:
          type: string
      - in: query
        name: filter
        description: Filters the collection using prefix function syntax using selected
          resource members.
        required: false
        schema:
          type: string
      - in: query
        name: start
        description: The zero-based index of the first item in the collection.
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - in: query
        name: limit
        description: The number of items that were requested for the collection.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - in: query
        name: sortBy
        description: The sorting preference for selected resource members in the returned
          collection.
        required: false
        schema:
          type: string
          default: id:ascending
      tags:
      - Workflows
    get:
      summary: Get a list of workflow definitions
      description: Retrieves a list of the latest workflow definitions. The returned
        items are of type application/vnd.sas.investigation.workflow.workflow+json.
      operationId: getWorkflows
