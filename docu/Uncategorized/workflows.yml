              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
      parameters:
      - in: path
        name: workflowId
        description: The ID of the workflow definition.
        required: true
        schema:
          type: string
      tags:
      - Workflows
    put:
      summary: Update an existing workflow definition
      description: Updates an existing workflow definition. When a workflow is updated,
        a new version of the workflow definition is created.  This ensures that existing
        processes working tasks against the previous versions of this workflow have
        access to the data needed and can continue.  A workflow is not versioned if
        the updated properties are shared by all workflow versions (label, description,
        enabled, and useForAutoStart).
      operationId: updateWorkflow
      responses:
        "200":
          headers:
            Last-Modified:
              description: " The time at which this resource was last updated."
              schema:
                type: integer
                format: int64
          description: The request succeeded.
          content:
            application/vnd.sas.investigation.workflow.workflow+json:
              schema:
                $ref: "#/components/schemas/workflowRep"
              examples:
                api:
                  $ref: "#/components/examples/singleWorkflowTemplate"
            application/json:
              schema:
                $ref: "#/components/schemas/workflowRep"
              examples:
                api:
                  $ref: "#/components/examples/singleWorkflowTemplate"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: No workflow definition exists at the requested path.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
        "412":
          description: The If-Match request header did not match the resource's entity
            tag, or the If-Unmodified-Since request header did not match the resource's
            last modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error412"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error412"
        "428":
          description: The request headers did not include an If-Match or If-Unmodified-Since
            precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error428"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error428"
      parameters:
      - in: path
        name: workflowId
        description: The ID of the workflow.
        required: true
        schema:
          type: string
      - in: header
        name: Content-Type
        description: The version of the workflow in the body.
        required: false
        schema:
          type: string
      - in: header
        name: If-Unmodified-Since
        description: The time at which this workflow definition was last modified.
        required: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/vnd.sas.investigation.workflow.workflow+json:
            schema:
              $ref: "#/components/schemas/workflowRep"
            examples:
              api:
                $ref: "#/components/examples/updateWorkflowRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/workflowRep"
            examples:
              api:
                $ref: "#/components/examples/updateWorkflowRequest"
        description: The representation of the workflow definition.
        required: true
      tags:
      - Workflows
