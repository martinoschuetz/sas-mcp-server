  schemas:
    resourceResponse:
      title: Resource Response
      description: Localized resources.
      properties:
        resources:
          description: A map of resource keys to localized values.
          type: object
          additionalProperties:
            type: string
        links:
          type: array
          description: Links to related resources.
          items:
            $ref: "#/components/schemas/link"
    searchesNotificationResponse:
      title: Searches Notifications Response
      description: Response to running a saved search.
      properties:
        email:
          type: string
          description: The email address that results were sent to.
        hits:
          type: integer
          description: The number of hits returned for the search.
        links:
          type: array
          description: The links that apply to the search.
          items:
            $ref: "#/components/schemas/link"
    marker:
      title: Marker
      description: Object that is used to define a radius search.
      properties:
        longitude:
          type: number
          format: double
          description: Value for longitude.
        latitude:
          type: number
          format: double
          description: Value for latitude.
        radius:
          type: number
          description: Value for radius.
        radiusUnits:
          type: string
          description: A code to determine the units of the radius, "km" for kilometers
            and "miles" for miles.
    search:
      title: Search
      description: A user defined search.
      properties:
        displayResultsMap:
          type: boolean
          description: Boolean flag to determine if the search results should be displayed
            on a map.
        geoType:
          type: string
          description: If map search is enabled this code is used to determine if
            a radius or area filter should be applied to the geofilter, "radius" for
            radius filter and "area" for an area polygon filter.
        groupName:
          type: string
          description: Name of the group that the search is part of.
        mapEnabled:
          type: boolean
          description: Boolean value to determine if searching with a geofilter has
            been enabled.
        marker:
          $ref: "#/components/schemas/marker"
        name:
          type: string
          description: The name of the search.
        searchId:
          type: string
          description: The id of the search.
        queryString:
          type: string
          description: The search query.
        selectedAreaId:
          type: string
          description: Id of the area polygon to be used in the map search.
        sharedGroups:
          type: array
          items:
            type: string
          description: List of groups that the search has been shared with.
        systemDefined:
          type: boolean
          description: Boolean flag to determine if this is a system defined search.
        displaySearch:
          type: boolean
          description: Boolean flag to determine if this search should be displayed
            on the homepage.
        searchType:
          type: string
          description: String to determine what kind of search it is.
    searchEnhanced:
      title: Complete Search Definition
      description: A user defined search with the additional attribute searchModel.
      properties:
        createdBy:
          type: string
          description: The user who created the search.
        creationTimeStamp:
          type: string
          description: The date the search was created.
        modifiedBy:
          type: string
          description: The user who last modified the search.
        modifiedTimeStamp:
          type: string
          description: The date the search was last modified.
      allOf:
      - $ref: "#/components/schemas/search"
      - type: object
        properties:
          searchModel:
            type: object
            additionalProperties:
              type: string
            description: The search model object that will contain the object needed
              for the SAND Advanced Query Builder and the placeholders for form searches.
    searchCollection:
      title: Collection of Searches
      description: A collection of searches.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: the list of searches.
            items:
              $ref: "#/components/schemas/search"
    groups:
      title: Search Groups
      description: A list of search groups from the defined stored searches.
      properties:
        items:
          type: array
          items:
            type: string
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
    bookmark:
      title: Bookmark
      description: A bookmark object.
      properties:
        bookmarkId:
          type: string
          description: The id of the bookmark.
        bookmarkName:
          type: string
          description: The name of the bookmark.
        documentId:
          type: string
          description: The id of the document/object targeted.
        documentType:
          type: string
          description: The type of the document/object targeted.
        groupName:
          type: string
          description: Name of the group that the bookmark is part of.
    bookmarkGroup:
      title: A Bookmark Group
      description: A single bookmark group.
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: The group name.
    bookmarkGroups:
      title: Collection of Bookmark Groups
      description: A collection of bookmark groups.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: The list of bookmark groups.
            items:
              type: string
              description: The group name.
    bookmarkCollection:
      title: Collection of Bookmarks
      description: A collection of bookmarks.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: The list of bookmarks.
            items:
              $ref: "#/components/schemas/bookmark"
    api:
