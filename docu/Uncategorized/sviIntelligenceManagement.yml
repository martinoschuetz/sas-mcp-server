---
openapi: 3.0.3
info:
  version: "6"
  title: Intelligence Management
  description: The Intelligence Management REST API was created to support the functions
    of the SAS Investigation Content Pack solution.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/sviIntelligenceManagement
  description: This is an example base URL.
tags:
- name: Root
  description: Contains links to the operations supported by the API.
- name: Resource
  description: Supplies resource strings used by the client application.
- name: Search
  description: Manage and run saved searches.
- name: Bookmark
  description: Manage bookmarks for objects.
paths:
  /:
    get:
      summary: Get top-level resource links
      description: >
        Returns a list of links to the top-level resources that are surfaced through
        the API.
      tags:
      - Root
      operationId: root
      responses:
        "200":
          $ref: "#/components/responses/apiRoot"
  /resources:
    get:
      operationId: getResourceStrings
      tags:
      - Resource
      summary: Get localized application resource bundle
      description: >
        Returns all localized resources for the client application. <br><br>
        <b>Authorization:</b> Authenticated user.
      parameters:
      - name: Accept-Language
        in: header
        description: Specifies the language bundle to use when returning resource
          strings.
        schema:
          type: string
        example: fr-FR
      - name: locale
        in: query
        description: >
          Specifies the language bundle to use when returning resource strings. <br><br>
          (Overrides the Accept-Language header)
        schema:
          type: string
        example: de-DE
      responses:
        "200":
          $ref: "#/components/responses/resources"
  /searches:
    get:
      operationId: getSearches
      tags:
      - Search
      summary: Return all searches
      description: >
        Retrieves all searches the user can access. <br><br>
        <b>Authorization:</b> Authenticated user with the svi.solutions.sim.searches.admin
        capability.
      parameters:
      - in: query
        name: start
        description: The start index.
        required: false
        schema:
          type: integer
        example: 0
      - in: query
        name: limit
        description: The number of searches to return.
        required: false
        schema:
          type: integer
        example: 10
      - name: filter
        description: An expression for filtering the collection. Valid expressions
          include eq(name,"test"). Allowed members are `name`, `groupName`, `geoType`,
          `mapEnabled`.
        in: query
        schema:
          type: string
          format: filter-criteria
        example: eq(groupName,Research)
      - name: sortBy
        description: The criteria for sorting the searches. Valid sortBy parameters
          include `sortBy=name:descending`. Allowed members are `name`, `groupName`,
          `geoType`, `mapEnabled`.
        in: query
        schema:
          type: string
          format: sort-criteria
        example: groupName
      responses:
        "200":
          $ref: "#/components/responses/searchCollection"
        "403":
          $ref: "#/components/responses/searchErrorNoAdminCapability"
    post:
      operationId: createSearch
      tags:
      - Search
      summary: Create a new search
      description: >
        Creates a new search for the user. <br><br>
        Will also share the search with groups supplied in "sharedGroups" attribute.
        <br><br>
        Note that the searchId property should be omitted during creation. <br><br>
        <b>Authorization:</b> Authenticated user.
      requestBody:
        $ref: "#/components/requestBodies/search"
      responses:
        "201":
          $ref: "#/components/responses/searchCreate"
        "400":
          $ref: "#/components/responses/searchErrorBadData"
  "/searches/{searchId}":
    get:
      operationId: getSearch
      tags:
      - Search
      summary: Return a search
      description: >
        Retrieves a search with the provided id. <br><br>
        <b>Authorization:</b> Authenticated user with the svi.solutions.sim.searches.admin
        capability.
      parameters:
      - in: path
        name: searchId
        description: The unique identifier for the search.
        required: true
        schema:
          type: string
        example: ab3fd9be-8990-4785-b0e8-a87b1f353ce3
      responses:
        "200":
          $ref: "#/components/responses/search"
        "404":
          $ref: "#/components/responses/searchErrorNotFound"
    put:
      operationId: updateSearch
      tags:
      - Search
      summary: Update the search
      description: >
        Update a search identified by searchID. <br><br>
        <b>Authorization:</b> Authenticated user with the svi.solutions.sim.searches.admin
        capability or must own the search.
      parameters:
      - name: searchId
        in: path
        required: true
        description: The unique identifier for the search.
        schema:
          type: string
        example: ab3fd9be-8990-4785-b0e8-a87b1f353ce3
      - description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the search.
        in: header
        name: If-Match
        required: true
        schema:
          type: string
        example: '"lix8e7u0"'
      requestBody:
        $ref: "#/components/requestBodies/search"
      responses:
        "200":
          $ref: "#/components/responses/search"
        "400":
          $ref: "#/components/responses/searchErrorBadData"
        "403":
          $ref: "#/components/responses/searchErrorNotAuthorizedUpdate"
        "404":
          $ref: "#/components/responses/searchErrorNotFound"
        "412":
          $ref: "#/components/responses/searchErrorInvalidPrecondition"
        "428":
          $ref: "#/components/responses/searchErrorNoPrecondition"
    delete:
      tags:
      - Search
      summary: Delete search
      description: >
        This allows the user to delete the search that is identified by searchID.
        <br><br>
        <b>Authorization:</b> Authenticated user with the svi.solutions.sim.searches.admin
        capability or must own the search.
      operationId: deleteSearch
      parameters:
      - name: searchId
        in: path
        required: true
        description: The unique identifier for the search.
        schema:
          type: string
        example: ab3fd9be-8990-4785-b0e8-a87b1f353ce3
      responses:
        "204":
          description: The operation was successful, nothing to return.
        "404":
          $ref: "#/components/responses/searchErrorNotFound"
    head:
      operationId: headersForSearch
      tags:
      - Search
      summary: Return a search
      description: >
        Retrieves a search with the provided id. <br><br>
        <b>Authorization:</b> Authenticated user with the svi.solutions.sim.searches.admin
        capability. This is a HEAD operation
      parameters:
      - in: path
        name: searchId
        description: The unique identifier for the search.
        required: true
        schema:
          type: string
        example: ab3fd9be-8990-4785-b0e8-a87b1f353ce3
      responses:
        "200":
          $ref: "#/components/responses/search"
        "404":
          $ref: "#/components/responses/searchErrorNotFound"
  "/searches/{searchId}/notifications":
    post:
      operationId: createSearchNotification
      tags:
      - Search
      summary: Start search and return response
      description: >
        Runs a saved search against the svi-sand service and emails the results to
        the user. <br><br>
        The user must have a valid work email address listed by the identities service.
        <br><br>
        Search definitions identified by searchID are specific to the current user.
        <br><br>
        <b>Authorization:</b> Authenticated user with the svi.solutions.sim.searches.notifications
        capability.
      parameters:
      - in: path
        name: searchId
        description: The ID representing the search to be run.
        required: true
        schema:
          type: string
        example: ab3fd9be-8990-4785-b0e8-a87b1f353ce3
      responses:
        "200":
          $ref: "#/components/responses/searchNotification"
        "404":
          $ref: "#/components/responses/searchErrorNotFound"
  /searches/@activeSearches:
    get:
      operationId: getActiveSearches
      tags:
      - Search
      summary: Get all searches that were added by the current user
      description: >
        Returns all searches as a paged collection that were created by the currently
        authenticated user. <br><br>
        This request will also return information about what groups the search has
        been shared with. <br><br>
        <b>Authorization:</b> Authenticated user.
      parameters:
      - in: query
        name: start
        description: The start index.
        required: false
        schema:
          type: integer
        example: 0
      - in: query
        name: limit
        description: The number of searches to return.
        required: false
        schema:
          type: integer
        example: 10
      - name: filter
        description: An expression for filtering the collection. Valid expressions
          include eq(name,"test"). Allowed members are `name`, `groupName`, `geoType`,
          `mapEnabled`.
        in: query
        schema:
          type: string
          format: filter-criteria
        example: contains(name,car)
      - name: sortBy
        description: The criteria for sorting the searches. Valid sortBy parameters
          include `sortBy=name:descending`. Allowed members are `name`, `groupName`,
          `geoType`, `mapEnabled`.
        in: query
        schema:
          type: string
          format: sort-criteria
        example: name
      responses:
        "200":
          $ref: "#/components/responses/searchCollection"
  /searches/@sharedLibrary:
    get:
      operationId: getSharedSearches
      tags:
      - Search
      summary: Get all searches that have been shared with the authenticated user's
        groups
      description: >
        Returns all searches that have have been shared with groups that the current
        user is a member of. <br><br>
        <b>Authorization:</b> Authenticated user.
      parameters:
      - in: query
        name: start
        description: The start index.
        required: false
        schema:
          type: integer
        example: 0
      - in: query
        name: limit
        description: The number of searches to return.
        required: false
        schema:
          type: integer
        example: 10
      - name: filter
        description: An expression for filtering the collection. Valid expressions
          include eq(name,"test"). Allowed members are `name`, `groupName`, `geoType`,
          `mapEnabled`.
        in: query
        schema:
          type: string
          format: filter-criteria
        example: contains(name, car)
      - name: sortBy
        description: The criteria for sorting the searches. Valid sortBy parameters
          include `sortBy=name:descending`. Allowed members are `name`, `groupName`,
          `geoType`, `mapEnabled`.
        in: query
        schema:
          type: string
          format: sort-criteria
        example: name
      responses:
        "200":
          $ref: "#/components/responses/searchCollection"
  /searches/@searchGroups:
    get:
      operationId: getSearchGroups
      tags:
      - Search
      summary: Get a list of unique search groups
      description: >
        Returns a list of all the search groups that have been defined in the system.
        <br><br>
        <b>Authorization:</b> Authenticated user with the svi.solutions.sim.searches.admin
        capability.
      responses:
        "200":
          $ref: "#/components/responses/searchGroups"
        "403":
          $ref: "#/components/responses/searchErrorNoAdminCapability"
  /searches/@sharedSearchGroups:
    get:
      operationId: getSharedSearchGroups
      tags:
      - Search
      summary: Get a list of unique search groups that have been shared with the authenticated
        user
      description: >
        Returns a list of unique search groups of searches that have have been shared
        with groups that the current user is a member of. <br><br>
        <b>Authorization:</b> Authenticated user.
      responses:
        "200":
          $ref: "#/components/responses/searchGroups"
  /bookmarks:
    get:
      operationId: getBookmarks
      tags:
      - Bookmark
      summary: Return all bookmarks
      description: >
        Retrieves all bookmarks the user can access. <br><br>
        <b>Authorization:</b> Authenticated user.
      parameters:
      - in: query
        name: start
        description: The start index.
        required: false
        schema:
          type: integer
        example: 0
      - in: query
        name: limit
        description: The number of bookmarks to return.
        required: false
        schema:
          type: integer
        example: 10
      - name: filter
        description: An expression for filtering the collection. Valid expressions
          include eq(bookmarkName,"test"). Allowed members are `bookmarkName`, `documentType`,
          `groupName`.
        in: query
        schema:
          type: string
          format: filter-criteria
        example: eq(groupName,Important)
      - name: sortBy
        description: The criteria for sorting the collection. Valid sortBy parameters
          include `sortBy=bookmarkName:descending`. Allowed members are `bookmarkName`,
          `documentType`, `groupName`.
        in: query
        schema:
          type: string
          format: sort-criteria
        example: bookmarkName
      responses:
        "200":
          $ref: "#/components/responses/bookmarkCollection"
    post:
      operationId: createBookmark
      tags:
      - Bookmark
      summary: Create a new bookmark
      description: >
        Creates a new bookmark for the user. <br><br>
        Note that the bookmarkId property should be omitted during creation. <br><br>
        <b>Authorization:</b> Authenticated user.
      requestBody:
        $ref: "#/components/requestBodies/bookmark"
      responses:
        "201":
          $ref: "#/components/responses/bookmark"
        "400":
          $ref: "#/components/responses/bookmarkErrorBadData"
        "403":
          $ref: "#/components/responses/bookmarkErrorLimitReached"
        "409":
          $ref: "#/components/responses/bookmarkErrorConflict"
  /bookmarks/@groups:
    get:
      operationId: getBookmarkGroups
      tags:
      - Bookmark
      summary: Return all bookmark groups
      description: >
        Retrieves all bookmark groups the user has created. <br><br>
        <b>Authorization:</b> Authenticated user.
      responses:
        "200":
          $ref: "#/components/responses/bookmarkGroups"
    head:
      operationId: headersForBookmarkGroups
      tags:
      - Bookmark
      summary: Return all bookmark groups
      description: >
        Retrieves all bookmark groups the user has created. <br><br>
        <b>Authorization:</b> Authenticated user.
      responses:
        "200":
          $ref: "#/components/responses/bookmarkGroups"
    put:
      operationId: updateBookmarkGroup
      tags:
      - Bookmark
      summary: Update the bookmark group
      description: >
        Update a bookmark group identified by name. <br><br>
        The group name is the only attribute which can be updated. <br><br>
        <b>Authorization:</b> Authenticated user. Must own bookmark group.
      parameters:
      - in: query
        name: name
        required: true
        description: The unique identifier for the bookmark group.
        schema:
          type: string
        example: Briefings
      requestBody:
        $ref: "#/components/requestBodies/bookmarkGroup"
      responses:
        "200":
          $ref: "#/components/responses/bookmarkGroup"
        "400":
          $ref: "#/components/responses/bookmarkGroupErrorBadData"
        "404":
          $ref: "#/components/responses/bookmarkGroupErrorNotFound"
    delete:
      tags:
      - Bookmark
      summary: Delete bookmark group
      description: >
        Delete the bookmark group that is identified by name. <br><br>
        This also deletes the bookmarks within the group. <br><br>
        Authorization: Authenticated user. Must own bookmark group.
      operationId: deleteBookmarkGroup
      parameters:
      - in: query
        name: name
        required: true
        description: The unique identifier for the bookmark group.
        schema:
          type: string
        example: Briefings
      responses:
        "204":
          description: The operation was successful, nothing to return.
        "404":
          $ref: "#/components/responses/bookmarkGroupErrorNotFound"
  "/bookmarks/{bookmarkId}":
    get:
      operationId: getBookmark
      tags:
      - Bookmark
      summary: Return a bookmark
      description: >
        Retrieves a bookmark identified by bookmarkId. <br><br>
        <b>Authorization:</b> Authenticated user. Must own bookmark.
      parameters:
      - in: path
        name: bookmarkId
        description: The unique identifier for the bookmark.
        required: true
        schema:
          type: string
        example: aa4f502e-8e09-49c0-a24e-cefaf059b7bc
      responses:
        "200":
          $ref: "#/components/responses/bookmark"
        "404":
          $ref: "#/components/responses/bookmarkErrorNotFound"
    put:
      operationId: updateBookmark
      tags:
      - Bookmark
      summary: Update the bookmark
      description: >
        Update a bookmark identified by bookmarkId. <br><br>
        The bookmarkName and groupName are the  only attributes that can be updated.
        <br><br>
        <b>Authorization:</b> Authenticated user. Must own bookmark.
      parameters:
      - in: path
        name: bookmarkId
        required: true
        description: The unique identifier for the bookmark.
        schema:
          type: string
        example: aa4f502e-8e09-49c0-a24e-cefaf059b7bc
      requestBody:
        $ref: "#/components/requestBodies/bookmark"
      responses:
        "200":
          $ref: "#/components/responses/bookmark"
        "400":
          $ref: "#/components/responses/bookmarkErrorBadData"
        "404":
          $ref: "#/components/responses/bookmarkErrorNotFound"
    delete:
      tags:
      - Bookmark
      summary: Delete bookmark
      description: >
        Delete the bookmark that is identified by bookmarkId. <br><br>
        Authorization: Authenticated user. Must own bookmark.
      operationId: deleteBookmark
      parameters:
      - in: path
        name: bookmarkId
        required: true
        description: The unique identifier for the bookmark.
        schema:
          type: string
        example: aa4f502e-8e09-49c0-a24e-cefaf059b7bc
      responses:
        "204":
          description: The operation was successful, nothing to return.
        "404":
          $ref: "#/components/responses/bookmarkErrorNotFound"
    head:
      operationId: headersForBookmark
      tags:
      - Bookmark
      summary: Return a bookmark
      description: >
        Retrieves a bookmark identified by bookmarkId. <br><br>
        <b>Authorization:</b> Authenticated user. Must own bookmark. This is a HEAD
        operation.
      parameters:
      - in: path
        name: bookmarkId
        description: The unique identifier for the bookmark.
        required: true
        schema:
          type: string
        example: aa4f502e-8e09-49c0-a24e-cefaf059b7bc
      responses:
        "200":
          $ref: "#/components/responses/bookmark"
        "404":
          $ref: "#/components/responses/bookmarkErrorNotFound"
components:
  requestBodies:
    bookmark:
      description: The bookmark to be created or updated.
      required: true
      content:
        application/vnd.sas.sim.bookmarks.bookmark:
          schema:
            $ref: "#/components/schemas/bookmark"
          examples:
            standalone:
              $ref: "#/components/examples/bookmarkStandalone"
            grouped:
              $ref: "#/components/examples/bookmarkGrouped"
        application/json:
          schema:
            $ref: "#/components/schemas/bookmark"
          examples:
            standalone:
              $ref: "#/components/examples/bookmarkStandalone"
            grouped:
              $ref: "#/components/examples/bookmarkGrouped"
    bookmarkGroup:
      description: A bookmark group.
      content:
        application/vnd.sas.sim.bookmarks.group:
          schema:
            $ref: "#/components/schemas/bookmarkGroup"
          examples:
            bookmarkGroups:
              $ref: "#/components/examples/bookmarkGroup"
        application/json:
          schema:
            $ref: "#/components/schemas/bookmarkGroup"
          examples:
            bookmarkGroups:
              $ref: "#/components/examples/bookmarkGroup"
    search:
      description: The search to be created or edited.
      required: true
      content:
        application/vnd.sas.sim.searches.search:
          schema:
            $ref: "#/components/schemas/searchEnhanced"
          examples:
            searchBasic:
              $ref: "#/components/examples/searchBasic"
            searchGrouped:
              $ref: "#/components/examples/searchGrouped"
            searchShared:
              $ref: "#/components/examples/searchShared"
            searchRadius:
              $ref: "#/components/examples/searchRadius"
            searchShape:
              $ref: "#/components/examples/searchShape"
        application/json:
          schema:
            $ref: "#/components/schemas/searchEnhanced"
          examples:
            searchBasic:
              $ref: "#/components/examples/searchBasic"
            searchGrouped:
              $ref: "#/components/examples/searchGrouped"
            searchShared:
              $ref: "#/components/examples/searchShared"
            searchRadius:
              $ref: "#/components/examples/searchRadius"
            searchShape:
              $ref: "#/components/examples/searchShape"
  responses:
    apiRoot:
      description: API overview.
      content:
        application/vnd.sas.api+json:
          schema:
            $ref: "#/components/schemas/api"
          examples:
            apiRoot:
              $ref: "#/components/examples/apiRoot"
        application/json:
          schema:
            $ref: "#/components/schemas/api"
          examples:
            apiRoot:
              $ref: "#/components/examples/apiRoot"
    bookmark:
      description: A bookmark.
      content:
        application/vnd.sas.sim.bookmarks.bookmark:
          schema:
            $ref: "#/components/schemas/bookmark"
          examples:
            bookmarkStandalone:
              $ref: "#/components/examples/bookmarkStandalone"
            bookmarkGrouped:
              $ref: "#/components/examples/bookmarkGrouped"
        application/json:
          schema:
            $ref: "#/components/schemas/bookmark"
          examples:
            bookmarkStandalone:
              $ref: "#/components/examples/bookmarkStandalone"
            bookmarkGrouped:
              $ref: "#/components/examples/bookmarkGrouped"
    bookmarkGroup:
      description: A bookmark group.
      content:
        application/vnd.sas.sim.bookmarks.group:
          schema:
            $ref: "#/components/schemas/bookmarkGroup"
          examples:
            bookmarkGroups:
              $ref: "#/components/examples/bookmarkGroup"
        application/json:
          schema:
            $ref: "#/components/schemas/bookmarkGroup"
          examples:
            bookmarkGroups:
              $ref: "#/components/examples/bookmarkGroup"
    bookmarkGroups:
      description: A collection of bookmarks.
      content:
        application/vnd.sas.collection+json:
          schema:
            $ref: "#/components/schemas/bookmarkGroups"
          examples:
            bookmarkGroups:
              $ref: "#/components/examples/bookmarkGroups"
        application/json:
          schema:
            $ref: "#/components/schemas/bookmarkGroups"
          examples:
            bookmarkGroups:
              $ref: "#/components/examples/bookmarkGroups"
    bookmarkCollection:
      description: A collection of bookmarks.
      content:
        application/vnd.sas.collection+json:
          schema:
            $ref: "#/components/schemas/bookmarkCollection"
          examples:
            bookmarkCollection:
              $ref: "#/components/examples/bookmarkCollection"
        application/json:
          schema:
            $ref: "#/components/schemas/bookmarkCollection"
          examples:
            bookmarkCollection:
              $ref: "#/components/examples/bookmarkCollection"
    bookmarkGroupErrorBadData:
      description: Invalid data was provided.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            error:
              $ref: "#/components/examples/bookmarkGroupErrorBadData"
        application/json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            error:
              $ref: "#/components/examples/bookmarkGroupErrorBadData"
    bookmarkErrorBadData:
      description: Invalid data was provided.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            error:
              $ref: "#/components/examples/bookmarkErrorBadData"
        application/json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            error:
              $ref: "#/components/examples/bookmarkErrorBadData"
    bookmarkGroupErrorNotFound:
      description: The bookmark group could not be found.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            error:
              $ref: "#/components/examples/bookmarkGroupErrorNotFound"
        application/json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            error:
              $ref: "#/components/examples/bookmarkGroupErrorNotFound"
    bookmarkErrorNotFound:
      description: The bookmark could not be found.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            error:
              $ref: "#/components/examples/bookmarkErrorNotFound"
        application/json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            error:
              $ref: "#/components/examples/bookmarkErrorNotFound"
    bookmarkErrorConflict:
      description: The bookmark instance already exists.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            error:
              $ref: "#/components/examples/bookmarkErrorConflict"
        application/json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            error:
              $ref: "#/components/examples/bookmarkErrorConflict"
    bookmarkErrorLimitReached:
      description: User has reached their maximum limit of bookmarks.
      content:
