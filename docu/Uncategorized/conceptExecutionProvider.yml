        version: 4
        id: f9c3491e-3921-4530-9176-3a9b1c293438
        jobRequest:
          version: 3
          name: 'Analytics Flow for "SampleProject": "Pipeline 1"'
          jobDefinitionUri: /jobDefinitions/definitions/801d5009-3b33-41c1-b7e4-b33f77248ede
          jobDefinition:
            creationTimeStamp: '2019-12-05T21:22:04.852Z'
            modifiedTimeStamp: '2019-12-05T21:22:04.854Z'
            createdBy: sas.analyticsFlows
