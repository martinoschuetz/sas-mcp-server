          type: integer
          format: int64
          title: Max unique invalid dates
          description: If the number of unique invalid dates is less than or equal
            to this threshold, invalid dates are preserved in the output. This is
            useful for when a date column is not nullable and has invalid date values
            instead of nulls. If False, invalid dates will be ouptut as missing values
            in the synthetic data.
          default: 10
          nullable: true
      additionalProperties: false
      type: object
      title: DatetimeType
    IntType:
      properties:
        formula:
          anyOf:
          - $ref: "#/components/schemas/FormulaSetting"
          title: Formula config
          description: Takes a formula setting object to set how this field is calculated.
          nullable: true
        bound:
          anyOf:
          - $ref: "#/components/schemas/NumericBoundedSetting"
