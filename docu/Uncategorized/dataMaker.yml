        useDifferentialPrivacy:
          $ref: "#/components/schemas/UseDifferentialPrivacy"
        nParents:
          type: integer
          exclusiveMinimum: true
          minimum: 1
          format: int64
          title: Number of parents
          description: Number of parents per node to use in network building.
          default: 3
          nullable: true
      type: object
      title: PrivBayesConfig
