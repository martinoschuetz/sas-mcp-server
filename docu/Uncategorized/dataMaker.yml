          description: The type of post code to be generated.
    CustomAddressType:
      title: CustomAddressType
      description: Used to describe a column consisting of addresses in a format that
        combines other location types.
      properties:
        formatString:
          type: string
          title: Format string
          description: Format string used to create a custom address, for example
            the format string "{door}, {street}, {postcode}" would create an address
            with the specified format.
          nullable: true
    ColumnReference:
      properties:
        columnID:
          type: integer
          format: int64
      required:
      - columnID
      title: ColumnReference
    IDSamplerType:
      enum:
      - incremental
      - uuid
      - regex
      title: ID Sampler Type
      description: The format to use when sampling an ID.
    IncrementalIDSettings:
      properties:
        start:
          type: integer
          format: int64
          minimum: 0
          title: Start
          description: The number to start the sequence on, Must be a positive integer.
          default: 1
          nullable: true
        increment:
          type: integer
          format: int64
          minimum: 1
          title: Increment
          description: The increase between numbers in the sequence. Must be a positive
            integer
          default: 1
          nullable: true
        asStr:
          type: boolean
          title: As string?
          description: If True generated IDs are returned as strings
          default: false
          nullable: true
    RegexIdSettings:
      required:
      - pattern
      properties:
        pattern:
          type: string
          title: Pattern
          description: Regex pattern the id will conform to on generation. Escape
            special regex characters with a single backslash.
        unique:
          type: boolean
          title: Generate uniquely?
          description: When set to True the generated values will be unique. This
            is not guaranteed as the number of records generated could be greater
            than the possible amount of unique values.
          nullable: true
          default: true
        weightedSampling:
          type: boolean
          title: Weighted sampling
          description: Determines the sampling strategy when encountering alternations
            in provided regex patterns. If set to False (default), values will be
            randomly sampled from all branches without considering their likelihood
            due to cardinality. This leads to nearly equal sampling across each branch.
            If switched to True, the function will sample from each branch based on
            their cardinality, ensuring that choices with higher cardinality contribute
            more samples.
          nullable: true
          default: false
    FormulaSetting:
      properties:
        expression:
          type: string
          title: Expression
          description: "\nFormula to apply to the column.\n\nSome examples of valid\
            \ formulas are ``\"a + b + c\"`` or ``\"if(is_last(x), y, z)\"``. Note\
            \ \nthat the formula cannot contain static values such as integers or\
            \ strings. If this \nis required use a static value in the column map.\
            \ See :ref:`expression-syntax-reference-label` for available syntax and\
            \ examples.\n\n"
        columnMap:
          # how will this work? gonna just be dumped into the DB as a blob
          additionalProperties:
            anyOf:
            - $ref: "#/components/schemas/FormulaVariable"
          type: object
          title: Column map
          description: "\nA mapping between variables defined in the formula and the\
            \ columns of the \nprovided data.\n\nThe dictionary value can either be\
            \ an integer columnID, or\nanother dictionary specifying a constant value.\
            \ \n The dtype is a required parameter which is used to convert the provided\
            \ value into a datatype. The dtype can be \neither ``\"string\"``, ``\"\
            float\"``, ``\"integer\"``, ``\"boolean\"``, ``\"datetime\"`` or ``\"\
            timedelta\"``.\n\nWhen using \"timedelta\" in the ``column_map`` the following\
            \ units can be used in strings:\n\n- ``W``\n- ``D`` / ``days`` / ``day``\n\
            - ``hours`` / ``hour`` / ``hr`` / ``h``\n- ``m`` / ``minute`` / ``min``\
            \ / ``minutes`` / ``T``\n- ``S`` / ``seconds`` / ``sec`` / ``second``\n\
            - ``ms`` / ``milliseconds`` / ``millisecond`` / ``milli`` / ``millis``\
            \ / ``L``\n- ``us`` / ``microseconds`` / ``microsecond`` / ``micro`` /\
            \ ``micros`` / ``U``\n- ``ns`` / ``nanoseconds`` / ``nano`` / ``nanos``\
            \ / ``nanosecond`` / ``N``\n\nIt is recommended to use these in a comma\
            \ separated list. Some examples are:\n\n- ``30 days, 2 hours``\n- ``1W``\
            \ - i.e. 1 week\n- ``1 hour, 30 mins, 30 seconds``\n\nWhen using a \"\
            datetime\" value in the ``column_map`` it is recommended to use isoformat\
            \ following\n``YYYY-MM-DD[*HH[:MM[:SS[.fff[fff]]]][+HH:MM[:SS[.ffffff]]]]``\
            \ where * can match any single character.\n\nSome examples are:\n\n- ``2011-11-04``\n\
            - ``2011-11-04T00:05:23``\n- ``2011-11-04 00:05:23.283``\n- ``2011-11-04\
            \ 00:05:23.283+00:00``\n- ``2011-11-04T00:05:23+04:00``\n\n"
          default: {}
        modelError:
          type: boolean
          title: Model error?
          description: "\nWhen set to True the system examines the source data to\
            \ see if there\nis any difference between the result of the calculation\
            \ in the source data and the actual value seen in the\nsource data. If\
            \ there is a difference then this difference will be modelled\nand the\
            \ difference replicated in the synthetic data.\n\nAn example of where\
            \ this is useful is when looking at bank transactions where each transaction\n\
            row includes the account balance which is a sum of the transactions so\n\
            far plus a starting balance. In this case the error will be the starting\n\
            balance and so if this parameter is set to true then the synthetic data\
            \ will \nhave a similar distribution of starting balances. The system\
            \ will either model \nthe difference for each row, or if the error in\
            \ the source is constant for all \nthe records in a sequence then the\
            \ error added in the synthetic data will be \nconstant over the sequence.\n"
          default: false
      required:
      - expression
      additionalProperties: false
      type: object
      title: Formula setting
      description: This class is used to specify the formula that should be used to
        specify the data.
    NumericBoundedSetting:
      properties:
        upper:
          anyOf:
          - $ref: "#/components/schemas/NumericVariable"
          title: Upper numeric bound
          nullable: true
        lower:
          anyOf:
          - $ref: "#/components/schemas/NumericVariable"
          title: Lower numeric bound
          nullable: true
      additionalProperties: false
      type: object
      title: Numeric bounded setting
      description: Specify a lower and/or upper bound which can be a constant or a
