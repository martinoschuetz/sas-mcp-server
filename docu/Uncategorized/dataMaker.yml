          description: Name of the project.
        description:
          type: string
          description: Description of the project.
        modelCounts:
          allOf:
          - $ref: "#/components/schemas/projectModelCounts"
          description: Aggregate statistics of the status of models within a project
        lastCreatedModelId:
          type: integer
          format: int64
          description: ID of the last model created for the project
    projectModelCounts:
      type: object
      description: Aggregate statistics of the status of models within a project
      properties:
        total:
          type: integer
          format: int64
          description: Total number of models in the project
        uninitialised:
          type: integer
          format: int64
          description: Number of models uninitialised - data not yet selected
        analyseQueued:
          type: integer
          format: int64
          description: Number of models with a queued analysis task
        analysing:
          type: integer
          format: int64
          description: Number of models with an active analysis task
        analyseFailed:
          type: integer
          format: int64
          description: Number of models with a failed analysis task
        analyseKilled:
          type: integer
          format: int64
          description: Number of models with a stopped analysis task
        configuring:
          type: integer
          format: int64
          description: Number of models being configured
        trainingQueued:
          type: integer
          format: int64
          description: Number of models queued for training
        training:
          type: integer
          format: int64
          description: Number of models currently training
        trainingKilled:
          type: integer
          format: int64
          description: Number of models with a stopped training task
        trainingFailed:
          type: integer
          format: int64
          description: Number of models with a failed training task
        trained:
          type: integer
          format: int64
          description: Number of successfully trained models
    entity:
      type: object
      description: Data Maker entity representation
      properties:
        ID:
          type: integer
          format: int64
        tableID:
          type: integer
          format: int64
        entityType:
          $ref: "#/components/schemas/entityType"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/column"
          nullable: true
        settings:
          allOf:
          - $ref: "#/components/schemas/entitySettings"
          nullable: true
      required:
      - ID
      - tableID
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    ModelType:
      title: Model type
      description: Model types available for generating synthetic data.
      enum:
      - smote
      - priv_bayes
      - mst
      - private_evolution
    DensityDisclosureSettings:
      title: Density disclosure
      description: |
        Estimates the risk of an adversary constructing a mapping from the
        synthetic data points to the real data points (this concept can also be
        referred to as “reversibility”).
      allOf:
      - $ref: "#/components/schemas/BaseMetricSettings"
      properties:
        numRecords:
          type: integer
          format: int64
          title: Number of synthetic data records
          description: Number of synthetic data records to be sampled for computing
            the metric.
          exclusiveMinimum: true
          minimum: 0
          default: 10000
          nullable: true
    conditionUpdateRequest:
      type: object
      description: Representation used to update a Data Maker condition
      allOf:
      - $ref: "#/components/schemas/conditionBase"
      - type: object
        properties:
          conditionType:
            $ref: "#/components/schemas/conditionType"
          tableName:
            type: string
            description: Name of the target table
            nullable: true
          columnName:
            type: string
            description: Name of the target column
            nullable: true
          marginalDistribution:
            type: boolean
            description: Enable to sample from the marginal rather then a uniform
              distribution
            nullable: true
          settings:
            allOf:
            - $ref: "#/components/schemas/conditionSettings"
            nullable: true
    SmoteConfig:
      properties:
        kNeighbors:
          type: integer
          format: int64
          title: Number of neighbors
          description: Number of neighbors to use for interpolation of a new synthetic
            data point.
          default: 5
          minimum: 1
          nullable: true
        maxCat:
          $ref: "#/components/schemas/MaxCat"
      type: object
      title: SmoteConfig
    project:
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      type: object
      description: Data Maker project representation
      properties:
        id:
          type: integer
          format: int64
          description: ID of the project.
        name:
          type: string
          description: Name of the project.
        description:
          type: string
          description: Description of the project.
        connections:
          type: array
          description: List of connection ids for all tables in all models across
            the project.
          items:
            type: integer
            format: int64
        modelCollection:
          type: object
          description: A collection of Data Maker models on the project.
          allOf:
          - $ref: "#/components/schemas/modelCollection"
    connectionFilesCollection:
      allOf:
      - type: object
      properties:
        items:
          type: array
          description: An array that contains Data Maker connection file objects.
          items:
            $ref: "#/components/schemas/connectionFile"
      description: A collection of Data Maker connection file objects.
      type: object
    connectionFile:
      type: object
      description: a file that can be read from a connection.
      properties:
        name:
          description: The name of the file.
          type: string
        creationTime:
          description: The time the file was created.
          type: string
          format: date-time
        lastModified:
          description: The time the file was last modified.
          type: string
          format: date-time
        contentLength:
          description: The size of the file, in bytes.
          type: integer
          format: int64
        extension:
          allOf:
          - $ref: "#/components/schemas/InputFileExtension"
          readOnly: true
          nullable: true
    InputFileExtension:
      enum:
      - csv
      - csv.gz
      - parquet
      - avro
      - sas7bdat
      - sashdat
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    modelCreateRequest:
      type: object
      description: >
        Representation used to create a Data Maker model
      properties:
        name:
          description: Name of the model
          type: string
          nullable: true
    connectionTestRequest:
      type: object
      description: Representation used to test connection details
      properties:
        connectionSettings:
          allOf:
          - $ref: "#/components/schemas/connectionSettings"
    connectionUpdateRequest:
      type: object
      description: Representation used to update a Data Maker connection
      properties:
        connectionSettings:
          allOf:
          - $ref: "#/components/schemas/connectionSettings"
    MutualInformationSimilaritySettings:
      title: Mutual information similarity
      description: |
        Measures the similarity of the real and synthetic data from an
        information theoretical point of view.
      allOf:
      - $ref: "#/components/schemas/BaseMetricSettings"
    trackedResource:
      title: Tracked Resource
      description: This class is used to provide common attributes and behaviors around
        tracking who and when objects were created and modified to representation
        objects.
      properties:
        createdBy:
          type: string
          description: The username of whoever created the resource.
        modifiedBy:
          type: string
          description: The username of whoever last modified the resource.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the resource was created.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the resource was last modified.
    MetricType:
      enum:
      - mutual_information_similarity
      - histogram_similarity
      - presence_disclosure
      - density_disclosure
      - degree_distribution_similarity
      - cross_table_mutual_information_similarity
      - aggregated_sequential_histogram_similarity
      title: Metric type
      description: Metric types available for evaluating synthetic data.
    ValidationErrorTracker:
      type: object
      properties:
        columns:
          title: Column errors
          description: Errors mapped to specific columns.
          type: array
          items:
            $ref: "#/components/schemas/IDError"
        tables:
          title: Table errors
          description: Errors mapped to specific tables.
          type: array
          items:
            $ref: "#/components/schemas/IDError"
        entities:
          title: Entity errors
          description: Errors mapped to specific entities.
          type: array
          items:
            $ref: "#/components/schemas/IDError"
        modelParameters:
          title: Model parameter errors
          type: array
          items:
            type: string
        trainingConfig:
          title: Training configuration errors
          description: Errors mapped to overall training configuration.
          type: array
          items:
            type: string
        connection:
          title: Connection errors
          type: array
          items:
            type: string
      additionalProperties: false
      title: Error tracker
      description: Used to track errors throughout the configuration.
    IDError:
      title: ID mapped validation error
      description: Error mapping to an ID of a specific entity
      type: object
      properties:
        ID:
          type: integer
          format: int64
        errors:
          type: array
          items:
            type: string
    MetricsManifest:
      type: object
      properties:
        overallScores:
          description: Manifest containing top level scores and links to all metrics
            data
          type: object
          properties:
            histogramSimilarity:
              $ref: "#/components/schemas/OverallScoreSet"
            mutualInformationSimilarity:
              $ref: "#/components/schemas/OverallScoreSet"
            presenceDisclosure:
              $ref: "#/components/schemas/OverallScoreSet"
            densityDisclosure:
              $ref: "#/components/schemas/OverallScoreSet"
            degreeDistributionSimilarity:
              $ref: "#/components/schemas/OverallScoreSet"
            crossTableMutualInformationSimilarity:
              $ref: "#/components/schemas/OverallScoreSet"
            aggregatedSequentialHistogramSimilarity:
              $ref: "#/components/schemas/OverallScoreSet"
        charts:
          type: object
          properties:
            histogramSimilarity:
              type: array
              items:
                $ref: "#/components/schemas/ColumnChartLink"
            mutualInformationSimilarity:
              type: array
              items:
                $ref: "#/components/schemas/TableChartLink"
            degreeDistributionSimilarity:
              type: array
              items:
                $ref: "#/components/schemas/DegreeDistributionChartLink"
            crossTableMutualInformationSimilarity:
              type: array
              items:
                $ref: "#/components/schemas/ConnectionChartLink"
            aggregatedSequentialHistogramSimilarity:
              type: array
              items:
                $ref: "#/components/schemas/ColumnChartLink"
    OverallScoreSet:
      type: object
      allOf:
      - $ref: "#/components/schemas/MetricScore"
      properties:
        individualScores:
          type: array
          items:
            $ref: "#/components/schemas/SingleMetricScore"
    ColumnChartLink:
      type: object
      properties:
        score:
          type: number
          format: double
          nullable: true
        table:
          type: string
          description: Name of table
        column:
          type: string
          description: Name of column
        link:
          type: string
          description: Relative path to the chart for this column
    TableChartLink:
      type: object
      properties:
        score:
          type: number
          format: double
          nullable: true
        table:
          type: string
          description: Name of table
        link:
          type: string
          description: Relative path to the chart for this table
    DegreeDistributionChartLink:
      type: object
      properties:
        score:
          type: number
          format: double
          nullable: true
        link:
          type: string
          description: Relative path to the chart for this table
        topTable:
          type: string
        bottomTable:
          type: string
        topScore:
          type: number
          format: double
          nullable: true
        bottomScore:
          type: number
          format: double
          nullable: true
        joinTable:
          type: string
        inducedJoinTable:
          type: boolean
    ConnectionChartLink:
      type: object
      properties:
        score:
          type: number
          format: double
          nullable: true
        link:
          type: string
          description: Relative path to the chart for this table
        topTable:
          type: string
        bottomTable:
          type: string
    MetricScore:
      type: object
      properties:
        score:
          description: The score of the metric, a number between 0 and 1
          type: number
          format: double
          nullable: true
        bounds:
          description: The bounds of the metric, most metrics have a range between
            0 and 1.
          type: object
          properties:
            lower:
              type: number
              format: double
              nullable: true
            upper:
              type: number
              format: double
              nullable: true
        metricCategory:
          $ref: "#/components/schemas/MetricCategory"
    SingleMetricScore:
      type: object
      properties:
        name:
          type: string
          description: Name of the individual metric run, often a table name or connection
            name in the case of multitable
        score:
          description: The score of the metric, a number between 0 and 1
          type: number
          format: double
          nullable: true
    MetricCategory:
      enum:
      - similarity
      - utility
      - privacy

    entityCreateRequest:
      type: object
      description: Representation used to create a Data Maker entity.
      properties:
        columnID:
          type: integer
          format: int64
          description: The ID of the column to make an entity.
        entityType:
          $ref: "#/components/schemas/entityType"
      required:
      - columnID
      - entityType
    HistogramSimilaritySettings:
      title: Histogram similarity
      description: Measures the similarity of the marginal distributions in the real
        and synthetic data.
      allOf:
      - $ref: "#/components/schemas/BaseMetricSettings"
    ColumnRange:
      type: object
      required:
      - col
      - dtype
      properties:
        col:
          type: string
        dtype:
          $ref: "#/components/schemas/conditionType"
        has_nan:
          type: boolean
        categories:
          type: array
          uniqueItems: true
          items:
            description: Category value. Concrete type depends the underlying data
              type.
          description: Present when dtype is category
        aggregated:
          type: boolean
          description: Present when dtype is category
        lower:
          description: |
            Lower bound for the column range.
            For int: integer
            For float: number
            For date_time: ISO 8601 date-time string
            For time_delta: ISO 8601 duration string
        upper:
          description: |
            Upper bound for the column range.
            For int: integer
            For float: number
            For date_time: ISO 8601 date-time string
            For time_delta: ISO 8601 duration string
        marginal:
          type: object
          additionalProperties: true
          description: |
            Marginal information for the column.
            Expected shape depends on dtype:
            - category -> CategoricalMarginal
            - int -> IntMarginal
            - float -> FloatMarginal
            - date_time -> DatetimeMarginal
            - time_delta -> TimedeltaMarginal
    PrivateEvolutionConfig:
      type: object
      description: Tab-PE refines a single synthetic dataset by an evolutionary process
        that leverages APIs to generate variations of the data, privately evaluate
        them, and retain the highest-quality samples. This model produces the highest
        utility data for a given privacy budget. Other models outperform when privacy
        is not a concern. It can only be used for single table problems.
      properties:
        epsilon:
          title: Epsilon
          description: Privacy budget parameter. Use small values such as 0.01 for
            extremely high privacy guarantees, around 1-20 for standard privacy guarantees.
            20.0 is the maximum for this model type. Private evolution tends to produce
            data with high utility even at this setting.
          type: number
          exclusiveMinimum: true
          minimum: 0.0
          maximum: 20.0
          format: double
          nullable: true
          default: 10.0
        maxCat:
          $ref: "#/components/schemas/MaxCat"
        useDifferentialPrivacy:
          $ref: "#/components/schemas/UseDifferentialPrivacy"
        decayType:
          allOf:
          - $ref: "#/components/schemas/PrivateEvolutionDecayType"
          default: poly
        variationAPI:
          allOf:
          - $ref: "#/components/schemas/VariationAPIType"
          default: interpolation_and_weighted
    PrivateEvolutionDecayType:
      title: Private evolution decay type
      description: The random walk mutation rate decay method during the training
        process.
      enum:
      - linear
      - poly
    VariationAPIType:
      title: Variation API type
      description: The variation API takes public data and creates variations. Different
        methods explore the data domain in different ways.
      enum:
      - random_walk
      - reflected_random_walk
      - interpolation
      - interpolation_and_weighted
    entityCollection:
      type: object
      description: A collection of Data Maker entity objects.
      allOf:
      - type: object
        properties:
          items:
            type: array
            description: An array that contains Data Maker entity objects.
            items:
              $ref: "#/components/schemas/entity"
    personEntitySetting:
      properties:
        locales:
          type: array
          title: Locales
          description: Locales used for generating person components.
          items:
            type: object
            allOf:
            - $ref: "#/components/schemas/personLocale"
    personLocale:
