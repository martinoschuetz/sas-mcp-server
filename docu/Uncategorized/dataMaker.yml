      - de_DE
      - el_GR
      - en_GB
      - en_IE
      - en_NZ
      - en_US
      - es_CA
      - es_CL
      - es_CO
      - es_ES
      - et_EE
      - fa_IR
      - fi_FI
      - fr_CA
      - fr_CH
      - fr_FR
      - fr_QC
      - ga_IE
      - he_IL
      - hr_HR
      - hu_HU
      - hy_AM
      - id_ID
      - it_IT
      - ja_JP
      - ka_GE
      - ko_KR
      - ne_NP
      - nl_NL
      - no_NO
      - or_IN
      - pl_PL
      - pt_BR
