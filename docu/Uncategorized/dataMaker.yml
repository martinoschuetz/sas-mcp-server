          description: |
            The type of state to be generated.
            The "regular" option will generate state names while "code" will generate state codes.
    DistrictType:
      title: DistrictType
      description: Used for district location data.
      properties:
        type:
          anyOf:
          - $ref: "#/components/schemas/LocationTypes"
          title: District Type
          description: |
            The type of district to be generated.
            The "regular" option will generate district names while "code" will generate district codes.
    RegionType:
      title: RegionType
      description: Used for region location data.
      properties:
        type:
          anyOf:
          - $ref: "#/components/schemas/LocationTypes"
          title: Region Type
          description: |
            The type of region to be generated.
            The "regular" option will generate region names while "code" will generate region codes.
    CityType:
      title: CityType
      description: Used for city location data.
      properties:
        type:
          anyOf:
          - $ref: "#/components/schemas/LocationTypes"
          title: City Type
          description: |
            The type of city to be generated.
            The "regular" option will generate city names while "code" will generate city codes.
    PostcodeType:
      title: PostcodeType
      description: Used for postcode/zipcode data.
      properties:
        type:
          anyOf:
