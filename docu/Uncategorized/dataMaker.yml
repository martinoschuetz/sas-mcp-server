      additionalProperties: false
      type: object
      title: Integer type
    NameType:
      properties:
        type:
          anyOf:
          - $ref: "#/components/schemas/NameTypes"
          title: Name Type
          description: The type of name to be generated.
        formatString:
          type: string
          title: Format string
          description: 'Person format string used to create custom name types, for
            example the format string "{title} {first_name:.1} {last_name}" would
            create a custom name such as "Mr J Smith".Any of the following supported
            name details can be provided in the format string: [''first_name'', ''second_name'',
            ''third_name'', ''fourth_name'', ''fifth_name'', ''sixth_name'', ''last_name'',
            ''initials'', ''email'', ''full_name'', ''user_name'', ''gender'', ''title'',
            ''custom_columns''].'
          nullable: true
      required:
      - type
      additionalProperties: false
      type: object
      title: NameType
      description: |-
        Used to describe a column that contains names. These names can be of various types, such as
        first name, last name, full name, and even custom names that are combinations of other name types.

        An entity ID must be provided so that any data generated across the person entity remains coherent.
    GenderType:
      properties:
