components:
  requestBodies:
    patchTableProperties:
      content:
        application/vnd.sas.api+json:
          schema:
            allOf:
            - $ref: "#/components/schemas/patches"
    setTableProperties:
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/setTableProperties"
    setColumnProperties:
      content:
        application/vnd.sas.api+json:
          schema:
            allOf:
            - $ref: "#/components/schemas/columnProperties"
    patchColumnProperties:
      content:
        application/vnd.sas.api+json:
          schema:
            allOf:
            - $ref: "#/components/schemas/patches"
    modelCreate:
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/modelCreateRequest"
    modelFork:
      description: Data Maker model fork request.
      required: true
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/modelForkRequest"
    patchModelProperties:
      content:
        application/vnd.sas.api+json:
          schema:
            allOf:
            - $ref: "#/components/schemas/patches"
    projectCreate:
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/projectCreateRequest"
            required:
            - name
      description: Data Maker project create request.
      required: true
    projectUpdate:
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/projectUpdateRequest"
            required:
            - id
      description: Data Maker project update request. Only the name and description
        fields are updatable.
      required: true
    connectionCreate:
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/connectionCreateRequest"
            required:
            - name
      description: Data Maker connection create request.
      required: true
    connectionUpdate:
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/connectionUpdateRequest"
            required:
            - id
      description: Data Maker connection update request. Only the settings field is
        updateable.
      required: true
    connectionTest:
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/connectionTestRequest"
      description: Data Maker connection create request.
      required: true
    connectionFileUpload:
      content:
        multipart/form-data:
          schema:
            allOf:
            - $ref: "#/components/schemas/connectionFileUploadRequest"
      description: Data Maker connection create request.
      required: true
    entityCreate:
      description: Data Maker entity create request.
      required: true
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/entityCreateRequest"
    updateEntity:
      description: Data Maker entity update request.
      required: true
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/entityUpdateRequest"
    updateEntitySettings:
      description: Data Maker entity settings update request.
      required: true
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/patches"
    conditionCreate:
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/conditionCreateRequest"
            required:
            - name
      description: Data Maker condition create request.
      required: true
    conditionUpdate:
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/conditionUpdateRequest"
            required:
            - id
      description: Data Maker condition update request. Only the settings field is
        updateable.
      required: true
    generateTaskCreate:
      description: Create an analysis task.
      required: true
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/generateParams"
    taskUpdate:
      x-sas-internal: true
      description: Update the progress/result for a specific task.
      required: true
      content:
        application/json:
          schema:
            required:
            - taskID
            - state
            allOf:
            - $ref: "#/components/schemas/TaskResult"
    analysisCreate:
      description: Create an analysis task.
      required: true
      content:
        application/json:
          schema:
            allOf:
            - $ref: "#/components/schemas/analysisCreateRequest"
  responses:
    tablePropertiesUpdated: # 200
      description: The table properties were successfully updated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/table"
    entitySettingsUpdated: # 200
      description: The entity settings were successfully updated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/entity"
    columnPropertiesUpdated: # 200
      description: The column properties were successfully updated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/columnProperties"
    modelSettingsUpdated: # 200
      description: The model settings were successfully updated.
      headers:
        ETag:
          description: ETag for response.
          schema:
            type: string
      content:
        application/vnd.sas.data.maker.project+json:
          schema:
            $ref: "#/components/schemas/model"
        application/json:
          schema:
            $ref: "#/components/schemas/model"
    taskCollectionRetrieved: # 200
      description: The tasks were successfully retrieved.
      headers:
        ETag:
          description: ETag for response.
          schema:
            type: string
      content:
        application/vnd.sas.data.maker.project+json:
          schema:
            $ref: "#/components/schemas/taskCollection"
    taskCreated: # 201
      description: The task was successfully created.
      headers:
        ETag:
          description: ETag for response.
          schema:
            type: string
      content:
        application/vnd.sas.data.maker.project+json:
          schema:
            $ref: "#/components/schemas/Task"
    deleted: # 204
      description: The resource was successfully deleted.
    badRequest: # 400
      description: The request is invalid.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            default:
              $ref: "#/components/examples/errorResponse"
    badRequestNotGenerationTask: # 400
      description: The task with the specified ID is not a generation task.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
    notFound: # 404
      description: The requested resource does not exist or could not be found.
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            default:
              $ref: "#/components/examples/errorResponse"
  schemas:
    config:
      x-sas-internal: true
      type: object
      description: API Config.
      required:
      - auth
      - uploadAPIEnabled
      - uploadAPIMaxFileSize
      - SoftwareVersions
      - conditionalGenerationEnabled
      properties:
        auth:
          nullable: false
          allOf:
          - $ref: "#/components/schemas/AuthInfo"
        uploadAPIEnabled:
          nullable: false
          type: boolean
          default: false
        uploadAPIMaxFileSize:
          nullable: false
          type: integer
          format: int64
          default: 5242880
        SoftwareVersions:
          nullable: false
          allOf:
          - $ref: "#/components/schemas/SoftwareVersions"
        conditionalGenerationEnabled:
          nullable: false
          type: boolean
          default: false
    AuthInfo:
      x-sas-internal: true
      type: object
      description: Information to determine how to perform authentication/authorization
      properties:
        method:
          nullable: false
          allOf:
          - $ref: "#/components/schemas/authMethod"
        clientID:
          type: string
          nullable: false
        wellKnownOIDCConfig:
          type: string
          nullable: false
        redirectURI:
          nullable: false
          type: string
          default: ""
        audience:
          type: string
    authMethod:
      type: string
      enum:
      - auth0
      - keycloak-org
      description: Possible model state values.
    SoftwareVersions:
      x-sas-internal: true
      type: object
      description: Versions of deployable units
      properties:
        APIVersion:
          type: string
          nullable: false
        AppVersion:
          type: string
          nullable: false
        SynthVersion:
          type: string
          nullable: false
    tableCollection:
      type: object
      allOf:
      - type: object
        properties:
          items:
            type: array
            description: An array that contains Data Maker column objects.
            items:
              $ref: "#/components/schemas/table"
      description: A collection of Data Maker column objects
    columnCollection:
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: An array that contains Data Maker column objects.
            items:
              $ref: "#/components/schemas/column"
      description: A collection of Data Maker column objects
    taskCollection:
      type: object
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: An array that contains Data Maker task objects.
            items:
              $ref: "#/components/schemas/Task"
      description: A collection of Data Maker task objects
    modelCollection:
      type: object
      description: A collection of Data Maker model objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: An array that contains Data Maker model objects.
            items:
              $ref: "#/components/schemas/model"
    model:
      type: object
      description: Data Maker model
      properties:
        ID:
          type: integer
          format: int64
        metadata:
          allOf:
          - $ref: "#/components/schemas/modelMetadata"
          nullable: true
        modelSettings:
          allOf:
          - $ref: "#/components/schemas/modelSettings"
          nullable: true
        metricSettings:
          allOf:
          - type: array
            items:
              $ref: "#/components/schemas/metricSettings"
            nullable: true
        metricScores:
          allOf:
          - $ref: "#/components/schemas/metricScores"
          nullable: true
        validationErrors:
          allOf:
          - $ref: "#/components/schemas/ValidationErrorTracker"
    modelState:
      enum:
      - uninitialised
      - analyse_queued
      - analysing
      - analyse_failed
      - analyse_killed
      - configuring
      - training_queued
      - training
      - trained
      - training_killed
      - training_failed
      - error
      description: Possible model state values.
    modelMetadata:
      type: object
      description: Metadata of Data Maker model.
      allOf:
      - $ref: "#/components/schemas/trackedResource"
      properties:
        parentModelID:
          nullable: true
          type: integer
          format: int64
          description: ID of parent model if it exists.
        description:
          nullable: true
          type: string
          description: Description of Data Maker model.
          default: ""
        name:
          type: string
          description: Name of Data Maker model
          nullable: true
        projectID:
          nullable: true
          type: integer
          format: int64
          description: ID of the project
        state:
          nullable: true
          description: Current state of the given model.
          allOf:
          - $ref: "#/components/schemas/modelState"
        fileID:
          type: string
          description: ID of the file
    modelSettings:
      type: object
      description: Data Maker generator settings representation
      properties:
        randomState:
          type: integer
          format: int64
          title: Random seed for model
          description: Random seed for model
          nullable: true
        modelParameters:
          allOf:
          - $ref: "#/components/schemas/modelParameters"
          nullable: true
    metricSettings:
      type: object
      description: Metric setting for Data Maker model
      properties:
        metricType:
          $ref: "#/components/schemas/MetricType"
        mutualInformationSimilaritySettings:
          anyOf:
          - $ref: "#/components/schemas/MutualInformationSimilaritySettings"
          nullable: true
        histogramSimilaritySettings:
          anyOf:
          - $ref: "#/components/schemas/HistogramSimilaritySettings"
