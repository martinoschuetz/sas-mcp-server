            see https://strftime.org for format codes
          nullable: true
        formula:
          anyOf:
          - $ref: "#/components/schemas/FormulaSetting"
          title: Formula config
          description: Takes a formula setting object to set how this field is calculated.
          nullable: true
        bound:
          anyOf:
          - $ref: "#/components/schemas/DatetimeBoundedSetting"
          title: Datetime bounded setting
