---
openapi: 3.0.3
info:
  version: "1"
  title: Data Maker
  description: The Data Maker API is used to manage projects, connections, model settings,
    and data generation results.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: https://example.com/dataMaker
  description: This is an example base URL.
tags:
- name: Root
  description: Contains operations for the root resource of the Data Maker API.
- name: Projects
  description: |
    Contains operations for managing Data Maker projects.
    A project is an organizational unit allowing for governance, traceability, and version control for your synthetic data generation.
- name: Connections
  description: |
    Contains operations for managing Data Maker connections.
    A connection specifies input data sources or output destinations for generated synthetic data.
- name: Models
  description: |
    Contains operations for managing models within a Data Maker project.
    A model represents the generator type and settings to be used for training. Projects can consist of multiple iterations of a model.
- name: Tables
  description: Contains operations for managing tables within a Data Maker model.
- name: Entities
  description: Contains operations for managing entities within a Data Maker table.
- name: Columns
  description: Contains operations for managing columns within a Data Maker table.
- name: Tasks
  description: Contains operations for managing Data Maker tasks (i.e. analysis, training
    and generation).
- name: Health
  description: Operations for the health check resource.
- name: Config
  description: Operations for the resource configuration.
paths:
  /:
    get:
      summary: Get API resource links
      tags:
      - Root
      operationId: root
      description: Return the list of links to top-level resources and operations
        available from the root of the API.
      responses:
        "200":
          description: A collection of link objects was successfully retrieved.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/getDataMakerRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                default:
                  $ref: "#/components/examples/getDataMakerRootResponse"
          headers:
            Content-Type:
              schema:
                type: string
  /internal/health:
    get:
      summary: Check if the service is reachable
      tags:
      - Health
      operationId: getHealth
      x-sas-internal: true
      description: Returns a 200 status code if the service can be reached.
      responses:
        "200":
          description: The request was successfully processed.
  /internal/config:
    get:
      summary: Obtain service config
      tags:
      - Config
      operationId: getConfig
      x-sas-internal: true
      description: The api config
      responses:
        "200":
          description: The config was obtained successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/config"
  /tables/{tableID}:
    get:
      tags:
      - Tables
      operationId: getTable
      summary: Get table
      description: Retrieves the table that has the specified ID.
      parameters:
      - name: tableID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: The table was successfully retrieved.
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/table"
        "404":
          $ref: "#/components/responses/notFound"
    put:
      tags:
      - Tables
      operationId: setTableProperties
      summary: Update table properties
      description: Updates all properties for the specified table.
      parameters:
      - name: tableID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/setTableProperties"
      responses:
        "200":
          $ref: "#/components/responses/tablePropertiesUpdated"
    patch:
      tags:
      - Tables
      operationId: patchTableProperties
      summary: Update table properties
      description: Updates individual properties for the specified table by providing
        one or more attribute key-value pairs.
      parameters:
      - name: tableID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/patchTableProperties"
      responses:
        "200":
          $ref: "#/components/responses/tablePropertiesUpdated"
  /entities:
    post:
      operationId: createEntity
      tags:
      - Entities
      summary: Create entity
      description: Create an entity on a specific table.
      requestBody:
        $ref: "#/components/requestBodies/entityCreate"
      responses:
        "201":
          description: The entity was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/entity"
        "404":
          $ref: "#/components/responses/notFound"
        "400":
          $ref: "#/components/responses/badRequest"
  /entities/{entityID}:
    get:
      operationId: getEntity
      tags:
      - Entities
      summary: Get entity
      description: Returns the entity that has the specified ID.
      parameters:
      - name: entityID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: The entity was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/entity"
        "404":
          $ref: "#/components/responses/notFound"
    put:
      operationId: updateEntity
      tags:
      - Entities
      summary: Update entity
      description: Updates all settings for the entity. Can be used to add columns
        to the entity.
      parameters:
      - name: entityID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/updateEntity"
      responses:
        "200":
          description: The entity settings were successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/entity"
        "404":
          $ref: "#/components/responses/notFound"
        "400":
          $ref: "#/components/responses/badRequest"
    patch:
      operationId: updateEntitySettings
      tags:
      - Entities
      summary: Update entity
      description: Updates individual settings for the specified entity by providing
        one or more attribute key-value pairs.
      parameters:
      - name: entityID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/updateEntitySettings"
      responses:
        "200":
          description: The entity settings were successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/entity"
        "404":
          $ref: "#/components/responses/notFound"
        "400":
          $ref: "#/components/responses/badRequest"
  /columns/{columnID}:
    get:
      tags:
      - Columns
      operationId: getColumn
      summary: Get column
      description: Returns the column that has the specified ID.
      parameters:
      - name: columnID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: The column was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/column"
        "404":
          $ref: "#/components/responses/notFound"
    put:
      tags:
      - Columns
      operationId: setColumnProperties
      summary: Update column properties
      description: Updates all properties for the column.
      parameters:
      - name: columnID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/setColumnProperties"
      responses:
        "200":
          $ref: "#/components/responses/columnPropertiesUpdated"
    patch:
      tags:
      - Columns
      operationId: patchColumnProperties
      summary: Update column properties
      description: Updates individual properties for the specified column by providing
        one or more attribute key-value pairs.
      parameters:
      - name: columnID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/patchColumnProperties"
      responses:
        "200":
          $ref: "#/components/responses/columnPropertiesUpdated"
  /projects/{projectId}/models:
    get:
      tags:
      - Models
      operationId: getProjectModels
      summary: Get project models
      description: Retrieves the models belonging to the specified project.
      parameters:
      - name: projectId
        in: path
        description: The ID of the project for which models are requested.
        required: true
        schema:
          type: integer
          format: int64
      - name: start
        in: query
        description: The start index for pagination.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The limit parameter for pagination.
        schema:
          type: integer
          format: int64
          default: 10
      - name: sortBy
        in: query
        description: The criteria for sorting the collection. See [Sorting in REST
          APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The models were successfully retrieved.
          headers:
            ETag:
              description: ETag for response.
              schema:
                type: string
          content:
            application/vnd.sas.data.maker.project+json:
              schema:
                $ref: "#/components/schemas/modelCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/modelCollection"
        "400":
          $ref: "#/components/responses/badRequest"
    post:
      tags:
      - Models
      operationId: createProjectModel
      summary: Create model
      description: Creates a new model in the specified project.
      parameters:
      - name: projectId
        in: path
        description: The ID of the project for which models are requested.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/modelCreate"
      responses:
        "201":
          description: The model was created.
          content:
            application/vnd.sas.data.maker.project+json:
              schema:
                $ref: "#/components/schemas/model"
            application/json:
              schema:
                $ref: "#/components/schemas/model"
        "404":
          $ref: "#/components/responses/notFound"
  /models/{modelId}:
    get:
      tags:
      - Models
      operationId: getModelByID
      summary: Get model
      description: Retrieves the specified model.
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: The model was successfully retrieved.
          headers:
            ETag:
              description: ETag for response.
              schema:
                type: string
          content:
            application/vnd.sas.data.maker.project+json:
              schema:
                $ref: "#/components/schemas/model"
            application/json:
              schema:
                $ref: "#/components/schemas/model"
        "404":
          $ref: "#/components/responses/notFound"
    patch:
      operationId: patchModelProperties
      tags:
      - Models
      summary: Update model settings
      description: Updates individual settings for the specified model by providing
        one or more attribute key-value pairs.
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/patchModelProperties"
      responses:
        "200":
          $ref: "#/components/responses/modelSettingsUpdated"
        "400":
          $ref: "#/components/responses/badRequest"
    put:
      operationId: putModel
      tags:
      - Models
      summary: Update model settings
      description: Updates all settings for the specified model.
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/modelsUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/modelSettingsUpdated"
        "400":
          $ref: "#/components/responses/badRequest"
    delete:
      operationId: deleteModelByID
      tags:
      - Models
      summary: Delete model
      description: Deletes the specified model.
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          $ref: "#/components/responses/deleted"
        "400":
          $ref: "#/components/responses/badRequest"
  /models/{modelId}/fork:
    post:
      tags:
      - Models
      operationId: forkModel
      summary: Fork model
      description: Creates a fork of the model and all its dependencies.
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/modelFork"
      responses:
        "200":
          description: The model was forked.
          content:
            application/vnd.sas.data.maker.project+json:
              schema:
                $ref: "#/components/schemas/model"
            application/json:
              schema:
                $ref: "#/components/schemas/model"
        "400":
          $ref: "#/components/responses/badRequest"
        "404":
          $ref: "#/components/responses/notFound"
  /models/{modelId}/analyse:
    post:
      operationId: analyseModel
      tags:
      - Tasks
      summary: Create analysis job
      description: Creates a new analysis job.
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/analysisCreate"
      responses:
        "201":
          $ref: "#/components/responses/taskCreated"
        "404":
          $ref: "#/components/responses/notFound"
  /models/{modelId}/train:
    post:
      operationId: trainModel
      tags:
      - Tasks
      summary: Create training job
      description: Creates a new training job.
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "201":
          $ref: "#/components/responses/taskCreated"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          description: The model still has validation errors which must be resolved
            before training can take place.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/ExportErrorResponse"
  /models/{modelId}/generate:
    post:
      operationId: generateModel
      tags:
      - Tasks
      summary: Create generation job
      description: Creates a new generation job.
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/generateTaskCreate"
      responses:
        "201":
          $ref: "#/components/responses/taskCreated"
        "404":
          $ref: "#/components/responses/notFound"
  /models/{modelID}/jobs:
    get:
      operationId: getTasksForModel
      tags:
      - Tasks
      summary: Get model jobs
      description: Retrieves all jobs belonging to the specified model.
      parameters:
      - name: modelID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: start
        in: query
        description: The start index for pagination.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The limit parameter for pagination.
        schema:
          type: integer
          format: int64
          default: 10
      - name: type
        in: query
        description: Task type.
        schema:
          allOf:
          - $ref: "#/components/schemas/TaskType"
      responses:
        "200":
          $ref: "#/components/responses/taskCollectionRetrieved"
        "404":
          $ref: "#/components/responses/notFound"
  /jobs:
    get:
      operationId: listTasksMetadata
      tags:
      - Tasks
      summary: Get active/recent tasks
      description: Retrieves all currently active or recently completed jobs (<1hr
        ago).
      responses:
        "200":
          $ref: "#/components/responses/taskCollectionRetrieved"
  /jobs/{taskId}:
    get:
      operationId: getTaskMetadata
      tags:
      - Tasks
      summary: Get task metadata
      description: Retrieves metadata for the specified task. Does not include the
        task configuration or results.
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/notFound"
    delete:
      operationId: deleteTask
      tags:
      - Tasks
      summary: Delete task
      description: Deletes the specified task.
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "202":
          description: The request to delete has been accepted and is likely to succeed.
          headers:
            Content-Type:
              description: Type of returned content
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/taskDeleteResponse"
        "404":
          $ref: "#/components/responses/notFound"
  /jobs/{taskId}/config:
    get:
      # used internally when k8s init container fetches the config for synth to start
      x-sas-internal: true
      operationId: getTaskConfig
      tags:
      - Tasks
      summary: Get task configuration
      description: Retrieves the configuration for the specified task in JSON format.
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: The task config was fetched.
          headers:
            ETag:
              description: ETag for response.
              schema:
                type: string
          content:
            application/vnd.sas.data.maker.project+json:
              schema:
                $ref: "#/components/schemas/TaskConfig"
        "404":
          $ref: "#/components/responses/notFound"
  /jobs/{taskId}/result:
    get:
      operationId: getTaskResult
      tags:
      - Tasks
      summary: Get task progress/result
      description: Retrieve the progress and/or result for the specified task.
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: The task result/progress was fetched.
          headers:
            ETag:
              description: ETag for response.
              schema:
                type: string
          content:
            application/vnd.sas.data.maker.project+json:
              schema:
                $ref: "#/components/schemas/TaskResult"
        "404":
          $ref: "#/components/responses/notFound"
    post:
      # used internally by the synth to update a task by sending progress or a result
      # should never be called by the user directly
      x-sas-internal: true
      operationId: updateTask
      tags:
      - Tasks
      summary: Update task progress/result
      description: Update the progress/result for the specified task.
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        $ref: "#/components/requestBodies/taskUpdate"
      responses:
        "201":
          description: The task progress/result was successfully updated.
          headers:
            ETag:
              description: ETag for response.
              schema:
                type: string
          content:
            application/vnd.sas.data.maker.project+json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/notFound"
  /jobs/{taskId}/generated-data:
    get:
      operationId: viewGeneratedData
      tags:
      - Tasks
      summary: Get generation metadata
      description: Gets information about generated data files for each table in a
        generation run.
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Generated data information
          headers:
            ETag:
              description: ETag for response.
              schema:
                type: string
          content:
            application/vnd.sas.data.maker.project+json:
              schema:
                $ref: "#/components/schemas/taskViewGeneratedDataResponse"
        "400":
          $ref: "#/components/responses/badRequestNotGenerationTask"
        "404":
          $ref: "#/components/responses/notFound"
  /jobs/{taskId}/generated-data/download:
    get:
      operationId: downloadGeneratedData
      tags:
      - Tasks
      summary: Download generated data
      description: Download generated data for each table in a generation run.
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Generated Data download links
          headers:
            ETag:
              description: ETag for response.
              schema:
                type: string
          content:
            application/vnd.sas.data.maker.project+json:
              schema:
                $ref: "#/components/schemas/taskDownloadGeneratedDataResponse"
        "400":
          $ref: "#/components/responses/badRequestNotGenerationTask"
        "404":
          $ref: "#/components/responses/notFound"
  /models/{modelID}/tables:
    get:
      operationId: getTablesForModel
      tags:
      - Models
      summary: Get model tables
      description: Gets tables and high level column information relating to a model.
      parameters:
      - name: modelID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: sortBy
        in: query
        description: The criteria for sorting the collection. See [Sorting in REST
          APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The columns were fetched.
          headers:
            ETag:
              description: ETag for response.
              schema:
                type: string
          content:
            application/vnd.sas.data.maker.project+json:
              schema:
                $ref: "#/components/schemas/tableCollection"
  /models/{modelID}/columns:
    get:
      operationId: getColumnsForModel
      tags:
      - Models
      summary: Get columns relating to a model
      description: Get columns relating to a model
      parameters:
      - name: modelID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: start
        in: query
        description: The start index for pagination.
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        description: The limit parameter for pagination.
        schema:
          type: integer
          format: int64
          default: 10
      - name: sortBy
        in: query
        description: The criteria for sorting the collection. See [Sorting in REST
          APIs](https://developer.sas.com/docs/rest-apis/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The columns were fetched.
          headers:
            ETag:
              description: ETag for response.
              schema:
                type: string
          content:
            application/vnd.sas.data.maker.project+json:
              schema:
                $ref: "#/components/schemas/columnCollection"
  /models/{modelID}/entities:
    get:
      operationId: getEntitiesForModel
      tags:
      - Models
      summary: Get entities relating to a model
      description: Get entities relating to a model
      parameters:
      - name: modelID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: The entities on the model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/entityCollection"
        "404":
          $ref: "#/components/responses/notFound"
  /models/{modelID}/artifacts:
    get:
      x-sas-internal: true
      operationId: getArtifactsForModel
      tags:
      - Models
      summary: Get model artifacts
      description: Gets artifacts for the specified trained model.
      parameters:
      - name: modelID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Model artifacts retrieved succcessfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/modelArtifacts"
        "404":
          description: Requested model does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
  /models/{modelID}/metrics:
    get:
      operationId: getMetricsForModel
      tags:
      - Models
      summary: Get model metrics
      description: Retrieves metrics for the specified trained model.
      parameters:
      - name: modelID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Model metrics retrieved succcessfully.
          content:
            application/json:
              schema:
