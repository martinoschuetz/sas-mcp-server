    MSTConfig:
      type: object
      title: MSTConfig
      description: MST is an algorithm introduced in 2021 that relies on discretising
        the data and fitting a differentially private graphical model to low-dimensional
        marginals in order to allow for efficient data generation.
      properties:
        epsilon:
          $ref: "#/components/schemas/Epsilon"
        nBins:
          $ref: "#/components/schemas/NBins"
        maxCat:
          $ref: "#/components/schemas/MaxCat"
        useDifferentialPrivacy:
          $ref: "#/components/schemas/UseDifferentialPrivacy"
        delta:
          title: Delta
          description: Probability of information accidentally being leaked. Second
            Differential Privacy Parameter.
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          default: 1e-5
          nullable: true
        nIters:
          title: Number of iterations
          description: Number of training iterations.
          type: integer
          format: int64
          minimum: 0
          default: 1000
          nullable: true
        compressDomain:
          title: Compress domain
          description: When set to True the domain of the 1-way marginals is compressed
            according to the available privacy budget.
          type: boolean
          default: true
          nullable: true
    Epsilon:
      title: Epsilon
      description: Privacy budget parameter. Use small values such as 0.01 for extremely
        high privacy guarantees, around 1-25 for standard privacy guarantees and large
        values such as 10000 for low privacy but greater accuracy.
      type: number
      exclusiveMinimum: true
      minimum: 0.0
      format: double
      default: 1000
      nullable: true
    NBins:
      title: Number of bins
      description: The number of bins to use when discretizing numerical data.
      type: integer
      format: int64
      minimum: 1.0
      default: 100
      nullable: true
    MaxCat:
      title: Maximum categories
      description: Maximum amount of categorical information to preserve in each categorical
        column.
      type: integer
      minimum: 1.0
      format: int64
      default: 100
      nullable: true
    UseDifferentialPrivacy:
      type: boolean
      title: Use differential privacy
      description: Set to true to turn on differential privacy applying the epsilon
        privacy budget parameter.
      default: true
      nullable: true
    taskDownloadGeneratedDataResponse:
      type: object
      properties:
        tables:
          type: object
          description: Generated data for each table
          additionalProperties:
            $ref: "#/components/schemas/GeneratedDataDownloadLinks"
    GeneratedDataDownloadLinks:
      description: Download Links for generated data for a table in a generation run
      type: object
      properties:
        downloadURL:
          description: A Shared Access Signature download URL valid
          type: string
        downloadURLExpiry:
          description: The expiry time of the download url
          format: date-time
          type: string
    PresenceDisclosureSettings:
      title: Presence disclosure
      description: |
        Measures the certainty with which an adversary could infer whether
        an arbitrary data point was present in the real data used to train the
        synthetic data generator.
      allOf:
      - $ref: "#/components/schemas/BaseMetricSettings"
      properties:
        numRecords:
          type: integer
          format: int64
          title: Number of source data records
          description: Number of source data records to be sampled for computing the
            metric.
          exclusiveMinimum: true
          minimum: 0
          default: 1000
          nullable: true
        magnitude:
          type: number
          format: double
          title: Synthetic data magnitude
          description: Amount of synthetic data to be sampled for computing the metric.
          exclusiveMinimum: true
          minimum: 0
          default: 1
          nullable: true
        numIter:
          type: integer
          format: int64
          title: Number of scoring iterations
          description: Number of iterations to run when computing the metric.
          exclusiveMinimum: true
          minimum: 0
          default: 1
          nullable: true
    BaseMetricSettings:
      properties:
        table:
          type: string
          title: Name of table
          description: |
            The name of the table to compute the metric for.
            If null, the metric will be computed for all tables.
          nullable: true
    PrivBayesConfig:
      properties:
        nBins:
          $ref: "#/components/schemas/NBins"
