    PerfMetrics:
      description: Collects performance metrics for multiple events.
      type: object
      properties:
        name:
          description: Name of the performance metrics tracker.
          type: string
        logLevel:
          description: Global log level of the performance metrics tracker.
          type: object
          anyOf:
          - $ref: "#/components/schemas/PerfLogLevel"
          nullable: true
        events:
          description: Event performance metrics.
          type: array
          items:
            $ref: "#/components/schemas/PerfEvent"
    PerfLogLevel:
      description: Log level (corresponding to Python standard library logging levels).
      enum:
      - notset
      - debug
      - info
      - warning
      - error
      - critical
    PerfEvent:
      description: Stores runtime and memory metrics for a single event.
      type: object
      properties:
        runtime:
          description: Runtime measurement for the event.
          type: object
          allOf:
          - $ref: "#/components/schemas/PerfRuntime"
        memory:
          description: Memory measurement for the event.
          type: object
          allOf:
          - $ref: "#/components/schemas/PerfMemory"
        logLevel:
          description: Log level.
          type: object
          anyOf:
          - $ref: "#/components/schemas/PerfLogLevel"
          nullable: true
        state:
          description: State of the event.
          type: object
          allOf:
          - $ref: "#/components/schemas/PerfEventState"
        name:
          description: Name of the event.
          type: string
    PerfRuntime:
      description: Runtime measurement for an event.
      type: object
      properties:
        initial:
          description: Runtime measurement at the start of the event.
          type: object
          allOf:
          - $ref: "#/components/schemas/PerfRuntimeMeasurement"
        final:
          description: Runtime measurement at the end of the event.
          type: object
          anyOf:
          - $ref: "#/components/schemas/PerfRuntimeMeasurement"
          nullable: true
        totalSeconds:
          description: Duration of the event (in seconds).
          type: number
          format: double
          nullable: true
    PerfMemory:
      description: Memory measurement for an event.
      type: object
      properties:
        initial:
          description: Memory measurement at the start of the event.
          type: object
          allOf:
          - $ref: "#/components/schemas/PerfMemoryMeasurement"
        final:
          description: Memory measurement at the end of the event.
          type: object
          anyOf:
          - $ref: "#/components/schemas/PerfMemoryMeasurement"
          nullable: true
    PerfEventState:
      description: State of an event.
      enum:
      - started
      - finished
    PerfRuntimeMeasurement:
      description: Single runtime measurement.
      type: object
      properties:
        time:
          description: UTC timestamp.
          type: string
        epoch:
          description: Time elapsed since the UNIX epoch (in seconds).
          type: number
          format: double
    PerfMemoryMeasurement:
      description: Single memory measurement.
      type: object
      properties:
        peakBytes:
          description: Peak memory, measured as max RSS (in bytes).
          type: integer
          format: int64
        instBytes:
          description: Instantaneous memory, measured as current RSS (in bytes).
          type: integer
          format: int64
    TrainingResult:
      type: object
      properties:
        metricsManifest:
          allOf:
          - $ref: "#/components/schemas/MetricsManifest"
          nullable: true
        dataRanges:
          allOf:
          - $ref: "#/components/schemas/DataRanges"
          nullable: true
    generateParams:
      description: Parameters for generating data.
      type: object
      properties:
        magnitude:
          description: Magnitude of the data to generate. 1 will match the original
            data size. While 2 means twice as much as the original training data.
            This has the lowest precedence.
          type: number
          format: double
          default: 1.0
          nullable: true
        numRecords:
          type: integer
          format: int64
          title: Number of records
          description: Number of records to generate can only be used with a single
            table. This takes precedence over magnitude if both supplied.
          nullable: true
        tableNumRecords:
          allOf:
          - $ref: "#/components/schemas/tableNumRecords"
          nullable: true
        randomState:
          type: integer
          format: int64
          title: Random seed for model
          description: Random seed for model
          nullable: true
        connectionID:
          type: integer
          format: int64
          title: Connection ID
          description: Unique identifier of the connection to generate data for.
        fileExtension:
          title: File extension
          description: File extension of the generated data.
          allOf:
          - $ref: "#/components/schemas/OutputFileExtension"
        relPath:
          type: string
          title: Relative path
          description: Relative path to store the generated data in the connection.
            If this is not supplied a random UUID will be used.
          nullable: true
        conditionalGenerationIDs:
          title: Conditions for generation
          description: List of conditions to apply to the generation.
          type: array
          items:
            type: integer
            format: int64
      required:
      - connectionID
    tableNumRecords:
      type: object
      description: Number of records to generate for a specific table. This takes
        precedence.
      properties:
        table:
          type: string
          description: Table name
        numRecords:
          type: integer
          format: int64
          title: Number of records
          description: Number of records to generate for the table.
    analysisCreateRequest:
      description: Create an analysis task.
      type: object
      required:
      - connectionID
      - tables
      properties:
        connectionID:
          title: Connection ID
          description: Unique identifier of the connection to analyse.
          type: integer
          format: int64
        tables:
          title: Table paths
          description: Relative paths representing tables from the connection to analyse.
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
    ColumnSummary:
      description: Summary statistics and examples for a column.
      type: object
      properties:
        stats:
          description: Summary statistics.
          type: object
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/ColumnStats"
        examples:
          description: Sample data.
          type: array
          items:
            type: string
          nullable: true
    ColumnStats:
      description: Summary statistics and examples for a column.
      type: object
      properties:
        nullCount:
          description: Number of null values.
          type: integer
          format: int64
          nullable: true
        cardinality:
          description: Number of unique values.
          type: integer
          format: int64
          nullable: true
        min:
          description: Minimum value for numeric columns.
          type: string
          nullable: true
        max:
          description: Maximum value for numeric columns.
          type: string
          nullable: true
        median:
          description: Median value for numeric columns.
          type: string
          nullable: true
        mean:
          description: Mean value for numeric columns.
          type: string
          nullable: true
    GenerationResult:
      description: Generation result.
      type: object
      properties:
        validationResult:
          anyOf:
          - $ref: "#/components/schemas/ValidationResult"
          nullable: true
        stats:
          anyOf:
          - $ref: "#/components/schemas/SynthDataStats"
          nullable: true
    ValidationResult:
      description: Validation result.
      type: object
      properties:
        rowCountValidator:
          anyOf:
          - $ref: "#/components/schemas/RowCountValidator"
    SynthDataStats:
      type: object
      properties:
        tables:
          type: array
          items:
            type: object
            anyOf:
            - $ref: "#/components/schemas/SynthDataStatsTable"
    SynthDataStatsTable:
      type: object
      properties:
        name:
          type: string
        numRows:
          type: integer
          format: int64
          description: Number of rows in synthetic table.
        columns:
          type: array
          items:
            anyOf:
            - $ref: "#/components/schemas/SynthDataStatsColumn"
    SynthDataStatsColumn:
      type: object
      properties:
        name:
          type: string
        histogram:
          anyOf:
          - $ref: "#/components/schemas/SynthDataStatsHist"
          nullable: true
        dtype:
          type: string
          nullable: true
        rawDType:
          type: string
          nullable: true
        entityGroup:
          type: string
          nullable: true
        samples:
          type: array
          items:
            type: string
        cardinality:
          type: integer
          format: int64
          nullable: true
        nullCount:
          type: integer
          format: int64
          nullable: true
        primaryKey:
          type: boolean
        foreignKeyRef:
          type: object
          anyOf:
          - $ref: "#/components/schemas/ColId"
          nullable: true
        datetimeFormat:
          type: string
          nullable: true
    ColId:
      description: Column identifier
      type: object
      properties:
        col:
          description: Column to be targeted.
          type: string
        table:
          description: Table to be targeted.
          type: string
    locationEntitySetting:
      properties:
        locales:
          type: array
          title: Locales
          description: Locales used for generating location components.
          items:
            type: object
            allOf:
            - $ref: "#/components/schemas/geoLocale"
        mismatch:
          type: object
          title: Location mismatch
          description: Method of handling generated data that does not match predetermined
            clusters.
          allOf:
          - $ref: "#/components/schemas/locationTypeMismatch"
        numClusters:
          type: integer
          format: int64
          title: Number of clusters
          description: Number of clusters for geographic grouping of training data.
        territoryModelling:
          type: object
          title: Territory modelling
          description: Modelling strategy for low specificity locations such as country,
            district and state.
          allOf:
          - $ref: "#/components/schemas/locationTerritoryModellingType"
    geoLocale:
      type: string
      enum:
      - en_GB
      - en_US
      - en_CA
      - en_AU
      - en_IE
      - es_ES
      - fr_FR
      - da_DK
      - de_DE
      - sv_SE
      - no_NO
      - fi_FI
      - cs_CZ
    locationTypeMismatch:
      type: string
      enum:
      - random
      - drop
      - approximate
    locationTerritoryModellingType:
      type: string
      enum:
      - combination
      - asset_sampling
    accessControl:
      type: object
      properties:
        mutable:
          description: Whether the connection can be modified by the calling user
          type: boolean
      required:
      - mutable
    AnalysisResult:
      description: Results of an analysis task.
      type: object
      properties:
        tables:
          description: Analysis results for each table.
          type: array
          items:
            $ref: "#/components/schemas/TableAnalysisResult"
        failures:
          description: Names of tables which resulted in errors during analysis.
          type: array
          items:
            type: string
    TableAnalysisResult:
      description: Results of analysis on a single table.
      type: object
      properties:
        tableID:
          description: Unique identifier of the table.
          type: integer
          format: int64
          nullable: true
        tableName:
          description: Name of the table.
          type: string
        columns:
          description: Analysis results for each column in a table.
          type: array
          items:
            $ref: "#/components/schemas/ColumnAnalysisResult"
        entities:
          description: Table entities.
          type: array
          items:
            $ref: "#/components/schemas/EntityAnalysisResult"
        error:
          description: Any error that occurred while analysing a table.
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/AnalysisError"
        sizeBytes:
          description: Size of an analysed table in bytes.
          type: integer
          format: int64
        numRows:
          description: Number of rows in an analysed table.
          type: integer
          format: int64
        tableKeysAnalysisResult:
          description: Analysis results for primary, foreign and composite key relationships
            for a table.
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/TableKeysAnalysisResult"
        connection:
          description: Connection ID.
          type: string
        relPath:
          description: Relative path to the table.
          type: string
    ColumnAnalysisResult:
      description: Results of analysis on a single column within a table.
      type: object
      properties:
        columnID:
          description: Unique identifier of the column.
          type: integer
          format: int64
          nullable: true
        column:
          description: Name of the column.
          type: string
        description:
          description: Description of the column.
          type: string
          nullable: true
        rawDataType:
          description: Raw data type of the column.
          type: string
          nullable: true
        properties:
          description: Column properties.
          type: object
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/columnProperties"
        columnSummary:
          description: Column statistics and examples.
          type: object
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/ColumnSummary"
    EntityAnalysisResult:
      description: Results of analysis for a single entity.
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        entitySettings:
          type: object
          anyOf:
          - $ref: "#/components/schemas/entitySettings"
          nullable: true
    AnalysisError:
      description: Any error that arose during analysis.
      type: object
      properties:
        msg:
          description: Error message.
          type: string
    TableKeysAnalysisResult:
      description: Results of analysis on the primary, foreign and composite key relationships
        between tables.
      type: object
      properties:
        primaryKey:
          description: Primary key column for the table.
          type: object
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/PrimaryKey"
        compositeKey:
          description: Composite key for the table.
          type: object
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/CompositeKey"
        foreignKeys:
          description: Foreign key columns for the table.
          type: array
          items:
            type: object
            allOf:
            - $ref: "#/components/schemas/ForeignKey"
    PrimaryKey:
      description: Primary key.
      type: object
      properties:
        cid:
          description: Column identifier.
          type: object
          allOf:
          - $ref: "#/components/schemas/ColId"
    CompositeKey:
      description: Composite key.
      type: object
      properties:
        cids:
          description: Composite key identifiers.
          type: array
          minItems: 2
          items:
            type: object
            allOf:
            - $ref: "#/components/schemas/ColId"
    ForeignKey:
      description: Foreign key.
      type: object
      properties:
        cid:
          description: Column identifier.
          type: object
          allOf:
          - $ref: "#/components/schemas/ColId"
        columnTo:
          description: Column that the foreign key points at.
          type: object
          allOf:
          - $ref: "#/components/schemas/ColId"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    DataRanges:
      type: object
      required:
      - tables
      properties:
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableRange"
    TableRange:
      type: object
      required:
      - table
      - columns
      properties:
        table:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnRange"
    SynthDataStatsHist:
      type: object
      properties:
        counts:
          type: array
          items:
            type: integer
            format: int64
        labels:
          type: array
          items:
            type: string
    OutputFileExtension:
      enum:
      - csv
      - csv.gz
      - parquet
      - avro
      - sas7bdat
    RowCountValidator:
      description: Row count validator.
      type: object
      properties:
        score:
          allOf:
          - $ref: "#/components/schemas/ValidationScore"
        tables:
          type: array
          description: Validation row counts for each table.
          items:
            $ref: "#/components/schemas/TableRowCountValidator"
    ValidationScore:
      enum:
      - pass
      - warn
      - fail
    TableRowCountValidator:
      type: object
      properties:
        table:
          type: string
          title: Table name
        sourceRows:
          type: number
          format: int64
        syntheticRows:
          type: number
          format: int64
        expectedSyntheticRows:
          type: number
          format: int64
  examples:
    errorResponse:
      summary: Error Response
      description: >
        This example shows the error response
        returned when the Data Maker API encounters an error.
      value: {"message": "An error has occurred", "remediation": "Do this to fix the\
          \ error", "errorCode": 12345, "errors": [], "links": [], "version": 2}
    getDataMakerRootResponse:
      summary: Get the root level links for Data Maker
      description: This is an example GET response to retrieve the Data Maker root
        level links.
      value: {"version": 1, "links": []}
