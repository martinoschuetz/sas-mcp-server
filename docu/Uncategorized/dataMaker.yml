          title: Gender map
          description: Mapping of gender categories. Each gender category should be
            a key in the dictionary with the values being one from a selection of
            'm', 'f', 'o', which correspond to male, female and other.
          nullable: true
      additionalProperties: false
      type: object
      title: GenderType
      description: Used to handle gender information in a structured and consistent
        manner.
    TimedeltaType:
