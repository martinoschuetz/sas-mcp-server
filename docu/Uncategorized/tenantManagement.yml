components:
  schemas:
    error:
      description: Standard error response envelope used by all error responses.
      type: object
      required:
      - version
      - httpStatusCode
      - errorCode
      - message
      properties:
        version:
          type: string
          description: Version of the error envelope format.
        httpStatusCode:
          type: integer
          description: HTTP status code.
        errorCode:
          type: integer
          description: Application-specific error code.
        message:
          type: string
          description: Human-readable error description.
        details:
          type: object
          description: Additional contextual details, such as `path` and `correlator`.
    tenant:
      description: Represents a tenant in the system.
      x-state-transitions:
        created: [provisioning]
        provisioning: [provisioned, provisioningFailed]
        provisioned: [onboarding]
        provisioningFailed: [provisioning]
        onboarding: [onboarded, onboardingFailed]
        onboarded: [activating, offboarding]
        onboardingFailed: [onboarding, offboarding]
        activating: [active, activatingFailed]
        active: [suspending]
        activatingFailed: [activating, offboarding]
        suspending: [suspended, suspendingFailed]
        suspended: [activating, offboarding]
        suspendingFailed: [suspending, offboarding]
        offboarding: [offboarded, offboardingFailed]
        offboarded: [onboarding]
        offboardingFailed: [offboarding]
      type: object
      required:
      - id
      - shortName
      - displayName
      - dataPlaneIngress
      - administratorEmails
      - createdTimestamp
      - modifiedTimestamp
      - createdBy
      - modifiedBy
      properties:
        id:
          type: string
          description: |
            System generated UUID.
            Cannot be updated once created.
          readOnly: true
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          example: b344ae2b-fd43-4627-8f6a-2c98707ebc82
        shortName:
          type: string
          description: |
            Short, human readable name.
            Cannot be updated once created.
          readOnly: true
          minLength: 3
          maxLength: 40
          pattern: "^[a-z][0-9a-z-]{1,38}[0-9a-z]$"
          example: sas
        displayName:
          type: string
          description: Full or legal company name
          maxLength: 250
          example: SAS Institute
        description:
          type: string
          description: Human readable description of the tenant
          maxLength: 1000
          example: SAS Institute tenant for internal use.
        identityProviderId:
          type: string
          description: Identity provider ID.
          example: 123e4567-e89b-12d3-a456-426655440000
        dataPlaneIngress:
          type: string
          description: |
            Host name for ingress in the tenant's data plane. Must be a valid DNS subdomain (RFC 1123), e.g., the host of the ingress resource.
            Can only be updated when tenant is in created, provisioning, provisioned, or onboardingFailed states.
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$'
          minLength: 3
          maxLength: 253
          example: tenant1-ingress.example.com
        administratorEmails:
          type: array
          description: |
            List of administrator email addresses for the tenant.
            Cannot be updated once created.
          readOnly: true
          minItems: 1
          items:
            type: string
            format: email
            description: Administrator email address
          example: ["admin1@example.com", "admin2@example.com"]
        properties:
          type: object
          description: A container for key-value pairs. Can be used to store additional
            information about the tenant in a structured format. Keys cannot be changed
            once created, but values can be updated.
          properties:
            key:
              type: string
              maxLength: 100
              description: The key name.
            value:
              type: string
              description: The value associated with the key. Format of this string
                is not defined here and is up to the client and server to coordinate.
          example:
            SmartID: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        createdTimestamp:
          type: string
          format: date-time
          description: |
            Timestamp when the tenant was created.
            Cannot be updated once created.
          readOnly: true
          example: "2023-08-29T10:30:00Z"
        modifiedTimestamp:
          type: string
          format: date-time
          description: Timestamp when the tenant was last modified
          readOnly: true
          example: "2023-08-29T14:45:00Z"
        createdBy:
          type: string
          description: |
            User or system that created the tenant.
            Cannot be updated once created.
          readOnly: true
          example: "system-admin@example.com"
        modifiedBy:
          type: string
          description: User or system that last modified the tenant
          readOnly: true
          example: "tenant-admin@example.com"
        desiredState:
          type: string
          description: |
            Desired state of the tenant.
            Allowed transitions are restricted by the current state.
            See x-state-transitions for details.
          enum: [created, provisioned, onboarded, active, suspended, offboarded]
        currentState:
          type: string
          description: |
            Current state of the tenant (optional).
            Allowed transitions are restricted by the previous state.
            See x-state-transitions for details.
          enum:
          - created
          - provisioning
          - provisioned
          - provisioningFailed
          - onboarding
          - onboarded
          - onboardingFailed
          - activating
          - active
          - activatingFailed
          - suspending
          - suspended
          - suspendingFailed
          - offboarding
          - offboarded
          - offboardingFailed
        stateProgress:
          type: object
          description: |
            Progress information for services that are not in the desired state.
            Only populated for desired states that services participate in (onboarded, offboarded).
            Only populated when tenant desiredState is not equal to tenant currentState.
            Contains a map of service names to their current state and failure details.
            Only services with serviceState not equal to the tenant's desiredState are included.
          readOnly: true
          additionalProperties:
            type: object
            properties:
              serviceState:
                type: string
                description: Current state of the service
                enum:
                - onboarding
                - onboarded
                - onboardingFailed
                - offboarding
                - offboarded
                - offboardingFailed
              failureDetails:
                type: string
                description: Description of failure cause when service is in a failed
                  state
          example:
            sas-logon:
              serviceState: onboardingFailed
              failureDetails: "Database connection timeout during service initialization"
            sas-backup-agent:
              serviceState: onboarding
