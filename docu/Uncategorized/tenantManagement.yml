---
openapi: 3.0.3
info:
  title: Tenant Management
  description: API for managing tenants in a multi-tenant SAS Viya deployment. Follows
    SaaS API standards.
  version: "1"
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: https://developer.sas.com
  license:
    name: SAS Institute Inc.
    url: https://support.sas.com/techsup/license/index.html
servers:
- url: https://example.com/tenantManagement/v1
  description: Example root context.
tags:
- name: Tenants
  description: Operations related to tenants.
paths:
  /:
    get:
      operationId: root
      summary: API root resource
      description: Returns basic API information.
      tags:
      - Tenants
      responses:
        "200":
          description: API root
          headers:
            Cache-Control:
              description: Caching policies for the response.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
              example:
                name: TenantManagement
                version: "1"
  /tenants:
    get:
      operationId: getTenants
      summary: List tenants
      description: |
        Returns a list of current tenants, with optional filtering and pagination.

        Filtering is supported on all scalar attributes of the tenant resource:
        id, shortName, displayName, description, desiredState, and currentState.
      tags:
      - Tenants
      parameters:
      - name: filter
        in: query
        description: Optional filter expression for advanced filtering. This is in
          addition to the explicit scalar attribute filters.
        schema:
          type: string
      - name: id
        in: query
        description: Filter by tenant id (UUID).
        schema:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      - name: shortName
        in: query
        description: Filter by tenant short name.
        schema:
          type: string
      - name: displayName
        in: query
        description: Filter by tenant display name.
        schema:
          type: string
      - name: description
        in: query
        description: Filter by tenant description.
        schema:
          type: string
      - name: desiredState
        in: query
        description: Filter by desired state.
        schema:
          type: string
          enum: [created, provisioned, onboarded, active, suspended, offboarded]
      - name: currentState
        in: query
        description: Filter by current state.
        schema:
          type: string
          enum:
          - created
          - provisioning
          - provisioned
          - provisioningFailed
          - onboarding
          - onboarded
          - onboardingFailed
          - activating
          - active
          - activatingFailed
          - suspending
          - suspended
          - suspendingFailed
          - offboarding
          - offboarded
          - offboardingFailed
      - name: start
        in: query
        description: Zero-based index of the first item to return (pagination).
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        description: Maximum number of items to return (pagination).
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 10
      - name: If-None-Match
        in: header
        description: Return the resource only if the ETag does not match.
        required: false
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        description: Return the resource only if it has been modified since the specified
          date/time.
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: List of tenants
          headers:
            Cache-Control:
              description: Caching policies for the response.
              schema:
                type: string
          content:
