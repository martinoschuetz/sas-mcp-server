          type: string
          format: uri-reference
          description: The URI for the link.
    stateTransitionStep:
      description: Represents a single step within a state transition.
      type: object
      required:
      - id
      - name
      - state
      - creationTimestamp
      - modifiedTimestamp
      - stateTransitionId
      properties:
        id:
          type: string
          description: System generated UUID for the step.
          readOnly: true
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          example: f2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
        name:
          type: string
          description: Name of the step.
          example: Create Identity Zone
        state:
          type: string
          description: Current state of the step.
          enum: [pending, running, success, failed]
          example: success
        failureDetails:
          type: string
          description: Description of failure cause when step is in a failed state.
          example: Encryption key unavailable in secrets vault
        creationTimestamp:
          type: string
          format: date-time
          description: Timestamp when the step was created.
          readOnly: true
          example: "2026-02-02T12:00:30Z"
        modifiedTimestamp:
          type: string
          format: date-time
          description: Timestamp when the step was last modified.
          readOnly: true
          example: "2026-02-02T12:05:30Z"
        stateTransitionId:
          type: string
          description: UUID of the state transition this step belongs to.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
    stateTransitionStepCollection:
      description: Schema for a paginated collection of state transition steps.
      type: object
      properties:
        count:
          type: integer
          description: Total number of items available across all pages.
        items:
          type: array
          description: The list of state transition steps returned in this page.
          items:
            $ref: "#/components/schemas/stateTransitionStep"
        links:
          type: array
          description: Hypermedia pagination links.
          items:
            $ref: "#/components/schemas/collectionLink"
    stateTransitionCollection:
      description: A paginated collection of tenant state transitions.
      type: object
      properties:
        items:
          type: array
          description: The list of state transitions.
          items:
            $ref: "#/components/schemas/stateTransition"
        links:
          type: array
          description: Hypermedia pagination links.
          items:
            $ref: "#/components/schemas/collectionLink"
    stateTransition:
      description: Represents a single tenant state transition event.
      type: object
      required:
      - id
      - targetState
      - triggeredAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this state transition event.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        sourceState:
          type: string
          description: The previous state of the tenant. Null for initial creation.
          nullable: true
          enum: [null, onboarded, onboardingFailed, active, activatingFailed, suspended,
            suspendingFailed, offboarded, offboardingFailed]
        targetState:
          type: string
          description: The requested steady target state for this transition attempt.
          enum: [onboarded, active, suspended, offboarded]
        resultingState:
          type: string
          description: The final resulting state after completion. Matches the target
            state on success, or the failed variant on failure.
          nullable: true
          enum: [onboarded, onboardingFailed, active, activatingFailed, suspended,
            suspendingFailed, offboarded, offboardingFailed]
        triggeredAt:
          type: string
          format: date-time
          description: The timestamp when this transition attempt was triggered.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: The timestamp when this transition attempt completed.
        triggeredBy:
          type: string
          description: The user or system component that triggered this transition
            attempt.
        details:
          type: string
          description: Additional details about the transition attempt, such as initiation
            context, success confirmation, or failure reasons.
        tenantJobName:
          type: string
          description: Name of the k8s tenant job associated with this transition
            attempt, if one exists.
          nullable: true
    tenantStep:
      description: Represents a single step executed as part of a tenant state transition.
      type: object
      required:
      - id
      - name
      - state
      - creationTimestamp
      - modifiedTimestamp
      - stateTransitionId
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this step.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        name:
          type: string
          description: Human-readable name of the step (e.g., 'Initialize Tenant',
            'Rolling Restart of Service X', 'Tenant Content Loading for Service X').
        description:
          type: string
          description: Optional detailed description of what this step does.
          nullable: true
        state:
          type: string
          description: Current state of the step execution.
          enum: [pending, running, success, failed]
        failureDetails:
          type: string
          description: Error or failure information if state is 'failed'. Null otherwise.
          nullable: true
        creationTimestamp:
          type: string
          format: date-time
          description: Timestamp when this step was created.
        modifiedTimestamp:
          type: string
          format: date-time
          description: Timestamp when this step was last modified.
        serviceId:
          type: string
          format: uuid
          description: UUID of the service this step applies to. Null for tenant-level
            steps.
          nullable: true
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        jobName:
          type: string
          description: Name of the k8s job associated with this step, if one exists.
          nullable: true
        stateTransitionId:
          type: string
          format: uuid
          description: UUID of the state transition that initiated this step. Links
            to the transition that triggered the work.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
