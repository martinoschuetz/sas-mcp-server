    parameters:
    - name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: Unique identifier for the tenant (UUID).
    - name: transitionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: Unique identifier for the state transition (UUID).
    - name: stepId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: Unique identifier for the step (UUID).
    get:
      operationId: getTenantStateTransitionStep
      summary: Get a specific step
      description: Returns details of a specific step within a state transition for
        the specified tenant.
      tags:
      - Tenants
      parameters:
      - name: If-None-Match
        in: header
        description: Return the resource only if the ETag does not match.
        required: false
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        description: Return the resource only if it has been modified since the specified
          date/time.
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Step details
          headers:
            ETag:
              description: The entity tag for the resource.
              schema:
                type: string
            Last-Modified:
              description: The date and time the resource was last modified.
              schema:
                type: string
                format: date-time
            Cache-Control:
              description: Caching policies for the response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tenantStep"
              examples:
                successfulStep:
                  summary: Successfully completed step
                  value:
                    id: "f0a1b2c3-d4e5-4f6a-7b8c-9d0e1f2a3b4c"
                    name: "Initialize Tenant"
                    description: "Initialize tenant resources and configuration"
                    state: "success"
                    failureDetails:
                    creationTimestamp: "2026-02-02T10:00:15Z"
                    modifiedTimestamp: "2026-02-02T10:00:30Z"
                    serviceId:
                    jobName: "tenant-job-acme-corp-12345678"
                    stateTransitionId: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
                failedStep:
                  summary: Failed step with error details
                  value:
                    id: "f3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f"
                    name: "Generate Secrets"
                    description: "Generate encryption keys and secrets for tenant"
                    state: "failed"
                    failureDetails: "Encryption key unavailable in secrets vault"
                    creationTimestamp: "2026-02-02T10:00:45Z"
                    modifiedTimestamp: "2026-02-02T10:02:45Z"
                    serviceId:
                    jobName: "tenant-job-acme-corp-12345678"
                    stateTransitionId: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
        "304":
          description: Not modified - resource has not changed since the specified
            If-None-Match or If-Modified-Since header.
          headers:
            ETag:
              description: The current entity tag for the resource.
              schema:
                type: string
            Last-Modified:
