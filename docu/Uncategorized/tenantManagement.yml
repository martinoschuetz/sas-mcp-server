    post:
      operationId: createTenant
      summary: Create a new tenant
      description: |
        Creates a new tenant.
        If tenantDataId is provided for an onboarding request, the tenant data
        will be imported during the onboarding transition.
      tags:
      - Tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/tenantCreate"
            examples:
              createTenant:
                summary: Create and onboard a new tenant
                description: Example of creating a new tenant with desired state of
                  onboarded
                value:
                  shortName: tenant1
                  displayName: Tenant 1
                  description: Example tenant 1.
                  identityProviderId: "00000000-0000-0000-0000-000000000000"
                  dataPlaneIngress: tenant1-ingress.example.com
                  desiredState: onboarded
                  administratorEmails: ["admin@tenant1.com", "manager@tenant1.com"]
                  properties:
                    departmentCode: "ANALYTICS-001"
                    costCenter: "CC-4567-PROD"
                    region: "us-east-1"
                    environment: "production"
                    billingAccount: "BA-789012"
              createTenantWithImport:
                summary: Create and onboard a tenant from a tenant export package
                description: Example of creating a new tenant and triggering the Import
                  Tenant step
                value:
                  shortName: tenant2
                  displayName: Tenant 2
                  description: Example tenant 2.
                  identityProviderId: "00000000-0000-0000-0000-000000000000"
                  dataPlaneIngress: tenant2-ingress.example.com
                  desiredState: onboarded
                  tenantDataId: "a8b6f6f9-0a1e-4f1a-9b6a-4ea08f8e2d1c"
                  administratorEmails: ["admin@tenant2.com", "manager@tenant2.com"]
                  properties:
                    departmentCode: "ANALYTICS-001"
                    costCenter: "CC-4567-PROD"
                    region: "us-east-1"
                    environment: "production"
                    billingAccount: "BA-789012"
      responses:
        "201":
          description: Tenant created
          headers:
            ETag:
              description: The current entity tag for the resource.
              schema:
                type: string
            Location:
              description: The URL of the newly created resource.
              schema:
                type: string
                format: uri
            Cache-Control:
              description: Caching policies for the response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tenant"
              example:
                id: b344ae2b-fd43-4627-8f6a-2c98707ebc01
                shortName: tenant1
                displayName: Tenant 1
                description: Example tenant 1.
                dataPlaneIngress: tenant1-ingress.example.com
                administratorEmails: ["admin@tenant1.com", "manager@tenant1.com"]
                properties:
                  departmentCode: "ANALYTICS-001"
                  costCenter: "CC-4567-PROD"
                  region: "us-east-1"
                  environment: "production"
                  billingAccount: "BA-789012"
                createdTimestamp: "2023-08-29T09:00:00Z"
                modifiedTimestamp: "2023-08-29T09:00:00Z"
                createdBy: "system-admin@example.com"
                modifiedBy: "system-admin@example.com"
                desiredState: onboarded
                currentState: onboarding
                stateProgress:
                  sas-backup-agent:
                    serviceState: onboarding
        "400":
          description: Bad request. The request body or parameters are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid request body.
              example:
                error: Invalid request body.
        "409":
          description: Conflict. A tenant with the same short name already exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Tenant with the same short name already exists.
              example:
                error: Tenant with the same short name already exists.
  /tenants/{tenantId}:
    parameters:
    - name: tenantId
      in: path
      required: true
      description: Unique identifier for the tenant (UUID).
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    get:
      operationId: getTenant
      summary: Get tenant
      description: Retrieves the specified tenant, including desired and current state.
      tags:
      - Tenants
      responses:
        "200":
          description: Tenant details
          headers:
            ETag:
              description: The current entity tag for the resource.
              schema:
                type: string
            Last-Modified:
              description: The date and time the resource was last modified.
              schema:
                type: string
                format: date-time
            Cache-Control:
              description: Caching policies for the response.
              schema:
