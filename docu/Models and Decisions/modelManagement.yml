components:
  requestBodies:
    updateVariables:
      description: The variables to set on the process.
      content:
        application/vnd.sas.workflow.variables+json:
          schema:
            $ref: "#/components/schemas/updateVariables"
        application/json:
          schema:
            $ref: "#/components/schemas/updateVariables"
    workflowProcessRequest:
      description: The workflow object process request type describes what is required
        to start a workflow process.
      content:
        application/vnd.sas.workflow.object.process.request+json:
          schema:
            $ref: "#/components/schemas/workflowProcessRequest"
        application/json:
          schema:
            $ref: "#/components/schemas/workflowProcessRequest"
  schemas:
    performanceJob:
      title: Performance Job
      description: Contains information about the performance job.
      type: object
      properties:
        code:
          type: string
          description: The performance job SAS code.
        createdBy:
          type: string
          description: The user who created the job.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the job was created, in the format of
            `YYYY-MM-DDThh:mm:ss.sssZ`.
        modifiedBy:
          type: string
          description: The user who most recently modified the job.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the job was last modified, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
        state:
          type: string
          description: The performance job state (running | completed | completedWithWarnings
            | completedWithErrors ).
        jobReqId:
          type: string
          description: The identifier for a job request.
    performanceTask:
      title: Performance Task
      description: Contains information about the performance task.
      type: object
      properties:
        assessAlert:
          type: string
          description: The assessment measurements alert condition.
        assessWarn:
          type: string
          description: The assessment measurements warning condition.
        characteristicAlert:
          type: string
          description: The characteristic measurements alert condition.
        characteristicWarn:
          type: string
          description: The characteristic measurements warning condition.
        createdBy:
          type: string
          description: The user who created the task.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the task was created, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
        dataLibrary:
          type: string
          description: The performance table library URI.
        dataPrefix:
          type: string
          description: The performance data table prefix.
        id:
          type: string
          description: The identifier for a performance task.
        inputVariables:
          type: array
          items:
            type: string
            description: The input variables.
        maxBins:
          type: integer
          format: int32
          description: The maximum bins number.
        modelId:
          type: array
          items:
            type: string
            description: The system-generated identifier of a model.
        modifiedBy:
          type: string
          description: The user who most recently modified the task.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the job was last modified, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
        outputVariables:
          type: array
          items:
            type: string
            description: The output variable names.
        performanceResultSaved:
          type: boolean
          description: Indicates whether the performance results are saved.
        resultLibrary:
          type: string
          description: The performance output table library URI.
        scoreExecutionRequired:
          type: boolean
          description: Indicates whether the scoring task execution is required.
        stabilityAlert:
          type: string
          description: The stability measurements alert condition.
        stabilityWarn:
          type: string
          description: The stability measurements warning condition.
        includeAllData:
          type: boolean
          description: Indicates whether to run a performance job against all the
            data tables in a library.
        loadPerformanceResult:
          type: boolean
          description: Indicates to load performance result data.
        championMonitored:
          type: boolean
          description: Indicates to monitor the project champion model.
        challengerMonitored:
          type: boolean
          description: Indicates to monitor challenger models.
        traceOn:
          type: boolean
          description: Indicates whether to turn on tracing.
        version:
          type: integer
          description: The version number of application/vnd.sas.models.performance.task+json.
        variableBinMap:
          type: object
          description: Variable bins
        percentileMaxIter:
          type: integer
          description: The maximum number of iterations used in the percentile calculation
            for the ROC metric.
        rocCutOffNumber:
          type: integer
          description: The cut-off number for the ROC metric.
        liftBins:
          type: integer
          description: The number of bins for the Lift metric.
    performanceTaskCollection:
      title: Performance Task Collection
      description: The performance task representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/performanceTask"
            description: An array consisting of performance task resources.
    performanceJobCollection:
      title: Performance Job Collection
      description: The performance job representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/performanceJob"
            description: An array consisting of performance task resources.
    performanceSummaryKpi:
      title: Performance KPI Summary
      description: Contains summary information about the KPIs that are apart of a
        performance definition.
      type: object
      properties:
        misClassification:
          type: string
        falsePositive:
          type: string
        recall:
          type: string
        r_Squared:
          type: string
        averageSquaredError:
          type: string
    performancePeriodSummary:
      title: Performance Period Summary
      description: Contains summary information about the time period for a performance
        definition.
      type: object
      properties:
        name:
          type: string
          description: The label name for the time period.
        observations:
          type: integer
          description: The sum for the time period.
    performanceModelSummary:
      title: Performance Model Summary
      description: Contains summary information about a model that is part of a performance
        definition.
      type: object
      properties:
        modelId:
          type: string
          description: The ID for the model that is specified within the performance
            definition.
        rank:
          type: integer
          description: The rank of all models within the performance definition.
        periods:
          type: array
          items:
            $ref: "#/components/schemas/performancePeriodSummary"
        kpi:
          $ref: "#/components/schemas/performanceSummaryKpi"
    performanceTaskExecutionSummary:
      title: Performance Task Execution Summary
      description: Contains summary information about the execution of a performance
        definition.
      type: object
      properties:
        taskId:
          type: string
          description: The ID of the performance task definition.
        numberPeriods:
          type: string
          description: The number of time periods.
        totalObservations:
          type: string
          description: The total number of observations for the performance task.
        periods:
          type: array
          items:
            $ref: "#/components/schemas/performancePeriodSummary"
        models:
          type: array
          items:
            $ref: "#/components/schemas/performanceModelSummary"
    performanceTaskState:
      title: Performance Task Execution State
      description: Contains information about the execution state of a performance
        task.
      type: object
      properties:
        state:
          type: string
          description: The state of the performance execution.
    association:
      title: Association
      type: object
      description: The association type describes an object, such as a model repository
        project, that will be associated with a workflow process.
      properties:
        solutionObjectType:
          type: string
          description: The type of solution object associated with the started workflow
            process. This type is specified by the solution.
        solutionObjectId:
          type: string
          description: The identifier of the solution object.
        solutionObjectName:
          type: string
          description: The name of the solution object.
        solutionObjectUri:
          type: string
          description: The URI of the solution object.
        solutionObjectMediaType:
          type: string
          description: The media type of the solution object.
    workflowAssociation:
      title: Workflow Association
      type: object
      description: The workflow object association type describes an association between
        a Workflow process, that is managed by the Workflow service, and a solution
        object such as a Model Repository project. The association exists so that
        when a workflow process executes, the Model Repository service can know that
        a project or model has a workflow process using it. This enables the Model
        Repository service to lock certain functions or update object data based on
        workflow changes.
      properties:
        id:
          type: string
          description: The unique identifier for the association.
        processId:
          type: string
          description: The identifier of the workflow process.
        processName:
          type: string
          description: The name of workflow process.
        parentProcessId:
          type: string
          description: The identifier of the main workflow process. It is populated
            if the associated process is a sub-process.
        solutionObjectType:
          type: string
          description: The type of solution object associated with the workflow process.
            This type is specified by the solution.
        solutionObjectId:
          type: string
          description: The identifier of the solution object.
        solutionObjectName:
          type: string
          description: The name of the solution object.
        solutionObjectUri:
          type: string
          description: The URI of the solution object.
        solutionObjectMediaType:
          type: string
          description: The media type of the solution object.
        version:
          type: integer
          format: int32
          description: The version number for this media type's schema.
        links:
          description: The links that apply to the workflow association.
          type: array
          items:
            $ref: "#/components/schemas/link"
    workflowProcess:
      title: Workflow Process
      description: The workflow object process type describes a workflow process task
        that is associated with SAS Model Manager. The process is managed by the Workflow
        service, but is used in SAS Model Manager to add workflow control to a model
        project.
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the workflow process.
        parentId:
          type: string
          description: The identifier of the main workflow process. That is populated
            if this process is a sub-process.
        name:
          type: string
          description: The name of the workflow process.
        createdTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when this definition revision was created,
            in the format of 'YYYY-MM-DDThh:mm:ss.sssZ'.
        createdBy:
          type: string
          description: The user ID that created this workflow.
        state:
          type: string
          description: The current processing state(In Progress | Suspended) of the
            workflow.
        description:
          type: string
          description: The description of the process.
        associations:
          type: array
          description: A list of associations associated with the process.
          items:
            $ref: "#/components/schemas/workflowAssociation"
        version:
          type: integer
          format: int32
          description: The version number for this media type's schema.
        links:
          description: The links that apply to the workflow process.
          type: array
          items:
            $ref: "#/components/schemas/link"
    workflowProcessRequest:
      title: Workflow Process Request
      description: The workflow object process request type describes what is required
        to start a workflow process.
      type: object
      properties:
        variables:
          type: array
          description: The variables.
          items:
            $ref: "#/components/schemas/variable"
        association:
          type: object
          description: The solution object to be associated with a running process.
          properties:
            solutionObjectType:
              type: string
              description: The type of solution object associated with the started
                workflow process. This type is specified by the solution.
            solutionObjectId:
              type: string
              description: The identifier of the solution object.
            solutionObjectName:
              type: string
              description: The name of the solution object.
            solutionObjectUri:
              type: string
              description: The URI of the solution object.
            solutionObjectMediaType:
              type: string
              description: The media type of the solution object.
    workflowTask:
      title: Workflow Task
      type: object
      description: The workflow object task type describes a workflow user task that
        is associated with a model project. The task is viewable only by a user who
        is an actual owner or potential owner of the task. Potential and actual task
        owners are defined in the workflow definition for a workflow process.
      properties:
        id:
          type: string
          description: The unique identifier of the workflow task.
        processId:
          type: string
          description: The identifier of the associated workflow process.
        processTaskId:
          type: string
          description: The identifier of the task in the Workflow service.
        name:
          type: string
          description: The name of the task.
        definitionName:
          type: string
          description: The name of the definition that defines the process.
        actualOwner:
          type: string
          description: The user ID of the owner of the task.
        state:
          type: string
          description: The state (Started | Suspended | Canceled | Completed) of the
            task.
        stateTimeStamp:
          type: string
          format: date-time
          description: The timestamp of the last state change for the task.
        taskDueTimeStamp:
          type: string
          format: date-time
          description: The timestamp of when the task is due to be completed.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp of when this definition revision was created.
        createdBy:
          type: string
          description: The user ID that created this workflow.
        associations:
          type: array
          description: Collection of projects that are associated with this task.
          items:
            $ref: "#/components/schemas/workflowAssociation"
        links:
          description: The links that apply to the workflow task.
          type: array
          items:
            $ref: "#/components/schemas/link"
        resourceCollection:
          type: array
          description: The array of resource representations.
          items:
            $ref: "#/components/schemas/collection2"
    taskPrompt:
      title: Workflow Task Prompt
      type: object
      description: A workflow task prompt describes user input that is associated
        with a task.
      properties:
        id:
          type: string
          description: The unique identifier of the prompt.
        name:
          type: string
          description: The name of the prompt.
        variableType:
          type: string
          description: The type of the variable associated with the prompt.
        variableName:
          type: string
          description: The name of the variable associated with the prompt.
        values:
          type: array
          description: An optional collection of values that can be set on the associated
            variable.
          items:
            $ref: "#/components/schemas/promptValue"
        required:
          type: string
          description: A flag that determines whether a value must be provided for
            this prompt. Valid values [true, false].
        defaultValueId:
          type: string
          description: The identifier of the prompt value, which defines the default
            value.
        actualValue:
          type: string
          description: The actual value that has been specified for this prompt.
        version:
          type: integer
          format: int32
          description: This media type's schema version number.
        links:
          description: The links that apply to the workflow process.
          type: array
          items:
            $ref: "#/components/schemas/link"
    promptValue:
      title: Workflow Task Prompt Value
      type: object
      description: A name-value pair that is specified as a possible value for a prompt.
      properties:
        id:
          type: string
          description: The identifier of the prompt value.
        name:
          type: string
          description: The name of the prompt value.
        value:
          type: string
          description: The value that has been specified for this prompt.
    kpiCollection:
      title: KPI Collection
      description: The key performance indicator (KPI) representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/kpi"
            description: An array consisting of KPI resources.
    kpi:
      title: Project KPI
      type: object
      description: The project KPI defines the KPI key and value, and indicates whether
        the KPI is provided by the system o a custom KPI provided by a user.
      properties:
        name:
          type: string
          description: The name of the KPI.
        value:
          type: string
          description: The value of the KPI.
        systemKpiFlag:
          type: boolean
          description: Indicates whether the KPI is system provided.
    alertRuleCollection:
      title: Alert Rule Collection
      description: The alert rule representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/alertRule"
            description: An array consisting of alert rule resources.
    alertRule:
      title: Alert Rule
      description: The alert rule representation.
      properties:
        projectId:
          type: string
          description: The ID of a project in the common model repository.
        name:
          type: string
          description: The name of the alert rule.
        description:
          type: string
          description: The description of the alert rule.
        kpi:
          type: string
          description: The name of the KPI.
        severity:
          type: string
          description: The severity of the KPI.
        operator:
          type: string
          description: The operator used for comparison. Operators such as greater
            than, less than, equal to, and so on.
        value:
          type: number
          description: The value of the KPI.
        violations:
          type: integer
          description: The number of violations.
        modelRole:
          type: string
          description: The role of a model.
        triggered:
          type: boolean
          description: Indicates whether the rule is triggered.
        versionNum:
          type: integer
          description: The version number of the rule.
    alertRuleHistoryCollection:
      title: Alert Rule History Collection
      description: The alert rule history representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/alertRuleHistory"
            description: An array consisting of alert rule history resources.
    alertRuleHistory:
      title: Alert Rule History
      description: The alert rule representation.
      properties:
        projectId:
          type: string
          description: The ID of a project in the common model repository.
        name:
          type: string
          description: The name of the alert rule.
        description:
          type: string
          description: The description of the alert rule.
        kpi:
          type: string
          description: The name of the KPI.
        severity:
          type: string
          description: The severity of the KPI.
        operator:
          type: string
          description: The operator used for comparison. Operators such as greater
            than, less than, equal to, and so on.
        value:
          type: number
          description: The value of the KPI.
        violations:
          type: integer
          description: The number of violations.
        modelRole:
          type: string
          description: The role of a model.
        triggered:
          type: boolean
          description: Indicates whether the rule is triggered.
        versionNum:
          type: integer
          description: The version number of the rule.
        alertRuleId:
          type: string
          description: The ID of the alert rule.
        ruleCreationTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the rule was created, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
        ruleModifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp for when the rule was last modified, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
        ruleCreatedBy:
          type: string
          description: The user who created the rule.
    executionStatus:
      title: Execution Status
      description: Contains information about the execution status.
      type: object
      properties:
        executedBy:
          type: string
          description: The user who performed the execution of the rule.
        status:
          type: string
          description: The status of the execution results.
        log:
          type: string
          description: The content of the log.
    reportRequest:
      title: Report Request
      description: Contains information about a report request.
      type: object
      properties:
        name:
          type: string
          description: The name of the report.
        description:
          type: string
          description: The description of the report.
        modelUris:
          type: array
          description: Collection of model URIs, which are used to perform a model
            comparison.
          items:
            type: string
    uriReference:
      title: URI Reference
      description: Contains information about the URI reference.
      properties:
        name:
          type: string
          description: The name of the URI reference.
        uri:
          type: string
          description: The value of the URI.
        uriType:
          type: string
          description: The child or reference of the URI.
        mediaType:
          type: string
          description: The media type of this URI.
        contentType:
          type: string
          description: The content type that the URI points to.
    variable:
      title: Variable
      description: Contains information about the variable.
      properties:
        createdBy:
          type: string
          description: The user that created the variable.
        modifiedBy:
          type: string
          description: The user that last modified the variable.
        creationTimeStamp:
          type: string
          description: The timestamp for when the variable was created, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The timestamp for when the variable was last modified, in the
            format of `YYYY-MM-DDThh:mm:ss.sssZ`.
          format: date-time
        name:
          type: string
          description: The name of the variable.
        description:
          type: string
          description: The description of this variable.
        role:
          type: string
          description: "The role of the variable. Valid values are: input, output,\
            \ target"
        type:
          type: string
          description: "The type of variable. Valid values are: string, decimal, integer,\
            \ boolean, date, datetime"
        level:
          type: string
          description: "The measurement level of the variable. Valid values are: binary,\
            \ interval, nominal, ordinal"
        format:
          type: string
          description: The format of the variable. An example is int32.
        length:
          type: integer
          description: The length of the variable.
        version:
          type: integer
          description: The variable representation version. The version is 2.
          default: 2
    updateVariable:
      title: Update Variable
      description: Contains information about the variable that is updated.
      properties:
        version:
          type: integer
          description: The variable schema version.
        scope:
          type: string
          description: "The scope of the variable. Valid values: local, inherited]"
        type:
          type: string
          description: "The type of the variable. Valid values: string, number, dateTime,\
            \ boolean"
        name:
          type: string
          description: The variable name.
        value:
          description: The variable value.
          oneOf:
          - type: string
          - type: boolean
          - type: number
    updateVariables:
      title: Update Variables
      description: Contains information about the variables that are updated.
      properties:
        version:
          type: integer
          description: The variables schema version.
        variables:
          type: array
          description: The variables.
          items:
            $ref: "#/components/schemas/variable"
    variableCollection:
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          name:
            type: string
            description: The name of the collection 'variables' in the context of
              the request.
          accept:
            type: string
            description: application/vnd.sas.workflow.variable
          items:
            $ref: "#/components/schemas/variable"
    updateMessage:
      title: Update Message
      description: Contains information about the message that is updated.
      properties:
        version:
          type: integer
          description: The version of the message schema.
        name:
          type: string
          description: The name of the message.
        variables:
          type: array
          description: The variables to set within the workflow process prior to the
            process continuing.
          items:
            $ref: "#/components/schemas/variable"
    modelProperty:
      title: Model Property
      description: Contains information about the model property.
      properties:
        name:
          type: string
          description: The name of the property.
        value:
          type: string
          description: The value for the property.
        type:
          type: string
          description: "The data type for the property. Valid values: string, decimal,\
            \ integer, date, datetime"
    model:
      title: Model
      description: Contains information about the model.
      properties:
        createdBy:
          type: string
          description: The user that created the model.
        modifiedBy:
          type: string
          description: The user that last modified the model.
        creationTimeStamp:
          type: string
          description: The timestamp for when the model was created, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The timestamp for when the model was last modified, in the
            format of `YYYY-MM-DDThh:mm:ss.sssZ`.
          format: date-time
        id:
          type: string
          description: The unique identifier for the model.
        name:
          type: string
          description: The name of the model.
        description:
          type: string
          description: The description of the model.
        function:
          type: string
          description: "The function of the model. Valid values: analytical, classification,\
            \ cluster, forecasting, prediction, Text analytics, transformation"
        algorithm:
          type: string
          description: The name of model algorithm.
        tool:
          type: string
          description: The name of the model tool.
        modeler:
          type: string
          description: This is the user that created or built the model.
        scoreCodeType:
          type: string
          description: The score code type for the model.
        trainTable:
          type: string
          description: The train data table.
        eventProbVar:
          type: string
          description: The name of the event probability variable.
        targetEvent:
          type: string
          description: The target event value.
        champion:
          type: boolean
          description: Indicates whether the project has champion model or not.
        role:
          type: string
          description: "The role of the model. Valid values: plain, champion, challenger"
        location:
          type: string
          description: The location of this model.
        targetLevel:
          type: string
          description: The level of the target.
        targetVariable:
          type: string
          description: The name of the target variable.
        projectId:
          type: string
          description: The unique identifier for the project that contains the model.
        projectName:
          type: string
          description: The name of the project that contains the model.
        projectVersionId:
          type: string
          description: The unique identifier for the project version that contains
            the model.
        projectVersionName:
          type: string
          description: The display name of the project version that contains the model
        folderId:
          type: string
          description: The unique identifier for the folder that contains the model
        repositoryId:
          type: string
          description: The unique identifier for the repository that contains the
            model.
        championStartTime:
          type: string
          description: The time at which the model was set as the project champion
            model.
        championEndTime:
          type: string
          description: The time at which the model was unset (cleared) as the project
            champion model.
        suggestedChampion:
          type: boolean
          description: Indicates the model that was suggested as the champion model
