          modelName: "QS_Reg1_Nominal"
          principalID: "268742ce-c433-4cd2-b543-7f2a2754b29b"
          codeType: "ds2"
          code: "/* Algorithm: Logistic Regression */ package \"QS_Reg1_Nominal\"\
            \ / overwrite=yes; dcl double AGE; dcl double INCOME; dcl double BALANCE;\
            \ dcl double EXPENSE; dcl double RISK; dcl double P_JOBTech having label\
            \ 'Predicted: JOB=Tech'; dcl double P_JOBClerical having label 'Predicted:\
            \ JOB=Clerical'; dcl nchar(7) I_JOB having label 'Into: JOB'; dcl double\
            \ EM_PROBABILITY; method logistic_scoring(); dcl double _LINP1_, _LINP2_,\
            \ _SUMP_; dcl double _BETA1_[5] = (1.23, -0.014, 0.007, 0.021, -0.0035);\
            \ dcl double _BETA2_[5] = (0.95, 0.006, -0.018, 0.013, 0.0021); dcl double\
            \ _X_[5]; _X_ := (AGE, INCOME, BALANCE, EXPENSE, RISK); _LINP1_ = sum(of\
            \ (_X_ * _BETA1_)); _LINP2_ = sum(of (_X_ * _BETA2_)); _SUMP_ = exp(_LINP1_)\
            \ + exp(_LINP2_); P_JOBTech = exp(_LINP1_) / _SUMP_; P_JOBClerical = exp(_LINP2_)\
            \ / _SUMP_; EM_PROBABILITY = max(P_JOBTech, P_JOBClerical); end;"
