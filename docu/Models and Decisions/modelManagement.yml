---
openapi: 3.0.3
info:
  title: Model Management
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: The Model Management API provides basic resources for monitoring performance,
    comparing models, and running workflow processes.
  version: "12"
servers:
- url: "https://example.com/modelManagement"
  description: "This is an example of a base URL."
tags:
- name: Performance Jobs
  description: Contains the operations for the Performance Jobs resource.
- name: Performance Tasks
  description: Contains the operations for the Performance Tasks resource.
- name: Workflow Associations
  description: Contains the operations for the Workflow Associations resource.
- name: Workflow Processes
  description: Contains the operations for the Workflow Processes resource.
- name: Workflow Process Variables
  description: Contains the operations for the Workflow Process Variables resource.
- name: Workflow Tasks
  description: Contains the operations for the Workflow Tasks resource.
- name: KPIs
  description: Contains the operations for the KPIs resource.
- name: Alert Rules
  description: Contains the operations for the Alert Rules resource.
- name: Execution
  description: Contains the operations for the Execution resource.
- name: Code
  description: Contains the operation for generating code for models.
- name: Model Comparison Reports
  description: Contains the operations for a generating model comparison reports.
- name: Publish Models
  description: Contains the operations for publishing models.
- name: Root
  description: Contains the operations for the Root resource.
- name: RSS Feed
  description: Contains the operations for the RSS Feed.
- name: Multi-Variate Prediction Summary
  description: Contains the distinct values along with the frequency for the specific
    variable in a CAS table.
- name: Metrics
  description: Contains the operations for the Metrics resource and generating assessment
    files.
- name: Scoring
  description: Contains the operations for scoring models.
paths:
  /:
    get:
      tags:
      - Root
      description: Returns a list of links to the top-level resources that are surfaced
        through the API.
      summary: Get a list of top-level resource links
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
    head:
      tags:
      - Root
      summary: Check API availability
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of this object.
              schema:
                type: string
                format: date-time
  /performanceTasks:
    get:
      operationId: getPerformanceTasks
      summary: Get a list of performance tasks
      description: Returns a list of performance tasks.
      tags:
      - Performance Tasks
      parameters:
      - name: projectId
        in: query
        description: The server-generated identifier for the project.
        required: false
        schema:
          type: string
      - name: start
        description: The index of the first performance task to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of performance tasks to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the performance task definitions.
          See [Filtering in REST APIs](https://developer.sas.com/rest-apis/modelManagement/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the performance task definitions. See
          [Sorting in REST APIs](https://developer.sas.com/rest-apis/modelManagement/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
            Last-Modified:
              description: The last modified timestamp of this object.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/performanceTaskCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/performanceTaskCollection"
    post:
      operationId: createPerformanceTask
      summary: Create a performance task definition
      description: Creates a performance task definition.
      tags:
      - Performance Tasks
      requestBody:
        content:
          application/vnd.sas.models.performance.task+json:
            schema:
              $ref: "#/components/schemas/performanceTask"
          application/json:
            schema:
              $ref: "#/components/schemas/performanceTask"
        description: The definition of the performance task.
        required: true
      responses:
        "201":
          description: The performance task definition was created.
          headers:
            ETag:
              description: A tag that identifies the revision of this performance
                task definition.
              schema:
                type: string
            Location:
              description: The URL of the performance task definition.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.models.performance.task+json:
              schema:
                $ref: "#/components/schemas/performanceTask"
            application/json:
              schema:
                $ref: "#/components/schemas/performanceTask"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.models.performance.task+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /performanceTasks/@defaultTask/performanceJobs:
    post:
      operationId: createPerformanceJob
      summary: Create performance job history
      description: Creates the performance job history.
      tags:
      - Performance Tasks
      requestBody:
        content:
          application/vnd.sas.models.performance.job+json:
            schema:
              $ref: "#/components/schemas/performanceJob"
          application/json:
            schema:
              $ref: "#/components/schemas/performanceJob"
        description: The definition of the performance job.
        required: true
      responses:
        "201":
          description: The performance job was created.
          headers:
            Location:
              description: The URL of the performance job.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.models.performance.job+json:
              schema:
                $ref: "#/components/schemas/performanceJob"
            application/json:
              schema:
                $ref: "#/components/schemas/performanceJob"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.models.performance.job+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  "/performanceTasks/{taskId}":
    get:
      operationId: getPerformanceTaskDefinition
      summary: Get a performance task definition
      description: Returns the performance task definition.
      tags:
      - Performance Tasks
      parameters:
      - name: taskId
        in: path
        description: Identifier of the task.
        required: true
        schema:
          type: string
      - name: start
        description: The index of the first performance task to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of performance tasks to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.models.performance.task+json:
              schema:
                $ref: "#/components/schemas/performanceJob"
            application/json:
              schema:
                $ref: "#/components/schemas/performanceJob"
        "404":
          description: No performance task definition exists at the requested path.
          content:
            application/vnd.sas.models.performance.task+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    post:
      summary: Execute a performance task
      operationId: executeJob
      description: Executes a performance task job.
      tags:
      - Performance Tasks
      parameters:
      - name: taskId
        in: path
        description: Identifier of the task.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.models.performance.task+json:
            schema:
              $ref: "#/components/schemas/performanceTask"
          application/json:
            schema:
              $ref: "#/components/schemas/performanceTask"
        description: The task contents for updating the task.
        required: true
      responses:
        "201":
          description: The performance task was executed.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
            Location:
              description: The URL of the performance task.
              schema:
                type: string
                format: uri
          content:
            application/vnd.sas.models.performance.task+json:
              schema:
                $ref: "#/components/schemas/performanceJob"
            application/json:
              schema:
                $ref: "#/components/schemas/performanceJob"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.models.performance.task+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    put:
      operationId: updateJobDefinition
      summary: Update a performance task definition
      description: Updates the performance task definition associated with the specified
        task ID.
      tags:
      - Performance Tasks
      parameters:
      - name: Etag
        in: header
        description: If-Match
        required: true
        schema:
          type: string
      - name: taskId
        in: path
        description: The identifier of the task.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.models.performance.task+json:
            schema:
              $ref: "#/components/schemas/performanceTask"
          application/json:
            schema:
              $ref: "#/components/schemas/performanceTask"
        description: The task contents for updating the task.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.models.performance.task+json:
              schema:
                $ref: "#/components/schemas/performanceTask"
            application/json:
              schema:
                $ref: "#/components/schemas/performanceTask"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.models.performance.task+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag (ETag).
          content:
            application/vnd.sas.models.performance.task+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: The request headers did not include a `If-Match` or `If-Unmodified-Since`
            precondition.
          content:
            application/vnd.sas.models.performance.task+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      operationId: deleteTask
      summary: Delete a performance task definition
      description: Deletes a performance task definition.
      tags:
      - Performance Tasks
      parameters:
      - name: taskId
        in: path
        description: The identifier of the task.
        required: true
        schema:
          type: string
      - name: deleteTask
        in: query
        description: Indicates whether to delete the task.
        required: false
        schema:
          type: boolean
          default: true
      - name: deleteTable
        in: query
        description: Indicates whether to delete the table.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "204":
          description: The performance task was deleted.
        "404":
          description: No performance task exists at the requested path.
  "/performanceTasks/{taskId}/summary":
    get:
      operationId: getPerformanceTaskExecutionSummary
      summary: Get a performance task execution summary
      description: Returns an execution summary for the performance task.
      tags:
      - Performance Tasks
      parameters:
      - name: taskId
        in: path
        description: The identifier of the performance task.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.models.performance.execution.summary+json:
              schema:
                $ref: "#/components/schemas/performanceTaskExecutionSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/performanceTaskExecutionSummary"
        "404":
          description: No performance task definition exists at the requested path.
          content:
            application/vnd.sas.models.performance.execution.summary+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  "/performanceTasks/{taskId}/state":
    get:
      operationId: getPerformanceTaskExecutionState
      summary: Get a performance task execution state
      description: Returns the execution state of a performance task.
      tags:
      - Performance Tasks
      parameters:
      - name: taskId
        in: path
        description: The identifier of the performance task.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/performanceTaskState"
        "404":
          description: No performance task definition exists at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  "/performanceTasks/{taskId}/performanceJobs":
    get:
      summary: Get a list of jobs for a performance task
      operationId: getJobsByTask
      description: Returns a list of the jobs and the performance results that are
        associated with a specified task ID.
      tags:
      - Performance Jobs
      parameters:
      - name: taskId
        in: path
        description: The identifier of the task.
        required: true
        schema:
          type: string
      - name: start
        description: The index of the first performance task to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        description: The maximum number of performance tasks to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        description: The criteria for filtering the performance jobs. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/modelManagement/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: string
      - name: sortBy
        in: query
        description: The criteria for sorting the performance jobs. See [Sorting in
          REST APIs](https://developer.sas.com/rest-apis/modelManagement/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/performanceJobCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/performanceJobCollection"
        "404":
          description: No performance task exists at the requested path.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  "/performanceTasks/{taskId}/performanceJobs/{jobId}":
    get:
      operationId: getPerformanceJob
      summary: Get performance job results
      description: Returns the performance results that are associated with the specified
        task ID and job ID.
      tags:
      - Performance Jobs
      parameters:
      - name: taskId
        in: path
        description: The identifier of the task.
        required: true
        schema:
          type: string
      - name: jobId
        in: path
        description: The identifier of the performance job.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/performanceJobCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/performanceJobCollection"
        "404":
          description: No performance task or job exists at the requested path.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      summary: Delete a performance job
      description: Deletes the specified performance job.
      tags:
      - Performance Jobs
      operationId: deletePerformanceJob
      parameters:
      - name: taskId
        in: path
        description: The identifier of the task.
        required: true
        schema:
          type: string
      - name: jobId
        in: path
        description: The identifier of the performance job.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The performance job was deleted.
        "404":
          description: No performance task exists at the requested path.
  "/performanceTasks/{taskId}/performanceJobs/{jobId}/state":
    get:
      operationId: getPerformanceJobState
      summary: Get the state of a performance job
      description: |
        Returns the state of the specified performance job.
        ___Note:__ This endpoint does not work as expected. Use `/performanceTasks/{taskId}/state` instead._
      x-sas-internal: true
      tags:
      - Performance Jobs
      parameters:
      - name: taskId
        in: path
        description: The identifier of the task.
        required: true
        schema:
          type: string
      - name: jobId
        in: path
        description: The identifier of the performance job.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/performanceJob"
        "404":
          description: No performance job exists at the requested path.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/error2"
  "/performanceTasks/{taskId}/performanceJobs/{jobId}/code":
    get:
      operationId: getPerformanceJobCode
      summary: Get the performance job code
      description: Returns the performance job execution code for a performance task.
      tags:
      - Performance Jobs
      parameters:
      - name: taskId
        in: path
        description: The identifier of the task.
        required: true
        schema:
          type: string
      - name: jobId
        in: path
        description: The identifier of the performance job.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            text/vnd.sas.source.sas:
              schema:
                $ref: "#/components/schemas/performanceJob"
            text/plain:
              schema:
                $ref: "#/components/schemas/performanceJob"
        "404":
          description: No performance job exists at the requested path.
          content:
            text/vnd.sas.source.sas:
              schema:
                $ref: "#/components/schemas/error2"
            text/plain:
              schema:
                $ref: "#/components/schemas/error2"
  "/performanceTasks/{taskId}/performanceJobs/{jobId}/log":
    get:
      operationId: getPerformanceJobLog
      summary: Get a performance job log
      description: Returns the execution log for a performance job.
      tags:
      - Performance Jobs
      parameters:
      - name: taskId
        in: path
        description: The identifier of the task.
        required: true
        schema:
          type: string
      - name: jobId
        in: path
        description: The identifier of the performance job.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/performanceJob"
        "404":
          description: No performance job exists at the requested path.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/error2"
  "/performanceTasks/{taskId}/performanceReportData":
    get:
      tags:
      - Performance Jobs
      summary: Get the performance report data
      description: Retrieves the performance monitoring report data associated with
        the specified task ID.
      operationId: getPerformanceReportData
      parameters:
      - name: taskId
        in: path
        description: The identifier of the performance task.
        required: true
        schema:
          type: string
      - name: Accept-Item
        in: header
        required: true
        description: " The desired performance report data representation."
        schema:
          type: string
          enum:
          - application/vnd.sas.models.performance.task.report.data.lift+json
          - application/vnd.sas.models.performance.task.report.data.variable.summary+json
          - application/vnd.sas.models.performance.task.report.data.variable.deviation+json
          - application/vnd.sas.models.performance.task.report.data.roc+json
          - application/vnd.sas.models.performance.task.report.data.ks.cumulative+json
          - application/vnd.sas.models.performance.task.report.data.ks.statistic+json
          - application/vnd.sas.models.performance.task.report.data.mse+json
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/collection2"
            application/json:
              schema:
                $ref: "#/components/schemas/collection2"
        "404":
          description: No performance task exists at the requested path.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  "/performanceTasks/{taskId}/resultPlotData":
    get:
      tags:
      - Performance Jobs
      summary: Get the performance result data for plot
      description: Retrieves the performance monitoring result data associated with
        the specified task ID.
      operationId: getPerformanceResultPlotData
      parameters:
      - name: taskId
        in: path
        description: The identifier of the performance task.
        required: true
        schema:
          type: string
      - name: plotType
        in: query
        description: The specific type of the performance plot.
        required: false
        schema:
          type: string
      - name: modelId
        in: query
        description: The identifier of a specific model.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/collection2"
            application/json:
              schema:
                $ref: "#/components/schemas/collection2"
        "400":
          description: No performance result data source associated with the plot
            type.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No performance task exists at the requested path.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  "/performanceTasks/{taskId}/timeSK":
    get:
      tags:
      - Performance Jobs
      summary: Get the time periods from a performance task
      description: Retrieves the time period data associated with the specified task
        ID.
      operationId: getTimeSK
      parameters:
      - name: taskId
        in: path
        description: The identifier of the performance task.
        required: true
        schema:
          type: string
      - name: modelId
        in: query
        description: The identifier of a specific model.
        required: false
        schema:
          type: string
      - name: modelVersionId
        in: query
        description: The identifier of a specific model version.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/collection2"
        "400":
          description: No result data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No performance task exists at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /publish:
    post:
      tags:
      - Publish Models
      summary: Publish models
      description: "Publish a model to a CAS, Hadoop, Teradata, SAS Micro Analytic\
        \ Service, or a container publishing destination. For more information, see\
        \ [Publishing Models](https://documentation.sas.com/?cdcId=mdlmgrcdc&cdcVersion=default&docsetId=mdlmgrug&docsetTarget=p1takjngq2c47dn1g52oyk6gxk7k.htm)\
        \ in _SAS Model Manager: User's Guide_"
      operationId: publishModels
      parameters:
      - name: force
        in: query
        description: Indicates to publish models and replace previously published
          models with the same name.
        required: false
        schema:
          type: boolean
          default: false
      - name: reloadModelTable
        in: query
        description: Indicates whether to reload the model table for the destination.
        required: false
        schema:
