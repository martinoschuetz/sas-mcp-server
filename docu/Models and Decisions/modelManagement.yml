  "/workflow/processes":
    post:
      summary: Create a workflow process
      operationId: createWorkflowProcess
      description: Creates a workflow process and then creates an association between
        the started workflow process and a model repository object. Returns a specific
        workflow process that was associated with SAS Model Manager and the association
        for that workflow process to a model object. It is possible to start a workflow
        process but not be able to create the workflow association, which produces
        an error response. The workflow is managed and authorized within the Workflow
        service. The process is available only if it has a client registration ID
        for SAS Model Manager. <br><br> <b>Authorization:</b> By default only users
        in the ApplicationAdministrators group have access to this endpoint. Authorization
        rules can be added to this endpoint for any set of users or groups to allow
        access to the associated information.
