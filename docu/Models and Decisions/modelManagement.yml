          items:
            $ref: "#/components/schemas/uriReference"
        properties:
          type: array
          items:
            $ref: "#/components/schemas/modelProperty"
          description: The properties for the model.
        inputVariables:
          type: array
          items:
            $ref: "#/components/schemas/variable"
          description: The input variables for the model.
        outputVariables:
          type: array
          items:
            $ref: "#/components/schemas/variable"
          description: The output variables for the model.
        version:
          type: integer
          description: The model representation version. The version is 2.
          default: 2
    reportResponse:
