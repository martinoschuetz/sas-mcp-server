  "/models/{modelId}/assessment":
    post:
      summary: Create assessment files
      operationId: createAssessmentFiles
      x-sas-internal: true
      description: |
        Creates assessment files for a model that are then used to generate the model card.

        __Note:__ The training table property must be set for a model before submitting
        a request for this endpoint. It can be set using the PUT operation with the modelRepository/models/{modelId}
        endpoint.
      tags:
      - Metrics
      parameters:
      - name: modelId
        in: path
        description: The ID of a model in the common model repository.
        required: true
        schema:
          type: string
      - name: partitionVariable
        in: query
        description: The name of the partition variable.
        required: false
        schema:
          type: string
      - name: scoredData
        in: query
        description: The path to the scored data table.
        required: false
        schema:
          type: string
      responses:
        "201":
          description: The assessment files were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createAssessmentFiles"
              examples:
                default:
                  $ref: "#/components/examples/createAssessmentFiles"
        "400":
          description: The model ID is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No training table or project variables exist at the requested
            path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "409":
          description: The request for the model files to be added to the model could
            not be completed due to a conflict with the current state of the resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/conflict"
  "/models/{modelId}/score":
    post:
      summary: Create scored data
      operationId: createScoredData
      x-sas-internal: true
      description: |
        Creates and executes a scoring job, which creates the scored data for a model. The model is scored using its training data.

        __Note:__ The training table property must be set for the model before submitting a request for this
        endpoint. It can be set with the PUT modelRepository/models/{modelId} endpoint.
      tags:
      - Scoring
      parameters:
      - name: modelId
        in: path
        description: The ID of a model in the common model repository.
        required: true
        schema:
          type: string
      - name: libraryName
        in: query
        description: The CAS library name in which to save the scored data table.
        required: false
        schema:
          type: string
          default: PUBLIC
      - name: tableName
        in: query
        description: The name of the scored data table.
        required: false
        schema:
          type: string
          default: _mm_scored_table
      responses:
        "201":
          description: The scored data for the model was created.
          content:
            application/json:
