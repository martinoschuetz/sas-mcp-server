      - name: definitionId
        in: query
        description: The ID of the enabled definition.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.workflow.object.process.request+json:
            schema:
              $ref: "#/components/schemas/workflowProcessRequest"
            examples:
              "With variables":
                $ref: "#/components/examples/workflowObjectProcessRequestWithVars"
              "No variables":
                $ref: "#/components/examples/workflowObjectProcessRequestNoVars"
          application/json:
            schema:
              $ref: "#/components/schemas/workflowProcessRequest"
            examples:
              "With variables":
                $ref: "#/components/examples/workflowObjectProcessRequestWithVars"
              "No variables":
                $ref: "#/components/examples/workflowObjectProcessRequestNoVars"
        description: Workflow process content to use in starting a process
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.workflow.object.process+json:
              schema:
                $ref: "#/components/schemas/workflowProcess"
              examples:
                application/vnd.sas.workflow.object.process+json:
                  $ref: "#/components/examples/workflowObjectProcessResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/workflowProcess"
              examples:
                application/json:
                  $ref: "#/components/examples/workflowObjectProcessResponse"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
