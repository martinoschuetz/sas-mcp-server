      title: Score Code Generation Request
      description: Request containing hints to generate mapped code using the Scoring
        Definition by Score Object.
      required:
      - scoreDefinitionId
      properties:
        scoreDefinitionId:
          type: string
          description: "The score definition ID that is used for generating mapped\
            \ code."
        hints:
          type: object
          description: Hints for generating mapped code. The mapped code request is
            forwarded to the score object of the score definition. The score object
            should understand these hints.
          additionalProperties:
            type: string
        version:
          type: integer
          readOnly: true
          description: This media type's schema version number. This representation
            is version 2.
    collection2:
      title: Collection
      description: A collection of zero or more resource representations. Collections
        are often paginated and the items array contains one page of representations.
      required:
      - items
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: Array consisting API resource representations, normally a
              page worth.
    mappedCode:
      title: Mapped Code
      description: Executable code generated by a score object using a score definition
        and input data. This represents application/vnd.sas.score.mapped.code media
        type (version 1).
      required:
      - code
      - codeType
      - outputTableName
      - outputLibraryName
      properties:
        code:
          type: string
          description: The executable code generated by a score object.
        codeType:
          type: string
          format: media-type
          description: The type of code.
        outputTableName:
          type: string
          description: The name of the table that is generated when the code is executed.
        outputLibraryName:
          type: string
          description: The name of the library where the table is generated when the
            code is executed.
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
      example:
        code: "/* DS2 code of an object, which generates an XYZ output table */"
        codeType: text/vnd.sas.source.ds2
        outputTableName: XYZ
        outputLibraryName: HPS
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
