        endpoint.
      operationId: getCurrentRetrainingJob
      parameters:
      - name: projectId
        in: path
        description: The identifier of the project.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/performRetrainingResponse"
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/performRetrainingResponse"
        '308':
          description: The request is redirected to a new permanent URL.
          headers:
            Location:
              description: Location of new permanent URL
              schema:
                type: string
          content:
            application/vnd.sas.job.execution.job+json:
              schema:
                type: object
              examples:
                json:
                  $ref: "#/components/examples/performRetrainingResponse"
            application/json:
              schema:
                type: object
              examples:
                json:
                  $ref: "#/components/examples/performRetrainingResponse"
  '/projects/{projectId}/retrainJobs/@lastJob/champion':
    head:
      deprecated: true
      tags:
      - Retraining
      summary: Get the headers for champion model
      description: Returns the headers for champion model from the last retraining
        job.
      operationId: headersForProjectRetrainingChampionModel
      parameters:
      - name: projectId
        in: path
        description: The identifier of the project.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the champion model.
              schema:
                type: string
        '404':
          description: The specified project or model could not be found.
    get:
      deprecated: true
      tags:
      - Retraining
      summary: Get the champion model
      description: Returns the champion model from the last retraining job. The response
        object contains the model.
      operationId: getProjectRetrainingChampionModel
      parameters:
      - name: projectId
        in: path
        description: The identifier of the project.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the champion model.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingStateChampionModelResponse"
            application/vnd.sas.analytics.data.mining.model+json:
              schema:
                $ref: "#/components/schemas/model"
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingStateChampionModelResponse"
        '308':
          description: The request is redirected to a new permanent URL.
          headers:
            Location:
              description: Location of new permanent URL
              schema:
                type: string
          content:
            application/vnd.sas.analytics.data.mining.model+json:
              schema:
                type: object
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingStateChampionModelResponse"
            application/json:
              schema:
                type: object
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingStateChampionModelResponse"
servers:
- url: http://example.com/dataMining
  description: kubernetes mock server
components:
  requestBodies:
    variableMetadataList:
      x-sas-internal: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/variableMetadataList'
        application/vnd.sas.analytics.data.mining.variable.metadata+json:
          schema:
            $ref: '#/components/schemas/variableMetadataList'
      description: inputGlobalMetadata
      required: true
  schemas:
    variableMetadata:
      x-sas-internal: true
      type: object
      required:
      - comment
      - createdBy
      - distribution
      - family
      - format
      - formatType
      - index
      - indexType
      - inputFormat
      - kurtosis
      - length
      - percentEventsInFirstLevel
      - percentEventsInSecondLevel
      - lowerLimit
      - missCount
      - observationCount
      - rootName
      - skewness
      - standardDeviation
      - sumOfFrequencies
      - upperCaseName
      - upperLimit
      - variableType
      properties:
        characterCustomImputationValue:
          type: string
          description: The value used for imputing the input if it is numeric when
            the Impute method is set to 'Custom constant value'.
        comment:
          type: string
          description: Contains additional information about the variable. Data mining
            components might set the value of this field.
        createdBy:
          type: string
          description: Identifies the data mining component that created the variable,
            if any.
        distribution:
          type: string
          description: The expected univariate distribution.
        family:
          type: string
          description: Identifies the general source of a variable such as demographic,
            financial, historic for record keeping. Such values can be useful in constructing
            the data, for example.
        format:
          type: string
          description: Specifies the format of a variable.
        formatType:
          type: string
          description: 'Specifies the format type of the variable. One of the following:
            number, date, time, choice.'
        imputationMethod:
          type: string
          description: The method by which missing values are calculated for the variable.
          enum:
          - default
          - none
          - minimum
          - maximum
          - mean
          - median
          - midrange
          - distribution
          - constant
          - customConstantValue
          - count
          - winsorizedMean
          - winsorizedMaximum
          - winsorizedMinimum
          - winsorizedMidrange
          - trimmedMean
          - trimmedMaximum
          - trimmedMinimum
          - trimmedMidrange
        index:
          type: string
          description: Indicate whether the variable is indexed.
        indexType:
          type: string
          description: Indicates the index type if the variable is indexed
        inputFormat:
          type: string
          description: Indicates the variable input format.
        kurtosis:
          type: number
          format: double
          description: The kurtosis values for interval variables only. For class
            variables, '.' is displayed.  Kurtosis identifies the flatness or peakness
            of a distribution.
        label:
          type: string
          description: Contains the text label.
        lastModifiedTimestamp:
          type: string
          description: The timestamp when this variable was last modified.
        length:
          type: number
          format: double
          description: The variable length.
        level:
          type: string
          description: The measurement level for the variable.
          enum:
          - 'null'
          - unary
          - binary
          - ordinal
          - nominal
          - interval
        percentEventsInFirstLevel:
          type: number
          format: double
          description: The percentage of values for the variable that occur in the
            first level.
        percentEventsInSecondLevel:
          type: number
          format: double
          description: The percentage of values for the variable that occur in the
            second level.
        lowerLimit:
          type: number
          format: double
          description: The lower limit of variable values.
        maximum:
          type: number
          format: double
          description: The maximum value of the variable.
        mean:
          type: number
          format: double
          description: The mean value for the variable.
        minimum:
          type: number
          format: double
          description: The minimum value of the variable.
        name:
          type: string
          description: The variable name.
        levelCount:
          type: number
          format: double
          description: The number of levels for this variable
        levelCountMessage:
          type: string
          description: The displayed number of levels.  If the number of variables
            is greater than 254, then this will be ">254".  Otherwise, it will be
            the number of levels.
        missCount:
          type: number
          format: double
          description: The total number of missing values for the variable.
        observationCount:
          type: number
          format: double
          description: The number of observations in the table for the variable.
        numericCustomImputationValue:
          type: number
          format: double
          description: The value used for imputing the input if it is character when
            the Impute method is set to 'Custom constant value'.
        order:
          type: string
          description: The formatted value sorting order for class variables.
          enum:
          - default
          - ascending
          - descending
          - formattedAscending
          - formattedDescending
        percentMissing:
          type: number
          format: double
          description: The percentage of rows in the table that contain missing values
            for this variable.
        role:
          type: string
          description: The variable role.  The role identifies how the variable is
            used in data mining operations.
          enum:
          - input
          - target
          - rejected
          - id
          - partition
          - segment
          - assessment
          - prediction
          - residual
          - classification
          - text
          - key
          - timeId
          - filter
          - offset
          - exposure
          - geovar
        rootName:
          type: string
          description: The variable root name.
        skewness:
          type: number
          format: double
          description: The skewness for interval variables only. For class variables,
            '.' is displayed.  Skewness measures the amount of symmetry in the distribution.
        standardDeviation:
          type: number
          format: double
          description: The standard deviation for the variable's values.
        sumOfFrequencies:
          type: number
          format: double
          description: The sum of the frequency values for the variable.  This can
            be used to calculate the relative frequency of a particular value.
        transformationMethod:
          type: string
          description: The method to use for transforming the variable's values.
          enum:
          - default
          - none
          - logarithmic
          - logarithmicBase10
          - exponential
          - square
          - inverse
          - center
