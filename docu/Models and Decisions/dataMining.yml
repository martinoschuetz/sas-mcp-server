---
openapi: 3.0.3
info:
  description: The Data Mining API provides resources for training, scoring, and comparing
    data mining models.
  version: '7'
  title: Data Mining
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
tags:
- name: ProjectDataSource
  description: Contains the operations for working with tables in the project data
    source.
- name: Retraining
  description: Contains the operations for data mining project retraining.
- name: DefaultPipelineTemplate
  description: Contains the operations for managing default pipeline templates.
- name: Components
  description: Contains the operations for managing analytics components within data
    mining projects.
- name: Models
  description: Contains the operations for managing data mining models.
- name: Projects
  description: Contains the operations for managing data mining projects.
- name: Pipelines
  description: Contains the operations for managing data mining pipelines.
- name: VariableMetadata
  description: Contains the operations for managing a data mining project's variable
    metadata.
- name: AnalyticsProviderDetails
  description: Provides information to an analytics provider gateway when registering
    as an analytics provider.
- name: GlobalVariableMetadata
  description: Contains the operations for managing a user's global variable metadata.
- name: Root
  description: Contains the operations for the root resource.
- name: MacroVariableInformation
  description: Contains the operations for managing macro variable information.
- name: FileUpload
  description: Contains the operations for managing file uploads.
- name: ProjectSettings
  description: Contains the operations for managing data mining project settings.
paths:
  /:
    get:
      deprecated: true
      tags:
      - Root
      summary: Get a collection of all currently-usable links
      description: The API object contains a set of links for the supported endpoints.
        This endpoint has been deprecated and replaced by the GET /dataMiningProjectResources
        endpoint.
      operationId: root
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getRootResponse"
        '308':
          description: The request is redirected to a new permanent URL.
          headers:
            Location:
              description: Location of new permanent URL
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getRootResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/getRootResponse"
  '/projects/{projectId}/models/{modelId}/modelScoringSampleCode':
    head:
      deprecated: true
      x-sas-internal: true
      tags:
      - Models
      summary: Headers for Model score sample code
      description: Returns headers for sample code for scoring a model request.
      operationId: headersForModelScoreSampleCode
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      - name: modelId
        in: path
        description: modelId
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Accept
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: The type of code to return.
        required: false
        schema:
          type: string
          enum:
          - python
          - sas
          - rest
          default: python
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Disposition:
              description: The encoded filename.
              schema:
                type: string
        '400':
          description: The request is invalid.
        '404':
          description: The model or project does not exist.
    get:
      deprecated: true
      x-sas-internal: true
      tags:
      - Models
      summary: Model score sample code
      description: Returns sample code for scoring a model. This endpoint has been
        deprecated and replaced by the GET /dataMiningProjectResources/projects/{projectId}/models/{modelId}/modelScoringSampleCode
        endpoint.
      operationId: getModelScoreSampleCode
      parameters:
      - name: projectId
        in: path
        description: projectId
        required: true
        schema:
          type: string
      - name: modelId
        in: path
        description: modelId
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Accept
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: The type of code to return.
        required: true
        schema:
          type: string
          enum:
          - python
          - sas
          - rest
          default: python
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Disposition:
              description: The encoded filename.
              schema:
                type: string
          content:
            application/vnd.sas.source.text+json:
              schema:
                type: string
              examples:
                json:
                  $ref: "#/components/examples/scoreModelScoringSampleCodeResponse"
            application/octet-stream:
              schema:
                type: string
              examples:
                json:
                  $ref: "#/components/examples/scoreModelScoringSampleCodeResponse"
            application/json:
              schema:
                type: string
              examples:
                json:
                  $ref: "#/components/examples/scoreModelScoringSampleCodeResponse"
        '308':
          description: The request is redirected to a new permanent URL.
          headers:
            Location:
              description: Location of new permanent URL
              schema:
                type: string
          content:
            application/vnd.sas.source.text+json:
              schema:
                type: string
              examples:
                json:
                  $ref: "#/components/examples/scoreModelScoringSampleCodeResponse"
            application/json:
              schema:
                type: string
              examples:
                json:
                  $ref: "#/components/examples/scoreModelScoringSampleCodeResponse"
  '/projects/{projectId}/models/{modelId}/scoreExecutions':
    head:
      deprecated: true
      tags:
      - Models
      summary: Headers for Score the execution request
      description: Returns headers for score execution request.
      operationId: headersForCreateScoreModel
      parameters:
      - name: projectId
        in: path
        description: The identifier of the project.
        required: true
        schema:
          type: string
      - name: modelId
        in: path
        description: The identifier of the model.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
        '400':
          description: The model score request was invalid.
        '404':
          description: 'No project, model, or score table exists at the requested
            path.'
    post:
      deprecated: true
      tags:
      - Models
      summary: Score the execution request
      description: Scores a model using the Score Execution Service. This endpoint
        has been deprecated and replaced by the POST /dataMiningProjectResources/projects/{projectId}/models/{modelId}/scoreExecutions
        endpoint.
      operationId: createScoreModel
      parameters:
      - name: projectId
        in: path
        description: The identifier of the project.
        required: true
        schema:
          type: string
      - name: modelId
        in: path
        description: The identifier of the model.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelScoreRequest'
            examples:
              default:
                $ref: "#/components/examples/scoreModelRequest"
          application/vnd.sas.analytics.data.mining.model.score.request+json:
            schema:
              $ref: '#/components/schemas/modelScoreRequest'
            examples:
              default:
                $ref: "#/components/examples/scoreModelRequest"
        description: The modelScoreRequest schema.
        required: true
      responses:
        '201':
          description: The score execution request was created.
          headers:
            Location:
              description: The location of the newly-created resource.
              schema:
                type: string
            ETag:
              description: The entity tag for the response.
              schema:
                type: string
          content:
            application/vnd.sas.score.execution+json:
              schema:
                $ref: "#/components/schemas/scoreExecution"
              examples:
                default:
                  $ref: "#/components/examples/scoreModelResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/scoreExecution"
              examples:
                default:
                  $ref: "#/components/examples/scoreModelResponse"
        '400':
          description: The model score request was invalid.
          content:
            application/vnd.sas.score.execution+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/scoreModelBadRequestResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/scoreModelBadRequestResponse"
        '404':
          description: 'No project, model, or score table exists at the requested
            path.'
          content:
            application/vnd.sas.score.execution+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/scoreModelNotFoundResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/scoreModelNotFoundResponse"
  '/projects/{projectId}/retrainJobs':
    head:
      deprecated: true
      tags:
      - Retraining
      summary: Headers for Perform project retrain
      description: Returns headers for perform project retrain request.
      operationId: headersForCreatePerformRetraining
      parameters:
      - name: projectId
        in: path
        description: The identifier of the project.
        required: true
        schema:
          type: string
      - name: dataUri
        in: query
        description: The URL of the data table.
        required: true
        schema:
          type: string
      - name: action
        in: query
        required: false
        description: The retraining action.
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the retraining job.
              schema:
                type: string
            Content-Type:
              description: Type of returned content.
              schema:
                type: string
    post:
      deprecated: true
      tags:
      - Retraining
      summary: Perform project retrain
      description: Performs project retrain by passing a data table to use for retraining.
        If action=batch is set in the request, this API call performs all the operations
        required to retrain the project including running the pipelines. If not, retraining
        is initiated but the pipelines are not run. The response object contains the
        job created for performing retraining.
      operationId: createPerformRetraining
      parameters:
      - name: projectId
        in: path
        description: The identifier of the project.
        required: true
        schema:
          type: string
      - name: dataUri
        in: query
        description: The URL of the data table.
        required: true
        schema:
          type: string
      - name: action
        in: query
        required: false
        description: The retraining action.
        schema:
          type: string
      responses:
        '202':
          description: The project retrain request has been accepted for processing,
            but the processing has not been completed.
          headers:
            ETag:
              description: The entity tag for the retraining job.
              schema:
                type: string
            Location:
              description: The location of the retraining job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/performRetrainingResponse"
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/job"
              examples:
                json:
                  $ref: "#/components/examples/performRetrainingResponse"
        '400':
          description: The project retrain request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/performRetraining400Response"
            application/vnd.sas.job.execution.job+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/performRetraining400Response"
    put:
      deprecated: true
      tags:
      - Retraining
      summary: Set the retraining state
      description: Sets the retraining state for the project. The retraining state
        can be set as needed or completed. The response object contains the job created
        for performing the batch retraining.
      operationId: updateProjectRetrainingState
      parameters:
      - name: projectId
        in: path
        description: The identifier of the project.
        required: true
        schema:
          type: string
      - name: state
        in: query
        description: The state of the project retrain.
        required: true
        schema:
          type: string
          enum:
          - needed
          - completed
      - name: If-Match
        in: header
        description: The entity tag that was returned from a GET, POST, or PUT method
          of the project.
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          headers:
            ETag:
              description: The entity tag for the retraining state.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analyticsProject"
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingStateResponse"
            application/vnd.sas.analytics.project+json:
              schema:
                $ref: "#/components/schemas/analyticsProject"
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingStateResponse"
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingState400Response"
            application/vnd.sas.analytics.project+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingState400Response"
        '404':
          description: No project exists at the requested path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingState404Response"
            application/vnd.sas.analytics.project+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingState404Response"
        '412':
          description: The value supplied in the If-Match header did not match the
            expected value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingState412Response"
        '428':
          description: An If-Match header was not supplied on the update request.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                json:
                  $ref: "#/components/examples/updateProjectRetrainingState428Response"
  '/projects/{projectId}/retrainJobs/@currentJob':
    head:
