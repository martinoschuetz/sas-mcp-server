  /codeFiles/{codeFileId}/revisions:
    get:
      tags:
      - Code File Revisions
      summary: Get a collection of revisions of a code file
      description: Returns a collection of code file revisions based on the specified
        pagination, filtering, and sorting options. The items in the collection, depend
        on the `Accept-Item` header.
      operationId: getCodeFileRevisions
      parameters:
      - name: codeFileId
        description: The unique identifier for the code file.
        in: path
        required: true
        schema:
          type: string
        example: 981ac81f-ad95-46ae-a101-6846683364c5
      - name: Accept-Item
        description: Used for selecting the desired item representation.
        in: header
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.decision.code.file+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.dcm.summary+json
          default: application/vnd.sas.summary+json
        example: application/vnd.sas.decision.code.file+json
      - name: start
        description: The index of the first code file to return.
        in: query
        schema:
          type: integer
          format: int64
          default: 0
        example: 100
      - name: limit
        description: The maximum number of code files to return.
        in: query
        schema:
          type: integer
          format: int32
          default: 20
        example: 500
      - name: filter
        in: query
        description: The criteria for filtering the code files. See [Filtering in
          REST APIs](https://developer.sas.com/rest-apis/decisions/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: filter-criteria
        example: gt(modifiedTimeStamp, '2021-05-03T15:38:45.654Z')
      - name: sortBy
        in: query
        description: The criteria for sorting the code files. See [Sorting in REST
          APIs](https://developer.sas.com/rest-apis/decisions/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
          format: sort-criteria
        example: modifiedTimeStamp:descending
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.collection+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/resourceSummaryCollection"
                - $ref: "#/components/schemas/codeFileCollection"
                - $ref: "#/components/schemas/revisionSummaryCollection"
              examples:
                application/vnd.sas.summary+json:
                  $ref: "#/components/examples/resourceSummaryOfDecisionCodeFileRevisions"
                application/vnd.sas.decision.code.file+json:
                  $ref: "#/components/examples/fullDetailsOfDecisionCodeFileRevisions"
                application/vnd.sas.dcm.summary+json:
                  $ref: "#/components/examples/revisionSummaryOfDecisionCodeFileRevisions"
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/resourceSummaryCollection"
                - $ref: "#/components/schemas/codeFileCollection"
                - $ref: "#/components/schemas/revisionSummaryCollection"
              examples:
                application/vnd.sas.summary+json:
                  $ref: "#/components/examples/resourceSummaryOfDecisionCodeFileRevisions"
                application/vnd.sas.decision.code.file+json:
                  $ref: "#/components/examples/fullDetailsOfDecisionCodeFileRevisions"
                application/vnd.sas.dcm.summary+json:
                  $ref: "#/components/examples/revisionSummaryOfDecisionCodeFileRevisions"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
    post:
      tags:
      - Code File Revisions
      summary: Create a code file revision
      description: Creates a new code file revision based on the representation in
        the request body.
      operationId: createCodeFileRevision
      parameters:
      - name: codeFileId
        description: The unique identifier for the code file.
        in: path
        required: true
        schema:
          type: string
        example: 981ac81f-ad95-46ae-a101-6846683364c5
      - name: revisionType
        in: query
        required: false
        description: Valid values are `major` or `minor`. This value determines how
          the server generates the `major` and `minor` numbers. If a `major` number
          is provided, the next available major version number is started. For example,
          if the code file has revisions 1.0, 1.1, 1.2, 2.0, and 2.1, creating a new
          major revision results in 3.0. If a `minor` number is provided, then the
          next available minor revision number is reserved based on the existing revisions.
          For example, if the existing revisions have `major` and `minor` numbers
          of 1.1, 1.2, 1.3, 2.1, 2.2, and a user requests a new minor revision, then
          2.3 is assigned. This parameter defaults to `minor` if not supplied.
        schema:
          type: string
          enum:
          - major
          - minor
        example: major
      - name: fromRevisionUri
        in: query
        description: This value specifies the URI of the code file revision from which
          the new code file revision is created. This property enables you to trace
          the lineage of a code file. The valid format for this parameter is '/decisions/codeFiles/${codeFileId}/revisions/${revisionId}'
        schema:
          type: string
          format: /decisions/codeFiles/{codeFileId}/revisions/{revisionId}
        example: /decisions/codeFiles/981ac81f-ad95-46ae-a101-6846683364c5/revisions/cd942f3c-60a0-4b16-9184-4cb8921fb0eb
      requestBody:
        content:
          application/vnd.sas.decision.code.file+json:
            schema:
              $ref: "#/components/schemas/codeFile"
            examples:
              default:
                $ref: "#/components/examples/createOrUpdateDecisionCodeFile"
          application/vnd.sas.decision.code.file.with.code+json:
            schema:
              $ref: "#/components/schemas/codeFileWithCode"
            examples:
              default:
                $ref: "#/components/examples/createOrUpdateDecisionCodeFileWithCode"
          application/json:
            schema:
              $ref: "#/components/schemas/codeFile"
            examples:
              default:
                $ref: "#/components/examples/createOrUpdateDecisionCodeFile"
        description: The details of the code file revision that needs to be created.
        required: true
      responses:
        "201":
          description: A code file revision was created.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Location:
              description: The URL of the code file revision.
              schema:
                type: string
              example: /decisions/codeFiles/981ac81f-ad95-46ae-a101-6846683364c5/revisions/cd942f3c-60a0-4b16-9184-4cb8921fb0eb
            ETag:
              description: The entity tag for the code file revision.
              schema:
                type: string
              example: '"kknyjgku"'
            Last-Modified:
              description: The timestamp in the format `EEE, dd MMM yyyy HH:mm:ss
                GMT` for when the code file revision was last modified.
              schema:
                type: string
              example: Thu, 06 May 2021 21:37:00 GMT
          content:
            application/vnd.sas.decision.code.file+json:
              schema:
                $ref: "#/components/schemas/codeFile"
              examples:
                default:
                  $ref: "#/components/examples/fullDetailsOfDecisionCodeFileRevision"
            application/json:
              schema:
                $ref: "#/components/schemas/codeFile"
              examples:
                default:
                  $ref: "#/components/examples/fullDetailsOfDecisionCodeFileRevision"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
