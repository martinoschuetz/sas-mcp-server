      title: Decision Variable Collection
      description: A collection of variables for a decision.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/term"
    decisionValidationErrorsCollection:
      title: Decision Validation Errors Collection
      description: A collection of validation errors for a decision.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/validationError"
    decisionNodeTypeCollection:
      title: Decision Node Types Collection
      description: A paginated list of decision node type representations, with optional
        links to first, prev, next, and last page of the collection.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/decisionNodeType"
            description: An array, which consists of one page of decision node type
              resources.
    termSummaryCollection:
      title: Term Usage Summary Collection
      description: An un-paginated list of term usage summaries.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/termUsageSummary"
            description: An array, which consists of term usage summaries.
    decisionErrorMarkerCollection:
      title: Decision Error Marker Collection
      description: A collection of error markers for a decision scoring test.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/errorMarker"
            description: An array, which consists of decision scoring error markers.
    tagMergeDecisionComponentCollection:
      title: Tag Merge Decision Component Collection
      description: An un-paginated list of tag merge decision components.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/tagMergeDecisionComponent"
            description: An array, which consists of tag merge decision components.
    directDependentObjects:
      title: Direct Dependent Objects
      description: The object contains an unpaginated list of URIs of the direct dependents
        of this resource. A resource can be a decision or a code file.
      required:
      - uri
      - name
      - dependentUris
      properties:
        uri:
          type: string
          description: The URI of the resource.
        name:
          type: string
          description: The name of the resource.
        dependencies:
          type: array
          description: A list of URIs for each direct dependency of this resource.
          items:
            type: string
    decisionTypeCollection:
      title: Decision Type Collection
      description: A paginated list of decision type representations, with optional
        links to first, prev, next, and last page of the collection.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/decisionType"
            description: An array, which consists of one page of decision type resources.
    expressionError:
      title: CAS Error from Expression Validation
      description: The error reported from CAS while validating the expression.
      properties:
        errorCode:
          type: integer
          description: The error code that is returned from CAS when validating.
        message:
          type: string
          description: The error message that is returned from CAS when validating.
        httpStatusCode:
          type: integer
          description: The HTTP status code that is returned from CAS when validating.
        version:
          type: integer
          description: The version that is returned from CAS when validating.
    expressionValidationResponse:
      title: Decision Expression Validation Response
      description: The response from validating the expression.
      required:
      - valid
      properties:
        valid:
          type: boolean
          description: True if the expression is valid, and false if the expression
            is not valid.
        error:
          $ref: "#/components/schemas/expressionError"
    decision:
      title: Decision
      description: The representation of a decision.
      required:
      - name
      - signature
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The string ID for the decision.
        name:
          type: string
          description: The name for the decision.
        type:
          type: string
          description: The decision type.
        description:
          type: string
          description: The description for the decision.
        pythonVersion:
          type: string
          description: The version of Python to use when publishing Python code to
            a container destination.
        majorRevision:
          type: integer
          readOnly: true
          description: The major version number of the revision that is being viewed
            for the decision. This value is assigned by the service. When creating
            a new revision, the user can control only whether the major or minor number
            is incremented.
        checkout:
          type: boolean
          readOnly: true
          description: >
            An indicator for whether the decision is a user's working copy of another
            decision.
        locked:
          type: boolean
          readOnly: true
          description: An indicator for whether the content that is being viewed is
            locked or editable.
        minorRevision:
          type: integer
          readOnly: true
          description: The minor version number of the current revision of the decision.
            This value is assigned by the service. When creating a new revision, the
            user only has control of whether the major or minor number is incremented.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp for when the decision was created.
        createdBy:
          type: string
          readOnly: true
          description: The ID of the user who created the decision.
        modifiedTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp for when the decision properties were modified.
        modifiedBy:
          type: string
          readOnly: true
          description: The ID of the user who modified the decision.
        nodeCount:
          type: integer
          readOnly: true
          description: The total number of decision steps (nodes) in the decision
            flow.
        sourceRevisionUri:
          type: string
          readOnly: true
          description: The URI of the decision revision from which this decision is
            being created.
        copyTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp for when the decision revision was copied.
        flow:
          $ref: "#/components/schemas/flow"
        signature:
          type: array
          items:
            $ref: "#/components/schemas/term"
          description: The set of terms local to this decision with input and output
            behavior.
        subjectLevel:
          type: string
          description: An indicator for the type of subject ID.
        subjectId:
          description: The reference for the term that is used to identify the subject.
          type: object
          required:
          - name
          - signature
          properties:
            id:
              type: string
              description: The ID for the signature term.
            name:
              type: string
              description: The name of the term that is being referenced within the
                object's signature.
        folderType:
          type: string
          readOnly: true
          description: An indicator for the type of folder where the decision is located.
        properties:
          type: object
          description: The properties that are associated with the decision.
          additionalProperties:
            type: string
        customContextUri:
          type: string
          description: The URI of a Custom Context DS2 code file that serves as the
            decision's custom context.
        customContextMicroAnalyticServiceUri:
          type: string
          description: The URI of a Custom Context DS2 code file that serves as the
            decision's custom context when it is published to a SAS Micro Analytic
            Service destination. If there is no distinction in functionality from
            other destinations, there is no need to provide an override.
        validatedBy:
          type: string
          readOnly: true
          description: The ID of the user who validated the decision.
        validationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: A timestamp for when the decision was validated.
        validationStatus:
          type: string
          format: enumeration
          enum:
          - none
          - complete
          - incomplete
          readOnly: true
          description: >
            The validation status:
              * `none` - Validation was not performed.
              * `complete` - Validation was completed.
              * `incomplete` - Validation could not be completed because some of the
            resources are not available.
        hasErrors:
          type: boolean
          readOnly: true
          description: An indicator for whether the decision has errors. This flag
            does not include errors in sub-decisions.
        hasErrorsInSubDecisions:
          type: boolean
          readOnly: true
          description: An indicator for whether a sub-decision within this decision
            has errors.
        hasWarnings:
          type: boolean
          readOnly: true
          description: An indicator for whether the decision has warnings. This flag
            does not include warnings in sub-decisions.
        hasWarningsInSubDecisions:
          type: boolean
          readOnly: true
          description: An indicator for whether a sub-decision within this decision
            has warnings.
        links:
          type: array
          readOnly: true
          description: The links to related resources or operations.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          readOnly: true
          description: The version number of the domain representation. This representation
            is version 1.
    term:
      title: Decision Condition Term
      description: Represents a term that is used for a condition comparison within
        a decision.
      required:
      - name
      - dataType
      - direction
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The system-assigned unique ID for this object
        name:
          type: string
          description: Name of the term that can be referenced. Term names must be
            unique within a rule set.
        description:
          type: string
          description: Description of the term
        defaultValue:
          type: object
          description: The initial value of the term.
        length:
          type: integer
          description: Suggested length for use when generating code.
        createdBy:
          type: string
          readOnly: true
          description: The user who created the term.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The date and time that the term was created.
        modifiedBy:
          type: string
          readOnly: true
          description: The user ID of the authenticated user who last updated the
            term.
        modifiedTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The date and time that the term was last modified.
        dataType:
          type: string
          description: The type of data that the term is intended to be used with.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
          - date
          - datetime
          - dataGrid
        direction:
          type: string
          description: >
            Declaration of how the data is to be used during execution. It indicates
            if the data should be used as input,
            output, both input and output, or none if the term is only for internal
            rule
            set usage.
          format: enumeration
          enum:
          - input
          - output
          - inOut
          - none
        dataGridExtension:
          type: array
          items:
            $ref: "#/components/schemas/termExtension"
        generateDataGridColumns:
          type: boolean
          description: >
            Each row in a data grid variable normally contains metadata that defines
            the columns
            in the data grid and the data for each column.Depending on the data types
            and number
            of columns in the data grid, the metadata can increase the size of the
            data grid considerably.
            To exclude the metadata from each row in the data grid, populate this
            option as true as the
            application depends on the column definitions that you enter when you
            define the variable.
            Ensure that the column definition is correct for each column in the data
            grid variable.
            If the column definitions do not match the input data, the application
            cannot load the data.
        legacy:
          type: boolean
          description: the flag of legacy variable.
    segmentationTree:
      title: Segmentation Tree
      description: The representation of a segmentation tree.
      required:
      - name
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The string ID for the segmentation tree.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp for when the segmentation tree was created.
        createdBy:
          type: string
          readOnly: true
          description: The ID of the user who created the segmentation tree.
        modifiedTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp for when the segmentation tree properties were
            modified.
        modifiedBy:
          type: string
          readOnly: true
          description: The ID of the user who modified the segmentation tree.
        name:
          type: string
          description: The name for the segmentation tree.
          maxLength: 100
        description:
          type: string
          description: The description for the segmentation tree.
          maxLength: 1000
        majorRevision:
          type: integer
          readOnly: true
          description: The major version number of the current revision of the segmentation
            tree. This value is assigned by the service. The user only has control
            of whether the major number or minor number is incremented when creating
            a new revision.
        minorRevision:
          type: integer
          readOnly: true
          description: The minor version number of the current revision of the segmentation
            tree. This value is assigned by the service. The user only has control
            of whether the major number or minor number is incremented when creating
            a new revision.
        locked:
          type: boolean
          readOnly: true
          description: A flag that indicates whether the content that is being viewed
            is locked or editable.
        folderType:
          type: string
          readOnly: true
          description: The type of folder where the segmentation tree is located.
        checkout:
          type: boolean
          readOnly: true
          description: A flag that indicates whether the segmentation tree is a user's
            working copy of another segmentation tree.
        sourceRevisionUri:
          type: string
          readOnly: true
          description: The URI of the segmentation tree revision from which this segmentation
            tree is being created.
        revisionId:
          type: string
          readOnly: true
          description: The string ID for a segmentation tree revision. This string
            is available only if the operation that returns this object has to handle
            a revision.
        revisionUri:
          type: string
          readOnly: true
          description: The URI for a segmentation tree revision. This is available
            only if the operation that returns this object has to handle a revision.
        copyTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp for when the segmentation tree revision was copied.
        signature:
          type: array
          items:
            $ref: "#/components/schemas/signatureTerm"
          description: The set of terms that are local to this segmentation tree with
            input and output behavior.
        codeFiles:
          type: array
          items:
            anyOf:
            - $ref: "#/components/schemas/internalCodeFile"
          description: The code files that are associated with this segmentation tree.
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/outcome"
          description: The outcomes that are associated with this segmentation tree.
        matrices:
          type: array
          items:
            $ref: "#/components/schemas/matrix"
          description: The matrices that are associated with this segmentation tree.
        booleanExpressions:
          type: array
          items:
            $ref: "#/components/schemas/booleanExpression"
          description: The Boolean expressions that are associated with this segmentation
            tree.
        node:
          anyOf:
          - $ref: "#/components/schemas/variableNode"
          - $ref: "#/components/schemas/booleanExpressionNode"
          - $ref: "#/components/schemas/matrixNode"
          description: The root node that is associated with this segmentation tree.
        links:
          type: array
          readOnly: true
          description: Links to related resources or operations.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          readOnly: true
          description: The version number of the domain representation. This representation
            is version 1.
    analysisCode:
      title: Analysis Code
      description: Analysis Code generated by a Score Object using Score Execution.
        This represents application/vnd.sas.score.analysis.code media type (version
        1).
      required:
      - code
      - codeType
      - outputTableName
      - outputLibraryName
      properties:
        code:
          type: string
          description: Executable code generated by a Score Object.
        codeType:
          type: string
          format: media-type
          description: Type of the code.
        outputTableName:
          type: string
          description: Name of the table that will be generated when the generated
            code is executed.
        outputLibraryName:
          type: string
          description: Name of the library where the table will be generated when
            the code is executed.
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
    termUsageSummary:
      title: Term Usage Summary
      description: A summary representation of a term and it's usage.
      required:
      - parentName
      - parentUri
      - name
      - dataType
      - direction
      type: object
      properties:
        parentName:
          type: string
          readOnly: true
          description: The name of the parent resource that contains the term.
        parentUri:
          type: string
          readOnly: true
          description: The uri of the parent resource that contains the term.
        name:
          type: string
          readOnly: true
          description: The name of the term.
        dataType:
          type: string
          readOnly: true
          description: The data type of the term.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
          - date
          - datetime
          - dataGrid
        direction:
          type: string
          readOnly: true
          description: >
            Declaration of how the term is to be used during execution. It indicates
            if the term should be used as input,
            output, both input and output, or none if the term is only used internally.
          format: enumeration
          enum:
          - input
          - output
          - inOut
          - none
    validationError:
      title: Decision Validation Error
      description: The representation of a decision validation error or warning.
      required:
      - decisionId
      - decisionRevisionId
      - decisionName
      type: object
      properties:
        decisionId:
          type: string
          readOnly: true
          description: An identifier for the decision that has the validation error
            or warning.
        decisionRevisionId:
          type: string
          readOnly: true
          description: An identifier for the decision that has the validation error
            or warning.
        decisionName:
          type: string
          readOnly: true
          description: The name of the decision that has the validation error or warning.
        itemType:
          type: string
          readOnly: true
          format: enumeration
          enum:
          - mapping
          - variable
          - application/vnd.sas.decision.step.branch
          - application/vnd.sas.decision.step.condition
          - application/vnd.sas.decision.step.custom.object
          - application/vnd.sas.decision.step.model
          - application/vnd.sas.decision.step.node.link
          - application/vnd.sas.decision.step.record.contact
          - application/vnd.sas.decision.step.ruleset
          description: >
            The type of the item for which an error or warning is reported:
              * `mapping                                          ` - Error in mapping.
              * `variable                                         ` - Error in variable.
              * `application/vnd.sas.decision.step.branch         ` - Error in branch
            step.
              * `application/vnd.sas.decision.step.condition      ` - Error in condition
            step.
              * `application/vnd.sas.decision.step.custom.object  ` - Error in custom
            object step.
              * `application/vnd.sas.decision.step.model          ` - Error in model
            step.
              * `application/vnd.sas.decision.step.node.link      ` - Error in node
            link step.
              * `application/vnd.sas.decision.step.record.contact ` - Error in record
            contact step.
              * `application/vnd.sas.decision.step.ruleset        ` - Error in ruleset
            step.
        variableId:
          type: string
          readOnly: true
          description: An identifier for the decision variable that has the validation
            error or warning when `itemType` is `variable`.
        variableName:
          type: string
          readOnly: true
          description: The name of the decision variable that has the validation error
            or warning when `itemType` is `variable`.
        stepId:
          type: string
          readOnly: true
          description: An identifier for the decision step that has the validation
            error or warning when `itemType` is related to the decision step.
        stepName:
          type: string
          readOnly: true
          description: The name of the decision step that has the validation error
            or warning when `itemType` is related to the decision step.
        stepMappingId:
          type: string
          readOnly: true
          description: An identifier for the decision step mapping that has the validation
            error or warning when `itemType` is `mapping`.
        stepMappingName:
          type: string
          readOnly: true
          description: The name of the decision step mapping that has the validation
            error or warning when `itemType` is `mapping`.
        errorCode:
          type: integer
          enum:
          - 77021
          - 77022
          - 77023
          - 77024
          - 77025
          - 77030
          description: >
            The error code for this validation error:
              * `77021` - Signature is changed.
              * `77022` - Item is not activated.
              * `77023` - Error accessing an uri.
              * `77024` - Error in mapping.
              * `77025` - Error inside an object.
              * `77030` - Warning inside an object.
        errorMessage:
          type: string
          description: The error message for this validation error or warning.
        validationSeverity:
          type: string
          description: An indicator for whether the validation issue is an error or
            a warning.
        statusCode:
          type: integer
          description: The HTTP status code for this validation error. The code populates
            when the error is related to an HTTP call.
    errorMarker:
      title: Decision Error Marker
      description: Represents where an error occurred during execution of a decision
        scoring test.
      type: object
      properties:
        stepId:
          type: string
          description: The ID of the decision step that caused the error.
        stepName:
          type: string
          description: The name of the decision step that caused the error.
        objectUri:
          type: string
          description: The URI of the object referenced by the decision step.
        errors:
          type: array
          description: List of decision step error messages.
          items:
            $ref: "#/components/schemas/errorMarkerMessage"
        warnings:
          type: array
          description: List of decision step warnings messages.
          items:
            $ref: "#/components/schemas/errorMarkerMessage"
        version:
          type: integer
          readOnly: true
          description: The version number of the domain representation. This representation
            is version 1.
    decisionNodeReferenceObject:
      title: Decision Node Reference Object
      description: The representation of a rule set, model, treatment group, code
        file, or sub-decision used in a decision flow, including those used by sub-decisions.
      required:
      - id
      - name
      - type
      - activeVersionReference
      - referenceList
      properties:
        id:
          type: string
          readOnly: true
          description: The string ID for the decision node reference object.
        name:
          type: string
          description: The name of the decision node reference object.
        type:
          type: string
          description: The media type of the decision node reference object.
        versionId:
          type: string
          description: The string ID for the version of the decision node reference
            object.
        versionName:
          type: string
          description: The referenced object's version name.
        activeVersionReference:
          type: boolean
          description: Specifies whether decision node reference object is set to
            use the active version rather than a specific version.
        referenceList:
          type: array
          items:
            $ref: "#/components/schemas/referencingDecision"
          description: The decisions that reference the decision node reference object,
            including the parent decision and any sub-decisions.
    tagMergeDecisionComponent:
      title: Tag Merge Decision Component
      description: Represents an individual decision component to be included in a
        tag based merge.
      type: object
      properties:
        uri:
          type: string
          readOnly: true
          description: The uri of the decision component.
        name:
          type: string
          readOnly: true
          description: The name of the decision component.
        modifiedTimeStamp:
          type: string
          readOnly: true
          format: date-time
          description: The time stamp of when the latest version of the decision component
            was last modified.
        parentDecisions:
          type: array
          description: The list of the decisions this individual component is contained
            in, under the context of the decision being merged.
          items:
            $ref: "#/components/schemas/parentDecision"
        revisions:
          type: array
          description: The list of revisions of the decision component that are candidates
            to be included in the tag based merge.
          items:
            $ref: "#/components/schemas/revisionReference"
        version:
          type: integer
          readOnly: true
          description: >
            This media type's schema version number. This representation is
            version 1.
    codeFileWithCode:
      title: Code File
      description: |
        A code file that accepts its code as a property. This represents
        application/vnd.sas.decision.code.file.with.code media type (version 1).

        This variant of code file is useful for creating a code file revision without
        managing the creation of the underlying file resources used to store the code.
      required:
      - type
      - code
      properties:
        id:
          type: string
          readOnly: true
          description: The system-assigned unique ID for this object
        name:
          type: string
          description: The code file name
        description:
          type: string
          description: The code file description
        createdBy:
          type: string
          readOnly: true
          description: The user who created the code file.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The date and time that the code file was created.
        modifiedBy:
          type: string
          description: The user ID of the authenticated user who last updated the
            code file.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The date and time that the code file was last modified.
        majorRevision:
          type: integer
          readOnly: true
          description: Major version number of the revision being viewed of the code
            file. This value is assigned by the service, the user only has control
            on whether the major number or minor number is incremented when creating
            a new revision. This is a derived field that is generated on POST.
        minorRevision:
          type: integer
          readOnly: true
          description: Minor version number of the current revision of the code file.
            This value is assigned by the service, the user only has control on whether
            the major number or minor number is incremented when creating a new revision.
            This is a derived field that is generated on POST.
        checkout:
          type: boolean
          readOnly: true
          description: >
            Flag indicating that the code file is the user's working copy of another
            code file.
        locked:
          type: boolean
          readOnly: true
          description: Flag which indicates whether the content of the revision being
            viewed is locked or editable.
        type:
          type: string
          format: enumeration
