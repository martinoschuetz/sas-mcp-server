          type: string
          format: enumeration
          enum:
          - decisionCustomContextDS2CodeFile
          - decisionDS2CodeFile
          - decisionSQLCodeFile
          - decisionPythonFile
          description: Type of the code.
        status:
          type: string
          format: enumeration
          readOnly: true
          enum:
          - valid
          - error
          description: Status of the code content.
        errorCode:
          type: integer
          readOnly: true
          description: Error code when parsing code content.
        errorMessage:
          type: string
          readOnly: true
          description: Error message when parsing code content.
        signature:
          type: array
          description: Array of signature terms.
          items:
            $ref: "#/components/schemas/codeFileSignatureTerm"
        folderType:
          type: string
          readOnly: true
