        name:
          type: string
          description: The code file name.
        description:
          type: string
          description: The code file description.
        createdBy:
          type: string
          readOnly: true
          description: The user who created the code file.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The date and time that the code file was created.
        modifiedBy:
          type: string
          description: The user ID of the authenticated user who last updated the
