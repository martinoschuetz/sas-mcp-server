    parentDecision:
      title: Tag Merge Component Parent Decision
      description: Represents the parent decision associated with the decision component
      type: object
      properties:
        name:
          type: string
          description: The name of the decision.
        uri:
          type: string
          description: The uri of the decision revision.
    decisionStepCodeSignatureTerm:
      title: Decision Step Code Signature Term
      description: Terms that are a part of the signature for the object that is used
        in a decision step.
      required:
      - name
      - dataType
      - direction
      properties:
        name:
          type: string
          description: The name of the object used in a decision step.
        dataType:
          type: string
          description: Data type of the term.
          enum:
          - string
          - decimal
          - integer
          - dataGrid
          - date
          - datetime
          - unknown
        direction:
          type: string
          description: Direction of the term.
        length:
          type: integer
          description: Length of the term.
        dataGridExtension:
          type: array
          items:
            $ref: "#/components/schemas/decisionStepCodeSignatureTermDataGridExtension"
          description: Metadata information about data grid columns.
    matrixNode:
      title: Segmentation Tree Matrix Node
      description: A segmentation tree node with a matrix.
      required:
      - type
      - variableName
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The ID for the segmentation tree node.
        label:
          type: string
          maxLength: 100
          description: The label for the segmentation tree node.
        type:
          type: string
          description: The type of node that is being referenced within the segmentation
            tree.
          format: enumeration
          enum:
          - matrix
        valueNodes:
          type: array
          items:
            $ref: "#/components/schemas/valueNode"
          description: The list of value nodes, which should be unique.
        matrixName:
          type: string
          maxLength: 100
          description: The name of the matrix, which should exist in the segmentation
            tree signature.
    errorMarkerMessage:
      title: Decision Error Marker Message
      description: Represents an error that occurred during execution of a decision
        scoring test
      type: object
      properties:
        errorLineNumber:
          type: integer
          format: int32
          description: The line number where the error occurred
        errorMessage:
          type: string
          description: The error message
    booleanExpression:
      title: Segmentation Tree Boolean Expression
      description: A named expression, which evaluates to a Boolean value.
      required:
      - name
      - expression
      type: object
      properties:
        name:
          type: string
          description: The name of the Boolean expression, which must be unique within
            a segmentation tree.
        description:
          type: string
          description: The description for this Boolean expression.
          maxLength: 1000
        expression:
          type: string
          maxLength: 1000
          description: Code which evaluates to a Boolean value.
    variableNode:
      title: Segmentation Tree Variable Node
      description: A node with a variable.
      required:
      - type
      - variableName
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The ID for the segmentation tree node.
        label:
          type: string
          maxLength: 100
          description: The label for the segmentation tree node.
        type:
          type: string
          description: The type of node that is being referenced within the segmentation
            tree.
          format: enumeration
          enum:
          - variable
        valueNodes:
          type: array
          items:
            $ref: "#/components/schemas/valueNode"
          description: The list of value nodes, which should be unique.
        variableName:
          type: string
          maxLength: 100
          description: The name of the variable, which should exist in the segmentation
            tree signature.
        valueListId:
          type: string
          maxLength: 36
          description: The ID of a value list. Value nodes should be based on the
            values inside this value list. If not provided, a variable's value list
            is used.
        valueListContentId:
          type: string
          maxLength: 36
          description: The ID of a value list's content. Value nodes should be based
            on the values inside this value list content.
    internalCodeFile:
      title: Segmentation Tree Internal Code File
      description: A code file, which is internal to the segmentation tree.
      required:
      - type
      - name
      - code
      type: object
      properties:
        type:
          type: string
          description: The type of code file that is used in the segmentation tree.
          enum:
          - internal
        name:
          type: string
          description: The name of the code file, which must be unique within a segmentation
            tree.
          maxLength: 100
        description:
          type: string
          description: The description for this code file.
          maxLength: 1000
        code:
          type: string
          description: The code that needs to be executed to assign values to variables.
        sourceUri:
          type: string
          description: The URI of the code file from which the code is imported.
    signatureTerm:
      title: Segmentation Tree Signature Term
      description: A term that is used within a segmentation tree.
      required:
      - name
      - dataType
      - direction
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: The name of the term that can be referenced, which must be
            unique within a segmentation tree.
        description:
          type: string
          maxLength: 1000
          description: The description of the term.
        length:
          type: integer
          description: The suggested length for use when generating code.
        dataType:
          type: string
          description: The type of data with which the term is intended to be used.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
          - boolean
          - date
          - datetime
          - dataGrid
        direction:
          type: string
          description: >
            A declaration of how the data should be used during execution. Data can
            be used as input, output, both input and output, or none for internal
            use only.
          format: enumeration
          enum:
          - input
          - output
          - inOut
          - none
        valueListId:
          type: string
          description: The value list ID for the values and ranges that are compared
            with the variable.
          maxLength: 36
        valueListContentId:
          type: string
          description: The value list content ID for the values and ranges that are
            compared with the variable.
          maxLength: 36
        localValueListName:
          type: string
          description: The local value list name for values and ranges that are compared
            with the variable.
          maxLength: 100
        defaultValue:
          oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
          description: The initial value of the term.
    outcome:
      title: Segmentation Tree Outcome
      description: An outcome, which contains the actions to assign values to variables.
      required:
      - name
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: The name of the outcome, which must be unique within the segmentation
            tree.
        description:
          type: string
          description: The description for this outcome.
          maxLength: 1000
        actions:
          type: array
          items:
            anyOf:
            - $ref: "#/components/schemas/variableAssignmentOutcomeAction"
            - $ref: "#/components/schemas/codeAssignmentOutcomeAction"
          description: The actions that are associated with this outcome.
    revisionReference:
      title: Tag Merge Component Revision Reference
      description: Represents the revision for the component that has the specified
        tags associated with it
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The revision id for the decision
        majorRevision:
          type: integer
          readOnly: true
          description: Major version number of the revision being viewed of the decision.
        minorRevision:
          type: integer
          readOnly: true
          description: Minor version number of the revision being viewed of the decision.
        tags:
          type: array
          readOnly: true
          description: List of tags associated with this revision.
          items:
            type: string
    termMapping:
      title: Mapping
      description: Assigning Input Data column to a variable of the generated Mapped
        Code of Score Object. This doesn't represent any top-level media type.
      required:
      - variableName
      - mappingType
      properties:
        variableName:
          type: string
          description: Name of the Score Object's variable.
        mappingType:
          description: The mapping type.
          type: string
          format: enumeration
          enum:
          - datasource
          - static
          - expected
        mappingValue:
          anyOf:
          - type: integer
          - type: number
          - type: array
          - type: boolean
          - type: object
          - type: string
          description: Value that is assigned to Score Object's variable. If the mappingType
            is dataSource then this should be column name of the Input Data. If the
            mappingType is static then this should be a constant value. If the mappingType
            is expected then this is the expected value of the output and it is always
            constant. Required if the mappingType is datasource.
    flow:
      title: Decision Flow
      description: The representation of a decision flow.
      required:
      - name
      - signature
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The string ID for the decision flow.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the decision flow was created.
        createdBy:
          type: string
          readOnly: true
          description: The user ID who created the decision flow.
        modifiedTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the decision flow properties was modified.
        modifiedBy:
          type: string
          readOnly: true
          description: The user ID who modified the decision flow.
        steps:
          type: array
          description: The sequence of rule sets, models, custom objects, branches,
            and conditions that represent the decision-making flow object.
          items:
            anyOf:
            - $ref: "#/components/schemas/decisionRuleSetStep"
            - $ref: "#/components/schemas/decisionModelStep"
            - $ref: "#/components/schemas/decisionCustomObjectStep"
            - $ref: "#/components/schemas/decisionRecordContactStep"
            - $ref: "#/components/schemas/decisionNodeLinkStep"
            - $ref: "#/components/schemas/decisionConditionStep"
            - $ref: "#/components/schemas/decisionBranchStep"
    booleanExpressionNode:
      title: Segmentation Tree Boolean Expression Node
      description: The node that contains a Boolean expression.
      required:
      - type
      - booleanExpressionName
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The ID for the segmentation tree node.
        label:
          type: string
          maxLength: 100
          description: The label for the segmentation tree node.
        type:
          type: string
          description: The type of node that is being referenced within the segmentation
            tree.
          format: enumeration
          enum:
          - booleanExpression
        valueNodes:
          type: array
          items:
            $ref: "#/components/schemas/valueNode"
          description: The list of value nodes. The value for the value node should
            be either 'true' or 'false'.
        booleanExpressionName:
          type: string
          description: The name of the Boolean expression that should exist in the
            segmentation tree signature.
          maxLength: 100
    termExtension:
      title: Signature Term Extension
      description: Signature Term Extension is used to store the column information
        of a DataGrid variable.
      required:
      - name
      - dataType
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: The name of the term that can be referenced. Term names must
            be unique within a rule set.
        length:
          type: integer
          description: The suggested length for use when generating code.
        autoPopulate:
          type: boolean
          description: >
            When this flag value is set to true, the code that is generated by the
            application calls the appropriate data function to create the new column
            that you added to the metadata at runtime.
        dataType:
          type: string
          description: The type of data that the term is intended to be used with.
            Terms can be loosely typed with the 'any' type, this type is only assigned
            by the service when rules POST'ed with 'createVariables=true' and no type
            can be determined.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
          - date
          - datetime
    matrix:
      title: Segmentation Tree Matrix
      description: A two-dimensional array with down and across variable values and
        their intersection outcomes.
      required:
      - name
      - downVariableName
      - downVariableValues
      - acrossVariableName
      - acrossVariableValues
      - outcomes
      type: object
      properties:
        name:
          type: string
          description: The name of the matrix, which must be unique within a segmentation
            tree.
          maxLength: 100
        description:
          type: string
          description: The description for this matrix.
          maxLength: 1000
        downVariableName:
          type: string
          description: The name of the down variable, which should exist in the segmentation
            tree signature.
        downVariableValueListId:
          type: string
          description: The value list ID for the different values that are used by
            the down variable within the matrix.
          minLength: 36
          maxLength: 36
        downVariableValueListContentId:
          type: string
          description: The value list content ID for different values that are used
            by the down variable within the matrix.
          minLength: 36
          maxLength: 36
        downVariableLocalValueListName:
          type: string
          description: The local value list name for values that are used by the down
            variable within the matrix.
          minLength: 1
          maxLength: 100
        downVariableValues:
          type: array
          minLength: 1
          items:
            anyOf:
            - type: integer
            - type: number
            - type: boolean
            - type: string
          description: The values for the down variable, which must be unique.
        acrossVariableName:
          type: integer
          description: The name of the across variable, which should exist in the
            segmentation tree signature.
        acrossVariableValueListId:
          type: string
          description: The value list ID for the different values that are used by
            the across variable within the matrix.
          minLength: 36
          maxLength: 36
        acrossVariableValueListContentId:
          type: string
          description: The value list content ID for different values that are used
            by the across variable within the matrix.
          minLength: 36
          maxLength: 36
        acrossVariableLocalValueListName:
          type: string
          description: The local value list name for values that are used by the across
            variable within the matrix.
          minLength: 1
          maxLength: 100
        acrossVariableValues:
          type: array
          minLength: 1
          items:
            anyOf:
            - type: integer
            - type: number
            - type: boolean
            - type: string
          description: The values for the across variable, which must be unique.
        outcomes:
          type: array
          minLength: 1
          items:
            type: array
            items:
              anyOf:
              - type: integer
              - type: number
              - type: boolean
              - type: string
          description: The outcomes of this matrix. Rows should match the number of
            down variable values, and columns in each row should match the number
            of across variable values.
    decisionModelStep:
      title: Decision Model Step
      description: A model step within a decision.
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: Type of step being referenced within the decision flow.
          format: enumeration
          enum:
          - application/vnd.sas.decision.step.model
        mappingDataGridName:
          type: string
          description: Datagrid signature term name that is used by mapping. Valid
            only for customObject, ruleSet and model steps.
        model:
          $ref: "#/components/schemas/modelStep"
        mappings:
          type: array
          description: Variable mappings for the model or rule set being referenced.
            Required if type is set to 'application/vnd.sas.decision.step.model' or
            'application/vnd.sas.decision.step.ruleset'.
          items:
            $ref: "#/components/schemas/decisionStepMapping"
    decisionConditionStep:
      title: Decision Condition Step
      description: A condition step within a decision.
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: Type of step being referenced within the decision flow.
          format: enumeration
          enum:
          - application/vnd.sas.decision.step.condition
        condition:
          $ref: "#/components/schemas/conditionStep"
        conditionExpression:
          type: string
          description: Condition expressed as expression. Can be used instead of condition.
        onTrue:
          $ref: "#/components/schemas/flow"
        onFalse:
          $ref: "#/components/schemas/flow"
    codeFileSignatureTermDataGridExtension:
      title: Code File Signature Term DataGrid Extension
      description: Code File Signature Term DataGrid Extension is used to store the
        column information of a DataGrid variable.
      required:
      - name
      - dataType
      properties:
        name:
          type: string
          description: Name of the dataGrid column.
        length:
          type: integer
          description: Length of the value in the dataGrid column. Valid for dataType
            string.
        dataType:
          type: string
          description: Data type of the dataGrid column.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
          - date
          - datetime
    decisionCustomObjectStep:
      title: Decision Custom Object Step
      description: A custom object step within a decision.
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: Type of step being referenced within the decision flow.
          format: enumeration
          enum:
          - application/vnd.sas.decision.step.custom.object
        mappingDataGridName:
          type: string
          description: Datagrid signature term name that is used by mapping. Valid
            only for customObject, ruleSet and model steps.
        customObject:
          $ref: "#/components/schemas/customObjectStep"
        mappings:
          type: array
          description: Variable mappings for the model or rule set being referenced.
            Required if type is set to 'application/vnd.sas.decision.step.model' or
            'application/vnd.sas.decision.step.ruleset'.
          items:
            $ref: "#/components/schemas/decisionStepMapping"
    decisionStepCodeSignatureTermDataGridExtension:
      title: Decision Step Code Signature Term DataGrid Extension
      description: Decision Step Code Signature Term DataGrid Extension is used to
        store the column information of a DataGrid variable.
      required:
      - name
      - dataType
      properties:
        name:
          type: string
          description: Name of the dataGrid column.
        length:
          type: integer
          description: Length of the value in the dataGrid column. Valid for dataType
            string.
        autoPopulate:
          type: boolean
          description: >
            When this flag value is set to true, the code that is generated by the
            application calls the appropriate data function to create the new column
            that you added to the metadata at runtime.
        dataType:
          type: string
          description: Data type of the dataGrid column.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
          - date
          - datetime
    variableAssignmentOutcomeAction:
      title: Segmentation Tree Variable Assignment Outcome Action
      description: The outcome action to which a variable is assigned a value.
      required:
      - type
      - variableName
      type: object
      properties:
        type:
          type: string
          description: The type of outcome action that is being referenced within
            the segmentation tree outcome.
          format: enumeration
          enum:
          - variableAssignment
        variableName:
          type: string
          maxLength: 100
          description: The name of the variable for which a value needs to be assigned.
            The variable should exist in the segmentation tree signature.
        valueType:
          type: string
          description: The type of value.
          format: enumeration
          enum:
          - static
          - variable
        value:
          anyOf:
          - type: integer
          - type: number
          - type: boolean
          - type: string
          description: >
            The value that needs to be assigned to the specified variable. The value
            must be a string if the 'valueType' property is a variable.
    decisionRuleSetStep:
      title: Decision Rule Set Step
      description: A rule set step within a decision.
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: Type of step being referenced within the decision flow.
          format: enumeration
          enum:
          - application/vnd.sas.decision.step.ruleset
        mappingDataGridName:
          type: string
          description: Datagrid signature term name that is used by mapping. Valid
            only for customObject, ruleSet and model steps.
        ruleSet:
          $ref: "#/components/schemas/ruleSetStep"
        mappings:
          type: array
          description: Variable mappings for the model or rule set being referenced.
            Required if type is set to 'application/vnd.sas.decision.step.model' or
            'application/vnd.sas.decision.step.ruleset'.
          items:
            $ref: "#/components/schemas/decisionStepMapping"
    decisionNodeLinkStep:
      title: Node Link Decision Step
      description: Represents a link within a decision flow, which directs the execution
        flow of the decision to an arbitrary node based on the linkLabel of the target
        node.
      required:
      - decisionNodeLinkTarget
      type: object
      properties:
        type:
          type: string
          description: Type of step being referenced within the decision flow.
          format: enumeration
          enum:
          - application/vnd.sas.decision.step.node.link
        decisionNodeLinkTarget:
          type: string
          description: 'The linkLabel of the node to which execution flow should be
            directed.'
    valueNode:
      title: Segmentation Tree Value Node
      description: A node with a value.
      required:
      - value
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The ID for the segmentation tree node.
        label:
          type: string
          maxLength: 100
          description: The label for the segmentation tree node.
        value:
          description: The value to which a varibale is compared.
          anyOf:
          - type: integer
          - type: number
          - type: boolean
          - type: string
        outcomeName:
          type: string
          maxLength: 100
          description: The name of the outcome, which should exist in the segmentation
            tree outcomes.
        variableAssignmentOutcomeActionOverrides:
          type: array
          items:
            $ref: "#/components/schemas/variableAssignmentOutcomeAction"
          description: Variable assignment outcome actions that are overridden in
            this value node.
        next:
          type: object
          anyOf:
          - $ref: "#/components/schemas/variableNode"
          - $ref: "#/components/schemas/booleanExpressionNode"
          - $ref: "#/components/schemas/matrixNode"
          description: The next node expression in the tree.
    codeAssignmentOutcomeAction:
      title: Segmentation Tree Code Assignment Outcome Action
      description: The outcome action in which specified code is executed to assign
        values to variables.
      required:
      - type
      - codeFileName
      type: object
      properties:
        type:
          type: string
          description: The type of outcome action that is being referenced within
            the segmentation tree outcome.
          format: enumeration
          enum:
          - codeAssignment
        codeFileName:
          type: string
          description: The name of the code file that should exist in the segmentation
            tree.
          maxLength: 100
    decisionRecordContactStep:
      title: Decision Record Contact Step
      description: A record contact step within a decision.
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: Type of step being referenced within the decision flow.
          format: enumeration
          enum:
          - application/vnd.sas.decision.step.record.contact
        recordContact:
          $ref: "#/components/schemas/recordContactStep"
    decisionBranchStep:
      title: Decision Branch Step
      description: Represents a branch decision flow step. A branch step contains
        a list of branchCases and a defaultCase. During the execution of a branch
        step each branchCases condition is evaluated in order. The decision flow will
        follow the first branchCases condition that evaluates as true. If a branchCases
        condition does not evaluate as true, then the defaultCase path for the branchStep
        is followed.
      required:
      - branchType
      type: object
      properties:
        type:
          type: string
          description: Type of step being referenced within the decision flow.
          format: enumeration
          enum:
          - application/vnd.sas.decision.step.branch
        name:
          type: string
          description: The logical name of this node for business user identification.
          maxLength: 100
        branchType:
          type: string
          format: enumeration
          description: |
            One of:
            * `range` - A branch step with branchType "range" contains branchCases that define a "range" condition for either a variable lower bound, a variable upper bound, or a variable range.
            * `equals` - A branch step with branchType "equals" contains branchCases that define "equals" conditions.  All conditions in an "equals" branch must use the "=" operator.  Several "equals" conditions can be "OR"ed.
            * `like` -  A branch step with branchType "like" contains branchCases that define "like" conditions.   All conditions in an "equals" branch must use the "like" operator.  Several "like" conditions can be "OR"ed.
        branchCases:
          type: array
          description: Specifies an array of branchCases.  At execution time each
            branchCase is evaluated in order.  The "onTrue" path of the first branchCase
            whose condition(s) evaluates true is followed.  If no branchCase's condition(s)
            evaluates true the defaultCase path is followed.
          items:
            $ref: "#/components/schemas/branchCase"
        defaultCase:
          $ref: "#/components/schemas/flow"
    recordContactStep:
      title: Record Decision Contact Step
      description: Represents the user specifying that contact information should
        be recorded at this step within the flow and details that should be recorded.
      required:
      - ruleFiredTracking
      - pathTracking
      - name
      type: object
      properties:
        name:
          type: string
          description: Logical name of this node for business user identification.
        ruleFiredTracking:
          type: boolean
          description: Flag that determines whether the current rule fired information
            will be recorded with the contact information being written.
        pathTracking:
          type: boolean
          description: Flag that determines whether the current path of steps that
            were taken in the decision up to this step will be recorded with the contact
            information being written.
        treatmentDatagridTerm:
          type: string
          description: The name of the decision signature entry to that contains treatment
            information that should be recorded during the contact for future response
            tracking. Provided data grid term must have a 'treatmentId' column extension.
        responseTrackingVariableName:
          type: string
          description: The name of the system-generated variable that will be created
            in the output of this decision that will contain a unique response tracking
            code that can be used for updating contact information in the Subject
            Contact API that corresponds to this step. This value will be determined
            by the service.
        excludeFromContactAggregation:
          type: boolean
          description: Flag that determines the setting of the 'excludeFromAggregation'
            member when contacts from this step are recorded. If not set it defaults
            to false.
        channelTerm:
          type: string
          description: The name of the decision signature entry to which contains
            channel that should be recorded during the contact for future response
            tracking. Provided term should be a 'string' type.
        auditTerms:
          type: array
          description: List of signature entries that will be included within the
            recorded contact information.
          items:
            $ref: "#/components/schemas/auditTerm"
    customObjectStep:
      title: Custom Object Decision Step
      description: Represents a step containing a custom implemented step within the
        decision flow. Treatment groups, code files, and other decisions can be referenced
        using a custom object step.
      required:
      - name
      - uri
      type: object
      properties:
        name:
          type: string
          description: The name of the custom object being referenced.
        uri:
          type: string
          description: 'The URI of the custom object that is being referenced. URIs
            to code files, treatment groups, and other decisions are currently supported.'
        type:
          type: string
          description: Type of object that is being referenced. Known supported types
            treatmentGroup, decision, decisionDs2CodeFile, decisionSQLCodeFile, and
            decisionPythonFile.
    conditionStep:
      title: Decision Condition Step
      description: Represents a condition step within a decision flow.
      required:
      - lhsTerm
      - operator
      type: object
      properties:
        lhsTerm:
          $ref: "#/components/schemas/term"
        rhsTerm:
          $ref: "#/components/schemas/term"
        rhsConstant:
          type: string
        operator:
          type: string
    decisionStepMapping:
      title: Decision Step Mapping
      description: Represents the mapping between the terms input and output by a
        decision step and the signature entries of the decision.
      required:
      - stepTermName
      - direction
      type: object
      properties:
        stepTermName:
          type: string
          description: The name of the step term to which the decision signature entry
            is mapped.
        direction:
          type: string
          description: 'Describes whether mapping is an input, output, or both from
            the point of view of the decision step.'
          enum:
          - input
          - output
          - inOut
        targetDecisionTermName:
          type: string
          description: The name of the decision signature entry to which a step term
            will be mapped.
        targetDataGridTermName:
          type: string
          description: The name of the term inside the mappedDataGrid term to which
            a step term will be mapped.
    modelStep:
      title: Model Decision Step
      description: Represents a model be referenced as a step within a decision flow.
      required:
      - name
      - id
      type: object
      properties:
        name:
          type: string
          description: The name of the model being referenced.
        id:
          type: string
          description: 'The ID of the model that is being referenced.'
    ruleSetStep:
      title: Rule Set Decision Step
      description: Specifies the rule set that is being referenced for this step.
        Required if type is set to 'application/vnd.sas.decision.step.ruleset'.
      required:
      - id
      - versionId
      type: object
      properties:
        name:
          type: string
          description: The name of the rule set being referenced.
        id:
          type: string
          description: 'Identifier of the rule set that is being referenced.'
        versionId:
          type: string
          description: The identifier of the rule set version that is being referenced.
        versionName:
          type: string
          description: The name of the version that is being referenced.
    branchCase:
      title: Decision Case
      description: Represents a single case within a branch step of a decision flow.
        A case can contain a simpleCondition or compoundCondition, but not both.
      type: object
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object
        label:
          type: string
          description: A label for the branch case.
        simpleCondition:
          $ref: "#/components/schemas/simpleBranchCondition"
        compoundCondition:
          $ref: "#/components/schemas/compoundBranchCondition"
        onTrue:
          $ref: "#/components/schemas/flow"
    simpleBranchCondition:
      title: Decision Simple Branch Condition
      description: Represents a simple condition.  The left hand side (lhs), right
        hand side (rhs) and operator of the condition are evaluated to produce a boolean
        result of "true" or "false".  The left hand side may be a variable or an experssion.
      required:
      - operator
      type: object
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object
        lhsTerm:
          $ref: "#/components/schemas/term"
        lhsConditionExpression:
          type: string
          description: Specifies the left hand side expression.  Should not be specified
            in lhsTerm is present.
        lhsConditionExpressionType:
          type: string
          description: Specifies the expected type resulting from lhsConditionExpression.  This
            actual result type of the expression is not validated. Should not be specified
            in lhsTerm is present.
        rhsTerm:
          $ref: "#/components/schemas/term"
        rhsConstant:
          type: string
          description: Specifies the constant to compare the lhsTerm or lhsConditionExpression
            to. Should not be specified in rhsTerm is present.
        operator:
          type: string
          description: Specifies the comparison operation or operator to use with
            left hand side and right hand side elements.
    auditTerm:
      title: Audit Term
      description: Represents a term that is being recorded for auditing purposes
        during contact recording.
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The name of the term that is being referenced from the signature.
    compoundBranchCondition:
      title: Decision Compound Branch Condition
      description: Represents a compound condition.  The left hand side (lhs), right
        hand side (rhs) and operator of the condition are evaluated to produce a boolean
        result of "true" or "false".  A compound condition has a left hand side (lhsSimpleCondition
        or lhsCompoundCondition) a right hand side (rhsSimpleCondition or rhsCompoundCondition)
        and a boolean operator.
      required:
      - booleanOperator
      type: object
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object
        booleanOperator:
          type: string
          description: Specifies the booleanOperator of the condition.
          format: enumeration
          enum:
          - AND
          - OR
        lhsSimpleCondition:
          $ref: "#/components/schemas/simpleBranchCondition"
        lhsCompoundCondition:
          $ref: "#/components/schemas/compoundBranchCondition"
        rhsSimpleCondition:
          $ref: "#/components/schemas/simpleBranchCondition"
        rhsCompoundCondition:
          $ref: "#/components/schemas/compoundBranchCondition"
