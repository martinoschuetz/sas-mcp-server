    post:
      summary: Create a decision revision
      operationId: createDecisionRevision
      tags:
      - Decision Revisions
      description: Creates a new revision for the decision.
      parameters:
      - name: decisionId
        in: path
        required: true
        description: The identifier for a decision.
        schema:
          type: string
        example: 094078e7-278a-4719-a704-6e5e65af29ee
      - name: revisionType
        in: query
        description: Valid Values are 'major' or 'minor'. This value determines how
          the server generates the major or minor revision numbers. If major is provided
          the next available major revision number is initiated. For example, if the
          decision has revisions 1.0, 1.1, 1.2, 2.0, 2.1, when you create a new major
          revision the result is 3.0. If minor is provided, then the next available
          minor revision number is reserved based on the existing revisions. This
          parameter is defaulted to 'minor', if not supplied.
        schema:
          type: string
          enum:
          - major
          - minor
        example: major
      - name: fromRevisionUri
        in: query
        description: This value specifies the URI of the decision revision from which
          the new decision is created. This property enables you to trace the lineage
          of a decision. The valid format for this parameter is '/decisions/flows/${decisionId}/revisions/${revisionId}'
