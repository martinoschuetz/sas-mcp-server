        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Last-Modified:
              schema:
                type: string
              example: Thu, 06 May 2021 21:37:00 GMT
            ETag:
              description: The entity tag for the decision flow.
              schema:
                type: string
              example: '"kknyjgku"'
          content:
            application/vnd.sas.decision+json:
              schema:
                $ref: "#/components/schemas/decision"
              examples:
                default:
                  $ref: "#/components/examples/fullDetailsOfDecisionFlow"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/resourceSummaryOfDecisionFlow"
            application/vnd.sas.dcm.summary+json:
              schema:
                $ref: "#/components/schemas/revisionSummary"
              examples:
                default:
                  $ref: "#/components/examples/revisionSummaryOfDecisionFlow"
