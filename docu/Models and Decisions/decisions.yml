components:
  securitySchemes:
    SASLogon:
      type: oauth2
      description: OAuth authentication is required to access this API.
      flows:
        authorizationCode:
          authorizationUrl: https://example.com/oauth/authorize
          tokenUrl: https://example.com/oauth/token
          scopes:
            openid: OpenID Connect scope
  headers:
    Sas-Service-Response-Flag:
      description: Indicates whether the response is coming from a SAS service.
      schema:
        type: boolean
      example: true
  schemas:
    workflowVariable:
      title: Workflow Variable
      description: A variable that is used in a workflow.
      type: object
      properties:
        name:
          type: string
          description: The name of the workflow variable.
        value:
          type: string
          description: The value of the workflow variable.
        type:
          type: string
          description: The type of the workflow variable.
    workflowStatusChangeHistoryEntry:
      title: Workflow Status Change History Entry
      description: A change-status entry for the workflow history.
      type: object
      properties:
        status:
          type: string
          description: The status of the workflow.
        timestamp:
          type: string
          format: date-time
          description: The timestamp of the status change.
        user:
          type: string
          description: The user who made the status change.
    workflowStatusChangeHistory:
      title: Workflow Status Change History
      description: The history of status changes for the workflow.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/workflowStatusChangeHistoryEntry"
          description: The list of change-status entries for the workflow history.
        revisions:
          type: array
          items:
            type: string
          description: The set of revision identifiers.
        start:
          type: string
          format: date-time
          description: The start date of the change status for the workflow history.
        end:
          type: string
          format: date-time
          description: The end date of the change status for the workflow history.
        count:
          type: integer
          description: The count of status-change entries for the workflow.
    workflowProcess:
      type: object
      description: The process to be executed by a workflow.
      properties:
        id:
          type: string
          description: The unique identifier of the process.
        name:
          type: string
          description: The name of the process.
        description:
          type: string
          description: The description of the process.
        rootId:
          type: string
          description: The root identifier of the process.
        parentId:
          type: string
          description: The parent identifier of the process.
        parentCallActivityId:
          type: string
          description: The identifier of the parent call activity for the process.
        definitionId:
          type: string
          description: The definition identifier of the process.
        definitionRevision:
          type: integer
          description: The definition revision of the process.
        state:
          type: string
          description: The current state of the process.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version of the process.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    errorResponse:
      type: object
      description: The HTTP error response objects.
      properties:
        statusCode:
          type: integer
          description: The HTTP status code (for example., 404).
        errorCode:
          type: integer
          description: An optional error code that can be set to indicate more precisely
            what was wrong.
        message:
          type: string
          description: The message text that was thrown with the exception.
        details:
          type: array
          items:
            type: string
          description: A collection of strings that provide detailed information about
            the cause of the error.
        remediation:
          type: string
          description: An optional string of the remedial steps that could be taken
            to resolve the error.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/errorResponse"
          description: A nested array of root causes or related errors.
        id:
          type: string
          description: An identifier for the string error. This optional mnemonic
            string represents the error status.
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: A set of link objects that are related to the error.
        version:
          type: integer
          description: The version number for this API representation.
      required:
      - statusCode
      - message
      - version
