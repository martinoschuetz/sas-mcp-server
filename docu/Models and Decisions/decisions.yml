      description: Returns a resource collection of all segmentation trees.
      parameters:
      - name: filter
        description: |
          The criteria for filtering the segmentation trees. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/decisions/docs/getting-started/usage-notes#filtering).

          The following properties support filtering:

          * createdBy
          * modifiedBy
          * creationTimeStamp
          * modifiedTimeStamp
          * id
          * name
          * description
          * majorRevision
          * minorRevision
          * signature.name
          * signature.description
          * signature.dataType
          * signature.length
          * signature.direction
        in: query
        schema:
          type: string
          format: filter-criteria
        example: gt(modifiedTimeStamp, '2021-05-03T15:38:45.654Z')
      - name: sortBy
        description: >
          The criteria for sorting the segmentation trees. See [Sorting in
          REST APIs](https://developer.sas.com/rest-apis/decisions/docs/getting-started/usage-notes#sorting).

          The following properties support sorting:

          * createdBy
          * modifiedBy
          * creationTimeStamp
          * modifiedTimeStamp
          * id
          * name
          * description
          * majorRevision
          * minorRevision
        in: query
        schema:
          type: string
          format: sort-criteria
          default: creationTimeStamp:descending
        example: modifiedTimeStamp:descending
      - name: start
        in: query
        description: The starting index for the first item on a page. The index is
          0-based.
        schema:
          type: integer
          default: 0
        example: 100
      - name: limit
        in: query
        description: The maximum number of items to return on this page of results.
          The actual number of returned items might be less if the collection has
          been exhausted.
        schema:
          type: integer
          default: 10
        example: 500
      - name: parentFolderUri
        in: query
        description: The folder in which the target segmentation trees are located.
        required: false
        schema:
          type: string
          format: /folders/folders/{parentFolderId}
        example: /folders/folders/@public
      - name: Accept-Item
