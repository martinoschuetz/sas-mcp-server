---
openapi: 3.0.3
info:
  version: "28"
  title: Decisions
  description: The Decisions API supports the life cycle of decision data.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  license:
    name: SAS Institute
    url: https://support.sas.com/techsup/license/index.html
servers:
- url: https://example.com/decisions
  description: This is an example of a base URL.
externalDocs:
  description: Developer documentation
  url: https://developer.sas.com
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Decisions
  description: Contains the operations to create, read, update, and delete decisions.
- name: Decision Revisions
  description: Contains the operations to create, read, and delete decision revisions.
- name: Code Files
  description: Contains the operations for code files.
- name: Code File Revisions
  description: Contains the operations for code file revisions.
- name: Decision Node Types
  description: Contains the operations for decision node types.
- name: Decision Types
  description: Contains the operations for decision types.
- name: Validations
  description: Contains the operations for validation.
- name: Segmentation Trees
  description: Contains the operations for segmentation trees.
- name: Segmentation Tree Revisions
  description: Contains the operations for segmentation tree revisions.
- name: Workflows
  description: Contains the operation related to workflow management on decisions.
paths:
  /:
    get:
      operationId: root
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a list of top-level resource links for this API.
      responses:
        "200":
          description: The request succeeded. A collection of link objects was returned.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
  /flows:
    get:
      operationId: getDecisions
      tags:
      - Decisions
      summary: Get a list of all decisions
      description: Returns a resource collection of all decisions.
      parameters:
      - name: filter
        description: The criteria for filtering the decision flows. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/decisions/docs/getting-started/usage-notes#filtering).
        in: query
        schema:
          type: string
          format: filter-criteria
        example: gt(modifiedTimeStamp, '2021-05-03T15:38:45.654Z')
      - name: sortBy
        description: The criteria for sorting the decision flows. See [Sorting in
          REST APIs](https://developer.sas.com/rest-apis/decisions/docs/getting-started/usage-notes#sorting).
        in: query
        schema:
          type: string
          format: sort-criteria
        example: modifiedTimeStamp:descending
      - name: start
        in: query
        description: The starting index of the first item in a page. The index is
          0-based.
        schema:
          type: integer
          default: 0
        example: 100
      - name: limit
        in: query
        description: "The maximum number of items to return in this page of results.\
          \ The actual number of returned items might be less if the collection has\
          \ been exhausted."
        schema:
          type: integer
          default: 10
        example: 500
      - name: parentFolderUri
        in: query
        description: The folder where the target decisions are located.
        required: false
        schema:
          type: string
          format: /folders/folders/{parentFolderId}
        example: /folders/folders/@public
      - name: Accept-Item
        description: Used for selecting the desired item representation.
        in: header
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.decision+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.dcm.summary+json
          default: application/vnd.sas.summary+json
        example: application/vnd.sas.decision+json
      - name: stepObjectUri
        in: query
        description: "If provided, only decisions that contain a step object matching\
          \ this URI are returned. The supported step types to search for are model\
          \ steps, rule set steps, or custom object steps. For models and rule sets,\
          \ the URI should include only the object's ID (no revision). For custom\
          \ objects, any decisions with a custom object step referencing an object\
          \ whose URI starts with the provided value is returned."
        schema:
          type: string
        examples:
          modelStep:
            value: /modelrepositoiry/models/7396c9ee-1860-477c-ac9f-0b91824c7d25
            summary: Model step.
          ruleSetStep:
            value: /businessRules/ruleSets/321d4afb-daf3-49fe-a3b5-8a8deefe29e2
            summary: Rule set step
          subDecisionStep:
            value: /decisions/flows/ef613bb5-d855-4227-97ac-9e9bfefe3e4a
            summary: Sub-decision step.
          codeFileStep:
            value: /decisions/codeFiles/d5704165-7d0c-4c36-8444-9ae3e2357a3b
            summary: Code file step.
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.collection+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/resourceSummaryCollection"
                - $ref: "#/components/schemas/decisionCollection"
                - $ref: "#/components/schemas/revisionSummaryCollection"
              examples:
                application/vnd.sas.summary+json:
                  $ref: "#/components/examples/resourceSummaryOfDecisionFlows"
                application/vnd.sas.decision+json:
                  $ref: "#/components/examples/fullDetailsOfDecisionFlows"
                application/vnd.sas.dcm.summary+json:
                  $ref: "#/components/examples/revisionSummaryOfDecisionFlows"
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/resourceSummaryCollection"
                - $ref: "#/components/schemas/decisionCollection"
                - $ref: "#/components/schemas/revisionSummaryCollection"
              examples:
                application/vnd.sas.summary+json:
                  $ref: "#/components/examples/resourceSummaryOfDecisionFlows"
                application/vnd.sas.decision+json:
                  $ref: "#/components/examples/fullDetailsOfDecisionFlows"
                application/vnd.sas.dcm.summary+json:
                  $ref: "#/components/examples/revisionSummaryOfDecisionFlows"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "406":
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          description: The request was not acceptable. An invalid media type was specified
            for the `Accept-Item` header value.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notAcceptable"
    post:
      summary: Create a decision
      operationId: createDecision
      description: Creates a new decision based on the provided content.
      tags:
      - Decisions
      parameters:
      - name: parentFolderUri
        in: query
        description: The folder in which the new decision is placed.
        required: false
        schema:
          type: string
          format: /folders/folders/{parentFolderId}
        example: /folders/folders/@public
      - name: fromRevisionUri
        in: query
        description: This value specifies the URI of the decision revision from which
          the new decision is being created. This property enables you to trace the
          lineage of a decision.
        schema:
          type: string
          format: /decisions/flows/{decisionId}/revisions/{revisionId}
        example: /decisions/flows/ef613bb5-d855-4227-97ac-9e9bfefe3e4a/revisions/ba14828c-b4b6-4a3a-9246-f51dd16ffcba
      requestBody:
        content:
          application/vnd.sas.decision+json:
            schema:
              $ref: "#/components/schemas/decision"
            examples:
              "With a Code File":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithCodeFile"
              "With a Rule Set":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithRuleset"
              "With a Sub-Decision":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithSubDecision"
              "With a Treatment Group":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithTreatmentGroup"
              "With a Record Contact":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithRecordContact"
              "With a SAS Micro Analytic Service Module":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithMASModule"
              "With a Condition":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithCondition"
              "With a Condition Expression":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithConditionExpression"
              "With a Branch Equals":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchEquals"
              "With a Branch Equals Expression":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchEqualsExpression"
              "With a Branch Like":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchLike"
              "With a Branch Like Expression":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchLikeExpression"
              "With a Branch Range":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchRange"
              "With a Branch Range Expression":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchRangeExpression"
              "With a Custom Context":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithCustomContext"
              "With a Variable Assignment":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithVariableAssignment"
          application/json:
            schema:
              $ref: "#/components/schemas/decision"
            examples:
              "With a Code File":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithCodeFile"
              "With a Rule Set":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithRuleset"
              "With a Sub-Decision":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithSubDecision"
              "With a Treatment Group":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithTreatmentGroup"
              "With a Record Contact":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithRecordContact"
              "With a SAS Micro Analytic Service Module":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithMASModule"
              "With a Condition":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithCondition"
              "With a Condition Expression":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithConditionExpression"
              "With a Branch Equals":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchEquals"
              "With a Branch Equals Expression":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchEqualsExpression"
              "With a Branch Like":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchLike"
              "With a Branch Like Expression":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchLikeExpression"
              "With a Branch Range":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchRange"
              "With a Branch Range Expression":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithBranchRangeExpression"
              "With a Custom Context":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithCustomContext"
              "With a Variable Assignment":
                $ref: "#/components/examples/createOrUpdateDecisionFlowWithVariableAssignment"
        description: A decision summary to create a decision.
        required: true
      responses:
        "201":
          description: The decision was created.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Last-Modified:
              schema:
                type: string
              example: Thu, 06 May 2021 21:37:00 GMT
            Location:
              schema:
                type: string
              example: /decisions/flows/094078e7-278a-4719-a704-6e5e65af29ee
            ETag:
              description: The entity tag for the decision flow.
              schema:
                type: string
              example: '"kknyjgku"'
          content:
            application/vnd.sas.decision+json:
              schema:
                $ref: "#/components/schemas/decision"
              examples:
                default:
                  $ref: "#/components/examples/fullDetailsOfDecisionFlow"
            application/json:
              schema:
                $ref: "#/components/schemas/decision"
              examples:
                default:
                  $ref: "#/components/examples/fullDetailsOfDecisionFlow"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
  /flows/{decisionId}:
