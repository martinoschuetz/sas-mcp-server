      - name: If-Match
        in: header
        required: true
        description: The `ETag` value from when the originating object was retrieved.
        schema:
          type: string
        example: '"kknyjgku"'
      requestBody:
        content:
          application/vnd.sas.decision+json:
            schema:
              $ref: "#/components/schemas/decision"
            examples:
              "With a Code File":
