  /flows/{decisionId}/code:
    get:
      summary: Get decision code
      operationId: getDecisionCode
      description: Retrieves the DS2 package code, which can be used to execute the
        decision.
      tags:
      - Decisions
      parameters:
      - name: decisionId
        in: path
        required: true
        description: The identifier for the decision.
        schema:
          type: string
        example: 094078e7-278a-4719-a704-6e5e65af29ee
      - name: codeTarget
        in: query
        schema:
          type: string
          enum:
          - microAnalyticService
          - docker
          - gitMas
          - gitCas
          - procds2
          - casFull
          - inDatabase
          - spre
          - subDecision
          - others
        example: microAnalyticService
        description: >
          The type of platform or scenario in which the generated code is used.

          Code targets:

            * `microAnalyticService` - Use this target type when the generated DS2
          is going to be run on SAS Micro Analytic Service.
            * `docker` - Use this target type when the code must be published to Docker.
            * `gitMas` - Use this target type when the code must be published to Git
          MAS.
            * `gitCas` - Use this target type when the code must be published to Git
          CAS.
            * `procds2` - Use this target type when code must be run inside a SPRE
          session. The data query is executed using sqlstmt package.
            * `casFull` - Use this target type to produce a full DS2 program for running
          inside CAS, including the thread and data program in addition to the needed
          packages.
            * `inDatabase` - Use this target type to produce a DS2 program for running
          in-database.
            * `spre` - Use this target type when code must be run inside a SPRE session.
          The data query is executed in SAS Micro Analytic Service (MAS).
            * `subDecision` - Use this target type when the code is included as part
          of another decision and should not be wrapped in a driver.
            * `others` - Use this target type in all other cases.
      - name: inlineAdvanceListValues
        in: query
        required: false
        description: Specifies whether the currently deployed rows in an advanced
          list are included as inline values within the generated code. Advanced lists
          and rows within an advanced list can be deployed by using the SAS Intelligent
          Decisioning web application, the SAS Fraud Decisioning application, or the
          List Data API. If this parameter is 'true', the deployed rows in an advanced
          list are re-created as a data grid in the generated code. If this parameter
          is 'false', the advanced list must exist as a tabular data set on the Redis
          server. To get generated code for Cloud Analytic Server, Teradata, or Hadoop
          destinations, specify 'true' as the parameter value.
        schema:
          type: boolean
      responses:
        "200":
          description: The request succeeded.
          headers:
