    createOrUpdateSegmentationTreeWithCodeAssignmentOutcomeAction:
      description: Create or update a segmentation tree with a code assignment outcome
        action.
      value:
        name: EvenChecker
        signature:
        - name: value
          direction: input
          dataType: integer
        - name: iseven
          direction: output
          dataType: boolean
        node:
          type: booleanExpression
          booleanExpressionName: even_check
          valueNodes:
          - value: "true"
            outcomeName: even
          - value: "false"
            outcomeName: odd
        codeFiles:
        - name: even
          type: internal
          code: iseven = 1;
        - name: odd
          type: internal
          code: iseven = 0;
        outcomes:
        - name: even
          actions:
          - type: codeAssignment
            codeFileName: even
        - name: odd
          actions:
          - type: codeAssignment
            codeFileName: odd
        booleanExpressions:
        - name: even_check
          expression: mod(value, 2) = 0
    ds2CodeOfSegmentationTree:
      description: The code generated from a segmentation tree.
      value: |
        package SegmentationTree /inline;
            dcl package logger m_logger('App.SASSegmentationTrees');
            dcl int _isDebugEnabled;
            dcl package logger logr_variableTrace('App.TableServices.DS2.Runtime.TraceVariables');
            dcl double _double_value;
            dcl varchar(100) _string_value;

            /* matrix "matrix1" */
