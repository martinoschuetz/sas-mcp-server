          type: array
          readOnly: true
          description: Zero or more links to related resources or operations.
          items:
            $ref: "#/components/schemas/link"
        fileUri:
          type: string
          description: The URI of the file resource, which contains code.
        testCustomContextUri:
          type: string
          description: The URI of a Custom Context DS2 code file that provides a custom
            context to this code file. Normally, this code file's custom context is
            provided by the decision that utilizes it. For syntax validation and testing
            purpose, you can specify a testing-only custom context.
        version:
          type: integer
          readOnly: true
          description: >
            This media type's schema version number. This representation is
            version 9.
    codeFileSignatureTerm:
      title: Code File Signature Term
      description: Represents the code file signature term.
      required:
      - name
      - dataType
      - direction
      properties:
        name:
          type: string
          description: The name of the code file signature term.
        dataType:
          type: string
          description: Data type of the code file signature term.
          enum:
          - string
          - decimal
          - integer
          - dataGrid
          - date
          - datetime
          - unknown
        direction:
          type: string
          description: Direction of the code file signature term.
          enum:
          - input
          - inOut
          - output
        length:
          type: integer
          description: Length of the signature term. Valid for string data type.
        dataGridExtension:
          type: array
          items:
            $ref: "#/components/schemas/codeFileSignatureTermDataGridExtension"
          description: Metadata information about data grid columns.
        generateDataGridColumns:
          type: boolean
          description: >-
            Each row in a data grid variable usally contains metadata that defines
            the columns
            in the data grid and the data for each column. Depending on the data types
            and number
            of columns in the data grid, the metadata can increase the size of the
            data grid considerably.
            To exclude the metadata from each row in the data grid, set this option
            to "true" because the
            application depends on the column definitions that you enter when you
            define the variable.
            Ensure that the column definition is correct for each column in the data
            grid variable.
            If the column definitions do not match the input data, the application
            cannot load the data.
