                  description: the unique identifier for the Honeycomb icon.
                ref:
                  type: string
                  description: the unique reference for the Honeycomb icon.
            color:
              type: integer
              description: the color a node of this type will appear on a decision
                flow diagram. Each number represents a different color, with 13 different
                colors to choose from.
              minimum: 1
              maximum: 13
        type:
          type: string
          description: the type for this DecisionNodeType
          enum:
          - static
          - rest
        l10nKey:
          type: string
          description: the key that can be used to access the localized name from
            the localization service.
        createdBy:
          type: string
          readOnly: true
          description: The user who created the object used in decision step.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: The date and time that the object used in the decision step
            was created.
        modifiedBy:
          type: string
          readOnly: true
          description: The user ID of the authenticated user who last updated the
