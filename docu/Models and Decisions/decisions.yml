      description: Contains information needed to extend the decision flow with a
        new node type
      required:
      - name
      - hasInputs
      - hasOutputs
      - type
      properties:
        id:
          type: string
          readOnly: true
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: The name of the DecisionNodeType used by the infrastructure
            to indentify this node type (no spaces or special characters).
        description:
          type: string
          description: The description of the DecisionNodeType.
        hasProperties:
          type: boolean
          description: indicates whether or not the DecisionNodeType should be present
            a properties pane when included in a decision flow
        hasInputs:
          type: boolean
          description: indicates that the DecisionNodeType has inputs which should
            be mapped to decision flow or datagrid variables
        hasOutputs:
          type: boolean
          description: indicates that the DecisionNodeType has outputs which should
            be mapped to decision flow or datagrid variables
        inputDatagridMappable:
          type: boolean
          description: indicates that the DecisionNodeType's inputs may be mapped
            to datagrid extensions
        outputDatagridMappable:
          type: boolean
          description: indicates that the DecisionNodeType's outputs may be mapped
            to datagrid extensions
        inputDecisionTermMappable:
          type: boolean
          description: indicates that the DecisionNodeType's inputs may be mapped
            to decision variables
        outputDecisionTermMappable:
          type: boolean
          description: indicates that the DecisionNodeType's outputs may be mapped
            to decision variables
        independentMappings:
          type: boolean
          description: indicates whether same-named inputs/outputs may be mapped independently
        themeId:
          type: string
          description: indicating a standard theme which will result in a unique icon
