      tags:
      - Projects
      summary: Get aggregated project counts
      description: Returns aggregated project counts grouped by the specified field.
        This endpoint is used to retrieve summary statistics about projects without
        fetching full project details.
      parameters:
      - name: groupBy
        in: query
        required: true
        description: The field to group the project counts by. Supported values are
          `function`, `status`, and `publishStatus`.
        schema:
          type: string
          enum:
          - function
          - status
          - publishStatus
      - name: filter
        in: query
        required: false
        description: The criteria for filtering the projects before aggregation. For
          more information, see [Filtering in REST APIs](https://developer.sas.com/rest-apis/modelRepository/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: filter-criteria
      responses:
        "200":
          description: The request succeeded. An array of summary items was returned.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                      description: The category value for the group.
                    count:
                      type: integer
                      format: int64
                      description: The number of projects in this category.
              example:
              - category: "classification"
                count: 8
              - category: "regression"
                count: 12
              - category: "unknown"
                count: 3
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                      description: The category value for the group.
                    count:
                      type: integer
                      format: int64
                      description: The number of projects in this category.
              example:
              - category: "classification"
                count: 8
              - category: "regression"
                count: 12
              - category: "unknown"
                count: 3
        "400":
          description: The request was invalid. The `groupBy` parameter is missing
            or contains an unsupported value.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                errorCode: 0
                message: "The value \"invalidField\" for the \"groupBy\" parameter\
                  \ is not valid."
                httpStatusCode: 400
                version: 2
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                errorCode: 0
                message: "The value \"invalidField\" for the \"groupBy\" parameter\
