              $ref: "#/components/schemas/modelProject"
            description: An array of project representations.
    modelProject:
      title: Model Project
      description: Contains information about a modeling project.
      properties:
        createdBy:
          type: string
          description: The user that created the project.
        modifiedBy:
          type: string
          description: The user that last modified the project.
        creationTimeStamp:
          type: string
          description: The timestamp for when the project was created, in the format
            of `YYYY-MM-DDThh:mm:ss.sssZ`.
          format: date-time
        modifiedTimeStamp:
          type: string
          description: The timestamp for when the project was last modified, in the
            format of `YYYY-MM-DDThh:mm:ss.sssZ`.
          format: date-time
        id:
          type: string
          description: The unique identifier for the project.
        name:
          type: string
          description: The name of the project.
        description:
          type: string
          description: The description of the project.
        function:
          type: string
          description: "The model function of the project. Valid values: analytical,\
            \ classification, cluster, forecasting, prediction, Text categorization,\
            \ Text extraction, Text sentiment, Text topics, transformation"
