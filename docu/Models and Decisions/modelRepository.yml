        These are the properties that are required for a PUT operation: id, projectId, name, and description.
      properties:
        id:
          type: string
          description: The unique identifier for the project version. This is required
            for GET and PUT REST operations.
        name:
          type: string
          description: The name of the project version.
        description:
          type: string
          description: The description of the project version.
        projectId:
          type: string
          description: The identifier for the project.
      required:
      - name
      - projectId
