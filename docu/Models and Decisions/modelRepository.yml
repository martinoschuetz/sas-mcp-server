---
openapi: 3.0.3
info:
  title: Model Repository
  description: The Model Repository API provides support for registering, organizing,
    and managing models within a common model repository.
  version: "12"
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: https://example.com/modelRepository
  description: This is an example of a base URL.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Models
  description: Contains operations for searching and managing models.
- name: Projects
  description: Contains operations for searching and managing projects.
- name: Repositories
  description: Contains operations for searching and managing repositories.
- name: User-Defined Tags
  description: Contains operations for searching user-defined tags.
- name: Deprecated
  description: Contains deprecated operations.
paths:
  /:
    get:
      operationId: root
      tags:
      - Root
      summary: Get a list of top-level resource links
      description: Returns a list of links to the top-level resources that are surfaced
        through this API.
      responses:
        "200":
          description: The request succeeded. A list of top-level link objects was
            returned.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
        "404":
          description: No root resource exists at the requested path. Check the URI
            for errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    head:
      operationId: headersForRoot
      tags:
      - Root
      summary: Check API availability
      description: Returns whether the model repository service is available.
      responses:
        "200":
          description: The request succeeded. The service is running and available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
        "404":
          description: No root resource exists at the requested path. Check the URI
            for errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /models:
    head:
      operationId: headersForModels
      tags:
      - Models
      summary: Check if models exist
      description: Returns header information for a list of models that are within
        the common model repository. Also used to determine whether models exist.
      parameters:
      - name: name
        in: query
        required: false
        description: A query string that allows a search by name for a model.
        schema:
          type: string
          format: sort-criteria
      - name: parentId
        in: query
        required: false
        description: A query string that allows a search for models in a folder or
          project.
        schema:
          type: string
          format: sort-criteria
      - name: start
        in: query
        required: false
        description: The starting index for the first item in a page. The index is
          0-based. See [Pagination in REST APIs](https://developer.sas.com/rest-apis/modelRepository/docs/getting-started/usage-notes#pagination)for
          more information about how pagination is applied to collections.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        description: "The maximum number of items to return in the request. "
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        required: false
        description: The criteria for filtering the models. For more information,
          see [Filtering in REST APIs](https://developer.sas.com/rest-apis/modelRepository/docs/getting-started/usage-notes#filtering)
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        required: false
        description: The criteria for sorting the models. For more information, see
          [Sorting in REST APIs](https://developer.sas.com/rest-apis/modelRepository/docs/getting-started/usage-notes#sorting)
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/modelCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/modelCollection"
    get:
      operationId: getModels
      tags:
      - Models
      summary: Get a list of models
      description: Returns a list of models that are within the common model repository.
      parameters:
      - name: name
        in: query
        required: false
        description: A query string that allows a search by name for a model.
        schema:
          type: string
          format: sort-criteria
      - name: parentId
        in: query
        required: false
        description: A query string that allows a search for models in a folder or
          project.
        schema:
          type: string
          format: sort-criteria
      - name: inputVariables
        in: query
        required: false
        description: A query string that allows a search for models with input variables.
        schema:
          type: string
      - name: outputVariables
        in: query
        required: false
        description: A query string that allows a search for models with output variables.
        schema:
          type: string
      - name: properties
        in: query
        required: false
        description: A query string that allows a search for models with user-defined
          properties.
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: The starting index for the first item in a page. The index is
          0-based. For more information about how pagination is applied to collections,
          see [Pagination in REST APIs](https://developer.sas.com/rest-apis/modelRepository/docs/getting-started/usage-notes#pagination).
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        description: |
          The maximum number of items to return in this request.
          The maximum value that can be specified is 1000.

          __Note:__ The maximum value for the limit parameter was added with the 2026.07 release.
        schema:
          type: integer
          format: int32
          maximum: 1000
          default: 10
      - name: filter
        in: query
        required: false
        description: The criteria for filtering the models. For more information,
          see [Filtering in REST APIs](https://developer.sas.com/rest-apis/modelRepository/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        required: false
        description: The criteria for sorting the models. For more information, see
          [Sorting in REST APIs](https://developer.sas.com/rest-apis/modelRepository/docs/getting-started/usage-notes#sorting).
        schema:
          type: string
      - name: "relatedResourceUri"
        in: "query"
        required: false
        description: "A query string that allows a search for models with links to\
          \ other system such as SAS Model Risk Management."
        schema:
          type: string
      - name: expand
        in: query
        required: false
        description: "Specifies additional information to include in the response.\
          \ Use `count` to include the number of model versions for each model. Use\
          \ `astore` to include whether each model is an ASTORE model (determined\
          \ by the presence of the AstoreMetadata.json file)."
        schema:
          type: string
          enum:
          - count
          - astore
      responses:
        "200":
          description: The request succeeded. The models were returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/modelCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/modelCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    post:
      operationId: createModel
      tags:
      - Models
      summary: Create a model
      description: Creates a model into a project or folder using a model JSON object.
      requestBody:
        content:
          application/vnd.sas.models.model:
            schema:
              $ref: "#/components/schemas/model"
          application/json:
            schema:
              $ref: "#/components/schemas/model"
        description: "If the model is defined craftily, then this information is mandatory.\
          \ The following fields are ignored from the input: id, createdBy, modifiedBy"
      responses:
        "201":
          description: A model was created.
          headers:
            Location:
              description: /modelRepository/models/{modelId}
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/model"
            application/json:
              schema:
                $ref: "#/components/schemas/model"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. The model already exists.
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /models/summary:
    get:
      operationId: getModelsSummary
      tags:
      - Models
      summary: Get aggregated model counts
      description: Returns aggregated model counts grouped by the specified field.
        This endpoint is used to retrieve summary statistics about models without
        fetching full model details.
      parameters:
      - name: groupBy
        in: query
        required: true
        description: The field to group the model counts by. Supported values are
          `publishStatus`, `scoreCodeType`, and `destinationName`.
        schema:
          type: string
          enum:
          - publishStatus
          - scoreCodeType
          - destinationName
      - name: filter
        in: query
        required: false
        description: The criteria for filtering the models before aggregation. For
          more information, see [Filtering in REST APIs](https://developer.sas.com/rest-apis/modelRepository/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: filter-criteria
      responses:
        "200":
          description: The request succeeded. An array of summary items was returned.
          headers:
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                      description: The category value for the group.
                    count:
                      type: integer
                      format: int64
                      description: The number of models in this category.
              example:
              - category: "published"
                count: 15
              - category: "unpublished"
                count: 42
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                      description: The category value for the group.
                    count:
                      type: integer
                      format: int64
                      description: The number of models in this category.
              example:
              - category: "published"
                count: 15
              - category: "unpublished"
                count: 42
        "400":
          description: The request was invalid. The `groupBy` parameter is missing
            or contains an unsupported value.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                errorCode: 0
                message: "The value \"invalidField\" for the \"groupBy\" parameter\
                  \ is not valid."
                httpStatusCode: 400
                version: 2
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              example:
                errorCode: 0
                message: "The value \"invalidField\" for the \"groupBy\" parameter\
                  \ is not valid."
                httpStatusCode: 400
                version: 2
  /models#Project:
    post:
      operationId: importModelsToProject
      tags:
      - Models
      summary: Import models into a model project
      description: Imports one or more models from the project request object. The
        model contains project properties and a list of model links.
      requestBody:
        content:
          application/vnd.sas.models.project.request:
            schema:
              $ref: "#/components/schemas/projectRequest"
      responses:
        "201":
          description: The models were imported.
          headers:
            Location:
              description: /modelRepository/models/{modelId}
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/modelCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/modelCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. The model already exists.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /models#CommonModel:
    post:
      operationId: importModelAsCommonModel
      tags:
      - Models
      summary: Import a model into a folder
      description: Imports a model into a folder within the common model repository.
      parameters:
      - name: folderId
        in: query
        required: false
        description: The unique identifier for the folder that contains the model.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.models.model.request:
            schema:
              $ref: "#/components/schemas/modelRequest"
      responses:
        "201":
          description: A model was imported.
          headers:
            Location:
              description: /modelRepository/models/{modelId}
              schema:
                type: string
            ETag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/model"
            application/json:
              schema:
                $ref: "#/components/schemas/model"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. The model already exists.
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /models#MultipartFormData:
    post:
      operationId: importModelByMultipartForm
      tags:
      - Models
      summary: Import a model from an SPK file
      description: Imports a model from a SAS package (SPK) file. Select an SPK file
        from a local machine and then import it. The folder ID or project version
        ID is required. If importing a model into a folder, use folder ID. Otherwise,
        use project version ID.
      parameters:
      - name: name
        in: query
        required: true
        description: The name of the model.
        schema:
          type: string
      - name: type
        in: query
        required: true
        description: The type of model. The value must be "SPK".
        schema:
          type: string
          format: sort-criteria
          default: SPK
      - name: folderId
        in: query
        required: false
        description: The unique identifier for the folder. The `folderId` or `projectVersionId`
          parameter must be specified.
        schema:
          type: string
          format: sort-criteria
      - name: projectVersionId
        in: query
        required: false
        description: The unique identifier for the project version. The `folderId`
          or `projectVersionId` parameter must be specified.
        schema:
          type: string
          format: sort-criteria
      - name: function
        in: query
        required: false
        description: The function of the model.
        schema:
          type: string
          format: sort-criteria
      - name: description
        in: query
        required: false
        description: The description of the model.
        schema:
          type: string
          format: sort-criteria
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  description: Select an SPK file from your local client machine.
                  type: string
                  format: binary
              required:
              - files
      responses:
        "201":
          description: The model was imported.
          headers:
            Location:
              description: The location of this model.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/modelCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/modelCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. The model already exists.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /models#octetStream:
    post:
      operationId: importModelByOctetstream
      tags:
      - Models
      summary: Import a model through an octet stream
      description: Imports a model through input stream. The folder ID or project
        version ID is required. If the model should be imported into a folder, use
        the folder ID. Otherwise, use project version ID.
      parameters:
      - name: name
        in: query
        required: true
        description: The model name.
        schema:
          type: string
      - name: type
        in: query
        required: true
        description: The value for type can be SPK, ZIP, or CAS.
        schema:
          type: string
          format: sort-criteria
          default: SPK
      - name: folderId
        in: query
        required: false
        description: You must specify a folder ID or project version ID.
        schema:
          type: string
          format: sort-criteria
      - name: projectVersionId
        in: query
        required: false
        description: You must specify a folder ID or project version ID.
        schema:
          type: string
          format: sort-criteria
      - name: projectName
        in: query
        required: false
        description: The model is imported into this project.
        schema:
          type: string
          format: sort-criteria
      - name: versionOption
        in: query
        required: false
        description: This parameter indicates to create a new version, use the latest
          version, or use an existing version to import the model into. Valid values
          are NEW, LATEST, or a number.
        schema:
          type: string
          format: sort-criteria
      - name: function
        in: query
        required: false
        description: The function of the model.
        schema:
          type: string
          format: sort-criteria
      - name: description
        in: query
        required: false
        description: The description of the model.
        schema:
          type: string
          format: sort-criteria
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: Select a model content from your local machine to import a model.
        required: true
      responses:
        "201":
          description: The model was imported.
          headers:
            Location:
              description: The location of the model.
              schema:
                type: string
            ETag:
              description: The entity tag for the model.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/modelCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/modelCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "409":
          description: The request could not be completed due to a conflict with the
            current state of the resource. The model already exists.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  "/models/{modelId}":
    get:
      operationId: getModel
      tags:
      - Models
      summary: Get a model
      description: Returns the model information for the specified model ID.
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The model information is returned.
          headers:
            Etag:
              description: A tag that identifies the revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/model"
            application/json:
              schema:
                $ref: "#/components/schemas/model"
        "404":
          description: Not found
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    head:
      operationId: headersForModel
      tags:
      - Models
      summary: Check if a model exists
      description: Returns the header information for the specified model ID. Also
        used to determine whether a model exists.
      parameters:
      - name: modelId
        in: path
        required: true
        description: The unique identifier for the model.
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The model information was returned.
          headers:
            Etag:
              description: The entity tag for the model.
              schema:
                type: string
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/model"
            application/json:
              schema:
                $ref: "#/components/schemas/model"
        "404":
          description: No model exists at the requested path.
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    put:
      operationId: updateModel
      tags:
      - Models
      summary: Update a model
      description: Updates the model information for the model that matches the specified
        criteria and model ID.
      parameters:
      - name: If-Match
        in: header
        required: true
        description: Client needs to specify the previously pulled <b>ETag</b> as
          <b>If-Match</b>header.
        schema:
          type: string
      - name: modelId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.models.model:
            schema:
              $ref: "#/components/schemas/model"
          application/json:
            schema:
              $ref: "#/components/schemas/model"
        description: If the model is defined, then this information is mandatory.
      responses:
        "200":
          description: The model was updated.
          headers:
            Etag:
              description: The entity tag for the model.
              schema:
                type: string
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/model"
            application/json:
              schema:
                $ref: "#/components/schemas/model"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "404":
          description: No model exists at the requested path.
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resource's last modified timestamp.
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
        "428":
          description: The request headers did not include a `If-Match` or `If-Unmodified-Since`
            precondition.
          content:
            application/vnd.sas.models.model+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
    delete:
      operationId: deleteModel
      tags:
      - Models
      summary: Delete a model
      description: Deletes the model with the specified ID from the model repository.
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The model was deleted.
        "404":
          description: No model exists at the requested path for the specified model
            ID.
  "/models/{modelId}/analyticStore":
    get:
      operationId: getModelAnalyticStores
      tags:
      - Models
      summary: Get a list of model analytic stores
      description: Returns a list of metadata for analytic stores (application/vnd.sas.models.analytic.store)
        that are associated with the model. Note that this does not allow retrieval
        of the analytic store, only the metadata.
