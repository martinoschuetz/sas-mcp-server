        in: query
        required: false
        description: "The maximum number of items to return in the request. "
        schema:
          type: integer
          format: int32
          default: 20
      - name: filter
        in: query
        required: false
        description: The criteria for filtering the tags. For more information, see
          [Filtering in REST APIs](https://developer.sas.com/rest-apis/modelRepository/docs/getting-started/usage-notes#filtering).
        schema:
          type: string
          format: filter-criteria
      responses:
        "200":
          description: The request succeeded. The tags were returned.
          headers:
            Etag:
              description: The entity tag of the repository.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json":
              schema:
                $ref: "#/components/schemas/userDefinedTagCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/userDefinedTagCollection"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error2"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
  /commons/tableInfo:
    get:
      operationId: getTableInfo
      tags:
      - Models
      summary: Get data table information
      description: Returns the information for the data table that is associated with
        the specified URL.
      parameters:
      - name: url
        in: query
        required: true
        description: The URL for the data table.
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: The 0-based start index of a paginated request.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        description: The maximum number of items to return in this request.
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: The request succeeded.
          headers:
            Cache-Control:
              description: Controls how the response is cached by the browser.
              schema:
                type: string
            Content-Security-Policy:
              description: The security policy chosen to prevent code execution vulnerabilities.
              schema:
                type: string
            Content-Type:
              description: The media type of the response.
              schema:
                type: string
            Date:
              description: The date of the response.
              schema:
                type: string
                format: date-time
            Expires:
              description: The date after which the response is considered expired.
              schema:
                type: string
                format: date-time
            Pragma:
              description: Used for backward compatibility with HTTP/1.0 caches that
                do not support the Cache-Control HTTP/1.1 header.
              schema:
                type: string
            Sas-Service-Response-Flag:
              description: A service response flag that is specific to SAS.
              schema:
                type: boolean
            Strict-Transport-Security:
              description: Enforces secure connections to the server by specifying
                a duration during which browsers should communicate only using HTTPS.
              schema:
                type: string
            Vary:
              description: Specifies headers that a cache should consider when determining
                if a cached response is valid.
              schema:
                type: string
            X-Content-Type-Options:
              description: Prevents browsers from interpreting files as a different
                MIME type than what is specified in the `Content-Type` header.
              schema:
                type: string
            X-Xss-Protection:
              description: Configures browser-based cross-site scripting (XSS) filters.
              schema:
                type: string
            Connection:
              description: Controls whether the network connection stays open after
                the current transaction.
              schema:
                type: string
            Transfer-Encoding:
              description: Specifies how the response is encoded for transfer.
              schema:
                type: string
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/tableInfo"
              examples:
                default:
                  $ref: "#/components/examples/getTableInfo"
            application/json:
              schema:
                $ref: "#/components/schemas/tableInfo"
              examples:
                default:
                  $ref: "#/components/examples/getTableInfo"
        "404":
          description: No data table exists at the requested URL.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/notFoundError"
              examples:
                default:
                  $ref: "#/components/examples/notFoundError"
            application/json:
              schema:
                $ref: "#/components/schemas/notFoundError"
              examples:
                default:
                  $ref: "#/components/examples/notFoundError"
components:
