---
openapi: 3.0.3
info:
  version: "6"
  title: Subject Contacts
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: The Subject Contacts API records contacts to subjects and records documents
    that are produced when executing decisions and business rules.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Contacts
  description: Contains the operations for the contacts resource.
- name: Aggregations
  description: Contains the operations for the aggregations resource.
- name: Traces
  description: Contains the operations for the traces resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level resource links
      description: Returns a list of links to the top-level resources in this API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
  /contacts:
    get:
      tags:
      - Contacts
      summary: Get all contacts
      description: Returns a collection of information about each contact made. Each
        item also contains the presentation, and the response to that contact.
      operationId: getContacts
      parameters:
      - name: start
        in: query
        description: The starting index of the first item on a page. The index is
          0-based. The default index is 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of items to return on this page. The actual
          number of returned items might be less if there are no more items in the
          collection. The default is 10.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The sorting criteria for the returned contacts. The default sort
          order is creationTimeStamp:descending.
        schema:
          type: string
          format: sort-criteria
      - name: filter
        in: query
        description: The filter criteria for the returned contacts. All fields of
          application/vnd.sas.decision.subject.contact can be used in the filter.
        schema:
          type: string
          format: filter-criteria
      - name: Accept-Item
        in: header
        description: Select the desired item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.decision.subject.contact+json
          - application/vnd.sas.search.indexable.data+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.summary+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/subjectContactCollection"
              examples:
                default:
                  $ref: "#/components/examples/subjectContactCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/subjectContactCollection"
              examples:
                default:
                  $ref: "#/components/examples/subjectContactCollection"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    post:
      tags:
      - Contacts
      summary: Create a new contact record
      description: The contact and response are recorded. If the presentation is configured
        to be recorded, it can be recorded at this time or deferred to a future update.
        The PATCH action can be used with the responseTrackingCode property to make
        the update and record the response to the treatment. If the operation is to
        be fulfilled asynchronously by using asynchronous=true, a resource ID is issued
        without waiting for the completion of the operation. The endpoint returns
        a URI for retrieving the resource in the Location response header. An HTTP
        status of 202 is returned.
      operationId: createContact
      parameters:
      - name: asynchronous
        in: query
        description: Whether the operation is to be carried out asynchronously or
          not. The default is false.
        schema:
          type: boolean
      requestBody:
        $ref: "#/components/requestBodies/subjectContact"
      responses:
        "201":
          description: A resource was created.
          headers:
            Location:
              description: The URI of the contact.
              schema:
                type: string
            ETag:
              description: A tag that identifies this contact.
              schema:
                type: string
          content:
            application/vnd.sas.decision.subject.contact+json:
              schema:
                $ref: "#/components/schemas/subjectContact"
              examples:
                default:
                  $ref: "#/components/examples/subjectContact"
            application/json:
              schema:
                $ref: "#/components/schemas/subjectContact"
              examples:
                default:
                  $ref: "#/components/examples/subjectContact"
        "202":
          description: The asynchronous request is accepted for processing, but the
            processing has not been completed.
          headers:
            Location:
              description: The URI of the contact.
              schema:
                type: string
          content:
            application/vnd.sas.decision.subject.contact+json:
              schema:
                $ref: "#/components/schemas/subjectContact"
              examples:
                default:
                  $ref: "#/components/examples/subjectContactAsynchronous"
            application/json:
              schema:
                $ref: "#/components/schemas/subjectContact"
              examples:
                default:
                  $ref: "#/components/examples/subjectContactAsynchronous"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
  /contacts#multiples:
    get:
      tags:
      - Contacts
      operationId: getContactsAsCSV
      summary: Export contact records
      description: "Exports contacts as CSV text. A filter can be used to select the\
        \ contacts. If a filter is not used, all contacts are returned. The output\
        \ is not pageable nor sortable. A header is not returned by default. To add\
        \ a header, add the `header=present` option to the text/csv media type. The\
        \ columns are:\n<ul> <li>id</li> <li>creationTimeStamp</li> <li>responseTrackingCode</li>\
        \ <li>subjectId</li> <li>subjectLevel</li> <li>excludeFromContactRule</li>\
        \ <li>conclusionResponseValue</li> <li>conclusionResponseType</li> <li>objectUri</li>\
        \ <li>objectRevisionId</li> <li>objectType</li> <li>objectVariables</li> <li>receiverId</li>\
        \ <li>receiverRole</li> <li>channel</li> <li>ruleFired</li> <li>pathTraversed</li>\
        \ <li>abTests</li> <li>treatmentId</li> <li>treatmentRevisionId</li> <li>treatmentGroupId</li>\
        \ <li>treatmentGroupRevisionId</li> <li>objectNodeId</li> <li>presented</li>\
        \ <li>presentedTimeStamp</li> <li>respondedTimeStamp</li> <li>responseValue</li>\
        \ <li>responseType</li> <li>responseChannel</li> </ul>"
      parameters:
      - name: Accept
        in: header
        required: true
        description: In addition to text/csv, also include application/vnd.sas.error+json
          in the Accept header. The two media types are separated by a comma. If there
          is a processing error, the error is reported in a JSON error object. In
          that case, without this arrangement, since the client is expecting only
          a response of text/csv type, the server uses Http status of 406 to tell
          the client that it cannot match the expectation because a JSON error object
          cannot be mapped into a text/csv response. By also accepting application/vnd.sas.error+json,
          this is avoided.
        schema:
          type: string
          enum:
          - text/csv, application/vnd.sas.error+json
      - name: filter
        in: query
        description: The filter criteria for the returned contacts. All fields of
          application/vnd.sas.decision.subject.contact can be used in the filter.
          If a filter is not used, all the contacts are returned.
        schema:
          type: string
          format: filter-criteria
      responses:
        "200":
          description: The request succeeded. The export was successful.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            text/csv:
              schema:
                type: string
              examples:
                default:
                  $ref: "#/components/examples/subjectContactCSV"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "406":
          description: The media type is incompatible. Occurs when there is an error
            but the error response media type is not compatible with the text/csv
            media type. The server returns this status error instead.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notAcceptable"
    post:
      tags:
      - Contacts
      operationId: createContactsFromCSV
      summary: Create contact records from CSV
      description: "Creates contact records from a CSV file. It imports the CSV text\
        \ with a header row that specifies the order of these required columns:\n\
        <ul> <li>creationTimeStamp</li> <li>responseTrackingCode</li> <li>subjectId</li>\
        \ <li>subjectLevel</li> <li>excludeFromContactRule</li> <li>conclusionResponseValue</li>\
        \ <li>conclusionResponseType</li> <li>objectUri</li> <li>objectRevisionId</li>\
        \ <li>objectType</li> <li>objectVariables</li> <li>receiverId</li> <li>receiverRole</li>\
        \ <li>channel</li> <li>ruleFired</li> <li>pathTraversed</li> <li>abTests</li>\
        \ <li>treatmentId</li> <li>treatmentRevisionId</li> <li>treatmentGroupId</li>\
        \ <li>treatmentGroupRevisionId</li> <li>objectNodeId</li> <li>presented</li>\
        \ <li>presentedTimeStamp</li> <li>respondedTimeStamp</li> <li>responseValue</li>\
        \ <li>responseType</li> <li>responseChannel</li> </ul>\n\nA contact might\
        \ require one or more rows of CSV text to describe it. There is one row for\
        \ each treatment to be considered. A contact can include more than one treatment.\
        \ The information in the columns from responseTrackingCode to pathTraversed\
        \ are repeated. The columns from treatmentId to responseChannel contain unique\
        \ information per row.\n\nCSV text that is obtained by the counterpart GET\
        \ action can be used here. The GET action includes an ID column in the output.\
        \ The import ignores the ID value and a new ID is generated for each contact.\
        \ Importing the CSV text that is obtained by CSV exporting on the same deployment\
        \ is not successful because there is a uniqueness constraint violation in\
        \ the response tracking code value.\n\nIn the objectVariables column, each\
        \ name, value, dataType tuple in the array is represented as a triple tilde\
        \ separated string and each tuple is separated by a semicolon. The strings\
        \ cannot contain semicolons.\n\nThe responseTrackingCode column cannot be\
        \ blank.\n\nIf the contact already exists, the unique information columns\
        \ on the rows are used to update the contact. The other columns must carry\
        \ information identical to what is already recorded. If this condition is\
        \ not met, the update is rejected.\n\nThese are the immutable columns: <ul>\
        \ <li>creationTimeStamp</li> <li>responseTrackingCode</li> <li>subjectId</li>\
        \ <li>subjectLevel</li> <li>objectUri</li> <li>objectRevisionId</li> <li>objectType</li>\
        \ <li>objectVariables</li> <li>receiverId</li> <li>receiverRole</li> <li>channel</li>\
        \ <li>ruleFired</li> <li>pathTraversed</li> <li>abTests</li> <li>treatmentId</li>\
        \ <li>treatmentRevisionId</li> <li>treatmentGroupId</li> <li>treatmentGroupRevisionId</li>\
        \ <li>objectNodeId</li> </ul>\n\nThe input CSV is processed in the order it\
        \ is received. All contiguous rows with the same responseTrackingCode are\
        \ considered one section. Those rows are processed according to the description\
        \ above. It is possible to have the same responseTrackingCode in non-consecutive\
        \ sections. In that case, the subsequent section is considered updating the\
        \ contact from the previous section. The service tries to process as many\
        \ rows as possible.\n\nThe output is a multipart/mixed response body. The\
        \ boundary string of each part is identified in the Content-Type response\
        \ header. There are three parts in this response.\n\nThe first part is for\
        \ the accepted CSV (header Content-ID: Accepted-CSV). Each contact that was\
        \ successfully processed is included here. As soon as a contact is created,\
        \ its rows are streamed back.\n\nThe second part is for the rejected CSV (header\
        \ Content-ID:Rejected-CSV). Each contact that failed processing is identified\
        \ here. It is in CSV format with the following column order: record number\
        \ in the entire CSV input, the columns from the input row, and error message.\
        \ If one line of text has error, all the lines for that contact are rejected.\
        \ This API prints the first line of the rejected text.\n\nThe third part is\
        \ for global issues (header Content-ID: Global-Issue). It is in CSV format\
        \ with the following column order: responseTrackingCode or the asterisk value\
        \ (i.e wildcard for all contacts), global error message that conveys the error\
        \ that prevents any CSV processing. An example would be the lack of permissions."
      parameters:
      - name: Accept
        in: header
        required: true
        description: In addition to multipart/mixed, also include application/vnd.sas.error+json
          in the Accept header. The two media types are separated by a comma. If there
          is a processing error, the error is reported in a JSON error object. In
          that case, without this arrangement, since the client is expecting only
          a response of multipart/mixed type, the server uses Http status of 406 to
          tell the client that it cannot match the expectation because a JSON error
          object cannot be mapped into a multipart/mixed response. By also accepting
          application/vnd.sas.error+json, this is avoided.
        schema:
          type: string
          enum:
          - multipart/mixed, application/vnd.sas.error+json
      - name: If-Unmodified-Since
        in: header
        required: false
        description: Checks to see whether the existing subject contacts identified
          in the CSV have not been modified since the time specified in the value.
          If this is not true, the update is not performed. This header is not required
          when CSV text is used to create contact records. However, this header is
          required when the CSV text is used to update existing contact records. The
          value is a timestamp. An appropriate value might be a timestamp that marks
          a point past the last update of the records to be updated.
        schema:
          type: string
      requestBody:
        content:
          text/csv:
            schema:
              type: string
            examples:
              default:
                $ref: "#/components/examples/createContactsFromCSV"
        description: The CSV that contains a header row.
        required: true
      responses:
        "200":
          description: The request succeeded. One or more contacts were created. Check
            the response for any errors.
          headers:
            Location:
              description: The URI for retrieving the contacts that were created.
              schema:
                type: string
          content:
            multipart/mixed:
              schema:
                type: object
                properties:
                  part1:
                    description: Accepted response
                    type: object
                    properties:
                      contentType:
                        type: string
                      contentId:
                        type: string
                      body:
                        type: string
                  part2:
                    description: Rejected response
                    type: object
                    properties:
                      contentType:
                        type: string
                      contentId:
                        type: string
                      body:
                        type: string
                  part3:
                    description: Global issues
                    type: object
                    properties:
                      contentType:
                        type: string
                      contentId:
                        type: string
                      body:
                        type: string
              examples:
                default:
                  $ref: "#/components/examples/subjectContactMultipartMixed"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "406":
          description: The media type is incompatible. Occurs when there is an error
            but the error response media type is not compatible with the multipart/mixed
            media type. The server returns this status error instead.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notAcceptable"
        "412":
          description: The `If-Unmodified-Since` request header did not match the
            resource's last modified timestamp. The resource has changed. The "If-Match"
            header is not appropriate here because multiple records are included.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        "428":
          description: The 'If-Unmodified-Since' header was not sent. The "If-Match"
            header is not appropriate here because multiple records are included.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
  "/contacts/{contactId}":
    get:
      tags:
      - Contacts
      operationId: getContact
      summary: Get a contact
      description: Returns information about the contact.
      parameters:
      - name: contactId
        in: path
        description: The resource identifier of a contact.
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Selects the desired item representation.
        schema:
          type: string
          enum:
          - application/vnd.sas.decision.subject.contact+json
          - application/vnd.sas.summary+json
          default: application/vnd.sas.decision.subject.contact+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            ETag:
              description: A tag that identifies this contact.
              schema:
                type: string
          content:
            application/vnd.sas.decision.subject.contact+json:
              schema:
                $ref: "#/components/schemas/subjectContact"
              examples:
                default:
                  $ref: "#/components/examples/subjectContact"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/subjectContactSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/subjectContact"
              examples:
                default:
                  $ref: "#/components/examples/subjectContact"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    put:
      tags:
      - Contacts
      summary: Update a contact record
      description: "Updates the contact record by replacing it. Use this endpoint\
        \ to update the presentation or the response of the treatments in the contact.\
        \ Presentation and responses can be updated multiple times. For example, a\
        \ subject clicking a treatment link is one type of response and subsequent\
        \ engagement (for example, taking the next step in a commercial flow) is another\
        \ response. Depending on how the merchant wants to track responses, it can\
        \ be multiple updates or just one update of the final response.  Although\
        \ some members of the contact record have changed, the full contact object\
        \ is required for this action. Since some members are immutable, an error\
        \ occurs if you attempt to change them. Furthermore, if a member is an array,\
        \ it is an error to change the number of entries in the array. These are the\
        \ immutable first and second-level members of the record:\n<ul> <li>responseTrackingCode</li>\
        \ <li>subjectId</li> <li>subjectLevel</li> <li>objectUri</li> <li>objectRevisionId</li>\
        \ <li>objectType</li> <li>objectVariables</li> <li>receiverId</li> <li>receiverRole</li>\
        \ <li>channel</li> <li>ruleFired</li> <li>pathTraversed</li> <li>treatmentId</li>\
        \ <li>treatmentRevisionId</li> <li>treatmentGroupId</li> <li>treatmentGroupRevisionId</li>\
        \ <li>objectNodeId</li> </ul>\n\nDo not alter the members that should not\
        \ be changed. An alternative is to use the PATCH action, which requires only\
        \ sending in members to be changed together with the response tracking code.\n\
        \nAt the successful completion of the PUT action, the full updated record\
        \ is sent in the response."
      operationId: updateContact
      parameters:
      - name: contactId
        in: path
        description: The resource identifier for a contact.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The ETag value that was returned from a GET, POST, or PATCH of
          the resource. If the ETag value does not match the ETag value of the resource,
          the update cannot be completed. This is preferred over the If-Unmodified-Since
          header.
        required: false
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the last modified timestamp of the resource. If
          the resource has been updated since this time, the update cannot be completed.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.decision.subject.contact+json:
            schema:
              $ref: "#/components/schemas/subjectContact"
            examples:
              default:
                $ref: "#/components/examples/subjectContact"
          application/json:
            schema:
              $ref: "#/components/schemas/subjectContact"
            examples:
              default:
                $ref: "#/components/examples/subjectContact"
        description: The full contact record.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Location:
              description: The URI of the contact.
              schema:
                type: string
            ETag:
              description: A tag that identifies this contact.
              schema:
                type: string
          content:
            application/vnd.sas.decision.subject.contact+json:
              schema:
                $ref: "#/components/schemas/subjectContact"
              examples:
                default:
                  $ref: "#/components/examples/subjectContact"
            application/json:
              schema:
                $ref: "#/components/schemas/subjectContact"
              examples:
                default:
                  $ref: "#/components/examples/subjectContact"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resource's last modified timestamp.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        "428":
          description: The request headers did not include a `If-Match` or 'If-Unmodified-Since'
            precondition.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
    patch:
      tags:
      - Contacts
      summary: Patch a contact record
      description: Patches a contact record by sending a partial representation of
        the contact record, which includes a key field and the fields that are to
        be changed. The full object is sent in the response. If a field in the partial
        representation has the 'null' value, it is interpreted to mean that a value
        is not sent rather than having the value in the field erased.
      operationId: patchContact
      parameters:
      - name: contactId
        in: path
        description: The resource identifier for a contact. Alternatively, use the
          delegate resource identifier @deriveFromContent. When this delegate resource
          identifier is used, the service looks into the request body for an identifier
          of the resource. In this case, it is the responseTrackingCode member of
          the partial contact record. This identifier is to be used in lieu of the
          actual resource identifier.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The ETag value that was returned from a GET, POST, or PATCH of
          the resource. If the ETag value does not match the ETag value of the resource,
          the update is not completed. This is preferred over the If-Unmodified-Since
          header.
        required: false
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The value of the last modified timestamp of the resource. If
          the resource has been updated since this time, the update cannot be completed.
        required: false
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/subjectContact"
      responses:
        "200":
          description: The request succeeded.
          headers:
            Location:
              description: The URI of the contact.
              schema:
                type: string
            ETag:
              description: A tag that identifies this contact.
              schema:
                type: string
          content:
            application/vnd.sas.decision.subject.contact+json:
              schema:
                $ref: "#/components/schemas/subjectContact"
              examples:
                default:
                  $ref: "#/components/examples/subjectContact"
            application/json:
              schema:
                $ref: "#/components/schemas/subjectContact"
              examples:
                default:
                  $ref: "#/components/examples/subjectContact"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "409":
          description: The presentation has already been set and cannot be updated.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/conflict"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag, or the `If-Unmodified-Since` request header did not match
            the resource's last modified timestamp.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        "422":
          description: The server understands the request but was unable to process
            the contained instructions. There are inconsistencies between members
            of the contact records as a result of the operation. An example is changing
            the respondedTimeStamp to a value earlier than the stored presentedTimeStamp.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/unprocessableEntity"
        "428":
          description: The request header did not include a `If-Match` or 'If-Unmodified-Since'
            precondition.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
    delete:
      tags:
      - Contacts
      operationId: deleteContact
      summary: Delete a contact record
      description: Deletes a contact record.
      parameters:
      - name: contactId
        in: path
        description: The identifier for a contact.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The contact was deleted.
        "404":
          description: No resource exists at the requested path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /aggregations:
    post:
      tags:
      - Aggregations
      operationId: aggregateInformation
      summary: Use a query to answer several related queries
      description: "Returns information about the treatments. In anticipating queries\
        \ like how many times a subject has been contacted in the last N time-units\
        \ through X channels for different values of N, for multiple time units, for\
        \ different channel values X, this endpoint allows the user to provide the\
        \ parameters so that these queries can be answered at once by aggregating\
        \ the results of multiple queries. This is done by combining different values\
        \ of time, time unit, contact channel and response channel.\n\nThe aggregation\
        \ period is divided into widening sub-periods. The unit of division, such\
        \ as hour, is provided in the aggregation specification. The first sub-period\
        \ covers the endTimeStamp back to the start of the closest unit. The second\
        \ sub-period adds one unit to the length. The last element of the array covers\
        \ the entire aggregation period.\n\nIf the excludeFromContactRule field of\
        \ a contact record is true, the record is excluded from the aggregation."
      requestBody:
        content:
          application/vnd.sas.decision.subject.contact.aggregation.specification+json:
            schema:
              $ref: "#/components/schemas/aggregationSpecification"
            examples:
              default:
                $ref: "#/components/examples/aggregationSpecification"
          application/json:
            schema:
              $ref: "#/components/schemas/aggregationSpecification"
            examples:
              default:
                $ref: "#/components/examples/aggregationSpecification"
        description: The aggregation parameters.
        required: true
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.decision.subject.contact.aggregation.treatment+json:
              schema:
                $ref: "#/components/schemas/subjectContactTreatmentAggregate"
              examples:
                default:
                  $ref: "#/components/examples/subjectContactTreatmentAggregate"
            application/json:
              schema:
                $ref: "#/components/schemas/subjectContactTreatmentAggregate"
              examples:
                default:
                  $ref: "#/components/examples/subjectContactTreatmentAggregate"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  /traces:
    get:
      tags:
      - Traces
      summary: Get decision traces
      description: "Returns a collection of decision traces. The traces can either\
        \ be returned in either text/tab-separated-values or application/vnd.sas.collection+json\
        \ format. The former would be the same format used for adding a decision trace.\
        \ In the latter format, the traces without the actual trace texts are returned\
        \ as items in a collection.\n\nThere are two types of traces: one is at the\
        \ decision step boundary and the other is at the variable assignment. Each\
        \ GET only obtains the type of traces specified. The scope query parameter\
        \ is used to specify the type of traces.\n\nThe order of the columns for query\
        \ parameter `scope=step` in tab-separated-values format are: traceid, seqno,\
        \ tracetimestamp, objecturi, processornote, text. The version is 1 implicitly.\
        \ Always use the column heading to help you locate a specific column. The\
        \ order of the column and the number of columns are not fixed.\n\nThe order\
        \ of the columns for query parameter `scope=assignment` in tab-separated-values\
        \ format are: traceid, seqno, tracetimestamp, objecturi, processornote, version,\
        \ scope, and text. The current version is 2. However, always use the column\
        \ heading to help you locate a specific column. The order of the column and\
        \ the number of columns might change in a future version."
      operationId: getTraces
      parameters:
      - name: scope
        in: query
        description: The type of traces.
        required: false
        schema:
          type: string
          enum:
          - assignment
          - step
          default: step
      - name: start
        in: query
        description: The starting index of the first item on a page. The index is
          0-based. The default index is 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of items to return on this page. The actual
          number of returned items might be less if there are no more items in the
          collection. The default is 10 for the application/vnd.sas.collection+json
          format. For the tab-separated-values format the default is 1 because the
          trace text is included in the output. Trace text can be very long. There
          is much higher potential of exhausting the service's memory when retrieving
          a lot of trace texts at once.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The sorting criteria for the returned traces.
        schema:
          type: string
          format: sort-criteria
      - name: filter
        in: query
        description: The filter criteria for the returned traces. The fields that
          can be used are traceId, traceTimeStamp and processorNote.
        schema:
          type: string
          format: filter-criteria
      - name: Accept
        in: header
        description: Selects the desired representation
        schema:
          type: string
          enum:
          - text/tab-separated-values
          - application/vnd.sas.collection+json
          - application/json
          default: application/vnd.sas.collection+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            text/tab-separated-values:
              schema:
                type: string
              examples:
                default:
                  $ref: "#/components/examples/traceCollectionTSV"
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/traceCollection"
              examples:
                default:
                  $ref: "#/components/examples/traceCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/traceCollection"
              examples:
                default:
                  $ref: "#/components/examples/traceCollection"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
    post:
      tags:
      - Traces
      operationId: appendOrUpdateTracesFromTsv
      summary: Append text or update traces from TSV
      description: "Appends text to the collection or updates the processorNote field\
        \ of appended text.\nThere are two types of traces: one is at the decision\
        \ step boundary and other is at the variable assignment. The scope query parameter\
        \ is used to specify the type of trace.\n\nThis operation processes tab-separated-values\
        \ (TSV) text with a case-insensitive header row that specifies the order of\
        \ these required columns:\n<ul> <li>traceId</li> <li>seqNo</li> <li>traceTimeStamp</li>\
        \ <li>objectUri</li> <li>action</li> <li>processorNote</li> <li>text</li>\
        \ </ul>\nA decision trace might require one or more rows of TSV text to convey.\
        \ The value of seqNo, starting from 1, should be  monotonically increasing\
        \ from the first row to the last row. The rows are likely to be appended using\
        \ multiple POST actions due to request body size restriction on the client\
        \ formulating the POST action. Otherwise, one TSV row would have been used.\n\
        \nThe text column value must not include the TAB character.\n\nThe text column\
        \ contains whole or part of a decision trace.\n\nThe value of the action column\
        \ is either append or update.\n\nWhen the POST call is used to append text\
        \ to the collection, all the above columns except the processorNote column\
        \ must be given non-empty values.\n\nWhen the POST call is used to update\
        \ text to the collection, the only column that can be changed is the processorNote\
        \ column. The traceId column must have a value for the service to know which\
        \ execution trace to update. Since a trace has one or more rows, the seqNo\
        \ column is normally left empty so that all rows of the trace receive the\
        \ same processorNote value. The other columns (traceTimeStamp, objectUri,\
        \ text) should be left empty. If values are specified for these columns, they\
        \ are ignored since they cannot be changed. Here is the order that the columns\
        \ for updated:\n<ul> <li>traceId</li> <li>seqNo</li> <li>traceTimeStamp</li>\
        \ <li>objectUri</li> <li>text</li> <li>action</li> <li>processorNote</li>\
        \ </ul>\nThe output is a multipart/mixed response body. The boundary string\
        \ of each part is identified in the Content-Type response header. There are\
        \ three parts in this response.\n<ol> <li>The first part is for the accepted\
        \ TSV (header Content-ID: Accepted-TSV). Each trace line that was successfully\
        \ processed is identified here.</li>\n<li>The second part is for the rejected\
        \ TSV (header Content-ID:Rejected-TSV). Each trace that could not be processed\
        \ is identified here. It is in CSV format with the following column order:\
        \ traceId, and error message.</li>\n<li>The third part is for global issues\
        \ (header Content-ID: Global-Issue). It is in TSV format with the following\
        \ column order: line number, global error message that conveys the error that\
        \ prevents any TSV processing. An example would be the lack of permissions.</li>\
        \ </ol>"
      parameters:
      - name: scope
        in: query
        description: The type of traces.
        required: false
        schema:
          type: string
          enum:
          - assignment
          - step
          default: step
      - name: Accept
        in: header
        required: true
        description: In addition to multipart/mixed, also include application/vnd.sas.error+json
          in the Accept header. The two media types are separated by a comma. If there
          is a processing error, the error is reported in a JSON error object. In
          that case, without this arrangement, since the client is expecting only
          a response of multipart/mixed type, the server uses Http status of 406 to
          tell the client that it cannot match the expectation because a JSON error
          object cannot be mapped into a multipart/mixed response. By also accepting
          application/vnd.sas.error+json, this is avoided.
        schema:
          type: string
          enum:
          - multipart/mixed, application/vnd.sas.error+json
      requestBody:
        content:
          text/tab-separated-values:
            schema:
              type: string
            examples:
              default:
                $ref: "#/components/examples/traceCollectionTSV"
        description: The tap-separated-values that contains a header row.
        required: true
      responses:
        "200":
          description: The request succeeded. One or more rows of text are appended.
            Check the response for any error.
          content:
            multipart/mixed:
              schema:
                type: object
                properties:
                  part1:
                    description: Accepted response
                    type: object
                    properties:
                      contentType:
                        type: string
                      contentId:
                        type: string
                      body:
                        type: string
                  part2:
                    description: Rejected response
                    type: object
                    properties:
                      contentType:
                        type: string
                      contentId:
                        type: string
                      body:
                        type: string
                  part3:
                    description: Global issues
                    type: object
                    properties:
                      contentType:
                        type: string
                      contentId:
                        type: string
                      body:
                        type: string
              examples:
                default:
                  $ref: "#/components/examples/traceCollectionMultipartMixed"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
    delete:
      tags:
      - Traces
      operationId: deleteTraces
      summary: Delete traces
      description: Deletes traces produced by decision execution.
      parameters:
      - name: scope
        in: query
        description: The type of traces to delete. For your convenience, if both decision
          step and variable assignment traces, exist, they can be deleted at the same
          time if the value of the scope query parameter is "all".
        required: false
        schema:
          type: string
          enum:
          - all
          - assignment
          - step
          default: step
      - name: start
        in: query
        description: The starting index of the first item on a page. The index is
          0-based. The default index is 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of items to work on. The actual number of
          returned items might be less if there are no more items in the collection.
          The default is 10.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The sorting criteria for the returned traces.
        schema:
          type: string
          format: sort-criteria
      - name: filter
        in: query
        description: The filter criteria for identifying the trace. The fields that
          can be used are traceId, traceTimeStamp and processorNote.
        schema:
          type: string
          format: filter-criteria
      responses:
        "204":
          description: The request is processed.
  "/traces/{traceId}/process":
    post:
      tags:
      - Traces
      operationId: processTrace
      summary: Process a trace and store a report file
      description: "Processes a trace and stores the report in a file resource in\
        \ the Files service. A text report is produced from the raw trace. The text\
        \ report for a decision step boundary provides the following information:\
        \ <ul> <li>The mappings of the input and output variables to the traced decision.\
        \ In general a step in a decision names its variables congruent to their purpose\
        \ in the step while the decision variables are often drawn from a data table\
        \ that name the columns from a perspective different from the step. In that\
        \ case, the decision variables have to be mapped to the step's variables.</li>\n\
        <li>Identifies whether each variable is used an input or output.</li>\n<li>Identifies\
        \ the entering and exiting values of each variable in a step.</li> </ul>\n\
        \nThe text report for a variable assignment provides the following information:\
        \ <ul> <li>The line number in the entire decision code.</li> <li>The DS2 package\
        \ or the thread block name.</li> <li>The line number within the DS2 package\
        \ or the thread block.</li> <li>The variable and the value assigned to it.</li>\
        \ </ul>\nThe report is stored as the content of a file resource in the Files\
        \ service so that it can be obtained for viewing. The file content is given\
        \ the name in the format of testName_trace.txt.\n\nThe same raw trace can\
        \ be processed as many times as needed. At the end of each successful processing,\
        \ the previously allocated file object in the Files service is deleted. A\
        \ new file resource is created. The Files service allows a file size up to\
        \ 100MB by default. The report can be twice as large or more as the raw trace.\n\
        \nUpon successful processing, this operation stores the Files service resource\
        \ URI and the timestamp of the processing  in the processorNote column of\
        \ the raw trace record.\n\nThough a trace ID can be associated with both decision\
        \ boundary and variable assignment traces, only one type of trace can be processed\
        \ at one time."
      parameters:
      - name: traceId
        in: path
        description: The id of the trace to process.
        required: true
        schema:
          type: string
        example: 3b4998e5-bac3-4a60-af24-61f63912fbf0
      - name: scope
        in: query
        description: The type of trace.
        required: false
        schema:
          type: string
          enum:
          - assignment
          - step
          default: step
      - name: testName
        in: query
        description: The name of a decision test case that produces the trace. It
          is used in naming the report. The testName portion of the report name is
          encoded. Each character not safe to be used in a URL are encoded in the
          form of a percent character followed by a pair of hexadecimal characters.
        required: false
        schema:
          type: string
          default: traceId
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              default:
                value: {}
      responses:
        "201":
          description: The request succeeded.
          content:
            application/vnd.sas.decision.trace.report:
              schema:
                $ref: "#/components/schemas/traceReport"
              examples:
                default:
                  $ref: "#/components/examples/traceReport"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No resource identified by the traceId.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
servers:
- url: https://example.com/subjectContacts
  description: This is an example of a base URL.
components:
  headers:
    Sas-Service-Response-Flag:
      description: Indicates whether the response is coming from a SAS service.
      schema:
        type: boolean
      example: true
  requestBodies:
    subjectContact:
      content:
        application/vnd.sas.decision.subject.contact+json:
          schema:
            $ref: "#/components/schemas/subjectContact"
          examples:
            default:
              $ref: "#/components/examples/subjectContact"
        application/json:
          schema:
            $ref: "#/components/schemas/subjectContact"
          examples:
            default:
              $ref: "#/components/examples/subjectContact"
      description: The contact and response representation.
      required: true
  schemas:
    subjectContactCollection:
      title: Contact and Response Collection
      description: A collection of the contact representation.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/subjectContact"
    subjectContact:
      title: Contact Record
      description: A contact representation
      required:
      - subjectId
      - subjectLevel
      - objectUri
      - objectRevisionId
      - objectType
      - responseTrackingCode
      properties:
        id:
          type: string
          readOnly: true
          description: The system-assigned unique ID for this object.
        subjectId:
          type: string
          description: A string that identifies the subject. This cannot be unique
            across subject levels.
        subjectLevel:
          type: string
          description: A string that indicates the type of subject ID. Example values
            are household and customer. A subject is uniquely identified by the subjectLevel
            and subjectId tuple.
        objectUri:
          type: string
          description: A URI of the resource that created this contact record.
        objectRevisionId:
          type: string
          description: A string that identifies the revision of the resource that
            created this contact record.
        objectType:
          type: string
          description: A string that identifies the type of resource that created
            this contact record.
        objectVariables:
          type: array
          description: A place for saving arbitrary values from the object.
          items:
            $ref: "#/components/schemas/objectValue"
        treatmentsForConsideration:
          type: array
          description: All the treatments that a subject can consider.
          items:
            $ref: "#/components/schemas/treatmentForConsideration"
        ruleFired:
          type: string
          description: An encoded string that records which business rules evaluated
            to true.
        pathTraversed:
          type: string
          description: An ordered string that shows the IDs of rules that were evaluated.
        abTests:
          type: array
          description: A place for recording values from AB test node.
          items:
            $ref: "#/components/schemas/abTests"
        responseTrackingCode:
          type: string
          description: A string that a response uses. This is provided by the merchant's
            application. This is for grouping all the responses, one for each treatment,
            considered by the subject.
        receiverId:
          type: string
          description: A string that identifies the person that receives this treatment.
            If the receiver is the subject, then receiverId equals subjectId. Otherwise,
            they are not equal.
        receiverRole:
          type: string
          description: Identifies whether the receiver is a subject or an agent.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when this object is created. This field is a derived
            field. This also serves as the contact timestamp. If there are multiple
            treatments to consider, there is one contact and one contact timestamp.
            For example, all the treatment options are used to build a customized
            web page. All the treatment options are used to populate a menu used by
            a customer agent.
        createdBy:
          type: string
          readOnly: true
          description: ID of the user who created this object. This field is a derived
            field.
        channel:
          type: string
          description: The channel through which the contact is made. This can be
            different from the response channel. For example, a subject receives an
            email for a purchase offer and makes the purchase by telephone.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Timestamp when this object is last modified. This field is
            a derived field. This tells when the response is recorded.
        modifiedBy:
          type: string
          description: ID of the user who last modified this object. This field is
            a derived field.
        conclusionResponseValue:
          type: string
          description: A summary response value derived from the responses to the
            individual treatments
        conclusionResponseType:
          type: string
          description: An interpretation of conclusionResponseValue.
        excludeFromContactRule:
          type: boolean
          description: When true, this contact record is ignored by a contact rule
            when determining an answer. The default is false.
        links:
          type: array
          readOnly: true
          description: Zero or more link objects.
          items:
            $ref: "#/components/schemas/link"
    objectValue:
      title: Object Value
      description: Record a named value from the object that created this contact.
      required:
      - name
      properties:
        name:
          type: string
          description: Field name.
        value:
          type: string
          description: Value.
        dataType:
          type: string
          description: The data type of the value.
          format: enumeration
          enum:
          - boolean
          - date
          - datetime
          - decimal
          - integer
          - string
    abTests:
      title: AB Test Node Records
      description: Record testing data from AB testing.
      required:
      - nodeId
      - champion
      properties:
        nodeId:
          type: string
          description: The ID of the AB test node.
        champion:
          type: boolean
          description: An indicator for whether this record is coming from a Champion
            path.
        pathId:
          type: string
          description: The ID of the AB test case.
        pathName:
          type: string
          description: The name of the AB test case.
        pathKey:
          type: string
          description: The name of an input variable whose value determines which
            outgoing path is used to process input records with the same value of
            the input variable.
    treatmentForConsideration:
      title: Treatments for Subject Consideration
      description: Represents the treatment with its customized attribute values and
        how the subject responds to it.
      required:
      - treatmentId
      - treatmentRevisionId
      - treatmentGroupId
      - treatmentGroupRevisionId
      - objectNodeId
      properties:
        treatmentId:
          type: string
          description: A string that identifies a treatment.
        treatmentRevisionId:
          type: string
          description: A string that identifies the revision of the treatment.
        treatmentGroupId:
          type: string
          description: A string that identifies the group that a treatment belongs
            to.
        treatmentGroupRevisionId:
          type: string
          description: A string that identifies the revision of the group that a treatment
            belongs to.
        objectNodeId:
          type: string
          description: A string that identifies a node in the resource identified
            by the objectUri member in the subject contact record that selected this
            treatment.
        presented:
          type: boolean
          description: Records whether the treatment has been presented. A customer
            agent handling the customer might decide not to present a treatment based
            on the nature and mood of the communication.
        presentedTimeStamp:
          type: string
          format: date-time
          description: Timestamp when the treatment is presented to the subject.
        respondedTimeStamp:
          type: string
          format: date-time
          description: Timestamp when the response is actually received.
        responseValue:
          type: string
          description: The response.
        responseType:
          type: string
          description: An interpretation derived from responseValue.
        responseChannel:
          type: string
          description: The channel through which the response is made. This might
            be different from the contact channel.
        subjectContactId:
          type: string
          description: The system-assigned ID for the subject contact that included
            this treatment.
    aggregationSpecification:
      title: Aggregation Specification
      description: Specify how the aggregation is done. Aggregation is done for a
        subject, for one or more channels and for a definite time period sub-divided
        into segments such as one day, two days, and so on.
      required:
      - subjectId
      - subjectLevel
      properties:
        subjectId:
          description: ID of the subject for whom the aggregation is done.
          type: string
        subjectLevel:
          description: Indicates the type of subject ID.
          type: string
        beginAggregationTimeStamp:
          description: Begin aggregation from this time. If omitted, the aggregation
            starts from seven days prior to the time at which the request is serviced.
          type: string
          format: date-time
        endAggregationTimeStamp:
          description: Stop aggregation before this time. If omitted, the aggregation
            stops right before the time at which the request is serviced.
          type: string
          format: date-time
        timeAggregationUnits:
          type: array
          items:
            type: string
          description: The units to use for time-based aggregation. If omitted, the
            time unit is day. The other acceptable time unit is hour. Aggregation
            can be done in both time units.
        contactChannels:
          type: array
          items:
            type: string
          description: The contact channels to aggregate. All channels found are used
            in secondary aggregation if this is omitted. Through a contact channel,
            a subject is contacted.
        responseChannels:
          type: array
          items:
            type: string
          description: The response channels to aggregate. All channels found are
            used in secondary aggregation if this is omitted. Through a response channel,
            the subject responds to a treatment.
    subjectContactTreatmentAggregate:
      title: Subject Contact Aggregate
      description: Aggregation of a subject's treatments made with the subject by
        channel or time period.
      required:
      - subjectId
      - subjectLevel
      - beginTimeStamp
      - endTimeStamp
      properties:
        subjectId:
          type: string
          description: ID of the subject for whom the aggregation is done.
        subjectLevel:
          type: string
          description: Indicates the type of subject ID.
        beginTimeStamp:
          type: string
          format: date-time
          description: Timestamp that marks the beginning of the aggregation.
        endTimeStamp:
          type: string
          format: date-time
          description: Timestamp that marks the end of the aggregation.
        contactedTimeStampAggregation:
          type: array
          description: Aggregation of the subject's treatments in the contacted timestamp
            dimension
          items:
            $ref: "#/components/schemas/timeStampPrimaryAggregate"
        respondedTimeStampAggregation:
          type: array
          description: Aggregation of the subject's treatments in the responded timestamp
            dimension
          items:
            $ref: "#/components/schemas/timeStampPrimaryAggregate"
        contactChannelAggregation:
          type: array
          description: Aggregation of the subject's treatments in the contact channel
            dimension
          items:
            $ref: "#/components/schemas/channelPrimaryAggregate"
        responseChannelAggregation:
          type: array
          description: Aggregation of the subject's treatments in the response channel
            dimension
          items:
            $ref: "#/components/schemas/channelPrimaryAggregate"
    timeStampAggregate:
      title: Timestamp Aggregation
      description: Aggregation of metadata regarding the timestamp
      required:
      - timeStampType
      - periodLength
      - periodUnit
      - beginTimeStamp
      - endTimeStamp
      properties:
        periodLength:
          type: string
          description: The length of this period in terms of the period unit.
        periodUnit:
          type: string
          description: The unit of the period.
          format: enumeration
          enum:
          - hour
          - day
        timeStampType:
          type: string
          description: The type of timestamp to use for the aggregation
          format: enumeration
          enum:
          - contacted
          - responded
        beginTimeStamp:
          type: string
          format: date-time
          description: Timestamp that marks the beginning of this period.
        endTimeStamp:
          type: string
          format: date-time
          description: Timestamp that marks the end of this period.
        contactedTreatments:
          type: array
          description: array of IDs of treatments IDs corresponding to the contacts.
          items:
            type: string
        presentedTreatments:
          type: array
          description: array of IDs of treatment presented.
          items:
            type: string
        respondedTreatments:
          type: array
          description: array of IDs of treatments that have received response.
          items:
            type: string
    channelAggregate:
      title: Channel Aggregation
      description: Aggregation for channels
      required:
      - name
      - channelType
      properties:
        name:
          type: string
          description: Channel code
        channelType:
          type: string
          description: Type of channel
          format: enumeration
          enum:
          - contact
          - response
        contactedTreatments:
          type: array
          description: array of IDs of treatments IDs corresponding to the contacts.
          items:
            type: string
        presentedTreatments:
          type: array
          description: array of IDs of treatment presented.
          items:
            type: string
        respondedTreatments:
          type: array
          description: array of IDs of treatments that have received response.
          items:
            type: string
    timeStampSecondaryAggregate:
      title: Timestamp Secondary Aggregation
      description: Aggregate treatments in the timestamp dimension for a particular
        channel for which the primary aggregation was done. The secondary aggregation
        is for a specific length of time
      allOf:
      - $ref: "#/components/schemas/timeStampAggregate"
    channelSecondaryAggregate:
      title: Channel Secondary Aggregation
      description: Aggregate treatments in a channel dimension for a given time period
        constraint. That time period is the primary aggregation. This identifies the
        treatments that go through this channel in the time period.
      allOf:
      - $ref: "#/components/schemas/channelAggregate"
    timeStampPrimaryAggregate:
      title: Contact Timestamp Primary Aggregation
      description: Aggregate treatments in the timestamp dimension.
      allOf:
      - $ref: "#/components/schemas/timeStampAggregate"
      - properties:
          channels:
            type: array
            description: The secondary aggregation in the channel dimension for this
              time period. This identifies the treatments by the channels that they
              go through. This is a drill down from a time period to the channels.
            items:
              $ref: "#/components/schemas/channelSecondaryAggregate"
    channelPrimaryAggregate:
      title: Channel Aggregation
      description: Aggregate treatments in a channel dimension. This identifies the
        treatments that go through this channel over the entire aggregation time period.
      required:
      - beginTimeStamp
      - endTimeStamp
      allOf:
      - $ref: "#/components/schemas/channelAggregate"
      - properties:
          beginTimeStamp:
            type: string
            format: date-time
            description: The timestamp that marks the beginning of the aggregation
              period.
          endTimeStamp:
            type: string
            format: date-time
            description: The timestamp that marks the end of the aggregation period.
          periods:
            type: array
            description: This identifies the time periods when treatments go through
              this channel. This is a drill down from a channel to time periods.
            items:
              $ref: "#/components/schemas/timeStampSecondaryAggregate"
    traceCollection:
      title: Decision Trace Collection
      description: A collection of the trace representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              $ref: "#/components/schemas/trace"
    trace:
      title: Decision Trace
      description: Conveys the essential information of a decision trace. The trace
        text is not included.
      required:
      - traceId
      - traceTimeStamp
      - objectUri
      - processorNote
      properties:
        traceId:
          type: string
          description: The ID of the raw trace. This is provided by the user of the
            API when a raw trace is submitted to the service for recording.
        traceTimeStamp:
          type: string
          description: The timestamp associated with the raw trace.
        objectUri:
          type: string
          description: The URI of the decision associated with the raw trace.
        processorNote:
          type: string
          description: The history of the processing of the raw trace and other information.
            The note is composed in YAML format.
        creationTimeStamp:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the trace is recorded. This field is a derived
            field.
        createdBy:
          type: string
          readOnly: true
          description: ID of the user who recorded this trace. This field is a derived
            field.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Timestamp when this trace's processorNote field is last modified.
            This field is a derived field.
        modifiedBy:
          type: string
          description: ID of the user who last modified this trace. This field is
            a derived field.
        links:
          type: array
          readOnly: true
          description: Zero or more link objects.
          items:
            $ref: "#/components/schemas/link"
    traceReport:
      title: Decision Trace Report
      description: Convey the result of processing a raw trace.
      required:
      - traceId
      - traceTimeStamp
      - reportUri
      - objectUri
      properties:
        traceId:
          type: string
          description: The ID of the raw trace. This is provided by the user of the
            API when a raw trace is submitted to the service for recording.
        traceTimeStamp:
          type: string
          description: The timestamp associated with the raw trace.
        processedTimeStamp:
          type: string
          description: The timestamp associated with the processing of the raw trace.
        reportUri:
          type: string
          description: The Files Service URI of the file resource in which the report
            is stored.
        objectUri:
          type: string
          description: The URI of the decision associated with the raw trace.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
