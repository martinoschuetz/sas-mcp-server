          - ruleFiredSummary
          description: The type of analysis that needs to be done.
        hints:
          type: object
          description: Hints for generating the analysis code.
          additionalProperties:
            type: string
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
      example:
        scoreExecutionId: 6f4bced9-5bbd-476c-8ef8-3378678b0702
        analysisType: ruleFiredSummary
        hints:
          outputLibraryName: PUBLIC
