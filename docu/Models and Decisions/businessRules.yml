        id:
          type: string
          description: The system-assigned unique ID for this object
        type:
          type: string
          description: >
            Type of condition that is being used, the fields that are applicable within
            the object will depend on the type provided.
            <ul>
            <li>`decisionTable` - Evaluate if the term meets the provided decision
            table expression. Valid syntax for a decisionTable expression is 'operator
            value' so an example would be '= abs(10)'.</li>
            <li>`lookup` - Determine if the term provided exists within the provided
            Reference Data domain lookup.</li>
            <li>`complex` - Execute an arbitrary piece of DS2 code which must evaluate
            to true or false. Example of valid syntax here is "x > 10 and substr(y,
            0, 1) = 'p'".</li>
            </ul>
          format: enumeration
          enum:
          - decisionTable
          - lookup
          - complex
        expression:
          type: string
          description: Conditional expression used for this condition. Valid only
            for complex or decisionTable.
        lookup:
          $ref: "#/components/schemas/lookupReference"
        term:
          $ref: "#/components/schemas/signatureTerm"
        status:
          type: string
          description: The validation status of the condition. If there are validation
            issues with the condition this will be set to error and provide a message
            to explain the error to the user.
          format: enumeration
          enum:
          - valid
          - error
        statusMessage:
          type: string
          description: Validation message for any errors within the condition.
    mappedCode:
      title: Mapped Code
      description: Executable code generated by a score object using a score definition
        and input data. This represents application/vnd.sas.score.mapped.code media
        type (version 1).
      required:
      - code
      - codeType
      - outputTableName
      - outputLibraryName
      properties:
        code:
          type: string
          description: The executable code generated by a score object.
        codeType:
          type: string
          format: media-type
          description: The type of code.
        outputTableName:
          type: string
          description: The name of the table that is generated when the code is executed.
        outputLibraryName:
          type: string
          description: The name of the library where the table is generated when the
            code is executed.
        version:
          type: integer
          readOnly: true
          description: This media type's schema version number. This representation
            is version 2.
    unboundScoreCodeGenerationRequest:
      title: Unbound Code Generation Request
      description: Request containing hints and mappings to generate Mapped Code not
        bound to a score definition.
      properties:
        mappings:
          type: array
          description: Array of mappings between Score Object variables and the table
            the code will be executed against.
          items:
            $ref: "#/components/schemas/termMapping"
        hints:
          type: object
          description: Hints for generating the code. Hints are specific to the type
            of object which the code is being requested for.
          additionalProperties:
            type: string
        version:
          type: integer
          readOnly: true
          description: This media type's schema version number. This representation
            is version 1.
    termUsageSummary:
      title: Term Usage Summary
      description: A summary representation of a term and it's usage.
      required:
      - parentName
      - parentUri
      - name
      - dataType
      - direction
      type: object
      properties:
        parentName:
          type: string
          readOnly: true
          description: The name of the parent resource that contains the term.
        parentUri:
          type: string
          readOnly: true
          description: The uri of the parent resource that contains the term.
        name:
          type: string
          readOnly: true
          description: The name of the term.
        dataType:
          type: string
          readOnly: true
          description: The data type of the term.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
          - date
          - datetime
          - dataGrid
        direction:
          type: string
          readOnly: true
          description: >
            Declaration of how the term is to be used during execution. It indicates
            if the term should be used as input,
            output, both input and output, or none if the term is only used internally.
          format: enumeration
          enum:
          - input
          - output
          - inOut
          - none
    summary:
      title: Resource Summary
      type: object
      description: The summarized representation of a resource. Often used in collection
        responses when more specific details aren't needed.
      x-sas-media-type:
        name: application/vnd.sas.summary
        version: 2
      required:
      - id
      - links
      - version
      properties:
        id:
          type: string
          description: The unique identifier for the resource.
        name:
          type: string
          description: The name of the resource.
        type:
          type: string
          description: The type of the resource.
        description:
          type: string
          description: The description of the resource.
        typeDefName:
          type: string
          description: (version 2) The name of the type definition that describes
            the contents of this resource.
        iconUri:
          type: string
          description: (version 2) The URI of an icon assigned to this resource, overrides
            default icons for the type.
        createdBy:
          type: string
          description: The user who created the resource.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp in YYYY-MM-DDThh:mm:ss.sssZ format when the resource
            was created.
        modifiedBy:
          type: string
          description: The user who most recently modified the resource.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp in YYYY-MM-DDThh:mm:ss.sssZ format when the resource
            was last modified.
        links:
          type: array
          description: The links that apply to the resource.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the resource. This representation is
            version 2.
    ruleSetIntegral:
      title: Rule Set With Rules
      description: >
        The definition of a set of rules and the associated signature for them. This
        represents the `application/vnd.sas.business.rule.set.integral` media type
        (version 2).
      allOf:
      - $ref: "#/components/schemas/ruleSet"
      - type: object
        required:
        - rules
        properties:
          rules:
            type: array
            items:
              $ref: "#/components/schemas/businessRule"
            description: The set of rules
          version:
            type: integer
            description: >
              This media type's schema version number. This representation is version
              2.
      example:
        name: Loan Score Approval
        rules:
        - name: Age Requirements
          conditional: if
          ruleFiredTrackingEnabled: true
          conditions:
          - type: decisionTable
            expression: age > 10
          - type: decisionTable
            expression: height > 123.00
          actions:
          - type: assignment
            expression: approved = 'Y'
        signature:
        - name: age
          dataType: integer
          direction: input
        - name: height
          dataType: decimal
          direction: input
        - name: approved
          dataType: boolean
          direction: output
    functionSignatureTerm:
      title: Function Signature Term
      description: An input parameter to a user-defined function.
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the input parameter.
        type:
          type: string
          description: The DS2 type of the parameter.
        dataType:
          type: string
          description: The type of data that the term is intended to be used with.
            Terms can be loosely typed with the 'any' type, this type is only assigned
            by the service when rules POST'ed with 'createVariables=true' and no type
            can be determined.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
          - date
          - datetime
          - dataGrid
          - any
        inOut:
          type: boolean
          description: >
            A boolean indicating if the parameter was preceded with the `in_out`
            keyword.
        direction:
          type: string
          description: Declaration of how the data is to be used during execution
            as input, output, both input and output or none if the term is for internal
            rule set usage only.
          format: enumeration
          enum:
          - input
          - output
          - inOut
          - none
        nameQuoted:
          type: boolean
          description: >
            A boolean indicating if the parameter name is quoted in the function's
            code.
        defaultValue:
          type: object
          description: The initial value of the term.
        length:
          type: integer
          description: Suggested length for use when using the function.
        dataGridExtension:
          type: array
          description: Fields that are found within the defined data grid type term.
            These fields are unique only within the data grid and can overlap with
            other term names. This member is only applicable for terms of type 'dataGrid'.
          items:
            $ref: "#/components/schemas/functionSignatureTermDataGridExtension"
        createdBy:
          type: string
          description: The user who created the term.
        creationTimeStamp:
          type: string
          format: date-time
          description: The date and time that the term was created.
        modifiedBy:
          type: string
          description: The userId of the authenticated user who last updated the term.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The date and time that the term was last modified.
        dataGridMaxRowCount:
          type: integer
          description: >-
            Specifies the maximum number of rows that are allowed in each column of
            a data grid
            that is generated from table columns whose names follow the format "column_name[index]"
            where
            "column_name" is identical for all columns. If the input data contains
            more entries for a data grid column
            than the specified row count allows, the input data for that column is
            truncated during score execution.
    termMapping:
      title: Mapping
      description: Assigning Input Data column to a variable of the generated Mapped
        Code of Score Object. This doesn't represent any top-level media type.
      required:
      - variableName
      - mappingType
      properties:
        variableName:
          type: string
          description: Name of the Score Object's variable.
        mappingType:
          description: The mapping type.
          type: string
          format: enumeration
          enum:
          - datasource
          - static
          - expected
        mappingValue:
          anyOf:
          - type: integer
          - type: number
          - type: array
          - type: boolean
          - type: object
          - type: string
          description: Value that is assigned to Score Object's variable. If the mappingType
            is dataSource then this should be column name of the Input Data. If the
            mappingType is static then this should be a constant value. If the mappingType
            is expected then this is the expected value of the output and it is always
            constant. Required if the mappingType is datasource.
    decisionStepCodeSignatureTerm:
      title: Decision Step Code Signature Term
      description: Terms that are a part of the signature for the object that is used
        in a decision step.
      required:
      - name
      - dataType
      - direction
      properties:
        name:
          type: string
          description: The name of the object used in a decision step.
        dataType:
          type: string
          description: Data type of the term.
          enum:
          - string
          - decimal
          - integer
          - dataGrid
          - date
          - datetime
          - unknown
        direction:
          type: string
          description: Direction of the term.
        length:
          type: integer
          description: Length of the term.
        dataGridExtension:
          type: array
          items:
            $ref: "#/components/schemas/decisionStepCodeSignatureTermDataGridExtension"
          description: Metadata information about data grid columns.
    dataList:
      title: List Data
      description: A list of multiple key and value columns
      x-sas-media-type:
        name: application/vnd.sas.data.list
        version: 1
      required:
      - name
      - state
      - columns
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: A unique name for the list.
        state:
          type: string
          description: An indicator for whether the list can be used by deployed artifacts.
            A list can be either active or inactive. Only inactive lists can be deleted.
          format: enumeration
          enum:
          - inactive
          - active
        description:
          type: string
          description: A textual description of the list.
        isImmutable:
          type: boolean
          description: An indicator for whether the list's contents can be altered
            after it is imported.
        columns:
          type: array
          description: A collection of objects that define the structure of the list's
            content.
          items:
            $ref: "#/components/schemas/dataListColumn"
        label:
          type: string
          description: A short textual label, which is appropriate for client UIs.
        version:
          type: integer
          description: The schema version number. This representation is version 1.
      example:
        id: 3659ea38-2618-4474-aeac-0bf6cfd3c322
        creationTimeStamp: '2022-03-01T20:18:32Z'
        modifiedTimeStamp: '2022-03-01T20:18:32Z'
        createdBy: appUser1
        modifiedBy: appUser1
        name: list-a
        description: The A-list users
        state: inactive
        columns:
        - name: userId
          dataType: string
          position: 1
          isKey: true
          keyPosition: 1
        - name: firstName
          dataType: string
          position: 2
          isKey: false
          keyPosition: 0
        - name: lastName
          dataType: string
          position: 3
          isKey: false
          keyPosition: 0
        - name: salary
          dataType: number
          position: 4
          isKey: false
          keyPosition: 0
          dataMask:
            name: MaskStart
            regularExpression: ".(....$)|."
            replace: "*$1"
            example: "****1234"
        label: corporate marketing
        version: 1
    lookupValue:
      title: Lookup Value
      description: A business rule lookup value.
      x-sas-media-type:
        name: application/vnd.sas.business.rule.lookup.value
        version: 1
      required:
      - key
      - value
      properties:
        key:
          type: string
          description: The unique key that identifies the lookup value.
        value:
          type: string
          description: The lookup value.
        version:
          type: integer
          description: The schema version number. This representation is version 1.
      example: {"key": "usd", "value": "US Dollar", "version": 1}
    refRuleMapping:
      title: Reference Rule Mapping
      description: Describes the substitution of local rule set signature terms for
        signature terms from the referenced common rule set version.
      required:
      - refRuleId
      - rulesetTermName
      - mappedRulesetTermName
      - direction
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object
        rulesetTermName:
          type: string
          description: >
            The name of the term within the common rule set that is being mapped.
        mappedRulesetTermName:
          type: string
          description: >
            The name of the term withing the local rule that is being mapped to.
        refRuleId:
          type: string
          description: >
            The id of the rule that this mapping is associated with.  This id is for
            the reference rule rather than the common rule that the reference rule
            refers to.
        direction:
          type: string
          description: >
            Declaration of how the data is to be used during execution. It indicates
            if the data should be used as input,
            output or both input and output.
            set usage.
          format: enumeration
          enum:
          - input
          - output
          - inOut
    advancedListRuleAction:
      title: Rule Advanced List Action
      description: Action referencing an Advanced List that is performed if a rule
        evaluated to true.
      required:
      - type
      - terms
      - expressionUnits
      - advancedList
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object
        type:
          type: string
          description: The type of action that should be performed.
          format: enumeration
          enum:
          - listQuery
        terms:
          type: array
          description: One or more terms to be assigned values.
          items:
            $ref: "#/components/schemas/signatureTerm"
        expressionUnits:
          type: array
          description: The parts from which the total expression used to search an
            Advanced List is constructed.
          items:
            $ref: "#/components/schemas/advancedListExpressionUnit"
        advancedList:
          $ref: "#/components/schemas/advancedListReference"
        expression:
          type: string
          description: The action expressed in terms of the rule set terms to be assigned
            values from the row obtained by searching the specified list for rule
            terms matching values in the list's key columns.
        status:
          type: string
          description: The validation status of the action. If there is validation
            issue with the action this will be set to "error".
          format: enumeration
          enum:
          - valid
          - error
        statusMessage:
          type: string
          description: Validation message for an error in the action.
    signatureTermExtension:
      title: Signature Term Extension
      description: >
        The signature term extension is used to store the column information of a
        data
        grid variable.
      required:
      - name
      - dataType
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: >
            The name of the extension that can be referenced from rule logic. The
            extension
            must be unique within a data grid.
        length:
          type: integer
          description: The suggested length for use when generating code.
        autoPopulate:
          type: boolean
          description: >
            When this flag is set to true, the code that is generated by the application
            calls the appropriate data function to create the new column that you
            added to the metadata at runtime.
        dataType:
          type: string
          description: >
            The type of data that the extension is intended to be used with.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
    lookupReference:
      title: Lookup Reference
      description: A reference to a lookup within a condition or action of a rule.
      required:
      - id
      properties:
        id:
          type: string
          description: The UUID of the lookup that is being referenced by the rule
            condition or action.
        name:
          type: string
          description: Name of the lookup. Populated on the users behalf for convenience.
    dataListColumn:
      title: List Column
      description: A list column
      x-sas-media-type:
        name: application/vnd.sas.data.list.column
        version: 1
      required:
      - name
      - dataType
      - position
      properties:
        name:
          type: string
          description: A unique name for the column.
        dataType:
          type: string
          description: The type of data stored.
          format: enumeration
          enum:
          - string
          - number
        isKey:
          type: boolean
          description: An indicator for whether the column is a key column.
        position:
          type: integer
          description: The position of the column in the list. The first position
            is 1.
        keyPosition:
          type: integer
          description: The position of the column among the keys of the list. The
            first position is 1.
        dataMask:
          description: A restriction or redaction on the presentation of a column's
            value when retrieving a list's contents.
          additionalProperties:
            $ref: "#/components/schemas/dataListColumnMask"
        version:
          type: integer
          description: The schema version number. This representation is version 1.
      example:
        name: salary
        dataType: number
        position: 4
        isKey: false
        keyPosition: 0
        dataMask:
          name: MaskStart
          regularExpression: ".(....$)|."
          replace: "*$1"
          example: "****1234"
    functionSignatureTermDataGridExtension:
      title: Function Signature Term DataGrid Extension
      description: Function Signature Term DataGrid Extension is used to store the
        column information of a DataGrid variable.
      required:
      - name
      - dataType
      properties:
        name:
          type: string
          description: Name of the dataGrid column.
        length:
          type: integer
          description: Length of the value in the dataGrid column. Valid for dataType
            string.
        dataType:
          type: string
          description: Data type of the dataGrid column.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
          - date
          - datetime
    advancedListReference:
      title: Advanced List Reference
      description: A reference to an Advanced List within an action of a rule.
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: UUID of the Advanced List that is being referenced by the rule
            action.
        name:
          type: string
          description: Name of the Advanced List.
    decisionStepCodeSignatureTermDataGridExtension:
      title: Decision Step Code Signature Term DataGrid Extension
      description: Decision Step Code Signature Term DataGrid Extension is used to
        store the column information of a DataGrid variable.
      required:
      - name
      - dataType
      properties:
        name:
          type: string
          description: Name of the dataGrid column.
        length:
          type: integer
          description: Length of the value in the dataGrid column. Valid for dataType
            string.
        autoPopulate:
          type: boolean
          description: >
            When this flag value is set to true, the code that is generated by the
            application calls the appropriate data function to create the new column
            that you added to the metadata at runtime.
        dataType:
          type: string
          description: Data type of the dataGrid column.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
          - date
          - datetime
    advancedListExpressionUnit:
      title: Advanced List Expression Unit
      description: A unit of the total expression. Each unit is logically AND'ed together.
      required:
      - term
      properties:
        term:
          $ref: "#/components/schemas/signatureTerm"
        expressionTermMapping:
          $ref: "#/components/schemas/expressionTermMapping"
    dataListColumnMask:
      title: List Column Data Mask
      description: A restriction or redaction on the presentation of a column's value
        when retrieving a list's contents.
      x-sas-media-type:
        name: application/vnd.sas.data.list.column.mask
        version: 1
      required:
      - name
      - regularExpression
      - example
      - replace
      properties:
        name:
          type: string
          description: A unique name for the mask.
        regularExpression:
          type: string
          description: The regular expression for the data mask where members of the
            group are displayed.
        example:
          type: string
          description: An example of the expected output of a redacted record.
        replace:
          type: string
          description: The replace expression for the groups that result from the
            regularExpression property.
      example:
        name: mask start
        example: "***123456"
        regularExpression: ".(..$)|."
        replace: "*$1"
    expressionTermMapping:
      title: Expression Term Mapping
      description: Describes the substitution of a local rule set signature term for
        a term of an expression.
      required:
      - expressionTermName
      properties:
        expressionTermName:
          type: string
          description: The name of a list's key column that is being mapped.
