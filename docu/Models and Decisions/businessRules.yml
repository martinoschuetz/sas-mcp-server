    businessRule:
      title: Rule
      description: The definition of a set of conditions and actions for use within
        a rule set. The defintion can also contain a rule that references a common
        rule, reference IDs and mappings. This represents application/vnd.sas.business.rule
        media type (version 4).
      required:
      - name
      - conditional
      - ruleFiredTrackingEnabled
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object
        name:
          type: string
          description: The name of the rule. Rule names must be unique within a rule
            set.
        description:
          type: string
          description: The rule description
        createdBy:
          type: string
          description: The user who created the rule.
        creationTimeStamp:
          type: string
          format: date-time
          description: The date and time that the rule was created.
        modifiedBy:
          type: string
          description: The userId of the authenticated user who last updated the rule.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The date and time that the rule was last modified.
        conditional:
          type: string
          description: Determines how the rule is related to this preceding rule.
            By default all rules are considered 'if' based which means that there
            logic is executed regardless of the how other rules within the rule set
            evaluate. However if a user chooses to use 'elseif' or 'or' the rule is
            only evaluated if the previous rule evaluates to 'false'. In the case
            of 'or' all actions are determined by the previous if/elseif in the set
            with actions.  If a rule is a reference to a common rule, its conditional
            is set to 'ref'.
          format: enumeration
          enum:
          - if
          - elseif
          - or
          - ref
        ruleFiredTrackingEnabled:
          type: boolean
          description: Set to true if you want during executions of this rule for
            rule fired tracking information to be recorded. False if this rule should
            not have tracking turned on.
        status:
          type: string
          description: The validation status of the rule. This is set to valid if
            no conditions or actions have validation errors. Its set to false if there
            are any validation errors across all its conditions and actions.
          format: enumeration
          enum:
          - valid
          - error
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/ruleCondition"
          description: The list of conditions which all need to be met to execute
            the rules actions.
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ruleAction"
          description: The list of actions which should be executed if the rule's
            conditions are all satisfied. This is not applicable for 'filtering' type
            rule sets as all actions are considered to be removing the current row
            from the output if it does not match the provided conditions.
        commonRuleSetId:
          type: string
          description: The unique id of the common ruleset that this rules references
        commonRuleSetVersionId:
          type: string
          description: The unique id of the revision of the common ruleset tat this
            rule references
        ruleMappings:
          type: array
          description: The list of mappings to be used when code is generated to subsitute
            terms from the rule set to terms from a referenced rule set.
          items:
            $ref: "#/components/schemas/refRuleMapping"
        links:
          type: array
          description: Zero or more links to related resources or operations.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 3.
      example:
        name: Age Requirements
        conditional: if
        ruleFiredTrackingEnabled: true
    ruleAction:
      title: Rule Action
      description: Action that is performed if a rule evaluated to true.
      required:
      - type
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object
        type:
          type: string
          description: >
            The type of action that should be performed. The fields required within
            this element will depend on the type specified. Below is a description
            of each type possible...
            <ul>
            <li>`assignment` - assign a term the value of the provided expression</li>
            <li>`return` - stop executing the rule and return immediately</li>
            <li>`complex` - execute an arbitrary piece of DS2 code</li>
            <li>`lookupValue` - assign the value field for the corresponding domain
            entry found based on evaluating the expression as a key within the provided
            reference data domain lookup</li>
            </ul>
          format: enumeration
          enum:
          - assignment
          - return
          - complex
          - lookupValue
        expression:
          type: string
          description: Expression used for the action. When of type assignment this
            expression is evaluated and the result is assigned to the term associated
            with the action. If the type is complex then the expression is treated
            as arbitrary code that is executed within the context of the rule. For
            actions of type lookup, this expression is evaluated as the key to lookup
            and the value found is assigned to the associated term. Expression is
            only valid only for types lookup, assignment and complex.
        lookup:
          $ref: "#/components/schemas/lookupReference"
        term:
          $ref: "#/components/schemas/signatureTerm"
        status:
          type: string
          description: The validation status of the action. If there are validation
            issues with the action this will be set to error and provide a message
            to explain the error to the user.
          format: enumeration
          enum:
          - valid
          - error
        statusMessage:
          type: string
          description: Validation message for any errors within the action.
