  "/ruleSets/{ruleSetId}/revisions/{revisionId}/code":
    get:
      summary: Get the code of a rule set revision
      operationId: getCodeForRevision
      tags:
      - Rule Sets
      description: Returns the package code for a rule set revision.
      parameters:
      - name: ruleSetId
        in: path
        required: true
        description: The rule set ID.
        schema:
          type: string
      - name: revisionId
        in: path
        required: true
        description: The rule set revision ID.
        schema:
          type: string
      - name: codeTarget
        in: query
        description: >
          The type of platform that the generated code is run on. This affects
          some aspects of how the code is generated. For example, the
          MICROANALYTICS variables that are both input and output are listed
          distinctly in the execute method signature rather than as one
          'in_out' parameter. The default is CAS.
        schema:
          type: string
          enum:
          - MICROANALYTICSERVICE
          - CAS
      - name: lookupMode
        in: query
        required: false
        description: Generates the code using references to the reference data domains
          based on format names, the inline domain contents as conditionals, or the
          domain contents as a DS2 package. The default is 'format'. If the value
          is either format or package, the domain contents are expected to already
          exist in that form on the Cloud Analytic Server and Micro Analytic Score
          service respectively. This is done by previously activating the domain contents
          using the SAS Intelligent Decisioning web application or a Reference Data
          service REST API invocation. Only when executing the code would it be known
          that the formats or packages do not exist.
        schema:
          type: string
          enum:
          - format
          - inline
          - package
      - name: isGeneratingRuleFiredColumn
        in: query
        required: false
        description: Determines whether the rule fired columns are included in the
          method signatures within the return package code.
        schema:
          type: boolean
          default: true
      - name: inlineAdvanceListValues
        in: query
        required: false
        description: Specifies whether the currently deployed rows in an advanced
          list are included as inline values within the generated code. Advanced lists
          and rows within an advanced list can be deployed by using the SAS Intelligent
          Decisioning web application, the SAS Fraud Decisioning application, or the
          List Data API. If this parameter is 'true', the deployed rows in an advanced
          list are re-created as a data grid in the generated code. If this parameter
          is 'false', the advanced list must exist as a tabular data set on the Redis
          server. To get generated code for Cloud Analytic Server, Teradata, or Hadoop
          destinations, specify 'true' as the parameter value.
        schema:
          type: boolean
      - name: useGlobalVariableCurrentValues
        in: query
        required: false
        description: When this parameter is set to true, the generated code uses the
          global variables current value (possibly not activated) at code generation
          time. When set to false the activated global variables value is looked up
          and used at code execution time.
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            text/vnd.sas.source.ds2:
              schema:
                type: string
                format: ds2
              examples:
                default:
                  $ref: "#/components/examples/ds2CodeOfRuleSet"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
