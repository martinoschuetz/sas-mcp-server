openapi: 3.0.3
info:
  version: "22"
  title: Business Rules
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: The Business Rules API supports the creation and management of business
    rules. These business rules are organized within rule sets.
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Rule Sets
  description: Contains the operations for creating, reading, and deleting rule sets.
- name: Rules
  description: Contains the operations for importing, exporting, and querying rules
    directly.
- name: Function Categories
  description: Contains the operations for creating, reading, and deleting function
    categories.
- name: Functions
  description: Contains the operations for creating, reading, and deleting functions.
paths:
  /:
    get:
      operationId: root
      tags:
      - Root
