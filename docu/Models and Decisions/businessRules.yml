  /ruleSets:
    get:
      operationId: getRuleSets
      tags:
      - Rule Sets
      summary: Get all rule sets
      description: Returns a resource collection of all the rule sets.
      parameters:
      - name: filter
        description: An expression for filtering the collection. Valid expressions
          include eq(member,"string"). Allowed members are `id`, `name`, `description`,
          `modifiedTimeStamp`, `creationTimeStamp`, `modifiedBy`, and `createdBy`.
        in: query
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        description: The criteria for sorting the rule sets. Valid sortBy parameters
          include `sortBy=id:descending`. Allowed members are `id`, `name`, `description`,
          `modifiedTimeStamp`, `creationTimeStamp`, `modifiedBy`, and `createdBy.
        in: query
        schema:
          type: string
          format: sort-criteria
