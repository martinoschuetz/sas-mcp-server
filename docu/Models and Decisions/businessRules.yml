  "/ruleSets/{ruleSetId}/code":
    get:
      summary: Get rule set code
      operationId: getRuleSetCode
      tags:
      - Rule Sets
      description: Returns the code for integrating within another program so that
        program is able to run the rule set.
      parameters:
      - name: ruleSetId
        in: path
        required: true
        description: The rule set ID.
        schema:
          type: string
      - name: codeTarget
        in: query
        description: >
          The type of platform that the generated code is run on. This affects
          some aspects of how the code is generated. For example, the
          MICROANALYTICS variables that are both input and output are listed
          distinctly in the execute method signature rather than as one
          'in_out' parameter. The default is CAS.
        schema:
          type: string
          enum:
          - MICROANALYTICSERVICE
          - CAS
      - name: lookupMode
        in: query
        required: false
        description: Generates the code using references to the reference data domains
          based on the format names, the inline domain contents as conditionals, or
          the domain contents as  DS2 packages. The default is 'format'. If the value
          is either format or package, the domain contents are expected to exist in
          that form on the Cloud Analytic Server and Micro Analytic Score server respectively.
          This is done the domain contents are activated using the SAS Intelligent
          Decisioning web application or using a Reference Data service REST API invocation.
          Only when executing the code would it be known that the formats or packages
          do not exist.
        schema:
          type: string
          enum:
          - format
          - inline
          - package
      - name: isGeneratingRuleFiredColumn
        in: query
        required: false
        description: Determines whether the rule fired columns are included in the
          method signatures within the return package code. The default is 'true'.
        schema:
          type: boolean
      - name: inlineAdvanceListValues
        in: query
        required: false
        description: Specifies whether the currently deployed rows in an advanced
          list are included as inline values within the generated code. Advanced lists
          and rows within an advanced list can be deployed by using the SAS Intelligent
          Decisioning web application, the SAS Fraud Decisioning application, or the
          List Data API. If this parameter is 'true', the deployed rows in an advanced
          list are re-created as a data grid in the generated code. If this parameter
          is 'false', the advanced list must exist as a tabular data set on the Redis
          server. To get generated code for Cloud Analytic Server, Teradata, or Hadoop
          destinations, specify 'true' as the parameter value.
        schema:
          type: boolean
      - name: useGlobalVariableCurrentValues
        in: query
        required: false
        description: When set to true, the current value for the global variables
          is used at code generation time, even if the global variable is not activated.
          When set to false, the value of the activated global variables is looked
          up and used at code execution time.
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              schema:
                type: string
              example: Wed, 01 Sep 2021 06:22:33 GMT
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            text/vnd.sas.source.ds2:
              schema:
                type: string
                format: ds2
              examples:
                default:
                  $ref: "#/components/examples/ds2CodeOfRuleSet"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
