        version:
          type: integer
          description: >
            This media type's schema version number. This representation is version
            1.
      example: {"creationTimeStamp": "2020-08-04T17:46:19.097Z", "modifiedTimeStamp": "2020-08-04T17:47:28.848Z",
        "createdBy": "brmdev", "modifiedBy": "brmdev", "version": 1, "id": "26674236-bc80-41de-954d-d37b1a19d98d",
        "categoryId": "85329ae9-52df-444f-8e18-bffb1a523da7", "name": "customadd2",
        "code": "method customAdd2(double a, double b) returns double; return a +\
          \ b; end;", "returnType": "double", "signature": [{"type": "double", "name": "a",
            "inOut": false, "nameQuoted": false}, {"type": "double", "name": "b",
            "inOut": false, "nameQuoted": false}], "links": [{"method": "GET", "rel": "self",
            "href": "/businessRules/functions/26674236-bc80-41de-954d-d37b1a19d98d",
            "uri": "/businessRules/functions/26674236-bc80-41de-954d-d37b1a19d98d",
            "type": "application/vnd.sas.business.rule.function"}, {"method": "PUT",
            "rel": "update", "href": "/businessRules/functions/26674236-bc80-41de-954d-d37b1a19d98d",
            "uri": "/businessRules/functions/26674236-bc80-41de-954d-d37b1a19d98d",
            "type": "application/vnd.sas.business.rule.function"}, {"method": "DELETE",
            "rel": "delete", "href": "/businessRules/functions/26674236-bc80-41de-954d-d37b1a19d98d",
            "uri": "/businessRules/functions/26674236-bc80-41de-954d-d37b1a19d98d"},
          {"method": "GET", "rel": "up", "href": "/businessRules/functions", "uri": "/businessRules/functions",
            "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.business.rule.function"},
          {"method": "GET", "rel": "category", "href": "/businessRules/functionCategories/85329ae9-52df-444f-8e18-bffb1a523da7",
            "uri": "/businessRules/functionCategories/85329ae9-52df-444f-8e18-bffb1a523da7",
            "type": "application/vnd.sas.business.rule.function.category"}], "hidden": false,
        "nameQuoted": false}
