    ruleSet:
      title: Rule Set
      description: >
        The definition of a set of rules and the associated signature for them. This
        represents the `application/vnd.sas.business.rule.set` media type (version
        10).
      required:
      - name
      - signature
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: The name of the rule set.
        ruleSetType:
          type: string
          description: >
            The type of rule set. Assignment rule sets enable users to specify
            variable assignment actions within business rules. Filtering rule sets
            contain business rules that are only conditions that must be matched
            for the data to be retained within the resulting output. Assignment is
            the
            default if not specified.
          format: enumeration
          enum:
          - assignment
          - filtering
        description:
          type: string
          description: The rule set description
        createdBy:
          type: string
          description: The user who created the rule set.
        creationTimeStamp:
          type: string
          format: date-time
          description: The date and time that the rule set was created.
        modifiedBy:
          type: string
          description: >
            The user ID of the authenticated user who last updated the rule set.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The date and time that the rule set was last modified.
        majorRevision:
          type: integer
          description: >
            Major version number of the revision being viewed of the rule set. This
            value is assigned by the service, the user only has control on whether
            the
            major number or minor number is incremented when creating a new revision.
            This is a derived field that is generated on PUT/POST.
        minorRevision:
          type: integer
          description: >
            Minor version number of the current revision of the rule set. This value
            is assigned by the service. The user only has control on whether the major
            number or minor number is incremented when creating a new revision. This
            is a derived field that is generated on PUT/POST.
        checkout:
          type: boolean
          description: >
            Flag that indicates that the rule set is a user's working copy of another
            rule set.
        locked:
          type: boolean
          description: >
            Flag that indicates if the content of the revision being viewed is locked
            or editable.
        signature:
          type: array
          items:
            $ref: "#/components/schemas/signatureTerm"
          description: >
            The set of terms local to this rule set with input and output behavior.
        folderType:
          type: string
          description: Indicates the type of folder where the rule set is housed.
        sourceRevisionUri:
          type: string
          description: >
            The URI of the rule set revision this rule set is being created from.
        copyTimeStamp:
          type: string
          format: date-time
          description: The time stamp when the ruleset revision was copied.
        testCustomContextUri:
          type: string
          description: The URI of a Custom Context DS2 code file that provides a custom
            context to this rule set. The ruleset's custom context is usually provided
            by the decision that uses it. For syntax validation of rule expressions
            and for testing purposes, you can specify a testing-only custom context.
        links:
          type: array
          description: Zero or more links to related resources or operations.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: >
            This media type's schema version number. This representation is version
            10.
      example:
        name: Loan Score Approval
        signature:
        - name: customerName
          dataType: string
          direction: input
        - name: creditScore
          dataType: decimal
          direction: input
        - name: approved
          dataType: boolean
          direction: output
    signatureTerm:
      title: Signature Term
      description: >
        Business term defined by the user to be used as a variable for usage in
        expressions and mappings within rule sets or decisions. Terms of type data
        grid can have their internal structure defined further using extensions, these
        are fields that are found within each row of a data grid term.
      required:
      - name
      - dataType
      - direction
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object
        name:
          type: string
          description: >
            Name of the term that can be referenced. Term names must be unique within
            a rule set.
        description:
          type: string
          description: The description of the term.
        defaultValue:
          type: object
          description: The initial value of the term.
        length:
          type: integer
          description: The suggested length for use when generating code.
        createdBy:
          type: string
          description: The user who created the term.
        creationTimeStamp:
          type: string
          format: date-time
          description: The date and time that the term was created.
        modifiedBy:
          type: string
          description: The user ID of the authenticated user who last updated the
            term.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The date and time that the term was last modified.
        dataType:
          type: string
          description: >
            The type of data that the term is intended to be used with. Terms can
            be
            loosely typed with the 'any' type, this type is only assigned by the
            service when rules are created with 'createVariables=true' and no type
            can be determined.
          format: enumeration
          enum:
          - string
          - decimal
          - integer
          - date
          - datetime
          - dataGrid
          - boolean
          - any
        direction:
          type: string
          description: >
            Declaration of how the data is to be used during execution. It indicates
            if the data should be used as input,
            output, both input and output, or none if the term is only for internal
            rule
            set usage.
          format: enumeration
          enum:
          - input
          - output
          - inOut
          - none
        dataGridExtension:
          type: array
          description: >
            Fields that are found within the defined data grid type term. These fields
            are unique only within the data grid and can overlap with other term
            names. This member is only applicable for terms of type 'dataGrid'.
          items:
            $ref: "#/components/schemas/signatureTermExtension"
        globalVariableId:
          type: string
          description: The id of the global variable that this term references.
        generateDataGridColumns:
          type: boolean
          description: >
            Each row in a data grid variable usually contains metadata that defines
            the columns
            in the data grid and the data for each column. Depending on the data types
            and number
            of columns in the data grid, the metadata can increase the size of the
            data grid considerably.
            To exclude the metadata from each row in the data grid, set this option
            to "true" because the
            application depends on the column definitions that you enter when you
            define the variable.
            Ensure that the column definition is correct for each column in the data
            grid variable.
            If the column definitions do not match the input data, the application
            cannot load the data.
        legacy:
          type: boolean
          description: the flag of legacy variable.
