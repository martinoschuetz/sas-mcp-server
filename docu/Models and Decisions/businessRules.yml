          	dcl double "r_number";

          	retain "rulesfiredforrecordcount" 0;

          	keep  "rulesfiredforrecordcount" "_recordCorrelationKey" "ruleFiredFlags" "r_dg_out";
          	method resetruleFiredCounts( in_out char "ruleFiredFlags", in_out integer "rulesfiredforrecordcount");
