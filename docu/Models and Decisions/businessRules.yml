  schemas:
    scoreCodeGenerationRequest:
      title: Request for Generating Score Code
      description: A request that contains hints to generate the mapped code using
        the scoring definition by score object.
      required:
      - scoreDefinitionId
      properties:
        scoreDefinitionId:
          type: string
          description: The score definition ID that is used for generating the mapped
            code. This should be used only if the `scoreDefinition` is not used.
        hints:
          type: object
          description: Hints for generating the mapped code. The mapped code request
            is forwarded to the score object of the score definition. The score object
            should be able to understand these hints.
          additionalProperties:
            type: string
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
      example:
        scoreDefinitionId: 9f0c13ae-6a27-11e6-8b77-86f30ca893d3
        hints:
          outputLibraryName: PUBLIC
