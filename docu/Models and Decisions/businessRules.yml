          	end;

          	method enableRuleFiredRecording();
          		ruleFiredRecordingEnableFlag = 1;
          	end;

          	method disableRuleFiredRecording();
          		ruleFiredRecordingEnableFlag = 0;
          	end;

          	method initRuleFireHashes();
          		if null(ruleFireFlagOffsetHash) then do;
          			ruleFireFlagOffsetHash = _new_ [this] hash();
          			ruleFireFlagOffsetHash.keys([RULE_ID]);
          			ruleFireFlagOffsetHash.data([RULE_ID ruleFiredFlagPosition]);
          			ruleFireFlagOffsetHash.defineDone();
          			ruleFireFlagOffsetHash.clear();
          		end;
          		ruleFiredFlagPosition = ruleFiredBasePosition;
          		RULE_ID = 'da5a5617-ebc8-4864-a18d-fd6c29acc5be';
          		ruleFireFlagOffsetHash.ref();
          		ruleFiredFlagPosition = ruleFiredFlagPosition+1;
          		RULE_ID = '8d72248c-3e73-4ff7-af18-9015ada4ab8e';
          		ruleFireFlagOffsetHash.ref();
          		ruleFiredFlagPosition = ruleFiredFlagPosition+1;
          	end;

          	/* ---- RULE FIRED FLAG COUNT = 2 ---- */
          	method getRuleFiredFlagCount() returns integer;
          		return 2 ;
          	end;

          	method recordRuleFired(
          		in_out char    ruleFiredFlags,
          		in_out integer rulesFiredForRecordCount,
          		char(36)       this_rule_id);

          		if not(RuleFiredRecordingEnableFlag) then return;
          		if (null(ruleFireFlagOffsetHash) = 0) then do;
          			RULE_ID = this_rule_id;
          			if (ruleFireFlagOffsetHash.find() = 0) then do;
          				if (ruleFiredFlagPosition > 0) then do;
