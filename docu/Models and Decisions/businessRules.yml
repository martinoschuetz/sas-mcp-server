      - code
      properties:
        id:
          type: string
          description: The system-assigned unique ID for this object.
        name:
          type: string
          description: >
            A unique name for the function. The name is determined by parsing the
            method name defined in the function's code.

            Note that if the method identifier is quoted, this name will *NOT* include
            those quotes, but it will match the casing of the name in the code. If
            the
            method identifier is unquoted in the code, its name will be folded to
            lowercase.
