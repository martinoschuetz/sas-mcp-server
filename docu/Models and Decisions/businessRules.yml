        categoryId:
          type: string
          description: >
            The ID of the function's parent category. This can be changed during an
            update to the function in order to move the function into a different
            category.
        description:
          type: string
          description: A description of the function.
        code:
          type: string
          description: >
            The DS2 function implementation, starting with the `method my_func();`
            statement.
        returnType:
          type: string
          description: >
            The type returned from the function is specified after the `returns`
            keyword in the header of the declaration. This property is omitted if
            the
            function does not specify a return type.
        signature:
          type: array
          description: >
            An ordered array of the input parameters to the function determined by
            parsing the function's code.
          items:
            $ref: "#/components/schemas/functionSignatureTerm"
        createdBy:
          type: string
          description: The user who created the function.
        creationTimeStamp:
          type: string
          format: date-time
          description: The data and time at which the function was created.
        modifiedBy:
          type: string
          description: The user who made the last modification to the function.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The date and time at which the function was last modified.
        testCustomContextUri:
          type: string
          description: The URI of a Custom Context DS2 code file that provides a custom
            context to this function. Normally, this function's custom context is
            provided by the decision that utimately utilizes it. For syntax validation
            purpose, you can specify a testing-only custom context.
        links:
          type: array
          description: Zero or more links to related resources or operations.
          items:
