      value: |
        /* Rule Set ppn_rs1 version 1.0 generated on Mon Jul 01 06:20:20 UTC 2024 */

        DS2_OPTIONS LOGICALEXPR = STANDARD;
        DS2_OPTIONS SCOND = WARNING;
        DS2_OPTIONS MISSING_NOTE;

        /* {PACKAGE_START} */
          package BRM_51_RuleSet_0  / inline;

              dcl package logger _logger('App.demo');
              dcl package logger logr_variableTrace('App.TableServices.DS2.Runtime.TraceVariables');

                /* ---- RULE FIRED FLAG COUNT = 0 ---- */

        method DataGrid_addRow(package datagrid aGrid)
        returns int;
            dcl int res rowCnt;
            rowCnt = 0;
            res = aGrid.rowAdd();
            if (res = 0) then
            rowCnt = aGrid.rowCount();
            return rowCnt;
        end;

        method DataGrid_addRow(package datagrid aGrid, int numberOfRows)
        returns int;
            dcl int res rowCnt;
            rowCnt = 0;
            res = aGrid.rowAdd(numberOfRows);
            if (res = 0) then
            rowCnt = aGrid.rowCount();
            return rowCnt;
        end;

        method DataGrid_columnExists(package datagrid aGrid,
        varchar(255) col_name)
        returns int;
            if (aGrid.columnExists(col_name)) then do;
                return aGrid.columnIndex(col_name);
            end;
            return 0;
        end;

        method DataGrid_addCharacterColumn(package datagrid aGrid,
        varchar(255) col_name)
        returns int;
            return aGrid.columnAddCharType(col_name);
        end;

        method DataGrid_Set(package datagrid aGrid,
        varchar(255) col_name,
        int          row_index,
        varchar(32767) value)
        returns int;
            return aGrid.setValue(col_name, row_index, value);
        end;

                method initRdsp();
            end;

            method execute( in_out varchar "r_char",double "r_int",double "r_number",in_out package datagrid "r_dg_out");
                dcl double "dg_index";

        ;
                 if ("r_char" = 'Foundation') then do;
                 if (DataGrid_columnExists("r_dg_out",'r1_char_col') = 0) then do;
                                     DataGrid_addCharacterColumn("r_dg_out",'r1_found_col');
                                     end;
                         dg_index=DataGrid_AddRow(r_dg_out);
                         DataGrid_Set("r_dg_out",'r1_found_col', dg_index,'1 found');
        goto "end_da5a5617-ebc8-4864-a18d-fd6c29acc5be";end;
                 else do;
                 if (DataGrid_columnExists("r_dg_out",'r1_char_col') = 0) then do;
                                     DataGrid_addCharacterColumn("r_dg_out",'r1_found_col');
                                     end;
                         dg_index=DataGrid_AddRow(r_dg_out);
                         DataGrid_Set("r_dg_out",'r1_found_col', dg_index,'1 NOT found');
                 end;

                 "end_da5a5617-ebc8-4864-a18d-fd6c29acc5be":

              rule_end:  /* label for rule RETURN action */
            end;

        /* {PACKAGE_END} */
          endpackage;
