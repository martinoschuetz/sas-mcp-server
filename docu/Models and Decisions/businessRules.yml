    analysisCodeOfRuleSet:
      description: Generated analysis code for a rule set.
      value:
        code: '/*rule fired detail*/ thread brm_rf_detail_thread / inline; dcl varchar(100)  "RULE_NM";
          dcl varchar(100)  "RULE_SET_NM"; dcl varchar(36)   "RULE_SET_ID";

          dcl varchar(36)   "RULE_SET_VERSION_ID"; dcl varchar(36)   "RULE_ID";

          dcl varchar(36)   "rule_action_fire_id"; dcl integer       "ruleFiredSequence";


          dcl package hash  ruleFireFlagOffsetHash; dcl package hiter ruleFiredHashIterator;

          dcl integer       ruleFiredFlagPosition; dcl integer       ruleFiredBasePosition;


          keep "rule_action_fire_id" "RULE_NM" "RULE_SET_ID" "RULE_SET_VERSION_ID"
          "RULE_SET_NM" "RULE_ID" "ruleFiredSequence" "_recordCorrelationKey";

          method initRuleFireHashes(); if null(ruleFireFlagOffsetHash) then do; ruleFireFlagOffsetHash
          = _new_ [this] hash(); ruleFireFlagOffsetHash.keys([RULE_ID]); ruleFireFlagOffsetHash.data([RULE_ID
          ruleFiredFlagPosition RULE_NM RULE_SET_ID RULE_SET_VERSION_ID RULE_SET_NM]);
          ruleFireFlagOffsetHash.defineDone(); ruleFireFlagOffsetHash.clear(); end;
          ruleFiredFlagPosition    = ruleFiredBasePosition; RULE_ID = ''da5a5617-ebc8-4864-a18d-fd6c29acc5be'';
          "RULE_NM" = ''Default_rule_2''; "RULE_SET_ID" = ''1525f975-eb00-4602-bf73-f9d1f020a178'';
          "RULE_SET_VERSION_ID" = ''cee3b513-d75d-4757-869f-a835a76baa08''; "RULE_SET_NM"    =
          ''ppn_rs1''; ruleFireFlagOffsetHash.ref(); ruleFiredFlagPosition  = ruleFiredFlagPosition+1;
          RULE_ID = ''8d72248c-3e73-4ff7-af18-9015ada4ab8e''; "RULE_NM" = ''Default_rule_3'';
          "RULE_SET_ID" = ''1525f975-eb00-4602-bf73-f9d1f020a178''; "RULE_SET_VERSION_ID"
          = ''cee3b513-d75d-4757-869f-a835a76baa08''; "RULE_SET_NM"  = ''ppn_rs1'';
          ruleFireFlagOffsetHash.ref(); ruleFiredFlagPosition   = ruleFiredFlagPosition+1;
          end;

          method init(); ruleFiredBasePosition   = 1; initRuleFireHashes(); ruleFiredHashIterator
          = _new_ hiter(''ruleFireFlagOffsetHash''); end;

          method run(); dcl double rfLen; set "public"."ppn_rs1_Test_ppn_rs1_2024-07-01_06-44-38_output"

          (keep=("ruleFiredFlags" "_recordCorrelationKey")); rfLen   = lengthc("ruleFiredFlags");
          ruleFiredHashIterator.first(); do until (ruleFiredHashIterator.next());
          if ruleFiredFlagPosition > 0 and  ruleFiredFlagPosition <= rfLen then do;
          if (substr("ruleFiredFlags",ruleFiredFlagPosition,1) = ''1'') then do; "rule_action_fire_id"=uuidgen();
          "ruleFiredSequence"=ruleFiredFlagPosition; output ; end; end; end;

          end;


          method term(); ruleFiredHashIterator.delete(); rulefireFlagoffsethash.delete();

          end; endthread;

          data "public"."OUT_ruleFired" (overwrite=yes ) ;

          dcl thread  brm_rf_detail_thread _t;

          method run(); set from _t; output; end; enddata;'
        codeType: text/vnd.sas.source.ds2
        outputTableName: OUT_ruleFired
        outputLibraryName: public
        analysisType: ruleFiredDetails
        version: 1
