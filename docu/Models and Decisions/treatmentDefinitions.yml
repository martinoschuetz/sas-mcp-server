          - string
          - decimal
          - integer
          - date
          - datetime
    treatmentDefinitionGroupAttributeValueMapping:
      title: Treatment Definition Group Attribute Value Mapping
      description: >
        Represents the mapping of treatment definition attributes and source of its
        value. This doesn't represent any top-level media type.
      required:
      - attributeId
      - mappingType
      type: object
      properties:
        attributeId:
          type: string
          readOnly: true
          description: The system-assigned unique ID for this attribute.
        attributeName:
          type: string
          description: Name of an attribute of the treatment definition.
        mappingType:
          type: string
          format: enumeration
          description: The mapping type.
          enum:
          - variable
          - constant
        value:
          anyOf:
          - type: integer
          - type: number
          - type: array
          - type: boolean
          - type: object
          - type: string
          description: >
            For constant mapping type it is a literal value and for variable mapping
            type it is the name of the variable of treatment definition group. It
            is
            required when mappingType is variable. When mappingType is constant it
            can be null.
        error:
          $ref: "#/components/schemas/error2"
    treatmentDefinitionGroupAttributeNameAlias:
      title: Treatment Definition Group Attribute Name Alias
      description: >
