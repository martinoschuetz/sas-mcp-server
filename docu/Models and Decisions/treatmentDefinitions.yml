            - type: array
            - type: boolean
            - type: object
            - type: string
        minimum:
          type: object
          description: >
            Minimum value for the attribute. Valid only for simple types with
            multiple=false and range=false. Valid types:
            `decimal(dataType=number, format=decimal)`,
            `integer(dataType=number, format=integer)`,
            `date(dataType=string, format=date)`,
            `datetime(dataType=string, format=datetime)`
        maximum:
          type: object
          description: >
            Maximum value for the attribute. Only valid for simple types with
            multiple=false and range=false. Only valid for
            `decimal(dataType=number, format=decimal)`,
            `integer(dataType=number, format=integer)`,
            `date(dataType=string, format=date)`,
            `datetime(dataType=string, format=datetime)`.
        minLength:
          type: integer
          description: Minimum length of the attribute value. Used only by string
            data type and simple types with multiple=false and range=false.
        maxLength:
          type: integer
          description: Maximum length of the attribute value. Used only by string
            data type and simple types with multiple=false and range=false.
    decisionStepCodeSignatureTermDataGridExtension:
