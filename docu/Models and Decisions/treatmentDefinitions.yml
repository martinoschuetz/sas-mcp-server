      parameters:
      - name: groupId
        description: The unique identifier for the treatment definition group.
        in: path
        required: true
        schema:
          type: string
        example: da85cd3c-7c7a-437c-acac-eca2819c9a6d
      - name: revisionType
        in: query
        required: false
        description: Valid values are `major` or `minor`. This value determines how
          the server generates the `major` and `minor` numbers. If a `major` number
          is provided, the next available major version number is started. For example,
          if the treatment definition group has revisions 1.0, 1.1, 1.2, 2.0, and
          2.1, creating a new major revision results in 3.0. If a `minor` number is
          provided, then the next available minor revision number is reserved based
          on the existing revisions. For example, if the existing revisions have `major`
          and `minor` numbers of 1.1, 1.2, 1.3, 2.1, 2.2, and a user requests a new
          minor revision, then 2.3 is assigned. This parameter defaults to `minor`
          if not supplied.
        schema:
          type: string
          enum:
          - major
          - minor
      - name: fromRevisionUri
        in: query
        description: This value specifies the URI of the treatment definition group
          revision this new treatment definition group revision is being created from.
          This property allows for the lineage of a treatment definition group to
          be traced. The valid format for this parameter is '/treatmentDefinitions/definitionGroups/${groupId}/revisions/${revisionId}'
