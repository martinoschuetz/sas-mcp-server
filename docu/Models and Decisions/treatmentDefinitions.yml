---
openapi: 3.0.3
info:
  version: "9"
  title: Treatment Definitions
  description: The Treatment Definitions API is used for creating and maintaining
    treatment definitions and treatment definition groups.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  license:
    name: SAS Institute
    url: https://support.sas.com/techsup/license/index.html
servers:
- url: https://example.com/treatmentDefinitions
  description: This is an example of a base URL.
externalDocs:
  description: Developer documentation
  url: https://developer.sas.com
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Treatment Definitions
  description: Contains operations to create, read, update, and delete treatment definitions.
- name: Treatment Definition Revisions
  description: Contains operations to create and read treatment definition revisions.
- name: Treatment Definition Groups
  description: Contains operations to create, read, update, and delete treatment definition
    groups.
- name: Treatment Definition Group Revisions
  description: Contains operations to create and read treatment definition group revisions.
- name: Code
  description: Contains operations for generating code.
paths:
  /:
    get:
      operationId: root
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a list of top-level resource links for this API.
      responses:
        "200":
          description: The request succeeded. A collection of link objects was returned.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Last-Modified:
              schema:
                type: string
              example: Thu, 06 May 2021 21:37:00 GMT
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                root:
                  $ref: "#/components/examples/root"
  /definitions:
    get:
      operationId: getAllTreatmentDefinitions
      tags:
      - Treatment Definitions
      summary: Get a list of all treatment definitions
      description: Returns a resource collection of all treatment definitions.
      parameters:
      - name: start
        in: query
        description: The starting index of the first item in a page. The index is
          0-based.
        schema:
          type: integer
          default: 0
        example: 100
      - name: limit
        in: query
        description: The maximum number of items to return in this page of results.
          The actual number of returned items might be less if the collection has
          been exhausted.
        schema:
          type: integer
          default: 10
        example: 500
      - name: filter
        description: The criteria for filtering the treatment definitions. See [Filtering
          in REST APIs](https://developer.sas.com/rest-apis/treatmentDefinitions-v9/docs/getting-started/usage-notes#filtering).
        in: query
        schema:
          type: string
          format: filter-criteria
        example: gt(modifiedTimeStamp, '2021-05-03T15:38:45.654Z')
      - name: sortBy
        description: The criteria for sorting the treatment definitions. See [Sorting
          in REST APIs](https://developer.sas.com/rest-apis/treatmentDefinitions-v9/docs/getting-started/usage-notes#sorting).
        in: query
        schema:
          type: string
          format: sort-criteria
        example: modifiedTimeStamp:descending
      - name: parentFolderUri
        in: query
        description: The folder where the target treatment definitions are located.
        required: false
        schema:
          type: string
          format: /folders/folders/{parentFolderId}
        example: /folders/folders/@public
      - name: Accept-Item
        description: Used for selecting the desired item representation.
        in: header
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.treatment.definition+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.dcm.summary+json
          default: application/vnd.sas.summary+json
        example: application/vnd.sas.treatment.definition+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Last-Modified:
              schema:
                type: string
              example: Thu, 06 May 2021 21:37:00 GMT
          content:
            application/vnd.sas.collection+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/resourceSummaryCollection"
                - $ref: "#/components/schemas/treatmentDefinitionCollection"
                - $ref: "#/components/schemas/revisionSummaryCollection"
              examples:
                application/vnd.sas.summary+json:
                  $ref: "#/components/examples/resourceSummaryOfTreatmentDefinitions"
                application/vnd.sas.treatment.definition+json:
                  $ref: "#/components/examples/fullDetailsOfTreatmentDefinitions"
                application/vnd.sas.dcm.summary+json:
                  $ref: "#/components/examples/revisionSummaryOfTreatmentDefinitions"
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/resourceSummaryCollection"
                - $ref: "#/components/schemas/treatmentDefinitionCollection"
                - $ref: "#/components/schemas/revisionSummaryCollection"
              examples:
                application/vnd.sas.summary+json:
                  $ref: "#/components/examples/resourceSummaryOfTreatmentDefinitions"
                application/vnd.sas.treatment.definition+json:
                  $ref: "#/components/examples/fullDetailsOfTreatmentDefinitions"
                application/vnd.sas.dcm.summary+json:
                  $ref: "#/components/examples/revisionSummaryOfTreatmentDefinitions"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
    post:
      operationId: createTreatmentDefinition
      summary: Create a new treatment definition
      description: Creates a new treatment definition based on the provided content
      tags:
      - Treatment Definitions
      parameters:
      - name: parentFolderUri
        in: query
        description: Folder in which the new treatment definition is placed
        required: false
        schema:
          type: string
          format: /folders/folders/{parentFolderId}
        example: /folders/folders/@public
      - name: fromRevisionUri
        in: query
        description: This value specifies the URI of the treatment definition revision
          from which the new treatment definition is being created. This property
          enables you to trace the lineage of a treatment definition.
        schema:
          type: string
          format: /treatmentDefinitions/definitions/{definitionId}/revisions/{revisionId}
        example: /treatmentDefinitions/definitions/3bb0a443-4919-452f-9e0f-9e285e7faa1d/revisions/ba14828c-b4b6-4a3a-9246-f51dd16ffcba
      requestBody:
        content:
          application/vnd.sas.treatment.definition+json:
            schema:
              $ref: "#/components/schemas/treatmentDefinition"
            examples:
              default:
                $ref: "#/components/examples/createOrUpdateTreatmentDefinition"
          application/json:
            schema:
              $ref: "#/components/schemas/treatmentDefinition"
            examples:
              default:
                $ref: "#/components/examples/createOrUpdateTreatmentDefinition"
        description: Treatment details that need to be created.
        required: true
      responses:
        "201":
          description: A treatment definition was created.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Last-Modified:
              schema:
                type: string
              example: Thu, 06 May 2021 21:37:00 GMT
            Location:
              schema:
                type: string
              example: /treatmentDefinitions/definitions/3bb0a443-4919-452f-9e0f-9e285e7faa1d
            ETag:
              description: The entity tag for the treatment definition.
              schema:
                type: string
              example: '"kknyjgku"'
          content:
            application/vnd.sas.treatment.definition+json:
              schema:
                $ref: "#/components/schemas/treatmentDefinition"
              examples:
                default:
                  $ref: "#/components/examples/fullDetailsOfTreatmentDefinition"
            application/json:
              schema:
                $ref: "#/components/schemas/treatmentDefinition"
              examples:
                default:
                  $ref: "#/components/examples/fullDetailsOfTreatmentDefinition"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
  "/definitions/{definitionId}#summary":
    get:
      operationId: getTreatmentDefinitionSummary
      summary: Get treatment definition summary
      description: Returns the summary representation of the specified treatment definition.
      tags:
      - Treatment Definitions
      parameters:
      - name: definitionId
        description: The unique identifier for the treatment definition.
        in: path
        required: true
        schema:
          type: string
        example: da85cd3c-7c7a-437c-acac-eca2819c9a6d
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Last-Modified:
              description: The timestamp when the treatment definition was last modified.
                The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
              example: Thu, 06 May 2021 21:37:00 GMT
            ETag:
              description: The entity tag for the treatment definition.
              schema:
                type: string
              example: '"kknyjgku"'
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/summaryDetailsOfTreatmentDefinition"
            application/json:
              schema:
                $ref: "#/components/schemas/summary"
              examples:
                default:
                  $ref: "#/components/examples/summaryDetailsOfTreatmentDefinition"
        "404":
          description: No treatment definition exists at the requested path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  "/definitions/{definitionId}#revisionSummary":
    get:
      operationId: getTreatmentDefinitionDCMSummary
      summary: Get a treatment definition revision summary
      description: Returns the revision summary representation of the specified treatment
        definition.
      tags:
      - Treatment Definitions
      parameters:
      - name: definitionId
        description: The unique identifier for the treatment definition.
        in: path
        required: true
        schema:
          type: string
        example: da85cd3c-7c7a-437c-acac-eca2819c9a6d
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Last-Modified:
              description: The timestamp when the treatment definition was last modified.
                The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
              example: Thu, 06 May 2021 21:37:00 GMT
            ETag:
              description: The entity tag for the treatment definition.
              schema:
                type: string
              example: '"kknyjgku"'
          content:
            application/vnd.sas.dcm.summary+json:
              schema:
                $ref: "#/components/schemas/revisionSummary"
              examples:
                default:
                  $ref: "#/components/examples/summaryDetailsOfTreatmentDefinitionRevision"
            application/json:
              schema:
                $ref: "#/components/schemas/revisionSummary"
              examples:
                default:
                  $ref: "#/components/examples/summaryDetailsOfTreatmentDefinitionRevision"
        "404":
          description: No treatment definition exists at the requested path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  "/definitions/{definitionId}":
    get:
      operationId: getTreatmentDefinition
      summary: Get a treatment definition
      description: Returns the representation of the specified treatment definition.
      tags:
      - Treatment Definitions
      parameters:
      - name: definitionId
        description: The unique identifier for the treatment definition.
        in: path
        required: true
        schema:
          type: string
        example: da85cd3c-7c7a-437c-acac-eca2819c9a6d
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Last-Modified:
              description: The timestamp when the treatment definition was last modified.
                The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
              example: Thu, 06 May 2021 21:37:00 GMT
            ETag:
              description: The entity tag for the treatment definition.
              schema:
                type: string
              example: '"kknyjgku"'
          content:
            application/vnd.sas.treatment.definition+json:
              schema:
                $ref: "#/components/schemas/treatmentDefinition"
              examples:
                default:
                  $ref: "#/components/examples/fullDetailsOfTreatmentDefinition"
            application/json:
              schema:
                $ref: "#/components/schemas/treatmentDefinition"
              examples:
                default:
                  $ref: "#/components/examples/fullDetailsOfTreatmentDefinition"
        "404":
          description: No treatment definition exists at the requested path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    put:
      operationId: updateTreatmentDefinition
      summary: Update a treatment definition
      description: Updates the specified treatment definition based on the representation
        in the request body.
      tags:
      - Treatment Definitions
      parameters:
      - name: definitionId
        description: The unique identifier for the treatment definition.
        in: path
        required: true
        schema:
          type: string
        example: da85cd3c-7c7a-437c-acac-eca2819c9a6d
      - name: If-Match
        description: The entity tag obtained from the most recent `ETag` response
          header. Must match the current entity tag for the treatment definition.
        in: header
        required: true
        schema:
          type: string
        example: '"kknyjgku"'
      requestBody:
        content:
          application/vnd.sas.treatment.definition+json:
            schema:
              $ref: "#/components/schemas/treatmentDefinition"
            examples:
              default:
                $ref: "#/components/examples/createOrUpdateTreatmentDefinition"
          application/json:
            schema:
              $ref: "#/components/schemas/treatmentDefinition"
            examples:
              default:
                $ref: "#/components/examples/createOrUpdateTreatmentDefinition"
        description: The representation of a treatment definition to use in update.
        required: true
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Last-Modified:
              description: The timestamp when the treatment definition was last modified.
                The timestamp is in the format `EEE, dd MMM yyyy HH:mm:ss GMT`.
              schema:
                type: string
              example: Thu, 06 May 2021 21:37:00 GMT
            ETag:
              description: The entity tag for the treatment definition.
              schema:
                type: string
              example: '"kknyjgku"'
          content:
            application/vnd.sas.treatment.definition+json:
              schema:
                $ref: "#/components/schemas/treatmentDefinition"
              examples:
                default:
                  $ref: "#/components/examples/fullDetailsOfTreatmentDefinition"
            application/json:
              schema:
                $ref: "#/components/schemas/treatmentDefinition"
              examples:
                default:
                  $ref: "#/components/examples/fullDetailsOfTreatmentDefinition"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          description: No treatment definition exists at the requested path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
        "412":
          description: The `If-Match` request header did not match the resource's
            entity tag.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionFailed"
        "428":
          description: The request headers did not include a `If-Match` precondition.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/preConditionRequired"
    delete:
      operationId: deleteTreatmentDefinition
      summary: Delete a treatment definition
      description: Deletes the specified treatment definition.
      tags:
      - Treatment Definitions
      parameters:
      - name: definitionId
        description: The unique identifier for the treatment definition.
        in: path
        required: true
        schema:
          type: string
        example: da85cd3c-7c7a-437c-acac-eca2819c9a6d
      responses:
        "204":
          description: The treatment definition was deleted.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
  "/definitions/{definitionId}/dependencies":
    get:
      operationId: getTreatmentDefinitionDependencies
      summary: Get direct dependencies of a treatment definition
      description: Returns the representation of the transfer dependencies of treatment
        definition.
      tags:
      - Treatment Definitions
      parameters:
      - name: definitionId
        description: The unique identifier for the treatment definition.
        in: path
        required: true
        schema:
          type: string
        example: da85cd3c-7c7a-437c-acac-eca2819c9a6d
      - name: Accept
        in: header
        description: Used for selecting desired representation.
        schema:
          type: string
          format: media-type
          enum:
          - application/json
          - application/vnd.sas.transfer.dependencies+json
          default: application/json
          example: application/vnd.sas.transfer.dependencies+json
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.transfer.dependencies+json:
              schema:
                $ref: "#/components/schemas/directTreatmentDefinitionDependentObjects"
              examples:
                default:
                  $ref: "#/components/examples/directTreatmentDefinitionDependentObjects"
            application/json:
              schema:
                $ref: "#/components/schemas/directTreatmentDefinitionDependentObjects"
              examples:
                default:
                  $ref: "#/components/examples/directTreatmentDefinitionDependentObjects"
        "404":
          description: No treatment definition exists at the requested path.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
  "/definitions/{definitionId}/revisions":
    get:
      operationId: getAllTreatmentDefinitionRevisions
      summary: Get all revisions for a treatment definition
      description: Retrieves a list of all revisions that exist for a treatment definition.
      tags:
      - Treatment Definition Revisions
      parameters:
      - name: definitionId
        description: The unique identifier for the treatment definition.
        in: path
        required: true
        schema:
          type: string
        example: da85cd3c-7c7a-437c-acac-eca2819c9a6d
      - name: Accept-Item
        description: Used for selecting the desired item representation.
        in: header
        schema:
          type: string
          format: media-type
          enum:
          - application/vnd.sas.treatment.definition+json
          - application/vnd.sas.summary+json
          - application/vnd.sas.dcm.summary+json
          default: application/vnd.sas.summary+json
        example: application/vnd.sas.treatment.definition+json
      - name: start
        description: Returns the index of the first revision of the specified treatment
          definition.
        in: query
        schema:
          type: integer
        example: 100
      - name: limit
        description: Returns the maximum number of revisions of the specified treatment
          definition.
        in: query
        schema:
          type: integer
        example: 500
      - name: filter
        description: The criteria used for filtering the revisions of the specified
          treatment definition. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/treatmentDefinitions-v9/docs/getting-started/usage-notes#filtering).
        in: query
        schema:
          type: string
          format: filter-criteria
        example: gt(modifiedTimeStamp, '2021-05-03T15:38:45.654Z')
      - name: sortBy
        description: The criteria used for sorting the revisions of the specified
          treatment definition. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/treatmentDefinitions-v9/docs/getting-started/usage-notes#sorting).
        in: query
        schema:
          type: string
          format: sort-criteria
        example: modifiedTimeStamp:descending
      responses:
        "200":
          description: The request succeeded.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
            Last-Modified:
              schema:
                type: string
              example: Thu, 06 May 2021 21:37:00 GMT
          content:
            application/vnd.sas.collection+json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/resourceSummaryCollection"
                - $ref: "#/components/schemas/treatmentDefinitionCollection"
                - $ref: "#/components/schemas/revisionSummaryCollection"
              examples:
                application/vnd.sas.summary+json:
                  $ref: "#/components/examples/resourceSummaryOfTreatmentDefinitions"
                application/vnd.sas.treatment.definition+json:
                  $ref: "#/components/examples/fullDetailsOfTreatmentDefinitions"
                application/vnd.sas.dcm.summary+json:
                  $ref: "#/components/examples/revisionSummaryOfTreatmentDefinitions"
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/resourceSummaryCollection"
                - $ref: "#/components/schemas/treatmentDefinitionCollection"
                - $ref: "#/components/schemas/revisionSummaryCollection"
              examples:
                application/vnd.sas.summary+json:
                  $ref: "#/components/examples/resourceSummaryOfTreatmentDefinitions"
                application/vnd.sas.treatment.definition+json:
                  $ref: "#/components/examples/fullDetailsOfTreatmentDefinitions"
                application/vnd.sas.dcm.summary+json:
                  $ref: "#/components/examples/revisionSummaryOfTreatmentDefinitions"
        "400":
          description: The request was invalid.
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/badRequest"
        "404":
          headers:
            Sas-Service-Response-Flag:
              $ref: "#/components/headers/Sas-Service-Response-Flag"
          description: No treatment definition exists at the requested path.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                default:
                  $ref: "#/components/examples/notFound"
    post:
      operationId: createTreatmentDefinitionRevision
      summary: Create revision of a treatment definition
      description: Creates a new revision of a treatment definition based on the representation
        in the request body.
      tags:
      - Treatment Definition Revisions
      parameters:
      - name: definitionId
        description: The unique identifier for the treatment definition.
        in: path
        required: true
        schema:
          type: string
        example: da85cd3c-7c7a-437c-acac-eca2819c9a6d
      - name: revisionType
        in: query
        required: false
        description: Valid values are `major` or `minor`. This value determines how
          the server generates the `major` and `minor` numbers. If a `major` number
          is provided, the next available major version number is started. For example,
          if the treatment has revisions 1.0, 1.1, 1.2, 2.0, and 2.1, creating a new
          major revision results in 3.0. If a `minor` number is provided, then the
          next available minor revision number is reserved based on the existing revisions.
          For example, if the existing revisions have `major` and `minor` numbers
          of 1.1, 1.2, 1.3, 2.1, 2.2, and a user requests a new minor revision, then
          2.3 is assigned. This parameter defaults to `minor` if not supplied.
        schema:
          type: string
          enum:
          - major
          - minor
      - name: fromRevisionUri
        in: query
        description: This value specifies the URI of the treatment definition revision
          this new treatment definition revision is being created from.This property
          allows for the lineage of a treatment definition to be traced. The valid
          format for this parameter is '/treatmentDefinitions/definitions/${definitionId}/revisions/${revisionId}'
        schema:
          type: string
