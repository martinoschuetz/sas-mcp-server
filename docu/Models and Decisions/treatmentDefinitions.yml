        \ DataGrid_Clear(package datagrid aGrid) returns int; aGrid.clear(); return\
        \ 0; end;\nmethod DataGrid_toString(package datagrid aGrid) returns varchar;\
        \ return aGrid.serialize(); end;\nmethod DataGrid_addRow(package datagrid\
        \ aGrid) returns int; dcl int res rowCnt; rowCnt = 0; res = aGrid.rowAdd();\
        \ if (res = 0) then rowCnt = aGrid.rowCount(); return rowCnt; end;\nmethod\
        \ DataGrid_finalizeRow(package datagrid aGrid) returns int; return aGrid.rowCount();\
        \ end;\nmethod DataGrid_columnExists(package datagrid aGrid, varchar(255)\
        \ col_name) returns int; if (aGrid.columnExists(col_name)) then do; return\
        \ aGrid.columnIndex(col_name); end; return 0; end;\nmethod DataGrid_addCharacterColumn(package\
        \ datagrid aGrid, varchar(255) col_name) returns int; return aGrid.columnAddCharType(col_name);\
        \ end;\nmethod DataGrid_addNumericColumn(package datagrid aGrid, varchar(255)\
        \ col_name) returns int; return aGrid.columnAddNumType(col_name); end;\nmethod\
        \ DataGrid_Set(package datagrid aGrid, varchar(255) col_name, int        \
        \  row_index, varchar(32767) value) returns int; return aGrid.setValue(col_name,\
        \ row_index, value); end;\nmethod dcm_treatments_79075dba_52cd_4881_8daf_86fc4c4cedc3();\
        \ _isDebugEnabled = m_logger.islevelactive(3); end;\nmethod execute( varchar(32767)\
        \ \"foo\", in_out package datagrid \"dgout\" ); if (DataGrid_columnExists(\"\
        dgout\",'treatment_definition_group_id') = 0) then do; DataGrid_addCharacterColumn(\"\
