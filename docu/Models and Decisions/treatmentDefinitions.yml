        doesn't represent any top-level media type.
      required:
      - attributeId
      - aliasName
      type: object
      properties:
        attributeId:
          type: string
          readOnly: true
          description: The system-assigned unique ID for this attribute.
        attributeName:
          type: string
          description: Name of an attribute of the treatment definition.
        aliasName:
          type: string
          description: Alias name of the attribute.
        error:
          $ref: "#/components/schemas/error2"
