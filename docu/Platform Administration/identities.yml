        group identifier entries (containing the identity type, group id, and gid)
        specified in the request body. It attempts to create and store that gid value  in
        the database for each group entry. The endpoint is used for setting multiple  gid
        values at once when the service is configured in non generation mode. If the  service
        is configured to be in generate mode, then this method will return a  MethodNotAllowed
        exception.  The request is intended to provide a way to load many
        gidNumber values at once for groups rather than calling the PUT groups identifier  endpoint
        individually for each entry.
        <p>  <b>Authorization:</b> The request can be run by an Administrator.
      requestBody:
        content:
          application/json:
            schema:
