      summary: Create/Update the uid and gid number for the specified user
      description: >
        Create or Update an existing user's uid and gid number. This request
        will add a uid and gid number or replace the existing uid number with
        the value specified in the request body for the specified user. It is
        used for setting or updating uid and gid values for non LDAP users or
        for LDAP users where the uidNumber gidNumber attributes do not
        exist.  If the user exists in LDAP and has the uidNumber and gidNumber
        attributes already defined, then this request will return a conflict
        exception.  The request is intended to provide a uidNumber and gidNumber
        value for those users that do not have them. <p>  <b>Authorization:</b>
        The request can be run by an Administrator.
      parameters:
      - name: userId
        in: path
        description: user id
        required: true
        schema:
          type: string
          format: object-id
      requestBody:
        content:
          application/vnd.sas.identity.identifier:
            schema:
              $ref: "#/components/schemas/identifierUserIn"
          application/json:
            schema:
              $ref: "#/components/schemas/identifierUserIn"
