      - name: userId
        in: path
        description: user id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK
          content:
            image/jpg:
              schema:
                $ref: "#/components/schemas/imagefile"
            image/jpeg:
              schema:
                $ref: "#/components/schemas/imagefile"
            image/bmp:
              schema:
                $ref: "#/components/schemas/imagefile"
            image/gif:
              schema:
                $ref: "#/components/schemas/imagefile"
            image/png:
              schema:
                $ref: "#/components/schemas/imagefile"
        "404":
          description: Not found - the avatar or the user could not be found
        "500":
          description: Resource Exception - the avatar could not be retrieved from
            file service
  /identities:
    x-sas-internal: true
    get:
      tags:
      - Root
      operationId: getIdentities
      summary: Get all identities
      description: >
        Returns a paginated collection of identities. This is a heterogeneous
        collection. The output produced by this method can contain a combination
        of both Users and Groups. Clients should consider using GET /groups or
        GET /users instead if these resources need to be searched for
        independently. Standard paging, filtering, and sorting options are
        provided. <p> <b>Authorization:</b> Any authenticated user. </p>
      parameters:
      - name: start
        in: query
        description: The starting index of the first identity in a page. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of identities to return in this page of results.
          The actual number of returned identities may be less if the collection has
          been exhausted. Defaults to 50.
        schema:
          type: integer
      - name: filter
        in: query
        description: Filter criteria for returned identities. See [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort returned identities.  The sort criteria supports the following
          fields in either ascending or descending order (id, name, description, creationTimeStamp,
          modifiedTimeStamp). See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: type
        in: query
        description: "Retrieve a subset of identities by type.  The type query parameter\
          \ supports the following 2 values: <br>user<br>group"
        schema:
          type: string
          format: type-criteria
      - name: providerId
        in: query
        description: Retrieve a subset of identities by providerId.  The default is
          to return identities in all providers if the parameter is not specified.
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/identityCollection"
              examples:
                identities:
                  $ref: "#/components/examples/identities"
            application/json:
              schema:
                $ref: "#/components/schemas/identityCollection"
              examples:
                identities:
                  $ref: "#/components/examples/identities"
        "400":
          description: An Invalid filter or combination of request parameters was
            provided.
  /cache/refreshes:
    x-sas-internal: true
    post:
      tags:
      - Cache
      operationId: refreshCache
      summary: Refresh the identities cache
      description: >
        Refresh the identities cache if enabled.  The cache may be disabled and
        this will do nothing in that case. <p> <b>Authorization:</b> The ability
        to refresh the cache is restricted to members of the SAS Administrators
        group. </p>
      responses:
        "200":
          description: OK.  The cache is disabled.  Action does nothing in this case.
          content:
            application/vnd.sas.identity.cache:
              schema:
                $ref: "#/components/schemas/identityCache"
            application/json:
              schema:
                $ref: "#/components/schemas/identityCache"
        "202":
          description: The request was accepted and the cache is refreshing.<br>This
            can also be returned when the cache refresh is already in progress.  In
            that case, the refresh request is not submitted and will not run after
            the currently in progress cache refresh finishes.
          content:
            application/vnd.sas.identity.cache:
              schema:
                $ref: "#/components/schemas/identityCache"
            application/json:
              schema:
                $ref: "#/components/schemas/identityCache"
  /commons/validations/configuration/provider:
    x-sas-internal: true
    post:
      tags:
      - Validation
      operationId: validateProvider
      summary: The properties to validate for configuring an identity LDAP provider.
      description: >
        <b>This endpoint must be run over a secured https connection.  Otherwise
        a 403 will be returned.</b> <p>Test the identity provider connection,
        user, and group configuration  properties to determine if the properties
        are valid. </p> <p>The connection configuration password property value
        must be Base64 encoded for this request.</p> <p>Authorization: The
        ability to validate provider properties is restricted to members of the
        SAS Administrators group.</p>
      requestBody:
        content:
          application/vnd.sas.identity.provider.validation:
            schema:
              $ref: "#/components/schemas/providerValidationProperties"
          application/json:
            schema:
              $ref: "#/components/schemas/providerValidationProperties"
        description: provider connection, group, and user configuration properties
        required: true
      responses:
        "200":
          description: The identity provider configuration property validation completed
            normally.<br> If there are validation errors, then the response object
            will contain a non-empty error object.
          content:
            application/vnd.sas.identity.provider.validation.response:
              schema:
                $ref: "#/components/schemas/providerValidationResponse"
              examples:
                identities:
                  $ref: "#/components/examples/validatePropertiesUsedForConfiguringAnIdentityProvider"
            application/vnd.sas.validation:
              schema:
                $ref: "#/components/schemas/providerValidationResponse"
              examples:
                identities:
                  $ref: "#/components/examples/validatePropertiesUsedForConfiguringAnIdentityProvider"
            application/json:
              schema:
                $ref: "#/components/schemas/providerValidationResponse"
              examples:
                identities:
                  $ref: "#/components/examples/validatePropertiesUsedForConfiguringAnIdentityProvider"
        "400":
          description: Bad Request
        "403":
          description: Forbidden - HTTPS required for this request.
  /scim/v2/Groups:
    get:
      tags:
      - Groups
      operationId: getScimGroups
      summary: Get SCIM groups collection
      description: >
        Returns a collection of groups. Standard paging, filtering options
        are provided.
      security:
      - scimSecurity: [SASAdministrators, SCIM]
      parameters:
      - name: startIndex
        in: query
        description: The starting index of the first group in a page. Defaults to
          `1`.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      - name: count
        in: query
        description: Maximum number of groups to return in this page of results. The
          actual number of returned groups can be less if the collection has been
          exhausted. Defaults to `10`.
        schema:
          type: integer
          format: int32
          minimum: 0
        example: 10
      - name: filter
        in: query
        description: Filter criteria for returned groups. See [SCIM Filtering](https://datatracker.ietf.org/doc/html/rfc7644#section-3.4.2.2)
          for syntax details.
        schema:
          type: string
          format: filter-criteria
        example: 'displayName eq "Administrators"'
      - name: attributes
        in: query
        description: A comma-separated list of attribute names to return in the response.
        schema:
          type: string
        example: 'displayName,members'
      - name: excludedAttributes
        in: query
        description: A comma-separated list of attribute names to exclude from the
          response.
        schema:
          type: string
        example: 'members'
      responses:
        "200":
          description: The request succeeded.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/scimGroupCollection"
              examples:
                identities:
                  $ref: "#/components/examples/getScimGroups"
            application/json:
              schema:
                $ref: "#/components/schemas/scimGroupCollection"
              examples:
                identities:
                  $ref: "#/components/examples/getScimGroups"
        "400":
          description: An invalid filter or combination of request parameters was
            provided.
        "401":
          description: Authentication is required.
        "403":
          description: The authenticated user does not have sufficient privileges.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/scimError"
    post:
      tags:
      - Groups
      operationId: createScimGroup
      summary: Create a new SCIM group
      description: >
        Creates a new SCIM group. The displayName of the SCIM group must be set by
        the client within the request body.
      security:
      - scimSecurity: [SASAdministrators, SCIM]
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/scimGroupRequest"
            examples:
              identities:
                $ref: "#/components/examples/postScimGroupRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/scimGroupRequest"
            examples:
              identities:
                $ref: "#/components/examples/postScimGroupRequest"
      responses:
        "201":
          description: A new group was created.
          headers:
            Location:
              description: The URL of the created resource.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/scimGroup"
              examples:
                identities:
                  $ref: "#/components/examples/postScimGroupResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/scimGroup"
              examples:
                identities:
                  $ref: "#/components/examples/postScimGroupResponse"
        "400":
          description: The request was invalid.
        "401":
          description: Authentication is required.
        "403":
          description: The authenticated user does not have sufficient privileges.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/scimError"
        "409":
          description: The group could not be created because a group with the same
            ID already exists
    delete:
      tags:
      - Groups
      operationId: deleteAllScimGroups
      summary: Delete all SCIM groups
      description: >
        Deletes all SCIM groups and permanently removes them from the system.
      security:
      - scimSecurity: [SASAdministrators, SCIM]
      responses:
        "204":
          description: All SCIM groups are deleted.
        "401":
          description: Authentication is required.
        "403":
          description: The authenticated user does not have sufficient privileges.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/scimError"
  /scim/v2/Groups/{groupId}:
