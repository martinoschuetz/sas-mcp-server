            will contain a non-empty error object.
          content:
            application/vnd.sas.identity.identifier.loader.response:
              schema:
                $ref: "#/components/schemas/identifierLoaderResponse"
              examples:
                identities:
                  $ref: "#/components/examples/IdentifierLoaderGroupResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/identifierLoaderResponse"
              examples:
                identities:
                  $ref: "#/components/examples/IdentifierLoaderGroupResponse"
        "400":
          description: Bad Request
        "403":
          description: Forbidden - The user is unauthorized for this request.
        "405":
          description: Method Not Allowed - the request cannot be run based upon service
            configuration options
