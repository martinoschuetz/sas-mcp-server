---
openapi: 3.0.3
info:
  version: "10"
  title: Identities
  description: >
    The Identities API enables clients to retrieve information about existing
    identities (users or groups), and provides administrative functions to manage  those
    identities and create new instances.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    url: "https://developer.sas.com"
    email: devex@sas.com
servers:
- url: https://example.com/identities
  description: This is an example base URL.
tags:
- name: Users
  description: Contains the operations for managing user resources.
- name: Groups
  description: Contains the operations for managing group resources.
- name: Memberships
  x-sas-internal: true
  description: Contains the operations for managing membership resources.
- name: Avatars
  x-sas-internal: true
  description: Contains the operations for managing avatar resources.
- name: Cache
  x-sas-internal: true
  description: Contains the operations for managing the identities cache.
- name: Validation
  x-sas-internal: true
  description: Contains the operations for LDAP provider validation.
- name: Schemas
  description: Contains operations that provide information about the schema.
- name: Resource Types
  description: Contains operations that provide information about resource types.
- name: Service Provider Config
  description: Contains operations that provide information about the service provider
    config.
- name: Root
  x-sas-internal: true
  description: Contains the operations for the root resource.
paths:
  /:
    x-sas-internal: true
    get:
      tags:
      - Root
      operationId: root
      summary: Get a list of top-level links
      description: >
        Returns a list of links to the top-level collections surfaced through
        this API.  These top level links will include "users", "groups",
        "identities", and "currentUser". Certain non collection links are
        returned as appropriate. <p> <b>Authorization:</b> Any authenticated
        user. </p>
      responses:
        "200":
          description: OK
        "404":
          description: Service is not available
    head:
      tags:
      - Root
      operationId: headersForRoot
      summary: Check if the identities service is available
      description: >
        Returns whether or not the identities service is running. <p>
        <b>Authorization:</b> Any authenticated user. </p>
      responses:
        "200":
          description: OK.  Service is running and available
        "404":
          description: Service is not available
  /groupCount:
    x-sas-internal: true
    get:
      tags:
      - Groups
      operationId: getGroupsCount
      summary: Get group count
      description: >
        Returns the total number of groups defined on the system. <p>
        <b>Authorization:</b> The ability to view count information is
        restricted to members of the SAS Administrators group. </p>
      parameters:
      - name: providerId
        in: query
        description: Limit the number of groups returned to those found in the specified
          provider.  The default is to return the count for all providers if the parameter
          is not specified.
        schema:
          type: string
      - name: filter
        in: query
        description: Filter criteria for returned groups count. Filters are supported
          on the following top level fields for groups (id, name, description, title,
          creationTimeStamp, and modifiedTimeStamp). See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.count:
              schema:
                $ref: "#/components/schemas/count"
              examples:
                groupCount:
                  $ref: "#/components/examples/groupCount"
            application/json:
              schema:
                $ref: "#/components/schemas/count"
              examples:
                groupCount:
                  $ref: "#/components/examples/groupCount"
        "400":
          description: An Invalid filter was provided.
  /groups:
    x-sas-internal: true
    get:
      tags:
      - Groups
      operationId: getGroups
      summary: Get groups
      description: >
        Returns a collection of groups as summary objects, full objects,  or
        basic identity objects.  Standard paging, filtering, and sorting options
        are provided.<br>The media type of the returned collection items is
        driven by the Accept-Item header, if specified.<br><br>If an Accept
        header of application/json is specified, it will, by default, map to
        application/vnd.sas.identity.group.summary+json. <p>
        <b>Authorization:</b> Any authenticated user. </p>
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: "The desired group representation.<br>The Accept-Item options\
          \ are:<ul><li>application/vnd.sas.identity.group<li>application/vnd.sas.identity.group.summary<li>application/vnd.sas.identity.basic<li>blank</ul>If\
          \ the application/vnd.sas.identity.basic+json media type is specified, the\
          \ groups are returned as basic identity objects.  In this case, the group\
          \ will only contain basic properties which include: id, name, providerid,\
          \ type, version, and a self link.<br>If the application/vnd.sas.identity.group+json\
          \ media type is specified, the groups are returned as application/vnd.sas.identity.group\
          \ objects.<br>If the application/vnd.sas.identity.group.summary+json media\
          \ type is specified or no Accept-Item is specified, the groups are returned\
          \ as application/vnd.sas.identity.group.summary objects."
        schema:
          type: string
          enum:
          - application/vnd.sas.identity.group+json
          - application/vnd.sas.identity.group.summary+json
          - application/vnd.sas.identity.basic+json
      - name: start
        in: query
        description: The starting index of the first group in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of groups to return in this page of results. The
          actual number of returned groups may be less if the collection has been
          exhausted. Defaults to 50.
        schema:
          type: integer
      - name: filter
        in: query
        description: Filter criteria for returned groups. Filters are supported on
          the following top level fields for groups (id, name, description, title,
          creationTimeStamp, and modifiedTimeStamp). See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Sort returned groups.  The sort criteria supports the following
          fields in either ascending or descending order (id, name, description, title,
          creationTimeStamp, and modifiedTimeStamp). See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: providerId
        in: query
        description: Retrieve a subset of groups by providerId.  The default is to
          return groups in all providers if the parameter is not specified.
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/groupCollection"
              examples:
                identities:
                  $ref: "#/components/examples/getgroups"
            application/json:
              schema:
                $ref: "#/components/schemas/groupCollection"
              examples:
                identities:
                  $ref: "#/components/examples/getgroups"
        "400":
          description: An Invalid filter or combination of request parameters was
            provided.
    post:
      tags:
      - Groups
      operationId: createGroup
      summary: Create a new group
      description: >
        The id and name of the group must be set by the client within the
        request body. The id must be unique across the entire system and must be
        standard non-control ascii characters. The name does not have to be
        unique. <p> <b>Authorization:</b> The ability to create groups is
        restricted to members of the SAS Administrators and the sasapp groups.
        </p>
      requestBody:
        $ref: "#/components/requestBodies/groupIn"
      responses:
        "201":
          description: New group created
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
          content:
            application/vnd.sas.identity.group:
              schema:
                $ref: "#/components/schemas/group"
              examples:
                identities:
                  $ref: "#/components/examples/postgroups"
            application/json:
              schema:
                $ref: "#/components/schemas/group"
              examples:
                identities:
                  $ref: "#/components/examples/postgroups"
        "400":
          description: Bad Request
        "409":
          description: Conflict - the group could not be created since a group with
            the same id already exists
        "428":
          description: Precondition required
  /groups#withQuery:
    x-sas-internal: true
    post:
      tags:
      - Groups
      x-sas-since: "6"
      operationId: getGroupsWithQuery
      summary: Get groups
      description: >
        Returns a collection of groups as summary objects, full objects, or
        basic identity objects using a filter in the body of the request.  This
        is intended for larger filters that are too long to be used as a query
        parameter. <br><br>Warning: If the filter specified in the request body is  longer
        than 3000 characters, then standard paging and sorting will be disabled.   If
        a StackOverflowError is thrown, then the filter would need to be shortened  or
        the stack memory size for sas-identities (-Xss) may need to be increased.<br><br>
        The media type of the returned collection items is driven by the Accept-Item
        header,  if specified. If an Accept header of application/json is specified,
        it will,  by default, map to application/vnd.sas.identity.group.summary+json.
        <p>  <b>Authorization:</b>Any authenticated user. </p>
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: "The desired group representation.<br>The Accept-Item options\
          \ are:<ul><li>application/vnd.sas.identity.group<li>application/vnd.sas.identity.group.summary<li>application/vnd.sas.identity.basic<li>blank</ul>If\
          \ the application/vnd.sas.identity.basic+json media type is specified, the\
          \ groups are returned as basic identity objects.  In this case, the group\
          \ will only contain basic properties which include: id, name, providerid,\
          \ type, version, and a self link.<br>If the application/vnd.sas.identity.group+json\
          \ media type is specified, the groups are returned as application/vnd.sas.identity.group\
          \ objects.<br>If the application/vnd.sas.identity.group.summary+json media\
          \ type is specified or no Accept-Item is specified, the groups are returned\
          \ as application/vnd.sas.identity.group.summary objects."
        schema:
          type: string
          enum:
          - application/vnd.sas.identity.group+json
          - application/vnd.sas.identity.group.summary+json
          - application/vnd.sas.identity.basic+json
      - name: filter
        in: query
        description: 'Filter criteria for returned groups. Filters are supported on
          the following top level fields for groups (id, name, description, title,
          creationTimeStamp, and modifiedTimeStamp). See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).'
        schema:
          type: string
      - name: start
        in: query
        description: The starting index of the first group in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of groups to return in this page of results. The
          actual number of returned groups may be less if the collection has been
          exhausted. Defaults to 50.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: Sort returned groups.  The sort criteria supports the following
          fields in either ascending or descending order (id, name, description, title,
          creationTimeStamp, and modifiedTimeStamp). See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: providerId
        in: query
        description: Retrieve a subset of groups by providerId.  The default is to
          return groups in all providers if the parameter is not specified.
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        description: Filter criteria for returned groups. Filters are supported on
          the following top level fields for groups (id, name, description, title,
          creationTimeStamp, and modifiedTimeStamp). See [Filtering in REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/groupCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/groupCollection"
        "400":
          description: An Invalid filter or combination of request parameters was
            provided.
  /groups/{groupId}:
    x-sas-internal: true
    get:
      tags:
      - Groups
      operationId: getGroup
      summary: Get group
      description: >
        Returns information about a single group based on its unique id.  <p>
        <b>Authorization:</b> Any authenticated user. </p>
      parameters:
      - name: groupId
        in: path
        description: group id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.identity.group:
              schema:
                $ref: "#/components/schemas/group"
              examples:
                identities:
                  $ref: "#/components/examples/getgroup"
            application/vnd.sas.identity.group.summary:
              schema:
                $ref: "#/components/schemas/group"
              examples:
                identities:
                  $ref: "#/components/examples/getgroup"
            application/vnd.sas.identity.basic:
              schema:
                $ref: "#/components/schemas/group"
              examples:
                identities:
                  $ref: "#/components/examples/getgroup"
            application/json:
              schema:
                $ref: "#/components/schemas/group"
              examples:
                identities:
                  $ref: "#/components/examples/getgroup"
        "404":
          description: Not found - The group could not be found
    head:
      tags:
      - Groups
      operationId: headersForGroup
      summary: Check if group exists
      description: >
        Returns whether or not a group with the specified id exists.  <p>
        <b>Authorization:</b> Any authenticated user. </p>
      parameters:
      - name: groupId
        in: path
        description: group id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK.  Group exists
        "404":
          description: Not found - The group could not be found
    put:
      tags:
      - Groups
      operationId: updateGroup
      summary: Update/Replace an existing group
      description: >
        Updates an existing group. This method performs a full replacement of
        the group resource. Modifications can be made on specific fields but the
        update will overwrite all previously stored data.<br><br>The id field in
        the request body must match the groupId parameter on this request and
        cannot be updated. The id and name of the group are required within the
        request body and the name must be standard ascii alphanumeric
        characters. <p> <b>Authorization:</b> The ability to update groups is
        restricted to members of the SAS Administrators group. </p>
      parameters:
      - name: groupId
        in: path
        description: group id
        required: true
        schema:
          type: string
          format: object-id
      requestBody:
        $ref: "#/components/requestBodies/groupIn"
      responses:
        "200":
          description: Group updated
          content:
            application/vnd.sas.identity.group:
              schema:
                $ref: "#/components/schemas/group"
            application/json:
              schema:
                $ref: "#/components/schemas/group"
        "400":
          description: Bad Request
        "404":
          description: Not found - The group could not be found
        "412":
          description: Precondition failed
        "428":
          description: Precondition required
    delete:
      tags:
      - Groups
      operationId: deleteGroup
      summary: Delete group
      description: >
        Deletes the specified group and permanently removes it from the
        system.  <p> <b>Authorization:</b> The ability to delete groups is
        restricted to members of the SAS Administrators and the sasapp groups.
        </p>
      parameters:
      - name: groupId
        in: path
        description: group id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "204":
          description: Group is deleted
        "404":
          description: Not found - The group could not be found
  /groups/{groupId}/memberCount:
    x-sas-internal: true
    get:
      tags:
      - Groups
      operationId: getMemberCount
      summary: Get member count
      description: >
        Returns the total number of members for the specified group. <p>
        <b>Authorization:</b> The ability to view count information is
        restricted to members of the SAS Administrators group. </p>
      parameters:
      - name: groupId
        in: path
        description: group id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.count:
              schema:
                $ref: "#/components/schemas/count"
            application/json:
              schema:
                $ref: "#/components/schemas/count"
  /groups/{groupId}/members:
    x-sas-internal: true
    get:
      tags:
      - Groups
      operationId: getAllMembers
      summary: Get all members (users and groups) for the specified group
      description: >
        <b>See [`getAllFlatMembers` operation](#op:getAllFlatMembers) if an
        Accept-Item header of
        `application/vnd.sas.identity.group.member.flat+json` is specified.</b>
        Returns a collection of all group members.<br>Standard paging and
        sorting options are available.  The media type of the returned
        collection items will be application/vnd.sas.identity.group.member <p>
        <b>Authorization:</b> Any authenticated user. </p>
      parameters:
      - name: groupId
        in: path
        description: group id
        required: true
        schema:
          type: string
          format: object-id
      - name: start
        in: query
        description: The starting index of the first member in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of members to return in this page of results.
          The actual number of returned members may be less if the collection has
          been exhausted. Defaults to 50.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: >
          Sort returned collection of members.  The sort criteria supports the
          following fields in either ascending or descending order (name,
          type). See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
      - name: filter
        in: query
        description: Filter criteria for returned group members. See [Filtering in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: depth
        in: query
        description: >
          The value used to control how deep to traverse the members tree.<br>
          A value greater than 1 implies a recursive traversal through the
          list of members up to the specified depth. A value of -1 will
          result in all members returned (to a depth of 20). The depth to search for
          value -1 is  customizeable by a property. When depth is not specified the
          default setting  is 1, which implies only direct members of the group will
          be returned.
        schema:
          type: string
      - name: showDuplicates
        in: query
        description: >
          Return members,including any duplicate identities, in the returned
          collection of members.
          <br>This parameter is ignored if specified with a query for flat members.  See
          [`getAllFlatMembers` operation](#op:getAllFlatMembers)
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/memberCollection"
              examples:
                identities:
                  $ref: "#/components/examples/getMembersForAGroup"
            application/json:
              schema:
                $ref: "#/components/schemas/memberCollection"
              examples:
                identities:
                  $ref: "#/components/examples/getMembersForAGroup"
        "400":
          description: Bad Request
        "404":
          description: Not found - the specified group could not be found
  /groups/{groupId}/members#flat:
    x-sas-internal: true
    get:
      tags:
      - Groups
      operationId: getAllFlatMembers
      summary: Get users members and/or groups members for the specified group
      description: >
        <b>This behavior is triggered by specifying an Accept-Item header of
        "application/vnd.sas.identity.group.member.flat+json".</b>

        Returns a collection of all group members.  Optionally, only users or groups
        can be returned.    

        Standard paging and sorting options are available.  The media type of the
        returned collection items will be application/vnd.sas.identity.group.member.flat.

        <b>Authorization:</b> Any authenticated user. </p>
      parameters:
      - name: groupId
        in: path
        description: group id
        required: true
        schema:
          type: string
          format: object-id
      - name: Accept-Item
        in: header
        required: true
        description: Returns flat members.  Without a value of 'application/vnd.sas.identity.group.member.flat+json',
          hierarchical members are returned.
        schema:
          type: string
          enum:
          - application/vnd.sas.identity.group.member.flat+json
      - name: start
        in: query
        description: The starting index of the first member in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of members to return in this page of results.
          The actual number of returned members may be less if the collection has
          been exhausted. Defaults to 50.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: >
          Sort returned collection of members.  The sort criteria supports the
          following fields in either ascending or descending order (name,
          type). See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
      - name: filter
        in: query
        description: Filter criteria for returned group members. See [Filtering in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: depth
        in: query
        description: >
          The value used to control how deep to traverse the members tree.<br>
          A value greater than 1 implies a recursive traversal through the
          list of members up to the specified depth.<br>A value of -1 will
          result in all members returned (to an unlimited depth). If a
          cyclical membership structure is detected when recursive traversal
          for members is specified, the data will return such that an infinite
          loop is prevented.<br>The default setting is 1, which implies only
          direct members of the group will be returned.
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: >
          Returns either only users or only groups based on value
          specified.  Returns all members if not specified. 
        schema:
          type: string
          enum:
          - user
          - group
      - name: showDuplicates
        in: query
        description: >
          This parameter is ignored in a query for flat members. Only valid
          for the [`getAllMembers` operation](#op:getAllMembers)
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/flatMemberCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/flatMemberCollection"
        "400":
          description: Bad Request
        "404":
          description: Not found - the specified group could not be found
  /groups/{groupId}/groupMembers:
    x-sas-internal: true
    get:
      tags:
      - Groups
      operationId: getGroupMembers
      summary: Get group members for the specified group
      description: >
        Returns a collection of group members for the specified group.  User
        members will not be returned.<br>Standard paging and sorting options are
        available.  The media type of the returned collection items will be
        application/vnd.sas.identity.group.member <p> <b>Authorization:</b> Any
        authenticated user. </p>
      parameters:
      - name: groupId
        in: path
        description: group id
        required: true
        schema:
          type: string
          format: object-id
      - name: start
        in: query
        description: The starting index of the first member in a page. Defaults to
          0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of members to return in this page of results.
          The actual number of returned members may be less if the collection has
          been exhausted. Defaults to 50.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: >
          Sort returned collection of members.  The sort criteria supports the
          following fields in either ascending or descending order (name,
          type). See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
      - name: filter
        in: query
        description: Filter criteria for returned group members. See [Filtering in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: depth
        in: query
        description: >
          The value used to control how deep to traverse the members tree.<br>
          A value greater than 1 implies a recursive traversal through the
          list of members up to the specified depth. A value of -1 will
          result in all group members returned (to a depth of 20). The depth to search
          for value -1 is  customizeable by a property. When depth is not specified
          the default setting  is 1, which implies only direct group members of the
          group will be returned.
        schema:
          type: string
      - name: showDuplicates
        in: query
        description: >
          Return group members,including any duplicate groups, in the returned
          collection of members.
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection:
              schema:
                $ref: "#/components/schemas/memberCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/memberCollection"
        "400":
          description: Bad Request
        "404":
          description: Not found - the specified group could not be found
  /groups/{groupId}/groupMembers/{memberId}:
    x-sas-internal: true
    put:
      tags:
