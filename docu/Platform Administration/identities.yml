        more
        user identifier entries (containing the identity type, user id, uid, and gid)
        specified in the request body. It attempts to create and store that uid/gid
        values  in the database for each user entry. The endpoint is used for setting
        multiple  uid/gid values at once when the service is configured in non generation
        mode. If the  service is configured to be in generate mode, then this method
        will return a  MethodNotAllowed exception.  The request is intended to provide
        a way to load many
        uid and gid number values at once for users rather than calling the PUT users
        identifier  endpoint individually for each entry.
        <p>  <b>Authorization:</b> The request can be run by an Administrator.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/bulkloadIdentifier"
