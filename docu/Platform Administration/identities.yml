          description: The bulk loading of user uid/gid values completed normally.
            <br> If there were user uid/gid entry creation errors, then the response
            object will contain a non-empty error object.
          content:
            application/vnd.sas.identity.identifier.loader.response:
              schema:
                $ref: "#/components/schemas/identifierLoaderResponse"
              examples:
                identities:
                  $ref: "#/components/examples/IdentifierLoaderUserResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/identifierLoaderResponse"
              examples:
                identities:
                  $ref: "#/components/examples/IdentifierLoaderUserResponse"
        "400":
          description: Bad Request
        "403":
          description: Forbidden - The user is unauthorized for this request.
        "405":
          description: Method Not Allowed - the request cannot be run based upon service
            configuration options
