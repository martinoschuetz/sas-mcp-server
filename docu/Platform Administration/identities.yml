        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.identity.avatar:
              schema:
                $ref: "#/components/schemas/avatarData"
            application/json:
              schema:
                $ref: "#/components/schemas/avatarData"
        "404":
          description: Not found - the avatar or the user could not be found
        "500":
          description: Resource Exception - the avatar could not be retrieved from
            file service
    head:
      tags:
      - Avatars
      operationId: headersForUserAvatar
      summary: Check if avatar details for the specified user exist
      description: >
        Returns whether or not the user has an avatar. <p> <b>Authorization:</b>
        Any authenticated user. </p>
      parameters:
      - name: userId
        in: path
        description: user Id<br><br>If @currentUser is the userId parameter specified:<br><ul><li>This
          is treated as a "special" resource Id representing the currently authenticated
          user (i.e. logged in).</ul>
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: OK.  Avatar exists
        "404":
          description: Not found - the avatar or the user could not be found
    put:
      tags:
      - Avatars
      operationId: updateUserAvatar
      summary: Create/Update avatar
      description: >
        Create or Update an existing users's avatar. This method will add an
        avatar or replace an existing avatar with the image specified by the
        file parameter for the specified user.  It will create or update the
        avatar details for the user's image. Avatar image files are restricted
        to "image/jpg", "image/jpeg", "image/bmp", "image/gif", and "image/png"
        files.  <p> <b>Authorization:</b> Any authenticated user. </p> <p>
      parameters:
      - name: userId
        in: path
        description: user id
        required: true
        schema:
          type: string
          format: object-id
      requestBody:
        content:
          application/vnd.sas.identity.avatar:
            schema:
              $ref: "#/components/schemas/imagefile"
          image/*:
            schema:
              $ref: "#/components/schemas/imagefile"
          application/json:
            schema:
              $ref: "#/components/schemas/imagefile"
        description: The contents of the image file should be passed in request body
          in raw format.
      responses:
        "200":
          description: Avatar created/updated
          content:
            application/vnd.sas.identity.avatar:
              schema:
                $ref: "#/components/schemas/avatarData"
            application/json:
              schema:
                $ref: "#/components/schemas/avatarData"
        "400":
          description: Bad Request
        "404":
          description: Not found - The user could not be found
        "412":
          description: Precondition failed
        "428":
          description: Precondition required
    delete:
      tags:
      - Avatars
      operationId: deleteUserAvatar
      summary: Delete avatar
      description: >
        Deletes the specified user's avatar.  <p> <b>Authorization:</b> Any
        authenticated user. </p> <p>
      parameters:
      - name: userId
        in: path
        description: user id
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "204":
          description: Avatar is deleted
        "404":
          description: Not found - The user could not be found
  /users/{userId}/avatar/content:
    x-sas-internal: true
    get:
      tags:
      - Avatars
      operationId: getUserAvatarImage
      summary: Get avatar image for the specified user
      description: >
