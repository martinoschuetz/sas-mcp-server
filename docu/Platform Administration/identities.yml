      operationId: updateGroupIdentifier
      summary: Create/Update the gid number for the specified group
      description: >
        Create or Update an existing group's gid number. This method will add a
        gid number or replace the existing gid number with the value specified
        in the request body for the specified group. This endpoint is used for
        setting or updating gid values for non LDAP groups or for LDAP groups
        where the gidNumber attribute does not exist.  If the group exists in
        LDAP and has the gidNumber attribute already defined, then this request
        will return a conflict exception.  The request is intended to provide a
        gidNumber value for those groups that do not have one.
        <p>  <b>Authorization:</b> The request can be run by an Administrator.
      parameters:
      - name: groupId
        in: path
        description: group id
        required: true
        schema:
          type: string
          format: object-id
      requestBody:
        content:
          application/vnd.sas.identity.identifier:
            schema:
              $ref: "#/components/schemas/identifierGroupIn"
          application/json:
            schema:
              $ref: "#/components/schemas/identifierGroupIn"
