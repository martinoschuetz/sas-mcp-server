      - Users
      operationId: getScimUsers
      summary: Get SCIM users
      description: >
        Returns a collection of SCIM users.
      security:
      - scimSecurity: [SASAdministrators, SCIM]
      parameters:
      - name: startIndex
        in: query
        description: The starting index of the first user in a page. Defaults to `1`.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      - name: count
        in: query
        description: The maximum number of users to return in this page of results.
          The actual number of returned users can be less if the collection has been
          exhausted. Defaults to `10`.
        schema:
          type: integer
          format: int32
          minimum: 0
        example: 10
      - name: filter
        in: query
        description: Filter criteria for returned users. See [SCIM Filtering](https://datatracker.ietf.org/doc/html/rfc7644#section-3.4.2.2)
          for syntax details.
        schema:
          type: string
          format: filter-criteria
        example: 'userName eq "john@example.com"'
      - name: attributes
        in: query
        description: A comma-separated list of attribute names to return in the response.
        schema:
          type: string
        example: 'userName,emails,displayName'
      - name: excludedAttributes
        in: query
        description: A comma-separated list of attribute names to exclude from the
          response.
        schema:
          type: string
        example: 'groups'
      responses:
        "200":
          description: The request succeeded.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/scimUserCollection"
              examples:
                identities:
                  $ref: "#/components/examples/getScimUsers"
            application/json:
              schema:
                $ref: "#/components/schemas/scimUserCollection"
              examples:
                identities:
                  $ref: "#/components/examples/getScimUsers"
        "400":
          description: An Invalid filter or combination of request parameters was
            provided.
        "401":
          description: Authentication is required.
        "403":
          description: The authenticated user does not have sufficient privileges.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/scimError"
    post:
      tags:
      - Users
      operationId: createScimUser
      summary: Create a new SCIM user
      description: >
        Creates a new SCIM user. The userName of the SCIM user must be set by the
        client within the request body.
      security:
      - scimSecurity: [SASAdministrators, SCIM]
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/scimUserRequest"
            examples:
              identities:
                $ref: "#/components/examples/postScimUser"
          application/json:
            schema:
              $ref: "#/components/schemas/scimUserRequest"
            examples:
              identities:
                $ref: "#/components/examples/postScimUser"
      responses:
        "201":
          description: A new user was created.
          headers:
            Location:
              description: URL of the created resource.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/scimUser"
              examples:
                identities:
                  $ref: "#/components/examples/postScimUserResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/scimUser"
              examples:
                identities:
                  $ref: "#/components/examples/postScimUserResponse"
        "400":
          description: The request was invalid.
        "401":
          description: Authentication is required.
        "403":
          description: The authenticated user does not have sufficient privileges.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/scimError"
        "409":
          description: Conflict. The user could not be created since a user with the
            same ID already exists
    delete:
      tags:
      - Users
      operationId: deleteAllScimUsers
      summary: Delete all SCIM users or inactive users
      description: >
        Deletes all SCIM users. Optionally, deletes only inactive SCIM users
        and permanently removes them from the system.
      security:
      - scimSecurity: [SASAdministrators, SCIM]
      parameters:
      - name: inActiveOnly
        in: query
        description: >
          Delete only inactive SCIM users for this request.
        required: false
        schema:
          type: boolean
      responses:
        "204":
          description: All SCIM users are deleted.
        "401":
          description: Authentication is required.
        "403":
          description: The authenticated user does not have sufficient privileges.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/scimError"
