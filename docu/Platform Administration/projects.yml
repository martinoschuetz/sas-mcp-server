                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "409":
          description: The request could not be completed. The URI already exists
            as a participant of this project.
          content:
            application/vnd.sas.project.participant+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  "/projects/{projectId}/participants/{participantId}":
    get:
      tags:
      - Participants
      summary: Get project participant
      description: Returns the specified participant.  HEAD is also supported and
        returns status and headers only.
      operationId: getParticipant
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      - name: participantId
        in: path
        description: The identifier of a specific participant.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The project participant was returned.
          headers:
            Last-Modified:
              description: The ISO8601 timestamp representing the last time this participant
                was updated.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.project.participant+json:
              schema:
                $ref: "#/components/schemas/participant"
            application/json:
              schema:
                $ref: "#/components/schemas/participant"
        "404":
          description: The project or participant does not exist.
          content:
            application/vnd.sas.project.participant+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    put:
      tags:
      - Participants
      summary: Update project participant
      description: Replaces an existing project participant.
      operationId: updateParticipant
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      - name: participantId
        in: path
        description: The identifier of a specific participant.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: The ETag that was returned from a GET, POST, or PUT of this object.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.project.participant+json:
            schema:
              $ref: "#/components/schemas/updateParticipant"
          application/json:
            schema:
              $ref: "#/components/schemas/updateParticipant"
        required: true
      responses:
        "200":
          description: The request succeeded. The participant was updated.
          headers:
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this participant.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.project.participant+json:
              schema:
                $ref: "#/components/schemas/participant"
            application/json:
              schema:
                $ref: "#/components/schemas/participant"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.project.participant+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "404":
          description: The project or participant does not exist.
          content:
            application/vnd.sas.project.participant+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "409":
          description: The request could not be completed. The URI already exists
            as a participant of this project.
          content:
            application/vnd.sas.project.participant+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "412":
          description: The ETag provided does not match the current version of the
            object.
          content:
            application/vnd.sas.project.participant+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "428":
          description: The ETag was not provided when updating an existing type.
          content:
            application/vnd.sas.project.participant+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    delete:
      tags:
      - Participants
      summary: Remove participant from project
      description: Removes the specified participant from the project. This does not
        delete the identity from the Identities service. If the corresponding identity
        is deleted from the Identity service, an event is generated and any associated
        participants are deleted. Since a project must have at least one owner, the
        last owner cannot be deleted.  It is possible that the last owner could be
        removed if the corresponding identity is deleted from the Identities service.  The
        project would be visible only to administrators who can delete the project
        or add a new owner.
      operationId: deleteParticipant
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      - name: participantId
        in: path
        description: The identifier of a specific participant.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The participant was removed.
        "400":
          description: The request was invalid. Cannot delete the last owner. A project
            must have at least one owner.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error"
        "404":
          description: The project or participant does not exist.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error"
  "/projects/{projectId}/activities":
    get:
      tags:
      - Activities
      summary: Get project activities
      description: Returns a list of project activities. Standard paging, filtering,
        and options are available. The media type of the returned collection items
        is application/vnd.sas.project.activity. Default sorting for this collection
        is timeStamp:ascending.  HEAD is also supported and returns status and headers
        only.
      operationId: getProjectActivities
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      - name: start
        in: query
        description: The offset of the first activity to return. The default is 0.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Maximum number of activities to return. The default is 20.
        schema:
          type: integer
          format: int64
      - name: filter
        in: query
        description: The criteria for filtering the activities. See [Filtering in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the activities. See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: since
        in: query
        description: To get activities occurred since the timestamp.
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: The request succeeded. The project activities were returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/activityCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/activityCollection"
        "404":
          description: The project does not exist.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /activities:
    get:
      tags:
      - Activities
      summary: Get activities across all projects
      description: Returns a list of activities across all projects. Standard paging,
        filtering, and options are available. The media type of the returned collection
        items is application/vnd.sas.project.activity. Default sorting for this collection
        is timeStamp:ascending. HEAD is also supported and returns status and headers
        only.
      operationId: getAllActivities
      parameters:
      - name: start
        in: query
        description: The offset of the first activity to return. The default is 0.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Maximum number of activities to return. The default is 20.
        schema:
          type: integer
          format: int64
      - name: filter
        in: query
        description: The criteria for filtering the activities. See [Filtering in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the activities. See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: resourceUri
        in: query
        description: Return activities with the specified resourceUri.
        schema:
          type: string
          format: uri
      - name: since
        in: query
        description: To get activities occurred since the timestamp.
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Returned project activities.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/activityCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/activityCollection"
  /roles:
    get:
      tags:
      - Roles
      summary: Get the set of valid roles for a project
      description: Returns the set of valid roles for participants of a project. The
        media type of the returned collection items is application/vnd.sas.project.role.
        Default sorting for this collection is name:ascending.  HEAD is also supported
        and returns status and headers only.
      operationId: getAllRoles
      parameters:
      - name: start
        in: query
        description: The offset of the first role to return. The default is 0.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Maximum number of roles to return. The default is 20.
        schema:
          type: integer
          format: int64
      - name: sortBy
        in: query
        description: The criteria for sorting the activities. See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. The set of valid roles for participants
            of a project was returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/roleCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/roleCollection"
  /projects/@root:
    put:
      tags:
      - FixUp
      summary: Synchronizes a projects database with folders.
      description: This endpoint is used when the "Projects" folder has been deleted
        from the Folder service by an administrator. All of the projects need to be
        restored. Restarting the projects service restores the "Projects" folder,
        but not all the folders that were in it prior to deletion. This end point
        restores these folders.
      operationId: fixUp
      responses:
        "200":
          description: The request succeeded.
        "400":
          description: The request was invalid.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
servers:
- url: http://example.com/projects
  description: This is an example base URL.
components:
  schemas:
    createProject:
      title: Create Project
      description: The representation used to create a new project.
      required:
      - name
      properties:
        name:
          type: string
          description: The identifier of a specific project.
        description:
          type: string
          description: The project's description.
        imageUri:
          type: string
          format: uri
          description: URI to image used as the project avatar.  If a URI is not supplied
            on a POST request, then a default URI is substituted.  Null or blank values
            are allowed on a PUT request.
        properties:
          type: object
          description: Additional properties that could be specified for the project.
          additionalProperties:
            type: string
        version:
          type: integer
          description: The version of the object.
    updateProject:
      title: Update Project
      description: The representation used to update a project.
      required:
      - ID
      allOf:
      - $ref: "#/components/schemas/createProject"
      - type: object
        properties:
          id:
            type: string
            format: object-id
            description: The identifier of a specific project.
    project:
      title: Project
      description: The representation of a project.
      allOf:
      - $ref: "#/components/schemas/updateProject"
      - type: object
        properties:
          folderUri:
            type: string
            format: uri
            description: URI of the project's folder.  This is a read-only property.
          userCount:
            type: integer
            description: The number of participants in the project with type 'user'.  This
              is a read-only property.
          groupCount:
            type: integer
            description: The number of participants in the project with type 'group'.  This
              is a read-only property.
          createdBy:
            type: string
            description: The user who created this project.
          creationTimeStamp:
            type: string
            format: date-time
            description: The timestamp of the project's creation.
          modifiedBy:
            type: string
            description: The user who last modified this project.
          modifiedTimeStamp:
            type: string
            format: date-time
            description: The timestamp of the last project modification.
          links:
            $ref: "#/components/schemas/links"
    createResource:
      title: Create Resource
      description: The representation used to create a new resource.
      required:
      - resourceUri
      properties:
        resourceUri:
          type: string
          format: uri
          description: The URI of the item that the resource represents.
        version:
          type: integer
          description: The version of the object.
        properties:
          type: object
          description: Additional properties that could be specified for the resource.
          additionalProperties:
            type: string
    updateResource:
      title: Update Resource
      description: The representation used to update a resource.
      required:
      - id
      allOf:
      - $ref: "#/components/schemas/createResource"
      - type: object
        properties:
          id:
            type: string
            format: object-id
            description: The identifier of a specific resource.
    resource:
      title: Resource
      description: The representation of a resource.
      allOf:
      - $ref: "#/components/schemas/updateResource"
      - type: object
        properties:
          name:
            type: string
            description: Name of the resource object. This attribute is read-only
              and is obtained from the target object if possible.  This attribute
              cannot be used in a filter query.
          description:
            type: string
            description: Description of the resource object. This attribute is read-only
              and is obtained from the target object if possible.  This attribute
              cannot be used in a filter query.
          contentType:
            type: string
            description: Resource object type. This should match a type from the Types
              service. This attribute is read-only and is obtained from the target
              object if possible.  This attribute cannot be used in a filter query.
          statusCode:
            type: integer
            description: HTTP status code returned by the resourceUri. This is a read-only
              property.
          errorMessage:
            type: string
            description: Error message returned by the resourceUri. This is a read-only
              property.
          createdBy:
            type: string
            description: The user who added the resource.
          creationTimeStamp:
            type: string
            format: date-time
            description: The timestamp of the resource object's creation.
          modifiedBy:
            type: string
            description: The user who last updated the resource.
          modifiedTimeStamp:
            type: string
            format: date-time
            description: The timestamp of the last resource object modification.
          links:
            $ref: "#/components/schemas/links"
    createParticipant:
      title: Create Participant
      description: The representation used to create a new participant.
      required:
      - identityUri
      properties:
        identityUri:
          type: string
          format: uri
          description: The URI of the participant. This must be a valid URI pointing
            to a user or group from the Identities service.
        role:
          type: string
          enum:
          - owner
          - contributor
          default: contributor
          description: The role of the participant in the project.
        version:
          type: integer
          description: The version of the object.
    updateParticipant:
      title: Update Participant
      description: The representation used to update a participant.
      required:
      - ID
      properties:
        id:
          type: string
          format: object-id
          description: The identifier of a specific participant.
        role:
          type: string
          enum:
          - owner
          - contributor
          default: contributor
          description: The role of the participant in the project.
        version:
          type: integer
          description: The version of the object.
    participant:
      title: Participant
      description: The representation of a participant.
      properties:
        id:
          type: string
          format: object-id
          description: The identifier of a specific participant.
        identityUri:
          type: string
          format: uri
          description: The URI of the participant. This must be a valid URI pointing
            to a user or group from the Identities service.
        role:
          type: string
          enum:
          - owner
          - contributor
          default: contributor
          description: The role of the participant in the project.
        version:
          type: integer
          description: The version of the object.
        name:
          type: string
          description: The name of the participant.  This attribute is read-only and
            is obtained from the Identities service.  This attribute cannot be used
            in a filter query.
        type:
          type: string
          enum:
          - user
          - group
          description: The type of participant from the Identities service. This attribute
            is read-only and is obtained from the Identities service.  This attribute
            cannot be used in a filter query.
        avatarUri:
          type: string
          format: uri
          description: The participant avatar URI.  This attribute is read-only and
            is obtained from the Identities service.  This attribute cannot be used
            in a filter query.
        createdBy:
          type: string
          description: The user who added this participant.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp of the participant object's creation.
        modifiedBy:
          type: string
          description: The user who last updated this participant.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp of the last participant object modification.
        links:
          $ref: "#/components/schemas/links"
    activity:
      title: Activity
      description: The representation of a project-related activity. These could be
        created/modified/deleted events for the project itself, a participant or resource,
        or a member of the underlying folder.
      properties:
        resourceUri:
          type: string
          format: uri
          description: The URI of the resource that is the target of this activity.
        resourceName:
          type: string
          description: The name of the resource that is the target of this activity.
        resourceType:
          type: string
          description: The type of the resource that is the target of this activity.
        projectUris:
          type: array
          description: The URIs of the projects containing the resource that is the
            target of this activity.
          items:
            type: string
            format: uri
        action:
          type: string
          description: The action associated with this activity (such as create, update,
            and delete.).
        user:
          type: string
          description: The authenticated user that triggered the activity.
        timeStamp:
          type: string
          format: date-time
          description: The date and time that the activity was triggered.
        properties:
          type: object
          description: Additional properties that could be specified for the activity
            type.
          additionalProperties:
            type: string
        version:
          type: integer
          description: The version of the object.
    role:
      title: Role
      description: The representation of a project role. These specify the level of
        permissions that participants are granted within a project.
      properties:
        id:
          type: string
          description: The identifier of a specific role.
        name:
          type: string
          description: The localized name of the role.
        description:
          type: string
          description: The localized description of the role.
        version:
          type: integer
          description: The version of the object.
    projectCollection:
      title: Project Collection
      description: A collection of project representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: The array of project representations.
            items:
              $ref: "#/components/schemas/project"
    resourceCollection:
      title: Resource Collection
      description: A collection of resource representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: The array of resource representations.
            items:
              $ref: "#/components/schemas/resource"
    participantCollection:
      title: Participant Collection
      description: A collection of participant representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: The array of participant representations.
            items:
              $ref: "#/components/schemas/participant"
    activityCollection:
      title: Activity Collection
      description: A collection of activity representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: The array of activity representations.
            items:
              $ref: "#/components/schemas/activity"
    roleCollection:
      title: Role Collection
      description: A collection of role representations.
      allOf:
      - $ref: "#/components/schemas/baseCollection"
      - type: object
        properties:
          items:
            type: array
            description: The array of role representations.
            items:
              $ref: "#/components/schemas/role"
    baseCollection:
      $ref: "#/components/schemas/baseCollection2"
    links:
      title: Links
      description: Links to related resources and operations.
      type: array
      items:
        $ref: "#/components/schemas/link"
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    error:
      $ref: "#/components/schemas/error2"
    transferObject:
      title: Transfer Object
      x-sas-internal: true
      description: The representation of a transfer object.
      properties:
        id:
          type: string
          format: object-id
          description: The identifier of a specific project.
        version:
          type: integer
          description: This media type's schema version number. This representation
            is version 1.
        summary:
          $ref: "#/components/schemas/resourceSummary"
        content:
          $ref: "#/components/schemas/project"
        fileServiceContent:
          type: string
          description: The projects do not have the file service content.
        connections:
          type: array
          description: A list of associations or references to other external objects
            to be re-created on import. For projects, the references include participants,
            resources, and members of the project's folder.
          items:
            $ref: "#/components/schemas/transferObjectConnector"
        substitutions:
          type: object
          description: Map with keys of parameter and value. Used to replace the value
            of parameter with the value of value
          additionalProperties:
            type: string
        links:
          $ref: "#/components/schemas/links"
    resourceSummary:
      title: Resource Summary
      x-sas-internal: true
      description: The summary of the transfer project.
      properties:
        id:
          type: string
          format: object-id
          description: The identifier of a specific project.
        name:
          type: string
          description: The name of the project.
        description:
          type: string
          description: The description of the project.
        createdBy:
          type: string
          description: The user responsible for creating the project.
        creationTimeStamp:
          type: string
          format: date-time
          description: The timestamp of the project's creation.
        modifiedBy:
          type: string
          description: The user responsible for most recent modification of the project.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The timestamp of the last project modification.
        links:
          $ref: "#/components/schemas/links"
    transferObjectConnector:
      title: Transfer Object Connector
      x-sas-internal: true
      description: A connector between the transfer project and other objects.
      properties:
        id:
          type: string
          format: object-id
          description: The identifier of a specific object.
        name:
          type: string
          description: The name of the related object.
        uri:
          type: string
          description: The URI of the related object.
        contentType:
          type: string
          description: The media type of the related object.
        type:
          type: string
          description: The type of connection. This can be any value the creator wants,
            but should be used to determine what to do to reconstitute the relationship.
        hints:
          type: array
          description: Hints that can be used to help find the object to connect to
            in the target system.
          items:
            type: string
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
