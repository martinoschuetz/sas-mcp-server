---
openapi: 3.0.3
info:
  title: Projects
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: The Projects API provides support for creating projects to group a
    set of objects, referenced resources, and participants (users or groups).
  version: "1"
tags:
- name: Projects
  description: Contains the operations for the Project resource.
- name: Resources
  description: Contains the operations for a Resource.
- name: Participants
  description: Contains the operations for a Participant resource.
- name: Activities
  description: Contains the operations for an Activity resource.
- name: Roles
  description: Contains the operations for a Role resource.
- name: Root
  description: Contains the operation for the root resource.
- name: Transfer
  x-sas-internal: true
  description: Contains the operation for transferring the project resource.
- name: FixUp
  x-sas-internal: true
  description: Fix up project's data.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns a list of links to the top-level collections through the
        API.  HEAD is also supported and returns status and headers only.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
        "404":
          description: The request was invalid. The service is not available.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /projects:
    get:
      tags:
      - Projects
      summary: Get projects
      description: Returns a list of projects. Standard paging, filtering, and sorting
        options are provided. The media type of the returned collection items is either
        application/vnd.sas.project.summary (default), or application/vnd.sas.project
        depending on the Accept-Item header. Default sorting for this collection is
        name:ascending.  HEAD is also supported and returns status and headers only.
      operationId: getProjects
      parameters:
      - name: Accept-Item
        in: header
        required: false
        description: The desired project representation. If no Accept-Item is specified,
          application/vnd.sas.project.summary items are returned.
        schema:
          type: string
          enum:
          - application/vnd.sas.project.summary+json
          - application/vnd.sas.project+json
      - name: start
        in: query
        description: The offset of the first project to return. The default is 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of projects to return. The default is 20.
        schema:
          type: integer
      - name: filter
        in: query
        description: The criteria for filtering the projects. See [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the projects. See [Sorting in REST APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      - name: resourceUri
        in: query
        description: Return projects containing only a resource with the specified
          resourceUri. This should be the URI of the underlying resource object itself
          and not the vnd.sas.project.resource object's URI.
        schema:
          type: string
          format: uri
      - name: identityUri
        in: query
        description: Return projects containing only a participant with the specified
          identityUri. This should be the URI of the actual user or group object from
          the Identities service.
        schema:
          type: string
          format: uri
      responses:
        "200":
          description: The request succeeded. The list of projects was returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/projectCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/projectCollection"
        "400":
          description: The request was invalid. An invalid filter or combination of
            request parameters was provided.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      tags:
      - Projects
      summary: Create a new project
      description: Creates a new empty project. Resources can be added to the project
        using the /projects/{projectId}/resources endpoint. Participants can be added
        to the project using the /projects/{projectId}/participants endpoint. Name
        uniqueness across projects is enforced. Only the name, description, imageUri,
        and properties fields are editable.
      operationId: createProject
      requestBody:
        content:
          application/vnd.sas.project+json:
            schema:
              $ref: "#/components/schemas/createProject"
          application/json:
            schema:
              $ref: "#/components/schemas/createProject"
        required: true
      responses:
        "201":
          description: The project was created.
          headers:
            Location:
              description: The URI of the newly created project.
              schema:
                type: string
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this project.
              schema:
                type: string
            ETag:
              description: A tag that identifies the current revision of the object.
              schema:
                type: string
          content:
            application/vnd.sas.project+json:
              schema:
                $ref: "#/components/schemas/project"
            application/json:
              schema:
                $ref: "#/components/schemas/project"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.project+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "409":
          description: The project name already exists.
          content:
            application/vnd.sas.project+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  "/projects/{projectId}":
    get:
      tags:
      - Projects
      summary: Get project
      description: Returns the specified project.  HEAD is also supported and returns
        status and headers only.
      operationId: getProject
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: The request succeeded.
          headers:
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this project.
              schema:
                type: string
            ETag:
              description: A tag that identifies the current revision of the object.
              schema:
                type: string
          content:
            application/vnd.sas.project+json:
              schema:
                $ref: "#/components/schemas/project"
            application/vnd.sas.project.summary+json:
              schema:
                $ref: "#/components/schemas/project"
            application/json:
              schema:
                $ref: "#/components/schemas/project"
        "404":
          description: The project does not exist.
          content:
            application/vnd.sas.project+json:
              schema:
                $ref: "#/components/schemas/error"
            application/vnd.sas.project.summary+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    put:
      tags:
      - Projects
      summary: Update project
      description: Replaces an existing project. Only the name, description, imageUri,
        and properties fields are editable.
      operationId: updateProject
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project and MUST exactly match project.id
          sent in the body of the request.
        required: true
        schema:
          type: string
          format: object-id
      - name: If-Match
        in: header
        required: true
        description: The ETag that was returned from a GET, POST, or PUT request of
          this project.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.project+json:
            schema:
              $ref: "#/components/schemas/updateProject"
          application/json:
            schema:
              $ref: "#/components/schemas/updateProject"
        required: true
      responses:
        "200":
          description: The request succeeded. The project was updated.
          headers:
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this project.
              schema:
                type: string
            ETag:
              description: A tag that identifies the current revision of the object.
              schema:
                type: string
          content:
            application/vnd.sas.project+json:
              schema:
                $ref: "#/components/schemas/project"
            application/json:
              schema:
                $ref: "#/components/schemas/project"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.project+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "404":
          description: The project does not exist.
          content:
            application/vnd.sas.project+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "409":
          description: The request could not be completed. The project name already
            exists.
          content:
            application/vnd.sas.project+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "412":
          description: The ETag provided does not match the current version of the
            object.
          content:
            application/vnd.sas.project+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "428":
          description: The ETag was not provided when updating an existing type.
          content:
            application/vnd.sas.project+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    delete:
      tags:
      - Projects
      summary: Delete project
      description: The specified project is deleted along with all participants and
        resources. If keepFolder=true is not specified, the underlying folder and
        all its content are deleted also.
      operationId: deleteProject
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      - name: keepFolder
        in: query
        description: If true, the underlying folder and all its content is not deleted.
          The default is false.
        schema:
          type: boolean
      responses:
        "204":
          description: The project was deleted.
        "404":
          description: The project does not exist.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error"
  "/projects/{projectId}#transfer":
    get:
      tags:
      - Projects
      - Transfer
      summary: Get transfer project
      description: Get the requested project in a transfer object.
      operationId: getTransferProject
      x-sas-internal: true
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      responses:
        "200":
          description: The request succeeded. The project transfer object was returned.
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/transferObject"
        "404":
          description: The project does not exist.
          content:
            application/vnd.sas.transfer.object+json:
              schema:
                $ref: "#/components/schemas/error"
    put:
      tags:
      - Projects
      - Transfer
      summary: Transfer project
      description: Updates the specified project using the project transfer object.
        If the project does not exist, a new project with the specified ID is created.
        Since the PUT request is part of a transfer operation, the operation is an
        overwrite of any changes. No ETags are checked before updating the project.
      operationId: updateTransferProject
      x-sas-internal: true
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project and MUST exactly match transfer.id
          and transfer.content.id sent in the body of the request.
        required: true
        schema:
          type: string
          format: object-id
      requestBody:
        content:
          application/vnd.sas.transfer.object+json:
            schema:
              $ref: "#/components/schemas/transferObject"
        required: true
      responses:
        "200":
          description: Project was updated.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/transferObject"
            application/json:
              schema:
                $ref: "#/components/schemas/transferObject"
        "400":
          description: The request succeeded. The project was updated.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "409":
          description: The request could not be completed. A project with the same
            name already exists.
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  "/projects/{projectId}/resources":
    get:
      tags:
      - Resources
      summary: Get project resources
      description: Returns a list of project resources. Standard paging, filtering,
        and sorting options are available. The media type of the returned collection
        items is application/vnd.sas.project.resource. Default sorting for this collection
        is name:ascending.  HEAD is also supported and returns status and headers
        only.
      operationId: getResources
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      - name: start
        in: query
        description: The offset of the first resource to return. The default is 0.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Maximum number of resources to return. The default is 20.
        schema:
          type: integer
          format: int64
      - name: filter
        in: query
        description: The criteria for filtering the resources. See [Filtering in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the resources. See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. The project resources were returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/resourceCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/resourceCollection"
        "404":
          description: The project does not exist.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      tags:
      - Resources
      summary: Add resource to project
      description: Adds a new resource reference to the project. If the resource object
        referenced is already a member of this project, this operation fails with
        a 409 status (conflict).
      operationId: createResource
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      requestBody:
        content:
          application/vnd.sas.project.resource+json:
            schema:
              $ref: "#/components/schemas/createResource"
          application/json:
            schema:
              $ref: "#/components/schemas/createResource"
        required: true
      responses:
        "201":
          description: A new resource was created.
          headers:
            Location:
              description: The URI of the newly created resource.
              schema:
                type: string
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this project.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/resource"
            application/json:
              schema:
                $ref: "#/components/schemas/resource"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "404":
          description: The project does not exist.
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "409":
          description: The request could not be completed. The URI already exists
            as a resource of this project.
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  "/projects/{projectId}/resources/{resourceId}":
    get:
      tags:
      - Resources
      summary: Get project resource
      description: Returns the specified resource.  HEAD is also supported and returns
        status and headers only.
      operationId: getResource
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      - name: resourceId
        in: path
        description: Unique identifier of the resource.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The request succeeded. The project's resource was returned.
          headers:
            Last-Modified:
              description: The ISO8601 timestamp representing the last time this member
                was updated.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/resource"
            application/json:
              schema:
                $ref: "#/components/schemas/resource"
        "404":
          description: The project or resource does not exist.
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    put:
      tags:
      - Resources
      summary: Update project resource
      description: Replaces an existing project resource.
      operationId: updateResource
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      - name: resourceId
        in: path
        description: The identifier of a specific resource.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: The ETag that was returned from a GET, POST, or PUT of this object.
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.project.resource+json:
            schema:
              $ref: "#/components/schemas/updateResource"
          application/json:
            schema:
              $ref: "#/components/schemas/updateResource"
        required: true
      responses:
        "200":
          description: The request succeeded. The project resource was updated.
          headers:
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this member.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/resource"
            application/json:
              schema:
                $ref: "#/components/schemas/resource"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "404":
          description: The project or resource does not exist.
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "409":
          description: The request could not be completed. The URI already exists
            as a resource of this project.
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "412":
          description: The ETag provided does not match the current version of the
            object.
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "428":
          description: The ETag was not provided when updating an existing type.
          content:
            application/vnd.sas.project.resource+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    delete:
      tags:
      - Resources
      summary: Remove resource from project
      description: Removes the specified resource from the project. <b>This does not
        delete the target resource.</b> The proper way to delete a resource is to
        use the resource's persistence service to delete it. That should generate
        an event that causes the projects service to clean up any members that have
        that target resource's URI.
      operationId: deleteResource
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      - name: resourceId
        in: path
        description: The identifier of a specific resource.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The resource was deleted.
        "404":
          description: The project or resource does not exist.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/error"
  "/projects/{projectId}/participants":
    get:
      tags:
      - Participants
      summary: Get project participants
      description: Returns a list of project participants. Standard paging, filtering,
        and options are available. The media type of the returned collection items
        is application/vnd.sas.project.participant. Default sorting for this collection
        is name:ascending.  HEAD is also supported and returns status and headers
        only.
      operationId: getParticipants
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      - name: start
        in: query
        description: The offset of the first participant to return. The default is
          0.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Maximum number of participants to return. The default is 20.
        schema:
          type: integer
          format: int64
      - name: filter
        in: query
        description: The criteria for filtering the participants. See [Filtering in
          REST APIs](https://developer.sas.com/apis/rest/Topics/#filters).
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: The criteria for sorting the participants. See [Sorting in REST
          APIs](https://developer.sas.com/apis/rest/Topics/#sorting).
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/participantCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/participantCollection"
        "404":
          description: The project does not exist.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      tags:
      - Participants
      summary: Add participant to project
      description: Adds a new participant to the project. If the participant referenced
        is already a participant of this project, this operation fails with a 409
        status (conflict).
      operationId: createParticipant
      parameters:
      - name: projectId
        in: path
        description: The identifier of a specific project.
        required: true
        schema:
          type: string
          format: object-id
      requestBody:
        content:
          application/vnd.sas.project.participant+json:
            schema:
              $ref: "#/components/schemas/createParticipant"
          application/json:
            schema:
              $ref: "#/components/schemas/createParticipant"
        required: true
      responses:
        "201":
          description: A participant was created.
          headers:
            Location:
              description: The URI of the newly created participant
              schema:
                type: string
            Last-Modified:
              description: The ISO8601 date string representing the timestamp of the
                last update to this project.
              schema:
                type: string
            ETag:
              description: A tag that identifies this revision of this object.
              schema:
                type: string
          content:
            application/vnd.sas.project.participant+json:
              schema:
                $ref: "#/components/schemas/participant"
            application/json:
              schema:
                $ref: "#/components/schemas/participant"
        "400":
          description: The request was invalid.
          content:
            application/vnd.sas.project.participant+json:
              schema:
                $ref: "#/components/schemas/error"
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "404":
          description: The project does not exist.
          content:
            application/vnd.sas.project.participant+json:
