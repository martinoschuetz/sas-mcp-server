---
components:
  schemas:
    agentAgentQueryRequest:
      additionalProperties: false
      description: "A query from an orchestrator agent against a sub-agent via A2A.\n\
        Distinguished from userAgentQueryRequest by the required parentQueryId field."
      properties:
        agentId:
          title: Agentid
          type: string
        content:
          title: Content
          type: string
        parentQueryId:
          title: Parentqueryid
          type: string
        querySessionId:
          nullable: true
          title: Querysessionid
          type: string
      required:
      - content
      - agentId
      - parentQueryId
      title: agentAgentQueryRequest
      type: object
    agentCollectionResponse:
      description: A list of agent resources.
      properties:
        count:
          description: The number of results returned in the collection.
          nullable: true
          title: Count
          type: integer
        items:
          description: The representation of agent resources.
          items:
            $ref: "#/components/schemas/minimizedAgent"
          nullable: true
          title: Items
          type: array
        limit:
          description: The maximum number of results requested.
          nullable: true
          title: Limit
          type: integer
        name:
          description: The name of the collection requested.
          nullable: true
          title: Name
          type: string
        start:
          description: The starting index of the collection.
          nullable: true
          title: Start
          type: integer
      title: agentCollectionResponse
      type: object
    asyncQueryResponse:
