---
openapi: 3.0.3
info:
  version: "1"
  title: IoT Analysis Models
  description: >
    The IoT Analysis Models API's provides a registry for information about analysis
    models
    <br><br> Features of this API include: <ul> <li>Read operations on analysis model
    objects.</li> <li> Create, Update and Delete functions for use by applications.</li>
    </ul> <br>
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: http://example.com/iotAnalysisModels
  description: This is an example base URL.
tags:
- name: Root
  description: Contains the root of the Anlaysis API.
- name: Model
  description: Contains the operations for the Model resource.
- name: ModelStep
  description: Contains the operations for the ModelStep resource.
- name: Template
  description: Contains the operations for the Template resource.
- name: Lookup
  description: Contains the operations for the Lookup resource.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of links to the top-level collections surfaced through
        this API.
      responses:
        "200":
          description: OK
          content:
            "application/vnd.sas.api+json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                sample:
                  value: {"links": [{"method": "GET", "rel": "getAnalysisModels",
                        "href": "/iotAnalysisModels/models", "uri": "/iotAnalysisModels/models",
                        "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.iot.analysis.model"},
                      {"method": "POST", "rel": "createAnalysisModel", "href": "/iotAnalysisModels/models",
                        "uri": "/iotAnalysisModels/models", "type": "application/vnd.sas.iot.analysis.model"}],
                    "version": 1}
            "application/json":
              schema:
                $ref: "#/components/schemas/api"
              examples:
                sample:
                  value: {"links": [{"method": "GET", "rel": "getAnalysisModels",
                        "href": "/iotAnalysisModels/models", "uri": "/iotAnalysisModels/models",
                        "type": "application/vnd.sas.collection", "itemType": "application/vnd.sas.iot.analysis.model"},
                      {"method": "POST", "rel": "createAnalysisModel", "href": "/iotAnalysisModels/models",
                        "uri": "/iotAnalysisModels/models", "type": "application/vnd.sas.iot.analysis.model"}],
                    "version": 1}
          headers:
            Content-Type:
              required: true
              description: the content type
              schema:
                type: string
            Last-Modified:
              required: true
              description: The last modified date and time of the api.
              schema:
                type: string
        "404":
          description: Requested path does not exist.
          content:
            "application/vnd.sas.error+json":
              schema:
                $ref: "#/components/schemas/errorResponse"
              examples:
                sample:
                  value: {"version": 2, "httpStatusCode": 404, "message": 'There is
                      no handler defined for the path "/iotAnalysisModels/m".', "details": [
                      "path: /iotAnalysisModels/m", "correlator: c92c1a0f-96da-40c4-af1a-c885e44c5377"]}
            "application/json":
              schema:
