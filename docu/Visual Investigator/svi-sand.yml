          type: array
          items:
            $ref: '#/components/schemas/link'
    analyzerCollection:
      description: A collection of supported analyzers.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.sand.analyzer+json` representations.
            type: array
            items:
              $ref: '#/components/schemas/analyzer'
    api:
      description: The list of links to top-level resources and operations available
