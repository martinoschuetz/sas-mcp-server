      type: object
      properties:
        links:
          description: The API's top-level links.
          items:
            $ref: '#/components/schemas/link'
          type: array
        version:
          description: The version number of the API representation. This is version
            1.
          minimum: 1
          type: integer
    assistedSearchRequest:
      description: 'The request to /assistedSearches when generating a search request
