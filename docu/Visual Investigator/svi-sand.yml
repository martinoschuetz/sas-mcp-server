        description: The index of the first edge to include in the current page.
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        description: The maximum number of edges to include in each page.
        in: query
        required: false
        schema:
          type: integer
          default: 100
      requestBody:
