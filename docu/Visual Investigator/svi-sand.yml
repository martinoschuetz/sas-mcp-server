  /admin/indices:
    post:
      tags:
      - Index
      summary: Create indices for all types
      description: 'Ensures that an index exists for each configured type when the
        searchable query parameter is set to true, otherwise creates new unsearchable
        indices for each configured type. This is especially required when re-indexing
        data from a source database (see example [Use Case Five](#Use-Case-Five)).
        No errors are reported if the indices already exist. Returns the name of the
        newest index for each type.'
      operationId: createIndices
      parameters:
      - name: start
        description: The index of the first index name to include in the current page.
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        description: The maximum number of index names to include in each page.
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: searchable
        description: Whether to create searchable as opposed to unsearchable indices.
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: '#/components/schemas/indexCollection'
              example:
                $ref: '#/components/examples/indexCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/indexCollection'
              example:
                $ref: '#/components/examples/indexCollection'
    delete:
      tags:
      - Index
      summary: Delete the indices for all types
      description: 'Deletes the indexes (and therefore indexed data) for all of the
        configured types. This operation cannot be undone without first making a backup
        of the indexed data directly from the underlying search engine. No errors
        are reported when indexes have already been deleted. If the intention is to
        reload the data after deleting all the indexes, one will need to make a POST
        request to /admin/indices to create empty indexes for all of the configured
        types prior to reloading the data.'
      operationId: deleteIndices
      parameters:
      - name: preserveNewestIndexName
        description: 'Whether to preserve and reuse the name of the newest index for
          each type when creating the next searchable index. Creating new unsearchable
          indexes, or deleting indexes without this option, causes the new indexes
          to have new unique names. Preserving the newest index name is useful when
          maintaining a read-only standby deployment for Disaster Avoidance as it
          allows the data to be re-indexed without changing the index name. For example,
          this is beneficial when applying a breaking configuration change from the
          active deployment.'
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '204':
          description: The request succeeded.
  '/admin/indices/{type}':
    get:
      tags:
      - Index
      summary: Get the index name for a single type
      description: Returns the name of the index for the specified type. SAND is responsible
        for managing the underlying indexes but to index large amounts of data, it
        might be appropriate for other services to send the data straight to the underlying
        search engine. This resource provides access to the index name for such a
        case.
      operationId: getIndexName
      parameters:
      - name: type
        description: The name of the type.
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.sand.index+json:
              schema:
                $ref: '#/components/schemas/index'
              examples:
                index:
                  $ref: '#/components/examples/index'
            application/json:
              schema:
                $ref: '#/components/schemas/index'
              examples:
                index:
                  $ref: '#/components/examples/index'
        '404':
          description: The type does not exist or it is not configured to be indexed
