  /graphs:
    post:
      tags:
      - Network
      summary: Generate a network
      description: Provides access to the Network visualization. Returns a graph showing
        the objects that matched the search request as vertices and the relationships
        between them as edges.
      operationId: graphSearch
      parameters:
      - name: calculateMetrics
        description: 'Whether to calculate the degree and adjacent counts for all
          the vertices. As this calculation is expensive, it can take some time particularly
          for highly connected vertices. Skipping the calculation is recommended when
          the counts are not needed or when generating the counts leads to a poor
          user experience.'
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: expansionLimit
        description: 'The maximum number of adjacent vertices per vertex in the graph.
          If a value greater than zero is specified and any vertices exceed the limit,
          then those vertices are excluded from the edge search and the metrics calculation.'
        in: query
        required: false
        schema:
          type: integer
          default: 2000
      - name: metricsLimit
        description: 'The maximum number of new vertices to be found by the search
          when calculating the metrics. If the specified limit is greater than zero
          and the search discovers more new vertices than allowed, the search is cancelled
          and a message is returned. '
        in: query
        required: false
        schema:
          type: integer
          default: 5000
      - name: metricsAggregationLimit
        description: 'The aggregation used to exclude highly connected vertices from
          the metrics calculation is skipped when the number of leaf vertices exceeds
          this limit. The default value of -1 means the aggregation always runs; a
          value of 0 means the aggregation never runs.'
        in: query
        required: false
        schema:
          type: integer
          default: -1
      requestBody:
        content:
          application/vnd.sas.sand.graph.request+json:
            schema:
              $ref: '#/components/schemas/graphRequest'
            examples:
              graphRequest:
                $ref: '#/components/examples/graphRequest'
              queryTypeAnd:
                $ref: '#/components/examples/queryTypeAnd'
              queryTypeCompound:
                $ref: '#/components/examples/queryTypeCompound'
              queryTypeObject:
                $ref: '#/components/examples/queryTypeObject'
              queryTypeOr:
                $ref: '#/components/examples/queryTypeOr'
              queryTypeText:
                $ref: '#/components/examples/queryTypeText'
              filterTypeAnd:
                $ref: '#/components/examples/filterTypeAnd'
              filterTypeBox:
                $ref: '#/components/examples/filterTypeBox'
              filterTypeDateRange:
                $ref: '#/components/examples/filterTypeDateRange'
              filterTypeNot:
                $ref: '#/components/examples/filterTypeNot'
              filterTypeOr:
                $ref: '#/components/examples/filterTypeOr'
              filterTypePolygon:
                $ref: '#/components/examples/filterTypePolygon'
              filterTypeQuery:
                $ref: '#/components/examples/filterTypeQuery'
              filterTypeRadius:
                $ref: '#/components/examples/filterTypeRadius'
              filterTypeRange:
                $ref: '#/components/examples/filterTypeRange'
              filterTypeShape:
                $ref: '#/components/examples/filterTypeShape'
              filterTypeShapePreconfigured:
                $ref: '#/components/examples/filterTypeShapePreconfigured'
              filterTypeTerms:
                $ref: '#/components/examples/filterTypeTerms'
              filterTypeType:
                $ref: '#/components/examples/filterTypeType'
              selection:
                $ref: '#/components/examples/selection'
          application/json:
            schema:
              $ref: '#/components/schemas/graphRequest'
            examples:
              graphRequest:
                $ref: '#/components/examples/graphRequest'
              queryTypeAnd:
                $ref: '#/components/examples/queryTypeAnd'
              queryTypeCompound:
                $ref: '#/components/examples/queryTypeCompound'
              queryTypeObject:
                $ref: '#/components/examples/queryTypeObject'
              queryTypeOr:
                $ref: '#/components/examples/queryTypeOr'
              queryTypeText:
                $ref: '#/components/examples/queryTypeText'
              filterTypeAnd:
                $ref: '#/components/examples/filterTypeAnd'
              filterTypeBox:
                $ref: '#/components/examples/filterTypeBox'
              filterTypeDateRange:
                $ref: '#/components/examples/filterTypeDateRange'
              filterTypeNot:
