servers:
- url: 'https://example.com/svi-sand'
  description: An example URL including the base path for this API.
components:
  schemas:
    analyticsCategories:
      description: 'The response from /analytics/{jobId}/categories containing the
        categories of text analytics results that are available at a given exploration
        level.'
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        identifier:
          description: The identifier for the analytics job from the request.
          type: string
        level:
          $ref: '#/components/schemas/analyticsExplorationLevel'
        categories:
          description: The categories of results that are available at this exploration
            level.
          type: array
          items:
            type: string
            enum:
            - unigram
            - bigram
            - trigram
            - person
            - organization
            - location
            - significantTerm
            - topic
        fromAndTo:
          description: Whether `from` and `to` values were extracted from the objects
            at this exploration level.
          type: boolean
        errors:
          description: Any errors relating to the text analytics job.
          type: array
          items:
            $ref: '#/components/schemas/error2'
        links:
          description: Zero or more links to related resources or operations. See
            the link relations table for a description of the link types.
          type: array
          items:
            $ref: '#/components/schemas/link'
    analyticsExcludesMap:
      description: 'The optional list of terms, phrases, topics, and entities to exclude
        from the analytics results keyed by category.'
      type: object
      properties:
        unigram:
          description: The list of terms to exclude.
          type: array
          items:
            type: string
        bigram:
          description: The list of bigram phrases to exclude.
          type: array
          items:
            type: string
        trigram:
          description: The list of trigram phrases to exclude.
          type: array
          items:
            type: string
        person:
          description: The list of person entities to exclude.
          type: array
          items:
            type: string
        organization:
          description: The list of organization entities to exclude.
          type: array
          items:
            type: string
        location:
          description: The list of location entities to exclude.
          type: array
          items:
            type: string
        significantTerm:
          description: The list of significant terms to exclude.
          type: array
          items:
            type: string
        topic:
          description: The list of topics to exclude.
          type: array
          items:
            type: string
    analyticsExplorationLevel:
      description: The exploration level within the text analytics results.
      type: object
      properties:
        category:
          description: The selected category of analytics result. This member is mandatory
            when a value is provided for phrase.
          type: string
          enum:
          - unigram
          - bigram
          - trigram
          - person
          - organization
          - location
          - significantTerm
          - topic
        phrase:
          description: 'The selected term, phrase, topic, or entity. This member is
            mandatory when a value is provided for nextLevel.'
          type: string
        nextLevel:
          $ref: '#/components/schemas/analyticsExplorationLevel'
    analyticsExplore:
      description: 'The request to /analytics/{jobId}/results and /analytics/{jobId}/categories
        to retrieve the text analytics results and categories of result, respectively
        at a given exploration level.'
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        level:
          $ref: '#/components/schemas/analyticsExplorationLevel'
    analyticsIdentities:
      description: 'The response from /analytics/{jobId}/identities containing the
        identities for the person, organization, and location entities that were resolved
        by the text analytics job.'
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        identifier:
          description: The identifier for the analytics job from the request.
          type: string
        identities:
          $ref: '#/components/schemas/analyticsIdentitiesMap'
        errors:
          description: Any errors relating to the text analytics job.
          type: array
          items:
            $ref: '#/components/schemas/error2'
        links:
          description: Zero or more links to related resources or operations. See
            the link relations table for a description of the link types.
          type: array
          items:
            $ref: '#/components/schemas/link'
    analyticsIdentitiesMap:
      description: 'The identities keyed by category (person, organization, or location).
        Resolved entity results matching any of the aliases are grouped under the
        respective identity name.'
      type: object
      properties:
        person:
          description: The resolved person entities.
          type: array
          items:
            $ref: '#/components/schemas/analyticsIdentity'
        organization:
          description: The resolved organization entities.
          type: array
          items:
            $ref: '#/components/schemas/analyticsIdentity'
        location:
          description: The resolved location entities.
          type: array
          items:
            $ref: '#/components/schemas/analyticsIdentity'
    analyticsIdentity:
      description: 'The identity for a person, organization, or location entity that
        was resolved by the text analytics job.'
      type: object
      properties:
        name:
          description: The identity name.
          type: string
        frequencyCount:
          description: The total number of occurrences of this identity.
          type: integer
        aliases:
          description: The aliases for this identity.
          type: array
          items:
            $ref: '#/components/schemas/analyticsIdentityAlias'
    analyticsIdentityAlias:
      description: 'An alias for a person, organization, or location entity that was
        resolved by the text analytics job.'
      type: object
      properties:
        name:
          description: The alias name.
          type: string
        frequencyCount:
          description: The total number of occurrences of this alias.
          type: integer
    analyticsJob:
      description: 'The response from /analytics and /analytics/{jobId} containing
        the identifier, state, and parameters of a scheduled text analytics job. The
        job analyses unstructured text in the matching search results to extract significant
        terms, phrases, and topics as well as resolve named person, organization and
        location entities.'
      type: object
      properties:
        version:
          description: The representation version (3).
          type: integer
        identifier:
          description: The identifier for the analytics job.
          type: string
        state:
          description: The current state of the job.
          type: string
          enum:
          - pending
          - running
          - completed
          - completedWithErrors
          - cancelled
          - failed
        types:
          description: The list of type names from the request.
          type: array
          items:
            type: string
        query:
          $ref: '#/components/schemas/query'
        categories:
          description: The optional list of result categories from the request.
          type: array
          items:
            type: string
            enum:
            - unigram
            - bigram
            - trigram
            - person
            - organization
            - location
            - significantTerm
            - topic
        fields:
          description: The optional list of fields from the request.
          type: array
          items:
            type: string
        fromField:
          description: The optional `from` field from the request.
          type: string
        toFields:
          description: The optional `to` fields from the request.
          type: array
          items:
            type: string
        excludes:
          $ref: '#/components/schemas/analyticsExcludesMap'
        identities:
          $ref: '#/components/schemas/analyticsIdentitiesMap'
        maxResultsPerCategory:
          description: The maximum number of results to generate per category from
            the request.
          type: integer
        locale:
          description: The locale of the data as a BCP-47 language tag from the request.
          type: string
        errors:
          description: Any errors relating to the text analytics job.
          type: array
          items:
            $ref: '#/components/schemas/error2'
        links:
          description: Zero or more links to related resources or operations. See
            the link relations table for a description of the link types.
          type: array
          items:
            $ref: '#/components/schemas/link'
    analyticsLocale:
      description: A locale that is supported for text analytics. It is returned in
        a collection from /analytics/locales.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        name:
          description: The ISO language name.
          type: string
        nativeName:
          description: The native language name (for display purposes).
          type: string
        tag:
          description: The BCP-47 language tag.
          type: string
    analyticsLocaleCollection:
      description: A collection of analytics locale representations.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.sand.analytics.locale+json`
              representations.
            type: array
            items:
              $ref: '#/components/schemas/analyticsLocale'
    analyticsRequest:
      description: 'The request to /analytics to initiate a new text analytics job.
        The job analyses unstructured text in the matching search results to extract
        significant terms, phrases, and topics as well as resolve named person, organization,
        and location entities.'
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        types:
          description: 'The optional list of type names for the object types to search.
            If missing, all types are searched.'
          type: array
          items:
            type: string
        query:
          $ref: '#/components/schemas/query'
        categories:
          description: The optional list of categories specifying which types of analytics
            results to generate.
          type: array
          items:
            type: string
            enum:
            - unigram
            - bigram
            - trigram
            - person
            - organization
            - location
            - significantTerm
            - topic
        fields:
          description: The optional list of fields whose values are combined to generate
            the corpus. Using this parameter overrides the administrator defined fields
            specified in the object type.
          type: array
          items:
            type: string
        fromField:
          description: The optional field whose values are used when generating the
            Sankey diagram. Using this parameter overrides the administrator defined
            `from` field specified in the object type.
          type: string
        toFields:
          description: The optional fields whose values are used when generating the
            Sankey diagram. Using this parameter overrides the administrator defined
            `to` fields specified in the object type.
          type: array
          items:
            type: string
        excludes:
          $ref: '#/components/schemas/analyticsExcludesMap'
        identities:
          $ref: '#/components/schemas/analyticsIdentitiesMap'
        maxResultsPerCategory:
          description: The maximum number of results to generate per category. Accepts
            values in the range 10 to 1000. The default value is 100.
          type: integer
        locale:
          description: The locale of the data as a BCP-47 language tag.
          type: string
    analyticsResults:
      description: 'The response from /analytics/{jobId}/results containing the text
        analytics results that are available at a given exploration level'
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        identifier:
          description: The identifier for the analytics job from the request.
          type: string
        level:
          $ref: '#/components/schemas/analyticsExplorationLevel'
        results:
          description: The results at this exploration level.
          type: array
          items:
            $ref: '#/components/schemas/analyticsResult'
        links:
          description: Zero or more links to related resources or operations. See
            the link relations table for a description of the link types.
          type: array
          items:
            $ref: '#/components/schemas/link'
    analyticsResult:
      description: A single text analytics result.
      type: object
      properties:
        phrase:
          description: 'The resultant term, phrase, topic, or entity name.'
          type: string
        frequencyCount:
          description: The number of times this phrase appears in the Corpus.
          type: integer
        weight:
          description: The average statistical weighting if the phrase is a significant
            term or topic.
          type: number
        objectIds:
          description: The list of identifiers for the objects that contain the phrase.
            These can be used in a request to /searches to retrieve the objects.
          type: array
          items:
            $ref: '#/components/schemas/objectIdentifier'
        aliases:
          description: 'Any known aliases if the phrase is an entity name. Each alias
            object has phrase, frequencyCount, and objectIds members as described
            above.'
          type: array
          items:
            $ref: '#/components/schemas/analyticsResult'
    analyticsSankeyDiagram:
      description: 'The response from /analytics/{jobId}/sankeyDiagrams containing
        a Sankey diagram generated from the text analytics results at the specified
        exploration level.'
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        identifier:
          description: The identifier for the analytics job from the request.
          type: string
        level:
          $ref: '#/components/schemas/analyticsExplorationLevel'
        fromCategory:
          description: The `from` results category from the request.
          type: string
          enum:
          - unigram
          - bigram
          - trigram
          - person
          - organization
          - location
          - significantTerm
          - topic
        toCategory:
          description: The `to` results category from the request.
          type: string
          enum:
          - unigram
          - bigram
          - trigram
          - person
          - organization
          - location
          - significantTerm
          - topic
        fromAndTo:
          description: Whether the diagram is based on the values extracted from the
            `from` and `to` fields instead of using the `from` and `to` categories
            specified above.
          type: boolean
        maxLinks:
          description: The maximum number of links from the request.
          type: integer
        sankeyNodes:
          description: The collection of Sankey nodes.
          type: array
          items:
            $ref: '#/components/schemas/analyticsSankeyNode'
        sankeyLinks:
          description: The collection of Sankey links.
          type: array
          items:
            $ref: '#/components/schemas/analyticsSankeyLink'
        links:
          description: Zero or more links to related resources or operations. See
            the link relations table for a description of the link types.
          type: array
          items:
            $ref: '#/components/schemas/link'
    analyticsSankeyDiagramRequest:
      description: 'The request to /analytics/{jobId}/sankeyDiagrams to generate a
        Sankey diagram from the text analytics results at the specified exploration
        level.'
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        level:
          $ref: '#/components/schemas/analyticsExplorationLevel'
        fromCategory:
          description: The category of results to use for the `from` nodes.
          type: string
          enum:
          - unigram
          - bigram
          - trigram
          - person
          - organization
          - location
          - significantTerm
          - topic
        toCategory:
          description: The category of results to use for the `to` nodes.
          type: string
          enum:
          - unigram
          - bigram
          - trigram
          - person
          - organization
          - location
          - significantTerm
          - topic
        fromAndTo:
          description: Whether to base the diagram on the values extracted from the
            `from` and `to` fields instead of using the `from` and `to` categories
            specified above.
          type: boolean
        maxLinks:
          description: The maximum number of links to return. Accepts values in the
            range 1 to 100. The default value is 20.
          type: integer
    analyticsSankeyLink:
      description: A link in a Sankey diagram.
      type: object
      properties:
        fromNode:
          description: The unique identifier of the `from` node.
          type: integer
        toNode:
          description: The unique identifier of the `to` node.
          type: integer
        frequencyCount:
          description: The number of times the `from` and `to` values or phrases appear
            in the Corpus.
          type: integer
        objectIds:
          description: The list of identifiers for the objects that contain the `from`
            and `to` values or phrases. These can be used in a request to /searches
            to retrieve the objects.
          type: array
          items:
            $ref: '#/components/schemas/objectIdentifier'
    analyticsSankeyNode:
      description: A node in a Sankey diagram.
      allOf:
      - $ref: '#/components/schemas/analyticsResult'
      - type: object
        properties:
          identifier:
            description: The unique identifier for the node. Used to identify the
              endpoints of the links. Note the identifier is not guaranteed to be
              the same across multiple diagrams.
            type: integer
          category:
            description: The category of result.
            type: string
            enum:
            - unigram
            - bigram
            - trigram
            - person
            - organization
            - location
            - significantTerm
            - topic
    analyzer:
      description: A supported analyzer for analyzing text at index or search time.
        Returned in a collection from /admin/config/analyzers.
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        solution:
          description: The name of the solution.
          type: string
          default: default
        name:
          description: The name of the analyzer.
          type: string
        displayName:
          description: The localized display name of the analyzer.
          type: string
        links:
          description: Zero or more links to related resources or operations. See
