  '/vertices/{type}/{identifier}':
    get:
      tags:
      - Network
      summary: Get the details for a vertex
      description: 'Returns additional information about a single vertex on the Network
        visualization. This is intended to be used to enhance the Network visualization
        after retrieving it from /graphs or /traversals; the response from which includes
        the values for this resource''s parameters. The additional information includes
        the label, adjacent (number of vertices one edge away from this vertex), degree
        (number of edges entering and leaving the vertex), the adjacent count broken
        down by object type, and the degree broken down by relationship type.'
      operationId: getVertex
      parameters:
      - name: type
        description: The name of the object type for the vertex.
        in: path
        required: true
        schema:
          type: string
      - name: identifier
        description: The unique identifier for the vertex.
        in: path
        required: true
        schema:
          type: string
      - name: expansionLimit
        description: 'The maximum number of adjacent vertices. If a value greater
          than zero is specified and the vertex exceeds the limit, the metrics calculation
          is skipped and no degree and adjacent information is returned.'
        in: query
        required: false
        schema:
          type: integer
          default: 2000
      - name: metricsLimit
