          type: array
          items:
            type: string
        label:
          description: The summary label for the edge.
          type: string
        fields:
          description: The enrichment information for custom relationship fields.
          type: array
          items:
            $ref: '#/components/schemas/summaryField'
        endpoints:
          description: The identifiers for the vertices on either end of the edge.
