    assistedRelationshipSearchRequest:
      description: 'An example of a request for /assistedSearches. In this example,
        the types parameter is omitted and the user is looking for all crimes involving
        John Smith''s black bmw.'
      value: {"types": [], "query": "Show me all crime reports involving a black bmw\
          \ owned by John Smith"}
    assistedObjectSearchResponse:
      description: 'An example of the response from /assistedSearches. In this example,
        the response includes an AI generated request for /searches that will find
        all vehicles reported stolen in the last month.'
      value: {"types": ["report", "person", "vehicle", "address"], "query": "Show\
          \ me all vehicles reported stolen in the last month", "visualizationType": "summary",
        "objectSearchRequest": {"types": ["vehicle"], "query": {"type": "text", "text": "+_type:vehicle\
              \ +incident:theft +last_updated_at_dttm:[2025-03-01 TO 2025-03-31]",
            "language": "lucene", "modes": ["standard"]}, "visualizations": {"facets": {
              "type": "facets", "mode": "filter"}, "selection": {"type": "facets",
              "mode": "selection"}, "summary": {"type": "summary", "start": 1, "limit": 50,
              "order": {"type": "score", "direction": "descending"}}}}}
    assistedRelationshipSearchResponse:
      description: 'An example of the response from /assistedSearches. In this example,
        the response includes an AI generated request for /paths that will find all
        crimes involving John Smith''s black bmw.'
      value: {"types": [], "query": "Show me all crime reports involving a black bmw\
          \ owned by John Smith", "relationshipSearchRequest": {"types": ["person"],
          "query": {"type": "text", "text": "+_type:person +forename:John +surname:Smith",
