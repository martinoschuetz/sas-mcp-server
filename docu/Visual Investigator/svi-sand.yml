        making a backup of the indexed data directly from the underlying search engine.'
      operationId: deleteByQuery
      parameters:
      - name: preserveNewestIndexName
        description: 'Whether to preserve and reuse the name of the newest index for
          each type when creating the next searchable index. Creating new unsearchable
          indexes, or deleting indexes without this option, causes the new indexes
          to have new unique names. Preserving the newest index name is useful when
          maintaining a read-only standby deployment for Disaster Avoidance as it
          allows the data to be re-indexed without changing the index name. For example,
          this is beneficial when applying a breaking configuration change from the
          active deployment.'
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: excludeCategoryAliases
        description: 'Whether type category aliases should be excluded from the search.
          In particular, this should be set to true when the intention is to delete
          system relationships without deleting custom relationships as they both
          share the same type category alias.'
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: waitForRefresh
        description: Whether to wait for any index-related operations to be applied
          prior to the response being returned.
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/vnd.sas.sand.query.request+json:
            schema:
              $ref: '#/components/schemas/queryRequest'
            examples:
              queryRequest:
                $ref: '#/components/examples/queryRequest'
              queryTypeAnd:
                $ref: '#/components/examples/queryTypeAnd'
              queryTypeCompound:
                $ref: '#/components/examples/queryTypeCompound'
              queryTypeObject:
                $ref: '#/components/examples/queryTypeObject'
              queryTypeOr:
                $ref: '#/components/examples/queryTypeOr'
              queryTypeText:
                $ref: '#/components/examples/queryTypeText'
          application/json:
