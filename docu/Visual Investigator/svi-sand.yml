        limit:
          description: The limit paging parameter from the request.
          type: integer
        count:
          description: The total number of child objects with highlighting snippets.
          type: integer
        childObjects:
          description: The current page of child objects with highlighting snippets.
          type: array
          items:
            $ref: '#/components/schemas/childObjectHighlighting'
    childObjectTypeHighlightingParameters:
      description: The part of the request to /highlighting that specifies the paging
        parameters for each child object type.
      type: object
      properties:
        start:
          description: The first child object to include in the page. The default
            value is 1.
          type: integer
        limit:
          description: The maximum number of child objects to include in the page.
            The default value is 10.
          type: integer
    configuration:
      description: The request and response for /admin/config when importing and exporting
        object and relationship types between systems.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
