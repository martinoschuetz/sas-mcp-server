      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        types:
          description: The list of object type names from the request.
          type: array
          items:
            type: string
        query:
          description: The natural language query from the request.
          type: string
        visualizationType:
          description: The type of visualization from the request.
          type: string
          enum:
          - map
          - relationship
          - summary
          - table
        objectSearchRequest:
