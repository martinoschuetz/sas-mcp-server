          format: date-time
        validTo:
          description: The optional datetime that the edge is valid to as an ISO formatted
            string.
          type: string
          format: date-time
        style:
          $ref: '#/components/schemas/relationshipStyle'
    edgeCollection:
      description: A collection of edge representations.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.sand.edge+json` representations.
            type: array
            items:
              $ref: '#/components/schemas/edge'
    endpoint:
      description: The identifier for a vertex on one end of an edge.
      type: object
      properties:
        id:
          description: The identifier of the vertex.
          type: string
        type:
          description: The object type of the vertex.
