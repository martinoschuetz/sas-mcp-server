        degree:
          description: The degree of the object.
          type: number
          format: double
        eigen:
          description: The eigen centrality of the object.
          type: number
          format: double
        close:
          description: The closeness centrality of the object.
          type: number
          format: double
        between:
          description: The betweenness centrality of the object.
          type: number
          format: double
        influence1:
          description: The influence1 centrality of the object.
          type: number
          format: double
        influence2:
          description: The influence2 centrality of the object.
          type: number
          format: double
    centralityMetricsCollection:
      description: The response from /centrality representing the centrality metrics
        for the objects on a network.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.network.analytics.centrality.metrics+json`
              representations.
            type: array
            items:
              $ref: '#/components/schemas/centralityMetrics'
    centralityNetwork:
      description: The request to /centrality for calculating the centrality metrics
