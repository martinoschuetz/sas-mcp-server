---
openapi: 3.0.3
info:
  version: '10'
  title: Search And Discovery
  description: The SAS Visual Investigator Search and Discovery API provides access
    to real-time exploration and visualization of the data in SAS Visual Investigator.
  contact:
    name: SAS Developers
    url: 'https://developer.sas.com'
    email: devex@sas.com
  license:
    name: Terms of Use
    url: 'https://www.sas.com/en_us/legal/copyright.html'
tags:
- name: Root
  description: Contains the operations for the root resource of this API.
- name: Search
  description: Contains search related endpoints.
- name: Network
  description: Contains network visualization related endpoints.
- name: Text Analytics
  description: Contains text Analytics visualization related endpoints.
- name: Administration
  description: Contains administration-related endpoints.
- name: Configuration
  description: Contains configuration-related endpoints.
- name: Data
  description: Contains indexed data-related endpoints.
- name: Index
  description: Contains index related endpoints.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get a list of top-level links
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                api:
                  $ref: '#/components/examples/api'
            application/json:
              schema:
                $ref: '#/components/schemas/api'
              examples:
                api:
                  $ref: '#/components/examples/api'
    head:
      tags:
      - Root
      summary: Get the headers for the API
      description: Returns the headers for the API. Also used to determine whether
        the service provided by the API is available.
      operationId: headersForRoot
      responses:
        '200':
          description: The request succeeded.
  /assistedSearches:
    post:
      tags:
      - Search
      summary: Generate a search request based on a natural language query
      description: 'Generates a new request body for /searches or /paths from the
