      properties:
        version:
          description: The representation version (2).
          type: integer
        id:
          description: The unique identifier for the edge.
          type: string
        type:
          description: The relationship type of the edge.
          type: string
        subtype:
          description: The sub-type of the relationship if applicable.
          type: string
        compoundValues:
          description: The list of compound values if this edge involves a resolved
