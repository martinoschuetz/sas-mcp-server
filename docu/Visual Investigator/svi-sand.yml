              queryTypeAnd:
                $ref: '#/components/examples/queryTypeAnd'
              queryTypeCompound:
                $ref: '#/components/examples/queryTypeCompound'
              queryTypeObject:
                $ref: '#/components/examples/queryTypeObject'
              queryTypeOr:
                $ref: '#/components/examples/queryTypeOr'
              queryTypeText:
                $ref: '#/components/examples/queryTypeText'
      responses:
        '204':
          description: The request succeeded.
        '400':
          description: The request is malformed or contains invalid parameter values.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              example:
                $ref: '#/components/examples/error2Response400'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              example:
                $ref: '#/components/examples/error2Response400'
  '/admin/data/{type}/relationships':
    delete:
      tags:
