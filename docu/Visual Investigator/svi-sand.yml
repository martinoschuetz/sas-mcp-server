      description: Checks the existence of an index for the specified type. 200 OK
        means that an index exists; 404 Not Found means there is no index.
      operationId: headersForIndexName
      parameters:
      - name: type
        description: The name of the type.
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request succeeded.
        '404':
          description: The type does not exist or it is not configured to be indexed
            for search.
    post:
      tags:
      - Index
      summary: Create an index for a single type
      description: 'Ensures that an index exists for the specified type when the searchable
        query parameter is set to true, otherwise creates a new unsearchable index.
        This is especially required when re-indexing data from a source database (see
        example [Use Case Five](#Use-Case-Five)). No errors are reported if the index
        already exists. Returns the name of the newest index for the specified type.'
      operationId: createIndex
      parameters:
      - name: type
        description: The name of the type.
        in: path
        required: true
        schema:
          type: string
      - name: searchable
        description: Whether to create a searchable as opposed to an unsearchable
          index.
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: The request succeeded.
          content:
            application/vnd.sas.sand.index+json:
              schema:
                $ref: '#/components/schemas/index'
              examples:
                index:
                  $ref: '#/components/examples/index'
            application/json:
              schema:
                $ref: '#/components/schemas/index'
              examples:
                index:
                  $ref: '#/components/examples/index'
        '404':
          description: The type does not exist or it is not configured to be indexed
            for search.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              example:
                $ref: '#/components/examples/error2Response404'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              example:
                $ref: '#/components/examples/error2Response404'
    delete:
      tags:
      - Index
      summary: Delete the indices for a single type
      description: 'Deletes the index (and therefore indexed data) for a specified
        type. This operation cannot be undone without first making a backup of the
        indexed data directly from the underlying search engine. No error is reported
        when the index has already been deleted. If the intention is to reload the
        data after deleting the index, the `recreate` parameter should be set to true
        otherwise a POST request to /admin/indices/{type} will be required to create
        an empty index prior to reloading the data.'
      operationId: deleteIndex
      parameters:
      - name: type
        description: The name of the type.
        in: path
        required: true
        schema:
          type: string
      - name: preserveNewestIndexName
        description: 'Whether to preserve and reuse the name of the newest index when
          creating the next searchable index. Creating a new unsearchable index, or
          deleting an index without this option, causes the new index to have a new
          unique name. Preserving the newest index name is useful when maintaining
          a read-only standby deployment for Disaster Avoidance as it allows the data
          to be re-indexed without changing the name. For example, this is beneficial
          when applying a breaking configuration change from the active deployment.'
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: unsearchableOnly
        description: Whether to delete only the unsearchable indices. This is useful
          for cleaning up after a failed indexing attempt.
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: recreate
        description: Whether to create a new empty index for the type after deleting
          the current one.
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: waitForRefresh
        description: Whether to wait for any index-related operations to be applied
          prior to the response being returned.
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '204':
          description: The request succeeded.
        '404':
          description: The type does not exist or it is not configured to be indexed
            for search.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: '#/components/schemas/error2'
              example:
                $ref: '#/components/examples/error2Response404'
            application/json:
              schema:
                $ref: '#/components/schemas/error2'
              example:
                $ref: '#/components/examples/error2Response404'
