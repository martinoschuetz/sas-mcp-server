          type: array
          items:
            $ref: '#/components/schemas/error2'
    assistedSearchVisualizationTypeRequest:
      description: 'The request to /assistedSearches/VisualizationType when determining
        the appropriate type of visualization for a natural language query.'
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        types:
          description: 'The optional list of type names for the object types to be
            searched. If missing, all types are searched.'
          type: array
          items:
            type: string
        query:
          description: The natural language query that Generative AI will use to determine
            the visualization type.
          type: string
    assistedSearchVisualizationTypeResponse:
      description: The response from /assistedSearches/visualizationType containing
        the visualization type to use in the request to /assistedSearches.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        types:
          description: The list of object type names from the request.
          type: array
          items:
            type: string
        query:
          description: The natural language query from the request.
          type: string
        visualizationType:
          description: The type of visualization to use in the request to /assistedSearches.
          type: string
          enum:
          - map
          - relationship
          - summary
          - table
        errors:
          description: Any information or error messages while determining the visualization
            type.
          type: array
          items:
            $ref: '#/components/schemas/error2'
    baseCollection2:
      description: This is a base schema used to define paginated collections of resources.
