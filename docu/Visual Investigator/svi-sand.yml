    typeConfigurationEventIntervalGeoJson:
      description: 'An example of event configuration that extracts at most one event
        per array entry in the `old_addresses` field based on the root path. As the
        field specifiers are not delimited by /, each event is populated from the
        inner fields of the corresponding array entry. Since the tokenized text for
        the interval values refers to a single field, those fields must be of type
        date and contain valid ISO formatted date/time values. As `state` is a required
        field, events are extracted only if the array entry has a value for that field
        as well as either a valid GeoJSON value in the `location` field or values
        in both the `date_from` and `date_to` fields. The absence of a `city` field
        value causes that token to be removed from the description without being replaced
        with a value.'
      value: {"root": "old_addresses", "fields": {"category": "Previous Address",
          "intervalStartTimestamp": "{date_from}", "intervalEndTimestamp": "{date_to}",
          "description": "lived in {city}, {state}", "geoJson": "location"}, "requiredFields": [
          "state"]}
    typeConfigurationEventLatLon:
      description: 'An example of event configuration that extracts a single event
        based on an object''s top-level `lon`, `lat`, `city` and `state` fields. As
        there are no required fields defined, the event is extracted only if an object
        contains a numerical value in the `lon` field constituting a valid longitude
        and a numerical value in the `lat` field constituting a valid latitude value.
        The absence of `city` or `state` field values causes those tokens to be removed
        from the description without being replaced with a value.'
      value: {"fields": {"category": "Primary Address", "longitude": "lon", "latitude": "lat",
          "description": "lives in {city}, {state}"}}
    typeConfigurationEventPaths:
      description: 'An example of event configuration that shows how to mix absolute
        and relative paths in field specifiers. The example is based on an object
        with 4 levels of sub-objects (none of which are arrays); `level1` is a top-level
        field in the object containing a `level2` field and so on. In this case, a
        single event is extracted from the `level3` sub-object comprised of the `level3_date`
        time value and a description based on the `level3_text` field in this sub-object,
        the `level2_text` field from this sub-object''s parent (`level2`) and the
        `level4_text` from this sub-object''s child (`level4`). Given that pointTimestamp
        refers to a single field, that field must be of type date. As there are required
        fields, the event is extracted only if these have values as well as `level3_date`
        having a value.'
      value: {"root": "level1/level2/level3", "fields": {"category": "Complex Path\
            \ Example Event", "pointTimestamp": "{level3_date}", "description": "this\
            \ level: {level3_text} parent level: {/level1/level2/level2_text} child\
            \ level: {level4/level4_text}"}, "requiredFields": ["level3_text", "level4/level4_text",
          "/level1/level2/level2_text"]}
    typeConfigurationEventPointTimestamp:
      description: 'An example of event configuration that extracts a single event
        based on an object''s top-level `opendate`, `account_holder_forename`, and
        `account_holder_surname` fields. Given that pointTimestamp refers to a single
        field, that field must be of type date thereby containing an ISO formatted
        date/time value. As there are no required fields defined, the event is extracted
        only if an object has a value for `opendate`. The absence of `account_holder_forename`
        or `account_holder_surname` field values causes those tokens to be removed
        from the description without being replaced with a value.'
      value: {"fields": {"category": "Account Opened", "pointTimestamp": "{opendate}",
          "description": "opened by {account_holder_forename} {account_holder_surname}"}}
    typeConfigurationFacetDateRange:
