    post:
      tags:
      - Configuration
      summary: Import configuration
      description: 'Imports the configuration for multiple types. This is designed
        for transferring configurations between systems; therefore, the request does
        not include version numbers, and any existing configuration are overwritten.
        If the new configuration contains breaking changes, such as the field type
        or events configuration has changed, the changes are saved but also require
        the data to be re-indexed to take effect. A localized message is included
        in the response if this is the case. The /admin/indices resource can be used
        to re-index the data.'
      operationId: importConfiguration
      parameters:
      - name: validateOnly
        description: Whether to validate the configuration and check for breaking
          changes without importing it.
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: waitForRefresh
        description: Whether to wait for any index-related operations to be applied
          prior to the response being returned.
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/vnd.sas.sand.config+json:
            schema:
              $ref: '#/components/schemas/configuration'
            examples:
              configuration:
                $ref: '#/components/examples/configuration'
              type:
                $ref: '#/components/examples/type'
              typeConfigurationEventIntervalGeoJson:
