      properties:
        details:
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
          type: array
        errorCode:
          description: The numeric ID for the error.
          type: integer
        errors:
          description: Any additional errors that occurred.
          items:
            $ref: '#/components/schemas/error2'
          type: array
        httpStatusCode:
          description: The HTTP status code for the error.
          type: integer
        id:
          description: The string ID for the error.
          type: string
        links:
          description: The links that apply to the error.
          items:
            $ref: '#/components/schemas/link'
          type: array
        message:
          description: The message for the error.
          type: string
        remediation:
          description: A message that describes how to resolve the error.
          type: string
        version:
          description: The version number of the error representation. This representation
            is version 2.
          type: integer
    event:
      description: An event within the context of the Map and Time Line visualizations
      type: object
      properties:
        version:
          description: The representation version (4).
          type: integer
        eventId:
          description: The unique identifier for the event.
          type: string
        eventCategory:
          description: The category of the event.
          type: string
        eventLabel:
          description: The summary label for the event.
          type: string
        eventDescription:
          description: The description for the event.
          type: string
        objectId:
          description: The unique identifier of the object from which the event was
            extracted.
          type: string
        objectType:
          description: The type of the object from which the event was extracted.
          type: string
        objectTypeLabel:
          description: The localized display name for the object type.
          type: string
        objectLabel:
          description: The summary label for the object.
          type: string
        objectDescription:
          description: The description for the object.
          type: string
        objectAttachmentCount:
          description: The number of attachments on the object.
          type: integer
        selected:
          description: True if this event matches the selection criteria in the search
            request. Relevant only to the Map and Map Feature visualizations.
          type: boolean
        group:
          description: The object identifier from the swim lane (used to group events
            according to their swim lane). Relevant only to the Time Line visualization.
          type: string
        startTimestamp:
          description: The ISO formatted string for the start date time of the event.
            Relevant only to the Time Line visualization.
          type: string
          format: date-time
        endTimestamp:
          description: The ISO formatted string for the end date time of the event.
            This has the same value as start for events that have only a single date
            time value. Relevant only to the Time Line visualization.
          type: string
          format: date-time
    filter:
      description: The different filter types that can be applied to narrow or drill
        down into the search results. See specific filter definitions for more details.
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        type:
          description: The type of this filter object. The value of this property
            determines which other properties are expected.
          type: string
          enum:
          - and
          - box
          - dateRange
          - not
          - or
          - polygon
          - query
          - radius
          - range
          - shape
          - terms
          - type
      oneOf:
      - $ref: '#/components/schemas/filterTypeAnd'
      - $ref: '#/components/schemas/filterTypeBox'
      - $ref: '#/components/schemas/filterTypeDateRange'
      - $ref: '#/components/schemas/filterTypeNot'
      - $ref: '#/components/schemas/filterTypeOr'
      - $ref: '#/components/schemas/filterTypePolygon'
      - $ref: '#/components/schemas/filterTypeQuery'
      - $ref: '#/components/schemas/filterTypeRadius'
      - $ref: '#/components/schemas/filterTypeRange'
      - $ref: '#/components/schemas/filterTypeTerms'
      - $ref: '#/components/schemas/filterTypeType'
      - $ref: '#/components/schemas/filterTypeShape'
    filterTypeAnd:
      description: This filter combines two or more filter objects using a Boolean
        AND operation thereby creating the intersection of their individual search
        results
      type: object
      properties:
        filters:
          description: The filter objects to combine.
          type: array
          items:
            $ref: '#/components/schemas/filter'
    filterTypeBox:
      description: Filters objects based on geo data in the form of events. Objects
        containing a geo event whose location intersects with the specified bounded
        box are included in the search results.
      type: object
      properties:
        coordinates:
          description: The top left and bottom right coordinates of the bounded box.
            The first entry in each coordinate array is the longitude and the second
            is the latitude.
          type: array
          items:
            type: array
            items:
              type: number
    filterTypeDateRange:
      description: Filters objects by values in date fields. Objects containing a
        date value in the specified field within the given range are included in the
        search results.
      type: object
      properties:
        field:
          description: The name of the field to filter on.
          type: string
        accuracy:
          description: The accuracy of the date range parameters. The date values
            are adjusted to this accuracy level prior to the filter being applied.
            The default value is day.
          type: string
          enum:
          - year
          - month
          - day
          - hour
          - minute
          - second
          - millisecond
        gt:
          description: The optional greater than range parameter as an ISO formatted
            date time string.
          type: string
          format: date-time
        gte:
          description: The optional greater than or equal to range parameter as an
            ISO formatted date time string.
          type: string
          format: date-time
        lt:
          description: The optional less than range parameter as an ISO formatted
            date time string.
          type: string
          format: date-time
        lte:
          description: The optional less than or equal to range parameter as an ISO
            formatted date time string.
          type: string
          format: date-time
    filterTypeNot:
      description: This filter applies the Boolean NOT operation to another filter
        thereby producing the opposite search results of the contained filter.
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/filter'
    filterTypeOr:
      description: This filter combines two or more filter objects using a Boolean
        OR operation thereby creating the union of their individual search results
      type: object
      properties:
        filters:
          description: The filter objects to combine.
          type: array
          items:
            $ref: '#/components/schemas/filter'
    filterTypePolygon:
      description: Filters objects based on geo data in the form of events. Objects
        containing a geo event whose location intersects with the specified polygon
        are included in the search results.
      type: object
      properties:
        coordinates:
          description: 'The coordinates of the polygon. The first entry in each coordinate
            array is the longitude and the second is the latitude. A minimum of three
            coordinates are required (which would create a triangle). Polygons should
            be closed. The first and last coordinates should be the same. If required,
            the service adds the first coordinate to the end of the array to achieve
            this.'
          type: array
          items:
            type: array
            items:
              type: number
    filterTypeQuery:
      description: Filters objects based on the given query. Objects matching the
        query is included in the search results.
      type: object
      properties:
        query:
          $ref: '#/components/schemas/query'
    filterTypeRadius:
      description: Filters objects based on geo data in the form of events. Objects
        containing a geo event whose location intersects with the specified circle
        are included in the search results.
      type: object
      properties:
        coordinates:
          description: The coordinates of the center of the circle. The first array
            entry is the longitude and the second is the latitude.
          type: array
          items:
            type: number
        radius:
          description: 'The radius of the circle as a numerical value plus a suffix
            for the units. The supported units are miles (mi), yards (yd), feet (ft),
            inches (in), kilometers (km), meters (m), centimeters (cm), millimeters
            (mm), nautical miles (nmi). Meters are assumed if no units are specified.'
          type: string
    filterTypeRange:
      description: Filters objects by values in numerical fields. Objects containing
        a numerical value in the specified field within the given range are included
        in the search results.
      type: object
      properties:
        field:
          description: The name of the field to filter on.
          type: string
        gt:
          description: The optional greater than range parameter.
          type: number
        gte:
          description: The optional greater than or equal to range parameter.
          type: number
        lt:
          description: The optional less than range parameter.
          type: number
        lte:
          description: The optional less than or equal to range parameter.
          type: number
    filterTypeShape:
      description: Filters objects based on geo data in the form of events. Objects
        containing a geo event whose location relates to the specified GeoJSON shape
        are included in the search results.
      type: object
      properties:
        relation:
          description: The spatial relation operator to use.
          type: string
          enum:
          - contains
          - disjoint
          - intersects
          - within
        shape:
          description: The GeoJSON representation of the shape.
          type: object
        id:
          description: The identifier of a pre-configured GeoJSON shape to be used
            instead of an explicit shape.
          type: string
    filterTypeTerms:
      description: Filters objects by values in text fields. Only objects containing
        an exact match for one of the specified terms in the specified field are included
        in the search results.
      type: object
      properties:
        field:
          description: The name of the field to filter on.
          type: string
        objectType:
          description: The name of the type containing the field.
          type: string
        terms:
          description: One or more terms to filter on.
          type: array
          items:
            type: string
    filterTypeType:
      description: Filters objects by their type. Objects of the named types are included
        in the search results.
      type: object
      properties:
        types:
          description: One or more type names to filter on.
          type: array
          items:
            type: string
    geoJsonFeature:
      description: A GeoJSON feature in the context of the Map visualization
      type: object
      properties:
        type:
          description: 'The type of GeoJSON object, in this case Feature.'
          type: string
        geometry:
          description: The GeoJSON object representing the location of this feature
            (normally a Point with a coordinates array).
          type: object
        properties:
          $ref: '#/components/schemas/geoJsonFeatureProperties'
    geoJsonFeatureCollection:
      description: The GeoJSON feature collection returned as part of the Map visualization
        when the results are not clustered.
      type: object
      properties:
        type:
          description: 'The type of GeoJSON object, in this case FeatureCollection.'
          type: string
        features:
          description: The map features.
          type: array
          items:
            $ref: '#/components/schemas/geoJsonFeature'
    geoJsonFeatureProperties:
      description: The details about the events at this map location.
      type: object
      properties:
        events:
          description: The events at this location.
          type: array
          items:
            $ref: '#/components/schemas/event'
        eventCount:
          description: The number of events at this location.
          type: integer
        selectedEventCount:
          description: The subset of events at this location that match the selection
            criteria in the search request.
          type: integer
    geoJsonShape:
      description: A GeoJSON shape for use in the shape filter.
      type: object
      properties:
        id:
          description: The unique identifier of the GeoJSON shape.
          type: string
        solution:
          description: The name of the solution.
          type: string
          default: default
        name:
          description: The optional name of the GeoJSON shape.
          type: string
        group:
          description: The optional group of the GeoJSON shape.
          type: string
        shape:
          description: The GeoJSON representation of the shape. The shape can be any
            GeoJSON geometry or a GeoJSON geometry collection.
          type: object
    geoJsonShapeCollection:
      description: A collection of GeoJSON shape representations.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.sand.geo.shape+json` representations.
            type: array
            items:
              $ref: '#/components/schemas/geoJsonShape'
    graph:
      description: 'The response from /graphs and /traversals in relation to the Network
        visualization. In the network, objects are represented by vertices and the
        relationships between them are represented by edges.'
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        counts:
          $ref: '#/components/schemas/graphCounts'
        vertices:
          description: The collection of vertices in the graph.
          type: array
          items:
            $ref: '#/components/schemas/vertex'
        edges:
          description: The collection of edges in the graph.
          type: array
          items:
            $ref: '#/components/schemas/edge'
        expansionLimit:
          description: The maximum adjacent count a vertex is allowed to have to be
            expanded via a call to /traversals. This member is returned when at least
            one vertex is present in the graph whose adjacent count exceeds this limit.
            The expansion limit is currently set to 2000 meaning that an object with
            relationships to more than 2000 other objects are not expanded. This is
            primarily to prevent a denial of service but it is also assumed that a
            network of such proportions could not be meaningfully visualized and explored
            by end users.
          type: integer
        expansionLimitExceeded:
          description: The identifiers for vertices whose adjacent count exceeds the
            expansion limit. This member is returned when at least one vertex is present
            in the graph whose adjacent count exceeds this limit.
          type: array
          items:
            $ref: '#/components/schemas/objectIdentifier'
    graphCounts:
      description: The total number of vertices and edges in the graph
      type: object
      properties:
        vertices:
          description: The number of vertices.
          type: integer
        edges:
          description: The number of edges.
          type: integer
    graphRequest:
      description: 'The request to /graphs for obtaining the Network visualization.
        In the network, objects are represented by vertices and the relationships
        between them are represented by edges.'
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        vertexTypes:
          description: 'The optional list of object type names for restricting the
            search to particular types. If missing, all types are included in the
            search.'
          type: array
          items:
            type: string
        edgeTypes:
          description: 'The optional list of relationship type names for restricting
            the search to particular types. If missing, all types are included in
            the search.'
          type: array
          items:
            type: string
        query:
          $ref: '#/components/schemas/query'
        filter:
          $ref: '#/components/schemas/filter'
        selection:
          $ref: '#/components/schemas/selection'
    highlighting:
      description: The response from /highlighting containing highlighting snippets
        for a single object based on a given query.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        type:
          description: The object type from the request.
          type: string
        id:
          description: The identifier of the object from the request.
          type: string
        query:
          $ref: '#/components/schemas/query'
        includeFieldHighlighting:
          description: Whether to include highlighting snippets for the top-level
            fields.
          type: boolean
        defaultChildEntityLimit:
          description: The default limit for child object types from the request.
          type: integer
        fieldHighlighting:
          description: The highlighting snippets for the top-level fields keyed by
            field name.
          type: object
          items:
            type: array
            items:
              type: string
        childEntityHighlighting:
          description: The highlighting snippets for child objects grouped by child
            object type name.
          type: object
          items:
            $ref: '#/components/schemas/childObjectTypeHighlighting'
        maskedFields:
          description: The masked field configuration for the top-level fields keyed
            by field name.
          type: object
          items:
            $ref: '#/components/schemas/maskedFieldConfiguration'
        errors:
          description: Any errors relating to the search.
          type: array
          items:
            $ref: '#/components/schemas/error2'
    highlightingRequest:
      description: The request to /highlighting for generating highlighting snippets
        for a single object based on a given query
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        type:
          description: The type of the object.
          type: string
        id:
          description: The identifier of the object.
          type: string
        query:
          $ref: '#/components/schemas/query'
        includeFieldHighlighting:
          description: Whether to include highlighting snippets for the top-level
            fields.
          type: boolean
        defaultChildEntityLimit:
          description: The default limit for child object types. The value of this
            parameter is used if there is no specific limit in childEntityHighlightingParameters.
            Setting this parameter to 0 excludes highlighting for child objects from
            the response. The default value is 10.
          type: integer
        childEntityHighlightingParameters:
          description: The parameters for each child object type keyed by child object
            type name.
          type: object
          items:
            $ref: '#/components/schemas/childObjectTypeHighlightingParameters'
    index:
      description: 'The response from /admin/indices/{type} when requesting information
        about the index for a single object or relationship type'
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        type:
          description: The name of the object or relationship type.
          type: string
        name:
          description: The name of the index.
          type: string
        links:
          description: Zero or more links to related resources or operations. See
            the link relations table for a description of the link types.
          type: array
          items:
            $ref: '#/components/schemas/link'
    indexCollection:
      description: A collection of index representations.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.sand.index+json` representations.
            type: array
            items:
              $ref: '#/components/schemas/index'
    indexFormatUpgradeResponse:
      description: 'The response from /admin/indices/version requesting the index
        format version this service supports.'
      type: object
      properties:
        upgradeRequired:
          description: a boolean flag that indicates if an upgrade is required
          type: boolean
        indexFormatVersion:
          description: the supported index format version
          type: integer
    indicatorIcon:
      description: An indicator icon for an object type style.
      type: object
      properties:
        name:
          description: The name of the indicator icon.
          type: string
        position:
          description: The position of the indicator icon.
          type: string
    link:
      description: A link to a related operation or resource.
      type: object
      properties:
        href:
          description: The URL for the link.
          type: string
        itemType:
          description: 'If this is a link to a container, `itemType` is the media
            type or link type for the items in the container.'
          type: string
        method:
          description: The HTTP method for the link.
          type: string
        rel:
          description: The relationship of the link to the resource.
          type: string
        responseItemType:
          description: 'The media type or link type of the items in the response body
            for a PUT`, `POST`, or `PATCH` operation.'
          type: string
        responseType:
          description: 'The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.'
          type: string
        title:
          description: The title for the link
          type: string
        type:
          description: The media type or link type for the link.
          type: string
        uri:
          description: The relative URI for the link.
          type: string
    maskedFieldConfiguration:
      description: The configuration for a masked field.
      type: object
      properties:
        type:
          description: The type of masked field.
          type: string
          enum:
          - full
          - partial
          - none
    objectIdentifier:
      description: The identifier of a single object used in many of the requests
        and responses.
      type: object
      properties:
        type:
          description: The name of the object type.
          type: string
        id:
          description: The identifier of the object.
          type: string
    objectTypeFields:
      description: Describes the fields to retrieve for a given object type.
      properties:
        entityName:
          description: The name of the object type to retrieve fields for.
          type: string
        fieldNames:
          description: The set of fields to retrieve.
          type: array
          items:
            type: string
    objectTypeStyle:
      description: A collection of properties that determine the style for an object
        type
      type: object
      properties:
        iconName:
          description: The name of the icon to use.
          type: string
        markerColor:
          description: The marker color.
          type: string
        backgroundColor:
          description: The background color.
          type: string
        shape:
          description: The shape to use.
          type: string
        scale:
          description: The scale value.
          type: integer
        additionalLabel:
          description: An additional label.
          type: string
        borderWidth:
          description: The width of the border.
          type: integer
        borderColor:
          description: The border color.
          type: string
        indicatorIcons:
          description: The collection of indicator icons.
          type: array
          items:
            $ref: '#/components/schemas/indicatorIcon'
    operationRequest:
      description: The request to /admin/operations to perform an administration-related
        operation
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        operation:
          description: The name of the operation to be performed.
          type: string
          enum:
          - refreshConfiguration
          - makeIndexSearchable
        parameters:
          description: Any parameters relevant to the operation. See operation parameter
            definitions for more details.
          type: object
          anyOf:
          - $ref: '#/components/schemas/operationRequestParametersForRefreshConfiguration'
          - $ref: '#/components/schemas/operationRequestParametersForMakeIndexSearchable'
    operationRequestParametersForRefreshConfiguration:
      description: The parameters for the refresh configuration operation
      type: object
      properties:
        type:
          description: 'The name of the type whose configuration is to be refreshed.
            If not specified, the configuration for all types is refreshed.'
          type: string
        statusOnly:
          description: Whether to return only status information instead of performing
            the refresh. The default value is true.
          type: boolean
        waitForRefresh:
          description: Whether to wait for any index-related operations to be applied
            prior to the response being returned. The default value is false.
          type: boolean
    operationRequestParametersForMakeIndexSearchable:
      description: The parameters for the make index searchable operation.
      type: object
      properties:
        type:
          description: 'The name of the type whose newest index is to be made searchable
            and whose older indices are to be deleted. If not specified, the indices
            for all types are modified and deleted as appropriate.'
          type: string
    operationResponse:
      description: The response from a request to /admin/operations to perform an
        administration-related operation.
      allOf:
      - $ref: '#/components/schemas/operationRequest'
      - type: object
        properties:
          results:
            description: Any results relevant to the operation.
            type: object
            anyOf:
            - $ref: '#/components/schemas/typeStatus'
    path:
      description: A path within the context of the Network visualization. A path
        is a finite sequence of relationships (edges) connecting a sequence of objects
        (vertices) in the Network visualization.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        endpoints:
          description: The endpoints representing the vertices and the edges between
            them that make up the path.
          type: array
          items: {}
    pathCollection:
      description: A collection of path representations.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.sand.path+json` representations.
            type: array
            items:
              $ref: '#/components/schemas/path'
    pathsRequest:
      description: 'The request to /paths when searching for matching paths from one
        or more start objects. Use the type and id properties to identify a single
        start object, or use the types and query properties to identify one or more
        start objects.'
      type: object
      properties:
        version:
          description: The representation version (3).
          type: integer
        type:
          description: The type of the start object.
          type: string
        id:
          description: The identifier of the start object.
          type: string
        types:
          description: 'The optional list of type names for the start objects. If
            missing, all types are searched.'
          type: array
          items:
            type: string
        query:
          $ref: '#/components/schemas/query'
        filter:
          $ref: '#/components/schemas/filter'
        nextLevel:
          $ref: '#/components/schemas/pathsRequestNextLevel'
        nextLevels:
          description: The criteria for each branch at the next level of the path
            search.
          type: array
          items:
            $ref: '#/components/schemas/pathsRequestNextLevel'
        mustMatchAllBranches:
          description: Whether to only return paths when there is a matching result
            for every branch.
          type: boolean
    pathsRequestNextLevel:
      description: The criteria for the next level of the path search.
      type: object
      properties:
        vertexTypes:
          description: 'The optional list of object type names for restricting the
            search to particular types. If missing, all types are included in the
            search.'
          type: array
          items:
            type: string
        vertexFilter:
          $ref: '#/components/schemas/filter'
        edgeTypes:
          description: 'The optional list of relationship type names for restricting
            the search to particular types. If missing, all types are included in
            the search.'
          type: array
          items:
            type: string
        edgeFilter:
          $ref: '#/components/schemas/filter'
        nextLevel:
          $ref: '#/components/schemas/pathsRequestNextLevel'
        nextLevels:
          description: The criteria for each branch at the next level of the path
            search.
          type: array
          items:
            $ref: '#/components/schemas/pathsRequestNextLevel'
    query:
      description: The different query types that can be used to search for objects.
        See specific query definitions for more details.
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        type:
          description: The type of this query object. The value of this property determines
            which other properties are expected.
          type: string
          enum:
          - and
          - compound
          - object
          - or
          - text
      anyOf:
      - $ref: '#/components/schemas/queryTypeAnd'
      - $ref: '#/components/schemas/queryTypeCompound'
      - $ref: '#/components/schemas/queryTypeObject'
      - $ref: '#/components/schemas/queryTypeOr'
      - $ref: '#/components/schemas/queryTypeText'
    queryRequest:
      description: The request to perform an action on data specified by a query.
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        types:
          description: 'The optional list of type names for the object and relationship
            types to be searched. If missing, all types are searched.'
          type: array
          items:
            type: string
        query:
          $ref: '#/components/schemas/query'
    queryTypeAnd:
      description: This query combines two or more query objects using a Boolean AND
        operation thereby creating the intersection of their individual search results.
      type: object
      properties:
        queries:
          description: The query objects to combine.
          type: array
          items:
            $ref: '#/components/schemas/query'
    queryTypeCompound:
      description: This query allows resolved objects to be searched by their compound
        values (globally unique text fragments based on the values extracted from
        the contributing objects). Resolved objects containing one or more matching
        compounds are included in the search results. These values are not expected
        to be known by users and clients but rather they can be extracted from the
        results of an earlier free-text or geospatial search.
      type: object
      properties:
        compoundValues:
          description: The compound values for the resolved objects to be included
            in the search results.
          type: array
          items:
            type: string
    queryTypeObject:
      description: This query allows objects to be searched by their type and identifier.
        Objects with matching types and identifiers are included in the search results.
        These values are not necessarily expected to be known by users and clients
        but rather they can be extracted from an earlier search result.
      type: object
      properties:
        objectIds:
          description: The identifiers for the objects to be included in the search
            results.
          type: array
          items:
            $ref: '#/components/schemas/objectIdentifier'
    queryTypeOr:
      description: This query combines two or more query objects using a Boolean OR
        operation thereby creating the union of their individual search results.
      type: object
      properties:
        queries:
          description: The query objects to combine.
          type: array
          items:
            $ref: '#/components/schemas/query'
    queryTypeText:
      description: This is the main query object and represents a free text query
        in a specified query language. Objects matching one or more query terms are
        included in the search results.
      type: object
      properties:
        language:
          description: The name of the query language. Note only lucene is supported
            at the present time.
          type: string
        text:
          description: The free text query.
          type: string
    relatedObjectsRequest:
      description: The request to /relatedObjects when searching for paths between
        start and end objects.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        startTypes:
          description: 'The optional list of type names for the start objects. If
            missing, all types are searched.'
          type: array
          items:
            type: string
        startQuery:
          $ref: '#/components/schemas/query'
        startFilter:
          $ref: '#/components/schemas/filter'
        endTypes:
          description: 'The optional list of type names for the end objects. If missing,
            all types are searched.'
          type: array
          items:
            type: string
        endQuery:
          $ref: '#/components/schemas/query'
        endFilter:
          $ref: '#/components/schemas/filter'
        hops:
          description: 'The maximum number of hops, that is, relationships to be included
            in each path. The minimum and default value is 1. The maximum value is
            4.'
          type: integer
    relationshipStyle:
      description: A collection of properties that determine the style for a relationship.
      type: object
      properties:
        color:
          description: The line color.
          type: string
        width:
          description: The width of the line in pixels.
          type: integer
        dashType:
          description: The type of dashes to use for the line.
          type: string
    searchRequest:
      description: 'The request to /searches when performing a search including the
        object types to search, the query, filter, and selection criteria, as well
        as which visualizations to return'
      type: object
      properties:
        version:
          description: The representation version (3).
          type: integer
        types:
          description: 'The optional list of type names for the object types to be
            searched. If missing, all types are searched.'
          type: array
          items:
            type: string
        query:
          $ref: '#/components/schemas/query'
        filter:
          $ref: '#/components/schemas/filter'
        selection:
          $ref: '#/components/schemas/selection'
        visualizations:
          description: The collection of visualizations to be returned. The keys supplied
            in this map are used in the search response to identify the requested
            visualizations. See the visualization request definitions for details.
          type: object
          items:
            $ref: '#/components/schemas/visualizationRequest'
    searchResponse:
      description: The response from /searches when performing a search including
        the various visualizations that can be returned.
      type: object
      properties:
        version:
          description: The representation version (3).
          type: integer
        types:
          description: The list of object type names from the search request.
          type: array
          items:
            type: string
        query:
          $ref: '#/components/schemas/query'
        visualizations:
          description: The requested search visualizations keyed by the identifiers
            specified in the search request. See the visualization response definitions
            for details.
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/visualizationResponseTypeFacets'
            - $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacetDate'
            - $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacetNumerical'
            - $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacetNumerical'
            - $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacetTerms'
            - $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacetType'
            - $ref: '#/components/schemas/visualizationResponseTypeHits'
            - $ref: '#/components/schemas/visualizationResponseTypeMap'
            - $ref: '#/components/schemas/visualizationResponseTypeMapFeature'
            - $ref: '#/components/schemas/visualizationResponseTypeSummary'
            - $ref: '#/components/schemas/visualizationResponseTypeTable'
            - $ref: '#/components/schemas/visualizationResponseTypeTimebar'
            - $ref: '#/components/schemas/visualizationResponseTypeTimeline'
        errors:
          description: Any errors relating to the search.
          type: array
          items:
            $ref: '#/components/schemas/error2'
    selection:
      description: The criteria by which search results are marked as selected. In
        order to perform certain tasks within SAS Visual Investigator, such as adding
        search results to a workspace or expanding nodes in a network, the search
        results must first be selected. Manually selecting large numbers of results
        can be tedious; therefore, SAND allows manual selection to be combined with
        query-based selection. In query-based selection, all matching objects are
        marked as selected. In facet-based selection, all objects matching any of
        the filters are marked as selected. The filter parameter represents the facet-based
        selection; the include parameter represents the manual and query based selections;
        the exclude parameter represents the manual and query based de-selections.
        All parameters are optional such that selections can be made by filter only,
        by include query only, or by object references and compound values. Objects
        matching either the filter or the include parameter are selected as long as
        they do not match the exclude parameter.
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        filter:
          $ref: '#/components/schemas/filter'
        include:
          $ref: '#/components/schemas/selectionQueryAndObjectReferences'
        exclude:
          $ref: '#/components/schemas/selectionQueryAndObjectReferences'
    selectionQueryAndObjectReferences:
      description: The query-based selection as well as the object references and
        compound values representing the manually included or excluded hits.
      type: object
      properties:
        query:
          $ref: '#/components/schemas/query'
        objectIds:
          description: The references to the included or excluded objects.
          type: array
          items:
            $ref: '#/components/schemas/objectIdentifier'
        compoundValues:
          description: The compound values for the included or excluded resolved entities.
          type: array
          items:
            type: string
    setting:
      description: An application setting.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        name:
          description: The name of the application setting.
          type: string
        value:
          description: The value of the application setting.
          type: object
        errors:
          description: Any messages related to updating the setting.
          type: array
          items:
            $ref: '#/components/schemas/error2'
    settingCollection:
      description: A collection of application settings.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.sand.setting+json` representations.
            type: array
            items:
              $ref: '#/components/schemas/setting'
    summaryField:
      description: The content of a single field.
      type: object
      properties:
        name:
          description: The display name of the field.
          type: string
        fieldName:
          description: The name of the field.
          type: string
        type:
          description: The type of data the field contains.
          type: string
          enum:
          - boolean
          - date
          - double
          - float
          - integer
          - long
          - text
        value:
          description: The value of the field.
          oneOf:
          - type: string
          - type: number
          - type: boolean
        masked:
          $ref: '#/components/schemas/maskedFieldConfiguration'
    synonym:
      description: A synonym for synonym searching. Saved and returned in a collection
        via /admin/config/synonyms.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        terms:
          description: The list of terms as a comma-separated list or as two comma-separated
            lists with the symbol => in the middle of them.
          type: string
    synonymCollection:
      description: A collection of synonyms for synonym searching.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.sand.synonym+json` representations.
            type: array
            items:
              $ref: '#/components/schemas/synonym'
    traversalRequest:
      description: The request to /traversals for performing a breadth first graph
        search in the Network visualization
      type: object
      properties:
        version:
          description: The representation version (3).
          type: integer
        vertexTypes:
          description: 'The optional list of object type names for restricting the
            search to particular types. If missing, all types are included in the
            search.'
          type: array
          items:
            type: string
        vertexFilter:
          $ref: '#/components/schemas/filter'
        edgeTypes:
          description: 'The optional list of relationship type names for restricting
            the search to particular types. If missing, all types are included in
            the search.'
          type: array
          items:
            type: string
        edgeFilter:
          $ref: '#/components/schemas/filter'
        query:
          $ref: '#/components/schemas/query'
        depth:
          description: The number of levels the traversal should explore. The minimum
            (and default) value is 1; the maximum value is 3.
          type: integer
        extendedFormat:
          description: 'Defaults to false but if set to true, edges will be returned
            as well as vertex degree and adjacent counts.'
          type: boolean
        graphObjectIds:
          description: The identifiers for additional vertices that should be included
            in the graph but are not already included in the search criteria.
          type: array
          items:
            $ref: '#/components/schemas/objectIdentifier'
        graphCompoundValues:
          description: The compound values for additional resolved vertices that should
            be included in the graph but are not already included in the search criteria.
          type: array
          items:
            type: string
    type:
      description: 'The request and response for /admin/config/types/{type} when retrieving
        or updating the configuration for a single object or relationship type.'
      type: object
      properties:
        version:
          description: The representation version (3).
          type: integer
        solution:
          description: The name of the solution.
          type: string
          default: default
        name:
          description: The unique name for the type.
          type: string
        displayName:
          description: 'The localized display name for the type. Note for this release,
            this is the actual localized text as only one language is supported; in
            future, this member is the resource key to look up the localized display
            name.'
          type: string
        category:
          description: 'The category of the object or relationship type. The alert
            category applies to object types generated by the Alert component and
            support free text, faceted, and graph search (represented by vertices
            in the Network visualization). The entity category (the default category)
            applies to all other object types and supports free text, faceted, geo,
            and graph search (represented by vertices in the Network visualization).
            The resolvedEntity category applies to object types generated by the Entity
            Resolution component and supports free text, geo, and graph search (represented
            by vertices in the Network visualization). The entityRelationship category
            applies to relationship types between internal, external, or alert objects
            and supports graph search (represented by edges in the Network visualization).
            The resolvedEntityRelationship category applies to relationship types
            (between resolved objects and their contributing objects) generated by
            the Entity Resolution component and supports graph search (represented
            by edges in the Network visualization).'
          type: string
          enum:
          - alert
          - entity
          - resolvedEntity
          - entityRelationship
          - resolvedEntityRelationship
        fields:
          description: The field definitions keyed by field name. Field names can
            contain up to 150 alphanumeric characters and underscores but cannot start
            with an underscore.
          type: object
          items:
            $ref: '#/components/schemas/typeField'
        options:
          description: 'Any options relating to this type. The boolean option indexed_for_search
            specifies whether objects of this type can be indexed (defaults to true).
            The integer option number_of_shards specifies the number of sections that
            the indexed data is divided into. These sections are distributed across
            the underlying search engine''s data nodes. The acceptable range of values
            is from 1 to 1024. The default value is 1. The value should be set to
            ensure that each shard is no bigger than 50GB but ideally somewhere between
            10GB and 30GB. As a rough guide, use a value equal to the total size of
            the indexed data divided by 20GB. The integer option number_of_replicas
            specifies the number of replica shards (that is, copies) per primary shard.
            These copies are distributed across the underlying search engine''s data
            nodes to ensure high availability. The acceptable range of values is from
            0 to 1024. The default value is 1. A value of 0 disables high availability
            since there are no replica shards; but, this is useful during the initial
            data load. The maximum usable value equates to the number of data nodes
            minus one (since a maximum of one copy of each shard can exist on each
            data node and one of them is the primary copy). As a rough guide, use
            a value between 1 and 3. The integer option refresh_interval specifies
            the frequency (in seconds) by which changes to the indexed data become
            searchable. The default value is 1. A value of -1 disables the refresh
            and is therefore useful when performing large bulk operations; otherwise
            a positive value is expected. Warnings: 1. modifying the number_of_shards,
            number_of_replicas or refresh_interval options can adversely affect the
            performance and stability of the application and as such they should be
            set only by advanced users. 2. changing the indexed_for_search option
            to false causes all indexed data for this type to be deleted, which cannot
            be undone without first making a backup.'
          type: object
        config:
          $ref: '#/components/schemas/typeConfiguration'
        links:
          description: Zero or more links to related resources or operations. See
            the link relations table for a description of the link types.
          type: array
          items:
            $ref: '#/components/schemas/link'
    typeCollection:
      description: A collection of object and relationship types.
      allOf:
      - $ref: '#/components/schemas/baseCollection2'
      - type: object
        properties:
          items:
            description: The array of `application/vnd.sas.sand.type+json` representations.
            type: array
            items:
              $ref: '#/components/schemas/type'
    typeConfiguration:
      description: 'The configuration relating to the various search visualizations.
        Although each sub-section is optional, their absence reduces the functionality
        available when interacting with objects or relationships of this type.'
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/typeConfigurationSummary'
        table:
          $ref: '#/components/schemas/typeConfigurationTable'
        graph:
          $ref: '#/components/schemas/typeConfigurationGraph'
        facets:
          description: The configuration options for the Facets visualization.
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/typeConfigurationFacet'
            - $ref: '#/components/schemas/typeConfigurationFacetTerms'
            - $ref: '#/components/schemas/typeConfigurationFacetNumerical'
            - $ref: '#/components/schemas/typeConfigurationFacetType'
            - $ref: '#/components/schemas/typeConfigurationFacetDate'
        textAnalytics:
          $ref: '#/components/schemas/typeConfigurationTextAnalytics'
        events:
          description: 'The events configuration relating to the Map, Map Feature,
            Time Line, and Time Bar visualizations. This is relevant only to object
            types of the entity category.'
          type: array
          items:
            $ref: '#/components/schemas/typeConfigurationEvent'
        label:
          $ref: '#/components/schemas/typeConfigurationLabel'
        description:
          $ref: '#/components/schemas/typeConfigurationLabel'
    typeConfigurationEvent:
      description: 'The configuration for extracting an event from the objects of
        a single type. Events capture what, when, where information and serve as the
        units of data for the Map, Map Feature, Time Line, and Time Bar visualizations.'
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        root:
          description: The root path. The context for the field names or paths used
            elsewhere in the event configuration. The path must be / delimited and
            end with an object or array field but not a primitive field. Also, the
            path is limited to going via object fields and not via array fields. The
            default value of a single / sets the context as the top-level fields in
            the object. A path ending in an array field causes at most one event to
            be extracted for each entry in the array.
          type: string
        fields:
          $ref: '#/components/schemas/typeConfigurationEventFields'
        requiredFields:
          description: Optional list of field specifiers for object fields that must
            contain a value so that the event can be extracted. This can do the following`:`
            make the event extraction conditional on the content of fields that are
            not referenced elsewhere in the event configuration; enforce that an event
            has both time and location values; or ensure values exist for the fields
            used to construct the event's label or description.
          type: array
          items:
            type: string
    typeConfigurationEventFields:
      description: 'The prescription for extracting each event field and an event''s
        location value. The prescriptions can be static text, which is literal text
        not extracted from the object. In other words, the event field is populated
        with this exact value; a field specifier (the name of a field at the specified
        root level or a / delimited path to a field elsewhere in the object. Field
        paths can be relative to the root path or absolute paths (by starting with
        a /). Note these paths must end in a field containing a primitive value but
        like the root path cannot go via fields containing arrays. The event field
        is populated with the value of the specified field); or tokenized text (a
        combination of literal text and tokens. A token is specified with {} brackets
        between which is a field specifier. Tokens are replaced with field values
        when the event is extracted).'
      type: object
      properties:
        category:
          description: Optional static text defining the category for this event.
            This must be a unique value compared to other events defined for this
            object type.
          type: string
        label:
          description: Optional tokenized text defining a short summary for this event.
          type: string
        description:
          description: Optional tokenized text defining a longer summary for this
            event.
          type: string
        pointTimestamp:
          description: Optional tokenized text defining the point-in-time value for
            this event as an ISO formatted string. This is tokenized to allow the
            date and time portions of the ISO formatted string to be extracted from
            different fields.
          type: string
          format: date-time
        intervalStartTimestamp:
          description: Optional tokenized text defining the interval start time for
            this event as an ISO formatted string. This is tokenized to allow the
            date and time portions of the ISO formatted string to be extracted from
            different fields.
          type: string
          format: date-time
        intervalEndTimestamp:
          description: Optional tokenized text defining the interval end time for
            this event as an ISO formatted string. This is tokenized to allow the
            date and time portions of the ISO formatted string to be extracted from
            different fields.
          type: string
          format: date-time
        longitude:
          description: Optional field specifier for a field containing a valid longitude
            value to use when populating the location field for this event. (See the
            complete media type example.)
          type: string
        latitude:
          description: Optional field specifier for a field containing a valid latitude
            value to use when populating the location field for this event. (See the
            complete media type example.)
          type: string
        geoJson:
          description: Optional field specifier for a field containing valid GeoJSON
            to use when populating the location field for this event. (See the complete
            media type example.)
          type: string
    typeConfigurationFacet:
      description: The configuration of a single facet for a single object type in
        relation to the Facets visualization. The Facets visualization presents various
        facets for each object type found in the search. Each facet includes the hit
        counts per field value (or range of field values for numerical and date fields).
        See specific facet configuration definitions for more details.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        type:
          description: The type of this facet object. The value of this property determines
            which other properties are expected.
          type: string
          enum:
          - dateRange
          - range
          - terms
          - type
    typeConfigurationFacetDate:
      description: The dateRange facet produces a set of hit counts for configured
        ranges of values for a date field as well as supplementary information about
        which filters a user should be allowed to apply
      allOf:
      - $ref: '#/components/schemas/typeConfigurationFacet'
      - type: object
        properties:
          field:
            description: The name of the field.
            type: string
          accuracy:
            description: The accuracy of the filter or range parameters. Date values
              are adjusted to this accuracy level prior to being used in filters.
            type: string
            enum:
            - year
            - month
            - day
            - hour
            - minute
            - second
            - millisecond
          filter:
            $ref: '#/components/schemas/typeConfigurationFacetRangeFilter'
          ranges:
            description: 'The administrator is responsible for configuring these ranges
              appropriate to the data in the customer deployment should they want
              to provide hints as to which range filters might be useful to apply
              when drilling into search results. Whilst the various range parameters
              are optional, at least one must be specified and only one of gt and
              gte can be specified and similarly for lt and lte.'
            type: array
            items:
              $ref: '#/components/schemas/typeConfigurationFacetDateRange'
    typeConfigurationFacetDateRange:
      description: The configuration for a single date range.
      type: object
      properties:
        description:
          description: The description of this range.
          type: string
        id:
          description: The id of this range.
          type: string
        gt:
          description: The optional ISO formatted date time string for the greater
            than value.
          type: string
          format: date-time
        gte:
          description: The optional ISO formatted date time string for the greater
            than or equal to value.
          type: string
          format: date-time
        lt:
          description: The optional ISO formatted date time string for the less than
            value.
          type: string
          format: date-time
        lte:
          description: The optional ISO formatted date time string for the less than
            or equal to value.
          type: string
          format: date-time
    typeConfigurationFacetNumerical:
      description: The range facet produces a set of hit counts for configured ranges
        of values for a numerical field as well as supplementary information about
        which filters a user should be allowed to apply
      allOf:
      - $ref: '#/components/schemas/typeConfigurationFacet'
      - type: object
        properties:
          field:
            description: The name of the field.
            type: string
          filter:
            $ref: '#/components/schemas/typeConfigurationFacetRangeFilter'
          ranges:
            description: 'The administrator is responsible for configuring these ranges
              appropriate to the data in the customer deployment should they want
              to provide hints as to which range filters might be useful to apply
              when drilling into search results. Whilst the various range parameters
              are optional, at least one must be specified and only one of gt and
              gte can be specified and similarly for lt and lte.'
            type: array
            items:
              $ref: '#/components/schemas/typeConfigurationFacetNumericalRange'
    typeConfigurationFacetNumericalRange:
      description: The configuration for a single numerical range
      type: object
      properties:
        description:
          description: The description of this range.
          type: string
        id:
          description: The id of this range.
          type: string
        gt:
          description: The optional greater than value.
          type: number
        gte:
          description: The optional greater than or equal to value.
          type: number
        lt:
          description: The optional less than value.
          type: number
        lte:
          description: The optional less than or equal to value.
          type: number
    typeConfigurationFacetRangeFilter:
      description: The filter options intended as a guide for user entered filters
        on this field. The administrator is responsible for defining these appropriate
        to the client and customer deployment should they want to allow users to enter
        their own filters
      type: object
      properties:
        allowExact:
          description: 'If true, clients should allow users to define their own filter
            on exact numerical values.'
          type: boolean
        allowRange:
          description: 'If true, clients should allow users to define their own range
            filter (rather than using one of the configured ranges).'
          type: boolean
        fromType:
          description: One of gt or gte indicating what the from range parameter should
            be.
          type: string
          enum:
          - gt
          - gte
        toType:
          description: One of lt or lte indicating what the to range parameter should
            be.
          type: string
          enum:
          - lt
          - lte
        displayFormat:
          description: An optional regular expression or other format string that
            can be used to validate user input.
          type: string
    typeConfigurationFacetTerms:
      description: The terms facet produces a set of hit counts categorized by field
        value for a given text field (or a boolean or numerical field known to have
        a finite set of values).
      allOf:
      - $ref: '#/components/schemas/typeConfigurationFacet'
      - type: object
        properties:
          field:
            description: The name of the field.
            type: string
          limit:
            description: The maximum number of buckets to include in the result. The
              default value is 100.
            type: integer
            default: 100
          displayLimit:
            description: The maximum number of buckets to display in a UI. This is
              intended to be used when screen space is limited.
            type: integer
          minDocCount:
            description: The minimum hit count each bucket must have to be included
              in the result. Accepted values are 0 (no restriction) and 1 (buckets
              must have a hit count greater than or equal to one to be included).
            type: integer
          orderBy:
            description: Specifies how the buckets are to be ordered. Accepted values
              are count (to order the buckets by hit count) and alpha (to order the
              buckets by term in this case).
            type: string
            enum:
            - alpha
            - count
          orderDirection:
            description: Specifies the direction in which the buckets are to be ordered.
              Accepted values are asc (for ascending) and desc (for descending).
            type: string
            enum:
            - asc
            - desc
          calculateCounts:
            description: Whether to calculate the hit counts for each field value
              and return the results.
            type: boolean
            default: true
          allowUserEnteredFilters:
            description: 'If true, clients should allow users to define their own
              terms filter (rather than filtering by the bucket values).'
            type: boolean
            default: false
    typeConfigurationFacetType:
      description: The type facet produces a set of hit counts categorized by object
        type.
      allOf:
      - $ref: '#/components/schemas/typeConfigurationFacet'
      - type: object
        properties:
          limit:
            description: 'The maximum number of buckets to include in the result.
              The default value is 0, or no limit.'
            type: integer
          displayLimit:
            description: The maximum number of buckets to display in a UI. This is
              intended to be used when screen space is limited.
            type: integer
          minDocCount:
            description: The minimum hit count each bucket must have to be included
              in the result. Accepted values are 0 (no restriction) and 1 (buckets
              must have a hit count greater than or equal to one to be included).
            type: integer
          orderBy:
            description: Specifies how the buckets are to be ordered. Accepted values
              are count (to order the buckets by hit count) and alpha (to order the
              buckets by type name in this case).
            type: string
            enum:
            - alpha
            - count
          orderDirection:
            description: Specifies the direction in which the buckets are to be ordered.
              Accepted values are asc (for ascending) and desc (for descending).
            type: string
            enum:
            - asc
            - desc
    typeConfigurationGraph:
      description: The configuration options for the Network visualization
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        fields:
          description: The names of the fields whose values are included in the vertex.
          type: array
          items:
            type: string
    typeConfigurationLabel:
      description: The label or description configuration.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        template:
          description: 'The template for the label, which can be a mixture of static
            text and field substitutions. Field substitutions are represented by {i}
            where i is the zero based index into the list of values. As it stands,
            any static text will not be localized; in the future this template string
            is replaced with a resource key such that the locale appropriate template
            string can be retrieved.'
          type: string
        values:
          description: The names of the fields whose values are substituted into the
            template.
          type: array
          items:
            type: string
    typeConfigurationSummary:
      description: The configuration options for the Summary visualization.
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        fields:
          description: The names of the fields whose values are included in the summary.
          type: array
          items:
            type: string
        highlighting:
          $ref: '#/components/schemas/typeConfigurationSummaryHighlighting'
    typeConfigurationSummaryHighlighting:
      description: The highlighting options keyed by field name.
      type: object
      properties:
        highlighter:
          description: 'The name of the highlighter to use. Accepted values are unified
            (the default highlighter), plain, and fvh (fast vector highlighter). For
            details about the supported highlighters, when to use them and the related
            field configuration see [Highlighting in OpenSearch](https://opensearch.org/docs/2.19/search-plugins/searching-data/highlight/#highlighter-types).'
          type: string
          enum:
          - unified
          - plain
          - fvh
        fragments:
          description: The maximum number of text fragments to include for this field.
          type: integer
        fragmentSize:
          description: The maximum number of characters to include in each text fragment.
          type: integer
    typeConfigurationTable:
      description: The configuration options for the Table visualization.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        fields:
          description: The names of the fields whose values are included in the table.
          type: array
          items:
            type: string
    typeConfigurationTextAnalytics:
      description: The configuration options for the Text Analytics visualization.
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        fields:
          description: The names of the fields whose values are included in the Corpus.
          type: array
          items:
            type: string
        fromField:
          description: The optional name of the field whose values are used for the
            `from` nodes in the Sankey diagram.
          type: string
        toFields:
          description: The optional names of the fields whose values are used for
            the `to` nodes in the Sankey diagram.
          type: array
          items:
            type: string
    typeField:
      description: The definition of a single field
      type: object
      properties:
        displayName:
          description: 'The localized display name for the field. Note for this release,
            this is the actual localized text as only one language is supported; in
            future, this member is the resource key to look up the localized display
            name.'
          type: string
        type:
          description: The type of data the field contains. geoPoint is for fields
            containing an array of double where the first entry is the longitude value
            and the second entry is the latitude; geoShape is for fields containing
            GeoJSON; nested and object are for fields that contain other fields as
            defined by the innerFields member (nested differs in that it supports
            an array of values as opposed to a single set of inner fields).
          type: string
          enum:
          - boolean
          - date
          - double
          - float
          - geoPoint
          - geoShape
          - integer
          - long
          - nested
          - object
          - text
        options:
          description: 'Any options relating to this field as map of string to object.
            The boolean option indexed_for_search specifies whether this field can
            be indexed (defaults to true). The format option specifies how to parse
            the date time values. See [OpenSearch date formats](https://opensearch.org/docs/2.19/field-types/supported-field-types/date/#formats)
            for details. Text fields support a features option that accepts an array
            containing zero or more of the following: `search`, `facet`, `sort`, `html`,
            `phonetic`, `synonym`. The search feature allows the text field to be
            used in free-text queries by ensuring that the text is analyzed using
            the configured search analyzers. The facet feature allows the text field
            to be used in terms filters and facets by ensuring that the text is analyzed
            using the configured facet analyzer. The sort feature allows the text
            field to be used to order search results by ensuring that the text is
            analyzed using the configured sort analyzer. The html feature ensures
            any html tags contained in the text field are removed when the data is
            indexed. The phonetic feature allows the text field to be used in phonetic
            searches by ensuring that the text is analyzed using the sand_phonetic
            analyzer. The synonym feature allows the text field to be used in synonym
            searches by ensuring that the text is analyzed using the sand_synonym
            analyzer. By default, only the search feature is enabled. However, the
            facet and sort features are automatically enabled when a text field is
            used in a terms facet or in the Table visualization, respectively. An
            empty array specifies that the text field should not support any of these
            features. In this case, search results can still be based on the content
            of the field but queries specifically on this field must match the content
            exactly. Text fields support five analyzer options to precisely control
            the search, facet and sort behavior. The analyzer option specifies which
            analyzer to use when indexing and searching the data in this text field.
            The default value is the most appropriate language analyzer determined
            by the global or tenant locale setting. This option accepts any of the
            standard, language or sand analyzers except for sand_not_analyzed, sand_icu_sort,
            sand_icu_shingle, and sand_phonetic. Note that analyzers that produce
            a single token are less appropriate for free-text search. The search_analyzer
            option specifies which analyzer to use, as an alternative to the analyzer
            option, when searching the data in this text field (making the analyzer
            option only affect the indexing of the data). Note that the output of
            the search analyzer must match the output of the index analyzer for there
            to be any results. For example, the Stop and Simple analyzers or the Synonym
            and appropriate language analyzers work well together. The search_quote_analyzer
            option specifies which analyzer to use, as an alternative to the analyzer
            and search_analyzer options, specifically when using quotes around query
            terms to search the data in this text field (making the search analyzer
            apply to unquoted queries). Note that the output of the quote analyzer
            needs to match the output of the index analyzer for there to be any results.
            For example, the Stop and Simple analyzers or the Synonym and appropriate
            language analyzers work well together. The facet_analyzer option specifies
            which analyzer to use for terms facets on this text field. The default
            value is sand_not_analyzed. This option accepts any of the standard, language
            or sand analyzers except for sand_icu_sort. Note that analyzers that produce
            a single token are more appropriate for terms facets. The sort_analyzer
            option specifies which analyzer to use when sorting search results based
            on this text field. The default value is sand_icu_sort. This option accepts
            any of the standard, language or sand analyzers but the default value
            should be used to sort results correctly for non-English locales.'
          type: object
        innerFields:
          description: The inner field definitions keyed by field name. Note this
            is applicable only to object or nested field types.
          type: object
          items:
            $ref: '#/components/schemas/typeField'
    typeStatus:
      description: Part of the response from /admin/operations where the operation
        is refreshConfiguration (for checking the consistency between the cached and
        stored configuration)
      type: object
      properties:
        version:
          description: The representation version (1).
          type: integer
        refreshRequired:
          description: Whether a refresh is required to update the cached configuration.
          type: boolean
        reindexRequired:
          description: Whether a re-index is required to update the cached configuration.
          type: boolean
        links:
          description: Zero or more links to related resources or operations. See
            the link relations table for a description of the link types.
          type: array
          items:
            $ref: '#/components/schemas/link'
    vertex:
      description: 'The response from /vertices/{type}/{identifier} as well as more
        generally a vertex within the context of the Network visualization'
      type: object
      properties:
        version:
          description: The representation version (2).
          type: integer
        id:
          description: The identifier of the vertex.
          type: string
        type:
          description: The object type of the vertex.
          type: string
        typeLabel:
          description: The localized display name of the object type.
          type: string
        compoundValues:
          description: The list of compound values if this vertex is a resolved object.
          type: array
          items:
            type: string
        label:
          description: The summary label for the vertex.
          type: string
        attachmentsCount:
          description: The number of attachments if the vertex is an internal or external
            object.
          type: integer
        adjacent:
          description: The number of vertices one edge away from this vertex.
          type: integer
        degree:
          description: The number of edges entering and leaving this vertex.
          type: integer
        adjacentByType:
          description: The adjacent count broken down by object type. The key is the
            object type name; the value is the adjacent count for that object type.
          type: object
        degreeByType:
          description: The degree count broken down by relationship type. The key
            is the relationship type name; the value is the degree count for that
            relationship type.
          type: object
        fields:
          description: The field values (according to the object type's graph configuration).
          type: array
          items:
            $ref: '#/components/schemas/summaryField'
        validFrom:
          description: The optional datetime that the vertex is valid from as an ISO
            formatted string.
          type: string
          format: date-time
        validTo:
          description: The optional datetime that the vertex is valid to as an ISO
            formatted string.
          type: string
          format: date-time
        selected:
          description: True if the vertex matches the selection criteria in the search
            request.
          type: boolean
        style:
          $ref: '#/components/schemas/objectTypeStyle'
    visualizationRequest:
      description: The visualization request parameters.
      type: object
      properties:
        type:
          description: The type of visualization. The value of this property determines
            which other properties are expected.
          type: string
          enum:
          - facets
          - hits
          - map
          - mapFeature
          - summary
          - table
          - timebar
          - timeline
    visualizationRequestOrder:
      description: The means by which the search results are to be ordered.
      type: object
      properties:
        type:
          description: 'The type of order. Accepted values are doc (provides a consistent
            order), field (orders by field values), and score (orders by relevance
            in relation to the query).'
          type: string
          enum:
          - doc
          - field
          - score
        direction:
          description: The order direction if the type is doc or score. The default
            value for doc is ascending while the default for score is descending.
          type: string
          enum:
          - ascending
          - descending
        fields:
          description: The fields to base the ordering on if the type is field.
          type: array
          items:
            $ref: '#/components/schemas/visualizationRequestOrderField'
    visualizationRequestOrderField:
      description: The configuration for ordering by the values in a single field.
      type: object
      properties:
        name:
          description: The name of the field.
          type: string
        entityType:
          description: The name of the object type containing the field.
          type: string
        direction:
          description: The order direction.
          type: string
          enum:
          - ascending
          - descending
    visualizationRequestTypeFacets:
      description: The request parameters for the Facets visualization that presents
        various facets for each object type found in the search. Each facet includes
        the hit counts per field value (or range of field values for numerical and
        date fields). Before this visualization can be requested, an administrator
        needs to define the facets for each type via the /admin/config endpoint.
      allOf:
      - $ref: '#/components/schemas/visualizationRequest'
      - type: object
        properties:
          types:
            description: 'The optional list of type names for restricting the facets
              that are returned. If missing, facets will be returned for all types
              found by the search.'
            type: array
            items:
              type: string
          mode:
            description: The Facets visualization mode. Accepted values are filter
              (highlights which filters are being used to drill into the results)
              and selection (highlights which filters are being used to mark results
              as selected).
            type: string
            enum:
            - filter
            - selection
    visualizationRequestTypeMap:
      description: The request parameters for the Map visualization that returns geo
        data in the form of events extracted from the objects found in the search.
        An event captures what, when, where information. Events are extracted from
        objects as they are indexed. Before this visualization can be requested and
        preferably before any data is indexed (data can always be re-indexed when
        events configuration changes), an administrator needs to define which events
        to extract from each object type via the /admin/config endpoint.
      allOf:
      - $ref: '#/components/schemas/visualizationRequest'
      - type: object
        properties:
          view:
            description: 'The optional view as a geo bounded box. In other words,
              with the top left and bottom right coordinates. The first entry in each
              coordinate array should be the longitude and the second entry should
              be the latitude.'
            type: array
            items:
              type: array
              items:
                type: number
          maxFeatures:
            description: 'The maximum number of features to return before the results
              are clustered. The default value is 10,000.'
            type: integer
    visualizationRequestTypeMapFeature:
      description: The request parameters for the Map Feature visualization that returns
        more detailed information about the features and events at a given location.
        For use in conjunction with the Map visualization.
      allOf:
      - $ref: '#/components/schemas/visualizationRequest'
      - type: object
        properties:
          lat:
            description: The latitude of the map feature (extracted from the Map visualization
              in an earlier search).
            type: number
          lon:
            description: The longitude of the map feature (extracted from the Map
              visualization in an earlier search).
            type: number
          maxEvents:
            description: The maximum number of events to include in the response.
              Used to limit the information returned when the map feature consists
              of multiple events all at the same location.
            type: integer
    visualizationRequestTypeSummary:
      description: The request parameters for the Summary visualization that returns
        a page of summary objects, one for each object found in the search. In order
        to get more meaningful information returned in each summary object, an administrator
        is required to configure the fields and highlighting sections for each type
        via the /admin/config endpoint. Clients can optionally specify a set of fields
        for each type using the 'fields' property.
      allOf:
      - $ref: '#/components/schemas/visualizationRequest'
      - type: object
        properties:
          start:
            description: 'The number of the first hit to include in the page of results.
              The very first hit is number 1, which is assumed if the parameter is
              missing from the request.'
            type: integer
          limit:
            description: 'The maximum number of hits to include in the page of results.
              The minimum acceptable value is 1 and the maximum is 2000. The default
              value is 50, which is assumed if the parameter is missing from the request.'
            type: integer
          order:
            $ref: '#/components/schemas/visualizationRequestOrder'
          fields:
            description: 'The set of fields to return grouped by object type. This
              overrides the fields configured by an administrator.'
            type: array
            items:
              $ref: '#/components/schemas/objectTypeFields'
    visualizationRequestTypeTable:
      description: |
        The request parameters for the Table visualization that returns the objects found in the search as a table where columns are fields and rows are hits. The columns can either be separately configured or supplied by the client.
          * When configured and results are viewed for multiple types, only the type and label columns are shown but a configurable number of columns are shown when viewing results of a single type. An administrator is therefore required to configure the columns for each type via the /admin/config endpoint before this visualization displays more detailed information. 
          * Alternatively, the client can optionally specify a set of fields for each type using the 'fields' property.
      allOf:
      - $ref: '#/components/schemas/visualizationRequest'
      - type: object
        properties:
          start:
            description: 'The number of the first hit to include in the page of results.
              The very first hit is number 1, which is assumed if the parameter is
              missing from the request.'
            type: integer
          limit:
            description: 'The maximum number of hits to include in the page of results.
              The minimum acceptable value is 1 and the maximum is 500. The default
              value is 50, which is assumed if the parameter is missing from the request.'
            type: integer
          order:
            $ref: '#/components/schemas/visualizationRequestOrder'
          fields:
            description: 'The set of fields to return grouped by object type. This
              overrides the fields configured by an administrator.'
            type: array
            items:
              $ref: '#/components/schemas/objectTypeFields'
    visualizationRequestTypeTimebar:
      description: The request parameters for the Time Bar visualization that returns
        the number of objects found in the search categorized by intervals of time
        where time-related data is in the form of events. An event captures what,
        when, where information. Events are extracted from objects as they are indexed.
        Before this visualization can be requested and preferably before any data
        is indexed (data can always be re-indexed when events configuration changes),
        an administrator needs to define which events to extract from each object
        type via the /admin/config endpoint. This visualization is intended to be
        presented as a date histogram with time on the X axis and the hit count on
        the Y axis. The X-axis units scale depending on the amount of time events
        between the earliest and latest date values.
      allOf:
      - $ref: '#/components/schemas/visualizationRequest'
      - type: object
        properties:
          startTimestamp:
            description: The ISO formatted string date value for the start of the
              view port. The earliest value in the results is used by default.
            type: string
            format: date-time
          endTimestamp:
            description: The ISO formatted string date value for the end of the view
              port. The latest value in the results is used by default.
            type: string
            format: date-time
          intervalCount:
            description: The maximum number of intervals the client can support. This
              value along with the time range is used to calculate the optimal interval
              size.
            type: integer
          geoEventsRequired:
            description: Whether the events must also contain geo data. The default
              value is false to include all time events. This setting is useful when
              displaying this visualization along side the Map visualization.
            type: boolean
    visualizationRequestTypeTimeline:
      description: The request parameters for the Time Line visualization that returns
        time-related data in the form of events extracted from the objects found in
        the search. An event captures what, when, where information. Events are extracted
        from objects as they are indexed. Before this visualization can be requested
        and preferably before any data is indexed (data can always be re-indexed when
        events configuration changes), an administrator needs to define which events
        to extract from each object type via the /admin/config endpoint. This visualization
        is intended to be presented as a series of charts or swim lanes, one per object,
        with time on the X axis and the events or swim lane entries relating to the
        current swim lane plotted at the appropriate points in time. The X axis units
        scale depending on the amount of swim lane entries between the earliest and
        latest date values. The swim lane entries can be individual events or clusters
        containing multiple events depending on the request parameters and the number
        of events within the same time interval.
      allOf:
      - $ref: '#/components/schemas/visualizationRequest'
      - type: object
        properties:
          start:
            description: 'The number of the first hit to include in the page of results.
              The very first hit is number 1, which is assumed if the parameter is
              missing from the request.'
            type: integer
          limit:
            description: 'The maximum number of hits to include in the page of results.
              The minimum acceptable value is 1 and the maximum is 500. The default
              value is 50, which is assumed if the parameter is missing from the request.'
            type: integer
          order:
            $ref: '#/components/schemas/visualizationRequestOrder'
          startTimestamp:
            description: The ISO formatted string date value for the start of the
              view port. The earliest value in the results is used by default.
            type: string
            format: date-time
          endTimestamp:
            description: The ISO formatted string date value for the end of the view
              port. The latest value in the results is used by default.
            type: string
            format: date-time
          intervalCount:
            description: The number of swim lane entries per interval of time to return
              un-clustered. The default value is 1.
            type: integer
          minimumClusterSize:
            description: The minimum number of events required to compose a single
              cluster. The default value is 2.
            type: integer
          paddingFactor:
            description: The amount of context relative to the horizontal view port
              as a multiple of the time range. This is to help clients with smoother
              scrolling.
            type: integer
    visualizationResponse:
      description: The visualization response parameters
      type: object
      properties:
        type:
          description: The type of visualization. The value of this property determines
            which other properties are expected.
          type: string
          enum:
          - facets
          - hits
          - map
          - mapFeature
          - summary
          - table
          - timebar
          - timeline
    visualizationResponseTypeFacets:
      description: The response parameters for the Facets visualization that presents
        various facets for each object type found in the search. Each facet includes
        the hit counts per field value (or range of field values for numerical and
        date fields). Before this visualization can be requested, an administrator
        needs to define the facets for each type via the /admin/config endpoint.
      allOf:
      - $ref: '#/components/schemas/visualizationRequestTypeFacets'
      - type: object
        properties:
          facets:
            description: The facets grouped by type.
            type: array
            items:
              $ref: '#/components/schemas/visualizationResponseTypeFacetsGroup'
    visualizationResponseTypeFacetsGroup:
      description: The facets for a single object type.
      type: object
      properties:
        objectType:
          description: The object type name. _all is used to denote global facets
            based on fields common to multiple types.
          type: string
        facets:
          description: The facets for the current type.
          type: array
          items:
            $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacet'
    visualizationResponseTypeFacetsGroupFacet:
      description: A group of facet results.
      type: object
      properties:
        type:
          description: The type of this facet object. The value of this property determines
            which other properties are expected.
          type: string
          enum:
          - dateRange
          - range
          - terms
          - type
    visualizationResponseTypeFacetsGroupFacetDate:
      description: A group of date range facet results.
      allOf:
      - $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacet'
      - type: object
        properties:
          field:
            description: The name of the field.
            type: string
          fieldLabel:
            description: The localized display name of the field.
            type: string
          accuracy:
            description: The accuracy of the filter or range parameters. Date values
              are adjusted to this accuracy level prior to being used in filters.
            type: string
            enum:
            - year
            - month
            - day
            - hour
            - minute
            - second
            - millisecond
          hitCount:
            description: The number of hits relevant to this facet.
            type: integer
          selectedHitCount:
            description: The subset of hits relevant to this facet that match the
              selection criteria in the search request.
            type: integer
          min:
            description: The minimum field value found in the matching objects.
            type: string
          max:
            description: The maximum field value found in the matching objects.
            type: string
          filter:
            $ref: '#/components/schemas/typeConfigurationFacetRangeFilter'
          userEnteredFilters:
            description: The collection of user entered filters for this field provided
              in the search request. Intended to be used to track the users filters
              without requiring server or client side caching of search requests.
            type: array
            items:
              $ref: '#/components/schemas/filter'
          ranges:
            description: The results for the configured ranges. The administrator
              is responsible for configuring these ranges appropriate to the data
              in the customer deployment should they want to provide hints as to which
              range filters might be useful to apply when drilling into search results.
            type: array
            items:
              $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacetDateRange'
    visualizationResponseTypeFacetsGroupFacetDateRange:
      description: The results for a pre-configured date range
      allOf:
      - $ref: '#/components/schemas/typeConfigurationFacetDateRange'
      - type: object
        properties:
          hitCount:
            description: The number of hits for the current range.
            type: integer
          selectedHitCount:
            description: The subset of hits for the current range that match the selection
              criteria in the search request.
            type: integer
          selected:
            description: True if the search request included a filter for this range.
            type: boolean
    visualizationResponseTypeFacetsGroupFacetNumerical:
      description: A group of numerical range facet results.
      allOf:
      - $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacet'
      - type: object
        properties:
          field:
            description: The name of the field.
            type: string
          fieldLabel:
            description: The localized display name of the field.
            type: string
          hitCount:
            description: The number of hits relevant to this facet.
            type: integer
          selectedHitCount:
            description: The subset of hits relevant to this facet that match the
              selection criteria in the search request.
            type: integer
          min:
            description: The minimum field value found in the matching objects.
            type: number
          max:
            description: The maximum field value found in the matching objects.
            type: number
          filter:
            $ref: '#/components/schemas/typeConfigurationFacetRangeFilter'
          userEnteredFilters:
            description: The collection of user entered filters for this field provided
              in the search request. Intended to be used to track the users filters
              without requiring server or client side caching of search requests.
            type: array
            items:
              $ref: '#/components/schemas/filter'
          ranges:
            description: The results for the configured ranges. The administrator
              is responsible for configuring these ranges appropriate to the data
              in the customer deployment should they want to provide hints as to which
              range filters might be useful to apply when drilling into search results.
            type: array
            items:
              $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacetNumericalRange'
    visualizationResponseTypeFacetsGroupFacetNumericalRange:
      description: The results for a pre-configured numerical range.
      allOf:
      - $ref: '#/components/schemas/typeConfigurationFacetNumericalRange'
      - type: object
        properties:
          hitCount:
            description: The number of hits for the current range.
            type: integer
          selectedHitCount:
            description: The subset of hits for the current range that match the selection
              criteria in the search request.
            type: integer
          selected:
            description: True if the search request included a filter for this range.
            type: boolean
    visualizationResponseTypeFacetsGroupFacetTerms:
      description: A group of terms facet results.
      allOf:
      - $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacet'
      - type: object
        properties:
          field:
            description: The name of the field.
            type: string
          fieldLabel:
            description: The localized display name of the field.
            type: string
          hitCount:
            description: The number of hits relevant to this facet.
            type: integer
          selectedHitCount:
            description: The subset of hits relevant to this facet that match the
              selection criteria in the search request.
            type: integer
          displayLimit:
            description: A limit on the number of buckets to display in a UI should
              the buckets list be greater than this limit. Intended to be set by the
              administrator if screen space is limited. There is a separately configurable
              hard limit to restrict the number of buckets returned.
            type: integer
          userEnteredFilters:
            description: The collection of user entered filters for this field provided
              in the search request. Intended to be used to track the users filters
              without requiring server or client side caching of search requests.
            type: array
            items:
              $ref: '#/components/schemas/filter'
          buckets:
            description: The results for this facet.
            type: array
            items:
              $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacetTermsBucket'
    visualizationResponseTypeFacetsGroupFacetTermsBucket:
      description: A bucket for the terms facet.
      type: object
      properties:
        term:
          description: The field value. This is usually a string but it can be a boolean
            or numerical value if the facet is configured for such a field.
          type: object
        hitCount:
          description: The number of hits for the current field value.
          type: integer
        selectedHitCount:
          description: The subset of hits for the field value that match the selection
            criteria in the search request.
          type: integer
        selected:
          description: True if the search request included a filter on the current
            field value.
          type: boolean
    visualizationResponseTypeFacetsGroupFacetType:
      description: A group of type facet results.
      allOf:
      - $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacet'
      - type: object
        properties:
          hitCount:
            description: The number of hits relevant to this facet.
            type: integer
          selectedHitCount:
            description: The subset of hits relevant to this facet that match the
              selection criteria in the search request.
            type: integer
          displayLimit:
            description: A limit on the number of buckets to display in a UI should
              the buckets list be greater than this limit. Intended to be set by the
              administrator if screen space is limited. There is a separately configurable
              hard limit to restrict the number of buckets returned.
            type: integer
          buckets:
            description: The results for this facet.
            type: array
            items:
              $ref: '#/components/schemas/visualizationResponseTypeFacetsGroupFacetTypeBucket'
    visualizationResponseTypeFacetsGroupFacetTypeBucket:
      description: A bucket for the type facet.
      type: object
      properties:
        type:
          description: The object type name.
          type: string
        typeLabel:
          description: The localized display name for the type.
          type: string
        hitCount:
          description: The number of hits for the current type.
          type: integer
        selectedHitCount:
          description: The subset of hits for the current type that match the selection
            criteria in the search request.
          type: integer
        selected:
          description: True if the search request included a filter on the current
            type.
          type: boolean
    visualizationResponseTypeHits:
      description: The response parameters for the Hits visualization that returns
        the number of objects that matched the search criteria broken down by type.
        Can be presented to the user as a histogram.
      allOf:
      - $ref: '#/components/schemas/visualizationResponse'
      - type: object
        properties:
          hitCount:
            description: The total number of objects that matched the search criteria.
            type: integer
          hitsPerType:
            description: The number of objects that matched the search criteria broken
              down by type. This is an array rather than a map to preserve the order
              of the results. Ordered by descending hit count.
            type: array
            items:
              $ref: '#/components/schemas/visualizationResponseTypeHitsCount'
    visualizationResponseTypeHitsCount:
      description: The hit count for a single object type
      type: object
      properties:
        type:
          description: The name of the object type.
          type: string
        hitCount:
          description: The number of objects of this type that matched the search
            criteria.
          type: integer
    visualizationResponseTypeMap:
      description: The response parameters for the Map visualization that returns
        geo data in the form of events extracted from the objects found in the search.
        An event captures what, when, where information. Events are extracted from
        objects as they are indexed. Before this visualization can be requested and
        preferably before any data is indexed (data can always be re-indexed when
        events configuration changes), an administrator needs to define which events
        to extract from each object type via the /admin/config endpoint.
      allOf:
      - $ref: '#/components/schemas/visualizationRequestTypeMap'
      - type: object
        properties:
          hitCount:
            description: The number of objects found in the search that contain geo
              events.
            type: integer
          eventCount:
            description: The number of geo events found in the search.
            type: integer
          featureCount:
            description: The number of features in the response.
            type: integer
          approxGlobalFeatureCount:
            description: An approximation for the total number of features in the
              indexed objects.
            type: integer
          features:
            $ref: '#/components/schemas/geoJsonFeatureCollection'
          clusters:
            description: The clusters when the results are clustered.
            type: array
            items:
              $ref: '#/components/schemas/visualizationResponseTypeMapCluster'
    visualizationResponseTypeMapCluster:
      description: A cluster of Map visualization results.
      type: object
      properties:
        geohash:
          description: The geo hash string representing the location of this cluster.
          type: string
        bounds:
          description: The geo bounded box (coordinates array) representing the location
            of this cluster.
          type: array
          items:
            type: array
            items:
              type: number
        count:
          description: The number of events in this cluster.
          type: integer
        selectedCount:
          description: The subset of events in this cluster that match the selection
            criteria in the search request.
          type: integer
    visualizationResponseTypeMapFeature:
      description: The response parameters for the Map Feature visualization that
        returns more detailed information about the features and events at a given
        location. For use in conjunction with the Map visualization.
      allOf:
      - $ref: '#/components/schemas/visualizationRequestTypeMapFeature'
      - type: object
        properties:
          features:
            $ref: '#/components/schemas/geoJsonFeatureCollection'
    visualizationResponseTypeSummary:
      description: The response parameters for the Summary visualization that returns
        a page of summary objects, one for each object found in the search. In order
        to get more meaningful information returned in each summary object, an administrator
        is required to configure the fields and highlighting sections for each type
        via the /admin/config endpoint. Clients can optionally specify a set of fields
        for each type using the 'fields' property.
      allOf:
      - $ref: '#/components/schemas/visualizationRequestTypeSummary'
      - type: object
        properties:
          hitCount:
            description: The total number of objects that matched the search criteria.
            type: integer
          results:
            description: The result objects for the requested page of hits.
            type: array
            items:
              $ref: '#/components/schemas/visualizationResponseTypeSummaryResult'
    visualizationResponseTypeSummaryResult:
      description: The result object for a single hit.
      type: object
      properties:
        id:
          description: The identifier of the object.
          type: string
        type:
          description: The type of the object.
          type: string
        typeLabel:
          description: The localized display name for the type.
          type: string
        compoundValues:
          description: The list of compound values if this summary is for a resolved
            object.
          type: array
          items:
            type: string
        label:
          description: The summary label for the object.
          type: string
        attachmentsCount:
          description: The number of attachments on the object if this summary is
            for an internal or external object.
          type: integer
        fields:
          description: The field values (according to the object type's summary configuration).
          type: array
          items:
            $ref: '#/components/schemas/summaryField'
        highlighting:
          description: The highlighted text fragments matching the search query keyed
            on the field name (according to the object type's summary configuration).
          type: object
    visualizationResponseTypeTable:
      description: The response parameters for the Table visualization that returns
        the objects found in the search as a table where columns are fields and rows
        are hits. When results are viewed for multiple types, only the type and label
        columns are shown but a configurable number of columns are shown when viewing
        results of a single type. In order to get more meaningful information returned
        in each table object, an administrator is required to configure the columns
        for each type via the /admin/config endpoint. Clients can optionally specify
        a set of fields for each type using the 'fields' property. In this case, a
        single column will be returned for fields with the same name and type. If
        one of those fields is masked, all of the values for that column are masked.
      allOf:
      - $ref: '#/components/schemas/visualizationRequestTypeTable'
      - type: object
        properties:
          hitCount:
            description: The total number of objects that matched the search criteria.
            type: integer
          columnHeadings:
            description: The columns for the requested page of hits.
            type: array
            items:
              $ref: '#/components/schemas/visualizationResponseTypeTableColumn'
          data:
            description: 'The row data for the requested page of hits. Each array
              entry represents a single row as a map keyed by field name (matching
              up with the column headings). All rows have an id data entry for their
              unique identifier. Rows relating to resolved entities have an additional,
              compoundValues data entry for their unique set of compound values.'
            type: array
            items: {}
    visualizationResponseTypeTableColumn:
      description: A column within the context of the Table visualization.
      type: object
      properties:
        field:
          description: The name of the field.
          type: string
        label:
          description: The localized display name for the field.
          type: string
        type:
          description: The type of field data.
          type: string
          enum:
          - boolean
          - date
          - double
          - float
          - integer
          - long
          - text
        masked:
          $ref: '#/components/schemas/maskedFieldConfiguration'
    visualizationResponseTypeTimebar:
      description: The response parameters for the Time Bar visualization that returns
        the number of objects found in the search categorized by intervals of time
        where time-related data is in the form of events. An event captures what,
        when, where information. Events are extracted from objects as they are indexed.
        Before this visualization can be requested and preferably before any data
        is indexed (data can always be re-indexed when events configuration changes),
        an administrator needs to define which events to extract from each object
        type via the /admin/config endpoints. This visualization is intended to be
        presented as a date histogram with time on the X axis and the hit count on
        the Y axis. The X-axis units scale depending on the amount of time events
        in the search results.
      allOf:
      - $ref: '#/components/schemas/visualizationRequestTypeTimebar'
      - type: object
        properties:
          hitCount:
            description: The number of objects found in the search that have time
              events.
            type: integer
          eventCount:
            description: The number of time events from the objects found in the search.
            type: integer
          globalMinTime:
            description: The ISO formatted string for the minimum time value found
              in the search results.
            type: string
            format: date-time
          globalMaxTime:
            description: The ISO formatted string for the maximum time value found
              in the search results.
            type: string
            format: date-time
          interval:
            description: The units for the X axis.
            type: string
            enum:
            - oneHundredYear
            - fiftyYear
            - tenYear
            - year
            - quarter
            - month
            - week
            - day
            - hour
            - minute
            - second
          intervalSize:
            description: The units for the X axis in milliseconds.
            type: integer
          timebarIntervals:
            description: The number of objects found in the search that have time
              events. This is an array rather than a map to preserve the time order
              of the results.
            type: array
            items:
              $ref: '#/components/schemas/visualizationResponseTypeTimebarInterval'
    visualizationResponseTypeTimebarInterval:
      description: An interval within the context of the Time Bar visualization.
      type: object
      properties:
        start:
          description: The ISO formatted string for the date time value.
          type: string
          format: date-time
        hitCount:
          description: The number of objects with events within this interval.
          type: integer
    visualizationResponseTypeTimeline:
      description: The response parameters for the Time Line visualization that returns
        time-related data in the form of events extracted from the objects found in
        the search. An event captures what, when, where information. Events are extracted
        from objects as they are indexed. Before this visualization can be requested
        and preferably before any data is indexed (data can always be re-indexed when
        events configuration changes), an administrator needs to define which events
        to extract from each object type via the /admin/config endpoint. This visualization
        is intended to be presented as a series of charts or swim lanes, one per object,
        with time on the X axis and the events or swim lane entries relating to the
        current swim lane plotted at the appropriate points in time. The X axis units
        scale depending on the amount of swim lane entries. The swim lane entries
        can be individual events or clusters containing multiple events depending
        on the request parameters and the number of events within the same time interval.
      allOf:
      - $ref: '#/components/schemas/visualizationRequestTypeTimeline'
      - type: object
        properties:
          interval:
            description: The units for the X axis.
            type: string
            enum:
            - oneHundredYear
            - fiftyYear
            - tenYear
            - year
            - quarter
            - month
            - week
            - day
            - hour
            - minute
            - second
          hitCount:
            description: The number of objects found in the search that have time
              events.
            type: integer
          eventCount:
            description: The number of time events from the objects found in the search.
            type: integer
          globalMinTime:
            description: The ISO formatted string for the minimum time value found
              in the search results.
            type: string
            format: date-time
          globalMaxTime:
            description: The ISO formatted string for the maximum time value found
              in the search results.
            type: string
            format: date-time
          minTime:
            description: The ISO formatted string for the minimum time value found
              in the current page of results.
            type: string
            format: date-time
          maxTime:
            description: The ISO formatted string for the maximum time value found
              in the current page of results.
            type: string
            format: date-time
          swimLanes:
            description: The objects found in the search that have time events.
            type: array
            items:
              $ref: '#/components/schemas/visualizationResponseTypeTimelineSwimLane'
          swimLaneEntries:
            description: The time events from the objects found in the search.
            type: array
            items:
              $ref: '#/components/schemas/event'
    visualizationResponseTypeTimelineSwimLane:
      description: A single swim lane in the context of the Time Line visualization.
      type: object
      properties:
        id:
          description: The unique identifier for the swim lane.
          type: string
        objectId:
          description: The identifier for the object.
          type: string
        objectType:
          description: The name of the object type.
          type: string
        objectTypeLabel:
          description: The localized display name for the object type.
          type: string
        label:
          description: The summary label for the object.
          type: string
        description:
          description: The summary description.
          type: string
        attachmentsCount:
          description: The number of attachments.
          type: integer
        selected:
          description: True if the object matches the selection criteria in the search
            request.
          type: boolean
  examples:
    analyticsCategoriesNestedCategories:
      description: 'The phrase member can be combined with category and used with
        /analytics/{jobId}/categories to retrieve the categories of results that were
        also extracted from the object(s) containing the specified phrase. This example
        shows the categories of results that were extracted from the same object(s)
        from which the `John Smith` person was resolved.'
      value: {"identifier": "4fa45829-9b75-49c8-99f7-ef15aa838e65", "level": {"category": "person",
          "phrase": "john smith"}, "categories": ["unigram", "bigram", "organization",
          "location", "significantTerm"], "fromAndTo": true, "errors": [], "links": []}
    analyticsCategoriesNextLevelCategories:
      description: 'A nextLevel member with its own category and phrase can be sent
        to /analytics/{jobId}/categories to retrieve the categories of results that
        were extracted from the same object(s) containing both the top-level phrase
        and next level phrase. This example shows the categories of results that were
        extracted from the same object(s) from which the `John Smith` person and `SAS`
        organization were resolved.'
      value: {"identifier": "4fa45829-9b75-49c8-99f7-ef15aa838e65", "level": {"category": "person",
          "phrase": "john smith", "nextLevel": {"category": "organization", "phrase": "sas"}},
        "categories": ["unigram", "bigram", "person", "location", "significantTerm"],
        "fromAndTo": true, "errors": [], "links": []}
    analyticsCategoriesTopLevelCategories:
      description: 'An empty request body can be used with /analytics/{jobId}/categories
        to retrieve the categories for which results were generated. This example
        is a response to such a request.'
      value: {"identifier": "4fa45829-9b75-49c8-99f7-ef15aa838e65", "categories": [
          "unigram", "bigram", "trigram", "person", "organization", "location", "significantTerm",
          "topic"], "fromAndTo": true, "errors": [], "links": [{"method": "POST",
            "rel": "self", "href": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/categories",
            "uri": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/categories",
            "type": "application/vnd.sas.sand.analytics.explore", "responseType": "application/vnd.sas.sand.analytics.categories"},
          {"method": "GET", "rel": "getJob", "href": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65",
            "uri": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65", "type": "application/vnd.sas.sand.analytics.job"},
          {"method": "GET", "rel": "getState", "href": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/state",
            "uri": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/state",
            "type": "text/plain"}, {"method": "PUT", "rel": "cancelJob", "href": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/state?value=cancelled",
            "uri": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/state?value=cancelled",
            "responseType": "text/plain"}, {"method": "DELETE", "rel": "deleteJob",
            "href": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65", "uri": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65"},
          {"method": "GET", "rel": "getIdentities", "href": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/identities",
            "uri": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/identities",
            "type": "application/vnd.sas.sand.analytics.explore", "responseType": "application/vnd.sas.sand.analytics.identities"},
          {"method": "POST", "rel": "getResults", "href": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/results",
            "uri": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/results",
            "type": "application/vnd.sas.sand.analytics.explore", "responseType": "application/vnd.sas.sand.analytics.results"},
          {"method": "POST", "rel": "getSankeyDiagram", "href": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/sankeyDiagrams",
            "uri": "/svi-sand/analytics/4fa45829-9b75-49c8-99f7-ef15aa838e65/sankeyDiagrams",
            "type": "application/vnd.sas.sand.analytics.sankey.diagram.request", "responseType": "application/vnd.sas.sand.analytics.sankey.diagram"},
          {"method": "GET", "rel": "getLocales", "href": "/svi-sand/analytics/locales",
            "uri": "/svi-sand/analytics/locales", "type": "application/vnd.sas.collection",
            "itemType": "application/vnd.sas.sand.analytics.locale"}, {"method": "POST",
            "rel": "startTextAnalytics", "href": "/svi-sand/analytics", "uri": "/svi-sand/analytics",
            "type": "application/vnd.sas.sand.analytics.request", "responseType": "application/vnd.sas.sand.analytics.job"}]}
    analyticsExploreNestedCategories:
      description: 'The phrase member can be combined with category and used with
        /analytics/{jobId}/categories to retrieve the categories of results that were
        also extracted from the object(s) containing the specified phrase. This example
        retrieves the categories of results that were extracted from the same objects
        from which the `John Smith` person was resolved.'
      value: {"level": {"category": "person", "phrase": "john smith"}}
    analyticsExploreNestedResults:
      description: 'The nextLevel member with its own category can be sent to /analytics/{jobId}/results
        to retrieve the results of the specified (next level) category that were extracted
        from the same object(s) containing the specified (top-level) phrase. This
        example retrieves the organization results that were extracted from the same
        objects from which the `John Smith` person was resolved.'
      value: {"level": {"category": "person", "phrase": "john smith", "nextLevel": {
            "category": "organization"}}}
    analyticsExploreNextLevelCategories:
      description: 'A nextLevel member with its own category and phrase can be sent
        to /analytics/{jobId}/categories to retrieve the categories of results that
        were extracted from the same object(s) containing both the top-level phrase
        and next level phrase. This example retrieves the categories of results that
        were extracted from the same objects from which the `John Smith` person and
        `SAS` organization were resolved.'
      value: {"level": {"category": "person", "phrase": "john smith", "nextLevel": {
            "category": "organization", "phrase": "sas"}}}
    analyticsExploreNextLevelResults:
      description: 'A second nextLevel member with its own category can be sent to
        /analytics/{jobId}/results to retrieve the results of the specified second
        next level category that were extracted from the same object(s) containing
        both the top-level phrase and next level phrase. This example retrieves the
        significantTerm results that were extracted from the same objects from which
        the `John Smith` person and `SAS` organization were resolved.'
      value: {"level": {"category": "person", "phrase": "john smith", "nextLevel": {
            "category": "organization", "phrase": "sas", "nextLevel": {"category": "significantTerm"}}}}
    analyticsExploreTopLevelCategories:
      description: 'An empty request body can be used with /analytics/{jobId}/categories
        to retrieve all the categories for which results were generated.'
      value: {}
    analyticsExploreTopLevelResults:
      description: 'The category member can be used on its own with /analytics/{jobId}/results
        to retrieve the results of a single category. This example retrieves the significant
        terms.'
      value: {"level": {"category": "significantTerm"}}
    analyticsIdentities:
      description: 'An example of the response from /analytics/{jobId}/identities
        containing the identities for the person, organization and location entities
        that were resolved by the text analytics job.'
      value: {"identifier": "4fa45829-9b75-49c8-99f7-ef15aa838e65", "identities": {
          "person": [{"name": "james robert smith", "frequencyCount": 23, "aliases": [
                {"name": "james robert smith", "frequencyCount": 14}, {"name": "james\
