          items:
            $ref: '#/components/schemas/centralityEdge'
    childObjectHighlighting:
      description: The part of the response from /highlighting that captures highlighting
        snippets for a single child object.
      type: object
      properties:
        id:
          description: The identifier of the child object.
          type: string
        name:
          description: The name of the child object.
