  /environments:
    get:
      operationId: getEnvironments
      summary: Get list of available execution environments
      description: Returns a list of all of the execution environments that are available
        to the user.
      tags:
      - Environments
      parameters:
      - name: start
        in: query
        description: Provides 0-based index of the first execution environment to
          return. Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Specifies the maximum number of environments to return in one
          page of results. The actual number of returned contexts can be less if the
          collection has been exhausted. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Specifies filter criteria for the returned execution environments.<br>\
          \ Filtering is supported on the name field. The supported functions are\
          \ and, or, not, in, eq, lt, le, gt, ge, contains, startsWith, endsWith,\
          \ and isNull. Some sample queries <ul> <li>Filter based on names starting\
          \ with 'env': /dataQuality/environments/{environmentName}/contexts?filter=startsWith(name,\
          \ 'env')</li> <li>Filter by name: /dataQuality/environments/{environmentName}/contexts?filter=eq(id,\
          \ 'context1')</li> <li>Filter for multiple names: /dataQuality/environments/{environmentName}/contexts?filter=in(name,\
          \ 'context1', 'context2', 'context3')</li> </ul>"
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Specifies sort criteria for the returned execution environments.<br>
          Sorting is supported on the name field. The default sort order is ascending
          on the name field. Some sample sorts <ul> <li>Sort ascending by name /dataQuality/environments/{environmentName}/contexts?sortBy=name:ascending</li>
          <li>Sort descending by name /dataQuality/environments/{environmentName}/contexts?sortBy=name:descending</li>
          </ul>
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. A list of available execution environments
            was returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/environmentCollection"
              examples:
                environmentCollection:
                  $ref: "#/paths/~1environments/get/responses/200/content/application~1json/examples/environmentCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/environmentCollection"
              examples:
                environmentCollection:
                  summary: Environments Collection response
