                type: string
          content:
            application/vnd.sas.data.quality.field.content.locale+json:
              schema:
                $ref: "#/components/schemas/fieldContentLocale"
              examples:
                fieldContentLocale:
                  $ref: "#/paths/~1fieldContentLocale/post/responses/201/content/application~1json/examples/fieldContentLocale"
            application/json:
              schema:
                $ref: "#/components/schemas/fieldContentLocale"
              examples:
                fieldContentLocale:
                  summary: Field content locale response
                  description: The field content locale response consists of details
                    for the newly created field content locale..
                  value:
                    version: 1
                    locale: ENUSA
                    language: English
                    country: United States
                    isBootstrappedLocale: Y
                    creationTimeStamp: 2022-01-04T18:48:58.737781Z
                    modifiedTimeStamp: 2022-01-04T18:48:58.737801Z
                    links:
                    - method: GET
                      rel: self
                      href: /dataQuality/fieldContentLocale/ENUSA
                      uri: /dataQuality/fieldContentLocale/ENUSA
                      type: application/vnd.sas.data.quality.field.content.locale
                    - method: GET
                      rel: up
                      href: /dataQuality/fieldContentLocale
                      uri: /dataQuality/fieldContentLocale
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.field.content.locale
                    - method: PUT
                      rel: update
                      href: /dataQuality/fieldContentLocale/ENUSA
                      uri: /dataQuality/fieldContentLocale/ENUSA
                      type: application/vnd.sas.data.quality.field.content.locale
                      responseType: application/vnd.sas.data.quality.field.content.locale
                    - method: DELETE
                      rel: delete
                      href: /dataQuality/fieldContentLocale/ENUSA
                      uri: /dataQuality/fieldContentLocale/ENUSA
        "400":
          description: The request was invalid. An invalid combination of request
            parameters was provided.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
