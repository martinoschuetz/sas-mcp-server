        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.data.quality.field.content.locale+json:
            schema:
              $ref: "#/components/schemas/fieldContentLocale"
            examples:
              fieldContentLocale:
                $ref: "#/paths/~1fieldContentLocale/post/requestBody/content/application~1json/examples/fieldContentLocale"
          application/json:
            schema:
              $ref: "#/components/schemas/fieldContentLocale"
            examples:
              fieldContentLocale:
