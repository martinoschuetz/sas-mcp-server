      description: Deletes a field content locale. Only user defined field content
        locale can be deleted. The out of the box field content locale cannot be deleted
        by the user.
      tags:
      - FieldContentLocale
      parameters:
      - name: locale
        in: path
        description: Specifies the locale value of the Field Content Locale.
        required: true
        schema:
          type: string
