---
openapi: 3.0.3
info:
  version: "3"
  title: Data Quality
  description: The Data Quality API retrieves information about locales, functions,
    definitions, and tokens provided by a Quality Knowledge Base (QKB).
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: QKB
  description: Contains the operations for the QKB resource.
- name: FieldContentLocale
  description: Contains the operations for field content locale list.
- name: Environments
  description: Contains the operations for execution environments.
- name: Contexts
  description: Contains the operations for execution contexts.
- name: Locale
  description: Contains the operations for the QKB locale resource.
- name: Function
  description: Contains the operations for QKB functions.
- name: Definitions
  description: Contains the operations for QKB definitions.
- name: Tokens
  description: Contains the operations for QKB tokens.
paths:
  /:
    get:
      operationId: root
      summary: Get a list top-level resource links
      description: Returns a list of top-level resource links provided by the Data
        Quality API.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded. A list of resources was returned.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                API:
                  $ref: "#/paths/~1/get/responses/200/content/application~1json/examples/API"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                API:
                  summary: Root API response
                  description: The root response consists of a collection of links
                    that can be used to navigate the Data Quality service API.
                  value:
                    version: 1
                    links:
                    - method: GET
                      rel: environments
                      href: /dataQuality/environments
                      uri: /dataQuality/environments
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.environment
                    - method: GET
                      rel: qkbs
                      href: /dataQuality/qkbs
                      uri: /dataQuality/qkbs
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.qkb
    head:
      operationId: headersForRoot
      summary: Get headers and verify that API is available
      description: Returns header information and verifies that the Data Quality API
        is running.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded. The Data Quality API is available and
            running.
  /qkbs:
    get:
      operationId: getAllQkbs
      summary: Get a list of all QKBs on all contexts
      description: Returns a list of all available QKBs on all execution contexts
        that are available to the user.
      tags:
      - QKB
      parameters:
      - name: start
        in: query
        description: 0-based index of first QKB to return. Defaults to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Specifies the maximum number of QKBs to return in a single page
          of results. The actual number of returned QKBs can be less if the collection
          has been exhausted. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Specifies filter criteria for the returned QKBs.<br> Filtering\
          \ is supported on the name, product, version, default, created, context,\
          \ and environment fields. The supported functions are and, or, not, in,\
          \ eq, lt, le, gt, ge, contains, startsWith, endsWith, and isNull. Some sample\
          \ queries <ul> <li>Filter by name starting with 'qkb': /dataQuality/environments/{environmentName}/contexts/{contextName}/qkbs?filter=startsWith(name,\
          \ 'qkb')</li> <li>Filter by name /dataQuality/environments/{environmentName}/contexts/{contextName}/qkbs?filter=eq(name,\
          \ 'qkb1')</li> <li>Filter for multiple QKBs /dataQuality/environments/{environmentName}/contexts/{contextName}/qkbs?filter=in(name,\
          \ 'qkb1', 'qkb2', 'qkb')</li> </ul>"
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Specifies sort criteria for the returned QKBs.<br> Sorting is
          supported on the name, product, version, default, created, context, and
          environment fields. The default sort order is  ascending on the name field.
          Some sample sorts <ul> <li>Sort ascending by name /dataQuality/environments/{environmentName}/contexts/{contextName}/qkbs?sortBy=name:ascending</li>
          <li>Sort descending by name /dataQuality/environments/{environmentName}/contexts/{contextName}/qkbs?sortBy=name:descending</li>
          </ul>
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. A list of available QKBs was returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/allQkbsCollection"
              examples:
                allQkbsCollection:
                  $ref: "#/paths/~1qkbs/get/responses/200/content/application~1json/examples/allQkbsCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/allQkbsCollection"
              examples:
                allQkbsCollection:
                  summary: QKBs Collection response
                  description: The QKBs response consists of a collection of qkbs
                    available on all execution environments.
                  value:
                    links:
                    - method: GET
                      rel: collection
                      href: /dataQuality/qkbs
                      uri: /dataQuality/qkbs
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.qkb
                    - method: GET
                      rel: self
                      href: /dataQuality/qkbs?start=0&limit=10&sortBy=name
                      uri: /dataQuality/qkbs?start=0&limit=10&sortBy=name
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.qkb
                    - method: GET
                      rel: up
                      href: /dataQuality/
                      uri: /dataQuality/
                      type: application/vnd.sas.api
                    name: qkbs
                    accept: application/vnd.sas.data.quality.qkb
                    items:
                    - version: "1"
                      name: QKB_USPOCH
                      product: CI
                      productVersion: v27
                      isDefault: false
                      creationTimeStamp: 2017-01-06T14:59:27Z
                      context: casqkb
                      environment: CAS
                      links:
                      - method: GET
                        rel: self
                        href: /dataQuality/environments/CAS/contexts/casqkb/qkbs/QKB_USPOCH
                        uri: /dataQuality/environments/CAS/contexts/casqkb/qkbs/QKB_USPOCH
                        type: application/vnd.sas.data.quality.qkb
                      - method: GET
                        rel: up
                        href: /dataQuality/environments/CAS/contexts/casqkb/qkbs
                        uri: /dataQuality/environments/CAS/contexts/casqkb/qkbs
                        type: application/vnd.sas.collection
                        itemType: application/vnd.sas.data.quality.qkb
                      - method: GET
                        rel: locales
                        href: /dataQuality/environments/CAS/contexts/casqkb/qkbs/QKB_USPOCH/locales
                        uri: /dataQuality/environments/CAS/contexts/casqkb/qkbs/QKB_USPOCH/locales
                        type: application/vnd.sas.collection
                        itemType: application/vnd.sas.data.quality.locale
                    - version: "1"
                      name: "31"
                      productVersion: v31
                      isDefault: true
                      context: a61e76ef-2bf9-4f87-9fbb-a85ad4b4f13f
                      environment: compute
                      links:
                      - method: GET
                        rel: self
                        href: /dataQuality/environments/compute/contexts/a61e76ef-2bf9-4f87-9fbb-a85ad4b4f13f/qkbs/31
                        uri: /dataQuality/environments/compute/contexts/a61e76ef-2bf9-4f87-9fbb-a85ad4b4f13f/qkbs/31
                        type: application/vnd.sas.data.quality.qkb
                      - method: GET
                        rel: up
                        href: /dataQuality/environments/compute/contexts/a61e76ef-2bf9-4f87-9fbb-a85ad4b4f13f/qkbs
                        uri: /dataQuality/environments/compute/contexts/a61e76ef-2bf9-4f87-9fbb-a85ad4b4f13f/qkbs
                        type: application/vnd.sas.collection
                        itemType: application/vnd.sas.data.quality.qkb
                      - method: GET
                        rel: locales
                        href: /dataQuality/environments/compute/contexts/a61e76ef-2bf9-4f87-9fbb-a85ad4b4f13f/qkbs/31/locales
                        uri: /dataQuality/environments/compute/contexts/a61e76ef-2bf9-4f87-9fbb-a85ad4b4f13f/qkbs/31/locales
                        type: application/vnd.sas.collection
                        itemType: application/vnd.sas.data.quality.locale
                    version: 2
  /fieldContentLocale:
    get:
      operationId: getFieldContentLocaleList
      summary: Get list of locales for field content analysis
      description: Returns a list of all available locale with corresponding language
        and country that support field content analysis.
      tags:
      - FieldContentLocale
      parameters:
      - name: start
        in: query
        description: Provides 0-based index of the first locale to return. Defaults
          to 0.
        schema:
          type: integer
      - name: limit
        in: query
        description: Specifies the maximum number of locale to return in one page
          of results. The actual number of returned locale can be less if the collection
          has been exhausted. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: "Specifies filter criteria for the returned locale.<br> Filtering\
          \ is supported on the language field. The supported functions are and, or,\
          \ not, in, eq, lt, le, gt, ge, contains, startsWith, endsWith, and isNull.\
          \ Some sample queries <ul> <li>Filter based on language starting with 'Eng':\
          \ /dataQuality/fieldContentLocale?filter=startsWith(language, 'Eng')</li>\
          \ <li>Filter by language: /dataQuality/fieldContentLocale?filter=eq(language,\
          \ 'English')</li> <li>Filter for multiple languages: /dataQuality/fieldContentLocale?filter=in(language,\
          \ 'English', 'French', 'German')</li> </ul>"
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: Specifies sort criteria for the returned field content locale.<br>
          Sorting is supported on the language field. The default sort order is ascending
          on the language field. Some sample sorts <ul> <li>Sort ascending by language
          /dataQuality/fieldContentLocale?sortBy=language:ascending</li> <li>Sort
          descending by language /dataQuality/fieldContentLocale?sortBy=language:descending</li>
          </ul>
        schema:
          type: string
          format: sort-criteria
      responses:
        "200":
          description: The request succeeded. A list of available field content locale
            is returned.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/fieldContentLocaleCollection"
              examples:
                fieldContentLocaleCollection:
                  $ref: "#/paths/~1fieldContentLocale/get/responses/200/content/application~1json/examples/fieldContentLocaleCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/fieldContentLocaleCollection"
              examples:
                fieldContentLocaleCollection:
                  summary: Field Content Locale Collection response
                  description: The field content locale response consists of a collection
                    of filed content locales available for Data Quality service.
                  value:
                    links:
                    - method: GET
                      rel: collection
                      href: /dataQuality/fieldContentLocale
                      uri: /dataQuality/fieldContentLocale
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.field.content.locale
                    - method: GET
                      rel: self
                      href: /dataQuality/fieldContentLocale?sortBy=language&start=0&limit=10
                      uri: /dataQuality/fieldContentLocale?sortBy=language&start=0&limit=10
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.data.quality.field.content.locale
                    - method: GET
                      rel: up
                      href: /dataQuality/
                      uri: /dataQuality/
                      type: application/vnd.sas.api
                    - method: POST
                      rel: create
                      href: /dataQuality/fieldContentLocale
                      uri: /dataQuality/fieldContentLocale
                      type: application/vnd.sas.data.quality.field.content.locale
                      responseType: application/vnd.sas.data.quality.field.content.locale
                    name: fieldContentLocale
                    accept: application/vnd.sas.data.quality.field.content.locale
                    items:
                    - version: 1
                      locale: ENUSA
                      language: English
                      country: United States
                      isBootstrappedLocale: Y
                      creationTimeStamp: 2022-01-04T18:48:58.737781Z
                      modifiedTimeStamp: 2022-01-04T18:48:58.737801Z
                      links:
                      - method: GET
                        rel: self
                        href: /dataQuality/fieldContentLocale/ENUSA
                        uri: /dataQuality/fieldContentLocale/ENUSA
                        type: application/vnd.sas.data.quality.field.content.locale
                      - method: GET
                        rel: up
                        href: /dataQuality/fieldContentLocale
                        uri: /dataQuality/fieldContentLocale
                        type: application/vnd.sas.collection
                        itemType: application/vnd.sas.data.quality.field.content.locale
                      - method: PUT
                        rel: update
                        href: /dataQuality/fieldContentLocale/ENUSA
                        uri: /dataQuality/fieldContentLocale/ENUSA
                        type: application/vnd.sas.data.quality.field.content.locale
                        responseType: application/vnd.sas.data.quality.field.content.locale
                      - method: DELETE
                        rel: delete
                        href: /dataQuality/fieldContentLocale/ENUSA
                        uri: /dataQuality/fieldContentLocale/ENUSA
                    version: 2
    post:
      tags:
      - FieldContentLocale
      summary: Create new field content locale
      description: Create a new field content locale with provided information.
      operationId: createFieldContentLocale
      parameters:
      - name: Accept
        in: header
        description: The requested representation of the response. The media type
