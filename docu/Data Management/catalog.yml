  /search:
    get:
      x-performance:
        medium:
          default: true
          conditions:
            $ref: "#/components/x-performance/medium/conditions"
          expect:
            $ref: "#/components/x-performance/medium/expect"
      operationId: getSearchResults
      summary: Get Search Results
      description: |
        Search for instances by name, potentially specifying wildcards ('*' for 0 or more characters, '?' for a single character).
        Search can return data from multiple indices each of which can contain different types of objects.
      tags:
      - Search
      parameters:
      - $ref: "#/paths/~1tags/get/parameters/0"
      - $ref: "#/paths/~1tags/get/parameters/1"
      - name: q
        required: true
        description: A pattern to use when matching the name of an instance.
        in: query
        schema:
          type: string
      - name: index
        required: false
        description: "The index or indices to search. If multiple indices are specified,\
          \ the index names must be separated with commas. This field is deprecated\
          \ - please use indices instead."
        in: query
        schema:
          type: array
          items:
            type: string
          default: catalog
        style: form
        explode: false
        deprecated: true
      - name: indices
        required: false
        description: "The index or indices to search. If multiple indices are specified,\
          \ the index names must be separated with commas."
        in: query
        schema:
          type: array
          items:
            type: string
          default: catalog
        style: form
        explode: false
      - name: timezone
        description: |
          The timezone of the query being searched. Timezones must be denoted by their TZ database names found in the IANA Timezone Database or their UTC offsets. Note: This query parameter is deprecated and timezone or time offset can be specified in the search query itself. If a timezone or time offset is included both via this parameter and in the search query then the value from the search query will be used.
        in: query
        required: false
        schema:
          type: string
          default: Etc/UTC
      - name: Accept
        in: header
        description: The desired representation for the response.
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.search.collection+json
          - application/json
          default: application/vnd.sas.metadata.search.collection+json
      - name: Accept-Item
        description: The desired item representation for collections.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.search.result+json
          - application/json
          default: application/vnd.sas.metadata.search.result+json
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
            application/vnd.sas.metadata.search.collection+json:
              schema:
                $ref: "#/components/schemas/searchResultCollection"
              examples:
                Search Result Collection:
                  $ref: "#/paths/~1search/get/responses/200/content/application~1json/examples/Search%20Result%20Collection"
            application/json:
              schema:
                $ref: "#/components/schemas/searchResultCollection"
              examples:
                Search Result Collection:
                  summary: Search Result Collection
                  description: Results for a search on 'BASEBALL' that returns a single
                    result.
                  value:
                    version: 2
                    accept: application/vnd.sas.metadata.search.result
                    count: 1
                    start: 0
                    limit: 10
                    name: catalogSearchResults
                    items:
                    - id: 0904b463-2366-2d4d-a43b-07578af2e9e8
                      version: 1
                      name: BASEBALL
                      type: sasTable
                      typeLabel: SAS Table
                      owner: sas
                      created: "2021-08-06T16:33:30.749Z"
                      modified: "2021-08-06T16:33:30.749Z"
                      score: 20.119299
                      attributes:
                        analysisTimeStamp: "2021-09-13T14:20:44.899Z"
                        columnCount: 24
                        completenessPercent: 98.473084886
                        dataSize: 196608
                        extension: sas7bdat
                        library: SASHELP
                        region: ""
                        reviewStatus: none
                        rowCount: 322
                        sourceSystem: SAS
                      links:
                      - method: GET
                        rel: self
                        href: /catalog/instances/0904b463-2366-2d4d-a43b-07578af2e9e8
                        uri: /catalog/instances/0904b463-2366-2d4d-a43b-07578af2e9e8
                        type: application/vnd.sas.metadata.instance.entity
                      - method: GET
                        rel: resource
                        href: /dataTables/dataSources/Compute~fs~c006f500-c10f-4db2-81c9-258f20b4d711~fs~SASHELP/tables/BASEBALL
                        uri: /dataTables/dataSources/Compute~fs~c006f500-c10f-4db2-81c9-258f20b4d711~fs~SASHELP/tables/BASEBALL
                        type: application/json
                    links:
                    - method: GET
                      rel: collection
                      href: /catalog/search
                      uri: /catalog/search
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.metadata.search.result
                    - method: GET
                      rel: self
                      href: /catalog/search?start=0&limit=10
                      uri: /catalog/search?start=0&limit=10
                      type: application/vnd.sas.collection
                      itemType: application/vnd.sas.metadata.search.result
                    - method: GET
                      rel: up
                      href: /catalog
                      uri: /catalog
                      type: application/vnd.sas.api
                    maxScore: 20.119299
        "400":
          $ref: "#/paths/~1tags/get/responses/400"
        "401":
          $ref: "#/paths/~1/get/responses/401"
        "403":
          $ref: "#/paths/~1tags/get/responses/403"
        "404":
          $ref: "#/paths/~1/get/responses/404"
        "406":
          $ref: "#/paths/~1/get/responses/406"
        "502":
          description: "Bad Gateway: The catalog service was unable to interact with\
            \ the search engine. More details may be available in the error object."
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/paths/~1definitions/post/responses/409/content/application~1vnd.sas.error%2Bjson/schema"
              examples:
                Search Engine Unavailable:
                  summary: Search Engine Unavailable
                  description: The search engine is unavailable.
                  value:
                    version: 2
                    httpStatusCode: 502
                    message: Bad Gateway
