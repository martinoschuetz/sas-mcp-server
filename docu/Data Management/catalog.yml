  /instances#archive:
    post:
      operationId: createOrUpdateInstanceArchive
      summary: Create or update objects from an archive
      description: |
        Create or updates objects from the given archive. Note that because this endpoint processes several kinds of operations, the application/json `Content-Type` header is not supported.
        An instance can not be both created and deleted in the same archive request. If an instance is to be created with an identifier and the identifier is then included in the `deletions` array then the instance will be created and the deletion will be ignored.
      tags:
      - Instances
      parameters:
      - name: Accept
        description: The desired item representation for the response. The default
          is application/vnd.sas.metadata.instance.archive+json
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.instance.archive+json
      - name: onConflict
        description: |
          Specifies how to handle objects in the body that already exist:
           * ignore: Default value, objects with ids that already exist are not updated and a 409 Conflict error is returned for each one.
           * update: Objects with ids that already exist are updated.
           * lookup: the same as "update", except for entities that contain non-existent ids and relationships using those ids as endpoints.
             A non-existent id in an entity will be treated as a placeholder id;
             if a unique entity exists for that definition/resourceId pair, that entity will be updated using the existing id and any relationship endpoints in this archive using the placeholder id will be changed to that existing id instead
             , and the response body will have the existing id instead of the placeholder id for that entity.
             If multiple entities exist for a definition/resourceId pair, no replacement will occur and a 409 Conflict error will be returned for that object.
        in: query
        schema:
          type: string
          enum:
          - lookup
          - update
          - ignore
          default: ignore
      - name: If-Unmodified-Since
        description: |
          The time after which any objects updated by this call cannot have been updated; a 412 (Precondition Failed) error will be returned for each object that has been modified after this time.
          The value must use the RFC 1123 time format (e.g. Fri, 01 Jan 1960 00:00:00 GMT); if an invalid value is specified, a 400 (Bad Request) error will be returned for each object that already exists.
          This value is required if the call wil update any existing objects, and ignored if the call will only create new objects; if this value is omitted, a 428 (Precondition Required) error will be returned for each object that already exists.
        in: header
        schema:
          type: string
      - name: transactional
        description: |
          Specifies how to handle errors that may occur in processing the instance archive. If true the entire request will fail if any error occurs while processing the instances within the request archive. No changes as part of the request will be persisted on failure. If false, then the service will do its best effort to process the instances within the request archive even when there are errors processing some instances. Defaults to false.
        in: query
        schema:
          type: boolean
      requestBody:
        content:
          application/vnd.sas.metadata.instance.archive+json:
