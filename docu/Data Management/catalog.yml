      summary: Get Search Indices
      description: |
        Returns a list of search index definitions.
        The properties that can be used as filter and sort criteria are:
          * id,
          * name,
          * label,
          * createdBy,
          * creationTimeStamp,
          * modifiedBy, and
          * modifiedTimeStamp
