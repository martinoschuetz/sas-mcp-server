  /search/suggestions:
    get:
      x-performance:
        medium:
          default: true
          conditions:
            $ref: "#/components/x-performance/medium/conditions"
          expect:
            $ref: "#/components/x-performance/medium/expect"
      operationId: getSearchSuggestions
      summary: Retrieve suggested values for searches on a given field
      description: |
        Get search suggestions for a given field in one or more of the indices provided. Suggestions are only available for fields with a keyword representation or both a text and keyword representation. Any other representations are not supported, and an error will be returned.
        The suggested values will be unique, and the most common values in the given field in the indices provided.
        Optionally a parameter q can be provided that acts as a prefix requirement for the values.
        This endpoint does not support the usual start parameter; pagination is not supported. The limit parameter serves to restrict the number of suggestions that are returned.
      tags:
      - Search
      parameters:
      - $ref: "#/paths/~1tags/get/parameters/1"
      - name: q
        description: A prefix to search values of the given field.
        in: query
        schema:
          type: string
      - name: field
        description: |
          A pattern to use when matching the field name of a suggestion.
          The field is required to have a keyword representation, otherwise no suggestions will be returned. This parameter is deprecated - please use facet instead.
        in: query
        required: true
        schema:
          type: string
        deprecated: true
      - name: facet
        description: |
          A pattern to use when matching the facet name of a suggestion.
          The facet is required to have a keyword representation, otherwise no suggestions will be returned.
        in: query
        required: true
        schema:
          type: string
      - $ref: "#/paths/~1search/get/parameters/3"
      - $ref: "#/paths/~1search/get/parameters/4"
      - $ref: "#/paths/~1tags/get/parameters/6"
      - name: Accept-Item
        description: The desired item representation for collections.
        in: header
        schema:
          type: string
          enum:
          - text/plain
          default: text/plain
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/suggestionCollection"
              examples:
                Search Suggestion Collection:
                  $ref: "#/paths/~1search~1suggestions/get/responses/200/content/application~1json/examples/Search%20Result%20Collection"
            application/json:
              schema:
                $ref: "#/components/schemas/suggestionCollection"
              examples:
                Search Result Collection:
                  summary: Search Suggestions Collection
                  description: Results for a suggestions on the field 'Status'.
                  value:
                    version: 2
                    accept: text/plain
                    start: 0
                    limit: 10
                    name: suggestions
                    items:
                    - none
                    - approved
                    - review
                    - flagged
                    - warning
                    - other
                    links:
                    - method: GET
                      rel: collection
                      href: /catalog/search/suggestions
                      uri: /catalog/search/suggestions
                      type: application/vnd.sas.collection
                      itemType: text/plain
                    - method: GET
                      rel: self
                      href: /catalog/search/suggestions?start=0&limit=10
                      uri: /catalog/search/suggestions?start=0&limit=10
                      type: application/vnd.sas.collection
                      itemType: text/plain
                    - method: GET
                      rel: up
                      href: /catalog/search
                      uri: /catalog/search
                      type: application/vnd.sas.metadata.search.collection
        "400":
          $ref: "#/paths/~1tags/get/responses/400"
        "401":
          $ref: "#/paths/~1/get/responses/401"
        "403":
          $ref: "#/paths/~1tags/get/responses/403"
        "404":
          $ref: "#/paths/~1/get/responses/404"
        "406":
          $ref: "#/paths/~1/get/responses/406"
        "502":
          $ref: "#/paths/~1search/get/responses/502"
  /search/favorites:
    post:
      x-performance:
        medium:
          default: true
          conditions:
            $ref: "#/components/x-performance/medium/conditions"
          expect:
            $ref: "#/components/x-performance/medium/expect"
      operationId: getFavorites
      summary: Get Search Results for a list of URIs
      description: |
        Return a Search Result for every URI in the input, or an error for any object that cannot be resolved in the search indices. Additionally can search service URIs in the vnd.sas.selection request body. When a folder URI is recognized in the selection, the catalog service enumerates the contents of the folder, and uses these URIs as the input in addition to the folder URI in the selection. Results are provided as a map of URIs to either a search result, or a corresponding error for that URI. Folder URIs will not be included but the URIs of all its members will. If none of the requested URIs are found, the overall response will be a 404. This operation does not support the "id" or "mixed" types of application/vnd.sas.selection; URIs matching the resourceId field of entities in the catalog must be provided.
      tags:
      - Search
      parameters:
      - $ref: "#/paths/~1search/get/parameters/3"
      - $ref: "#/paths/~1search/get/parameters/4"
      - $ref: "#/paths/~1search/get/parameters/2"
      - name: Content-Type
        required: true
        description: The representation in the request body.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.selection+json
          - application/json
          default: application/vnd.sas.selection+json
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/json
          default: application/json
      requestBody:
        content:
          application/vnd.sas.selection+json:
            schema:
              $ref: "#/paths/~1deletions/post/requestBody/content/application~1vnd.sas.selection%2Bjson/schema"
            examples:
              Bulk State:
                summary: Favorites request
                description: Return search result data for a list of resources that
                  may be in the catalog.
                value:
                  version: 1
