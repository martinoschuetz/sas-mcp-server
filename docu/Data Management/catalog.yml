      description: |
        For each given tag, performs a set of actions as specified in a JSON Patch. These actions are performed synchronously and transactionally.
        For every action, the patch must specify an operation (add or remove) and a target URI (for example, /members/resources or, empty to create a new tag). Each operation requires a valid representation for the value. If the operation removes all tag members from a given tag then the tag will be deleted.
        This endpoint currently supports adding entire Tag resources, but only supports the manipulation of the following Tag fields:
          - name (add only)
          - members (add only)
          - members.resources
      tags:
      - Tags
      parameters:
      - name: Content-Type
        required: true
        description: The representation in the request body.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.patch.archive+json
          - application/json
          default: application/vnd.sas.metadata.patch.archive+json
      - name: onConflict
        description: |
          Specifies how to handle tags in the body with ids that already exist.  If "update" is specified, those tags are updated.  Otherwise, those tags are not updated and a 409 Conflict error is returned for each one.
        in: query
        schema:
          type: string
          enum:
          - update
          - ignore
          default: ignore
      - name: If-Unmodified-Since
        description: |
          The time after which any tags updated by this call cannot have been updated; a 412 (Precondition Failed) error will be returned for each tag that has been modified after this time.
          The value must use the RFC 1123 time format (e.g. Fri, 01 Jan 1960 00:00:00 GMT); if an invalid value is specified, a 400 (Bad Request) error will be returned for each tag that already exists.
          This value is required if the call wil update any existing tags, and ignored if the call will only create new tags; if this value is omitted, a 428 (Precondition Required) error will be returned for each tag that already exists.
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/vnd.sas.metadata.patch.archive+json:
            schema:
              $ref: "#/components/schemas/tagPatchArchive"
            examples:
              Patch Tag:
                $ref: "#/paths/~1tags/patch/requestBody/content/application~1json/examples/Patch%20Tag"
          application/json:
            schema:
              $ref: "#/components/schemas/tagPatchArchive"
            examples:
              Patch Tag:
                summary: Tag Patch Request
                description: |
                  The example displays the different type of operations that can be performed on Tag resources with the PATCH request. The request supports the ability to create a new Tag resource, to overwrite the `members` property of a Tag resource, to add or remove `resources` from the `members` property, and lastly to delete a Tag resource. Furthermore, multiple patch operations can be performed on a single Tag resource within a request.
