  /instances#download:
    get:
      x-performance:
        medium:
          default: true
          conditions:
            $ref: "#/components/x-performance/medium/conditions"
          expect:
            $ref: "#/components/x-performance/medium/expect"
      operationId: downloadInstances
      summary: Download instances
      description: |
        Downloads resulting metadata for instances. The `level` query parameter indicates the level or degree of complexity of the metadata to return in the response. Each of the levels provides the returned metadata in different tabular structures.
        The properties that can be used as filter and sort criteria are:
          * id,
          * name,
          * label,
          * description,
          * type,
          * createdBy,
          * creationTimeStamp,
          * modifiedBy,
          * modifiedTimeStamp,
          * definition,
          * resourceId,
          * endpoint1Id, and
          * endpoint2Id
      tags:
      - Instances
      parameters:
      - $ref: "#/paths/~1tags/get/parameters/0"
      - $ref: "#/paths/~1tags/get/parameters/1"
      - $ref: "#/paths/~1tags/get/parameters/2"
      - $ref: "#/paths/~1tags/get/parameters/3"
      - name: level
        in: query
        description: The level or degree of complexity of metadata to be included.
        schema:
          type: string
          format: enumeration
          enum:
          - dataDictionary
          - dataDictionaryAndProfile
          - detailedMetrics
          default: dataDictionary
      - name: delimiter
        in: query
        description: |
          The delimiter to use to separate individual fields within a row. Defaults to comma (","). Note that the encoded value will need to be provided for semi-colon (i.e. `%3B`).
        schema:
          type: string
          format: enumeration
          enum:
          - ","
          - ;
          default: ","
      - name: prefix
        in: query
        description: |
          A consumer-provided prefix to include on any downloaded file name. Max length is 50 characters and can only contain alphanumeric characters, hyphen (-), or an underscore (_).
        schema:
          type: string
      - name: dateTimeStampSuffix
        in: query
        description: Indicates whether to include a date timestamp as a suffix on
          any downloaded file name. Defaults to true.
        schema:
          type: boolean
          default: true
      - name: Accept
        description: The desired representation for the response. Defaults to text/csv.
        in: header
        schema:
          type: string
          enum:
          - text/csv
          default: text/csv
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
            Content-Disposition:
              description: |
                Indicates if the content is expected to be displayed inline in the browser or as an attachment that is downloaded and saved locally.
              schema:
                type: string
            Content-Length:
              $ref: "#/paths/~1instances~1search/get/responses/200/headers/Content-Length"
            Content-Encoding:
              $ref: "#/paths/~1instances~1search/get/responses/200/headers/Content-Encoding"
          content:
            text/csv:
              schema:
                type: string
              examples:
                Instances Download - dataDictionary:
                  $ref: "#/paths/~1instances~1search/get/responses/200/content/text~1csv/examples/Instances%20Download%20-%20dataDictionary"
                Instances Download - dataDictionaryAndProfile:
                  $ref: "#/paths/~1instances~1search/get/responses/200/content/text~1csv/examples/Instances%20Download%20-%20dataDictionaryAndProfile"
                Instances Download - detailedMetrics:
                  $ref: "#/paths/~1instances~1search/get/responses/200/content/text~1csv/examples/Instances%20Download%20-%20detailedMetrics"
        "400":
          $ref: "#/paths/~1tags/get/responses/400"
        "401":
