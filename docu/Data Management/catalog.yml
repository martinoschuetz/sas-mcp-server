  /instances#metadataArchive:
    post:
      operationId: createOrUpdateForMetadataArchive
      x-sas-internal: true
      summary: Create or update catalog instances based on a metadata archive
      description: |
        Create or update catalog instances based on a metadata archive. The metadata archive is a sparsley populated collection of entities, relationships, and classifications related to a subject resource. The metadata archive will be added to an event queue for processing.  Note that because this endpoint processes several kinds of operations, the application/json `Content-Type` header is not supported.
        Processing of the archive includes filling in the details of the archive by either looking up existing entities and relationships and/or requesting summary information (application/vnd.sas.summary) via a REST request for each entity. For this reason, all referenced entities must have a URI relative to the current Viya deployment or be a non-relative URI. A non-relative URI will not begin with a '/'.
      tags:
      - Instances
      parameters:
      - name: Content-Type
        required: true
        description: The representation in the request body.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.metadata.archive+json
      requestBody:
        content:
          application/vnd.sas.metadata.archive+json:
            schema:
              title: Metadata Archive
              description: "Collection of metadata objects, separated by catalog instance\
                \ type."
              type: object
              x-sas-media-type:
                name: application/vnd.sas.metadata.archive
                version: 1
              properties:
                anchor:
                  title: Anchor
                  description: The object that owns the lifecycle and manages entities
                    and classifications defined in this archive.
                  type: object
                  properties:
                    instanceId:
                      description: The catalog id of the service object that manages
                        this archive.
                      type: string
                    uri:
                      description: The URI of the service object that manages this
                        archive.
                      type: string
                classifications:
                  description: An array that contains classification instances.
                  items:
                    title: Classification Instance
                    description: The classification in metadata used to categorize
                      entities.
                    type: object
                    allOf:
                    - $ref: "#/paths/~1instances%23metadataArchive/post/requestBody/content/application~1vnd.sas.metadata.archive%2Bjson/schema/properties/entities/items/allOf/0"
                    - properties:
                        entities:
                          description: The entities to apply this classification.
                            This is used where this is a new classification instance
                            for entities.
                          items:
                            description: The entity uri for any entity to apply this
                              classification to.
                            type: string
                          type: array
                      type: object
                  type: array
                entities:
                  description: An array that contains entity instances.
                  items:
                    title: Entity Instance
                    description: The entity object in metadata with a URI to describe
                      the source of metadata.
                    type: object
                    allOf:
                    - title: Metadata Instance
                      description: The basic metadata properties present on all instances
                        with pointer to definition.
                      type: object
                      allOf:
                      - title: Metadata Summary
                        description: The basic metadata properties present on all
                          objects.
                        type: object
                        properties:
                          createdBy:
                            description: The identity that created this object. The
                              value is ignored on input.
                            readOnly: true
                            type: string
                          creationTimeStamp:
                            description: "The date and time this object was created,\
                              \ in the format of YYYY-MM-DDThh:mm:ss.sssZ. The value\
                              \ is ignored on input."
                            format: date-time
                            readOnly: true
                            type: string
                          description:
                            description: The user description of this instance of
                              metadata; the maximum length is 1000.
                            type: string
                          label:
                            description: The user-facing name of this object; the
                              maximum length is 100. Sometimes called the business
                              label.
                            type: string
                          modifiedBy:
                            description: the identity that modified this object last.
                              The value is ignored on input.
                            readOnly: true
                            type: string
                          modifiedTimeStamp:
                            description: "The date and time this object was last modified,\
                              \ in the format of YYYY-MM-DDThh:mm:ss.sssZ. The value\
                              \ is ignored on input."
                            format: date-time
                            readOnly: true
                            type: string
                          name:
                            description: The system name of this object; the maximum
                              length is 100.
                            type: string
                          type:
                            description: The type of resource this metadata represents.
                              Usually the "name" of the type registered in the types
                              API for this object instance.
                            type: string
                          version:
                            description: This media type's schema version number.
                              This representation is version 1.
                            readOnly: true
                            type: integer
                        required:
                        - type
                      - properties:
                          anchor:
                            $ref: "#/paths/~1instances%23metadataArchive/post/requestBody/content/application~1vnd.sas.metadata.archive%2Bjson/schema/properties/anchor"
                          attributes:
                            additionalProperties: true
                            description: The attributes represented as keys with values;
                              the maximum length of the key is 100 and the maximum
                              length of the value is 1000.
                            type: object
                          definitionId:
                            description: "The catalog definition id for this instance\
                              \ of an entity, relationship, or classification."
                            type: string
                          instanceId:
                            description: "The catalog instance id for this instance\
                              \ of an entity, relationship, or classification."
                            type: string
                        type: object
                    - properties:
                        classifications:
                          description: The classifications to apply to this entity.
                          items:
                            description: The classification by name to apply to this
                              entity.
                            type: string
                          type: array
                        uri:
                          description: The URI of the resource that this instance
                            represents.
                          type: string
                      required:
                      - uri
                      type: object
                  type: array
                relationships:
                  description: An array that contains relationship instances.
                  items:
                    title: Relationship Instance
                    description: The instance of a relationship definition which relates
                      two instances.
                    type: object
                    allOf:
                    - $ref: "#/paths/~1instances%23metadataArchive/post/requestBody/content/application~1vnd.sas.metadata.archive%2Bjson/schema/properties/entities/items/allOf/0"
                    - properties:
                        endpoint1Id:
                          description: The catalog instance identity for the endpoint.
                          type: string
                        endpoint1Uri:
                          description: The URI of the first entity endpoint.
                          type: string
                        endpoint2Id:
                          description: The catalog instance identity for the endpoint.
                          type: string
                        endpoint2Uri:
                          description: The URI of the second entity endpoint.
                          type: string
                      required:
                      - endpoint1Uri
                      - endpoint2Uri
                      type: object
                  type: array
                version:
                  description: This media type's schema version number. This representation
                    is version 1.
                  readOnly: true
                  type: integer
            examples:
              Metadata Archive:
                summary: Metadata Archive Request
                description: Create or update catalog instances based on a metadata
                  archive.
                value:
                  anchor:
                    uri: /dataFlows/dataFlows/73515871-f990-4b05-a034-322751ca9428
                  entities:
                  - creationTimeStamp: "0001-01-01T00:00:00Z"
                    modifiedTimeStamp: "0001-01-01T00:00:00Z"
                    anchor:
                      uri: /dataTables/dataSources/Compute~fs~57145902-e8dc-4c87-8295-31b291838831~fs~SASHELP/tables/BASEBALL
                    name: BASEBALL
                    label: 1986 Baseball Data
                    type: sasTable
                    uri: /dataTables/dataSources/Compute~fs~57145902-e8dc-4c87-8295-31b291838831~fs~SASHELP/tables/BASEBALL
                  - creationTimeStamp: "2022-12-02T09:09:52.876Z"
                    modifiedTimeStamp: "2022-12-02T09:09:52.876Z"
                    attributes:
                      creator: sasuser
                      dateCreated: "2022-12-02T09:09:52.876Z"
                      dateModified: "2022-12-02T09:09:52.876Z"
                      editor: sasuser
                      stepCount: 3
                    instanceId: 73515871-f990-4b05-a034-322751ca9428
                    name: BaseballFilteredFlow_FedContent.flw
                    label: BaseballFilteredFlow_FedContent.flw
                    type: dataFlow
                    version: 1
                    uri: /dataFlows/dataFlows/73515871-f990-4b05-a034-322751ca9428
                  relationships:
                  - creationTimeStamp: "0001-01-01T00:00:00Z"
                    modifiedTimeStamp: "0001-01-01T00:00:00Z"
                    type: processAssets
                    version: 1
                    endpoint1Uri: /dataFlows/dataFlows/73515871-f990-4b05-a034-322751ca9428
                    endpoint2Uri: /dataTables/dataSources/Compute~fs~57145902-e8dc-4c87-8295-31b291838831~fs~SASHELP/tables/BASEBALL
                  version: 1
      responses:
        "202":
          description: |
            The request was accepted, and the archive was queued for processing.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
        "400":
          $ref: "#/paths/~1tags/get/responses/400"
        "401":
          $ref: "#/paths/~1/get/responses/401"
        "403":
          $ref: "#/paths/~1tags/get/responses/403"
        "406":
          $ref: "#/paths/~1/get/responses/406"
        "415":
          $ref: "#/paths/~1bots/post/responses/415"
  /instances#view:
    post:
      operationId: queryArchive
      summary: Get an archive of objects based on a view
      description: "Get an archive of objects based on a view. Note that because this\
        \ endpoint processes several kinds of operations, the application/json Content-Type\
        \ header is not supported."
      tags:
      - Instances
      parameters:
      - name: Accept
        description: The desired item representation for the response. The default
          is application/vnd.sas.metadata.instance.archive+json
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.instance.archive+json
          - application/json
      requestBody:
        content:
          application/vnd.sas.metadata.instance.query+json:
            schema:
              $ref: "#/components/schemas/instanceArchiveParameters"
            examples:
              Query parameters:
                summary: Query parameters with an included query
                description: |
                  Return an instance archive based on an existing view.
                  The specified view finds a dataset (labeled 't') with a specific ID that is identified in the parameters map. From that table, the view traverses the dataSetDataFields relationship to find dataFields that are related to the table.
                  The return clause in the query indicates that the table, the columns, and the relationships between them are to be included in the archive returned by the query.
                value:
                  version: 1
                  query: "match (t:dataset)-[r:dataSetDataFields]->(c:dataField) return\
                    \ t,r,c"
                  parameters:
                    t:
                      id: 5f30466f-b406-4eaf-a944-23281716006c
      responses:
        "200":
          description: |
            The request succeeded. The archive may be empty, based on the query and the contents of the catalog service.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
