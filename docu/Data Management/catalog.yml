  /instances#upload:
    post:
      x-performance:
        medium:
          default: true
          conditions:
            $ref: "#/components/x-performance/medium/conditions"
          expect:
            $ref: "#/components/x-performance/medium/expect"
      operationId: uploadInstances
      summary: Upload instances metadata to CAS
      description: |
        Uploads resulting metadata for instances to CAS. The `level` query parameter indicates the level or degree of complexity of the metadata to return in the response. Each of the levels provides the returned metadata in different tabular structures.  Note that because this endpoint processes several kinds of operations, the application/json Content-Type header is not supported.
        The properties that can be used as filter and sort criteria are:
          * id,
          * name,
          * label,
          * description,
          * type,
          * createdBy,
          * creationTimeStamp,
          * modifiedBy,
          * modifiedTimeStamp,
          * definition,
          * resourceId,
          * endpoint1Id, and
          * endpoint2Id
      tags:
      - Instances
      parameters:
      - $ref: "#/paths/~1tags/get/parameters/0"
      - $ref: "#/paths/~1tags/get/parameters/1"
      - $ref: "#/paths/~1tags/get/parameters/2"
      - $ref: "#/paths/~1tags/get/parameters/3"
      - name: Content-Type
        required: true
        description: The representation in the request body.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.instance.upload.request+json
      - name: Accept
        description: The desired representation for the response. The default is application/vnd.sas.metadata.instance.upload.request+json.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.instance.upload.request+json
          default: application/vnd.sas.metadata.instance.upload.request+json
      requestBody:
        content:
          application/vnd.sas.metadata.instance.upload.request+json:
            schema:
              title: Instances Upload Request
              description: |
                A request to export metadata and upload to CAS. Options are available to specify the type and format of the metadata.
              type: object
              properties:
                version:
                  type: integer
                  description: The version of the media type.
                level:
                  description: The level or degree of complexity of metadata to be
                    included.
                  type: string
                  format: enumeration
                  enum:
                  - dataDictionary
                  - dataDictionaryAndProfile
                  - detailedMetrics
                  default: dataDictionary
                prefix:
                  type: string
                  description: |
                    A consumer-provided prefix to include on any downloaded file name. Max length is 50 characters and can only contain alphanumeric characters, hyphen (-), or an underscore (_).
                dateTimeStampSuffix:
                  type: boolean
                  description: Indicates whether to include a date timestamp as a
                    suffix on any downloaded file name. Defaults to true.
                  default: true
                serverName:
                  type: string
                  description: The name of the server to upload metadata.
                caslibName:
                  type: string
                  description: The name of the caslib to upload metadata.
                links:
                  type: array
                  description: The links that apply to the object. The value is ignored
                    on input.
                  items:
                    $ref: "#/components/schemas/tag/properties/links/items"
                  readOnly: true
            examples:
              Instances Upload Request:
                summary: Instances Upload Request
                description: Upload request for results in data dictionary format.
                value:
                  level: dataDictionary
                  prefix: catalog
                  dateTimeStampSuffix: true
                  serverName: cas-shared-default
                  caslibName: Public
      responses:
        "201":
          description: Created.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
            Location:
              $ref: "#/paths/~1tags/post/responses/201/headers/Location"
          content:
            application/vnd.sas.metadata.instance.upload.request+json:
              schema:
                $ref: "#/paths/~1instances%23upload/post/requestBody/content/application~1vnd.sas.metadata.instance.upload.request%2Bjson/schema"
              examples:
                Instances Upload:
                  $ref: "#/paths/~1instances%23upload/post/responses/201/content/application~1json/examples/Instances%20Upload"
            application/json:
              schema:
                $ref: "#/paths/~1instances%23upload/post/requestBody/content/application~1vnd.sas.metadata.instance.upload.request%2Bjson/schema"
              examples:
                Instances Upload:
                  summary: Instances Upload Response
                  description: Upload response for results in data dictionary format.
                  value:
                    level: dataDictionary
                    prefix: catalog
                    dateTimeStampSuffix: true
                    serverName: cas-shared-default
                    caslibName: Public
                    links:
                    - method: GET
                      rel: self
                      href: /dataTables/dataSources/cas~fs~cas-shared-default~fs~Public/tables/DMDICTIONARY_2023-09-05T000000Z
                      uri: /dataTables/dataSources/cas~fs~cas-shared-default~fs~Public/tables/DMDICTIONARY_2023-09-05T000000Z
                      type: application/vnd.sas.data.table
        "400":
          $ref: "#/paths/~1tags/get/responses/400"
        "401":
          $ref: "#/paths/~1/get/responses/401"
        "403":
          $ref: "#/paths/~1tags/get/responses/403"
        "404":
          $ref: "#/paths/~1/get/responses/404"
        "406":
          $ref: "#/paths/~1/get/responses/406"
        "415":
          $ref: "#/paths/~1bots/post/responses/415"
        "500":
          $ref: "#/paths/~1bots/get/responses/500"
