  /instances/search:
    get:
      x-sas-internal: true
      x-performance:
        medium:
          default: true
          conditions:
            $ref: "#/components/x-performance/medium/conditions"
          expect:
            $ref: "#/components/x-performance/medium/expect"
      operationId: downloadSearchResults
      summary: Download CSV for search results
      description: |
        Downloads resulting metadata for instances found via search query, returned as CSV. This endpoint combines the functionality of the search endpoint with the CSV download capabilities of the instances download endpoint. Results are returned in the same order as the search relevance ranking.
        The `q` parameter accepts search patterns using wildcards ('*' for 0 or more characters, '?' for a single character) to match instance names.
        The `level` query parameter indicates the level or degree of complexity of the metadata to return in the response. Each of the levels provides the returned metadata in different tabular structures, identical to the instances download endpoint.
      tags:
      - Instances
      parameters:
      - $ref: "#/paths/~1tags/get/parameters/0"
      - $ref: "#/paths/~1tags/get/parameters/1"
      - $ref: "#/paths/~1search/get/parameters/2"
      - name: level
        in: query
        description: The level or degree of complexity of metadata to be included.
        schema:
          type: string
          format: enumeration
          enum:
          - dataDictionary
          - dataDictionaryAndProfile
          - detailedMetrics
          default: dataDictionaryAndProfile
      - name: delimiter
        in: query
        description: |
          The delimiter to use to separate individual fields within a row. Defaults to comma (","). Note that the encoded value will need to be provided for semi-colon (i.e. `%3B`).
        schema:
          type: string
          format: enumeration
          enum:
          - ","
          - ;
          default: ","
      - name: Accept
        description: The desired representation for the response. Must be text/csv.
        in: header
        required: true
        schema:
          type: string
          enum:
          - text/csv
          default: text/csv
      responses:
        "200":
          description: OK. CSV containing search results metadata in the same order
            as search relevance ranking.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
            Content-Length:
              description: Indicates the size of the message body (in bytes).
              schema:
                type: string
            Content-Encoding:
              description: Lists any encodings (comma separated) that have been applied
                to the message payload and in what order.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
