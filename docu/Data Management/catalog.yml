---
openapi: 3.0.3
info:
  version: "5"
  title: Catalog
  description: |
    The Catalog API allows for the discovery, creation, and integration of metadata. This allows management of information about other information.
  termsOfService: "https://www.sas.com/en_us/legal/copyright.html"
  contact:
    name: SAS Developers
    email: devex@sas.com
    url: "https://developer.sas.com"
servers:
- url: "http://example.com/catalog"
  description: The Catalog API server.
tags:
- name: Root
  description: The API root.
- name: Search
  description: Searching for instances.
- name: Instances
  description: Instance lifecycle management.
- name: Type Definitions
  description: Type Definition lifecycle management.
- name: Search Indices
  description: Search Index lifecycle management.
- name: Views
  description: View definition lifecycle management.
- name: Agents
  description: Agent lifecycle management.
- name: Tags
  description: Tag lifecycle management.
- name: Locks
  description: Lock lifecycle management.
- name: Lineage
  description: Retrieve lineage for instances.
- name: Deletions
  description: Bulk deletion of objects.
paths:
  /:
    head:
      operationId: headersForRoot
      summary: Get the headers for top-level resource links
      description: |
        Returns the headers for a list of top-level resource links provided by the Catalog API.  This can also be used to verify that the service is available.
      tags:
      - Root
      parameters:
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.api+json
          - application/json
          default: application/vnd.sas.api+json
      responses:
        "200":
          description: OK.
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
        "401":
          $ref: "#/paths/~1/get/responses/401"
        "404":
          $ref: "#/paths/~1/get/responses/404"
        "406":
          $ref: "#/paths/~1/get/responses/406"
    get:
      operationId: root
      summary: Get top-level resource links
      description: Returns a list of top-level resource links provided by the Catalog
        API.
