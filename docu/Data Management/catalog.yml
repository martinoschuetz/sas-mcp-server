  /definitions:
    get:
      operationId: getTypeDefinitions
      summary: Get Type Definitions
      description: |
        Returns a list of type definitions.
        The collection may contain different kinds of type definitions (e.g. attribute, classification, entity, and relationship type definitions); the 'definitionType' field can be used to determine the type.
        The kind of type definitions in the collection can also be controlled via the 'Accept-Item' header.
        The properties that can be used as filter and sort criteria are:
          * id,
          * name,
          * label,
          * description,
          * createdBy,
          * creationTimeStamp,
          * modifiedBy, and
          * modifiedTimeStamp.
      tags:
      - Type Definitions
      parameters:
      - $ref: "#/paths/~1tags/get/parameters/0"
      - $ref: "#/paths/~1tags/get/parameters/1"
      - $ref: "#/paths/~1tags/get/parameters/2"
      - $ref: "#/paths/~1tags/get/parameters/3"
      - name: includeInheritedAttributes
        required: false
        description: Indicates whether to display inherited attributes in response.
          Defaults to false.
        in: query
        schema:
          type: string
      - $ref: "#/paths/~1tags/get/parameters/6"
      - name: Accept-Item
        description: "The desired item representation for collections; the default\
          \ is application/vnd.sas.metadata.definition.summary+json, which can return\
          \ heterogeneous type definitions in the collection. Specifying a particular\
          \ kind of type definition ensures only that kind will appear in the collection."
        in: header
