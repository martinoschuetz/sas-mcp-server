          $ref: "#/paths/~1bots/get/responses/500"
  /deletions:
    post:
      x-performance:
        medium:
          default: true
          conditions:
            $ref: "#/components/x-performance/medium/conditions"
          expect:
            $ref: "#/components/x-performance/medium/expect"
      operationId: deleteObjects
      summary: Delete multiple objects based on a list of URIs
      description: |
        Delete multiple objects based on a list of URIs.
        This endpoint currently only supports deleting agents, instances, and locks; type definitions and search index definitions are not supported.
      tags:
      - Deletions
      parameters:
      - name: Content-Type
        required: true
        description: The representation in the request body.
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.selection+json
          - application/json
          default: application/vnd.sas.selection+json
      - name: Accept
        description: The desired representation for the response.
        in: header
        schema:
          type: string
          enum:
          - application/json
          default: application/json
      requestBody:
        content:
          application/vnd.sas.selection+json:
            schema:
              title: Selection
              description: Identifies a set of resources.
              x-sas-media-type:
                name: application/vnd.sas.selection
                version: 1
              required:
              - version
              - resources
              properties:
                version:
                  description: The schema version number of this media type. This
                    representation is version 1.
                  type: integer
                template:
                  description: 'A URI template in which the {id} parameter can be
                    replaced with a value from the "resources" array in order to yield
                    the URI of the identified resource. '
                  type: string
                type:
                  description: |-
                    Specifies whether the resources array contains IDs, URIs, or both.
                    <dl>
                    <dt>"id"</dt><dd>the array contains resource identifiers only. This is the default if "type" is omitted.</dd>
                    <dt>"uri"</dt><dd>the array contains resource URIs</dd>
                    <dt>"mixed"</dt><dd>the array contains a mixture of identifiers and URIs.</dd>
                    </dl>
                  type: string
                  enum:
                  - id
                  - uri
                  - mixed
                resources:
                  description: An array of resource IDs or URIs
                  type: array
                  items:
                    type: string
                links:
                  type: array
                  description: An array of links to related resources and actions.
                  items:
                    $ref: "#/components/schemas/tag/properties/links/items"
            examples:
              Bulk Delete:
                summary: Deletion request
                description: This request demonstrates deleting both an agent and
                  a library instance. This is one way to remove an agent and the content
                  introduced by the agent in a single request.
                value:
                  version: 1
                  resources:
                  - /catalog/bots/af349db0-0691-4510-bd01-122417810f7b
                  - /catalog/instances/49ea0241-251d-4268-ad95-8f30c0ce1e72
      responses:
        "200":
          description: "The request succeeded, and the content's `resources` were\
            \ empty or at least one of the `resources` was deleted successfully. \
            \ The response body is a mapping from each value in the `resources` of\
            \ the content to an empty object if that deletion succeeded, or the error\
            \ for that deletion if that deletion failed. If at least one deletion\
            \ succeeded, errors for individual deletions do not result in an error\
            \ status for the whole response."
          headers:
            Content-Type:
              $ref: "#/paths/~1/get/responses/200/headers/Content-Type"
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
              examples:
                Bulk Delete Response:
                  summary: Deletion response
                  description: "This response demonstrates a successful delete of\
                    \ the requested objects. If an error had occurred, the map value\
                    \ would contain error details."
                  value:
                    /catalog/bots/af349db0-0691-4510-bd01-122417810f7b: {}
                    /catalog/instances/49ea0241-251d-4268-ad95-8f30c0ce1e72: {}
        "400":
          $ref: "#/paths/~1tags/patch/responses/400"
        "401":
          $ref: "#/paths/~1/get/responses/401"
        "403":
          $ref: "#/paths/~1tags/get/responses/403"
        "404":
          $ref: "#/paths/~1tags/patch/responses/404"
        "415":
          $ref: "#/paths/~1bots/post/responses/415"
        "500":
          $ref: "#/paths/~1bots/get/responses/500"
components:
  x-performance:
    my-default:
      description: |
        The default performance thresholds to apply to all endpoints. This case will apply to all endpoints that have no x-performance block.
      default: true
      conditions:
        data: default
        system: default
        minUsers: 1
        minCount: 0
        failures:
        - maxPercent: 2%
        - maxCount: 20
      expect:
        response:
        - max < 2000ms
        - 95% < 500ms
        - 90% < 200ms
    medium:
      description: |
        Performance thresholds to apply to endpoints that are typically longer running. Either due to interacting with other services or performing more computationally intensive tasks.
      conditions:
        data: default
        system: default
        minUsers: 1
        minCount: 0
        failures:
        - maxPercent: 2%
        - maxCount: 20
      expect:
        response:
        - max < 3000ms
        - 95% < 750ms
        - 90% < 400ms
    large:
      description: |
        Performance threshold to apply to the longest running endpoints. Should be used infrequently and only on endpoints making long-running requests to other services (or the like).
      conditions:
        data: default
        system: default
        minUsers: 1
        minCount: 0
        failures:
        - maxPercent: 2%
        - maxCount: 20
      expect:
        response:
        - max < 4000ms
        - 95% < 1000ms
        - 90% < 500ms
  schemas:
    rootApi:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/tag/properties/links/items"
    catalogStatistics:
      title: Catalog Statistics
      description: Information about the contents of the Catalog
      type: object
      properties:
        version:
          type: integer
          description: The version of the media type.
          readOnly: true
        searchIndexStats:
          type: object
          description: a map of search engine statistics.
          readOnly: true
          additionalProperties:
            description: metrics describing an index's content
            type: object
            properties:
              id:
                type: string
                description: id of the instance.
                readOnly: true
              nDocuments:
                type: integer
                description: The number of documents in the index
                readOnly: true
              breakdown:
                type: object
                description: a map of each value in a field and it's associated number
                  of documents
                readOnly: true
              message:
                type: string
                description: This field will populate if the index needs to be rebuilt.
                readOnly: true
    searchResultCollection:
      title: Search Result Collection
      description: "A collection of search results. Similar to a resource collection,\
        \ but introduces a maxScore member."
      type: object
      allOf:
      - $ref: "#/components/schemas/tagCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains definition resources.
            items:
              $ref: "#/components/schemas/searchResult"
          maxScore:
            type: number
            description: The highest score returned by the search engine.
    searchResult:
      title: Search Result
      description: A single search result.
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: id of the instance.
          readOnly: true
        version:
          type: integer
          description: The version of the media type.
          readOnly: true
        type:
          type: string
          description: The name of the instance's type definition.
        typeLabel:
          type: string
          description: The label for the instance's type definition.
        name:
          type: string
          description: The name of the instance.
        label:
          type: string
          description: The label for the instance.
        description:
          type: string
          description: The description of the instance.
        score:
          type: number
          description: The score assigned by the search engine.
        created:
          type: string
          description: The creation timestamp of the artifact that document represents.
        modified:
          type: string
          description: The modification timestamp of the artifact that document represents.
        owner:
          type: string
          description: The creator/author of this creative work.
        modifiedBy:
          type: string
          description: Specifies the person who edited the creative work.
        displayType:
          type: string
          description: A keyword used to indicate the kind of content represented
            by the entity.
        registeredType:
          type: string
          description: A keyword used to registered type of the entity.
        attributes:
          type: object
          description: A list of fields specific to the entity
        links:
          type: array
          description: The links that apply to the definition.
          items:
            $ref: "#/components/schemas/tag/properties/links/items"
    searchFacetCollection:
      title: Facet Collection
      description: Collection of search facets.
      type: object
      allOf:
      - $ref: "#/components/schemas/tagCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains definition resources.
            items:
              $ref: "#/components/schemas/searchFacet"
    searchFacet:
      title: Search Facet
      description: Information about a search facet.
      type: object
      properties:
        version:
          type: integer
          description: The version of the media type.
          readOnly: true
        name:
          type: string
          description: The name of the facet.
        indices:
          description: A list of indices that define this facet.
          type: array
          items:
            type: string
        hiddenIndices:
          description: "A list of indices that define this facet, but have declared\
            \ it hidden. This is useful for facets that are required to implement\
            \ search usecases, but should not be exposed to the user by default."
          type: array
          items:
            type: string
        type:
          description: |
            The data type defined in the index or indices listed.
            Other indices that define the same facet but with a different data type are rendered as a distinct facet.
          type: string
    suggestionCollection:
      title: Suggestion Collection
      description: Collection of search suggestions.
      type: object
      allOf:
      - $ref: "#/components/schemas/tagCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains suggestions.
            items:
              type: string
    instanceCollection:
      title: Instance Collection
      description: Collection of instance objects.
      type: object
      allOf:
      - $ref: "#/components/schemas/tagCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            description: An array that contains metadata instance resources.
            type: array
            items:
              anyOf:
              - $ref: "#/components/schemas/instance"
              - $ref: "#/paths/~1instances/post/responses/201/content/application~1vnd.sas.summary%2Bjson/schema"
              - $ref: "#/components/schemas/classification"
              - $ref: "#/components/schemas/entity"
              - $ref: "#/components/schemas/relationship"
    instance:
      title: Instance
      description: The basic metadata attributes present on all instances with pointer
        to definition.
      type: object
      allOf:
      - $ref: "#/components/schemas/lock/allOf/0"
      required:
      - instanceType
      - definition
      properties:
        instanceType:
          description: The type of metadata instance this represents. Immutable after
            creation.
          type: string
          format: enumeration
          enum:
          - entity
          - classification
          - relationship
        definitionId:
          description: "The identity of this object's parent definition.  Immutable\
            \ after creation. Either definitionId or definition must be provided.\
            \  If definitionId is provided, definition is ignored."
          type: string
        definition:
          description: "The name of this object's parent definition.  Immutable after\
            \ creation. Either definitionId or definition must be provided.  If definitionId\
            \ is provided, definition is ignored."
          type: string
        attributes:
          description: The attributes of the given type populated on this entity.
            The maximum length of the key is 100.
          type: object
        type:
          description: "For entity instances, the platformTypeName of the parent type\
            \ definition; for classification and relationship instances, the name\
            \ of the parent type definition.  The value is ignored on input."
          type: string
          readOnly: true
        label:
          description: The user-facing name of this object; the maximum length is
            255. Sometimes called the business label.
          type: string
        name:
          description: "The name of this object; the maximum length is 1000. For classification\
            \ instances, the name must be unique among all instances that share the\
            \ same parentId."
          type: string
        description:
          description: The user description of this instance of metadata; the maximum
            length is 1000.
          type: string
    entity:
      title: Entity Instance
      description: The entity object in metadata with a resourceId to describe the
        source of metadata.
      type: object
      allOf:
      - $ref: "#/components/schemas/instance"
      - type: object
        required:
        - resourceId
        properties:
          resourceId:
            type: string
            description: The resource this entity represents; the maximum length is
              4000.
          historySettings:
            $ref: "#/components/schemas/entityTypeDefinition/properties/historySettings"
    classification:
      title: Classification Instance
      description: The classification in metadata used to categorize entities.
      type: object
      properties:
        parentId:
          description: The ID of a parent classification.
          type: string
        properties:
          description: A key/value map containing additional properties for the classification.
          type: object
      allOf:
      - $ref: "#/components/schemas/instance"
      - type: object
    relationship:
      title: Relationship Instance
      description: The instance of a relationship definition which relates two entities
        or classifications.
      type: object
      allOf:
      - $ref: "#/components/schemas/instance"
      - type: object
        required:
        - endpoint1Id
        - endpoint2Id
        properties:
          endpoint1Id:
            description: The id of the instance at the first endpoint.
            type: string
          endpoint1Uri:
            description: The URI of the instance at the first endpoint.  The value
              is ignored on input.
            type: string
          endpoint2Id:
            description: The id of the instance at the second endpoint.
            type: string
          endpoint2Uri:
            description: The URI of the instance at the second endpoint.  The value
              is ignored on input.
            type: string
    instanceArchive:
      title: Instance Archive
      description: "Collection of instance-related objects, separated by type. On\
        \ input, the instances are created, updated, or deleted as appropriate; On\
        \ output, the resulting object from the operation or an error is returned."
      type: object
      properties:
        classifications:
          description: An array that contains classification instances or errors resulting
            from creating or updating those instances.
          type: array
          items:
            $ref: "#/components/schemas/classification"
        entities:
          description: An array that contains entity instances or errors resulting
            from creating or updating those instances.
          type: array
          items:
            $ref: "#/components/schemas/entity"
        relationships:
          description: An array that contains relationship instances or errors resulting
            from creating or updating those instances.
          type: array
          items:
            $ref: "#/components/schemas/relationship"
        deletions:
          description: "On input, An array of instance IDs that are to be deleted\
            \ as part of the operation. On output, a map of instance IDs to an error\
            \ that was reported during the operation, if any."
          oneOf:
          - type: array
          - type: object
        version:
          description: The version of the media type.
          type: integer
          readOnly: true
    instanceArchiveParameters:
      title: Archive Parameters
      description: Parameters used to retrieve instance archive.
      type: object
      properties:
        version:
          description: The version of the media type.
          type: integer
          readOnly: true
        view:
          description: "The name of an existing view definition. See the [Views API](https://developer.sas.com/rest-apis/catalog#views)\
            \ for more details. If this property is not provided, the query property\
            \ must be specified; specifying both is an error."
          type: string
        query:
          description: "A Catalog view expression. See [Views](https://developer.sas.com/rest-apis/catalog/docs/overview#views)\
            \ for more details. If this property is not provided, the view property\
            \ must be specified; specifying both is an error."
          type: string
        parameters:
          description: Query parameters expressed as a map of maps. The key for the
            outer-most map is the name of a projection referenced in the view or query;
            the value is a map of property constraints used to restrict the results
            returned by the query.
          type: object
          additionalProperties:
            type: object
    patch:
      title: JSONPatch document
      description: A JSONPatch document containing the path of the item to add or
        remove.
      required:
      - op
      - path
      properties:
        op:
          description: "Operation to perform; either 'add' (which also updates), or\
            \ 'remove'. Other patch operations are not supported."
          type: string
          enum:
          - add
          - remove
        path:
          description: |
            The JSON path to the property to be manipulated. The path should start with a leading slash ('/') and reference one of the following fields:
              - name
              - description
              - label
              - attributes. /attributes must be followed with another slash and the name of a single-valued attribute definition that is defined on object's type definition.
          type: string
        value:
          description: The new value of the property for 'add' operations. The value
            must be compatible with the type modeled on the attribute definition.
          anyOf:
          - type: string
          - type: boolean
          - type: number
          - type: integer
    typeDefinitionCollection:
      title: Type Definition Collection
      description: This is a collection of Type Definitions.
      allOf:
      - $ref: "#/components/schemas/tagCollection/allOf/0"
      - type: object
        properties:
          items:
            type: array
            description: The actual results of a query.
            items:
              anyOf:
              - $ref: "#/components/schemas/typeDefinitionSummary"
              - $ref: "#/components/schemas/attributeTypeDefinition"
              - $ref: "#/components/schemas/classificationTypeDefinition"
              - $ref: "#/components/schemas/entityTypeDefinition"
              - $ref: "#/components/schemas/relationshipTypeDefinition"
    typeDefinitionSummary:
      title: Type Definition Summary
      description: |
        A lightweight representation of a Type definition.
      required:
      - name
      - definitionType
      allOf:
      - $ref: "#/components/schemas/lock/allOf/0"
      properties:
        name:
          description: The identity of this type definition; the maximum length is
            100. Whitespace characters are not allowed.
          type: string
        label:
          description: The user-presented text to represent this type definition;
            the maximum length is 100.
          type: string
        description:
          description: The descriptive text for this type definition; the maximum
            length is 1000.
          type: string
        definitionType:
          description: The type of definition this represents. Immutable after creation.
          type: string
          format: enumeration
          enum:
          - attribute
          - classification
          - entity
          - relationship
    attributeTypeDefinition:
      title: Attribute Type Definition
      description: Attribute Type Definition is a representation of a property type
        maintained by a Type Definition.
      allOf:
      - $ref: "#/components/schemas/entityTypeDefinition/allOf/0"
      required:
      - attributeKind
      properties:
        definitionType:
          description: The type of definition this represents. Immutable after creation.
          type: string
          format: enumeration
          enum:
          - attribute
        attributeKind:
          description: The classification of this attribute type.
          type: string
          format: enumeration
          enum:
          - UNKNOWN
          - PRIMITIVE
          - COLLECTION
          - ENUM
          default: PRIMITIVE
        elementDefinitions:
          description: "The set of elements allowed in the enumeration, if the attributeKind\
            \ property is 'ENUM'. If the attributeKind property is 'ENUM', this property\
            \ is required and must contain at least one enumerationTypeElement."
          type: array
          items:
            title: Enumeration Type Element
            description: "An enumeration value used in attribute type definitions,\
              \ where the attributeKind property is 'ENUM'."
            required:
            - ordinal
            - value
            properties:
              ordinal:
                description: The index of this element in the set of elements.
                type: integer
              value:
                description: The user-facing name or value of this element; the maximum
                  length is 100.
                type: string
              label:
                description: The user-facing label for this element; the maximum length
                  is 100.
                type: string
              description:
                description: The user-facing description of this element; the maximum
                  length is 1000.
                type: string
    classificationTypeDefinition:
      title: Classification Type Definition
      description: Classification Type Definition is a representation of a Classification
        Definition.
      allOf:
      - $ref: "#/components/schemas/entityTypeDefinition/allOf/0"
      properties:
        definitionType:
          description: The type of definition this represents. Immutable after creation.
          type: string
          format: enumeration
          enum:
          - classification
        baseType:
          description: The classification definition type name this type is based
            upon if applicable.
          type: string
    entityTypeDefinition:
      title: Entity Type Definition
      description: Entity Type Definition is a representation of a Entity Definition.
      allOf:
      - title: Abstract Type Definition
        description: The Abstract Type Definition supports modeling of other type
          definitions; it is never instantiated.
        allOf:
        - $ref: "#/components/schemas/typeDefinitionSummary"
        discriminator:
          propertyName: definitionType
          mapping:
            attribute: "#/attributeTypeDefinition"
            classification: "#/classificationTypeDefinition"
            entity: "#/entityTypeDefinition"
            relationship: "#/relationshipTypeDefinition"
        properties:
          attributeDefinitions:
            description: |
              A map of key/value pairs representing attribute definitions for the type definition; the keys are strings and the values are attribute definitions.
            type: object
            additionalProperties:
              $ref: "#/components/schemas/attributeDefinition"
          i18nSource:
            description: A message bundle ID that provides localization of various
              values within the type definition.
            type: string
          requiredCapability:
            description: |
              A map of property names to capabilities that governs the ability to patch the property in an Instance. The principal performing the PATCH operation must have at least one of the listed capabilities in order to allow the operation to succeed on the property named by the key. If this value is not specified, it cannot be modified via a PATCH request.
              At this time, only Entity Instances support the PATCH endpoint; specifying this property on attribute definitions of other types has no effect. Furthermore, only the name, label, description, and attributes properties can be modified through patch; attributes must have the requiredCapability property set on the attribute definition while capabilities for name, label, and description must be set as values within this map.
              Values are listed as space-delimited names of the capability as defined in the Authorization service.
            type: object
            additionalProperties:
              type: string
          inheritedAttributeDefinitions:
            description: |
              A map of key/value pairs representing inherited attribute definitions. The key is the name of the inherited attribute definition, and the value is an inherited attribute definition.
            type: object
            additionalProperties:
              title: Inherited Attribute Definition
              description: |
                An Inherited Attribute Definition describes properties that can be managed in an Instance, including where this Attribute Definition is inherited from.
              type: object
              required:
              - name
              - type
              allOf:
              - $ref: "#/components/schemas/attributeDefinition"
              properties:
                source:
                  description: |
                    Describes the source of the inherited attribute definition. The value is the name of the type definition from which the attribute definition is inherited.
                  type: string
                  readOnly: true
      required:
      - platformTypeName
      properties:
        definitionType:
          description: The type of definition this represents. Immutable after creation.
          type: string
          format: enumeration
          enum:
          - entity
        baseType:
          description: The Entity Type Definition name this type is based upon if
            applicable. Entity type name "base" for "dataSet" is an example.
          type: string
        platformTypeName:
          description: |
            The platform object type name; this is an alias for the type definition name attribute and is expected to match the type definition name. The maximum length is 100.
          type: string
        historySettings:
          title: History Settings
          description: History properties expressed as an object
          type: object
          properties:
            policy:
              description: |
                The history policy to be applied to this object; the maximum length is 20.
                Currently supported policies are:
                  * depth: the parameter is an integer for the number of history records to maintain.
                  * none: no history is maintained.
              type: string
              format: enumeration
              enum:
              - depth
              - none
              default: none
            parameter:
              description: "parameters that are used with the policy field; for the\
                \ depth policy, this should be an integer greater than or equal to\
                \ zero."
              type: object
            view:
              description: the name of the view definition that describes the subgraph
                that is maintained when creating new history records; the maximum
                length is 100.
              type: string
        metaCategory:
          description: |
            Used to categorize how a type of entity/asset should be managed in respect to its peers:
              * PRIMARY - This asset can stand alone within the system, and should be represented in hierarchies/folders, lineage views, and user interfaces. It also indicates that an instance of this type must have a unique resourceId among all instances of this type.
              * CONTAINED - This asset's lifecycle is managed by another asset.
          type: string
          enum:
          - PRIMARY
          - CONTAINED
    relationshipTypeDefinition:
      title: Relationship Type Definition
      description: Relationship Type Definition is a representation of a Relationship
        Definition.
      allOf:
      - $ref: "#/components/schemas/entityTypeDefinition/allOf/0"
      required:
      - endpointDefinition1
      - endpointDefinition2
      properties:
        definitionType:
          description: The type of definition this represents. Immutable after creation.
          type: string
          format: enumeration
          enum:
          - relationship
        cascadeDelete:
          description: |
            The type of delete behavior this relationship definition should enable when an endpoint of an instance of this relationship is to be deleted.
              * None - No cascade deletion. Only the given endpoint and the relationship will be deleted.
              * SourceToTarget - If the source endpoint (i.e. endpointDefinition1) is to be deleted then it
                will cascade and delete the relationship and the target endpoint (i.e. endpointDefinition2).
              * TargetToSource - If the target endpoint (i.e. endpointDefinition2) is to be deleted then it
                will cascade and delete the relationship and the source endpoint (i.e. endpointDefinition1).
              * Bidirectional - If either the source or target endpoint is to be deleted then it will cascade
                and delete the relationship and the related endpoint.
          type: string
          format: enumeration
          enum:
          - None
          - SourceToTarget
          - TargetToSource
          - Bidirectional
        role:
          description: An indication of the role supported by this relationship.
          type: string
          format: enumeration
          enum:
          - Version
          - Dependent
          - Contains
          - Associated
          - Equivalent
          - Synonymous
          - Parent
          default: Associated
        cardinality:
          description: An indication of the cardinality supported by this relationship.
          type: string
          format: enumeration
          enum:
          - ONE_TO_ONE
          - ONE_TO_MANY
          - MANY_TO_ONE
          - MANY_TO_MANY
          default: MANY_TO_MANY
        preserveReference:
          description: |
            The type of reference preservation this relationship definition should enable when an endpoint of an instance of this relationship is to be deleted. The relationship instance and its endpoints will be still deleted based on the `cascadeDelete` attribute, but if this attribute is set then preservation may occur. If the attribute is not set then no preservation occurs upon delete and there is no restriction on the `cascadeDelete` attribute (see below).
            * EP1 - If the source endpoint (i.e. endpointDefinition1) is to be deleted then it will
              be replaced by an unresolvedReference instance. The `cascadeDelete` attribute must only
              be set to either `None` or `TargetToSource`.
            * EP2 - If the target endpoint (i.e. endpointDefinition2) is to be deleted then it will
              be replaced by an unresolvedReference instance. The `cascadeDelete` attribute must only
              be set to either `None` or `SourceToTarget`.
            * Both - If either the source or target endpoint is to be deleted then it will be replaced
              by an unresolvedReference instance. The `cascadeDelete` attribute must be set to `None`.
          type: string
          nullable: true
          enum:
          - 
          - EP1
          - EP2
          - Both
          default:
        uniqueBy:
          description: |
            The criteria, if any, used to indicate whether a relationship instance is unique. By default, relationship instances are considered unique if they have a distinct combination of type, endpoint1Id, and endpoint2Id. If any of those three properties are distinct from the other relationship instances in the catalog, then the relationship instance is considered unique. Setting this property allows for a more restrictive definition of uniqueness.
            * EP1 - The relationship instances of this type must have a distinct value for the endpoint1Id property, regardless
              of the value of endpoint2Id. Attempting to reuse an existing endpoint1Id value for a new relationship instance
              of this type will result in an error with error code 157000.
            * EP2 - The relationship instances of this type must have a distinct value for the endpoint2Id property, regardless
              of the value of endpoint1Id. Attempting to reuse an existing endpoint2Id value for a new relationship instance
              of this type will result in an error with error code 157000.
            * TypeOnly - There can only be one relationship instance of this type, regardless of the endpoint values.
          type: string
          nullable: true
          enum:
          - 
          - EP1
          - EP2
          - TypeOnly
          default:
        endpointDefinition1:
          title: Relationship Endpoint Definition
          type: object
          description: |
            A Relationship Endpoint Definition describes the types of entities or classifications that constitute the relationship.
          required:
          - name
          properties:
            name:
              description: The short name of this side of the relationship; the maximum
                length is 100.
              type: string
            label:
              description: The user-presented text to represent this relationship
                endpoint; the maximum length is 100.
              type: string
            description:
              description: The descriptive text for this relationship endpoint; the
                maximum length is 1000.
              type: string
            elementType:
              description: The name of the related type. Immutable after creation.
              type: string
            container:
              description: Indicates whether this relationship contains/manages the
                endpoint instances.
              type: boolean
        endpointDefinition2:
          $ref: "#/components/schemas/relationshipTypeDefinition/properties/endpointDefinition1"
    typeDefinitionArchive:
      title: Type Definition Archive
      description: |
        Type Definition Archive provides a structure containing the Attribute, Classification, Entity, and Relationship Type Definitions in the Catalog. This is typically used if the entire model is needed, or as an export format.
      properties:
        attributeTypeDefinitions:
          type: array
          description: A list of the Attribute Type Definitions in the Catalog
          items:
            anyOf:
            - $ref: "#/components/schemas/attributeTypeDefinition"
        classificationTypeDefinitions:
          type: array
          description: A list of the Classification Type Definitions in the Catalog
          items:
            anyOf:
            - $ref: "#/components/schemas/classificationTypeDefinition"
        entityTypeDefinitions:
          type: array
          description: A list of the Entity Type Definitions in the Catalog
          items:
            anyOf:
            - $ref: "#/components/schemas/entityTypeDefinition"
        relationshipTypeDefinitions:
          type: array
          description: A list of the Relationship Type Definitions in the Catalog
          items:
            anyOf:
            - $ref: "#/components/schemas/relationshipTypeDefinition"
        version:
          type: integer
          description: The version of the media type.
          readOnly: true
    attributeDefinition:
      title: Attribute Definition
      description: An Attribute Definition describes properties that can be managed
        in an Instance.
      type: object
      required:
      - name
      - type
      properties:
        name:
          description: The identity of this attribute definition; the maximum length
            is 100.
          type: string
        label:
          description: The user-presented text to represent this attribute definition;
            the maximum length is 100.
          type: string
        description:
          description: The descriptive text for this attribute definition; the maximum
            length is 1000.
          type: string
        type:
          description: The system type the attribute value will have. This is a name
            of an Attribute Type Definition.
          type: string
        requiredCapability:
          description: |
            A list of capabilities that governs the ability to patch the property in an Instance. The principal performing the PATCH operation must have at least one of the listed capabilities in order to allow the operation to succeed. If this value is not specified, it cannot be modified via a PATCH request.
            At this time, only Entity Instances support the PATCH endpoint; specifying this property on attribute definitions of other types has no effect.
            Values are listed as space-delimited names of the capability as defined in the Authorization service. The maximum length is 1000.
          type: string
        typeCriteria:
          description: "The attributes that give criteria for the type from the Attribute\
            \ Type Definition. The attribute consists of key/value pairs; the maximum\
            \ length of the key is 100 and the value is an object. Example usages\
            \ include specifying an array of attribute definitions for a collection-valued\
            \ attribute, or specifying constraints (such as a maxLength property)\
            \ on the values modeled by the attribute definition."
          type: object
          additionalProperties: true
        agentProcessing:
          description: |
            Specifies whether this attribute can be subsequently updated by an agent.  Possible values:
              * ignoreIfSet: the agent will not modify this value if it was previously set (non-blank).
              * ignore: the agent will never modify this value.
              * set: the agent will update this value (default).
          type: string
          format: enumeration
          enum:
          - ignoreIfSet
          - ignore
          - set
    searchIndexCollection:
      title: Search Index Collection
      description: Collection of search indices.
      type: object
      allOf:
      - $ref: "#/components/schemas/tagCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains definition resources.
            items:
              $ref: "#/components/schemas/searchIndex"
    searchIndex:
      title: Search Index Definition
      description: Information about search index definition
      type: object
      required:
      - id
      - name
      - typeDefinition
      properties:
        id:
          type: string
          description: the unique identity of this search index. Immutable after creation.
        creationTimeStamp:
          type: string
          description: "The date and time this object was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
          format: date-time
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: "The date and time this object was last modified, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
          format: date-time
          readOnly: true
        createdBy:
          type: string
          description: The identity that created this object. The value is ignored
            on input.
          readOnly: true
        modifiedBy:
          type: string
          description: the identity that modified this object last. The value is ignored
            on input.
          readOnly: true
        version:
          type: integer
          description: The version of the media type.
          readOnly: true
        name:
          type: string
          description: |
            The name of the index. The name must adhere to the search engine requirements for index names. Currently, these are:
              * Lowercase only</li>
              * Cannot include \, /, *, ?, ", &lt;, &gt;, |, ` ` (space character), ,, #</li>
              * Cannot start with -, _, +</li>
              * Cannot be . or ..</li>
              * Cannot be longer than 255 bytes (note it is bytes, so multi-byte characters will count towards the 255 limit faster)</li>
        label:
          type: string
          description: A label for the index; the maximum length is 100.
        description:
          type: string
          description: A description for the index; the maximum length is 1000.
        aliases:
          type: object
          description: A map of alias name/alias definitions. Alias names follow the
            same naming rules as index names.
          additionalProperties:
            description: Expected to be empty. May be used in the future.
            type: object
        typeDefinition:
          type: string
          description: The name of the type definition that serves as the 'root' of
            the index definition.
        properties:
          description: A map that contains index attributes.
          type: object
          additionalProperties:
            description: |
              a map entry describing a property, keyed by property name. Index property names may not contain period characters (e.g. '.'). Note that the underlying search engine may constrain the kinds of changes that can be applied to a property's representation. If the property is an base instance level field (e.g. name, label, description, etc.) it will be pulled from there. Otherwise the value will come from the instance attributes. If the instance is a classification and it's still not present in the attributes, it will be pulled from the properties field. Additionally, properties of the instance's definition can be used in search by prefixing the name with "definition-" (e.g. definition-name)
            type: object
            required:
            - representation
            properties:
              representation:
                type: array
                items:
                  type: string
              freeText:
                description: Indicates this property should be added to free text
                  fields in the index.
                type: string
              stageName:
                description: The name that is searchable for this property.
                type: string
              suggestionsRepresentation:
                description: Specifies which representation to use when performing
                  suggestions on that property.
                type: string
                format: enumeration
                enum:
                - csv
              facetDisplay:
                description: Indicates that facet should be suppressed when listing
                  facets when the value is 'hidden'.
                type: string
                format: enumeration
                enum:
                - hidden
              source:
                description: |
                  If specified indicates the property should be populated by the field matching the given source and not the property name key. Same validation rules as the index property name apply.
                type: string
              copyTo:
                description: |
                  The fully-qualified path to the facet that the property values should be copied to. The path should include only dot-separated facet names, not stage names.
                type: string
        children:
          description: Information about index children
          type: object
          additionalProperties:
            description: "a map entry describing a child of the index, keyed by property\
              \ name, and consisting of a relationship and a peer entity"
            type: object
            required:
            - type
            - peer
            properties:
              name:
                description: the name of the relationship within the index definition.
                type: string
              inverse:
                description: "if true, indicates the search index traverses the relationship\
                  \ from endpoint 2 to endpoint 1; otherwise, the search index traverses\
                  \ the relationship from endpoint 1 to endpoint 2"
                type: boolean
              properties:
                description: A map that contains index attributes.
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/searchIndex/properties/properties/additionalProperties"
              facetDisplay:
                description: indicates that facet should be suppressed when listing
                  facets when the value is 'hidden'
                type: string
                format: enumeration
                enum:
                - hidden
              peer:
                description: The endpoint of this relationship
                type: object
                required:
                - name
                - typeDefinition
                properties:
                  name:
                    description: The name of the peer in the search index.
                    type: string
                  typeDefinition:
                    description: the name of the type definition for this part of
                      the index. This can refer to an entity or a classification.
                    type: string
                  properties:
                    description: A map that contains index attributes.
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/searchIndex/properties/properties/additionalProperties"
                  children:
                    description: Information about index children
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/searchIndex/properties/children/additionalProperties"
                  stageName:
                    description: The name that is searchable for this object.
                    type: string
                  facetDisplay:
                    description: indicates that facet should be suppressed when listing
                      facets when the value is 'hidden'
                    type: string
                    format: enumeration
                    enum:
                    - hidden
                  tags:
                    description: an object describing how tags are searchable in the
                      index
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/searchIndex/properties/tags/additionalProperties"
                  annotation:
                    description: Information about annotation object
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/searchIndex/properties/annotation/additionalProperties"
              stageName:
                description: The name that is searchable for this object.
                type: string
        i18nSource:
          description: A message bundle ID that provides localization of various values
            within the index.
          type: string
        iconSource:
          description: The reference to an icon resource used for presentation.
          type: string
        tags:
          description: an object describing how tags are searchable in the index
          type: object
          additionalProperties:
            description: an object describing how tags are searchable in the index
            type: object
            required:
            - name
            - stageName
            properties:
              name:
                description: |
                  The name of the tag in the search index. Must be unique across the set of property names for the object where it appears.
                type: string
              stageName:
                description: The name that is searchable for this object. Required
                  when copyTo is not provided.
                type: string
              copyTo:
                description: |
                  The fully-qualified path to the facet that the tag values should be copied to. The path should include only dot-separated facet names, not stage names. If copyTo is defined and stageName is not, this facet will be hidden from search suggestions.
                type: string
        annotation:
          description: Information about annotation object
          type: object
          additionalProperties:
            description: |
              Describes how annotations are related to the index object. If there is a related annotation, selected properties will replace values on the entity when indexing.
            type: object
            required:
            - relationshipType
            - properties
            properties:
              relationshipType:
                description: |
                  The name of the relationship definition that relates the object referred to by typeDefinition with annotation objects
                type: string
              properties:
                description: |
                  The list of properties that, if present on the annotation, will replace values on the entity when indexing.
                type: array
                items:
                  type: string
        links:
          type: array
          description: The links that apply to the definition search index.
          items:
            $ref: "#/components/schemas/tag/properties/links/items"
    viewCollection:
      title: View Collection
      description: Collection of View definitions.
      type: object
      allOf:
      - $ref: "#/components/schemas/tagCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains definition resources.
            items:
              $ref: "#/components/schemas/view"
    view:
      title: View Definition
      description: Information about a view definition
      type: object
      required:
      - id
      - name
      - query
      properties:
        id:
          type: string
          description: the unique identity of this view. Immutable after creation.
        creationTimeStamp:
          type: string
          description: "The date and time this object was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
          format: date-time
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: "The date and time this object was last modified, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
          format: date-time
          readOnly: true
        createdBy:
          type: string
          description: The identity that created this object. The value is ignored
            on input.
          readOnly: true
        modifiedBy:
          type: string
          description: the identity that modified this object last. The value is ignored
            on input.
          readOnly: true
        version:
          type: integer
          description: The version of the media type.
          readOnly: true
        name:
          type: string
          description: |
            The name of the view; the maximum length is 100.
        label:
          type: string
          description: A label for the view; the maximum length is 100.
        description:
          type: string
          description: A description for the view; the maximum length is 1000.
        query:
          type: string
          description: The view query; the maximum length is 1000.
        links:
          type: array
          description: The links that apply to the view definition.
          items:
            $ref: "#/components/schemas/tag/properties/links/items"
    agentCollection:
      title: Agent Collection
      type: object
      description: Collection of Agents.
      allOf:
      - $ref: "#/components/schemas/tagCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array of Agent summary representations.
            items:
              $ref: "#/components/schemas/agentSummary"
    agentSummary:
      title: Agent Summary
      description: Summary information about an agent.
      allOf:
      - $ref: "#/components/schemas/lock/allOf/0"
      type: object
      required:
      - name
      - provider
      - parameters
      properties:
        name:
          type: string
          description: the name of this agent; the maximum length is 100.
        description:
          type: string
          description: The descriptive text for this agent; the maximum length is
            1000.
        provider:
          type: string
          description: The name of the agent provider; the maximum length is 100.
            This is automatically prefixed with "CATALOG-" to determine the JES provider
            name.
        parameters:
          type: object
          description: Provider specific JSON parameters for the agent in the form
            of a map.
        suppressChangeDetection:
          type: boolean
          description: "A hint to the provider that change detection is not needed\
            \ when this property is set to true. This can be useful, for instance,\
            \ when agent parameters have changed and necessitate a complete reanalysis\
            \ of the content generated by the agent."
        agentType:
          type: string
          description: "The type of this agent; the valid values are `DiscoveryAgent`,\
            \ `SchemaExtractionAgent`, `DataProfilingAgent`, or `DataFlowAgent`. Defaults\
            \ to `DiscoveryAgent`."
        agentTypeLabel:
          type: string
          description: The localized displayable name of the agent type.
          readOnly: true
    agent:
      title: Agent
      description: |
        A Catalog agent representation.
        Note that this representation and a scheduled agent representation can refer to the same object. If the agent properties must be updated but the schedules do not, use this representation; the absence of scheduled triggers in this representation will not remove any schedules associated with the agent.
      type: object
      required:
      - name
      - provider
      - parameters
      allOf:
      - $ref: "#/components/schemas/agentSummary"
      - type: object
        properties:
          jobParameters:
            $ref: "#/components/schemas/agentHistory/properties/jobParameters"
    scheduledAgent:
      title: Scheduled Agent
      description: A Catalog agent with scheduling information.
      type: object
      required:
      - name
      allOf:
      - $ref: "#/components/schemas/agent"
      properties:
        triggers:
          type: array
          description: Schedule triggers used to automate running the agent.
          items:
            required:
            - name
            - type
            properties:
              id:
                type: string
                description: unique identifier for a particular trigger
              type:
                type: string
                description: Specify type of trigger as a String.
                enum:
                - IMMEDIATE
                - SIMPLE
                - CRON
                - TIMEEVENT
                default: IMMEDIATE
              name:
                type: string
                description: An identifier used in retrieving this trigger
              group:
                type: string
                description: An identifier used in retrieving this trigger
              applicationId:
                type: string
                description: An identifier used to describe the application that created
                  the trigger
              start:
                type: string
                format: date-time
                description: "A representation of the time when the scheduler will\
                  \ run the job. This time string expects a format based on the common\
                  \ form of ISO-8601, YYYY-MM-DDTHH:MM:SS.SSSZ, which is year-month-day\
                  \ letter 'T' hour:minute:second and fractions. Used by SIMPLE and\
                  \ CRON types."
              end:
                type: string
                format: date-time
                description: "A representation of the time when the scheduler will\
                  \ stop scheduling the job. This time string expects a format based\
                  \ on the common form of ISO-8601, YYYY-MM-DDTHH:MM:SS.SSSZ, which\
                  \ is year-month-day letter 'T' hour:minute:second and fractions.\
                  \ Used by SIMPLE and CRON types."
              repeat:
                type: integer
                description: 'Set the number of times to repeat the job, given other
                  constraints. "-1" is special, meaning run the job forever. Used
                  by SIMPLE and CRON types.'
                default: 1
              interval:
                type: array
                description: Set the spacing between repetition of the job. May be
                  a single non-negative integer referring to the number of interval
                  units for all interval units except WEEKDAY or a list of weekdays
                  for the interval unit of WEEKDAY. Used by SIMPLE and CRON types.
                items:
                  type: string
              intervalUnit:
                type: string
                description: Set the time unit for the spacing between job executions.
                  Used by SIMPLE and CRON types.
                enum:
                - SECOND
                - MINUTE
                - HOUR
                - DAY
                - WEEK
                - WEEKDAY
                - MONTH
                - YEAR
                default: DAY
              day:
                type: string
                description: "Set the day of the week to run the job, given other\
                  \ constraints. Used by SIMPLE and CRON types."
                enum:
                - SUNDAY
                - MONDAY
                - TUESDAY
                - WEDNESDAY
                - THURSDAY
                - FRIDAY
                - SATURDAY
                default: MONDAY
              cron:
                type: string
                description: 'Specify a "cron expression" as a String. A cron expression
                  is a string comprised of 6 or 7 fields separated by white space.
                  For details on the values of the fields, see http://www.quartz-scheduler.org/documentation/quartz-1.x/tutorials/crontrigger.
                  Required for CRON type.'
              active:
                type: boolean
                description: designates if the associated job will be run based on
                  the definition of this trigger
                default: true
              timeEvent:
                description: Collection of fields used for the TIMEEVENT type. Required
                  for TIMEEVENT type.
                required:
                - hours
                - minutes
                - recurrence
                properties:
                  recurrence:
                    required:
                    - type
                    properties:
                      type:
                        type: string
                        description: RecurrenceType for the recurrence
                        enum:
                        - minutely
                        - hourly
                        - daily
                        - weekly
                        - monthly
                        - yearly
                        - datelist
                      startDate:
                        type: string
                        description: The date to start this recurrence specified as
                          yyyy-mm-dd. Required for all recurrence types except datelist.
                        default: No default
                      endDate:
                        type: string
                        description: The date to end this recurrence specified as
                          yyyy-mm-dd. Used by all recurrence types except datelist.
                        default: No default
                      skipCount:
                        type: integer
                        description: "The number of interval units to skip, defaults\
                          \ to 1 meaning no skip. Used by all recurrence types except\
                          \ datelist."
                        default: 1
                      daysOfWeek:
                        type: array
                        description: a list of weekdays. Required for weekly recurrence
                          type. Used by monthly and yearly recurrence types in conjunction
                          with occurrence but should contain only one weekday for
                          these types.
                        items:
                          type: string
                          enum:
                          - sunday
                          - monday
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                          - saturday
                          default: No default
                      occurrence:
                        type: string
                        description: Ordinal value representing a specific week instance.
                          Used by monthly and yearly recurrence types in conjunction
                          with daysOfWeek.
                        enum:
                        - first
                        - second
                        - third
                        - fourth
                        - last
                        default: No default
                      dayOfMonth:
                        type: string
                        description: "The specific numerical value for a day. Range\
                          \ is from 1 to 32. 32 is a special value meaning the last\
                          \ day of the month, no matter how many days the month has.\
                          \ If a day is specified but does not exist, the job is skipped.\
                          \ Used by monthly and yearly recurrence types as an alternative\
                          \ to occurrence and daysOfWeek."
                        default: No default
                      monthOfYear:
                        type: string
                        description: The month to run the job. Required for yearly
                          recurrence type.
                        enum:
                        - January
                        - February
                        - March
                        - April
                        - May
                        - June
                        - July
                        - August
                        - September
                        - October
                        - November
                        - December
                        default: No default
                      dates:
                        description: a list of dates using format yyyy-mm-dd. Required
                          for the datelist recurrence type.
                        type: array
                        items:
                          type: string
                        default: No default
                      expression:
                        type: string
                        description: A scheduler specific opaque field.  Not currently
                          used by this scheduler
                        default: No default
                  hours:
                    type: string
                    description: "comma-separated list of hours for a TimeEvent trigger.\
                      \ Values should be between 0 and 23, inclusive."
                  minutes:
                    type: string
                    description: "comma-separated list of minutes for a TimeEvent\
                      \ trigger. Values should be between 0 and 59, inclusive."
                  timezone:
                    type: string
                    description: "timezone used to interpret hours:minutes for TimeEvent\
                      \ trigger"
                    default: GMT
                  maxOccurrence:
                    type: string
                    description: number of times to run the TimeEvent job. The default
                      of -1 means no maximum
                    default: "-1"
    agentPreview:
      title: Agent Preview
      description: Used to preview the enumeration phase of a bot run.
      type: object
      properties:
        version:
          type: integer
          description: The version of the media type. The value is ignored on input.
          readOnly: true
        status:
          type: string
          description: the status of the bot preview as reported thru the Job Execution
            Service.
          readOnly: true
        creationTimeStamp:
          type: string
          description: "The date and time this bot preview was started, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ."
          format: date-time
          readOnly: true
        nEnumerated:
          type: integer
          description: The number of tables/files that were enumerated during the
            preview.
          readOnly: true
        nExcluded:
          type: integer
          description: The number of tables/files that were excluded by bot filter
            rules.
          readOnly: true
        error:
          $ref: "#/paths/~1definitions/post/responses/409/content/application~1vnd.sas.error%2Bjson/schema"
        links:
          type: array
          description: The links that apply to the preview.
          items:
            $ref: "#/components/schemas/tag/properties/links/items"
    agentHistoryCollection:
      title: Agent History Collection
      type: object
      description: Collection of Agent history records.
      allOf:
      - $ref: "#/components/schemas/tagCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains Agent history records.
            items:
              $ref: "#/components/schemas/agentHistory"
    agentHistory:
      title: Agent History
      description: Agent History is used to report agent execution metrics.
      type: object
      properties:
        version:
          type: integer
          description: The version of the media type. The value is ignored on input.
          readOnly: true
        id:
          type: string
          description: The id of this Agent run.
          readOnly: true
        status:
          type: string
          description: the status of the Agent execution as reported thru the Job
            Execution Service.
          readOnly: true
        createdBy:
          type: string
          description: The identity that created this object by running the Agent.
          readOnly: true
        creationTimeStamp:
          type: string
          description: "The date and time this Agent run was started, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ."
          format: date-time
          readOnly: true
        endTimeStamp:
          type: string
          description: "The date and time this Agent run was completed, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ."
          format: date-time
          readOnly: true
        nEnumerated:
          type: integer
          description: The number of tables/files that were enumerated during Agent
            execution.
          readOnly: true
        nExcluded:
          type: integer
          description: The number of tables/files that were excluded by Agent filter
            rules.
          readOnly: true
        nAdded:
          type: integer
          description: The number of newly recognized tables/files that were added
            during Agent execution.
          readOnly: true
        nUpdated:
          type: integer
          description: The number of existing tables/files that were updated during
            Agent execution.
          readOnly: true
        nRemoved:
          type: integer
          description: "The number of existing tables/files that were removed during\
            \ Agent execution, either because they are no longer present or they did\
            \ not pass the Agent filter rules."
          readOnly: true
        averageRunTime:
          type: integer
          description: "The average runtime of the Agent, expressed in seconds."
          readOnly: true
        suppressChangeDetection:
          type: boolean
          description: "A hint to the provider that change detection is not needed\
            \ when this property is set to true. This can be useful, for instance,\
            \ when agent parameters have changed and necessitate a complete reanalysis\
            \ of the content generated by the agent."
        parameters:
          type: object
          description: Provider specific JSON parameters for the agent in the form
            of a map.
        jobParameters:
          type: object
          description: |
            Additional parameters to be used during agent execution. jobParameters is a map of string values, keyed by string values, whose interpretation is left to the provider.
          properties:
            featureToggleDefault:
              type: string
              description: |
                Governs the state of feature toggles. Unless a parameter is explicitly provided or has a default value enumerated, a parameter will default to the value of featureToggleDefault. Defaults to 1.
            testPerformance:
              type: string
              description: Indicates whether to collects time and space requirements
                for a unit of work within the agent. Defaults to 0.
            crawlInMemory:
              type: string
              description: Indicates whether to analyze CAS in-memory tables. CAS
                only. Defaults to 1.
            crawlPersist:
              type: string
              description: Indicates whether to analyze CAS persisted tables. CAS
                only. Defaults to 0.
            suppressMessage:
              type: string
              description: Indicates whether to print the disposition of CAS Actions
                in the log. CAS only. Defaults to 1.
            doTemporalChanges:
              type: string
              description: Indicates whether to collect the time period covered in
                a dataset. Defaults to `featureToggleDefault`.
            discoverOutliers:
              type: string
              description: Indicates whether to collect outliers. Defaults to `featureToggleDefault`.
            genObsFrequency:
              type: string
              description: |
                Indicates whether to perform a best estimate on the frequency of observations found in a dataset (i.e. hourly, weekly, monthly, yearly). Defaults to `featureToggleDefault`.
            getMostImportantFields:
              type: string
              description: Indicates whether to identify the most important columns
                in a dataset. Defaults to `featureToggleDefault`.
            analyzeSentiment:
              type: string
              description: Indicates whether sentiment analysis is performed. CAS
                only. Defaults to `featureToggleDefault`.
            minNumSentimentIDWords:
              type: string
              description: The minimum number of words per observation/row required
                for sentiment analysis. CAS only. Defaults to 3.
            minSentimentIDLen:
              type: string
              description: The minimum length of an observation for a column to be
                used for sentiment analysis. CAS only. Defaults to 10.
            correlateColumns:
              type: string
              description: |
                Indicates whether correlation analysis is performed on columns within dataset.  Defaults to `featureToggleDefault`.
            corrDistinctCountLimit:
              type: string
              description: The maximum number of levels to examine for correlations.
                CAS only. Defaults to 256.
            getSemanticID:
              type: string
              description: |
                Indicates whether to perform entity identification on the columns in a dataset. Uses the given `dataLocale`. Defaults to `featureToggleDefault`.
            idScoreThreshold:
              type: string
              description: The minimum score needed for a column to be identified
                during entity identification. Defaults to 100.
            minNumRowsFN:
              type: string
              description: The minimum number of rows required for entity identification
                of a column as FAMILY NAME. Defaults to 100.
            minNumUniqueFN:
              type: string
              description: The minimum number of unique values in a column required
                for entity identification as FAMILY NAME. Defaults to 20.
            getNLPSemanticID:
              type: string
              description: |
                Indicates whether to perform NLP tagging on columns that could not be identified with traditional entity identification. Defaults to `featureToggleDefault`.
            nlpEntityThresholdPct:
              type: string
              description: The minimum percent of rows identified required for NLP
                tagging. Compute only. Defaults to 50.
            maxNumTextMineVars:
              type: string
              description: The maximum number of columns to mine in a dataset. Defaults
                to 10.
            minNumTextMineWords:
              type: string
              description: The minimum number of words per observation/row required
                for text mining. Defaults to 10.
            minNumTextMineRows:
              type: string
              description: The minimum number of rows in a column for it to be mined.
                Defaults to 10.
            minTextMineLen:
              type: string
              description: The minimum length of an observation for a column to be
                used for text mining. Defaults to 50.
            identifyLanguage:
              type: string
              description: Indicates whether to identify languages used in a dataset.
                CAS only. Defaults to `featureToggleDefault`.
            langIDPctCutoff:
              type: string
              description: The minimum frequency percentage for a language to be identified
                in a dataset. CAS only. Defaults to .1 (or 10%).
            minNumLangIDWords:
              type: string
              description: The minimum number of words per observation/row required
                for language identification. CAS only. Defaults to 5.
            minLangIDLen:
              type: string
              description: The minimum length of a column for a column to be used
                for language identification. CAS only. Defaults to 50.
            maskOffensive:
              type: string
              description: |
                Indicates whether to mask offensive words found in a dataset. Uses the given `dataLocale`. Defaults to `featureToggleDefault`.
            maskStartList:
              type: string
              description: A comma-delimited list of words to be tagged as offensive
                even though they were not considered profane (i.e. false negative).
            maskStopList:
              type: string
              description: A comma-delimited list of words to not be tagged as offensive
                even though they were considered profane (i.e. false positive).
            mineForKeywords:
              type: string
              description: Indicates whether to perform text mining on columns in
                a dataset to collect keywords. Defaults to `featureToggleDefault`.
            predictTopic:
              type: string
              description: Indicates whether to perform topic analysis on a dataset.
                Defaults to 0.
            minTermDocFreq:
              type: string
              description: The minimum frequency for a term in topic analysis. Defaults
                to 5.
            maxColumns:
              type: string
              description: The maximum number of columns to analyze in a dataset.
                Defaults to 200.
            longStrLength:
              type: string
              description: The maximum length of an observation to be used for analysis.
                Defaults to 300 in CAS and 250 in Compute.
            ordinalCols:
              type: string
              description: Identifies the columns in a dataset to be analyzed using
                a comma-delimited list of ordinal positions. Ordinal position used
                1-based indexing.
            ordinalColRange:
              type: string
              description: Identifies the columns in a dataset to analyze using the
                format "x-y" to limit analysis to columns between indices x and y
                (inclusive).
            maxDataSize:
              type: string
              description: The maximum dataset size when processing topN/bottomN and
                outliers. CAS only. Defaults to 50000000.
            timeseriesCutoff:
              type: string
              description: The threshold on whether or not to recommend a time series
                graph. Defaults to 50.
            bestChartCutoff:
              type: string
              description: The maximum number of levels (or frequency) after which
                to suggest a 'box' plot. Defaults to 20.
            intervalCutoff:
              type: string
              description: The maximum number of levels (or frequency) after which
                to suggest a 'interval` scale. Defaults to 20.
            topnlevelsToGet:
              type: string
              description: The maximum number of levels (or frequency) to calculate
                for topN and bottomN. Defaults to 20.
            maxCharLength:
              type: string
              description: The maximum length of an observation for which to count
                distinct values for a column. Compute only. Defaults to 10900.
            rowSizeThreshold:
              type: string
              description: A threshold for which to use sampling for other metrics.
                Defaults to 200000.
            samplePercent:
              type: string
              description: The sampling percentage to use on large datasets when dataset
                size exceeds `rowSizeThreshold`. CAS only. Defaults to 20 or 20%.
            sampleSize:
              type: string
              description: |
                The size of the dataset to use for entity identification, keyword mining, language guessing, and sentiment analysis. Defaults to 500.
            sampleSizeSemanticID:
              type: string
              description: The sample size of the dataset to use for entity identification.
                Defaults to `sampleSize`.
            sampleSizeNLPSemanticID:
              type: string
              description: The sample size of the dataset to use for NLP tagging.
                Defaults to `sampleSize`.
            sampleSizeKeywords:
              type: string
              description: The sample size of the dataset to use for keyword mining.
                Defaults to `sampleSize`.
            sampleSizeLangGuess:
              type: string
              description: The sample size of the dataset to use for language guessing/identification.
                CAS only. Defaults to `sampleSize`.
            sampleSizeSentiment:
              type: string
              description: The sample size of the dataset to use for sentiment analysis.
                CAS only. Defaults to `sampleSize`.
            sampleUnivar:
              type: string
              description: |
                Indicates whether to use sampling when completing univariate analysis; otherwise some computations will not be performed. Compute only. Defaults to 1.
            sampleSizeUnivar:
              type: string
              description: The sample size of the dataset to use for univariate analysis.
                Compute only. Defaults to 65526.
            sampleSizeCorrelations:
              type: string
              description: The sample size of the dataset to use for identifying correlations.
                Compute only. Defaults to 10000.
          additionalProperties:
            type: string
        error:
          $ref: "#/paths/~1definitions/post/responses/409/content/application~1vnd.sas.error%2Bjson/schema"
        links:
          type: array
          description: The links that apply to the object. The value is ignored on
            input.
          items:
            $ref: "#/components/schemas/tag/properties/links/items"
          readOnly: true
    adhocAnalysisJob:
      title: Adhoc Analysis Job
      description: Information about an Adhoc Analysis Job.
      type: object
      required:
      - name
      - provider
      - resources
      properties:
        name:
          type: string
          description: the name of this job; the maximum length is 100.
        description:
          type: string
          description: The descriptive text for this job; the maximum length is 1000.
        provider:
          type: string
          description: The name of the job provider; the maximum length is 100. This
            is automatically prefixed with "CATALOG-" to determine the JES provider
            name.
        resources:
          type: array
          description: An array of resources to analyze.
          items:
            type: object
            properties:
              uri:
                type: string
                description: The URI of the resource to analyze.
              type:
                type: string
                description: The entity type definition name of the resource.
        jobParameters:
          $ref: "#/components/schemas/agentHistory/properties/jobParameters"
    adhocAnalysisJobCollection:
      title: Adhoc Analysis Job Collection
      type: object
      description: Collection of Adhoc Analysis jobs.
      allOf:
      - $ref: "#/components/schemas/tagCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array of Adhoc Analysis Job summary representations.
            items:
              $ref: "#/paths/~1bots~1adhocAnalysisJobs/post/responses/201/content/application~1json/schema"
    tagCollection:
      title: Tag Collection
      description: Collection of Tags.
      type: object
      allOf:
      - title: Base Collection
        description: This is a base schema used to define paginated collections of
          resources. This base schema is extended by other schemas in APIs by adding
          an 'items' array property. These extensions define the application/vnd.sas.collection
          media type (version 2)
        properties:
          name:
            type: string
            description: The name of the collection.
          start:
            type: integer
            description: The zero-based index of the first item in the collection.
            format: int64
          limit:
            type: integer
            description: The number of items that were requested for the collection.
          count:
            type: integer
            description: If populated indicates the number of items in the collection.
            format: int64
          accept:
            type: string
            description: A space-delimited list of media types from which an `Accept`
              header may be constructed.
          links:
            type: array
            description: The links that apply to the collection.
            items:
              $ref: "#/components/schemas/tag/properties/links/items"
          version:
            type: integer
            description: The version number of the collection representation. This
              representation is version 2.
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains tag resources.
            items:
              $ref: "#/paths/~1tags/post/responses/201/content/application~1vnd.sas.metadata.tag.summary%2Bjson/schema"
    tag:
      title: Tag
      description: |
        Information about a tag. Currently tags only supports tagging entities. Only `/catalog/instances/{id}` is accepted for the template property within members.
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: The unique identifier of this tag. Immutable after creation.
        name:
          type: string
          description: The name of the tag; the maximum length is 100.
        creationTimeStamp:
          type: string
          description: "The date and time this object was created, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
          format: date-time
          readOnly: true
        modifiedTimeStamp:
          type: string
          description: "The date and time this object was last modified, in the format\
            \ of YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
          format: date-time
          readOnly: true
        createdBy:
          type: string
          description: The identity that created this object. The value is ignored
            on input.
          readOnly: true
        modifiedBy:
          type: string
          description: The identity that modified this object last. The value is ignored
            on input.
          readOnly: true
        version:
          type: integer
          description: The version of the media type.
          readOnly: true
        links:
          type: array
          description: The links that apply to the tag.
          items:
            title: Link
            type: object
            description: A link to a related operation or resource.
            required:
            - rel
            properties:
              method:
                type: string
                description: The HTTP method for the link.
              rel:
                type: string
                description: The relationship of the link to the resource.
              uri:
                type: string
                description: The relative URI for the link.
              href:
                type: string
                description: The URL for the link.
              title:
                type: string
                description: The title for the link.
              type:
                type: string
                description: The media type or link type for the link.
              itemType:
                type: string
                description: "If this is a link to a container, `itemType` is the\
                  \ media type or link type for the items in the container."
              responseType:
                type: string
                description: "The media type or link type of the response body for\
                  \ a `PUT`, `POST`, or `PATCH` operation."
              responseItemType:
                type: string
                description: "The media type or link type of the items in the response\
                  \ body for a `PUT`, `POST`, or `PATCH` operation."
        members:
          $ref: "#/paths/~1deletions/post/requestBody/content/application~1vnd.sas.selection%2Bjson/schema"
    tagPatchArchive:
      title: Tag Patch Archive
      description: An archive containing sets of JSON Patch operations to apply to
        Tags.
      type: object
      properties:
        version:
          type: integer
          description: The version of the media type.
          readOnly: true
        tags:
          type: object
          description: |
            The sets of JSON Patch operations to apply to Tags. They key is the ID of the tag to perform the operations on (or a new ID if creating a tag).
          additionalProperties:
            title: Tag Patch Array
            description: An array of patch operations for tags.
            type: array
            items:
              title: Tag JSONPatch Operation
              description: A JSONPatch document containing the operations to be performed
                on the defined tag.
              type: object
              required:
              - op
              - path
              properties:
                op:
                  description: |
                    The type of operation to be performed on the defined tag; either 'add' (which also updates), or 'remove'. Other patch operations are not supported.
                  type: string
                  enum:
                  - add
                  - remove
                path:
                  description: The URI of the tag or the JSON path to the property
                    to be manipulated.
                  type: string
                value:
                  description: The new value of the property for 'add' operations.
                    The value must be compatible with the type expected at the given
                    path.
                  anyOf:
                  - type: string
                  - $ref: "#/components/schemas/tag"
    lockCollection:
      title: Lock Collection
      description: Collection of lock objects.
      type: object
      allOf:
      - $ref: "#/components/schemas/tagCollection/allOf/0"
      - type: object
        required:
        - items
        properties:
          items:
            description: An array that contains locks.
            type: array
            items:
              anyOf:
              - $ref: "#/components/schemas/lock"
    lock:
      title: Lock
      description: The properties associated with a lock.
      type: object
      allOf:
      - title: Abstract Object
        description: abstractObject supports modeling of other objects; it is never
          instantiated.
        properties:
          id:
            type: string
            description: the unique identity of this object. Immutable after creation.
          creationTimeStamp:
            type: string
            description: "The date and time this object was created, in the format\
              \ of YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
            format: date-time
            readOnly: true
          modifiedTimeStamp:
            type: string
            description: "The date and time this object was last modified, in the\
              \ format of YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
            format: date-time
            readOnly: true
          createdBy:
            type: string
            description: The identity that created this object. The value is ignored
              on input.
            readOnly: true
          modifiedBy:
            type: string
            description: The identity that modified this object last. The value is
              ignored on input.
            readOnly: true
          version:
            type: integer
            description: The version of the media type.
          links:
            type: array
            description: The links that apply to the object. The value is ignored
              on input.
            items:
              $ref: "#/components/schemas/tag/properties/links/items"
            readOnly: true
      required:
      - assetId
      - assetType
      properties:
        assetType:
          description: The type of asset associated with this lock. Immutable after
            creation.
          type: string
        assetId:
          description: The identity of the asset associated with this lock.  Immutable
            after creation.
          type: string
        expirationTime:
          description: "The date and time this lock will expire, in the format of\
            \ YYYY-MM-DDThh:mm:ss.sssZ. The value is ignored on input."
          type: string
          format: date-time
          readOnly: true
    lockUpdate:
      title: Lock Update
      description: Array of lock IDs.
      type: object
      properties:
        lockIds:
          type: array
          items:
            type: string
