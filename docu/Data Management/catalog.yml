  /search/indices#rebuild:
    post:
      operationId: rebuildSearchIndices
      summary: Rebuild Search Indices
      description: |
        Delete and rebuild indices from the content in the Catalog service.
        The index rebuild jobs run asynchronously via Job Execution Service jobs, which can be polled for status using the job identiers in the response.
      tags:
      - Search Indices
      parameters:
      - name: Accept
        description: |
          The desired representation for the response. The response is a map of the search index uri to the result--either a job, which can be used to poll for updates, or an error if there was an issue processing the index that prevented submission of the job request.
        in: header
        schema:
          type: string
          enum:
          - application/json
          default: application/json
      - name: action
        description: The action parameter for the rebuild request.
        required: true
        in: query
        schema:
          type: string
          enum:
          - rebuild
          default: rebuild
      requestBody:
        content:
          application/vnd.sas.selection+json:
            schema:
              $ref: "#/paths/~1deletions/post/requestBody/content/application~1vnd.sas.selection%2Bjson/schema"
