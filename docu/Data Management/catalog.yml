    post:
      operationId: createOrUpdateTypeDefinitionArchive
      summary: Create or Update Type Definitions from an Archive
      description: Create Type Definitions from the given content.
      tags:
      - Type Definitions
      parameters:
      - name: Accept
        description: The desired item representation for the response. The default
          is application/vnd.sas.metadata.definition.archive+json
        in: header
        schema:
          type: string
          enum:
          - application/vnd.sas.metadata.definition.archive+json
          default: application/vnd.sas.metadata.definition.archive+json
      - name: onConflict
        description: |
          Specifies how to handle definitions in the body with ids that already exist.  If 'update' is specified, those definitions are updated.  Otherwise, those definitions are not updated and a 409 Conflict error is returned for each one.
        in: query
        schema:
          type: string
          enum:
          - update
          - ignore
          default: ignore
      - name: If-Unmodified-Since
        description: |
          The time after which any definitions updated by this call cannot have been updated; a 412 (Precondition Failed) error will be returned for each definition that has been modified after this time.
          The value must use the RFC 1123 time format (e.g. Fri, 01 Jan 1960 00:00:00 GMT); if an invalid value is specified, a 400 (Bad Request) error will be returned for each definition that already exists.
          This value is required if the call wil update any existing definitions, and ignored if the call will only create new definitions; if this value is omitted, a 428 (Precondition Required) error will be returned for each definition that already exists.
        in: header
        schema:
          type: string
      - name: preserveModifiedTimeStamps
        description: |
          Specifies how to handle definitions in the body with modifiedTimeStamp attributes. If true the modifiedTimeStamp will be preserved and the modifiedTimeStamp will be used in place of the If-Unmodified-Since header when updating an existing definition. If false, then the modifiedTimeStamp will be updated at the time of modification.
        in: query
        schema:
          type: boolean
      requestBody:
        content:
          application/vnd.sas.metadata.definition.archive+json:
            schema:
