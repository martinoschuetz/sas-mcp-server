---
openapi: 3.0.3
info:
  version: "3"
  title: Data Tables
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
  description: "The Data Tables API works in concert with the Data Sources and Row\
    \ Sets APIs to navigate, reference, and retrieve data in the SAS Viya ecosystem.\
    \ The Data Tables API enables retrieval of metadata for data tables and their\
    \ respective columns."
tags:
- name: Root
  description: Contains the operations for the root resource.
- name: Tables
  description: Contains the operations for the Data Tables resource.
- name: Jobs
  description: Contains the operations for the job resource.
- name: Columns
  description: Contains the operations for the Columns of Data Tables resource.
paths:
  /:
    get:
      operationId: root
      summary: Get a list of top-level links
      description: Returns a collection of links to the top-level collections surfaced
        through this API. HEAD is also supported.
      tags:
      - Root
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                schemaval:
                  $ref: "#/components/examples/rootLinks"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                schemaval:
                  $ref: "#/components/examples/rootLinks"
  "/dataSources/{dataSourceId}/tables":
    get:
      operationId: getTables
      summary: Get a collection of tables
      description: >-
        Returns a collection of tables available from the named data source as
        application/vnd.sas.data.table or application/vnd.sas.data.table.summary
        resources. Standard paging, filtering, and sorting options are specified
        in the Parameters section below.
      tags:
      - Tables
      parameters:
      - $ref: "#/components/parameters/dataSourceId"
      - name: Accept-Item
        in: header
        required: false
        description: |
          The desired column representation.
          The Accept-Item options are:
          - application/vnd.sas.data.table+json
          - application/vnd.sas.data.table.summary+json
          If the application/vnd.sas.data.table+json type is specified
          or there is no Accept-Item header, the tables are returned as the
          complete representation table objects.
        schema:
          type: string
          enum:
          - application/vnd.sas.data.table+json
          - application/vnd.sas.data.table.summary+json
      - $ref: "#/components/parameters/start"
      - name: limit
        in: query
        description: The maximum number of tables to return in this page of results.
          The actual number of returned tables might be less if the collection has
          been exhausted. Defaults to 10.
        schema:
          type: integer
      - name: filter
        in: query
        description: |
          Filter criteria for returned tables.
          The valid filter fields are name and type if supported by the provider.
          The supported functions are and, or, not, eq, lt, le, gt, ge, contains,
          startsWith, endsWith, and isNull. Some sample queries:
          - Search by name starting with: .../{dataSourceId}/tables?filter=startsWith(name, 'tab')
          - Search by name: .../{dataSourceId}/tables?filter=eq(name, 'table1')
          - Search for multiple tables: .../{dataSourceId}/tables?filter=in(name, 'table1', 'table2', 'table3')
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: |
          Sort returned tables. The sort criteria support the following
          fields in either ascending or descending order (name, type,
          createdBy, modifiedBy, creationTimeStamp and modifiedTimeStamp).
          Some sample sorts:
          - Sort ascending by table name:.../{dataSourceId}/tables?sortBy=name:ascending
          - Sort descending by table name:.../{dataSourceId}/tables?sortBy=name:descending
          The default sort is by name in ascending order.
        schema:
          type: string
          format: sort-criteria
      - $ref: "#/components/parameters/sessionId"
      - $ref: "#/components/parameters/preserveSession"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/tableCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/tableCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/tableCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/tableCollection"
        "400":
          description: |
            An invalid request was made in one of the following scenarios:
            - A negative start value is provided.
            - A negative limit value is provided.
            - A non-existent or unsupported field is specified in the sortBy parameter.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: The data source does not exist.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
    post:
      tags:
      - Tables
      summary: Create a new table
      description: >-
        Creates a new table. If the Content-Type header is set to
        application/json, it maps to the
        application/vnd.ssa.data.table.request+json media type.
      operationId: createTable
      parameters:
      - $ref: "#/components/parameters/dataSourceId"
      - $ref: "#/components/parameters/sessionId"
      - name: wait
        in: query
        required: false
        description: |
          This service implements "long poll", which is how long to wait for an update
          before returning, in floating point seconds. The maximum is 30 seconds.
        schema:
          type: number
          format: float
          default: 0.5
      requestBody:
        content:
          application/vnd.sas.data.table.request+json:
            schema:
              $ref: "#/components/schemas/tableRequest"
            examples:
              schemaval:
                $ref: "#/components/examples/tableURITableRequest"
          application/vnd.sas.data.table.cas.sashdat.request+json:
            schema:
              $ref: "#/components/schemas/tableRequestCasSasHdat"
            examples:
              schemaval:
                $ref: "#/components/examples/datasetTableRequest"
          application/vnd.sas.data.table.cas.data.set.request+json:
            schema:
              $ref: "#/components/schemas/tableRequestCasSasHdat"
            examples:
              schemaval:
                $ref: "#/components/examples/datasetTableRequest"
          application/vnd.sas.data.table.cas.delimited.request+json:
            schema:
              $ref: "#/components/schemas/tableRequestCasSasHdat"
            examples:
              schemaval:
                $ref: "#/components/examples/csvTableRequest"
          application/vnd.sas.data.table.cas.oracle.request+json:
            schema:
              $ref: "#/components/schemas/tableRequestCasSasHdat"
            examples:
              schemaval:
                $ref: "#/components/examples/sashdatTableRequest"
          application/vnd.sas.data.table.cas.odbc.request+json:
            schema:
              $ref: "#/components/schemas/tableRequestCasSasHdat"
            examples:
              schemaval:
                $ref: "#/components/examples/sashdatTableRequest"
          application/vnd.sas.data.table.cas.postgresql.request+json:
            schema:
              $ref: "#/components/schemas/tableRequestCasSasHdat"
            examples:
              schemaval:
                $ref: "#/components/examples/sashdatTableRequest"
          application/vnd.sas.data.table.cas.excel.request+json:
            schema:
              $ref: "#/components/schemas/tableRequestCasSasHdat"
            examples:
              schemaval:
                $ref: "#/components/examples/excelTableRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/tableRequest"
            examples:
              schemaval:
                $ref: "#/components/examples/tableURITableRequest"
        description: The table create request details to use for creating the table.
        required: true
      responses:
        "201":
          description: |
            Created. The requested table has both been created, and its respective job is in
            a terminal state (one of "completed", "canceled", "timedOut", "failed").
          headers:
            Location:
              description: location of the completed job.
              schema:
                type: string
          content:
            application/vnd.sas.data.table.job+json:
              schema:
                $ref: "#/components/schemas/tableJob"
              examples:
                schemaval:
                  $ref: "#/components/examples/tableJob"
            application/json:
              schema:
                $ref: "#/components/schemas/tableJob"
              examples:
                schemaval:
                  $ref: "#/components/examples/tableJob"
        "202":
          description: Accepted. The table creation has not completed.
          headers:
            Location:
              description: Location of the running job.
              schema:
                type: string
          content:
            application/vnd.sas.data.table.job+json:
              schema:
                $ref: "#/components/schemas/tableJob"
              examples:
                schemaval:
                  $ref: "#/components/examples/tableJob"
            application/json:
              schema:
                $ref: "#/components/schemas/tableJob"
              examples:
                schemaval:
                  $ref: "#/components/examples/tableJob"
        "400":
          description: Bad request (the request is not well formed).
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: Not found. Typically, the data source could not be found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  "/dataSources/{dataSourceId}/tables#upload":
    post:
      tags:
      - Tables
      summary: Upload a file
      description: |
        Creates a new table from an uploaded file. Note that this operation is
        synchronous, and it blocks until the file upload is complete. It returns an
        application/vnd.sas.data.table.job+json resource when the upload succeeds or fails.
      operationId: createTableFromMultipart
      parameters:
      - $ref: "#/components/parameters/dataSourceId"
      - name: Content-Type
        in: header
        description: The media type of the form data tableRequest member.
        required: true
        schema:
          type: string
          enum:
          - multipart/form-data
      - name: Content-Item-Type
        in: header
        description: The media type of the form data tableRequest member.
        required: true
        schema:
          type: string
          enum:
          - application/vnd.sas.data.table.cas.sashdat.request+json
          - application/vnd.sas.data.table.cas.data.set.request+json
          - application/vnd.sas.data.table.cas.delimited.request+json
          - application/vnd.sas.data.table.cas.excel.request+json
      - $ref: "#/components/parameters/sessionId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/multipartTableRequest"
            examples:
              schemaval:
                $ref: "#/components/examples/multipartTableRequest"
        description: The table create request details to use for creating the table
          using a file.
        required: true
      responses:
        "201":
          description: Created. The requested table has both been created, and its
            respective job is in a terminal state (one of "completed", "canceled",
            "timedOut", "failed").
          headers:
            Location:
              description: Location of the completed job.
              schema:
                type: string
          content:
            application/vnd.sas.data.table.job+json:
              schema:
                $ref: "#/components/schemas/tableJob"
              examples:
                schemaval:
                  $ref: "#/components/examples/multipartTableJob"
            application/json:
              schema:
                $ref: "#/components/schemas/tableJob"
              examples:
                schemaval:
                  $ref: "#/components/examples/multipartTableJob"
        "400":
          description: Bad request (the request is not well formed).
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: Not found. Typically, the data source could not be found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  "/dataSources/{dataSourceId}/tables/{tableId}":
    get:
      operationId: getTable
      summary: Get a table
      description: Returns information about a single table based on its unique name.
      parameters:
      - $ref: "#/components/parameters/dataSourceId"
      - $ref: "#/components/parameters/tableId"
      - $ref: "#/components/parameters/sessionId"
      - $ref: "#/components/parameters/preserveSession"
      tags:
      - Tables
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.data.table+json:
              schema:
                $ref: "#/components/schemas/table"
              examples:
                schemaval:
                  $ref: "#/components/examples/table"
            application/vnd.sas.data.table.summary+json:
              schema:
                $ref: "#/components/schemas/table"
              examples:
                schemaval:
                  $ref: "#/components/examples/table"
            application/vnd.sas.attributes+json:
              schema:
                $ref: "#/components/schemas/table"
              examples:
                schemaval:
                  $ref: "#/components/examples/table"
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/table"
              examples:
                schemaval:
                  $ref: "#/components/examples/table"
            application/json:
              schema:
                $ref: "#/components/schemas/table"
              examples:
                schemaval:
                  $ref: "#/components/examples/table"
        "404":
          description: |
            One of the following resources does not exist:
            - The data source
            - The table
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
    delete:
      tags:
      - Tables
      summary: Delete a table
      description: Deletes a table resource.
      operationId: deleteTable
      parameters:
      - $ref: "#/components/parameters/dataSourceId"
      - $ref: "#/components/parameters/sessionId"
      - name: wait
        in: query
        required: false
        description: |
          This service implements "long poll", how long to wait for an update
          before returning anyway, in floating point seconds. The maximum is 30 seconds.
        schema:
          type: number
          format: float
          default: 0.5
      - name: soft
        in: query
        required: false
        description: True to perform a soft delete (such as a CAS table unload). False
          for a hard delete.
        schema:
          type: boolean
          default: false
      - name: tableId
        in: path
        description: The URL encoded (i.e. Percent encoded) form of the table's name.
        required: true
        schema:
          type: string
      responses:
        "202":
          description: Accepted. The table deletion has not completed.
          headers:
            Location:
              description: Location of the running job.
              schema:
                type: string
          content:
            application/vnd.sas.data.table.job+json:
              schema:
                $ref: "#/components/schemas/tableJob"
              examples:
                schemaval:
                  $ref: "#/components/examples/deleteTableJob"
            application/json:
              schema:
                $ref: "#/components/schemas/tableJob"
              examples:
                schemaval:
                  $ref: "#/components/examples/deleteTableJob"
        "204":
          description: Created. The requested table has both been deleted, and its
            respective job is in the "completed" state.
          headers:
            Location:
              description: location of the completed job.
              schema:
                type: string
        "400":
          description: Bad request (the request is not well formed).
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: Not found. Typically, the data source could not be found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  "/dataSources/{dataSourceId}/tables/{tableId}/columns":
    get:
      operationId: getColumns
      summary: Get a collection of columns
      description: |
        Returns a collection of column resources. Standard paging, filtering and
        sorting options are specified in the Parameters section below.
      tags:
      - Columns
      parameters:
      - $ref: "#/components/parameters/dataSourceId"
      - $ref: "#/components/parameters/tableId"
      - name: Accept-Item
        in: header
        required: false
        description: |
          The desired column representation. The Accept-Item options are:
          - application/vnd.sas.data.column.summary+json
          - application/vnd.sas.data.column+json
          - application/vnd.sas.summary+json
          If the application/vnd.sas.data.column.summary+json type is
          specified, or there is no Accept-Item header, the columns are
          returned as summary representation column objects. In this case, the
          column contains the following properties: name, type, rawLength,
          formattedLength, and links.
        schema:
          type: string
          enum:
          - application/vnd.sas.data.column.summary+json
          - application/vnd.sas.data.column+json
      - $ref: "#/components/parameters/start"
      - name: limit
        in: query
        description: |
          The maximum number of columns to return in this page of results. The
          actual number of returned columns might be less if the collection
          has been exhausted. Defaults to 25.
        schema:
          type: integer
      - name: filter
        in: query
        description: |
          Filter criteria for returned columns.
          The valid filter fields are name and type if supported by the provider.
          The supported functions are and, or, not, eq, lt, le, gt, ge, contains,
          startsWith, endsWith, and isNull. Some sample queries:
          - Search by name starting with: .../tables/{tableId}/columns?filter=startsWith(name, 'col')
          - Search by name: .../tables/{tableId}/columns?filter=eq(name, 'column1')
          - Search for multiple tables: .../tables/{tableId}/columns?filter=in(name, 'column1', 'column2', 'column3')
        schema:
          type: string
          format: filter-criteria
      - name: sortBy
        in: query
        description: |
          Sort returned tables. The sort criteria support the following
          fields in either ascending or descending order (index, name, type).
          Some sample sorts:
          - Sort ascending by table name: .../tables/{tableId}/columns?sortBy=name:ascending
          - Sort descending by table name: .../tables/{tableId}/columns?sortBy=name:descending
          The default sort is by name in ascending index.
        schema:
          type: string
          format: sort-criteria
      - name: excludeItemLinks
        in: query
        description: Set to true to remove the links from the returned column items.
          Defaults to false.
        schema:
          type: boolean
      - $ref: "#/components/parameters/sessionId"
      - $ref: "#/components/parameters/preserveSession"
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/columnSummaryCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/columnSummaryCollection"
            application/json:
              schema:
                $ref: "#/components/schemas/columnSummaryCollection"
              examples:
                schemaval:
                  $ref: "#/components/examples/columnSummaryCollection"
        "400":
          description: |
            An invalid request was made in one of the following scenarios:
            - A negative start value is provided.
            - A negative limit value is provided.
            - A non-existent or unsupported field is specified in the sortBy parameter.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error400"
        "404":
          description: |
            One of the following resources does not exist:
            - The data source
            - The table
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  "/dataSources/{dataSourceId}/tables/{tableId}/columns/{columnId}":
    get:
      operationId: getColumn
      summary: Get a column
      description: Returns information about a single column based on its unique name.
      parameters:
      - $ref: "#/components/parameters/dataSourceId"
      - $ref: "#/components/parameters/tableId"
      - $ref: "#/components/parameters/columnId"
      - $ref: "#/components/parameters/sessionId"
      - $ref: "#/components/parameters/preserveSession"
      tags:
      - Columns
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.data.column+json:
              schema:
                $ref: "#/components/schemas/column"
              examples:
                schemaval:
                  $ref: "#/components/examples/column"
            application/vnd.sas.data.column.summary+json:
              schema:
                $ref: "#/components/schemas/columnSummary"
              examples:
                schemaval:
                  $ref: "#/components/examples/columnSummary"
            application/json:
              schema:
                $ref: "#/components/schemas/column"
              examples:
                schemaval:
                  $ref: "#/components/examples/column"
        "404":
          description: |
            One of the following resources does not exist:
            - The data source
            - The table
            - The column
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  "/jobs/{jobId}":
    get:
      tags:
      - Jobs
      operationId: getJob
      summary: Get the table job
      description: Get the specified job, which tracks asynchronous table creation
        or deletion processes.
      parameters:
      - $ref: "#/components/parameters/jobId"
      - name: wait
        in: query
        required: false
        description: |
          This service implements "long poll", which is how long to wait for the job to
          complete before returning, in floating point seconds. The maximum is 30 seconds.
        schema:
          type: number
          format: float
          default: 0
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.data.table.job+json:
              schema:
                $ref: "#/components/schemas/tableJob"
              examples:
                schemaval:
                  $ref: "#/components/examples/tableJob"
            application/json:
              schema:
                $ref: "#/components/schemas/tableJob"
              examples:
                schemaval:
                  $ref: "#/components/examples/tableJob"
        "404":
          description: Not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                schemaval:
                  $ref: "#/components/examples/error404"
  "/jobs/{jobId}/state":
    get:
      tags:
      - Jobs
      summary: Get the state of the specified job
      description: Get the state of the specified job.
      operationId: getJobState
      parameters:
      - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: The state.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - pending
                - running
                - canceled
                - completed
                - failed
                - timedOut
              examples:
                schemaval:
                  $ref: "#/components/examples/state"
        "404":
          description: Not found.
          content:
            application/vnd.sas.error:
              schema:
                $ref: "#/components/schemas/error2"
