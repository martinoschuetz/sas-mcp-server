  parameters:
    dataSourceId:
      name: dataSourceId
      in: path
      description: |
        The name of the data source. Its format is `providerId~fs~sourceId~fs~libraryName`.
        The format is a tilda encoded form composed of the following:
        - providerId: name of the provider. Examples: cas, Compute Use GET /dataSources/providers to see the list of available providers.
        - sourceId: refers to server id in case of cas and computeContextId in case of compute.
                    An example sourceId for cas is cas-shared-default. An example sourceId for Compute is 97751fe6-8313-487f-865a-f941c8a75f8f (SAS Studio Compute Context).
                    Use GET /dataSources/providers/{providerId}/sources to see the list of available sources.
        - libraryName: name of the library. Use GET /dataSources/providers/{providerId}/sources/{sourceId}/children to see the the list of available libraries.
        An example dataSourceId for cas is `cas~fs~cas-shared-default~fs~models`.
        An example dataSourceId for Compute is `Compute~fs~97751fe6-8313-487f-865a-f941c8a75f8f~fs~sashelp`.
      required: true
      schema:
        type: string
    tableId:
      name: tableId
      in: path
      description: The URL encoded (i.e. Percent encoded) form of the table's name.
      required: true
      schema:
        type: string
    columnId:
      name: columnId
      in: path
      description: The URL encoded (i.e. Percent encoded) form of the column's name.
      required: true
      schema:
        type: string
    jobId:
      name: jobId
      in: path
      required: true
      description: the jobId
      schema:
        type: string
    start:
      name: start
      in: query
      description: The starting index of the first table in a page. Defaults to 0.
      schema:
        type: integer
    reportUri:
      name: reportUri
      description: Report URI
      in: query
      required: true
      schema:
        type: string
    sessionId:
      name: sessionId
      in: query
      description: |
        The unique identifier of the session used to access the data service
        provider's backing service. When this is not specified, the data service
        provider creates a temporary session, and then terminates it after the
        request is complete. If this is specified, all returned links, except
        the "self" link, have the sessionId query parameter added to their
        respective URIs. Also, they contain an additional session link to the
        application/vnd.sas.data.session resource that corresponds to the
        provided sessionId.
      schema:
        type: string
    preserveSession:
      name: preserveSession
      in: query
      description: |
        This has effect only when the sessionId query parameter is not
        specified. If this is set to true, no sessionId is provided, the session
        created by the data service provider is not be terminated. All returned
        links, except the "self" link, have the sessionId query parameter added
        to their respective URIs. Also, they contain an additional session link
        to the application/vnd.sas.data.session resource that corresponds to the
        provided sessionId. If set to false, or not specified, the session is be
        terminated after the request is complete. The default is false.
      schema:
        type: boolean
    preserveSessionHead:
      name: preserveSession
      in: query
      description: |
        This has no effect when specified for a HEAD request due to the
        inability to return the session as a link. This has effect only when the
        sessionId query parameter is not specified. If this is set to true, no
        sessionId is provided, the session created by the data service provider
        is not terminated. All returned links, except the "self" link, have the
        sessionId query parameter added to their respective URIs. Also, they
        contain an additional session link to the
        application/vnd.sas.data.session resource that corresponds to the
        provided sessionId. If set to false, or not specified, the session is
        destroyed after the request is complete. The default is false.
      schema:
        type: boolean
  schemas:
    table:
      title: Table
      type: object
      description: Information about a table.
      properties:
        providerId:
          type: string
          description: The table provider name.
        dataSourceId:
          type: string
          description: The parent source name.
        name:
          type: string
          description: The unique name of the table.
        label:
          type: string
          description: The user-visible name of this table. This value might vary
            depending on the Accept-Language header.
        type:
          type: string
          description: The type of this table.
        createdBy:
          type: string
          description: The user who created this table.
        modifiedBy:
          type: string
          description: The last user to modify this table.
        attributes:
          type: object
          description: Additional provider-specific attributes.
        creationTimeStamp:
          type: string
          format: date-time
          description: Timestamp of table creation, in yyyy-mm-ddThh:mm:ssZ format.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Timestamp of last table modification, in yyyy-mm-ddThh:mm:ssZ
            format.
        version:
          type: integer
          description: The table schema version.
        links:
          type: array
          description: The links that apply to this table.
          items:
            $ref: "#/components/schemas/link"
    tableCollection:
      title: Table Collection
      type: object
      description: A pageable collection of table objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains Table resources.
            items:
              $ref: "#/components/schemas/table"
    column:
      title: Column
      type: object
      description: Information about a column.
      allOf:
      - $ref: "#/components/schemas/columnSummary"
      properties:
        format:
          $ref: "#/components/schemas/format"
        informat:
          $ref: "#/components/schemas/informat"
        attributes:
          type: object
          description: The attributes for this column.
          additionalProperties:
            type: object
        version:
          type: integer
          description: The column schema version.
        links:
          type: array
          description: The links that apply to the column.
          items:
            $ref: "#/components/schemas/link"
    columnSummary:
      title: Column Summary
      type: object
      description: Summary information about a column.
      properties:
        name:
          type: string
          description: The unique name of the column.
        label:
          type: string
          description: The localized name of this column. This value might vary depending
            on the Accept-Language header.
        index:
          type: integer
          description: |
            The column's 0-based index if this is supported by the provider data service.
            If it is unsupported, it is omitted.
        type:
          type: string
          description: The type of the column.
        rawLength:
          type: integer
          description: The raw rawLength of the column.
        formattedLength:
          type: integer
          description: The formatted rawLength of the column.
        version:
          type: integer
          description: The column schema version.
        links:
          type: array
          description: The links that apply to the column.
          items:
            $ref: "#/components/schemas/link"
    columnSummaryCollection:
      title: Column Summary Collection
      type: object
      description: A pageable collection of column objects.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            description: An array that contains Column resources.
            items:
              $ref: "#/components/schemas/columnSummary"
    format:
      title: Format
      type: object
      description: The resource that represents the format of a column.
      properties:
        name:
          type: string
          description: The format name of the column.
        length:
          type: integer
          description: The length of the column format.
        decimals:
          type: integer
          description: The number of decimals in the column format.
    informat:
      title: Informat
      type: object
      description: The resources that represent the informat of the column.
      properties:
        name:
          type: string
          description: The informat name of the column.
        length:
          type: integer
          description: The length of the column informat.
        decimals:
          type: integer
          description: The number of decimals in the column informat.
    columnArgument:
      title: Column Argument
      description: The column object for the request.
      properties:
        name:
          type: string
          description: The name of the column.
    tableRequestTargetArguments:
      title: Table Request Target arguments
      description: The target arguments for the create request.
      required:
      - tableName
      properties:
        tableName:
          type: string
          description: The name of the target data table.
        label:
          type: string
          description: A label for the table.
        replace:
          type: array
          description: The columns to include from the source table when creating
            the new table.
          items:
            $ref: "#/components/schemas/columnArgument"
    tableRequest:
      title: Table create
      description: This represents the input to create a table.
      x-sas-media-type:
        name: application/vnd.sas.data.table.request
        version: 1
      properties:
        sourceArguments:
          type: object
          description: The arguments for the source data to create the table from.
          additionalProperties:
            $ref: "#/components/schemas/tableRequestCasSasHdatSourceArguments"
        targetArguments:
          type: object
          description: The arguments for the target data table to create.
          additionalProperties:
            $ref: "#/components/schemas/tableRequestTargetArguments"
        version:
          type: integer
          description: This media type's schema version number.
    tableRequestCasSasHdat:
      title: Table create request details for CAS with SASHdat sources
      description: This represents the input to create a table.
      x-sas-media-type:
        name: application/vnd.sas.data.table.cas.sashdat.request
        version: 1
      properties:
        sourceArguments:
          type: object
          description: The arguments for the source data to create the table from.
          additionalProperties:
            $ref: "#/components/schemas/tableRequestCasSasHdatSourceArguments"
        targetArguments:
          type: object
          description: The arguments for the target data table to create.
          additionalProperties:
            $ref: "#/components/schemas/tableRequestTargetArguments"
        version:
          type: integer
          description: This media type's schema version number.
    tableRequestCasSasHdatSourceArguments:
      title: Table Request Source Arguments
      description: The source arguments for the create request.
      required:
      - casServer
      - caslib
      - path
      properties:
        casServer:
          type: string
          description: The name of the source cas server.
        caslib:
          type: string
          description: The name of the source caslib.
        tablePath:
          type: string
          description: The relative path to the table within the caslib.
        includedColumns:
          type: array
          description: The columns to include from the source table when creating
            the new table.
          items:
            $ref: "#/components/schemas/columnArgument"
        filter:
          type: string
          description: A filter (i.e. WHERE clause to be applied to the rows of the
            source table as a filter for the new table).
        encryptionPassword:
          type: string
          description: The passphrase used for a AES encrypted data set. Required
            if the data set uses AES/AES2 encryption.
    tableJob:
      title: Table Create Job
      description: This represents the job to create a table.
      x-sas-media-type:
        name: application/vnd.sas.data.table.job
        version: 1
      properties:
        id:
          type: string
          description: The unique ID that is generated by the API.
        providerId:
          type: string
          description: The ID of the provider.
        type:
          type: string
          description: The type of the table job.
          enum:
          - create
          - delete
        state:
          type: string
          description: The current state of the job.
          enum:
          - pending
          - running
          - canceled
          - completed
          - failed
          - timedOut
        error:
          $ref: "#/components/schemas/error2"
        duration:
          type: number
          format: double
          description: |
            The number of seconds that elapsed from the time the job was started
            until it finished, or the amount of time that has passed if it is
            still running.
        creationTimeStamp:
          description: |
            The creation date, which is the date that the job was submitted.
            This uses the yyyy-MM-ddTHH:mm:ss.SSSZ format.
          type: string
        modifiedTimeStamp:
          description: The date of the last modification. This uses the yyyy-MM-ddTHH:mm:ss.SSSZ
            format.
          type: string
        endTimeStamp:
          description: The date that the job finished. This uses the yyyy-MM-ddTHH:mm:ss.SSSZ
            format.
          type: string
        createdBy:
          description: The user ID of the user who created or submitted the job.
          type: string
        modifiedBy:
          description: The user ID of the user who last modified the job.
          type: string
        attributes:
          description: Additional provider and table specific attributes.
          type: object
        version:
          type: integer
          description: This media type's schema version number.
        links:
          type: array
          description: The links that apply to the column.
          items:
            $ref: "#/components/schemas/link"
    multipartTableRequest:
      title: Table Create request
      description: This represents the table job request.
      x-sas-media-type:
        name: multiform/form-data
        version: 1
      properties:
        tableRequest:
          description: The list of job parameters passed in application/vnd.sas.data.table.request+json
            format.
          type: string
        file:
          description: The multi-part request file to use when creating the new table.
          type: string
          format: binary
      required:
      - tableRequest
      - file
    api:
      description: A list of links to top level resources available from the root
        of the API.
      properties:
        links:
          description: The API's top-level links.
          items:
            $ref: "#/components/schemas/link"
          type: array
        version:
          description: The version number of the API representation. This is version
            1.
          minimum: 1
          type: integer
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
      - httpStatusCode
      - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of
            the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation
            is version 2.
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
