    clinicalLogLine:
      title: Log Line
      description: The representation of a single clinical log line.
      properties:
        version:
          description: The version of the representation. This is version 1.
          type: number
        line:
          type: string
          description: A single line of text from an active log or log file.
        type:
          type: string
          description: The type of log line. Used to sort for errors and warnings.
    clinicalLogLineCollection:
      title: Log Line Collection
      description: >
        A collection of string values representing the clinical job submission's log
        lines.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/clinicalLogLine"
      example:
        value:
          name: clinicalLogLines
          accept: application/vnd.sas.clinical.log.line+json
          start: 0
          count: 4
          items:
          - version: 1
            line: Wednesday, June 26, 2024 05:27:34 PM
            type: normal
          - version: 1
            line: "NOTE: Additional information about Host:"
            type: note
          - version: 1
            line: "WARNING: The data set WORK._NULL may be incomplete. When this step\
              \ was stopped there were 0 observations and 0 variables."
            type: warning
          - version: 1
            line: "ERROR: Failed to complete the task. Additional information:"
            type: error
          limit: 10
          version: 2
    clinicalListingLineCollection:
      title: Listing Line Collection
      description: A collection of strings that represents the content of the listing
        file.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
        properties:
          items:
            type: array
            items:
              type: string
      example:
        value:
          name: clinicalListingLines
          accept: application/json
          start: 0
          count: 3
          items:
          - "  The SAS System                  Tuesday, January 22, 2019 09:14:22\
            \ PM   1"
          - " Obs    Name       Sex    Age    Height    Weight"
          - " 1    Alfred      M      14     69.0      112.5"
          limit: 10
          version: 1
    clinicalJobManifestExternalReference:
      title: Clinical Job Manifest External Reference
      description: The external references stored within the clinical job manifest.
      properties:
        name:
          description: 'The name of the external reference.'
          type: 'string'
        location:
          description: 'The parent location of the external reference.'
          type: 'string'
        referencingProgram:
          description: 'The full path to the referencing program that referenced this
            file.'
          type: 'string'
    clinicalJobManifestInput:
      description: An input used in a clinical job submission that generated the clinical
        job manifest.
      allOf:
      - $ref: "#/components/schemas/clinicalJobManifestFile"
      - type: object
        properties:
          referencingProgram:
            description: The path to the program that referenced this input.
            type: string
    clinicalJobManifestSystemFile:
      description: >
        Clinical resource represents a system file such as log or lst generated by
        the clinical job submission that generated this manifest.
      allOf:
      - $ref: "#/components/schemas/clinicalJobManifestFile"
    clinicalJobManifestOutput:
      description: >
        An output generated by the clinical job submission that generated this manifest.
      allOf:
      - $ref: "#/components/schemas/clinicalJobManifestFile"
      - type: object
        properties:
          referencingProgram:
            description: The path to the program that referenced this input.
            type: string
    clinicalJobManifestProgram:
      title: Manifest Program
      description: Details of a program run as part of the job submission.
      allOf:
      - $ref: "#/components/schemas/clinicalJobManifestFile"
      - type: object
        properties:
          executionState:
            description: 'The execution state of the program.'
            type: string
            enum:
            - 'UNEXECUTED'
            - 'FAILED'
            - 'CANCELED'
            - 'ERRORS'
            - 'WARNINGS'
            - 'SUCCESSFUL'
          executionTime:
            description: 'The time it took to execute the program.'
            type: number
          executionInfo:
            description: 'The information about the program execution.'
            type: string
    clinicalJobManifestJob:
      title: Clinical Manifest Job
      description: The details of the job that was submitted to generate this clinical
        job manifest.
      allOf:
      - $ref: "#/components/schemas/clinicalJobManifestFile"
      - type: object
        properties:
          owner:
            description: User who owns the clinical job file.
            type: string
          ownerDisplayName:
            description: Display name of clinical job owner.
            type: string
          runAsOwner:
            description: Indicates if the clinical job in the repository has been
              marked to be run as owner.
            type: boolean
          description:
            description: Description of the clinical job.
            type: string
    clinicalJobManifestFile:
      title: Clinical Manifest File
      description: A file resource in a clinical job manifest.
      properties:
        resource:
          $ref: "#/components/schemas/clinicalResource"
        lastModifiedTimeStamp:
          description: The date the output file was last modified.
          type: string
          format: 'date-time'
        size:
          type: number
          description: The size of the file in bytes.
        digest:
          description: The hash value of a file based on MD5 algorithm. This only
            applies to repository files.
          type: string
    clinicalJobManifestJobSubmission:
      title: Clinical Job Manifest Job Submission
      description: Details about the job submission that generated this clinical job
        manifest.
      properties:
        state:
          type: string
          description: The current state of the clinical job submission.
          enum:
          - NOT_STARTED
          - STARTED
          - RUNNING_TASKS
          - CANCELING
          - POST_EXECUTION_PUBLISHING
          - COMPLETED_SUCCESSFUL
          - COMPLETED_PROGRAM_ERRORS
          - COMPLETED_CHECKIN_ERROR
          - COMPLETED_PROGRAM_ERRORS_CHECKIN_ERROR
          - COMPLETED_FAILED
          - COMPLETED_CANCELED
          - COMPLETED_PROGRAM_WARNINGS
          - COMPLETED_PROGRAM_WARNINGS_CHECKIN_ERROR
        jobRunContext:
          description: 'Run context of the clinical job submission.'
          type: string
          enum:
          - INTERACTIVE
          - INTERACTIVE_RUN_AND_POPULATE
          - INTERACTIVE_RUN_AND_POPULATE_RELATIVE
          - SCHEDULER
          - INTERACTIVE_TEST
        submittedTimeStamp:
          type: string
          format: date-time
          description: The date and time the clinical job submission was submitted.
        submittedBy:
          description: User that this clinical job submission was submitted by.
          type: string
        submittedByDisplayName:
          description: Display name of the user that this clinical job submission
            was submitted by.
          type: string
        completedTimeStamp:
          type: string
          format: date-time
          description: The date and time the clinical job submission was completed.
        info:
          description: Provides additional information about the clinical job submission
            status.
          type: string
        runAsUser:
          description: User context used for the clinical job submission. Is the owner
            of the clinical job in the repository when the clinical job is marked
            to be run as the clinical job owner.
          type: string
        runAsUserDisplayName:
          description: Display name of user context used for the clinical job submission.
          type: string
    clinicalJobManifestTransferMetric:
      title: Clinical Job Manifest Transfer Metric
      description: Details about the time, size, and number of files synced during
        a clinical job submission.
