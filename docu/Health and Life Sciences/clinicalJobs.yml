---
openapi: 3.0.3
info:
  version: "1"
  title: SAS Clinical Job Management
  description: >
    The SAS Clinical Jobs Management API enables you to manage clinical job
    definitions and submit clinical jobs.
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
- url: https://example.com/clinicalJobs
  description: kubernetes mock server
tags:
- name: Root
  description: The operations for the root resource.
- name: Clinical Job Definitions
  description: The operations for defining clinical jobs.
- name: Clinical Job Submissions
  description: The operations for submitting clinical jobs and monitoring submission
    status and results.
- name: Clinical Job Schedules
  description: The operations for viewing clinical job schedules.
paths:
  /:
    get:
      tags:
      - Root
      summary: Get the links for the API
      description: Returns the links to the top-level resources for the API.
      operationId: root
      responses:
        "200":
          description: The request succeeded.
          headers:
            Content-Type:
              schema:
                type: string
              description: Describes the representation of the collection response.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/apiResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                json:
                  $ref: "#/components/examples/apiResponse"
        "404":
          description: The service is not available.
    head:
      tags:
      - Root
      summary: Get the headers for the API
      description: >
        Returns the headers for the API. Also determines whether the service
        provided by the API is available.
      operationId: headersForRoot
      responses:
        "200":
          description: The service is running.
          headers:
            Content-Type:
              schema:
                type: string
        "404":
          description: The service is not available.
  /definitions:
    post:
      tags:
      - Clinical Job Definitions
      summary: Create a new clinical job in the user's workspace
      description: >
        Creates a new clinical job with the specified clinical job contents in the
        user's
        workspace. The clinical job file is created with a '.cjob' file extension.
      operationId: createClinicalJob
      parameters:
      - name: useRelativePaths
        in: query
        description: >
          Specifies whether the paths referenced within the clinical job should
          be saved as relative paths. Relative paths are relative to the clinical
          job's location.  The default is true.
        schema:
          type: boolean
        example: true
      requestBody:
        required: true
        description: |
          A clinical job with resource and attribute details.
        content:
          application/vnd.sas.clinical.job:
            schema:
              $ref: "#/components/schemas/clinicalJob"
            examples:
              json:
                $ref: "#/components/schemas/clinicalJob/example"
          application/json:
            schema:
              $ref: "#/components/schemas/clinicalJob"
            examples:
              json:
                $ref: "#/components/schemas/clinicalJob/example"
      responses:
        "201":
          description: The request succeeded and the clinical job was created.
          content:
            application/vnd.sas.clinical.job:
              schema:
                $ref: "#/components/schemas/clinicalJob"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJob/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalJob"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJob/example"
        "400":
          description: Bad Request
    patch:
      tags:
      - Clinical Job Definitions
      summary: Update clinical job attributes
      description: >
        Updates the editable attributes of the specified clinical job definition
        in the user's workspace.
      operationId: patchClinicalJob
      parameters:
      - name: useRelativePaths
        in: query
        description: >
          Specifies whether the paths referenced within the clinical job should
          be saved as relative paths. Relative paths are relative to the clinical
          job's location.  The default is true.
        schema:
          type: boolean
        example: true
      requestBody:
        required: true
        description: The attributes on the clinical job to update.
        content:
          application/vnd.sas.clinical.job:
            schema:
              $ref: "#/components/schemas/clinicalJob"
            examples:
              json:
                $ref: "#/components/schemas/clinicalJob/example"
          application/json:
            schema:
              $ref: "#/components/schemas/clinicalJob"
            examples:
              json:
                $ref: "#/components/schemas/clinicalJob/example"
      responses:
        "200":
          description: OK - the clinical job was updated.
          content:
            application/vnd.sas.clinical.job:
              schema:
                $ref: "#/components/schemas/clinicalJob"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJob/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalJob"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJob/example"
        "400":
          description: Bad Request
        "404":
          description: Not found - the clinical job could not be found.
  "/definitions/{path}":
    x-sas-internal: true
    get:
      tags:
      - Clinical Job Definitions
      summary: Get the specified clinical job definition
      description: >
        Returns the specified clinical job definition from the specified
        resource location. The resource location could be in the WORKSPACE or
        REPOSITORY. <p><b>Authorization:</b>  The REPOSITORY resource location requires
        READ permission.
      operationId: getClinicalJobDefinition
      parameters:
      - $ref: '#/components/parameters/pathPathParameter'
      - $ref: '#/components/parameters/resourceLocationParameter'
      - $ref: '#/components/parameters/fileVersionParameter'
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.clinical.job:
              schema:
                $ref: "#/components/schemas/clinicalJob"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJob/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalJob"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJob/example"
        "404":
          description: Not found - the specified clinical job could not be found.
    head:
      tags:
      - Clinical Job Definitions
      summary: Determine whether the specified clinical job exists at the specified
        location
      description: >
        Checks whether the specified clinical job exists at the resource
        location. <p><b>Authorization:</b> The REPOSITORY resource location requires
        READ permission.
      operationId: headersForClinicalJob
      parameters:
      - $ref: '#/components/parameters/pathPathParameter'
      - $ref: '#/components/parameters/resourceLocationParameter'
      - $ref: '#/components/parameters/fileVersionParameter'
      responses:
        "200":
          description: OK - the clinical job exists.
        "404":
          description: Not found - the specified clinical job could not be found.
  "/repository/definitions/{itemId}":
    get:
      tags:
      - Clinical Job Definitions
      summary: Get the specified clinical job definition
      description: >
        Returns the specified clinical job definition from the repository.
        <p><b>Authorization:</b> Requires READ permission.
      operationId: getClinicalRepositoryJob
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - $ref: '#/components/parameters/fileVersionParameter'
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.clinical.job:
              schema:
                $ref: "#/components/schemas/clinicalJob"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJob/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalJob"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJob/example"
        "404":
          description: Not found - the specified clinical job could not be found.
    head:
      tags:
      - Clinical Job Definitions
      summary: Determine whether the clinical job with the specified identifier and
        version (if specified) exists
      description: >
        Checks whether the clinical job exists with the specified identifier and version
        (if specified).
        <p><b>Authorization:</b> Requires READ permission.
      operationId: headersForClinicalRepositoryJob
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - $ref: '#/components/parameters/fileVersionParameter'
      responses:
        "200":
          description: OK - the clinical job exists.
        "404":
          description: Not found - the specified clinical job could not be found.
  /manifests/{path}:
    get:
      x-sas-internal: true
      tags:
      - Clinical Job Submissions
      summary: Get the specified clinical job manifest
      description: >
        Returns the specified clinical job manifest from the specified resource location.
        The resource location could be in the WORKSPACE or REPOSITORY.
         <p><b>Authorization:</b>  The REPOSITORY resource location requires READ
        permission.
      operationId: getClinicalJobManifest
      parameters:
      - $ref: '#/components/parameters/pathPathParameter'
      - $ref: '#/components/parameters/resourceLocationParameter'
      - $ref: '#/components/parameters/fileVersionParameter'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.sas.clinical.job.manifest:
              schema:
                $ref: "#/components/schemas/clinicalJobManifest"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobManifest/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalJobManifest"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobManifest/example"
        '404':
          description: 'Not found - the specified clinical job manifest could not
            be found.'
    head:
      tags:
      - Clinical Job Submissions
      summary: Determine whether the clinical job manifest exists at the specified
        location
      description: >
        Checks whether the specified clinical job manifest exists at the resource
        location. <p><b>Authorization:</b>  REPOSITORY resource location -
        Requires READ permission.
      operationId: headersForClinicalJobManifest
      parameters:
      - $ref: '#/components/parameters/pathPathParameter'
      - $ref: '#/components/parameters/resourceLocationParameter'
      - $ref: '#/components/parameters/fileVersionParameter'
      responses:
        "200":
          description: OK - the clinical job manifest exists.
        "404":
          description: Not found - the specified clinical job manifest could not be
            found.
  /submissions:
    get:
      tags:
      - Clinical Job Submissions
      summary: Get the collection of clinical job submissions
      description: >
        Returns a collection of clinical job submissions for the current user. The
        default sort is
        submittedTimeStamp:descending:primary.  <p><b>Authorization:</b>  Requires
        administrative privileges to get clinical job submissions for all or
        other users.
      operationId: getClinicalJobSubmissions
      parameters:
      - name: Accept
        in: header
        description: >
          The requested representation of the clinical job submissions. Media type
          'application/vnd.sas.clinical.job.submission.summary+json' is the default.
        required: false
        schema:
          type: string
          enum:
          - application/vnd.sas.clinical.job.submission+json
          - application/vnd.sas.clinical.job.submission.summary+json
      - $ref: "#/components/parameters/startParameter"
      - $ref: "#/components/parameters/limitParameter"
      - $ref: "#/components/parameters/filterParameter"
      - $ref: "#/components/parameters/sortByParameter"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/clinicalJobSubmissionSummaryCollection"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobSubmissionSummaryCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalJobSubmissionSummary"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobSubmissionSummaryCollection/example"
    post:
      tags:
      - Clinical Job Submissions
      summary: Run a clinical job
      description: Performs the run action on the specified clinical job. Clinical
        jobs can be run in the workspace or repository using this request.
      operationId: submitClinicalJob
      requestBody:
        required: true
        description: Provides the clinical job resource and run information to perform
          the action.
        content:
          application/vnd.sas.clinical.job.run.info+json:
            schema:
              $ref: "#/components/schemas/clinicalJobRunInfo"
            examples:
              json:
                $ref: "#/components/schemas/clinicalJobRunInfo/example"
          application/json:
            schema:
              $ref: "#/components/schemas/clinicalJobRunInfo"
            examples:
              json:
                $ref: "#/components/schemas/clinicalJobRunInfo/example"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.clinical.job.submission+json:
              schema:
                $ref: "#/components/schemas/clinicalJobSubmission"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobSubmission/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalJobSubmission"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobSubmission/example"
        "400":
          description: The specified action is not supported.
  "/submissions/{jobSubmissionId}":
    get:
      tags:
      - Clinical Job Submissions
      summary: Get the specific clinical job submission entry
      description: |
        Returns the specified clinical job submission item by ID.
      operationId: getClinicalJobSubmission
      parameters:
      - $ref: '#/components/parameters/jobSubmissionIdPathParameter'
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.clinical.job.submission+json:
              schema:
                $ref: "#/components/schemas/clinicalJobSubmission"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobSubmission/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalJobSubmission"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobSubmission/example"
        "404":
          description: Not found - the specified clinical job submission could not
            be found.
    head:
      tags:
      - Clinical Job Submissions
      summary: Determine whether the specified clinical job submission exists
      description: |
        Checks whether the specified clinical job submission exists.
      operationId: headersForClinicalJobSubmission
      parameters:
      - $ref: '#/components/parameters/jobSubmissionIdPathParameter'
      responses:
        "200":
          description: OK - the clinical job submission exists.
        "404":
          description: Not found - the specified clinical job submission could not
            be found.
  "/submissions/{jobSubmissionId}/manifest":
    get:
      tags:
      - Clinical Job Submissions
      summary: Get the manifest for the clinical job submission
      description: |
        Returns the specified clinical job manifest generated by the clinical job submission with the specified clinical job submission ID.
      operationId: getManifestByClinicalJobSubmission
      parameters:
      - $ref: '#/components/parameters/jobSubmissionIdPathParameter'
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.clinical.job.manifest:
              schema:
                $ref: "#/components/schemas/clinicalJobManifest"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobManifest/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalJobManifest"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobManifest/example"
        "404":
          description: Not found - the specified clinical job submission or manifest
            could not be found.
  "/submissions/{jobSubmissionId}/state":
    put:
      x-sas-internal: true
      tags:
      - Clinical Job Submissions
      summary: Sets the current state of the specified clinical job submission entry
        You can use this method to set the state to canceled
      description: >
        Set the current state of the specified clinical job submission item to
        the specified state.  <p><b>Authorization:</b> Users can update only the
        state of their own clinical job submissions. Clinical Job
        Administrative authorization is required to cancel another user's job
        submissions.
      operationId: updateClinicalJobSubmissionState
      parameters:
      - $ref: '#/components/parameters/jobSubmissionIdPathParameter'
      - name: value
        in: query
        schema:
          type: string
        required: true
        description: The new state to be applied to the clinical job submission.
        example: canceled
      responses:
        "202":
          description: Accepted - The request to update the clinical job submission
            state has been accepted. If the "canceled" value was specified, the clinical
            job submission is set to the 'Canceling' state while the request is being
            processed.
          content:
            text/plain:
              schema:
                type: string
              example: CANCELING
        "400":
          description: Bad Request - when the specified value is not in the allowed
            values list.
        "404":
          description: The specified clinical job submission could not be found.
        "409":
          description: The set state request conflicts with the current state of the
            clinical job submission.
    get:
      tags:
      - Clinical Job Submissions
      summary: Get the current state of the specific clinical job submission entry
      description: >
        Returns the current state of the specified clinical job submission item
        by ID.
      operationId: getClinicalJobSubmissionState
      parameters:
      - $ref: '#/components/parameters/jobSubmissionIdPathParameter'
      responses:
        "200":
          description: OK - The current state of the clinical job submission entry.
          content:
            text/plain:
              schema:
                type: string
              example: RUNNING_TASKS
            application/json:
              schema:
                type: string
              example: RUNNING_TASKS
        "404":
          description: Not found - the specified clinical job submission could not
            be found.
  "/submissions/{jobSubmissionId}/listing":
    get:
      x-sas-internal: true
      tags:
      - Clinical Job Submissions
      summary: Get the listing content of an active clinical job submission
      description: >
        Returns a collection of clinical listing lines for the provided clinical
        job submission ID.
      operationId: getJobSubmissionListingContents
      parameters:
      - $ref: '#/components/parameters/jobSubmissionIdPathParameter'
      - $ref: "#/components/parameters/startParameter"
      - $ref: "#/components/parameters/limitParameter"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/clinicalListingLineCollection"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalListingLineCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalListingLineCollection"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalListingLineCollection/example"
        "404":
          description: >
            The clinical job submission has completed and the submission listing
            is no longer available. The completed submission listing can be
            obtained from the listing location specified in the clinical job definition.
  "/submissions/{jobSubmissionId}/log/lines":
    get:
      x-sas-internal: true
      tags:
      - Clinical Job Submissions
      summary: Get the log contents of an active clinical job submission
      description: >
        Returns a collection of clinical log lines for the provided clinical job
        submission ID.
      operationId: getJobSubmissionLogContents
      parameters:
      - $ref: '#/components/parameters/jobSubmissionIdPathParameter'
      - $ref: "#/components/parameters/startParameter"
      - $ref: "#/components/parameters/limitParameter"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/clinicalLogLineCollection"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalLogLineCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalLogLineCollection"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalLogLineCollection/example"
        "404":
          description: >
            The clinical job submission has completed and the submission log is
            no longer available. The completed submission log can be obtained
            from the log location specified in the clinical job definition.
  "/repository/manifests/{itemId}":
    get:
      tags:
      - Clinical Job Submissions
      summary: Get the specified clinical job manifest
      description: >
        Returns the specified clinical job manifest from the repository.
        <p><b>Authorization:</b> Requires READ permission.
      operationId: getClinicalRepositoryJobManifest
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - $ref: '#/components/parameters/fileVersionParameter'
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.clinical.job.manifest:
              schema:
                $ref: "#/components/schemas/clinicalJobManifest"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobManifest/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalJobManifest"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalJobManifest/example"
        "404":
          description: Not found - the specified clinical job manifest could not be
            found.
    head:
      tags:
      - Clinical Job Submissions
      summary: Determine whether the clinical job manifest with the specified identifier
        and version (if specified) exists
      description: >
        Checks whether the clinical job manifest exists with the specified identifier
        and version (if specified).
                location. <p><b>Authorization:</b> Requires READ permission.
      operationId: headersForClinicalRepositoryJobManifest
      parameters:
      - $ref: '#/components/parameters/itemIdPathParameter'
      - $ref: '#/components/parameters/fileVersionParameter'
      responses:
        "200":
          description: OK - the clinical job manifest exists.
        "404":
          description: Not found - the specified clinical job manifest could not be
            found.
  /schedules:
    get:
      tags:
      - Clinical Job Schedules
      summary: Get the collection of clinical job schedules
      description: >
        Returns a collection of clinical job schedules for the current user. The default
        sort is name:ascending:primary
        <p><b>Authorization:</b>  Requires
        administrative privileges to get clinical job schedules for all or other
        users.
      operationId: getClinicalJobSchedules
      parameters:
      - name: limit
        in: query
        description: >
          The maximum number of items to return. The default is 1000 which is the
          maximum. Paging is not supported but filter
          and sort are available to customize the schedules that are returned.
        schema:
          type: integer
        example: 1000
      - $ref: "#/components/parameters/filterParameter"
      - $ref: "#/components/parameters/sortByParameter"
      responses:
        "200":
          description: OK
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/clinicalScheduleCollection"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalScheduleCollection/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalScheduleCollection"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalScheduleCollection/example"
    post:
      x-sas-internal: true
      tags:
      - Clinical Job Schedules
      summary: Create a clinical job schedule
      description: Creates a schedule for the specified clinical job. Clinical jobs
        can be in the workspace or repository.
      operationId: createClinicalSchedule
      requestBody:
        required: true
        description: Provides the clinical job resource and run information to perform
          the action.
        content:
          application/vnd.sas.clinical.job.schedule.definition+json:
            schema:
              $ref: '#/components/schemas/clinicalScheduleDefinition'
            examples:
              json:
                $ref: "#/components/schemas/clinicalScheduleDefinition/example"
          application/json:
            schema:
              $ref: "#/components/schemas/clinicalScheduleDefinition"
            examples:
              json:
                $ref: "#/components/schemas/clinicalScheduleDefinition/example"
      responses:
        "201":
          headers:
            ETag:
              $ref: '#/components/headers/Etag'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
          description: Schedule created successfully.
          content:
            application/vnd.sas.clinical.job.schedule+json:
              schema:
                $ref: "#/components/schemas/clinicalSchedule"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalSchedule/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalSchedule"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalSchedule/example"
        "400":
          description: The specified action is not supported.
  "/schedules/{scheduleId}":
    get:
      x-sas-internal: true
      tags:
      - Clinical Job Schedules
      summary: Get the specific clinical job schedule
      description: |
        Returns the specified clinical job schedule by ID.
      operationId: getClinicalJobSchedule
      parameters:
      - $ref: '#/components/parameters/scheduleIdPathParameter'
      responses:
        "200":
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/Etag'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
          content:
            application/vnd.sas.clinical.job.schedule+json:
              schema:
                $ref: "#/components/schemas/clinicalSchedule"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalSchedule/example"
            application/json:
              schema:
                $ref: "#/components/schemas/clinicalSchedule"
              examples:
                json:
                  $ref: "#/components/schemas/clinicalSchedule/example"
        "404":
          description: Not found - the specified clinical job schedule could not be
            found.
    head:
      x-sas-internal: true
      tags:
      - Clinical Job Schedules
      summary: Determine whether the specified clinical job schedule exists
      description: |
        Checks whether the specified clinical job schedule exists.
      operationId: headersForClinicalJobSchedule
      parameters:
      - $ref: '#/components/parameters/scheduleIdPathParameter'
      responses:
        "200":
          description: OK - the clinical job schedule exists.
          headers:
            ETag:
              $ref: '#/components/headers/Etag'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
        "404":
          description: Not found - the specified clinical job schedule could not be
            found.
    delete:
      x-sas-internal: true
      tags:
      - Clinical Job Schedules
      summary: Delete a clinical job schedule
      description: Deletes a clinical job schedule.
      operationId: deleteClinicalJobSchedule
      parameters:
      - $ref: '#/components/parameters/scheduleIdPathParameter'
      responses:
        "204":
          description: The schedule was successfully deleted.
        "404":
          description: Not found
  /schedules/{scheduleId}/future:
    get:
      tags:
      - Clinical Job Schedules
      summary: Get the list of future run times for the clinical job schedule
      description: >
        Returns a list of date strings of future run times in client's time zone.
        <p><b>Authorization:</b>  Requires
        administrative privileges to get clinical job schedules for all or other
        users.
      operationId: getClinicalJobSchedulesFireTimes
      parameters:
      - $ref: '#/components/parameters/scheduleIdPathParameter'
      - $ref: '#/components/parameters/limitParameter'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - 2025-08-20T20:15:00Z
              - 2025-08-21T20:15:00Z
              - 2025-08-22T20:15:00Z
              - 2025-08-23T20:15:00Z
        "404":
          description: Not found - the specified clinical job schedule could not be
            found.
components:
  headers:
    Etag:
      description: The E-tag for response
      schema:
        type: string
      example: '"lgdxya1m"'
    Last-Modified:
      description: The time at which the resource was last updated.
      schema:
        type: string
      example: '2024-01-26T18:25:43.511Z'
  parameters:
    startParameter:
      name: start
      in: query
      description: The 0-based offset of the first item to return. The default is
        0.
      schema:
        type: integer
      example: 10
    limitParameter:
      name: limit
      in: query
      description: The maximum number of items to return. The default is 10.
      schema:
        type: integer
      example: 10
    filterParameter:
      name: filter
      in: query
      description: >
        Filter criteria for items. See [Filtering in REST
        APIs](https://developer.sas.com/apis/rest/Topics/#filters) for more information.
      schema:
        type: string
        format: filter-criteria
      example: eq(name,'ACME')
    sortByParameter:
      name: sortBy
      in: query
      description: >
        Sorts the returned items. See [Sorting in REST
        APIs](https://developer.sas.com/apis/rest/Topics/#sorting) for more information.
      schema:
        type: string
        format: sort-criteria
        example: name:ascending:primary
    fileVersionParameter:
      name: fileVersion
      in: query
      schema:
        type: string
      required: false
      description: >
        The version of the file. This applies only to files in the repository. A dash
        (-) represents an unversioned file.  If no version is specified, the latest
        is returned.
      example: "2.0"
    itemIdPathParameter:
      name: itemId
      in: path
      schema:
        type: string
      required: true
      description: The unique identifier for the repository clinical job.
      example: b9b7f939-97cd-4609-a2b3-20a01fbd192d
    jobSubmissionIdPathParameter:
      name: jobSubmissionId
      in: path
      schema:
        type: string
      required: true
      description: The unique identifier for the clinical job submission.
      example: d6eefec9-dcc2-4574-8af8-69897038d9c5
    scheduleIdPathParameter:
      name: scheduleId
      in: path
      schema:
        type: string
      required: true
      description: The unique identifier for the clinical job schedule.
      example: 0b89ff2c-36ea-4394-8caf-6819c803580a
    pathPathParameter:
      name: path
      in: path
      schema:
        type: string
      required: true
      description: The file path in the user's workspace or repository
      example: /Org/study1/jobs/AdverseEventReport.cjob
    resourceLocationParameter:
      name: resourceLocation
      in: query
      schema:
        type: string
      required: false
      description: >
        The resource location of the file. Valid values are WORKSPACE and REPOSITORY.
        The default is WORKSPACE.
      example: WORKSPACE
  schemas:
    clinicalResource:
      title: Clinical Resource
      type: object
      description: >
        Clinical resource represents a file or container item in the user's workspace
        or in the clinical repository.
      properties:
        version:
          description: The version of the representation. This is version 1.
          type: number
        name:
          type: string
          description: The name of the item.
        path:
          type: string
          description: The full path of the item.
        location:
          type: string
          description: The location of the item. This is the parent container path
            for the item.
        resourceLocation:
          description: The resource location of the item.
          type: string
          enum:
          - REPOSITORY
          - WORKSPACE
    repositoryResource:
      title: Repository Resource
      type: object
      description: The schema for a repository resource.
      allOf:
      - $ref: "#/components/schemas/clinicalResource"
      - type: object
        properties:
          fileVersion:
            type: string
            description: The file version of the associated resource. A dash (-) represents
              an unversioned file.
          id:
            type: string
            description: The ID of the associated resource.
    workspaceResource:
      title: Workspace Resource
      type: object
      description: The schema for a workspace resource.
      allOf:
      - $ref: "#/components/schemas/clinicalResource"
      - type: object
        properties:
          workspace:
            type: string
            description: The workspace identifier for the associated resource.
    clinicalJobParameter:
      title: Clinical Job Parameter
      type: object
      description: Parameter for passing values to a clinical job.
      properties:
        version:
          description: The version of the representation. This is version 1.
          type: number
        name:
          description: The name of the clinical job parameter.
          type: string
        label:
          description: The label for the clinical job parameter.
          type: string
        type:
          description: Describes the type of parameter.
          type: string
          enum:
          - CHARACTER
          - CHARACTER_MASKED
          - NUMERIC
          - DATE
          - FOLDER
          - FILE
        defaultValue:
          description: The default value of the parameter.
          type: object
      example:
        value:
          name: char_param
          label: character-parameter
          type: CHARACTER
          defaultValue:
            value: "This is a test"
    clinicalJobProgram:
      title: Clinical Job Program
      type: object
      description: A program to be run during the execution of a clinical job.
      properties:
        path:
          description: The full path to the program.
          type: string
        location:
          description: The parent path of the program.
          type: string
        name:
          description: The name of the program.
          type: string
        fileVersion:
          description: The optional file version of the program. If a file version
            is not specified, the latest version is used.
          type: string
    clinicalJobPublishSetup:
      title: Clinical Job Publish Setup
      type: object
      description: The file and folders to be used in the submission of a clinical
        repository job. This information does not apply to workspace job submissions.
      properties:
        files:
          description: The collection of files for the publish setup.
          type: array
          items:
            $ref: "#/components/schemas/clinicalJobPublishSetupFile"
        folders:
          description: The collection of folders for the publish setup.
          type: array
          items:
            $ref: "#/components/schemas/clinicalJobPublishSetupFolder"
    clinicalJobPublishSetupFile:
      title: Clinical Job Publish Setup File
      description: A single publish setup file.
      type: object
      properties:
        path:
          description: The full path to the file.
          type: string
        fileVersion:
          description: The version of the file to be used.
          type: string
    clinicalJobPublishSetupFolder:
      title: Clinical Job Publish Setup Folder
      description: A single publish setup folder.
      type: object
      properties:
        path:
          description: The full path to the folder.
          type: string
        includeFiles:
          description: Indicates whether to include the files inside of the folder.
          type: boolean
        includeSubfolders:
          description: Indicates whether to include the subfolders of the folder.
          type: boolean
    clinicalJobPublishCheckin:
      title: Clinical Job Publish Checkin
      type: object
      description: >
        Check-in specification for output files from the clinical repository job submission.
        This information does not apply  to workspace job submissions.
      properties:
        fileVersion:
          description: >
            The versioning of any output files from the clinical job
            execution. This value can be empty, "MAJOR", "MINOR", or a custom
            version value. If enableVersioningOnNewFiles is false (the default), this
            value determines how
            new versions of existing versioned files are generated. The default is
            "MAJOR".
          type: string
        enableVersioningOnNewFiles:
          type: boolean
          description: >
            Specifies whether new files that are checked in from a clinical repository
            job submission should be versioned. The
            default is false. If the value is true, the new files are versioned according
            to the fileVersion value.  The default
            fileVersion value is "MAJOR"
        locations:
          description: The list of locations for output files from the clinical job
            execution.
          type: array
          items:
            $ref: "#/components/schemas/clinicalJobPublishCheckinLocation"
    clinicalJobPublishCheckinLocation:
      title: Clinical Job Publish Check-in Location
      type: object
      description: A single check-in location.
      properties:
        path:
          description: The path to the check-in location.
          type: string
        includeSubfolders:
          description: Indicates whether to include subfolders.
          type: boolean
    clinicalJob:
      title: Clinical Job
      description: >
        A batch of executable programs and
        the parameters and inputs required to execute the programs. For
        repository jobs, the method for handling the check-in of generated outputs
        can also
        be specified in the clinical job definition.
      properties:
        version:
          description: The version of the representation. This is version 1.
          type: number
        resource:
          description: >
            Clinical resource represents a file or container item in the user's
            workspace or in the clinical repository.
          oneOf:
          - $ref: "#/components/schemas/repositoryResource"
          - $ref: "#/components/schemas/workspaceResource"
        description:
          description: Description of the job.
          type: string
        logsLocation:
          description: Location of the log file from the clinical job execution.
          type: string
        manifestLocation:
          description: Location of the manifest file from the clinical job execution.
          type: string
        resultsLocation:
          description: Location of the results file from the clinical job execution.
          type: string
        owner:
          description: User who owns the clinical job file in the repository.
          type: string
        ownerDisplayName:
          description: Display name of clinical job owner in the repository.
          type: string
        runAsOwner:
          description: Indicates whether the clinical job in the repository has been
            marked to be run as owner.
          type: boolean
        programs:
          description: The programs to be run when the clinical job is executed.
          type: array
          items:
            $ref: "#/components/schemas/clinicalJobProgram"
        parameters:
          description: Definition of parameters that can be specified for the clinical
            job.
          type: array
          items:
            $ref: "#/components/schemas/clinicalJobParameter"
        publishSetup:
          $ref: "#/components/schemas/clinicalJobPublishSetup"
        publishCheckin:
          $ref: "#/components/schemas/clinicalJobPublishCheckin"
      example:
        value:
          version: 1
          resource:
            resourceLocation: WORKSPACE
            path: /clinical/workspaces/testfad60fd1-9293-41ef-9a8e-4ae0118c078b.cjob
            workspace:
          description: Updated clinical job with programs and parameters.
          logsLocation: ./
          resultsLocation: ./
          manifestLocation: ./
          owner: test1
          runAsOwner: false
          programs:
          - path: ../programs/Test_0.sas
            version: "1.1"
          - path: ../programs/Test_1.sas
            version: "-"
          - path: ../programs/Test_2.sas
            version: "-"
          - path: ../programs/Test_3.sas
            version: "-"
          parameters:
          - name: char_param
            label: character-parameter
            type: CHARACTER
            defaultValue:
              value: "This is a test"
          - name: char_param_masked
            label: character-parameter-mask
            type: CHARACTER_MASKED
            defaultValue:
              value: "*****"
          - name: file_param
            label: file-parameter2
            type: FILE
            defaultValue:
              path: /test/Demo/inputs/input.sas7bdat
          - name: folder_param
            label: folder-parameter3
            type: FOLDER
            defaultValue:
              path: ../Demo
              includeSubfolders: false
          - name: numeric_param
            label: numeric-parameter4
            type: NUMERIC
            defaultValue:
              value: 999
          - name: date_param
            label: date-parameter5
            type: DATE
            defaultValue:
              value: 2023-12-15T05:00:00Z
          publishSetup:
            files: []
            folders: []
          publishCheckin:
            enableVersioningOnNewFiles: false
            fileVersion: "MINOR"
            locations: []
    clinicalJobSubmissionSummaryCollection:
      title: Clinical Job Submission Summary Collection
      description: Provides a paginated collection of clinical job submission summaries.
      allOf:
      - $ref: "#/components/schemas/baseCollection2"
      - type: object
