    clinicalSchedule:
      title: 'Clinical Job Schedule'
      description: >
        Clinical job schedule represents a single schedule of a clinical workspace
        or repository job.
      properties:
        version:
          description: 'The version of the representation. This is version 1.'
          type: 'number'
        id:
          description: 'Identifier for the clinical job schedule.'
          type: 'string'
        typeId:
          description: 'Type of the clinical job schedule.'
          type: 'string'
        name:
          description: 'Name of the clinical job schedule.'
          type: 'string'
        description:
          description: 'Description of the clinical job schedule.'
          type: 'string'
        runAs:
          description: 'The clinical job schedule is to be run as this specified user,
            who is the owner of the clinical job schedule.'
          type: 'string'
        runAsDisplayName:
          description: 'The display name for the user who owns the clinical job schedule
            and who the clinical job schedule is run as.'
          type: 'string'
        status:
          description: 'The status of the clinical job schedule.'
          type: 'string'
          enum:
          - 'ENABLED'
          - 'DISABLED'
        jobAvailable:
          description: 'Indicates whether the associated clinical job is available
            to the current user. A false value can mean the clinical job no longer
            exists or that the user does not have access to the item.'
          type: 'boolean'
        jobInfo:
          $ref: "#/components/schemas/clinicalJobRunInfo"
        trigger:
          $ref: "#/components/schemas/clinicalTrigger"
