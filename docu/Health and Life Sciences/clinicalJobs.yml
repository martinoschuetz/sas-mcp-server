              id: d6eefec9-dcc2-4574-8af8-69897038d9c5
              fileVersion: "2.0"
          limit: 2
          version: 2
    clinicalJobSubmissionSummary:
      title: Clinical Job Submission Summary
      description: >
        Clinical job submission represents a single submission of a clinical workspace
        or
        repository job.
      properties:
        version:
          description: The version of the representation. This is version 1.
          type: number
        id:
          description: Identifier for the clinical job submission.
          type: string
        type:
          description: Type of clinical job submission, which can be Workspace or
            Repository
          type: string
        runContext:
          description: Run context for the clinical job submission.
          type: string
          enum:
          - INTERACTIVE
        name:
          description: Name of the clinical job that was submitted.
          type: string
        job:
          type: object
          properties:
            version:
              description: The version of the representation. This is version 1.
              type: number
            name:
              type: string
              description: The name of the item.
            path:
              type: string
              description: The path of the item.
            location:
              type: string
              description: The location of the item. This is the parent container
                path of this item.
            resourceLocation:
              description: The resource location of the item.
              type: string
              enum:
              - REPOSITORY
              - WORKSPACE
        jobOwner:
          description: User who owns the clinical job file in the repository.
          type: string
        jobOwnerDisplayName:
          description: Display name for the clinical job owner in the repository.
          type: string
        runAsUser:
          description: User context for the clinical job submission. The user is the
            owner of the clinical job in the repository when the clinical job is marked
            to be run as the clinical job owner.
          type: string
        runAsUserDisplayName:
          description: Display name for the user context used for the clinical job
            submission.
          type: string
        jobRunAsOwner:
          description: Indicates whether the clinical job in the repository has been
            marked to be run as owner.
          type: boolean
        info:
          description: Provides additional information about the clinical job submission
            status.
          type: string
        lastSubmittedItem:
          description: Last submitted program name.
          type: string
        completedTimeStamp:
          type: string
          format: date-time
          description: The date and time the clinical job submission was completed.
        submittedTimeStamp:
          type: string
          format: date-time
          description: The date and time the clinical job submission was submitted.
        submittedBy:
          description: User who submitted clinical job.
          type: string
        submittedByDisplayName:
          description: Display name for the user who submitted the clinical job.
          type: string
        state:
          x-sas-internal: true
          type: string
          description: The current state of the clinical job submission.
          enum:
          - NOT_STARTED
          - STARTED
          - RUNNING_TASKS
          - CANCELING
          - POST_EXECUTION_PUBLISHING
          - COMPLETED_SUCCESSFUL
          - COMPLETED_PROGRAM_ERRORS
          - COMPLETED_CHECKIN_ERROR
          - COMPLETED_PROGRAM_ERRORS_CHECKIN_ERROR
          - COMPLETED_FAILED
          - COMPLETED_CANCELED
          - COMPLETED_PROGRAM_WARNINGS
          - COMPLETED_PROGRAM_WARNINGS_CHECKIN_ERROR
      example:
        value:
          version: 1
          state: COMPLETED_SUCCESSFUL
          id: b2913000-58fc-4153-91c7-655dc4f675df
          name: Test.cjob
          jobRunContext: INTERACTIVE
          submittedTimeStamp: 2024-05-03T14:04:19.181000Z
          submittedBy: test1
          submittedByDisplayName: " Test User (test1)"
          completedTimeStamp: 2024-05-03T14:04:29.827000Z
          info: Job completed successfully.
          runAsUser: test1
          runAsUserDisplayName: " Test User (test1)"
          jobName: Test.cjob
          jobPath: /demo/Test.cjob
          jobLocation: /demo
          jobResourceLocation: WORKSPACE
          jobOwner: test1
          jobOwnerDisplayName: " Test User (test1)"
          jobRunAsOwner: false
          lastSubmittedItem: Prog2.sas
          type: WORKSPACE
          manifest:
            name: Test.cmnf
            path: /demo/Test.cmnf
            resourceLocation: WORKSPACE
