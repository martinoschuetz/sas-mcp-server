          - 'HOURLY'
          - 'DAILY'
          - 'WEEKLY'
          - 'MONTHLY'
          - 'YEARLY'
          - 'DATELIST'
        start:
          description: 'The date to start the clinical job schedule. The date must
            be formatted as YYYY-MM-DD.'
          type: 'string'
        end:
          description: 'The date to end the clinical job schedule. The date must be
            formatted as YYYY-MM-DD.'
          type: 'string'
        timeZone:
          description: 'The ID for the time zone for the clinical job schedule run
            dates. If no value is provided, the time zone on the request is used.'
          type: 'string'
        numOccurrences:
          description: 'The number of times the clinical job schedule is to run.'
          type: 'number'
        interval:
          description: 'The number of time units between each schedule run.'
          type: 'number'
        dayOfMonth:
          description: 'The day of the month to run the schedule.'
          type: 'number'
        daysOfWeek:
          description: 'The days of the week to run the schedule.'
          type: 'array'
          items:
            type: 'string'
            enum:
            - 'SUN'
            - 'MON'
            - 'TUE'
            - 'WED'
            - 'THU'
            - 'FRI'
            - 'SAT'
        minutes:
          description: 'The minute to run the schedule. If specified, this value must
            be between 0 and 59.'
          type: 'string'
        hours:
          description: 'The hour to run the schedule. If specified, this value must
            be between 0 and 23.'
          type: 'string'
        dates:
          description: 'The specific dates to run the schedule. Each date must be
            formatted as YYYY-MM-DD.'
          type: 'array'
          items:
            type: 'string'
        occurrence:
          description: 'Ordinal value to run the schedule.'
          type: 'string'
          enum:
          - 'FIRST'
          - 'SECOND'
          - 'THIRD'
          - 'FOURTH'
          - 'LAST'
        monthOfYear:
          description: 'The month of the year.'
          type: 'string'
          enum:
          - 'JANUARY'
          - 'FEBRUARY'
          - 'MARCH'
          - 'APRIL'
          - 'MAY'
          - 'JUNE'
          - 'JULY'
          - 'AUGUST'
          - 'SEPTEMBER'
          - 'OCTOBER'
          - 'NOVEMBER'
          - 'DECEMBER'
    baseCollection2:
      title: Base Collection
      description: This is a base schema used to define paginated collections of resources.
        This base schema is extended by other schemas in APIs by adding an 'items'
        array property. These extensions define the application/vnd.sas.collection
        media type (version 2)
      properties:
        name:
          type: string
          description: The name of the collection.
        start:
          type: integer
          description: The zero-based index of the first item in the collection.
          format: int64
        limit:
          type: integer
          description: The number of items that were requested for the collection.
        count:
          type: integer
          description: If populated indicates the number of items in the collection.
          format: int64
        accept:
          type: string
          description: A space-delimited list of media types from which an `Accept`
            header may be constructed.
        links:
          type: array
          description: The links that apply to the collection.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the collection representation. This representation
            is version 2.
    api:
      title: API
      description: The list of links to top-level resources and operations available
        from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
      - version
      - links
      properties:
        version:
          type: integer
          description: The version number of the API representation. This is version
            1.
          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
      - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type
            or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`,
            `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body
            for a `PUT`, `POST`, or `PATCH` operation.
  examples:
    apiResponse:
      summary: Links to the API resources
      description: The list of links to top-level resources and operations available
        from the root service.
      value:
        version: 1
        links:
        - method: POST
          rel: createClinicalJob
          href: "/clinicalJobs/definitions"
          uri: "/clinicalJobs/definitions"
          responseType: application/vnd.sas.clinical.job+json
          itemType: application/vnd.sas.clinical.job+json
        - method: POST
          rel: submitClinicalJob
          href: "/clinicalJobs/submissions"
          uri: "/clinicalJobs/submissions"
          responseType: application/vnd.sas.clinical.job.submission+json
          itemType: application/vnd.sas.clinical.job.run.info+json
        - method: GET
          rel: clinicalJobSubmissionSummaries
          href: "/clinicalJobs/submissions"
          uri: "/clinicalJobs/submissions"
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.clinical.job.submission.summary+json
        - method: GET
          rel: clinicalJobSubmission
          href: "/clinicalJobs/submissions/{submissionId}"
          uri: "/clinicalJobs/submissions/{submissionId}"
          itemType: application/vnd.sas.clinical.job.submission+json
        - method: GET
          rel: schedules
          href: "/clinicalJobs/schedules"
          uri: "/clinicalJobs/schedules"
          type: application/vnd.sas.collection
          itemType: application/vnd.sas.clinical.job.schedule+json
