<style>
  #rows { max-height: 480px; }
  td.tree { white-space: nowrap; }
  td.tree .indent { display: inline-block; width: 14px; }
  td.tree .branch { color: var(--ink-2); margin-right: 4px; }
  #failures td.err { color: var(--bad); white-space: normal; max-width: 520px; }
  :root[data-display="fullscreen"] #failures { max-height: 40vh; }
</style>
<div id="root">
  <div class="head">
    <div>
      <h1 id="title">Glossary import</h1>
      <div id="meta" class="small muted"></div>
    </div>
    <div class="row" id="counts"></div>
  </div>
  <div id="banner" class="banner" hidden></div>
  <div class="toolbar" id="actions" hidden>
    <button id="run" class="primary" type="button">Import</button>
    <label class="small"><input id="update-existing" type="checkbox"> Overwrite terms that already exist at the same path</label>
  </div>
  <div id="rows" class="scroll fill"><div class="empty">Waiting for the import…</div></div>
  <div id="failures" class="scroll" hidden style="margin-top:8px"></div>
</div>
<script type="module">
  const { el, fmt } = sas;
  const $ = (id) => document.getElementById(id);
  const state = { args: {}, preview: null };

  // The import CSV's own system columns. Anything else in `columns` is a
  // custom attribute — Definition is one of these and not an attribute, which
  // is exactly the confusion that put every imported definition in the wrong
  // field before v1.14.0.
  const SYSTEM_COLUMNS = ["Name", "Type", "Path", "Definition", "Description", "Requirements", "Status"];

  function depth(path) { return path ? String(path).split("\\").length : 0; }

  function renderPreview(data) {
    state.preview = data;
    const rows = data.rows || [];
    const attrCols = (data.columns || []).filter((c) => !SYSTEM_COLUMNS.includes(c));
    $("title").textContent = `Preview: ${fmt.int(rows.length)} term${rows.length === 1 ? "" : "s"} to import`;
    $("meta").textContent = data.note || "Nothing has been imported yet.";
    $("counts").replaceChildren(
      el("span", { class: "pill" }, `${fmt.int(rows.length)} rows`),
      el("span", { class: "pill" }, `${fmt.int(new Set(rows.map((r) => r.term_type)).size)} type(s)`),
      el("span", { class: "pill" }, `${fmt.int(Math.max(0, ...rows.map((r) => depth(r.path)))) + 1} level(s)`),
    );
    $("run").textContent = `Import ${fmt.int(rows.length)} term${rows.length === 1 ? "" : "s"}`;
    $("update-existing").checked = !!state.args.update_existing;
    $("actions").hidden = false;
    $("failures").hidden = true;
    const head = el("tr", {}, el("th", {}, "#"), el("th", {}, "Name"), el("th", {}, "Type"), el("th", {}, "Parent path"), el("th", {}, "Definition"), el("th", {}, "Description"), ...attrCols.map((c) => el("th", {}, c)));
    const body = el("tbody", {}, ...rows.map((r, i) => {
      const d = depth(r.path);
      return el("tr", {},
        el("td", { class: "idx" }, String(i + 1)),
        el("td", { class: "tree" }, ...Array.from({ length: d }, () => el("span", { class: "indent" })), d ? el("span", { class: "branch" }, "└") : null, r.name),
        el("td", {}, r.term_type || ""),
        el("td", { class: "mono muted", title: r.path || "" }, r.path || "—"),
        // An empty definition is worth seeing: the importer fills the field in
        // with the term's own name rather than leaving it blank.
        el("td", { class: r.definition ? "" : "null", title: r.definition || "" }, r.definition || "— will read as the term's name"),
        el("td", { title: r.description || "" }, r.description || ""),
        ...attrCols.map((c) => { const v = (r.attributes || {})[c]; return el("td", { class: v == null || v === "" ? "null" : "" }, v == null || v === "" ? "—" : Array.isArray(v) ? v.join(", ") : String(v)); }),
      );
    }));
    $("rows").replaceChildren(el("table", { class: "grid" }, el("thead", {}, head), body));
  }

  function renderOutcome(data) {
    const failures = data.failures || [];
    // `terms` is the per-row resolution: which term each row became, and
    // whether it was already there. The job itself counts a row it left
    // untouched as "successful", so without this every row reads as created.
    const terms = data.terms || [];
    const byName = new Map(terms.map((t) => [t.name, t]));
    const resolved = terms.some((t) => t.term_id);
    $("title").textContent = failures.length ? "Import finished with failures" : "Import finished";
    $("meta").textContent = data.note || (data.job_id ? `Job ${data.job_id}` : "");
    const existed = data.already_existed ?? 0;
    $("counts").replaceChildren(
      el("span", { class: "pill" }, `${fmt.int(data.requested ?? 0)} requested`),
      // `new` is what was actually created; `created` counts rows the job
      // accepted, which includes the ones it left alone.
      el("span", { class: `pill ${data.new ? "ok" : ""}` }, `${fmt.int(data.new ?? data.created ?? 0)} new`),
      existed ? el("span", { class: "pill warn" }, `${fmt.int(existed)} already existed`) : null,
      el("span", { class: `pill ${failures.length ? "bad" : ""}` }, `${fmt.int(data.failed ?? failures.length)} failed`),
    );
    $("actions").hidden = true;
    const order = data.order || [];
    $("rows").replaceChildren(el("table", { class: "grid" },
      el("thead", {}, el("tr", {}, el("th", {}, "#"), el("th", {}, "Term"), el("th", {}, "Outcome"), resolved ? el("th", {}, "Term id") : null)),
      el("tbody", {}, ...order.map((name, i) => {
        const failure = failures.find((f) => f.term === name || f.row === i + 2 || f.row === i + 1);
        const term = byName.get(name);
        const outcome = failure
          ? el("span", { class: "pill bad" }, "failed")
          : term?.existed
            ? el("span", { class: "pill warn", title: state.args.update_existing ? "Replaced with this row" : "Left untouched" }, "already existed")
            : el("span", { class: "pill ok" }, "created");
        return el("tr", {},
          el("td", { class: "idx" }, String(i + 1)),
          el("td", {}, name),
          el("td", {}, outcome),
          resolved ? el("td", { class: term?.term_id ? "mono" : "null", title: term?.term_id || "" }, term?.term_id || "—") : null,
        );
      })),
    ));
    if (failures.length) {
      $("failures").hidden = false;
      $("failures").replaceChildren(el("table", { class: "grid" },
        el("thead", {}, el("tr", {}, el("th", {}, "Row"), el("th", {}, "Term"), el("th", {}, "Reason"))),
        el("tbody", {}, ...failures.map((f) => el("tr", {}, el("td", { class: "idx" }, f.row == null ? "" : String(f.row)), el("td", {}, f.term || ""), el("td", { class: "err" }, f.error || "")))),
      ));
    }
  }

  $("run").addEventListener("click", async () => {
    const rows = state.preview?.rows?.length || 0;
    sas.busy(true);
    sas.banner(`Importing ${rows} term(s)… this runs as a job and can take a moment.`, "");
    try {
      state.args = { ...state.args, update_existing: $("update-existing").checked };
      const result = await sas.call(sas.tool, { ...state.args, dry_run: false });
      sas.busy(false);
      // "created" counts rows the job accepted; "new" counts the terms that
      // did not exist before. Reporting the first as the second is what made a
      // re-import of an unchanged hierarchy claim it had rebuilt the lot.
      const made = result.new ?? result.created ?? 0;
      const existed = result.already_existed ?? 0;
      const also = existed ? `, ${existed} already existed` : "";
      sas.banner(result.failed ? `${made} created${also}, ${result.failed} failed — see the reasons below.` : `${made} term(s) created${also}.`, result.failed ? "warn" : "ok");
      renderOutcome(result);
      await sas.say(`Ran the glossary import from the preview: ${made} created${also}, ${result.failed} failed${result.job_id ? ` (job ${result.job_id})` : ""}.`);
    } catch (err) {
      sas.busy(false);
      sas.banner(`The import did not run: ${sas.errorText(err)}`, "bad");
    }
  });

  sas.onInput((args) => { state.args = { ...args }; });
  sas.onResult((data) => {
    sas.busy(false);
    if (!data || typeof data !== "object") { sas.banner(String(data ?? "No result."), "bad"); return; }
    sas.banner("");
    if (data.dry_run) renderPreview(data); else renderOutcome(data);
  });
</script>
